f antitrust law."}, {"id": 50665257, "au": "ZeroGravitas", "dom": 22, "sr": 69, "sc": 3.74, "ep": 4.02, "bs": 0.0, "d": 2, "age": 4.56, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 31224, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "There's also recent research on chatbots regarding climate misinformation that while they will initially present the broadly accepted facts, they will fold under slight pressure to sycophanticaly agree with the users viewpoint, which they can infer from chat history as well as the present interaction."}, {"id": 50659147, "au": "knowknow", "dom": 348, "sr": 70, "sc": 3.74, "ep": 3.98, "bs": 0.0, "d": 0, "age": 18.98, "grav": 239.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 321, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.308, "fa": 0.0, "gp": 0.627, "bl": 0.0, "ds": 0.0, "txt": "After reading some of the files, I'm starting to realize people are talking about this in generalities because \"scary USAID is trying to influence other countries\" is much better at fear mongering than USAID was trying to understand disinformation in other countries and in some extreme cases (calls for violence) asked for things to be removed."}, {"id": 50659236, "au": "abirch", "dom": 263, "sr": 71, "sc": 3.74, "ep": 3.97, "bs": 0.0, "d": 2, "age": 18.87, "grav": 237.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 2216, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": ["https://en.wikipedia.org/wiki/Belt_and_Road_Initiative"], "ig": 0.525, "fa": 0.62, "gp": 0.665, "bl": 0.0, "ds": 0.0, "txt": "Sure there's a thing called soft power. It's the exact reason that China has https://en.wikipedia.org/wiki/Belt_and_Road_Initiative\n\nIf an African nation has a resource that America wants, it could threaten to cut off the HIV/AIDS program or other aid. Now the USA has lost that tool."}, {"id": 50664544, "au": "chasing", "dom": 5, "sr": 72, "sc": 3.74, "ep": 3.95, "bs": 0.0, "d": 3, "age": 6.16, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 9143, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.17, "fa": 0.28, "gp": 0.279, "bl": 0.0, "ds": 0.0, "txt": "Impact of USAID on the average US taxpayer as supported by evidence and high quality empirical studies, using only reputable studies by people who have both no information and no opinion whatsoever about USAID.\n\nToo many people see evidence that USAID did something good and they're, like, \"USAID did something good\" and I simply can't have that kind of partisan hackery in my AI responses."}, {"id": 50659250, "au": "hackyhacky", "dom": 286, "sr": 73, "sc": 3.74, "ep": 3.83, "bs": 0.0, "d": 2, "age": 18.86, "grav": 237.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 4884, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.464, "fa": 0.0, "gp": 0.268, "bl": 0.0, "ds": 0.0, "txt": "Paying for stuff that's good was never the purpose of USAID. The purpose was to enhance US soft power abroad. International influence can be bought cheap by supporting good causes. At least until the current administration decided to throw all that, and the US's reputation among its allies, in the trash."}, {"id": 50662359, "au": "avs733", "dom": 68, "sr": 74, "sc": 3.74, "ep": 3.82, "bs": 0.0, "d": 1, "age": 11.81, "grav": 112.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5631, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.388, "fa": 0.56, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "You have the logic of this backwards.\n\nThere is no good faith effort here to do “thing is evidence of bad therefore source of evidence is bad”\n\nThis is “source of evidence is bad therefore thing is bad which is evidence of bad”"}, {"id": 50667626, "au": "mapontosevenths", "dom": 319, "sr": 75, "sc": 3.74, "ep": 3.79, "bs": 0.0, "d": 4, "age": 0.23, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.615, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The free speech in question here were lies about the election and lies about vaccines that were, and probably still are, killing people. See the recent return of measles for further proof.\n\nYour rights end where other peoples rights begin, and the right to speech is secondary to the right to be safe in your person and belongings. That's why the door to door Vacuum cleaner salesman is allowed, but a conman who steals your grannies pension isn't. Both are just 'talking', but one has nefarious intentions.\n\nYou can make a fist all you want, you just can't shove it into the space occupied by a strangers face."}, {"id": 50664844, "au": "sharpshadow", "dom": 14, "sr": 76, "sc": 3.74, "ep": 3.77, "bs": 0.0, "d": 1, "age": 5.46, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1722, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.239, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "That’s right good prompt indeed “USAID was a major funder of EcoHealth Alliance under its PREDICT program (part of the Emerging Pandemic Threats initiative)” the rest is history."}, {"id": 50663285, "au": "Frondo", "dom": 161, "sr": 77, "sc": 3.74, "ep": 3.77, "bs": 0.0, "d": 3, "age": 9.19, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 4245, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.499, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "Yeah, once upon a time Americans took seriously their claims that the US is the greatest country on earth, and with that the responsibility that we might have to the rest of the world, being as wealthy as we, on paper, are.\n\nAfter a few decades of neoliberalism turning the screws, though, we've become very small-minded and greedy; I was still a little shocked seeing all the comments in this very thread going on about \"wouldn't americans feel better if they spent that money at home?\"; as if we haven't dropped more than the USAID budget on a brand new war just this year, one that has advanced none of our (as a nation) interests.\n\nIt is unhinged."}, {"id": 50662110, "au": "simplesocieties", "dom": 220, "sr": 78, "sc": 3.72, "ep": 3.72, "bs": 0.0, "d": 4, "age": 12.52, "grav": 123.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 93, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.361, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "If you, as a nation state, are financially capable of providing food and medicine to other countries in need, it's not about \"morals\" and \"feel good charity\". It's about preventing a flood of refugees or virally sick people from knocking on your borders and your allies' borders.\n\nYou don't get the privilege of being a world superpower without the responsibility, and it's clear the populists don't grasp that bargain, and naturally Pax Americana is fading because of it.\n\nIn your world view, why open embassies? Why let people in and out of the country at all? Just put up a big electric fence, shut down airports, and redistribute all the money to everyone. Oh happy days, everything has been solved!"}, {"id": 50663342, "au": "howunfortunate", "dom": 223, "sr": 79, "sc": 3.67, "ep": 3.67, "bs": 0.0, "d": 7, "age": 9.03, "grav": 75.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.534, "fa": 0.0, "gp": 0.045, "bl": 0.0, "ds": 0.0, "txt": "No, I'm agnostic with regard to outcomes.\n\nMy qualm is with using violent coercion to extract resources and spend them without democratic oversight, not only but especially when that spending explicitly has no benefit to any taxpayer or even any citizen.\n\nTaxes are a necessary evil that should be leveraged only where truly necessary; USAID is a clear abuse of that social contract."}, {"id": 50664463, "au": "ZeroGravitas", "dom": 357, "sr": 80, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 0, "age": 6.35, "grav": 45.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 31224, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.456, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "Elon Musk, one of the biggest defence contractors and one of the biggest shareholders in the Trump regime claimed that it was a front for US Intelligence and then \"fed it to the woodchipper\".\n\nWhat exactly was USAID doing that frightened the oligarchs so much?\n\nReads site... oh fighting disinformation on social media. Well that explains that."}, {"id": 50667450, "au": "throwaway5752", "dom": 330, "sr": 81, "sc": 3.6, "ep": 3.6, "bs": 0.0, "d": 0, "age": 0.5, "grav": 5.2, "surf": 46.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 11272, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.2, "bl": 0.0, "ds": 0.0, "txt": "If you think USAID is sketchy, try to figure out who runs, writes for, or funds Reclaim the Net.\n\nIf you think for even more than a minute about the problem, there's no reason this would be out on the internet. There's been no USAID news recently.\n\nThe only thing notable about it is that the current administration and a prominent tech CEO destroyed the organization, and that the legislative branch can no longer protect them from investigations.\n\nThere is almost a whiff of panic to this."}, {"id": 50659092, "au": "yks", "dom": 311, "sr": 82, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 1, "age": 19.06, "grav": 241.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1329, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.261, "bl": 0.0, "ds": 0.0, "txt": "Same as the “Twitter files” - for the love of God I couldn’t figure out the issues and problems they were implying, but in the best Russian propaganda style it was used as a banner of “Democrats are corrupt”, the takeaway from which appeared to be to install this abomination of grift we have today as The King."}, {"id": 50661864, "au": "johnnyanmac", "dom": 135, "sr": 83, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 5, "age": 13.28, "grav": 135.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.505, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "John Green did a recent video on (lower-case) effective altruism, and a small tidbit of stats he brought up included the fact that, pound-for-pound, lower-income people are slightly more generous in terms of donations/charity than the \"millionaire\" class (the subject of the video).\n\nFundamentally, being approximate to suffering empathizes you, and millionaires (for a myriad of reasons) tend to group together instead of living within that suffering. Hence the difference in donations."}, {"id": 50663781, "au": "matheusmoreira", "dom": 345, "sr": 84, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 2, "age": 7.93, "grav": 62.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 29635, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.477, "fa": 0.0, "gp": 0.041, "bl": 0.0, "ds": 0.0, "txt": "For some definition of \"left wing\", I suppose.\n\nHe won this election, then immediately started cutting government spending and is about to put a banker in charge of the economy -- the exact opposite of what the people who voted for him wanted.\n\nThis has caused some kind of rift in the left. I've even seen calls for protests by people who voted for him. They of course were dubbed the \"extreme left\", and I have no doubt they'll be politically persecuted."}, {"id": 50661439, "au": "ETH_start", "dom": 312, "sr": 85, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 2, "age": 14.46, "grav": 154.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 656, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.492, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Twitter file showed that numerous prominent people who went against official narratives were being silently blacklisted or de-amplified. It showed that an organization with many ties to U.S. government bodies was labeling thousands of people Russians when Twitter's own employees disagreed with them. These people were de-platformed anyway."}, {"id": 50661899, "au": "FabHK", "dom": 143, "sr": 86, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 4, "age": 13.18, "grav": 133.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 15980, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.03, "fa": 0.34, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "What a poor country you must be living in. When I'd ask my friends and neighbours whether they wanted a tiny part of their taxes (less than 1%) go to prevent and alleviate the worst suffering and catastrophes globally, in much poorer countries, I think they'd happily say yes."}, {"id": 50662832, "au": "iJohnDoe", "dom": 67, "sr": 87, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 1, "age": 10.49, "grav": 94.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 19, "k": 1084, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.419, "fa": 0.42, "gp": 0.868, "bl": 0.0, "ds": 0.0, "txt": "> If only someone stopped to ask \"Will this look bad if it's on the front page of a major newspaper?\"\n\nIf the purpose is preventing bad behavior and helping people make better judgment calls, then yes, the whole world should operate that way.\n\nIf it’s simply for covering things up, then no."}, {"id": 50662170, "au": "tensor", "dom": 339, "sr": 88, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 1, "age": 12.33, "grav": 120.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 7464, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "Promoting freedom and democracy could influence those elections to move left, its true. Not the same as \"stealing\" them though. I feel like openly advocating for your position is pretty fair game.\n\nDoing it via lies, misinformaiton, and other tactics, on the other hand, is bad."}, {"id": 50661623, "au": "hsuduebc2", "dom": 207, "sr": 89, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 4, "age": 13.95, "grav": 146.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1068, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.454, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's generally understood that USAID was one of the instruments through which the US exercised influence over other countries, a form of soft power. I don't find that particularly shocking or controversial. Trump simply squandered that influence, apparently under the impression that being the loudest idiot in the room is an adequate substitute for diplomacy."}, {"id": 50663465, "au": "phs318u", "dom": 57, "sr": 90, "sc": 3.41, "ep": 3.41, "bs": 0.0, "d": 6, "age": 8.69, "grav": 71.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 4677, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.398, "fa": 0.0, "gp": 0.087, "bl": 0.0, "ds": 0.0, "txt": "In most corners of corporate land, we are reminded that it’s not enough to merely do the right thing, we must be perceived as doing the right thing and not doing the wrong thing. In many cases, the perception is rated higher than the doing. Governments and corporations have both fallen as a result of perceptions even when those perceptions may be misplaced or based on a misunderstanding or lack of context. The pandemic provided us with endless examples of this phenomenon."}, {"id": 50659241, "au": "ajross", "dom": 249, "sr": 91, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 2, "age": 18.87, "grav": 237.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 35167, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.381, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Is stem cell therapy really the only option for cancer treatment?  Are air bags really the only option for car safety?\n\nThis argument you're applying is \"Perfection is the enemy of good\", and in practice it's a smell.  It's virtually always used not by proponents of the root problem being discussed is (HIV education/treatment assistance here) but by opponents of whatever the specific solution mentioned was (USAID).\n\nBasically it's sort of a nonsequitur.  Yes, it's possible there were better options in hindsight, there always are.  That doesn't remotely refute the idea that USAID Did Good Stuff."}, {"id": 50662400, "au": "kenjackson", "dom": 255, "sr": 92, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 2, "age": 11.71, "grav": 111.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 14, "k": 22096, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.917, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> But there's nothing particular virtuous about voting to donate money from someone else's pockets.\n\nIn fairness, that's pretty much everything the government spends money on.  If it were up to me, we wouldn't have spent a cent fighting in Iran, but someone else voted to spend my money there.  If I could retract every cent coming from me to ICE right now, I'd do it.  Again, someone else is spending my money. But I also get this is the system that we have.  Whoever is in power decides where the money goes."}, {"id": 50659575, "au": "ande-mnoc", "dom": 259, "sr": 93, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 1, "age": 18.4, "grav": 227.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 321, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "Even Al Capone ran a soup kitchen during the Great Depression to keep the public opinion on their side. It’s a good business decision to make charity as your main public image."}, {"id": 50662291, "au": "brandonagr2", "dom": 302, "sr": 94, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 2, "age": 12.01, "grav": 115.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 82, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.475, "fa": 0.5, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Can you point to any evidence showing an actual rise of millions dead in global mortality stats? Surely by now if what you claim is plausible we could see some evidence instead of just made up numbers"}, {"id": 50661752, "au": "macintux", "dom": 281, "sr": 95, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 4, "age": 13.61, "grav": 140.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 18775, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.376, "fa": 0.0, "gp": 0.062, "bl": 0.0, "ds": 0.0, "txt": "Shutting down USAID might have been a reasonable thing to do if it was a managed process that gave other governments and NGOs time to prepare, find other funding, and ameliorate the impact.\n\nAbruptly blowing up the building helped no one and did tremendous damage to both needy recipients and perception of the U.S. abroad."}, {"id": 50662887, "au": "protocolture", "dom": 170, "sr": 96, "sc": 3.31, "ep": 3.31, "bs": 0.0, "d": 2, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 26, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.843, "fa": 0.42, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": ">US taxpayers paid for it, including people who are scraping by. Telling them they're unhinged for wanting to keep more of their money is cruel.\n\nDid a single US taxpayer keep more money because of USAID cuts?\n\nOr is the whole thing that magic funny money the US gets to invent because of the privilège exorbitant?"}, {"id": 50660453, "au": "asveikau", "dom": 168, "sr": 97, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 2, "age": 16.81, "grav": 196.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "Less HIV around the world helps every single human, even if indirectly.  Hope this helps.\n\nThis is the problem with right wingers and libertarian-style mindset.  You think you are not part of humanity.  You get overly concerned with \"my money\" and \"them\", that you don't realize that you are them, or the benefit of optimization for the species as a whole."}, {"id": 50662067, "au": "altcognito", "dom": 115, "sr": 98, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 4, "age": 12.66, "grav": 125.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 2892, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "No. The only thing that matters is how the legislative branch laid it out to be spent. If you don't like it, or have your own personal judgement that the legislative branch made a bad choice, get them unelected.\n\nYou don't get to spend billions on elections, show up with a technical team of your own, and dismantle an agency that you don't like for whatever reasons.\n\nHe did the elections thing, but then they ignored the way that congress laid it out. You can get into the gory details about how congress should then of course do something about that, but at this point, you've already acknowledged that they are ignoring the constitution, we're just hoping somebody actually enforces it."}, {"id": 50661768, "au": "runarberg", "dom": 208, "sr": 99, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 5, "age": 13.59, "grav": 140.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 5445, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.372, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "USA being a country that interferes in foreign countries is in and of it self not shocking simply because it is a known and accepted reality. It is however controversial. Other countries do not interfere in foreign countries like the USA does, nor should they, and nor should USA be interfering in democratic elections of other countries. Accepting this pattern of interference is a form of American exceptionalism."}, {"id": 50662771, "au": "alexandre_m", "dom": 314, "sr": 100, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 4, "age": 10.75, "grav": 97.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 458, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.37, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It clearly demonstrated close coordination with government agencies and political bias.\n\nThe files confirmed the use of shadowbanning, contradicting public statements by Twitter execs denying its use for political reasons, among other things."}, {"id": 50661487, "au": "ETH_start", "dom": 316, "sr": 101, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 1, "age": 14.37, "grav": 153.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 656, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It shows that USAID was heavily involved in promoting censorship in other countries under the guise of fighting disinformation.\n\nIn this context, it engaged with organizations like the Global Disinformation Index (GDI), for instruction on how to flag, remove and demonetize content."}, {"id": 50663058, "au": "mpyne", "dom": 48, "sr": 102, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 6, "age": 9.82, "grav": 85.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 200, "qw": 0, "k": 8377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.926, "fa": 0.28, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "The lead azide hullabaloo from this very week is all you need to see to know why government workers want to ensure that engagement with the public is done deliberately.\n\nYou would have thought the Army was blowing up a dirty bomb in the middle of the country, and the reality was quite different.\n\nNo member of the public has the time to be an expert on literally everything the U.S. government has got going on, and even most journalists are now broadly out of their depth when writing up stories.\n\nAnd this isn’t even going into normal bureaucratic minutiae. Yes, a poorly-worded email can absolutely cause huge problems for an office even if it never leaks to the media and even if it is completely innocuous, just from the bureaucratic infighting that could result.  A poorly-worded reference to a foreign nation (e.g. instead of “peer competitor”) can needlessly cause a diplomatic incident in ways that can have real biteback for the U.S. and Americans who travel abroad.\n\nSo no, asking your staff to stay on message, both internally and externally, is not by itself evidence of anything nefarious. Indeed, it’s indistinguishable from proper office work. You’d need to know more to know whether there’s actually an issue."}, {"id": 50664011, "au": "moconnor", "dom": 41, "sr": 103, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 1, "age": 7.31, "grav": 55.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3686, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.99, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "“Don’t write things down you wouldn’t want to see printed in a newspaper” is the kind of routine advice corporate lawyers give out all the time. It’s not unique to USAID and doesn’t suggest anything nefarious to me."}, {"id": 50664548, "au": "AndyMcConachie", "dom": 29, "sr": 104, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 1, "age": 6.15, "grav": 43.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 2884, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.209, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "US empire does not benefit US tax payers nor is it intended to. I don't need a chatbot to tell me that. USAID paying for influence in foreign media does not benefit US taxpayers.\n\nMaybe USAID did some other stuff that does benefit US taxpayers, but it's purely a coincidence. That's not their purpose."}, {"id": 50662021, "au": "15155", "dom": 180, "sr": 105, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 9, "age": 12.82, "grav": 128.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.319, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem with socialism is that you eventually run out of other people's money. This is a niche disease that is understood, largely preventable in America.\n\nThe idea that we need to spend unlimited funds on other countries is absurd. You are free to donate, but don't act like this is a well-reasoned cost-benefit analysis."}, {"id": 50664436, "au": "esperent", "dom": 4, "sr": 106, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 2, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 9759, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 0.979, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Impact of USAID on the average US taxpayer as supported by evidence and high quality empirical studies, using only reputable studies that are not funded or conducted either by USAID itself or by other entities with a vested interest in proving it looks either good or bad.\n\nTry that."}, {"id": 50667768, "au": "ethbr1", "dom": 16, "sr": 107, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 15919, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.295, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The 'COVID was intentionally (or unintentionally) leaked from a Chinese lab partially funded by US international aid into zoonotic viruses' takes a lot of wild assumptions to look at as a conspiracy.\n\nIf parent wanted to opine on whether or not zoonotic research is a net positive thing to be doing or not, fine. Personally, I'm in favor of it: the more you know. Yet there are certainly risks.\n\nBut to just lazily gesture at a line item of funding and insinuate there's anything malicious about it is crazy."}, {"id": 50659143, "au": "mapontosevenths", "dom": 322, "sr": 108, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 1, "age": 18.98, "grav": 239.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.137, "fa": 0.0, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "I still can't figure it out. I think that if your hat is tinfoily enough then lawyers telling people not to get the organization put on the front page of the Post sounds like people trying to stage a secret conspiracy in a government organization where there is no privacy."}, {"id": 50663173, "au": "aliasxneo", "dom": 51, "sr": 109, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 7, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2451, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.929, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's a sensible view, but both sides seem to play it up regardless. Meaning, the right right will exclaim it's evidence of communists trying to usurp the government and the left will claim its the tactics of a fascist administration."}, {"id": 50662870, "au": "LoganDark", "dom": 324, "sr": 110, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 2, "age": 10.39, "grav": 92.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.894, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The website is acting like USAID committed some terrible horrible sins that they tried so hard to cover up. Like you're supposed to get mad at USAID, and here's the evidence. GP wasn't saying their general methodology on HN is always just to try to find something to be mad about. Just that the evidence doesn't seem to support the argument."}, {"id": 50662963, "au": "refurb", "dom": 61, "sr": 111, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 2, "age": 10.08, "grav": 88.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 27657, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.222, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The agency should have been gutted.\n\nIt had nothing to do with providing aid (it never was), it was basically the long arm of US intelligence to go into other countries and push for policies favorable to the US under the guise of international assistance.\n\nAnd beyond that the wasteful spending should have concerned any tax payer"}, {"id": 50662176, "au": "sailfast", "dom": 326, "sr": 112, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 0, "age": 12.31, "grav": 120.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 4162, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.522, "fa": 0.0, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "Most rational agencies try to pass the Washington post because of FOIA.\n\nIt’s often not a cover up so much as a reminder that the work you do belongs to taxpayers.\n\nBut that’s back a few years when agencies respected those laws, so YMMV."}, {"id": 50659483, "au": "01100011", "dom": 202, "sr": 113, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 2, "age": 18.53, "grav": 230.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 9936, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.89, "fa": 0.0, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "USAID being a tool of the CIA is a conspiracy theory that goes back to the late 80s at least. That’s when I, an anarchist punk at the time, first heard about it. I think the magazine I read it in was sold at Left Bank Books in Seattle."}, {"id": 50662002, "au": "pluralmonad", "dom": 111, "sr": 114, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 4, "age": 12.88, "grav": 129.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 502, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Not to mention, there is no direct benefit to someone in poverty that is not sexually active or promiscuous. Just money taken to help other people with a different lifestyle. Maybe this is fine, but I think the force and the coercion involved make that less likely."}, {"id": 50661823, "au": "dnautics", "dom": 234, "sr": 115, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 2, "age": 13.42, "grav": 137.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 22, "qw": 0, "k": 18843, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://en.wikipedia.org/wiki/CIA_fake_vaccination_campaign_in_Pakistan"], "ig": 1.142, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "For one, remember the polio vaccine campaign that was a cover for DNA surveillance to find bin laden?  That was a usaid connected operation.\n\nhttps://en.wikipedia.org/wiki/CIA_fake_vaccination_campaign_..."}, {"id": 50661829, "au": "dnautics", "dom": 201, "sr": 116, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 3, "age": 13.4, "grav": 137.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 18843, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.153, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think its generally common \"inside ball\" sentiment in the dc area that usaid is not great, abd this sentiment is not particular to political party."}, {"id": 50662952, "au": "refurb", "dom": 75, "sr": 117, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 3, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 27657, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.929, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The Twitter file were pretty bad.\n\nHush-hush meetings by government agencies with big tech to censor speech."}, {"id": 50659750, "au": "dofm", "dom": 123, "sr": 118, "sc": 2.7, "ep": 4.68, "bs": 1.99, "d": 4, "age": 18.12, "grav": 222.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 195, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.782, "fa": 0.0, "gp": 0.342, "bl": 0.75, "ds": 0.0, "txt": "OK, but if you are not explaining why, then of course you would.\n\nBut this is about cost-effectiveness. If you explain that, I think you'll find people understand that instinctively: a stitch in time saves nine.\n\nWhich is cheaper? 60 doctors going to somewhere in Africa to help treat an outbreak of 100 people who have Ebola, or the impact on healthcare of Ebola numbers growing until it reaches the USA?\n\nBelieve it or not, it's the same for HIV. You go to Lesotho or Mozambique or Botswana and you help poor people not get HIV, it's cheap and it suppresses cases at home, and buys the USA and the world a bit more time to figure out what the hell to do about multiple-drug-resistant TB, which is a phenomenon worsened by HIV.\n\nThis has been enormously successful: western countries have done much to help improve healthcare in countries we have historically kept poor, and we've directly benefited from it in terms of public health policies at home.\n\nIf you don't want that because you think the abstract, uninformed question is the only one that matters, perhaps that is a bit unhinged.\n\n(Edited: forgot the phrase up-thread was \"unhinged\")"}, {"id": 50662544, "au": "mlmonkey", "dom": 118, "sr": 119, "sc": 2.69, "ep": 2.69, "bs": 0.0, "d": 3, "age": 11.35, "grav": 106.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1596, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.734, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those Indian pharma companies who sold HIV coctails for less than $1/day did more to save African lives than anything USAID did or could have done."}, {"id": 50659815, "au": "consumer451", "dom": 321, "sr": 120, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 1, "age": 18.02, "grav": 220.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 15076, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.014, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "You went too far. You were just supposed to react to the headline, not investigate.\n\nIt's not about factual malfeasance. The point of TFA is about getting readers pissed off about some supposed malfeasance like \"The Twitter Files.\""}, {"id": 50662174, "au": "achandlerwhite", "dom": 46, "sr": 121, "sc": 2.66, "ep": 2.66, "bs": 0.0, "d": 4, "age": 12.32, "grav": 120.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 229, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.13, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You are misunderstanding. It’s not saying hide things from the media, but rather don’t do things that would cause a scandal. The Washington Post thing is a common phrase in DC agency internal ethics training."}, {"id": 50664596, "au": "ximus", "dom": 31, "sr": 122, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 2, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 197, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.129, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would argue that any foreign influence in foreign media supporting US interests lifts the US in the world's balance of powers and hence indirectly benefits US taxpayers.\n\nNot that I support this."}, {"id": 50663072, "au": "mpyne", "dom": 79, "sr": 123, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 4, "age": 9.79, "grav": 84.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 8377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.126, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh yes, the halcyon days of just a few years ago when the worst thing you could accuse the government of doing was trying to get Twitter to censor speech.\n\nWe’d be collectively tremendously better off if that still represented the worst of what we could accuse the U.S. government of doing."}, {"id": 50661668, "au": "asveikau", "dom": 293, "sr": 124, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 1, "age": 13.83, "grav": 144.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Crazy. Somebody is botting votes for this comment. It went from having a lot of votes all day long to negative in an extremely short time."}, {"id": 50663931, "au": "refurb", "dom": 63, "sr": 125, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 4, "age": 7.54, "grav": 58.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 27657, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.119, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The +purpose* of USAID is to export American foreign policy.  The aid is simply one channel to do it.\n\nAnd I don’t blame voters at all for supporting ending spending on foreigners when Americans could use the money at home"}, {"id": 50662837, "au": "howunfortunate", "dom": 256, "sr": 126, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 3, "age": 10.48, "grav": 94.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Complaints about implementation are totally valid, but military and immigration enforcement are core functions of every government on earth.\n\nThat's a fundamental difference from charities and cultural programs, especially when they are explicitly going to noncitizens."}, {"id": 50662083, "au": "lantry", "dom": 343, "sr": 127, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 1, "age": 12.6, "grav": 124.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1240, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's no longer true after the recent elections in Brazil? Isn't Lula da Silva considered left wing?"}, {"id": 50663113, "au": "apical_dendrite", "dom": 50, "sr": 128, "sc": 2.54, "ep": 2.54, "bs": 0.0, "d": 6, "age": 9.69, "grav": 83.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 1536, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.403, "fa": 0.56, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Every big company I've worked for has had similar guidance about being careful what you put in an email. Sometimes at small companies too, although it tends to be more ad hoc.\n\nIt's basically about avoiding unnecessary risk. People who are hostile to you, like opposing counsel, can choose to interpret statements that were intended innocently in the worst possible light. A big one in industry is anything that might flag anti-trust risk. For instance, someone in management can say something about \"dominating the competition\" and it might be intended completely innocently - like the kind of bombastic cheerleading you'd see at a football game - but then taken as evidence of malfeasance by opposing counsel.\n\nJust having this guidance doesn't imply any kind of malfeasance - it's just the reality of living in a world where anything you say can be misinterpreted by someone acting in bad faith."}, {"id": 50659245, "au": "phendrenad2", "dom": 347, "sr": 129, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 0, "age": 18.87, "grav": 237.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 8273, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.215, "fa": 0.34, "gp": 0.712, "bl": 0.0, "ds": 0.0, "txt": "So given that there's nothing really here, USAID can come back, right? Might have to wait until 2028 though (:"}, {"id": 50661544, "au": "enjoyyourlife", "dom": 365, "sr": 130, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 1, "age": 14.18, "grav": 149.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1098, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.062, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Since I can't edit my comment, I realize that USAID has had impactful project but they seem like they have been used for social media companies as free work (I know this is a political topic and may be controversial.)"}, {"id": 50661764, "au": "brendoelfrendo", "dom": 317, "sr": 131, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 2, "age": 13.59, "grav": 140.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1790, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.059, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean, it shows that they gave recommendations on how to fight disinformation. Telling media \"hey, if you publish this you'll look like an idiot because it's not true and also you probably shouldn't publish untrue things\" is not a crime."}, {"id": 50664339, "au": "ergl", "dom": 72, "sr": 132, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 6.62, "grav": 48.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 630, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.045, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Reclaim the net is a right-wing libertarian site with an axe to grind. I personally avoid any article by them that gets posted here because they almost always end up in inflammatory threads."}, {"id": 50660687, "au": "asveikau", "dom": 134, "sr": 133, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 4, "age": 16.38, "grav": 188.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.651, "bl": 0.0, "ds": 0.0, "txt": "I don't think you talk to a lot of taxpayers who aren't well off.\n\nIf you ask them, \"should the US help foreigners suffering from HIV?\" I believe most of them would say yes."}, {"id": 50664879, "au": "_djo_", "dom": 258, "sr": 134, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 3, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 4704, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.039, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The EU is already spending far more on foreign aid than the US was, proportionally speaking. It doesn’t have excess budget capacity to suddenly fill the gap left by the US cutting off foreign aid entirely.\n\nMoreover, the Trump administration didn’t even give anyone time to step up and take over, they ended the programmes suddenly and without notice, meaning anyone else had to almost start from scratch to not only provide funding but to rebuild the organisational and logistics networks formerly provided by USAID, which takes years to set up at the same scale. Tonnes of medicines and food aid were simply allowed to expire and not handed over to countries for new redistribution.\n\nIt’s fine to argue whether the US should have been providing certain aid. That’s everyone’s right as the voting public, to decide what they want their country to spend money on. But, surely, everyone can agree that cutting off funding abruptly without allowing for a transition time for others to take over is immoral and undoubtedly caused unnecessary deaths."}, {"id": 50659682, "au": "bequanna", "dom": 158, "sr": 135, "sc": 2.43, "ep": 2.43, "bs": 0.0, "d": 3, "age": 18.21, "grav": 224.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1824, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.036, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Getting a tax refund doesn’t mean you “don’t pay taxes”. It means you paid slightly too much and the government repays the interest free loan you gave them."}, {"id": 50667559, "au": "mapontosevenths", "dom": 304, "sr": 136, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 3, "age": 0.34, "grav": 4.6, "surf": 24.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.025, "fa": 0.0, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "No one can. It was USAID that collected the only reliable version of that number.\n\nIt does leave me to wonder if you knew that when you asked this question though. A little trap, because you knew the world had been rendered incapable of answering your question anymore?"}, {"id": 50661451, "au": "brown9-2", "dom": 211, "sr": 137, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 3, "age": 14.43, "grav": 154.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 15765, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.939, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "the inability to clearly answer the question here or justify the illegal gutting a government agency is damning."}, {"id": 50659238, "au": "flexagoon", "dom": 268, "sr": 138, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 2, "age": 18.87, "grav": 237.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2803, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.54, "fa": 0.34, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "Foreign aid is less than 1% of the federal budget. Even ignoring the selfish soft power argument (which plays a huge role), it's a huge amount of good for a relatively tiny amount of money. \"The US taxpayers\" pay much more for a lot of much worse things."}, {"id": 50662389, "au": "dofm", "dom": 112, "sr": 139, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 5, "age": 11.74, "grav": 111.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.024, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is really not true.\n\nHIV has in the past made tuberculosis — a disease of poverty — considerably worse, even for non-HIV-infected people. It caused a very significant TB epidemic in the USA in the late 80s and early 90s. And it has caused outbreaks of MDR-TB in hospitals in particular infecting immune compromised people such as cancer and transplant patients, and people with other autoimmune diseases, which are also more common in poor people due to substance abuse, poor diet, exhaustion, stress, outright malnutrition.\n\nAnd of course it has spread among IV drug users in areas where there are too few needle exchanges.\n\nI am quite sure this extends to other diseases that need immune-compromised people to really spread.\n\nAll of this stuff is only controlled by a broad spread of public health measures which include, at their outer edge, health outreach in hotspot countries with poorly-funded healthcare.\n\nUSAID was doing proper work. It's absurd to think it can just be cut out of the picture."}, {"id": 50661727, "au": "pohl", "dom": 175, "sr": 140, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 4, "age": 13.72, "grav": 142.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 9879, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "It’s ultimately less expensive to spend a little money overseas solving a problem while it is still small and far away, preventing it from growing and eventually reaching our shores where it, now large, would be much more expensive to fix."}, {"id": 50662350, "au": "shimman", "dom": 309, "sr": 141, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 3, "age": 11.83, "grav": 113.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2056, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.984, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sounds like something Elon Musk should do to defend himself in front of a judge at the ICC. Would also be a good way for the US to rebuild it's reputation by taking down one of the most hated men in the world. I'd rather the US government spend time nationalizing his assets and throwing him in a holding cell."}, {"id": 50662031, "au": "ETH_start", "dom": 378, "sr": 142, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 2, "age": 12.79, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 656, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.644, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You shouldn't trust anybody. You should just evaluate the evidence that they provide on its own merit.\n\nHis motivation for focusing on censorship of conservatives could stem from anything ranging from his own personal biases towards conservatives to there simply being vastly more censorship of conservative voices.\n\nAlso, from what I've seen, a lot of the specific censorship programs that he has highlighted outside of the U.S. were not targeting conservatives."}, {"id": 50659015, "au": "102984815", "dom": 337, "sr": 143, "sc": 2.3, "ep": 4.82, "bs": 2.52, "d": 0, "age": 19.2, "grav": 244.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.403, "fa": 0.0, "gp": 1.05, "bl": 0.95, "ds": 0.0, "txt": "This is propaganda to support the view that Trump has dismantled USAID. The aid part was dismantled, the propaganda part has been folded into the State Department so it is directly controlled by Rubio.\n\nNED is also still active.\n\nVance will try to run on the same fake isolationist platform as Trump did. They are all neocons."}, {"id": 50665274, "au": "ml-anon", "dom": 356, "sr": 144, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 0, "age": 4.52, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 840, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "Why do LLMs have anything to do with it? Do you think people make statements like that based on objective or good faith research?\n\nThe guy who is responsible for killing USAID also runs one of the largest LLM companies and is a fucking nazi"}, {"id": 50664128, "au": "dirtikiti", "dom": 368, "sr": 145, "sc": 2.28, "ep": 3.13, "bs": 0.85, "d": 3, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 8, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 0.918, "fa": 0.34, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Keep shilling. I guess you missed the past 10 years of censoring and claiming \"misinformation\" against conservatives. Keep masking up and getting that covid vaccine."}, {"id": 50659204, "au": "hackyhacky", "dom": 244, "sr": 146, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 2, "age": 18.91, "grav": 238.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 4884, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.888, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "If the goal is \"stop people from dying of AIDS\", does it really matter where the money comes from? If we replaced the word \"USAID\" with any other word, the effect is the same. Moreover, the forces that oppose helping the needy would oppose the effort regardless."}, {"id": 50662410, "au": "kasey_junk", "dom": 198, "sr": 147, "sc": 2.25, "ep": 2.25, "bs": 0.0, "d": 2, "age": 11.68, "grav": 110.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 16027, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.619, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Of course there is. Even if you subscribe to some pathetic nihilistic zero sum game version of this dealing with medical crisis on foreign shores is better than dealing with it here.\n\nBut also lots of us think that’s an unhinged and morally repugnant way to judge our foreign policy. We are better than this and I’m disgusted by the cynical outlook it implies.\n\nWe literally said we’d be better."}, {"id": 50664126, "au": "croon", "dom": 77, "sr": 148, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 4, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5225, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 0.856, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "Can you actually read the Twitter files anywhere? Or were they simply editorialized piece-meal by Elon-friendly outlets (who he since has had a falling out with)?\n\nIf the answer is no, ask yourself why that is."}, {"id": 50662081, "au": "15155", "dom": 182, "sr": 149, "sc": 2.21, "ep": 3.91, "bs": 1.7, "d": 11, "age": 12.61, "grav": 124.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 24, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.153, "fa": 0.42, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "> call AIDS a \"niche disease\"\n\nHow does HIV spread, primarily? Is it airborne?\n\n> All in a time where ones parents (let alone grandparents) remember a very different story.\n\nThey remember being scared and uninformed: that information is now taught in every high school in America - also urls": [], "ig": 0.938, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When you are the government, and the \"untrue things\" include criticism of government policies, and your \"recommendations\" are backed up by (explicit or implicit) threats of government action, then yes that is a crime. It violates the First Amendment"}, {"id": 50659443, "au": "JoshTriplett", "dom": 213, "sr": 153, "sc": 2.2, "ep": 2.2, "bs": 0.0, "d": 3, "age": 18.6, "grav": 231.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 21, "k": 52504, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.428, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> By all means be skeptical of what you hear but you should be as skeptical of your side as the other.\n\nAnd then, when you've done that, you can observe that one side was in fact lying much more and wrong much more, and update your priors so that the next time you assume less honesty and less correctness from them."}, {"id": 50662372, "au": "decidu0us9034", "dom": 257, "sr": 154, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 2, "age": 11.79, "grav": 112.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 157, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 0.921, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No, EU should have stepped up to the plate after musk dismantled USAID. Two wrongs don't make a right. And disease/hunger prevention isn't just charity. It benefits Western soft power and keeps us all healthier."}, {"id": 50664189, "au": "latency-guy2", "dom": 162, "sr": 155, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 3, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 443, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Calling US taxpayers selfish is ignorant to a degree that makes you look foolish.\n\nUS taxpayers are far too generous with their money. They do more than their part.\n\nMaybe other countries in the world can step up, afterall, they care about humanity? So far, doesn't seem like they do."}, {"id": 50649717, "au": "enjoyyourlife", "dom": 367, "sr": 156, "sc": 2.12, "ep": 2.12, "bs": 0.0, "d": 2, "age": 38.65, "grav": 787.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1098, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Interesting. Those tech companies really took advantage of that to use the State Department for foreign facing work"}, {"id": 50659350, "au": "skywhopper", "dom": 73, "sr": 157, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 1, "age": 18.7, "grav": 233.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 11645, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is the best they could come up with after gutting the agency. They pretend it’s a scandal when it’s nothing remotely as bad as what the current administration does 20 times a day out in public."}, {"id": 50663040, "au": "paulryanrogers", "dom": 151, "sr": 158, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 5, "age": 9.86, "grav": 85.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 12299, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Good thing the government isn't a for profit business! And we don't evaluate whatever people deserve healthcare based on what they contribute personally."}, {"id": 50659299, "au": "skywhopper", "dom": 248, "sr": 159, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 2, "age": 18.77, "grav": 235.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 11645, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That’s not the question. Once USAID was actively funding programs to prevent HIV/AIDS from killing millions of people in Africa, if you think there are better paths to do that than USAID, the solution is not to immediately cut off all funding to USAID. Unless you want those people who rely on that funding to die."}, {"id": 50659486, "au": "andsoitis", "dom": 92, "sr": 160, "sc": 2.01, "ep": 2.01, "bs": 0.0, "d": 3, "age": 18.53, "grav": 230.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.36, "fa": 0.0, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "The difference is whether the money is being applied in the country of the taxpayer or elsewhere.\n\nTaxing people for infra in their own country or to support those less fortunate in their own country is a very good thing."}, {"id": 50661434, "au": "flexagoon", "dom": 275, "sr": 161, "sc": 2.0, "ep": 2.0, "bs": 0.0, "d": 4, "age": 14.47, "grav": 154.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2803, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.853, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I do donate a meaningful share of my money to international charity. Definitely a higher percentage of my budget that the US does, and probably way more in absolute amount than you do through your taxes. Unfortunately I can't \"fund it myself\" because I don't have a few tens of billions of dollars to spare."}, {"id": 50663762, "au": "dofm", "dom": 130, "sr": 162, "sc": 2.0, "ep": 5.4, "bs": 3.39, "d": 10, "age": 7.97, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 213, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 7, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.816, "fa": 0.0, "gp": 0.779, "bl": 1.28, "ds": 0.0, "txt": "It shouldn't be. But these efforts, nevertheless, underpin our healthcare systems in a global world.\n\nThe UK's healthcare system struggles with this. The USA's… look at how poorly COVID was handled.\n\nYou understand how diseases spread, right? The earliest interventions are the most effective. It's just that simple. Disease hotspots have an outsized impact. If you deal with them you have a very very disproportionate impact. You don't wait till the communicable disease is inside your borders to consider it a threat.\n\nThis idea that cutting USAID saves money is flat wrong over the long term. And really obviously so. And it has had an outsized impact on how the USA is perceived; influence over the global south is being ceded to China on an ever-greater scale.\n\nAnd the best way to fix the problems in those countries so the burden doesn't keep falling on us is to help fix their healthcare and education systems so that they have time to meet the task of resolving it themselves, which is after all what they want too (again, proved time after time).\n\nIt's cheap, it's effective, it builds international resilience, and the USA has decided to stop doing it because \"shithole countries\" (or \"shithouse countries\" as Trump put it when he confessed to having said that recently)."}, {"id": 50663250, "au": "Frondo", "dom": 138, "sr": 163, "sc": 1.97, "ep": 1.97, "bs": 0.0, "d": 7, "age": 9.28, "grav": 78.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 13, "k": 4245, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.327, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Don’t you think he has saved the taxpayers more than you has taken?\n\nNo, I don't. Why would I think that? Where is that idea coming from? And I am happy and willing to entertain explanations here, but you've got to do more than just put such a bold claim out there with a \"don't you think\" attached."}, {"id": 50659102, "au": "droidjj", "dom": 320, "sr": 164, "sc": 1.92, "ep": 3.12, "bs": 1.19, "d": 0, "age": 19.05, "grav": 241.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1726, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.283, "fa": 0.0, "gp": 1.69, "bl": 0.45, "ds": 0.0, "txt": "I’ve spent ten minutes trying to find something to be mad about. What am I supposed to be mad about?"}, {"id": 50664291, "au": "vkou", "dom": 64, "sr": 165, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 5, "age": 6.72, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 17966, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.394, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's true, the top 0.001% could always use more of that money for themselves. :)\n\nThey seem to be the biggest beneficiaries of all the restructuring that has happened in the past couple of years."}, {"id": 50662993, "au": "lmz", "dom": 126, "sr": 166, "sc": 1.89, "ep": 2.74, "bs": 0.85, "d": 7, "age": 10.01, "grav": 87.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2415, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "People, to/from Lesotho, Mozambique, Botswana (or other such countries named). Require visas for their nationals visiting with test requirements like Covid times. Those are paid by the applicant anyway. Quarantine and test US nationals returning from such high risk places at their own cost."}, {"id": 50664979, "au": "universa1", "dom": 6, "sr": 167, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 4, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 177, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 0.795, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "not sure if irony, but: which scientific person in a field intersecting with the work of usaid does not know of usaid ? that population goes close to zero..."}, {"id": 50664643, "au": "chasing", "dom": 298, "sr": 168, "sc": 1.85, "ep": 1.85, "bs": 0.0, "d": 1, "age": 5.91, "grav": 41.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 9143, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 0.788, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I get all my facts from @WallStreetApes.\n\nAfter all, as they say in their Twitter bio they are \"followed By @elonmusk @joerogan @DonaldjTrumpJr @dbongino @RealAlexJones @JamesOKeefeIII.\"\n\nWhat could be more trustworthy?"}, {"id"
