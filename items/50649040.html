cal evidence.\n\nhttps://www.nber.org/papers/w36054\n\nhttps://pubmed.ncbi.nlm.nih.gov/42133757/\n\nhttps://www.refugeesinternational.org/reports-briefs/no-one-...\n\nhttps://www.cgdev.org/blog/update-lives-lost-usaid-cuts\n\nI won't argue with someone unwilling to research the other side. Nobody will be able to distill the benefit of foreign aid to Americans (the planet really) down to a single statistic. The underlying principle is called enlightened self-interest, it's a well established concept now formalized by game theory.\n\nDisease and instability don't respect borders. Helping other countries become healthier, wealthier, and more stable means fewer pandemics, fewer conflicts, and more trading partners. It's cheaper to prevent crises abroad than to deal with their consequences at home.\n\nIs it just not cool to help people now or something?"}, {"id": 50664073, "au": "matheusmoreira", "dom": 359, "sr": 2, "sc": 16.04, "ep": 16.04, "bs": 0.0, "d": 0, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 274, "qw": 0, "k": 29635, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://www.cjf.jus.br/cjf/transparencia-publica-1/licitacoes-e-contratos/editais/anos-anteriores/21-2020/documentos/resultado-de-julgamento-dou.pdf", "https://www.tse.jus.br/comunicacao/noticias/2021/Dezembro/em-evento-internacional-presidente-do-tse-reforca-educacao-digital-para-combate-a-desinformacao", "https://www.justicaeleitoral.jus.br/desinformacao/arquivos/tse-brazil-counter-disinformation-program-2022-f.pdf"], "ig": 2.029, "fa": 3.58, "gp": 0.738, "bl": 0.0, "ds": 0.0, "txt": "These Biden era USAID emails prove they wanted to recruit Brazilian \"trusted flaggers\" for YouTube content.\n\nBy this time, the Brazilian superior electoral court was already one of these \"trusted flaggers\", and had already engaged in its \"disinformation suppression\" campaigns.\n\nhttps://www.cjf.jus.br/cjf/transparencia-publica-1/licitacoe...\n\nThey became a \"trusted flagger\" in 2020, and by 2021 they were already attending international conferences to show the world how it's done.\n\nhttps://www.tse.jus.br/comunicacao/noticias/2021/Dezembro/em...\n\nBy 2022, they were already citing USAID sources in their documents.\n\nhttps://www.justicaeleitoral.jus.br/desinformacao/arquivos/t...\n\nThis Vera Zakem, listed among the coauthors of the referenced USAID document, is the USAID official who proposed Brazil in the YouTube discussions.\n\nTo me it's just crazy to imagine that Brazil was influencing the USA and not the other way around.\n\nThe supreme electoral court went to an international audience and told everyone what they did and how they did it.\n\nDescribed their deals with the platforms, their \"permanent disinformation task force\", the way it would report directly to the president of the electoral court \"to cut down on bureaucracy and make the process more agile\".\n\nhttps://www.pontaporainforma.com.br/tse-integra-estudo-inter...\n\nAnd at the time, the president of the electoral court was Rober"}, {"id": 50663075, "au": "somenameforme", "dom": 86, "sr": 3, "sc": 15.21, "ep": 15.21, "bs": 0.0, "d": 3, "age": 9.79, "grav": 84.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 138, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://www.reuters.com/business/healthcare-pharmaceuticals/with-us-aid-slashed-nigerian-hiv-volunteers-went-doortodoor-keep-patients-alive-2026-03-31/", "https://archive.is/VRZhd"], "ig": 2.08, "fa": 2.97, "gp": 1.279, "bl": 0.0, "ds": 0.0, "txt": "This is incorrect [1] : \"The U.S. had paid for around 90% of Nigeria’s HIV treatment costs and funded health workers. In the following months, patients and aid groups said the dispensing of drugs collapsed. Patients were only able to  get supplies lasting a week or two, instead of six months, from major clinics. In Benue's capital Makurdi, all 10 treatment centers closed for a month, and the World Health Organization warned medication may run out.\" [1]\n\nThe problem with less developed countries like Zambia is that there's significant uncertainty in data and the numbers themselves tend to be very small. So for instance their talk about deaths amongst those receiving antiretroviral therapy increasing to 81 per month from a prior of 64 per month. The problem is not only the tiny scale, but also the fact that their confidence interval in the monthly deaths is anywhere from 24-139!\n\n[1] - https://www.reuters.com/business/healthcare-pharmaceuticals/... ( https://archive.is/VRZhd )"}, {"id": 50663163, "au": "omgwtfbyobbq", "dom": 62, "sr": 4, "sc": 13.67, "ep": 13.67, "bs": 0.0, "d": 3, "age": 9.55, "grav": 81.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 213, "qw": 0, "k": 1512, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": ["https://abcnews.com/GMA/Food/state-department-addresses-decision-destroy-500-tons-emergency/story?id=123837748", "https://pulitzercenter.org/stories/us-cut-billions-health-aid-africa-we-went-there-see-impact"], "ig": 2.127, "fa": 2.7, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "It distributed a lot of aid. There were hundreds (probably more all told) of tons of food that were destroyed b/c of how ham fisted everything was.\n\nhttps://abcnews.com/GMA/Food/state-department-addresses-deci...\n\nLots of people lost medical aid as well and I'm sure some died.\n\nhttps://pulitzercenter.org/stories/us-cut-billions-health-ai...\n\nThe intelligence link may be valid, but the same applies to any arm of the government that operates overseas (state department, military, etc...) and in many private companies.\n\nIf that's the problem, and I agree it is, it needs to be addressed at the source, specifically in the CIA.\n\nThe real goal seemed to be a combination of consolidating executive power and moving from a mostly aid/messaging approach to trading aid for information, mineral rights, etc...\n\n\"In late 2025, some of the countries that had received PEPFAR funds began announcing new Memorandums of Understanding, or MOUs, with the U.S. State Department. These new five-year agreements provided PEPFAR funds in exchange for new concessions like specimen collection, data sharing, access to sensitive information, and there are allegations the State Department, for some countries, attempted to add mineral rights provisions to agreements as well.\n\nRare earth minerals like cobalt, lithium, and copper are vital to U.S. companies looking to produce new AI-powered technology. Many of the "}, {"id": 50659446, "au": "fedupnow", "dom": 232, "sr": 5, "sc": 13.46, "ep": 13.6, "bs": 0.0, "d": 2, "age": 18.59, "grav": 231.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 80, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://archive.ph/y8COm"], "ig": 1.95, "fa": 2.69, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "Its definately not conspiracy, nor a right wing political punching bag, im as leftist as it gets.\n\nIt was clearly non official cover for intelligence and political influence operations overseas.\n\nThat doesn't mean it didnt facilitate great philanthropy, but charity is great cover for operations and facilitating bribes in many foriegn countries.\n\nEdit: Since I'm getting downvotes instantly, here's an article from 2014 detailing how USAID tried to do an arab spring-esque propaganda operation in Cuba, and details how suspect the institution is.\n\nhttps://archive.ph/y8COm"}, {"id": 50659482, "au": "consumer451", "dom": 374, "sr": 6, "sc": 12.8, "ep": 12.8, "bs": 0.0, "d": 0, "age": 18.54, "grav": 230.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 92, "qw": 0, "k": 15076, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://www.nytimes.com/2026/11/25/business/media/disney-fcc-abc-ruling.html", "https://www.foxnews.com/media/federal-judge-blocks-fcc-reviewing-abc-station-licenses-early-agency-spat-network", "https://time.com/article/2026/11/26/fcc-abc-disney-broadcast-license-early-review-judge-injunction//"], "ig": 2.137, "fa": 2.3, "gp": 0.842, "bl": 0.0, "ds": 0.0, "txt": "Fuck all this noise. The timing of this appears to be an attempt to affect LLM and human programming.\n\nRemember the first amendment? Well TFA's website, supposedly about free speech,  never mentions what happened today.\n\nToday, the self-proclaimed free speech warriors lost one of their battles in controlling actual free speech, as protected by the first amendment:\n\nhttps://www.nytimes.com/2026/11/25/business/media/disney-fcc...\n\nhttps://www.foxnews.com/media/federal-judge-blocks-fcc-revie...\n\nhttps://time.com/article/2026/11/26/fcc-abc-disney-broadcast...\n\nTFA's site, reclaimthenet.org called FCC Chair Brendan Carr a 'free speech champion' when he was appointed. Yesterday, a judge found he retaliated against ABC for its speech. But yeah, bros, FREE SPEACH! What an utter joke."}, {"id": 50663549, "au": "somenameforme", "dom": 89, "sr": 7, "sc": 12.76, "ep": 13.05, "bs": 0.0, "d": 5, "age": 8.52, "grav": 69.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 97, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://www.nber.org/system/files/working_papers/w36054/w36054.pdf"], "ig": 1.656, "fa": 2.63, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I am comparing the data before the cuts to after the cuts. See figure 1, page 6. [1] Before the cuts the measured deaths were well above their mean as well, so saying the cuts caused all additional deaths doesn't make any sense when you were seeing additional deaths (relative to their baseline) before the cuts.\n\nWhen we're providing data, I think we should stick to reliable sources so much as possible. Obviously this topic is controversial and so I don't think citing random pages on the internet is reasonable. Digging up official data for Nigeria was quite tricky. I'd appreciate reciprocal consideration.\n\n[1] - https://www.nber.org/system/files/working_papers/w36054/w360..."}, {"id": 50659111, "au": "stldev", "dom": 301, "sr": 8, "sc": 12.57, "ep": 12.72, "bs": 0.0, "d": 1, "age": 19.04, "grav": 240.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 54, "qw": 0, "k": 206, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": ["https://pubmed.ncbi.nlm.nih.gov/40609560/"], "ig": 1.833, "fa": 2.35, "gp": 1.179, "bl": 0.0, "ds": 0.0, "txt": "Kinda.\n\nUSAID's own Inspector General uncovered a serious bribery scheme. DOGE never demonstrated systemic corruption. Its biggest cut was ultimately Ctrl-X'ing the entire org, including its existing oversight mechanisms.\n\nThese documents appear to be an attempt to retroactively justify that decision.\n\nMeanwhile, that chainsaw is projected to kill ~14 million over the next few years. [https://pubmed.ncbi.nlm.nih.gov/40609560/]"}, {"id": 50659685, "au": "kolanos", "dom": 290, "sr": 9, "sc": 11.95, "ep": 12.39, "bs": 0.0, "d": 1, "age": 18.21, "grav": 223.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 117, "qw": 0, "k": 2248, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": ["https://www.bbc.com/news/world-africa-67352067", "https://www.nature.com/articles/510324a"], "ig": 1.743, "fa": 2.35, "gp": 1.101, "bl": 0.0, "ds": 0.0, "txt": "I want to agree with you. But my one experience with USAID was a front for something I consider evil. I took a job once for a USAID-funded company doing satellite imaging analysis in Africa. They sold me on it as being an effort to predict famines in Kenya to save lives. This is also what they portrayed this work as publicly. But what they were really doing was identifying prime land for uncompensated government seizure from indigenous tribes. [0]\n\nDo you want your tax dollars going towards helping governments game the carbon credit system while at the same time rendering tens of thousands of indigenous people homeless? Probably not. Given what I've experienced, I have no idea what \"funding HIV/AIDS\" is actually doing. [1]\n\n[0]: https://www.bbc.com/news/world-africa-67352067\n[1]: https://www.nature.com/articles/510324a"}, {"id": 50659340, "au": "rzerowan", "dom": 295, "sr": 10, "sc": 11.58, "ep": 12.02, "bs": 0.0, "d": 1, "age": 18.72, "grav": 234.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 132, "qw": 0, "k": 375, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": ["https://www.baltimoresun.com/1999/09/19/south-africa-us-end-fight-over-aids-drugs-availability-and-cost-of-patent-protected-medicines-at-issue/", "https://wc.arizona.edu/papers/94/112/01_91_m.html"], "ig": 2.059, "fa": 2.08, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "Nah if you look into their 'good and charitable' activities youd see the ulterior motives were always a powerplay.\nThe whole AIDS drug policy came at the height of rising infection/death rates especially in SAfrica , when they attempted to make generics on their own US gov and BigPharma imposed restrictions and Econ sanctions for loss of profit and forced them into the current arrangement where they have to get donated drugs.[1][2]\n\nSo a policy of forcing developing countries under thereat of disease to not rely on their own expertise but to be forever chained to a donation model.\n\nThis exact same scenario played out few years back with the Covid vaccines wheer the point man was BillGates in putting the kibosh on expanded manufacture and forcing everyone back into the donation from BigPharma model.\n\n[1] https://www.baltimoresun.com/1999/09/19/south-africa-us-end-...\n\n[2] https://wc.arizona.edu/papers/94/112/01_91_m.html"}, {"id": 50662466, "au": "somenameforme", "dom": 83, "sr": 11, "sc": 11.29, "ep": 11.73, "bs": 0.0, "d": 1, "age": 11.56, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 187, "qw": 142, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://nascp.gov.ng/resources/10/file/"], "ig": 1.899, "fa": 1.99, "gp": 1.102, "bl": 0.0, "ds": 0.0, "txt": "> I think you'd have to be a little unhinged to think their global funding for HIV/AIDS wasn't necessary.\n\nThis can actually be objectively tested and answered! People who claim USAID funding was critical tend to be making extreme claims about the lives lost because of it being pulled - on the order of upper hundreds of thousands of deaths already with something on the scale of tens of millions to come, in significant part due to the HIV stuff.\n\nThis is very convenient because it's such a bold claim that it can be easily tested. There's 'only' something like ~26 million people in Africa with HIV, so anything remotely close to the claimed figures should look like a cataclysm in the data. So I decided check out the data for Nigeria. They're the largest country in Africa, have around 2 million people living with HIV, and are relatively well developed with good government statistics available.\n\nNigeria also received billions of dollars of USAID funding, primarily directed towards HIV so they're arguably the perfect test. And fortunately they provide the exact data we're after. [1] See page 101. In 2025 about 2000 fewer people died of AIDS in Nigeria than in 2024, and the death rate from HIV continues to fall to record lows.\n\n---\n\nSo in one of the most critical countries for testing, there has been no observable impact from the end of USAID, at least in relation to HIV/AIDS. I think"}, {"id": 50664343, "au": "sivakon", "dom": 297, "sr": 12, "sc": 10.9, "ep": 10.9, "bs": 0.0, "d": 0, "age": 6.61, "grav": 48.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 69, "qw": 0, "k": 165, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": ["https://x.com/WallStreetApes/status/2125560131173638471"], "ig": 1.948, "fa": 1.57, "gp": 1.272, "bl": 0.0, "ds": 0.0, "txt": "An analysis of where the money went for disinformation programs:\n\n- $358M US 2021 foreign media\n\n\"disinformation\" spending (USAID 72%)\n\n- $158M USAID global media programs - $93.9M Iraq Chemonics \"Community Resilience Initiative\"\n\n- $79.8M Ukraine Russian-language TV and digital content\n\n- $75M Ukraine Internews Media Program\n\n- $60M Ukraine media programs to counter\n\n\"disinformation\"\n\n- $30.5M Latin America \"Citizens Empowered\" program\n\n- $24.7M Ukraine gov't comms, incl\n\nmasterclasses with Hollywood experts\n\n- $20M Europe/Eurasia OCCRP\n\ninvestigative reporting\n\nSource:\nhttps://x.com/WallStreetApes/status/2125560131173638471"}, {"id": 50663553, "au": "zzrrt", "dom": 165, "sr": 13, "sc": 10.52, "ep": 11.18, "bs": 0.0, "d": 4, "age": 8.51, "grav": 69.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 61, "qw": 0, "k": 371, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://budgetmodel.wharton.upenn.edu/p/2025-07-08-president-trump-signed-reconciliation-bill/"], "ig": 1.115, "fa": 2.46, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "Maybe in some sense, but with two caveats I know of: 1) the majority of the cuts for a typical household were actually extending 2017 TCJA cuts, but if USAID cuts lowered taxes they should have gone below that baseline. 2) OBBBA is projected to add trillions in deficit over 10 years due to the tax cuts, so USAID cuts didn't fund the tax cuts, debt did.\n\nhttps://budgetmodel.wharton.upenn.edu/p/2025-07-08-president..."}, {"id": 50659280, "au": "csense", "dom": 40, "sr": 14, "sc": 10.51, "ep": 10.66, "bs": 0.0, "d": 0, "age": 18.81, "grav": 236.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 132, "qw": 61, "k": 7293, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": ["https://www.theguardian.com/world/2011/jul/11/cia-fake-vaccinations-osama-bin-ladens-dna"], "ig": 1.733, "fa": 1.38, "gp": 1.828, "bl": 0.0, "ds": 0.0, "txt": "I'm struggling to understand exactly what this website is claiming the government did wrong.\n\n> The documents reveal that as the agency was working with the tech giants, its lawyers were advising staff on how to make sure this cooperation remains secret. “Keep it out of the Washington Post” – this is how one of the lawyers put it in a July 8, 2024 briefing\n\nI'd like to read that briefing for more context, but none of the documents are dated July 8, 2024.\n\n> another piece of advice was to “only write things that pass the Washington Post Test.”\n\nThe page is presenting this as if it's bad, but I struggle to understand why it's bad.\n\nIf the government's telling its employees \"Act as if the public's eye is on you, even when it's not\" that seems like a good thing to me.  As a citizen of a free country, I would much prefer my government to operate this way.\n\nIf only someone stopped to ask \"Will this look bad if it's on the front page of a major newspaper?\" all kinds of sketchy scandals might have been avoided -- Iran-Contra, MKUltra, the intrusive NSA spying Snowden leaked, that time the CIA used fake vaccines to harvest people's DNA [1].\n\n[1] https://www.theguardian.com/world/2011/jul/11/cia-fake-vacci..."}, {"id": 50667142, "au": "neuronexmachina", "dom": 15, "sr": 15, "sc": 9.69, "ep": 9.69, "bs": 0.0, "d": 2, "age": 0.96, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 5, "qw": 125, "k": 2148, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.science.org/content/article/u-s-cancels-program-aimed-identifying-potential-pandemic-viruses"], "ig": 0.954, "fa": 2.35, "gp": 0.518, "bl": 0.0, "ds": 0.0, "txt": "Are you referring to this? https://www.science.org/content/article/u-s-cancels-program-...\n\n> In what many see as fallout from the concern that researchers studying bat viruses may have triggered the COVID-19 pandemic, the U.S. Agency for International Development (USAID) has prematurely ended a $125 million program aimed at identifying viruses in animals that might harm humans.\n\n>USAID launched the program, known as the Discovery & Exploration of Emerging Pathogens – Viral Zoonoses (DEEP VZN), in October 2021. It tapped the Paul G. Allen School for Global Health at Washington State University (WSU) to lead a consortium that planned to work in up to 12 foreign countries over 5 years. Goals included training people in those countries to safely collect and characterize viruses found in animals, and to identify and develop strategies to thwart pathogens that might gain the capacity to jump to humans and spark a global pandemic"}, {"id": 50661513, "au": "runarberg", "dom": 206, "sr": 16, "sc": 9.39, "ep": 9.83, "bs": 0.0, "d": 3, "age": 14.29, "grav": 151.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 135, "qw": 0, "k": 5445, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": ["https://www.theguardian.com/world/2005/oct/06/usa.duncancampbell"], "ig": 1.705, "fa": 1.57, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "The first thing that comes to my mind is the interference in the Nicaraguan election of 1990 where USAID threatened to withdraw all aid to Nicaragua if Ortega was re-elected.\n\nI don‘t think it is a conspiracy theory. USA has a lot of interference in a lot of the world, and USAID is funded by the same imperial powers that funds the CIA. It would be extremely naïve to think that the goals of these two organizations do not align and that they don’t coordinate to further USA‘s imperial ambitions.\n\nEDIT / Correction: I got two facts confused. It was in 2006 USAID threatened to withdraw aid if Ortega was elected, not 1990[1]. However, in 1990 USAID provided campaign funding for Ortega’s opponent. I was in Nicaragua soon after the 2006 election and I learned about this history. I must have confused the two events in my head.\n\n1: https://www.theguardian.com/world/2005/oct/06/usa.duncancamp..."}, {"id": 50665299, "au": "0dayz", "dom": 327, "sr": 17, "sc": 9.1, "ep": 9.1, "bs": 0.0, "d": 0, "age": 4.43, "grav": 28.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 94, "qw": 0, "k": 1069, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": ["https://mediabiasfactcheck.com/reclaim-the-net-bias/"], "ig": 2.12, "fa": 0.9, "gp": 1.072, "bl": 0.0, "ds": 0.0, "txt": "That website has always been odd, they tend to cite very questionable if not downright false news outlets, such as this praise article \"\nHungarian government slam Facebook’s Oversight Board for having Soros-funded members.\".\n\nOr twisting what was said such as what media bias cite as an example of untrustworthiness, such as claiming \"United Nations was plotting a \"Code of Conduct\" to introduce increased censorship for online platforms.\n\", which was false, the closest thing was a\n brief proposing voluntary global principles for information integrity (aimed at combating hate speech and disinformation while explicitly upholding freedom of expression).\n\nhttps://mediabiasfactcheck.com/reclaim-the-net-bias/"}, {"id": 50664615, "au": "Peteragain", "dom": 11, "sr": 18, "sc": 8.77, "ep": 8.92, "bs": 0.0, "d": 1, "age": 5.98, "grav": 42.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 30, "k": 195, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.517, "fa": 1.37, "gp": 0.998, "bl": 0.0, "ds": 0.0, "txt": ">All I’ll say is, and I hope we can all agree on this at least: no country does anything for any other country purely out of the goodness of its heart ;-)\n\nWhere I used to work, there was a popular line: \"Americans. Lovely people; just no sense of foreign policy\"\nAt one time it was part of American identity to do the right thing and help others. I guess that's still true but what you tell your own people might be different to what you do in the interests of the country.\nRT is of course having a field day with this. Something to fact check:\nUSAID to Ukraine and the war effort:\n2006-2013 : 177M\n2014-2022 : 1.2B\n2022-2025 : 39.9B\nAnd much of that targets (apparently) your own people. Here in the UK we have the BBC and don't need to bribe big tech."}, {"id": 50664621, "au": "chasing", "dom": 354, "sr": 19, "sc": 8.3, "ep": 8.3, "bs": 0.0, "d": 1, "age": 5.97, "grav": 42.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 46, "qw": 0, "k": 9143, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://en.wikipedia.org/wiki/Climatic_Research_Unit_email_controversy"], "ig": 1.686, "fa": 0.96, "gp": 1.109, "bl": 0.0, "ds": 0.0, "txt": "This seems to bear a striking resemblance to other hit-jobs like the \"ClimateGate\" smear campaign from 2009. Drip out a small collection of emails that taken alone painted some sort of damning picture, hoping to change public perception.\n\nhttps://en.wikipedia.org/wiki/Climatic_Research_Unit_email_c...\n\nAnd that worked. So of course the tactic will get reused."}, {"id": 50662120, "au": "vel0city", "dom": 136, "sr": 20, "sc": 8.14, "ep": 8.8, "bs": 0.0, "d": 5, "age": 12.49, "grav": 123.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 9784, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.884, "fa": 0.95, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "And, when you point out that for a household making the median income of ~$87k and assuming no kids or other deductions you're talking about essentially $3/yr in your taxes to save several million children a year and give assistance to nearly 80 million people in help.to prevent the spread.\n\nIf they made the top of the bottom quartile (~$43k, single, no kids) then about $1.30/yr of taxes went towards this. Meanwhile those same taxpayers gave Elon Musk related businesses ~$2.70/yr.\n\nSave a few million kids, give a trillionaire another billion dollars. What do. ┐ (   ∵   ) ┌"}, {"id": 50664951, "au": "jabron", "dom": 205, "sr": 21, "sc": 8.14, "ep": 8.58, "bs": 0.0, "d": 3, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 16, "qw": 0, "k": 74, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.cia.gov/readingroom/docs/CIA-RDP90-01208R000100190003-0.pdf"], "ig": 0.258, "fa": 2.35, "gp": 0.88, "bl": 0.0, "ds": 0.0, "txt": "Here you can read about the factuality of this conspiracy straight from the horse's own website: https://www.cia.gov/readingroom/docs/CIA-RDP90-01208R0001001..."}, {"id": 50663803, "au": "holgerschurig", "dom": 238, "sr": 22, "sc": 7.96, "ep": 8.84, "bs": 0.0, "d": 3, "age": 7.89, "grav": 61.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 198, "qw": 6, "k": 314, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.851, "fa": 1.1, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "> 3. Aid diversion to designated terrorist groups\n\nThat doesn't wonder me at all. Since in many regions people have the power that one side names \"terrorists\" and the other side titles \"freedom fighers\".\n\nThe question is however: was this done intentionally? Then people should get put before court. Or did it happen because of circumstances, e.g. because the people in the are you wanted to help simply embezzled or coerced finds and the aid organization was either totally helpless. Or decided \"Okay, if we accept that 7% of our funds get embezzled than we can still use 93% for the cause\" (greatly simplified: a not to small amount always goes into bureaucracy).\n\nIn the 1980s the German Red Cross had several scandals ... and that was totally a fact. But int he same years, they transported also numerous people to the hospitals or delivered millions of blood conserves to hospitals.\n\nThat just what happens with (probably all) huge organizations: some do bad things (because humans are inherently bad) while the majority continue to do good things.\n\nExpecting EVERYONE in a huge organization only doing good things ... okay, we should have a high bar to aim for. But demanding it... and blaming the whole organization if that too-high-a-bar cannot be achieved --- that's merciless."}, {"id": 50661628, "au": "ETH_start", "dom": 375, "sr": 23, "sc": 7.63, "ep": 8.07, "bs": 0.0, "d": 0, "age": 13.93, "grav": 145.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 89, "qw": 0, "k": 656, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": ["https://x.com/MikeBenzCyber/status/2125416977514557454", "https://x.com/MikeBenzCyber/status/2125386556529627504"], "ig": 1.951, "fa": 0.96, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "\"GDI put nearly every major conservative news outlet in America on an ad blacklist to financially assassinate their businesses. GDI killed $200 million in ad revenue to media outlets reporting the wrong \"narratives.\" GDI was recommended to USAID by the US intelligence community.\"\n\nhttps://x.com/MikeBenzCyber/status/2125416977514557454\n\nWhat these files don't show is USAID funding GDI.\n\nWhat these files do show is:\n\n\"USAID brought in the Global Disinformation Index's executive director for a full 1-hour presentation to help USAID craft its social media censorship programs. Every USAID employee was invited to attend. Watch it here:\"\n\nhttps://x.com/MikeBenzCyber/status/2125386556529627504"}, {"id": 50664925, "au": "ethbr1", "dom": 12, "sr": 24, "sc": 7.58, "ep": 7.87, "bs": 0.0, "d": 2, "age": 5.3, "grav": 35.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 15919, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.629, "fa": 0.95, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "As an American, I'm happy the US spent $20B on Ukraine in both 2022 and 2023 (and 2024, but that was a loan funded by frozen Russian assets).\n\nWish we were still doing it.\n\nRussia deciding to invade a sovereign neighbor state to grab territory should face the harshest possible military, economic, and political consequences."}, {"id": 50660454, "au": "hirsin", "dom": 358, "sr": 25, "sc": 7.36, "ep": 8.02, "bs": 0.0, "d": 0, "age": 16.81, "grav": 196.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 2342, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://news.ycombinator.com/item?id=23276430"], "ig": 1.524, "fa": 0.96, "gp": 1.172, "bl": 0.0, "ds": 0.0, "txt": "Notably this site does not have an \"about\" page or provide any details about who the authors are (besides one being obviously Claude).\n\n6 years ago this was also called out as a concern https://news.ycombinator.com/item?id=23276430\n\nAfter this dump of nothing burger dressed up as scandal I feel like it's safe to call it a right-wing/\"libertarian\" disinfo campaign aligned with the Trump movement."}, {"id": 50661763, "au": "BurningFrog", "dom": 338, "sr": 26, "sc": 7.17, "ep": 7.17, "bs": 0.0, "d": 0, "age": 13.6, "grav": 140.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 25485, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://dallasexpress.com/national/after-usaid-cuts-the-left-lost-seven-finished-presidential-races-in-latin-america-a-closer-look/"], "ig": 1.173, "fa": 0.9, "gp": 1.277, "bl": 0.0, "ds": 0.0, "txt": "The most fun anti USAID talking point is that after it was closed the left in Latin America have lost all elections, while before it won most of them.\n\nThis is factually true, but the implication that USAID used to steal those elections has no documented evidence I'm aware of.\n\nhttps://dallasexpress.com/national/after-usaid-cuts-the-left..."}, {"id": 50663206, "au": "dofm", "dom": 127, "sr": 27, "sc": 7.07, "ep": 9.43, "bs": 1.7, "d": 8, "age": 9.43, "grav": 80.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "epistemic_gold", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 2.133, "fa": 0.95, "gp": 1.18, "bl": 0.64, "ds": 0.0, "txt": "And you will help stop the virus crossing land borders in Africa how? Just not bother?\n\nIf someone with a viral haemorrhagic fever travels from, say, Botswana to Kinshasa in DR Congo… That journey overland is fully possible within Ebola's incubation time. 21 million people live in that one city, and stopping them travelling onward is just not possible.\n\nWill you just abandon Africa (including the white people you let in) to this, every time there's an outbreak? Pull up the drawbridge? The US does trade with Africa, you know.\n\nAgain… do people not grasp that the health security of the United States (and every other western country) is partially underpinned by this work?\n\nThe US consumer has paid out an extra $165B as a result of the oil price spike caused by the Iran war (which cost another $48B to wage). The US consumer has likely paid over $200B extra in consumer costs per year since Trump's tariffs were rolled out.\n\nUSAID is by contrast incredibly cheap — $32B to $35B per year."}, {"id": 50664827, "au": "_djo_", "dom": 231, "sr": 28, "sc": 6.64, "ep": 7.08, "bs": 0.0, "d": 4, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 4704, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.497, "fa": 0.68, "gp": 1.12, "bl": 0.0, "ds": 0.0, "txt": "Only if you were ignorant of current affairs. As part of its efforts to join the EU, going back to 2010, Ukraine was slowly (and sometimes with setbacks) implementing anti-corruption measures and controls. The same way Poland, Slovakia, Hungary, and other deeply corrupt former Soviet states had to.\n\nBy 2022 when the war started they’d made significant progress, being measurably less corrupt than they once were with more effective anti-corruption agencies, most government services being digitised, and stronger auditing. That’s what allowed the EU, UK, and US to be able to provide it with both financial and material support and be able to conduct regular audits that provide a reasonable accounting of what’s gone where.\n\nCorruption isn’t eliminated by any means, and in any case becomes harder to control in an all-out war, but any analysis that fails to understand the reforms that took place and the constant tension and back and forth between the country’s anti-corruption agencies and state institutions is a flawed one."}, {"id": 50663350, "au": "3RTB297", "dom": 353, "sr": 29, "sc": 6.58, "ep": 10.53, "bs": 3.58, "d": 0, "age": 8.99, "grav": 74.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 427, "qw": 0, "k": 311, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.805, "fa": 1.79, "gp": 0.817, "bl": 1.35, "ds": 0.0, "txt": "I've done a fair bit of work with USAID over the years. I personally know some of the people on the CC lines in some of these emails (which isn't to say we're pals or anything). And I have my issues with USAID, I think even most USAID staff did, but I've also seen a lot of the good work they did on the ground.\n\nTo help assist in the outsider perspective, here's a few things to keep in mind about this:\n\n- This is, ironically or not, a classic disinformation tactic. A narrow slice of bias-fitting documents that present one narrative, that an entire agency's main focus was nefarious doings. 248 documents from an agency with 60 years of history and more than 10,000 staff and contractors around this time? USAID likely produced 248 emails a second at any point in 2022. Best they can do is some emails and a few PPTs?\n\n- For someone that controls the DOJ, it seems like maybe you would have something to prosecute here and then prosecute people for it, no? So this is literally just conspiracy theory fuel, not evidence of much in the way of laws broken or crimes committed.\n\n- The administration also had the last 2 years to ask any of these people to testify in front of a GOP-controlled Congress. Why skip that and wait all this time to smear...a dozen people directly, and anyone with \"USAID\" on their resume looking for a job?\n\n- USAID senior leadership included political appointees. So the"}, {"id": 50659411, "au": "krapp", "dom": 156, "sr": 30, "sc": 6.44, "ep": 7.54, "bs": 0.0, "d": 4, "age": 18.63, "grav": 232.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.478, "fa": 0.95, "gp": 0.941, "bl": 0.0, "ds": 0.0, "txt": "The premise that anyone is (sorry was) paying a cruel and burdensome amount of their income into USAID - and somehow only USAID - through their taxes is absurd.\n\nThe number I've seen for the yearly cost to the average American taxpayer for USAID was $38.00. That versus $1300 towards Pentagon defense contractors or $3,700 for military procurement.\n\nThis was never seriously about the cost to the taxpayer."}, {"id": 50665585, "au": "mschuster91", "dom": 32, "sr": 31, "sc": 6.42, "ep": 7.3, "bs": 0.0, "d": 1, "age": 3.74, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 92, "qw": 15, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": ["https://www.tagesschau.de/faktenfinder/entwicklungshilfe-radwege-peru-100.html"], "ig": 1.846, "fa": 1.04, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> A number of comments categorically deny that USAID has any benefit for the average US taxpayer.\n\nThat is because they do not realize the immense amount of \"soft power\" the US and Western world in general once had. We've thrown away all of that in the name of \"saving taxpayer dollars\", \"building bicycle paths in Peru is woke\" [1] and whatnot. And look where it got us on the international stage, e.g. in UN votes - Africa is now consistently voting against our interests, as Russia and China filled the gap we left.\n\nMeanwhile, the US has Hegseth blathering about \"hard power\". What a fucking moron.\n\n[1] a popular nutjob myth in Germany - https://www.tagesschau.de/faktenfinder/entwicklungshilfe-rad..."}, {"id": 50661552, "au": "Terr_", "dom": 149, "sr": 32, "sc": 5.95, "ep": 7.27, "bs": 0.0, "d": 4, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 28451, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.795, "fa": 0.5, "gp": 1.121, "bl": 0.0, "ds": 0.0, "txt": "Split-response here, because it depends on what implicit arguments people have in mind.\n\n1. As a general rule for discussing tax burdens: Absolutely, yes, poor people in the US pay a great deal of their income in overall taxes, and people grossly over-weigh Federal-Income while ignoring all the less-visible ones.\n\n2. For the merits of USAID: That's a bit of a red-herring, since the point is that US-poor-people did not pay for disease prevention among foreign-poor-people. That fact helps puncture a certain set of claims in the style of \"took from X to help Y\"."}, {"id": 50667219, "au": "lo_zamoyski", "dom": 13, "sr": 33, "sc": 5.78, "ep": 6.44, "bs": 0.0, "d": 2, "age": 0.85, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 2050, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.737, "fa": 0.68, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "Doing “the right thing” is hardly “American”, as much as that flatters a cohort molded by postwar propaganda. It’s the foundation of the moral life! Everyone claims to be doing the right thing; whether what you’re doing is the right thing is another matter.\n\nSo what’s more interesting are the sensibilities people have broadly developed re: “the right thing”, and predictably, these are molded and shaped in various ways, for good or for ill. Where something as grand as national identity is concerned in a country with such a thin common culture, one cannot discount the effect of oligarchic propaganda that flatters the ego and plays on the frustrated desire to belong on the one hand and enrolls that ego in cheering on questionable activity on the other.\n\nLook at historical support among Americans for the bombing of Hiroshima and Nagasaki. In 1945, it was something like 85%, and it remained relatively high (50+%) into the 1990s. People would get aggressive and accuse you of being “un-American” if you questioned the legitimacy of what were morally war crimes, and today, legally war crimes."}, {"id": 50664522, "au": "paganel", "dom": 18, "sr": 34, "sc": 5.68, "ep": 6.56, "bs": 0.0, "d": 1, "age": 6.2, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 15, "k": 14398, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.773, "fa": 0.7, "gp": 0.277, "bl": 0.0, "ds": 0.0, "txt": "> Impact of USAID on the average US taxpayer as supported by evidence and empirical studies”\n\nDid just that with ChatGPT, nothing about maintaining US's imperial dominance, so a lot of crap, I would say.\n\nBack to USAID, good fucking riddance, Samantha Power was the perfect representation of the Peter principle, i.e. dumb as hell and yet she had managed to reach quite a powerful position.\n\nAlso on the subject, most probably the average American taxpayer would have been better off with this imperial control tool still doing its job, but that's life, sometimes you win some, sometimes you lose some (look for example at how the Brits had managed to self-implode their Empire in the inter-war period). The US has imperially over-extended."}, {"id": 50662549, "au": "somenameforme", "dom": 264, "sr": 35, "sc": 5.57, "ep": 6.67, "bs": 0.0, "d": 3, "age": 11.34, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.917, "fa": 0.28, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "One reason I supported the ending of USAID is because what you said above is mostly true.\n\nI'm drawn to the old parable of 'give a man a fish, and you feed him for a day - teach a man to fish and you feed him for life.' China is 'teaching Africa to fish' in no small part with the aim of getting lots of cheap fish for themselves in the future. But even if there are ulterior motives, at the end of the day - Africa still learns how to fish. By contrast the US was constantly 'giving Africa a fish' precisely because the threat of no longer giving them that fish could be used to coerce them in the future, as you pointed out.\n\nI not only find the 'US style' of influence to be significantly more amoral, but it also ends up costing vastly more. China's Belt and Road Initiative is being largely driven by private enterprise and loans. The cost to China itself is quite low, with the expected rewards to be quite high. Whereas the US system was entirely government driven, extremely expensive, and only had a reward in forms of potential coercion. I mean it's just doesn't seem right, at all, to me."}, {"id": 50662252, "au": "woodpanel", "dom": 352, "sr": 36, "sc": 5.54, "ep": 5.98, "bs": 0.0, "d": 0, "age": 12.15, "grav": 117.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 2635, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 2.015, "fa": 0.0, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "Unfortunately, ppl will dismiss this as „trump did this, so why should I amplify this?“ - but for me, as a Non-US citizen, even benign looking emails in there open up entire rabbit holes into how American global political influence networks „work“ their „allies“.\n\nPick an email concerning your country, google some of the unsuspecting looking „N“GOs mentioned in them - and there’s a high chance it’s basically DC operatives handing out jobs to specific political operatives in your country.\n\nFor Germany it really gives a glimpse into how far our CDU and Greens are American proxies.\n\nNow Americans might wonder why should they care? well because these networks eventually also influence your political discussions, too, whether something is promoted by „a study“ or a „Finding“ is presented by a „European Research institute“ or a podcast invites some „known Expert“."}, {"id": 50664627, "au": "ezst", "dom": 21, "sr": 37, "sc": 5.43, "ep": 6.75, "bs": 0.0, "d": 1, "age": 5.97, "grav": 41.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 8, "k": 2072, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.708, "fa": 0.64, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "Just want to mention the caveat that\n\n> pose their favorite chatbot(s) this very neutral prompt\n\n..presupposes a certain amount of correctness and neutrality from said chatbot, the former being impossible considering current technology's limitations, and the latter being generally a non-goal, considering today's main providers in this space, and their political entanglements and the ramifications thereof."}, {"id": 50662416, "au": "aliasxneo", "dom": 47, "sr": 38, "sc": 5.31, "ep": 6.26, "bs": 0.0, "d": 5, "age": 11.66, "grav": 110.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2451, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.963, "fa": 0.0, "gp": 1.137, "bl": 0.0, "ds": 0.0, "txt": "Right after describing the House Judiciary Chairman's request for USAID communications on content moderation and mis/dis/malinformation, and its coverage in the Washington Post, GC's 'HYGIENE' list tells staff not to write that a matter is too sensitive for email, to use substitute terms (e.g., 'peer competitor'), to avoid 'red flag' words such as 'influence, change, shape', and 'If in doubt, pick up the phone.' Whether and to whom it was delivered is not documented in this dump."}, {"id": 50665791, "au": "braiamp", "dom": 299, "sr": 39, "sc": 4.76, "ep": 5.64, "bs": 0.0, "d": 0, "age": 3.29, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 1429, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.894, "fa": 0.0, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "I will react to this framing with a maxim: the signs of a good administrador is one that isn't noticed.\n\nThe fact that the USAID did so much without being thrown in the spotlight means that the USAID was doing effectively more good that harms as far as everything goes. An administrator that is permanently on the news cycle is sign of a boneheaded course of action.\n\nWhen you hear expressions like \"the WaPo test\" it's meant to enforce at least a view of propriety in business dealings, because even good actions with good intentions can't be properly communicated specially when the other side is uncharitable reading your words. Which is essentially what this website has done. It took a expression that is used as heuristic for evaluating compliance in private and public business and turning it into a sign of inpropriety and painted every other document in the same light. Do you think that good news about your actions will amount to be published in the front page of the washington post? Be honest about it"}, {"id": 50663702, "au": "da_chicken", "dom": 54, "sr": 40, "sc": 4.62, "ep": 6.16, "bs": 0.0, "d": 6, "age": 8.12, "grav": 64.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 6241, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.41, "fa": 0.34, "gp": 1.294, "bl": 0.0, "ds": 0.0, "txt": "Strictly speaking, as someone that has worked in and for government organizations for the past 16 years, \"don't document the things you're doing,\" is already unethical by itself. I also have to think it's somewhere between frequently and always illegal.\n\nLet's be very plain: This doesn't stop being unethical if the outcome of what you're doing is good. The ethics of operating this way is independent of the morality of the outcome. By itself it's already unethical to hide your actions because the legislature that's creating these organizations and the work they do builds in to the laws the auditing, oversight, and accountability requirements necessary for spending tax dollars. If you get a budget of tax dollars, you're going to get someone checking on what you're doing with it."}, {"id": 50662333, "au": "aliasxneo", "dom": 60, "sr": 41, "sc": 4.56, "ep": 6.1, "bs": 0.0, "d": 2, "age": 11.88, "grav": 113.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 75, "k": 2451, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.24, "fa": 0.76, "gp": 0.701, "bl": 0.0, "ds": 0.0, "txt": "> I'm not sure about briefing on the Info Resilience Council specifically - we're under instructions to keep that extremely non-public (due to a PR disaster that DHS experienced over a similar body), but ACVFA is kind of a gray area.\n\n> I think the biggest issue as we saw with DHS is how this issue is playing out on the right leading to US elections. This only confirms the point that we need to get through the midterms without any leaks!\n\nI believe both quotes were in reference to public backlash over the DHS Disinformation org that had a very short life span in 2022. So the implication is what USAID was doing needed to stay hidden from the public to avoid the same fate."}, {"id": 50662337, "au": "shimman", "dom": 172, "sr": 42, "sc": 4.53, "ep": 6.07, "bs": 0.0, "d": 2, "age": 11.87, "grav": 113.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 2056, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.764, "fa": 0.34, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "The US taxpayers have wasted trillions of military welfare and all we have to show for it is no medicare for all, no universal childcare, and income inequality is at all time highs all while death merchants make sure they keep taking out tax dollars because they need it to defend us from the next nonexistent threat while engaging in US imperialism, but yeah buddy the budget to help people deal with HIV/AIDs care + prevention is the true atrocity of the working man.\n\nGive me a fucking break.\n\nYou're unhinged because you think USAID is a poor use of tax dollars when the Pentagon has pissed away nearly $30 trillion over a 50 year period with nothing to show for it."}, {"id": 50664202, "au": "remus", "dom": 84, "sr": 43, "sc": 4.49, "ep": 6.04, "bs": 0.0, "d": 2, "age": 6.89, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 28, "k": 3124, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.311, "fa": 0.7, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "> So in one of the most critical countries for testing, there has been no observable impact from the end of USAID, at least in relation to HIV/AIDS.\n\nI think you're drawing very strong conclusions from a relatively basic analysis. For example, you mention that Nigeria is relatively well developed and has good data, so you could argue that they are also relatively well placed to fill gaps left by USAID. Is this the case for poorer countries where USAID was operating?"}, {"id": 50661631, "au": "da_chicken", "dom": 43, "sr": 44, "sc": 4.41, "ep": 5.52, "bs": 0.0, "d": 1, "age": 13.93, "grav": 145.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 16, "k": 6241, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.084, "fa": 0.42, "gp": 1.221, "bl": 0.0, "ds": 0.0, "txt": "> The page is presenting this as if it's bad, but I struggle to understand why it's bad.\n\nBecause we're a republic. The government is ostensibly \"of the People, by the People, and for the People.\" That's also why it's rule of law, and why we have a representative democracy. The affairs of state are public.\n\nPointing out the places where we've let government fail is not an indictment of the founding ideals."}, {"id": 50662455, "au": "howunfortunate", "dom": 221, "sr": 45, "sc": 4.21, "ep": 5.75, "bs": 0.0, "d": 5, "age": 11.58, "grav": 109.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 18, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.197, "fa": 0.42, "gp": 1.197, "bl": 0.0, "ds": 0.0, "txt": "> In your world view, why open embassies? Why let people in and out of the country at all?\n\nBecause I don't believe in a zero sum world. Some - many! - interactions between nations are genuinely mutually beneficial.\n\nUSAID very explicitly is not that, it's just charity. That's best left to voluntary private action."}, {"id": 50662050, "au": "johnnyanmac", "dom": 181, "sr": 46, "sc": 4.14, "ep": 6.31, "bs": 0.85, "d": 10, "age": 12.73, "grav": 126.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.739, "fa": 0.34, "gp": 0.866, "bl": 0.32, "ds": 0.0, "txt": "The problem with modern medicine and education is that 1st world countries do such a good job treating 90% of disease that future generations can turn around and call AIDS a \"niche disease\". All in a time where ones parents (let alone grandparents) remember a very different story.\n\nI won't bother addressing the rest of your comment. You clearly don't understand the US budget so no point trying to have a conversation with someone arguing for 'unlimited funds to other countries'."}, {"id": 50661958, "au": "doom2", "dom": 377, "sr": 47, "sc": 4.04, "ep": 5.07, "bs": 0.0, "d": 1, "age": 13.01, "grav": 131.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 793, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.437, "fa": 0.28, "gp": 0.616, "bl": 0.0, "ds": 0.0, "txt": "This person would be more credible if their \"Foundation for Freedom Online\" organization didn't seem solely focused on censorship of conservatives. Despite claiming to be nonpartisan, there's a severe lack of evidence that they care to fight for freedom online regardless of who might be censoring who."}, {"id": 50663043, "au": "vel0city", "dom": 141, "sr": 48, "sc": 3.99, "ep": 7.23, "bs": 1.7, "d": 9, "age": 9.86, "grav": 85.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 9784, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.335, "fa": 0.95, "gp": 0.952, "bl": 0.64, "ds": 0.0, "txt": "If your argument is that it's a big number spent, you're not really looking at things in context.\n\nTexas spent nearly $3B feeding kids in schools last school year. Is that expensive? Three billion is a lot of money, but is that expensive? How about with the context the cost per meal was about $3.30, including the cost of the food service people to prepare and serve it? Were those expensive meals? For the median Texas taxpayer such payments cost them ~$5/year in taxes. Is $5/year to give  846,738,047 meals to kids \"expensive\"?\n\nYou wouldn't believe how many meals we could give kids for how much we spent on just blowing up a school. Somewhere around 1,700,000 meals for kids for a tomahawk double strike."}, {"id": 50667542, "au": "mapontosevenths", "dom": 307, "sr": 49, "sc": 3.91, "ep": 5.3, "bs": 0.0, "d": 5, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.795, "fa": 0.0, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "It was USAID who collected the only reliable global excess mortality numbers! It was one of the first things they cut, and I don't imagine that was an accident.\n\nUSAID's Demographic and Health Surveys (DHS) Program filled the huge gap in reporting from the most vulnerable nations where they don't have official death certificates. The United Nations, World Health Organization (WHO), UNICEF, and the World Bank all used it.\n\nGates temporarily funded some parts of it, but there's no long term plan and it was only bits and pieces that survived thanks to Gates."}, {"id": 50663703, "au": "holgerschurig", "dom": 237, "sr": 50, "sc": 3.91, "ep": 8.5, "bs": 3.05, "d": 3, "age": 8.12, "grav": 64.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 631, "qw": 68, "k": 314, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.803, "fa": 0.96, "gp": 1.051, "bl": 1.15, "ds": 0.0, "txt": "First thing: thanks for this list. Even if you made it with LLM help, it was some work.\n\nI however object to one of your items. And the source for this objection is that I actually know transgender issues a bit: i have person with that in my extended family. So let's first quite you:\n\n> 6. Mission creep into progressive social engineering at public expense\n>\n> Documented awards include a DEI musical in Ireland, a transgender opera in Colombia, a\n> transgender comic in Peru, LGBT activism and sex-change funding in Guatemala, and DEI\n> workplace programs in Serbia. Individual line items are often small, but they illustrate\n> systematic prioritization of ideological goals over traditional development metrics. Local\n> cultural resistance is treated as a problem to be managed rather than a constraint.\n\nYou started the headline directly with \"social engineering\" and later you indirecly claim that doing anything transgender related is \"ideological goals\". I'm always puzzled how some people can come up with. To explain, let me share a bit of this person I saw grow up.\n\nWhen the person was small, it was quite girly. Pink clothes, some \"this is my most leved dress\". This ended at about 5 years. During the next few years the person got a little bit more male, but nothing out of the order. For example, it asked for a boxing (punching) sack. In my culture, this isn't THAT female, but it's a"}, {"id": 50649245, "au": "enjoyyourlife", "dom": 363, "sr": 51, "sc": 3.83, "ep": 4.93, "bs": 0.0, "d": 0, "age": 39.53, "grav": 818.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 1098, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://www.southshorepress.com/national/usaid-files-show-talks-with-meta-youtube-and-google-on-disinformation-and-takedo-fdda29b8"], "ig": 1.006, "fa": 0.62, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "For https://www.southshorepress.com/national/usaid-files-show-ta...\n\nIt almost seems like the purpose of USAID was to promote Meta, YouTube and Google in foreign companies. USAID was essentially doing work for them by paying moderators"}, {"id": 50661685, "au": "patmorgan23", "dom": 270, "sr": 52, "sc": 3.81, "ep": 5.35, "bs": 0.0, "d": 4, "age": 13.8, "grav": 143.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 1723, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "Because then the goodwill wouldn't acrue to the US government and it couldn't be used as part of trade negotiations. USAID reduces human suffering, prevented war and civil striffe in several regions and increased the ability of US business to trade abroad.\n\nI think the political environment that leads to USAID being cut clearly shows that the government should be doing more the solve the domestic economic pain being felt by most Americans. But reallocating USAIDs budget isn't enough to do that and harms the US's ability to get things done on the international stage in the long term."}, {"id": 50662706, "au": "vel0city", "dom": 139, "sr": 53, "sc": 3.8, "ep": 5.34, "bs": 0.0, "d": 7, "age": 10.93, "grav": 100.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 265, "qw": 35, "k": 9784, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 0.991, "fa": 0.7, "gp": 0.704, "bl": 0.0, "ds": 0.0, "txt": "> Don’t you think he has saved the taxpayers more than you has taken?\n\nI'd need some evidence of this. And FWIW, post-DOGE government is spending more than pre-DOGE, so if your thought was DOGE saved money it saved negative dollars in the end.\n\nI'm not arguing he hasn't given taxpayers any value for what they've spent. I'm happy for the good science missions supported by SpaceX, and I hope for good missions in the future. I agree a lot of those early loans ended up spurring a good bit of the state of EVs today. If they're still getting grants for EV charging infrastructure , good on them, I'm glad for the investment. I'm not arguing those funds have been wasted, just wanting to point out relative amounts to other salient spendings we as a society just choose to do.\n\nBut at the same time we're then trying to tie that back into bang for buck for less well off taxpayers. How much do they give a shit about space projects or EV charging or whatever, if asking for a couple of dollars for literally saving millions of children a year is just asking waaaaay too much.\n\n> could be twice as expensive\n\n> i have no basis for that\n\nSo just pulling thoughts out of nowhere. Great way to form actual policy thoughts. Excellent insight. Could be twice as expensive. Could be a dozen times as expensive. Could be astoundingly cheap. Who knows. But you feel like it's expensive, without any data backin"}, {"id": 50665263, "au": "jfyi", "dom": 58, "sr": 54, "sc": 3.79, "ep": 5.33, "bs": 0.0, "d": 1, "age": 4.55, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 13, "k": 317, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.348, "fa": 0.42, "gp": 0.669, "bl": 0.0, "ds": 0.0, "txt": "> I'm struggling to understand exactly what this website is claiming the government did wrong.\n\nIt's not making a claim. It's laying out information in a manner to create a narrative.\n\nThat narrative is that USAID is a propaganda arm of the US government in a Chomsky-esque manner (see \"Manufacturing Consent\"). This is probably not entirely wrong, but the scale of it is highly obfuscated by this particular dump."}, {"id": 50659452, "au": "dofm", "dom": 91, "sr": 55, "sc": 3.74, "ep": 5.28, "bs": 0.0, "d": 2, "age": 18.59, "grav": 231.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 1.238, "fa": 0.0, "gp": 1.634, "bl": 0.0, "ds": 0.0, "txt": "Isn't this also true of topics like \"roads\", \"clean air\", \"postal service\"?\n\nAt some point, tax money is spent on a balance of priorities, and global HIV prevention is one of the easiest things ever to justify, because it is incredibly cost-effective.\n\nHIV/AIDS is a disease that, for various interlocking reasons, weighs most heavily on the poor and those scraping by (even for those who do not have the primary infection and who would avoid it). You do, in fact, have to be quite nuts to believe that cheap interventions around the world that stop a disease of poverty at home are a bad idea."}, {"id": 50659705, "au": "jryle70", "dom": 226, "sr": 56, "sc": 3.74, "ep": 5.17, "bs": 0.0, "d": 2, "age": 18.18, "grav": 223.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 0, "k": 731, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": ["https://hn.algolia.com/?dateEnd=1735344000&dateRange=custom&dateStart=602121600&page=0&prefix=false&query=usaid&sort=byDate&type=comment"], "ig": 1.037, "fa": 0.62, "gp": 0.664, "bl": 0.0, "ds": 0.0, "txt": "You have short memory. Check out how HN felt about USAID until two years ago. Skeptical, mostly negative. Yet now they became a rallying point because they were the target of DOGE. That shows how fickle HN's opinion is.\n\nhttps://hn.algolia.com/?dateEnd=1735344000&dateRange=custom&..."}, {"id": 50663953, "au": "keeda", "dom": 1, "sr": 57, "sc": 3.74, "ep": 5.06, "bs": 0.0, "d": 0, "age": 7.48, "grav": 57.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 205, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "countries_usa", "flbl": "Countries & Usa (Aid)", "urls": [], "ig": 0.962, "fa": 0.28, "gp": 1.38, "bl": 0.0, "ds": 0.0, "txt": "A number of comments categorically deny that USAID has any benefit for the average US taxpayer. In this day and age of LLMs it is unfathomable that people can still make such absolute statements.\n\nInstead of pasting what I’ve found out, which is too nuanced to be contained in an HN comment and will inevitably tainted by my own biases, I would strongly recommend folks to pose their favorite chatbot(s) this very neutral prompt: “Impact of USAID on the average US taxpayer as supported by evidence and empirical studies”\n\nNote it does not specify if the impact is good or bad, and explicitly demands evidence, which I’ve found is generally the best way to get all sides of the issue.\n\nThen go from there and dig into any fact or number or study you want. Challenge the chatbot(s) with your doubts and skepticism to understand the limits of this evidence. Ask about economic returns, US exports, domestic health and disease prevention, national security, historical evidence, and anything that occurs to you. And then draw your own conclusions.\n\nAll I’ll say is, and I hope we can all agree on this at least: no country does anything for any other country purely out of the goodness of its heart ;-)"}, {"id": 50661660, "au": "ETH_start", "dom": 59, "sr": 58, "sc": 3.74, "ep": 4.99, "bs": 0.0, "d": 1, "age": 13.85, "grav": 144.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 656, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 1.415, "bl": 0.0, "ds": 0.0, "txt": "This was in the context of congressional scrutiny of USAID working with U.S. platforms on content moderation and its \"trusted partners\" program. And it wasn't simply encouraging them to be on good behavior, it was also 'avoid emails and do phone calls instead'."}, {"id": 50659035, "au": "mapontosevenths", "dom": 300, "sr": 59, "sc": 3.74, "ep": 4.84, "bs": 0.0, "d": 0, "age": 19.18, "grav": 243.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.015, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "I don't understand this. It seems that USAID is being accused of something nefarious. The linked page doesn't explain what the accusation is, or why anyone should care.\n\nDoes this go back to Musks chainsaw dance and all the kids that didn't get to eat?"}, {"id": 50661952, "au": "pram", "dom": 203, "sr": 60, "sc": 3.74, "ep": 4.64, "bs": 0.0, "d": 3, "age": 13.04, "grav": 131.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 8819, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.613, "fa": 0.0, "gp": 0.586, "bl": 0.0, "ds": 0.0, "txt": "USAID was the primary conduit for resources to Hmong fighters in Laos/Golden Triangle/Plain of Jars during the Vietnam War. The CIAs so called “Secret War.” That isn’t a conspiracy theory.\n\nI think the problem is assuming everything they did was some kind of cover operation lol"}, {"id": 50660353, "au": "dofm", "dom": 102, "sr": 61, "sc": 3.74, "ep": 6.63, "bs": 2.12, "d": 7, "age": 16.98, "grav": 200.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 19, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": ["https://x.com/Jawwwn/status/2125708468132962412"], "ig": 1.051, "fa": 1.04, "gp": 0.826, "bl": 0.8, "ds": 0.0, "txt": "> Are there a significant number of taxpayers unwilling to fund foreign AIDS interventions but happy to pay for Americans' PrEP?\n\nAnd how many don't work at Palantir or SpaceX? ;-)\n\nhttps://x.com/Jawwwn/status/2125708468132962412\n\n(This comment is interesting to me, because he brings up Oliver North when talking about USAID. I wonder if he brings up Oliver North when he's talking about Jensen Huang)"}, {"id": 50659051, "au": "asveikau", "dom": 82, "sr": 62, "sc": 3.74, "ep": 4.48, "bs": 0.0, "d": 0, "age": 19.15, "grav": 242.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 0.519, "fa": 0.28, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "USAID did a lot of things.  Some dubious, some obviously good.  For example, I think you'd have to be a little unhinged to think their global funding for HIV/AIDS wasn't necessary."}, {"id": 50663031, "au": "howunfortunate", "dom": 219, "sr": 63, "sc": 3.74, "ep": 5.25, "bs": 0.85, "d": 5, "age": 9.88, "grav": 86.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 26, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.262, "fa": 0.42, "gp": 0.75, "bl": 0.32, "ds": 0.0, "txt": "> Yes you, staring at the screen right now, you and everybody in your community will live a better life if distant people in Africa get less HIV.\n\nLook, I'm a nice guy. I don't want people to suffer and die because of my inaction. It's good to help other humans.\n\nBut this is so blatantly, so obviously, so transparently untrue that I feel deeply insulted you would even try to get me or anyone else to believe it. You don't believe it. So please spare me."}, {"id": 50662234, "au": "transcriptase", "dom": 230, "sr": 64, "sc": 3.74, "ep": 4.29, "bs": 0.0, "d": 3, "age": 12.2, "grav": 118.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 4453, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "government_pay", "flbl": "Government & Pay (Foreign)", "urls": [], "ig": 1.637, "fa": 0.0, "gp": 0.303, "bl": 0.0, "ds": 0.0, "txt": "It’s somewhat analogous to how it was universally agreed across the political spectrum that Ukraine was one of the most corrupt nations in the world, and couldn’t be trusted with aid money because it would be embezzled by government officials and spent on seaside mansions and supercars elsewhere in Europe.\n\nThen Russia invaded and suddenly everyone was supposed to instantly begin believing the exact opposite and question nothing."}, {"id": 50659159, "au": "sublinear", "dom": 243, "sr": 65, "sc": 3.74, "ep": 4.27, "bs": 0.0, "d": 1, "age": 18.96, "grav": 239.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 4179, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "usaid_left", "flbl": "Usaid & Left (Elections)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.763, "bl": 0.0, "ds": 0.0, "txt": "Was USAID really the only option back then? That's not an answer I expect anyone to have, but it's worth thinking about all the other ways we can achieve the same results. We have to be relentless in thinking this way indefinitely finding new ways and means. This coordination process is the rest of the work that was clearly going ignored for too long.\n\nYou'd have to be a little unhinged to not realize that being too consistently reliant on the same institutions creates these problems over time."}, {"id": 50659574, "au": "SvnewbKfvFxRPZG", "dom": 236, "sr": 66, "sc": 3.74, "ep": 6.68, "bs": 2.52, "d": 2, "age": 18.4, "grav": 227.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 805, "k": -5, "kpp": -1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.919, "fa": 0.42, "gp": 0.672, "bl": 0.95, "ds": 0.0, "txt": "The ones trying to minimize USAID’s documented role in censorship infrastructure, aid diversions to al-Qaeda affiliates, covert political ops like ZunZuneo, and child-abuse scandals in funded programs are mostly Democrats and low-information partisans who treat any criticism as a team attack. It’s disgusting how casually they wave away the primary sources, OIG reports, DOJ indictments, and the USAID Files themselves just to keep the narrative clean.\n\n---\n\n1. Covert political interference and soft regime-change operations\n\nThe clearest case is ZunZuneo (“Cuban Twitter”), 2010–2012. USAID created a secret text-messaging network via shell companies, built an audience with sports and weather, then planned to introduce political content to spark “smart mobs” and “renegotiate the balance of power.” Users were never told it was U.S.-funded; their data was collected. The Associated Press investigation documented the operation in detail. Parallel patterns appear in funding for Juan Guaidó networks in Venezuela, pre-2014 opposition infrastructure in Ukraine, and alleged efforts against governments in Bangladesh and El Salvador. These are documented uses of development money for political outcomes preferred by U.S. administrations.\n\n2. Building a global media and censorship apparatus\n\nUSAID has routed roughly $400–500 million through Internews Network (WikiLeaks and USAspending data). Int"}, {"id": 50659523, "au": "zzrrt", "dom": 163, "sr": 67, "sc": 3.74, "ep": 4.13, "bs": 0.0, "d": 2, "age": 18.48, "grav": 229.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 371, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "organization_deaths", "flbl": "Organization & Deaths (Cuts)", "urls": [], "ig": 1.076, "fa": 0.0, "gp": 1.106, "bl": 0.0, "ds": 0.0, "txt": "This isn't the real reason they axed it though, or at least the administration isn't all on the same page. If they wanted to help struggling taxpayers, they would pay the \"DOGE dividends\" they promised out of the billions they supposedly saved. Even the tax cuts aren't funded substantially by USAID cuts."}, {"id": 50662687, "au": "jongjong", "dom": 350, "sr": 68, "sc": 3.74, "ep": 4.06, "bs": 0.0, "d": 0, "age": 10.97, "grav": 100.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 3072, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_taxes", "flbl": "Money & Taxes (Country)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "The problem with these emails is that they're basically messages with a goal of bringing organizations and countries into alignment.\n\nIndividually, they're mundane, but together, they represent a control structure operating outside of the law of any country.\n\nIt's not appropriate that taxpayer should be subsidizing these activities. In fact, it should run afoul o
