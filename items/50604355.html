 {"id": 50634453, "au": "gaoshan", "dom": 47, "sr": 89, "sc": 1.96, "ep": 2.53, "bs": 0.0, "d": 3, "age": 6.85, "grav": 50.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2090, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.663, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My local Walmart has whole canned tomatoes (28oz at $1.53) for what converts to €0.84 per 500ml. That's probably the lowest price you could find but it's easy to get them in that price range."}, {"id": 50637911, "au": "asveikau", "dom": 30, "sr": 90, "sc": 1.96, "ep": 2.46, "bs": 0.0, "d": 3, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The US parmigiano/parmesan market is an interesting outcome for this, you still see some cost stratification.\n\nYou do have cheap cheese, but the quality isn't there. Then you have high end domestic brands like Bel Gioioso. They're still not as good as the imported one, but somewhere in between in both cost and quality."}, {"id": 50630316, "au": "CoastalCoder", "dom": 158, "sr": 91, "sc": 1.96, "ep": 2.46, "bs": 0.0, "d": 3, "age": 11.41, "grav": 107.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 7875, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "No, but if you're willing to assume that a given brand hasn't enshitified since your last purchase, then it might be somewhat predictable based on your previous taste test."}, {"id": 50637485, "au": "jubilanti", "dom": 120, "sr": 92, "sc": 1.96, "ep": 2.43, "bs": 0.0, "d": 3, "age": 1.52, "grav": 9.7, "surf": 9.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1382, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.033, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "San Marzano DOP requires not just the origin location, but hand picking, peeling by steam or lye, and no added tomato paste or puree to thicken, even from other San Marzanos."}, {"id": 50636480, "au": "malfist", "dom": 96, "sr": 93, "sc": 1.96, "ep": 2.37, "bs": 0.0, "d": 2, "age": 3.91, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 9600, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.007, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've never been impressed with them but I love Muir glen. They're around the same price point. You should try them sometime. I cook a lot of Cajun/creole and use a lot of tomatoes and they're amazing. I tried a can of theirs side by side with Kroger's white label and it convinced me to always splurge on the better tomatoes. They're shockingly good"}, {"id": 50637161, "au": "DiabloD3", "dom": 84, "sr": 94, "sc": 1.96, "ep": 5.36, "bs": 3.05, "d": 2, "age": 2.46, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.749, "fa": 0.0, "gp": 0.863, "bl": 1.15, "ds": 0.0, "txt": "The Cartel more or less is the problem.\n\nBy EU law, and like every other DOP, they abuse the DOP as a mark of quality: it is not. It is merely a mark of origin and process. Most DOP marked product is mediocre, but you pay premium prices for it. The only upside is basically guaranteed to be not outright awful.\n\nCase in point, I have bought awful cans of tomato, I have never bought awful cans of DOP San Marzano, but I have also bought cans of tomato that are not DOP San Marzano and were better than the average can of DOP San Marzano.\n\nEU law, essentially, allows regions that are known for a specific culturally significant food product to own the entire existence of the product and not fairly compete. The EU in this unique case does not believe in \"let the best product win\", but accelerates protectionism instead, but without quotas or tariffs or other trade war bullshit.\n\nIn many cases, the \"world's best x\" where x is a DOP protected product, the best x isn't from the DOP region, and cannot be sold, fairly, in Europe."}, {"id": 50636415, "au": "malfist", "dom": 16, "sr": 95, "sc": 1.96, "ep": 2.21, "bs": 0.0, "d": 5, "age": 4.0, "grav": 25.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 9600, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Reducing water content won't affect pH. Likely they chose a variety of tomatoes that are known to produce enough acid on their own. Most heirloom tomatoes are like that. I grow mostly heirloom paste tomatoes and I've never had a pH high enough to need acidification."}, {"id": 50637717, "au": "eclipticplane", "dom": 63, "sr": 96, "sc": 1.96, "ep": 2.16, "bs": 0.0, "d": 3, "age": 0.96, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1255, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.917, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Similar family recipe though anchovy paste was hard to get in the midwest, so my grandmother would use a few splashes of Worcestershire sauce."}, {"id": 50635726, "au": "globular-toast", "dom": 125, "sr": 97, "sc": 1.96, "ep": 2.14, "bs": 0.0, "d": 0, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.703, "fa": 0.0, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "I found real San Marzano tomatoes once in it UK. Couldn't tell the difference compared to any other tinned tomato. I wouldn't worry too much about it."}, {"id": 50631346, "au": "jareklupinski", "dom": 141, "sr": 98, "sc": 1.96, "ep": 2.07, "bs": 0.0, "d": 2, "age": 10.29, "grav": 91.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3319, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "true, but how many people make them side by side, and how many just buy the one that looks better, think to themselves \"yup tastes like i expect\", and never know empirically\n\nthe producer optimizes for the larger market"}, {"id": 50631559, "au": "luckydata", "dom": 121, "sr": 99, "sc": 1.96, "ep": 2.02, "bs": 0.0, "d": 3, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 3219, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 0.861, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know what you are trying to argue about, to get those certifications you need to adhere to certain standards, it's not only \"being from there\" and you even mention it in your \"rebuttal\".\n\nIf adhering to certain standards does not count as enforcing quality, then what does?"}, {"id": 50636226, "au": "D-Machine", "dom": 111, "sr": 100, "sc": 1.96, "ep": 3.72, "bs": 1.7, "d": 5, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.581, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "The hate for canned tomatoes is extremely common, but comes from a place of prejudice and lack of culinary knowledge and research. I imagine even in Italy this misconception is common. I also used to believe the \"fresh is best\" thing until somewhat recently, when I really started testing carefully at home, and finally did some proper research to understand why.\n\nNow, thankfully, it is easy to have AI look into this. It'll find you plenty of serious Italian chefs and organizations that explicitly say canned is best. There are some exceptions, but those chefs also specify that it is essential to use the right cultivar at the right season. Basically, \"canned is worse\" is not supportable, really, provided you buy quality canned, and this is true even in serious Italian cuisine. It is also IMO obvious when you test this at home."}, {"id": 50636537, "au": "malfist", "dom": 77, "sr": 101, "sc": 1.96, "ep": 1.98, "bs": 0.0, "d": 2, "age": 3.79, "grav": 23.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 9600, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'll be that counterpoint. Muir glen is the brand I reach for all the time, I think they're head and shoulders above anything else I can get at kroger (including cento)"}, {"id": 50635489, "au": "rcxdude", "dom": 124, "sr": 102, "sc": 1.96, "ep": 1.97, "bs": 0.0, "d": 6, "age": 5.48, "grav": 37.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 11684, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.838, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, but they can't specify that the end result is any good. Especially a lot of these traditional processes are very dependent on the skill of the person doing them. A lot of DOP stuff is very good but the certification process helps this only somewhat indirectly."}, {"id": 50635637, "au": "D-Machine", "dom": 107, "sr": 103, "sc": 1.95, "ep": 3.65, "bs": 1.7, "d": 5, "age": 5.26, "grav": 35.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.553, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "\"Not that complicated\" to grow your own ignores the required property (and that your property is in the right climate), costs, and somewhat-regular labor involved. Yes, I've done it (and yes, with heirloom tomatoes - they are indeed great). It isn't worth it IMO at all, especially given the yield won't net you all that much (if you regularly like making sauces, anyway).\n\nI'm not saying fresh can't be better, just that it almost never is. And practically, for almost everyone, including professional chefs, canned is the correct, sensible, and generally superior recommendation.\n\n\"Always use fresh\" is a great heuristic, generally, but for some things in cooking, it is mostly wrong. Tomatoes for sauce is one of those clear cases."}, {"id": 50630638, "au": "fridder", "dom": 2, "sr": 104, "sc": 1.94, "ep": 1.94, "bs": 0.0, "d": 1, "age": 11.05, "grav": 101.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 291, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.655, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "and a lot of their products, like the crushed, don't have citric acid which, in my opinion, greatly improves the taste"}, {"id": 50635795, "au": "bryanlarsen", "dom": 60, "sr": 105, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 2, "age": 5.02, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 43695, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.82, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In the article \"SMT\" are \"San Merican Tomatoes\", and the article similarly pans them.   (Yet another commenter here loves them)."}, {"id": 50630848, "au": "D-Machine", "dom": 146, "sr": 106, "sc": 1.91, "ep": 3.24, "bs": 1.32, "d": 2, "age": 10.82, "grav": 98.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.111, "fa": 0.22, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "I mostly agree, but those adjustments will still produce an inferior sauce to one using high-quality canned tomatoes (and the quality of your paste is a huge factor here too). Is this difference enough to matter? Depends on the sensitivity of the palate of whoever you are cooking for."}, {"id": 50637160, "au": "tonymet", "dom": 172, "sr": 107, "sc": 1.88, "ep": 3.58, "bs": 1.7, "d": 4, "age": 2.46, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.182, "fa": 0.28, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "that's fair, and likely the most common take.  I do wish there were better ways for quality producers to get the exposure.  For example, a Greek producer to earn the license of DOP on merit.  Or scotch, tequila , champagne etc."}, {"id": 50636843, "au": "Cytobit", "dom": 67, "sr": 108, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 1, "age": 3.22, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 100, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.757, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "Did you control for sodium? People almost always prefer the higher sodium products in taste tests."}, {"id": 50635490, "au": "dml2135", "dom": 106, "sr": 109, "sc": 1.83, "ep": 2.68, "bs": 0.85, "d": 4, "age": 5.48, "grav": 37.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1636, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.139, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "No, it's really not that complicated. Yes, if you just grow the same varieties that are bred for longevity that are carried in the grocery store, you won't get a better product. But if you grow an heirloom variety at home, they will be as good or better.\n\nCanning still loses a certain freshness. Much more than one gains from an optimal soil ph.\n\nGrowing your own tomatoes is really not that complicated, have you tried?"}, {"id": 50630825, "au": "D-Machine", "dom": 138, "sr": 110, "sc": 1.7, "ep": 3.03, "bs": 1.32, "d": 1, "age": 10.85, "grav": 99.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.006, "fa": 0.0, "gp": 0.458, "bl": 0.5, "ds": 0.0, "txt": "Quality tomatoes are not placebo, and this is profoundly obvious if you make two sauces side by side, one with the cheapest, and one with DOP San Marzano. Texture, colour, aroma, and flavour all vary dramatically and obviously."}, {"id": 50630748, "au": "rockostrich", "dom": 148, "sr": 111, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 2, "age": 10.93, "grav": 100.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1149, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I try to avoid canned tomatoes with basil added anyway considering I don't always want a basil flavor when cooking tomatoes."}, {"id": 50637444, "au": "nkrisc", "dom": 15, "sr": 112, "sc": 1.39, "ep": 1.39, "bs": 0.0, "d": 5, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 24, "k": 19863, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.177, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Edit: incidentally, I find it funny that tomatoes are American in origin but we in Southern Europe think of them as something that's traditionally ours.\n\nThey have been cultivated there for nearly 400 years or about so the local varieties pretty much are yours."}, {"id": 50635140, "au": "throwaway27448", "dom": 48, "sr": 113, "sc": 1.38, "ep": 1.38, "bs": 0.0, "d": 1, "age": 5.93, "grav": 41.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.456, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "San Marzano tomatoes retail for much more than others. You can buy cheap tomatoes if you want."}, {"id": 50634919, "au": "pixelatedindex", "dom": 24, "sr": 114, "sc": 1.37, "ep": 1.37, "bs": 0.0, "d": 2, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1210, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.581, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’m imagining tennis ball like canning of tomatoes, that would be very cool!\n\nUnfortunately canning requires heat treatment of the item (followed by cooling and vacuum pressure). Since we all know what happens to tomatoes in a hot environment, they can’t be canned to be washed :("}, {"id": 50636732, "au": "happyopossum", "dom": 143, "sr": 115, "sc": 1.28, "ep": 1.28, "bs": 0.0, "d": 1, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 25, "k": 18792, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> then why did they have to steal an established excellent specimens name, with recognition and history built in, and potentially tarnish an otherwise excellent product?\n\nbecause they used to be certified, then they got kicked out of the cartel and can't sell certified tomatoes anymore..."}, {"id": 50635044, "au": "D-Machine", "dom": 115, "sr": 116, "sc": 1.25, "ep": 2.57, "bs": 1.32, "d": 3, "age": 6.08, "grav": 43.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "If you give me sauce tomatoes fresh from the vine, yes, absolutely!\n\nIf you give me non-sauce tomatoes fresh from the vine, nope, still almost always worse than the proper sauce tomato canned (though I'll make an exception for certain cherry-tomato sauces)."}, {"id": 50635697, "au": "g-b-r", "dom": 110, "sr": 117, "sc": 1.21, "ep": 2.06, "bs": 0.85, "d": 4, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.876, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yeah, they were actually at least similar to San Marzanos; although wonderful raw, most of all (straight from the plant).\n\nI trust that it's how you say, although I never heard people talk well of canned tomatoes, in Italy."}, {"id": 50634841, "au": "ljf", "dom": 51, "sr": 118, "sc": 1.07, "ep": 3.06, "bs": 1.99, "d": 1, "age": 6.35, "grav": 45.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 7299, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": ["https://www.tesco.com/shop/en-GB/search?query=canned+tomatoes"], "ig": 0.415, "fa": 0.62, "gp": 0.219, "bl": 0.75, "ds": 0.0, "txt": "Here in the UK, Tesco 400g tinned tomatoes are perfectly good and 43p a can https://www.tesco.com/shop/en-GB/search?query=canned+tomatoe...\n\nThough whenever we can, we use the fresh ones my farther in law grows."}, {"id": 50629836, "au": "AndrewKemendo", "dom": 176, "sr": 119, "sc": 0.95, "ep": 4.53, "bs": 3.58, "d": 0, "age": 11.91, "grav": 114.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 23782, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.292, "fa": 0.34,   function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
