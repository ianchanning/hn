: 0, "w": 54, "qw": 0, "k": 2303, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": ["https://cooking.nytimes.com/recipes/1015987-classic-marinara-sauce"], "ig": 1.543, "fa": 2.08, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I follow this recipe, crushing them by hand. https://cooking.nytimes.com/recipes/1015987-classic-marinara...\n\nThe recipe calls for using water to allow the sauce to cook longer without burning and allow the garlic to impart flavor. I remove the stems and any skin. Not the whole stem just the thin green line going down the middle scrapping away all the tomato flesh."}, {"id": 50634963, "au": "YeGoblynQueenne", "dom": 123, "sr": 3, "sc": 9.63, "ep": 9.63, "bs": 0.0, "d": 5, "age": 6.19, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 35, "qw": 0, "k": 24945, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": ["https://www.roquefort.fr/wp-content/uploads/2021/09/CDCRoquefort_BO-2017-39-du-2017-09-28.pdf"], "ig": 0.524, "fa": 2.35, "gp": 1.174, "bl": 0.0, "ds": 0.0, "txt": "PDOs can also specify production processes and they often do. Here's the spec for Roquefort mentioned above (in French):\n\nhttps://www.roquefort.fr/wp-content/uploads/2021/09/CDCRoque...\n\nSee sections 5.3 Fabrication and 5.4 Affinage et maturation which specify the process of, well, fabrication and maturation."}, {"id": 50637882, "au": "WarmWash", "dom": 35, "sr": 4, "sc": 8.13, "ep": 8.27, "bs": 0.0, "d": 3, "age": 0.57, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.927, "fa": 0.95, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "You don't need GDP\n\nAmerican median pay is about 50% higher and American household wealth is about 100% higher.\n\nThe American economy is also much more stratified, there are a lot more people earning a lot more money than their German counterparts in the upper white collar echelons. German doctors, lawyers, engineers pulling €300k+ annually are basically unicorns, but in America those are pretty common place, even kind of expected in some areas.\n\nThe German economy is more similar to the American economy of the 1960's where everyone rich or poor was kinda clumped together around the median pay, a nice normal distribution. The effect of this is much more reasonable living costs for the average person. America has the \"problem\" of having too many people making too much money[1] and that drags up the cost of everything. Their normal distribution curve has had the top blown off and dragged along the increasing income scale into a long fat tail along it.\n\n[1] too much money here refers to households with $200-$500k annual household income, not the 1% or anything like that."}, {"id": 50634812, "au": "toast0", "dom": 13, "sr": 5, "sc": 8.03, "ep": 8.03, "bs": 0.0, "d": 3, "age": 6.39, "grav": 46.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 5, "qw": 125, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://extension.k-state.edu/news-and-publications/news/stories/2025/08/food-safety-canning-tomatoes.html"], "ig": 0.954, "fa": 1.78, "gp": 0.492, "bl": 0.0, "ds": 0.0, "txt": "> No offense meant but every once in a while I read something like that about the way things are in the US and I'm just stunned. How does that sort of thing just happen? Who even asks for tomatoes with citric acid?\n\nPeople who don't want botulism?\n\n> From a food safety standpoint, Blakeslee said tomatoes require acidification, which means adding acid to increase the acid content during canning.\n\n> “The natural pH (acidity level) of tomatoes – no matter the variety or color – is at or above 4.6,” Blakeslee said. “Therefore, many tomato varieties are low acid foods. While they might taste acidic or have a sour taste, the actual pH measurement is the true indicator of acid content.”\n\n> What that often means for canning tomatoes is that bottled lemon juice, citric acid or vinegar must be added.\n\n[1] https://extension.k-state.edu/news-and-publications/news/sto..."}, {"id": 50630413, "au": "jubilanti", "dom": 157, "sr": 6, "sc": 7.24, "ep": 7.24, "bs": 0.0, "d": 3, "age": 11.3, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 1382, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.573, "fa": 0.68, "gp": 1.106, "bl": 0.0, "ds": 0.0, "txt": "Just treat it like buying USB-C cables or whatever from white labels on AliE or Amazon. You can buy a can of tomatoes at the store for less than a USB-C cable. You try it at home. If it is good, you buy it regularly. If it is not, you wasted a few bucks but learned not to buy that brand. If you're insistent on getting that $2-$5 back, most grocery stores will refund a single empty can to someone who asks nicely, as it's not worth the labor cost to argue with you. Just dress nice and don't get close to fraud level. Then you try another brand. Once you find a good brand, you buy it until quality lapses. Then you start over.\n\nIs this not how every engineer approaches buying any product? I feel like I'm talking to my teenage son."}, {"id": 50637952, "au": "DiabloD3", "dom": 87, "sr": 7, "sc": 7.17, "ep": 7.32, "bs": 0.0, "d": 4, "age": 0.41, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 339, "qw": 4, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.904, "fa": 0.34, "gp": 1.293, "bl": 0.0, "ds": 0.0, "txt": "I can grow tomatoes and sell them in the EU. I can grow tomatoes in Germany and sell them in the EU. I can grow tomatoes in Germany, call them Das Hamburg, and sell them in the EU. I cannot grow San Marzanos, correctly indicate that they are of the cultivar San Marzano, and sell them as Das Hamburg in the EU. I can mislead consumers about the exact cultivar (or just not list cultivar at all, but then why use San Marzanos at all?) and sell them in the EU.\n\nI do not believe that San Marzano tomatoes meet the requirements of DOP, frankly. Many DOP designations are about processes that they have been doing for hundreds upon hundreds of years, but some of them are not, and are relatively recent in the history of European food culture.\n\nSan Marzanos were not developed by San Marzano, and were a gift to the Kingdom of Naples a little over 250 years ago from Peru.\n\nTheir process (since DOP is both a location and a process) is simply grow the tomatoes, harvest them, and use industry standard processing and canning techniques, but the processing has to also occur inside the DOP region. Even canning whole, a common feature and hallmark of San Marzano, is not required by the process, and there are DOP labeled non-whole products.\n\nIt is not the Champagne of France, the Traditional Balsamic Vinegar of Reggio and Modena, the dozen or so cheeses from Italy and France, etc. They have a process "}, {"id": 50637564, "au": "DiabloD3", "dom": 92, "sr": 8, "sc": 6.96, "ep": 7.25, "bs": 0.0, "d": 4, "age": 1.31, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 156, "qw": 66, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.398, "fa": 0.76, "gp": 1.243, "bl": 0.0, "ds": 0.0, "txt": "> \"Merely\" ? That's the origin of the quality.\n\nNo it is not, and I'm not sure how you arrived at that.\n\n> Most DOP marked product is mediocre, but you pay premium prices for it\n\nI have tried many DOP marked products, and many of them were not the best I've had. There is not a better way of knowing this.\n\n> On the contrary, it's perfectly fair competition: they own a brand. Others can cultivate the same plants and sell them, but not with the same brand.\n\nThe name of the cultivar is San Marzano. It is not \"brand\". It is not trademarked. It was not developed by the people of San Marzano, but was a gift to the Kingdom of Naples from Peru. The cultivar is over 250 years old.\n\n> That's a lie. If the consortium owned the genetic material (as IP) of those cultivars, you'd be right, but you're not.\n\nI cannot sell San Marzano tomatoes, the cultivar, anywhere in the EU, unless it was grown in the correct DOP economic region. See my other comment where I describe the finer points of the region.\n\nI could be growing the world's best San Marzanos, and EU law does in fact prohibit me from interacting with that market if I factually label them as what they are, and thus, this is, in fact, a form of protectionism that bars fair access to the market."}, {"id": 50634730, "au": "DiabloD3", "dom": 73, "sr": 9, "sc": 6.59, "ep": 7.04, "bs": 0.0, "d": 0, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 590, "qw": 0, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 2.071, "fa": 0.0, "gp": 1.495, "bl": 0.0, "ds": 0.0, "txt": "Something the Slate article doesn't really talk about is that San Marzano is a variety. Literally, it is a single line in that entire article and then doesn't expand on it.\n\nSelling San Marzano, the cultivar, is illegal in the EU, as it is covered under their PDO/DOP laws due to being named after the location. Wild, right? You cannot label them as \"San Marzano-style\" in the EU either. You can sell them only as generic plum tomatoes, which they are not when grown correctly.\n\nWhat makes San Marzanos what they are is they are neutral pH cultivar that can grow in the rich volcanic soil of Mount Vesuvius, and maintain the desired taste and texture when grown in minerally rich neutral pH soil anywhere in the world; however, if you grow them in acidic soil meant for tomatoes, they do indeed turn into just normal tomatoes and are indistinguishable from any paste tomato. Real San Marzanos grown correctly are less acidic tasting and sweeter, but also cook amazingly into a sauce, unlike any other paste tomato I've tried.\n\nItaly has attempted multiple times to enforce their laws on American companies that largely sell to American customers, and have attempted to prosecute Cento more than once (which Slate does talk about in the article, but is unusually biased in favor of Italy).\n\nIn the US, it is legal to sell \"San Marzano-style\" in the US, and vary in quality: some brands are San Marzano"}, {"id": 50633813, "au": "nekusar", "dom": 152, "sr": 10, "sc": 6.59, "ep": 6.73, "bs": 0.0, "d": 1, "age": 7.6, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.835, "fa": 0.56, "gp": 0.569, "bl": 0.0, "ds": 0.0, "txt": "I used to also think similarly. And I'm also in the same end result as you came to.\n\nExecpt its not just food. Well, this is about Scam Marzanos versus San Marzanos. But most goods have striated pricing, and its basically \"terrible dont waste your money\", \"mediocre but gets job done\", and \"laughably high but appears to be perfect... appears\".\n\nAnd if you dont do enough research, you find out that they took the same shortcuts and \"cost reductions\" that make the expensive thing also just as failure prone and cheap, but gilded.\n\nI had to get a new can opener, since the previous plastic/metal one fell apart. Turns out the new apparent metal one was just a metal COATING and still shit plastic. It too fell apart in a month, conveniently after losing the receipt. I, instead went to the antique mall to a cooking booth and bought a 1960's can opener. Its been working for years with no failure end in sight.\n\nAnd honestly, the whole country feels like this. Im sick and tired of it. Id like to help fix it, but those with money caused it."}, {"id": 50630795, "au": "kergonath", "dom": 119, "sr": 11, "sc": 6.58, "ep": 6.72, "bs": 0.0, "d": 2, "age": 10.88, "grav": 99.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 12, "k": 10711, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.413, "fa": 0.7, "gp": 0.971, "bl": 0.0, "ds": 0.0, "txt": "> DOP is ABSOLUTELY a mark of quality. Italy takes food certifications very seriously.\n\nIt’s not only Italy taking this seriously. And these are not certifications of quality; they are certifications of origin and method. So in a sense they guarantee the quality floor, but indirectly by putting constraints on the ingredients used and on the methods of production. But it does not mean that basically the same product, made in conditions or locations different enough that they don’t get the certification cannot be better. Also, some certifications are stricter than other in terms of what they allow.\n\nFor example, I really like Roquefort, which is a PDO that is strongly enforced. I think that even the most basic ones are quite good. There are several other blue cheeses made in other villages of the region and that are just as good or better, but they are outside the PDO.\n\nThe parent mentioned champagne, which is a bit similar: there are several sparkling wines made the exact same way but outside the PDO, and those can be fantastic as well, much better than average champagne."}, {"id": 50635907, "au": "tonymet", "dom": 170, "sr": 12, "sc": 6.57, "ep": 6.57, "bs": 0.0, "d": 2, "age": 4.82, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 205, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 2.045, "fa": 0.28, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "I have heard the same, that Italian producers have better production & distribution, so a large share of \"Italian\" oil is Greek oil shipped to Italy.\n\nI prefer Greek olive oil, enjoy Italian oil, and I've had excellent Californian olive oil too.  The single best olive oil I've had was near Calistoga.  Even bulk olive oil from Napa is outstanding.  And in greece, even a casual restaurant will serve outstanding olive oil.  I enjoy it served on braised lamb.\n\nI have mixed feelings about protections, since they concentrate attention on a few products, and are mostly a scam.  For example, I've had excellent Mescals, that would out earn Tequilas if they were allowed the Tequila brand (which some producers were scamming).  Same goes for Champagne, Gruyere cheese and so on.   We have fabulous Roquefort-style cheeses in Oregon, that even beat French cheeses in competition, but they can't sell the same volume because of the naming rules.\n\nSo although these scams sound like a fraud, as a consumer we still live in the best time. I drizzled some olive oil on my steak last night, and felt like a king.  Honey on my home-made greek yogurt for breakfast, and it tasted divine.  As long as you know what to buy, you can enjoy mouth watering food at every meal."}, {"id": 50631289, "au": "t0mpr1c3", "dom": 57, "sr": 13, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 0, "age": 10.36, "grav": 92.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 351, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.374, "fa": 0.34, "gp": 1.48, "bl": 0.0, "ds": 0.0, "txt": "I did a side-by-side flavor test (raw and cooked) of 8 brands of tomatoes labeled \"San Marzano\" available in Philadelphia supermarkets.\n\nSMT are indeed watery and tasteless.\n\nCento were notable mostly for their inconsistency. Some cans were good, some were not, and reviews were similarly all over the place.\n\nThe best were from Wegmans and cost $4."}, {"id": 50635080, "au": "YeGoblynQueenne", "dom": 169, "sr": 14, "sc": 6.29, "ep": 6.44, "bs": 0.0, "d": 1, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 141, "qw": 0, "k": 24945, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": ["https://www.iliada.co.uk/products/iliada-kalamata-pdo-extra-virgin-olive-oil/"], "ig": 1.643, "fa": 0.62, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "Regarding olive oil AFAICT it's the Italian \"EVOO\"s that are adulterated. The way I've heard it is they buy second-grade olive oil from Greece and mix it up with their EVOO and probably other lower quality Italian oils and sell it as EVOO.\n\nTo be clear, I'm Greek and our EVOO beats the pants off both Italian and Spanish, which may have a better name but in my experience is not worth the label. The olive oils that Italians buy from us cheaply are cheap because nobody in Greece deigns to put them in their salad, although of course they are used by corner-cutting restaurants.\n\nAnwyay if you want good quality EVOO, buy PDO Greek EVOOs like Kalamata, e.g.\n\nhttps://www.iliada.co.uk/products/iliada-kalamata-pdo-extra-...\n\nOr really anything that says in Greek that it's exclusively from olives and extracted solely by mechanical means. If it says \"korneiki variety\" even better."}, {"id": 50634215, "au": "jschveibinz", "dom": 50, "sr": 15, "sc": 5.94, "ep": 6.24, "bs": 0.0, "d": 1, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1856, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.786, "fa": 1.23, "gp": 0.609, "bl": 0.0, "ds": 0.0, "txt": "In SoCal, the price according to my check (about 60 seconds ago) was $5.00 vs $2.50 for the generic brand, so the article is in the right ballpark for an average grocery store."}, {"id": 50633832, "au": "iloveyoutwo", "dom": 94, "sr": 16, "sc": 5.88, "ep": 5.88, "bs": 0.0, "d": 0, "age": 7.58, "grav": 58.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 0, "k": 108, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": ["https://www.amazon.com/San-Marzano-Whole-Peeled-Tomatoes/dp/B000SEJ8F6"], "ig": 1.228, "fa": 0.62, "gp": 0.845, "bl": 0.0, "ds": 0.0, "txt": "I like these: https://www.amazon.com/San-Marzano-Whole-Peeled-Tomatoes/dp/...\n\nSMT San Merican Tomato Whole Peeled Tomatoes\n\nIt's just marketing, use the ones that taste the best. I've definitely bought these fake ones.\n\nHey, a can of tomatoes from a class action would put it in a top-3 class-action payouts i've gotten."}, {"id": 50637237, "au": "wackget", "dom": 165, "sr": 17, "sc": 5.74, "ep": 5.96, "bs": 0.0, "d": 0, "age": 2.25, "grav": 13.5, "surf": 8.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 40, "k": 2888, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.561, "fa": 0.42, "gp": 0.751, "bl": 0.0, "ds": 0.0, "txt": "> \"I understand the value of cultural heritage, and in my heart of hearts, I wish we lived in a world that cared about authenticity, or even just the concept of a shared reality. But I don’t have to tell you that’s not where we are.\"\n\nWhat a weak, pathetic take. Did this person not read their own article?! They just spent a thousand words explaining how a company is essentially lying to the public, then just brushes it off with \"eh, but their product tastes good and besides people are shallow, amoral consumerist whores anyway so who cares?\"\n\nDude, your job is literally writing for an audience. If you of all people don't use that platform to take a stand for what is morally correct, then how the hell do you expect to make the world care about authenticity?\n\nI am really quite incredulous at this author's attitude."}, {"id": 50634305, "au": "darth_avocado", "dom": 49, "sr": 18, "sc": 5.34, "ep": 5.78, "bs": 0.0, "d": 1, "age": 7.06, "grav": 52.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 13977, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.793, "fa": 0.95, "gp": 0.836, "bl": 0.0, "ds": 0.0, "txt": "The pricing for regular canned tomatoes ranges from $0.99 to $10+ depending on where you shop. Costco wholesale cans at the business center are on the lowest of the spectrum and Erewhon will be happy to sell you something for $10+."}, {"id": 50634589, "au": "tonymet", "dom": 168, "sr": 19, "sc": 5.3, "ep": 6.04, "bs": 0.0, "d": 0, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.899, "fa": 0.28, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": "Look at the last year, nearly every artisan product has been exposed as a fraud.  Olive oil, Avo oil, honey, Tequila, pea protein ( contaminated with heavy metal concentrates), tomatoes .\n\nYou'll achieve better results by cooking according to taste rather than labels.  There are no magic foods or ingredients.\n\nLuckily you have tremendously sensitive tastebuds and sense of smell. And you can develop better sensitivity to your body's nutritional response.\n\nStop worrying about magic foods and labels.  They are impossible to enforce. Even the guidelines allow for a margin of error in recording macro and micro nutrients."}, {"id": 50635032, "au": "tristor", "dom": 154, "sr": 20, "sc": 5.22, "ep": 5.52, "bs": 0.0, "d": 2, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 11284, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.863, "fa": 0.0, "gp": 0.785, "bl": 0.0, "ds": 0.0, "txt": "< And honestly, the whole country feels like this. Im sick and tired of it. Id like to help fix it, but those with money caused it.\n\nI feel the same way much of the time.  Ironically, it is exactly this perceptible but difficult to measure loss of quality that fuels much of the desire by older people to \"go back to when things were better\", even though it was largely their generation's decisions that lead to the current situation that emphasized short term (and long-term) monetary gain over product quality.  For what it's worth, there used to be a great Reddit before it was somewhat ruined post-AI, called Buy It For Life, and was a fairly good source of information on what to buy.  I've also found that antiques for hand-operated tools to often be superior.  That's not always the case though, I'd prefer modern German-brand hand tools over antique US brand hand tools, because materials science has actually markedly improved since the 1960s, we just choose to also push the margins in most products to save costs, but in tools its more about strength and this is reflected in premium brands. Not much beats old school scissors and can openers and the like, though.  May need restoration and sharpening, and will require maintenance, but will work forever."}, {"id": 50630715, "au": "D-Machine", "dom": 182, "sr": 21, "sc": 5.19, "ep": 5.19, "bs": 0.0, "d": 2, "age": 10.96, "grav": 100.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.794, "fa": 0.0, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "In general fresh tomatoes make for shitty sauce, because fresh tomatoes are selected for and bred for characteristics that make them good when fresh / raw, e.g. thick enough skin to survive stacking and transport, plenty of moisture for that \"wet\" fresh taste, and higher acidity to preserve freshness. Using these to make a sauce will generally result in an inferior sauce (although some cherry tomatoes are an exception).\n\nThe kind of tomatoes you want for good sauce are totally different, and are picked fresh and put straight into the can. You cannot \"learn how to pick these\" beyond simply trying the different companies cans (or trying to get into arcana about specific lot / batch numbers implying harvest dates), because you cannot inspect the tomatoes inside.\n\nSo sauce tomatoes are an exception where you can't really \"learn how to pick best ones\" by look or feel, it really does come down to total solids and other quantities that aren't visible or feelable until cooked."}, {"id": 50633409, "au": "ncr100", "dom": 61, "sr": 22, "sc": 5.08, "ep": 5.89, "bs": 0.0, "d": 1, "age": 7.96, "grav": 62.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2479, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.667, "fa": 0.28, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": "Oo - thank you.\n\nMy recipe (and care about SM tomatoes) is a linguini with sauce:\n\n- Ready in 30m. INGREDIENTS: 1 can SM tomatoes chopped, with garlic, olive oil, 2 tsp capers, 6 black olives, 1/8 tsp red pepper flakes, and 1/2 tsp oregano.  HOWTO: Cook linguini separately. Cook garlic / oil / pepper first for a minute or two, then add the rest and cook. Serve with cheese and crusty bread."}, {"id": 50633912, "au": "EmX_3000", "dom": 128, "sr": 23, "sc": 4.79, "ep": 5.01, "bs": 0.0, "d": 0, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.653, "fa": 0.0, "gp": 0.776, "bl": 0.0, "ds": 0.0, "txt": "Jersey Devils beat the San Marzanos hands down. They're an improved version of that old, obsolete Italian tomato, the San Marzano, brought back to the continent of Tomatos and improved by the bolder, more adventurous Italians who broke free of the oppression of the Papal States and Mussolini. A new tomato, improved over the old world variety, more tasty and less watery, suited to our modern times.\n\nWho even wants San Marzanos? You can buy fresh Jersey Devils for much less money, or canned."}, {"id": 50633641, "au": "dreamcompiler", "dom": 135, "sr": 24, "sc": 4.73, "ep": 5.61, "bs": 0.0, "d": 1, "age": 7.75, "grav": 60.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 0, "k": 17685, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": ["https://cooc.com/"], "ig": 1.244, "fa": 0.62, "gp": 0.631, "bl": 0.0, "ds": 0.0, "txt": "Likewise EVOO (Extra Virgin Olive Oil). Almost all EVOO from Europe is adulterated, but the stuff grown entirely in California with the COOC seal is legit. Or at least it's supposed to be.\n\nhttps://cooc.com/"}, {"id": 50637443, "au": "ragall", "dom": 29, "sr": 25, "sc": 4.4, "ep": 5.06, "bs": 0.0, "d": 2, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 570, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.546, "fa": 0.34, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "Imported European food necessarily ends up more expensive than local food due to transportation costs and higher standards, which puts it outside the buying power and tastes of most of the US population; but at that point it gets marketed to the top 5% who hold a much higher buying power (see K-shaped economy), so it gets sold at ridiculous mark-up."}, {"id": 50634440, "au": "gwerbin", "dom": 127, "sr": 26, "sc": 4.37, "ep": 4.81, "bs": 0.0, "d": 0, "age": 6.87, "grav": 50.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 184, "k": 1254, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.209, "fa": 0.42, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "> Back across the Atlantic, will Cento finally pay the piper? Andrich et al. v. Cento Fine Foods Inc. is still undecided, but I should note that a much more scathing lawsuit from 2019 was thrown out. That one claims that the “Find My Field” tracker on the back of each Cento can—which you can use, CIA-style, to locate the exact coordinates your tomato came from—takes you to the same four fields over and over again. “It is implausible that [the] defendant can sell more San Marzano tomatoes than all other companies in the U.S., combined, and do so by cultivating only four fields,” the suit read.\n\n> Implausible indeed, but a New York judge dismissed the case, citing that your average person wouldn’t expect San Marzanos to be labeled with the Consortium’s DOP seal: “Here, while there may be ‘some few consumers’ who expect that a San Marzano tomato must be certified by the Consortium, the Court concludes, drawing upon common sense and common experience, that the vast majority of reasonable consumers expect no such thing. It is much more likely that consumers expect tomatoes grown in a region of Italy.”\n\nFraud or not, this cannot be a serious legal decision, right? Forget political activism from the bench, this judge must have a pantry full of tomato cans stuffed with cash."}, {"id": 50635743, "au": "WarmWash", "dom": 33, "sr": 27, "sc": 4.01, "ep": 4.45, "bs": 0.0, "d": 1, "age": 5.12, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.19, "fa": 0.0, "gp": 1.143, "bl": 0.0, "ds": 0.0, "txt": "It's hard to draw a comparison that people won't pick at, but in general Americans are twice as wealthy as their German counterparts. Everything in the US is more expensive because everyone has more money.\n\nIt gets even more dramatic when you cut out the deep rural areas of the US that Germany doesn't really have."}, {"id": 50630506, "au": "jareklupinski", "dom": 137, "sr": 28, "sc": 3.92, "ep": 5.02, "bs": 0.0, "d": 0, "age": 11.19, "grav": 103.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 44, "k": 3319, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.185, "fa": 0.42, "gp": 0.715, "bl": 0.0, "ds": 0.0, "txt": "> But personally speaking, I find myself with a moral dilemma. Because, friends, in my opinion as a food writer and avid pasta-maker, I have to confess: Cento’s “San Marzano” tomatoes are actually excellent. They are, near as I can tell, the best available tomato at the most supermarket chains.\n\nthen why did they have to steal an established excellent specimens name, with recognition and history built in, and potentially tarnish an otherwise excellent product?\n\nprobably because the tomatoes are merely the same, and taste is entirely subjective, so just suggesting something may be better on the can is enough to trick your mind into making it so (placebo)"}, {"id": 50630396, "au": "dfxm12", "dom": 99, "sr": 29, "sc": 3.91, "ep": 5.31, "bs": 0.0, "d": 0, "age": 11.32, "grav": 105.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 10234, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.46, "fa": 0.0, "gp": 1.294, "bl": 0.0, "ds": 0.0, "txt": "Remember, DOP, IGP, et al. are not marks of quality (you might like some Crémant more than the average Champagne...). Especially when it comes to produce, local and fresh are probably better than something from a specific place halfway around the world with a certain story.\n\nEven when it comes to preserved foods, it pays to do a little taste test between brands to find the right mix of flavor and value."}, {"id": 50635374, "au": "YeGoblynQueenne", "dom": 14, "sr": 30, "sc": 3.65, "ep": 4.46, "bs": 0.0, "d": 4, "age": 5.64, "grav": 38.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 24945, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.651, "fa": 0.0, "gp": 0.4, "bl": 0.0, "ds": 0.0, "txt": "Er, OK, you're right and I'm wrong. I just checked two cans of chopped tomatoes and one passata plus one can of tomato puree, all from different Greek producers, and they all list their ingredients as tomatoes, lightly concentrate tomato juice and citric acid \"if needed\", the two chopped tomatoes cans clarifying that this is when the natural content of the tomatoes is not enough.\n\nThe puree doesn't list ingredients so that probably means it's what it says it is, \"doubly concentrated tomato juice\" but I guess if its water content is reduced it doesn't need increased acidity.\n\nI guess I had never noticed any difference in taste compared to fresh tomatoes and I tend to use the puree a bit more. Excuses, I should have checked before posting.\n\nEdit: incidentally, I find it funny that tomatoes are American in origin but we in Southern Europe think of them as something that's traditionally ours."}, {"id": 50634424, "au": "asveikau", "dom": 26, "sr": 31, "sc": 3.55, "ep": 4.22, "bs": 0.0, "d": 1, "age": 6.89, "grav": 51.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.106, "fa": 0.0, "gp": 1.115, "bl": 0.0, "ds": 0.0, "txt": "I haven't checked the specifics of your numbers, but a conversation I've had with several Europeans over the years: in general imported Italian food is very expensive in the US and cheap in Europe.\n\nUsually I've had that conversation over parmigiano reggiano, which is mentioned in the article."}, {"id": 50630560, "au": "AdmiralAsshat", "dom": 98, "sr": 32, "sc": 3.51, "ep": 4.61, "bs": 0.0, "d": 0, "age": 11.12, "grav": 102.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 25445, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "This is a bummer, but I'm marginally less pissed about it than the widespread olive oil or Parmesan cheese fraud, simply because most of my application for whole-peeled tomatoes has them cooked down anyway, and so that extra water can be boiled off.\n\nFor the instances where I need that \"fresh\" tomato taste, passata is becoming widely available at my local grocery stores."}, {"id": 50634266, "au": "s1mon", "dom": 31, "sr": 33, "sc": 3.35, "ep": 3.79, "bs": 0.0, "d": 1, "age": 7.12, "grav": 53.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1516, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "Perhaps we need to qualify the can size? In the US, 28 oz (~796g) cans are typical if you're making a sauce. Of course there are smaller and larger cans, but the larger ones tend to be for restaurants or other institutional markets."}, {"id": 50630163, "au": "bix6", "dom": 144, "sr": 34, "sc": 3.33, "ep": 4.21, "bs": 0.0, "d": 0, "age": 11.56, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 4283, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.0, "fa": 0.0, "gp": 1.286, "bl": 0.0, "ds": 0.0, "txt": "I buy the cheapest everything now. Anything more expensive makes claims that I can’t verify. I used to associate a higher price with better quality but that no longer seems to be the case anywhere."}, {"id": 50630460, "au": "phoghed", "dom": 131, "sr": 35, "sc": 3.18, "ep": 4.2, "bs": 0.0, "d": 0, "age": 11.24, "grav": 104.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1048, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.784, "fa": 0.28, "gp": 1.079, "bl": 0.0, "ds": 0.0, "txt": "San Marzano is mostly just marketing anyway. You’re better off avoiding them if you’re in the US, you can get better tomatoes grown in California.\n\nBianco DiNapoli for example"}, {"id": 50635166, "au": "ericbarrett", "dom": 76, "sr": 36, "sc": 3.11, "ep": 4.21, "bs": 0.0, "d": 1, "age": 5.89, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 24, "k": 6134, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.008, "fa": 0.42, "gp": 0.443, "bl": 0.0, "ds": 0.0, "txt": "> Also, Muir Glen is a lot of people's favorite, and used to sell a San Marzano style. I never liked it, and I do not understand the fascination.\n\nCompletely with you.  Every can of Muir Glen whole tomatoes I've used in the last decade has been greenish, hard, and tasteless.  And yet I see them on recommendation lists all the time."}, {"id": 50634927, "au": "stephbook", "dom": 175, "sr": 37, "sc": 2.99, "ep": 3.43, "bs": 0.0, "d": 1, "age": 6.22, "grav": 44.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 635, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.458, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks to your comment, I was prepared for the worst. But this site still caught me off-guard.\n\nThe time to first paint. The lazy-loaded images that load too late. The numbered lists, the fonts. How on earth did a food company build such a Claude-y page??"}, {"id": 50630752, "au": "D-Machine", "dom": 103, "sr": 38, "sc": 2.93, "ep": 4.91, "bs": 1.32, "d": 1, "age": 10.93, "grav": 100.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 24, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.264, "fa": 0.42, "gp": 0.514, "bl": 0.5, "ds": 0.0, "txt": ">  Especially when it comes to produce, local and fresh are probably better than something from a specific place halfway around the world with a certain story\n\nThis is almost entirely wrong for canned tomatoes, which are almost always superior to fresh for sauces. This isn't even secret knowledge, ask your AI about this. Fresh tomatoes are bred for totally different characteristics and qualities than sauce tomatoes, which need to be canned as quickly as possible after harvesting."}, {"id": 50634737, "au": "YeGoblynQueenne", "dom": 3, "sr": 39, "sc": 2.86, "ep": 4.25, "bs": 0.0, "d": 2, "age": 6.49, "grav": 47.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 24945, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.237, "fa": 0.28, "gp": 0.374, "bl": 0.0, "ds": 0.0, "txt": "This is in the US right? In Europe I've never seen citric acid, nor calcium chloride added to tomatoes in a can. In fact I don't think I've ever seen anything added other than tomatoes, possibly water, except in products specifically sold as some kind of sauce.\n\nNo offense meant but every once in a while I read something like that about the way things are in the US and I'm just stunned. How does that sort of thing just happen? Who even asks for tomatoes with citric acid?"}, {"id": 50604356, "au": "ncr100", "dom": 126, "sr": 40, "sc": 2.83, "ep": 3.93, "bs": 0.0, "d": 0, "age": 53.64, "grav": 1385.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 2479, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.963, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Non-official certification company certifies blank cans, Cento wraps cans in their iconic yellow \"San Marzano\" labels. History of fraud."}, {"id": 50636619, "au": "nozzlegear", "dom": 55, "sr": 41, "sc": 2.68, "ep": 4.0, "bs": 0.0, "d": 1, "age": 3.62, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 5822, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.876, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not a huge italian food person, so I buy canned tomatoes from Walmart and they do the trick just fine for my nona-forsaken tastebuds. I checked just now, they're $1.53 for a 28oz can. San Marzano is $4.58 for the same size."}, {"id": 50630422, "au": "warmedcookie", "dom": 147, "sr": 42, "sc": 2.67, "ep": 3.55, "bs": 0.0, "d": 1, "age": 11.3, "grav": 105.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 122, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.042, "fa": 0.28, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "Same sentiment, although San Marzano Canned Tomatoes have a couple of basil leaves in the can whereas Walmart's Great Value brand does not. The tomatoes themselves I cannot tell a difference.\n\nI now buy Great Value brand canned whole tomatoes and that tubed basil paste assuming I don't have fresh basil growing actively in my hydroponic garden"}, {"id": 50636488, "au": "DiabloD3", "dom": 75, "sr": 43, "sc": 2.62, "ep": 4.16, "bs": 0.0, "d": 2, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.585, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "That seems to have been grown in the Agro Sarnese-Nocerino economic region, thus under the DOP. This region is between the provinces of Naples and Salerno, and is made up of 16 communities including San Marzano (which is in Salerno).\n\nNot all of Campania is part of this economic region (around a third). The provinces of Naples and Salerno are only two of five provinces in Campania, and only part of Naples is inside the economic region, while most (all?) of Salerno is. Vesuvius is considered entirely in the province of Naples as well, and the last time it erupted, most of the outflow went towards Salerno instead of out to sea.\n\nIn comparison, the province of Salerno is about the size of Rhode Island, and the economic region is a smidgen bigger than that.\n\nCento uses San Marzanos grown outside of this region."}, {"id": 50630321, "au": "dfxm12", "dom": 181, "sr": 44, "sc": 2.53, "ep": 3.77, "bs": 0.0, "d": 1, "age": 11.4, "grav": 106.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 10234, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.36, "fa": 0.0, "gp": 0.399, "bl": 0.0, "ds": 0.0, "txt": "Ehh, at the end of the day, you just want delicious tomatoes. You can find delicious tomatoes that make no fraudulent DOP claims (or don't need to). It's important to (probably in this order): find a good grocer, know when the produce is in season, and know how to pick the best ones. I think it's a skill that's been lost now that we can go to a super market (or god forbid online store) and find the same categories of produce year round."}, {"id": 50636022, "au": "YeGoblynQueenne", "dom": 171, "sr": 45, "sc": 2.49, "ep": 4.88, "bs": 0.85, "d": 3, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 24945, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.709, "fa": 0.0, "gp": 0.593, "bl": 0.32, "ds": 0.0, "txt": "I've heard good things about Californian olive oil and wines, although I haven't tried them.\n\nI don't agree about protections, or at least I don't agree about PDO. In my experience it's a real guarantee of a certain quality. It's not perfect, some producers (especially in France) are a bit too fanatic about their product (but then you expect that of a person who really cares about what the produce), it has occasionally worked against the interests of small, traditional producers (like in the case of Metsovone cheese whose PDO spec demands it be made with milk from cows raised in Metsovo... which apparently no longer has enough cows) and in any case it doesn't mean that a product that isn't PDO is not good. But it's a rule of thumb, especially for cheese.\n\nThe lesson for me is that are very particular about certain products - wine, cheese, olive oil and some cured meats - and it's essentially this passionate consumer demand that has driven PDO policies. Again, doesn't mean you can't find good produce outside PDO. You certainly can. I agree that you need to pay attention to what you buy."}, {"id": 50634231, "au": "devindotcom", "dom": 45, "sr": 46, "sc": 2.49, "ep": 3.59, "bs": 0.0, "d": 1, "age": 7.17, "grav": 54.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 8795, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.969, "fa": 0.34, "gp": 0.236, "bl": 0.0, "ds": 0.0, "txt": "The size of the can matters of course. You can get a small can of domestic tomatoes for $1-2 certainly, but the standard size of this type of can is 28 oz and if they're San Marzanos they will be imported. I do wish we had better grocery prices though!"}, {"id": 50636663, "au": "DiabloD3", "dom": 81, "sr": 47, "sc": 2.45, "ep": 3.99, "bs": 0.0, "d": 4, "age": 3.54, "grav": 21.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.522, "fa": 0.0, "gp": 0.288, "bl": 0.0, "ds": 0.0, "txt": "To further the point, plum tomatoes are considered ideal paste tomatoes, they are of low liquid content and easily cook down into paste. They are wonderful to make sauces out of when starting with peeled whole in a can.\n\nSan Marzanos are usually sold as this, sometimes as crushed, but crushed imo loses texture too quickly when making a sauce.\n\nMost canned pastes are made from Romas, a hybrid made of San Marzano and another plum cultivar, a great paste tomato, but not really a good sauce tomato like San Marzanos are."}, {"id": 50630686, "au": "astura", "dom": 117, "sr": 48, "sc": 2.3, "ep": 3.4, "bs": 0.0, "d": 1, "age": 10.99, "grav": 101.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 49, "k": 10416, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.937, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Especially when it comes to produce, local and fresh are probably better than something from a specific place halfway around the world with a certain story.\n\nThis is not always true, the geographic conditions of the area the food is grown in can be a large part of the taste. This is especially true of tea leaves, which have no local fresh version. (Not that I would want my tea leaves fresh anyways).\n\n>Even when it comes to preserved foods, it pays to do a little taste test between brands to find the right mix of flavor and value.\n\nThat I can absolutely agree with."}, {"id": 50630384, "au": "shrubble", "dom": 1, "sr": 49, "sc": 2.29, "ep": 3.83, "bs": 0.0, "d": 0, "age": 11.33, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 5686, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "The most important aspect of buying Cento is that they don’t have any calcium chloride added.\n\nAdding calcium chloride to tomatoes is done to keep them firm in the can and not deteriorate into a slushy red goo.\n\nHowever, calcium chloride prevents the proper softening of the tomatoes under heat, making it take a longer time to cook a red sauce from scratch."}, {"id": 50637488, "au": "ragall", "dom": 91, "sr": 50, "sc": 2.26, "ep": 3.8, "bs": 0.0, "d": 3, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 62, "k": 570, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.109, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It is merely a mark of origin and process.\n\n\"Merely\" ? That's the origin of the quality.\n\n> Most DOP marked product is mediocre, but you pay premium prices for it\n\nYou're pulling this out of your arse. You have no way of knowing that.\n\n> EU law, essentially, allows regions that are known for a specific culturally significant food product to own the entire existence of the product and not fairly compete.\n\nOn the contrary, it's perfectly fair competition: they own a brand. Others can cultivate the same plants and sell them, but not with the same brand.\n\n> The EU in this unique case does not believe in \"let the best product win\",\n\nThat's a lie. If the consortium owned the genetic material (as IP) of those cultivars, you'd be right, but you're not."}, {"id": 50630380, "au": "zombocomvibes", "dom": 72, "sr": 51, "sc": 2.24, "ep": 3.12, "bs": 0.0, "d": 0, "age": 11.34, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 153, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.894, "fa": 0.0, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "I'm bitter about the \"San Merican\" can I bought from Kroger a few months ago.. what an absolute scam.  Terrible quality tomatoes, watery with no flavor."}, {"id": 50629930, "au": "quxbar", "dom": 177, "sr": 52, "sc": 2.19, "ep": 3.58, "bs": 0.0, "d": 1, "age": 11.82, "grav": 113.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 824, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "I trust parmesan reggiano to be a protected, specific product. I expect Aspirin to contain acetylsalicylic acid. The increasingly rampant fraud in basic consumer goods is dissolving the base line trust that keeps a society in working order."}, {"id": 50631905, "au": "giobox", "dom": 102, "sr": 53, "sc": 2.11, "ep": 3.65, "bs": 0.0, "d": 3, "age": 9.62, "grav": 82.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 5507, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.497, "fa": 0.0, "gp": 0.092, "bl": 0.0, "ds": 0.0, "txt": "The main issue is \"Parmesan\" is a regulated product in Europe, and if you buy \"Parmesan\" in an EU supermarket it is essentially guaranteed to be what you expect.\n\nIn the USA, there is a far greater variety in the products you are legally allowed to apply the \"Parmesan\" title to - there isn't the same restrictions on ageing, milk treatments and additives etc.\n\nThe DOP label in the US at least ensures the cheese meets the European definition on the cheese. I have no doubt great Parmesan can/could/is being made in the USA, its just that most of the time the stuff you pick up in mainstream supermarkets that is not DOP labelled is rarely this."}, {"id": 50635296, "au": "dml2135", "dom": 104, "sr": 54, "sc": 1.99, "ep": 3.31, "bs": 0.0, "d": 2, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 9, "k": 1636, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.86, "fa": 0.42, "gp": 0.066, "bl": 0.0, "ds": 0.0, "txt": "> which are almost always superior to fresh for sauces\n\nI don't know why people always say this.\n\nCanned tomatoes are almost always superior to store bought fresh tomatoes for sauces. Because most tomatoes at the grocery store are terrible.\n\nBut grow your own tomatoes (or spend fortune at the farmer's market) and you can absolutely make a sauce that meets or exceeds that made from a can."}, {"id": 50638065, "au": "gruez", "dom": 28, "sr": 55, "sc": 1.96, "ep": 3.51, "bs": 0.0, "d": 3, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 9, "k": 45872, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 0.982, "fa": 0.42, "gp": 0.001, "bl": 0.0, "ds": 0.0, "txt": ">and rBGH milk isn’t a concern when you go shopping.\n\nYou really need a nation wide government backed cartel to enforce health and safety standards? Moreover even in the US growth hormones in milk have largely be phased out due to consumer pressure."}, {"id": 50630773, "au": "bbarn", "dom": 145, "sr": 56, "sc": 1.96, "ep": 3.38, "bs": 0.0, "d": 1, "age": 10.9, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3987, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I used to be a San Marzano snob in my cooking.  But look at the claims and what makes them better: Lower water content, concentration of flavor, sweeness.\n\nYou can solve all of things and make cheaper tomatoes taste the same.  Too acidic?  Add Sugar.  Too thin? Reduce.  Not flavorful enough?  Add concentrate(tomato paste)."}, {"id": 50635373, "au": "Spooky23", "dom": 68, "sr": 57, "sc": 1.96, "ep": 3.33, "bs": 0.0, "d": 1, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 47051, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 0.064, "bl": 0.0, "ds": 0.0, "txt": "Your experience is similar to mine. Cento is not a great brand. Growing up in NYC it was the sale brand at shop rite\n\nUsually I find domestic Hunts tomatoes to be good and consistent. I don’t have a Wegmans, but my local Italian stores carry Cora and other imported brands which are usually great."}, {"id": 50637862, "au": "paxy", "dom": 44, "sr": 58, "sc": 1.96, "ep": 3.32, "bs": 0.0, "d": 1, "age": 0.62, "grav": 5.7, "surf": 9.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 3707, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.577, "fa": 0.68, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Shouldn't really be surprising that imported Italian tomatoes are expensive in America. You can get local ones for $1-$1.50 per can."}, {"id": 50634053, "au": "knvlt", "dom": 25, "sr": 59, "sc": 1.96, "ep": 3.31, "bs": 0.0, "d": 0, "age": 7.38, "grav": 56.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 10, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 0.752, "fa": 0.0, "gp": 1.066, "bl": 0.0, "ds": 0.0, "txt": "Offtopic: As a german I can’t really argue about quality of canned tomatoes in the u.s.\n\n…but: The 3$-8$ range seems insane for me. Is this normal? Or are we talking “premium city prices”?\n\n2€ (2,19$) is the good stuff, but you get decent canned tomatoes for 1€."}, {"id": 50634527, "au": "gralab", "dom": 58, "sr": 60, "sc": 1.96, "ep": 3.3, "bs": 0.0, "d": 1, "age": 6.75, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 19, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.176, "fa": 0.0, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "Are you sure you got \"real\" SMTs? There's another brand that flagrantly copies the label art of the real SMT brand you can find in most gourmet markets. You can't tell it's a knockoff until you really inspect the label.\n\nThe real ones are quite good. Not at all watery or tasteless."}, {"id": 50636726, "au": "adjejmxbdjdn", "dom": 37, "sr": 61, "sc": 1.96, "ep": 3.25, "bs": 0.0, "d": 2, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1209, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.913, "fa": 0.34, "gp": 0.094, "bl": 0.0, "ds": 0.0, "txt": "I bet if you looked back 7 years or more, that delta would be dramatically smaller and the expense would probably be reversed.\n\nEuropeans would buy European products in the U.S. because it used to be cheaper."}, {"id": 50630808, "au": "giobox", "dom": 100, "sr": 62, "sc": 1.96, "ep": 3.24, "bs": 0.0, "d": 1, "age": 10.86, "grav": 99.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5507, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.317, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "There are Italian staple items that locally made in the US are pretty bad - Paremsan cheese springs to mind. I've yet to find an American made Parmesan that tastes remotely like the real thing to my taste buds, and I am honestly thankful the DOP label exists at all to get my regular parmesan fix."}, {"id": 50630359, "au": "theoreticalmal", "dom": 149, "sr": 63, "sc": 1.96, "ep": 3.18, "bs": 0.0, "d": 1, "age": 11.36, "grav": 106.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 539, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.221, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "Where do you live and how fancy of a grocery store do you shop at? In my area, if I go to the local Kroger, there is an ocean of difference between the cheapest and most expensive option for each product. Like “the cheapest option causes gastrointestinal distress within minutes of consumption”"}, {"id": 50636830, "au": "markdown", "dom": 83, "sr": 64, "sc": 1.96, "ep": 3.1, "bs": 0.0, "d": 1, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4067, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.318, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's truly wild and amazing that they do this in Italy. Hopefully the consortium has greater success in shutting down the appropriators and thieves.\n\nThe US is inconsistent about this sort of thing. They respect Designation of Origin and Geographic Indicators in some circumstances (eg. Tequila) but not others, like San Marzano tomatoes."}, {"id": 50636351, "au": "FranOntanaya", "dom": 39, "sr": 65, "sc": 1.96, "ep": 3.1, "bs": 0.0, "d": 2, "age": 4.1, "grav": 25.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 794, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.485, "fa": 0.62, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "The exchange rate is somewhat unnatural since so many economies outside the US use dollars. For example, FED says about 45% of US banknotes are outside the US at any given time."}, {"id": 50635040, "au": "consp", "dom": 8, "sr": 66, "sc": 1.96, "ep": 3.09, "bs": 0.0, "d": 4, "age": 6.09, "grav": 43.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4595, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.316, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They almost always have added E330 (citric acid) and sugar, though sugar is getting less often or they mask it with \"natural sugars\" (aka apple). All the cheaper ones here (n/w eu) have it, as do most of the expensive ones. If I remember correctly some of the Italian stuff is canned with a different coating inside and doesn't have it but could be mistaken."}, {"id": 50637644, "au": "fwip", "dom": 86, "sr": 67, "sc": 1.96, "ep": 3.08, "bs": 0.0, "d": 3, "age": 1.13, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 4043, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.312, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a feature, not a bug. Europe has longer memories than America, and has decided that culturally significant products should be protected.\n\nA German startup is free to grow those same tomatoes, call them Das Hamburg, and compete on quality or price. You just can't lie about it, the same way you can't sell your own \"Cento Tomatoes\" in America.\n\nAlso, Consortium, not Cartel."}, {"id": 50630023, "au": "AndrewKemendo", "dom": 178, "sr": 68, "sc": 1.96, "ep": 3.05, "bs": 0.0, "d": 2, "age": 11.72, "grav": 111.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 23782, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.299, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Indeed it is and cheese is notoriously fraudulent.\n\nI wouldn’t trust any parm that isn’t in a hard block form at this point, as all other versions are adulterated with cellulose or other packaging modifiers and stabilizers\n\nEventually everyone is going to have a mass spectrometer at home to verify quality."}, {"id": 50635369, "au": "D-Machine", "dom": 105, "sr": 69, "sc": 1.96, "ep": 2.94, "bs": 0.0, "d": 3, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Only if you also select the right cultivar, but, yes, this is why the \"almost always\" hedge is there. For a very brief period in the year, in a few very special locations on the planet, and for a lot of money (and/or effort growing them yourself), you can do better than canned!\n\nEDIT: As another has noted in this thread, things like managing your soil pH and likely all sorts of other factors also matter. Can you be sure you (or your farmer) are doing all this, and correctly? Real DOP handles this all."}, {"id": 50635107, "au": "D-Machine", "dom": 109, "sr": 70, "sc": 1.96, "ep": 2.93, "bs": 0.0, "d": 3, "age": 5.98, "grav": 42.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 911, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Could be, especially if her tomatoes were a cultivar meant for sauces, and if you weren't aware of the difference and bought bad canned. There are also exceptions to all general rules.\n\nIt isn't like this is a controversial thing I am saying, plenty of professional chefs agree with me. In general, good canned tomatoes make far superior sauces to almost all fresh tomatoes, and are also available year round. If you are in the very rare case where you have access to fresh tomatoes of the right kind, well, then, great! This is not most people most of the year in most countries."}, {"id": 50634923, "au": "tristor", "dom": 79, "sr": 71, "sc": 1.96, "ep": 2.92, "bs": 0.0, "d": 2, "age": 6.23, "grav": 44.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 11284, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No, he means a tomato that would be used to make tomato paste in a can vs being canned whole.  San Marzano tomatoes are almost always canned whole.  Paste tomatoes (there are many kinds) generally have a lower moisture content than tomatoes intended for slicing or eating whole, which makes them cook down faster for making tomato paste or sauce."}, {"id": 50634828, "au": "consp", "dom": 32, "sr": 72, "sc": 1.96, "ep": 2.92, "bs": 0.0, "d": 2, "age": 6.37, "grav": 45.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 4595, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The ones we usually have are 400g, but premium brands also come in 800g or about 800ml which is about the same. Anywhere from 35ct/400g for carved tomatoes no brand/no name, to 3,80/400g for premium Pomodoro San Marzano (most expensive I could find at the most expensive supermarket). The 800g can of premium popla was 3.09 but couldn't find anything else of that weight quickly."}, {"id": 50634367, "au": "knvlt", "dom": 46, "sr": 73, "sc": 1.96, "ep": 2.89, "bs": 0.0, "d": 2, "age": 6.97, "grav": 51.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 10, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks, we have 500ml (17oz) and I didn‘t think about different sizes. Makes more sense now.\n\nI also understand that imported premium groceries kissed by the sacred earth of an italian volcano are in the upper price range."}, {"id": 50630510, "au": "dessimus", "dom": 180, "sr": 74, "sc": 1.96, "ep": 2.89, "bs": 0.0, "d": 3, "age": 11.19, "grav": 103.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 668, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's \"adulterated\" with cellulose because most consumers want the convenience of  picking up a container and sprinkling some grated parm on their food and not have it just act like a Shake Weight as solid slug of cheese slides back and forth in the container."}, {"id": 50635175, "au": "cwillu", "dom": 71, "sr": 75, "sc": 1.96, "ep": 2.85, "bs": 0.0, "d": 1, "age": 5.89, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 8298, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Another coment here points out that some properly authentic DOP-labeled tomatos lack the properties that are the entire point of the tomato due to being grown in the wrong neutral ph soil."}, {"id": 50635191, "au": "kulahan", "dom": 52, "sr": 76, "sc": 1.96, "ep": 2.83, "bs": 0.0, "d": 2, "age": 5.87, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 3587, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.204, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "“Perfectly good” is one of the most value-oriented phrases I could imagine.\n\nNobody wants “perfectly good” truffles or “perfectly good” ham, they just settle for it. If you’re looking for a globally premiere ingredient, then something at that tier would be incredibly disappointing.\n\nIn the US, you can definitely find extremely affordable, perfectly good tomato cans, but avoided. In the comments here you will see that large cans can be found for under a dollar."}, {"id": 50634443, "au": "johnthedebs", "dom": 95, "sr": 77, "sc": 1.96, "ep": 2.81, "bs": 0.0, "d": 1, "age": 6.87, "grav": 50.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1656, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fresh_canned", "flbl": "Fresh & Canned (Sauce)", "urls": [], "ig": 1.195, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've tried many different types of canned tomatoes for making pasta sauce, and IME these are the best. They're not \"true\" San Marzano tomatoes, but they are absolutely delicious and don't have the metallic taste that a lot of other canned tomatoes have. The sauce I typically make has exactly 3 ingredients (butter, garlic, these tomatoes) and in my opinion (and my partner's) it's one of the best tomato sauce I've had."}, {"id": 50638073, "au": "DiabloD3", "dom": 89, "sr": 78, "sc": 1.96, "ep": 2.8, "bs": 0.0, "d": 6, "age": 0.15, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 47634, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.193, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No.\n\nI cannot use the words \"San Marzano\" anywhere on the product. I can say tomato, I can say plum tomato, I can use Roma tomatoes (the most popular paste tomato commercially produced today, and is a San Marzano descendant) and say I use Roma tomatoes (since it does not have DOP designation), but I cannot say \"Roma is a San Marzano hybrid\" on my product."}, {"id": 50635159, "au": "throwaway27448", "dom": 10, "sr": 79, "sc": 1.96, "ep": 2.8, "bs": 0.0, "d": 3, "age": 5.9, "grav": 41.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "Europe certainly uses citric acid as a tomato preserve. It may not be obvious looking at the can but this is hardly an american-specific thing."}, {"id": 50635933, "au": "xattt", "dom": 27, "sr": 80, "sc": 1.96, "ep": 2.78, "bs": 0.0, "d": 2, "age": 4.77, "grav": 31.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 5947, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "imported_america", "flbl": "Imported & America (Expensive)", "urls": [], "ig": 0.984, "fa": 0.0, "gp": 0.325, "bl": 0.0, "ds": 0.0, "txt": "European dairy in Canada is even more expensive as a result of a planned market by the Canadian Dairy Commission.\n\nIt does have a place as it has enabled many small farms to continue to operate and rBGH milk isn’t a concern when you go shopping."}, {"id": 50634998, "au": "criley2", "dom": 19, "sr": 81, "sc": 1.96, "ep": 2.68, "bs": 0.0, "d": 1, "age": 6.14, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 4735, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Generally speaking the calcium chloride is only added to diced tomatoes to help them keep their shape. I've never seen it in whole or crushed tomato ever. And at least in the US, cento DOES include it in diced tomatoes while other brands may not."}, {"id": 50637390, "au": "shrubble", "dom": 20, "sr": 82, "sc": 1.96, "ep": 2.66, "bs": 0.0, "d": 2, "age": 1.79, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 25, "qw": 0, "k": 5686, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": ["https://www.cento.com/product-detail/?brand=C&item=070796400070", "https://www.walmart.com/ip/Great-Value-Whole-Peeled-Tomatoes-28-oz/10415481"], "ig": 1.132, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Cento: https://www.cento.com/product-detail/?brand=C&item=070796400... , has no calcium chloride (click on Nutrition Facts)\n\nWal-Mart house brand:  https://www.walmart.com/ip/Great-Value-Whole-Peeled-Tomatoes... does have calcium chloride (see the 3rd or 4th image that shows ingredients)"}, {"id": 50630698, "au": "tencentshill", "dom": 70, "sr": 83, "sc": 1.96, "ep": 2.65, "bs": 0.0, "d": 0, "age": 10.98, "grav": 100.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2108, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_buy", "flbl": "Brand & Buy (Label)", "urls": [], "ig": 0.672, "fa": 0.0, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "So... bottom line is look for the DOP label. It's the only real label in the US, though it's technically unenforceable."}, {"id": 50630497, "au": "luckydata", "dom": 118, "sr": 84, "sc": 1.96, "ep": 2.62, "bs": 0.0, "d": 1, "age": 11.2, "grav": 104.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 3219, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.113, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "DOP is ABSOLUTELY a mark of quality. Italy takes food certifications very seriously. The problem is mostly that the US allows their producers to counterfeit foreign products with essentially total impunity."}, {"id": 50635948, "au": "EA-3167", "dom": 40, "sr": 85, "sc": 1.96, "ep": 2.55, "bs": 0.0, "d": 2, "age": 4.74, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 5730, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Plus we aren’t within a brisk day’s walk of Italy, there’s a lot of shipping involved in getting something from Italy to say… Wyoming."}, {"id": 50637513, "au": "stellar678", "dom": 11, "sr": 86, "sc": 1.96, "ep": 2.55, "bs": 0.0, "d": 3, "age": 1.46, "grav": 9.4, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 1228, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 0.975, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "People love being wrong about things like this.\n\nIt's so popular: \"Eww, the US does food so different. Our European industrial mass-market canned tomatoes come from pastoral farms tended by a Spanish grandfather who lovingly carries them in a basket to his wife who preserves them in a traditional process her family has followed for two thousand years.\" (Hint: Grandma added acid too if she wanted to create safe food preservation.)\n\nCitric acid is just about the most basic ingredient you could add to packaged food after salt. In fact, canned vegetables often skip the salt but they still have to include acid to hit the proper food-safe acidity.\n\nIt's in almost every can of tomatoes in every supermarket in the world. You might think it's not, but just look.\n\nI just checked France (Auchan), Germany (Aldi), Spain (Carrefour). Their canned tomatoes all include citric acid."}, {"id": 50633645, "au": "CocaKoala", "dom": 122, "sr": 87, "sc": 1.96, "ep": 2.54, "bs": 0.0, "d": 4, "age": 7.75, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1084, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "oil_olive", "flbl": "Oil & Olive (Cheese)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think adhering to certain standards means that quality is enforced, but only for the inputs. Are the ingredients correct? Is the process correct?\n\nIt's possible to start with good ingredients, follow the process strictly, and still end up with a bad final product that would pass a certification of standards, but not necessarily pass a quality check."}, {"id": 50637732, "au": "ryeights", "dom": 59, "sr": 88, "sc": 1.96, "ep": 2.53, "bs": 0.0, "d": 2, "age": 0.94, "grav": 7.0, "surf": 4.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1783, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "san_marzano", "flbl": "San & Marzano (Tomato)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There is no ‘real SMT brand’ as such. Simpson Brands renamed their ‘San Marzano’ line of tomatoes to SMT/San Merican Tomatoes, using the same artwork. Neither contain(ed) actual DOP San Marzano tomatoes."},
