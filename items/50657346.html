, "dom": 67, "sr": 2, "sc": 7.53, "ep": 7.53, "bs": 0.0, "d": 3, "age": 4.94, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 264, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": ["https://store.steampowered.com/app/2109060/Magenta_Horizon_Neverending_Harvest/"], "ig": 1.563, "fa": 0.96, "gp": 0.77, "bl": 0.0, "ds": 0.0, "txt": "Of course there are.\n\nIf you want an example, from the ones that actually played it I've consistently heard that Magenta Horizon (https://store.steampowered.com/app/2109060/Magenta_Horizon_N...) has incredible sidescrolling combat, and some of the best action combo implementation out of anything they've played. A lot of positive comparisons to Ninja Gaiden.\n\nBut. It's really difficult, and made for a very niche audience (like someone who wanted Hollow Knight/Silksong to be 100% combat focused arena games instead of exploration/adventure ones). So, the game has languished in obscurity. There are dozens more just like that, even ones with less attention and less reviews (100 is pretty good for obscure steam games...)."}, {"id": 50673854, "au": "Arainach", "dom": 130, "sr": 3, "sc": 7.35, "ep": 7.49, "bs": 0.0, "d": 8, "age": 13.95, "grav": 146.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 9, "k": 10957, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 1.811, "fa": 0.42, "gp": 1.407, "bl": 0.0, "ds": 0.0, "txt": "There's a huge difference between \"my job contracted me out for some duty that involved interacting with the US Army\" and \"I agreed to participate in a multi-day ad campaign for the US Army and used my massive platform to support them\".\n\nAlmost no one is being condemned for working for the janitorial contractor assigned to an army base or whatever. Doing PR work - taking the job - is endorsing the US Military and explicitly providing support in a manner far stronger than \"working with\".\n\nIf any of my friends accepted a job advertising gambling companies, I would choose to stop associating with them. If they accepted a job advertising for an organization that was threatening to invade my country I'd stop associating them and call them out publicly....which is what happened here.\n\n> The poster you’re responding to was speaking sarcastically\n\nNo, they weren't - their chain of repeated comments makes their perspective obvious."}, {"id": 50676606, "au": "bschne", "dom": 1, "sr": 4, "sc": 6.91, "ep": 6.91, "bs": 0.0, "d": 0, "age": 5.04, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 41, "k": 6082, "kpp": 8.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": ["https://x.com/LocalThunk/status/1820752209765961746"], "ig": 1.022, "fa": 1.04, "gp": 1.068, "bl": 0.0, "ds": 0.0, "txt": "I once joked on Twitter about how disastrous it would be for Balatro to incorporate gambling mechanisms due to how addictive it was. That led to someone pointing me towards what is now my favorite Balatro fact: LocalThunk really, really does not want that to happen.\n\n> From the outside this might make 0 sense but I hate the thought of Balatro becoming a true gambling game so much that when I recently created my will I stipulated that the Balatro IP may never be sold or licensed to any gambling company/Casino\n\nhttps://x.com/LocalThunk/status/1820752209765961746"}, {"id": 50675528, "au": "ACCount39", "dom": 58, "sr": 5, "sc": 6.02, "ep": 6.02, "bs": 0.0, "d": 2, "age": 8.98, "grav": 74.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 210, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 1.719, "fa": 0.34, "gp": 0.695, "bl": 0.0, "ds": 0.0, "txt": "It's a real thing on mobile, where gameplay ideas get cloned the moment someone runs a big stack of ads showing them off.\n\nBut it's mobile, and the afflicted games have the kind of gameplay loops you can often fit into a 30-second clip with 10 seconds to spare. Simple ideas that are easy to grasp - and clone. Not like the thing with gameplay loops being cloned there is new either, see: waves of Clash of Clans ripoffs. It just taking days now instead of weeks or months, like it used to.\n\nThe same was true in the deep dark pits of Roblox game development - also pre-AI.\n\nAmong the PC/console indies? I'm not aware of a lot of instances of this actually happening.\n\nThe closest thing to \"game got cloned and drowned in sea of pretenders\" might have been that \"needle in a haystack\" game? Which actually did spawn a ton of blatant clones. I think \"casual game, simple gameplay\" is a factor.\n\nI have seen a lot of game developers quiver in fear of it too, but I think that's just them being a paranoid bunch. There are way more games that die in pre-release, or release to an audience of 3 people, than there are games that even get popular enough for someone to want to clone them in the first place."}, {"id": 50676171, "au": "233mhz", "dom": 77, "sr": 6, "sc": 5.67, "ep": 5.81, "bs": 0.0, "d": 1, "age": 6.62, "grav": 48.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 17, "k": 443, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.606, "fa": 0.42, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "> What's everybody else supposed to do? \"Get featured on a big YouTube channel\" is like winning the lottery\n\nMost \"viral\" games spend hundreds of thousands on marketing. A lot of streamers aren't playing game for fun, they're basically ad agencies selling views for money.\n\nOnce you dig into the video game industry, especially the mobile video games one, it's very clear that indie is mostly dead. Mega corps own hundreds of games and spend millions on ads every year, basically every \"trending\" game you see on app stores are engineered from the ground up to be viral."}, {"id": 50675486, "au": "nhinck3", "dom": 56, "sr": 7, "sc": 5.52, "ep": 5.67, "bs": 0.0, "d": 2, "age": 9.14, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 76, "qw": 0, "k": 225, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": ["https://store.steampowered.com/search?term=needle&hwtype=0&supportedlang=english&ndl=1"], "ig": 1.377, "fa": 0.62, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "It's hard to know an unknown but clones are definitely coming in hard and fast.\n\nThere were always clones but the time from clone to new release is getting shorter and shorter.\n\nTake \"Find the Needle\", it released a demo on the 11th of September and had multiple clones out before its own full release on the 7th of November.\n\nIt might not have impacted this game's sales but I think developers will think twice before releasing demos.\n\nhttps://store.steampowered.com/search?term=needle&hwtype=0&s..."}, {"id": 50676432, "au": "mpeg", "dom": 40, "sr": 8, "sc": 5.28, "ep": 5.28, "bs": 0.0, "d": 1, "age": 5.69, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 3211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.523, "fa": 0.28, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "I thought I would love this game, but I really didn't enjoy it that much – I played one run and found it to be quite long and the unlocks not appealing enough to go for a second run, it also felt very luck dependant\n\nIn contrast, slay the spire completely hooked me and my early runs were very short until I figured out a consistent strategy with each character (which are all very different), in my runs I never feel like it's mostly luck based (although it does play an important part)\n\nMaybe I should give Balatro another go, I imagine it's had updates, I only ever played it at launch"}, {"id": 50675909, "au": "ThreeFeetGames", "dom": 73, "sr": 9, "sc": 5.19, "ep": 5.48, "bs": 0.0, "d": 2, "age": 7.55, "grav": 58.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 8, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 1.339, "fa": 0.56, "gp": 0.511, "bl": 0.0, "ds": 0.0, "txt": "I think it depends on where you place the line of success. Balatro was/is an overwhelming success. Most devs would consider a game with 100x less revenue per hour of development work to be a successful game.\n\nIMO you're right on the table stakes, but if you manage all of them and have a great hook, you'll be successful, streamers featuring you or not. Without the hook, then yes, we're dropping more into luck land."}, {"id": 50676411, "au": "xpct", "dom": 14, "sr": 10, "sc": 5.12, "ep": 5.12, "bs": 0.0, "d": 1, "age": 5.75, "grav": 39.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 13, "k": 863, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": ["https://magic.wizards.com/en/news/making-magic/twenty-years-twenty-lessons-part-3-2016-06-13"], "ig": 0.469, "fa": 1.32, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "\"Listening to the community\" is often abused online. The common sentiment among game developers is that people know the pain points, but not the features that would fix them.\n\nSee MTG for example:\n\n> Lesson \u002319: Your audience is good at recognizing problems and bad at solving them\n\nhttps://magic.wizards.com/en/news/making-magic/twenty-years-..."}, {"id": 50674619, "au": "teraflop", "dom": 121, "sr": 11, "sc": 5.09, "ep": 5.38, "bs": 0.0, "d": 4, "age": 12.2, "grav": 118.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 17500, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 1.67, "fa": 0.0, "gp": 1.005, "bl": 0.0, "ds": 0.0, "txt": "Bear in mind that Twitch followers and YouTube subscribers include every account that has ever followed, including accounts that are now long-dormant. So the fact that it dropped is meaningful, but the size of the drop as a fraction of the total is pretty meaningless.\n\nIt's kind of like how Reddit used to show a subreddit's \"size\" as the number of accounts which had ever been subscribed to it, giving a huge boost to subreddits that had been around for a long time and were formerly active, regardless of current usage. A lot of people complained when that number got hidden but the reality is that it was never particularly meaningful."}, {"id": 50676893, "au": "bspammer", "dom": 47, "sr": 12, "sc": 5.03, "ep": 6.03, "bs": 0.85, "d": 4, "age": 4.12, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 2380, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 0.938, "fa": 0.95, "gp": 0.77, "bl": 0.32, "ds": 0.0, "txt": "I could spend 4 hours compiling a list of popular games from the last 15 years or about 10 seconds typing a prompt. Not a hard choice."}, {"id": 50675573, "au": "Fricken", "dom": 74, "sr": 13, "sc": 4.83, "ep": 5.27, "bs": 0.0, "d": 2, "age": 8.82, "grav": 72.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 7865, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.114, "fa": 0.68, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "I suppose you could have been born an amoeba, but between one indie game developer and another success is mostly contingent on making a good game. For every 1000 indie games there are 1 or 2 actually worth playing for more than 10 minutes, and those ones tend to rise to the top."}, {"id": 50675548, "au": "jaredklewis", "dom": 20, "sr": 14, "sc": 4.71, "ep": 4.86, "bs": 0.0, "d": 2, "age": 8.91, "grav": 73.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 207, "qw": 0, "k": 4400, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 1.772, "fa": 0.0, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "I think it is fine as long as the founder/coder/whoever is just using the feedback as a source for ideas, not as the criteria for evaluating if the ideas are good or not.\n\nSix years or so back I was experimenting with Elixir. I never ended up using it for anything important, but I still remember marveling at the wonderful personality of Jose Valim as I learned about Elixir. He was accessible on all kinds of channels like github, stack overflow, irc, and such, and he just exuded an openness to feedback. It seemed to me he was constantly interacting with Internet strangers about their ideas for Elixir. He always came off as very friendly and encouraging; I can never remember him being defensive or dismissive. Despite that, my impression was that Valim did not seem inclined to implement almost any of these ideas. He seemed to have a strong vision for what Elixir should be and passed on almost everything. Sometimes ideas were directly incorporated into Elixir, but mostly I think the effects of the feedback were indirect.\n\nAnother language I experimented with around that time (and again never used for anything important) was Elm. Elm's founder engaged with unsolicited feedback very differently. The contrast between the two approaches made a huge impression on me."}, {"id": 50675271, "au": "marcus_holmes", "dom": 72, "sr": 15, "sc": 4.16, "ep": 4.6, "bs": 0.0, "d": 1, "age": 9.92, "grav": 86.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 17268, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.456, "fa": 0.0, "gp": 0.81, "bl": 0.0, "ds": 0.0, "txt": "Success is mostly a matter of luck.\n\nA good hook (or business model for startups), not too many bugs, good enough artwork, good enough sound, etc is all table stakes. It'll fail without them but it won't succeed because of them. Necessary but not sufficient.\n\nRead any successful startup story and there's a similar \"and then we got lucky\" moment."}, {"id": 50675235, "au": "umvi", "dom": 64, "sr": 16, "sc": 3.77, "ep": 4.44, "bs": 0.0, "d": 0, "age": 10.05, "grav": 88.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 18997, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.897, "bl": 0.0, "ds": 0.0, "txt": "The entire thing hinged on that big streamer playing the game and single handedly kickstarting a marketing snowball... if that had not happened the game would still be languishing in obscurity and only have a few hundred downloads instead of millions.\n\nWhat's everybody else supposed to do? \"Get featured on a big YouTube channel\" is like winning the lottery"}, {"id": 50674795, "au": "joshdavham", "dom": 85, "sr": 17, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 0, "age": 11.66, "grav": 110.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2257, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.437, "bl": 0.0, "ds": 0.0, "txt": "This is incredibly inspiring! Big respect!\n\nAlso super based to write a game in Lua of all languages.\n\nI also just looked up his home province and he's from Regina, Sasketchewan, too. Super cool to hear as a fellow Canadian prairie boy."}, {"id": 50674548, "au": "dr_kiszonka", "dom": 13, "sr": 18, "sc": 3.7, "ep": 4.0, "bs": 0.0, "d": 0, "age": 12.41, "grav": 121.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2100, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 1.159, "bl": 0.0, "ds": 0.0, "txt": "One thing that distinguishes the author from others is actively seeking out feedback and acting upon it.\n\nThere are so many devs who create a Discord channel for their paid product only to completely ignore feedback and feature requests. And it is fine for them to ignore them. It is their product after all. But it is frustrating to see a decent game or app never achieve what it could have become had the creator been a bit more open-minded."}, {"id": 50674660, "au": "Buttons840", "dom": 104, "sr": 19, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 5, "age": 12.08, "grav": 116.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 14995, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.153, "fa": 0.22, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "A flopped game is unlikely to have a walkthrough or community who has minmaxed every strategy. Refreshing.\n\nAI could probably help you as a partner in solving puzzles, but it wont just say \"oh, you're talking about puzzle 49 of Popular Puzzle Game, here's what you do...\"."}, {"id": 50674495, "au": "lairv", "dom": 29, "sr": 20, "sc": 3.28, "ep": 3.72, "bs": 0.0, "d": 0, "age": 12.53, "grav": 123.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 3223, "kpp": 11.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.044, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "Nice write-up, something that surprised me is that it took 8 months between a popular streamer playing the game, and the game being publicly available on Steam. This now seems like such a slow timeline, I would have been afraid of people losing interest"}, {"id": 50675086, "au": "pull_my_finger", "dom": 141, "sr": 21, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 2, "age": 10.68, "grav": 96.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 948, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 1.028, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're correct. I wish it were released \"DRM free for PC\". I am not a Steam user, but I am aware it's on there. That's why I mentioned GOG and Itch specifically, but you're right, I worded that poorly (incorrectly)."}, {"id": 50676727, "au": "icantevenhold", "dom": 26, "sr": 22, "sc": 3.18, "ep": 3.62, "bs": 0.0, "d": 2, "age": 4.59, "grav": 29.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 609, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 1.127, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not sure why you are being downvoted but agree.\n\nIf you want to create great art your helps to ignore some feedback (not 100% of it but also not accept everything as valid feedback)\n\npart of why AAA games are so shit is that they try to build something that appeals to everyone and then it’s just bad / ordinary"}, {"id": 50674196, "au": "Buttons840", "dom": 99, "sr": 23, "sc": 3.18, "ep": 3.54, "bs": 0.0, "d": 3, "age": 13.18, "grav": 133.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 14995, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 0.163, "bl": 0.0, "ds": 0.0, "txt": "On the other hand, it's hard to find a great game that flopped.\n\nMost games that people claim are great games that flopped I look at and see obvious deficiencies.\n\nBalatro is a great game, it is immediately intriguing. Its gameplay is familiar enough that you understand what is happening, but you can also see that there's intriguing twists to the rules. The visuals support this; the visuals are also a balance of familiar and unique.\n\nAgain, if anyone knows of a truly great flop, I'd like to find it so I can play it and appreciate that I found a secret in life that I can't solve by asking AI."}, {"id": 50675041, "au": "pull_my_finger", "dom": 139, "sr": 24, "sc": 3.0, "ep": 3.37, "bs": 0.0, "d": 0, "age": 10.89, "grav": 99.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 948, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.432, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I really wish they'd release it for PC. I mean it's a Löve game, surely it would be easy enough. I added my support to the GOG Dreamlist in hopes it could be added one day. GOG or Itch would be fine hosts. It's not new or anything, so I'd think any concerns about general piracy would be non-issues. Heck, the source was available from launch afaik due to how transparent löve bundled apps are."}, {"id": 50675942, "au": "tstrimple", "dom": 59, "sr": 25, "sc": 2.97, "ep": 3.92, "bs": 0.0, "d": 1, "age": 7.44, "grav": 56.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 2931, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.257, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It sounds like you aren't really into indie games. There are so many more gems being released these days that I don't care if other people get suckered into some AI slop. Just like I didn't care while I was enjoying games and they were playing Facebook games or steam gatcha games. The filters for noise are pretty good and are pretty good at adapting to changes. If you cannot find a dozen solid indie titles in 2026 I think that reflects far more on you than the state of the industry."}, {"id": 50676817, "au": "jere", "dom": 109, "sr": 26, "sc": 2.95, "ep": 3.17, "bs": 0.0, "d": 0, "age": 4.35, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 5339, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "The thing that always amazed me about localthunk in this telling is how much they just loved tinkering on games in obscurity.\n\nEveryone knows Balatro is a masterpiece but when localthunk handed it to friends, it was crickets for months. No feedback until one person finally got back after months. I’m so envious of this kind of obsession/dedication in the face of complete apathy."}, {"id": 50676682, "au": "noncovalence", "dom": 34, "sr": 27, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 0, "age": 4.71, "grav": 30.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 112, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.726, "fa": 0.34, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "Could use a (2025) - got excited at first that this was gonna continue into the future laying out a timeline for 1.1 ."}, {"id": 50677957, "au": "mexicocitinluez", "dom": 10, "sr": 28, "sc": 2.62, "ep": 3.64, "bs": 0.0, "d": 3, "age": 2.15, "grav": 13.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 478, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.551, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I often take my nephews to Dave and Busters and each time I have to come to terms with the fact that they're going to spend their tokens on the dumbest games ever solely to win tickets.\n\nI guess part of it is that unlike in the 90s where arcades often contained games that you couldn't play at home, today almost every actual \"game\" we came across had a mobile version. Or based on a previous game like Temple Runner. And none of them are unique or interesting."}, {"id": 50674850, "au": "Buttons840", "dom": 101, "sr": 29, "sc": 2.4, "ep": 3.14, "bs": 0.0, "d": 5, "age": 11.47, "grav": 107.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 14995, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those are good suggestions, I might try them out--actually, I can't try the latter because I don't play games on iPad. Cinco Paus looks like it might have interesting mechanics, but the visuals are lacking and the game is in Portuguese only (or so a review says).\n\nThis is an example of what I mean. Games like these don't succeed or fail based upon luck, they never had what it takes to be hugely popular in the first place. I don't mean to put these games down, they look like good niche games, and have had some niche success."}, {"id": 50676416, "au": "bspammer", "dom": 30, "sr": 30, "sc": 2.34, "ep": 2.92, "bs": 0.0, "d": 1, "age": 5.74, "grav": 39.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 2380, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 1.12, "fa": 0.0, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "I was someone who watched that original stream, and a lot of people said the same thing at the time (he made it clear he wasn’t releasing any time soon). Honestly the game was so memorable and unique that I was constantly checking for updates on the game’s progress for the next 8 months. Sometimes quality speaks for itself."}, {"id": 50675317, "au": "galkk", "dom": 25, "sr": 31, "sc": 2.31, "ep": 3.19, "bs": 0.0, "d": 2, "age": 9.7, "grav": 83.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1959, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_product", "flbl": "Feedback & Product (Create)", "urls": [], "ig": 0.836, "fa": 0.28, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "Have you read the article? He specifically mentioned that he built games before for act of creating. The fact that this time he made something that people started to actively enjoy made him to work on it more and progress more."}, {"id": 50674515, "au": "phoghed", "dom": 120, "sr": 32, "sc": 2.28, "ep": 2.94, "bs": 0.0, "d": 3, "age": 12.48, "grav": 122.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1124, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I (ChatGPT lol) looked at the numbers because I didn’t expect him to actually take a big hit from this.\n\nHis followers on twitch and subscribers on YouTube are barely down, but seems like he did lose more than half to 3/4ths of his views on twitch and YouTube.\n\nI only knew him as an NL background character, he’s fairly boring."}, {"id": 50674436, "au": "OhSoHumble", "dom": 106, "sr": 33, "sc": 2.23, "ep": 2.67, "bs": 0.0, "d": 3, "age": 12.67, "grav": 125.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 3, "k": 867, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.137, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> because of slop-crowding\n\nYes and no. This problem existed long before AI flooded marketplaces.\n\nDiscovery is expensive and difficult. Ads are expensive. The absolute perfect game/book/website/whatever can exist out there and the person who made it can just not afford the ads to promote it.\n\nOr the skills to refine their ads and do SEO.\n\nOr they lack any social media presence.\n\nCreating something is only half of the problem. This has not changed though it has arguably gotten more difficult."}, {"id": 50674638, "au": "Forlien", "dom": 100, "sr": 34, "sc": 2.19, "ep": 3.74, "bs": 0.0, "d": 4, "age": 12.15, "grav": 117.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 85, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Michael Brough, creator of 868-BACK, has Cinco Paus (puzzle-y rogulike focused on the wand id mechanic) and Corrypt (sokoban puzzler). I'd say both are amazing games in their genres and really reward the time you spend thinking about them. If you're looking for great visuals though, these games aren't it."}, {"id": 50677068, "au": "wpietri", "dom": 2, "sr": 35, "sc": 2.17, "ep": 3.12, "bs": 0.0, "d": 1, "age": 3.71, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 59432, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 0.99, "fa": 0.0, "gp": 0.548, "bl": 0.0, "ds": 0.0, "txt": "On the rare occasions I'm in casinos I never gamble, but it's fascinating to watch people play. In short order the developer part of my brain will start coming up with ideas on how to make things better. Then I realize the local \"better\" is a global \"worse\" and march myself out without saying a word."}, {"id": 50676151, "au": "user43928", "dom": 133, "sr": 36, "sc": 2.0, "ep": 2.88, "bs": 0.0, "d": 9, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1460, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The list of countries the US has threatened to invade in the last decade: Greenland, Panama, Venezuela, Iran\n\nChances are most people participating in a political boycott did not in fact have their country threatened with invasion by the US Army.\n\nSo I want to be clear that an \"incredibly negative\" view of the US Army is a rather strong political view, and that you are expressing your political opinion rather than an universal truth that justifies boycotting people who work with the US Army."}, {"id": 50676658, "au": "bspammer", "dom": 21, "sr": 37, "sc": 1.98, "ep": 3.09, "bs": 0.0, "d": 1, "age": 4.81, "grav": 31.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2380, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 1.313, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, but none of that matters if the core gameplay loop isn't fun. I played the original Balatro demo, and while it had a lot less content, the core gameplay and artstyle was identical to the current game. And it was incredibly addictive. Imo the main thing that distinguishes the author from others is that he didn't set out to make something commercially successful, he just really enjoys making games and wanted to make something that was fun for himself and his friends."}, {"id": 50676228, "au": "vintermann", "dom": 93, "sr": 38, "sc": 1.9, "ep": 3.44, "bs": 0.0, "d": 1, "age": 6.47, "grav": 46.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 9187, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.214, "fa": 0.0, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "You are probably only two or three steps from Northernlion. This game succeded because it was good, little doubt about it - NL heard about it because a less famous streamer recommended it to him, that streamer heard of it because he was actively looking for good games and he caught wind of the enthusiasm from the developer's initial circle of players."}, {"id": 50677249, "au": "FinnLobsien", "dom": 62, "sr": 39, "sc": 1.89, "ep": 2.99, "bs": 0.0, "d": 0, "age": 3.3, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "A lot of stuff went in LocalThunk’s favor: streamers discovering the game, a publisher that seems genuinely symbiotic, etc.\n\nBut the much harder part is making a game so good and unique that a streamer keeps playing it and recommends it to their friends."}, {"id": 50676342, "au": "damascus_kei", "dom": 76, "sr": 40, "sc": 1.88, "ep": 3.2, "bs": 0.0, "d": 1, "age": 5.99, "grav": 42.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 66, "kpp": 8.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "I think it would have become popular even without streamer intervention. I played it before it was featured on popular streams (I am always looking out for new rogue-likes, and card games.) and I told everyone I knew about it. I even got my wife, who normally doesn't like games like this, to play. I knew it was something special after my first round. Games with quality and soul float to the top."}, {"id": 50675540, "au": "ACCount39", "dom": 80, "sr": 41, "sc": 1.84, "ep": 3.38, "bs": 0.0, "d": 2, "age": 8.94, "grav": 74.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.351, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Yep. Plenty of subpar games can afford enough streamer sponsorships to get 10k eyes on combined. The trick, of course, is whether other people - including other streamers - will look at the game and say \"oh I want to play this too\".\n\nYou really need to bottle the lightning. The supply for games outstrips demand - so if you don't have something special, or fail to find an audience for it? Utter obscurity."}, {"id": 50676335, "au": "Arainach", "dom": 134, "sr": 42, "sc": 1.83, "e ong", "dom": 71, "sr": 45, "sc": 1.73, "ep": 3.27, "bs": 0.0, "d": 1, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5249, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "Well, the article mentions that one of the streamer's friends or viewers mentioned it. If larger streamers have a few dozen partners and VIPs (who will be mostly avid gamers), then your game only needs to grab one of them or even someone in their respective orbits. In Balatro's case, it's good enough that it spreads virally quite easily."}, {"id": 50674121, "au": "trickz49", "dom": 98, "sr": 46, "sc": 1.6, "ep": 5.65, "bs": 2.52, "d": 2, "age": 13.34, "grav": 136.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 0.733, "fa": 0.95, "gp": 0.844, "bl": 0.95, "ds": 0.0, "txt": "More a comment on the fact that like 2% of steam games make more than $10k, tons of quality games don't even sell 100 copies because of slop-crowding"}, {"id": 50676187, "au": "Johanx64", "dom": 83, "sr": 47, "sc": 1.59, "ep": 3.13, "bs": 0.0, "d": 1, "age": 6.58, "grav": 47.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 17, "k": 410, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 0.822, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> What's everybody else supposed to do? \"Get featured on a big YouTube channel\" is like winning the lottery\n\nNo, it's not.\n\nI have seen many shit indie games get featured on a big YouTube channel(s), they never go anywhere, because the streamer has no interest spending their time playing a game they know is shit for more than a couple of minutes that they aren't having a good time playing.\n\nAnd the audience can tell.\n\nIt will drive a couple of sales, but that's all there is to it."}, {"id": 50676645, "au": "viraptor", "dom": 42, "sr": 48, "sc": 1.57, "ep": 2.96, "bs": 0.0, "d": 2, "age": 4.85, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 6, "k": 48206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 0.752, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> it also felt very luck dependant\n\nThere's a luck component as well of course, but the better you get the less the luck will matter. It's possible to beat the runs semi-consistently, even without relying on the crazy combos."}, {"id": 50673831, "au": "thereitgoes456", "dom": 129, "sr": 49, "sc": 1.53, "ep": 2.63, "bs": 0.0, "d": 7, "age": 13.98, "grav": 146.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 143, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "army_recruitment", "flbl": "Army & Recruitment (Military)", "urls": [], "ig": 0.427, "fa": 0.0, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "The poster you’re responding to was speaking sarcastically. Just because the US Army is controversial, doesn’t necessarily imply that anyone working with them should be branded persona non grata."}, {"id": 50676143, "au": "dwb", "dom": 61, "sr": 50, "sc": 1.53, "ep": 2.63, "bs": 0.0, "d": 0, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1294, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 0.926, "fa": 0.0, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "I’m such a softy that I actually teared up reading this. What an amazing experience and the success is well deserved! Glad his health held up and hope he got back to a better place after the launch..!"}, {"id": 50675300, "au": "galkk", "dom": 89, "sr": 51, "sc": 1.51, "ep": 2.83, "bs": 0.0, "d": 1, "age": 9.75, "grav": 84.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1959, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "balatro_addictive", "flbl": "Balatro & Addictive (Clones)", "urls": [], "ig": 0.834, "fa": 0.0, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "There are more than enough games that were featured by huge streamers that went nowhere. Balatro is super addictive fun that can make you sink huge amounts of time in it."}, {"id": 50677108, "au": "ThreeFeetGames", "dom": 22, "sr": 52, "sc": 1.49, "ep": 3.03, "bs": 0.0, "d": 2, "age": 3.57, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 8, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The commercial advice I've heard is to take a game that's successful, cut some parts completely, add unique parts, and modify other parts. It's a \"safe\" strategy which gives you flexibility while keeping core aspects you know are well received and you don't have to think about too much.\n\nThe less safe strategy is to go \"out there\" and do something completely different. If you're not looking for commercial success, you're more likely to do this. I think that strategy is more likely to give you a mega-hit, but much more likely to flop. Only for the brave!"}, {"id": 50677631, "au": "sanderjd", "dom": 9, "sr": 53, "sc": 1.47, "ep": 3.01, "bs": 0.0, "d": 2, "age": 2.66, "grav": 16.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 17610, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This puts words to the way I feel about the contemporary arcades I take my kids to. So many of the \"games\" are anti-fun claw machine and essentially slot machines for tickets. Sometimes they'll close for renovations and I'll have some hope that they're installing games that are fun, but nope, it's exactly the opposite. One of my local arcades just replaced their guitar hero game (one of the two fun games there) with two more claw machines. I don't know what we're doing here."}, {"id": 50676876, "au": "xboxnolifes", "dom": 75, "sr": 54, "sc": 1.42, "ep": 2.96, "bs": 0.0, "d": 1, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 6722, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "If you're an indie dev, you should be contacting every youtuber and streamer who might be even remotely interested in playing your game genre months ahead of when you plan on launching. If its a good game in a genre they like, why wouldn't they want to play it?\n\nThere are plenty of YouTube channels that are effectively ad promoters for their genre niches."}, {"id": 50677144, "au": "hdndjsbbs", "dom": 31, "sr": 55, "sc": 1.42, "ep": 2.81, "bs": 0.0, "d": 1, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 210, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think this is why Steam Wishlisting is so important. It's a proxy for buyer interest that lets you know if marketing is working and opens a channel with potential buyers. Obviously it doesn't translate 1:1 but it avoids the need for a panicked launch if you hit it big."}, {"id": 50677527, "au": "MetaWhirledPeas", "dom": 53, "sr": 56, "sc": 1.42, "ep": 6.75, "bs": 3.84, "d": 1, "age": 2.83, "grav": 17.1, "surf": 4.6, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 53, "qw": 0, "k": 1899, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spend)", "urls": ["https://www.reddit.com/r/playmygame/new/"], "ig": 1.421, "fa": 0.96, "gp": 0.462, "bl": 1.45, "ds": 0.0, "txt": "This is correct, although I would argue the clone aspect is almost irrelevant. An even bigger issue is/will be the crushing tidal wave of 100% LLM indie projects. Take a look at https://www.reddit.com/r/playmygame/new/ and notice there's a new game post every few minutes, and how almost zero get any discussion at all, let alone attention or praise."}, {"id": 50678831, "au": "fny", "dom": 7, "sr": 57, "sc": 1.42, "ep": 2.82, "bs": 0.0, "d": 3, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 7812, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "played_launch", "flbl": "Played & Launch (Game)", "urls": [], "ig": 1.106, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Players don't want to work hard for a dopamine hit.\n\nI can't remember where I read this, but slot players are often annoyed if a jackpot takes too long because they have to wait for the next play."}, {"id": 50676191, "au": "vintermann", "dom": 81, "sr": 58, "sc": 1.42, "ep": 2.79, "bs": 0.0, "d": 1, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 9187, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_streamer", "flbl": "Games & Streamer (Spe (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
