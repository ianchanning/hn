he work.\n\nI also have an anthropic account and I can do a lot more before I hit the limits.\n\nNow I read that they are reducing the limits even more and removing the resets. Well, so long and thank you for all the fish OpenAI."}, {"id": 50653777, "au": "voidifremoved", "dom": 20, "sr": 86, "sc": 2.88, "ep": 3.09, "bs": 0.0, "d": 2, "age": 6.14, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 208, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "6.1 felt very capable on medium and high, 6.2 feels almost useless on anything less than extra high, and frequently still does the wrong thing. I find I burn my allowance far faster just because it takes more attempts and has to work harder to get the same results."}, {"id": 50653474, "au": "bob1029", "dom": 110, "sr": 87, "sc": 2.87, "ep": 3.09, "bs": 0.0, "d": 1, "age": 6.95, "grav": 51.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.105, "fa": 0.0, "gp": 0.342, "bl": 0.0, "ds": 0.0, "txt": "I always preferred using API tokens because it's obvious and consistent.\n\nI think the next billing paradigm is going to be tokens per second per user. You'll pay for a certain amount of bandwidth."}, {"id": 50655180, "au": "formerly_proven", "dom": 68, "sr": 88, "sc": 2.87, "ep": 3.01, "bs": 0.0, "d": 5, "age": 3.06, "grav": 18.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 15073, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.06, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "With local LLMs these discussions tend to be quite meaningless, because people often run quants or use quantized KV without being aware that their experience is severely degraded relative to the FP8 or BF16 baseline."}, {"id": 50654500, "au": "sleight42", "dom": 170, "sr": 89, "sc": 2.87, "ep": 2.99, "bs": 0.0, "d": 0, "age": 4.33, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1208, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "Increasingly glad I threw a lot of money at an inferencing server. It cost a lot. The electricity bill won't be fun. I have about as many tokens to spend as one could hope for."}, {"id": 50653511, "au": "lbreakjai", "dom": 196, "sr": 90, "sc": 2.87, "ep": 2.93, "bs": 0.0, "d": 1, "age": 6.83, "grav": 50.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1125, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.245, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The separate token pools for chat and codex meant that we could share subscriptions between developers and non-developers, at work. I'm currently working from one of our business analysts' plan, because they never touch codex."}, {"id": 50651529, "au": "andriy_koval", "dom": 198, "sr": 91, "sc": 2.87, "ep": 2.92, "bs": 0.0, "d": 1, "age": 11.9, "grav": 114.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 460, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "more likely they are not competitive on coding models market, losing money, and want to shift funds somewhere else (e.g. chatgpt consumers with shopping and ads) where they hope to actually make profit."}, {"id": 50651559, "au": "demosthanos", "dom": 183, "sr": 92, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 1, "age": 11.82, "grav": 113.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2318, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.0, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "In OpenAI's favor is that they're still the one of the two that allows me to use my subscription with Pi, which is enough to keep me coming back.\n\nClaude Code's bloat and incessant churn have started to actually hurt productivity more than they help unless you have unlimited tokens to spend on the latest \"fan out\" or \"workflow\" stuff."}, {"id": 50651545, "au": "from_memory", "dom": 225, "sr": 93, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 0, "age": 11.86, "grav": 113.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 33, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 0.993, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I have noticed this in my day to day. Nice change, takes the pressure off of prioritizing jobs versus being able to try some more creative things. Not totally, not yet, but they are getting there I think.\n\nedit: wow, reading through the comments, I am in the minority. I'm still grateful for whatever that is worth."}, {"id": 50656553, "au": "coffeefirst", "dom": 92, "sr": 94, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 1, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 4613, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "billing_marke /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
