subagents. Sol is also doing terribly on Elo right now.\n\nAll of this might explain why 6.2 is getting such bad reviews. OpenAI appears to be in cost control mode."}, {"id": 50651896, "au": "seizethecheese", "dom": 120, "sr": 2, "sc": 15.57, "ep": 15.57, "bs": 0.0, "d": 1, "age": 10.95, "grav": 100.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 80, "qw": 14, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": ["https://github.com/bottomless/agent-duel", "https://agentduel.com/leaderboard"], "ig": 1.697, "fa": 3.45, "gp": 1.203, "bl": 0.0, "ds": 0.0, "txt": "> Neon came out with ridiculously good token efficiency compared to both Sol and Opus.\n\nThis definitely is false. The truth is actually the exact opposite! Neon generates way more output tokens than opponents in our battle system built on OpenCode (https://github.com/bottomless/agent-duel). Sol uses way fewer, Opus about normal.\n\n  Output tokens / opponent output tokens:\n\n  Sol 6.2:       0.35x\n  Gemini 4 Neon: 1.71x\n  Opus 5.5:      1.15x\n\nIn terms of time per task, Opus 5.5 and Neon are similar because Neon tokens per second is faster. Sol actually is one of the fastest per task, though has one of lowest scores on leaderboard (https://agentduel.com/leaderboard)"}, {"id": 50654310, "au": "latexr", "dom": 57, "sr": 3, "sc": 12.42, "ep": 12.42, "bs": 0.0, "d": 1, "age": 4.76, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 213, "qw": 14, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": ["https://www.wired.com/story/meet-the-sad-wives-of-ai/"], "ig": 1.764, "fa": 2.5, "gp": 0.793, "bl": 0.0, "ds": 0.0, "txt": "> The back-and-forth between which provider is more generous has been interesting to follow\n\nHas it been interesting? To each their own, but even before opening the comment section I was thinking it has been excruciatingly boring. Conversations on AI are dominated by meta subjects: “I used my AI to ask about which AI to use to tell my other AI to set up an AI to make me an app to let me use my AI. I then used that app to tell AI to change it to include billing, so now I know how much AI I’m using when I ask my AI about AI. Honey, come see this, it’s amazing! Honey?… What’s this, a note? ‘Dear Jeremy. You won’t shut the fuck up about putting AI on your AI. You have responsibilities. You’re not going to be the next billionaire, you’re just using the same shit as everyone else. You’re not an entrepreneur, you’re just another dudebro on the internet deluding himself instead of enjoying life. Goodbye’. Oh no, what have I done?! Better snap a photo to ask my AI what to do next. ‘Don’t worry about it, I can help you set up an AI girlfriend’? Let’s go!”\n\nNote: I do think the meta AI conversation, including on pricing, is supremely boring, but the second part of that is obviously a joke based on an article recently submitted to HN (https://www.wired.com/story/meet-the-sad-wives-of-ai/)."}, {"id": 50652147, "au": "revolvingthrow", "dom": 199, "sr": 4, "sc": 9.46, "ep": 9.46, "bs": 0.0, "d": 0, "age": 10.19, "grav": 90.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 736, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.705, "fa": 0.95, "gp": 1.896, "bl": 0.0, "ds": 0.0, "txt": "My weekly reset is in a few hours so I threw an \"evaluate this codebase, focusing on architecture and performance\" at Astra High, for a ~50k LoC project. It worked for 11 minutes and ate 92% of my 5hr usage on $20 plan. As is, Astra is unusable on the basic $20 plan and I found Sol 6.2 to be underwhelming.\n\nI think OpenAI is in big trouble: they're behind on coding, they haven't figured out how to monetize their huge mass of non-paying users, their recent side-projects like Dots seem to be floundering. Them trying to sneak this nerf just before Thanksgiving is extra sleazy."}, {"id": 50654328, "au": "joefourier", "dom": 82, "sr": 5, "sc": 9.45, "ep": 9.45, "bs": 0.0, "d": 3, "age": 4.73, "grav": 30.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 199, "qw": 0, "k": 1789, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 2.05, "fa": 0.95, "gp": 1.326, "bl": 0.0, "ds": 0.0, "txt": "That's bonkers, you'd have to divide the market cap of SpaceX by the number of launches to get that figure, and that has nothing to do with the true cost anyway. By that same logic, the true of a Costco hot dog combo is about $140 ($470B market cap / estimated 3.4 billion hot dogs sold since 1985), Costco must be losing so much money selling it for $1.50!\n\nFirstly, market cap isn't money \"given\", it's the value of all shares (including those still being held privately), and the actual money raised by the IPO was a small fraction of the total worth of the company. If you counted all the money that SpaceX actually got, it would be around $200B, so 200B/720 (the number of reported launches) gives about $300M per launch.\n\nBut that's still nonsensical because Falcon 9 was developed way before the IPO and financial shenanigans of the xAI/SpaceX merger, and you can't count the costs related to Grok, datacentres, Starlink, Starship, buying Twitter, etc. when estimating how much a launch costs. The whole Falcon 9 programme (including reusability) only cost about $2B to develop from what I could look up. Nobody is paying $3B to launch a Falcon 9 anymore than anybody is paying $140 for a Costco hotdog."}, {"id": 50653662, "au": "rwarfield", "dom": 75, "sr": 6, "sc": 8.99, "ep": 9.14, "bs": 0.0, "d": 3, "age": 6.49, "grav": 47.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 9, "k": 407, "kpp": 15.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.519, "fa": 1.1, "gp": 1.679, "bl": 0.0, "ds": 0.0, "txt": "They are losing money because they are investing heavily in future models, not because serving the model you use today costs more than you pay for it.  Gross margins on inference are something like 60-85%, but they are spending something like 70% of their compute budget on research and training.\n\n> (debt + equity + govt) divided by the number of launches\n\nThis ignores asset side of their balance sheet, including very significant intangible assets like their proprietary launch tech."}, {"id": 50651611, "au": "enraged_camel", "dom": 185, "sr": 7, "sc": 8.35, "ep": 8.35, "bs": 0.0, "d": 2, "age": 11.72, "grav": 111.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 26, "qw": 61, "k": 18573, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": ["https://github.com/elidickinson/pi-claude-bridge"], "ig": 0.351, "fa": 2.2, "gp": 0.865, "bl": 0.0, "ds": 0.0, "txt": ">> In OpenAI's favor is that they're still the one of the two that allows me to use my subscription with Pi, which is enough to keep me coming back.\n\nAs far as I'm aware you can use your Anthropic subscription via https://github.com/elidickinson/pi-claude-bridge\n\n>> Claude Code's bloat and incessant churn have started to actually hurt productivity more than they help unless you have unlimited tokens to spend on the latest \"fan out\" or \"workflow\" stuff.\n\nCan you be specific? What bloat? What incessant churn? How do they hurt your productivity?"}, {"id": 50654018, "au": "sebastiangrill", "dom": 129, "sr": 8, "sc": 8.08, "ep": 8.08, "bs": 0.0, "d": 0, "age": 5.47, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 33, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.666, "fa": 0.95, "gp": 1.007, "bl": 0.0, "ds": 0.0, "txt": "Sol 6.2 is barely usable in my experience because it is so lazy. \nAn example: A build script for an application used around 2GB of memory and took about 5 minutes.\nI asked Sol to optimize it so it uses less memory. \nIt did what I asked by just serializing everything that happens in the build script??? So now it only used 1.7GB but took more than twice as long.\nThrew the change away and asked Astra and it found optimizations to drop the build time in half and reduce the memory usage by 20% as well.\n\nI mean it did what I asked it to do, I never said that build time is not allowed to be increased but this is just stupid. I have about 20 more of these cases. It also likes to put database triggers everywhere and it's visual capabilities to create UI are very bad."}, {"id": 50651745, "au": "Barrin92", "dom": 144, "sr": 9, "sc": 7.84, "ep": 7.84, "bs": 0.0, "d": 3, "age": 11.38, "grav": 106.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 6, "k": 35165, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.7, "fa": 0.7, "gp": 1.279, "bl": 0.0, "ds": 0.0, "txt": ">in all corners of the globe\n\nAt the very least in the EU consumers have far reaching statutory protections and businesses can in fact not renegotiate on core entitlements of a contract. For example, an ISP cannot unilaterally change bandwidth limits of an existing contract.\n\nGiven that OpenAI presents this as some kind of billing mistake and handing out some free time that's likely a different issue, but no we don't agree to companies randomly tearing up contracts lol"}, {"id": 50653971, "au": "AmazingTurtle", "dom": 128, "sr": 10, "sc": 7.68, "ep": 7.68, "bs": 0.0, "d": 0, "age": 5.61, "grav": 38.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 796, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.351, "fa": 0.95, "gp": 1.239, "bl": 0.0, "ds": 0.0, "txt": "to be fair, I have a homelab metrics dashboard... Normally I get 4$ API workload with 1% of my 20x weekly sub drained. Last week it went up to ~6.5$ per 1%. So the math is mathing. I don't feel like they're actually \"cutting\" usage from us, just restoring how it was before... I wish my data proved me wrong but I really can't say bad about OpenAI here."}, {"id": 50655648, "au": "bpavuk", "dom": 65, "sr": 11, "sc": 7.3, "ep": 7.6, "bs": 0.0, "d": 3, "age": 2.23, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 478, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.995, "fa": 0.62, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "I do not run it locally (and not that much at all recently since I'm waiting out the tech crisis in a factory job) but come on, practically any inference provider serves Qwen now, even JetBrains under its \"Junie Lite\" white-label. there is practically a price war on that endpoint.\n\nofc I prefer 16-bit whenever possible, but q8 is totally fine. but be ready to customize your harness specifically for Qwen quirks, such as reasoning looping over itself, as you mentioned. may Reddit be your guide here.\n\nand no, 24hr jobs is what I dislike OpenAI Dots for. I do not need a concierge to nanny me, nor do I need an AI-generated \"Daily Brief\". long-running tasks are still the cloud/frontier moat, primarily because of hardware availability, and even 6.2 Astra is not that good at long-running tasks as many people make it sound, especially once you factor in Codex sub usage fluctuations and API rate. a simple one-turn question to Astra at medium inside Junie or Codex can easily eat $0.20 in tokens."}, {"id": 50651641, "au": "rspeele", "dom": 218, "sr": 12, "sc": 7.21, "ep": 7.21, "bs": 0.0, "d": 2, "age": 11.62, "grav": 110.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 1530, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.361, "fa": 0.95, "gp": 0.897, "bl": 0.0, "ds": 0.0, "txt": "Neon is really smart. But the Google AI pro account (that you can get cheap for BF) is their $20/mo tier and only gives you scraps of usage. You'll hit your 5hr limit in an hour and a half using Neon High in Antigravity, and hit your week's limit in about four of those sessions. I do not know whether the $200 acct is on par with Claude's $200 offering."}, {"id": 50653514, "au": "bpavuk", "dom": 60, "sr": 13, "sc": 7.0, "ep": 7.66, "bs": 0.0, "d": 1, "age": 6.82, "grav": 50.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 13, "k": 478, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.656, "fa": 0.42, "gp": 1.771, "bl": 0.0, "ds": 0.0, "txt": "> I'll even cheer for Muse and Grok if it'll provide more competition\n\nZuck and Musk are the last people I want to see in the AI space. we should abandon frontier entirely and move to \"open\" (a.k.a. downloadable, local) models instead. Qwen 3.8 27B is an incredible Luna/Terra-class model in my tasks (non-Android Kotlin, Zig, C, web search), and I don't need anything more than that because I prefer thinking largely on my own. usually that results in an objectively better and faster output"}, {"id": 50651649, "au": "Aurornis", "dom": 1, "sr": 14, "sc": 6.9, "ep": 7.27, "bs": 0.0, "d": 0, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 260, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.913, "fa": 0.0, "gp": 1.912, "bl": 0.0, "ds": 0.0, "txt": "I’ve had OpenAI and Anthropic accounts continuously for a long time, with a sampling of others rotating in and out.\n\nThe back-and-forth between which provider is more generous has been interesting to follow because the balance has been swinging back and forth. Not long ago I was having fun throwing OpenAI tokens at a side project because they felt limitless between the allowances and the constant flow of resets. Then Opus 5.5 came along and gave even more usage without any reset shenanigans to try to stay ahead of. OpenAI responded by reducing their allowances, and now the reset party seems to have stopped as well.\n\nNow they’re sending us vague emails about limits being adjusted downward again, citing a billing error? The original email was so vague that they had to send a clarification because it didn’t have enough information to tell if we were going to be retroactively penalized or if it only applied going forward.\n\nThis comes at the same time as they’re rolling out a change that makes chat quota subtract from your coding quota, which removes one of the last remaining big selling points of an OpenAI subscription in a world where Opus 5.5 exists.\n\nI would love to have some insights into what’s happening at OpenAI right now. From the outside it feels like something substantial changed in how they approach everything, but the weird part is how it’s coming at the worst possible "}, {"id": 50656694, "au": "Lwerewolf", "dom": 127, "sr": 15, "sc": 6.74, "ep": 7.18, "bs": 0.0, "d": 2, "age": 0.49, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 126, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.793, "fa": 0.68, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": "It just works for me...? And by that I mean making it do all-night runs tuning knobs on an algorithm and exploring mods to it to match some reference result. 6.2 astra high. Cant't say anything about Sol, I haven't been able to get close to even 50% usage on the 200 plan with only astra (6.0) high/xhigh, and I am pretty hands-on with it despite the all-nighters (show me / explain / how about this / how about that / etc / etc).\n\nI'd say that the bigger problem with these labs is that a local full weights install of ds41f is within reach of a _lot_ of businesses nowadays, and it's more than good enough for a ton of things that people don't realize. Same with q3.8fn (nvfp4 and the antirez q4 quant). OpenAI/Codex is very much a convenience for me at this point. If push comes to shove, given how much Ant's been in the news re: hostility towards open & local models, plus my gut feeling that they patronize a tad bit too much... I'll probably go to Google or something if OpenAI does indeed go down the drain somehow."}, {"id": 50652934, "au": "aliljet", "dom": 195, "sr": 16, "sc": 6.7, "ep": 6.7, "bs": 0.0, "d": 0, "age": 8.23, "grav": 65.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1575, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.559, "fa": 0.34, "gp": 1.429, "bl": 0.0, "ds": 0.0, "txt": "This has to be combined with the new strategy of also pulling all of the \"chat\" interactions into the \"work\" category thereby removing another source of tokens that people were using to use their overall subscription with OpenAI. Nobody would seriously use the \"chat\" side of the openai subscription for anything beyond some heavy planning, but couple this with a 25-40% reduction in the plan's capacity and this is likely a camel-back-breaking scenario. Time to quit that relationship, I'd say."}, {"id": 50653278, "au": "spwa4", "dom": 74, "sr": 17, "sc": 6.62, "ep": 7.5, "bs": 0.0, "d": 2, "age": 7.43, "grav": 56.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 1214, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.74, "fa": 0.68, "gp": 1.017, "bl": 0.0, "ds": 0.0, "txt": "Given that both OpenAI and Anthropic are losing money FAST it's definitely the case. It's just that investors were willing to put up the cost, but now they want to see not just their money back, but a return on it. A return on about a trillion dollars, or about a 20x (2000%) rise in Anthropic revenue. OpenAI is still private, so unknown, but will be roughly similar.\n\nIt's like saying SpaceX launch cost is 44 million, self-reported. If you instead count the total amount of money given to SpaceX (debt + equity + govt) divided by the number of launches, a SpaceX launch costs about 3 billion dollars, roughly double the cost of a space shuttle launch.\n\nOne of those 2 figures is the true cost."}, {"id": 50651959, "au": "2001zhaozhao", "dom": 117, "sr": 18, "sc": 6.47, "ep": 6.47, "bs": 0.0, "d": 1, "age": 10.74, "grav": 97.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 1008, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.589, "fa": 0.68, "gp": 0.553, "bl": 0.0, "ds": 0.0, "txt": "Yeah i've seen this online too but didn't experience this myself. I only run GPT as code review steps in my review workflow and have been getting normal-looking quota numbers the whole time.\n\nIf this really was just a targeted bug fix at the quotas of some users, seems like it was announced by OpenAI horribly. The \"40%\" and \"25%\" numbers make it sound like blanket reductions. I'm guessing someone / some agent gave the aggregate quota reduction across OpenAI usage to the team in charge of social media and they just ran with it...?"}, {"id": 50653167, "au": "SirSavary", "dom": 101, "sr": 19, "sc": 6.38, "ep": 7.19, "bs": 0.0, "d": 6, "age": 7.67, "grav": 59.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 281, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 0.995, "fa": 1.23, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "On the Anthropic Max subscription tiers you are given a separate \"Fable Quota\" that sits alongside your weekly (and five hour) quota(s). 100% of your Fable Quota is equal to 50% of your weekly quota, i.e.:\n\n- Using 100% of your Fable Quota burns 50% of your weekly.\n\n- Using 50% of your Fable Quota burns 25% of your weekly.\n\n- Using 2% of your Fable Quota burns 1% of your weekly.\n\n- Etc."}, {"id": 50651910, "au": "2001zhaozhao", "dom": 97, "sr": 20, "sc": 6.11, "ep": 6.41, "bs": 0.0, "d": 2, "age": 10.9, "grav": 99.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 1008, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.869, "fa": 0.95, "gp": 1.142, "bl": 0.0, "ds": 0.0, "txt": "FYI, the cost multiplier of Fable over Opus is more like 5X and not 2X if you're using a Claude subscription.\n\nSomeone did a calculation and if you were to use half of your Claude Ultra quota every week on Fable (the max you're allowed to use) you get about $3k of tokens a month. If you were to use the same quota on Opus, you get $8k of tokens a month (so $16k if you maxed it out on only Opus). (source: t3 theo's YT channel)"}, {"id": 50654157, "au": "trilogic", "dom": 27, "sr": 21, "sc": 5.97, "ep": 7.14, "bs": 0.0, "d": 2, "age": 5.13, "grav": 34.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 197, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.629, "fa": 0.95, "gp": 0.419, "bl": 0.0, "ds": 0.0, "txt": "How deceiving all this looks like, there is no transparency here on purpose? Can someone explain it in plain English what the heck means 100% quota and 40% limits, 20% faster of the daily but cost per task and weekly...\n\nAll the SI or AGI in the world can´t come up with a proper transparent unit of measure to show to the customer exactly what is he paying for. Is not per task or per tokens certainly so it must be time. Then let users decide if they are happy with the intelligence level. Playing with transparency will lead users to negative sentiment. But I understand, the banks did it, why not you!"}, {"id": 50656488, "au": "pkulak", "dom": 6, "sr": 22, "sc": 5.81, "ep": 6.91, "bs": 0.0, "d": 3, "age": 0.84, "grav": 6.5, "surf": 10.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 7, "k": 12766, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.281, "fa": 1.04, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "> invent non-existing usecases and irrelevant corner cases\n\nOh man, yes. I think recent benchmarks are all about giving the model a vague prompt and seeing if it makes a bulletproof solution, no matter how much code it generates. I constantly have to tell Sol that loud failure is okay. We do not need to guard every single Redis call with 100 lines of recovery code, plus a test, just in case Redis goes down."}, {"id": 50652293, "au": "moomoo11", "dom": 134, "sr": 23, "sc": 5.42, "ep": 5.42, "bs": 0.0, "d": 2, "age": 9.81, "grav": 85.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1813, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.629, "fa": 0.28, "gp": 0.549, "bl": 0.0, "ds": 0.0, "txt": "tbf, after speaking some friends who are mathematicians or work doing crazy physics stuff, it seems that math is a lot more \"straightforward\" than any application code more complicated than a basic todo app or some junk that can be one-shot.\n\nat least with lean, it just needs to compile, for example.\n\nwith my application code which spans multiple services, each with various layers, distributed shit, etc. not only do the various parts have to compile, they actually have to also work at runtime."}, {"id": 50652406, "au": "fodkodrasz", "dom": 5, "sr": 24, "sc": 5.31, "ep": 6.63, "bs": 0.0, "d": 2, "age": 9.42, "grav": 80.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 225, "qw": 0, "k": 1407, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 2.171, "fa": 0.0, "gp": 1.052, "bl": 0.0, "ds": 0.0, "txt": "Also I feel models got werse, Sol 6.2 feels lazyer, overcautious despite being explicitly told it can safely go amok in its sandbox / the sandbox target vm... and its prose and code output became worse then before (Sol 5.6 seems peak for me, it had the best balance for me in creativity, cautiousness, and pragmatic compromises instead of overdoing stuff), seems like overfit for synthetic dataset, and as if it were targeting a machine and not a human with its output. I feel the fears about using synthetic trainng sets manifesting for my usecases (coding in a specific minimalist-functional style, favoring simplicity in architecture, code, web design, writing documentation targeting humans instead of machines). Sol-6 started to invent non-existing usecases and irrelevant corner cases like the Claude models do... then now we are at the over cautious model (for my prompts and usecase which are largely the same)\n\nThe need to micromanage it to get to similar results seems multiplied, and despite the claimed lower costs I feel my quotas running out in 1 day despite earlier models had about 4 times higher claimed costs, and were running (with auto continuation on 5h resets) for days and getting to great results...\n\nI have no benchmaxxes to support my impressions though.\n\nClaude is used at work... it is okay I guess, I really didn't like it in the Sol 5.6 era (lol, a few months before), b"}, {"id": 50653935, "au": "59nadir", "dom": 132, "sr": 25, "sc": 5.23, "ep": 5.38, "bs": 0.0, "d": 1, "age": 5.69, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 162, "qw": 0, "k": 1997, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.641, "fa": 0.28, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "LLMs fare much better in areas where raw knowledge and esoterica is required; even Opus 5.5 High-class models and spend have a hard time writing an actually good library surface and structuring code correctly, whereas they have no problem at all optimizing code when asked to, beyond the capabilities of the vast majority of programmers. They also take advantage of math knowledge far more effectively in those instances as well.\n\nI have a colleague whos value prop was basically that he knew the particular domain we work in and was also very good at finding more performance in a key subsystem written in that domain. His entire job has basically been taken over by the SotA models. I'm still happy to work with him and I'm sure we're better off having him actually interacting with them in working on that subsystem, but the parts he was good at LLMs are much better at, so he's had to just take on other things and zoom out a whole lot more."}, {"id": 50656952, "au": "throwaway219450", "dom": 42, "sr": 26, "sc": 5.18, "ep": 6.72, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 376, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.613, "fa": 0.68, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "Yep my experience as well. I haven’t found a particularly strong need for Carbon, which is also slow and tends to over-engineer?\n\nI didn’t realize this, but if you’re in a Google household, value for money on the $99 plan is quite good. Google really wants you to subscribe. You also get YouTube Premium, Home Premium, huge amounts of drive storage, Colab tokens, and $40 GCP credit among other things."}, {"id": 50652433, "au": "bpodgursky", "dom": 145, "sr": 27, "sc": 5.15, "ep": 5.3, "bs": 0.0, "d": 4, "age": 9.37, "grav": 79.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 6934, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.422, "fa": 0.34, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "If you have a signed an actual annual CONTRACT, that holds firm in the US.  Enterprises do this all the time.  You're always free to request a contract as an individual, but if the business even bothers, it will probably mean a minimum commit from you for a year of service (cuts both ways).\n\nIf you just clicked through the terms of service, there is usually no promise made at any point that billing would not change in the next month.  99% of the time this is better for you as a consumer anyway."}, {"id": 50654423, "au": "edg5000", "dom": 44, "sr": 28, "sc": 4.97, "ep": 5.63, "bs": 0.0, "d": 1, "age": 4.51, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 656, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.354, "fa": 0.62, "gp": 0.471, "bl": 0.0, "ds": 0.0, "txt": "I recently cancelled my 200 EUR sub at OpenAI, but two benefits I'll mention:\n\n- Codex has an image generation endpoint. Some features are not wrapped by the harness but still work.\n\n- OpenAI is more flexible with custom harness work, last time I checked (around March)."}, {"id": 50651657, "au": "demosthanos", "dom": 186, "sr": 29, "sc": 4.67, "ep": 5.25, "bs": 0.0, "d": 3, "age": 11.57, "grav": 109.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 183, "qw": 0, "k": 2318, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.659, "fa": 0.0, "gp": 0.935, "bl": 0.0, "ds": 0.0, "txt": "Anthropic has been pretty clear that they consider using your subscription with a third party harness a bannable offense. I don't know if they are actually enforcing that but I'm not about to take the risk of getting locked out of one of the two leading model providers, so I just don't pay them as much as I do OpenAI.\n\nI was specific on the bloat, but I can add more: fan out, workflows, memory, skills, incessant delegation to subagents, running diffs in the TUI sidebar, ...\n\nThey're adding features and changing features all the time and for a power user who wants to develop a workflow and then use it to be productive that's a terrible place to be.\n\nIf you don't know what I'm talking about, pick up Pi and give it a shot. Pi can accomplish most of the same tasks that Claude Code does with a fraction of the token spend and in a fraction of the time. Very rarely do I need to break out Claude Code, usually only if I'm actually wanting to start something up asynchronous (at which point I'd really rather be using a cloud agent that just gives me a PR to review anyway)."}, {"id": 50652774, "au": "_puk", "dom": 219, "sr": 30, "sc": 4.64, "ep": 4.79, "bs": 0.0, "d": 1, "age": 8.58, "grav": 69.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1494, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.35, "fa": 0.34, "gp": 0.446, "bl": 0.0, "ds": 0.0, "txt": "There was a billing error.\n\nAnecdotally I was using Astra 6.2 recently for hours and was still sat at 100%. To the point I went clicking around the settings to see if the usage widget was broken.\n\nBut..\n\nThis feels like they are using fixing an issue to do a much wider rug pull in the hope people like me will say \"but it was broken\" and deflect from the wider point.\n\nSo don't let my anecdote deflect your ire!"}, {"id": 50652176, "au": "at1as", "dom": 59, "sr": 31, "sc": 4.56, "ep": 6.1, "bs": 0.0, "d": 0, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 677, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.559, "fa": 0.0, "gp": 1.681, "bl": 0.0, "ds": 0.0, "txt": "Our limits have been artificially propped up by a \"reset\" economy that is coming to an end, ChatGPT web usage not counting against our balance (set to change), and now apparently [unintentional] artificially inflated limits.\n\nI don't think token subscription subsidization at the level we've become accustomed to lasts forever, so it's critically important we have a few more frontier level models (glad to see Gemini back in the arena, and I'll even cheer for Muse and Grok if it'll provide more competition)."}, {"id": 50651775, "au": "seizethecheese", "dom": 4, "sr": 32, "sc": 4.48, "ep": 4.92, "bs": 0.0, "d": 1, "age": 11.29, "grav": 105.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 1.263, "bl": 0.0, "ds": 0.0, "txt": "Similar experience here.\n\nI used to have to do insane stuff to hit my OpenAI quota. I'm talking about running experiments overnight where the agent isn't really using sleep enough. More recently, I blew threw three resets in a week and couldn't really correlate it with anything I'd done."}, {"id": 50653950, "au": "dgrcode", "dom": 40, "sr": 33, "sc": 4.26, "ep": 5.36, "bs": 0.0, "d": 2, "age": 5.67, "grav": 39.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 91, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.23, "fa": 0.68, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "I don't think Astra and Fable are comparable at all.\n\nI have a $20 subscription with Claude and another $20 subscription with Codex. I have yet to hit any limit in my Claude subscription, but I hit Codex 5h limit every time I use it. This is using Claude as main driver and Codex only sometimes, and with a billing bug that gave me additional usage with Codex.\n\nAnd that's without comparing model performance, because Sol 6.2 is significantly worse than Opus 5.5, and probably even worse than Sonnet 5.5.\n\nNeedless to say, my Codex subscription has been replaced by a Gemini subscription."}, {"id": 50651508, "au": "sgnelson", "dom": 175, "sr": 34, "sc": 4.19, "ep": 5.29, "bs": 0.0, "d": 0, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1454, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.203, "fa": 0.28, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Wow.  I feel like this is their backdoor way to make the changes they were going to make to the plans (that they announced at the end of September, and then they supposedly quietly dropped?)\n\nI felt like I was going through my plan extraordinarily quickly before this.  Now, I don't know if I'm going to keep the subscription.  It definitely doesn't seem to be a good value proposition, whereas with Anthropic I feel like I'm getting a good deal."}, {"id": 50652908, "au": "rwarfield", "dom": 73, "sr": 35, "sc": 3.95, "ep": 4.61, "bs": 0.0, "d": 1, "age": 8.3, "grav": 66.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 407, "kpp": 15.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.154, "fa": 0.28, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "Subsidization implies that the subscriptions are offered at a loss; there's no reason to believe that is the case.  There is price discriminization at play, sure, but let's not buy the framing that the API price is the \"right\" price and subscriptions are some amazing giveaway."}, {"id": 50652224, "au": "seviu", "dom": 50, "sr": 36, "sc": 3.8, "ep": 5.34, "bs": 0.0, "d": 1, "age": 10.01, "grav": 87.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 639, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.36, "fa": 0.34, "gp": 0.813, "bl": 0.0, "ds": 0.0, "txt": "It doesn’t only go down faster\n\nI swear yesterday evening I had close to 90% quota left, and today I woke up to find it all gone.\n\nThis on the Pro plan\n\nI didn’t leave any agent running overnight. It just went… away.\n\nHonestly I am tired of their games."}, {"id": 50653675, "au": "tamimio", "dom": 212, "sr": 37, "sc": 3.63, "ep": 4.73, "bs": 0.0, "d": 0, "age": 6.45, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 2464, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "Glad I canceled OIA, past months it was too dumb in small tasks and now they even cut the usage? Crazy. \nI feel they are trying to save on the compute power to keep it on pr stuff that tie the company name like cyber or math, rather than users’ subs, and expect anthropic to follow, didn’t the ceo mention the token should be per the outcome value rather than flat usage?"}, {"id": 50652165, "au": "Gareth321", "dom": 215, "sr": 38, "sc": 3.63, "ep": 3.85, "bs": 0.0, "d": 2, "age": 10.15, "grav": 89.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 6041, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.121, "fa": 0.34, "gp": 0.168, "bl": 0.0, "ds": 0.0, "txt": "$1.25T, for those interested. Given the current market, they’re almost certainly below that if they had to get more funding right now. This is a big problem. When a company with massive implied growth gets a lower fundraising round, it’s an extremely negative signal to the market. So they’re stuck with what they have until the market improves and/or they can demonstrate enormous top and bottom line growth."}, {"id": 50654940, "au": "embedding-shape", "dom": 47, "sr": 39, "sc": 3.61, "ep": 5.15, "bs": 0.0, "d": 1, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 40, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.386, "fa": 0.42, "gp": 0.482, "bl": 0.0, "ds": 0.0, "txt": "> This comes at the same time as they’re rolling out a change that makes chat quota subtract from your coding quota, which removes one of the last remaining big selling points of an OpenAI subscription in a world where Opus 5.5 exists.\n\nWait what, when was this announced? I thought the whole split between \"Work\" and \"Chat\" was to avoid \"normal\" chats from impacting that, now they're intentionally and purposefully merging them again?\n\nVery flip-floppy and hard to rely on. At this point I don't really care what the end up with, I just want consistency for some weeks so one could adjust to it, because right now it seems I need to follow individual OpenAI employees on Twitter just to understand what I'm actually paying for."}, {"id": 50656825, "au": "jstummbillig", "dom": 72, "sr": 40, "sc": 3.6, "ep": 4.92, "bs": 0.0, "d": 1, "age": 0.27, "grav": 4.4, "surf": 15.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 6624, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.787, "fa": 0.0, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "I think it's set up quite nicely so far: People are learning some resources management skills, and getting extra tokens to make mistakes with. Fairly soon low cost models will be good enough for most coding work. (I might get surprised here but, idk, I am beginning to notice that I can't tell the difference between models for backend work, while the nature of the work stays roughly constant). All the whole models manufacturers are lifting up the bottom and pressuring frontier companies into more efficiency, unless they are willing to give up that market.\n\nAll in all, fairly optimistic about costs per coding task dropping over the next year."}, {"id": 50656182, "au": "whynotmaybe", "dom": 106, "sr": 41, "sc": 3.49, "ep": 5.03, "bs": 0.0, "d": 1, "age": 1.38, "grav": 8.9, "surf": 12.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2083, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.417, "fa": 0.34, "gp": 0.502, "bl": 0.0, "ds": 0.0, "txt": "A lot of my work is done with Luna which turns out to be \"OK\".\n\nYes, Terra and Sol provide more information and explains things with more words but the output is essentially the same for the work I'm doing.\n\nI've tried the same things with Luna and Sol and usually Luna is 10x cheaper.\n\nI use Astra for targeted work that I feel is more complex, but with the recent maths results, I also have the feeling I'm using a 300$ TI calculator to compute 2+3."}, {"id": 50651665, "au": "simonw", "dom": 95, "sr": 42, "sc": 3.45, "ep": 4.99, "bs": 0.0, "d": 0, "age": 11.56, "grav": 109.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.228, "fa": 0.0, "gp": 1.451, "bl": 0.0, "ds": 0.0, "txt": "I got a huge amount of work done yesterday without burning too much of my quota by using Claude Fable 5.2 Medium and telling it to do all of the code editing work using Opus 5.5 sub-agents. I expect the same trick works with Astra and Sol (or even Luna)."}, {"id": 50654162, "au": "bArray", "dom": 137, "sr": 43, "sc": 3.44, "ep": 4.54, "bs": 0.0, "d": 0, "age": 5.11, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 7485, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.539, "fa": 0.0, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "If anybody at OpenAI reads this: The most effective change you could make tomorrow is have an 'auto' model mode where you select an appropriate model for the user based on their prompt. It would save the end-user usage, save you compute time and everybody would be happier.\n\nAlso, 6.2 Sol is barely workable. I spent 5 prompts trying to get it to implement something, switched to 6.1 Sol and it instantly started working on the task. It's coming across more as lazy than being cheaper to run."}, {"id": 50653612, "au": "wccrawford", "dom": 159, "sr": 44, "sc": 3.42, "ep": 4.15, "bs": 0.0, "d": 5, "age": 6.6, "grav": 48.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 17647, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 0.849, "fa": 0.68, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "Even those lootboxes at least say something like \"$100 worth of merch for $20\" or something.\n\nThese plans don't even say anything like that.\n\nThe only reason they get away with it is that paying for credits is still way, way more expensive, and we know these plans are a gateway drug only available to individuals, and not companies directly.  We know there will be a rug-pull eventually, but it can't happen until the AI race slows down, and we're pretty far from that at the moment, it seems."}, {"id": 50655079, "au": "Wowfunhappy", "dom": 79, "sr": 45, "sc": 3.33, "ep": 5.72, "bs": 0.85, "d": 7, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 31971, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.212, "fa": 0.56, "gp": 0.881, "bl": 0.32, "ds": 0.0, "txt": "Ben Thompson is a pretty well known tech/business reporter which is why I'm happy to trust his judgement of this. If you want the hard evidence yourself, that is literally what the S-1 is for.\n\nIf there is something specific in Anthropic's financial documents that makes you think his take is wrong, I'm all ears, but until then, respectfully, I don't see you providing \"evidence\" either."}, {"id": 50651917, "au": "nitroedge", "dom": 13, "sr": 46, "sc": 3.31, "ep": 4.19, "bs": 0.0, "d": 2, "age": 10.86, "grav": 99.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 37, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.592, "fa": 0.0, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "Its like there is no customer relations or someone in charge of external comms at either company with the constant self-induced unforced errors. Isn't there an internal process where messaging gets developed to address an issue then someone approves it and people are on the same page?\n\nI've worked for large companies and not just anyone could speak to an outsider without media training let alone address a billing error and communicate it as a reduction in what the consumer receives and for us to lower our expectations.\n\nThis isn't a one off either, it has happened multiple times over and over again."}, {"id": 50655668, "au": "jostmey", "dom": 181, "sr": 47, "sc": 3.19, "ep": 3.85, "bs": 0.0, "d": 0, "age": 2.21, "grav": 13.3, "surf": 8.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 4444, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.427, "fa": 0.0, "gp": 0.346, "bl": 0.0, "ds": 0.0, "txt": "The problem with Open AI is that I don't trust their excuse. I don't trust the organization. When they say there's been a billing mistake, I immediately suspect the worst--that their product is short on compute--that I'm not being told the entire story. My view is colored by the person at the top, Sam Altman, his dealing with the board and the fact that Open AI was never really open"}, {"id": 50651989, "au": "2001zhaozhao", "dom": 99, "sr": 48, "sc": 3.16, "ep": 5.55, "bs": 0.85, "d": 4, "age": 10.65, "grav": 96.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1008, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.174, "fa": 0.62, "gp": 0.706, "bl": 0.32, "ds": 0.0, "txt": "If your dollar numbers are API rates, then actually that implies Fable uses more tokens than Opus per task. (Your task shows Opus costing twice as much, whereas per-token Fable is a bit less than 2x of Opus at API rates, since Fable's cache read costs the same as Opus.)"}, {"id": 50651808, "au": "tarr11", "dom": 119, "sr": 49, "sc": 3.13, "ep": 4.38, "bs": 0.0, "d": 0, "age": 11.2, "grav": 104.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 3851, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.925, "bl": 0.0, "ds": 0.0, "txt": "Feels like codex has fallen to third place.\n\nOpenAI stayed top of mind in October with the daily resets despite opus 5.5 performing much better.\n\nNow Neon came out with ridiculously good token efficiency compared to both Sol and Opus."}, {"id": 50653417, "au": "aditi805", "dom": 179, "sr": 50, "sc": 3.1, "ep": 6.72, "bs": 2.52, "d": 0, "age": 7.08, "grav": 53.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.363, "fa": 0.68, "gp": 1.088, "bl": 0.95, "ds": 0.0, "txt": "I have switched Claude > OpenAI > Claude multiple times with 20x subscriptions, and my current stance is that Claude delivers a lot more value with clear outcomes and better quality products.\n\nAlso, anyone serious about development should just go for 20x subscription and get raw token power unlocked!"}, {"id": 50652271, "au": "DeathArrow", "dom": 177, "sr": 51, "sc": 3.02, "ep": 4.12, "bs": 0.0, "d": 0, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 11470, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.193, "fa": 0.0, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "For now to do some work and not paying API prices or hit the limits too fast, I am using Neon with a Gemini Ultra subscription to orchestrate Deepseek Flash agents.\n\nAlso Gemini web chat and coding draw from different pools and Gemini models seem less censored than OpenAI.\n\nNeon plans and reviews the diffs, Deepseek does most of the work."}, {"id": 50651511, "au": "lukeify", "dom": 182, "sr": 52, "sc": 3.01, "ep": 4.41, "bs": 0.0, "d": 0, "age": 11.93, "grav": 114.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 966, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.29, "fa": 0.0, "gp": 0.949, "bl": 0.0, "ds": 0.0, "txt": "Behind in productivity integrations that Anthropic provides, models that aren't quite as good as Anthropic, with a harness that isn't quite as polished as Claude Code, with mindshare and usage still showing Claude Code is the more popular tool.\n\nBut yeah sure OpenAI, go right ahead and make your developer experience even worse."}, {"id": 50656418, "au": "hirako2000", "dom": 206, "sr": 53, "sc": 2.96, "ep": 4.06, "bs": 0.0, "d": 0, "age": 0.98, "grav": 7.2, "surf": 15.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 8, "k": 2365, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.198, "fa": 0.42, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "A week ago, tweeted:\n\n> Tokens go brrrrrr. Going to need more compute\n\nMy guess is the request for more compute was categorically denied this morning, with a Go figure out how to reduce usage, but also don't reduce revenue. Hold my beer, said Tibo."}, {"id": 50655579, "au": "thinkingtoilet", "dom": 113, "sr": 54, "sc": 2.95, "ep": 4.05, "bs": 0.0, "d": 1, "age": 2.34, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 2530, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.246, "fa": 0.34, "gp": 0.105, "bl": 0.0, "ds": 0.0, "txt": "The amount of value I get from a $100 claude max subscription is insane. I genuinely question the ability of any coder who can not extract a tremendous value from that. I understand if you don't want to, but that's different from not being able to. I can confidently saw it is the most valuable spend I've ever had at any company for anything ever. I am literally out of adjectives on how to describe how much value I get from it. Orders of magnitude over anything else."}, {"id": 50656785, "au": "iugtmkbdfil834", "dom": 29, "sr": 55, "sc": 2.88, "ep": 4.42, "bs": 0.0, "d": 2, "age": 0.34, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1563, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.705, "fa": 0.0, "gp": 0.285, "bl": 0.0, "ds": 0.0, "txt": "It actually makes sense timing-wise. I know I was debating dropping the sub, because it only seems useful at top 2 versions ( weird amount of mistakes at lower ones ). My qwen setup on software side is slowly becoming sufficiently decent, which makes me more comfortable letting codex go. Still.. it is sad to see this. Parent is correct in saying that Aug-Sep was codex golden age. The amount of stuff I did was ridiculous."}, {"id": 50652112, "au": "Gareth321", "dom": 48, "sr": 56, "sc": 2.88, "ep": 4.36, "bs": 0.0, "d": 1, "age": 10.29, "grav": 91.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 6041, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.544, "fa": 0.0, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "Same. It’s kind of confusing. Like they’re giving up the race and being really hostile about it at the same time. I don’t know anyone who is truly happy with the current state of their models. If they wanted to lean into cheaper models, cool, but then give us lots of usage like we get with Chinese models. They’re doing the worst of everything. I cancelled my subscription and I’m not the only one.\n\nThey also missed what appeared to be a golden IPO window. If this AI crunch lasts for another 6-12 months, any future funding rounds will be at a lower valuation, and that’s a VERY scary proposition for a company like this. Unless there is some kind of grand strategy here which is not yet revealed, I feel this is terrible leadership."}, {"id": 50651773, "au": "iforgotmypasswo", "dom": 116, "sr": 57, "sc": 2.88, "ep": 4.04, "bs": 0.0, "d": 0, "age": 11.31, "grav": 105.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 96, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "Before they corrected this, I had coworkers using Astra 6.2 on Ultrafast the entire week and not running out of tokens. My account was, sadly, unaffected.\n\nI suspect this is less of a big deal than some comments are indicating."}, {"id": 50656221, "au": "Archit3ch", "dom": 125, "sr": 58, "sc": 2.88, "ep": 4.03, "bs": 0.0, "d": 0, "age": 1.32, "grav": 8.7, "surf": 13.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.609, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "Happy Astra user. Yes, my money doesn't go as far after this change, but nobody expected the subsidization party to last forever.\n\nThe 6.2 release of both Astra/Sol tries too hard to stop a task early. No doubt a result of overeager attempts at training token-efficiency into the model. It's a minor annoyance to have to prompt it manually to continue. I hope it's fixed in the next release."}, {"id": 50654951, "au": "embedding-shape", "dom": 45, "sr": 59, "sc": 2.88, "ep": 3.97, "bs": 0.0, "d": 2, "age": 3.48, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 13, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.118, "fa": 0.42, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "> - OpenAI is more flexible with custom harness work, last time I checked (around March).\n\nCodex has \"codex-app-server\" which is basically an embedded codex daemon you can embed and interact with, without the full harness. I'm not sure why Anthropic thinks it's somehow a good idea to go the complete opposite way and forbidding custom harnesses, seems very backwards and makes me not trust their harness one bit."}, {"id": 50655706, "au": "t3ntxcles", "dom": 2, "sr": 60, "sc": 2.88, "ep": 3.87, "bs": 0.0, "d": 1, "age": 2.14, "grav": 12.9, "surf": 8.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 31, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.562, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Totally agree. Just in August–September it felt like you could throw GPT models at anything, and I struggled to even use up my limit. Back then the OpenAI subscription was easy to justify and you could choose between more expensive Claude models and more cost efficient codex models on fast mode constantly enabled. Now, at least for coding, having claude subscription is much better value today especially just for Opus 5.5. It is a big step up in how much work you can get done, since the model is smart and token-efficient, and underlying caching seems to have significantly improved."}, {"id": 50651952, "au": "heavensteeth", "dom": 160, "sr": 61, "sc": 2.88, "ep": 3.83, "bs": 0.0, "d": 3, "age": 10.76, "grav": 97.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.119, "fa": 0.34, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "\"Give us $500 a month and we'll give you wherever we feel like at the time\" doesn't seem like a captivating offer. Feels like the current state of \"buying\" digital media, where you in fact buy a \"license\" that can be revoked at any time.\n\nIn both cases, what you're buying is deliberately left vague because it's secretly a shitty deal, or will retroactively become one."}, {"id": 50652780, "au": "edstarch", "dom": 30, "sr": 62, "sc": 2.88, "ep": 3.82, "bs": 0.0, "d": 1, "age": 8.57, "grav": 69.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 84, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.41, "fa": 0.0, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "Couldn’t it also be explained by continuous rebalancing of compute used for training vs inference? They have some catching up to do, so they cut inference.\n\nSo far the rotations happen way too quickly to be confident about anyone giving up. Three months ago, I canceled Claude Pro because Sol 5.6 was ~Fable level and virtually unlimited with all the resets. Opus 5.5 has been out for two, so now I just keep both. But the changes are too frequent to extrapolate trends from."}, {"id": 50654364, "au": "colijobles", "dom": 163, "sr": 63, "sc": 2.88, "ep": 3.79, "bs": 0.0, "d": 0, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 13, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.308, "fa": 0.0, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "It's such a strange customer success move.\n\nAll the frontier labs are quietly changing allowances and token inference costs, especially with every model release and update. They could have quietly rolled the pricing update into that."}, {"id": 50652926, "au": "mdemare", "dom": 33, "sr": 64, "sc": 2.88, "ep": 3.76, "bs": 0.0, "d": 1, "age": 8.25, "grav": 65.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 40, "k": 2368, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.885, "fa": 0.42, "gp": 0.334, "bl": 0.0, "ds": 0.0, "txt": "> This comes at the same time as they’re rolling out a change that makes chat quota subtract from your coding quota, which removes one of the last remaining big selling points of an OpenAI subscription in a world where Opus 5.5 exists.\n\nClaude's 5 hour limit is _really_ annoying, and is a big reason why I'm keeping OpenAI for now. It's just easier to plan usage with OpenAI, especially with a couple of banked resets at hand."}, {"id": 50651429, "au": "_s_a_m_", "dom": 216, "sr": 65, "sc": 2.88, "ep": 3.76, "bs": 0.0, "d": 0, "age": 12.13, "grav": 117.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 60, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "\"billing mistake\" my ass. the last thing they'd do is how much money they charge, the scamming beginns.. Luckily there's black friday offer by Google for the Pro account and Gemini Neon is almost exactly as good as Astra."}, {"id": 50651614, "au": "saghm", "dom": 147, "sr": 66, "sc": 2.88, "ep": 3.74, "bs": 0.0, "d": 3, "age": 11.71, "grav": 111.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 14366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 0.959, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You seem to have this backwards. At all but the most casual restaurants, they bring you the food before you pay, and then you pay after. I don't need to trust them in order to know that I ate a plate of spaghetti before they brought me the bill.\n\nThere's no restaurant on the planet that requires me to pay them $100 a month to go in and eat a certain amount of spaghetti each week that they will keep secret from me until the moment I get the plate."}, {"id": 50655594, "au": "azan_", "dom": 87, "sr": 67, "sc": 2.88, "ep": 3.71, "bs": 0.0, "d": 1, "age": 2.32, "grav": 13.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 15, "k": 1340, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.071, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I don't think token subscription subsidization at the level we've become accustomed to lasts forever\n\nI don't think they are subsidizing tokens nowadays, even on the subscriptions (apart from extreme outliers that max out their subscription every week). Serving models is now EXTREMELY profitable, the margins are insane."}, {"id": 50653132, "au": "f646993e074382f", "dom": 108, "sr": 68, "sc": 2.88, "ep": 3.69, "bs": 0.0, "d": 0, "age": 7.76, "grav": 60.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 23, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.88, "fa": 0.0, "gp": 1.119, "bl": 0.0, "ds": 0.0, "txt": "It feels to me that the value one gets from a subscription is fluid at best, and it seems to change over time. \nThere should be more transparency on this, as even with a subscription, one expects the value of what is bought to remain stable."}, {"id": 50652662, "au": "feverzsj", "dom": 203, "sr": 69, "sc": 2.88, "ep": 3.66, "bs": 0.0, "d": 0, "age": 8.81, "grav": 72.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1122, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.042, "fa": 0.0, "gp": 0.835, "bl": 0.0, "ds": 0.0, "txt": "Under massive financial pressure, they increase price more and more frequently. Yet, it's still far from profitable. Closed models are pretty much a dead end for both sides."}, {"id": 50654742, "au": "markdog12", "dom": 61, "sr": 70, "sc": 2.88, "ep": 3.59, "bs": 0.0, "d": 2, "age": 3.85, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 5157, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 0.772, "fa": 0.34, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "Qwen 3.8 27B has been awful for me, ineffective and very slow, even on M5 Max 64GB. I wish I could agree with you, but it has been a total waste of time for me. Hope it changes."}, {"id": 50652420, "au": "mark_l_watson", "dom": 149, "sr": 71, "sc": 2.88, "ep": 3.59, "bs": 0.0, "d": 4, "age": 9.4, "grav": 79.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 21605, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.497, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "Ha! I like that. Earlier this year I mostly used Deepseek flash on a pay as I go API plan. It was so refreshing to not worry about subscription shenanigans. I think subscription pricing should be illegal. I believe in capitalism, and the current scheme of temporarily subsidizing use on the backs of investors seems like an unstable situation to me."}, {"id": 50654017, "au": "jdthedisciple", "dom": 200, "sr": 72, "sc": 2.88, "ep": 3.58, "bs": 0.0, "d": 0, "age": 5.48, "grav": 37.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2376, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscriptions_ask", "flbl": "Subscriptions & Ask (Change)", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.571, "bl": 0.0, "ds": 0.0, "txt": "i never thought i'd say it this soon:\n\nopen ai seems cooked.\n\n6.1/6.2 models have been underwhelming lately – yet they're drastically increasing prices (already and even more so to come dec 1)"}, {"id": 50652466, "au": "randomblock1", "dom": 103, "sr": 73, "sc": 2.88, "ep": 3.55, "bs": 0.0, "d": 3, "age": 9.28, "grav": 78.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 445, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.36, "fa": 0.95, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Using 100% of Claude Ultra on just Opus for me was $8k of tokens. Not sure where $16k came from. (source: past 3 months of my transcripts, pretty consistently)"}, {"id": 50655733, "au": "knollimar", "dom": 70, "sr": 74, "sc": 2.88, "ep": 3.5, "bs": 0.0, "d": 6, "age": 2.1, "grav": 12.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 977, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.489, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It makes me so upset because if you ask Claude or ChatGPT what model to run on X hardware, it often replies with something quanted down more than necessary, even for models with QAT that are already small.\n\nYou have to watch for it! It almost makes me feel like a conspiracy theorist here but I’m sure it’s just the local model crowd recommending quants a lot.  I do image work (tiny vectors) so the quants degradation is immediately obvious"}, {"id": 50651647, "au": "enraged_camel", "dom": 213, "sr": 75, "sc": 2.88, "ep": 3.49, "bs": 0.0, "d": 0, "age": 11.6, "grav": 109.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 18573, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_astra", "flbl": "Sol & Astra (Model)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "This is, frankly, an insane move. It is not the type of thing you want to be doing when you are in third place. The fact that they announced it on the Wednesday right before Thanksgiving also comes across as incredibly sleazy. They are probably hoping a lot of people won't see it.\n\nThe only way I can explain it is that they must be hemorrhaging money, and desperately need to extend their runway."}, {"id": 50654737, "au": "threatofrain", "dom": 148, "sr": 76, "sc": 2.88, "ep": 3.49, "bs": 0.0, "d": 4, "age": 3.86, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 13182, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "billing_market", "flbl": "Billing & Market (Mistake)", "urls": [], "ig": 1.465, "fa": 0.0, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "Restaurants is a bad example and I removed it.\n\nIn restaurants around the world, it is normal to order the food before you know what happened to it, including any changes to restaurant process. Then you don't return it because you're a normal human being and just because someone swapped out the recipe, doesn't mean that people are going to think it's respectful or appropriate to return the food and take your party elsewhere.\n\nThat's restaurant culture. Your only real recourse to enter the discussion of hollowing out food quality are restaurant reviews, and that too is dying and often not worth your time."}, {"id": 50651466, "au": "preommr", "dom": 194, "sr": 77, "sc": 2.88, "ep": 3.41, "bs": 0.0, "d": 0, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 5068, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.858, "fa": 0.0, "gp": 0.963, "bl": 0.0, "ds": 0.0, "txt": "Oh to be a fly on the wall at openai right now.\n\nI am not buying the bravado that they're not concerned, or the excuses that they've actually got really powerful models like Bel that they're using for other secret projects."}, {"id": 50653422, "au": "totetsu", "dom": 166, "sr": 78, "sc": 2.88, "ep": 3.4, "bs": 0.0, "d": 2, "age": 7.06, "grav": 52.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 4439, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Claiming these credits disables Codex access through the selected API Organization’s API keys, including usage paid for with purchased API credits. Restoring access requires canceling this benefit. This does not impact Codex usage through your subscription and does not impact regular API usage.\" wait what?\n\nExactly how does OpenAI distinguish “Codex usage” from ordinary API requests using the same key? I don't see any Codex permissions to my api keys. This is just about logging into Openais codex harness apps with an Api key I guess."}, {"id": 50651765, "au": "bakugo", "dom": 155, "sr": 79, "sc": 2.88, "ep": 3.4, "bs": 0.0, "d": 2, "age": 11.33, "grav": 105.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 3515, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.359, "fa": 0.0, "gp": 0.14, "bl": 0.0, "ds": 0.0, "txt": "How much usage did you pay for, exactly? You don't know, because it's not listed anywhere. In other words, you did not pay for any specific amount of usage, you agreed to pay for whatever usage OpenAI feels like giving you.\n\nIf you want to pay a specific amount of money for a specific amount of usage, that's what the API's pay-as-you-go billing is for. As a bonus, you also get to experience the true, unsubsidized costs of the service, before they inevitably force it on everyone in the future."}, {"id": 50655837, "au": "throwaway20222", "dom": 28, "sr": 80, "sc": 2.88, "ep": 3.35, "bs": 0.0, "d": 1, "age": 1.98, "grav": 12.0, "surf": 7.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 285, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 1.39, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "On the selling side of the house I am getting more inbound about advertising on OpenAI every day. I wouldn’t be surprised if they are trying to push more people to consider ad supported versions of their models if they fit into a certain cohort, or at least softening the ground. Add in wanting to look as solid as they can for an IPO…."}, {"id": 50652159, "au": "seviu", "dom": 11, "sr": 81, "sc": 2.88, "ep": 3.32, "bs": 0.0, "d": 2, "age": 10.15, "grav": 89.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 639, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "per_usage", "flbl": "Per & Usage (Anthropic)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "Same here, I am just using up all the 64k API tokens they gave us and then I am gone.\n\nAnthropic is much better but I am starting to have genuine interest in learning how models work under the hood, and it keeps detailing me.\n\nOn top of that I got two sparks at home and an unopened third for which I am struggling to finding reasons to opening it. Maybe this is the last straw and I go local all the way."}, {"id": 50653202, "au": "totetsu", "dom": 164, "sr": 82, "sc": 2.88, "ep": 3.25, "bs": 0.0, "d": 0, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 4439, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_claude", "flbl": "Subscription & Claude (Codex)", "urls": [], "ig": 0.513, "fa": 0.34, "gp": 0.745, "bl": 0.0, "ds": 0.0, "txt": "Has anyone been able to access these promised, api token credits bundled with the $100+ codex subscription?"}, {"id": 50654379, "au": "thatsabadlook", "dom": 46, "sr": 83, "sc": 2.88, "ep": 3.23, "bs": 0.0, "d": 1, "age": 4.62, "grav": 30.0, "surf": 0.0, "fade":
