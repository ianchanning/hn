es the mix documented here[2], Nemotron uses this classifier[3] etc etc.\n\nThe real problem isn't pretraining data availability, it's the lack of RL environments that are required for post training.\n\n[1] https://github.com/huggingface/fineweb-2\n\n[2] https://huggingface.co/datasets/allenai/olmo-mix-1124\n\n[3] https://huggingface.co/nvidia/nemocurator-fineweb-nemotron-4..."}, {"id": 50633924, "au": "mentalgear", "dom": 2, "sr": 3, "sc": 8.15, "ep": 8.29, "bs": 0.0, "d": 1, "age": 6.91, "grav": 51.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 64, "qw": 46, "k": 4741, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "challenge_crowdsoured", "flbl": "Challenge & Crowd-soured (Distributed)", "urls": ["https://www.swiss-ai.org/", "https://huggingface.co/swiss-ai"], "ig": 1.391, "fa": 1.04, "gp": 1.421, "bl": 0.0, "ds": 0.0, "txt": "Truly an excellent challenge for the thinkers of our day & age! Whoever comes up with an approach for crowd-soured, distributed, open-model training will free the people from the dependency on large private companies or the goodwill of China. Imagine the world's population using their compute to train their own open models.\n\nI think the fully open-source Apertus (ETH Swiss) model would be a superb starting ground.\n\n> Apertus is a 70B and 8B parameter language model designed to push the boundaries of fully-open multilingual and transparent models. The model supports over 1000 languages and long context, it uses only fully compliant and open training data, and achieves comparable performance to models trained behind closed doors.\n\nhttps://www.swiss-ai.org/\nhttps://huggingface.co/swiss-ai"}, {"id": 50636378, "au": "NortySpock", "dom": 16, "sr": 4, "sc": 6.13, "ep": 6.43, "bs": 0.0, "d": 1, "age": 3.48, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 166, "qw": 0, "k": 2924, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_ram", "flbl": "Model & RAM (GPU)", "urls": ["https://www.crowdgpt.net"], "ig": 1.693, "fa": 0.62, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "https://www.crowdgpt.net is on its second attempt at training a ~1B model (658M dense, 350M engram) on 100B tokens. License will be GPLv3 I believe. I think I estimated the training time was going to take one month at the pace they were going at last time. (With more contributors, it goes faster...)\n\nI contributed a few GPU hours to the first run and some code and got good vibes from the project. Good of them to stop early when they noticed training stalled and a poor weight distribution. Hopefully this run goes better. Definitely vibe coded but also appropriately sized for the compute people have contributed, in my opinion.\n\nThe security model is: the central coordinator is trusted, hands out dataset ranges that the client should download, receives the gradients from client,  sanity checks them, and compares them statistically against the other two members of the pool. Too much divergence is rejected. Sufficiently trusted named clients can train without being in a pool. Anonymous contributions are allowed and are placed in pools of similar hardware."}, {"id": 50631033, "au": "Wheen", "dom": 41, "sr": 5, "sc": 5.91, "ep": 5.91, "bs": 0.0, "d": 1, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 68, "qw": 0, "k": 113, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": ["https://huggingface.co/blog/harness-adapters-at-scale", "https://huggingface.co/harness-hub/Qwen3.8-27B-pi-adapted"], "ig": 1.234, "fa": 0.9, "gp": 0.309, "bl": 0.0, "ds": 0.0, "txt": "HF has started to release their own fine-tunes with a similar strategy and they have impressive gains: https://huggingface.co/blog/harness-adapters-at-scale\n\nNo idea if this sort of thing will be able to reproduce it, but it at least shows that there are gains to be had by tuning these small local models to your particular harness.\n\nAnecdotally, Qwen3.8-27B fails a lot of basic tool calls in Pi and this seems to mitigate that: https://huggingface.co/harness-hub/Qwen3.8-27B-pi-adapted"}, {"id": 50632375, "au": "dofm", "dom": 51, "sr": 6, "sc": 5.49, "ep": 5.63, "bs": 0.0, "d": 2, "age": 8.54, "grav": 69.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 92, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": ["https://huggingface.co/blog/harness-adapters-at-scale", "https://huggingface.co/harness-hub/Qwen3.8-27B-pi-adapted"], "ig": 1.363, "fa": 0.62, "gp": 0.457, "bl": 0.0, "ds": 0.0, "txt": "I eventually found that, but even that document makes it singularly a challenge to find out what it does.\n\nAll of this is so exhausting.\n\nETA: also, thank you for your kind reply :-) I should be less grumpy.\n\nETA 2: Hugging Face seem to have done something broadly along these lines focussing on improving the model/harness interaction:\n\nhttps://huggingface.co/blog/harness-adapters-at-scale\n\nhttps://huggingface.co/harness-hub/Qwen3.8-27B-pi-adapted\n\nBut in an offline, batch training way, using other sources too. I wonder how much time this sort of \"dream\" approach actually spends on improving agent/harness interaction that should actually be separated out into a general LoRA like that."}, {"id": 50632477, "au": "seangrogg", "dom": 59, "sr": 7, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 1, "age": 8.43, "grav": 68.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 837, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "challenge_crowdsoured", "flbl": "Challenge & Crowd-soured (Distributed)", "urls": [], "ig": 1.506, "fa": 0.34, "gp": 0.464, "bl": 0.0, "ds": 0.0, "txt": "For those of us who already had the hardware, it's simple economics. I have a 4090 that's otherwise usually idle, it gets good tokens/second, it's smart enough for the problems I have. That's a good shape for free tokens out of something I already had.\n\nNow, if I have bigger problems - which generally just means I'm wanting a larger context window, I'm wanting to churn on a single problem harder, or I simply want something done fast with minimal hand-holding - I'll throw a paid LLM at it. I'm not locked into one or the other. I can have a big model do the hard work and then free local models spruce up small things along the way.\n\nThere's also privacy/control/rug-pull dynamics, but most of the things I work on are either not particularly private or I keep the \"sauce\" in a separate space."}, {"id": 50637042, "au": "Brian_K_White", "dom": 29, "sr": 8, "sc": 4.53, "ep": 4.97, "bs": 0.0, "d": 1, "age": 2.17, "grav": 13.1, "surf": 5.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 8732, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "home_seti", "flbl": "Home & Seti (Distribute)", "urls": [], "ig": 1.257, "fa": 0.68, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "Tangent (love your idea btw):\n\nIt's kind of interesting how seti@home was replaced by \"boinc\" over 20 years ago in 2005, and yet whenever you want to refer to the concept no one ever thinks \"boinc\". It's always only \"seti@home\" or \"folding@home\".\n\nThere's some kind of marketing lesson there. All else being equal \"boinc\" should be the better name. It's short as possible, yet still unique and googlable. \"seti\" itself has those qualities.\n\nOne thing obviously \"seti@home\" directly conveys imagery that \"boinc\" does not. But really \"seti\" should be just as meaningless, but however it happened, \"seti\" is not meaninless and so neither is \"seti@home\".\n\nSo a 3-word, 4-syllable name is better than a 1-syllable, 1-word perfectly distinctive one. The longer name is actually mentally simpler, just along a different dimension than number of letters.\n\nSo I guess your idea should be called something like training@home except this non-distributed one could also be described as training@home so idk."}, {"id": 50634275, "au": "colechristensen", "dom": 31, "sr": 9, "sc": 4.41, "ep": 4.85, "bs": 0.0, "d": 1, "age": 6.53, "grav": 47.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 6, "k": 28893, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_ram", "flbl": "Model & RAM (GPU)", "urls": [], "ig": 1.34, "fa": 0.42, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": ">Are there more of these projects?\n\nI think the hardware isn't ready for it yet.\n\nLocal models on even marginally accessible hardware aren't capable enough yet and training them just isn't that hard that an @home style distributed compute removes any significant bottleneck.\n\nLocal models are also just not good enough yet, there's some work to make models of a certain parameter size better but it will doubtful be enough before hardware catches up.\n\nWe need faster RAM interconnects and more RAM available locally... maybe in another couple of years."}, {"id": 50635669, "au": "knollimar", "dom": 34, "sr": 10, "sc": 4.24, "ep": 4.68, "bs": 0.0, "d": 3, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 977, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "challenge_crowdsoured", "flbl": "Challenge & Crowd-soured (Distributed)", "urls": [], "ig": 1.341, "fa": 0.34, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "The difference in capability between even Kimi 3.1 and Opus 5.5 is pretty staggering.\n\nIt makes a lot less dumb errors and have significantly more autonomy.\n\nLocal models are good for well scoped tasks, though.  Not that I'm all in, but I just bought a 512GB Mac studio that I've been enjoying but I save the hard stuff for claude/chatgpt.  I haven't tried much gemini.\n\nI've also found open weight models not that good at computer use"}, {"id": 50634547, "au": "azeirah", "dom": 32, "sr": 11, "sc": 3.82, "ep": 4.26, "bs": 0.0, "d": 2, "age": 6.14, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 11, "k": 3367, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_ram", "flbl": "Model & RAM (GPU)", "urls": [], "ig": 0.606, "fa": 0.76, "gp": 0.463, "bl": 0.0, "ds": 0.0, "txt": "> Local models on even marginally accessible hardware aren't capable enough yet\n\nI've been running Qwen3.8 27b on my 7900xtx gpu, and I barely use claude now, so I disagree with this.\n\nLocal models are slowly becoming more viable."}, {"id": 50636712, "au": "b33fsDedYall", "dom": 19, "sr": 12, "sc": 3.61, "ep": 6.57, "bs": 2.52, "d": 1, "age": 2.88, "grav": 17.4, "surf": 3.6, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 81, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_mind", "flbl": "Tools & Mind (System)", "urls": ["https://news.ycombinator.com/item?id=43397640"], "ig": 1.571, "fa": 0.9, "gp": 0.212, "bl": 0.95, "ds": 0.0, "txt": "The idea was floating around last year: https://news.ycombinator.com/item?id=43397640\n\nAm working on a system to use bpf and watch everything; files, media/network buffers; about my local system and model it as sched_ext compute schedule to later reproduce as a machine stage via a GPU accelerated browser\n\nModel training works. Browser loads and draws initial entity placeholders\n\nAm still working towards actual visual recreation of a text document or a video game from host system telemetry, making edits visually that update the model\n\nThen sync of model."}, {"id": 50630558, "au": "mock-possum", "dom": 44, "sr": 13, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 0, "age": 10.55, "grav": 95.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 2469, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Sorry if I missed this in the docs but -\n\nHow does it judge improvement?\n\nDoes it find instances where the agent corrected itself, or needs correction by the user, replay its own version of that til the training it develops produces the correct result the first time?\n\nI’d really like the see a case of the improvement / judgement process transcribed in the readme, so there’s a practical example of what it actually does (show, don’t tell!)"}, {"id": 50632557, "au": "vcampos2017_dev", "dom": 47, "sr": 14, "sc": 3.02, "ep": 5.54, "bs": 2.52, "d": 2, "age": 8.34, "grav": 67.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "model_ram", "flbl": "Model & RAM (GPU)", "urls": [], "ig": 0.959, "fa": 0.95, "gp": 0.399, "bl": 0.95, "ds": 0.0, "txt": "Thanks! It's Hostinger's KVM 2 plan (2 CPU cores, 8 GB RAM, 100 GB disk), billed yearly at about $204 ($17 per month). It's a flat price with no per-use billing, so there's nothing to cap: the cost stays the same however much I send it.\n\nI use it as a second tier AI before sending to ChatGPT because I’m trying to not burn through my tokens.\n\nThe real limit is the hardware. With no GPU and 8 GB of RAM, I stick to small quantized models, and I only send it the few lines my local model isn't sure about or if I want a second opinion.\n\nSo far it's barely busy, around 1% CPU most of the time."}, {"id": 50637097, "au": "Zambyte", "dom": 33, "sr": 15, "sc": 2.52, "ep": 3.18, "bs": 0.0, "d": 3, "age": 2.05, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": [], "ig": 0.941, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This was my exact setup for a while, from qwen 3.5 to 3.8 27b, slowly consuming more and more of my workflow. I recommend trying out strata to see if you can squeeze better performance (speed and quality and \u0023 of slots) out of your 7900 xtx. I was able to get 2 slots of flash next when switching to strata. Now I use strata with 2 r9700s running 4 slots of 256k with a bigger quant"}, {"id": 50636060, "au": "ViscountPenguin", "dom": 3, "sr": 16, "sc": 2.5, "ep": 2.94, "bs": 0.0, "d": 2, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 574, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "home_seti", "flbl": "Home & Seti (Distribute)", "urls": [], "ig": 1.024, "fa": 0.0, "gp": 0.37, "bl": 0.0, "ds": 0.0, "txt": "I don't think there's enough idle home compute period to make that work. The scale of modern pertaining runs (and not to mention RL, which would theoretically be easier to distribute but harder to sandbox) is far far larger than most people expect."}, {"id": 50633433, "au": "mfro", "dom": 20, "sr": 17, "sc": 2.1, "ep": 2.54, "bs": 0.0, "d": 1, "age": 7.36, "grav": 56.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 651, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "challenge_crowdsoured", "flbl": "Challenge & Crowd-soured (Distributed)", "urls": [], "ig": 0.751, "fa": 0.0, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "I wonder how feasible it actually is… existing distributed training workflows (see Marin’s Levanter) assume identical environments and hardware afaict. I think there would be serious challenges training on a variety of GPU architectures."}, {"id": 50635575, "au": "wald3n", "dom k I do on my cpu would be prohibitively expensive to transmit over networks and I’m pretty sure I never want that happening with a lot of my compute needs anyways."}, {"id": 50635939, "au": "radlad", "dom": 61, "sr": 34, "sc": 0.29, "ep": 1.61, "bs": 0.0, "d": 3, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 13, "qw": 0, "k": 4952, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": ["https://github.com/niko1221/strata"], "ig": 0.271, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I recently setup strata on a 3090 and I've been quite pleasantly surprised by its performance: https://github.com/niko1221/strata"}, {"id": 50633198, "au": "hedgehog", "dom": 52, "sr": 35, "sc": -0.44, "ep": 1.95, "bs": 0.85, "d": 3, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 4244, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "harness_tuning", "flbl": "Harness & Tuning (Trained)", "urls": [], "ig": 0.829, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yeah it would be helpful if their main readme had a few sentences at the top to just lay out the key points of what they built. This piecemeal automatic fine tuning is pretty interesting, I think it's likely to extend to per-task n-gram embeddings, and between the two I can see this lowering the hardware bar for useful self-hosted inference a good amount. I don't think it is really comparable to the harness fine tuning like what HF is doing, I think a real RL environment will probably be much more effective for a model that needs to be more general purpose, while the Songe style incremental approach will be useful deployed along side a specific app for high volume repetitive work. You can imagine a single endpoint serving one base model + a distinct n-gram and LoRA adapter per task family. /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
