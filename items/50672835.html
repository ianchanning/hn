rs": ["security", "password", "key", "keys", "phishing", "manager", "recovery", "account", "goes", "user", "managers", "passwords", "blues", "passkey", "backup", "accounts", "email", "provider"], "largest_root": {"root_id": 50673761, "author": "tptacek", "slots": 8, "start_dom": 13, "end_dom": 20, "share_pct": 22.2, "top_dom1_age": 0.5, "top_dom1_author": "rietta"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50673845, "au": "tptacek", "dom": 15, "sr": 1, "sc": 7.72, "ep": 7.72, "bs": 0.0, "d": 2, "age": 0.64, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 87, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": ["https://support.apple.com/en-ca/109016?utm_source=chatgpt.com"], "ig": 0.998, "fa": 1.24, "gp": 1.266, "bl": 0.0, "ds": 0.0, "txt": "I don't follow. Apple, for instance, is explicit about the fact that you can save your Passkeys locally[1]. What's the signature you're talking about here? Part of the point of Passkeys is your device is doing the signing.\n\nI interviewed Adam Langley about Passkeys and like 75% of that interview was just him talking about all the work Google had put into making it possible to sync and backup Passkeys. I think it might literally be the difference between Passkeys and plain-old-FIDO, which existed for years prior to Passkeys.\n\nhttps://support.apple.com/en-ca/109016?utm_source=chatgpt.co..."}, {"id": 50673682, "au": "wolvoleo", "dom": 2, "sr": 2, "sc": 4.77, "ep": 4.77, "bs": 0.0, "d": 0, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 35, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 1.037, "fa": 0.42, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "> That's quite the point though. Because, if you could backup your passkey, it could also be phished from you with a convincing enough email and a link to a fake website that asks for your passkey backup file.\n\nThat's fine for Joe Soap but not for me. I need to be able to manage stuff myself.\n\nLuckily these days that's not so hard anymore with bitwarden and KeePassDX.\n\nWhat worries me is the attestation. If that proceeds companies can block such options and only allow Apple and Google. It's none of their business how I secure my own credentials.\n\nRight now it's not a huge thing because Apple doesn't support attestation but I'm sure that'll change at some point."}, {"id": 50673676, "au": "majormajor", "dom": 8, "sr": 3, "sc": 4.15, "ep": 4.15, "bs": 0.0, "d": 1, "age": 1.13, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 17, "k": 18208, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": 1.073, "fa": 0.42, "gp": 0.294, "bl": 0.0, "ds": 0.0, "txt": "> That depends on the type of paper used and the environment in which the notebook is stored.\n\nI think the average notebook in the average home environment is gonna have a longer lifespan than the average smartphone or security key. (Like described in the context around the line in the original post.)\n\nMany environmental factors that would render a notebook unreadable would break devices too."}, {"id": 50673815, "au": "kqgnkqgn", "dom": 27, "sr": 4, "sc": 4.07, "ep": 4.07, "bs": 0.0, "d": 0, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 188, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 1.267, "fa": 0.34, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "Passkeys are a great alternative to entering a TOTP token, to cover the 95% of times when you are accessing a service from your normal laptop/phone/whatever.  But you absolutely must have a TOTP token configured as well, to use when and if your passkey is not available.\n\nIt's incredibly dangerous and inappropriate to use them beyond that use case.\n\nThey should not be used as the primary authentication factor (in place of a password), nor as the only the only supported 2FA option.\n\nI mostly agree with another comment here - the people implementing systems trying to manipulate people to use passkeys, outside of the limited, legitimate use case above should be ashamed of themselves.  It's a lazy and dangerous approach.\n\nAs an industry we should be calling out those people - it's not some abstract entity doing this.  There are engineers and PM's making these harmful decisions."}, {"id": 50674104, "au": "tonymet", "dom": 12, "sr": 5, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 2, "age": 0.06, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 1.358, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I share your frustration, having helped a lot of older family members through similar recovery experiences.\n\nGoogle lost one of my passkeys.  It was detected and loaded and failed at the last phase. I had to delete & reload it.\n\nI used to be the one who encouraged team members to adopt TOTP and other account safeguards.\n\nPasskeys have potential, but they are not ready for prime time.\n\n1. They need a consistent UX at the user agent.  login should be consistent & predictable every time. no timeouts\n\n2. they need a health check phase. I should be able to see the list of all my account passkeys with a green light and a last-health check date.\n\n3. they need built in backup & sync transparency and control. I want the keys to have names, and the ability to copy them where they need to be ."}, {"id": 50673960, "au": "sedatk", "dom": 16, "sr": 6, "sc": 3.98, "ep": 4.98, "bs": 0.85, "d": 3, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 222, "qw": 0, "k": 7751, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 1.423, "fa": 0.28, "gp": 0.578, "bl": 0.32, "ds": 0.0, "txt": "Oh, that’s totally my ignorance on the matter then. I wasn’t aware. I thought Apple wouldn’t attest to the same key with another account. Let’s put aside that me missing this important fact as a person specifically interested in passkeys, let alone a regular user. Then, it also brings upon the problem of managing your recovery keys and how you would go about restoring your access. We might be creating new weak spots to be phished with this.\n\nI’ll edit the article when I get back home. I appreciate the feedback.\n\nEDIT: I looked it up, iCloud doesn't let you backup your passkeys offline to any device, but only lets you sync with your other Apple devices, and in case of a Mac, yes, you might be able to restore your passkeys to another Apple account if the one you're using gets banned (didn't look it up in detail yet). I own several Apple devices, I don't own a Mac, so this doesn't apply to me. It looks like the situation is even more complicated with other providers like Microsoft.\n\nWhen I meant offline backups, I meant, being able to export/download a keyfile, preferably protected by a password, and the ability to restore that keyfile to a new account later. Currently, Apple doesn't let that happen. Yes, maybe one can jump hoops with their Mac, but that's more like a hack, rather than a universal, reliable recovery flow."}, {"id": 50674018, "au": "ferrouswheel", "dom": 11, "sr": 7, "sc": 3.72, "ep": 3.86, "bs": 0.0, "d": 1, "age": 0.23, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 455, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": 1.117, "fa": 0.34, "gp": 0.185, "bl": 0.0, "ds": 0.0, "txt": "I spent most of a weekend fighting with Google for a friend who'd damaged their phone, but the passkey was on it.\n\nI'm usually a pretty calm person, but I wanted so badly to punch who ever made passkeys exist and made me spend my weekend trying to help someone login to an account the person had owned for 15+ years. There was more expletives used than a Guy Ritchie movie.\n\nNot to mention, it's the same IP they'd logged in from for 9+ years, from a machine only they had logged into google from for 5 years. If Google can't fucking figure out that it's a legit login, they are stupid."}, {"id": 50673813, "au": "drdaeman", "dom": 5, "sr": 8, "sc": 3.58, "ep": 3.73, "bs": 0.0, "d": 1, "age": 0.72, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 18, "k": 8568, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "recovery_key", "flbl": "Recovery & Key (Random)", "urls": [], "ig": 1.076, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This argument shouldn't work for anyone, unless they think people en masse are incompetent.\n\n> it could also be phished from you with a convincing enough email and a link to a fake website that asks\n\n...one to mail their security key to a random warehouse address, for urgent maintenance.\n\nIf someone can be talked into sending a backup key material to random website, they can be talked into anything, and it's fundamentally impossible to protect them without declaring them incapable of making decisions on their own."}, {"id": 50673754, "au": "FireBeyond", "dom": 31, "sr": 9, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 0, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 22740, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": 1.461, "fa": 0.0, "gp": 0.013, "bl": 0.0, "ds": 0.0, "txt": "Actually, one of the single biggest irritants for me is when you decline a passkey.\n\nI sign in, with PayPal:\n\nBrowser canvas, full screen modal, \"Next time, log in with Face ID or Touch ID. Using a passkey to log in...\"\n\nMeanwhile, 1Password's Chrome extension, \"Save Passkey?\". I hit close.\n\nUp pops what I think is the Apple dialog, \"Save a passkey?\" offering to save one in either 1Password, or Passwords. Cancel\n\nFuck me, up pops ANOTHER dialog, this one Chrome, I think, \"Choose where to save your passkey for www.paypal.com: Apple Passwords, Your Chrome Profile\" Cancel.\n\nNOW I can close the modal.\n\nNote that at every point, the default is to create a password, cancel and close are dark patterned small, light grey text and icons on white.\n\nI don't want to install a passkey on the general principle of things, let alone the other technical issues."}, {"id": 50673894, "au": "minitech", "dom": 28, "sr": 10, "sc": 3.21, "ep": 3.36, "bs": 0.0, "d": 1, "age": 0.52, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 14, "k": 2640, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.841, "fa": 0.42, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "> They should not be used as the primary authentication factor (in place of a password)\n\nWhy not?\n\n(Edit to be clear: They absolutely should be, in the sense that you should have the option to select a passkey instead of entering a username and password, as long as it’s communicated clearly when registering and sets the right credential type preferences.)"}, {"id": 50673893, "au": "BoppreH", "dom": 6, "sr": 11, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 0, "age": 0.53, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 7747, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "recovery_key", "flbl": "Recovery & Key (Random)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "I still hold that the biggest problem with passkeys is that you can't enroll keys that you don't currently control (because the protocol requires proof of possession during registration). This prevents me from storing an offline recovery key, or splitting it N-of-M among family and friends. There are mitigations (buying a second or third device, cloud sync, email recovery), but they all come with severe drawbacks, which is why I still don't use or recommend them.\n\nI really wish we could get rid of passwords and other phishable credentials, or the \"we sent you a confirmation email\" dance, even usernames altogether, but we're not quite there yet."}, {"id": 50673629, "au": "Antirust3743", "dom": 32, "sr": 12, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 0, "age": 1.28, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 9, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Low quality post. What does this even mean? \"The passkey provider is responsible to keep your passkey intact and secure. The provider itself also must remain alive. If the provider goes down, you can't use that passkey.\"\n\nPasskeys solve phishing. Articles like this are fud."}, {"id": 50674134, "au": "avazhi", "dom": 21, "sr": 13, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 811, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "Why anybody would have ever tried these after understanding how they work is mysterious to me. It’s one of those things that only dipshit big tech middle managers could have come up with - what’s mysterious is why the engineers didn’t explain to them loudly enough why it wouldn’t work in practice. A password manager plus 2FA is the way of the future, short of proper biometrics, and even that will still need a PIN at least.\n\nAgain, if any service ever requires me to use a passkey or nothing I’ll simply not use the service, no matter what it is."}, {"id": 50673575, "au": "quadrifoliate", "dom": 26, "sr": 14, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 1, "age": 1.43, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 6340, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "recovery_key", "flbl": "Recovery & Key (Random)", "urls": [], "ig": 1.111, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Exactly. I see it as Google and Apple co-opting smart security-minded people to basically make it mandatory to use their duopoly if you want to exist in modern society.\n\nUnfortunately even the usually anti-monopolistic EU hasn't woken up to this yet. If legislators in any of our countries were at all tech-aware or gave a shit about people, they would mandate that any implementation of passkeys needs to have a documented and supported recovery path in case of destruction of the device holding a passkey."}, {"id": 50674050, "au": "ChrisMarshallNY", "dom": 29, "sr": 15, "sc": 2.58, "ep": 2.88, "bs": 0.0, "d": 2, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": 1.224, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Eh. I use passkeys as the only auth for the admin dashboard for my app. Works great, and offers fairly tight security.\n\nI set up a temporary login id/password, which is used to create a passkey, then discarded, and the passkey is used, thereafter.\n\nWorks well, but I also have the ability to log into the server control panel, and brute-force a login, if the passkey goes pear-shaped.\n\nI am not convinced that passkeys, as they exist now, are particularly suitable for your average Joe[line]."}, {"id": 50673904, "au": "rietta", "dom": 1, "sr": 16, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 0, "age": 0.49, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2759, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "I am deathly afraid of being locked out without the ability to regain access in many of the mainstream implementations. New phone. Locked out with a no human to hear your cries situation.  Sign in in Safari on Mac, you'll never connect with Firefox on Linux, etc."}, {"id": 50674095, "au": "kurtoid", "dom": 23, "sr": 17, "sc": 2.54, "ep": 2.54, "bs": 0.0, "d": 1, "age": 0.08, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 192, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "recovery_key", "flbl": "Recovery & Key (Random)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The biggest indicator of this to me was that they released the spec and encouraged its adoption well before the transfer protocol thing they've released(?) now, so users are forced you to use and trust some cloud sync with no control over it.\n\nThe other part was making you use clunky browser-specific extensions if you don't want to use your platform's provided manager. Want to sign-in inside a webview? Good luck!"}, {"id": 50673766, "au": "FireBeyond", "dom": 4, "sr": 18, "sc": 2.2, "ep": 2.72, "bs": 0.0, "d": 1, "age": 0.85, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 30, "k": 22740, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "recovery_key", "flbl": "Recovery & Key (Random)", "urls": [], "ig": 0.646, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> What worries me is the attestation. If that proceeds companies can block such options and only allow Apple and Google. It's none of their business how I secure my own credentials.\n\nWe've already seen people threatening that attestations being revoked would be something that \"would be considered\" as a recommendation by members of the Consortium for KeePass doing what the big boys do. Why should you be able to export credentials via AirDrop if you're using Apple's tooling, but not some of your own?"}, {"id": 50673982, "au": "tonymet", "dom": 10, "sr": 19, "sc": 2.15, "ep": 2.45, "bs": 0.0, "d": 0, "age": 0.32, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.952, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "passkeys are unpredictable for users.  Any combination of passkey, username, password, TOTP (app, email, phone) challenge is presented in a random order.\n\nIt's the worst possible Wizard UX , where you don't know what to do, how long it will take, and if you fail at any point, or time out any screen, you are locked out of your assets.\n\nIt's torture!"}, {"id": 50673902, "au": "ghewgill", "dom": 9, "sr": 20, "sc": 1.8, "ep": 2.17, "bs": 0.0, "d": 1, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1196, "kpp": 9.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is technically true. However, I am helping my parents clean out their place and I can assure you that there is a large amount of 50 year old paper that has survived perfectly well in a normal household environment."}, {"id": 50674037, "au": "mook", "dom": 18, "sr": 21, "sc": 1.62, "ep": 1.91, "bs": 0.0, "d": 3, "age": 0.2, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1906, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Out of curiosity, what happens if you sign that machine out of iCloud from a different machine? Are the Passkeys kept, or removed?\n\nEssentially, how do you balance your device being stolen versus the company unjustly bans you? The company, of course, would assume the latter never happens… but I suppose they can also assume encrypted disk."}, {"id": 50673985, "au": "tonymet", "dom": 24, "sr": 22, "sc": 1.32, "ep": 1.47, "bs": 0.0, "d": 1, "age": 0.3, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 0.624, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "absolute torture.   one wrong move and you are in passkey purgatory.\n\nGoogle recently forgot one of my passkeys.  Luckily i had backup methods."}, {"id": 50673817, "au": "sedatk", "dom": 14, "sr": 23, "sc": 1.3, "ep": 1.96, "bs": 0.0, "d": 1, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 7751, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 0.835, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Using mainstream passkey providers like Apple or Microsoft, you are one ban away from losing your access everywhere that you used that passkey. None of them let you get offline backups, and how would they be usable anyway if the provider won’t sign them for you?"}, {"id": 50673469, "au": "ferrouswheel", "dom": 25, "sr": 24, "sc": 1.0, "ep": 4.41, "bs": 3.05, "d": 0, "age": 1.74, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 270, "qw": 0, "k": 455, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 1.401, "fa": 0.28, "gp": 0.221, "bl": 1.15, "ds": 0.0, "txt": "Passkeys are the worst decision ever.\n\nSecurity folks that introduced it should feel ashamed.\n\nNo normal person understand passkeys. My wife was locked out of her google account because at some point Google auto enrolled her with a passkey. She had no idea where this \"passkey\" supposedly existed. Neither did I and I've managed my credentials effectively with a password manager for 15+ years. Apparently Google automatically enrols a passkey when you select \"Skip password when possible\", but never tells you that now you have a passkey on a device that will hold your account hostage. If you lose it, you are fucked.\n\nThen trying to use a passkey Windows says you have to scan a qrcode, and then use bluetooth for something. But why? What the fuck is going on.\n\nPasskeys were not introduced for the user's security, they were introduced so that corporations could steal credential control from their customers.\n\nDon't get me started on how aggressively websites and browsers and OSes try to forcibly insert passkeys into your life. Anything that needs to be pushed so hard (and to be clear, it is being forced due to companies being disappointed by user voluntary uptake) isn't being done for user/customer benefit.\n\nEdit: just to be clear, they are technically sound and sound fine in theory, but the actual deployment, user flows, education and outreach. it's all been done so insanely badly. an"}, {"id": 50674115, "au": "tptacek", "dom": 20, "sr": 25, "sc": 0.87, "ep": 1.76, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.747, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't understand what you're trying to say here. Again, literally the entire point of Passkeys, as vs. the WebAuthn/FIDO that preceded them and on which they're built, is backup and synchronization. You can just demonstrate this for yourself, right now, with a phone and a laptop. I feel like we must be talking past each other."}, {"id": 50674036, "au": "ferrouswheel", "dom": 19, "sr": 26, "sc": 0.53, "ep": 1.41, "bs": 0.0, "d": 3, "age": 0.2, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 455, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "they have done nothing to make it possible to sync and backup passkeys, they have instead forced passkeys on people and kick people out of accounts if their one android phone is ever lost or damaged."}, {"id": 50673761, "au": "tptacek", "dom": 13, "sr": 27, "sc": 0.13, "ep": 1.23, "bs": 0.0, "d": 0, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.418, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "Wait, isn't sync/backup basically the entire idea behind Passkeys, as opposed to just normal FIDO?"}, {"id": 50673513, "au": "wpollock", "dom": 7, "sr": 28, "sc": -0.12, "ep": 2.03, "bs": 1.19, "d": 0, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 8, "k": 401, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_backup", "flbl": "Google & Backup (Happens)", "urls": [], "ig": 0.182, "fa": 0.22, "gp": 0.67, "bl": 0.45, "ds": 0.0, "txt": "> My notebook would keep working 50 years from now ...\n\nThat depends on the type of paper used and the environment in which the notebook is stored."}, {"id": 50673835, "au": "kqgnkqgn", "dom": 34, "sr": 29, "sc": -0.61, "ep": 1.61, "bs": 1.19, "d": 1, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 188, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "normal_entire", "flbl": "Normal & Entire (Service)", "urls": [], "ig": 0.59, "fa": 0.0, "gp": 0.157, "bl": 0.45, "ds": 0.0, "txt": "That quoted statement is quite clear and straightforward.\n\nEither you are unfamiliar with passkeys...or willfully pretending not to understand the serious risks being called out."}, {"id": 50673812, "au": "shakamd", "dom": 3, "sr": 30, "sc": -1.0, "ep": 2.18, "bs": 2.52, "d": 1, "age": 0.72, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.108, "bl": 0.95, "ds": 0.0, "txt": "Just a couple days ago we saw 1Password's backend systems getting compromised. If someone were to compromise the client for any of these password managers, there goes your passkey regardless of how technically adept you might be."}, {"id": 50674087, "au": "tptacek", "dom": 17, "sr": 31, "sc": -1.46, "ep": 1.12, "bs": 1.7, "d": 4, "age": 0.1, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 0.477, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "You're losing me again. You want Passkeys to be migratable and syncable. I do too. They are. In what way does that make them phishable? Passkeys are an evolution of FIDO, and the entire purpose of FIDO is to combat phishing."}, {"id": 50674044, "au": "ferrouswheel", "dom": 35, "sr": 32, "sc": -2.36, "ep": 0.72, "bs": 2.78, "d": 1, "age": 0.18, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 455, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.305, "fa": 0.0, "gp": 0.0, "bl": 1.05, "ds": 0.0, "txt": "you write like the kind of person that decided passkeys were a great idea while ignoring the real world impacts of how it fucks people's lives up."}, {"id": 50673829, "au": "sedatk", "dom": 36, "sr": 33, "sc": -4.79, "ep": 0.55, "bs": 4.24, "d": 1, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 13, "qw": 0, "k": 7751, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": 0.236, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Low quality readership. You should have at least read the first two sentences."}, {"id": 50673674, "au": "boredatoms", "dom": 22, "sr": 34, "sc": -9.16, "ep": 0.0, "bs": 6.89, "d": 0, "age": 1.13, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 4, "qw": 0, "k": 840, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.179, "bl": 2.6, "ds": 0.0, "txt": "Passkeys seem maliciously designed"}, {"id": 50673921, "au": "joshheitzman", "dom": 33, "sr": 35, "sc": -9.77, "ep": 0.0, "bs": 6.89, "d": 1, "age": 0.45, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 6, "qw": 8, "k": 222, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "login_average", "flbl": "Login & Average (1password)", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.164, "bl": 2.6, "ds": 0.0, "txt": "> Passkeys solve phishing. Articles like this are fud\n\nAnd create new problems without a solution."}, {"id": 50674006, "au": "aleksejs", "dom": 30, "sr": 36, "sc": -10.44, "ep": 0.0, "bs": 6.89, "d": 1, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 6, "qw": 0, "k": 138, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "provider_apple", "flbl": "Provider & Apple (Mac)", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.0, "bl": 2.6, "ds": 0.0, "txt": "Did a phishing campaign operator write this?"}]}</script>

    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
