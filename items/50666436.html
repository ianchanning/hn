c": 1.68, "ep": 3.36, "bs": 0.85, "d": 6, "age": 1.84, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.605, "fa": 0.68, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Your country going to war directly affects you: you pay for it, your neighbors go to fight, etc. That’s not something new in the “globalized world.” Even 250 years ago Americans had a well developed view of foreign policy, because the prospect of becoming embroiled in foreign wars was real even back then. But most foreign policy issues are not $5 trillion wars."}, {"id": 50667396, "au": "rafram", "dom": 96, "sr": 73, "sc": 1.68, "ep": 2.45, "bs": 0.0, "d": 5, "age": 5.57, "grav": 38.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "Geothermal is continuous. Hydroelectric is too (though it has major environmental downsides). For wind, solar, and the rest, we have pretty good batteries these days, and we’re continuing to rapidly improve the density and stability of large batteries."}, {"id": 50667925, "au": "williamdclt", "dom": 69, "sr": 74, "sc": 1.67, "ep": 2.44, "bs": 0.0, "d": 5, "age": 4.82, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 4090, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "That's just false. The french style of protesting is very very often blocking people and making enemies of natural allys, and often gets some results (usually concessions rather than systemic changes, but still)"}, {"id": 50666988, "au": "quantummagic", "dom": 166, "sr": 75, "sc": 1.67, "ep": 2.41, "bs": 0.0, "d": 3, "age": 6.19, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 872, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.025, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The point remains, for each of those problems, there are very accessible options to directly improve the situation if you're thoughtful and deliberate.  The same can not be said for anything you can personally do for most of the global/societal issues the outrage machine has us cycling through."}, {"id": 50667064, "au": "moduspol", "dom": 150, "sr": 76, "sc": 1.67, "ep": 2.34, "bs": 0.0, "d": 2, "age": 6.07, "grav": 42.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4079, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "Well, or: the political party that more heavily leans on / benefits from protesting could be weakened by making mental health services more widely available."}, {"id": 50666845, "au": "Grombobulous", "dom": 103, "sr": 77, "sc": 1.67, "ep": 2.3, "bs": 0.0, "d": 3, "age": 6.4, "grav": 46.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.891, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Disrupting commerce is effective protesting, though. Objectively it’s effective.\n\nJust look what happens when the Chicago Teachers Union goes on strike. They get what they want because a few hundreds of thousands of parents get pissed because they have to call off work."}, {"id": 50667019, "au": "DoctorOetker", "dom": 131, "sr": 78, "sc": 1.67, "ep": 2.29, "bs": 0.0, "d": 1, "age": 6.15, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.91, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "does counseling for mental health also decrease the likelihood of lobbying?\n\nIf the proles robbed of power do it, we call it \"protesting\"\n\nIf the incumbents with the powers vested in them do it, we call it \"lobbying\""}, {"id": 50669956, "au": "lanstin", "dom": 5, "sr": 79, "sc": 1.67, "ep": 5.33, "bs": 3.05, "d": 4, "age": 1.84, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 3722, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.93, "fa": 0.0, "gp": 0.55, "bl": 1.15, "ds": 0.0, "txt": "There is definitely a thing where traumatized people are attracted to extreme solutions of all sorts, whether political or otherwise. Charitably, it’s part of healing, and doesn’t really invalidate the arguments for change or improvement. It can be a bit annoying at meetings, in other people.\n\nI was sexually abused by a a family member as a young child, and as a young adult tried out general angry protest, then Marxism, then feminism, and then gay rights as theories to explain why everything about me and the world was fucked up (with environmentalism and Perelandra based Christianity and Three Pillars of Zen based Buddhism sort of laced in as well). Landed in therapy after feminism lead to reading books about sexual abuse, the effects, and the way to recover. All those passionately held angry positions were safe places to rage at the world before I could handle the personal nature of the rage.\n\nTen years of therapy later and my life was sane enough to get on with things, become a software engineer for real, raise kids, etc."}, {"id": 50668860, "au": "BoxOfRain", "dom": 34, "sr": 80, "sc": 1.67, "ep": 2.28, "bs": 0.0, "d": 5, "age": 3.34, "grav": 20.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.969, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would say personal happiness is completely irrelevant in a discussion about civic duty, your duty is your duty and it doesn't stop being so when it makes you unhappy.\n\nI recognise I've no right to dictate the morals of other people, but I have every right to think personal happiness is a fairly solipsistic way to judge the worth of something like participating in democracy as a free citizen. Some of the most immoral people to draw breath have been very happy with their lives, and some of the people who've done the most good were miserable. How my personal affect responds to things has nothing to do with whether they are my duty or not."}, {"id": 50666837, "au": "hoppyhoppy2", "dom": 147, "sr": 81, "sc": 1.67, "ep": 2.28, "bs": 0.0, "d": 1, "age": 6.42, "grav": 46.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3394, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.878, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Less protesting doesn't even have to mean less political engagement (although it might). What if, hypothetically, all the would-be protesters are running for office or engaging in other political organizing instead?"}, {"id": 50669176, "au": "Telemakhos", "dom": 27, "sr": 82, "sc": 1.67, "ep": 2.27, "bs": 0.0, "d": 5, "age": 2.9, "grav": 17.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 2362, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.965, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think a missing aspect here is the effect of technology on civic connections.  De Tocqueville published about America two years before the telegraph was invented, so Americans of his day and every generation before were deeply connected with their neighbors.  In the twentieth century, nation-wide television was eroding local accents and bringing national news into the living room; in the twenty-first, social media and cell phones have atomized people addicted to them.  There are people who don't know their physical neighbors' names but believe what they hear from their group chats, their instagram or tiktok feeds, from algorithms and influencers and political or foreign-state influence networks.  They can tell you all sorts of information about the promoted causes across the world, but they can't name the mayor of their own city or their own Congressmen whom they voted for earlier this month."}, {"id": 50666959, "au": "matsemann", "dom": 152, "sr": 83, "sc": 1.67, "ep": 2.21, "bs": 0.0, "d": 1, "age": 6.23, "grav": 44.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.865, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "It's fuel for people that like status quo: \"those who protests are all insane\". The way it's framed seems almost intentional to discredit protesters."}, {"id": 50667875, "au": "moduspol", "dom": 163, "sr": 84, "sc": 1.67, "ep": 2.21, "bs": 0.0, "d": 5, "age": 4.91, "grav": 32.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 4079, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.939, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Maybe a little retrospection is in order?\n\nSomeone's _skiing_ being impacted is your best defense for someone with \"a lot of anxiety\" over climate change?\n\nIf your livelihood is a vineyard you own that is becoming less economically viable, then OK. That's a fair reason to be a bit anxious about climate change. But skiing?!"}, {"id": 50668231, "au": "bluefirebrand", "dom": 135, "sr": 85, "sc": 1.67, "ep": 2.21, "bs": 0.0, "d": 1, "age": 4.32, "grav": 27.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.939, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That was my first reaction too\n\nThis makes it sound like mental health work is designed to keep people complacent instead of pushing them to self actualize"}, {"id": 50667029, "au": "II2II", "dom": 113, "sr": 86, "sc": 1.67, "ep": 2.15, "bs": 0.0, "d": 4, "age": 6.13, "grav": 43.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 5802, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.836, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "I'm going to reframe a few of these things, since a lot of people assume it means doing without.\n\nWe can reduce our impact by creating communities that incorporate the necessities of life, things like grocery stores and schools. Even if you still end up driving to those places, there is less need for the environmentally and economically expensive infrastructure. Less travel can also be shorter distance travel. Again, reduced impact. There is also a lot to gain. Ironically, I find that many tourists know more about the place they travel to than locals. You don't have to globetrot to experience the exotic. Then there are things like abandoning the extremes: the sprawl of suburbia or the urban density of skyscrapers are not the only options. There are many options in between that, again, reduces both the environmental and economic costs of current development models.\n\nThe list, of course, can go on."}, {"id": 50666900, "au": "watwut", "dom": 24, "sr": 87, "sc": 1.67, "ep": 2.12, "bs": 0.0, "d": 2, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "That is what happened in Russia, in communism and in other authoritarian state s- people retreat to personal lives and give up on public ones. Giving up on  politics enables the worst actors rather then best ones."}, {"id": 50666905, "au": "cowlevel", "dom": 187, "sr": 88, "sc": 1.67, "ep": 2.65, "bs": 0.53, "d": 0, "age": 6.31, "grav": 45.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.267, "bl": 0.2, "ds": 0.0, "txt": "This is that guy with the two buttons meme.\n\nThe guy: the government\n\nButton 1: decrease freedom of sepech\n\nButton 2: defund mental health"}, {"id": 50668138, "au": "williamdclt", "dom": 16, "sr": 89, "sc": 1.67, "ep": 2.11, "bs": 0.0, "d": 2, "age": 4.46, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4090, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.651, "fa": 0.0, "gp": 0.399, "bl": 0.0, "ds": 0.0, "txt": "That sounds very related to this study about empathy and political affiliation: conservatives care about people depending on how close they are to them, liberals (in the american sense) care about people regardless of their personal closeness (at least, much less).\n\nSo what you're saying is just \"people should have conservative values\"."}, {"id": 50669553, "au": "mchristen", "dom": 14, "sr": 90, "sc": 1.67, "ep": 2.1, "bs": 0.0, "d": 5, "age": 2.38, "grav": 14.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 436, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.554, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As a counterpoint the HOA I live in definitely uses their power to evict tenants that don't the follow the rules. Whether that's abuse of power I don't really know.\n\nBut when the HOA bylaws have things like: no clotheslines, all window treatments visible from the street must be white, etc. it's pretty difficult to imagine that those rules are there for anything other than \"I don't like you and therefore you will bow down to my power\"."}, {"id": 50667935, "au": "cowlevel", "dom": 126, "sr": 91, "sc": 1.67, "ep": 2.53, "bs": 0.53, "d": 6, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "What a weird way to present that data, and it's meaningless without the associated text anyway.\n\nTo save a click: it says conservatives put moral weight mostly on their immediate family while liberals put it on all living beings. Not sure this graph was famous or even needed to be cited."}, {"id": 50667565, "au": "10xDev", "dom": 167, "sr": 92, "sc": 1.67, "ep": 1.99, "bs": 0.0, "d": 2, "age": 5.33, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 747, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "History has shown time and time again that this is utterly false but it is a good message to send to those you want to pacify. There are effective ways to do it and ineffective ways. You got to look at methods that scale and influences others."}, {"id": 50667413, "au": "bloppe", "dom": 154, "sr": 93, "sc": 1.67, "ep": 1.98, "bs": 0.0, "d": 1, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 4181, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.841, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They seem to be using protesting as a proxy for conscientious democratic engagement. I feel like you could probably come up with better proxies."}, {"id": 50666949, "au": "thesneakykoala", "dom": 65, "sr": 94, "sc": 1.67, "ep": 1.95, "bs": 0.0, "d": 3, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.414, "fa": 0.0, "gp": 0.673, "bl": 0.0, "ds": 0.0, "txt": "This wasn't the lesson of the labor movement, suffrage, civil rights, ERA, etc. That ultimately protest isn't effective. It's true that you can't see the effect clearly and that the recent protests are just optics, but protest is important to democracy whether it has any immediate effect or not."}, {"id": 50670437, "au": "gspr", "dom": 51, "sr": 95, "sc": 1.67, "ep": 1.92, "bs": 0.0, "d": 4, "age": 1.14, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 35, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.306, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  a lesson about how people tend to care about faraway issues, instead of sorting out their own.\n\nIt's not a lesson. It's an opinion.\n\n> I think it's worthwhile to know whether something really interests me, or am I just distracting myself from my own problems.\n\nThe way they go about it seems to be by telling people what constitutes \"their own problems\". Many of my own problems are far away from me, thank you very much!"}, {"id": 50670742, "au": "gspr", "dom": 56, "sr": 96, "sc": 1.67, "ep": 1.91, "bs": 0.0, "d": 5, "age": 0.63, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The funny thing is that I think most people who know me well would call me a pessimist. I agree with you, though. For me, it's a constant feeling that things can be better. When you believe that there's so much room for improvement – a fundamentally optimistic outlook as I see it – you come to be seen by others as some who finds problems with everything. I don't intend that. Things are just bad compared to how good they could be :)"}, {"id": 50668325, "au": "rayiner", "dom": 178, "sr": 97, "sc": 1.67, "ep": 1.87, "bs": 0.0, "d": 0, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 16, "qw": 0, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": ["https://www.usatoday.com/story/opinion/columnist/2025/06/24/liberal-conservative-mental-health-gap/84285127007/"], "ig": 0.67, "fa": 0.0, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "This suggests that the observed correlation between better mental health and political conservatism may be causal: https://www.usatoday.com/story/opinion/columnist/2025/06/24/...."}, {"id": 50667165, "au": "byronturncoat", "dom": 111, "sr": 98, "sc": 1.67, "ep": 1.79, "bs": 0.0, "d": 5, "age": 5.93, "grav": 41.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 33, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.351, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Or we can do both, because that's what's necessary to actually hit climate goals and reduce the damage that warming will cause in the next 50-100 years"}, {"id": 50666782, "au": "cucumber3732842", "dom": 119, "sr": 99, "sc": 1.67, "ep": 1.77, "bs": 0.0, "d": 2, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 1088, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.752, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's also death by a cuts you gotta worry about if your time horizon is longer than next election, which it probably is if you have popped out kids, bought a house or done anything else to put down roots.\n\nIvory tower environmentalists, no problem.  Globalist financiers and offshoring inclined MBA types, fine.  Opioid peddlers, tolerable.  None of them are an existential problem on their own but their combined effect formerly industrial midwest speaks for itself.\n\nSo you wind up having to fight every problem like it's existential because otherwise you'll have no spare capacity for something you can't stop and the less capacity for resistance you have the smaller of an interest can steamroll you.\n\nYeah, mind your own business and all that but that doesn't scale.  Someone has to care."}, {"id": 50669624, "au": "corgihamlet", "dom": 37, "sr": 100, "sc": 1.67, "ep": 3.25, "bs": 1.49, "d": 2, "age": 2.27, "grav": 13.6, "surf": 3.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 82, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.291, "fa": 0.0, "gp": 0.146, "bl": 0.562, "ds": 0.0, "txt": "Yes, I kinda follow such a person out of interest on Instagram and she practically falls into all of these categories - low income, low education, married her own cousin and has two children with him, obese, smokes weed, always problems in school, with her husband, etc - the full stack.\n\nFor her every issue is always systemic. She was into the whole Israel/Gaza thing, is very concerned about all kinds of imagined child abuse (like the dangers of Roblox or GTA6 lol) but snorts cocaine while her children are in the room.\n\nIt's clear that she has some mental issues but she also blames those on \"the system\"."}, {"id": 50667355, "au": "basilikum", "dom": 91, "sr": 101, "sc": 1.67, "ep": 1.68, "bs": 0.0, "d": 6, "age": 5.66, "grav": 39.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2338, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.716, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, but none of that is awareness about climate change.\n\nThe awareness these protesters are creating is precisely and intentionally for doom. And I argue that that drives us more towards division rather than solutions."}, {"id": 50667026, "au": "basilikum", "dom": 89, "sr": 102, "sc": 1.66, "ep": 1.66, "bs": 0.0, "d": 4, "age": 6.13, "grav": 43.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2338, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.707, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is there any awareness missing for climate change?\n\nEveryone knows about it. People are however very divided. A lot of people simply refuse to believe in the fact that it's real and others think that change is unattainable. How does more awareness help with this.\n\nWould any, literally any amount of awareness for climate change help the topic?"}, {"id": 50668567, "au": "npteljes", "dom": 3, "sr": 103, "sc": 1.62, "ep": 2.82, "bs": 1.19, "d": 2, "age": 3.8, "grav": 23.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 21, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.464, "fa": 0.42, "gp": 0.365, "bl": 0.45, "ds": 0.0, "txt": ">Typically the people I see that are most animated about political issues have the most messed up personal lives in terms of\n\nBoy did that describe me to a T! During my \"free software everywhere\" heyday my life was otherwise a MESS.\n\nI wholeheartedly agree with your assessment and message here."}, {"id": 50667325, "au": "keybored", "dom": 174, "sr": 104, "sc": 1.61, "ep": 1.61, "bs": 0.0, "d": 0, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, " ronically was a lot of what saved the environment) would make it go democratic and that NYC would be underwater right now and all sorts of other things like that that have not been beneficial in hindsight.\n\nYou can't just let the useful idiots off the hook. You have to point at the"}, {"id": 50666833, "au": "cyanydeez", "dom": 132, "sr": 109, "sc": 1.26, "ep": 1.26, "bs": 0.0, "d": 1, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 2957, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.536, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "while true, America is a year out from the federal government shooting civilians under the guise of forced deportations.\n\nPerhaps what you mean is \"you probably won't get shot in the face today by the federal government, so why worry about them shooting people in the face yesterday?\""}, {"id": 50667493, "au": "silverFork", "dom": 39, "sr": 110, "sc": 1.13, "ep": 1.13, "bs": 0.0, "d": 2, "age": 5.45, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 250, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.38, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "I suspect that  people who make these claims do not live it themselves because they are assuming that there people who living perfect lives based on their assumptions and recipe which are cliche nonsense."}, {"id": 50666922, "au": "somewhereoutth", "dom": 107, "sr": 111, "sc": 1.12, "ep": 4.7, "bs": 3.58, "d": 3, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2108, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_national", "flbl": "Etc & National 5, "sr": 150, "sc": -3.25, "ep": 1.92, "bs": 5.17, "d": 4, "age": 5.79, "grav": 40.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.815, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "People got better working conditions because there's competition for labor.\n\nFor instance, there are no laws that an employer can't have me work weekends or weird hours. But most don't because companies lure employees partly based on work conditions, and that includes niceties that are cheaper than straight pay.\n\nWith civil rights, good workers are hard to find. If you're going to exclude workers and customers on arbitrary characteristics, then you're leaving money on the table. In fact, Jim Crow laws MANDATED racial segregation across many businesses and public accommodations. So maybe partly protests and partly business interests.\n\nERA was a failure."}, {"id": 50667465, "au": "bombcar", "dom": 164, "sr": 151, "sc": -3.28, "ep": 0.96, "bs": 4.24, "d": 4, "age": 5.49, "grav": 37.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 53939, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.409, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "It’s almost as if most climate discussion is designed to produce the anxiety, not solutions."}, {"id": 50666813, "au": "johnnudd", "dom": 84, "sr": 152, "sc": -3.35, "ep": 1.82, "bs": 5.17, "d": 3, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 14, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.355, "fa": 0.0, " rivers, but it was already too late. Did you know that under 1% of rivers in the US are undammed? It's an absolute travesty for the environment, not to mention human recreation. A cost we chose to pay. Solar panels out in the desert are not great either. Though it's stereotyped as dead and empty, the desert is teeming with life, and huge solar arrays have terrible effects on tortoises and birds and other animal and plant life.\n\nIn the end, yes, we will have to decide which of these outcomes we can accept in exchange for halting climate change. There's no development without costs, and we can only put so much clean energy generation inside already developed areas (though we should do more, e.g. rooftop/parking-lot solar). But the environmentalists were right to fight it; that's their purpose. It is so narrow-minded to call them \"useful idiots.\""}, {"id": 50667915, "au": "nec4b", "dom": 74, "sr": 156, "sc": -3.41, "ep": 0.83, "bs": 4.24, "d": 4, "age": 4.84, "grav": 31.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 694, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.291, "fa": 0.0, "gp": 0.103, "bl": 1.6, "ds": 0.0, "txt": "They were solving different kind of problems: social vs technical."}, {"id": 50667175, "au": "cryptopian", "dom": 90, "sr": 157, "sc": -3.41, "ep": 1.76, "bs": 5.17, "d": 5, "age": 5.91, "grav": 41.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 222, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.748, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "I think there's a lot of details that people aren't aware of - that many parts of the world are decarbonising quickly, that fossil fuel lobbyists are spending huge amounts of effort discoura 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.606, "fa": 0.0, "gp": 0.119, "bl": 1.95, "ds": 0.0, "txt": "The regular work week and the weekend were directly caused by labor organizing.\n\nThere are non-American countries that don’t have specific American laws like a minimum wage. That’s because they have different regulations or organizations that make offering a too low wage impractical for employers."}, {"id": 50667157, "au": "mrbombastic", "dom": 71, "sr": 166, "sc": -3.62, "ep": 1.55, "bs": 5.17, "d": 5, "age": 5.94, "grav": 41.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1147, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.562, "fa": 0.0, "gp": 0.159, "bl": 1.95, "ds": 0.0, "txt": "labor movements absolutely had to cause people inconvenience in order to be noticed...this narrative comes about with every major protest movement. \"If they just did it in a way that was less intrusive I would support them\"...it seems to me more a reaction by the status quo wanting something that can be easily ignored, people with signs in the designated protest zone out of the way."}, {"id": 50667775, "au": "UncleMeat", "dom": 70, "sr": 167, "sc": -3.62, "ep": 1.54, "bs": 5.17, "d": 5, "age": 5.03, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 18506, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.58, "fa": 0.0, "gp": 0.125, "bl": 1.95, "ds": 0.0, "txt": "Suffragettes were putting bombs in mailboxes. Labor movements were also quite violent, both against management and against scabs. The march to montgomery blocked traffic. Where's this idea coming from that past protest movements didn't inconvenience people?"}, {"id": 50667817, "au": "bko", "dom": 78, "sr": 168, "sc": -3.63, "ep": 1.53, "bs": 5.17, "d": 6, "age": 4.99, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.652, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "This is a talking point. Repeating it doesn't make it true.\n\nWhat regulation or government action enshrined the weekend and work week? Again, nothing stops a business from ignoring the work week and weekend apart from the fact that it would find it difficult to find employees under these conditions.\n\nPlenty of bankers and lawyers work weekends and crazy hours and are not subject to these rules."}, {"id": 50667426, "au": "rafram", "dom": 112, "sr": 169, "sc": -3.64, "ep": 0.6, "bs": 4.24, "d": 6, "age": 5.54, "grav": 37.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.254, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "I think you’ll find very little buy-in for society-wide asceticism."}, {"id": 50668668, "au": "npteljes", "dom": 50, "sr": 170, "sc": -3.67, "ep": 1.5, "bs": 5.17, "d": 3, "age": 3.64, "grav": 22.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 13, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.581, "fa": 0.0, "gp": 0.094, "bl": 1.95, "ds": 0.0, "txt": ">This is one of the most disgusting things I've ever read on HN\n\nThat is because of how you interpret the text. A list of priorities like that doesn't mandate that you need to care of a high priority completely before you begin with the next.\n\nThen, about that \"people should\" part. It's not a prescription on how everybody has to live. Rather, taken with the rest of the context, it's a lesson about how people tend to care about faraway issues, instead of sorting out their own.\n\nThe comment is basically a life hack for one to reorient themselves. Sometimes, concerns are just a distraction. I think it's worthwhile to know whether something really interests me, or am I just distracting myself from my own problems."}, {"id": 50668746, "au": "gspr", "dom": 127, "sr": 171, "sc": -3.71, "ep": 0.53, "bs": 4.24, "d": 7, "age": 3.52, "grav": 21.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 8, "qw": 0, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.226, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "It's appeared in various memes over the years."}, {"id": 50670966, "au": "betenoire", "dom": 181, "sr": 172, "sc": -3.73, "ep": 0.51, "bs": 4.24, "d": 3, "age": 0.21, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 1347, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.218, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "I clicked. those are a lot of words to say \"ignorance is bliss\""}, {"id": 50666841, "au": "rafram", "dom": 94, "sr": 173, "sc": -3.75, "ep": 1.42, "bs": 5.17, "d": 3, "age": 6.42, "grav": 46.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.527, "fa": 0.0, "gp": 0.122, "bl": 1.95, "ds": 0.0, "txt": "New technology is nice, but what if the president just blocks all large-scale energy projects that use it? (Not a hypothetical!)\n\nThe reality is that we have excellent sources of clean energy, but they aren’t being deployed as widely as they could be due to roadblocks put up by politicians who are funded by the oil and gas industry. Young people whose lifespans will likely extend well into the “everything will be really bad by …” years are understandably pissed about this."}, {"id": 50667502, "au": "keybored", "dom": 73, "sr": 174, "sc": -3.76, "ep": 1.41, "bs": 5.17, "d": 5, "age": 5.44, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 2352, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.598, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "That social change happened historically by protesteing nicely, you know, holding up placards and not bothering anyone (like traffic) is whitewashing. People did things that hurt. A united strike where scabs (crossing the picket line) can be much more uncomfortable than just going to work and collecting the paycheck.\n\nIt is a very convenient narrative. That change happens when you do things that everyone can ignore and no one is inconvenienced."}, {"id": 50668714, "au": "amanaplanacanal", "dom": 179, "sr": 175, "sc": -3.77, "ep": 0.47, "bs": 4.24, "d": 1, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 0, "k": 8387, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.199, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "She seems to have forgotten how outraged conservatives were when Democrats were in power."}, {"id": 50668341, "au": "cucumber3732842", "dom": 58, "sr": 176, "sc": -3.81, "ep": 1.36, "bs": 5.17, "d": 3, "age": 4.15, "grav": 26.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 36, "k": 1088, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.578, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": ">To take the movie version: it's perfectly possible to be a brilliant professor who warns the world of imminent and real danger, while never managing to put on two matching socks, let alone maintain strong interpersonal relationships.\n\nThis is true in the same way that smoke shops can sell bongs and crack pipes because they could be used to smoke tobacco.  Sure, what you're describing is theoretically possible in the same way that there might be someone somewhere who buys one of those pipes to smoke tobacco.  In reality the mean, median and modal case is someone with no \"real problems\" (or who's avoiding them) getting pissed off that some people far away who don't even matter to them are \"doing it wrong\" in a way that doesn't even effect them all the same as the crack pipe buyers are smoking crack with them."}, {"id": 50667147, "au": "byronturncoat", "dom": 57, "sr": 177, "sc": -3.86, "ep": 1.31, "bs": 5.17, "d": 3, "age": 5.96, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 33, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.447, "fa": 0.0, "gp": 0.179, "bl": 1.95, "ds": 0.0, "txt": "It's incredibly common to encounter this type of \"main character\" here. If the problem doesn't affect them directly, it must not be real. \"AI works for me, so you must be doing it wrong\", etc."}, {"id": 50669570, "au": "NoMoreNicksLeft", "dom": 97, "sr": 178, "sc": -3.87, "ep": 1.29, "bs": 5.17, "d": 6, "age": 2.34, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 19, "k": 1648, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.55, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": ">Geothermal is continuous. Hydroelectric is too\n\nBoth of these have been used to their maximum, since before either of us were born. There are no more rivers to dam up for hydro, no more good sites for geothermal not already in use. Neither of these is good from an environmental standpoint anyway, hydro devastated salmon fisheries, just for instance.\n\n>For wind, solar, and the rest, we have pretty good batteries these days,\n\nThey're actually pretty fucking awful, the only thing that can be said is that we have batteries at all that might scale up. Better than nothing."}, {"id": 50668086, "au": "piva00", "dom": 72, "sr": 179, "sc": -3.89, "ep": 1.28, "bs": 5.17, "d": 5, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 10658, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.544, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "They were burning down stuff, striking, having rallies where people got shot, killed, brutalised.\n\nWhat's up with this HN thread with people clearly not knowing history and trying to opine as if protests that really changed the world were based on singing Kumbaya?"}, {"id": 50666830, "au": "drysine", "dom": 133, "sr": 180, "sc": -3.89, "ep": 0.35, "bs": 4.24, "d": 1, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 23, "k": -4, "kpp": -0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.147, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": ">I observe folks having a degree of anxiety about political outcomes that far outweighs the actual risks involved in those outcomes going the “wrong” way.\n\nThat's what people in Russia and Ukraine thought. And look where we are now."}, {"id": 50670139, "au": "dvdkon", "dom": 79, "sr": 181, "sc": -3.9, "ep": 1.26, "bs": 5.17, "d": 7, "age": 1.59, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1918, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.538, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "No idea about other countries, but here in the Czech Republic, you can't have employees work during the weekend/long shifts/at night/during holidays without increasing their pay and satisfying other conditions. So you _could_ ignore the work week, but there's more than just the labour market disincentivising it."}, {"id": 50669588, "au": "ctmlr", "dom": 110, "sr": 182, "sc": -3.9, "ep": 0.34, "bs": 4.24, "d": 5, "age": 2.32, "grav": 13.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 13, "k": 120, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 0.143, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "> consume minimally, never travel, don’t heat or cool our homes unless it’s dire\n\nMany of us are already at this point, not really by choice."}, {"id": 50668654, "au": "adrianN", "dom": 98, "sr": 183, "sc": -3.98, "ep": 0.27, "bs": 4.24, "d": 5, "age": 3.67, "grav": 22.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 33048, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls
