bout our knowledge of the universe, not about the universe itself.\n\nWe don't operate with perfect information. Explaining an observation about the universe always comes with a degree of uncertainty, so there's always an alternative explanation you can't completely rule out. We can agree that one explanation is far more likely given what we know, but 99% sure still isn't 100%. And it's easy to overestimate how much we really understand.\n\nQuestioning your assumptions in the pursuit of truth is an essential part of the scientific method. If therapy helps people recognize their own mental distortions, like when they are more certain than the evidence supports, I would consider that to be a good thing, not lying to patients."}, {"id": 50669889, "au": "steveBK123", "dom": 10, "sr": 5, "sc": 6.93, "ep": 7.22, "bs": 0.0, "d": 3, "age": 1.92, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 16090, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.449, "fa": 0.95, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Budgeting/spending are insane with HOA/Condos.\n\nI was on my condo board a few years, and the amount of venom I got for seemingly minor issues from people who are neighbors is insane.  Mostly different people were mad we didn't spend money we didn't have on their pet projects, everyone having different pet project.\n\nThe first few years we had very contentious elections with 2x more candidates than seats, dirty tricks, threats of formal complaints to state, litigation, the works.\n\nOf course the squeaky wheels ended up taking over the board when we had enough, and had a huge falling out immediately.  They also blew a gaping hole in the budget by just spending on whatever whenever rather than adding to next years budget.  Ended up with 10-20% deficits for 4 years straight.\n\nNow we don't even have enough people to seat a board, elections keep getting delayed and we might have too pay to outsource a lawyer to run things."}, {"id": 50667794, "au": "k0dyn", "dom": 145, "sr": 6, "sc": 6.88, "ep": 6.88, "bs": 0.0, "d": 2, "age": 5.01, "grav": 33.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 24, "k": 11, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.731, "fa": 0.64, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "> It explicitly points out that \"mental health resources and political engagement are both important for a healthy, democratic society, but they may exist in tension\".\n\nYeah, this is largely what I was referring to by implicit assumptions. The statement is as quoted, but the implication is that \"protesting is a valuable analogue for 'political engagement' and 'a healthy, democratic society'\".\n\nI can't access the full paper, nor see the full details of their methodology. But they seem to have established that mental health treatment correlates to less protesting, with anxiety being the linking factor.\n\nHowever, I'm reading it as implying that this (engagement in protesting, and by extension mental health treatment) is a negative/undesirable factor for political engagement or a healthy, democratic society.\n\nThat's what seems unsupported to me. But I'm no social scientist, and it's entirely plausible that this is a common/well-established paradigm I'm simply unfamiliar with."}, {"id": 50666929, "au": "benrutter", "dom": 158, "sr": 7, "sc": 6.85, "ep": 6.85, "bs": 0.0, "d": 2, "age": 6.27, "grav": 44.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 20, "k": 3553, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.591, "fa": 0.42, "gp": 1.321, "bl": 0.0, "ds": 0.0, "txt": "> That'd usually be a good thing, since you have much more control of your own life, and almost none over society\n\nBased on personal experience, I don't agree. I had a lot of anxiety around climate change peak a couple of years ago, I got involved in some community groups and activism off the back of it in a small way. It felt so positive and validating to be working with other people trying to improve things.\n\nI'm not under any illusion that the extremely minor volunteering I've done will prevent climate change, but being a tiny cog making a tiny but positive difference, from my experience, is emotionally a huge amount for anxiety-reducing than simply trying to make peace with something you're deeply unhappy about."}, {"id": 50666948, "au": "the_other", "dom": 165, "sr": 8, "sc": 6.69, "ep": 6.84, "bs": 0.0, "d": 2, "age": 6.24, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 5, "k": 2500, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.545, "fa": 0.7, "gp": 0.838, "bl": 0.0, "ds": 0.0, "txt": "> That'd usually be a good thing\n\nIt’s also the thing which creates many of the problems:\n\n- execs worrying about their bottom line = worse climate change\n\n- local politicians worrying about their career = heightened left/right tension in the community\n\n- fear for my job ~= higher resentment towards immigration / AI etc\n\n- “my interpretation of this ancient book” = a tonnne of violence\n-"}, {"id": 50666675, "au": "twoodfin", "dom": 1, "sr": 9, "sc": 6.52, "ep": 6.96, "bs": 0.0, "d": 0, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 13229, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.679, "fa": 0.34, "gp": 1.412, "bl": 0.0, "ds": 0.0, "txt": "In a field experiment, mental health outreach reduces anxiety by an average of 11% (d = 0.41), with mediation analyses showing decreased anxiety is related to a decrease in interest in political engagement. In a survey experiment, higher anxiety is related to greater odds of volunteering.\n\nAnecdotally, I observe folks having a degree of anxiety about political outcomes that far outweighs the actual risks involved in those outcomes going the “wrong” way.\n\nIt might be healthy for our political culture if this dial got turned down a few notches."}, {"id": 50670370, "au": "phil21", "dom": 35, "sr": 10, "sc": 6.51, "ep": 6.95, "bs": 0.0, "d": 4, "age": 1.23, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 10, "k": 7433, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.894, "fa": 0.42, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": ">  but it can hardly be described as showing civic virtue.\n\nCompletely disagree. I am old enough to remember much higher civic engagement in local community and politics. Those people were infinitely more effective at pushing for change at a regional, state, and eventually national level due to the fact they were a community and not some loosely held together group in name only. They were engaged in national politics, but it wasn't the ridiculous black and white vitriol you see today. And I attribute most of the \"us vs. them\" black and white thinking directly to this breakdown of local community engagement and involvement. Easy to hate your neighbor when you never interact with them and turn them into a caricature.\n\nGet your local stuff figured out first. This forces you to learn basic political skills such as working with those you disagree with and compromise. Those folks likely aren't as evil as you thought, and if nothing else showing them you're a decent person who wants mostly the same things can often soften their opinions on the edge wedge issues.\n\nI would say focusing on national or global politics before that is directly harmful. The local politics first can at least help as a pre-filter for the most crazy/extreme/obnoxious/etc. not to have a greater voice than deserved at a larger state."}, {"id": 50667113, "au": "jsw97", "dom": 193, "sr": 11, "sc": 5.93, "ep": 5.93, "bs": 0.0, "d": 0, "age": 6.0, "grav": 42.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 568, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.738, "fa": 0.22, "gp": 0.842, "bl": 0.0, "ds": 0.0, "txt": "Based on the abstract (I can't find free full text) it looks like the \"decreases\" claim is based on observational data and the authors are not, at least at the level of the abstract, are not giving the impression that they have anything approaching a natural experiment. (The separate anxiety finding is experimental.)\n\nAll due respect, I hate this type of research. It seduces the reader with a plausible psychological effect (the opposite of course would be supportable too). But there's no \"there\" there, there are about a million reasons why you would observe this correlation in the data. And if the authors are willing to abuse observational data in this way, then I'm going to go out on a limb and suggest to you that their field experiment and survey experiment methodology may disappoint. (If someone points me to a free pdf and I'm wrong then I will eat my hat.)\n\nNonetheless here we have a page full some of the internet's more thoughtful commenters musing about this connection. It doesn't deserve your attention. Burn the neuronal connections you just formed and move on."}, {"id": 50669544, "au": "BoxOfRain", "dom": 30, "sr": 12, "sc": 5.93, "ep": 6.37, "bs": 0.0, "d": 7, "age": 2.4, "grav": 14.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 225, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.928, "fa": 0.28, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "You're arguing like there's a clean hierarchy between local, national, and international politics but I'm arguing that there isn't a clean boundary between them. You need to take a wholistic view of politics to understand all the main factors, even if you then decide the most useful theatre for political activity is the local level.\n\nLet's look at my local level for example, a lot of the general misery comes ultimately from the fact rents and energy are very expensive. Why is energy expensive? Because of a failure to build out the national grid appropriately in the face of increasing demand and a deep path dependency on natural gas, which was baked in decades ago. Why is natural gas in particular expensive now? Because Russia invaded Ukraine and America blundered into a war with Iran, screwing up the international market for the stuff. If my local community centre is closing because the price of natural gas is expensive, it is no good pressing the issue at the local level because foreign affairs are why it's closing. Foreign and national policy defines the space of possible action at the local level, and sometimes it literally is not enough no matter how you spin it because local politics is the wrong scale to address the problem. Whatever happens gas will still be expensive; only the next level up can improve our energy infrastructure meaningfully."}, {"id": 50666767, "au": "bko", "dom": 2, "sr": 13, "sc": 5.89, "ep": 6.33, "bs": 0.0, "d": 1, "age": 6.52, "grav": 47.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.744, "fa": 0.0, "gp": 1.537, "bl": 0.0, "ds": 0.0, "txt": "I agree. People should generally take care of their own lives first. Typically the people I see that are most animated about political issues have the most messed up personal lives in terms of relationships, stability, mental health, etc.\n\nIn general, people should focus on local issues and expand the scope only once they get their own house in order.\n\nPersonal - am I getting enough sleep, eating well, am I employed, etc\n\nImmediate family / relationship - do I have strong relationships, does anyone need help\n\nNeighbors / immediate community - pick up garbage around your neighborhood, organize with neighbors for PTA changes\n\nState or broader region\n\nNational\n\nGlobal"}, {"id": 50666834, "au": "wzdd", "dom": 144, "sr": 14, "sc": 5.71, "ep": 5.86, "bs": 0.0, "d": 1, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 2647, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.611, "fa": 0.28, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "The main thrust is \"we find that receiving counseling from mental health professionals decreases the likelihood of protesting in subsequent weeks\".\n\nThat's much more significant than what you wrote. For example, it could be that counseling is correlated with lower anxiety levels in general, and protesting is correlated with higher anxiety levels in general, but the two are not correlated for other reasons (e.g. because counseling reduces anxiety about one's personal life, but doesn't reduce anxiety about the direction society is moving). That's not what the study found: instead, it found a direct correlation between counseling and protesting, and posits anxiety as the mechanism.\n\nThe abstract doesn't just imply that this is a bad thing. It explicitly points out that \"mental health resources and political engagement are both important for a healthy, democratic society, but they may exist in tension\"."}, {"id": 50669441, "au": "michaelt", "dom": 12, "sr": 15, "sc": 5.66, "ep": 6.1, "bs": 0.0, "d": 4, "age": 2.53, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 44, "k": 39361, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.225, "fa": 0.76, "gp": 0.731, "bl": 0.0, "ds": 0.0, "txt": "> Good people generally don't enjoy bossing others around or stripping their freedoms. So positions of unchecked political power hold very little appeal for them. But, those who crave control and take pleasure in being obeyed are magnetically drawn to the top of the hierarchy.\n\nI feel you're radically over-estimating the power a HOA member has.\n\nI myself have unchecked power over replacing lightbulbs in the parking area, selecting which landscaping company will cut the grass, and how to spend the $2000 in our bank account. But this \"power\" doesn't let me impress women, enrich myself, or crush my enemies so it's barely power at all.\n\nI wish there was someone who craved and took pleasure in this shit, then they could chase landlords for pocket change instead of me doing it."}, {"id": 50669342, "au": "Avicebron", "dom": 29, "sr": 16, "sc": 5.38, "ep": 6.04, "bs": 0.0, "d": 6, "age": 2.66, "grav": 16.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 17, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.596, "fa": 0.42, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "> I disagree with the idea we can ignore foreign affairs for the sake of our personal mental health.\n\nNot just personal mental health, but community economic health, state economic health, etc. If you are financially and socially comfortable enough to be agitating for people halfway across the world, you aren't representing the people who are in the country you live in that need that energy here.\n\nI'm not trying to be harsh, but it's eminently privileged to say \"well I would rather buy mosquito nets for Rawanda\" or whatever instead of saying \"I wonder how a white farm kid in rural Vermont or New York is going to be able to afford a house in that market, or just even pay their bills.\""}, {"id": 50670000, "au": "rayiner", "dom": 180, "sr": 17, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 2, "age": 1.77, "grav": 10.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 0, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": ["https://americanaffairsjournal.org/2023/03/how-to-understand-the-well-being-gap-between-liberals-and-conservatives/"], "ig": 0.714, "fa": 0.96, "gp": 0.663, "bl": 0.0, "ds": 0.0, "txt": "The article is discussing a 2022 study, which is a period when democrats were in power. The finding that conservatives are happier or have better well being than liberals is robust and does not change depending on who is in office: https://americanaffairsjournal.org/2023/03/how-to-understand..."}, {"id": 50667297, "au": "9x39", "dom": 53, "sr": 18, "sc": 5.2, "ep": 5.64, "bs": 0.0, "d": 3, "age": 5.75, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 57, "k": 931, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.467, "fa": 0.42, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": ">it's perfectly possible to be a brilliant professor who warns the world of imminent and real danger, while never managing to put on two matching socks, let alone maintain strong interpersonal relationships.\n\nSelf-insert?\n\n>Besides, who are you to decide if someone cares about starving children on the other side of the world instead of a broken streetlight on their corner?\n\nFor people struggling to maintain a the foundations of a functional life, changing focus to issues where they both have control and there are positive consequences of their interest is worthwhile advice.\n\nThe point is we can be too-connected and unable to effectively prioritize and function. Smartphones and depression rates are linked probably for this reason. What’s the point of being overly concerned when the consequence of your extreme concern is zero? How does that feel when you still have to face the life you’re in once we’re done being hyper concerned for the day?"}, {"id": 50666945, "au": "silverFork", "dom": 194, "sr": 19, "sc": 5.19, "ep": 5.19, "bs": 0.0, "d": 0, "age": 6.24, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 250, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.429, "fa": 0.34, "gp": 0.595, "bl": 0.0, "ds": 0.0, "txt": "How did they do this test?  Did they go around and found protestors and offered treatment so was it preemptive? Nope..   that couldnt be done so they compared classes and treated some classes.. and used some as control.   Did they ask them, do you want to protest?  seriously do you believe that is sufficient to prove anything.\n\nThey gave 1 session of workshop therapy and vola, 30% stopped protesting.. ya right\n\nI am not buying this."}, {"id": 50667271, "au": "diydsp", "dom": 153, "sr": 20, "sc": 4.86, "ep": 5.15, "bs": 0.0, "d": 2, "age": 5.79, "grav": 40.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2950, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.81, "fa": 0.0, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "This.  Plus I'm curious what peoples' assumptions are abt which political inclination this relates to and which side(s) we perceive it applying to.\n\nDoes the Westboro baptist church dial back their God Hates F..s signs after therapy?  Do feminists tell themselves \"ah I'm fine barefoot and pregnant?\"  Is the UK govt resynthesizing online therapist video chats in real time into subliminal messages to pacify protestors against the Gaza genocide?"}, {"id": 50668969, "au": "intended", "dom": 197, "sr": 21, "sc": 4.86, "ep": 5.08, "bs": 0.0, "d": 0, "age": 3.18, "grav": 19.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.914, "fa": 0.0, "gp": 0.402, "bl": 0.0, "ds": 0.0, "txt": "Yep, it makes sense.\n\nNot really a hot take, but the underlying problem isnt that democractic engagement is a side effect of anxiety. It is that anxiety beyond a point with a lack of agency results in searching for ways to reduce anxiety.\n\nBut when this is combined with the state of our information ecosystem, this should be the outcome.\n\nLast I checked, local politics matter more to people, as does local news.\n\nReporting and journalism are entirely dependent on advertizing, since the day craigslist decimated the classifieds.\n\nAd revenue is typically how content is funded, and the incentives for this are decided by tech platforms. Yt / Twitch, content creators are increasingly the media channels people turn to.\n\nThey create content at the cadence and speed that the market making algorithms of platforms encourage.\n\nAnd it not the job of the platforms to develop local journalism, or to be responsible for the state of the information that people are consuming when they are anxious/ feeling X emotion.\n\nIf someone has a way to improve or realign the incentives, that work at the scale of nations, societies and economies, I'd love to hear it."}, {"id": 50666895, "au": "cmiles8", "dom": 188, "sr": 22, "sc": 4.64, "ep": 4.64, "bs": 0.0, "d": 0, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 5640, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.216, "fa": 0.34, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "There are of course legitimate reasons to protest. It’s also hardly a secret that a non-trivial number of protestors are also just generally mentally unwell and raging against something to rage at. The folks that can’t have a 100-level intelligent conversation about the thing they claim to be angry about. These are likely the folks in this “34-39%.”"}, {"id": 50669191, "au": "BoxOfRain", "dom": 28, "sr": 23, "sc": 4.5, "ep": 5.38, "bs": 0.0, "d": 5, "age": 2.88, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.728, "fa": 0.0, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "This makes little sense in a globalised world though, the world's problems necessarily are my problems because of that; foreign policy influences so many aspects of domestic policy even at the local level. Anyone who thought Iraq was a bad idea should shut up for their mental health and focus on what colour the council should paint the bike sheds instead? That's how such suggestions come across to me.\n\nSorry if I'm coming across as a bit aggressive, but I'm finding it hard to express in neutral terms how robustly I disagree with the idea we can ignore foreign affairs for the sake of our personal mental health."}, {"id": 50669778, "au": "steveBK123", "dom": 38, "sr": 24, "sc": 4.43, "ep": 5.31, "bs": 0.0, "d": 2, "age": 2.07, "grav": 12.5, "surf": 3.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 16090, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.855, "fa": 0.0, "gp": 0.658, "bl": 0.0, "ds": 0.0, "txt": "Agreed - my \"most political\" friends are obsessed with every bit of minutiae at the national level and basically pay zero attention to state/city/local news and politics.\n\nI had super politics friends organizing one of those \"write postcards to voters in purple states to convince them we are right\" parties..  (which I would imagine probably backfire as often as they work).\n\nThey don't watch local news and are startlingly unaware of local issues I ask about.  Even unaware of mayoral primary candidates for months until it was covered on national politico-infotainment late night shows from which they seem to download their new programming.\n\nAnd of course, they do absolutely zero non-political volunteer work."}, {"id": 50670862, "au": "AlexandrB", "dom": 129, "sr": 25, "sc": 3.99, "ep": 5.09, "bs": 0.0, "d": 1, "age": 0.41, "grav": 4.9, "surf": 9.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.343, "fa": 0.34, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "It's been 10 years of \"this the most important election of our lives\" with no end in sight while meaningful changes are scarce regardless of who's elected. After enough of this you start to get the sense that \"political engagement\" does not actually impact your circumstances and we're all at the mercy of larger forces like aging demographics, falling birth rates, and the relentless advancement of technology."}, {"id": 50666779, "au": "FailMore", "dom": 136, "sr": 26, "sc": 3.94, "ep": 4.31, "bs": 0.0, "d": 0, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 1827, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.058, "fa": 0.28, "gp": 0.707, "bl": 0.0, "ds": 0.0, "txt": "I'm training to be a psychotherapist. There's an idea called the \"depressive position\". Which is not that everything is depressing, but that everything has two sides. Spending more time in this \"position\" is considered a sign of a healthy state of mind. The \"schizoide position\" is the opposite, something is either all good or all bad. I don't have any evidence, but it would make sense that more time spent in this position would lead to more protesting."}, {"id": 50666682, "au": "kittikitti", "dom": 200, "sr": 27, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 0, "age": 6.68, "grav": 49.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 136, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.161, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This matches my experience. Therapy around 10 years ago was very different from how it is today. Some of the best therapists I knew were fired and replaced by very conservative people. It's become a means of population control"}, {"id": 50666879, "au": "watwut", "dom": 92, "sr": 28, "sc": 3.4, "ep": 4.06, "bs": 0.0, "d": 3, "age": 6.35, "grav": 45.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 19, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.134, "fa": 0.42, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "> If people felt passionate about it, they should work on technology to reduce carbon emissions or displace dirty technology.\n\nNo, what you suggest is setup to failure. It is not technological problem at this point, it is primary political problem.\n\nAnd also, protesting and obstructing traffic historically brings more change then passivity and pretending to oneself that doing normal work will fix it."}, {"id": 50666965, "au": "JumpCrisscross", "dom": 61, "sr": 29, "sc": 3.37, "ep": 4.69, "bs": 0.0, "d": 1, "age": 6.22, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 23, "k": 194750, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.94, "fa": 0.42, "gp": 0.884, "bl": 0.0, "ds": 0.0, "txt": "> I observe folks having a degree of anxiety about political outcomes that far outweighs the actual risks involved in those outcomes going the “wrong” way\n\nI also see folks metabolize anxiety into online engagement or lazy nihilism, neither of which is actually productive in terms of mental health or civic engagement."}, {"id": 50669249, "au": "BoxOfRain", "dom": 19, "sr": 30, "sc": 3.33, "ep": 3.99, "bs": 0.0, "d": 4, "age": 2.8, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.922, "fa": 0.62, "gp": 0.041, "bl": 0.0, "ds": 0.0, "txt": "I wonder if it counts tithes in that? The church I grew up in (not in the US, but this kind of church is way more common over there) demanded the Biblical 10% tithe of income from its members. If that goes down as charitable contribution it'll skew the results somewhat depending on how it's measured."}, {"id": 50668323, "au": "bko", "dom": 11, "sr": 31, "sc": 3.18, "ep": 4.06, "bs": 0.0, "d": 3, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.592, "fa": 0.0, "gp": 0.22, "bl": 0.0, "ds": 0.0, "txt": "It's a shame good people like you give up, leaving these organizing bodies to the absolute worst people.\n\nHayek writes about this. Good people generally don't enjoy bossing others around or stripping their freedoms. So positions of unchecked political power hold very little appeal for them. But, those who crave control and take pleasure in being obeyed are magnetically drawn to the top of the hierarchy.\n\nFor you the work required was not worth it. The person who is left will pay that toll to exert control over others because he delights in that in a probably perverse way."}, {"id": 50668522, "au": "slfnflctd", "dom": 140, "sr": 32, "sc": 3.12, "ep": 3.85, "bs": 0.0, "d": 2, "age": 3.86, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2530, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.602, "fa": 0.0, "gp": 0.061, "bl": 0.0, "ds": 0.0, "txt": "Most things have much more nuance than your average paid political operative or religious zealot will use when trying to convince you to support their position, however.  Saying \"everything has two sides\" is a gross oversimplification, but I read it as shorthand for a more complex concept.\n\nWhen I was religious, things were much more black & white, and there were many times when I was much happier than I have been since.  Reality does tend toward being a bit on the depressing side when compared with believing you have supernatural allies and are going to live forever in paradise with no suffering and nearly everything has a simple binary 'answer'."}, {"id": 50667981, "au": "pmpmpmpm", "dom": 182, "sr": 33, "sc": 3.01, "ep": 4.11, "bs": 0.0, "d": 0, "age": 4.7, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 33, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.261, "bl": 0.0, "ds": 0.0, "txt": "I wonder if this reflects the impact of the issue on folks - that is, the emotional impact of the issue is what drives them to protest but once that emotional piece is managed they feel more secure. I’d also like to understand the demographics & SES of folks who felt less likely to protest after therapy - who were they, what issues caused the anxiety or concern, & what happened over the next 12 months? I think (in a positive world) if governments understood how to address their citizens’ anxiety about their own experiences they could identify and manage problems early before they became “protestable”. This assumes the protest is about something manageable, not something like systemic racism, hierarchy, or severe political violence.\n\nI know the actual take away from this is going to be “protesters are mentally ill and need therapy” though:/"}, {"id": 50666748, "au": "k0dyn", "dom": 143, "sr": 34, "sc": 2.93, "ep": 4.47, "bs": 0.0, "d": 0, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 11, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.922, "bl": 0.0, "ds": 0.0, "txt": "Only read the abstract, but there seem to be an awful lot of implicit assumptions in this?\n\nThe main thrust seems to be \"protesting correlates with higher anxiety levels\" and \"mental health treatment correlates with lower anxiety levels\".\n\nThat sounds pretty reasonable to me, but even in the abstract it appears (to me) to be implying that this is a negative, an undesired result, or somehow surprising?"}, {"id": 50667024, "au": "gcanyon", "dom": 59, "sr": 35, "sc": 2.87, "ep": 3.75, "bs": 0.0, "d": 1, "age": 6.14, "grav": 43.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 23, "k": 5541, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.625, "fa": 0.42, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "> I observe folks having a degree of anxiety about political outcomes that far outweighs the actual risks involved in those outcomes going the “wrong” way.\n\nHonestly I think the scare quotes disqualifies this comment, but: when the call is between democracy and effective dictatorship the consideration becomes like walking near a cliff: sure the probability that you'll fall over the edge is low, even walking within a few feet of the edge, but the consequences of going over the edge are so severe it warrants careful consideration about just how close you'll go."}, {"id": 50667189, "au": "diydsp", "dom": 146, "sr": 36, "sc": 2.64, "ep": 3.74, "bs": 0.0, "d": 1, "age": 5.89, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2950, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.199, "fa": 0.22, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "Assumptions everywhere.\n\nCaveat: couldnt find a free link to read it.\n\n1st, ppl in MH treatment have logically less time to protest.\n\n2nd, they are more likely to recv medication, which spans bt a pacificant and a wildcard.\n\n3rd, this is apparently one field experiment.  Not nearly enough to draw conclusions from."}, {"id": 50666954, "au": "gspr", "dom": 48, "sr": 37, "sc": 2.64, "ep": 3.74, "bs": 0.0, "d": 2, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.254, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "This is one of the most disgusting things I've ever read on HN. As if someone's overall \"hang of things\" disqualifies them from caring about the world or people far away.\n\nIt is perfectly possible to be bad at \"the near things\", and yet be completely correct about \"the far things\". To take the movie version: it's perfectly possible to be a brilliant professor who warns the world of imminent and real danger, while never managing to put on two matching socks, let alone maintain strong interpersonal relationships.\n\nBesides, who are you to decide if someone cares about starving children on the other side of the world instead of a broken streetlight on their corner? Who gave you the right to make that moral deicision?"}, {"id": 50670777, "au": "matteoraso", "dom": 142, "sr": 38, "sc": 2.58, "ep": 3.68, "bs": 0.0, "d": 0, "age": 0.57, "grav": 5.5, "surf": 8.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 961, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.462, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "There's an insane selection bias here. People who feel like their anxiety is from mental illnesses are far more likely to go to therapy, and people who feel like it's from political problems are far more likely to protest. This study seems pretty garbage to me. Anecdotally, I did a deep dive into whether the youth mental health crisis exists for my Substack, and the studies behind that are also pretty garbage as well. I understand that it's tough to establish rigorous results in social sciences, but psychiatrists really need to have higher standards for themselves."}, {"id": 50671021, "au": "npteljes", "dom": 52, "sr": 39, "sc": 2.55, "ep": 4.94, "bs": 0.85, "d": 5, "age": 0.11, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 31, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.235, "fa": 0.42, "gp": 0.579, "bl": 0.32, "ds": 0.0, "txt": "It's more than an opinion, since it's rooted in reality, and experience. So it's more like a lesson. It's not a single issue either, there are a myriad ways people do this.\n\n>The way they go about it seems to be by telling people what constitutes \"their own problems\". Many of my own problems are far away from me, thank you very much!\n\nYou are welcome to have those! I don't think anyone here argues in good faith that faraway issues can not be important to a person. The main point is that sometimes people are more eager to participate in lives other than theirs. And even this observance is not a be-all end-all important one. Just something that people sometimes do. And it's good to know about these biases that our minds produce so that we can get more on top of our issues - faraway or not."}, {"id": 50666694, "au": "api", "dom": 198, "sr": 40, "sc": 2.5, "ep": 3.6, "bs": 0.0, "d": 0, "age": 6.67, "grav": 48.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 35837, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "Oh boy this one’s gonna get misinterpreted and misquoted a lot. A whole lot.\n\nProbably reduces the likelihood of divorce by more. That does not mean there’s no reasons to protest or divorce\n\nIt does mean better mental health might get rid of some “ban dihydrogen monoxide”’level protests, some divorces over purely emotional tantrums.\n\nI’m sure you’d have less shootings and crime too."}, {"id": 50668684, "au": "quasi7", "dom": 128, "sr": 41, "sc": 2.46, "ep": 6.08, "bs": 2.52, "d": 1, "age": 3.62, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 16, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.481, "fa": 0.42, "gp": 0.969, "bl": 0.95, "ds": 0.0, "txt": "> It might be healthy for our political culture if this dial got turned down a few notches\n\nKeep in mind that powerful people made a lot of their money and influence to create this.\n\nThet are directly financially rewarding and benefitting from the deluge of antisocial garbage. If you take that away from them, they will revolt and take the economy with them\n\nThis is sinister blackmail scheme. They promote and reward antisocial content both because they make money off of it, but also because the second order of effects are destructive to society and thus fit their general accelerationist goals."}, {"id": 50667729, "au": "BoxOfRain", "dom": 25, "sr": 42, "sc": 2.44, "ep": 3.98, "bs": 0.0, "d": 3, "age": 5.09, "grav": 33.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 0.398, "bl": 0.0, "ds": 0.0, "txt": "Exactly, I can't believe there's people seriously advocating withdrawal from public life in a democracy. That's an excellent way for it to stop being a democracy in my opinion, the 'my problems first, then the world's' mentality might maximise personal mental health but it can hardly be described as showing civic virtue.\n\nHow can we expect to enjoy the benefits of democracy if we all say that maintaining them is somebody else's problem? 'I don't care about politics' is an active choice in itself, and if enough people make that choice then democratic backsliding is the result."}, {"id": 50668360, "au": "drayfield", "dom": 171, "sr": 43, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 0, "age": 4.12, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 422, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.93, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Makes sense. There are times when I have to disconnect from current events to stop myself descending into white-hot rage."}, {"id": 50666783, "au": "bemtevi", "dom": 184, "sr": 44, "sc": 2.37, "ep": 3.03, "bs": 0.0, "d": 0, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.12, "fa": 0.0, "gp": 0.277, "bl": 0.0, "ds": 0.0, "txt": "Isn't this obvious? Giving people an outlet for their frustrations reduces the probability that their frustrations will have another outlet. That's why governments and the powerful love social media and technology: we complain online instead of doing something."}, {"id": 50670815, "au": "twoodfin", "dom": 60, "sr": 45, "sc": 2.34, "ep": 3.88, "bs": 0.0, "d": 2, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 13229, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.761, "fa": 0.68, "gp": 0.107, "bl": 0.0, "ds": 0.0, "txt": "The kind of folks I’m thinking about were having what I’d describe as disproportionate levels of anxiety going back at least to the 2004 election.\n\nThey similarly experienced a sense of elation in 2008 that was also likely out of proportion to the outcome."}, {"id": 50666847, "au": "rustyhancock", "dom": 141, "sr": 46, "sc": 2.29, "ep": 3.83, "bs": 0.0, "d": 1, "age": 6.4, "grav": 46.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1480, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.547, "fa": 0.0, "gp": 0.137, "bl": 0.0, "ds": 0.0, "txt": "I think Klein's work is pretty far off this papers register. It's too low level and crude.\n\nI've edited this because I think the end of this comment was too dismissive.\n\nThe paper and we shouldn't take a position on political activism. The question is if the activism is healthy or mature and probably analysis as displacement or sublimation is more important.\n\nIf the internal disquiet is turned into meaningful embetterment of society in an effective way that produces wellbeing benefits to the person that is sublimation and positive.\n\nIf the internal disquiet becomes externalised (share the misery) and is not effective but produces reduced anxiety by having it play out in others. That's displacement and bad."}, {"id": 50670513, "au": "dvdkon", "dom": 36, "sr": 47, "sc": 2.15, "ep": 3.47, "bs": 0.0, "d": 2, "age": 1.02, "grav": 7.3, "surf": 6.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1918, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.412, "fa": 0.0, "gp": 0.104, "bl": 0.0, "ds": 0.0, "txt": "That works only as long as the higher-up situation doesn't negatively affect your immediate life. If you're facing deportation due to a national political struggle, improving your diet and finding a partner is probably not the right course of action. Protesting for climate change solutions is not a bad idea if you plan to be alive for a few decades, even though your municipal politics might be shit..."}, {"id": 50666836, "au": "Grombobulous", "dom": 42, "sr": 48, "sc": 2.02, "ep": 3.56, "bs": 0.0, "d": 2, "age": 6.42, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.513, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Being animated about legitimate political issues is perfectly okay, but we’ve seen our political environment devolve into a lot of energy being spent on non-important issues.\n\nI’m sure a lot of that is intentional by the elite. Make us waste our time protesting about abortion clinics or trans people using the bathroom instead of protesting about income inequality, corruption, and oligarchy."}, {"id": 50666823, "au": "RickJWagner", "dom": 176, "sr": 49, "sc": 1.96, "ep": 3.06, "bs": 0.0, "d": 0, "age": 6.45, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 12137, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 0.361, "bl": 0.0, "ds": 0.0, "txt": "This is one data point in a map of consensus around politics and mental health.\n\nIt’s not a comfortable topic, because it’s going to be offensive to examine.  We should examine it though, because better overall mental health is worth pursuing."}, {"id": 50670963, "au": "bko", "dom": 20, "sr": 50, "sc": 1.92, "ep": 3.24, "bs": 0.0, "d": 5, "age": 0.21, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.04, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How will it skew the results? It's essentially charity apart from a few high profile mega pastors.\n\nFor instance religious schools are much cheaper than private schools. And I am yet to find an atheist subsidized school"}, {"id": 50668558, "au": "rayiner", "dom": 26, "sr": 51, "sc": 1.92, "ep": 3.24, "bs": 0.0, "d": 4, "age": 3.81, "grav": 23.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 0.986, "fa": 0.0, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "I don’t read OP as advocating for “withdrawal from public life,” but instead assigning different weights to each sphere of public life proportional to its effect on you and your ability to affect it. If your local school district has failing test scores, that directly affects you and you have the power to directly fix that problem. By contrast you have very little power to solve the Rohingya crisis or whatever. And people have finite bandwidth to focus on political issues: if you’re attending a protest about this or that, you’re not attending school board meetings about your community’s failing test scores.\n\nIt’s not about “democracy” versus “not democracy,” but instead a bottom-up democracy versus a top-down democracy. When Alexander de Tocqueville wrote about American democracy, he did not write about how Americans agitated politically about what was happening thousands of miles away. Instead, he marveled at Americans’ participatory democracy, where people in the local community got together to democratically govern their local community. If everyone does that, then the result will be a democratically governed society across the country. That is civic virtue."}, {"id": 50667214, "au": "netrus", "dom": 67, "sr": 52, "sc": 1.91, "ep": 3.24, "bs": 0.0, "d": 5, "age": 5.86, "grav": 40.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1839, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.287, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "These groups were very famously not only doing rallys? Workers movement did strikes, civil rights movement had a military wing. Anti nuclear activists in Germany blocked train tracks, very successfully. Critical Mass takes over streets all over the world and became a strong community in many cities.\n\nYou might disagree with blocking streets, but history does not teach what you claim it does."}, {"id": 50667099, "au": "moduspol", "dom": 160, "sr": 53, "sc": 1.91, "ep": 3.3, "bs": 0.0, "d": 3, "age": 6.02, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 4079, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.183, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Respectfully, if you \"had a lot of anxiety around climate change,\" then I think you're exactly the kind of person who could benefit from some counseling.\n\nConcern? Warranted. Anxiety? Over something you have absolutely zero control, and has dubious even measurable impact on your life? It'd help to talk to a professional."}, {"id": 50667455, "au": "cryptopian", "dom": 159, "sr": 54, "sc": 1.71, "ep": 3.25, "bs": 0.0, "d": 3, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 222, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've found that the kind of small-scale climate action is the kind of thing that bubbles up in the long term. You make change you can see, and this motivates you because you see the results. People see you being enthusiastic about making change, they learn from you and apply it in their neighbourhood. Bigger organisations see small scale changes, and that encourages people in them to plan the bigger scale changes needed.\n\nThat's my idealistic read anyway. If the result is that you're happier and your local community is better, that's still reducing the world suck."}, {"id": 50667693, "au": "Levitz", "dom": 49, "sr": 55, "sc": 1.68, "ep": 3.22, "bs": 0.0, "d": 3, "age": 5.15, "grav": 34.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2262, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I don't think any of that is a fair reading of the comment.\n\nThe subject at hand is that, per the study, it would seem that anxiety leads people to political activism. The comment explains how in their experience, people with problematic lives tend to lean more into political activism. That's frankly also my experience.\n\nIt might differ from yours, you are definitely free to contribute, but it seems to me that you are getting outraged at some judgement that is just not there to begin with."}, {"id": 50669006, "au": "benrutter", "dom": 161, "sr": 56, "sc": 1.68, "ep": 3.15, "bs": 0.0, "d": 4, "age": 3.12, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 3553, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure if I'm misreading, but that didn't come across respectfully at all.\n\nI think the fact that you're describing climate change as having little impact on my life suggests we have pretty different interpretations of the ground truth.\n\nI don't want to start a climate conversation here, but I hope that even if you don't believe in climate science, you can at least imagine a similar experience to mine on an issue you are motivated about?"}, {"id": 50666983, "au": "rafram", "dom": 109, "sr": 57, "sc": 1.68, "ep": 3.14, "bs": 0.0, "d": 4, "age": 6.2, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "change_climate", "flbl": "Change & Climate (Energy)", "urls": [], "ig": 1.26, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "We could probably reduce our emissions significantly by radically upending society, all becoming ascetics who consume minimally, never travel, don’t heat or cool our homes unless it’s dire, etc., while continuing to burn fossil fuels. Or we could reduce our emissions significantly by switching to clean energy sources, with little to no impact on the lifestyle of the average person. Which sounds better?"}, {"id": 50667578, "au": "fc8b", "dom": 82, "sr": 58, "sc": 1.68, "ep": 5.64, "bs": 2.52, "d": 4, "age": 5.31, "grav": 35.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.537, "fa": 0.34, "gp": 0.728, "bl": 0.95, "ds": 0.0, "txt": "This is wrong. Protests are not to be assumed organic, now if ever.  A protest can be sparked by agitprop, coordinated by your adversaries, and it no longer has the meaning it did at one time, a threat of violence implied by the sheer number of protestors, very  similar to how the meaning of the second amendment has changed, because the context is different. Bubba and skeeter having firearms and joining militia poses absolutely zero risk to the government in 2026. So too protests."}, {"id": 50670113, "au": "icepush", "dom": 15, "sr": 59, "sc": 1.68, "ep": 3.03, "bs": 0.0, "d": 6, "age": 1.62, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 258, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.683, "fa": 0.5, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Based on the evidence provided a more plausible explanation is \"The person that made those bylaws does not like colored window treatment or clotheslines\""}, {"id": 50666727, "au": "quantummagic", "dom": 157, "sr": 60, "sc": 1.68, "ep": 2.98, "bs": 0.0, "d": 1, "age": 6.61, "grav": 48.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 872, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 0.929, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "That'd usually be a good thing, since you have much more control of your own life, and almost none over society.  Anxiety goes down when you make consequential changes, rather than yelling into the wind."}, {"id": 50666951, "au": "cowlevel", "dom": 149, "sr": 61, "sc": 1.68, "ep": 3.5, "bs": 0.53, "d": 1, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 0.152, "bl": 0.2, "ds": 0.0, "txt": "The obvious takeaway is that the government can help cement its power by funding mental health. Of course that costs tax dollars and printed inflation dollars that could have been going to Raytheon to make thousand pound bombs to drop on Arab children, so there's a balancing act to make."}, {"id": 50671002, "au": "bko", "dom": 23, "sr": 62, "sc": 1.68, "ep": 2.96, "bs": 0.0, "d": 5, "age": 0.15, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "etc_national", "flbl": "Etc & National (Directly)", "urls": [], "ig": 1.258, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Virtue signaling is like protesting Israel in NYC, a city 5k miles away.\n\nThose protestors are being selfish in disrupting my commute to make noise about a conflict that does not involve or the responsibility of NYC residents."}, {"id": 50667139, "au": "penultimatename", "dom": 45, "sr": 63, "sc": 1.68, "ep": 2.93, "bs": 0.0, "d": 4, "age": 5.96, "grav": 41.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 251, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "There’s plenty of videos of this in realtime. Candidate brings up real issue affecting voters, interviewer clearly has someone in their ear, interviewer tries to redirect the conversation to culture wars. The Murdoch family isn’t Bigfoot, they exist and send emails."}, {"id": 50666859, "au": "firesteelrain", "dom": 8, "sr": 64, "sc": 1.68, "ep": 2.89, "bs": 0.0, "d": 2, "age": 6.38, "grav": 45.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2430, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.948, "bl": 0.0, "ds": 0.0, "txt": "This resonates with me.\n\nI have spent the last two years fixing all of the issues with my HOA and how it takes care of my community. I revamped/fixed the budget (with lots of help from AI), fixed rules and regulations and generally became one of the trusted members of the community. Lots of infrastructure debt.\n\nBut it has taken a toll and I have decided not to run for re election next year. It will be someone else’s problem."}, {"id": 50666916, "au": "cowlevel", "dom": 104, "sr": 65, "sc": 1.68, "ep": 2.88, "bs": 0.0, "d": 3, "age": 6.29, "grav": 45.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 1.142, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Actually there is a positive correlation between how violent protests are and how much they get what they want.\n\nYou say that a protest blocking traffic won't be good for its cause, but the truth is it's much better for its cause than one that does not block traffic. You just want them to think blocking traffic doesn't work, because you are traffic and being blocked is inconvenient.\n\nSome of the same people who say that blocking traffic doesn't work will happily block traffic for a cause they support - remember the Canadian truckers?"}, {"id": 50667322, "au": "cryptopian", "dom": 114, "sr": 66, "sc": 1.68, "ep": 2.83, "bs": 0.0, "d": 5, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 222, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "health_mental", "flbl": "Health & Mental (Protesting)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The important thing to understand is incentives, and that the end result is the sum of all the individual choices driven by those incentives.\n\nIndividuals have agency, but we've still got to exist in society. I'm able not to drive because the local environment permits it, but there are people less stubborn than me who still drive everywhere because there are difficulties doing otherwise."}, {"id": 50671097, "au": "BoxOfRain", "dom": 21, "sr": 67, "sc": 1.68, "ep": 3.53, "bs": 0.85, "d": 6, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 3391, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "charitable_liberals", "flbl": "Charitable & Liberals (Care)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.039, "bl": 0.32, "ds": 0.0, "txt": "Because it muddies the waters a bit, personally I'd consider a tithe to be something different to a charitable donation even if they share the same legal framework. In my view if what you're trying to measure is generosity, you can't really count things which look from the outside a lot like a membership fee. Yes churches often do a lot of real charitable work, but we should separate money going to the congregation itself from money going to the church's charitable causes."}, {"id": 50667416, "au": "noah_buddy", "dom": 54, "sr": 68, "sc": 1.68, "ep": 2.65, "bs": 0.0, "d": 4, "age": 5.54, "grav": 38.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 16, "k": 1112, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "everything_far", "flbl": "Everything & Far (Therapy)", "urls": [], "ig": 0.398, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> What’s the point of being overly concerned when the consequence of your extreme concern is zero?\n\nThe crux of this disagreement between you and the other poster is that this is a fundamentally pessimistic worldview and he is espousing a fundamentally optimistic one. There’s no reconciliation of opinions here tbh."}, {"id": 50667050, "au": "darkwi11ow", "dom": 185, "sr": 69, "sc": 1.68, "ep": 2.59, "bs":
