gory": "code_repository", "count": 1}], "story_anchors": ["port", "cost", "splitting", "usb-c", "bom", "hub", "target", "ports", "product", "speeds", "device", "lines", "controller", "apple", "mac", "hubs", "support", "plugged"], "largest_root": {"root_id": 50631246, "author": "riobard", "slots": 52, "start_dom": 19, "end_dom": 70, "share_pct": 57.1, "top_dom1_age": 9.4, "top_dom1_author": "jsmith45"}, "buried_cutoff": 27, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50634928, "au": "jmgao", "dom": 74, "sr": 1, "sc": 11.05, "ep": 11.05, "bs": 0.0, "d": 2, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 102, "qw": 0, "k": 1294, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": ["https://github.com/jmgao/usbselector"], "ig": 1.458, "fa": 2.08, "gp": 1.169, "bl": 0.0, "ds": 0.0, "txt": "What the fuck. Thanks, I think you just solved a bug that's been on my TODO list for like 6 months.\n\nI wrote a library [1] that lets you use CSS selectorish syntax to select USB devices (e.g. \"any device that's on port 3 of a hub that also has a Logitech device connected on port 4\" -> \"(!hub > device[vid=046d, port=4]) > device[port=3]\") so I could do automations for things like plugging in my laptop at one desk vs another, but one of my selectors I use on my desktop for a USB-C cable would rarely fail to trigger despite the device definitely being connected and working. I'll have to check this when I get home...\n\n1: https://github.com/jmgao/usbselector"}, {"id": 50631405, "au": "Someone", "dom": 80, "sr": 2, "sc": 10.12, "ep": 10.27, "bs": 0.0, "d": 1, "age": 9.64, "grav": 82.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 102, "qw": 0, "k": 33800, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": ["https://en.wikipedia.org/wiki/Bluetooth\u0023Implementation"], "ig": 1.797, "fa": 1.58, "gp": 1.063, "bl": 0.0, "ds": 0.0, "txt": "It’s a matter of marketing. Bluetooth is similar.\n\nhttps://en.wikipedia.org/wiki/Bluetooth\u0023Implementation:\n\n“Originally, Gaussian frequency-shift keying (GFSK) modulation was the only modulation scheme available. Since the introduction of Bluetooth 2.0+EDR, π/4-DQPSK (differential quadrature phase-shift keying) and 8-DPSK modulation may also be used between compatible devices.\n\n[…]\n\nIn 2019, Apple published an extension called HDR which supports data rates of 4 (HDR4) and 8 (HDR8) Mbit/s using π/4-DQPSK modulation on 4 MHz channels with forward error correction (FEC)\n\n[…]\n\nThe above excludes Bluetooth Low Energy, introduced in the 4.0 specification,[30] which uses the same spectrum but somewhat differently.”\n\nThe various network standards (2G, 3G, 4G, 5G) similarly have little to do with each other, technically."}, {"id": 50631974, "au": "toast0", "dom": 56, "sr": 3, "sc": 9.51, "ep": 9.51, "bs": 0.0, "d": 1, "age": 8.95, "grav": 74.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 43, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.575, "fa": 1.32, "gp": 1.411, "bl": 0.0, "ds": 0.0, "txt": "> the simplicity of USB-A: just 4 pins/wires achieves up to 480Mbps of half duplex speed, which is more than enough for many use cases.\n\nUSB-A is 4 or 9 pins. USB-3 added 5 more for two differential pairs and a signal ground.\n\n> What would be possible with a circular (thus omnidirectional) simple data plug (with a few pins as possible) given modern tech?\n\nDepends on how crazy you want to go. Tip/Ring/Ring/Ring/Sleve is mass produced, so you could have 5 conductors if you want.\n\nTRRS gives you four conductors. If you cut down 40GBase-T to two pair, you should be able to do 20 Gbps on a twisted pair trrs cable... and you can send power over that too. USB 4 Gen 4 does 40 Gbps per pair, but uses one pair per direction. If you wanted just tip and ring, there's 10Gbase-T1 which is single pair, with optional power delivery.\n\nYou would need to make special twisted pair cables with the phone jacks. If you use 1/4\" jacks, the connectors could probably manage a few amps. But disconnecting is going to be pretty gnarly as the sleeve tends to short across multiple jack connectors as it's pulled out."}, {"id": 50631968, "au": "arcticbull", "dom": 6, "sr": 4, "sc": 7.48, "ep": 7.48, "bs": 0.0, "d": 3, "age": 8.96, "grav": 74.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 142, "qw": 89, "k": 31738, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": ["https://e2e.ti.com/support/interface-group/interface/f/interface-forum/891702/tusb8041-simultaneous-usb2-0-and-usb3-0-output"], "ig": 1.34, "fa": 1.04, "gp": 0.943, "bl": 0.0, "ds": 0.0, "txt": "TI addressed this on their forum a while ago.\n\n> Can you connect a USB 3.0 device and a USB 2.0 device to the same downstream port of a hub?  We don't recommend it.  The devices will enumerate and traffic will be routed correctly, but as noted above, the two devices would share a single port power control.  Also, the USB specification requires all USB 3.0 devices have the ability to drop to USB 2.0 speeds.  Since the USB specification does not allow for two different speed devices connected to the same USB port, TI cannot guarantee that all USB drivers / host controller would support that implementation.\n\nhttps://e2e.ti.com/support/interface-group/interface/f/inter...\n\nIs it gonna work? Usually, but not properly, and it's not an approach I would recommend for any production devices.\n\nIf you are okay being non-compliant with the USB spec and hoping for the best, it's an option for some small run stuff you test. For this application it's probably fine because you know how your host controller behaves but it's not a good approach in general, and may stop working at some point in the future as the busses are not independent. They share a power control and the same logical port identifier, and this is not a support configuration per the USB spec.\n\nFor the record I do think this is very cool and the only thing I'd change about the blog post is mentioning that the busses are not actua"}, {"id": 50632872, "au": "toast0", "dom": 58, "sr": 5, "sc": 7.19, "ep": 7.34, "bs": 0.0, "d": 3, "age": 7.99, "grav": 62.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 24, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.357, "fa": 1.1, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "> What you are describing is electrically impossible for any USB specified cable length due to capacitance and inductance as a result of poor ground ties\n\nUSB 4 Gen 3 runs at 20 gbps per pair (unidirectional), and USB 4 2.0 Gen 4 [1] is specced for 40 gbps per pair unidirectional.\n\nEthernet 10G-base-T is real and works without a shared ground. 40G-base-T doesn't seem to really exist, but I don't think it has a shared ground either.\n\n[1] thanks USB Promoter Group. If ever I have trouble with naming things, I can always say I did better than USB. :P"}, {"id": 50631971, "au": "mirmor23", "dom": 40, "sr": 6, "sc": 6.89, "ep": 7.18, "bs": 0.0, "d": 3, "age": 8.96, "grav": 74.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 59, "qw": 6, "k": 202, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": ["https://en.wikipedia.org/wiki/Parallel_communication"], "ig": 1.363, "fa": 1.04, "gp": 0.7, "bl": 0.0, "ds": 0.0, "txt": "> What does make it a parallel bus?\n\nThe basic difference between a parallel and a serial communication channel is the number of electrical conductors used at the physical layer to convey bits. [1]\n\nIn usb, each differential pair (dp/dm) is driven by a serial interface engine (sie); and even though it is a pair, it is effectively half duplex and serial. Multiple dp/dm pairs does not make it parallel.\n\n[1] https://en.wikipedia.org/wiki/Parallel_communication"}, {"id": 50634609, "au": "dcrazy", "dom": 14, "sr": 7, "sc": 6.88, "ep": 7.03, "bs": 0.0, "d": 4, "age": 6.07, "grav": 42.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 2559, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.434, "fa": 0.95, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "This is not true in the age of Apple Silicon. All 3 ports on a MacBook Air or MacBook Pro have independent Thunderbolt controllers and can each operate at 40Gbps bidirectional (MacBook Air/Pro with M6, which has Thunderbolt 4) or 80Gbps bidirectional/120Gbps asymmetric (MacBook Pro with M5 Pro/Max, which has Thunderbolt 5).\n\nThe MacBook Neo is the odd one out: it has two USB-C ports, but one is a USB 3.2 gen 2 port (10Gbps) and the other is USB 2.0 only. The slower one is meant to be your charging port, since USB-PD only requires USB 2.0 and the Neo doesn’t have MagSafe."}, {"id": 50631246, "au": "riobard", "dom": 19, "sr": 8, "sc": 6.58, "ep": 7.02, "bs": 0.0, "d": 0, "age": 9.82, "grav": 85.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 2849, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.537, "fa": 0.68, "gp": 1.011, "bl": 0.0, "ds": 0.0, "txt": "Learning the details of USB-C connectors makes me really appreciate the simplicity of USB-A: just 4 pins/wires achieves up to 480Mbps of half duplex speed, which is more than enough for many use cases.\n\nReversible USB-C is very convenient, but the connector is really complicated and I am always amazed that it is able to transmit 40~120Gbps data while simultaneously conduct up to 240W of power with 24 very tiny pins in tight proximity.\n\nedit: USB-C isn't even serial (the S in USB) anymore with many parallels pairs.\n\nWhat would be possible with a circular (thus omnidirectional) simple data plug (with a few pins as possible) given modern tech?"}, {"id": 50631484, "au": "the__alchemist", "dom": 45, "sr": 9, "sc": 6.47, "ep": 6.91, "bs": 0.0, "d": 1, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 7476, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.616, "fa": 0.62, "gp": 0.931, "bl": 0.0, "ds": 0.0, "txt": "USB-C to me is the best power/data connector we've had for most electronics. This consolidates some points you made, and in sibling comments.\n\n  - Reversible\n  - Small\n  - You can still use the same wiring as USB 2.0/A, with the addition of 2 passives on the CC pins to ground. Or wire up all the USB 3.0 data lines, configure for high power draw etc.\n  - Universal\n\n\nReplacing the mismatched pile of barrel plugs and competing USB standards we used to have. (Micro, Mini, A, B)\n\nMany uses fall within the USB 2.0 data limit (480Mbit/s?) and power reqwuirements. So USB-C wired for USB 2.0 is a fantastic connector. Exceptions are charging Li-Ion batteries quickly, and data storage devices."}, {"id": 50632410, "au": "mirmor23", "dom": 82, "sr": 10, "sc": 6.32, "ep": 6.61, "bs": 0.0, "d": 1, "age": 8.5, "grav": 68.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 207, "qw": 30, "k": 202, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.771, "fa": 0.42, "gp": 0.864, "bl": 0.0, "ds": 0.0, "txt": "> Always found the USB forum's approach to backwards compatibility \"interesting\": Instead of extending the protocol, just require a completely separate implementation of the old protocol in addition to the new one.\n\nThe word 'protocol' there is doing heavy lifting. It is more like a bunch of electrical engineers fancied themselves to be protocol designers, and there we have it - a usb 'protocol' - no layering, no symmetry - just a bunch of structs to dump on the wire.\n\nTo be fair, the original problem they were trying to address (keyboard, mouse, serial, printer ports, phone lines etc replaced by a single interface), they did solve in a very comprehensive way, and it benefited the consumers immensely, however the developer side of it is/was really awful. vendor + hardware controller specific asymmetric host/device stacks, no comprehensive 'protocol' other than bit twiddling, incompatible power negotiations (config descriptor up to 2.0, and cc hardware channel for type-c), no OS metadata, and the list goes on..\n\nWe have not even started on the 'beautiful' forest of descriptors to manage; and comprehending some of these would leave you wondering if you really understood at all (e.g. hid report descriptor). All in all, great way to age prematurely without having learnt anything worthwhile about protocols.\n\nWith all this said, it is really good that they maintained backward compati"}, {"id": 50634481, "au": "myself248", "dom": 29, "sr": 11, "sc": 6.11, "ep": 6.55, "bs": 0.0, "d": 4, "age": 6.22, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 118, "qw": 0, "k": 11678, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": ["https://www.amazon.com/dp/B0CRZ6JJ6D"], "ig": 1.52, "fa": 0.62, "gp": 0.838, "bl": 0.0, "ds": 0.0, "txt": "I have this in my bag at all times:\n\nhttps://www.amazon.com/dp/B0CRZ6JJ6D\n\nIt forces the charging role: The single end is always source, the split ends are always sinks.\n\nIt also allows the two sink ends to be at different voltages, which means there must be some ultra-tiny SMPS in the blob, which blows my mind.  (Though in my testing, it will pass 20v through to a single laptop, but when I plug in a 5v sink, the cable drops and renegotiates 15v from the source, so the laptop now gets 15v instead of 20. With two laptops connected, both get 20v and the source shows 20v.)\n\nI carry this cable and a single Haribo AC charger when I travel, and it serves every need I've thrown at it."}, {"id": 50631025, "au": "xg15", "dom": 72, "sr": 12, "sc": 5.85, "ep": 6.29, "bs": 0.0, "d": 0, "age": 10.04, "grav": 88.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.451, "fa": 0.34, "gp": 1.319, "bl": 0.0, "ds": 0.0, "txt": "Always found the USB forum's approach to backwards compatibility \"interesting\": Instead of extending the protocol, just require a completely separate implementation of the old protocol in addition to the new one.\n\nIt's like the IMAP working group saying \"yes, we're 100% backwards compatible to POP3! We wrote a line into the spec that requires every IMAP server to also bundle a POP3 server...\"\n\nOut of curiosity, does that mean that in \"normal\" operation of USB3 or 4 only one of the two internal ports is ever used at a time? Or are there devices that already make use of both the USB2 and 3 lanes when plugged in?"}, {"id": 50631324, "au": "drum55", "dom": 21, "sr": 13, "sc": 5.44, "ep": 5.88, "bs": 0.0, "d": 1, "age": 9.74, "grav": 84.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 589, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.342, "fa": 0.28, "gp": 1.332, "bl": 0.0, "ds": 0.0, "txt": "The complexity isn't even in the connector, it's in the insanity of the protocols used for negotiation. There's multiple protocols, over two different physical links, implementing what amounts to a network with negotiation between source and sink devices. You're supposed to be able to do things like connect two devices to a charger and have the devices dynamically work out how much power they can use, but I doubt anybody has ever completed support for any of it. The differing support for the protocols results in constant mysteries of \"why isn't this charging\", even with a cable analyzer and an inline protocol analyzer I'm often left head scratching."}, {"id": 50637876, "au": "johnwalkr", "dom": 20, "sr": 14, "sc": 5.32, "ep": 5.98, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 23.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 2428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.362, "fa": 0.96, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "Most of the frustration people have with usb-c boils down to 2 things. 1: devices that only charge with usb-a-c cables because they've been updated from an older micro-usb device without much care. 2: In a hub or adapter with downstream ports, you cannot possibly get all capabilities on all ports because you can't really have one port capable of 15W and 40Gbps (for example) break out into 4 more ports, each capable of 15W and 40Gbps. It's also a bit weird that laptops generally have very impressive capabilities with multiple usb-c ports that can do so many things, but desktops for the most part have fewer and less capable usb-c ports.\n\nThe connector is complicated, but not from the user's perspective aside from the above limitations. Maybe there could be a bit of colour coding or connector keying for low power and data rate devices to clear things up. But all things considered, usb-c is really good and better than the alternate history where we ended up with 10 different connectors, some of them optical and some not."}, {"id": 50636223, "au": "lxgr", "dom": 78, "sr": 15, "sc": 5.24, "ep": 5.68, "bs": 0.0, "d": 1, "age": 3.76, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 30, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.546, "fa": 0.42, "gp": 0.586, "bl": 0.0, "ds": 0.0, "txt": "It's really only USB 2 and 3 that essentially ship two wirings and protocols in one device/cable.\n\nUSB 2 is a pretty straightforward extension of 1, and USB 4 is, in many ways, actually just a standardization of Thunderbolt 3, which in turn are alternate modes of USB-C, i.e., a completely different protocol running on the physical wires that would normally be used for USB 3 data.\n\n> It's like the IMAP working group saying \"yes, we're 100% backwards compatible to POP3! We wrote a line into the spec that requires every IMAP server to also bundle a POP3 server...\"\n\nThat seems like a bad comparison, since POP and IMAP solve pretty different problems (mail retrieval vs. remote mailbox access and management).\n\nAnd this is in fact exactly how HTTP 3 and 2 maintain backwards compatibility to HTTP 1 :)"}, {"id": 50633493, "au": "15155", "dom": 59, "sr": 16, "sc": 5.21, "ep": 6.72, "bs": 0.85, "d": 4, "age": 7.3, "grav": 55.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 27, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.474, "fa": 0.76, "gp": 0.752, "bl": 0.32, "ds": 0.0, "txt": "> USB 4 Gen 3 runs at 20 gbps per pair (unidirectional), and USB 4 2.0 Gen 4 [1] is specced for 40 gbps per pair unidirectional.\n\nConnectors are the issue: you have a 0.5pF capacitance budget. TRRS has massive contacts and a distant shared ground. 0.5pF on a normal 3.5mm TRRS is impossible. Not to mention the impedance discontinuities inherent to that arrangement. The face contact between the plug and receptacle is also extremely imperfect.\n\n> Ethernet 10G-base-T is real and works without a shared ground.\n\nBecause it's galvanically isolated via a transformer and the connectors are small and designed for it? I thought we were talking about USB here."}, {"id": 50632602, "au": "15155", "dom": 57, "sr": 17, "sc": 5.03, "ep": 5.91, "bs": 0.0, "d": 2, "age": 8.28, "grav": 66.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 20, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.3, "fa": 0.76, "gp": 0.478, "bl": 0.0, "ds": 0.0, "txt": "> If you cut down 40GBase-T to two pair, you should be able to do 20 Gbps on a twisted pair trrs cable\n\nWhat you are describing is electrically impossible for any USB specified cable length due to capacitance and inductance as a result of poor ground ties. 20Gb/s line rate is barely possible on connectors designed for it.\n\nMaybe with a magical twinaxial cable, but I still doubt it because of the size of the connector contacts."}, {"id": 50634192, "au": "PaulHoule", "dom": 11, "sr": 18, "sc": 5.03, "ep": 5.33, "bs": 0.0, "d": 1, "age": 6.64, "grav": 48.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 110849, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.486, "fa": 0.62, "gp": 0.047, "bl": 0.0, "ds": 0.0, "txt": "In a lot of ways I experienced USB 3.0 as a regression.\n\nLike the USB 1.0 spec described how you could hook up 128 devices or so devices to a port although it didn't promise it would work I can say I put together some pretty big USB 1.0 and USB 2.0 trees and they worked.\n\nBack in the late 2010s I had numerous laptops which I would try to make a kind of \"docking station\" with USB audio and external storage and SD card readers and such and what I always found was that there was some resource limits somewhere in the system and at some point plugging in a new device would cause an old device to drop out which could possibly force the uncontrolled unmounting of a filesystem.  Sure,  today's commercial filesystems are robust against this,  but I hate it.\n\nI looked closely at the USB 3.0 spec and found it didn't make any promises at all about configurations involving hubs and came to the conclusion it didn't make sense to use hubs with 3.0 at all and if you didn't want to be miserable you should just plug in one device into one port on the host."}, {"id": 50636991, "au": "jedbrooke", "dom": 68, "sr": 19, "sc": 4.82, "ep": 5.7, "bs": 0.0, "d": 1, "age": 2.28, "grav": 13.7, "surf": 6.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 19, "k": 687, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.131, "fa": 0.76, "gp": 0.607, "bl": 0.0, "ds": 0.0, "txt": "> What would be possible with a circular (thus omnidirectional) simple data plug (with a few pins as possible) given modern tech?\n\nReminds me of the old GoPros that could do composite video out of their headphone jack (actually a 2.5mm rather than the standard 3.5). This was a somewhat common arrangement for camcorders from the era.\n\nAnd theres also the cursed ipod shuffle that CHARGED through its headphone port. It could even do USB 2.0 data over it too."}, {"id": 50631456, "au": "unrented7977", "dom": 34, "sr": 20, "sc": 4.59, "ep": 5.04, "bs": 0.0, "d": 2, "age": 9.56, "grav": 82.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 39, "k": 555, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.352, "fa": 0.42, "gp": 0.455, "bl": 0.0, "ds": 0.0, "txt": "> You're supposed to be able to do things like connect two devices to a charger and have the devices dynamically work out how much power they can use, but I doubt anybody has ever completed support for any of it.\n\nYou can buy an off the shelf solution for this. Several IC vendors sell auto-negotiating power sharing USB-PD source controllers. It's not that hard to implement and it's a feature you never notice when it works correctly.\n\nMainly this shows up in power banks and higher end AC adapters."}, {"id": 50631710, "au": "arcticbull", "dom": 39, "sr": 21, "sc": 4.49, "ep": 5.59, "bs": 0.0, "d": 3, "age": 9.24, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 31738, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.597, "fa": 0.28, "gp": 0.715, "bl": 0.0, "ds": 0.0, "txt": "Generally a parallel bus transmits an entire N-bit message at once, as N separate wires, with a single shared clock.\n\nPCI has 32 address/data wires, and a whole 32 bit message is output at once on the bus and a clock is toggled when the data is valid along with some contextual information.\n\nPCIe for example has many lanes, each lane has a shift register that turns an N-bit message into N 1-bit messages, which are shifted back in on the other end and turned back into an N-bit message. There's no shared clock, each lane operates essentially independently, and the clock is recovered from the signals on the differential pair. The controller then turns each part of the message each serial lane transmits into one word."}, {"id": 50631653, "au": "dspillett", "dom": 22, "sr": 22, "sc": 4.02, "ep": 4.68, "bs": 0.0, "d": 2, "age": 9.31, "grav": 78.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 7, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.16, "fa": 0.42, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "> constant mysteries of \"why isn't this charging\"\n\nAlso, which device is responsible for what. I have a nice chunky battery that I sometimes charge my phone from while away from power. It it runs out of juice during this, it stops, comes back to life because the phone sees a device in its port and advertises itself as a potential power source, then the phone proceeds to drain power back into the external battery."}, {"id": 50631603, "au": "jsmith45", "dom": 1, "sr": 23, "sc": 3.75, "ep": 4.63, "bs": 0.0, "d": 0, "age": 9.39, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 194, "qw": 0, "k": 1592, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.559, "fa": 0.0, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "While this does largely work, there are a few complications.\n\nThe biggest one being power management, especially the cutting off of power to a specific port. If a host wants to cut off power to a 3.x device, it typically needs to know which 2.x port that device is connected to. The host internally can have some really wild mappings of 2.0 and 3.x hubs, controllers, etc, but the device tree or ACPI tables let it know exactly which ones are paired together for any port leaving the device. After that point it is assumed that the host can learn the topology from any hubs attached. The power management is tied to the 2.0 port. Unexpectedly splitting the topology could lead the host to instruct a hub to cut off power to the wrong port when trying to target a specific USB 3.x device.\n\nAlso, if a hub indicates that a device is drawing excessive current, and there is nothing communicating on the 2.0 lines, there is a risk of the wrong 3.x getting blamed by the host, possibly showing a warning popup to the user with the wrong device name, or similar.\n\nThis isn't to say this is always a problem, because it isn't but it is something to be aware of."}, {"id": 50632357, "au": "15155", "dom": 69, "sr": 24, "sc": 3.67, "ep": 4.99, "bs": 0.0, "d": 1, "age": 8.55, "grav": 69.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 23, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.38, "fa": 0.42, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "> just 4 pins/wires achieves up to 480Mbps of half duplex speed\n\n*With an incredibly large, complicated analog PHY\n\n> USB-C isn't even serial (the S in USB) anymore with many parallels pairs\n\nOnly one of the pairs (each, for TX/RX) is used except for 2x2 configurations, and both are still serial links (which are then reassembled using an elastic buffer, like PCIe.)\n\nParallel means \"clocked in parallel\" - USB-C 2x2 is mesochronously clocked serial, the edges need not land in the same phase."}, {"id": 50631504, "au": "unrented7977", "dom": 84, "sr": 25, "sc": 3.29, "ep": 3.73, "bs": 0.0, "d": 1, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 555, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 1.053, "fa": 0.34, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "Usually there's no need to use both the 2.0 and 3.x links at the same time, but it's possible to do so and not that unheard-of. I've seen some USB hubs that break out into a USB3 hub with a native USB2 hub tacked on the side.\n\nIt's just that there's little use for a 480Mbps link on top of however many gigabits you get from USB3."}, {"id": 50631794, "au": "arcticbull", "dom": 2, "sr": 26, "sc": 3.01, "ep": 3.67, "bs": 0.0, "d": 1, "age": 9.14, "grav": 76.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 31738, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "It's also just straight up not permitted per USB3.2, as USB3 devices are supposed to, per spec, be able to drop down to USB2 speeds. OS support varies, it might work, it might not.\n\nFTA: > If you are building an inline USB-C tool where your MCU only needs a slow control channel and the host just needs fast passthrough to the downstream device, you might not need a USB 3 hub. USB-C gives you two independent buses in the same port. The OS knows they're both peripherals are assigned to the same logical connector.\n\nThis is bad advice in general because USB-C does not actually give you two independent busses in the same port."}, {"id": 50632879, "au": "Doohickey-d", "dom": 15, "sr": 27, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 0, "age": 7.98, "grav": 62.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 686, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "There's also another trick that you can do, to reduce BOM cost: a USB C port that changes functionality depending on which way you oriented the plug.\n\nI designed a camera: with one orientation, you can have access to the device's SD card. With the other, you can have access to the live video. And it doesn't need a hub!\n\nLike in the OP you can also expose one device on usb 3, and one device in usb 2, and it works, no cable flipping needed for that"}, {"id": 50632969, "au": "seba_dos1", "dom": 25, "sr": 28, "sc": 2.84, "ep": 3.95, "bs": 0.0, "d": 5, "age": 7.87, "grav": 61.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.267, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've seen a video of someone kickstarting their car's battery with a phone; inferring user intention isn't always trivial. That said, the power bank case described above does not even require any such assumptions, I'd 100% expect the phone to start charging a power bank if it's dead while plugging it in, but that doesn't change the fact that it shouldn't do that if the power bank goes flat while charging the phone."}, {"id": 50633244, "au": "pzb", "dom": 88, "sr": 29, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 0, "age": 7.56, "grav": 58.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 700, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 1.069, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Could you switch the end that connects to the target Mac to use a USB Type-C plug instead of receptacle to both reduce BOM cost and improve signal integrity?\n\nThat could also allow you to have a 'this side up' which would remove the need for one MUX on the USB3 pairs, right?"}, {"id": 50635603, "au": "xnzakg", "dom": 71, "sr": 30, "sc": 2.71, "ep": 3.37, "bs": 0.0, "d": 0, "age": 4.73, "grav": 30.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 425, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 0.948, "fa": 0.34, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "fun fact: this is why you can buy some super cheap usb hubs with 3x 2.0 ports and one 3.x port, where technically a device you plug into the 3.x port sits on a different level of the tree based on whether it supports USB 2.0 or 3.x."}, {"id": 50631661, "au": "xerxes901", "dom": 44, "sr": 31, "sc": 2.66, "ep": 3.54, "bs": 0.0, "d": 3, "age": 9.3, "grav": 78.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 321, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.094, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "At a guess… that the meaning of a high/low level on one of the pins is not independent of the high/low level of the other pins?\n\nI.e. you have 8 wires which together give a single number between 0-256 per clock cycle, rather than 8 independent channels each with its own independent stream of 1’s and 0’s on it"}, {"id": 50631388, "au": "arcticbull", "dom": 37, "sr": 32, "sc": 2.63, "ep": 4.17, "bs": 0.0, "d": 1, "age": 9.65, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 47, "k": 31738, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 0.917, "fa": 0.42, "gp": 0.565, "bl": 0.0, "ds": 0.0, "txt": "> Learning the details of USB-C connectors makes me really appreciate the simplicity of USB-A: just 4 pins/wires achieves up to 480Mbps of half duplex speed, which is more than enough for many use cases.\n\nYou're welcome to do that with USB-C, it has the VCC/GND/D+/D- wires and USB 2.0 support as a minimum requirement.\n\n> edit: USB-C isn't even serial (the S in USB) anymore with many parallels pairs.\n\nUSB-C is not the same as USB the protocol, it's a connector standard that supports many different transmission methods. It supports USB 2, USB 3, Thunderbolt, DisplayPort, etc.\n\nPCIe is generally considered a serial bus too, yet has many parallel lanes, each of which is hooked up behind a SerDes (serializer/deserializer).\n\nHaving multiple serial lanes generally doesn't make something a parallel bus."}, {"id": 50637775, "au": "johnwalkr", "dom": 7, "sr": 33, "sc": 2.43, "ep": 3.53, "bs": 0.0, "d": 4, "age": 0.26, "grav": 4.3, "surf": 13.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 2428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.163, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The TI forum is really good, I was confident the link you posted would be an authoritative reference, and it was. If you ask a very technical question you will often also get follow-up questions that nail down a root cause quickly. Come to think of it, I don't think I've ever asked a question there because whenever I've searched for an error code or seemingly obscure problem, there's already an answer for me with enough detail to know that it also applies to my problem. TI also tends to send engineering samples without much fuss so as an engineer you can essentially bypass your procurement department when doing prototyping. My experience with this is as a grad student in Japan, so they must really have a policy to make engineers fans of the company."}, {"id": 50631762, "au": "jsmith45", "dom": 81, "sr": 34, "sc": 2.23, "ep": 3.55, "bs": 0.0, "d": 1, "age": 9.18, "grav": 77.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1592, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "Hubs or devices that contain an internal hub are the main use cases where both will be in use at once.\n\nYou can often get away with splitting the two within a single physical device, as many hosts tend to treat the buses independently except for certain power management related tasks, but officially if you are doing that you need an internal hub. An internal hub is allowed to have 3.x-only devices on it, (although this may be confusing to users)."}, {"id": 50633221, "au": "fcjr", "dom": 8, "sr": 35, "sc": 2.22, "ep": 3.51, "bs": 0.85, "d": 4, "age": 7.58, "grav": 58.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 55, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 1.495, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "yeah thats fair, thanks for the context and the ti link, super helpful to learn about all potential issues w/ this setup!  planning to go through everyone's feedback here and updating the post. to be honest this was mostly an experiment, i had medium confidence that i'd even work, still unsure myself if this is a sku thats worth putting out into the world or if i should just go with the slightly higher cost spec compliant bom"}, {"id": 50632044, "au": "seba_dos1", "dom": 23, "sr": 36, "sc": 2.13, "ep": 3.45, "bs": 0.0, "d": 3, "age": 8.87, "grav": 73.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 1.381, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Nothing mysterious in there. When the battery runs out of power completely, its PD controller ends up advertising being a sink so the \"dead battery charging\" can work. The phone notices it and starts feeding it power, as it should. A well-designed power bank would cut the power out from the phone before the power for PD IC goes down too and would hold off with advertising being a sink until the cable is unplugged, but that requires a bit more consideration for the particular use-case than just sticking a few generic ICs together and hoping for the best."}, {"id": 50631660, "au": "arcticbull", "dom": 85, "sr": 37, "sc": 2.11, "ep": 3.43, "bs": 0.0, "d": 2, "age": 9.3, "grav": 78.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 31738, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.113, "bl": 0.0, "ds": 0.0, "txt": "It's actually explicitly forbidden for a single peripheral to use the USB 2.0 and 3.0 links at the same time as of USB 3.2, and there's no way to split endpoints across the links.\n\nIn order for it to work you'd have to basically expose two full separate peripherals, one on the USB2 bus and one on USB3 bus, and they'd require their own descriptors and OS-side host contexts.\n\nThis works sometimes, operating systems are not required to support this mode of operation because the OS knows that both devices are attached to the same physical connector. It can mess up enumeration. It also prevents USB3 devices from being able to fall back to USB2 as required in the spec.\n\nA USB3 hub likely has a separate USB2 controller attached, if it doesn't it's non-compliant and not guaranteed to work."}, {"id": 50633287, "au": "fcjr", "dom": 89, "sr": 38, "sc": 1.82, "ep": 2.19, "bs": 0.0, "d": 1, "age": 7.5, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 55, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah I definitely debated switching to a plug instead, this would also cut down on the need for two usb3 cables, I should give this a go!\n\nre the removing of a mux, yeah, i think that'd work, but i'm sure i'd find a way to still plug it in upside-down"}, {"id": 50635751, "au": "shadowpho", "dom": 90, "sr": 39, "sc": 1.74, "ep": 2.84, "bs": 0.0, "d": 0, "age": 4.51, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 355, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 0.797, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What’s even crazier is that oftentimes you even get 2x usb3 ports as well!  (Typical on desktop motherboards that have cpu with lots of usb lanes but few usb ports)."}, {"id": 50631181, "au": "drum55", "dom": 73, "sr": 40, "sc": 1.59, "ep": 3.14, "bs": 0.0, "d": 1, "age": 9.89, "grav": 86.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 589, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "It gets even weirder with some USBC ports, rather than implement the flipping connector support they wire a different USB port to each side of the plug, meaning the device tree is literally different depending on connector orientation. Lots of motherboards with 2 USBA and one USB C do that with a 4 port hub."}, {"id": 50633338, "au": "fcjr", "dom": 17, "sr": 41, "sc": 1.53, "ep": 2.11, "bs": 0.0, "d": 1, "age": 7.45, "grav": 56.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 55, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 0.9, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "thats wild and i love it! drum55 mentioned in a different part of the thread that sometimes motherboards use different controllers for each side so if you find the right computer maybe you can do both at the same time"}, {"id": 50635631, "au": "the__alchemist", "dom": 51, "sr": 42, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 5, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 7476, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.302, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is it a problem though? What is the provenance of devices which have this problem? I suspect we can help ameliorate this by confining the problem to a smaller set. The implication above is \"USB C 2.0 connectors or cables have unreliable reversibility\". An actionable change may be \"USB C 2.0 connectors or cables from new brands at low prices sourced from Ali Express and Amazon have unreliable reversibility\""}, {"id": 50632079, "au": "toast0", "dom": 52, "sr": 43, "sc": 1.31, "ep": 2.85, "bs": 0.0, "d": 4, "age": 8.83, "grav": 72.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The devices may be broken, but thankfully USB-A trained us to try it, flip it, try it, flip it, try it. Usually works. Except for the devices with a usb-c charge port that can only charge from a usb-a to usb-c cable. :P\n\nThankfully, no device manufacturers label their products as broken by design... and you usually don't notice until way after the return period."}, {"id": 50634235, "au": "pwdisswordfishq", "dom": 12, "sr": 44, "sc": 1.2, "ep": 2.75, "bs": 0.0, "d": 2, "age": 6.58, "grav": 47.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 0.756, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Pretty weird given that it seems like back in USB 1.0 days, it would have been less of a problem to install extra USB ports directly in the host than now."}, {"id": 50631790, "au": "johntb86", "dom": 42, "sr": 45, "sc": 1.15, "ep": 2.69, "bs": 0.0, "d": 3, "age": 9.14, "grav": 76.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 732, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "serial_parallel", "flbl": "Serial & Parallel (Pair)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A parallel bus has a single clock and fixed timings between all signals (ideally sampled at the same time, but in practice there's skew compensation nowadays). For multiple serial lanes they each have their own clock, and they're combined together at a higher level."}, {"id": 50637590, "au": "cowlevel", "dom": 50, "sr": 46, "sc": 1.14, "ep": 2.24, "bs": 0.0, "d": 6, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 0.614, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Actually we judge things by their real world consequences, instead of their stated goals, all the time. That's why most of us aren't fans of communism for example."}, {"id": 50636130, "au": "lxgr", "dom": 49, "sr": 47, "sc": 1.04, "ep": 2.59, "bs": 0.0, "d": 5, "age": 3.91, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 1.1, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nor does blaming the standard for shitty implementations.\n\nI guess you could argue that the more complex a standard is, the higher the chance that somebody will take cheap shortcuts, but I don't really buy that logic, as you could then just as well e.g. blame the USB-A spec for a non-compliant charger exposing 230 V on GND."}, {"id": 50632674, "au": "superxpro12", "dom": 24, "sr": 48, "sc": 0.89, "ep": 2.43, "bs": 0.0, "d": 4, "age": 8.21, "grav": 65.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 794, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 0.21, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "it would seem undesirable for the tiny battery to attempt to charge the big battery. you would be left with a phone at 10%, and a battery bank at like.... 5%"}, {"id": 50633512, "au": "tverbeure", "dom": 86, "sr": 49, "sc": 0.86, "ep": 2.4, "bs": 0.0, "d": 1, "age": 7.28, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 2627, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "The fact that the original USB protocol is a hybrid of differential but actually not quite, shows how terminally brain dead those engineers were.\n\nAnd then Intel decided to make one of them the figurehead of one of the ad campaigns…"}, {"id": 50634360, "au": "PaulHoule", "dom": 13, "sr": 50, "sc": 0.81, "ep": 2.35, "bs": 0.0, "d": 3, "age": 6.4, "grav": 46.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 110849, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 1.0, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well...  Mac laptops have as few ports as they can get away with and I hear they are completely asymmetrical in capabilities.  Windows laptops have more ports and they're all FUBAR.  I do have a PC that I built a few years back which has about 15 or so USB/USB-C/Thunderbolt ports.  That machine never has problems!"}, {"id": 50632339, "au": "cowlevel", "dom": 62, "sr": 51, "sc": 0.63, "ep": 2.17, "bs": 0.0, "d": 2, "age": 8.57, "grav": 69.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The basic problem with T/R/S connectors is that all the contacts short circuit to each other while the plug's going in or out. For audio it \"just\" makes a pop (that may be extremely loud depending on what you've connected downstream), but you wouldn't want to be carrying significant power."}, {"id": 50636337, "au": "cowlevel", "dom": 83, "sr": 52, "sc": 0.62, "ep": 2.16, "bs": 0.0, "d": 1, "age": 3.54, "grav": 21.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "independent_spec", "flbl": "Independent & Spec (Imap)", "urls": [], "ig": 0.889, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "Most compatibility works that way. E.g. Windows NT is compatible with Windows 95 because it contains a reimplementation of Windows 95.\n\nAlso all speeds of ethernet are independent, and GNU's Not Unix."}, {"id": 50634810, "au": "seba_dos1", "dom": 27, "sr": 53, "sc": 0.54, "ep": 2.08, "bs": 0.0, "d": 7, "age": 5.81, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "power_battery", "flbl": "Power & Battery (Phone)", "urls": [], "ig": 0.886, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It sure can. Or the device could just work in a way that makes sense in the first place, so there's no asking required. I can easily switch the power role on my phone, but being asked to anytime I plug something in would be rather annoying."}, {"id": 50636710, "au": "15155", "dom": 63, "sr": 54, "sc": 0.46, "ep": 2.97, "bs": 1.19, "d": 3, "age": 2.89, "grav": 17.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 15, "k": 2512, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_usb3", "flbl": "Side & Usb3 (Pins)", "urls": [], "ig": 0.756, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> all the contacts short circuit to each other while the plug's going in or out.\n\nWhich isn't an issue for current-mode AC coupled differential pairs and the ground connection being the final mate.\n\nThe actual issues here are electrical infeasibility at these speeds."}, {"id": 50632295, "au": "cowlevel", "dom": 36, "sr": 55, "sc": 0.45, "ep": 1.99, "bs": 0.0, "d": 2, "age": 8.62, "grav": 70.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ports_usb", "flbl": "Ports & Usb (Devices)", "urls": [], "ig": 0.846, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is called \"design by committee\" btw, the inevitable result of trying to make a product do everything. Good designs know what's in scope and what's out of scope and they aggressively prune extra use cases that would make the main ones more complicated."}, {"id": 50631697, "au": "dividedbyzero", "dom": 46, "sr": 56, "sc": 0.45, "ep": 1.96, "bs": 0.0, "d": 2, "age": 9.26, "grav": 78.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
