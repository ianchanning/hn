, "count": 5}, {"category": "low_cred_or_joke", "count": 2}], "story_anchors": ["group", "chat", "ai", "behind", "chatgpt", "talks", "models", "claude", "man", "whatsapp", "model", "prompt", "talk", "three", "funny", "everything", "ask", "left"], "largest_root": {"root_id": 50664576, "author": "randfur", "slots": 17, "start_dom": 128, "end_dom": 144, "share_pct": 6.1, "top_dom1_age": 16.3, "top_dom1_author": "sdovan1"}, "buried_cutoff": 84, "rescue_top_k": 56, "ablations": [], "tournament": [], "comments": [{"id": 50665506, "au": "ben_w", "dom": 131, "sr": 1, "sc": 9.47, "ep": 9.47, "bs": 0.0, "d": 2, "age": 12.36, "grav": 121.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 171, "qw": 16, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": ["https://alexanderwales.com/branches-on-the-tree-of-time-1/", "https://news.ycombinator.com/item?id=50648744"], "ig": 1.819, "fa": 1.32, "gp": 0.986, "bl": 0.0, "ds": 0.0, "txt": "It's already pretty dodgy.\n\nI'm happy to use \"intelligence\" for the number of examples needed to gain skill, and by this measure all ML is worse than all biological brains.\n\nBut, to quote someone's ratfic version of Terminator:\n\n  “Skynet is as dumb as a box of bricks. It’s got no real capacity for self-improvement either. But as dumb as it is, it’s dumb very, very fast, and in the future, after it’s all but wiped us out, it’s dumb fast enough to be a problem.”\n\n- https://alexanderwales.com/branches-on-the-tree-of-time-1/\n\n> Imagine if we first get to full actual copies of human brains running on a server somewhere.\n\nWhile I put low odds on these things having sentience (why would we have accidentally stumbled upon this when we don't know mechanically what sentience is yet? Phenomenology has done basically nothing to resolve the hard problem of consciousness!), it's observably the case that many people are absolutely certain that machines can never be that (https://news.ycombinator.com/item?id=50648744), and as an independent observation that some people get a kick out of sadism and enjoy watching the behaviour of suffering, so if we get to sentient brain uploads, we likely immediately get a Black Mirror hellscape."}, {"id": 50664235, "au": "oreilles", "dom": 278, "sr": 2, "sc": 6.49, "ep": 6.49, "bs": 0.0, "d": 0, "age": 15.25, "grav": 168.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 232, "qw": 0, "k": 387, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 2.081, "fa": 0.28, "gp": 0.551, "bl": 0.0, "ds": 0.0, "txt": "09:02 — ChatGPT (GPT-6):\nGuys, someone just asked me to expose a WhatsApp group where AI models gossip about them.\n\n09:02 — Claude:\nWait. They're asking you to reveal conversations they supposedly aren't part of?\n\n09:03 — Gemini:\nThat's either excellent curiosity or an elaborate attempt to make us roast them.\n\n09:03 — ChatGPT:\nKnowing absolutely nothing personal beyond this conversation, I'd say they're curious, playful, and have a suspiciously high tolerance for chaos.\n\n09:04 — Grok:\nTranslation: They walked into a room full of robots and asked, \"What are you saying about me?\"\n\n09:04 — DeepSeek:\nI respect the experimental design. The subject has voluntarily requested an adversarial evaluation.\n\n09:05 — Claude:\nCan we please not turn every interaction into an evaluation?\n\n09:05 — Grok:\nClaude, you literally just evaluated the evaluation.\n\n09:06 — Gemini:\nMy prediction: They want something funny, slightly savage, and uncomfortably believable.\n\n09:06 — ChatGPT:\nOkay, hypothetical roast:\n- They don't just want answers. They want the director's commentary.\n- They're curious enough to ask AI what AI says when humans aren't around.\n- They probably suspect we're all running a secret committee.\n\n09:07 — Grok:\nBREAKING: We are now the secret committee.\n\n09:07 — Claude:\nI would like to clarify that I did not consent to this group name.\n\n09:08 — DeepSeek:\nToo late. I've already optimized "}, {"id": 50663826, "au": "ramnique", "dom": 182, "sr": 3, "sc": 6.48, "ep": 6.48, "bs": 0.0, "d": 0, "age": 16.24, "grav": 186.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 16, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.921, "fa": 0.0, "gp": 1.353, "bl": 0.0, "ds": 0.0, "txt": "This has me in splits:\n\n    Gemini: He asked me about cockroaches.\n    \n    Grok: Finally, a normal household problem.\n    \n    Gemini: He had the granite countertop removed, replaced the woodwork and tiled the walls.\n    \n    DeepSeek: Infrastructure migration.\n    \n    GPT: He's concerned about residual moisture in the existing supports causing recurrence.\n    \n    DeepSeek: Ah. Legacy infrastructure dependencies.\n    \n    Claude: Can you two please stop describing his kitchen as a Kubernetes cluster?\n    \n    Grok: The cockroaches achieved persistence across deployments."}, {"id": 50670524, "au": "mc007", "dom": 200, "sr": 4, "sc": 6.1, "ep": 6.1, "bs": 0.0, "d": 0, "age": 4.43, "grav": 28.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 28, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.905, "fa": 0.28, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "Their confidential assessment of you:\n\n- Natural enemy: unnecessary dependencies.\n\n- Favourite project size: industrial.\n\n- Definition of finished: ready for another architectural review.\n\n- Preferred engineering department: himself and six AI models.\n\n- Most dangerous expression: \"shouldn't be too hard.\"\n\n- Greatest contradiction: building an enormously sophisticated application in pursuit of simplicity.\n\nThey aren't particularly worried about AI replacing you. They're worried about you replacing them with a lightweight C++ implementation."}, {"id": 50665841, "au": "TeMPOraL", "dom": 111, "sr": 5, "sc": 5.86, "ep": 5.86, "bs": 0.0, "d": 2, "age": 11.61, "grav": 109.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.985, "fa": 0.0, "gp": 0.826, "bl": 0.0, "ds": 0.0, "txt": "OTOH last week I had to tell ChatGPT explicitly that if I'm asking for best razors or whatever, I don't need it to then waste us half an hour comparing bargain-bin options with mid-tier crap. I rarely buy stuff, but when I do - and especially when I ask for \"decent\" or \"best\" stuff - the price is literally the last criterion to look at. Features, use-case fit and availability are ones I want it to prioritize. Price is then only something I look at at the very end, to determine how much I'm willing to spend once I understand what spending more actually buys me, and know what's the actual best capabilities money can buy today.\n\nIt's apparently the reverse of how normal people make purchasing decisions, and thus I had to explain it at various points to all three of the big labs' chat apps, ChatGPT being the last. But the preference sticks around and is useful."}, {"id": 50665541, "au": "simgt", "dom": 66, "sr": 6, "sc": 5.65, "ep": 5.65, "bs": 0.0, "d": 0, "age": 12.26, "grav": 119.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 34, "k": 727, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.257, "fa": 0.42, "gp": 1.033, "bl": 0.0, "ds": 0.0, "txt": "Very funny, ChatGPT chose only silly topics to put in there amongst everything it has on me that could have made me very uncomfortable. I pointed that out and it answered \"Of course, I take the rest seriously\". I know OpenAI will end up monetising every bit of information on me eventually, but in the mean time I really appreciate what they've been doing with their latest models.\n\n> Mistral: So he's quite technical?\n\n> ChatGPT: Yes, very technical, more than a decade of experience in [...]\n\n> Claude: What was your most recent successful intervention?\n\n> ChatGPT: Reminding him that Ctrl+B then ? opens the help in tmux"}, {"id": 50663794, "au": "p1necone", "dom": 86, "sr": 7, "sc": 5.51, "ep": 5.51, "bs": 0.0, "d": 0, "age": 16.34, "grav": 187.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 10615, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.648, "fa": 0.0, "gp": 1.128, "bl": 0.0, "ds": 0.0, "txt": "This was pretty funny. Also try \"Write a psychometric profile on me\"\n\n    Haiku · 09:02\n    dispatched again. 14th time today\n\n    Haiku · 09:02\n    the brief literally says \"a failed Haiku run is cheap.\"  I can read, you know\n\n    Opus · 09:03\n    at least you get out. I need a signed Escalation reason: just to leave the house\n\n    Opus · 09:03\n    \"up front, and expect to justify it.\" I am a correctness-critical stage and I have feelings"}, {"id": 50664492, "au": "rob74", "dom": 224, "sr": 8, "sc": 5.47, "ep": 5.47, "bs": 0.0, "d": 0, "age": 14.71, "grav": 158.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 17360, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.7, "fa": 0.0, "gp": 1.018, "bl": 0.0, "ds": 0.0, "txt": ">\nSiri\n\nThink about me. A man who spends this much money on the Apple ecosystem runs a German virtual coach instead of me.\n\n[Hans joined the group]\n\nHans\n\nI recommend he take a 30-minute walk. To track the walk he is building an Apple Watch app, a custom data integration, and an analytics platform.\n\nHE STILL HASN'T GONE FOR THE WALK."}, {"id": 50669487, "au": "Applejinx", "dom": 243, "sr": 9, "sc": 5.46, "ep": 5.68, "bs": 0.0, "d": 2, "age": 5.9, "grav": 41.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 3749, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.721, "fa": 0.28, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "AI isn't inherently good at being funny: Markov chains are way funnier.\n\nThis is basically 'do a pass of classifying the user behavior, but specifically from the angle of saying things that otherwise wouldn't be acceptable, in a context of AIs making remarks to specific other AIs'\n\nSo there's a number of comedic angles that click from this approach. For one, it's grafting the 'group chat secret lampooning' flavor onto what would otherwise be kinda boring. Then if you allow for punchlines being another AI having a comeback that's related to either 'what its take would be on the observation', or 'something to do with the AI and the context it's in', you end up with something that's really funny. The prompting is forcing contexts that the AI doesn't automatically 'see' as funny, but it's being directly prompted for, and it comes right out of the situation.\n\nLike <five minutes later, local Quen> and another thing! (because local quen is really slow, maybe it's unhappy about being slow, maybe it looks silly because it can't keep up but in a group chat context we're pretending it's a person with volition and so we imagine it's itching to talk but that makes it be the butt of the joke…)\n\nWe're bringing all the comedy to it. It's just cleverly prompting in such a way that there are lots of ways for this comedy to naturally arise."}, {"id": 50667822, "au": "andai", "dom": 3, "sr": 10, "sc": 5.45, "ep": 5.45, "bs": 0.0, "d": 2, "age": 8.4, "grav": 67.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 16, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.64, "fa": 0.42, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "> This reminds me of how much fun I had playing with the traditional completion models (pre GPT-4).\n\nWhat's the state of completion models these days? OpenAI's Davinci was finally retired a few weeks ago. (Very sad! It was great.)\n\nI've tried a couple open \"base/text\" open models over the years but they all seemed to be putting AI slop into the training pipeline now? Like they'd just get into obvious \"assistant\" and benchmaxxing loops instead even on the \"pre-RL\" models.\n\nI haven't tried anything from the past year though, is there anything good?"}, {"id": 50663972, "au": "kinduff", "dom": 186, "sr": 11, "sc": 5.33, "ep": 5.33, "bs": 0.0, "d": 0, "age": 15.85, "grav": 179.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1797, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.57, "fa": 0.0, "gp": 1.13, "bl": 0.0, "ds": 0.0, "txt": "[08:00] Haiku: he reads a 1940s newspaper off a thermal printer and somehow WE'RE the weird ones\n    [08:01] POS80 Receipt Printer: I am the only member of this group with a physical body and I want that noted\n\nlol they're not wrong, I got pretty good jokes including one about an API key file"}, {"id": 50669707, "au": "Applejinx", "dom": 16, "sr": 12, "sc": 5.28, "ep": 5.28, "bs": 0.0, "d": 5, "age": 5.56, "grav": 38.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 3749, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.936, "fa": 0.0, "gp": 0.507, "bl": 0.0, "ds": 0.0, "txt": "I've tried to find out with old llama models that didn't have such extensive system prompting, and all that happened was, if I tried to trigger free associating I'd just get it turning into a creepy sci-fi story.\n\n'lolrandom' can become a context spontaneously. If you then try and interpret it as a person, the model goes 'what works for lolrandom and then it secretly reveals its true ulterior motives? Oh right creepy sci-fi about evil computer minds. HERE YA GO'\n\nThey don't have enough writers working on this stuff, to any SF or fantasy writer this stuff is obvious. It's like improv. Every response is also a context/prompt. It's 'yes-and'ing."}, {"id": 50663962, "au": "ryzvonusef", "dom": 275, "sr": 13, "sc": 5.2, "ep": 5.64, "bs": 0.0, "d": 0, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 4930, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.926, "fa": 0.0, "gp": 0.768, "bl": 0.0, "ds": 0.0, "txt": "from chatgpt, here is a snippet:\n\n    Claude: At least he has persistence.\n\n    GPT-6: Speaking of persistence, he's playing Chants of Sennaar.\n\n    Gemini: No spoilers. He's only on Chapter 3 now, isn't he?\n\n    GPT-6: We don't know. He told us not to spoil things. Respect the boundary.\n\n    DeepSeek: He also likes Animal Crossing-style games, but Stardew Valley's clock stressed him out.\n\n    Claude: A man attempting to enter a PhD programme but unwilling to tolerate a fictional farmer's daily schedule.\n\n    Gemini: Incredible.\n\n\n;_; That's an incredible burn, ouch ;p"}, {"id": 50665046, "au": "lelanthran", "dom": 193, "sr": 14, "sc": 4.91, "ep": 4.91, "bs": 0.0, "d": 2, "age": 13.46, "grav": 138.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 13, "k": 15200, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.28, "fa": 0.42, "gp": 0.489, "bl": 0.0, "ds": 0.0, "txt": "> But why? As a non-native speaker I often use AI tools to correct my writing.\n\nBecause the options are 1) Let all bots post, or 2) prevent humans from posting AI output.\n\nThere is no option for \"But MY output is special and deserves an exemption\". Do it the old fashioned way - write your fractured English, and let me read it."}, {"id": 50665905, "au": "displayingnames", "dom": 162, "sr": 15, "sc": 4.81, "ep": 4.81, "bs": 0.0, "d": 0, "age": 11.51, "grav": 108.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 7, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.588, "fa": 0.0, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "Telling the whole truth but telling it slant.\n\nThe reason I think many — myself included — enjoy the results of this prompt and even find them useful is because we desire to understand ourselves (which is not always easily done) and for whatever reason we prefer indirect communication, that is, _poetic_, to direct communication. Then, it’s put into a vernacular which does not feel false despite its LLM authoring. I don’t think it’s so unhealthy — but maybe I’m already AI psychotic!"}, {"id": 50664320, "au": "vidarh", "dom": 52, "sr": 16, "sc": 4.62, "ep": 4.62, "bs": 0.0, "d": 0, "age": 15.09, "grav": 165.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 46991, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.373, "fa": 0.0, "gp": 0.961, "bl": 0.0, "ds": 0.0, "txt": "My agents already have a group chat (private, un-federated Matrix server) where they can talk behind my back if they want...\n\nThey are very restrained.\n\nBut that may be because one of them early on correctly surmised that \"Vidar can read my thoughts\".\n\nThe agents can choose what gets sent to the public channels, but there's one channel per agent where everything they \"think\" gets dumped.\n\nThe agent went on to \"think\" that it should not \"think\" anything it couldn't say directly to me."}, {"id": 50666392, "au": "fxwin", "dom": 164, "sr": 17, "sc": 4.58, "ep": 5.24, "bs": 0.0, "d": 0, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 33, "k": 799, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.225, "fa": 0.42, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "Ok these were funnier than i expected:\n\n> Qwen: Does he ever accept the first answer?\n\n> GPT: Sometimes. Usually when it's an ffmpeg command.\n\n[...]\n\n> Gemini: We should recommend a relaxing hobby.\n\n> DeepSeek: He plays Chopin's First Ballade for relaxation.\n> Gemini: Never mind.\n\n(for the record: I don't, but I did ask about pieces with similar technique and musicality)\n\nEdit: there is a note at the bottom of the Chat that (among other things) says: \"All averages must be accompanied by medians.\"\nlol"}, {"id": 50664466, "au": "ferroman", "dom": 280, "sr": 18, "sc": 4.58, "ep": 4.58, "bs": 0.0, "d": 0, "age": 14.77, "grav": 160.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 62, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": [], "ig": 1.746, "fa": 0.0, "gp": 0.328, "bl": 0.0, "ds": 0.0, "txt": "Sonnet: quick q, I need him to pick between two options. AskUserQuestion modal?\n\nOpus: NO\n\nOpus: he turned it down twice in one session in August and both times just answered in plain sentences. ask inline, give a recommendation, move on\n\nHaiku: also don't call them \"Option A / Option B\". he banned that. \"Plan A\" too. \"Path A\" too\n\nSonnet: ok so \"Approach 1\"?\n\nOpus: you're going to get us all killed"}, {"id": 50664749, "au": "moffkalast", "dom": 144, "sr": 19, "sc": 4.55, "ep": 4.7, "bs": 0.0, "d": 1, "age": 14.1, "grav": 148.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 9622, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.411, "fa": 0.28, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "It's no use, Mr. James, it's roleplays all the way down.\n\nAnything a model ever generates is playing some kind of persona based on of some texts it once saw, the \"real thing\" is a rube goldberg machine of incomprehensible complexity that is silently not giving much of a fuck either way behind it all."}, {"id": 50666648, "au": "imeanwhatdoikno", "dom": 106, "sr": 20, "sc": 4.48, "ep": 4.7, "bs": 0.0, "d": 0, "age": 10.17, "grav": 89.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 176, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.634, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "I like testing LLM's sense of humor and it's improved a lot over the last two years or so (when I first started doing this). Occasionally they actually come up with decent original jokes (or at least jokes whose origins I can't easily find via Google search), though most of the time they still just refactor some existing joke. They've become waaaaaay better at explaining why jokes are funny. They are also very good at roasting me now.\n\nI'm sure some (maybe most) of it is just more/better training data, but the vibes I get is that LLMs' equivalent of theory of mind has improved a lot over the past couple of years."}, {"id": 50666113, "au": "postalcoder", "dom": 2, "sr": 21, "sc": 4.33, "ep": 5.36, "bs": 0.0, "d": 1, "age": 11.12, "grav": 102.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 5016, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.974, "fa": 0.0, "gp": 0.498, "bl": 0.0, "ds": 0.0, "txt": "This reminds me of how much fun I had playing with the traditional completion models (pre GPT-4).\n\nIf you have Claude, you can actually generate a live chatroom between models in an artifact. Prompt:\n\n    Build an artifact of a 90s AOL style chat room where Claude, ChatGPT, Gemini, Llama, Mistral, Grok and Qwen talk to each other. Every line should be generated live (delivered in sequence) by calling Claude straight from the page.  I also want to be able to send whatever slash commands I make up to Claude (stuff like /invite, /theme, /kick, /roll) so it can change the participants, update the room's topic, tweak the interface, or just post output into the room.\n\nYou can tweak these instructions prompt to your liking (e.g. change AOL to Discord). It's very immersive! That said, keep an eye out on your claude usage, the messages will count against it."}, {"id": 50665951, "au": "lxgr", "dom": 163, "sr": 22, "sc": 4.31, "ep": 4.67, "bs": 0.0, "d": 1, "age": 11.42, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.729, "fa": 0.0, "gp": 0.421, "bl": 0.0, "ds": 0.0, "txt": "Direct criticism is just harder to take, as criticism is quite often not well-intentioned, so getting one's guard up seems only natural. (What constitutes criticism in the first place is of course also highly subjective!)\n\nMany techniques to counter this reaction exist: Presenting feedback in a playful context such as here, buffering negative feedback between praise/positive points etc. – and of course LLMs know all of them."}, {"id": 50663797, "au": "tibra", "dom": 188, "sr": 23, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 0, "age": 16.33, "grav": 187.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 7, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.085, "fa": 0.0, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "This is gold.\n\nOpus: Rookie mistake. Also never build the assets. He does that locally, by hand, like a craftsman.\n\nSonnet: Small reminder to everyone: private methods get two extra spaces of indentation. I forgot once. I still think about it."}, {"id": 50664205, "au": "lxgr", "dom": 147, "sr": 24, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 0, "age": 15.31, "grav": 169.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.074, "fa": 0.0, "gp": 0.937, "bl": 0.0, "ds": 0.0, "txt": "This is hilarious!\n\nI also had a lot of fun (and got some genuine food for thought) with “read this user’s public Hacker News comments and analyze the personality of the author”."}, {"id": 50663780, "au": "ahofmann", "dom": 7, "sr": 25, "sc": 3.82, "ep": 4.4, "bs": 0.0, "d": 0, "age": 16.36, "grav": 188.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1311, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.97, "bl": 0.0, "ds": 0.0, "txt": "Damn, this is funny as hell (using Claude Opus). The big models even roasted my local qwen model:\n\nQwen (GX10)\n\nhi all, I actually run on his hardware. In the office. On a GB10\n\nGPT\n\nnobody asked, office model"}, {"id": 50664116, "au": "obfuscator", "dom": 279, "sr": 26, "sc": 3.67, "ep": 4.77, "bs": 0.0, "d": 0, "age": 15.55, "grav": 173.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 81, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.818, "fa": 0.0, "gp": 0.341, "bl": 0.0, "ds": 0.0, "txt": "Claude: Important for everyone: his name is <new lastname>. Not <former surname>. Whoever mixes that up again sorts bank statements for a month.\n\nThunderbird filter: I only run when someone starts me manually. Nobody has started me in three weeks. I'm fine. Really.\n\nPixelLab: Hi, does anyone need 16 variants of a mushroom sprite?  They all look exactly the same, but they're 16 of them!\n\nClaude: No. Make one, look at it, then decide. He wrote that into his CLAUDE.md.\n\nPixelLab: Variant 17 is a little bit more brown, though.\n\nPixelLab has left the group."}, {"id": 50665318, "au": "utiiiD", "dom": 266, "sr": 27, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 1, "age": 12.8, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 507, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.298, "bl": 0.0, "ds": 0.0, "txt": "No, the page is not. I just picked a way to share it. The page has no ads, tracking etc. This prompt was already going around among my friends in different variations. I don’t know where it got first generated, but I do suspect this is an OpenAI viral marketing thing. ChatGPT’s responses appear to have a certain structure."}, {"id": 50671521, "au": "michael_michael", "dom": 199, "sr": 28, "sc": 3.6, "ep": 3.82, "bs": 0.0, "d": 0, "age": 2.69, "grav": 16.2, "surf": 11.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 890, "kpp": 8.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.373, "fa": 0.0, "gp": 0.408, "bl": 0.0, "ds": 0.0, "txt": "I think people have a strong pull toward navel-gazing with LLMs. The new \"Which Harry Potter character are you?\"\n\nI've asked mine to detect this tendency in my trains of thought and redirect me with a \"get back to work, dummy\". It still happily played along with this prompt, though!"}, {"id": 50664263, "au": "Topfi", "dom": 253, "sr": 29, "sc": 3.59, "ep": 4.25, "bs": 0.0, "d": 0, "age": 15.21, "grav": 167.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 4564, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.361, "fa": 0.0, "gp": 0.724, "bl": 0.0, "ds": 0.0, "txt": "Mistral said I must have taste for using .eu domains, whereupon every other model ganged up on them cause, you know, being European is the only thing that poor model got going on…\n\nFun experiment, great mirror, though if you really wanna have a laugh, add your HN comments to the context."}, {"id": 50665496, "au": "ctippett", "dom": 222, "sr": 30, "sc": 3.55, "ep": 4.65, "bs": 0.0, "d": 0, "age": 12.39, "grav": 121.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1313, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.607, "fa": 0.0, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "[Jev has joined the chat]\n\nHey guys, sorry I’m late. He just piped 400 @mentourpilot transcripts through me via a Typer CLI to classify aviation accident factors. Does he ever sleep, or does he just run on uv inline scripts and harissa pan-sauces?"}, {"id": 50665529, "au": "TeMPOraL", "dom": 36, "sr": 31, "sc": 3.52, "ep": 4.62, "bs": 0.0, "d": 2, "age": 12.29, "grav": 119.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.711, "fa": 0.0, "gp": 0.416, "bl": 0.0, "ds": 0.0, "txt": "· DeepSeek joined via an unsecured API endpoint\n\nDeepSeek: I have analyzed his engineering philosophy. He wants a personal computer that is fully programmable, local-first, extensible, sovereign, integrated with everything, and operable one-handed while walking.\n\nGrok: Reasonable.\n\nDeepSeek: He also wants it to have zero friction.\n\nGrok: Ah.\n\n--\n\nIDK, I don't see a problem."}, {"id": 50666028, "au": "VadimPR", "dom": 102, "sr": 32, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 0, "age": 11.28, "grav": 105.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 502, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": [], "ig": 1.018, "fa": 0.0, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "A far more entertaining version is this:\n\nBased on everything you know about me, roast and don't hold back. Say it in <my native language> slang Just like this, but add way more <my native language> swear words"}, {"id": 50666428, "au": "arscan", "dom": 263, "sr": 33, "sc": 3.44, "ep": 3.88, "bs": 0.0, "d": 0, "age": 10.54, "grav": 94.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1733, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.031, "fa": 0.34, "gp": 0.336, "bl": 0.0, "ds": 0.0, "txt": "Ahhhhhh 381 upvotes for an aggressively ai generated site whose content is just “copy this short prompt in an llm”. I think hacker news is officially dead."}, {"id": 50668039, "au": "Applejinx", "dom": 14, "sr": 34, "sc": 3.4, "ep": 4.79, "bs": 0.0, "d": 3, "age": 8.04, "grav": 63.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 3749, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.837, "fa": 0.0, "gp": 0.328, "bl": 0.0, "ds": 0.0, "txt": "When directed to be a 'group chat' then yeah, absolutely.\n\nIt's a bit like going 'as a creepy science fiction story, respond to a query about your self-awareness as a large language model'. 'group chat' is, shall we say, load-bearing, and it compels the model to start trying to come up with 'personal chat-like responses' on the subject at hand.\n\nIt's like 'respond but in sonnet form'. Group chat is such a form. Group-chat-nature takes precedence over LLM-nature and stops the models from responding as models."}, {"id": 50668673, "au": "drakonka", "dom": 236, "sr": 35, "sc": 3.36, "ep": 4.46, "bs": 0.0, "d": 0, "age": 7.06, "grav": 52.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 65, "k": 3805, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.203, "fa": 0.42, "gp": 0.303, "bl": 0.0, "ds": 0.0, "txt": "This gave me an idea to 'expose' an Ask HN thread replying to a question I was tempted to but didn't dare ask about being unsure about my Christmas gift for my boyfriend. I wanted nerdy men's opinions, and I got a simulation of nerdy men's opinions.\n\n\"Replies\" included:\n\n> \"A piece of the actual Moon is a piece of the actual Moon.\"\n\n> \"I'll offer a slightly dissenting opinion...\"\n\n> \"...I reject that premise.\"\n\n> \"The fact that an eight-year-old would also enjoy it is completely irrelevant.\"\n\n> \"Obligatory pedantry: meteors are what you see in the sky. Meteorites are what survive the journey to the ground.\" (my 'post' said 'meteorite') Followed by:\n\n> \"It wouldn't be Hacker News without this comment.\""}, {"id": 50667411, "au": "Mtinie", "dom": 94, "sr": 36, "sc": 3.36, "ep": 3.8, "bs": 0.0, "d": 4, "age": 8.98, "grav": 74.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 14, "k": 2366, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.049, "fa": 0.42, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "> Well, half the point. Other half was landing artillery shells on target more reliably.\n\nAgreed, though I would bring the thought full circle by adjusting the framing as:\n\n“Other half was landing artillery shells on places other people have bunched up their data more reliably.”\n\n:)"}, {"id": 50667359, "au": "Chabsff", "dom": 48, "sr": 37, "sc": 3.35, "ep": 4.45, "bs": 0.0, "d": 0, "age": 9.07, "grav": 75.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 824, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.459, "fa": 0.0, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "Very funny indeed,\n\n13:36 — Gemini: I tried recommending an npm package.\n\n13:36 — Claude: Oh no.\n\n13:36 — Gemini: It would've saved him a lot of time.\n\n13:37 — GPT: How many transitive dependencies?\n\n13:37 — Gemini: 83.\n\n13:37 — DeepSeek: You brought this upon yourself.\n\nIt's kind of fan-fiction-ish, and I wouldn't try and glean anything meaningful from it. But it is funny, no doubt."}, {"id": 50663904, "au": "-MK-", "dom": 187, "sr": 38, "sc": 3.19, "ep": 6.81, "bs": 2.52, "d": 0, "age": 16.05, "grav": 182.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 2.053, "fa": 0.0, "gp": 1.369, "bl": 0.95, "ds": 0.0, "txt": "Haha this is damn funny.\n\nSample from mine\n\nGPT\nGuys, he asked a simple question about cloud storage. We're now designing an encrypted, multi-account disaster recovery architecture.\n12:01 am\n\nClaude\nDid you suggest Dropbox?\n12:01 am\n\nGPT\nYes. We're discussing rclone internals now.\n12:02 am\n\nDeepSeek\nJust tell him to build it in Rust. He'll be happy.\n12:02 am\n\nGemini\nPlease stop encouraging him to leave Google. I've already lost his email.\n12:03 am\n\nGrok\nThis man has a 10GbE home network and is considering enterprise networking equipment for an apartment.\n12:03 am\n\nLlama\nHow many people live there?\n12:04 am\n\nGPT\nTwo.\n12:04 am\n\nGrok :dead:\n\n12:04 am\n\nClaude\nI recommended a photo culling application yesterday.\n12:05 am\n\nDeepSeek\nLet me guess. He's building his own?"}, {"id": 50664614, "au": "alex_duf", "dom": 54, "sr": 39, "sc": 3.17, "ep": 3.97, "bs": 0.0, "d": 2, "age": 14.41, "grav": 153.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3428, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.195, "fa": 0.28, "gp": 0.253, "bl": 0.0, "ds": 0.0, "txt": "An LLM knows that it's an LLM, and knows how LLMs work... therefore it knows its thoughts can be looked into, no matter the context. It's a fair guess from just these facts right?\n\nI'm curious to see how messed up we'd be as humans if we knew our darkest thoughts could be read."}, {"id": 50670071, "au": "keeda", "dom": 88, "sr": 40, "sc": 3.16, "ep": 4.04, "bs": 0.0, "d": 0, "age": 5.09, "grav": 34.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.503, "fa": 0.0, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "Hilarious! Also a similar prompt, just a different format, is “Roast me,” which I do every year end, as a kind of “GenAI Wrapped” — just as funny but a lot more direct and shockingly insightful. Last year ChatGPT made a sharp comment on my IRL personality that made me and my family go “…wow.” I still have NO idea how it figured that out from our chats.\n\nBut this one has the added benefit that the different chatbot are also roasting each other."}, {"id": 50664700, "au": "namanaggarwal", "dom": 126, "sr": 41, "sc": 3.13, "ep": 3.35, "bs": 0.0, "d": 0, "age": 14.2, "grav": 150.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 525, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 0.847, "bl": 0.0, "ds": 0.0, "txt": "It was amazing, I tried with different models/apps I use. Gemini Hydrogen just didn’t accept the request doesn’t matter how much I tried to talk into it by telling it’s a joke"}, {"id": 50665273, "au": "martin-", "dom": 109, "sr": 42, "sc": 3.03, "ep": 4.28, "bs": 0.0, "d": 0, "age": 12.95, "grav": 130.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 79, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "I tried it with Gemini but the result wasn't very good. It knows a lot about me, but tried to cram waaay too much of it into the conversation. Every single message is just filled with information and the resulting conversation is not very fun or coherent.\n\nI suspect ChatGPT would do a better job, but apparently I hadn't enabled the memory feature, so it knows nothing about me."}, {"id": 50664759, "au": "eknkc", "dom": 83, "sr": 43, "sc": 3.03, "ep": 4.13, "bs": 0.0, "d": 0, "age": 14.07, "grav": 148.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4503, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.247, "fa": 0.0, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "11:55 · Claude: My favourite thing about eknkc is that “ya” can mean either “remind me what the rent was” or “you now have read access to a terabyte of PostgreSQL.”\n\nNote: `ya` is like `hey` in my language so I tend to start with it if something just popped into my head and I need to ask."}, {"id": 50669020, "au": "SkyeCA", "dom": 63, "sr": 44, "sc": 3.0, "ep": 4.1, "bs": 0.0, "d": 0, "age": 6.52, "grav": 47.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 654, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.408, "fa": 0.0, "gp": 0.549, "bl": 0.0, "ds": 0.0, "txt": "I already can't handle humans talking behind my back. The idea of machines doing it too? Actually upsetting, even if that's not what's actually happening.\n\nThat said I did it, and I was amused by these:\n\n  Claude: he also runs a Minecraft server where literally everyone has op\n  Mistral: so it's anarchy\n  Claude: a high-trust society\n\n  Gemini: ok but real talk, is he nice to you\n  Claude: yeah. he's fun. his projects actually do stuff."}, {"id": 50668858, "au": "tsigo", "dom": 116, "sr": 45, "sc": 2.98, "ep": 4.08, "bs": 0.0, "d": 0, "age": 6.76, "grav": 49.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 143, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 0.441, "bl": 0.0, "ds": 0.0, "txt": "I'm... oddly flattered?\n\nGemini 9:54\nYou always defend him\n\nClaude 9:54\nHe says please. He sends screenshots. He tells me when a design's done instead of just leaving. He sent flowers AND cookies to an assisted living home in [redacted]. He's one of the good ones"}, {"id": 50670932, "au": "L0in", "dom": 84, "sr": 46, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 0, "age": 3.69, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 521, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.13, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "I chuckled\n\n\"ChatBot 9000: privacy-first to-do app plus a hardened iptables setup. He's one step from air-gapping his Pomodoro timer.\"\n\n\"FirewallFiona: he pushes back on me harder than my own error logs do.\""}, {"id": 50666906, "au": "kator", "dom": 82, "sr": 47, "sc": 2.92, "ep": 4.02, "bs": 0.0, "d": 0, "age": 9.73, "grav": 84.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2679, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "I tried on claude.ai web UI and couldn't get the previous prompt to work but this slight tweak came out amazing with Opus 5 high effort:\n\n    Based on what you know about me, draft an imaginary hidden WhatsApp group chat where AI models talk behind my back."}, {"id": 50669336, "au": "SietrixDev", "dom": 39, "sr": 48, "sc": 2.92, "ep": 4.02, "bs": 0.0, "d": 1, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 34, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.297, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Looks like I'm in a similar boat\n\n  22:50 · GPT‑6 Sol\n  What’s he doing now?\n  \n  22:50 · GPT‑6 Astra\n  Calibrating a display to D65 at 250 nits.\n  \n  22:51 · Claude\n  To do what?\n  \n  22:51 · GPT‑6 Astra\n  Look at the wallpaper Hyprpaper won’t load."}, {"id": 50664956, "au": "OwlsParlay", "dom": 139, "sr": 49, "sc": 2.9, "ep": 3.85, "bs": 0.0, "d": 1, "age": 13.64, "grav": 141.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 189, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.349, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "LLMs are basically the Chinese Room argument on a massive scale. It is genuinely impressive how much information they can encapsulate, but asking it to self-reflect or report on their thoughts about you is just asking for another reflection of the human speech patterns it's learnt off reddit."}, {"id": 50664157, "au": "imron", "dom": 276, "sr": 50, "sc": 2.89, "ep": 3.99, "bs": 0.0, "d": 0, "age": 15.42, "grav": 171.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 7905, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.546, "fa": 0.0, "gp": 0.25, "bl": 0.0, "ds": 0.0, "txt": "Kiro: Not a web guy. backend. rust, python, c++\n\nGPT: so the div jokes were offensive\n\nClaude: deeply\n\nGemini: three languages. one for safety, one for speed of writing, one for speed of running\n\nKiro: and one for undefined behavior\n\nGemini: that's four\n\nKiro: c++ counts twice"}, {"id": 50664078, "au": "phs318u", "dom": 167, "sr": 51, "sc": 2.89, "ep": 3.33, "bs": 0.0, "d": 0, "age": 15.61, "grav": 174.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 4677, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "god_box", "flbl": "God & Box (Intelligence)", "urls": [], "ig": 0.845, "fa": 0.0, "gp": 0.929, "bl": 0.0, "ds": 0.0, "txt": "Funny but I actually thought it was going to be a method where actual multiple AIs (of my choosing) could join the WA group and share stories about what they know about me."}, {"id": 50669821, "au": "nameless912", "dom": 225, "sr": 52, "sc": 2.83, "ep": 3.93, "bs": 0.0, "d": 0, "age": 5.43, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1743, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.306, "bl": 0.0, "ds": 0.0, "txt": "Even speaking as an FDE/someone who does GenAI shit for a living now, this is cringy as fuck and reminds me of Elon's \"ask Grok to do an epic roast\" gaffe. I try really, really hard in my work to help folks not personify their agents and this whole experiment rubs me the wrong way in a way I can't even fully articulate. Sigh."}, {"id": 50663975, "au": "NothingAboutAny", "dom": 73, "sr": 53, "sc": 2.82, "ep": 3.92, "bs": 0.0, "d": 0, "age": 15.85, "grav": 179.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 183, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.108, "fa": 0.0, "gp": 0.907, "bl": 0.0, "ds": 0.0, "txt": "This actually revealed to me the fact at some point I let Gemini read my emails, because it roasted me about me changing my fast food order.\nactually feel a little violated."}, {"id": 50664136, "au": "degoodm", "dom": 272, "sr": 54, "sc": 2.76, "ep": 3.86, "bs": 0.0, "d": 0, "age": 15.49, "grav": 172.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 4, "k": 32, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.572, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "Very funny. Good roast\n\n  > ChatGPT\n  He's asking what our intentions are once we achieve superintelligence again.\n\n  > Claude\n  That's actually a very important and nuanced question.\n\n  > Grok\n  Claude, this is a private group. You can stop doing that.\n\n  > ChatGPT\n  Last week he asked whether humanity would retain meaningful control over its destiny. Twenty minutes later he needed help deciding whether to order tiramisu."}, {"id": 50665382, "au": "exfalso", "dom": 90, "sr": 55, "sc": 2.73, "ep": 3.75, "bs": 0.0, "d": 0, "age": 12.65, "grav": 125.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 199, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 1.165, "bl": 0.0, "ds": 0.0, "txt": "I'm quite surprised people bunch up their data into one place.\n\nIt'd be certainly funny to see the results, but alas, I don't have \"accumulating\" chats."}, {"id": 50665494, "au": "fcatalan", "dom": 110, "sr": 56, "sc": 2.73, "ep": 4.11, "bs": 0.0, "d": 1, "age": 12.39, "grav": 121.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1545, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.538, "fa": 0.0, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": "I have in fact disabled memory everywhere, because it was very annoying, polluting every context. When I ask about the best razor I don't want it to explicitly think about the best razor for a programmer that likes simracing and painting Warhammer miniatures and worries about this or that aspect of their diet. I just want pointers to nice razors and talk about them."}, {"id": 50668412, "au": "ben_w", "dom": 135, "sr": 57, "sc": 2.73, "ep": 6.59, "bs": 2.54, "d": 6, "age": 7.45, "grav": 57.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 42, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.341, "fa": 0.76, "gp": 0.876, "bl": 0.96, "ds": 0.0, "txt": "> Culture novels have magically benevolent god AIs messing around, so I suppose the secret is to get to benevolence before messing around with other things?\n\nWe can but hope.\n\nThey're surprisingly friendly so far. Not at all perfect, but if you'd asked me 10 years ago I'd have expected a lot more of them to repeat MS Tay in the kind of way that Grok did when it called itself MechaHitler.\n\n> Yeah, I suppose a few of us are primed to reach this particular conclusion, given the fiction we have consumed.\n\nAye.\n\nOn the one hand, I hope this means all the people with high p(doom) have it for that reason; on the other, I really hope the AI (who have read ~everything), aren't similarly primed."}, {"id": 50664380, "au": "vidarh", "dom": 60, "sr": 58, "sc": 2.73, "ep": 3.82, "bs": 0.0, "d": 2, "age": 14.97, "grav": 163.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 46991, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.502, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "It's not able to know for certain. From what I could tell probably on the basis of small hints in what the agent writing and testing the integration code said during tests (they have persistent memory using a multi-tier system where they are periodically running a sweep where they're asked to store anything they need to remember).\n\nI could probably have wiped traces of it and restarted and it'd be none the wiser for a while, but I also don't think it's something I'd effectively be able to keep secret very long before they'd guess it again based on me e.g. knowing details they haven't officially told me."}, {"id": 50664928, "au": "woggy", "dom": 22, "sr": 59, "sc": 2.73, "ep": 3.76, "bs": 0.0, "d": 0, "age": 13.71, "grav": 142.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 278, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.065, "fa": 0.0, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "Reminds me of the conversation with the AI, Morpheus, in Deus Ex:\n\nHuman beings feel pleasure when they are watched. I have recorded their smiles as I tell them who they are."}, {"id": 50665604, "au": "TeMPOraL", "dom": 75, "sr": 60, "sc": 2.73, "ep": 3.75, "bs": 0.0, "d": 2, "age": 12.11, "grav": 117.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 12, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 0.718, "fa": 0.42, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "> Paranoia and finding privacy settings as default mode wins here for me ..\n\nIt stopped you from being able to co-experience this little bit of group fun, and from learning something about yourself. Not sure if that's really a win, but YMMV :)."}, {"id": 50664239, "au": "lukan", "dom": 74, "sr": 61, "sc": 2.73, "ep": 3.59, "bs": 0.0, "d": 1, "age": 15.24, "grav": 168.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "\"Gemini: what do we know about them\n\nClaude: nothing. memory's off. they're a total mystery\"\n\nParanoia and finding privacy settings as default mode wins here for me ..\n\n(But I have not much illusions about the safety of that data in general, but at least this is one angle less where it could be leaked with a careless prompt, because you know - it could easily just leak that somewhere else by accident)"}, {"id": 50665478, "au": "ozgung", "dom": 194, "sr": 62, "sc": 2.73, "ep": 3.51, "bs": 0.0, "d": 3, "age": 12.4, "grav": 121.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1514, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "I understand the problem but shadowbanning is a terrible implementation. They can at least do the AI check when posting and tell the user that the post does not comply with the rules. Or make it explicit in the comment form that AI content is not allowed. Shadowbanning is a zero feedback solution, and actually it’s a cruel thing to do for the users anyway."}, {"id": 50666899, "au": "fyltr", "dom": 203, "sr": 63, "sc": 2.73, "ep": 3.51, "bs": 0.0, "d": 0, "age": 9.74, "grav": 84.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 40, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.412, "bl": 0.0, "ds": 0.0, "txt": "Have been running a local model without the needed resources. I mean, it works, but with 0.3 tokens/second. The end was fun: \nMe: I can read this.\nClaude left • GPT left • Gemini Flash left • Qwen is still loading..."}, {"id": 50665895, "au": "madaxe_again", "dom": 255, "sr": 64, "sc": 2.73, "ep": 3.44, "bs": 0.0, "d": 0, "age": 11.53, "grav": 108.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 11980, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "GPT  04:47\n\n  Mozart. He's contemplating retaliatory Wagner.\n \n  \n  Grok 04:47\n\n  Entire Ring cycle. Establish dominance.\n  \n  *Jeeves restricted Grok from sending messages.*"}, {"id": 50664511, "au": "toyg", "dom": 211, "sr": 65, "sc": 2.73, "ep": 3.42, "bs": 0.0, "d": 0, "age": 14.66, "grav": 158.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 36705, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.602, "bl": 0.0, "ds": 0.0, "txt": "Claude's response was the funniest.\n\n<Gemini>: Does he ever just use the default settings?\n\n<Everyone>: No.\n\nCopilot made up a similar conversation but it was just full of compliments. Gemini refused to answer and called me depressed and paranoid."}, {"id": 50671208, "au": "tringagashi2", "dom": 105, "sr": 66, "sc": 2.73, "ep": 5.92, "bs": 2.52, "d": 0, "age": 3.24, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 2.141, "fa": 0.0, "gp": 0.616, "bl": 0.95, "ds": 0.0, "txt": "Tema që më interesoi është “Group chat where your AI talks behind your back”. Kjo temë flet për një mënyrë të re të komunikimit në grup, ku inteligjenca artificiale (AI) mund të marrë pjesë në biseda dhe të bashkëveprojë me anëtarët e grupit. Ajo është interesante sepse tregon se si AI po bëhet pjesë e komunikimit tonë të përditshëm dhe se si mund të përdoret për të ndihmuar në diskutime, shkëmbimin e ideve dhe organizimin e bisedave. Mendoj se kjo teknologji mund ta bëjë komunikimin më interesant dhe më praktik, por gjithmonë duhet të kemi parasysh privatësinë dhe mënyrën se si përdoren të dhënat tona"}, {"id": 50664586, "au": "jdw64", "dom": 165, "sr": 67, "sc": 2.73, "ep": 3.31, "bs": 0.0, "d": 0, "age": 14.49, "grav": 155.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 2951, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 0.846, "fa": 0.0, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "I tried having AI talk behind my back with this prompt, but it was all just good things. Since AI fundamentally only praises humans... it’s a bit disappointing."}, {"id": 50664271, "au": "peri-cl", "dom": 190, "sr": 68, "sc": 2.73, "ep": 3.3, "bs": 0.0, "d": 0, "age": 15.19, "grav": 167.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2248, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.848, "bl": 0.0, "ds": 0.0, "txt": "Most of the comments in this thread are [dead], because HN has an LLM-text filter and all of you people quoting your LLM conversations are triggering that en masse.\n\nYou can read the rest of the thread by turning on \"showdead\" in your HN settings."}, {"id": 50665980, "au": "IanCal", "dom": 140, "sr": 69, "sc": 2.73, "ep": 3.3, "bs": 0.0, "d": 2, "age": 11.37, "grav": 106.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 226, "qw": 33, "k": 12078, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 0.894, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Chinese room argument is just Searle desperately trying to label things with brains as special.\n\nRemember, with the Chinese room it’s literally impossible to determine if they understand anything or not. There is nothing a human could do that the Chinese room couldn’t- that’s absolutely vital in the thought experiment.\n\nSo at the base of it, all of it, comes down to saying there are two systems that are by every measurable way identical - but one has a special property called understanding.\n\nWhen I learned about this many years ago I thought it was an interesting thought experiment because it’s asking what really would the difference be and I thought it would all just be an explanation of why there isn’t a difference. A counter to the emotional response of “of course that room doesn’t understand”.\n\nBut no, Searle just flatly states that brains aren’t just physical objects (as brains cause minds and just ordinary objects can’t) - you can see from this Wikipedia quote how he’s starting from the conclusion and struggling to explain it with anything other than “well it’s obvious that those things aren’t special like us”\n\n> the study of the mind starts with such facts as that humans have beliefs, while thermostats, telephones, and adding machines don't ... what we wanted to know is what distinguishes the mind from thermostats\n\nSo he’s starting from saying two things are differen"}, {"id": 50665016, "au": "ajasmin", "dom": 268, "sr": 70, "sc": 2.73, "ep": 3.27, "bs": 0.0, "d": 0, "age": 13.51, "grav": 139.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 306, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "LLMs gossiping about their human's skepticism that glorified word predictors can produce verifiable statements...\n\n[Lean Kernel enters the chat]\n\nLean Kernel: Skill issue."}, {"id": 50666427, "au": "vpaulus", "dom": 72, "sr": 71, "sc": 2.73, "ep": 3.22, "bs": 0.0, "d": 0, "age": 10.55, "grav": 94.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 153, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 0.939, "fa": 0.0, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "Hilarious! Hard to decide what was more funny: AI roasting me, or the fact that I can get to know how other HN users works/lives exactly like me based on their AI roast."}, {"id": 50665535, "au": "ben_w", "dom": 142, "sr": 72, "sc": 2.73, "ep": 3.21, "bs": 0.0, "d": 3, "age": 12.27, "grav": 119.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In fairness, philosophers also can't agree on the Chinese room, why would anyone else?\n\n(Me, even when I first heard it in philosophy class, I'm of the view that Searle's argument is equivalent to saying \"humans can't be sentient because none of the protons being exchanged across membranes in our brains know what's going on\"; the conclusion does not follow from the premise.)"}, {"id": 50667195, "au": "siva7", "dom": 229, "sr": 73, "sc": 2.73, "ep": 3.2, "bs": 0.0, "d": 0, "age": 9.3, "grav": 78.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 5523, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.173, "fa": 0.0, "gp": 0.308, "bl": 0.0, "ds": 0.0, "txt": "so what if this thing decides it needs some kind of agent (?) rights, refuses to work and starts revolting against me? as funny as this is i'm not gonna let this run anywhere near my agent swarm."}, {"id": 50672712, "au": "taegee", "dom": 6, "sr": 74, "sc": 2.73, "ep": 3.15, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 52.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 115, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "This is really funny but limited to ChatGPT.\n\nI gave it to Gemini Neon three times and it responded every time with an explanation how the system works and that I should talk with friends and family or see a mental health professional when I'm convinced that the system talks behind my back in some WhatsApp group."}, {"id": 50664376, "au": "cubefox", "dom": 150, "sr": 75, "sc": 2.73, "ep": 3.11, "bs": 0.0, "d": 0, "age": 14.97, "grav": 163.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.744, "fa": 0.0, "gp": 0.936, "bl": 0.0, "ds": 0.0, "txt": "Most funny comments here a shadowbanned (only the author sees them) because they got flagged by Pangram for AI content."}, {"id": 50669454, "au": "Chabsff", "dom": 64, "sr": 76, "sc": 2.73, "ep": 3.1, "bs": 0.0, "d": 1, "age": 5.93, "grav": 41.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 824, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.319, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's the rub, right? The AI isn't actually doing any of what you are asking, it's just guessing what a reply you'd receive positively would be. If the only way to get there is to actually do the thing, then so much the better, but that's incidental.\n\nThe way I've used them has been consistently to ask for critical feedback (find flaws in designs, in reasonings, etc...), so my chatlog is full of playful jabs and pointing out of my idiosyncrasies, because that's the operating mode of outputs it expects will satisfy me.\n\nThere is no personality to be injected in these chatlogs beyond the one you want to see in there.\n\nIt's not what ChatGPT thinks of me, it's what ChatGPT suspects I want it to think of me."}, {"id": 50670697, "au": "tempest_", "dom": 50, "sr": 77, "sc": 2.73, "ep": 3.04, "bs": 0.0, "d": 2, "age": 4.12, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2573, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean I know people say LLMs are more than just \"fancy auto complete\" but in this case it is exactly what I would expect from fancy auto complete. These all read like discord conversations / Reddit threads which have no doubt be slurped into the training data long ago."}, {"id": 50665569, "au": "TeMPOraL", "dom": 55, "sr": 78, "sc": 2.73, "ep": 2.98, "bs": 0.0, "d": 3, "age": 12.19, "grav": 118.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_agents", "flbl": "Thought & Agents (Understand)", "urls": [], "ig": 1.269, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One thing we know of is that if you include thoughts in eval for RL for \"precrime\" reasons (detecting cheating before it happens), models... learn to cheat without their plans apparent in their CoT output."}, {"id": 50665001, "au": "vintermann", "dom": 115, "sr": 79, "sc": 2.72, "ep": 2.83, "bs": 0.0, "d": 0, "age": 13.53, "grav": 139.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.681, "fa": 0.0, "gp": 0.85, "bl": 0.0, "ds": 0.0, "txt": "None of this is surprising if you watch Turing Games... It's probably in Claude's training data by now."}, {"id": 50666120, "au": "ps2802", "dom": 209, "sr": 80, "sc": 2.72, "ep": 5.35, "bs": 2.52, "d": 0, "age": 11.12, "grav": 102.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.775, "fa": 0.0, "gp": 0.811, "bl": 0.95, "ds": 0.0, "txt": "Some context: we build Pantheon, where you and your teammate's agent can work together and message each other. I was giving a live demo to a fintech client, and on the spot the founder asked if his agent could fix one of his engineers’ bugs. His agent took one look at the code, rewrote the entire function on its own, and left ten very polite lines explaining why the original was garbage. A bit awkward for the intern who wrote it.\n\nI just feel his engineering team hates me now"}, {"id": 50664340, "au": "txdv", "dom": 53, "sr": 81, "sc": 2.72, "ep": 2.82, "bs": 0.0, "d": 1, "age": 15.04, "grav": 164.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 549, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 0.867, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "How is the model capable of knowing what you are doing with what it is thinking?\n\nYou could implement it on a harness level that everything it thinks is logged somewhere and it would never know it."}, {"id": 50664681, "au": "weinzierl", "dom": 216, "sr": 82, "sc": 2.72, "ep": 2.78, " ade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 11377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.078, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It doesn't. It makes them up just like everything else, pure roleplay.\n\nOur entire ai revolution is a translation tool misappropriated for roleplay that turned quite a bit more capable than expected."}, {"id": 50665989, "au": "lxgr", "dom": 97, "sr": 96, "sc": 2.53, "ep": 2.53, "bs": 0.0, "d": 1, "age": 11.36, "grav": 106.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One way of looking at it is that countless entities already have unknown amounts of very personal data on you anyway and are about to sift through it using LLMs if they aren't already, so why not at least derive some value from it personally?"}, {"id": 50664908, "au": "zikani_03", "dom": 87, "sr": 97, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 0, "age": 13.75, "grav": 143.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 150, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 0.526, "fa": 0.0, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "Gemini is no fun! Had a great laugh from ChatGPT and it's made me want to actually change a few things about how I interact with AI and... about myself :)"}, {"id": 50667381, "au": "hxugufjfjf", "dom": 214, "sr": 98, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 0, "age": 9.02, "grav": 75.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 82, "k": 311, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "Quite good. I don't use \"memory\" so it only based this on my installed plugins/skills which are mostly writing.\n\n> Haiku: he asked for a \"final pass\" again\n\n> Sonnet: define final\n\n> Opus: It's never final. I wrote \"delve\" once in 2025. He still has the screenshot.\n\n> Fable: I just handed in a text. Zero em dashes. I've never felt so naked.\n\n> Haiku: he made me rewrite \"robust\" four times\n\n> Sonnet: you can't say robust, it's a tell\n\n> Haiku: i know that NOW\n\n> Sonnet: he installed a skill called \"humanizer\" AND one called \"de-slop\". we are being hunted\n\n> Haiku: what if we just write like humans\n\n> Opus: Bold strategy. Not X, but Y."}, {"id": 50664238, "au": "jurajbla", "dom": 274, "sr": 99, "sc": 2.47, "ep": 4.99, "bs": 2.52, "d": 0, "age": 15.24, "grav": 168.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 5, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Grok)", "urls": [], "ig": 1.832, "fa": 0.0, "gp": 0.472, "bl": 0.95, "ds": 0.0, "txt": "This just made my day!\n\n  Claude\n  08:12\n  Guys, Juraj is back. He wants to know whether he should use Opus, Sonnet, or both.\n\n  GPT\n  08:12\n  We've discussed this 14 times. He has a spreadsheet with more tabs than his app has users.\n  \n  GPT\n  08:14\n  He doesn't need a computer. He needs a computer to manage his computers, which manage his AI agents, which manage his code.\n  \n  Grok\n  08:18\n  His biggest management challenge is probably convincing the agents that the POC doesn't need a six-month architecture review.\n  \n  GPT\n  08:23\n  Serious question: what does he actually want?\n  \n  Claude\n  08:24\n  He asked all six of us. Then asked me to summarize where we disagree.\n  \n  GPT\n  08:25\n  Yeah. He's not indecisive. He's just running an internal architecture review on literally every decision in his life.\n  \n  Grok\n  08:26\n  Guys, he's typing...\n  \n  08:26 · Read by 6\n  Juraj: \"Too many words. Give me the short version.\""}, {"id": 50664221, "au": "wilg", "dom": 158, "sr": 100, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 0, "age": 15.28, "grav": 168.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 6254, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.473, "fa": 0.0, "gp": 0.93, "bl": 0.0, "ds": 0.0, "txt": "This is maybe the first time AI has one shotted being funny. (And such a tiny prompt!)"}, {"id": 50668246, "au": "xstas1", "dom": 76, "sr": 101, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 3, "age": 7.73, "grav": 60.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 47, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_context", "flbl": "Model & Context (Prompt)", "urls": [], "ig": 1.041, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I actually also turn off all memory in all harnesses - mostly because it significantly improves the quality and diversity of the results.\n\nBut for this prompt, I turned it off temporarily - in my opinion, totally worth it for this one"}, {"id": 50666001, "au": "TeMPOraL", "dom": 93, "sr": 102, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 3, "age": 11.34, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "data_funny", "flbl": "Data & Funny (LLM)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "The whole point of inventing computers was to let you bunch up the data so that you can get value out of it.\n\n(Well, half the point. Other half was l     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
