hat a lot of forest dwelling bodgers lost their gig\n\nWhile I do appreciate the metaphor, note that at its peak there were roughly 30 bodgers living in the region around High Wycombe, England.\n\nhttps://en.wikipedia.org/wiki/Bodging"}, {"id": 50638790, "au": "retsibsi", "dom": 28, "sr": 78, "sc": 1.87, "ep": 2.1, "bs": 0.0, "d": 2, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1956, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.385, "fa": 0.0, "gp": 0.826, "bl": 0.0, "ds": 0.0, "txt": "Sounds high-minded, but concretely, if they make a breakthrough that would undermine the cryptography our civilization is currently relying on, do you actually think they should immediately release it to the public?"}, {"id": 50638620, "au": "simianwords", "dom": 175, "sr": 79, "sc": 1.87, "ep": 2.1, "bs": 0.0, "d": 0, "age": 6.26, "grav": 44.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1363, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.821, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "A lot of HN believed that AI could not generalise and would not be able to solve Milennium problems.\n\nWhat I have noticed after hanging out here is that people are consistently wrong about bullish predictions in AI.\n\nI wonder if they've changed their minds"}, {"id": 50639421, "au": "peri-cl", "dom": 148, "sr": 80, "sc": 1.87, "ep": 2.04, "bs": 0.0, "d": 5, "age": 4.08, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 12, "k": 2248, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.357, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Which is your favored model for mathematics conversations?\n\n> \"nothing I could ask it that it couldn't reply in great detail about\"\n\nMy experience is the same, to the extent that one of my biggest problems is the sheer volume of new things I'm curious to read about—but there's too many at once!"}, {"id": 50638458, "au": "WindyTree", "dom": 173, "sr": 81, "sc": 1.87, "ep": 2.02, "bs": 0.0, "d": 0, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 25, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.778, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "Man, it sure would be funny if the efficient solution to NP complete problems were actually inherent in the structure of LLMs themselves without people knowing, so there was an exponential hackpolypse as more and more people realized it by picking them apart."}, {"id": 50639731, "au": "jibalt", "dom": 125, "sr": 82, "sc": 1.87, "ep": 1.99, "bs": 0.0, "d": 1, "age": 3.29, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.848, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Indeed. If proving P=NP somehow allowed us to break cryptography, we could just assume P=NP and break cryptography the same way.\n\nLogical thinking is hard and escapes many people."}, {"id": 50640549, "au": "g-b-r", "dom": 35, "sr": 83, "sc": 1.87, "ep": 1.95, "bs": 0.0, "d": 5, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.829, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Post quantum algorithms are only meant to protect from powerful-enough quantum computers; given that they're much more recent I'd say it's more likely that some AI breaks them than the current cryptographic primitives."}, {"id": 50639918, "au": "jibalt", "dom": 130, "sr": 84, "sc": 1.87, "ep": 1.93, "bs": 0.0, "d": 3, "age": 2.77, "grav": 16.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.823, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fallacy of affirmation of the consequent.\n\nAs @whatever1 said, \"We still have to discover the algorithms\". Of course discovering a fast algorithm for an NP-complete problem in NP proves P=NP, but it doesn't generally work the other way."}, {"id": 50639230, "au": "petesergeant", "dom": 93, "sr": 85, "sc": 1.8, "ep": 1.8, "bs": 0.0, "d": 4, "age": 4.5, "grav": 29.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.764, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would say “I heated the room”, not “I pressed a button and the gas fire subsequently heated the room”, because I am a human being who speaks a human language to other humans."}, {"id": 50640070, "au": "black_knight", "dom": 80, "sr": 86, "sc": 1.76, "ep": 1.76, "bs": 0.0, "d": 3, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.748, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I meant this in the sense that I think that only humans have a subjective inner experience which can appreciate maths.\n\nNot sure how that could be proven right or wrong. I don’t exclude the possibility that LLMs could start coming up with new theorems that we would appreciate. But it cannot actually appreciate them itself."}, {"id": 50639911, "au": "whatever1", "dom": 132, "sr": 87, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 3, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 7823, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.727, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh I see so the hope is that during the derivation of the proof we will come up with the magical algorithm. This makes sense! Thank you!"}, {"id": 50639941, "au": "yreg", "dom": 164, "sr": 88, "sc": 1.69, "ep": 2.88, "bs": 1.19, "d": 6, "age": 2.71, "grav": 16.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 11, "k": 10140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.717, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> That is why most code generated by AI is shot down.\n\nThis is not true, at least not for the \"frontier\" models. I have less objections when reviewing LLM produced code than I used to have reviewing my human colleagues pre-AI."}, {"id": 50640288, "au": "simianwords", "dom": 177, "sr": 89, "sc": 1.66, "ep": 1.66, "bs": 0.0, "d": 2, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1363, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.295, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I completely disagree. Both ends 1 and 4,5 believe that AI will be powerful. It’s the midwits in 2-3 that don’t."}, {"id": 50639846, "au": "silvester23", "dom": 85, "sr": 90, "sc": 1.64, "ep": 1.64, "bs": 0.0, "d": 1, "age": 2.96, "grav": 17.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 505, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.288, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A bit of a tangent but who buys \"No\" on bets like \"Before 2035\" or even \"Before 2040\"?\n\nNot only are they betting that the problem won't be resolved but also that Kalshi will still be around by then."}, {"id": 50638738, "au": "waynecochran", "dom": 135, "sr": 91, "sc": 1.64, "ep": 1.64, "bs": 0.0, "d": 2, "age": 5.98, "grav": 42.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2817, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.345, "fa": 0.0, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "Outside of my colleagues and other nerds, I wonder if everyone out there realizes what is actually happening. It is weird to be on the front line of seeing a cataclysmic change as it is happening and realize that most people don't realize it."}, {"id": 50638690, "au": "ls612", "dom": 27, "sr": 92, "sc": 1.62, "ep": 1.62, "bs": 0.0, "d": 1, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 3488, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.393, "fa": 0.0, "gp": 0.482, "bl": 0.0, "ds": 0.0, "txt": "“Beware of he who would deny you access to information, for in his heart he dreams himself your master”\n\nNo quote from any other game in my childhood has been so prophetic as this one across so very many contexts."}, {"id": 50639592, "au": "whatever1", "dom": 124, "sr": 93, "sc": 1.61, "ep": 1.61, "bs": 0.0, "d": 0, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 7823, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.612, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "Why P=NP is such a big deal? Even if we prove it holds so what?\n\nWe still have to discover the algorithms. We have been looking for efficient algorithms anyway."}, {"id": 50638946, "au": "schiffern", "dom": 41, "sr": 94, "sc": 1.59, "ep": 1.59, "bs": 0.0, "d": 4, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 8402, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.676, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think you meant to say, \"the stakes are too high to take that path.\"\n\nIt doesn't matter if the same math would be discovered 'eventually.'  The releasing lab would be remembered as the one who broke cryptography."}, {"id": 50639813, "au": "jibalt", "dom": 99, "sr": 95, "sc": 1.55, "ep": 1.55, "bs": 0.0, "d": 2, "age": 3.02, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.618, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "Nonsense. It's tautological that any work that he is producing is his work. One might argue that it's not his finest by judging it on how it was produced, not just what the end result is, but that's a different matter."}, {"id": 50639837, "au": "FartyMcFarter", "dom": 126, "sr": 96, "sc": 1.5, "ep": 1.5, "bs": 0.0, "d": 2, "age": 2.97, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 5996, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.639, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One way of proving P=NP is to come up with a fast algorithm for solving an NP-hard problem. It is not the only way, but for many people it's how they imagine it would be done, hence the jump to conclusions."}, {"id": 50639280, "au": "retsibsi", "dom": 32, "sr": 97, "sc": 1.49, "ep": 1.49, "bs": 0.0, "d": 4, "age": 4.39, "grav": 28.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1956, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.528, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "This, I think I agree with. (But it still amounts to 'denying us access to information', so I think it is an importantly different position from the one implied by the quote above.) I've been trying to think through the possibilities and I just can't see how immediate release would not be extremely reckless. But immediate disclosure seems to have most of the benefits without most of the risks. I'm still open to hearing the more extreme case, though, if someone wants to make it."}, {"id": 50638491, "au": "keeda", "dom": 174, "sr": 98, "sc": 1.47, "ep": 1.47, "bs": 0.0, "d": 0, "age": 6.63, "grav": 48.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.545, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "If people are 639879, "au": "lwhi", "dom": 34, "sr": 102, "sc": 1.4, "ep": 1.4, "bs": 0.0, "d": 4, "age": 2.85, "grav": 17.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 3607, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.597, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The fact it was known to exist would encourage others to seek it out; and they would.\n\nWe should really move to post quantum algorithms NOW."}, {"id": 50640476, "au": "throwaway27448", "dom": 14, "sr": 103, "sc": 1.39, "ep": 2.58, "bs": 1.19, "d": 1, "age": 1.25, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 15, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.588, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> Maybe really intelligent behaviour in general is just basic stuff applied very diligently and quickly.\n\nSure, if by intelligent behavior you mean searching proof or program space. I think this is a small subset of what we see as intelligence, though."}, {"id": 50638554, "au": "AngryData", "dom": 54, "sr": 104, "sc": 1.37, "ep": 1.37, "bs": 0.0, "d": 1, "age": 6.44, "grav": 46.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 5139, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.463, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "To nitpick your example, did machines make better chair legs? Seems to me like they made cheaper chairs that were and still are technically inferior to green cut, split and hand turned legs. The type of chairs bodgers were employed to make use pretty thin wood spokes that requires following the grain throughout the spoke to remain strong enough, which doesn't happen if you just throw a square cut piece of timber on a lathe. You also need green wood to get good grain splits from wood and more easily bend the grain into different shapes for curved portions, but getting fresh green wood doesn't lend itself well to industrial logging practices. Which is why modern wooden chairs are heavier and use significantly thicker wood on average and you don't see many windsor or similar style chairs anymore except when they are hand made.\n\nNow one could argue there just isn't demand for those old style chairs, but I would bet more on the style changing because older furniture styles are simply incompatible with cheaper modernized wood working practices."}, {"id": 50638994, "au": "defrost", "dom": 60, "sr": 105, "sc": 1.32, "ep": 1.32, "bs": 0.0, "d": 4, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.562, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The counter point being no machine (as yet) can match the cane work of Murano glass master Lino Tagliapietra .. paradoxically his best work looks \"machine made\" (and distorted through some kind of organic filter)."}, {"id": 50638707, "au": "bananaflag", "dom": 134, "sr": 106, "sc": 1.3, "ep": 2.49, "bs": 1.19, "d": 1, "age": 6.07, "grav": 42.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 12, "k": 1673, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.378, "fa": 0.42, "gp": 0.28, "bl": 0.45, "ds": 0.0, "txt": "> Like Scott Aaronson I am losing patience with those denying this is real.\n\nSome of my mathematician colleagues claim AI only solves big flashy problems, and they work on small boring problems, so it doesn't affect them."}, {"id": 50638576, "au": "ggm", "dom": 62, "sr": 107, "sc": 1.27, "ep": 1.27, "bs": 0.0, "d": 2, "age": 6.38, "grav": 46.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 30793, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.541, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd always imagined there were 20,000 of them per square inch. Disappointed to learn it was a more manageable number. Thats not even one wing of a poor house. Those luddites really had no leg to stand on (sorry)"}, {"id": 50639691, "au": "jibalt", "dom": 51, "sr": 108, "sc": 1.13, "ep": 1.13, "bs": 0.0, "d": 2, "age": 3.36, "grav": 20.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.48, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Factoring being in P does not entail that there is a fast (in the practical sense, not the technical sense) algorithm."}, {"id": 50638808, "au": "cyberax", "dom": 47, "sr": 109, "sc": 1.11, "ep": 1.11, "bs": 0.0, "d": 1, "age": 5.82, "grav": 40.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7233, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.474, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Heh. Factoring in P would make all the post-quantum crypto push actually make sense. We were all assuming that you need a quantum computer to break the RSA, but what if there's a fast classical algorithm?"}, {"id": 50638821, "au": "ggm", "dom": 64, "sr": 110, "sc": 1.11, "ep": 2.8, "bs": 1.7, "d": 4, "age": 5.76, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 30793, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.192, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "In the long run, it's the 2nd earl of Snowden formerly Viscount Linley. It's like a royal version of \"carcination\" -we all turn to crabs, they all turn to very expensive bespoke furniture makers (apparently he studied furniture design at Bedales)\n\nI think at the point you have to be royalty to afford to do it, we can declare it dead as an industry. It's art jim, but not as we knew it. On the plus side, since all the royals are functionally bald, he doesn't have to tug a forlock."}, {"id": 50639733, "au": "npfries", "dom": 106, "sr": 111, "sc": 1.08, "ep": 1.08, "bs": 0.0, "d": 6, "age": 3.28, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 8, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.459, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is that the same thing as saying that on the scale of compiler to human, LLMs are closer to humans than to compilers?"}, {"id": 50640480, "au": "throwaway27448", "dom": 8, "sr": 112, "sc": 0.92, "ep": 2.12, "bs": 1.19, "d": 3, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.146, "bl": 0.45, "ds": 0.0, "txt": "Craft. Art is something different. There is overlap sometimes, but I certainly don't feel human connection or a notable aesthetic experience reading through LLVM's codebase."}, {"id": 50639232, "au": "zodiac", "do /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
