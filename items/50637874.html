al example of this phenomenon,\n\n742492752988806621853995895766510571637507571524523761364695576840884785317537023194416450105369090298624907996376863662013270274715126925854245821721137546717080857941385914705413440232455524380639460346148487626493301109054439289765199637645127113891357537608867069476190572777778908592077836513446190169187832719392345303583502797056317316916211247514801363580210284009783356685227466394443703426869876758322703222286468525377465170947086786131398604379922045385223928977035079619661795793405380378102289473293200969631359601536212041254266335811626987908847996226123857318345593533922138874732975364510345198768720088798699579204710665665143202971257268264225261462002401512716758467582555721037867045631367722702471429196463988104839117722133728602505216971744854786050331317536973097728594295945830931148081200605295334485858661686328660965889155801799151847620022572458992011181221097443227188939940030934045355157361867017335365423275413985263064217535835038312677895514018791820171733852537732954070710890815609041257830626408308229466195083588662070291622115163690786064761529426641476260278631294422100580856377043102118222133711434191964692515188778643531957487660398484976402376083651341066338109626372168098876940091743==28885797163723952591447923523374661546507042003238981719755456596462764713083621696308254312514311441880361902819606"}, {"id": 50639209, "au": "waynecochran", "dom": 147, "sr": 3, "sc": 8.53, "ep": 8.53, "bs": 0.0, "d": 4, "age": 4.55, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 21, "k": 2817, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.694, "fa": 0.76, "gp": 1.643, "bl": 0.0, "ds": 0.0, "txt": "> Well no, because no LLM knows a single thing.\n\nWell they can generate math and code at a level that exceeds me by a wide margin and I am no slouch. I recently was in a long conversation with an AI about specific details of Markov Random Fields and how to solve certain cases with Loopy Belief Propagation and it is clear there was nothing I could ask it that it couldn't reply in great detail about. Whether they \"know\" something or not is a philosophical question, but they pass the Turing Test by a wide margin.\n\n> I have yet to encounter a person of reasonable intelligence who can't beat an LLM.\n\nNot now. It is not even close. I just had an AI write a Vulkan program that implemented a real time renderer of Gaussian Splats trained from Structure from Motion point clouds with 100 million points. Its cleverness of how to encode spherical harmonics and exploit the graphics hardware is astounding. I'll put it up against any human any day."}, {"id": 50639952, "au": "keybored", "dom": 143, "sr": 4, "sc": 7.65, "ep": 7.8, "bs": 0.0, "d": 1, "age": 2.69, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 234, "qw": 0, "k": 2352, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": ["https://scottaaronson.blog/?p=10344"], "ig": 1.757, "fa": 0.96, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "I notice that this man chooses to get incensed about the morons who are in AI denial (his words). It is very important that the peanut gallery call it something like intelligence and don’t use demeaning words like stochastic animal-something. Then he turns to the long-term implications and how it could either be very beneficial or a catastrophe. But about that he has the serenity of an enlightened sloth. Raise a glass and hope and pray. And the leak needs to be fixed.[1]\n\n“a lot of the smartest people I know now think that recursive\nself-improvement and the end of the entire known world are coming in\n12-18 months.”[1]\n\nBack down on Earth, turning off AI before it “recurses” is at this point just about unplugging machines and data centers. The doom-or-paradise trajectory is still driven by humans. Very few humans, in fact. And those who are in full belief of the AI Powers That Be In 2027 can do something real in the world in order to steer that ship towards human flourishing. But conveniently they live in the doom-or-paradise inevitability where the computers already have set the trajectory and all the AI lunatics at the helm can just continue with their own personal doom-or-paradise quest: the one where “paradise” is when they privatize everything and dominate humanity.\n\nBut sure. Get incensed about the peanut gallery. And with tranquility and impotent hopefulness look to the f"}, {"id": 50639772, "au": "schoen", "dom": 33, "sr": 5, "sc": 7.61, "ep": 7.61, "bs": 0.0, "d": 5, "age": 3.15, "grav": 19.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 508, "qw": 0, "k": 22903, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.912, "fa": 0.56, "gp": 1.045, "bl": 0.0, "ds": 0.0, "txt": "If it's true and a current frontier model can discover it, some people probably already know, especially governments that may have discovered it before and exploited it rather than revealing it, or governments that may have frontier LLMs capabilities themselves (bought from frontier labs, or internally developed, or hacked from frontier labs). If not, they will probably know pretty soon.\n\nDisclosing the problem sooner somewhat accelerates responses to it, and somewhat reduces the amount of traffic that attackers can exploit, or the quantity of credentials that they can forge.\n\nThe details might depend on the nature of the attack and whether it applies, for example, to DLP only, ECDLP only, both, RSA only, specific curves only, etc., because that might affect who can migrate easily or not.\n\nOne general problem that we've already seen in the past is that there are a lot of embedded systems and other devices that are hard to upgrade, so there are things that have been fixed long ago in upstream software releases, but devices that no longer get updates can't be patched. I think the trend is toward more devices having readily-upgradable software over time, but it's starting from a pretty bad baseline. I remember when CA/B Forum deprecated an older primitive (or keysize?) used in certificates, there were a bunch of credit card terminals that couldn't be upgraded to accept the new pub"}, {"id": 50640062, "au": "bob1029", "dom": 2, "sr": 6, "sc": 7.0, "ep": 7.0, "bs": 0.0, "d": 1, "age": 2.35, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.862, "fa": 0.68, "gp": 0.473, "bl": 0.0, "ds": 0.0, "txt": "Speed is the most important thing now. Disaggregated inference is enabling 10x+ speedups on frontier models. It's only going to get faster.\n\nWhen your ultrafast coding agent can do in five minutes what used to take nearly an hour, entire new ways of working are possible. You can solve problems with the business in real time. The need for a software development process begins to evaporate when everything can happen synchronously. Why would the business bother writing a design ticket when they know they could get on a screen share with engineering for roughly 15 minutes and achieve a guaranteed result by the end? They get way more control over the outcome too.\n\nOnce everyone had broadband internet, Netflix didn't try to mail DVDs faster. They turned into a film studio. Anyone with a software business needs to start thinking along similar lines."}, {"id": 50638506, "au": "waynecochran", "dom": 133, "sr": 7, "sc": 6.85, "ep": 7.15, "bs": 0.0, "d": 0, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 2817, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.566, "fa": 0.68, "gp": 1.056, "bl": 0.0, "ds": 0.0, "txt": "If there’s any real technical issue with the proofs, I’ll be happy to hear about it from experts, but my patience for arguing with the flat-earthers is at an end.\n\nHaving been doing 99% of all my computer vision coding using AI for a year and realizing it is smarter than me, I am overcome at how truly amazing this is. I am almost 60 years old and I have a BS in math and PhD in CS and have seen a lot of tech come and go, but there has been absolutely nothing like this my lifetime. Like Scott Aaronson I am losing patience with those denying this is real.\n\n    Anyway, yeah, tonight I’ll again raise my glass, I’ll pray that at the bottom of this terrifying rollercoaster lies a world that my children and I will be glad to inhabit, and I’ll mutter to myself the eternal words:"}, {"id": 50638390, "au": "outworlder", "dom": 70, "sr": 8, "sc": 6.8, "ep": 6.8, "bs": 0.0, "d": 1, "age": 6.88, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 7, "k": 15570, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.67, "fa": 0.42, "gp": 1.158, "bl": 0.0, "ds": 0.0, "txt": "> Is it sad to stop doing mathematics?\n\nMathematics is just a collection of conventions we have agreed upon to formalize _thinking_. We need a language that isn't English to describe and solve problems.\n\nIf we are no longer doing mathematics, we, as a species, aren't really thinking anymore. And if we are not, what's the point of anything?\n\nThis is very different than automating physical processes and products. And it's not like we are evolving into a Culture-like (Ian Banks) world, with the impossibly smart machines taking care of humans who can then go on to live their best life. Quite the opposite. And, not needing an educated population to continue with economic activity has, historically, been terrible. Just check any country that discovered vast natural resources.\n\nMind you, I don't think the premise is right. We will not stop 'doing mathematics'. I do not believe the current LLM approach will continue to scale. But, if I am wrong, and the machines actually become smarter than we are and take over mathematics, they will take over everything else in short order. We will become meat robots - at best."}, {"id": 50638640, "au": "beala", "dom": 19, "sr": 9, "sc": 6.75, "ep": 6.9, "bs": 0.0, "d": 0, "age": 6.21, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 724, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.509, "fa": 0.68, "gp": 0.977, "bl": 0.0, "ds": 0.0, "txt": "Some interesting comments from the blog:\n\nmatt Says:\nComment \u002322 November 24th, 2026 at 9:43 pm\nScott, odds that factoring is in P? If it is, odds that this is already proven? Of course there would be no paper.\n\nScott Says:\nComment \u002323 November 24th, 2026 at 9:48 pm\nmatt \u002322: I’ve now heard many, many rumors that one or both labs are sitting on Factoring in P. I don’t know how much to credit this. While I’m virtually certain that the labs are, indeed, sitting on one or more bombshells for cryptography, it’s possible that the exact nature of those bombshells has gotten distorted via a game of Telephone."}, {"id": 50638566, "au": "ks2048", "dom": 84, "sr": 10, "sc": 6.62, "ep": 6.62, "bs": 0.0, "d": 0, "age": 6.4, "grav": 46.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 0, "k": 5105, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": ["https://kalshi.com/markets/kxpnp/p-vs-np-resolution/kxpnp-32"], "ig": 1.112, "fa": 0.96, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "Just wondered if \"when will P vs NP be resolved\" is in betting markets. Found this,\n\nhttps://kalshi.com/markets/kxpnp/p-vs-np-resolution/kxpnp-32\n\nI don't do this kind of betting, but I'd put a long-shot bet on before 2027.\n\n(although if they require Clay Math Institute or something to declare it solved, that could take awhile)"}, {"id": 50639343, "au": "Jach", "dom": 153, "sr": 11, "sc": 6.57, "ep": 7.01, "bs": 0.0, "d": 4, "age": 4.26, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 11600, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.577, "fa": 0.68, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "FWIW, yours is the sort of flat-earther comment that is tiresome to interact with, because it just seems like you're living in an entirely different world. Your arguments are stale, but so too are various standard counter-arguments, and even many counter-counter arguments aren't new either; it's tiresome because the same sorts of arguments have gone back and forth in circles (largely because many are just word games, like what does it mean to \"know\" something or \"beat\" or \"solve problems\") but meanwhile the tools have kept improving and things are getting done, especially this year. Please just go spend some time with Opus 5.5. Is it perfect? No, but it's so incredibly better than whatever model you last used circa 2023 or 2024, and better than most humans at a large variety of things."}, {"id": 50639062, "au": "bigstrat2003", "dom": 146, "sr": 12, "sc": 6.35, "ep": 6.8, "bs": 0.0, "d": 3, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 71, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.34, "fa": 0.42, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "> What is real for me is that Claude/Codex knows more math than me (calculus, linear algebra, complex analyses, projective geometry, etc ...), more about all programming languages than me, more about all the software libraries and Frameworks I use (OpenCV, Eigen, CUDA, Vulkan, ARKit, ...), more about computer science (graphics, numerical computing, computer vision, theory, etc...).\n\nWell no, because no LLM knows a single thing. They can't. It's not how they work. So on any given subject, you know more than the LLM if you know a nonzero amount.\n\n> Solves problems better and faster than me.\n\nI doubt that very much. I have yet to encounter a person of reasonable intelligence who can't beat an LLM. They are quite stupid and bad at solving problems.\n\n> there is no point in me looking at code anymore.\n\nThere certainly is, if you want your software to be any good. LLMs routinely hallucinate APIs which don't exist, get logic wrong, and so on. You must review the code, or you will produce terrible work."}, {"id": 50637928, "au": "ggm", "dom": 53, "sr": 13, "sc": 6.22, "ep": 6.36, "bs": 0.0, "d": 0, "age": 7.97, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 30793, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.669, "fa": 0.28, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "When bodgers became redundant because machines made better chairlegs its true that a lot of forest dwelling bodgers lost their gig. But some of the best of them became the bespoke furniture makers they always wanted to be.\n\nMathematicians are going to have to morph into Their best version of something which leverages what they are great at, and what we need. Probably, its to contextualise and help the rest of us understand why it matters.\n\nIs it sad to stop doing mathematics? Only if you have the train spotter bug that lights up when doing it. If talking about mathematics, or inducting processes inside a soft machine which does it faster, or intruding if-but-maybe doesn't float your boat, then you can be like reductive monks who reject the modernisms brought into religion, and live according to your own lights the discipline you want:\n\nBourbaki doesn't need a machine, Bourbaki is the machine they want to be."}, {"id": 50638891, "au": "skydhash", "dom": 144, "sr": 14, "sc": 6.05, "ep": 6.49, "bs": 0.0, "d": 1, "age": 5.58, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 253, "qw": 12, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.717, "fa": 0.42, "gp": 0.868, "bl": 0.0, "ds": 0.0, "txt": "> Like Scott Aaronson I am losing patience with those denying this is real.\n\nBut what exactly is real? It seems that no one can articulate it clearly, either fearing the monster in the dark, or looking at some invisible paradise.\n\nBut I think my struggle with hypers is how they’re purposefully maintaining their ignorance in order to give weight to their arguments. They have no drive to understand anything they put out and they either expect you to accept the work as is, or to spend your mental energy to decipher it.  This quickly drain any intellectual energy out of any discussion.\n\nI don’t have any PHD but I’ve read a few papers. What I’ve seen is a motivation to explain an idea or a fact the authors have discovered. Not to merely show that it has been discovered.\n\nI like programming not because of the end result. If I did, I would just buy licenses and subscriptions because there’s a lot of software out there and it would be cheaper than spending hours on code. Just like the easiest way to go from A to B is to be driven (taxi or your own chauffeur).\n\nI like programming because I can see the machinery, design it, and control it. Sometimes it feels like driving commercial trucks (minimal control and preplanned routes), other times it’s like doing a cruise in your favorite car (total freedom).\n\nI do agree with Linus that a patch of code needs to be judged by its technical merits"}, {"id": 50640935, "au": "intended", "dom": 97, "sr": 15, "sc": 5.83, "ep": 5.83, "bs": 0.0, "d": 6, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.645, "fa": 0.28, "gp": 0.802, "bl": 0.0, "ds": 0.0, "txt": "I'll push back and argue that this is the wrong model to apply here.\n\nIt puts an absolute baseline (the number of vulns discovered) for an issue of relative change (velocity to generate code, mechanically identify weaknesses and exploit them).\n\nIn a world without AI, the rate at which exploits could be found and used, the degree of complexity, was much lower.\n\nWith AI, the generation velocity has increased, and detection has increased, complexity has increased.\n\nThe tradeoffs that make it worse are that we are losing faith that someone can actually keep a model of the system in their heads. The current velocit vs understanding debate."}, {"id": 50639303, "au": "wat10000", "dom": 151, "sr": 16, "sc": 5.8, "ep": 6.24, "bs": 0.0, "d": 4, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 7038, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.411, "fa": 0.34, "gp": 1.35, "bl": 0.0, "ds": 0.0, "txt": "Opus 5.5 will absolutely destroy me at things like disassembly analysis. Give it a crash caused by a suspected compiler bug and it will pinpoint the bad codegen in 10 minutes when it would take me hours, and I’m pretty good at this sort of thing.\n\nI’m curious, what’s the most advanced model you’ve used? I suspect people saying stuff like this haven’t used anything more recent than circa GPT-4o and don’t realize their experience is tremendously obsolete."}, {"id": 50640518, "au": "nly", "dom": 15, "sr": 17, "sc": 5.78, "ep": 5.93, "bs": 0.0, "d": 1, "age": 1.17, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 11524, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.709, "fa": 0.62, "gp": 0.102, "bl": 0.0, "ds": 0.0, "txt": "This is just computing in general though isn't it though?\n\nOr any automation.\n\nDishwashers wash dishes slowly, over hours, and in the most brain-dead way imaginable...but they do it asynchronously without human intervention. Perfect.\n\nComputers take the long, expensive  and exact way to solve simple problems where a human would just guess and it'd be fine...but they'll do it a trillion times a second so it doesn't matter.\n\nAn LLM might not solve a single problem how a human engineer prefers, but it can potentially close 100 JIRAs over a weekend and exhaustively run fuzz and regression tests where a human would call it a day and end up chasing failing tests and code reviews for a couple of weeks\n\nIt hurts as an engineer but exactness often doesn't matter as much as throughput"}, {"id": 50639197, "au": "peri-cl", "dom": 29, "sr": 18, "sc": 5.63, "ep": 5.92, "bs": 0.0, "d": 3, "age": 4.6, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 2248, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.674, "fa": 0.0, "gp": 1.371, "bl": 0.0, "ds": 0.0, "txt": "They should disclose it immediately, to give people as much time as available to transition to post-quantum algorithms. (Disclosing that it exists doesn't necessitate immediately publishing how it works).\n\nDelaying disclosure risks the algorithm leaking or being independently re-discovered, and then ransomware attacks on hospitals.\n\nIt's not possible to keep math secret, even if you believed it to be ethical. Today's frontier supercomputer math will be next year's laptops running Qwen."}, {"id": 50639005, "au": "zodiac", "dom": 165, "sr": 19, "sc": 5.42, "ep": 6.08, "bs": 0.0, "d": 2, "age": 5.28, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 14, "k": 1934, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.688, "fa": 0.42, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "> But what exactly is real? It seems that no one can articulate it clearly\n\nThe linked blog post seems to articulate its position pretty clearly, which is that AI has produced a correct proof that VP≠VNP. (Relevant quote: \"If recent experience is any guide, this will not prevent boatloads of morons from denying that AI could possibly have solved these problems, and latching onto anything whatsoever ... to declare the proofs to be fallacious\")\n\nLooking at the blog overall, there is a broader thesis that AI is now superhuman at solving well-posed open problems in Math and TCS. That also seems pretty clearly articulated to me."}, {"id": 50640853, "au": "cimi_", "dom": 171, "sr": 20, "sc": 5.34, "ep": 5.56, "bs": 0.0, "d": 3, "age": 0.29, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 38, "k": 491, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.339, "fa": 0.42, "gp": 0.835, "bl": 0.0, "ds": 0.0, "txt": "> So it's not about what they do, but how they do it? It seems even more silly.\n\nNo, it's about understanding. A mountain of slop you can't understand that in the end tells you that something's true or not is less valuable than a reasoning chain you can follow that takes you to the same result.\n\nWe're lucky that we still have people that can verify and steer this, but if the machine always wins the incentive to spend your life doing math becomes not great, and that's scary. I think this applies to all science, if we offload research to AI and produce less or no scientists what happens then?\n\n> It makes more sense that way I guess. I, for one, welcome our new AI overlords, and I can't wait to be rendered obsolete :D\n\nWhat's stopping you now from being rendered obsolete? I'm sure you can get there if you try, you don't need GPT 7"}, {"id": 50638894, "au": "defrost", "dom": 65, "sr": 21, "sc": 5.16, "ep": 5.45, "bs": 0.0, "d": 5, "age": 5.58, "grav": 38.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 69, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": ["https://www.abc.net.au/news/2015-11-27/drum-maker-to-the-stars-chris-brady-hangs-up-his-tools/6979668", "https://www.bradydrums.com.au/"], "ig": 0.824, "fa": 0.9, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "It's still alive as a craft where there are old growth forests and gazbillionaires and their trust funded offspring in abundance .. south west corner of Western Australia, for example - crafted jarrah / karri / sheoak et al board room tables go for a goodly sum.\n\nThere was even coin to be made as a bespoke drum kit maker, sought after and fought over by all the major touring hair and art bands of a generation:\n\n* https://www.abc.net.au/news/2015-11-27/drum-maker-to-the-sta...\n\n* https://www.bradydrums.com.au/"}, {"id": 50638948, "au": "gizmodo59", "dom": 176, "sr": 22, "sc": 4.83, "ep": 5.05, "bs": 0.0, "d": 1, "age": 5.43, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1235, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.46, "fa": 0.28, "gp": 0.562, "bl": 0.0, "ds": 0.0, "txt": "My taken on deniers is on the following scale:\n\n1. People within AI labs (includes researchers) who are shocked by the advancements.\n2. People outside the labs but are technical (say software engineers).\n3. Intellectual workers who use AI for their work\n4. Everyone else who used some AI in their daily life\n5. People who have never used AI\n\nHN falls in 2 for the most part. I’d put mathematicians there too."}, {"id": 50640984, "au": "stereolambda", "dom": 152, "sr": 23, "sc": 4.81, "ep": 5.69, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 7.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 276, "qw": 0, "k": 701, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.901, "fa": 0.0, "gp": 0.844, "bl": 0.0, "ds": 0.0, "txt": "Not sure philosophical discussions about semantics are that interesting if the other people want to talk abut practical impact. I mean yeah, I'd also be careful with putting an LLM as an active subject in a sentence, but people rarely use precise language.\n\nI think your strongest point is that LLMs structurally lack fuzzy common sense. This is because of that life experience is hard to articulate in language as rules, and often rules that are articulated obfuscate. A human may know from experience where to use an unofficial shortcut, or where an apparently sure way isn't actually reliable. Also you have the problem of having multiple levels of different goals, considerations etc. where you have to be very careful about overoptimizing for the very low or very high level. In other words, focus on the immediate context can be harmful.\n\nThis doesn't prevent LLMs from excelling in being used for anything where sufficient \"guardrails\" can be defined, and you have funds for firing the slop machine gun full speed. Math is almost exclusively that. Programming has a lot of a mix of decisions that require common sense and ones that can be judged objectively. In that sense I can see how you can reach both conclusions on LLMs vs. programming.\n\nBut to be fair, for practical economy the slop machine gun approach can win anyway. Though I think in the long run we'll have to either strongly impr"}, {"id": 50638943, "au": "AngryData", "dom": 56, "sr": 24, "sc": 4.77, "ep": 5.43, "bs": 0.0, "d": 3, "age": 5.45, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 0, "k": 5139, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.781, "fa": 0.0, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "So what machine can identify the shape, size, and direction of wood grain and adjust how it cuts that piece of wood as the blade travels through the log to accommodate it? Nobody is doing CT scans of logs to cut it perfect with the grain pattern. So you need split wood, and where would they even buy wood split down the grain instead of cut on a saw? You might find 1 out of 20 pieces of sawn lumber that has straight enough grain to find an uncut grain pattern.\n\nWhat machine will identify crooked grain and pull that piece out of the production line to heat bend the grain straight before putting it back in the lathe?\n\nOh sure it may be technically possible somehow, but how much would that cost? Which then brings us back to the original problem of that design of chair costing an absurd amount, might as well have it hand made again at such an expense.\n\nIf you don't believe me, just google \"windsor chair\" and look at the images of old chairs and see how thin the wood members are. Now go look at shopping results for \"windsor chair\" and tell me how many you can find that are anywhere near that thin?"}, {"id": 50639076, "au": "alwa", "dom": 57, "sr": 25, "sc": 4.57, "ep": 5.45, "bs": 0.0, "d": 4, "age": 5.03, "grav": 33.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 232, "qw": 0, "k": 4237, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.767, "fa": 0.0, "gp": 0.896, "bl": 0.0, "ds": 0.0, "txt": "As a tremendously bodger-sympathetic individual—and one who spends what limited surplus income I get on buying from humans rather than machines every time—\n\nI agree: people seem perfectly happy with flat-pack particleboard and moulded plastic. They’re especially happy that a chair’s cost makes it basically disposable.\n\nYou and I are not.\n\nEven if someone were to dial in the machines to mimic those human skills, so that we could achieve those craftsmanly outcomes like impossibly tiny spindles—you and I would probably appreciate the technical achievement, but would we want to live in relation with the resulting objects in our homes?\n\nOr would we still prefer the sort of object that embodies human craft and expertise?\n\nThe mass market is seeking an acceptably-normal-looking thing to sit on. We’re seeking something else. It’s not that the machines couldn’t, it’s that we wouldn’t want it even if they did. At least at the price it would take…\n\nThat’s the old dynamic, though, right? There’s still a cost to build the tooling, to cast the molds—everything you proposed uses tech that probably could do it, but it’s not worth it to get machines involved (or the humans it would take to perfect the mechanized production process).\n\nLooking around my house, though, at all the little bits of automation I’ve done now that code, compute, sensors, and actuators are all ~free… feels like that balan"}, {"id": 50638990, "au": "waynecochran", "dom": 145, "sr": 26, "sc": 4.55, "ep": 5.43, "bs": 0.0, "d": 2, "age": 5.31, "grav": 35.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 2817, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.773, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "But what exactly is real? \n\nWhat is real for me is that Claude/Codex knows more math than me (calculus, linear algebra, complex analyses, projective geometry, etc ...), more about all programming languages than me, more about all the software libraries and Frameworks I use (OpenCV, Eigen, CUDA, Vulkan, ARKit, ...), more about computer science (graphics, numerical computing, computer vision, theory, etc...). Solves problems better and faster than me.\n\nI just talk English with an AI to do my work now. I occasionally have to put on VR googles, etc... to test things, but I have even discovered I can put them on a mannequin head and Claude can look at the results and test the output itself! Holy Crap!\n\nIt tests things far better than I can. It uses skeptical and antagonists AI's to test code -- there is no point in me looking at code anymore.\n\nIt's over. Life as I know it."}, {"id": 50639750, "au": "throw310822", "dom": 23, "sr": 27, "sc": 4.44, "ep": 4.88, "bs": 0.0, "d": 2, "age": 3.23, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3690, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.49, "fa": 0.34, "gp": 0.281, "bl": 0.0, "ds": 0.0, "txt": "Plot twist: cryptography is broken so in the singularity all payments and communication of confidential information must be done in person and on paper- and suddenly it's 1980 again! Bank offices reopen, mall and local shops thrive, long queues at government offices!"}, {"id": 50639646, "au": "jibalt", "dom": 20, "sr": 28, "sc": 4.06, "ep": 4.5, "bs": 0.0, "d": 1, "age": 3.46, "grav": 21.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.209, "fa": 0.28, "gp": 0.597, "bl": 0.0, "ds": 0.0, "txt": "As with proving RH, proving that factoring is in P would not have any practical consequences. If, as some confused people imagine, proving that factoring in P allows one to break cryptography, then one could simply assume that factoring is in P and then go break cryptography.\n\nProofs don't yield algorithms, they only verify algorithms already in hand. Maybe the labs have found a polynomial-time algorithm that breaks cryptography, but that's a totally different subject. Knuth thinks that NP = P and that therefore there is such an algorithm, but the constants are immense and so the algorithms aren't usable."}, {"id": 50639215, "au": "petesergeant", "dom": 114, "sr": 29, "sc": 3.97, "ep": 4.78, "bs": 0.0, "d": 2, "age": 4.54, "grav": 29.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 4, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.728, "fa": 0.0, "gp": 0.497, "bl": 0.0, "ds": 0.0, "txt": "> I very sincerely doubt that\n\nI am currently doing security triage for an old product with many bugs. The developers who check, plan, and execute their work with AI and  are usually one-shotting the reports I assign them. The ones who do it by hand and use AI as a better Google keep needing their reports returned to them because they haven’t fixed the whole issue.\n\nIn my own work, I am far, far passed thinking that work I’ve hand-crafted is going to be objectively better than work I’ve meticulously planned with an agent, let the agent handle, and run adversarial multi-agent review on. Maybe aesthetically better? You can absolutely generate garbage with AI but the people doing it were generating garbage using their fingers beforehand.\n\nIf you haven’t got a workflow that uses AI to improve upon what you were doing by hand before, that’s a skill issue."}, {"id": 50639306, "au": "intended", "dom": 45, "sr": 30, "sc": 3.95, "ep": 4.84, "bs": 0.0, "d": 2, "age": 4.33, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.746, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "“Flood the zone” achieves control by providing a surfeit of information. The target is the ability to process and understand.\n\nHN conversations, in my experience, near exclusively recognize information control as a threat.\n\nThe sophistication in discussion on the more prevalent, modern, attacks on the information marketplace/commons is absent.\n\nAttack and control strategies today focus on reducing the ability to process information, or to have accurate information in the first place."}, {"id": 50639148, "au": "mkl", "dom": 76, "sr": 31, "sc": 3.87, "ep": 4.68, "bs": 0.0, "d": 1, "age": 4.79, "grav": 31.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 13638, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.377, "fa": 0.28, "gp": 0.443, "bl": 0.0, "ds": 0.0, "txt": "Discovering novel theorems is trivial (there are an infinite number of them which can be enumerated systematically), but discovering useful novel theorems is quite different. In these big AI proofs many novel theorems are discovered and proved as steps towards the main result (like helper functions), so those are novel theorems which are useful by some definition.\n\nMost of the ones in the news are proofs of existing conjectures, which become theorems once they're proved. \"Conjecture\" is a fancy word for guess, but the conjectures that become known tend to have quite a bit of evidence in their favour (and no solid evidence against, as a single counterexample proves it false)."}, {"id": 50638784, "au": "doctoboggan", "dom": 107, "sr": 32, "sc": 3.57, "ep": 4.74, "bs": 0.0, "d": 1, "age": 5.86, "grav": 40.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 8, "k": 7296, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.833, "fa": 0.76, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "> it's unclear how long this period will last.\n\nPessimistically, 2-3 years, optimistically, 10-15 IMO. Hopefully you've been saving money or you have a partner with an AI proof job (if that even exists...)"}, {"id": 50640838, "au": "jmusall", "dom": 7, "sr": 33, "sc": 3.33, "ep": 3.84, "bs": 0.0, "d": 3, "age": 0.35, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 269, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.597, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Yes, but it's possible to verify software in a similar way to mathematical theorems (some theorems in fact are essentially algorithms proven to yield the correct result). The advantage in math is that it has been constructed from a few axioms and every step of the way has been formally verified. For software, I don't think it will be possible to create a fully verified stack of dependencies any time soon (at some point you reach hardware level and you'd have to prove that no software-controlled hardware exploit like Rowhammer is possible), but maybe there exists a reasonable set of axioms upon which provably correct/secure algorithms can be built."}, {"id": 50638691, "au": "reasonableklout", "dom": 182, "sr": 34, "sc": 3.28, "ep": 4.38, "bs": 0.0, "d": 1, "age": 6.1, "grav": 43.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2528, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.193, "fa": 0.34, "gp": 0.421, "bl": 0.0, "ds": 0.0, "txt": "Guess 99.999999% of humans are not truly intelligent. And it turns out brute force is enough to carpet-bomb an entire field and solve problem after decades-old unsolved problem at the frontier of human intellectual knowledge."}, {"id": 50638496, "au": "petesergeant", "dom": 86, "sr": 35, "sc": 3.14, "ep": 4.24, "bs": 0.0, "d": 0, "age": 6.62, "grav": 48.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.365, "fa": 0.22, "gp": 0.28, "bl": 0.0, "ds": 0.0, "txt": "I think we're currently _all_ trying to figure out what this means. I haven't written a line of code in months, and I'm producing some of my finest work, despite having been a distinctly capable developer beforehand.\n\nI am greatly enjoying this period of being able to add a lot of value to what AI produces, but it's unclear how long this period will last. In two years, will I really still be a value-add?"}, {"id": 50639745, "au": "jillesvangurp", "dom": 82, "sr": 36, "sc": 3.07, "ep": 3.95, "bs": 0.0, "d": 1, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 198, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.568, "fa": 0.0, "gp": 0.182, "bl": 0.0, "ds": 0.0, "txt": "Not really, it still needs nerds (i.e. highly trained, skilled, and slightly obsessive experts) to appreciate and understand what AI does here. And without anyone doing that, why would AI bother to do those things? It only does those things because nerds ask for those things. Without nerds, it all grinds to a halt almost immediately. It's not like some empty headed manager is going like \"go solve that Riemann math thing for me please and get me some peanuts\".\n\nIf that's your main worry, relax. It's going to be fine. And it's not like we humans were making a lot of progress solving these hard problems. We've gotten to the point where lots of people were thinking about solving problems like this, without actually solving them. Now we have tools to reach beyond our capabilities. What shall we solve next?\n\nAs for status and privilege, these problems have economic value and the drive from solving them comes partially from that. That did not go away. And to solve these problems you still need highly trained, skilled, and slightly obsessive experts (i.e. nerds) asking the right questions and doing the right things. The whole AI revolution doesn't actually work without nerds."}, {"id": 50638861, "au": "kbenson", "dom": 43, "sr": 37, "sc": 3.02, "ep": 3.9, "bs": 0.0, "d": 3, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 294, "qw": 0, "k": 31684, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.115, "bl": 0.0, "ds": 0.0, "txt": "What would the alternative look like? How would they choose who to disclose to first, and why those parties instead of other parties? How long would they get?\n\nThere's the option of never disclosing, there's the option of disclosing immediately, and then there's choosing some level between that, and mixing the pros and cons of those in a way that's hopefully more beneficial than either of the extremes, but I'm not sure how something this bit and important can be handled better by going half way for a time. All you're doing is giving immense power to anyone that knows at the expense of every single person that doesn't.\n\nIf I was naive I would say give it to the government first, but I think there's enough incentive to a few actors without enough oversight that it would be abused while it could, whether departmentally or from singular actors. I don't think large corps are much more trustworthy in that respect. All it takes is one person that wants to cash out. Either everyone gets to put as much effort in as possible as soon as possible, or some people get a head start and take advantage of the rest.\n\nEdit: At most, I could see announcing that you've broken existing crypto and give a week at most to fix, and giving the details to nobody else, other than what isn't broken. It's possible someone could re-tread the work but a week's not a lot of time, and that gives people time to m"}, {"id": 50639801, "au": "dwb", "dom": 110, "sr": 38, "sc": 3.02, "ep": 4.12, "bs": 0.0, "d": 2, "age": 3.06, "grav": 18.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 1294, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.267, "fa": 0.34, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "The code I produce with LLMs at work is at least as good as what I produced by hand. I know this because I review it, one or more of my colleagues review it, and now it’s run for a while to see if it works well or not. Stability of our app is up, bug finding and fixing time is down, quality is up overall. There’s no 10x the hype merchants were on about, but you’d be a fool to believe them, and the quality gains are real. Responsible use of LLMs and reckless vibecoding are quite different."}, {"id": 50639626, "au": "nullc", "dom": 58, "sr": 39, "sc": 2.69, "ep": 4.01, "bs": 0.0, "d": 4, "age": 3.49, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 15, "k": 19256, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.149, "fa": 0.42, "gp": 0.08, "bl": 0.0, "ds": 0.0, "txt": "> Nobody is doing CT scans of logs to cut it perfect with the grain pattern.\n\nLogs are CTed to find defects to optimize cutting patterns for yield today.\n\nI'm not aware of anyone using that approach to follow grain and make odd shaped grain following pieces, but I assumed that's only because doing so would lower yield and thus profit-- a commercial choice."}, {"id": 50639423, "au": "physicles", "dom": 115, "sr": 40, "sc": 2.66, "ep": 3.98, "bs": 0.0, "d": 3, "age": 4.08, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1820, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.632, "fa": 0.0, "gp": 0.101, "bl": 0.0, "ds": 0.0, "txt": "I’m feeling the same. I was a pretty good programmer (taught myself when I was 9 and never stopped), but sometime this summer I realized that AI was writing fewer bugs than I generally would. It is far more patient and thorough at refactoring and QA, and orders of magnitude faster at log spelunking.\n\nIt’s a huge boon, even before taking into account the fact that my team is tiny and we never had enough time to do great work.\n\nStill kinda sucks at medium and large scale design though."}, {"id": 50639224, "au": "globular-toast", "dom": 169, "sr": 41, "sc": 2.65, "ep": 3.9, "bs": 0.0, "d": 1, "age": 4.5, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.391, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think what they are struggling with is what \"doing maths\" really is. These LLMs are producing proofs. Now whether you can say a system is \"good at\" producing proofs when it costs millions each time is up to you, but producing proofs isn't the only thing mathematicians do. Getting to a proof was a journey. Fellow mathematicians would study the great proofs of others. It's unclear what value these generated proofs are really adding, though. They could just be squeezing all the air out of the room, essentially maxing out our current capabilities and leaving very little incentive to continue progress."}, {"id": 50638637, "au": "twodave", "dom": 181, "sr": 42, "sc": 2.65, "ep": 3.89, "bs": 0.0, "d": 0, "age": 6.22, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 3147, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.417, "bl": 0.0, "ds": 0.0, "txt": "I’m not surprised an LLM was able to hack out these things via more or less brute force. What would surprise me more is if they took some novel approach. As long as they’re still borrowing all their first principals from their training I hesitate to call this true intelligence, which I think of as an ability to intuit, not just apply existing knowledge to cover a surface area.\n\nThat said, who knows where the line really is? We are living in exciting times."}, {"id": 50640168, "au": "cyberax", "dom": 49, "sr": 43, "sc": 2.5, "ep": 3.6, "bs": 0.0, "d": 3, "age": 2.02, "grav": 12.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 7233, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.534, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A fast factorization algorithm will almost certainly lead to a fast discrete log algorithm. The underlying problems are similar, so it would be even more stunning if you could do one but not another.\n\nHeuristically, Shor's quantum algorithm solves both. And so far, Shor's algorithm remains one of the few examples of exponential speedups for quantum computers for algorithms that don't involve simulating quantum behavior.\n\nSo it kinda _is_ suspicious."}, {"id": 50640138, "au": "jmusall", "dom": 5, "sr": 44, "sc": 2.5, "ep": 4.04, "bs": 0.0, "d": 1, "age": 2.11, "grav": 12.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 269, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.629, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "I think the reason LLMs are powerful both in mathematics and software engineering is that in both disciplines there are ways to deterministically prove something (theorem, compiler input) to be correct. This counteracts the random nature of LLMs and coupled with their speed enables convergence toward a desired result even if the LLM is not \"smart\" enough to solve the problem immediately.\n\nOf course in software, correctness of something like an algorithm is sometimes not well-defined because not all edge cases have been considered. Maybe we can finally have bug free code at some point in the future by letting agents formally verify their algorithms."}, {"id": 50638650, "au": "RealityVoid", "dom": 55, "sr": 45, "sc": 2.37, "ep": 3.91, "bs": 0.0, "d": 2, "age": 6.19, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 10, "k": 3904, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.155, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> To nitpick your example, did machines make better chair legs?\n\nYes, machines can make better everything. They have access to much mice information that we can, sift through it much faster, have much more consistent output, much more precise control. It comes with a cost, and the and the final product is only as good as the guidance you can give to it, and the setup of the machine is much more expensive than making a thing yourself.\n\nBut machines make better things."}, {"id": 50639340, "au": "intended", "dom": 74, "sr": 46, "sc": 2.21, "ep": 3.75, "bs": 0.0, "d": 1, "age": 4.26, "grav": 27.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.598, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We can jump ahead in this conversation, and agree that machines reduce costs, and in some places even improve cost and quality.\n\nWhat they predominantly manage to achieve is the reallocation of profit from labour to capital.\n\nThis is fine, frankly. The way profit gets allocated is an issue when we concern ourselves with how humanity at large benefits.\n\nWhich is always the underlying question at play. How does this change benefit the people displaced and the rest of humanity.\n\nHow does proving a theorem faster, while depriving the chance for human minds to work on it, benefit the rest of humanity."}, {"id": 50639093, "au": "black_knight", "dom": 66, "sr": 47, "sc": 2.21, "ep": 3.75, "bs": 0.0, "d": 1, "age": 4.98, "grav": 33.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "I see how people think this would be the downfall of human mathematics. But I don’t think it is.\n\nMathematics is not a spectator sport. The goal is (human) understanding. Maybe because school portraits it as a competition to solve exercises, people think otherwise. But the exercises are only a means to an end. We do mathematics to understand abstract concepts. Our method is posing theorems which are meaningful to us and finding proofs of them.\n\nThus, it does not matter how the proofs come about, as long as they contribute to human understanding.  The project of maths continues.\n\nMathematics isn’t solved, it never will be. We know that LLMs are not oracles (Gödel says hello), thus there will be problems even they can’t solve. But we will invent new theories, new problems to solve (using our brains and LLMs) for many years to come."}, {"id": 50640662, "au": "keybored", "dom": 12, "sr": 48, "sc": 2.15, "ep": 3.69, "bs": 0.0, "d": 3, "age": 0.8, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 9, "k": 2352, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.059, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You could make up whatever a priori theories you want to. But some theories are “useful” or “elegant”. Why useful? For some other mathematical purpose. In turn is that useful? Maybe for some other mathematical purpose.\n\n> Requirements are defined by the people, for the people.\n\nIn the sense that we are all people, but some people are more people than other people.\n\nSome programs and their requirements are useful. For what purpose? For some other programming goal. Are they still useful for agents? Maybe, or maybe it’s just a needless detour."}, {"id": 50640463, "au": "lg5689", "dom": 149, "sr": 49, "sc": 2.14, "ep": 3.68, "bs": 0.0, "d": 4, "age": 1.28, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 135, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.077, "fa": 0.28, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "Can you clarify what your definition of \"knowing things\" and \"solving problems\" means? Because I think most people would assume getting perfect scores on some of the hardest math problems humans can write, the FrontierMath benchmark, would require a bit of those things."}, {"id": 50639998, "au": "amritananda", "dom": 163, "sr": 50, "sc": 2.11, "ep": 3.65, "bs": 0.0, "d": 7, "age": 2.55, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 53, "k": 129, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.704, "fa": 0.7, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But the commenter said:\n\n> The reviewer go and notice some lack of fundamental knowledge, but the author is uninterested in learning more and revise his thinking. No one wants to interact with a meat proxy even if the latter is willing to shell out dollars to AI companies (likely) or build expensive computers to host local models (outliers).\n\nThis is true even today. And for the record I use Opus and Fable (along with Neon + Hydrogen as backup/adversaries) and have multiple agent swarms running throughout the day. Even then I skim (and sometimes actually read through critical sections) because at the very least, in brings in more questions about the overall goal or design that I'm trying to achieve. Occasionally I encounter a one or two bugs, mostly related to the specification of the problem, but sometimes closer to the code itself."}, {"id": 50639027, "au": "onetimeusename", "dom": 68, "sr": 51, "sc": 2.08, "ep": 3.62, "bs": 0.0, "d": 1, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 2074, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.443, "fa": 0.0, "gp": 0.16, "bl": 0.0, "ds": 0.0, "txt": "Athletes compete against humans, not machines. No one asks athletes to compete against machines. It ruins the fun I guess.\n\nIt was fun solving problems. Solutions to many of these problems do not have lives at stake at all or anything close to that. There's not a moral reason to find proofs quicker. I guess at this point it doesn't matter because AI labs have shown they're only concern is Superintelligence.\n\nI think there was more to it than just collecting theorems. The challenge is part of it. Some problems were significant only because they were hard to figure out. If every problem is easy, I think it becomes harder to find what's worth studying."}, {"id": 50640347, "au": "skrebbel", "dom": 16, "sr": 52, "sc": 2.03, "ep": 3.13, "bs": 0.0, "d": 0, "age": 1.57, "grav": 9.9, "surf": 6.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 37501, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.043, "bl": 0.0, "ds": 0.0, "txt": "It just occurred to me that if AI had been around for a decade, and Lean was new, we're be saying that \"Lean solved these problems\" and not AI.\n\nClearly the fact that we've got such a powerful and expressive theorem prover is the only reason AI (a perpetual guesser) is able to do advanced math at all (exactly like with nontrivial coding tasks and automated tests). The checker is just as key to the result as the guesser."}, {"id": 50640425, "au": "queeerkopf", "dom": 21, "sr": 53, "sc": 1.91, "ep": 3.45, "bs": 0.0, "d": 2, "age": 1.38, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 4, "k": 218, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "> Proofs don't yield algorithms\n\nI think this is false. If it's a fully formalized proof one can get a computational program out of it. Look up 'program extraction from proofs'. The catch is that the properties of the resulting program depend on the exact mathematical statements and also the exact proof, e.g. whether it's fully constructive or relies on classical mathematics. I'm not up to date on this field, haven't looked at this for many years. So that's why I'm vague here and point to looking it up yourself if you're interested in the details. I can't judge at the moment how practical this is, especially for very large proofs."}, {"id": 50639150, "au": "skydhash", "dom": 166, "sr": 54, "sc": 1.88, "ep": 3.42, "bs": 0.0, "d": 3, "age": 4.78, "grav": 31.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The thing is that till this days, we have no indication of the costs to produce such proofs. And whether the result is actually worth the costs. The niceties about such puzzles are the happy accidents like complex numbers, the Turing machine, and maybe other mathematical and logical concepts that I don't know about. The actual answer doesn't matter as much as the ideas behind them.\n\nI don't know a lot about math, but my doubt is more inline like the proof is using a naive approach (like quadratic sort) but missing some good shortcuts (like quicksort) which would have been useful somewhere else."}, {"id": 50638706, "au": "andsoitis", "dom": 88, "sr": 55, "sc": 1.87, "ep": 3.41, "bs": 0.0, "d": 2, "age": 6.07, "grav": 42.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 5, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.792, "fa": 0.42, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "> It's not your work though.\n\nWhat's your definition of \"work\"?\n\nMy working definition is work is when you exert effort to produce inputs into a system that yields some output.\n\nWhat counts as input can be pretty broad, as long as it is intentional."}, {"id": 50640004, "au": "sho_hn", "dom": 13, "sr": 56, "sc": 1.87, "ep": 3.2, "bs": 0.0, "d": 1, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 15001, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "It's a mix of things.\n\nOn the one hand, as soon as you have a machine that can do certain human-like tasks, you can replicate that, scale it up and run it 24/7, unlike with humans.\n\nOn the other hand, LLMs have cognitive properties that make them different from humans, both worse at some things and better at some things. For knowledge work in particular, the large context windows they can one-shot over are surely a great boon."}, {"id": 50639372, "au": "intended", "dom": 94, "sr": 57, "sc": 1.87, "ep": 3.19, "bs": 0.0, "d": 3, "age": 4.2, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.016, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is pretty much the question the debate hinges on.\n\nI’d rather argue that there are 2 different products being sold right now, which should be under two different labels.\n\n1) Old S/W - where you have assumptions on how much the authors understand and can take responsibility for the code\n\n2) New S/W - where it is built much faster, iterated faster, but old assumptions on liability, understanding, and responsibility for code don’t apply.\n\nA mountain of semantic difference being hidden under the word “work”"}, {"id": 50639296, "au": "miki123211", "dom": 40, "sr": 58, "sc": 1.87, "ep": 3.11, "bs": 0.0, "d": 5, "age": 4.35, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Their CEO would have a New York times article published about them, alleging affairs with a Chinese Spy.\n\nNow if they gave that algorithm to the NSA instead... they would perhaps be rewarded with that article being published about somebody else.\n\nI do not have any non-public information. This is a joke."}, {"id": 50640749, "au": "perching_aix", "dom": 22, "sr": 59, "sc": 1.87, "ep": 3.07, "bs": 0.0, "d": 2, "age": 0.59, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 15, "k": 2994, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 0.798, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> If, as some confused people imagine, proving that factoring in P allows one to break cryptography (...)\n\nConfused person here. Isn't it that a nonconstructive and/or galactic proof is indeed not gonna break any crypto, but a constructive and nongalactic one very much so? So that it's a lot more of an \"it depends\" rather than the \"absolutely not\" that I took away from your comment?"}, {"id": 50638585, "au": "ggm", "dom": 71, "sr": 60, "sc": 1.87, "ep": 3.04, "bs": 0.0, "d": 2, "age": 6.36, "grav": 45.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 30793, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.082, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "I like the \"whats the point\" which is a line of reasoning attributed to Churchill about defending the arts in wartime. He didn't actually say it, but it resonates.\n\nPeople should continue to do maths, because its true and beautiful. If you want it done by a machine, then fine. It's still beautiful but less human."}, {"id": 50639026, "au": "black_knight", "dom": 78, "sr": 61, "sc": 1.87, "ep": 3.04, "bs": 0.0, "d": 1, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is a very good question.\n\nAppreciating a good Theorem sort of requires a human. I don’t know of an objective measure of “how good” a Theorem is. Thus, it is hard to train on. Maybe it is something which would fall out as a side effect of other capabilities. But there seems to be a division of human mathematicians too, between good problem solvers and good theory builders."}, {"id": 50640666, "au": "g-b-r", "dom": 113, "sr": 62, "sc": 1.87, "ep": 3.01, "bs": 0.0, "d": 3, "age": 0.79, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 33, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.771, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> How very obnoxious. One can be sure that he is a better judge of what he is producing than you are\n\nSure, AI psychosis (not the cases of that user, if he reviews everything) makes you even more objective\n\n> The rest of us have seen what you are claiming hasn't been seen.\n\nThe rest of us would be you?\n\nI don't really want to debate, though"}, {"id": 50639086, "au": "skydhash", "dom": 159, "sr": 63, "sc": 1.87, "ep": 3.82, "bs": 0.85, "d": 3, "age": 5.0, "grav": 33.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 1.625, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "As I said, you are forcing yourself in a state of ignorance. I don't know everything that is in a calculus textbook, or everything about the python language. But it's not necessary and never has been. That's why we have books. What is valuable is understanding and the ability to reason.\n\nAll of these stuff we established by humans and then their understanding transferred to us (or in a form more immediately usable). Imagine no one learns about maths, where do you think the next numpy or matlab will come from?\n\nThat is why most code generated by AI is shot down. The reviewer go and notice some lack of fundamental knowledge, but the author is uninterested in learning more and revise his thinking. No one wants to interact with a meat proxy even if the latter is willing to shell out dollars to AI companies (likely) or build expensive computers to host local models (outliers)."}, {"id": 50640028, "au": "ketzu", "dom": 48, "sr": 64, "sc": 1.87, "ep": 2.92, "bs": 0.0, "d": 2, "age": 2.45, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1679, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_fast", "flbl": "Algorithm & Fast (Cryptography)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IMO Without a fast algorithm for discrete log that would mostly push the rest over to EC crypto solutions before moving to post-quantum. But EC has been preferred for a while for performance and size already."}, {"id": 50640246, "au": "bronlund", "dom": 170, "sr": 65, "sc": 1.87, "ep": 2.8, "bs": 0.0, "d": 2, "age": 1.82, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 428, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So it's not about what they do, but how they do it? It seems even more silly.\n\nI mean; it then sounds to me that the mathematicians who are against this new way of doing math, are not really concerned about the math, but about their living. Like a guy digging ditches with a shovel protesting against the use of excavators, with no concern about the number of ditches dug.\n\nIt makes more sense that way I guess. I, for one, welcome our new AI overlords, and I can't wait to be rendered obsolete :D"}, {"id": 50640050, "au": "Mikhail_Edoshin", "dom": 72, "sr": 66, "sc": 1.87, "ep": 2.79, "bs": 0.0, "d": 2, "age": 2.38, "grav": 14.3, "surf": 3.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1023, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Math is a formal model of a subset of perceived properties of the world. It is basically what we think the world is if we ignore all differences among things except the distinctness itself, which is a prerequisite for counting. Very suited for formalization and mechanical processing. But not thinking as a whole."}, {"id": 50638838, "au": "retsibsi", "dom": 39, "sr": 67, "sc": 1.87, "ep": 2.64, "bs": 0.0, "d": 4, "age": 5.71, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1956, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 1.122, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Can you (or someone else who agrees) explain how you think this would play out -- what the immediate consequences would be, and how we would deal with them, and why the overall result would be better than the more secretive approach? I mean this as a genuine question, because it sounds very reckless to me but I am by no means an expert on this stuff, so I'm honestly interested in getting the other perspective."}, {"id": 50638803, "au": "energy123", "dom": 67, "sr": 68, "sc": 1.87, "ep": 2.59, "bs": 0.0, "d": 1, "age": 5.82, "grav": 40.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4279, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "Theory building mathematicians are safe for now and even arguably more valuable since that's the weakness of AI, currently. Problem solving mathematicians are in trouble."}, {"id": 50638966, "au": "tarr11", "dom": 75, "sr": 69, "sc": 1.87, "ep": 2.45, "bs": 0.0, "d": 0, "age": 5.38, "grav": 36.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3851, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.706, "fa": 0.0, "gp": 0.546, "bl": 0.0, "ds": 0.0, "txt": "I’m curious if models have discovered any novel theorems.\n\nMost of the news I have seen are proofs of existing theorems.\n\nI also don’t know if that is a good question since I am not a mathematician."}, {"id": 50639844, "au": "jibalt", "dom": 112, "sr": 70, "sc": 1.87, "ep": 2.42, "bs": 0.0, "d": 2, "age": 2.96, "grav": 17.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 18, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.52, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I very sincerely doubt that.\n\nHow very obnoxious. One can be sure that he is a better judge of what he is producing than you are.\n\n> Every app we've seen where people aren't writing the code is pretty crappy.\n\nWho is \"we\", you and yourself?\n\nThe rest of us have seen what you are claiming hasn't been seen.\n\nAnd who said that what he is producing is \"apps\"?"}, {"id": 50639264, "au": "shepherdjerred", "dom": 157, "sr": 71, "sc": 1.87, "ep": 2.32, "bs": 0.0, "d": 4, "age": 4.42, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 5764, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_llms", "flbl": "Human & LLMS (Proofs)", "urls": [], "ig": 0.987, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't understand how you can be holding these opinions on a thread about a LLM solving some of the most difficult math problems.\n\nI am sorry, I hate to say it, but the LLMs are smarter than most of us. At this point they are arguably smarter than any human that has ever lived."}, {"id": 50640237, "au": "William_BB", "dom": 6, "sr": 72, "sc": 1.87, "ep": 2.27, "bs": 0.0, "d": 2, "age": 1.83, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.746, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I'd argue math is different from software engineering. Math is easily verifiable and there exists an absolute truth. Software engineering is more akin to art. There is no one right way to do things. Requirements are defined by the people, for the people. It's more like clay-making."}, {"id": 50639417, "au": "emtel", "dom": 183, "sr": 73, "sc": 1.87, "ep": 2.24, "bs": 0.0, "d": 1, "age": 4.09, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1802, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.953, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why do people keep saying AI is solving these problems with brute force? Long proofs cannot be discovered with brute force because the space of proofs is exponentially large!\n\nWords have meanings!"}, {"id": 50640811, "au": "throwaway27448", "dom": 11, "sr": 74, "sc": 1.87, "ep": 2.22, "bs": 0.0, "d": 5, "age": 0.4, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "grain_art", "flbl": "Grain & Art (Information)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That was exactly the semantics I intended to communicate. Painting is a craft that you can use to create art. There are many applications of painting that are not art! Same with pretty much any medium. I haven't seen a whole lot of art produced with LLMs (though some interesting stuff is beginning to pop up).\n\nEdit: for some examples to show I'm talking in good faith, I'd probably put the IOCCC under \"art\", and a lot of eg set painting as \"craft\" that only becomes \"art\" as part of a larger production."}, {"id": 50638597, "au": "bronlund", "dom": 168, "sr": 75, "sc": 1.87, "ep": 2.18, "bs": 0.0, "d": 0, "age": 6.34, "grav": 45.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 428, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": [], "ig": 0.766, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "I do not understand this. AI is a mathematical machine designed by math professors for doing math, but now mathematicians are against it because it does math really good?\n\nIt all seems kind of silly to me :)"}, {"id": 50639802, "au": "pianopatrick", "dom": 136, "sr": 76, "sc": 1.87, "ep": 2.13, "bs": 0.0, "d": 3, "age": 3.05, "grav": 18.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 425, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "machines_everything", "flbl": "Machines & Everything (Humans)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This change is, so far, not cataclysmic or even noticeable in most people's daily lives.\n\nThis year, the Iran war has had more impact on most people's daily lives via higher gas prices and such than AI.\n\nPeople will notice AI in their daily lives once the robots show up."}, {"id": 50638472, "au": "schiffern", "dom": 61, "sr": 77, "sc": 1.87, "ep": 2.13, "bs": 0.0, "d": 1, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 22, "qw": 11, "k": 8402, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_software", "flbl": "Math & Software (Code)", "urls": ["https://en.wikipedia.org/wiki/Bodging"], "ig": 0.793, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": ">its true t
