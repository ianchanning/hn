l Commentary", "count": 10, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 8}, {"category": "investigative_or_tech_press", "count": 3}, {"category": "low_cred_or_joke", "count": 2}], "story_anchors": ["wheat", "history", "grain", "civilization", "human", "crops", "crop", "agriculture", "known", "plants", "important", "modern", "species", "seeds", "ancient", "plant", "grains", "domesticated"], "largest_root": {"root_id": 50654959, "author": "nchmy", "slots": 39, "start_dom": 1, "end_dom": 39, "share_pct": 35.8, "top_dom1_age": 10.5, "top_dom1_author": "nchmy"}, "buried_cutoff": 33, "rescue_top_k": 22, "ablations": [], "tournament": [], "comments": [{"id": 50656673, "au": "thelastgallon", "dom": 30, "sr": 1, "sc": 14.37, "ep": 14.37, "bs": 0.0, "d": 1, "age": 7.55, "grav": 58.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 518, "qw": 0, "k": 8566, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": ["https://news.uchicago.edu/do-we-really-have-free-will"], "ig": 1.767, "fa": 3.25, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "Robert Sapolsky has an observation, rice vs wheat and how our brains are culturally formed as collectivist or individualist.\n\nhttps://news.uchicago.edu/do-we-really-have-free-will\n\nRobert Sapolsky: If I were to become a really grandiose version of a neurobiologist, I would say culture is the means by which you create a brain in your child that’s going to look just like yours when they’re an adult, like your ancestors wound up in one of two different ecosystems. They either wound up in southern China where you have flat floodplains that are very amenable to irrigation and thus very amenable to rice farming. Or you wound up in northern China, which is more mountainous or you actually wind up being a wheat farmer.\n\nIf you are a southern Chinese rice farmer, you develop a collectivist culture because you and 50 other villages maintain this 100-mile-long irrigation canal that’s 1,000 years old, and when it is planting day, the entire village shows up and plants your crop and tomorrow you all show up and plant the next guy’s crop and get a mindset cross-cultural psychologists have shown that is one of collectivist thinking that manifests itself in incredibly unlikely domains.\n\nAnd then you go to northern China and you find people who are either doing rice farming of their own plot of land for their wheat farming, which is very individualistic, and you do the same psychological tests "}, {"id": 50655554, "au": "sandworm101", "dom": 9, "sr": 2, "sc": 12.13, "ep": 12.28, "bs": 0.0, "d": 1, "age": 9.39, "grav": 79.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 136, "qw": 0, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": ["https://afe.easia.columbia.edu/china/geog/wet_rce.htm"], "ig": 1.662, "fa": 2.36, "gp": 1.133, "bl": 0.0, "ds": 0.0, "txt": "I did read once about a key developmental difference between rice and wheat. The history of wheat is dominated by technology to allows a fixed labor pool to harvest an ever-greater area of wheat. Think of force multipliers that allow a farmer with a tractor to till more soil than a farmer with a horse. Rice was different. Rice development was about using an increasing amount of labor to pull  more rice out of a fixed area of land. So whereas in the west technology made farmers ever more productive, in the east it was the land that became more productive.\n\nhttps://afe.easia.columbia.edu/china/geog/wet_rce.htm\n\nIn the historical context this would mean where in the west a population drop would result in fields being abandoned (think plague) in the east the same fields would simply be farmed less intensively, a more resilient system with less risk of land becoming unproductive."}, {"id": 50654067, "au": "RhysU", "dom": 46, "sr": 3, "sc": 10.31, "ep": 10.31, "bs": 0.0, "d": 1, "age": 12.33, "grav": 120.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 82, "qw": 0, "k": 1789, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": ["https://press.uchicago.edu/ucp/books/book/chicago/W/bo18378250.html"], "ig": 1.599, "fa": 2.08, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "Great book! It makes the case that agriculture, like wheat, won because it was easy for proto-states to tax. One can't hide a wheat field from the tax man. Who needs a population boom? One state fighting another.\n\nI read it and \"What is a Dog?\" [1] at roughly the same time, randomly. The latter makes the case that a dog is a scavenging organism uniquely adapted to thriving via emotionally connected humans. Evolutionary biology mixed with anthropology.\n\nThe parallels were pretty striking. Humans domesticated dog. States domesticated humans.\n\n[1] https://press.uchicago.edu/ucp/books/book/chicago/W/bo183782..."}, {"id": 50653507, "au": "mentalgear", "dom": 89, "sr": 4, "sc": 9.2, "ep": 9.2, "bs": 0.0, "d": 0, "age": 13.85, "grav": 144.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 158, "qw": 0, "k": 4741, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": ["https://solarfoods.com/"], "ig": 1.794, "fa": 0.9, "gp": 1.668, "bl": 0.0, "ds": 0.0, "txt": "Actually, I would say: \"The history of civilization is the history of exploitation\". (so far at least)\n\n- Exploitation of the natural world (animals, plants, mining).\n\n- Exploitation of humans (slave labor, credit indebtedness, cultural narratives).\n\nIt seems all we have become was never sustainable or build on a sound foundation, but just by exploiting the environment and each other.\n\nGiven that we now have reached the limit of our planetary resources, reaching even the limit of exploiting each other (crypto, scams, dissolving of the middle class), I wonder how/if we make it to become a civilization that is truly sustainable.\n\nThere is certainly technology and government approaches that would allow to feed us all and have a good life (e.g. solar/wind energy, food from bio-reactors[0]), but it would require humanity having the will-power and knowledge to act as a collective to break the (corporate) powers that currently dominate and profit most of keeping people depended (Big Fossil, Big Tech, Big Animal Industrial Farming, etc.).\n\n[0] https://solarfoods.com/"}, {"id": 50653557, "au": "TeMPOraL", "dom": 90, "sr": 5, "sc": 7.05, "ep": 7.19, "bs": 0.0, "d": 1, "age": 13.74, "grav": 142.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 16, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.891, "fa": 0.42, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "> Actually, I would say: \"The history of civilization is the history of exploitation\". (so far at least)\n\nThat's just history of life.\n\nMany people have this magical, fairy-tale view of nature as some beautiful painting or fixture that just is, and us as vandals that burn it for short-term benefit.\n\nThe reality is, nature is a bloody place where everything - from microscopic single-cell organisms and even their building blocks to tallest trees and biggest whales - is aggressively competing for ever-scarce resources, trying to eat everything they can and outbreed everyone else. The \"balance of nature\" exists because resources are scarce and Earth is finite and already overcrowded with life, meaning one organism's successful forage means some other organism dies, and many others starve to death soon after.\n\nHumans are tame and restrained in comparison.\n\nFor a different analogy: nature is stable and balanced in the same sense the front lines of World War I were stable - roughly equally powerful forces on each side, so millions of soldiers died while the line between them moved back and forth a few kilometers."}, {"id": 50653864, "au": "2b3a51", "dom": 40, "sr": 6, "sc": 7.0, "ep": 7.0, "bs": 0.0, "d": 0, "age": 12.91, "grav": 129.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 725, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.709, "fa": 0.28, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Interesting read about wheat.\n\nIn England specifically, most people up to around 1700 or so ate bread made from mixed flours (wheat, rye and barley) raised with what is now called a sourdough starter. Search for 'maslin' loaf for recipes All grains would be stone ground.\n\nThe rich people had manchet bread, pure wheat, sieved well and raised with yeast from beer. So ironically less nutrition, but they had more meat &c.\n\nNorth of the border, oats were important as wheat grew less well at the higher latitudes.\n\nEarlier still in Saxon times (~9th century) people had gruels and porridges made of the mixed grains boiled with water and some meat fat."}, {"id": 50654197, "au": "amenghra", "dom": 65, "sr": 7, "sc": 6.91, "ep": 6.91, "bs": 0.0, "d": 4, "age": 12.02, "grav": 115.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 39, "qw": 0, "k": 3722, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": ["https://www.theguardian.com/science/2022/nov/23/oldest-cooked-leftovers-ever-found-suggest-neanderthals-were-foodies"], "ig": 1.247, "fa": 0.9, "gp": 0.975, "bl": 0.0, "ds": 0.0, "txt": "Cooking started a long time ago (anywhere from 0.7 to 2 million years ago).\n\nEven Neanderthals were cooking: \"Oldest cooked leftovers ever found suggest Neanderthals were foodies. Pancake/flatbread with a ‘nutty’ taste is first evidence of complex cooking and food culture\" source: https://www.theguardian.com/science/2022/nov/23/oldest-cooke..."}, {"id": 50655070, "au": "ionwake", "dom": 75, "sr": 8, "sc": 6.88, "ep": 6.88, "bs": 0.0, "d": 0, "age": 10.27, "grav": 91.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2034, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 0.933, "fa": 0.95, "gp": 1.366, "bl": 0.0, "ds": 0.0, "txt": "A 2025 Nature study: Found that a barley domestication-related genetic variant (Btr1) may be around 27,000 years old predating known domesticated barley by roughly 17,000 years"}, {"id": 50658957, "au": "kibwen", "dom": 29, "sr": 9, "sc": 6.12, "ep": 6.41, "bs": 0.0, "d": 1, "age": 3.85, "grav": 24.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 108, "qw": 0, "k": 55731, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": ["https://en.wikipedia.org/wiki/Five_Grains"], "ig": 1.669, "fa": 0.62, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "Wheat was a big deal in ancient China too: https://en.wikipedia.org/wiki/Five_Grains\n\n\"The first lists of the five grains appear in the Han dynasty. The Classic of Rites lists soybeans (菽), wheat (麥), proso millet (黍), foxtail millet (稷) and hemp (麻). Zheng Xuan in his commentary on The Rites of Zhou has rice (稻) instead of hemp. Millet, beans, and wheat were widely recognized as part of the five grains and the debate was mainly about the inclusion of hemp or rice. Rice was not commonly cultivated in northern China while hemp was more commonly used as fiber for clothing, although its seeds could be used for oil. In modern Chinese, Wugu includes rice instead of hemp.\""}, {"id": 50653066, "au": "TheAuditor", "dom": 82, "sr": 10, "sc": 6.0, "ep": 6.0, "bs": 0.0, "d": 0, "age": 14.91, "grav": 162.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1282, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.358, "fa": 0.0, "gp": 1.937, "bl": 0.0, "ds": 0.0, "txt": "Yeah... That is ifbwe still believe the false idea that cradle of civilization is in the west.\n\nIt was not, the oldest traces are not in middle east rome or among the mediteranians.\n\nBut east Asia and especially India. Where cities existed before the west learned to cook.\n\nThe data and material is good but the entire perception is just biased by the same colonial outlook on human history."}, {"id": 50654986, "au": "myth_drannon", "dom": 108, "sr": 11, "sc": 5.93, "ep": 5.93, "bs": 0.0, "d": 2, "age": 10.43, "grav": 93.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 10721, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": ["https://www.sciencedaily.com/releases/2010/01/100119213140.htm"], "ig": 0.878, "fa": 0.96, "gp": 0.78, "bl": 0.0, "ds": 0.0, "txt": "Can't find any paper right now. But from what I read and understood the evolutionary mechanism is similar to rice and the mutation in East Asians (https://www.sciencedaily.com/releases/2010/01/100119213140.h... - 10,000-7,000 years ago)"}, {"id": 50655486, "au": "ChrisMarshallNY", "dom": 55, "sr": 12, "sc": 5.68, "ep": 5.68, "bs": 0.0, "d": 4, "age": 9.5, "grav": 81.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 10, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.099, "fa": 0.7, "gp": 0.762, "bl": 0.0, "ds": 0.0, "txt": "> But we need to understand them for what they are.\n\nDo we? It's one of those \"It Depends\" things.\n\nI have no intention of ever becoming a doctor, but I appreciate my physician giving me a simplification of my allergy, so I don't like, die.\n\nI don't intend to become a biologist, but I appreciate having a basic understanding of sexual reproduction, so that I don't end up with ten thousand cats, etc., and so that I don't end up an unexpected [grand]father.\n\nThere's very practical reasons for letting people have even adulterated and oversimplified understanding.\n\nThis is also important, if, for example, you are seeking funding for your ultra-complex scientific endeavor, from a businessman that is all about practical stuff. They aren't experts, but it would be a good idea for them to have a basic idea of what you are proposing. Otherwise, you might not get your funding/support."}, {"id": 50657824, "au": "adrian_b", "dom": 58, "sr": 13, "sc": 5.47, "ep": 5.61, "bs": 0.0, "d": 1, "age": 5.62, "grav": 38.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 273, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.798, "fa": 0.22, "gp": 0.524, "bl": 0.0, "ds": 0.0, "txt": "Fruit trees were domesticated several thousand years after cereals and legumes.\n\nThere are several reasons for this.\n\nFirst, a human cannot survive by eating fruits. Fruits can be only supplements to staple foods. The only plant parts that are sufficiently nutrient-dense to sustain a human when they are the only food are the seeds. So domesticating fruit sources was a low priority goal.\n\nSecond, the cereals and legumes that were first domesticated had an essential advantage, they can grow from seeds that will produce similar descendants. So by selecting the best plants and using their seeds for the next-year crop, domestication succeeded in few generations.\n\nWith most fruit trees, using their seeds will produce descendants that are unlikely to preserve the qualities of their parents that are desired by humans, like bigger and sweeter fruits.\n\nOnly few fruit trees can be propagated by cloning, including figs and grapevine, and only those were domesticated early, several millennia after the domestication of cereals and legumes.\n\nThe domestication of most fruit trees has become possible only after the invention of grafting, around 4 millennia ago. Apple trees and their relatives were the first that were domesticated using grafting.\n\nGrafting was discovered somewhere in Central to Western Asia, around the same area were horses were domesticated.\n\nIt is not known who were those who "}, {"id": 50653225, "au": "u1hcw9nx", "dom": 83, "sr": 14, "sc": 5.29, "ep": 5.44, "bs": 0.0, "d": 1, "age": 14.55, "grav": 156.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2782, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.369, "fa": 0.34, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "History of India is history of wheat. Wheat was cultivated in India around 3500 BC. It was what build Indus Valley Civilization (c. 2500–1900 BCE)\n\nHistory of China is history of wheat. Wheat  appeared in China's lower Yellow River around 2600 BC (Neolithic period) replacing millet.  By the time of the Tang dynasty (618–907 CE), wheat had replaced millet and become the region’s major crop."}, {"id": 50657571, "au": "adrian_b", "dom": 41, "sr": 15, "sc": 5.17, "ep": 5.32, "bs": 0.0, "d": 1, "age": 6.0, "grav": 42.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.688, "fa": 0.28, "gp": 0.385, "bl": 0.0, "ds": 0.0, "txt": "The local soil and climate have always determined which crops were more important, though usually people were careful enough to also cultivate some secondary crops that could save them in the years with unusual climate or pests, when the primary crops failed to produce.\n\nFor example, in the Ancient Greece barley was the most important crop, while in the Ancient Italy, where the climate was different, including in the old Roman Republic, emmer wheat (\"far\" in Latin) was the main crop. More recently, some centuries BC, the mutant durum wheat (\"triticum\" in Latin) became the most important crop for the Romans. Even more recently, not long before the transition to the Roman Empire, the modern bread wheat, i.e. a hybrid hexaploid wheat, became the main crop."}, {"id": 50656818, "au": "AlotOfReading", "dom": 10, "sr": 16, "sc": 5.04, "ep": 5.48, "bs": 0.0, "d": 2, "age": 7.29, "grav": 55.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 15476, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.599, "fa": 0.34, "gp": 0.523, "bl": 0.0, "ds": 0.0, "txt": "You should usually ignore these kinds of simplistic grand narrative arguments.\n\nThe history of maize is also dominated by technology to exploit ever more calories from relatively fixed areas of land. Medieval farmers in the valley of Mexico were extracting annual caloric yields that were comparable to the 1950's US. And when people died, those fields sat empty. However, the social organization of the precolonial Americas looked nothing like European states."}, {"id": 50653268, "au": "flossly", "dom": 57, "sr": 17, "sc": 4.94, "ep": 5.23, "bs": 0.0, "d": 0, "age": 14.46, "grav": 154.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 417, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.294, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "What the game Civilization got right is the importance of some \"scientific\" (a very modern word) discoveries. Wheat (and other grains) are not readily found in nature: we had to domesticate them. They are also not readily edible (unlike fruits): we needed techniques like cooking for that.\n\nWe probably started domesticating fruits first (probably started with the fig), and applied that trick to grasses to domesticate the grains.\n\nI'd say \"domestication of plants\" is what made it possible for humans to become an invasive species on earth."}, {"id": 50654481, "au": "usrnm", "dom": 84, "sr": 18, "sc": 4.55, "ep": 5.06, "bs": 0.0, "d": 1, "age": 11.39, "grav": 106.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 15, "k": 2662, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.232, "fa": 0.42, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "> But east Asia and especially India. Where cities existed before the west learned to cook\n\nCooking predates modern humans as a species, let alone human civilisation. The Indus valley civilisation is one of the oldest large bronze age civilisations, but not even nearly the oldest known human civilisation, there are much older cities throughout Eurasia, including in Europe."}, {"id": 50657907, "au": "poncho_romero", "dom": 3, "sr": 19, "sc": 4.51, "ep": 5.17, "bs": 0.0, "d": 2, "age": 5.49, "grav": 37.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 390, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.579, "fa": 0.28, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "Against the Grain by James C. Scott discusses this. Wheat needs to be planted and harvested at specific times, unlike potatoes. This made it possible for fledgling states to enforce agricultural taxes in Mesopotamia and elsewhere. In areas that grew foods that could stay in the ground for long periods, tax regimes (and therefore civilization) had a much harder time developing, because the farmers could simply avoid harvesting their crops to dodge taxes (the state on its own didn't have the capacity to perform the harvest, just the theft of a portion of it compelled by the threat of violence)."}, {"id": 50656914, "au": "newyankee", "dom": 22, "sr": 20, "sc": 4.29, "ep": 5.17, "bs": 0.0, "d": 2, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 1430, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.451, "fa": 0.34, "gp": 0.545, "bl": 0.0, "ds": 0.0, "txt": "Well when people discuss grand ideas about future of Civilisation in Western Press, even today the discussion is limited to the way of life in US, Europe, Aus, NZ, Singapore, Japan etc. The reality of life in Asia and Africa with > 80% of the population is always left as a footnote. This is nothing new. Only people who are working in those areas or when the question comes about Energy use or growth of China or even India do these questions come up. Part of it is mental bandwidth but most of it is cultural conditioning since a long time."}, {"id": 50654078, "au": "madaxe_again", "dom": 102, "sr": 21, "sc": 4.25, "ep": 7.83, "bs": 3.58, "d": 0, "age": 12.31, "grav": 120.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 11980, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.708, "fa": 0.84, "gp": 0.979, "bl": 1.35, "ds": 0.0, "txt": "This completely ignores cheese, which we have decent evidence was developed more or less concurrently with wheat. Around the same time as the first granaries appeared, so did morphological changes in the animal that would later become the domesticated cow.\n\nThat then raises the question of why people were keeping cows. Meat? Maybe, but there are easier animals less likely to murder you. A nice sheep, or a large stupid bird. Much easier. Nice to look at? Possibly, but keeping 1000lbs of murderer on the doorstep for the vibes seems unlikely.\n\nWhich leaves dairy. Milk is alright and all but it doesn’t last very long, and it’ll give you the shits if you’re lactose intolerant - as everyone was back then.\n\nWhich leaves cheese. Earliest pottery on earth has cheese residues in it. Herd control and ownership builds society, laws.\n\nSo, wheat is important - but everyone always ignores the cheese."}, {"id": 50657327, "au": "adrian_b", "dom": 20, "sr": 22, "sc": 4.19, "ep": 5.07, "bs": 0.0, "d": 2, "age": 6.37, "grav": 45.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 281, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.8, "fa": 0.0, "gp": 0.578, "bl": 0.0, "ds": 0.0, "txt": "It is indeed ethnocentric, but there still is a distinction between the civilization based on wheat (more accurately, based on 3 closely-related cereal species, which were domesticated simultaneously: emmer wheat, einkorn wheat and barley) and the civilizations based on other staple cereals, e.g. rice, maize, sorghum or millet, or on non-cereal sources of starch, e.g. potatoes, sweet potatoes, cassava or bananas.\n\nThe civilization based on the 3 species related to wheat (and also on a few legume species, including peas and lentils, and also on flax) was the earliest and then it spread over an area many times greater than its origin, and it also lead to the earliest developments of several technologies, like metallurgy and writing, and also to the earliest cities.\n\nSimilar developments occurred also in the areas where the staple food was provided by other cereals or other plants, but the wheat-based civilization had a head start advantage that resulted eventually in its global dominance during the colonial era.\n\nIn the 20th century and especially after WWII, the international relations became much more balanced, but there still are residues from the initial advantage provided by the early domestication of wheat and barley.\n\nThe advantage of wheat was less from its intrinsic properties, but more from the timeline of its domestication.\n\nWheat still has an advantage, of being one o"}, {"id": 50659369, "au": "mirmor23", "dom": 21, "sr": 23, "sc": 3.85, "ep": 4.95, "bs": 0.0, "d": 3, "age": 3.24, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 33, "k": 202, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.377, "fa": 0.42, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "> Wheat still has an advantage, of being one of the most protein-rich among cereals. Oats has higher protein content, but it is much less productive, so the cheapest protein remains that from wheat\n\nToday, the almost all of western civilization predominantly consumes refined wheat flour with added sugars, and processed meats -- essentially lowest fiber and high glycemic load. This is definitely not superior to the corn taco from mexico, and the variety of unpolished rice consumed in china/india."}, {"id": 50658802, "au": "hax0ron3", "dom": 4, "sr": 24, "sc": 3.84, "ep": 4.94, "bs": 0.0, "d": 2, "age": 4.09, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.454, "fa": 0.34, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "Potatoes can last for 3-8 months in a cellar depending on conditions, so you don't need to dig them up immediately before consuming. But yeah, it's not long compared to wheat, which can last years even with ancient methods of storage, even decades in the most optimal conditions.\n\nApparently Andean civilizations before modern technology figured out how to freeze-dry potatoes and make them last for as long as 10 years. But doing this involved additional labor.\n\nTake what I say with a grain of salt, this is based on looking things up online, not personal expertise."}, {"id": 50658457, "au": "adrian_b", "dom": 60, "sr": 25, "sc": 3.77, "ep": 5.28, "bs": 0.85, "d": 3, "age": 4.65, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 289, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.859, "fa": 0.0, "gp": 0.631, "bl": 0.32, "ds": 0.0, "txt": "One of the main difference between humans and most primates is a much shorter intestine, which prevents the digestion of plant food that has a poor nutrient content, like most part plants except seeds or the parts that are modified for nutrient storage, like certain kinds of roots or stems (e.g. carrots or potatoes). Very few fruits have a high nutrient content, e.g. starchy fruits like bananas and oily fruits like olives.\n\nAll the animals who can live by eating plant parts with low nutrient content are able to do that only by fermenting the eaten plants inside their guts. This is equally true for insects and for vertebrates.\n\nEfficient fermentation requires a long gut. This leads to the obvious difference between the big belly of a gorilla, who eats mostly plant parts with poor nutrient content, and the flat belly of a non-obese human.\n\nSo humans, after many hundred thousand years of adaptation to eating food rich in nutrients, i.e. scavenged or hunted animals and plant seeds, have become unable to survive by eating fruits or leaves, like many other primates. On the other hand, humans are better at digesting starch than most primates, which is an adaptation to digesting seeds instead of fruits and which is older than agriculture, so seeds have been an important human food for a longer time.\n\nThe difference between humans and most primates is similar to the difference between a"}, {"id": 50656942, "au": "triceratops", "dom": 31, "sr": 26, "sc": 3.65, "ep": 4.09, "bs": 0.0, "d": 2, "age": 7.03, "grav": 52.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 10713, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 1.375, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "I'd have expected the grandchildren of rice farmers, with their culture of maintaining irrigation canals collectively and communally planting rice, would be the ones to put the chairs away. And the \"individualists\" would walk around them. That's just as logical as the post hoc explanation given to us.\n\nThis is what makes people disdain social sciences. There's literally no rigor in this \"field experiment\"."}, {"id": 50656990, "au": "stasomatic", "dom": 48, "sr": 27, "sc": 3.55, "ep": 3.77, "bs": 0.0, "d": 0, "age": 6.95, "grav": 51.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 271, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "I read somewhere, perhaps in some The History of Europe book, that with wheat, you plant it and then the peasants were “free” to join the next war, while rice fields needed to be continually attended to, hence European past was more violent than the Eastern one."}, {"id": 50654959, "au": "nchmy", "dom": 1, "sr": 28, "sc": 3.44, "ep": 4.76, "bs": 0.0, "d": 0, "age": 10.48, "grav": 94.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 2150, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.038, "fa": 0.0, "gp": 1.603, "bl": 0.0, "ds": 0.0, "txt": "Nice read. Though what about corn/maize and rice? Those were (still are) the staples in Asia and the Americas (particularly latin America to this day). Just because Europe rose to prominence doesn't mean that other civilizations didn't literally grow out of non-wheat grains."}, {"id": 50658539, "au": "m0llusk", "dom": 101, "sr": 29, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 0, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 3502, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "This claims that grain sizes increased because of selection pressure, but scientists attempting to replicate this have found that simply growing crops is enough to domesticate a species resulting in larger grains among other changes with large differences after only a few generations and no selection pressure beyond collecting and planting seeds."}, {"id": 50653302, "au": "Retric", "dom": 61, "sr": 30, "sc": 3.12, "ep": 4.0, "bs": 0.0, "d": 1, "age": 14.38, "grav": 153.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 61752, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 0.805, "fa": 0.62, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "We have direct evidence of wild grain consumption over 100,000 years ago.  They where plentiful, but very labor intensive to harvest."}, {"id": 50657756, "au": "Peteragain", "dom": 2, "sr": 31, "sc": 2.92, "ep": 4.46, "bs": 0.0, "d": 1, "age": 5.72, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 195, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "I thought an interesting dichotomy, mentioned ages ago on HN, was between grains (storable) and root based carbohydrates like potato that needs to be dug up just before consuming. The castle keep was exactly that: a place to keep the food you'd need to get you through to the next harvest. These become something worth taking. Think \"Seven Samurai\". Keeps, and the means of attacking them, drove western innovation. AND far Eastern. To steal someone's Potatoes, you'd have to harvest them yourself and you may as well be a farmer rather than a \"tax\" collector."}, {"id": 50655783, "au": "sandworm101", "dom": 16, "sr": 32, "sc": 2.77, "ep": 3.87, "bs": 0.0, "d": 3, "age": 9.06, "grav": 75.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.231, "fa": 0.28, "gp": 0.123, "bl": 0.0, "ds": 0.0, "txt": "I think it created different types of expansion. Absent technological progress, an asian rice-farming family with lots of children could increase the productivity of their fixed amount of land. But a wheat-farming family with lots of kids would look for more fields to till. So perhaps an asian dynasty could grow in size/power inside its own footprint (Japan) whereas in the west increasing power was more tied to physical expansion (settlement of the US west)."}, {"id": 50658688, "au": "sandworm101", "dom": 18, "sr": 33, "sc": 2.73, "ep": 3.39, "bs": 0.0, "d": 3, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 4, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 1.375, "fa": 0.0, "gp": 0.112, "bl": 0.0, "ds": 0.0, "txt": ">> perhaps after some clearing\n\nTry to remove a small tree with an iron axe, roots and all. Then do that a few hundred times. Returning a field to service after even a couple years is a serious investment. To this day, farmers will consider at least tilling a field rather than let grow roots for a season."}, {"id": 50653816, "au": "nukanse", "dom": 73, "sr": 34, "sc": 2.63, "ep": 3.73, "bs": 0.0, "d": 0, "age": 13.02, "grav": 131.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 0.877, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Wheat is just domesticated grass, but rye and oats were pests that sneaked into cultivars by mimicking wheat so humans didn't killed them, until humans found that those plants were useful themselves"}, {"id": 50655498, "au": "nukanse", "dom": 81, "sr": 35, "sc": 2.58, "ep": 3.46, "bs": 0.0, "d": 0, "age": 9.48, "grav": 81.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.987, "bl": 0.0, "ds": 0.0, "txt": "The history of civilization is the history of: agriculture, writing, metal work, energy, math and logic, science, engineering, hydraulics, architecture..."}, {"id": 50659423, "au": "WheelsAtLarge", "dom": 72, "sr": 36, "sc": 2.42, "ep": 2.86, "bs": 0.0, "d": 0, "age": 3.18, "grav": 19.3, "surf": 8.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5797, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 0.956, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "I would say beer or something in that realm is the history of civilization. Humans love to get drunk and that's probably why we domesticated grains.\n\nEven now you can go anywhere in the world and you will find some kind of alcoholic beverages is being made. Even at the most rudimentary places, alcohol is part of the culture."}, {"id": 50657341, "au": "Wicher", "dom": 47, "sr": 37, "sc": 2.32, "ep": 3.35, "bs": 0.0, "d": 2, "age": 6.34, "grav": 45.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 296, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.425, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh yes, revelatory read! It's a while since I've read it, so I might misremember (or maybe I read it elsewhere): contrary to \"what everyone knows\", the grain by itself didn't really cause population booms directly. Rather, it enabled the kind of centralization and subjugation that you refer to, and that is the thing that caused population booms, literally through stealing people from the surrounding areas, and moving them to the center of power! The center of power itself was actually a net population sink, because of famine, disease, war, etc."}, {"id": 50655202, "au": "jghn", "dom": 54, "sr": 38, "sc": 2.26, "ep": 3.5, "bs": 0.0, "d": 3, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 7927, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.461, "fa": 0.0, "gp": 0.048, "bl": 0.0, "ds": 0.0, "txt": "It's an issue in general with the entire PopSci genre. There are often nuggets of truth and value in there, but by the time it watered down sufficiently to become a bestseller, the actual utility is low. Yet, people over fixate on these overadulterated concepts and ideas.\n\nDon't get me wrong, I enjoyed GG&S, just like I enjoyed books like Freakonomics, Gladwell's stuff, etc. The whole point is that these are entertaining, easy reads & full of Just So stories. But we need to understand them for what they are."}, {"id": 50655965, "au": "sandworm101", "dom": 69, "sr": 39, "sc": 2.25, "ep": 3.13, "bs": 0.0, "d": 1, "age": 8.79, "grav": 72.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why presume wheat was cultivated first for human consumption?  I could see a path whereby humans altered landscapes to increase grasses for animals to eat. (Think burning/chopping forests to make grass fields.)  Then, once you learn a thing or two about preparing fields for use by animals, you start figuring our ways that you can eat the grass directly too."}, {"id": 50653593, "au": "newsclues", "dom": 80, "sr": 40, "sc": 2.2, "ep": 3.3, "bs": 0.0, "d": 0, "age": 13.64, "grav": 141.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2875, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.693, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "History of civilization is the history of ENERGY and wheat was energy for humans.  Now we have machines that run on fossil fuels to harvest the wheat to power the humans."}, {"id": 50653678, "au": "metalman", "dom": 109, "sr": 41, "sc": 2.12, "ep": 3.22, "bs": 0.0, "d": 0, "age": 13.45, "grav": 138.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 398, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "revisionist propaganda and a barbaric glutinous attempt to steal the very concepts of civilisation and history.\nor to put it another way, when asked, what he thought of western civilisation, Ghandi ji replied that, yes! it would be a good idea.\nbut if you replace 'civilisation', with 'self domestication' the dawn of the nebbish, then ya, there is a strait line."}, {"id": 50658158, "au": "poncho_romero", "dom": 91, "sr": 42, "sc": 2.05, "ep": 3.44, "bs": 0.0, "d": 2, "age": 5.1, "grav": 34.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 390, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.466, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Most flora and fauna in nature are not living on the knife's edge. There's a lot more slack than we usually appreciate. I also think it's wrong to say that the lion exploits the gazelle, or the gazelle the wild grass, or the wild grass the nutrients of the soil. Yes, individual organisms die, sometimes brutally, but this isn't _evil_, it's one event in a vast, harmonious system of life, death, and regeneration, that all living things partake of."}, {"id": 50658919, "au": "_m_p", "dom": 74, "sr": 43, "sc": 2.04, "ep": 3.14, "bs": 0.0, "d": 0, "age": 3.92, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 95, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.021, "fa": 0.0, "gp": 0.508, "bl": 0.0, "ds": 0.0, "txt": "James C. Scott, author of _Seeing Like A State_, wrote another book called _Against the Grain_ arguing that cereals like wheat were the easiest crops for states to tax."}, {"id": 50658199, "au": "flossly", "dom": 59, "sr": 44, "sc": 1.98, "ep": 3.08, "bs": 0.0, "d": 2, "age": 5.05, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 417, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Most primates get most of their nutrients from fruit right? They add a little gren leaves and insect usually (basically all except the Gorilla).\n\nBut humans cannot survive on the same diet? I find that hard to believe.\n\nWhat I understood that the primitive domestication of fig was simply by only seeing new figs from the biggest fruits. And that was enough to domesticate it.\n\nGrafting is not a requirement for that."}, {"id": 50654521, "au": "quickthrowman", "dom": 87, "sr": 45, "sc": 1.95, "ep": 3.49, "bs": 0.0, "d": 1, "age": 11.29, "grav": 105.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 4250, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.486, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree that western history is biased, but Chinese and Indian (and Serbian, Korean, etc) nationalist historical revisionism is just as annoying.\n\nFWIW, cooking food predates Homo sapiens and the oldest known urban settlements are in Mesopotamia. The Indus Valley civilization was complex and comparable to other Bronze Age polities but does not predate Catalhuyuk or Jericho."}, {"id": 50654252, "au": "nephihaha", "dom": 42, "sr": 46, "sc": 1.87, "ep": 3.26, "bs": 0.0, "d": 1, "age": 11.89, "grav": 114.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1287, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.049, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In Scotland, the crops used to be mainly oats and barley. The Gaels seem to have favoured oats whereas the Norse grew barley. Barley is still important in whisky production."}, {"id": 50653784, "au": "wongarsu", "dom": 64, "sr": 47, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 3, "age": 13.14, "grav": 133.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 33666, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.328, "bl": 0.0, "ds": 0.0, "txt": "Can confirm, have eaten raw wheat from the field\n\nThe Bible's old testament also contains explicit rules for when this is allowed, and Jesus got into an argument with Pharisees on whether doing that is allowed on sabbath (Matthew 12:1). This is definitely something people did in recorded history, so assuming it happened in prehistory before we figured out cooking isn't much of a stretch"}, {"id": 50658254, "au": "BruceEel", "dom": 8, "sr": 48, "sc": 1.79, "ep": 2.23, "bs": 0.0, "d": 1, "age": 4.97, "grav": 32.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 983, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.426, "fa": 0.34, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Yes indeed. Fernand Braudel's The Structures of Everyday Life [1979] covers this in some detail. It's a fascinating read, for a number of reasons."}, {"id": 50659894, "au": "crazygringo", "dom": 78, "sr": 49, "sc": 1.71, "ep": 2.81, "bs": 0.0, "d": 1, "age": 2.46, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 84638, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It rotates, that's the wonder of modern supermarkets.\n\nPasta made from wheat one night, a nice bed of rice the next night, cornbread the following night. And don't forget roast potatoes the night after that.\n\nIf you have a variety in your local supermarket, why you would ever stick to mostly just one is beyond me."}, {"id": 50655022, "au": "notorandit", "dom": 97, "sr": 50, "sc": 1.62, "ep": 2.72, "bs": 0.0, "d": 0, "age": 10.35, "grav": 92.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 362, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 0.947, "fa": 0.0, "gp": 0.342, "bl": 0.0, "ds": 0.0, "txt": "And not just that.\nWhen wheat production grew, also economy and society shifted quite a lot.\n\nCommercial and financial concepts were born, just like that of \"paid work\"."}, {"id": 50657844, "au": "triceratops", "dom": 36, "sr": 51, "sc": 1.44, "ep": 2.54, "bs": 0.0, "d": 4, "age": 5.59, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 10713, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Assume it's not your chair, not your problem: individualist.\n\nSolve the problem because you're there and it affects everyone: collectivist.\n\nMy explanation makes about as much sense as yours. In fact, if you ran an actual experiment where someone read that whole comment and then only the first 3 sentences of the last paragraph, I suspect \"put chair away\" would be tagged as \"collectivist\" half the time and \"individualist\" the other half. It's basically reading tea leaves, or a Rorschach ink blot test.\n\nPost hoc explanations of observed behavior are not experiments. There was no hypothesis, no data collection, no control group.\n\nTo be clear I don't have disdain for social sciences. But when reading accounts like this I can understand why someone might."}, {"id": 50654745, "au": "flossly", "dom": 62, "sr": 52, "sc": 1.43, "ep": 2.97, "bs": 0.0, "d": 2, "age": 10.86, "grav": 99.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 417, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.265, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But did wild grain consumption change the history of civilization?\n\nWe needed to domesticate them and combine them with cooking to \"take over\" (cheap+reliable food store/distribution in colder climates).\n\nI think it's actually the \"free time\" it bought some in society that resulted in a lot of other advancements. But that's harder to pin point i guess..."}, {"id": 50658823, "au": "nukanse", "dom": 11, "sr": 53, "sc": 1.42, "ep": 1.86, "bs": 0.0, "d": 3, "age": 4.07, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.793, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mexicans laugh about our concept of \"maize\". We only know one kind.\n\nIn Mexico there are all kind of maize with different colors, flavor, textures, sizes and uses. Only one type it's known to the rest of the world."}, {"id": 50656989, "au": "DebtDeflation", "dom": 43, "sr": 54, "sc": 1.41, "ep": 2.95, "bs": 0.0, "d": 2, "age": 6.95, "grav": 51.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 6962, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 0.844, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Samuel Johnson's 1755 dictionary defined oats as \"a grain, which in England is generally given to horses, but in Scotland supports the people\".  The classic Scottish retort to this was \"Yes, and where else will you see such horses and such men?\""}, {"id": 50660398, "au": "AlotOfReading", "dom": 13, "sr": 55, "sc": 1.39, "ep": 2.93, "bs": 0.0, "d": 4, "age": 1.48, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 15476, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "All premodern agriculture involved massive amounts of human labor. Chinampas were relatively industrial, and limited to mainly specific areas of central and southern Mexico regardless. Canals and dams were more common to the west and north."}, {"id": 50657599, "au": "samudrijan", "dom": 23, "sr": 56, "sc": 1.39, "ep": 2.89, "bs": 0.0, "d": 3, "age": 5.95, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 183, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 0.845, "fa": 0.0, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "I’d argue India and China are both very much included in the Western discussion, media, politics. Africa, outside the Middle East, not so much. Maybe more so in Europe."}, {"id": 50658206, "au": "poncho_romero", "dom": 93, "sr": 57, "sc": 1.39, "ep": 2.7, "bs": 0.0, "d": 3, "age": 5.04, "grav": 33.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 390, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can call it a holocaust or you can just as arbitrarily emphasize the flowering of life on this planet over the last four billion years. From humble, single celled beginnings, life has multiplied into countless species filling countless ecological niches, all part of one grand evolutionary tree. I struggle to imagine something further from Nazi death camps."}, {"id": 50653909, "au": "bgandrew1", "dom": 92, "sr": 58, "sc": 1.39, "ep": 2.41, "bs": 0.0, "d": 2, "age": 12.78, "grav": 127.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 13, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.025, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Another important point: all the good things, everything we consider “moral” are inventions of human civilization. Outside civilization, it’s just a never-ending holocaust, with mothers eating their own babies alive."}, {"id": 50655343, "au": "andrekandre", "dom": 19, "sr": 59, "sc": 1.39, "ep": 3.59, "bs": 1.19, "d": 1, "age": 9.74, "grav": 84.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 33, "k": 2171, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.417, "fa": 0.42, "gp": 0.977, "bl": 0.45, "ds": 0.0, "txt": "was going to say the same...\n\n  > Other staple crops dominated in other parts of the world (like rice in East Asia, and maize in the Americas), but it was wheat that fueled the Roman Empire and the Industrial Revolution\n\nit seems kind of ethnocentric to say \"civilization\" when what they just implicitly mean is \"western civilization\"... idk"}, {"id": 50656494, "au": "philwelch", "dom": 39, "sr": 60, "sc": 1.39, "ep": 2.36, "bs": 0.0, "d": 1, "age": 7.84, "grav": 61.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 36564, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You’re right that civilizations developed from other grains, but wheat was also grown in Japan, northern China, India, Mesopotamia, and Egypt, not just Europe. It was the primary grain in the majority of places that first developed grain agriculture."}, {"id": 50655410, "au": "ChrisMarshallNY", "dom": 56, "sr": 61, "sc": 1.39, "ep": 2.32, "bs": 0.0, "d": 2, "age": 9.65, "grav": 83.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 0.987, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Gatekeepers never like accessibility. That's as old as human history.\n\nThe thing that they don't ever understand, is that it's really important for the mensch to have a basic grasp on what it's about, because the gatekeepers will need their support (especially in democracies and capitalist societies)."}, {"id": 50661089, "au": "lilbigdoot", "dom": 5, "sr": 62, "sc": 1.39, "ep": 2.29, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 200, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That little fact about wheat puts so much stuff into context. So many times I've read something and thought how has food not spoiled or run out\n\nI mean obvious in hindsight but still a nice tidbit"}, {"id": 50654514, "au": "myth_drannon", "dom": 106, "sr": 63, "sc": 1.39, "ep": 2.28, "bs": 0.0, "d": 0, "age": 11.3, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 10721, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Wheat also caused human body changes with ADH*2 mutation that causes alcohol intolerance in people who are indigious to Mesopotamia.\nWe change it and it changes us."}, {"id": 50658092, "au": "adrian_b", "dom": 70, "sr": 64, "sc": 1.39, "ep": 5.72, "bs": 3.58, "d": 2, "age": 5.2, "grav": 35.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 327, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 1.834, "fa": 0.22, "gp": 0.539, "bl": 1.35, "ds": 0.0, "txt": "The archeological results are not consistent with this hypothesis.\n\nThe domestication of the first animals that were used for food production or for fiber/fur production, i.e. sheep and goats, happened millenia after the domestication of 3 species of cereals and of 2 to 5 species of legumes and of flax (which happened simultaneously).\n\nThe domestication of bigger and more dangerous animals, i.e. cattle and swine, happened a long time after the domestication of sheep and goats.\n\nBy the time when the Neolithic farmers from Anatolia began their expansion into Europe, eventually covering almost all of it, they brought with them 5 domestic animals, dogs, sheep, goats, cattle and swine.\n\nNonetheless, for the Neolithic farmers, growing animals appears to have been a secondary activity. On the other hand, their Northern and Eastern neighbors, who had not yet transitioned to an agriculture-based living, appear to have acquired very early such domestic animals from the farmers, perhaps by commerce, but perhaps also by stealing (there are many ancient Indo-European stories about cattle stealing, which appears to have been a condoned activity for young men, as long as they were not stealing from their own tribe).\n\nThere, at these neighboring people, who were speakers of Indo-European, Uralic and Turkic languages, growing animals became the main activity and it was associated with a non-set"}, {"id": 50658322, "au": "adrian_b", "dom": 68, "sr": 65, "sc": 1.39, "ep": 2.98, "bs": 0.85, "d": 5, "age": 4.83, "grav": 31.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 1.269, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I agree that eating something is better than nothing, but cooking them will provide much more energy.\n\nAncient humans were much more adept of making a fire than a modern human who does not have with him a lighter or a matchbox, so they would not choose to not cook their food, except in special circumstances, e.g. hunters in the middle of a pursuit that would continue for many hours might choose to eat such uncooked seeds gathered on their path."}, {"id": 50658426, "au": "joshheitzman", "dom": 94, "sr": 66, "sc": 1.39, "ep": 2.13, "bs": 0.0, "d": 4, "age": 4.68, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 222, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wheat_barley", "flbl": "Wheat & Barley (Potatoes)", "urls": [], "ig": 0.908, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are far more species that are extinct then are alive now.  The word holocaust existed before WWII and doesn't just refer to events from that time.  One meaning is simply \"a massive slaughter\"."}, {"id": 50654652, "au": "rprwhite", "dom": 107, "sr": 67, "sc": 1.39, "ep": 2.08, "bs": 0.0, "d": 1, "age": 11.02, "grav": 101.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 88, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "west_labor", "flbl": "West & Labor (East)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve not heard of this before, but am intrigued. \nDo you have any links to papers connecting wheat consumption and changes to the livers production of alcohol dehydrogenases?\nOr a timeframe, when did those occur?"}, {"id": 50658862, "au": "nukanse", "dom": 38, "sr": 68, "sc": 1.39, "ep": 2.0, "bs": 0.0, "d": 2, "age": 4.02, "grav": 25.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.853, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's a lie, because collectivist ideas were introduced inside china in the  past century, and originate in christianism and Marxism. It is a western export into china. Marx is buried in London."}, {"id": 50657492, "au": "hyperhello", "dom": 33, "sr": 69, "sc": 1.39, "ep": 1.89, "bs": 0.0, "d": 3, "age": 6.11, "grav": 43.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1955, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 0.802, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From what I’ve encountered, the field starts with some kind of difference; could be anything at all, like the two groups say they value a bean differently. Then they make “analogies” to the past, which is a whole world of jargon. It’s not meant to predict the future accurately the way physical sciences do."}, {"id": 50659972, "au": "poncho_romero", "dom": 95, "sr": 70, "sc": 1.39, "ep": 1.7, "bs": 0.0, "d": 5, "age": 2.29, "grav": 13.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 390, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is as natural for species to arise, exist for a time, and go extinct as it is for the sun to rise or a flower to bloom. It's a choice to cast that in such a negative light."}, {"id": 50656886, "au": "AnimalMuppet", "dom": 17, "sr": 71, "sc": 1.39, "ep": 1.67, "bs": 0.0, "d": 2, "age": 7.15, "grav": 53.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 0.71, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Re your last paragraph:  Resiliency from the land's perspective is not something that I think we should care about very much.  So a field becomes abandoned and unproductive.  So what?  It's not lost.  It will be available to be used again (perhaps after some clearing) when the population comes back."}, {"id": 50659190, "au": "teytra", "dom": 28, "sr": 72, "sc": 1.39, "ep": 1.64, "bs": 0.0, "d": 2, "age": 3.48, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 26, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "history_civilization", "flbl": "History & Civilization (Western)", "urls": [], "ig": 0.697, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is written in English, a language of the western civilization.\n\nIf it was written in Chinese or a indiginous American language it would probably also be a text with another, non-western, ethnocentric view."}, {"id": 50657896, "au": "adrian_b", "dom": 66, "sr": 73, "sc": 1.39, "ep": 1.56, "bs": 0.0, "d": 3, "age": 5.51, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "eating_fruits", "flbl": "Eating & Fruits (Human)", "urls": [], "ig": 0.662, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can eat anything without cooking, but for most seeds if they are not cooked humans can digest only a small fraction, so eating them is not useful.\n\nOnly the oily seeds, like most nuts, do not benefit much from cooking, as most of their content is fat, for which cooking does not provide any benefit."}, {"id": 50655645, "au": "cousin_it", "dom": 15, "sr": 74, "sc": 1.39, "ep": 1.41, "bs": 0.0, "d": 2, "age": 9.25, "grav": 78.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 10400, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "field_sciences", "flbl": "Field & Sciences (Culture)", "urls": [], "ig": 0.506, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "Interesting. Does this mean one culture would be more expansionist and the other would focus more on population growth? It seems a bit too simple, but maybe there's something to it."}, {"id": 50654505, "au": "ChrisMarshallNY", "dom": 51, "sr": 75, "sc": 0.85, "ep": 2.84, "bs": 1.99, "d": 0, "age": 11.33, "grav": /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
