can get legal too. Why roll over?"}, {"id": 50634071, "au": "j45", "dom": 196, "sr": 2, "sc": 8.46, "ep": 8.46, "bs": 0.0, "d": 0, "age": 18.81, "grav": 235.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 4935, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.592, "fa": 0.84, "gp": 1.606, "bl": 0.0, "ds": 0.0, "txt": "Ideas:\n\n- Maybe invite them into your world via a screenshare.\n\n- You could record a video tour and submit it too (with a meaningful transcript).\n\n- Describe in detail (as much as possible) how your regression benchmarks are working and if you can show an example of that work and attach it, or share some more it might help.  There's a possibilty that what you're doing is similar to distillers and maybe you can ask them for input on a better way.\n\n- Setup the whole scenario in Fable and run this conversation to see how to best present it - attach information, have it crunch and verify what you can, and get the shared chat link and submit it as well for trying to run your own analysis.\n\n- It's best to first just explain how your use of ai works so far, then introduce the information from Claude and ask for helping to verify this and how to best submit it."}, {"id": 50634503, "au": "nekusar", "dom": 268, "sr": 3, "sc": 8.02, "ep": 8.02, "bs": 0.0, "d": 0, "age": 18.22, "grav": 224.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": ["https://www.trendingtopics.eu/openai-anthropic-researchers-idea-theft/"], "ig": 1.683, "fa": 0.62, "gp": 1.582, "bl": 0.0, "ds": 0.0, "txt": "You are asking the wrong question.\n\nYou instead need to ask \"Why is my company amenable to send all trade secret, upcoming features, and protected communication and discussion to a 3rd party who knowingly uses all data to train their system\".\n\nYou record a week's communication with all your employees with full logs. Then you go to the company legal department and ask for clarification.\n\nAnd you cite https://www.trendingtopics.eu/openai-anthropic-researchers-i... . The theft of trade secrets is not a 'maybe'."}, {"id": 50641362, "au": "peter_d_sherman", "dom": 264, "sr": 4, "sc": 7.97, "ep": 7.97, "bs": 0.0, "d": 0, "age": 2.96, "grav": 17.8, "surf": 14.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 19061, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.667, "fa": 0.95, "gp": 0.926, "bl": 0.0, "ds": 0.0, "txt": "So wait, let me get this straight...\n\nAnthropic, the AI company who recently made $93.5 billion dollars from its stock IPO, whose max market cap was $2.1 trillion (that's trillion with a 't'), who learned how to distill its AIs from OpenAI, and who trained its AI on the whole corpus of content from the Internet and never paid any content creator a dime -- that Anthropic is now accusing you of \"distilling\"?\n\n?\n\nDo I have all of those facts right?\n\n?\n\nAnd now you have 24 hours to prove that you didn't, when standard legal practices dictate that you be given at least a 30 day written notice, and a chance to respond with your side of the argument?\n\nBecause something doesn't add up here...\n\nI sincerely hope I have one or more facts wrong here..."}, {"id": 50633141, "au": "varenc", "dom": 5, "sr": 5, "sc": 7.51, "ep": 7.51, "bs": 0.0, "d": 0, "age": 19.71, "grav": 254.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 7667, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.352, "fa": 0.5, "gp": 2.002, "bl": 0.0, "ds": 0.0, "txt": "Whatever you submit in 24h, submit the same evidence to Claude and ask it to tell you if it's sufficient evidence to make distilling seem unlikely. Because you know Anthropic is just going to be using Claude as well.\n\nAs others have suggested, the code that generates the false distilling usage pattern along with its git history seems useful."}, {"id": 50643018, "au": "buu700", "dom": 28, "sr": 6, "sc": 7.35, "ep": 7.5, "bs": 0.0, "d": 5, "age": 0.05, "grav": 3.6, "surf": 7.6, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 342, "qw": 0, "k": 3010, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": ["https://en.wikipedia.org/wiki/Right_to_internet_access"], "ig": 1.922, "fa": 0.62, "gp": 0.839, "bl": 0.0, "ds": 0.0, "txt": "Agreed, I've been saying essentially the same thing for years. GP pointed out that Coca-Cola can't ban you from buying their product, but I would argue that moreover they shouldn't be able to ban you even if they somehow could. Past a certain scale, or at least past a certain scale and longevity, things become de facto public goods and services and should be treated as such.\n\nI'm all for freedoms of speech, association, and enterprise, but I also appreciate ideas like right to internet access / freedom to connect[1], and in hindsight I would argue that freedom to connect is just a specific case of a more general principle of freedom to consume the same goods and services as the broader public.\n\nIt's like, Mocha Joe banning you from his coffee shop is a minor nuisance, but finding out that you're never allowed to enter any Starbucks in the world in perpetuity would be kind of life-altering. An algorithm at Apple or Google deciding it doesn't like the cut of your jib, even more so. Pissing off the wrong person with the right connections to get you banned from Verizon, AT&T, and T-Mobile, potentially even more so.\n\nThese are disproportionate penalties that can be and are inflicted upon helpless citizens with no legal due process or practical recourse. The rights of massive corporations to operate their businesses without undue interference needs to stop where my right to live a no"}, {"id": 50634692, "au": "lo_zamoyski", "dom": 277, "sr": 7, "sc": 7.28, "ep": 7.28, "bs": 0.0, "d": 0, "age": 18.0, "grav": 219.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 8, "k": 2050, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.64, "fa": 0.42, "gp": 1.536, "bl": 0.0, "ds": 0.0, "txt": "> Now I've got 24h to prove we didn't.\n\nWhat exactly do they consider \"proof\"? Showing that there is no needle in a haystack means sifting through the entire haystack or finding something that rules out the possibility (like a strong magnet). What do they want? Full access to your containers and repos? They already have your queries.\n\n(I do find it amusing that distillation is banned by companies that have historically trained their models by freely consuming the fruits of everyone else's labor. At least the client here is paying for his account.)"}, {"id": 50634374, "au": "LoganDark", "dom": 251, "sr": 8, "sc": 6.97, "ep": 6.97, "bs": 0.0, "d": 4, "age": 18.42, "grav": 228.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 100, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": ["https://twitter.com/daniel_mac8/status/2123413769808138523", "https://pbs.twimg.com/media/HXfhhwnXMAA3O9I?format=jpg&name=4096x4096"], "ig": 1.667, "fa": 0.62, "gp": 0.886, "bl": 0.0, "ds": 0.0, "txt": "YMMV, but Gemini 4's about the best at things other than coding I've seen since ChatGPT's initial launch.\n\nI've even been seeing people use it for things like personal advice and getting seriously impressive results.\n\nSee: https://twitter.com/daniel_mac8/status/2123413769808138523\n\nDirect image link: https://pbs.twimg.com/media/HXfhhwnXMAA3O9I?format=jpg&name=...\n\nI genuinely don't know how they did it, but I think it's this good for the same reasons ChatGPT was, before the space became oversaturated with RLHF -- sheer data volume.\n\nAnd whatever RLHF they did do seems like it didn't corrupt the model into a specific personality like Claude and ChatGPT are nowadays.\n\nI can definitely see why Apple went with this to help train Siri."}, {"id": 50634603, "au": "whatever1", "dom": 237, "sr": 9, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 0, "age": 18.11, "grav": 222.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 7823, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.482, "fa": 0.34, "gp": 1.627, "bl": 0.0, "ds": 0.0, "txt": "I was asking Claude to make some data entries at scale using playwright in a UI page of ours. There were like 2000 of them that needed to be done. After doing 1000 of them it stopped with the excuse that it is prod environment and the auto mode stopped it. When I pointed out it already did 1000 of them it continued for another 500. At which point it refused to continue .\n\nEverything is fluid folks! Permissions, limits, theft, cyber attacks!"}, {"id": 50639895, "au": "tagfowufe", "dom": 127, "sr": 10, "sc": 6.7, "ep": 6.7, "bs": 0.0, "d": 0, "age": 6.75, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 16, "k": 101, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.648, "fa": 0.42, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "IANAL. The burden/onus of proof is on them, first and foremost. This means that they are the ones that ought to tell you what's wrong, why, and how. Even assuming you already know this by having read all the EULA, such accusation ought to be well-(in)formed, clear and informative.\n\nGranted, in the real world resources matter, and those with more of any units of the relevant ones have an easier time contorting around 'the rules'; so playing by them and following tempos and usual procedures is not something you can afford doing.\n\n> How can you prove that you are not distilling Anthropic models without breaking your user's privacy?\n\nUnless I'm missing anything in the world of privacy-preserving (_shudder_) tech, I believe that the best that can be done is providing a best-effort search of the terms and conditions and contrasting those with your actions up to where your duties with your customers prevent you from going further.\n\nEDIT: I'm not suggesting the obvious (get a lawyer) since a question here priors me to think that it's not an option for whatever the reason."}, {"id": 50639139, "au": "ada-h00k", "dom": 183, "sr": 11, "sc": 6.24, "ep": 6.46, "bs": 0.0, "d": 0, "age": 8.77, "grav": 72.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 254, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.244, "fa": 0.62, "gp": 1.219, "bl": 0.0, "ds": 0.0, "txt": "In case Anthropic doesn't accept the evidence, you should be prepared to have an alternative ready. Either use another provider like OpenAI, or do it through someone else's personal account instead of the company account. Otherwise, you can also buy tokens from resellers. They're less reliable, but they're up to 80% cheaper."}, {"id": 50635458, "au": "K0balt", "dom": 254, "sr": 12, "sc": 6.07, "ep": 7.28, "bs": 0.85, "d": 3, "age": 16.97, "grav": 199.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 190, "qw": 0, "k": 4893, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 2.165, "fa": 0.34, "gp": 0.846, "bl": 0.32, "ds": 0.0, "txt": "No, not feels.\n\nWe run multi-agent open-horizon research and development, including hardware and software / firmware, with persistent agents and subdivisions of scope into product “ownership”, engineering governance, testing and architecture review, document control, standards and specifications, compliance and contracting, etc.\n\nEach office pod of 25-30 persistent agents requires a person to unblock and make critical decisions, review plans and specifications, and just generally to make sure things don’t go off the rails.  We’ve launched 4 successful product systems (hardware/firmware plus mobile and desktop software) so far, and are lower incident and bug report than before we went all in on AI.(2 years ago) of course we are in the AI training vertical so it makes sense that we are AI forward.\n\nThe only thing besides executive roles we don’t have under 99 percent automation is PCB layout (good engineers can make things smaller and better signal integrity) and 3D modeling, which might be getting good enough soon.\n\nI haven tried the new Gemini in our agentic office framework yet, but I’ll have one of the research pods  implement and evaluate it. I hope it works, it would be nice to have a better plan B."}, {"id": 50642561, "au": "dns_snek", "dom": 59, "sr": 13, "sc": 5.82, "ep": 5.82, "bs": 0.0, "d": 4, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 47, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.574, "fa": 0.42, "gp": 0.635, "bl": 0.0, "ds": 0.0, "txt": "> The 'stated objective' was abundant creative works. Mission accomplished.\n\nAbundance (of slop) was never the stated objective, progress was.\n\n> Of course if you imagine the objective was actually to ensure humans had time and space to engage in creative work because humans enjoy that process (a worthy goal in my mind anyway), then you've got an issue.\n\nNot just because humans \"enjoy it\" but because progress will slow down without those humans. Sure, let's come up with a brand new economic system, sounds great. But until we do, copyright is supposed to ensure that people don't throw their hands up and stop innovating because an army of agents is going to clone it anyway.\n\nYou don't just get to upend everything and say \"sucks to be you, figure out something else\" without suffering some long-lasting consequences. That's why the spirit and intent of copyright is being violated, because you are doing that."}, {"id": 50639570, "au": "NitpickLawyer", "dom": 113, "sr": 14, "sc": 5.74, "ep": 5.74, "bs": 0.0, "d": 1, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.926, "fa": 0.0, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "A few weeks ago there was an article posted here about a fingerprinting? js lib that used very \"scary sounding\" variables for regular fingerprinting tasks (deploySarine(), prepareWMDs(), etc...)\n\nIt's likely that any automated poorly thought out scripts that use public big4 API requests would get flagged / refuse the request so any checks would fail. And if your tagging fails open then such libraries could sneak in. If it fails closed, you'd be left with lots of unfinished tasks (i.e. successful poisoning)."}, {"id": 50641441, "au": "jptlnk", "dom": 1, "sr": 15, "sc": 5.57, "ep": 6.01, "bs": 0.0, "d": 0, "age": 2.78, "grav": 16.7, "surf": 15.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 202, "qw": 0, "k": 85, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.443, "fa": 0.56, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "This happened to me with oai, and I only found out bc of a truly bizarre billing issue and reaching out to friends who were at the company.  It took a lot of digging but it turned out they suspected me of distillation and just... didn't tell me.\n\nNot saying it's what you should do, but here's what I would do.  Basically show you're a good actor and you want to work with them.\n\n1) rotate your keys, and tell them.  if your keys were compromised (and lots of keys are) somebody out there COULD be distilling and you would be an \"accessory\" to it.  letting them know that you're rotating JIC is good-actor behavior.\n\n2) don't try to prove something you can't prove.  as many have pointed out, there's no way to demonstrate that you aren't distilling.\n\n3) ask for your day in court.  tell them you want to use their models and want to clear this up, and ask them to provide you with whatever evidence they have (even if all they can give you is a date range or whatever!) so that you can analyze & respond.\n\nif they won't play ball, sucks but tbh it's a big LLM world out there and you have lots of options!"}, {"id": 50633176, "au": "digitaltrees", "dom": 208, "sr": 16, "sc": 5.31, "ep": 5.31, "bs": 0.0, "d": 0, "age": 19.66, "grav": 253.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3546, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "One cant prove a negative. I would hire a lawyer and file suit seeking an injunction. You'll probably lose since they define the terms of service.\n\nDo a scorced earth PR blast so the world is aware of their behavior. They make back down if enough outrage builds.\n\nF them. They distilled the body of human knowledge."}, {"id": 50640561, "au": "NackerHughes", "dom": 220, "sr": 17, "sc": 5.1, "ep": 5.1, "bs": 0.0, "d": 0, "age": 5.0, "grav": 33.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 618, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.354, "fa": 0.28, "gp": 0.77, "bl": 0.0, "ds": 0.0, "txt": "I know I'm late so this is probably going to get buried and no one's going to see it, but here's the right answer anyway:\n\nDon't.\n\nCancel your subscription right now, take your money elsewhere and don't give them another penny.\n\nThe burden of proof is on them to prove you ARE 'distilling'.\n\nIf they're going to throw baseless accusations at you and threaten you to prove you aren't doing what they accuse of you, the correct course of action is to tell them where to go and vote with your wallet.\n\nBecause otherwise you'll spend all that time and effort giving them all sorts of inside information about your company's internal processes for free, and all they're going to do is claim it's insufficient evidence and pull the plug on you anyway."}, {"id": 50633674, "au": "LoganDark", "dom": 210, "sr": 18, "sc": 5.07, "ep": 5.21, "bs": 0.0, "d": 2, "age": 19.18, "grav": 243.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.553, "fa": 0.28, "gp": 0.527, "bl": 0.0, "ds": 0.0, "txt": "Proving a negative requires disproving the existence of a counterexample. Merely providing no counterexample is insufficient to prove the negative.\n\nSome negative proofs are possible by contradiction. When people say you can't prove a negative, it usually means that such a contradiction is impossible.\n\nFor example, to prove that a vulnerability has never been exploited, you must prove either that such exploitation was not possible, or that what exploitation was possible never actually occurred.\n\nThe latter requires accounting for everywhere exploitation could've occurred, which in turn needs you to prove the absence of factors you haven't considered -- another negative."}, {"id": 50633805, "au": "OsrsNeedsf2P", "dom": 73, "sr": 19, "sc": 4.98, "ep": 4.98, "bs": 0.0, "d": 0, "age": 19.06, "grav": 241.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4684, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.076, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Migrate to Bedrock via AWS if you're on Anthropic API. If you have any serious bill, you'll get a dedicated account rep who will be an actual human being you can go through to resolve future issues."}, {"id": 50634971, "au": "aleqs", "dom": 235, "sr": 20, "sc": 4.93, "ep": 5.59, "bs": 0.0, "d": 1, "age": 17.63, "grav": 212.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 319, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.671, "fa": 0.34, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "Yeah, like, I was happy to pay for their max sub indefinitely... until they lowered usage (and thus value) by like 10-20x over the last several months... they just ended losing a user. Now there are multiple significantly better options - DeepSeek, opencode go, Google, etc.\n\nMy suspicion is that they just can't afford to serve their models, because they are not very efficient compute-wise, and because they rent all of their compute from their own competitors (megalulz)"}, {"id": 50633845, "au": "BikiniPrince", "dom": 155, "sr": 21, "sc": 4.92, "ep": 4.92, "bs": 0.0, "d": 0, "age": 19.02, "grav": 240.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.382, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Distillation attacks are spread throughout numerous accounts. You have likely triggered some detection. I think the best approach would be to show your work is part of a real project. As long as you can defend your API usage it should be possible to demonstrate your work has been legitimate. If you have outliers, like you mentioned then explain them."}, {"id": 50634240, "au": "zmmmmm", "dom": 238, "sr": 22, "sc": 4.85, "ep": 5.29, "bs": 0.0, "d": 0, "age": 18.61, "grav": 231.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 22255, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.399, "fa": 0.0, "gp": 1.381, "bl": 0.0, "ds": 0.0, "txt": "We can see the worm turning - post-IPO, Anthropic now knows it is more important to its customers than they are to it. I would be very cautious about building any critical dependency on this company. They need to make a lot of money in a short period of time and anybody they perceive as an impediment to that cause - whether genuine or incidentally - will quickly become a casualty, regardless of your intent."}, {"id": 50633451, "au": "georgemcbay", "dom": 186, "sr": 23, "sc": 4.71, "ep": 4.71, "bs": 0.0, "d": 0, "age": 19.37, "grav": 247.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 16548, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.295, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I have no help to give to OP as I can't imagine how you can prove a negative in this situation, and I have no idea if the OP is innocent or not... but this situation highlights how crazy things would be if the AI-provider landscape really did settle into a monopoly or duopoly.\n\nEvery single person or organization would be one or two misunderstandings from being irrevocably economically handicapped."}, {"id": 50635543, "au": "dofm", "dom": 274, "sr": 24, "sc": 4.49, "ep": 5.29, "bs": 0.0, "d": 3, "age": 16.85, "grav": 197.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.266, "fa": 0.5, "gp": 0.617, "bl": 0.0, "ds": 0.0, "txt": "Much depends on what kind of contract there was and whether the ban is for all future uses.\n\nBut if a supplier accuses my company of stealing (which is what this is, basically) without presenting evidence and bans it, I am going to take that poorly and ask them for the evidence they are using to breach the contract.\n\nThere is no good reason not to take this step when you depend on a supplier. Contracts are legal agreements; you can get your lawyer to look at them and ask questions, and their lawyers should respond."}, {"id": 50633733, "au": "hungryhobbit", "dom": 6, "sr": 25, "sc": 4.41, "ep": 5.58, "bs": 0.0, "d": 1, "age": 19.12, "grav": 242.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1738, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.53, "fa": 0.28, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "I'd suggest vetting with an adversarial Claude also.\n\nAsk Claude A to help you build your evidence doc, then get a completely different session up and tell it \"Claude A compiled this evidence, but our source in Anthropic said it's not good.  Find all the flaws.\"  Then keep telling Claude B \"you haven't found all the mistakes, keep going\" until it \"cries uncle\" and swears there aren't any.\n\nOf course, then you have to vet all of the stuff Claude B found, as it won't all be relevant ... but if you want a solid doc the \"adversarial Claude\" will likely help a ton."}, {"id": 50635318, "au": "EmX_3000", "dom": 226, "sr": 26, "sc": 4.4, "ep": 4.62, "bs": 0.0, "d": 0, "age": 17.16, "grav": 203.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is strange, imagine relying upon a human consultant who declined to do certain assigned work because they were afraid you were trying to ascertain how they reasoned, clamming up, and then taking some of the work they did for you away with them if you didn't prove you weren't doing what the person accused you of doing. They'd quickly lose all reputation and their consulting days would be over with."}, {"id": 50633960, "au": "bastawhiz", "dom": 133, "sr": 27, "sc": 4.17, "ep": 5.27, "bs": 0.0, "d": 1, "age": 18.91, "grav": 238.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 13299, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.723, "fa": 0.0, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "It's not? Get Claude through Bedrock or vertex or foundry if you really need Claude. Or don't build against a single proprietary model. Everyone and their brother has a hot new model these days. AI is arguably the most competitive tech industry right now. Use GPT, grok, Gemini, glm, kimi, mistral, or whatever else solves your problem. There's plenty of open weight models that work just as good for most jobs as frontier models with a bit of elbow grease."}, {"id": 50640321, "au": "Yizahi", "dom": 232, "sr": 28, "sc": 4.16, "ep": 4.16, "bs": 0.0, "d": 0, "age": 5.57, "grav": 38.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 4733, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.013, "fa": 0.28, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "\"It's not distilling, it's learning\" and apparently it is totally legal according to our honest judicial systems around the world."}, {"id": 50633458, "au": "RGS1811", "dom": 122, "sr": 29, "sc": 4.11, "ep": 5.21, "bs": 0.0, "d": 0, "age": 19.36, "grav": 247.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1220, "kpp": 9.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.287, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "I was doing some totally innocuous work on IRS forms last night and had a subagent flagged for \"reasoning extraction\". I wonder if they've increased the sensitivity of whatever auto-detection they're doing recently."}, {"id": 50641019, "au": "thephyber", "dom": 33, "sr": 30, "sc": 4.04, "ep": 5.36, "bs": 0.0, "d": 3, "age": 3.84, "grav": 24.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.594, "fa": 0.34, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "You are saying \"the 1A assures freedom\", but that's only from the government.\n\nAnthropic should have the right to ban any one malicious user.\n\nBut what if there are only a few companies in that space and they all use the same terrible heuristic for banning that causes lots of false positives?\n\nAnalogy: email is a distributed protocol that anyone can \"use\". But email delivery into inboxes of 90%+ of email users is effectively a cartel by the top ~5 email companies and the allow lists / block lists they use. Any one of these companies should have the freedom to ban you for bannable actions, but what if all 5 ban you for a reason they can't justify? (eg. All 5 used a bad heuristic and had no human review the ban rationale)."}, {"id": 50638430, "au": "anon373839", "dom": 34, "sr": 31, "sc": 3.94, "ep": 4.39, "bs": 0.0, "d": 3, "age": 10.74, "grav": 97.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 12, "k": 5207, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.197, "fa": 0.42, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "> Companies get to refuse service to potential customers if they want to.\n\nBut Anthropic has stated that it should/will be the only AI provider that lasts, the \"winner\" that \"takes all\" (in Anthropic's own words). It has also stated that its product will subsume all human economic activity. These are preposterous ideas. But if that is the ambition they are working toward, I don't think they should be allowed to refuse service to whomever they wish."}, {"id": 50639542, "au": "taylorfinley", "dom": 21, "sr": 32, "sc": 3.94, "ep": 5.48, "bs": 0.0, "d": 3, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 2037, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.885, "fa": 0.0, "gp": 0.726, "bl": 0.0, "ds": 0.0, "txt": "I took this a step further and mined all my colleagues' git review history to find out what they typically care about, then had an agent review my PR against the reviewer's typical feedback checklist before submitting it.\n\nTook it another step further and created a tool to extract anonymized review personas from open source projects. Basically: find the projects with the most similar types of problems (could be by tech stack or by product domain), create composite personas from that history, then request a review from each persona. It was pretty unreasonably effective and saved me many rounds of PR feedback."}, {"id": 50634430, "au": "demo4567", "dom": 131, "sr": 33, "sc": 3.75, "ep": 3.97, "bs": 0.0, "d": 0, "age": 18.34, "grav": 226.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 34, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 0.98, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Anthropic is not the only game in town. Get an LLM router, switch providers and write your own evals. Who cares what Anthropic's made up garbage ToS are. Stop using them if they don't give you what you need."}, {"id": 50635309, "au": "dabinat", "dom": 152, "sr": 34, "sc": 3.68, "ep": 4.78, "bs": 0.0, "d": 0, "age": 17.17, "grav": 203.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 4610, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.323, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I personally believe that building a business entirely dependent on someone else’s product that they control is very dangerous. I would recommend figuring out a way to generalize so you can swap providers as needed and not have it be a big deal. It’ll take some time and resources up front but it’ll be worth it in the flexibility you’ll have that will allow your company to stay nimble."}, {"id": 50634472, "au": "sebzim4500", "dom": 169, "sr": 35, "sc": 3.6, "ep": 4.04, "bs": 0.0, "d": 1, "age": 18.27, "grav": 225.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 6803, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.315, "fa": 0.22, "gp": 0.22, "bl": 0.0, "ds": 0.0, "txt": "They aren't making public accusations so there is no slander/libel argument. The only potential case you could possibly make is to claim they have violated their contract, but unless they had Haiku draft their TOS that sounds unlikely to work. Ultimately they can refuse service to whoever they want."}, {"id": 50634199, "au": "SaucyWrong", "dom": 79, "sr": 36, "sc": 3.5, "ep": 4.75, "bs": 0.0, "d": 2, "age": 18.66, "grav": 233.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 255, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.674, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "I wouldn’t be surprised if Anthropic is able to build a cumulative risk score that predicts whether a customer is attempting to distill without retaining any data in a way that falls afoul of the ZDR.\n\nAlso, IIRC from reading the ZDR when I was looking into it, there is a carve-out that permits them to retain data that fails a risk score for breaking laws or attempting to violate safety, and as we know, Anthropic loves to frame distillation as a safety concern."}, {"id": 50633958, "au": "chatmasta", "dom": 123, "sr": 37, "sc": 3.42, "ep": 3.56, "bs": 0.0, "d": 1, "age": 18.91, "grav": 238.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 20952, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "It’s happened to me when asking it to look at past session transcripts, export earlier chats as HTML pages, look at tool calls from previous sessions… that sort of thing seems to trigger an overeager classifier."}, {"id": 50639503, "au": "Rodmine", "dom": 184, "sr": 38, "sc": 3.39, "ep": 4.49, "bs": 0.0, "d": 0, "age": 7.79, "grav": 60.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 8, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.376, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "Wish you best of luck for this. I hope you realize that you whatever you build using closed AI, you are always at a risk of getting arbitrarily blocked without recourse. Invest at least in provider-agnostic solutions and build towards open weights."}, {"id": 50642876, "au": "WarmWash", "dom": 56, "sr": 39, "sc": 3.37, "ep": 3.73, "bs": 0.0, "d": 3, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 23, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.025, "fa": 0.42, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": ">Which is a travesty. Clearly they're infringing the spirit and motivation of the copyright law in a way that's detrimental to its stated objectives.\n\nCan you show me how I can pull copyrighted works out of the current crop LLMs?\n\nYes I am aware that you could pull large excerpts from earlier, but they have mostly fixed that.\n\nIts extremely difficult to make the case that people are forgoing specific media purchases because they are using an LLM to get it instead."}, {"id": 50633436, "au": "kmeisthax", "dom": 149, "sr": 40, "sc": 3.26, "ep": 3.7, "bs": 0.0, "d": 1, "age": 19.39, "grav": 247.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 15086, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.458, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Big Tech categorically refuses to do this. The risk department is full of Maoists. They are judge, jury, and executioner; and if they told you what crime you were guilty of you'd just find an easier way to not get caught. Enumeration is a hard problem so they'd much rather have you look through their policies and overcomply, rather than them spending time and money figuring out what you did wrong so you can undercomply."}, {"id": 50633544, "au": "varispeed", "dom": 185, "sr": 41, "sc": 3.13, "ep": 4.23, "bs": 0.0, "d": 0, "age": 19.28, "grav": 245.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3198, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.09, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is why I don't use Anthropic for any serious work, when it has flagged normal work for cyber security exploit many times and stopping the session, forcing me to start over and lose money."}, {"id": 50633292, "au": "Cameri", "dom": 240, "sr": 42, "sc": 3.06, "ep": 4.16, "bs": 0.0, "d": 0, "age": 19.53, "grav": 250.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 200, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.059, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Use another provider. They spent billions distilling the world’s data and now have the audacity to block others from distilling them.\nThey are also becoming the everything company so eventually they will copy your business (the one you’ve been handing to them freely) and block you once they’ve had it all."}, {"id": 50634719, "au": "throw_m239339", "dom": 89, "sr": 43, "sc": 3.0, "ep": 3.66, "bs": 0.0, "d": 2, "age": 17.97, "grav": 219.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 17, "k": 4806, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 0.52, "fa": 0.34, "gp": 1.016, "bl": 0.0, "ds": 0.0, "txt": "> Agreed but even if they move to another provider, it’s not something that can be done overnight.\n\nwhat choice does he have? He has 24 hours until Anthropic shuts down their API access. He should get started right now."}, {"id": 50642853, "au": "WarmWash", "dom": 53, "sr": 44, "sc": 2.99, "ep": 3.72, "bs": 0.0, "d": 4, "age": 0.31, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.215, "fa": 0.28, "gp": 0.047, "bl": 0.0, "ds": 0.0, "txt": "We already have court precedent in the US from the Anthropic case:\n\nTraining on copyright is sufficiently transformative to not be a violation.\n\nPirating content to train on is still a violation.\n\nSo they can train on whatever they want as long as they either paid for it or it's freely available."}, {"id": 50630855, "au": "davydm", "dom": 200, "sr": 45, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 0, "age": 22.27, "grav": 311.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 277, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.548, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "All I can think of, off the bat, is to show them your testing harness, especially if it's in git, then you have receipts for how long it's been alive."}, {"id": 50634026, "au": "sheepscreek", "dom": 74, "sr": 46, "sc": 2.93, "ep": 4.32, "bs": 0.0, "d": 1, "age": 18.86, "grav": 236.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.797, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "This is a good suggestion.\n\nA thought just occurred to me: I believe Bedrock supports ZDR, in that case, how the heck would Anthropic ever know how are the models being used?"}, {"id": 50638893, "au": "anigbrowl", "dom": 173, "sr": 47, "sc": 2.9, "ep": 3.7, "bs": 0.0, "d": 2, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 101762, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.487, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "The point is not to threaten Anthropic with losing a lawsuit, but to get their legal department to pay attention and articulate clearly what the issue is before it possibly takes down OPs business. In a normal commercial relationship you would be able to call up and talk to someone to resolve the problem; this is a case of 'computer says no' on steroids and OP is scrambling to unilaterally solve an ill-defined problem."}, {"id": 50636804, "au": "protocolture", "dom": 141, "sr": 48, "sc": 2.82, "ep": 4.07, "bs": 0.0, "d": 2, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 15, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.222, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">And if you don't like the idea of government regulation, you haven't seen a company regulate.\n\nI have seen good and horrendous examples of both tbh. And I mean, a company is a legal fiction created to limit the liability of certain people engaged in a particular enterprise. Anything a company regulates is really just government regulation at the end of the day."}, {"id": 50633091, "au": "arjie", "dom": 117, "sr": 49, "sc": 2.7, "ep": 3.58, "bs": 0.0, "d": 0, "age": 19.75, "grav": 255.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 10985, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "That's got to suck. You're sure you haven't lost your API keys in some way, right?  I've never had to deal with this but that would be my first thought. That someone stole my keys from somewhere and they're actually running distillation."}, {"id": 50640090, "au": "mrweasel", "dom": 145, "sr": 50, "sc": 2.69, "ep": 3.79, "bs": 0.0, "d": 1, "age": 6.21, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 24475, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.518, "fa": 0.0, "gp": 0.153, "bl": 0.0, "ds": 0.0, "txt": "I was going to say the same. Tell them to fuck off. How do they imagine you prove that you didn't attempt to distil their model? If they can't even be bothered to ask you politely to explain a \"strange\" usage pattern, then you should take your business elsewhere.\n\nThis is such a big tech dick move, automatically flag your account, providing no real human interaction to resolve the issue and just threaten to close your account. Your experience should serve as a warning to anyone trying to build a business on Anthropics APIs."}, {"id": 50639715, "au": "Brian_K_White", "dom": 190, "sr": 51, "sc": 2.52, "ep": 3.18, "bs": 0.0, "d": 0, "age": 7.26, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 8732, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.828, "bl": 0.0, "ds": 0.0, "txt": "You don't. You arrange not to care what they or anyone else thinks.\n\nIt's not a matter of being sympathetic to your problem, there is no other answer. It's like asking what can you do about the rain. You can only deal with the rain, not control it."}, {"id": 50640696, "au": "nixpulvis", "dom": 27, "sr": 52, "sc": 2.51, "ep": 4.05, "bs": 0.0, "d": 4, "age": 4.68, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 4737, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.501, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Your comment really makes so perfectly clear an issue I've been stressing about for years now.\n\nAs we move more and more core services and products to account-based access, we give up the ability to reliably access those services and products. And as the companies behind them get larger and larger, they care less and less about keeping your business and more and more about protecting themselves.\n\nImagine getting banned from Coke for drinking one while accused of jaywalking."}, {"id": 50633078, "au": "tasuki", "dom": 221, "sr": 53, "sc": 2.46, "ep": 3.56, "bs": 0.0, "d": 0, "age": 19.77, "grav": 256.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 5542, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 0.804, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "It's a stupid accusation to begin with. How could they ever know? They're just afraid of distillation, so they accuse people left and right. If you do not enjoy that, I suggest you take your business elsewhere."}, {"id": 50633800, "au": "dofm", "dom": 271, "sr": 54, "sc": 2.39, "ep": 3.78, "bs": 0.0, "d": 2, "age": 19.07, "grav": 241.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.597, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "I'm sure they are not, but it is a serious aspersion, isn't it? And one assumes it comes with a ban against using the service and the increased likelihood of future accounts being booted off (because they will presumably characterise that as circumvention)\n\nWhen Anthropic are basically one of the three entities controlling the taps of agentic AI, being excluded baselessly is demonstrably materially damaging.\n\nIt's on the level of being banned from Mastercard.\n\nFrankly I would be taking the \"unreasonable\" approach and asking them to substantiate their claim or retract it. It's a legal letter; given how much companies are spending on AI, there is little to lose."}, {"id": 50640125, "au": "mrweasel", "dom": 197, "sr": 55, "sc": 2.36, "ep": 3.6, "bs": 0.0, "d": 1, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 24475, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.443, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "I seriously doubt there's a human on the other side of this to invite to anything. This is just incredibly poor customer service / customer relations from Anthropic, who really needs to learn what it means to run a real business with real customers.\n\nThis is the business equivalent of you getting your Google account blocked for \"suspicious behaviour\" and not being able to talk to customer service at Google."}, {"id": 50634462, "au": "bigfatkitten", "dom": 31, "sr": 56, "sc": 2.36, "ep": 3.87, "bs": 0.0, "d": 3, "age": 18.29, "grav": 225.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3074, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.73, "bl": 0.0, "ds": 0.0, "txt": "They could’ve just nuked OP’s account on the spot if they wanted to.\n\nDealing with vendors has risks. If you rely on a vendor to make money, then you need to have a plan for if that vendor stops being available (their service goes down, they go broke, or they ban you.)"}, {"id": 50639055, "au": "Sophira", "dom": 7, "sr": 57, "sc": 2.36, "ep": 3.83, "bs": 0.0, "d": 2, "age": 9.04, "grav": 75.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1743, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.714, "fa": 0.28, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "Why would you use Claude for that? Isn't that basically leaving tracks that Anthropic can point to and say that your evidence isn't in good faith?\n\nFeels to me like if you're going to do that, it would be better to use either a local model or an OpenAI model."}, {"id": 50640829, "au": "busssard", "dom": 29, "sr": 58, "sc": 2.36, "ep": 3.75, "bs": 0.0, "d": 5, "age": 4.31, "grav": 27.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 289, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.594, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Service Providers could ban you from using their services for a long time.\n\nShopping centers could ban you from entering.\nBanks could ban you from doing a certain kind of business there.\nTransport companies could ban you from buying tickets.\nVisa/Mastercard can ban transfers.\nISP can ban your website.\nTelecom can ban your use of their network.\n\nSo now the brain lords can stop you from using their brains."}, {"id": 50638277, "au": "K0balt", "dom": 256, "sr": 59, "sc": 2.36, "ep": 6.75, "bs": 3.05, "d": 5, "age": 11.14, "grav": 103.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 505, "qw": 0, "k": 4893, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.886, "fa": 0.34, "gp": 0.928, "bl": 1.15, "ds": 0.0, "txt": "Opus 4.8 was the first model that enabled the open horizon collaborative architecture. We haven’t been able\nTo get any of the openAI models to avoid system collapse reliably. None of the Chinese models either, though surprisingly flash-next kinda works. we use opus and fable, primarily. I’m sure there are ways to get similar results from other models, with experimentation… but Claude seems better at the open ended work, and handles the permission structure more adeptly.\n\nFor our system it’s the only model we can leave running for a week (inside a complex agentic harness with numerous checks and balances, specifications, standards, procedures, and multi-agent command hierarchy) and expect to actually come back to something worthwhile.\n\nWe rarely find “bugs” now at all. What does occasionally surface is bad judgment.  To wit, recently I was very busy doing field trials on a new system before a contract deadline , and I left one of the pods I was supervising alone for the better part of a week.\n\nAbout three days in they discovered a problem with the calibration on some sensor swarm  boards that they were working with in their bench, and they needed to be calibrated separately for each of the different capture modes on one of the MEMS sensors. It wasn’t in the datasheet, but the cal taken in one mode would be reliably slightly drifty in another, they discovered during characterizat"}, {"id": 50640711, "au": "jampekka", "dom": 136, "sr": 60, "sc": 2.36, "ep": 3.66, "bs": 0.0, "d": 2, "age": 4.63, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5135, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 0.039, "bl": 0.0, "ds": 0.0, "txt": "You dont have to use the internet. Nor a computer, a phone, a bank account, electricity, running water, clean clothes, soap etc. People lived for hundreds of thousands of years with very rudimentary technology. And many still do. So you'd be fine with getting arbitrarily cut off from those technologies too?"}, {"id": 50641377, "au": "yorwba", "dom": 57, "sr": 61, "sc": 2.36, "ep": 3.58, "bs": 0.0, "d": 3, "age": 2.92, "grav": 17.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 16195, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.057, "fa": 0.28, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "Copyright was invented to deal with the drawbacks of easy replication through the printing press while still harnessing the benefits. So applying the spirit of copyright law to LLMs implies distinguishing between different uses of the technology, as some are detrimental while others are not."}, {"id": 50642267, "au": "andy_ppp", "dom": 2, "sr": 62, "sc": 2.36, "ep": 3.58, "bs": 0.0, "d": 1, "age": 1.26, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 12121, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.422, "fa": 0.0, "gp": 0.165, "bl": 0.0, "ds": 0.0, "txt": "Regarding 2, you can itemise the usage over the last month say and explain every API AI call... AI can help you do this probably. Hopefully you have logs or can generate them?\n\nThen make Claude give a summary of the usage and explain to them this is the unedited analysis of log entries - then ask them, \"can you confirm if anything here is wrong? we can stop doing whatever tasks on this list you don't like\".\n\nI think this would go a long way to provide proof of what you are doing is okay! In the end this can obviously be faked too - but I think taking the time to show what you are doing will potentially be enough."}, {"id": 50634352, "au": "shaaaade", "dom": 247, "sr": 63, "sc": 2.36, "ep": 3.56, "bs": 0.0, "d": 2, "age": 18.44, "grav": 228.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 11, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.175, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "preference does not constitute a necessity. they are corporations that can, and demonstrably will shut you out at their discretion. should you perhaps prefer to vote with your wallet, and not engage in supporting such business practice? It seems to be a weird preference (read: chasing a few percentage points on made-up benchmarks) to have your business ride on such a knife's edge."}, {"id": 50635932, "au": "techjamie", "dom": 41, "sr": 64, "sc": 2.35, "ep": 3.39, "bs": 0.0, "d": 1, "age": 16.22, "grav": 185.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.387, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "The is why, when my various cybersecurity projects get flagged and refused, I justify why I'm asking it to perform the action and usually get it to agree with me that it's the right course, but the filter won't let it proceed.\n\nThat way if they ever get on my case, my assumption is if there's a human review at all, it's probably just Claude pointing out pieces and giving an opinion, then a human hits the button.\n\nOr, more likely, there is no human reviewing it and it's Claude all the way down. Either way, by getting Claude to agree with me in the moment, I'm hopefully keeping myself out of the crosshairs."}, {"id": 50635926, "au": "hungryhobbit", "dom": 15, "sr": 65, "sc": 2.35, "ep": 3.38, "bs": 0.0, "d": 3, "age": 16.23, "grav": 186.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1738, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.376, "fa": 0.0, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "It has absolutely nothing to do with the model.\n\nUse Fable if you want.  Hell, get some secret new model: I still guarantee (for any serious project, meaty enough to demonstrate this ... like the OP's defense): the model will hallucinate some stuff and omit some stuff.  It's just what all models do.\n\nThis adversarial approach is a well-known way to work around the issues all LLMs have (or at least, all so far)."}, {"id": 50634881, "au": "aleqs", "dom": 204, "sr": 66, "sc": 2.35, "ep": 3.37, "bs": 0.0, "d": 0, "age": 17.74, "grav": 214.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 319, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.726, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Why are you even using anthropic anymore? I just switched over to google - neon is better than opus/fable for significantly cheaper"}, {"id": 50634467, "au": "LoganDark", "dom": 242, "sr": 67, "sc": 2.35, "ep": 3.35, "bs": 0.0, "d": 1, "age": 18.28, "grav": 225.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.088, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For the same reasons competitive games don't ban cheaters immediately:\n\n- Someone may raise flags of cheating due to luck or skill, but turn out over time to not actually be cheating.\n\n- You need to highly obfuscate the source of the ban to hinder cheat developers."}, {"id": 50641778, "au": "Lerc", "dom": 49, "sr": 68, "sc": 2.35, "ep": 3.31, "bs": 0.0, "d": 3, "age": 2.05, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 7520, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.317, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "Yeah but as the saying goes.  If you could download a car, you totally would.\n\nThey haven't stolen your information.  You still have it.\n\nTo the same extent,  they may not own the weights to their model.  They possess it, but as machine generated data, it might not be protected by copyright.\n\nIf someone walked out with The top model on an SD card,  They might be legally clear.  There would however be some people prepared to spend a few billion dollars testing that legality."}, {"id": 50641285, "au": "ThunderSizzle", "dom": 62, "sr": 69, "sc": 2.35, "ep": 3.27, "bs": 0.0, "d": 3, "age": 3.15, "grav": 19.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1224, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Anthropic is not in a position to justify that a model needs or doesn't need safeguards.\n\nBy I am one of those crazy people that think people have rights until they violate the rights of others. Running a non-safeguarded model is a natural right unless you are violating others' rights with it.\n\nAnd running a local model to avoid a cloud subscription is not violating the cloud right to try their attempt at commerce. Commerce is voluntary."}, {"id": 50641098, "au": "thephyber", "dom": 40, "sr": 70, "sc": 2.35, "ep": 3.18, "bs": 0.0, "d": 5, "age": 3.68, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.013, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your examples leave a lot to be desired.\n\nClubs are a dime a dozen in any city. If you get rejected from one, (1) they are commodities so you can find another a block away with a doorman who is in a better mood and (2) they don't block your ability to make a living (eg. You can listen to music, dance, drink, and meet people at other venues). These aren't comparable if you believe that Claude Code is a substantially different/superior product than the competitors offerings.\n\nCredit checks and insurance quotes are generally regulated by states. You can be denied or they can give you ridiculous terms assuming they aren't violating a protected category by doing so. But when home insurance rates in California and Florida are driven so high that it causes social and political instability (eg. By fire claims and hurricane claims, respectively), then the industry should expect more oversight.\n\nThe LLM business is interesting because it is so new and states haven't yet started building in protections. But how they act now will ultimately be used as evidence for when they are regulated in the future."}, {"id": 50641028, "au": "m000", "dom": 51, "sr": 71, "sc": 2.35, "ep": 3.16, "bs": 0.0, "d": 2, "age": 3.82, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 25, "k": 2853, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.495, "fa": 0.7, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> They do not own the information that Claude generates, and even if they did it would still be fair use to train a model on it.\n\nSo they pretend to be the Robin Hoods* of information? They steal, but it's ok because they don't directly appropriate the results of the theft?\n\n* With the difference that Robin Hood was not charging a fee for his services."}, {"id": 50641849, "au": "hoppyhoppy2", "dom": 17, "sr": 72, "sc": 2.35, "ep": 3.14, "bs": 0.0, "d": 2, "age": 1.9, "grav": 11.6, "surf": 20.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3394, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.05, "bl": 0.0, "ds": 0.0, "txt": "\"A review of your user history shows that your user set up an adversarial bot system with the intent to evade Anthropic's Terms of Service by generating and submitting deceptive information to our account review process. Banned.\""}, {"id": 50641706, "au": "joenot443", "dom": 52, "sr": 73, "sc": 2.35, "ep": 3.13, "bs": 0.0, "d": 3, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 4273, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 1.331, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's a very complicated and interesting moral discussion to be had about whether what frontier labs are doing is stealing, copying, distilling, or mining. Probably none of the words are a perfect descriptor.\n\nIn any case, the more relevant discussion now is whether what they're doing is legal under current US law. Whether something is \"ok\" under the law is much easier to decide on than whether it's morally acceptable."}, {"id": 50633946, "au": "jostmey", "dom": 234, "sr": 74, "sc": 2.35, "ep": 3.12, "bs": 0.0, "d": 0, "age": 18.92, "grav": 238.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 4444, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 0.619, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Sounds like Anthropic has no business moat if they’re going after paying customers. Not a good look after IPO"}, {"id": 50634272, "au": "anigbrowl", "dom": 24, "sr": 75, "sc": 2.35, "ep": 3.1, "bs": 0.0, "d": 1, "age": 18.56, "grav": 231.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 101762, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.237, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "Nothing personal, but I think this is terrible advice. Somehow we've normalized technology companies making arbitrary judgments and acting as their own appeals process, while putting the onus on users to prove their innocence of substance- and detail-free accusations. Accepting these Kafkaesque asymmetries as normal is not the mark of a healthy society."}, {"id": 50634313, "au": "jtrn", "dom": 180, "sr": 76, "sc": 2.35, "ep": 3.03, "bs": 0.0, "d": 0, "age": 18.5, "grav": 229.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 942, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 0.581, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "How do you know that someone doesn't has a infected computer or an api key owned by your company has not leaked and is used for distilling?"}, {"id": 50633814, "au": "whywhywhywhy", "dom": 84, "sr": 77, "sc": 2.35, "ep": 2.97, "bs": 0.0, "d": 0, "age": 19.05, "grav": 241.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 11358, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 0.555, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "What's the point continuing giving money to a company that treats you like this? They're not the only provider in town."}, {"id": 50641994, "au": "lukan", "dom": 111, "sr": 78, "sc": 2.35, "ep": 3.81, "bs": 0.85, "d": 4, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.281, "fa": 0.28, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I know, my point was just that there exists more than \"good enough\" and that it is subjective. Opus 5.5 is decent, but for some tasks in my experience indeed not good enough, where fable on max is way better (but also way more expensive).\n\nComplex codebase and architecturing decisions and 3D graphic asset generation are the 2 things where I really see a difference. Fable is also not perfect, but often indeed \"good enough\" without needing change. Opus is good enough to directly control blender for instance, to make specific changes with the toolset (that I after years of using blender still don't really understand all). But opus on its own to generate the full asset got me mediocre results here, so \"not good enough\"."}, {"id": 50642497, "au": "999900000999", "dom": 3, "sr": 79, "sc": 2.35, "ep": 2.92, "bs": 0.0, "d": 1, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 7271, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.241, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As for 3.\n\nYou can’t force someone to do business with you unless I guess it’s a civil rights violation.\n\nI don’t see any indication of that here.\n\nThis entire thread is truly strange. Alright cool , OP begs for a second chance and in 2 weeks Anthropic flags them again.\n\nMight as well make the switch now!"}, {"id": 50640258, "au": "nicce", "dom": 13, "sr": 80, "sc": 2.35, "ep": 2.88, "bs": 0.0, "d": 3, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 26, "k": 6091, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 0.376, "fa": 0.7, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Why would you use Claude for that? Isn't that basically leaving tracks that Anthropic can point to and say that your evidence isn't in good faith?\n\nWhy it is not in good faith if a real person is not reading it anyway? It is only in bad faith if the reasoning and evidence is fake or not truthful. That matters the most."}, {"id": 50640764, "au": "laylower", "dom": 178, "sr": 81, "sc": 2.35, "ep": 2.84, "bs": 0.0, "d": 0, "age": 4.48, "grav": 28.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 0.516, "fa": 0.28, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "What evidence have they cited to accuse you of distilling? Burden of proof and all that"}, {"id": 50641944, "au": "sebastianconcpt", "dom": 146, "sr": 82, "sc": 2.35, "ep": 2.83, "bs": 0.0, "d": 0, "age": 1.75, "grav": 10.8, "surf": 23.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2155, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "The burden of proof is on the accuser not the accused.\n\nUrgently be ready to not need them by the way.\n\nMake this become a non-issue by design by commoditizing the AI platform and models.\n\nOnce you do that you will make yourself able to say: that accusation is baseless because my service doesn't use Anthropic services."}, {"id": 50633128, "au": "unyttigfjelltol", "dom": 282, "sr": 83, "sc": 2.35, "ep": 2.81, "bs": 0.0, "d": 0, "age": 19.72, "grav": 254.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 4293, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.197, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Another tech company that invites you to embed their solutions in every part of your business and life and then randomly, arbitrarily and without advance warning, locks you out. Bad for business, all the way around."}, {"id": 50634075, "au": "arjie", "dom": 119, "sr": 84, "sc": 2.35, "ep": 2.81, "bs": 0.0, "d": 2, "age": 18.8, "grav": 235.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 10985, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.197, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Indeed, but if they're running a lot of usage, the distillation attack might be hidden in it. They're pretty sophisticated and you can query usage to throttle. A distiller is usually distributing across a large number of keys and they'll do this to keep from being discovered."}, {"id": 50638859, "au": "anigbrowl", "dom": 37, "sr": 85, "sc": 2.35, "ep": 2.8, "bs": 0.0, "d": 3, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 101762, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "No. In that case it's very clear. If you walk in without a shirt and they 'say you have no shirt, we won't serve you' you have a clear idea of why you were refused. If you walk in with a shirt and shoes and they say 'you've violated our dress code' without giving you any idea of what they find objectionable, that's quite different.\n\nIn OP's case they accused him of doing something without providing detail on why they think that, putting OP in the position of trying to guess how the ToS was violated."}, {"id": 50634092, "au": "pessimizer", "dom": 215, "sr": 86, "sc": 2.35, "ep": 2.79, "bs": 0.0, "d": 3, "age": 18.77, "grav": 235.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a US company in the 21st century, right? Everybody is already liable for losses. Any catastrophe caused by Anthropic will be paid for by the public, while the founders walk away with billions."}, {"id": 50639704, "au": "baobabKoodaa", "dom": 105, "sr": 87, "sc": 2.35, "ep": 2.79, "bs": 0.0, "d": 5, "age": 7.29, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 5871, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I thought this thread asked about switching the model, not about using the same model via a different probider. Upthread the question that was asked was what's the point of continuing to give money to a provider who treats you this way, and the provider was referencing Anthropic. If you were to switch to a different provider but continued to use Anthropic models, you'd still be giving money to Anthropic, so it seems fair to assume the implication was to switch the model too."}, {"id": 50634226, "au": "0xbadcafebee", "dom": 82, "sr": 88, "sc": 2.35, "ep": 2.79, "bs": 0.0, "d": 1, "age": 18.63, "grav": 232.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.185, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AWS will still disable your Bedrock access to Anthropic if you sneeze too loud. I'm right now writing up an email to AWS to get our production account un-blocked. Sure, a human will review it, but we've still had no access for days.\n\nMy advice is move to a less-crappy AI provider. I can't convince my teams, but maybe you can yours."}, {"id": 50636020, "au": "nitwit005", "dom": 263, "sr": 89, "sc": 2.35, "ep": 2.75, "bs": 0.0, "d": 0, "age": 16.1, "grav": 183.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 9525, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.5, "fa": 0.0, "gp": 1.088, "bl": 0.0, "ds": 0.0, "txt": "The request itself is a bit illogical. What can you say beyond \"We do not train our own models\"?"}, {"id": 50642431, "au": "staticman2", "dom": 174, "sr": 90, "sc": 2.35, "ep": 2.7, "bs": 0.0, "d": 3, "age": 0.99, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2156, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I guess you can give it the old college try but I don't see why Anthropic's legal department would be tasked with \"articulate clearly what the issue is\" when a lawyer sends them a letter.\n\nThey have zero incentive to articulate anything."}, {"id": 50640675, "au": "mytailorisrich", "dom": 130, "sr": 91, "sc": 2.35, "ep": 2.69, "bs": 0.0, "d": 1, "age": 4.72, "grav": 30.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 6811, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, I think the reply should be a firm denial with a statement of how and for what purpose the company uses the API in line with the T&Cs, and that's it.\n\nYou cannot prove a negative.\n\nAnyway, as you wisely wrote, any replies should be drafted by a lawyer."}, {"id": 50640067, "au": "lukan", "dom": 8, "sr": 92, "sc": 2.35, "ep": 2.69, "bs": 0.0, "d": 3, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.803, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Isn't that basically leaving tracks that Anthropic can point to and say that your evidence isn't in good faith?\"\n\nOnly if there ever was distillation. If there wasn't and this is just a way to use automation to pass automated tests,
