then a manual review will just find that."}, {"id": 50640792, "au": "gruez", "dom": 61, "sr": 93, "sc": 2.35, "ep": 2.69, "bs": 0.0, "d": 2, "age": 4.4, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 45872, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Their official justification is that distillation will allow the creation of models without safeguards. The argument might be conveniently self serving, but is at least internally consistent"}, {"id": 50642975, "au": "ryandrake", "dom": 4, "sr": 94, "sc": 2.35, "ep": 2.66, "bs": 0.0, "d": 2, "age": 0.08, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.132, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is the way. Don’t do business with companies that treat you like this. By accusing you, they are sort of telling you they don’t want you as a customer. So why do you want to be their customer??\n\nWe get this in discussions about credit card chargebacks too:\n\nA: Company X kept my money and didn’t provide Y.\n\nB: Do a credit card chargeback and move on.\n\nA: But then Company X will close my account and ban me!\n\nWhy do you want to do business with a company that treats you like this?"}, {"id": 50633878, "au": "fourside", "dom": 86, "sr": 95, "sc": 2.35, "ep": 2.65, "bs": 0.0, "d": 1, "age": 19.0, "grav": 239.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 780, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.419, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Agreed but even if they move to another provider, it’s not something that can be done overnight."}, {"id": 50642299, "au": "alcomatt", "dom": 223, "sr": 96, "sc": 2.35, "ep": 2.56, "bs": 0.0, "d": 0, "age": 1.22, "grav": 8.2, "surf": 31.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 70, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "Every AI frontier lab distilled human knowledge mostly without any permission to do so. It is ironic that they keep on throwing tantrums when others want to do the same."}, {"id": 50640296, "au": "ascorbic", "dom": 39, "sr": 97, "sc": 2.35, "ep": 2.56, "bs": 0.0, "d": 4, "age": 5.64, "grav": 38.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 7692, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Have you never tried to get into a club with a dress code that is basically \"whether the doorman likes the look of you\", even if the written code is supposedly clear? You're not getting a right of appeal against that, you just take your friends and go elsewhere.\n\nOr a more serious example: credit checks or insurance quotes. Good luck getting a reason out of them, and as a bonus the check shows on your credit file so you're more likely to be refused elsewhere too"}, {"id": 50634163, "au": "loneboat", "dom": 246, "sr": 98, "sc": 2.35, "ep": 2.55, "bs": 0.0, "d": 1, "age": 18.7, "grav": 233.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 155, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why the mocking tone? Not all providers are created equal, and OP ostensibly preferred Anthropic at one point. Having a preference like that upended can be non-trivial for a running business."}, {"id": 50635646, "au": "garciasn", "dom": 16, "sr": 99, "sc": 2.35, "ep": 2.54, "bs": 0.0, "d": 3, "age": 16.7, "grav": 194.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 3338, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The point is that Anthropic will be using Claude (although likely an internal / unreleased version) and to get it to the point where Claude is reporting it's clear in the hopes that Anthropic's internal version will as well.\n\nWhile I agree you should be using multiple models for something like this, that misses the point the parent was making."}, {"id": 50641436, "au": "jliptzin", "dom": 10, "sr": 100, "sc": 2.35, "ep": 2.54, "bs": 0.0, "d": 5, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5141, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_business", "flbl": "Company & Business (Ban)", "urls": [], "ig": 0.74, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "24hr is a lot more than I would expect from other companies. For example, if it were Meta they’d completely nuke the account from orbit without warning or recourse."}, {"id": 50633827, "au": "enlyth", "dom": 20, "sr": 101, "sc": 2.35, "ep": 2.5, "bs": 0.0, "d": 2, "age": 19.04, "grav": 240.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 3416, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hah, I do this all the time with my code. Normally you write something with the help of Claude, and then ask for a review. What's the reviewer gonna do? Ask Claude to review it.\n\nSo I just skip straight to doing that myself with a second Claude session"}, {"id": 50633748, "au": "BikiniPrince", "dom": 283, "sr": 102, "sc": 2.35, "ep": 2.44, "bs": 0.0, "d": 1, "age": 19.11, "grav": 242.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’m platform agnostic. It required writing tools and services for products they already have. However, mine run cheaper and integrate with any agent. Those golden handcuffs look nice with perls I’m sure."}, {"id": 50633138, "au": "jmount", "dom": 227, "sr": 103, "sc": 2.35, "ep": 2.43, "bs": 0.0, "d": 0, "age": 19.71, "grav": 254.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 4522, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prove_negative", "flbl": "Prove & Negative (Service)", "urls": [], "ig": 0.326, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Doesn't matter what you did, didn't do, or can prove, what matters is what Anthropic decides."}, {"id": 50635538, "au": "leafingensemble", "dom": 80, "sr": 104, "sc": 2.35, "ep": 2.4, "bs": 0.0, "d": 2, "age": 16.86, "grav": 197.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The answer to this puzzle is that Anthropic on Bedrock has zero data retention, but it retains data.\n\nCue the cartoon villain."}, {"id": 50634385, "au": "lenerdenator", "dom": 151, "sr": 105, "sc": 2.35, "ep": 2.37, "bs": 0.0, "d": 2, "age": 18.4, "grav": 227.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 7452, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_keys", "flbl": "API & Keys (Providers)", "urls": [], "ig": 1.008, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Eh, Dengists. Willing to accept capitalist reforms but then they institute a policy of using brutal methods to make sure that you meet the production targets needed to put them at the top of the market."}, {"id": 50642139, "au": "ordersofmag", "dom": 58, "sr": 106, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 3, "age": 1.44, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 196, "qw": 0, "k": 308, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "copyright_law", "flbl": "Copyright & Law (Side)", "urls": [], "ig": 0.993, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The spirit of copyright law is founded on the idea that creative expression is intrinsically valuable but in limited supply because it take hard work from humans.  So to motivate creators to take the time to create and share it with the world, they are given a limited monopoly on the use of their particular creative expression. That way they can extract rent from its use in compensation for their time.\n\nThis has been turned on it's head as an LLM can effectively make original creative expressions at much, much lower cost. What was scarce is now abundant.  The motivation for granting that limited monopoly is gone.  The 'stated objective' was abundant creative works.  Mission accomplished.\n\nOf course if you imagine the objective was actually to ensure humans had time and space to engage in creative work because humans enjoy that process (a worthy goal in my mind anyway), then you've got an issue.  The economic levers no longer line up with reality because the scarcity you were leveraging to buy people's time no longer exists. Time to come up with some other solutions.  They probably center on how the benefits of this new-found wealth are distributed."}, {"id": 50642378, "au": "ursuscamp", "dom": 222, "sr": 107, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 0, "age": 1.09, "grav": 7.6, "surf": 33.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 910, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.875, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "\"We distilled all of human knowledge without ever asking anyone's permission, but you better not distill our distillation\" is a level of hypocrisy I will never be able to get past."}, {"id": 50640099, "au": "mrweasel", "dom": 138, "sr": 108, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 3, "age": 6.17, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 12, "k": 24475, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.471, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're probably being sarcastic, but this:\n\n> why are we using AI at all if we don't have to?\n\nthat is actually a good question. Why run things through an expensive AI, if there's a solution that doesn't require that? It would be much cheaper."}, {"id": 50633968, "au": "kadoban", "dom": 95, "sr": 109, "sc": 2.25, "ep": 2.25, "bs": 0.0, "d": 3, "age": 18.9, "grav": 237.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 7573, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_models", "flbl": "Claude & Models (Ask)", "urls": [], "ig": 0.886, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "It's not _quite /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
