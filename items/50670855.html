of X, xAI, and Grok, Over Creation and Promotion of Child Exploitation and Non-Consensual Images on Platform\"\n\nThe key issue is that SpaceX knew about the way Grok was being used and lied publicly about the effectiveness of their safety tooling.\n\nhttps://www.oag.state.va.us/files/Grok-SpaceX-Complaint-As-F...\n\n> Defendants assured consumers that their products and services were safe because they had taken steps to prohibit the generation, production, and dissemination of CSAM, NCII, and other non-consensual sexualized images on their platforms. Defendants stated that they had a “zero tolerance” policy regarding “any forms of child sexual exploitation.” These representations were false, misleading, or deceptive. In truth, Defendants had not implemented or enforced policies and safeguards to identify, remove, and police such content. To the contrary, Defendants intentionally released a product that inundated their platforms with CSAM, NCII, and nonconsensual sexualized images.\n\n> Defendants have violated the VCPA by misrepresenting that they implemented and enforced safeguards to protect consumers from exposure to CSAM, NCII, and other nonconsensual sexualized images when using their platforms.\n\nWhat it boils down to is: if SpaceX had"}, {"id": 50673544, "au": "timr", "dom": 5, "sr": 3, "sc": 14.09, "ep": 14.38, "bs": 0.0, "d": 2, "age": 11.0, "grav": 101.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 12, "qw": 45, "k": 32229, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "lawsuit_grok", "flbl": "Lawsuit & Grok (Porn)", "urls": ["https://www.oag.state.va.us/files/Grok-SpaceX-Complaint-As-Filed.pdf"], "ig": 2.058, "fa": 2.35, "gp": 1.963, "bl": 0.0, "ds": 0.0, "txt": "The lawsuit is focused on banning sexual imagery entirely. From the lawsuit [1]:\n\n> Because a model capable of generating sexual images of adults cannot reliably be prevented from generating CSAM, NCII, or other non-consensual sexualized images, the major AI developers other than xAI designed their products to refuse sexual content altogether. The safer design was available, feasible, and standard\n\n[1] https://www.oag.state.va.us/files/Grok-SpaceX-Complaint-As-F..."}, {"id": 50675852, "au": "SwellJoe", "dom": 57, "sr": 4, "sc": 9.72, "ep": 10.16, "bs": 0.0, "d": 3, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 27, "qw": 0, "k": 37142, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "lawsuit_grok", "flbl": "Lawsuit & Grok (Porn)", "urls": ["https://arstechnica.com/tech-policy/2026/01/asking-grok-to-delete-fake-nudes-may-force-victims-to-sue-in-musks-chosen-court/"], "ig": 1.074, "fa": 2.08, "gp": 1.177, "bl": 0.0, "ds": 0.0, "txt": "\"Grok's creators have certainly never condoned illegal content\"\n\nC'mon, now.\n\n\"Elon Musk promoted Grok’s undressing feature on his own X feed by posting a pic of himself in a bikini.\"\n\nhttps://arstechnica.com/tech-policy/2026/01/asking-grok-to-d..."}, {"id": 50672020, "au": "jimz", "dom": 238, "sr": 5, "sc": 8.48, "ep": 8.48, "bs": 0.0, "d": 1, "age": 14.78, "grav": 160.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 845, "qw": 0, "k": 291, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "images_generation", "flbl": "Images & Generation (Grok)", "urls": [], "ig": 1.972, "fa": 0.96, "gp": 0.764, "bl": 0.0, "ds": 0.0, "txt": "And that wouldn't do it either since that is fundamentally a naive way of understanding how the tech works. The government have lost the plot on what is metaphorical and what is literal a long time ago and are demanding the impossible, which can simply be read as prior restraints and easy calls as violations of the First Amendment. No image generator can actually create a bona fide image on its own of anyone unclothed from a photo of said person clothed that is a true representation of the person's actual d": 50676418, "au": "thephyber", "dom": 32, "sr": 7, "sc": 7.91, "ep": 8.57, "bs": 0.0, "d": 8, "age": 1.87, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 28, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "lawsuit_grok", "flbl": "Lawsuit & Grok (Porn)", "urls": [], "ig": 1.944, "fa": 0.98, "gp": 0.836, "bl": 0.0, "ds": 0.0, "txt": "\"A deepfake\" isn't illegal. The thing the VA AG is suing over isn't some vague \"deepfake\" definition that isn't defined in VA / US statutes.\n\nNCII is illegal under US Code:\n\n> 47 U.S.C. § 223 (Take It Down Act, signed May 19, 2025): Amends the Communications Act to make knowingly publishing or threatening to publish NCII—including authentic images and AI-generated digital forgeries—a federal crime.\n\nThis same statute puts a 48 hour timeline on the platform (both xAI and X / Twitter) to remove the content once notified of it.\n\nMusk doing the deepfake of himself was obviously consensual (unless someone else controls his Twitter account) and he was marketing \"Spicy Mode\" Grok.\n\nYou are so wrong on ALL of these comments, it's cringe.\n\nA lawsuit filing isn't the full case. The VA AG's office will get access to discovery (eg. Communications between xAI employees) and will likely file depositions / testimonies of Grok- sourced NCII victims where more relevant facts will come to light during the trial. If it turns out xAI actually did have great prompt rejection / filtering and the VA AG is lying, then the lawsuit won't go anywhere. But my money is on Musk's own words on Twitter and in interviews will be the best evidence for the plaintiff."}, {"id": 50674607, "au": "thephyber", "dom": 30, "sr": 8, "sc": 7.68, "ep": 8.56, "bs": 0.0, "d": 6, "age": 8.38, "grav": 67.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 217, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "lawsuit_grok", "flbl": "Lawsuit & Grok (Porn)", "urls": [], "ig": 1.77, "fa": 0.95, "gp": 1.171, "bl": 0.0, "ds": 0.0, "txt": "That excerpt is point 86 from the lawsuit. The next 20 points all detail failures of xAI to do almost any work towards the goals of minimizing CSAM /NCII. Someone could read the last phrase of point 86 in context as complaining that 100% rejection of sexual prompts would be preferable to 1%, but 99% rejection of CSAM / NCII would be preferable to both.\n\nIf Musk and xAI had not advertised this as a feature (and Musk even showed how to do a sexual deepfake of himself), and if xAI had documented attempts to put significant effort into preventing illegal classes of imagery, this case wouldn't have any merit. But the AG claims the company bragged about the feature, it generates revenue and distinguishes the Grok AI from other AIs, and xAI even stated they aren't implementing safety protections because they wanted to get to market faster and to \"beat China\". The lawsuit has legs, even if you don't like the possible outcomes.\n\nAnd my point was that porn isn't being banned by the VA AG. Even if the result of this case is that no AI model can be used to create any porn (that will never be the outcome of this case), it would only prohibit AI-generated porn, not all porn. I was making the obvious observation that the parent comment was being hyperbolic."}, {"id": 50676430, "au": "timr", "dom": 14, "sr": 9, "sc": 7.04, "ep": 7.48, "bs": 0.0, "d": 9, "age": 1.84, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 32229, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "csam_legal", "flbl": "Csam & Legal (Ramifications)", "urls": [], "ig": 1.44, "fa": 0.96, "gp": 0.936, "bl": 0.0, "ds": 0.0, "txt": "Read the entire thing. They show a period in 2025 to early 2026 where things were bad, then X tightened up.\n\nThey literally claim that increased reports of CSAM to the police, by X, are evidence of neglect (claims 117 & 118). Elsewhere, they cite Grok’s own updated terms of service, where they say that creating this stuff is not allowed, is somehow a false statement.\n\nIt’s nonsensical."}, {"id": 50671385, "au": "tmp10423288442", "dom": 133, "sr": 10, "sc": 7.0, "ep": 7.0, "bs": 0.0, "d": 1, "age": 16.02, "grav": 182.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 25, "k": 678, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "images_generation", "flbl": "Images & Generation (Grok)", "urls": [], "ig": 1.523, "fa": 0.76, "gp": 0.862, "bl": 0.0, "ds": 0.0, "txt": "> bearing in mind that the supreme court has already ruled that making child sexual abuse material for your own consumption using AI is protected speech\n\nNo, this is not true. Ashcroft v. Free Speech Coalition (2002) allows non-obscene fictional depictions of sex between minors, provided the depiction is not obscene under the Miller test. In practice, this would have to have some serious literary, artistic, or scientific merit to not be forbidden. Generating images for one’s self-gratification would not qualify."}, {"id": 50675495, "au": "Capricorn2481", "dom": 233, "sr": 11, "sc": 6.4, "ep": 6.4, "bs": 0.0, "d": 1, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2028, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "csam_legal", "flbl": "Csam & Legal (Ramifications)", "urls": [], "ig": 1.559, "fa": 0.68, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "In 2023, Dom Lucre shared one of the most horrific instances of CSAM on X. A snuff film that was created by a convicted pedophile.\n\nHe was banned by the exploitation team at X, but Musk personally reinstated his account 3 hours later. It's still active. He does not give a fuck about CSAM. Either because he finds it amusing to hurt children or he watches it himself and wants to normalize it."}, {"id": 50676657, "au": "thephyber", "dom": 34, "sr": 12, "sc": 6.39, "ep": 7.49, "bs": 0.0, "d": 8, "age": 0.96, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 91, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "lawsuit_grok", "flbl": "Lawsuit & Grok (Porn)", "urls": [], "ig": 1.784, "fa": 0.76, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "> The only standard that will satisfy these people is an absolute prohibition.\n\nWho are \"these people\"?\n\nOnly 2 / 535 people in all of Congress didn't want to give this tool to state AGs:\n\n> On May 19, 2025, President Trump signed into law the Tools to Address Known Exploitation by Immobilizing Technological Deepfakes on Websites and Networks Act (Take It Down Act).1 Co-sponsored by Sens. Cruz (R-TX) and Klobuchar (D-MN), the bill passed the House by a vote of 409-2 and cleared the Senate with unanimous consent.2 More than 100 organizations, including Microsoft, the NCAA, and the National Association of Counties, endorsed the legislation.3 The law is a federal response to the proliferation of nonconsensual intimate imagery (NCII).\n\nLiterally every high severity / high impact tool available in the US has some sort of restraints / licensing. Cars, weapons, drugs, gambling, porn, etc. the restrictions are both put on the manufacturers and the users. Among the things I listed, only Schedule 1 narcotics qualify as \"an absolute prohibition\".\n\nMaybe it's time you log off and touch grass. This isn't the \"slippery slope to end all AI porn\" that you think it is.\n\nxAI could have easily let the \"spicy mode\" product bake longer before turning it on for the world to abuse. We will see if the VA AG can prove their case. Somehow I suspect that Musk will hoist xAI with his own petard."}, {"id": 50674498, "au": "judge2020", "dom": 112, "sr": 13, "sc": 6.18, "ep": 6.18, "bs": 0.0, "d": 3, "age": 8.67, "grav": 70.9,
