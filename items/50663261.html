": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 9}, {"category": "investigative_or_tech_press", "count": 2}], "story_anchors": ["buy", "november", "friday", "consumers", "free", "live", "consumerism", "sale", "shopping", "half", "offer", "shop", "believe", "christmas", "end", "27th", "campaign", "deal"], "largest_root": {"root_id": 50665119, "author": "JdeBP", "slots": 23, "start_dom": 1, "end_dom": 23, "share_pct": 22.3, "top_dom1_age": 9.0, "top_dom1_author": "JdeBP"}, "buried_cutoff": 31, "rescue_top_k": 21, "ablations": [], "tournament": [], "comments": [{"id": 50669242, "au": "JdeBP", "dom": 11, "sr": 1, "sc": 12.51, "ep": 12.51, "bs": 0.0, "d": 4, "age": 1.95, "grav": 11.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 314, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": ["https://inquirer.com/philly/news/breaking/20111125_Black_Friday_started_in_Philly.html", "https://www.nytimes.com/1975/11/29/archives/army-vs-navy-a-dimming-of-splendor-armynavy-dimmed-splendor.html", "https://vocabulary.com/articles/wordroutes/the-origins-of-black-friday/"], "ig": 1.666, "fa": 2.7, "gp": 0.622, "bl": 0.0, "ds": 0.0, "txt": "You just quoted something that gave something else, people coming in for a game, as the reason, so it cannot be the entire reason.  And in fact it not only is not the entire reason, it isn't even (as I said) technically the reason, as all of the stuff with Best Deals Of The Year and Don't Miss Out On Our Black Friday Promotion didn't exist until retailers tried to re-brand it as a positive thing in the 1980s.\n\nMoreover, the Inquirer is pretty much the closest that one can get to the source, given that it's about policing traffic in Philadelphia.  Here's a piece in the Inquirer that traced it back a different way to the same origin, traffic and police, a decade and a half after Barret's own pretty definitive account (since xe and Gleger wrote the reportage in the Philadelphia Bulletin that used the name):\n\n* https://inquirer.com/philly/news/breaking/20111125_Black_Fri...\n\nPeople like to quote sports reporter Gordon S. White Jr's early use of the name in the New York Times, too, but as the earliest example that they can find that starts to lean more heavily on the shopping aspect, in 1975.\n\n* https://www.nytimes.com/1975/11/29/archives/army-vs-navy-a-d...\n\nBen Zimmer and others around the same time as the Inquirer piece chronicled how the \"in the black\" false back-story was a bit of marketing spin begun in the 1980s, when the name started to become synonymous with nasty experienc"}, {"id": 50668144, "au": "JdeBP", "dom": 9, "sr": 2, "sc": 9.31, "ep": 9.46, "bs": 0.0, "d": 2, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 73, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": ["https://inquirer.com/archive/black-friday-thanksgiving-origins-history-philly-20221122.html", "https://philadelphia.today/2026/11/philadelphia-black-fridays-beginnings/", "https://americanhistory.si.edu/explore/stories/army-navy-saturday-family-tradition"], "ig": 0.863, "fa": 2.34, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "On the contrary, that \"in the black\" thing was a bit of re-branding invented from whole cloth three decades after the fact.  As it started out in the 1950s, it very much was about Thanksgiving, more specifically about a specific U.S.A. football match that occurred the weekend after Thanksgiving, and people turning up the day before.\n\n* https://inquirer.com/archive/black-friday-thanksgiving-origi...\n\n* https://philadelphia.today/2026/11/philadelphia-black-friday...\n\n* https://americanhistory.si.edu/explore/stories/army-navy-sat...\n\nThe thing that it was not technically about was (ironically) shopping.  But like so many other things, it became commercialized."}, {"id": 50665119, "au": "JdeBP", "dom": 1, "sr": 3, "sc": 8.43, "ep": 8.73, "bs": 0.0, "d": 0, "age": 9.01, "grav": 75.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 255, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": [], "ig": 1.566, "fa": 0.95, "gp": 1.612, "bl": 0.0, "ds": 0.0, "txt": "It is interesting that this is a U.K.-based campaign.  Here in the U.K. I have this year been following the price of an item at Currys (a vendor of white goods and general electrical items).  Currys has been a major pusher of the 'Black Friday' idea for quite a few years now.\n\nAttaching a shopping idea to a foreign country's holiday was not an easy sell.  (That this WWW site has been going since 2000 largely lines up with 'Black Friday' entering the world of retail in the U.K..  It was a totally alien idea in the 20th century.)\n\nDuring the summer, the item was on sale.  Alas, I missed the sale because of bad timing, and it went back up to its non-sale price that is £700 more expensive.\n\nThe retailers who push 'Black Friday' imply that this is the time of the year when the punters get the best sale prices.  (It used to be the case in the U.K. that that was during the 'January sales', but that has largely disappeared from the retail world in practice, partly because retailers do tighter stock control nowadays, and partly because of this.)\n\nIt isn't.  Currys has the item on sale, alright.  It's at only £400 off non-sale price, though.\n\nAfter all, if one is a retailer who has spent nigh on two decades pushing the idea that this is when the punters should do their shopping, although one is legally bound to offer sale prices, there's no incentive any more, now that the punters are tr"}, {"id": 50667964, "au": "FractalParadigm", "dom": 39, "sr": 4, "sc": 7.52, "ep": 7.52, "bs": 0.0, "d": 3, "age": 3.89, "grav": 24.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 929, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_amazon", "flbl": "Money & Amazon (Interesting)", "urls": [], "ig": 1.765, "fa": 0.68, "gp": 0.992, "bl": 0.0, "ds": 0.0, "txt": "Reminds me of all the $100-$150 Boxing-Day-special laptops from Staples, Walmart, Future Shop, etc. that family would buy, complain about the poor quality and slow speed, then fully expect me to make it run better somehow. Missing ports (including RAM slots!), missing or lesser features, the cheapest AMD SoCs money can buy, half the RAM that's recommended for Windows, and you'll never find that config officially listed anywhere other than its own support page. The grift has been going on forever and people still buy them knowing full-well they're garbage before the box is even opened, but consumerism is one hell of a drug."}, {"id": 50665463, "au": "kakacik", "dom": 32, "sr": 5, "sc": 7.39, "ep": 7.39, "bs": 0.0, "d": 1, "age": 8.17, "grav": 65.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.654, "fa": 1.23, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes and no. If you know the usual prices you can see if things are scam or genuine discounts.\n\nFor example I am vaguely hunting for new phone, my S22 ultra is slowly losing battery capacity and photography was surpassed years ago (my 2 main concerns). Pixel 11 Pro XL 256GB I can get in Black friday for cca 870 euro in Europe, which is so far the rock bottom compared to normally priced sites, or past, usually its 100-200 euro more and product is 100% same.\n\nIts not a huge discount but anything pushing price lower for something I already intend to buy in max few months is more than welcome."}, {"id": 50666336, "au": "ajsnigrutin", "dom": 53, "sr": 6, "sc": 7.22, "ep": 7.22, "bs": 0.0, "d": 1, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 12483, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.397, "fa": 0.95, "gp": 0.848, "bl": 0.0, "ds": 0.0, "txt": "Same in slovenia...  \"up to -70%\" poster outside, and then inside, you find three things -30%, five more things -10%, and everything else is at original price.\n\nWe used to have regulation about sales, where all the proper sales were at the same time, and if retailers wanted to advertise it as a \"sale\", they actually had to reduce prices... if they advertised 50% off, at least 25% of goods (25% of the monetary worth, not number of pieces) of the goods had to be 50% off, etc. Now we have year long sales where nothing is actually on sale, and random \"half price\" stores, where they sell stuff that comes out of the factory with reduced price (=never sold at original sticker price)."}, {"id": 50664159, "au": "mertbio", "dom": 60, "sr": 7, "sc": 7.13, "ep": 7.13, "bs": 0.0, "d": 2, "age": 11.14, "grav": 103.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1350, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.469, "fa": 0.62, "gp": 1.319, "bl": 0.0, "ds": 0.0, "txt": "It is not about the market prices, in Germany, the utility contracts run yearly and there are multiple providers for each service so there is a high competition to attract customers. During the Black Friday, they give the highest bonuses. On the paper, it would look like you pay the normal monthly prices, but those providers give hundreds of euros cash back so in total, you pay way less than the market prices. For example, last year I only paid around 250€ for 1.200kWh electricity usage."}, {"id": 50665404, "au": "binaryturtle", "dom": 25, "sr": 8, "sc": 6.97, "ep": 7.12, "bs": 0.0, "d": 0, "age": 8.33, "grav": 66.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 544, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.327, "fa": 0.95, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "The hard disk I'm tracking amazon prices for a bunch of years jumped more than 100 EUR up one day before Black Friday: from 457.07 EUR to 565.26 EUR (amazon.de). It's well known Black Friday is a scam since a bunch of years. But usually the prices more slowly go up in the 1-2 months before the day.\n\nBTW, I started tracking the price for this particular disk in 2023 when it was 295.70 EUR (I wanted to get an alert when it dropped to 250 EUR, so much about that) :-)"}, {"id": 50670380, "au": "JdeBP", "dom": 16, "sr": 9, "sc": 5.29, "ep": 5.73, "bs": 0.0, "d": 2, "age": 0.35, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "customers_punters", "flbl": "Customers & Punters (Actual)", "urls": ["https://hertsad.co.uk/news/26762788.discover-real-proper-pub-beloved-herts-punters/"], "ig": 1.171, "fa": 0.9, "gp": 0.284, "bl": 0.0, "ds": 0.0, "txt": "customer.  It's slang from at least the start of the 20th century, as recorded by Eric Partridge in the 1970s.\n\nIt doesn't really mean a prostitute's customer or a con-man's victim any more, despite what you may read.  It mutated a bit in part thanks to a popular telly series named \"Minder\" in the 1970s and 1980s, which used a number of slang terms, not the least of which was its title.\n\nThe Hertfordshire Advertiser talking about 'punters' here, for example, is not talking about anything more than customers who drink at the pub.\n\n* https://hertsad.co.uk/news/26762788.discover-real-proper-pub...\n\n(Yes.  \"Only Fools And Horses\" too.  I know.)"}, {"id": 50668320, "au": "rpdillon", "dom": 10, "sr": 10, "sc": 4.92, "ep": 5.36, "bs": 0.0, "d": 3, "age": 3.32, "grav": 20.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 58, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": ["https://www.history.com/articles/black-friday-thanksgiving-origins-history"], "ig": 0.743, "fa": 1.04, "gp": 0.447, "bl": 0.0, "ds": 0.0, "txt": "Read all your links, and a few of my own. I think it's extremely coupled to shopping.\n\n> The real history behind Black Friday, however, is not as sunny as retailers might have you believe. In the 1950s, police in Philadelphia used the term to describe the chaos that ensued on the day after Thanksgiving, when hordes of suburban shoppers and tourists flooded the city in advance of the annual Army-Navy football game held that Saturday.\n\nIt seems the entire reason that chaos erupted on that day is because of shopping.\n\nhttps://www.history.com/articles/black-friday-thanksgiving-o..."}, {"id": 50669742, "au": "lanstin", "dom": 74, "sr": 11, "sc": 4.9, "ep": 4.9, "bs": 0.0, "d": 2, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 3722, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_amazon", "flbl": "Money & Amazon (Interesting)", "urls": [], "ig": 1.785, "fa": 0.0, "gp": 0.484, "bl": 0.0, "ds": 0.0, "txt": "You can spend money on travel, movies, food, good food made by experts, helping people that can be helped by money, helping young people especially, live performances of music or plays, ebooks, community or religious groups and ceremonies, therapy, Patreon for writers and artists, subsidizing technologies or products that will be great when everyone uses them but need a leg up now (e.g. solar ten years ago; organic milk twenty years ago; plastic free things now perhaps).\n\nProducts of the sort Amazon sells are the least interesting, once you have food shelter and clothing solved for your family."}, {"id": 50670149, "au": "JdeBP", "dom": 23, "sr": 12, "sc": 4.65, "ep": 5.31, "bs": 0.0, "d": 2, "age": 0.71, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 83, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": ["https://bbc.co.uk/bitesize/articles/zf2hjfr\u0023z8fgp9q", "https://telegraph.co.uk/finance/newsbysector/retailandconsumer/9695980/Black-Friday-2012-in-pictures.html", "https://thegrocer.co.uk/analysis-and-features/black-friday-a-gimmick-or-the-new-january-sales/352550.article"], "ig": 0.583, "fa": 1.24, "gp": 0.279, "bl": 0.0, "ds": 0.0, "txt": "BBC Bitesize says that it was the start of the 2010s.  Which does line up with contemporary newspapers.\n\n* https://bbc.co.uk/bitesize/articles/zf2hjfr\u0023z8fgp9q\n\n* https://telegraph.co.uk/finance/newsbysector/retailandconsum...\n\nI remember that there were some very early adopters.  It didn't take off all at once across the board.  Asda can shoulder a lot of the blame.  Bear in mind that back in 2013 when this article in The Grocer was written, Asda was a subsidiary of Walmart, so we probably have Walmart, also known for trying and failing to import some U.S.A. retail practices into Germany, ultimately to blame.\n\n* https://thegrocer.co.uk/analysis-and-features/black-friday-a..."}, {"id": 50666411, "au": "throw0101d", "dom": 7, "sr": 13, "sc": 4.34, "ep": 4.79, "bs": 0.0, "d": 1, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 62, "k": 8432, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.046, "fa": 0.42, "gp": 0.78, "bl": 0.0, "ds": 0.0, "txt": "> The retailers who push 'Black Friday' imply that this is the time of the year when the punters get the best sale prices. (It used to be the case in the U.K. that that was during the 'January sales', but that has largely disappeared from the retail world in practice, partly because retailers do tighter stock control nowadays, and partly because of this.)\n\nIn Canada we are now seeing both Black Friday sales following the American 'tradition', and also Boxing Day sales which would lean more towards our Commonwealth heritage. (Canadians generally get Boxing Day as a holiday.)"}, {"id": 50667319, "au": "grvbck", "dom": 27, "sr": 14, "sc": 4.31, "ep": 4.6, "bs": 0.0, "d": 2, "age": 4.84, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 362, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.375, "fa": 0.34, "gp": 0.279, "bl": 0.0, "ds": 0.0, "txt": "No need to suggest anything — this practice is well documented. Sellers often raise prices 45–60 days before a sale, then advertise a dramatic Black Friday discount that leaves the item no cheaper (and sometimes more expensive) than it was a few months earlier.\n\nYou'd have to either know the usual price or check price-tracking sites to discover this scam, and I guess not enough buyers do."}, {"id": 50668779, "au": "teiferer", "dom": 40, "sr": 15, "sc": 4.17, "ep": 4.32, "bs": 0.0, "d": 1, "age": 2.61, "grav": 15.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 12, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.326, "fa": 0.42, "gp": 0.007, "bl": 0.0, "ds": 0.0, "txt": "> If I want something I am going to buy it when it is cheapest.\n\nThat's not what this campaign is about, and since you misunderstood it, you should not call it \"nonsense\".\n\nFor quite a while now, a (the?) main purpose of Black Friday is to sell as much cheap crap as possible to insane margins while making people believe they are getting a great deal with XX% off. That's just boosting the single use mentality and refusing to participate is a good thing. That's what this campaign is about.\n\nIf you use Black Friday only to wait for a good deal for the TV or hard drive you anyway wanted to buy, then that campaign is not directed at you."}, {"id": 50667772, "au": "vivzkestrel", "dom": 92, "sr": 16, "sc": 3.87, "ep": 4.09, "bs": 0.0, "d": 0, "age": 4.17, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1125, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 0.498, "fa": 0.96, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "- should post an advert for 10000$ on reddit titled \"Fuck Black Friday: you are being scammed for 2x the prices with 100% discount\"\n\n- nothing ll get people's attention like that ad above"}, {"id": 50665727, "au": "fedeb95", "dom": 55, "sr": 17, "sc": 3.75, "ep": 3.75, "bs": 0.0, "d": 0, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 613, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_amazon", "flbl": "Money & Amazon (Interesting)", "urls": [], "ig": 1.414, "fa": 0.0, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "Interesting, but based on slightly wrong premises.\n\nWe should buy less in the sense that consumers should always research and struggle for their sweet spot of cost/quality, without settling for advertisement or habit.\n\nIt is mainly a quest against our tendency to settle on habits. It is a spiritual matter."}, {"id": 50666925, "au": "tgsovlerkhgsel", "dom": 26, "sr": 18, "sc": 3.75, "ep": 4.19, "bs": 0.0, "d": 1, "age": 5.41, "grav": 36.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 17185, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.174, "fa": 0.34, "gp": 0.319, "bl": 0.0, "ds": 0.0, "txt": "German law requires disclosing the lowest price in 30 days when advertising a discount. Of course it's not forbidden to charge people more on Black Friday but if you're suggesting that they'll drop the price to be able to advertise a discount, that might be illegal in Germany (and I suspect this kind of this tends to be enforced)."}, {"id": 50665265, "au": "bob1029", "dom": 85, "sr": 19, "sc": 3.42, "ep": 3.86, "bs": 0.0, "d": 0, "age": 8.69, "grav": 71.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": [], "ig": 1.351, "fa": 0.0, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "If you've ever worked in retail you know how ridiculous this day is. If consumers understood basics about how margins work, they'd avoid the bulk outs and end caps like the plague rats of consumerism that they are.\n\nA vast majority of the shit on sale today is making the seller a massive profit."}, {"id": 50667215, "au": "lazzurs", "dom": 33, "sr": 20, "sc": 3.07, "ep": 3.8, "bs": 0.0, "d": 0, "age": 5.0, "grav": 33.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 91, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.724, "bl": 0.0, "ds": 0.0, "txt": "This is just absolute nonsense.\n\nIf I want something I am going to buy it when it is cheapest. If that is a specific day or week in the year and I don't need it urgently then for sure I am going to wait and buy it then.\n\nNow if the point is let us all buy less and the things we buy should be more durable so we use less resources while meeting our needs and fulfilling wants within our means then sure I am with you but this idea of don't buy things on a specific day to protest is just self harm for no gain."}, {"id": 50668150, "au": "tamimio", "dom": 91, "sr": 21, "sc": 2.98, "ep": 3.2, "bs": 0.0, "d": 0, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 2464, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.299, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "You don’t need to campaign for that now I believe, if the person is smart they would have tracked the price in the past months, and most of the goods they get price increase before blackfriday then “discount” it to reach the original price or around it. Also, software deals mostly won’t be as lucrative as before now that anyone can build whatever they want instead of saas. Lastly, the purchase power isn’t as strong with inflation and job market."}, {"id": 50670376, "au": "Lio", "dom": 15, "sr": 22, "sc": 2.89, "ep": 3.33, "bs": 0.0, "d": 2, "age": 0.36, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 10512, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "customers_punters", "flbl": "Customers & Punters (Actual)", "urls": [], "ig": 1.012, "fa": 0.28, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "I guess it's customer but with a bit of nuance.\n\nBookmakers often refer to their customers as punters and in the UK that gets extended that other businesses.  It's not exactly derogatory as such but implies a bit of \"them and us\".\n\nSo here it's implying that businesses are nudging their more suggestible customers to follow a trend they've created.\n\nCustomers in a pub would also be referred to as punters with no slight implied."}, {"id": 50664421, "au": "CalRobert", "dom": 79, "sr": 23, "sc": 2.55, "ep": 3.21, "bs": 0.0, "d": 0, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 19134, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": [], "ig": 1.114, "fa": 0.0, "gp": 0.408, "bl": 0.0, "ds": 0.0, "txt": "This is easier now that black friday deals aren't actually good, but back when the only way I could get a new computer was going to Fry's at 4 AM and getting as much Free After Rebate stuff as possible, it seemed unnecessarily austere.\n\nBesides, this is a little like \"eat nothing day\" - the secret to health isn't what you do on one day, it's overall lifestyle habits."}, {"id": 50667423, "au": "hirako2000", "dom": 35, "sr": 24, "sc": 2.47, "ep": 3.57, "bs": 0.0, "d": 1, "age": 4.67, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2365, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "The site advocates for no or less single use stuff and pictures consumerism effects on the environment.\n\nThat you only buy what you need and when it's the cheapest makes you an outlier, most people are compulsive buyers who click add to cart just because they saw an ad saying discount and felt miserable thinking of not owning more junk."}, {"id": 50667973, "au": "FLeXMurphy", "dom": 96, "sr": 25, "sc": 2.44, "ep": 2.88, "bs": 0.0, "d": 0, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 140, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 0.814, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The auguries of shitposting. Brought to you on Friday, November 27th 2026 by the wonderful moderation staff of HN."}, {"id": 50666299, "au": "JdeBP", "dom": 21, "sr": 26, "sc": 2.35, "ep": 2.8, "bs": 0.0, "d": 2, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 11, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "customers_punters", "flbl": "Customers & Punters (Actual)", "urls": [], "ig": 0.68, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I read the actual text on the headlined page, which is about the U.K., and says\n\n> The UK campaign and website was created in 2000 by Michael Smith\n\nAdbusters originated the thing, but this campaign in front of us is the U.K. one."}, {"id": 50667994, "au": "apothegm", "dom": 8, "sr": 27, "sc": 2.32, "ep": 3.64, "bs": 0.0, "d": 1, "age": 3.81, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 921, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "retail_shopping", "flbl": "Retail & Shopping (Black)", "urls": [], "ig": 1.057, "fa": 0.0, "gp": 0.796, "bl": 0.0, "ds": 0.0, "txt": "Black Friday isn’t technically about Thanksgiving. It’s historically the approximate day of the year when retailers would have sold enough to be “in the black” against their annual inventory expenditures. (Which, tbf, doesn’t really make sense as a concept in this new JIT inventory world.)"}, {"id": 50667168, "au": "sandos", "dom": 29, "sr": 28, "sc": 2.13, "ep": 3.45, "bs": 0.0, "d": 1, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 679, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "For some reason there is only one category that seem to get some real price savings for black friday here in Sweden: TVs.\n\nNot all TVs, mind, but some very high end ones seems to be perpetually over-priced to then come down to more sane prices on BF, and if you buy them any other time of the year youre a sucker, basically.\n\nThis year I have found about 0 products with any worthwhile prices at all for black week, or friday."}, {"id": 50668147, "au": "silverFork", "dom": 84, "sr": 29, "sc": 2.13, "ep": 2.79, "bs": 0.0, "d": 0, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 250, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Do people actually believe in black Friday sales I wonder.. its like mattresses on sale..  they are always on sale..  There is more and more black fridays..\n\nDiscounts are useful when people need to buy something they actually will need but black friday sales are typically about goods that people don't really need soon. People buy the stuff that they want and gifting stuff makes it harder."}, {"id": 50669593, "au": "stevekemp", "dom": 2, "sr": 30, "sc": 1.87, "ep": 3.42, "bs": 0.0, "d": 1, "age": 1.45, "grav": 9.3, "surf": 5.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 10744, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "I moved from the UK to Finland, a little over ten years ago.  In that time \"Black Friday\" has become much more common, and has now morphed into \"Black Week\".\n\nI've got a friend who has been waiting for a few weeks to pickup a new washing machine, and she's checking the prices every day to see if any of the machines she's interested in are actually at a discount or not.\n\nPersonally its such an alien \"event\" that I barely remember it until the signs go up in the shops, and I don't really time any large purchase to it.  Perhaps I should, for things like white goods, but they're not the kind of purchases I'd make more than once every ten years anyway."}, {"id": 50664047, "au": "mertbio", "dom": 58, "sr": 31, "sc": 1.83, "ep": 3.08, "bs": 0.0, "d": 0, "age": 11.39, "grav": 106.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1350, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 0.839, "fa": 0.0, "gp": 0.766, "bl": 0.0, "ds": 0.0, "txt": "If you're living in Germany, today is probably the best day to renew your electricity, gas and internet contracts. If you're skipping it, then you're going to pay probably the highest prices in the world."}, {"id": 50667122, "au": "sokoloff", "dom": 101, "sr": 32, "sc": 1.82, "ep": 1.82, "bs": 0.0, "d": 3, "age": 5.12, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 45037, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_amazon", "flbl": "Money & Amazon (Interesting)", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You’re free to hold that opinion, but my experience is that there’s a lot more interesting to hackers content here that’s got no connection to YC than content that’s about YC."}, {"id": 50667866, "au": "yakshaving_jgt", "dom": 34, "sr": 33, "sc": 1.75, "ep": 3.29, "bs": 0.0, "d": 1, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 6036, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.2, "fa": 0.0, "gp": 0.323, "bl": 0.0, "ds": 0.0, "txt": "I don't think it's nonsense.\n\nEncouraging critical thinking around consumerism is sensible, and that's true whether or not it's a message that you need to hear.\n\nFWIW, it's not a message I personally need to hear either, but I recognise that consumerism is a problem in broader society."}, {"id": 50665729, "au": "Findecanor", "dom": 47, "sr": 34, "sc": 1.65, "ep": 2.89, "bs": 0.0, "d": 0, "age": 7.58, "grav": 58.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 2891, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 0.836, "fa": 0.0, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "Where I live, after \"Black Friday\" was adopted by retailers, it expanded into a \"Black Week\" and then into a \"Black Month\" with today being the last day, so people have already done their purchases."}, {"id": 50670549, "au": "b800h", "dom": 24, "sr": 35, "sc": 1.39, "ep": 2.49, "bs": 0.0, "d": 0, "age": 0.11, "grav": 3.8, "surf": 21.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2486, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.015, "bl": 0.0, "ds": 0.0, "txt": "In Newcastle, if I remember correctly, \"Black Friday\" was the Friday night before Christmas, which would be complete carnage in the pubs. This sounds not entirely dissimilar to the original origin of the US \"Black Friday\"."}, {"id": 50670203, "au": "JdeBP", "dom": 4, "sr": 36, "sc": 1.38, "ep": 2.92, "bs": 0.0, "d": 3, "age": 0.61, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.243, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For several years, I've been calling the period at the end of October and the start of November 'Guy Fawkes Fortnight'.  In fairness, it's not just 'Black Friday' that is not a day long any more.  The fireworks run from at least the preceding weekend to the following one, longer when the calendar aligns in certain ways."}, {"id": 50666018, "au": "latexr", "dom": 18, "sr": 37, "sc": 1.36, "ep": 1.8, "bs": 0.0, "d": 1, "age": 7.02, "grav": 52.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 20, "qw": 8, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "customers_punters", "flbl": "Customers & Punters (Actual)", "urls": ["https://en.wikipedia.org/wiki/Buy_Nothing_Day"], "ig": 0.483, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "> It is interesting that this is a U.K.-based campaign.\n\nThe domain is from the UK, but the campaign is international. It was initially promoted by Adbusters, which is Canadian.\n\nhttps://en.wikipedia.org/wiki/Buy_Nothing_Day"}, {"id": 50664233, "au": "hypfer", "dom": 61, "sr": 38, "sc": 1.32, "ep": 2.69, "bs": 0.85, "d": 3, "age": 10.97, "grav": 100.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "money_amazon", "flbl": "Money & Amazon (Interesting)", "urls": [], "ig": 1.065, "fa": 0.0, "gp": 0.128, "bl": 0.32, "ds": 0.0, "txt": "Yes, I too live in germany.\n\nInteresting point with the bonuses I suppose. That might be money coming from a different pot, so that would make what you said work while still keeping the reality of current prices on the wholesale(?) market.\n\nI'm not quite sure if it's true though. But it holds up better like that I guess.\nSomeone should probably fact-check it, but I'm not going to be that someone."}, {"id": 50666257, "au": "11mariom", "dom": 48, "sr": 39, "sc": 1.27, "ep": 2.45, "bs": 0.0, "d": 1, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 85, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sales_price", "flbl": "Sales & Price (Seeing)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.263, "bl": 0.0, "ds": 0.0, "txt": "Poland? And most of offers aren't any good. I got impression that seeing offer outside black* is most of the times better and cheaper option than waiting for November."}, {"id": 50664751, "au": "sjamaan", "dom": 83, "sr": 40, "sc": 1.12, "ep": 2.37, "bs": 0.0, "d": 1, "age": 9.81, "grav": 85.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 565, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 1.007, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think this movement is aimed at people who buy shit they don't need because it's so damn cheap.\n\nIf you're a strategic buyer who waits for a good deal (such as Black Friday, or Christmas etc) to buy something you need and would otherwise buy anyway, that's just being smart."}, {"id": 50668105, "au": "kraquepype", "dom": 71, "sr": 41, "sc": 1.06, "ep": 2.31, "bs": 0.0, "d": 1, "age": 3.65, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 176, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prices_black", "flbl": "Prices & Black (Friday)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "I would be onboard with that, but more or less \"buy nothing new\" month.\n\nFocus on homemade gifts and foods, locally sourced and secondhand items."}     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
