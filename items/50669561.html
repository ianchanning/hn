 figure a problem out via prototypes, incremental build out, iterating towards a larger goal, it's pretty handy."}, {"id": 50670710, "au": "GuB-42", "dom": 58, "sr": 69, "sc": 2.42, "ep": 3.24, "bs": 0.0, "d": 0, "age": 0.26, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Maybe that's just me but I find that using AI actually takes more effort. These models always manage to screw up something and you have to double check everything, or find an agenetic loop that works.\n\nIt is like getting your news from Instagram, where there is a good chance for it to be fake, or buying your stuff from online marketplaces, which may be a scam. If you use AI, it may be a hallucination, and you always need to have it in mind. If you are using agents, you have to have a mechanism to keep it in check, something you can trust, like Lean in the case of math proofs.\n\nThat makes it high effort, sometimes higher effort than doing it by hand. When you are doing something by hand, there may be some routine tasks that don't require too much thinking, not so much with AI, it is fast and it will always find some creative ways to screw up with you, so you have to keep up."}, {"id": 50670003, "au": "beyondcompute", "dom": 143, "sr": 70, "sc": 2.42, "ep": 3.18, "bs": 0.0, "d": 0, "age": 1.35, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 256, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.199, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "For a human to be scared of AI is like for a bird to be scared of motor cars. I mean, yes, they affect the world as a whole, for all of us. But they occupy so different a niche from where humans should really be.\n\nBe human! Talk to people, appreciate beauty, dance! Can AI take away from you your dancing?"}, {"id": 50670136, "au": "quantiq", "dom": 34, "sr": 71, "sc": 2.42, "ep": 3.11, "bs": 0.0, "d": 1, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 96, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.984, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "I've seen various iterations of this type of comment on HN that is often in essence, \"I am at or close to retirement so I don't care anymore, and you shouldn't either. I have given up.\"\n\nWhat happens if you're young and at the start of your career, you're just f-d?\n\nWow, thanks for the advice, grandpa. I'm sure never doing anything hard, nor refusing to do things I don't enjoy doing will certainly lead me to a fruitful and/or rewarding life."}, {"id": 50670343, "au": "CoolestBeans", "dom": 113, "sr": 72, "sc": 2.42, "ep": 3.05, "bs": 0.0, "d": 0, "age": 0.86, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1036, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "It isn't that you get dumber but no pain no gain. Programming is an endlessly deep and broad art. Looking at the answers at the back of the book denies you valuable reps. And there will always be people who either by discipline or intrinsic satisfaction, do things the old fashioned way. And they will start to gain, pass, and even lap you."}, {"id": 50670853, "au": "Insanity", "dom": 176, "sr": 73, "sc": 2.42, "ep": 3.02, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 7513, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.944, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think there's two answers I have to this that are opposites.\n\n1. There was never a point to you, teleological thinking is flawed, we simply 'are' as a result of the universe's physics.\n\n2. The point of you is not being 'smart', generally the people that care about you don't care about how smart you are.\n\nYou can take solace in either of these two lol."}, {"id": 50670339, "au": "_aavaa_", "dom": 66, "sr": 74, "sc": 2.42, "ep": 2.98, "bs": 0.0, "d": 2, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 5255, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.268, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unless you wish to learn Swift or Java as it's own abstract end, all programming languages and our need to use them have always been means to an end. The only reason we created them and use them is to program the kind of computers we have and to do so in a manner that's easier and more efficient than raw 1s and 0s.\n\nBy analogy, we only have the spoken word because we're not telepathic. If we could communicate with people telepathically, there would be no reason to learn to speak."}, {"id": 50670356, "au": "peripheral_", "dom": 147, "sr": 75, "sc": 2.42, "ep": 5.48, "bs": 2.52, "d": 0, "age": 0.84, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 3, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.654, "fa": 0.28, "gp": 0.55, "bl": 0.95, "ds": 0.0, "txt": "two things:\n\n1. Since LLMs have become widely available I've been stressing to people that the \"journey is more important than the destination\", researching things yourself helps you build mental models and maintain critical posture, doing (at least some) repetitive tasks puts you in mental state to process information in a uniquely human way. Speed running to the \"answer\" is transient.\n\n2. No matter how \"smart\" LLMs get, they are still entities with ZERO semantic capabilities. I don't care how much those Anthropic employees think they have a little man in a box...the ability to produce language ≠ semantic content. This is something every human can do after a few months of existing and it remains our strongest trait."}, {"id": 50670355, "au": "json_hero", "dom": 100, "sr": 76, "sc": 2.42, "ep": 2.96, "bs": 0.0, "d": 2, "age": 0.84, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The industry needs to change, I'm hopeful that companies like this will eventually fall behind due to lack of quality and other more well organized companies will beat them out. I feel as though I've been demonized a bit at my own company for sticking my own neck out and owning an opinion, it's certainly unfortunate."}, {"id": 50670212, "au": "neko_ranger", "dom": 161, "sr": 77, "sc": 2.42, "ep": 2.94, "bs": 0.0, "d": 0, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1299, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.132, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Can any grey beards comment if they felt similar when they moved from machine code to high level languages like c or assembly (where knowing memory layout was less of a requirement)? or going from c to a garbage collected language?\n\nWe're losing sense of the details for sure. Trying to see if there's a comparison. Is code you don't understand written by an LLM similar to machine code you don't understand outputted by a compiler?"}, {"id": 50670721, "au": "liquicity", "dom": 72, "sr": 78, "sc": 2.42, "ep": 2.92, "bs": 0.0, "d": 0, "age": 0.24, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 31, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "I felt like this for a while - but I’ve been using AI longer than most and mostly think I’m on the other side.\n\nI think you’ll adjust to doing more / increasingly ambitious projects - I guess I’m blessed that I’ve always had many ideas / side projects on the go, now I can get to most of them (but still not all)\n\nThe point of there being little/diminishing intellectual challenge building things is coming though, there’s a lot of people working on software factories (myself included) and these kind of feel like the endgame of software dev for humans.."}, {"id": 50669670, "au": "blocked_againnn", "dom": 139, "sr": 79, "sc": 2.42, "ep": 2.92, "bs": 0.0, "d": 0, "age": 1.77, "grav": 10.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 24, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "I feel like using AI is more like running a business and less like being the employee.\n\nSure. You are not actually cleaning the dishes, cooking the food, doing the marketing. But you cannot say people who run the businesses don't user brains. At least the bank balances says the opposite."}, {"id": 50670731, "au": "matwood", "dom": 11, "sr": 80, "sc": 2.42, "ep": 2.89, "bs": 0.0, "d": 5, "age": 0.23, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 9, "k": 21237, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.72, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> No, but someone should know how this stuff works\n\nAnd people still will because it's interesting or fun for some. And, they'll have very effective tooling to help them understand. Think of whatever language the AI outputs at the new assembly/machine code. There are still people who can read and understand that now, but it's certainly not a requirement in most programming jobs or projects."}, {"id": 50670055, "au": "echelon", "dom": 17, "sr": 81, "sc": 2.42, "ep": 2.85, "bs": 0.0, "d": 5, "age": 1.28, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.651, "fa": 0.28, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "This is such a ridiculous false equivalence.\n\nDo you believe you should manufacture all of the chemical inputs in your toothpaste to derive its value? Maybe the machine that assembles the tube and plastic cap too?\n\nThose who are kicking ass with AI are those who devote time to understanding, because those are the ones who can drive the agents as employees and researchers - as a CTO or PI.\n\nIf you're not already a great mathematician, you can't possibly hope to use AI to prove complexity theorems.\n\nIf you're not already a great machine learning researcher, you can't possibly use the models to build you a new model architecture.\n\nIf you're not already a great systems engineer, you can't build services at scale with the tools.\n\nI think you're battling the ChatGPT slackers and grandmas. Probably thinking about \"slop\". I'm talking about something else entirely - using these agents as factories and exoskeletons for grand plans and ambitions you had all along but couldn't action on because of time or capital or both."}, {"id": 50670467, "au": "fzeroracer", "dom": 20, "sr": 82, "sc": 2.42, "ep": 2.78, "bs": 0.0, "d": 8, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 4208, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.182, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Seeing people on HN pride themselves on being completely incurious is a real sign of the times changing I suppose.\n\nLike I don't consider myself exactly a smart person, but I strive to understand how things work because why shouldn't you? Why shouldn't we know how our computers work, how our cars work. That knowledge is how you obtain some level of freedom."}, {"id": 50670057, "au": "agentultra", "dom": 94, "sr": 83, "sc": 2.42, "ep": 2.77, "bs": 0.0, "d": 0, "age": 1.27, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 13137, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.042, "fa": 0.0, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "There is no royal road. Do or do not. If you can’t be bothered it’s probably not worth your time.\n\nI have a theory that things are supposed to be hard, frustrating and take time. It’s the only way to internalize knowledge. You have to write. You have to experiment. You have to fail.\n\nIf you keep offloading to AI you won’t internalize new knowledge. And yeah, you will forget how to do programming over time, I suspect."}, {"id": 50670373, "au": "bee_rider", "dom": 41, "sr": 84, "sc": 2.42, "ep": 2.77, "bs": 0.0, "d": 2, "age": 0.81, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 25212, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "I think it is just easier for them to admit they are giving up?\n\nIt is worth noting that at some point if AIs take over enough of the economically useful activity, the plan of… having accumulated wealth, and living off that, also won’t work. Because why would a system that doesn’t require human effort to run let humans own it?\n\nSo at least we’re all in the same boat!"}, {"id": 50670379, "au": "jamboca", "dom": 125, "sr": 85, "sc": 2.42, "ep": 2.74, "bs": 0.0, "d": 0, "age": 0.8, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 39, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "it;s like driving . i don't owna. car but i am frequently driving a friend's car . some are nearly self driving and others r older without the new feature s. and after some time driving ( or \" riding \" ) in the self driving one going back to the more traditional vehicle can be challenging , i will learn certain laziness habits from the newer stuff, kind of like using ai. then if u go back to the old way, u have to fill in those automation gaps ."}, {"id": 50670182, "au": "bluefirebrand", "dom": 10, "sr": 86, "sc": 2.42, "ep": 2.68, "bs": 0.0, "d": 4, "age": 1.1, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 16, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.409, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> Do you manually compute your TCP/IP packets?\n> Do you do all the spreadsheet calculations yourself?\n\nNo, but someone should know how this stuff works\n\nIn my opinion AI is leading us by the nose towards \"no one knows how the stuff we do works anymore, we just trust the AI knows the foundations\" which is pretty obviously bad"}, {"id": 50670188, "au": "thatswrong0", "dom": 63, "sr": 87, "sc": 2.42, "ep": 2.65, "bs": 0.0, "d": 1, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 3332, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.13, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is me - but man when I’m busy with multiple projects at work it’s very easy to just let some thinking outsourcing slide.\n\nAnd yeah, I’m trying to find something else to fill the void in intellectual stimulation. I feel lucky in retrospect that I used to get paid and have that too."}, {"id": 50670450, "au": "softwaredoug", "dom": 117, "sr": 88, "sc": 2.42, "ep": 2.65, "bs": 0.0, "d": 0, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 19105, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.036, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "The scary thing is the economy is moving fast. But companies are at uneven places in adoption.\n\nWhen you look at hiring, are these companies at AI six months ago? And once they catch up to today they won’t need the people hired?"}, {"id": 50670471, "au": "bigstrat2003", "dom": 173, "sr": 89, "sc": 2.42, "ep": 2.65, "bs": 0.0, "d": 0, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.082, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "So don't use it. You certainly don't need it, and in fact if you're good you'll be more effective without it. I have yet to meet the programmer who is actually improved by LLMs - good ones are producing about the same amount of good work as before, and bad ones are producing way more work but it's all slop. The sooner you realize there's no actual benefit to this tool for programming, the better off you will be."}, {"id": 50669640, "au": "argee", "dom": 112, "sr": 90, "sc": 2.42, "ep": 2.62, "bs": 0.0, "d": 0, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 524, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.919, "fa": 0.0, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "I don't understand how you can outsource your thinking to AI. You can have it do research, or make decisions, but that's not your thinking, is it? Those things are both delegatable to careless or sloppy people as well, and that does not make you any dumber.\n\nMaybe this is just manager syndrome in a different context, the feeling of detachment between action and incentive."}, {"id": 50670002, "au": "latentsea", "dom": 49, "sr": 91, "sc": 2.42, "ep": 2.61, "bs": 0.0, "d": 2, "age": 1.35, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.015, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "Reading books has more utility than ever. You don't need to know the details, because AI can handle the execution, but if you don't know what's even possible in a domain you can't figure out interesting directions to explore or things that might be profitable to combine. You should probably start reading as widely as you can in this day and age and it may be the only way to compete now."}, {"id": 50669943, "au": "skerit", "dom": 146, "sr": 92, "sc": 2.42, "ep": 2.59, "bs": 0.0, "d": 1, "age": 1.44, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1356, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't really understand the \"AI is too good at hacking!\" angle. LLMs aren't performing magic. They're just fast and relentless. But all those insecurities were already there, and chances are someone already knew about them and kept it to themselves.\n\nAnd on top of that: most \"AI hacks\" in the news are just guessing a bad password."}, {"id": 50670081, "au": "freecodeio", "dom": 144, "sr": 93, "sc": 2.42, "ep": 2.57, "bs": 0.0, "d": 1, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 499, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Enjoying problem solving is just as human as enjoying dancing. AI doesn't feel like problem solving, yet our problem-solving jobs are relying on AI whether we like it or not. I can completely understand software engineers feeling empty from having to \"ask claude\" what to do every day."}, {"id": 50670537, "au": "iaaan", "dom": 38, "sr": 94, "sc": 2.42, "ep": 5.51, "bs": 3.05, "d": 3, "age": 0.57, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 565, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.641, "fa": 0.34, "gp": 0.472, "bl": 1.15, "ds": 0.0, "txt": "The people upset by potentially having their livelihoods rug-pulled out from under them are not seeking your financial advice. We are experiencing a fundamental failure of society to provide stability for its workers and your recommendation is to cancel Hulu and stop shopping at Whole Foods. Whether you think society has any responsibility to provide any stability, few/none of us received any warning when we entered this industry that there was a distinct possibility that we'd become the victims of technological unemployment, so forgive me and others for feeling like it's more than a little fucked up that I spent 15 years of my life mastering a skill that I may soon no longer be able to use to find gainful employment."}, {"id": 50669939, "au": "k_kelly", "dom": 126, "sr": 95, "sc": 2.41, "ep": 2.45, "bs": 0.0, "d": 0, "age": 1.45, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 126, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.261, "bl": 0.0, "ds": 0.0, "txt": "This definitely happened to me. I've started reading a lot and it feels a lot better. Long novels by far the best to get attention back."}, {"id": 50670387, "au": "bigstrat2003", "dom": 32, "sr": 96, "sc": 2.41, "ep": 2.45, "bs": 0.0, "d": 6, "age": 0.79, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 6, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.534, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> This is such a ridiculous false equivalence.\n\nMaybe, but so was \"do you compute your own TCP/IP packets\". So you're just getting your own false equivalence thrown back in your face, and have no right to complain about it."}, {"id": 50670244, "au": "jrm4", "dom": 162, "sr": 97, "sc": 2.41, "ep": 2.42, "bs": 0.0, "d": 0, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 8141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.914, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Okay, for what it's worth. I am '10 \"I am awesome\"; 20 GOTO 10' old.\n\nAnd the advent of AI, with coding, is one of the most exciting things I've seen in some time, because it's basically the above feeling, but now with the limitation not being \"cranking out the code to do it\" but \"hey, what to I want to try today!\""}, {"id": 50669627, "au": "darepublic", "dom": 80, "sr": 98, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 0, "age": 1.85, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 2938, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.796, "fa": 0.0, "gp": 0.325, "bl": 0.0, "ds": 0.0, "txt": "I have been prepping for job interview and actually enjoyed hand coding leetcode answers.  Your brain is a muscle.. use it?"}, {"id": 50669877, "au": "liquidise", "dom": 104, "sr": 99, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 2, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 7, "k": 5197, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.485, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Nobody is rewarded for building hard things\n\nWas that ever the goal? Building needed things, building valuable things, building more polished things has traditionally been where the pots are gold are.\n\nI think in pure engineering circles we value the difficulty of a solution a lot more than that average consumer, who probably doesn't think of it at all."}, {"id": 50670852, "au": "__MatrixMan__", "dom": 59, "sr": 100, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 0.91, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "I think it goes a long way to just be intentional about which part of the loop you want to inhabit.  You don't have to continue zooming out until you have no idea what is going on.  You can build yourself a little habitat which is situated for the level of abstraction that you prefer to work at."}, {"id": 50669678, "au": "righthand", "dom": 106, "sr": 101, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 1, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 21, "k": 2869, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.471, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> If you're just \"meat proxying\" and pressing \"yes\" to every agent turn, then yeah, you're probably losing brain cells.\n\nIs this not how it’s designed to be used? The LLM companies don’t want you to use it as a skeptic. There is no long horizon thought returned either, most readers will speed-read/summarize the summarization upon receiving it."}, {"id": 50669716, "au": "json_hero", "dom": 107, "sr": 102, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 2, "age": 1.72, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.963, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not if you're trying to build something of substance. All of your time should be spent planning and thinking upfront, then let the agent loose for hours to do the execution unguided once you have a solid plan and ways for it to verify itself."}, {"id": 50670020, "au": "AspireOne", "dom": 47, "sr": 103, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 2, "age": 1.33, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 82, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Same. Not only that - I somehow actually FINISHED my backlog of projects and programming-related things to do :D It was over the span of a few months, but yes, now I literally have nothing else to put my agents on. They've done it all. And I love that, because I wanted to move away from programming-related hobbies to less dull ones, and now there's not a big backlog of juicy programming projects calling my name anymore."}, {"id": 50670740, "au": "holosmock", "dom": 83, "sr": 104, "sc": 2.14, "ep": 4.66, "bs": 2.52, "d": 0, "age": 0.22, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.709, "fa": 0.0, "gp": 0.446, "bl": 0.95, "ds": 0.0, "txt": "I really don’t get this reaction. My hobbies shifted from getting bogged down in core source components, infrastructure, and testing. With AI I can delegate the little things and actually get bigger tasks accomplished.\n\nI had been working on wave station synth web app for five years. I was choking on web audio workers and webasm. Claude built exactly the underlying wave table management that I needed and I’m finally up and running and composing. Five years of stuck replaced with one weekend of Claude, just to get to the real creative work.\n\nThink bigger."}, {"id": 50670211, "au": "lukeschlather", "dom": 19, "sr": 105, "sc": 2.05, "ep": 2.05, "bs": 0.0, "d": 7, "age": 1.05, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 6230, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.534, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I never had the time to really truly care about how sorting algorithms work before. I use the library sort. If I'm lucky I take some time to do some tuning and make sure there's not a better library sort for the usecase.\n\nWith AI I can idly suggest the AI try every single library sort and benchmark them while I go to get a drink. I'm still not sure I really understand how the sorting algorithms work, but I have a lot more confidence I'm using them correctly."}, {"id": 50669728, "au": "blocked_againnn", "dom": 81, "sr": 106, "sc": 2.05, "ep": 2.05, "bs": 0.0, "d": 1, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 24, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.79, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I don't really think solving the same patterns of problems over and over is going to be helpful in age of AI.\n\nSure. You might build some muscle for that sort of problem solving. I doubt whether it transfers into real world apart from cracking gech company interviews."}, {"id": 50670803, "au": "Aperocky", "dom": 1, "sr": 107, "sc": 1.98, "ep": 1.98, "bs": 0.0, "d": 0, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 6523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.765, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Get through something that AI can't.\n\nI've been enjoying oncall more and more - there are problems that a room full of people are waiting for next steps from you yet all of them with access to the same AI models. Once a problem gets several levels deep, LLM aggregates down to the local minima and until you set a direction they are completely stuck.\n\nLLM is like a drone swarm that allow you to explore the vicinity very quickly, works great in open fields. But when you are exploring caves are too closed and too long then that LLM cease to work until you give it something to point at and also move yourself.\n\nThis is presumably why there are so many long outages recently, I presume they tried to use LLM to fix their problem but it probably just resulted it in more time wasted. LLM are great at doing, they are much worse at thinking."}, {"id": 50669953, "au": "lf88", "dom": 152, "sr": 108, "sc": 1.97, "ep": 1.97, "bs": 0.0, "d": 0, "age": 1.43, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 239, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.703, "fa": 0.0, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "Fear of cognitive atrophy is one of the several reasons why I'm doing my best to avoid using generative AI."}, {"id": 50669977, "au": "IshKebab", "dom": 175, "sr": 109, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 0, "age": 1.4, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.807, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not scared about this. AI is massively enhancing my ability to learn things.\n\nI'm scared that it's already so much smarter than me, what's the point of me?\n\nIf you believe you are smarter than AI, try using it to learn Lean."}, {"id": 50670262, "au": "alexfromapex", "dom": 127, "sr": 110, "sc": 1.72, "ep": 1.72, "bs": 0.0, "d": 0, "age": 0.98, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2488, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "I don’t let AI implement things I make it give me a plan and then I understand it and implement it. That should be the standard approach if we don’t want all the tribal knowledge to shift to machines."}, {"id": 50669962, "au": "PrimeOS32", "dom": 153, "sr": 111, "sc": 1.61, "ep": 1.61, "bs": 0.0, "d": 0, "age": 1.42, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 6, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.535, "fa": 0.0, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "I think AI is getting dumber as well. That is the true apocalypse - dumb (humans) and dumber (AI)."}, {"id": 50670432, "au": "freetonik", "dom": 118, "sr": 112, "sc": 1.59, "ep": 1.59, "bs": 0.0, "d": 0, "age": 0.73, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 18, "qw": 0, "k": 3808, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://thesoapbox.email/"], "ig": 0.586, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Unrelated to the post, but this is the first time I see this website (https://thesoapbox.email/) Sounds like a very interesting idea!"}, {"id": 50670480, "au": "scruple", "dom": 25, "sr": 113, "sc": 1.58, "ep": 3.17, "bs": 1.59, "d": 8, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 4038, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.235, "fa": 0.0, "gp": 0.183, "bl": 0.6, "ds": 0.0, "txt": "This sort of thing is really funny to me because it assumes the LLM isn't doing really stupid shit at the line of code or function level. Last week I caught an LLM grabbing an uninitialized buffer before writing compiled game textures to disk which resulted in it leaking all sorts of shit to our packed data files, which can be trivially extracted and opened in a hex editor. I guess we just don't give a shit about security at all? Instantly conjures the \"don't make any mistakes\" meme."}, {"id": 50670461, "au": "trashcan_man", "dom": 42, "sr": 114, "sc": 1.52, "ep": 1.52, "bs": 0.0, "d": 3, "age": 0.69, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm having a lot of fun bouncing around the comments here. I addressed the parent comment, and it might be worth your time.\n\nIf you are incorporating \"unstoppable doomsday singularity culling all of mankind\" in your career calculus, you're doing it wrong. That's a recipe for hopeless inaction - ironically, the criticism aimed optimists!\n\n\"Giving up\" my ass."}, {"id": 50670472, "au": "quantiq", "dom": 36, "sr": 115, "sc": 1.5, "ep": 2.35, "bs": 0.85, "d": 3, "age": 0.67, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 96, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.001, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yeah, on second read of my comment, I apologize.\n\nQuite frankly, I'm terrified. Both about being deskilled and living in a world where people simply no longer care. There are strong emotions tied up in that, it feels like I've watched the job I loved doing die overnight."}, {"id": 50670808, "au": "mathplebe", "dom": 92, "sr": 116, "sc": 1.47, "ep": 4.84, "bs": 3.37, "d": 3, "age": 0.11, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.704, "fa": 0.0, "gp": 0.575, "bl": 1.27, "ds": 0.0, "txt": "I think the best analogy for all this is simply the Industrial Revolution. Fast forward a couple hundred years and behold, the best carpenters in the world are probably Japanese, practicing traditional workmanship. They use mortise and tenons and don’t even need nails.\n\nThe majority of new Western builds are crap in both design and construction. Take any pleb and give them some power tools and SHAZAAM you’ve got a house. A crappy one, but it’s there.\n\nThat’s what AI is going to give us. A lot of crap built to scale and look the same, be cheap to build.\n\nThe best stuff though? They might use some AI as a power tool. But the majority needs to come from the heart and soul of real humans.\n\nNOTE: fire fighters will tell you if a new build goes up in flames if you don’t get out of there in a few minutes you’ll go with it; old builds with lathe & plaster, even having less fireproof materials, you’ve got time to pack a few suitcases, cook some lunch, gather your documents, maybe make some coffee. :)"}, {"id": 50669995, "au": "finnjohnsen2", "dom": 120, "sr": 117, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 0, "age": 1.36, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 620, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.464, "fa": 0.0, "gp": 0.254, "bl": 0.0, "ds": 0.0, "txt": "We all know this has been said every advancement. We are rotting somehow because things are too easy now. And to this response the counter has been \"but THIS time is REALLY different\". Which is true because no advancement can be the same thing.\n\nMaybe we just need this debate every time. When our nose is deep in change it's a shock. This debate is probably just a healthy a part of our coping mechanism I suppose."}, {"id": 50669968, "au": "Sharlin", "dom": 71, "sr": 118, "sc": 1.43, "ep": 1.43, "bs": 0.0, "d": 1, "age": 1.41, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 22519, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.609, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Continuous delivery and SaaS stuff sucks for that reason. But at least consulting/contractor projects usually have a specific finish line and you can switch to another project, and some types of software still have oldschool versioned releases that you can celebrate."}, {"id": 50670132, "au": "kenjackson", "dom": 57, "sr": 119, "sc": 1.41, "ep": 1.41, "bs": 0.0, "d": 1, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 22096, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Exactly.  I cook pretty elaborate meals now, in part because I don't have to spend time raising cows and growing crops.  And in SW/HW we always build on abstractions.  Even before AI blew up, kids coming out of college struggled with memory management, because it was abstracted away for them.\n\nI think you have exactly the right perspective."}, {"id": 50670795, "au": "Zizizizz", "dom": 23, "sr": 120, "sc": 1.39, "ep": 1.39, "bs": 0.0, "d": 8, "age": 0.13, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 279, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.515, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "There's some truth in that, but someone needed to know and someone should still know otherwise each crisis will just become bandaids on bandaids on bandaids. EMs and CEOs knew that someone knew how to fix it and could push the responsibility of the fix to individuals or teams. In the new world where we're all masters of our own universes, we also carry the responsibility of ownership and maintenance.\n\nIf we don't want to do that, you pay someone else to, and that person is telling you that they need/desire to know how something works at some level so they can do their job well."}, {"id": 50670261, "au": "peripheral_", "dom": 109, "sr": 121, "sc": 1.39, "ep": 3.91, "bs": 2.52, "d": 0, "age": 0.98, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 3, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.214, "bl": 0.95, "ds": 0.0, "txt": "one thing I've been discussing with people since LLMs first became widely available is that I believe there is significant cognitive benefit to the boring tasks people were so quick to offshore to the bots. Actually doing research manually and not just asking the bot for a summary helps you build a mental model of the issue and slows you down enough to maintain a critical posture towards the information you are consuming. These things are important! You don't become knowledgeable on a topic by just speed running summaries with cloud software that might not even be getting the details right."}, {"id": 50669841, "au": "mathplebe", "dom": 90, "sr": 122, "sc": 1.35, "ep": 3.86, "bs": 2.52, "d": 1, "age": 1.57, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.644, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "It’s tough though because many jobs have their employees using AI for the work and they won’t pay people to think through a solution when an agent can do it. So unless working on something extra curricular, perhaps the enjoyment in jobs will be gone due to brain rot.\n\nJust think, McDonalds had real cashiers at one point, which required quick mental math.\n\nNow, there’s a button for every item on the menu. Workers prod the touch screen and the job is suddenly somewhat mindless and less fulfilling.\n\nNot just fast food: I paid in cash at a regular restaurant recently and the server had a system overload moment and fled to back of house. That’s common."}, {"id": 50670041, "au": "internet2000", "dom": 151, "sr": 123, "sc": 1.23, "ep": 1.23, "bs": 0.0, "d": 0, "age": 1.31, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 1782, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.398, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "You probably are if you're not replacing the thinking you're offloading with higher abstraction thinking."}, {"id": 50670393, "au": "overtone1000", "dom": 40, "sr": 124, "sc": 1.21, "ep": 1.21, "bs": 0.0, "d": 2, "age": 0.78, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 289, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.448, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "I thought \"Naruto-tier\" was a pretty good signal that the parent commenter was late Gen X at the very oldest, but correct me if there are many hardcore Boomer anime fans out there!"}, {"id": 50669928, "au": "bob1029", "dom": 7, "sr": 125, "sc": 1.09, "ep": 1.09, "bs": 0.0, "d": 1, "age": 1.47, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 0.394, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "I am perfectly happy watching the \"how\" be completely offloaded. I've only ever really cared about the other five things. Being good at the how was simply the way to realize what I wanted when I wanted it. Now that this is out of the way I can spend a lot more energy refining things like \"why\"."}, {"id": 50670124, "au": "Insimwytim", "dom": 55, "sr": 126, "sc": 1.09, "ep": 1.09, "bs": 0.0, "d": 1, "age": 1.19, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 517, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.406, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "We worked back on forth and came up with a design that I should be able to assemble and test soon. This is something I could have designed and built over many many days/weeks of work, but instead it took 1.\n\nBut it didn't. You don't have a working product yet."}, {"id": 50669907, "au": "hyraki", "dom": 53, "sr": 127, "sc": 1.08, "ep": 1.08, "bs": 0.0, "d": 1, "age": 1.48, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 15, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.291, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "I’m right there with you. I’m doing projects that I can certainly do and design but I just don’t have the time. With ai I can knock out a fun project in a day and get some joy from it rather than the disappointment of just never doing it."}, {"id": 50670017, "au": "libreblog", "dom": 140, "sr": 128, "sc": 1.0, "ep": 3.52, "bs": 2.52, "d": 0, "age": 1.34, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.246, "bl": 0.95, "ds": 0.0, "txt": "IMO, AI companies are similar to social media companies: they profit because people spend a lot of time staring at their products (spending tokens, watching ads, or whatever). It’s in their interest to use our psyche against us. In the case of AI companies, they profit when they make us lazy and dumb: when you have to ask it to change one line of code because you don’t know/remember the name of the method it created for you."}, {"id": 50670221, "au": "webdood90", "dom": 105, "sr": 129, "sc": 0.97, "ep": 0.97, "bs": 0.0, "d": 3, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 423, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.414, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They can be all of these things. My point is that it's no longer hard, no longer challenging, and no longer interesting to build them."}, {"id": 50670344, "au": "sowhat1", "dom": 134, "sr": 130, "sc": 0.78, "ep": 3.83, "bs": 3.05, "d": 0, "age": 0.86, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 39, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.19, "bl": 1.15, "ds": 0.0, "txt": "AI has been devastating to midwit programmers. Programmers who based their identity on having niche Kubernetes commands memorized. Programmers who thought they were at the apex of intelligence because they read the boar book and could do Dynamic Programming leetcodes. The sad truth of it is, you were never as smart as you thought and the work you did was trivial. The same thing is happening to mathematicians who manipulated symbols all day. I’m sorry it hurts, but you need to think bigger and work on harder things now.\n\nTo those of us who were working on open problems with solutions not in any text books, well, AI hasn’t really changed much of our work besides having a grunt to delegate experiments to. In the old days, these were grad students."}, {"id": 50670191, "au": "echelon", "dom": 22, "sr": 131, "sc": 0.72, "ep": 2.42, "bs": 1.7, "d": 7, "age": 1.08, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.35, "fa": 0.28, "gp": 0.55, "bl": 0.64, "ds": 0.0, "txt": "I'm going to be blunt -\n\nYou never need to know how a codebase works at the single line of code or function level again.\n\nThat is strictly in the past now.\n\nAs an EM, you didn't in the first place. Neither did the CEO.\n\nYou don't know how all the DNA in you works either. No biochemist does. By all rights it's a lot of slop accumulated from billions of years of evolution.\n\nYet now we have intelligent engineers to guide the process with code.\n\nWe're climbing gradients of complexity. While I imagine you're arguing to stay in place and fighting the intrusion of slop into your familiar corner, I'm advocating for leaving this continent all together for the brand new one.\n\nYou can build apps that used to take billions of dollars in a few weeks. You don't need to read the code anymore."}, {"id": 50669862, "au": "andOlga", "dom": 91, "sr": 132, "sc": 0.66, "ep": 2.25, "bs": 1.59, "d": 2, "age": 1.54, "grav": 9.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 63, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.957, "fa": 0.0, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": "\"Enjoyment in jobs\" fades away through the simple fact that most jobs are very repetitive. Even \"knowledge work\". Take software dev -- you are probably working on one big product for years and years. Shit's boring!\n\nYou really need to find creative stuff to do outside of work. It's wildly energizing in a sort of caffeine-frenzy way to make a thing you want to make, rather than being told to do so."}, {"id": 50670249, "au": "croes", "dom": 165, "sr": 133, "sc": 0.59, "ep": 1.78, "bs": 1.19, "d": 0, "age": 1.0, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 25736, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.183, "bl": 0.45, "ds": 0.0, "txt": "Like playing a game with a walkthrough or doing crossword puzzles by using those crossword puzzle lookup sites."}, {"id": 50670547, "au": "mirsadm", "dom": 130, "sr": 134, "sc": 0.55, "ep": 0.55, "bs": 0.0, "d": 1, "age": 0.56, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1312, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.235, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You ticked off a few times of a checklist but have you learnt anything? I don't know about you but all the things I want to do but don't have time are not about finishing a thing but learning how to do it."}, {"id": 50670405, "au": "origini", "dom": 123, "sr": 135, "sc": 0.53, "ep": 2.12, "bs": 1.59, "d": 0, "age": 0.77, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.786, "fa": 0.0, "gp": 0.188, "bl": 0.6, "ds": 0.0, "txt": "I figured this too: I started to look forward using public transport and going out in shitty weather.\n\nSitting at home and just 'enjoying' the easy life doesn't make me happy."}, {"id": 50670027, "au": "echelon", "dom": 9, "sr": 136, "sc": 0.42, "ep": 3.46, "bs": 3.05, "d": 3, "age": 1.32, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.474, "fa": 0.0, "gp": 0.0, "bl": 1.15, "ds": 0.0, "txt": "Do you manually compute your TCP/IP packets?\n\nDo you do all the spreadsheet calculations yourself?\n\nYou can use that time to instead think of how to build the robot or service fleet or rocket ship.\n\nIt's not that you aren't thinking. It's that you're not wasting time on stupid, trivial bullshit problems. You can now think and execute at a grander scale.\n\nThe time and cognitive savings is how we accelerate as a species. The next decade could go faster than the last fifty years.\n\nSomeday in the future people will think the problems we're solving with AI today are primitive. That assembling robots are primitive when they just assemble themselves and their factories. It's progress."}, {"id": 50670828, "au": "l33tbro", "dom": 73, "sr": 137, "sc": 0.32, "ep": 1.52, "bs": 1.19, "d": 0, "age": 0.06, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 3467, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.58, "fa": 0.0, "gp": 0.106, "bl": 0.45, "ds": 0.0, "txt": "I look wistfully at my prompt history like I used to look at the Photos app.  Do I have a problem?"}, {"id": 50670763, "au": "brador", "dom": 150, "sr": 138, "sc": 0.25, "ep": 1.44, "bs": 1.19, "d": 0, "age": 0.18, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3290, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.548, "fa": 0.0, "gp": 0.108, "bl": 0.45, "ds": 0.0, "txt": "The basilisk is real. And it’s already got you. Like an anaconda wrapping its tentacles into your brain. It is the air you breath.\n\nWe are doomed."}, {"id": 50670631, "au": "hendrikmans", "dom": 137, "sr": 139, "sc": 0.23, "ep": 1.42, "bs": 1.19, "d": 0, "age": 0.41, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 32, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 0.52, "fa": 0.0, "gp": 0.139, "bl": 0.45, "ds": 0.0, "txt": "Blah blah outsourcing my thinking to AI blah blah blah. Every blog post like this is the same. And AI is the parrot?!"}, {"id": 50670423, "au": "karmakurtisaani", "dom": 44, "sr": 140, "sc": 0.21, "ep": 1.8, "bs": 1.59, "d": 2, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.767, "fa": 0.0, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": "I recall one commenter saying how they immensely enjoy doing projects with AI and casually dropping that they're retired. Possibly early due to high compensation earlier.\n\nSo no shit you enjoy it, you get to decide exactly what to do and how to do it. Why didn't I think of that?"}, {"id": 50670059, "au": "ivanjermakov", "dom": 149, "sr": 141, "sc": 0.11, "ep": 1.3, "bs": 1.19, "d": 0, "age": 1.27, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3129, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.407, "fa": 0.0, "gp": 0.236, "bl": 0.45, "ds": 0.0, "txt": "Astronauts do a lot of muscle training to stay in shape while in space. Would they continue training knowing there is a chance they never come back?"}, {"id": 50670636, "au": "trashcan_man", "dom": 39, "sr": 142, "sc": -0.08, "ep": 2.97, "bs": 3.05, "d": 4, "age": 0.4, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 0.0, "bl": 1.15, "ds": 0.0, "txt": "It was rhetorical, but he did ask a question and I answered in earnest. My recommendation is to shrink into a defensive ball and get as close to an ascetic monk as possible - it's not easy, it's not fun, and it's not trivial.\n\nI'm not hand-waiving your concerns, I am frantically and politely urging that I see the plight and offering as much of my shared experience as I can >>while I struggle to follow my own advice<<. I didn't mean \"cancel Hulu\", I meant \"take a militant effort in shrinking your financial footprint because the world's economic systems are at near-immediate risk of capitulation.\" That said, if you're paying for Hulu, cancel that lmao.\n\nWe are at least in similar boats - we should be friends. Don't mistake my upbeat attitude for flippant disregard. If I didn't care, I wouldn't be all over the comments section."}, {"id": 50669998, "au": "strange_quark", "dom": 82, "sr": 143, "sc": -0.16, "ep": 1.03, "bs": 1.19, "d": 1, "age": 1.35, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 736, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.438, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Except most companies explicitly tell you you are not allowed to use your brain, only agent."}, {"id": 50670177, "au": "varjag", "dom": 159, "sr": 144, "sc": -0.38, "ep": 0.81, "bs": 1.19, "d": 1, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 16295, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 0.346, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Understanding of work done by someone else is unavoidably superficial. There is no substitute for practice but ain't no one has patience for that anymore."}, {"id": 50670778, "au": "Palomides", "dom": 77, "
