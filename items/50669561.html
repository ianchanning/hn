: [{"category": "general_web", "count": 6}, {"category": "arxiv_preprint", "count": 1}], "story_anchors": ["scared", "brain", "human", "whole", "dumber", "getting", "ability", "takes", "everything", "nice", "hard", "thinking", "far", "feels", "sounds", "interesting", "effort", "feeling"], "largest_root": {"root_id": 50669719, "author": "trashcan_man", "slots": 43, "start_dom": 2, "end_dom": 44, "share_pct": 24.2, "top_dom1_age": 0.1, "top_dom1_author": "Aperocky"}, "buried_cutoff": 53, "rescue_top_k": 36, "ablations": [], "tournament": [], "comments": [{"id": 50670483, "au": "9x39", "dom": 88, "sr": 1, "sc": 9.95, "ep": 9.95, "bs": 0.0, "d": 0, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 57, "qw": 0, "k": 931, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": ["https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6097646"], "ig": 0.955, "fa": 2.35, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "I like the idea of type 3 thinking and cognitive surrender from this paper: \nhttps://papers.ssrn.com/sol3/papers.cfm?abstract_id=6097646\n\nI haven’t found a better model yet, and it has worked to describe what I observe in AI usage personally and in people around me.\n\nMaintaining the discipline to supplement and invigorate your own type 2 thinking instead of replacing it is something I’ve been thinking a lot about recently."}, {"id": 50669719, "au": "trashcan_man", "dom": 2, "sr": 2, "sc": 8.76, "ep": 8.76, "bs": 0.0, "d": 0, "age": 1.72, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 239, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": ["https://jackson-t.com/cognitive-artifacts-complementary-competitive/"], "ig": 1.68, "fa": 1.24, "gp": 0.881, "bl": 0.0, "ds": 0.0, "txt": "After pondering the impact of AI through the lens of competitive/complimentary cognitive artifacts (https://jackson-t.com/cognitive-artifacts-complementary-comp...), I have been following these rough rules of thumb and do not feel much dumber despite heavy AI usage:\n\n1) I am getting older. If, by my current age, I do not feel an immense amount of joy or motivation in trying to learn how to do something, I have no qualms offloading it to a machine that can do it for me. We do this every day with computers. This is also true of things I \"want\" to do but have never progressed in or enjoyed doing.\n2) If I am not able to think a few steps ahead of a language model and \"manage\" the flow of a process or predict and interpret the results, then I have not put enough effort into understanding my ask of an AI agent and I need to learn more before I leap. \n3) You're probably not getting dumber, you are probably spending your free time in ways that are not rewarding. Put a musical instrument within arms reach of your battlestation. I've been \"trying to learn guitar\" for 15 years, and my actual progress correlates directly with my offloading of monotony onto algorithms that expedite the work. \n4) Even if you are getting dumber, thinking about getting dumber makes it worse! Make fantastical, Naruto-tier assumptions about your ability to think and do. You are probably hallucinating either way,"}, {"id": 50669878, "au": "micromacrofoot", "dom": 167, "sr": 3, "sc": 7.88, "ep": 7.88, "bs": 0.0, "d": 0, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 4803, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": ["https://en.wikipedia.org/wiki/Is_Google_Making_Us_Stupid%3F", "https://www.technologyreview.com/2024/05/15/1092350/technology-is-probably-changing-us-for-the-worse-or-so-we-always-think/"], "ig": 1.314, "fa": 1.3, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "I promise you, this isn't the first time people have worried about this sort of thing with new media... and we'll be ok.\n\nCheck this out from 2008 \nhttps://en.wikipedia.org/wiki/Is_Google_Making_Us_Stupid%3F\n\nThis same thing has been pondered about video games, television, etc. Socrates pondered that writing would make our memories weaker, 370BCE: https://www.technologyreview.com/2024/05/15/1092350/technolo... There was an effort to outlaw the printing press because it could create an overabundance of books. Some people in math were worried about pocket calculators."}, {"id": 50670043, "au": "Waterluvian", "dom": 110, "sr": 4, "sc": 7.55, "ep": 7.55, "bs": 0.0, "d": 0, "age": 1.3, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 54558, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.794, "fa": 0.62, "gp": 1.081, "bl": 0.0, "ds": 0.0, "txt": "I get all of that life fulfilment and \"nice chemicals\" from spending time with my kids. AI has had a positive impact because I find I have a lot more mental energy and free time now. My wife mentioned that she doesn't recall seeing me seek them out to play Lego, Mario Kart 64, Wii Bowling, etc. nearly as much as I have in the past six months. I just don't feel mentally drained after work anymore.\n\nI have a few hobbies that I get satisfaction from as well:\n\n- Game Boy emulator (no AI; the journey of learning how it works is the point)\n\n- Warcraft 2 tower defense web game (entirely AI; the goal is the gameplay/fun)\n\n- Making furniture (no AI; it insists it doesn't see the lumber I needed milled)\n\nI don't expect satisfaction from my job. I expect money.  Because I don't control the terms of the project, so I cannot set its tempo and decide what parts of the journey are important."}, {"id": 50670293, "au": "iaaan", "dom": 119, "sr": 5, "sc": 7.47, "ep": 7.47, "bs": 0.0, "d": 0, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 357, "qw": 0, "k": 565, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.617, "fa": 0.78, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "Sounds like somebody is feeling all mixed up. I constantly see people getting all twisted around these semantic conversations like \"am I getting 'dumber'? Is the output from an LLM 'good'?\" You will never get a satisfying answer to these questions because the answer depends on how you define the operative word in each one. One thing's for sure though -- it sounds like something is making this person uneasy, and they specifically point to the lack of satisfaction they derive from an LLM-focused workflow.\n\nIt seems to me like there are then two basic ways forward:\n* accept this as the new normal in these tasks\n* find a way to return to levels of satisfaction you deem adequate\n\nIt may be the case that you simply don't enjoy using an LLM, which can be true regardless of if you or other people find genuine utility in using them. That conclusion might also (rightfully) bring with it other feelings that can be tackled one-by-one as they come up, like fear of falling behind, grief over a sudden (negative, to them) change to an important part of your life, frustration or anger towards yourself for feeling differently than certain other people...\n\nAt the end of the day, you're allowed to desire that things you do in your spare time feel a certain way. You're also allowed to have desires about the way work for an employer feels (and you're allowed to band together with like-minded colleag"}, {"id": 50669987, "au": "synapsomorphy", "dom": 74, "sr": 6, "sc": 7.29, "ep": 7.29, "bs": 0.0, "d": 0, "age": 1.37, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 201, "qw": 0, "k": 789, "kpp": 10.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.436, "fa": 0.62, "gp": 1.484, "bl": 0.0, "ds": 0.0, "txt": "Two strong disagreements:\n\n1. YOU CAN DO SOMETHING ABOUT EXISTENTIAL RISK!!! It's extremely bad to give up before even trying and even worse to broadcast this to other people! If you're reading this, you are probably in the top 1% of the population in your understanding of tech and AI and you are exactly the kind of person who it would be extremely useful if you speak up, call your representative, and tell your friends and family to do the same. We have a choice between eternal utopia and extinction, and a pause or slowdown can absolutely happen if the public will is there, but for that to happen we can't give up without even trying!!!\n\n2. (way, way less important than first point) If you're not feeling challenged or a sense of achievement by the things you're working on, then you probably just need to get more ambitious. It's now possible for everyone to build things of a scope previously unthinkable for a single person, and also vastly easier to quickly learn new things and apply the understanding. TBH I kinda struggle to understand posts like this because I'm more intellectually stimulated and learning things more quickly than ever before, and I'm not sure what's causing the disconnect."}, {"id": 50670385, "au": "asd88", "dom": 93, "sr": 7, "sc": 7.23, "ep": 7.23, "bs": 0.0, "d": 0, "age": 0.79, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 16, "k": 292, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.354, "fa": 1.1, "gp": 0.629, "bl": 0.0, "ds": 0.0, "txt": "> Everything now takes less effort which sounds great, but there's no sense of achievement from it.\n\nI read a while ago that it takes about 1 year for someone’s reward system to adapt when transitioning from SWE IC to engineering manager. I found this to be true for AI coding. After the AI honeymoon period, I went from “work is miserable, my brain gets no reward if I don’t write any code” to “it’s so rewarding to ship so much and be able to direct so many projects” in about 1.4 years (most of my code has been 100% AI written since Sonnet 3.7)."}, {"id": 50670108, "au": "anon7725", "dom": 122, "sr": 8, "sc": 7.01, "ep": 7.01, "bs": 0.0, "d": 1, "age": 1.21, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1492, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.425, "fa": 0.9, "gp": 0.759, "bl": 0.0, "ds": 0.0, "txt": "Executives and creatives are doing different things. Executives are 100% outcome based, with external quality signals of the essence.\n\nFor example: stock price, bonus, analyst rating, news article hit, PR release, org change, revenue increase, taxation change, etc.\n\nEngineers are motivated by a mix of internal and external factors. Examples of internal factors: code organization, essential vs accidental complexity, test coverage, span of understanding or control.\n\nSo saying that creatives should be more like managers and executives is missing the fact that in order to do good work, the former must be motivated by a different reward system."}, {"id": 50670276, "au": "cantalopes", "dom": 114, "sr": 9, "sc": 7.01, "ep": 7.01, "bs": 0.0, "d": 0, "age": 0.96, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 215, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.413, "fa": 0.96, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "My thoughts exactly, it's been year or two of massive llm progress in programming and i just know that if tasked with a complex job full of unknowns, docs excavating and creatibe problem solving i just know that i would absolutely suck at it today compared to how resourceful i would be 2 years ago. I am also afraid what's gonna be in next 2 or even 10 years. Absolute cognitive regression"}, {"id": 50670535, "au": "JKCalhoun", "dom": 129, "sr": 10, "sc": 6.8, "ep": 6.8, "bs": 0.0, "d": 0, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 198, "qw": 0, "k": 24496, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.652, "fa": 0.68, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "I must be slow on the uptake—I'm loving AI. If I'm stupider from it, I may not have noticed yet. ;-)\n\nI have noticed that I have knocked out twice as many projects using AI to assist me than I would have without.\n\nBut the salient thing to me is this: these are projects I would not have done before AI.\n\nI wanted to do them, but due to a time-consuming learning curve, tedium, or other reasons, I couldn't be bothered to even begin. And besides, I have, at any time, several projects going at once and maybe 30 to 50 projects that I have sketched out, waiting for me to get to in the future.\n\nSo if I can knock these out with an LLM and they at last see the light of day, I'm happy. And I can cross them off my list.\n\nLLM's have helped me re-layout a 50 year old 6502 programming book, vibe-code three games for the KIM-1, vibe-code a web-based retro Star Wars 3D arcade game, and get a prototype of a mini-TTY machine up and running.\n\nAnd this over the span of maybe 4 to 5 weeks.\n\nProjects I'm involved in that are not using AI? Woodworking: a dutch tool chest, shelves for the \"lab\" (mancave). Laser-cutting balsa for a 2001 spaceplane model. So it's not all AI, all the time."}, {"id": 50670296, "au": "spudlyo", "dom": 148, "sr": 11, "sc": 6.48, "ep": 6.7, "bs": 0.0, "d": 0, "age": 0.93, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 227, "qw": 0, "k": 6480, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.846, "fa": 0.34, "gp": 0.96, "bl": 0.0, "ds": 0.0, "txt": "We're all responsible for the health of our minds, and for us older folks with a family history of dementia and/or Alzheimer's this sort of thing is something we think about quite a lot. I've used AI tools every day for coding and chat for most of this year, and I'm not at all frightened about what it's doing to my mind.\n\nI get pretty big hits of dopamine by willing the clankers to do my bidding, and the pace of my progress and the scope of my ambition is greater than I could have imagined. No longer being steeped in the minutia of programming and thinking through many little problems every day is an acceptable tradeoff for the the gains in capability.\n\nI get a lot entertainment from chatting with clankers too. This week, while traveling in my car, I've discussed the overlapping uses of of the Latin supine and gerund verb forms, reviewed the tensions between the \"high\" (Tractarian) and \"low\" (Evangelical) factions of the 19th-century church of England, and compared and contrasted the \"authorial voice\" of Jane Austen and Anthony Trollope.\n\nI no longer tell myself that programming will help keep my mind sharp, instead I rely on the things I already do -- 15 hours of cardiovascular exercise a month, daily extensive reading in both my native language and the new one I'm trying to acquire, drinking coffee, and maintaining relationships with people I care about."}, {"id": 50669960, "au": "crystal_revenge", "dom": 99, "sr": 12, "sc": 6.38, "ep": 6.38, "bs": 0.0, "d": 1, "age": 1.42, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 7, "k": 3488, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.585, "fa": 0.42, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "> on planning and actual long horizon thought.\n\nIn most startups I know this will get you let go in short time. You need to be shipping to prod daily, and nobody cares if the product you're building even makes sense. Shipping velocity is everything these days even if products and features are very poorly defined and have no known use case.\n\nTwo, well liked and reasonably productive, people on my team were let go just a few weeks ago for not meeting ridiculous shipping requirements (even though nobody on the team even knows what the product objectives even are anymore). On top of this, and despite the time saved by using LLMs, its still expected that everyone is working at least some nights and weekends. I've seen this pattern repeated at basically every startup I know."}, {"id": 50669677, "au": "belval", "dom": 64, "sr": 13, "sc": 6.3, "ep": 6.3, "bs": 0.0, "d": 0, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 8194, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.489, "fa": 0.34, "gp": 1.261, "bl": 0.0, "ds": 0.0, "txt": "I would frame it as a shift in what you use your brain for, not a reduction in total brain usage.\n\nYour ability to reason about specific function and track their behavior within a specific component is likely going down, that's expected as the value of doing such a thing has gone down considerably.\n\nYour ability to multi-task, think at a higher architectural level and define scope/boundaries should be increasing as that's the part that is still to this day hard for agents to properly do.\n\nIn much the same way that a mechanical engineer today after ~5 years on the job has lost much of their ability to do complex differential equations by hand, the software engineer is losing his ability to trace specific code paths and think about algorithms. You can decry it, but I am not sure that it means you are getting \"dumber\"."}, {"id": 50670065, "au": "devttyeu", "dom": 157, "sr": 14, "sc": 6.24, "ep": 6.24, "bs": 0.0, "d": 0, "age": 1.26, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 743, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.704, "fa": 0.28, "gp": 0.994, "bl": 0.0, "ds": 0.0, "txt": "As a former SWE, now a founder running an infra company (and in the EU, as if just running an infra company in a sane jurisdiction isn't hard enough lol), I highly recommend just moving up a level or two, starting a side thing if your current position doesn't enable that, and messing with multiple really 'hard' things.\n\nVery quickly you will find that managing the absolute chaos of multiple of everything happening at the same time is much more mentally challenging than solving focused \"hard\" problems.\n\nI'm yet to feel mental relief from AI models offloading all of my hard tasks, I'm hoping for much stronger models coming out fast enough to absorb the exploding scope and complexity of the things I need to do before it's too late.\n\ntldr if you feel you have it too easy and need to make your life really hard just start a business, pick something hard and regulated if you really enjoy unnecessary pain."}, {"id": 50670294, "au": "6thbit", "dom": 84, "sr": 15, "sc": 6.17, "ep": 6.17, "bs": 0.0, "d": 0, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 224, "qw": 0, "k": 1165, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": ["https://philosophybreak.com/articles/how-to-set-better-new-years-resolutions-focus-on-processes-not-outcomes/"], "ig": 1.435, "fa": 0.62, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "If you, like OP, feel \"no sense of achievement\", that because you \"haven't taxed\" yourself doing \"hard work\" you \"don't deserve the nice\" things:  You must be smart, accomplished, self aware and very critical of yourself from a young age.\n\nI bet, being like that, you've already encountered this before. You already achieved multiple goals, things that people wouldn't even dare to attempt, and your own success convinced you that you were here only to achieve more and harder goals -- But you've been down there, Neo, you know that road, you know exactly where it ends (burnout), and I know that's not where you want to be.\n\nGood news you'll probably hate: You don't have to achieve things, or work your ass off to deserve the best in life and enjoy it fully.\n\nBut think back of those times and how you felt, no, not on the finish line but while on the way, your focus, your excitement, awe, how your eyes sparkled understanding something new, when that thing you were crafting began taking shape. I can guarantee you actually enjoyed a lot more than the dopamine at the end.\n\nMaybe it's time for you to take on a different type of goals (Atelic [0]) and heal a bit that relationship with the finish line that could be blinding you from enjoying the processes that make you feel alive.\n\n[0] - https://philosophybreak.com/articles/how-to-set-better-new-y..."}, {"id": 50670220, "au": "andai", "dom": 135, "sr": 16, "sc": 5.81, "ep": 5.81, "bs": 0.0, "d": 0, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 100, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": ["https://notrelated.xyz/\u002301.05"], "ig": 1.338, "fa": 0.62, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "\"Man has achieved his present position by being the most aggressive and enterprising creature on earth. And now he has created a comfortable civilization, he faces an unexpected problem... The comfortable life lowers man's resistance, so that he sinks into an unheroic sloth... The comfortable life causes spiritual decay.\"\n\n~ Colin Wilson\n\nOne has a duty to fight this decay, wherever it rears its head! This is why I always make a point of walking not to the nearest McDonald'd, but to the one that is slightly farther away :)\n\nSee also: autodomestication; the agricultural revolution and its consequences have been a disaster for the human race.\n\nhttps://notrelated.xyz/\u002301.05"}, {"id": 50670514, "au": "ben_w", "dom": 79, "sr": 17, "sc": 5.66, "ep": 5.66, "bs": 0.0, "d": 0, "age": 0.6, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 27, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.57, "fa": 0.42, "gp": 0.533, "bl": 0.0, "ds": 0.0, "txt": "> Can anyone out there in the Soapbox hivemind share some advice on how to fix this? Or your own thoughts on it? I can't be the only one...\n\nPeople stay fit in body with sports they enjoy. Sports aren't necessary: scoring a goal doesn't put food on your plate nor (except at the top level) pay bills, it's just fun.\n\nIf you don't want your brain to atrophy in a world that has no more need for it than it has for your muscles, exercise it. Do puzzle games. Learn another language (or five). See if, like the Primitive Technology guy, you can figure out how to make an iron knife starting with only a pair of shorts to wear and a small plot of land with trees and a river on it. Write a book, and try to figure out how to convince someone else to read it."}, {"id": 50669980, "au": "belval", "dom": 67, "sr": 18, "sc": 5.64, "ep": 5.78, "bs": 0.0, "d": 2, "age": 1.38, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 9, "k": 8194, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.447, "fa": 0.42, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "> I'm still scared that the cons out weigh the pros.\n\nSo am I to be clear, but it is obvious from the level of mental effort I am feeling and greatly increased work output that my brain is not \"on a break\". It just got better at context switching across multiple projects and managing agents.\n\nWhat's unfortunate is that software engineer was for the most part a \"cheap\" endeavor. You never needed a 100$ subscription to make it work, I could hack on a ray tracing engine for fun for free. Today it becomes more like other disciplines that require some investment (in tokens) and I don't quite know how I feel about that."}, {"id": 50670451, "au": "delichon", "dom": 96, "sr": 19, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 0, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 10, "k": 11774, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.406, "fa": 0.42, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "> I think I'm getting dumber every time I outsource my thinking to AI.\n\nBe calm, this is a normal feeling upon transitioning to management. Many of us go through it. You are metamorphosing from a doer to a wrangler of doers. You now interact with reality through a collection of waldoes, and it takes time to recalibrate your senses, reflexes and values. Give yourself time to adapt and everything will be ok. Breath."}, {"id": 50670098, "au": "latentsea", "dom": 76, "sr": 20, "sc": 5.26, "ep": 8.46, "bs": 3.05, "d": 1, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 257, "qw": 7, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.981, "fa": 0.9, "gp": 0.853, "bl": 1.15, "ds": 0.0, "txt": ">1. YOU CAN DO SOMETHING ABOUT EXISTENTIAL RISK!!!\n\nI semi-agree. Like I think we're completely fucked if I'm honest but my p(doom) isn't 1 and for a multitude of reasons, but here's my conundrum:\n\n1) the distribution of AI clearly follows a power law\n\n2) power laws are part of the governing dynamics of nature and show up everywhere\n\n3) power laws seem to be inherently tied to phase transitions\n\n4) phase transitions can be... really... really... bad, and they show up incredibly suddenly.\n\n5) from a control-theoretic perspective, if you look at humanities collective efforts to steer the behavior of the global population on tasks like climate change, or the COVID-19 response, you'll sort of notice that north of a certain degree of complexity, humanity basically just doesn't have enough control bandwidth to effectively do it.\n\n6) the complexity of AI/AGI absolutely dwarfs climate-change and COVID-19, and the speed and magnitude of the phase transition will most definitely exceed our control bandwidth.\n\n7) we're fucked unless we get some sort of black swan that stops us in our tracks BEFORE it's too late. Like some sort of very noticeable warning shot across the bow of humanity that updates everyones priors robustly enough that everyone goes... ok, yup, no, I get it now.\n\nEdit: my \"we can still do something about this\" mindset kinda comes from some pretty crazy and exceptionally il"}, {"id": 50669863, "au": "ConcernedCoder", "dom": 142, "sr": 21, "sc": 5.23, "ep": 5.23, "bs": 0.0, "d": 0, "age": 1.54, "grav": 9.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 618, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.442, "fa": 0.34, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "Progress comes quickly and your ability to adapt your workload should be your focus as you get better and better tooling.\n\nCompare with something like farming ( in amounts that 1 human can handle alone ) which went from hand plowing/planting/harvesting maybe 1 acre or less, to livestock-assisted 10 acres or so, to machinery assisted 100 acres or more..."}, {"id": 50670825, "au": "scruple", "dom": 27, "sr": 22, "sc": 5.1, "ep": 5.47, "bs": 0.0, "d": 10, "age": 0.07, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 4038, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.571, "fa": 0.34, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "Of course it will have problems, too. But the hand-written code is written line by line, it isn't dumped out at light speed. Most of my colleagues are extremely competent and don't misuse our internal libraries the way LLMs do, even when we give the LLMs comprehensive documentation and context and it can see adjacent funcs and methods literally using these same primitives. It still completely fucks them up. It writes code like it's targeting an alien codebase and makes really, really stupid but easy to miss mistakes when they're buried inside of a +13,500/-129 line of code diff. Including multiple passes by \"AI\" reviewers."}, {"id": 50669658, "au": "doctoboggan", "dom": 45, "sr": 23, "sc": 4.9, "ep": 5.12, "bs": 0.0, "d": 0, "age": 1.78, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 7296, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.142, "fa": 0.28, "gp": 1.13, "bl": 0.0, "ds": 0.0, "txt": "I don't know if this is good advice as the world is moving so fast, but I am still able to get those good \"I accomplished something\" chemicals by being much more ambitious in the tasks I take on with AI.\n\nFor example, I have a side business selling jewelry on the internet. Every week, I get a batch of rings from my casting house. I weigh them, measure the size and width, and take a photo or two. Recently with Claude fable 5.2 I tasked it with building me a contraption to do all of this with one click and get it into my database. We worked back on forth and came up with a design that I should be able to assemble and test soon. This is something I could have designed and built over many many days/weeks of work, but instead it took 1.\n\nMaybe I am \"lucky\" that I get feelings of accomplishment from that and maybe I shouldn't actually feel accomplished. But I am getting a genuinely useful device and having fun along the way so I think its alright."}, {"id": 50669748, "au": "json_hero", "dom": 102, "sr": 24, "sc": 4.73, "ep": 5.1, "bs": 0.0, "d": 2, "age": 1.68, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.442, "fa": 0.34, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "At my company I had to spend a few months advocating for the change to this kind of workflow, but I finally pushed through and got us to prototype with it a bit, and we now use it fulltime (it helps if you just blabber about buzz words like \"Software Factory\" to higher ups). It's been wildly successful in terms of being able to get the entire team to have a shared idea of where we're guiding the agents, everyone collaborates on a plan by bringing their own expertise. The plan is transparent to the entire team and there's a breadcrumb for everything that will be done by the agent. Try it out, it's 100% worth it."}, {"id": 50670315, "au": "trashcan_man", "dom": 35, "sr": 25, "sc": 4.71, "ep": 5.45, "bs": 0.0, "d": 2, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.811, "fa": 0.0, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "That's a lot of assumptions to attack and get snarky about. I doubt I can breathe a sense of generous optimism into the conversation, but I would like to gently recommend a little more grace when dealing with strangers. Otherwise, \"just f-d\" might be a self-fulfilling prophecy.\n\nI can tell you with tragic certainty that I am not close to retirement and I care very much. I'm below the average working age. I'm not rich, I'm not without troubles, I'm not \"set\", and I don't have it made. If I lose my job I will have to throw myself to the wolves and recalibrate all the sacrifices I currently make to put food on the table for decades.\n\nTo address the question: I would recommend that young people minimize debt, have strong relationships with older people who are secure in their lives, and seek to create the least expensive bare minimum life that work augments rather than doing what I did trying to keep up with the Joneses. The historical notion of \"a career\" has been on the decline for longer than I've been alive. We're at the logical conclusion of compounding technological forces shaping human society - don't snap at me because it's confusing and scary.\n\nOwn a few nice things, don't pay for convenience subscriptions, focus on acquiring the cheapest stable domicile you can get by in, shop at Aldi, and make good friends."}, {"id": 50670095, "au": "bitexploder", "dom": 3, "sr": 26, "sc": 4.39, "ep": 5.27, "bs": 0.0, "d": 1, "age": 1.23, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 257, "qw": 0, "k": 7559, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.758, "fa": 0.0, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "I have learned so much in the last year. My programming skills have atrophied. I do not write code for professional work at all now. It is not a good use of my time. What had replaced it?\n\nWhat have I been learning? Statistics. LLM math and how they are built from first principles. How to build reliable distributed agentic systems. How to build trustworthy agent tools in adversarial workflows and prevent agent cheating, building sandboxes and systems that constrain and force agent behavior. How to hill climb agents without over fitting. How to ask good questions about what are the goals of a system to begin with. Lean, TLA+, and Bend — formal modeling tools and how and where agents are good with them now. How to adversarially test and harden systems I built without ever looking at the code. How to measure behavior. A sense of how and what agents build and where I know they will cheat or be lazy if I let them. How to run multiple projects that achieve real outcomes with all of the above. I am a better security engineer now and if you took LLMs away from me tomorrow I would still be a better security engineer. I have gotten to iterate so many different problems and potential ways of approaching them. I have made problems that I previously assumed were impossibly large. shrink to something I can solve on a single computer. I could never have done that without all of the discipline"}, {"id": 50669642, "au": "bongofizzbuzz", "dom": 145, "sr": 27, "sc": 4.21, "ep": 4.43, "bs": 0.0, "d": 0, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 18, "k": 20, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.188, "fa": 0.42, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "> the threat of increasing hacks that could melt down the global economy or trigger nuclear Armageddon is terrifying.\n\nAssuming most of the HNers here are highly technical and work at prestigious companies, imagine instead of hug of death for the website, we have reverse version where hug of getting hacked by a 0-day which works on all platforms. Pretty scary to think about."}, {"id": 50670035, "au": "sdevonoes", "dom": 138, "sr": 28, "sc": 4.01, "ep": 4.45, "bs": 0.0, "d": 0, "age": 1.31, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 2220, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.366, "fa": 0.28, "gp": 0.304, "bl": 0.0, "ds": 0.0, "txt": "Im not scared of AI per se, but of the corporations behind them. I don’t trust them. I dont like them. They are this close to govern our digital lifes (and therefore much of our life) the exact way they want.\n\nThey will publish nice stuff here and there (e.g., math proofs) to show how good they are for humanity, but that’s just pure theatre. Their agenda is not for the advancement of humanity (yeah, I know they are a company and so they only care about profit. Fine. I don’t care about other companies, but when one becomes this big and with this much power, then hell I do care)"}, {"id": 50670140, "au": "andrew_eu", "dom": 131, "sr": 29, "sc": 3.85, "ep": 4.51, "bs": 0.0, "d": 0, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 418, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.609, "fa": 0.0, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "I think it's rather obvious at this point that the people who are able to achieve the most with AI are people who already had expertise in what they are trying to achieve. Not everyone with AI can write great software, but good developers with AI can write tons of good software. Not everyone with AI can generate mathematical insights, but trained mathematicians are making enormous progress.\n\nI believe there is a much more worrisome corollary to this: using AI is a massive impediment to learning. I don't know if I share the author's feeling of \"getting dumber\" with using AI, but I am absolutely not getting smarter. Sure, it's still possible to do research, to challenge your mind and integrate new concepts, to develop knowledge -- but the world does not incentivize this. Learning is becoming a hobby. The economic system most of us find ourselves in does not encourage nurturing such hobbies.\n\nI worry very much about the impact this has on young people, and by extension the society they will (hopefully) become the stewards of."}, {"id": 50669652, "au": "json_hero", "dom": 98, "sr": 30, "sc": 3.82, "ep": 4.56, "bs": 0.0, "d": 0, "age": 1.79, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.857, "bl": 0.0, "ds": 0.0, "txt": "How does this person use AI? I think that would be a lot more interesting than just sharing the fear side of it.\n\nIf you're just \"meat proxying\" and pressing \"yes\" to every agent turn, then yeah, you're probably losing brain cells.\n\nYou shouldn't be needing to do that anymore, focus your time on planning and actual long horizon thought. Use projects like openspec, spend a couple hours planning out large features going back and forth with the agent, try to learn and expand your knowledge with it, you'll get that spark of accomplishment back."}, {"id": 50669795, "au": "adverbly", "dom": 124, "sr": 31, "sc": 3.68, "ep": 4.34, "bs": 0.0, "d": 0, "age": 1.64, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2854, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.233, "fa": 0.28, "gp": 0.445, "bl": 0.0, "ds": 0.0, "txt": "I get this with \"checklist\" tasks where the TODO item is one where quality is simply measured as \"done or not\".\n\nBut for things where quality involves taste, creativity, unbounded possible end quality: Those tasks, I still get the high working with AI so long as I'm actually engaged in what I'm doing.\n\nOne hopes that this moves in a direction where we can spend less time on the former and more on the latter - but that's by no means guaranteed! There is work to do!"}, {"id": 50669882, "au": "skerit", "dom": 46, "sr": 32, "sc": 3.66, "ep": 4.47, "bs": 0.0, "d": 1, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 22, "k": 1356, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.168, "fa": 0.42, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "> I am still able to get those good \"I accomplished something\" chemicals by being much more ambitious in the tasks I take on with AI\n\nI had such a big backlog of things (software projects) I wanted to make, but never got around to because everything took so much time. So many projects I started to work on, but then had to stop after a few weeks because I realized it would take SO much time I didn't have to get it usable.\n\nI'm now finally able to actually get those projects done. It still takes time, It's not a weekend-thing at all, but it is progressing. And I'm super happy with everything I'm making, even if I didn't write every line. It's still my idea turned into reality."}, {"id": 50670452, "au": "LelouBil", "dom": 154, "sr": 33, "sc": 3.41, "ep": 4.07, "bs": 0.0, "d": 0, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2247, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.591, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "What worked for me is to almost never let an agent edit my working copy of a project, however, to regularly prompt it for review, or to implement something I want in a scratch copy that I then use as a reference.\n\nIt's almost like working pre-AI, except I always have very relevant documentation available, or an especially relevant mentor.\n\nFor chat usage, I treat it like a search engine, to spend less time looking for what I want, but when it answers I go read the primary source, unless it's something I already knew and it just reminded me of it\n\nI've been getting happier with AI usage in this way."}, {"id": 50670377, "au": "m3kw9", "dom": 163, "sr": 34, "sc": 3.4, "ep": 3.84, "bs": 0.0, "d": 0, "age": 0.81, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 3504, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.188, "fa": 0.28, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "Dumber is a relative term and very hard to gauge, unlike like speed(I'm faster, slower than before).  If you are operating in the real world and socialize, you will use a lot of your brain without knowing.  You may be \"dumber\" in the skill like hand coding, but you are not dumber in the skill that needs to do software properly for example."}, {"id": 50670150, "au": "augment_me", "dom": 86, "sr": 35, "sc": 3.34, "ep": 4.22, "bs": 0.0, "d": 0, "age": 1.16, "grav": 7.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 215, "qw": 0, "k": 1479, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.606, "fa": 0.0, "gp": 0.311, "bl": 0.0, "ds": 0.0, "txt": "From what I have seen this is more related to a curiosity-based personality trait.\n\nI am working with people who have built massive projects, like a custom compiler for a new accelerator with LLMs in 3 months, and they understand absolutely everything about the solutions and trade-offs made. They have had deep discussions, design trade-off talks with the models, abstraction discussions. If you ask them why something does not work, they can answer you on the spot, because they are curious about the solution, and have talked over this with the LLMs, they can question and motivate their choices. How was this done? FULL attention, questioning, reviewing, steering, thinking, benchmarking, debugging, hours spent fighting the biases of the LLMs to get to the truth of things. This in itself is hard work, that is unnecessary if you only care about the end result.\n\nWould an LLM-only fully vibecoded custom-compiler made in 1 month instead of 3 be up to a similar performance? Probably. Would you personally learn less about the project and the trade-offs in this case? Most likely. Would you learn more from the project if you built it yourself from scratch in 6 months? Most likely.\n\nSo somewhere we are trading off/amortizing our understanding of things based on our curiosity and the reality of the job market and expectations set on us."}, {"id": 50669696, "au": "pbjerkeseth", "dom": 121, "sr": 36, "sc": 3.2, "ep": 4.23, "bs": 0.0, "d": 0, "age": 1.74, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 49, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.608, "fa": 0.0, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "Why do the various current forms of ai delegation create this feeling? I'm  confident its addressable as a UX problem, and I already know it's a fun problem to work on.\n\nPerson based organizational structures aren't a perfect analogy for agent assisted work or orchestration, but I've never heard of an executive describe this problem (at least not over the more common feelings of 'loss of control') in the context of working through others.\n\nIt's a good time to invest in better patterns of work that reward your personal attention."}, {"id": 50670063, "au": "nialv7", "dom": 136, "sr": 37, "sc": 3.15, "ep": 4.03, "bs": 0.0, "d": 0, "age": 1.27, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 15, "k": 2676, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 0.976, "fa": 0.42, "gp": 0.37, "bl": 0.0, "ds": 0.0, "txt": "> I read this last week: ... which explains what I mean far better than I can (because I'm stupider now).\n\nif you are worried about not using your brain making you dumber, then why won't you take any opportunity available to exercise it? like if you think you can't explain it well now, you are gonna just be like \"oh i'm dumb now, it can't be helped, there is nothing i can do, just read this someone else has written\"?? that's defeatist. why don't you try explaining it in your own words and use your brain a bit?"}, {"id": 50669720, "au": "andOlga", "dom": 89, "sr": 38, "sc": 3.13, "ep": 4.01, "bs": 0.0, "d": 0, "age": 1.72, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 63, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.517, "fa": 0.0, "gp": 0.306, "bl": 0.0, "ds": 0.0, "txt": "I think a huge chunk of the desire to \"outsource thinking\" comes from not enjoying the process -- and for many people, some forms of thinking are their job, so inherently not very enjoyable. I don't really want to dig through my company's codebase by hand and I'm glad not to do it for now. I do want to write my tiny games, tools, posts and other stuff that exists in my personal life by hand, because the actual process of creation is enjoyable there. Let it take months -- those are months spent having fun!\n\nSo the answer to the question TFA poses is... find some thinking you enjoy actually doing, rather than just enjoying the results of it.\n\n(unrelated sidenote: what a cute concept for a website. lovely.)"}, {"id": 50670060, "au": "itslennysfault", "dom": 115, "sr": 39, "sc": 3.05, "ep": 3.71, "bs": 0.0, "d": 0, "age": 1.27, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1782, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "I've been thinking the exact same thing lately. I've always known that I became a programmer/hacker because I'm (a certain type of) lazy. When I know there is a way to automate something, I do. The fact that LLMs allow me to automate a bunch of thinking and A LOT of tedious typing means I will do that and in the process those muscles will atrophy.\n\nIt's actually been making me consider re-enrolling in school just to force myself to brain. Not sure what subject, likely something far removed from tech."}, {"id": 50670571, "au": "idiotsecant", "dom": 6, "sr": 40, "sc": 3.03, "ep": 4.57, "bs": 0.0, "d": 2, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 8706, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.405, "fa": 0.34, "gp": 0.207, "bl": 0.0, "ds": 0.0, "txt": "Yes: it is time to learn the hard lesson that the brief period of time where writing software as a skill unto itself was super valuable was very weird and very short.\n\nBeing able to understand the code enough to make decent architectural choices will probably be valuable for quite a while, but the time of making a top 1% income by copy pasting stack overflow is well and truly dead.\n\nWe all need to go back to actually doing things with the real world again, and not just playing with abstraction."}, {"id": 50670102, "au": "recallingmemory", "dom": 158, "sr": 41, "sc": 2.94, "ep": 4.04, "bs": 0.0, "d": 0, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 142, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.598, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "This is just misuse of AI. AI does not replace my thinking or more importantly, my UNDERSTANDING of whatever it is I'm doing. I only give it room to deepen my understanding, and to explain itself any time it enters into territory I don't understand.\n\nTo allow it to work in spaces you don't fully understand is like what happens when non-software developers create AI slop websites. Congrats, you spun up a website but it's shit. It's like people who do not understand photography generating images.\n\nThe UNDERSTANDING allows for quality work to be produced alongside AI. Start by understanding a topic, then allow AI to strengthen your understanding of that topic, then utilize AI to produce quality work under your supervision based on that understanding."}, {"id": 50670109, "au": "k9294", "dom": 95, "sr": 42, "sc": 2.79, "ep": 3.89, "bs": 0.0, "d": 0, "age": 1.21, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 287, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.517, "fa": 0.0, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "I do have feelings of accomplishment and I think this is even worse than not having them when working with ai.\n\nI think problem-solving is something very natural and rewarding for humans and when I promt AI and get the result I wanted I denfently feel like “I” did the job or at least I'm responsible for the result and it feels good.\n\nI noticed that AI creates some kind of addiction because of this - it just feels good to promt ai and make something cool, maybe side project, automation, etc. When I have spare time I started noticing that I'm inclined to think of something I can work on with ai.\n\nI bet AI is like Facebook in terms of hijacking brain wiring and evolutionary pathways. (there were no studies on the matter last time I checked, but I'm pretty sure there will be)\n\nI wouldn't be surprised that in a few years it will become both a kind of entertainment and addiction - artificial problem solving and building stuff nobody needs including you."}, {"id": 50669922, "au": "t43562", "dom": 141, "sr": 43, "sc": 2.76, "ep": 3.64, "bs": 0.0, "d": 0, "age": 1.47, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 2851, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.128, "fa": 0.22, "gp": 0.25, "bl": 0.0, "ds": 0.0, "txt": "It depends on what you're pressured to do.\n\nIf you want to keep thinking then do some of the work yourself even if it's slower. I think that it's worthwhile to rough out an idea by hand as a kind of exact prompt.\n\nAlternately decide the kinds of things that bore you and make the AI do them and keep the interesting bits for you.\n\nIf you can't afford to do that because of pressure then congratulations, you've become a manager. :-)  Home projects are all that's left."}, {"id": 50669858, "au": "jmathai", "dom": 65, "sr": 44, "sc": 2.76, "ep": 4.15, "bs": 0.0, "d": 1, "age": 1.54, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 5717, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.413, "fa": 0.0, "gp": 0.574, "bl": 0.0, "ds": 0.0, "txt": "I had this conversation yesterday with a friend. While I do feel that my brain is atrophying, I'm definitely learning some things which I otherwise would not have.\n\nHere is my example:\n\nI've build an iOS and Android app that's been in the app stores. I have programming experience but none in Swift or Java. I'm not really learning those languages through my use of AI - in part because I don't care to and don't need to. But I am learning about how the app stores work, app store optimization, etc. I'm also learning about how vector databases work and LLMs use tool calls - because I am interested in learning more about that.\n\nIt's sort of like a choose your own adventure.\n\nI would not be learning about these things otherwise because I'd not be in a spot where they'd be natural topics for me to learn.\n\nI'm still scared that the cons out weigh the pros. But I'm not really sure what alternate options exist."}, {"id": 50670202, "au": "phil21", "dom": 50, "sr": 45, "sc": 2.7, "ep": 4.1, "bs": 0.0, "d": 2, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 7433, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.581, "fa": 0.0, "gp": 0.263, "bl": 0.0, "ds": 0.0, "txt": "Sort of the opposite for me. Due to the way my brain seems to work, I often found myself \"catching up\" with work after dinner or a few late night hacking sessions to crunch-time things in at the last minute. With LLMs I am far more effective in my daily regular hours period. I can fire off a task in between meetings and still actually get deliverables out the door even with interruptions!\n\nThis has let me do things like start spending an hour each night reading before bed and not feeling guilty about it. Huge benefits to my sleep and mental health.\n\nIt's not universal of course. Some weeks I'm still late night hacking, but usually on a much more ambitious project or side quest than before."}, {"id": 50670116, "au": "Scea91", "dom": 116, "sr": 46, "sc": 2.66, "ep": 3.76, "bs": 0.0, "d": 0, "age": 1.2, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1007, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.454, "fa": 0.0, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "What really helps, and I am not always achieving that, is if the motivation is internal and not tied to competition or external position against others.\n\nJust today, I was feeling the exact opposite of the author’s take as I reserve Fridays for my learning and curiosity. I marveled at how great tutor AI is, and I am perfectly happy that the topics I studied are considered basic/intermediate by experts in their fields. The fact that I learned something new is all that mattered."}, {"id": 50669941, "au": "mcv", "dom": 61, "sr": 47, "sc": 2.65, "ep": 3.75, "bs": 0.0, "d": 0, "age": 1.45, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 27405, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.195, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "I think this is by far the biggest pitfall of AI: you outsource your thinking, resulting in less understanding of your work, a broken mental model of the code, but also less exercise for your brain.\n\nI've noticed this fog when I started using AI for coding. I still use it, but I try to avoid outsourcing all the thinking. I still want to understand what I'm doing. It's rarely good enough, but not as bad as it used to be. And I look for other things to exercise my brain."}, {"id": 50670800, "au": "trilogic", "dom": 128, "sr": 48, "sc": 2.64, "ep": 3.74, "bs": 0.0, "d": 0, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 44, "k": 197, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.014, "fa": 0.42, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": ">I'm getting dumber every time I outsource my thinking to AI. Everything now takes less effort which sounds great, but there's no sense of achievement from it.\n\nUse AI as the amazing tool that it is, not as a brain that it is not. Is like having a colleague assign to help you but at the end each has its own personality no matter how intelligent. I guess only you can think with your Brain and see with your eyes (for now).\n\n>I haven't taxed myself and I don't deserve the nice chemicals my brain would normally make if I completed some hard work,\n\nWhat are you a slave, this type of thinking is scary, don´t you have some passions pleasure to enjoy working smart not hard?"}, {"id": 50670774, "au": "discreteevent", "dom": 24, "sr": 49, "sc": 2.6, "ep": 4.14, "bs": 0.0, "d": 8, "age": 0.17, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 8, "k": 3670, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 0.791, "fa": 0.7, "gp": 0.198, "bl": 0.0, "ds": 0.0, "txt": "> You don't need to read the code anymore.\n\nIt's now absolutely clear to me that anyone who says this is definitely not using LLMs to write software of even medium size and complexity that is used by real people to do everyday tasks."}, {"id": 50670007, "au": "pcunite", "dom": 174, "sr": 50, "sc": 2.6, "ep": 3.7, "bs": 0.0, "d": 0, "age": 1.35, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 1145, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.504, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "What helps me understand Ai is to think about owning a gym.\n\nAs owner, I need to plan and track weight movement everyday. I can hire staff or acquire customers to do the work. At the end of the day, I verify how many weights were moved, and for how long.\n\nNow, back to Ai. What are you using Ai for? For personal growth? For fulfillment? For joy? For learning? For happiness?\n\nWhen you see Ai for what it really is, a fully automated hammer to drives nails or move weights around, well yeah, it could potentially take fun, learning, and benefits away. While Ai takes away the task, it gives you back time.\n\nWhat you do with that time, is up to you. Now, go lift some weights!"}, {"id": 50669646, "au": "doitLP", "dom": 160, "sr": 51, "sc": 2.54, "ep": 3.64, "bs": 0.0, "d": 0, "age": 1.8, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 37, "qw": 0, "k": 2904, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": ["https://mapwriting.substack.com/p/the-joy-of-contrivance"], "ig": 0.647, "fa": 0.62, "gp": 0.244, "bl": 0.0, "ds": 0.0, "txt": "This was a similar take https://mapwriting.substack.com/p/the-joy-of-contrivance\n\nSeems like gyms that replaced physical exercise, we’ll need to do the same for our minds. Deliberately selecting what to toil on even though there’s an easier way.\n\nUnfortunately most people won’t."}, {"id": 50669971, "au": "dollylambda", "dom": 85, "sr": 52, "sc": 2.54, "ep": 3.64, "bs": 0.0, "d": 0, "age": 1.41, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 24, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.382, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "No, you're not alone.  I think about AI these days the way I think about walking places.  Like yes, it's more healthy to get some exercise and walk, but if I'm going to go cross-country, I'll probably take some locomotion that isn't my own.\n\nI've not used AI much, because I'm currently a hobbyist programmer, and so getting results fast just isn't as important as learning.  However, I see open source projects who create PRs that are like 10k lines, and I think I would prefer the AI to do that kind of work.  OTOH, I do wonder if people are now just ignoring creating new abstractions and frameworks that otherwise make the programmers life better, simply because for vibe coding it's all the same."}, {"id": 50669992, "au": "Kuyawa", "dom": 156, "sr": 53, "sc": 2.49, "ep": 3.59, "bs": 0.0, "d": 0, "age": 1.36, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.381, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "AI will hack and AI will protect. It is not a one way attacking arrow, it is a constant loop of improvement. A few will lose their savings, their jobs, even a few may die due to AI miscalculation (like tesla self driving?) but rest assured AI will correct itself, will improve defensive shields, will care more about human safety\n\nSo no, there is nothing, absolutely nothing to be scared about. And your brain? Use it to think, that's what's good for, not to feed it with endless fearmongering"}, {"id": 50670725, "au": "ant6n", "dom": 62, "sr": 54, "sc": 2.43, "ep": 3.68, "bs": 0.0, "d": 1, "age": 0.24, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 4526, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.565, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When I do writing and business development with AI, I keep getting annoyed how fucking dumb and nerfed even the smartest models seem to be. They are so lazy, and just don't do what I ask them.\n\nThese models are supposedly so smart, they solve the hardest math problems. And often, they have surprising insight. But they cannot even write an e-mail to a third person without separating what the bot knows, what the human knows and what the third person knows. Every time they write an e-mail (even Astra), it is written without any context introduction, effectively referring to a conversation that the addressed person doesn't know about. It's just bizarre."}, {"id": 50670130, "au": "xpct", "dom": 75, "sr": 55, "sc": 2.42, "ep": 3.81, "bs": 0.0, "d": 1, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 806, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.483, "fa": 0.0, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "I don't think \"being more ambitious\" or working on \"bigger\" problems is necessarily more intellectually stimulating, or should at least differ by person. If someone enjoyed reverse engineering old games, what makes it stimulating to have Claude reverse engineer 20 of them?\n\nIs it integrating more third parties to your app that makes it stimulating? Or is it experimenting with a different architecture for a new OS? To a point it's less of a difficult architectural design problem if iteration speed is that much faster."}, {"id": 50670324, "au": "GauntletWizard", "dom": 68, "sr": 56, "sc": 2.42, "ep": 3.85, "bs": 0.0, "d": 1, "age": 0.89, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 3947, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.637, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hard disagree. The fiddly bits still matter, and Claude's abstraction over them is viewing the paint from across the room when there's obvious cracks up close.\n\nClaude is great at painting broad strokes, but in my experience it leaves huge cracks in the fine details and I end up spending more time detailing where the paint has cracked than I spent when doing it right the first time.\n\nWhich is not to say there's not places it is useful - you can have it paint broad strokes in some areas, and careful use in testing can reveal real weaknesses and cracks that I missed at first glance, but I also find the false positive rate high."}, {"id": 50670097, "au": "fzeroracer", "dom": 18, "sr": 57, "sc": 2.42, "ep": 4.69, "bs": 0.85, "d": 6, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 4208, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "books_spend", "flbl": "Books & Spend (Companies)", "urls": [], "ig": 1.344, "fa": 0.28, "gp": 0.506, "bl": 0.32, "ds": 0.0, "txt": "The devil is always in the details, the fact that we surrender certain complexities to larger entities does not mean we should fully surrender. That's how you get things like lead in toothpaste when no one knows or cares about the details.\n\nThe book analogy is apt because it's about applying to your specific domain of expertise. How can you say you know how your codebase works if you've only dealt with a summary? How do you know an algorithm works as intended if you don't understand how?\n\nIn a way this new attitude towards coding reminds me of people who don't care how a sorting algorithm works and simply looks at the time complexity."}, {"id": 50669723, "au": "webdood90", "dom": 101, "sr": 58, "sc": 2.42, "ep": 3.78, "bs": 0.0, "d": 1, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 8, "k": 423, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.878, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> You shouldn't be needing to do that anymore\n\nThis is what the industry wants. The incentives have changed. Nobody is rewarded for building hard things - it's all about how fast you can deliver.\n\nGood for you, if that's not your situation. I'd argue it is for most folks."}, {"id": 50669887, "au": "ajasmin", "dom": 48, "sr": 59, "sc": 2.42, "ep": 3.77, "bs": 0.0, "d": 1, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 306, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "That mindset worries me. Sure AI can keep your brain awake, but it's these longer tracked efforts that are harder to come by.\n\nI feel like I'm loosing the ability to do long haul tasks like reading books or solving programming puzzles by hand in a new language."}, {"id": 50670234, "au": "silverFork", "dom": 43, "sr": 60, "sc": 2.42, "ep": 3.71, "bs": 0.0, "d": 2, "age": 1.02, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 250, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.086, "fa": 0.34, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "If you are younger, some believe that you can change your career but that is hard too.  Because the alternatives will acquire new attraction and become competitive. Is there a way out? Be first if you find a good alternative and dont wait too long as the line ups get longer.\n\nEverybody gets old and tech cycles change every 3 years.. surviving it requires adapting but that is not possible as windows close."}, {"id": 50670617, "au": "ewzimm", "dom": 4, "sr": 61, "sc": 2.42, "ep": 3.58, "bs": 0.0, "d": 2, "age": 0.42, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 195, "qw": 0, "k": 2295, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.404, "fa": 0.0, "gp": 0.196, "bl": 0.0, "ds": 0.0, "txt": "This is exactly the kind of thing using AI has helped me achieve, moving my thinking to larger and more interesting problems, but everyone is going to hit some kind of ceiling at some point at which the AI becomes better at all of these things than you, and probably everything you mentioned here and everything I could add are things that will be possible to automate in the next few years.\n\nTo help with that, I have my own little software factory turning out business applications, and I have several criteria for every app that it proposes, and one of them must be, \"what human labor does this free people to do?\" Every automation and time-saver must make a suggestion for what related activities people can spend their time on. It might not even get the right answer every time, but at least it starts the conversation and gets people thinking about what they could be doing. I think this kind of thought process is going to be necessary for all of us as automation proceeds.\n\nIn the end, we might just end up meditating and living peaceful lives in our gardens, but who knows what comes before that?"}, {"id": 50670625, "au": "Mabusto", "dom": 5, "sr": 62, "sc": 2.42, "ep": 3.45, "bs": 0.0, "d": 2, "age": 0.41, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 283, "qw": 0, "k": 117, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.469, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve been doing something similar. I no longer need to mentally exhaust myself with the minutiae of programming tasks the way I used to, so I can use that energy and time to further refine my skills and explore.\n\nI’ve getting an LLM to help me through ambitious projects that would have taken me months to do on my own. “I” built a vector database from scratch and an asynchronous run time last month, I didn’t care about most of the code, it was fun to try and take a stab at it, fail or get stuck, and then get the LLM to help me and explain how all of this works. It’s like trying to put together a car engine and having a mechanic looking over your shoulder. Very fun!\n\nI’ve also been going through a bunch of math textbooks, maybe some of the same as you, and doing my best to read through them and understand everything. It’s like going to the gym for me, I do an hour or so every day and some days I only get through a few pages, but it’s genuinely challenging and I get that “aha” moment that I don’t really get from programming anymore.\n\nI’ve kinda stopped reading these “AI IS GOING TO XYZ” blog posts. I had the same period of grief everyone else did back in September when these new super capable models came out, I’ve been programming for 20+ years and I will miss parts of it, but my drive was never typing code, it was understanding and building things. AI is just going to enhance you"}, {"id": 50669820, "au": "majorbugger", "dom": 70, "sr": 63, "sc": 2.42, "ep": 3.44, "bs": 0.0, "d": 0, "age": 1.59, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 122, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "The sense of achievement was long gone for me, even when writing stuff entirely by myself. So what if you delivered a feature if there is 10 more lined up, because the product is never finished? It's not like writing a book or building a bridge. Don't get me wrong, I do appreciate my job, I work with nice people and there is a \"no bs\" attitude. With AI I simply worry about getting dumber, but I think that can be countered by picking up some side projects, even if miniscule. Maybe learn a new programming language?"}, {"id": 50670273, "au": "nickfazzpdx", "dom": 60, "sr": 64, "sc": 2.42, "ep": 5.94, "bs": 2.52, "d": 0, "age": 0.97, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 243, "qw": 0, "k": 3, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "understand_code", "flbl": "Understand & Code (Programming)", "urls": [], "ig": 1.87, "fa": 0.28, "gp": 0.518, "bl": 0.95, "ds": 0.0, "txt": "Yeah, I'm scared too. See before AI we had good and bad software. Since AI it's just multiplied the amount of each. At work our contracted payroll software is still the same pile of trash. Gmail is still Gmail for whatever it's worth, they added an AI inbox. No one at work uses it.\n\nWhat scares me about AI is how people are socially responding to it. You see people waving away competency with the whole \"It's a new layer of abstraction where the programming language is natural language\". This is scary. Programming languages are a syntactic way to express computation. Using a programming language is hard because it forces you to define logical and computation structures that execute on the machine to solve a given problem. Writing \"ideas\" into a black box skips that unless the person already knows the logical and computational specification needed to some extent. Sometimes we don't and it emerges through experimentation or knowledge gathering. That's where innovation happens.\n\nAgentic coding is good for renaming across files - it's just better.\nAgentic coding is good for scaffolding CRUD controllers/endpoints.\nAgentic coding is good for handling build configurations.\nAgentic coding is good for doing tedious repetitive work that eats up our days.\nAgentic coding is good for prototyping.\n\nAgentic coding is good for those tasks if you understand them to begin with and know why to do "}, {"id": 50669818, "au": "rglover", "dom": 69, "sr": 65, "sc": 2.42, "ep": 3.4, "bs": 0.0, "d": 0, "age": 1.6, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 8801, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thinking_dumber", "flbl": "Thinking & Dumber (Cognitive)", "urls": [], "ig": 1.26, "fa": 0.0, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "This is why I do human-in-the-loop exclusively. I have noticed certain abilities atrophy, but overall, I'm not nearly as dull as I would have been had I gone all-in on a fully-agentic setup.\n\nAt some point, too, you have to turn inward and take responsibility. Once I snapped out of the \"but everyone is moving faster than me using AI\" by realizing \"no, they're not, they're just doing the same dumb shit they were, but faster, and at a greater scale,\" the 'fear' of all this died out."}, {"id": 50670667, "au": "simonw", "dom": 78, "sr": 66, "sc": 2.42, "ep": 3.32, "bs": 0.0, "d": 0, "age": 0.34, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 16, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 0.838, "fa": 0.42, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "> Everything now takes less effort which sounds great, but there's no sense of achievement from it.\n\nSo take on harder projects. If you use AI and still do the same stuff you were doing before you should worry about skill atrophy. I don't think that's true if you're using AI to help you achieve things that you weren't previously taking on due to their challenge and scale."}, {"id": 50670233, "au": "andai", "dom": 132, "sr": 67, "sc": 2.42, "ep": 3.29, "bs": 0.0, "d": 1, "age": 1.03, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_enjoy", "flbl": "Hard & Enjoy (Line)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "We have achieved, at last, our Digital Aristotle, but he's a terrible teacher and just does everything for you.\n\nThe most \"helpful\" assistant, apparently, is one whose user never needs to use his brain.\n\nOf course you can use them to accelerate learning. They're great for the Feynman technique, by the way. (Vaguely similar to the Socratic method.)\n\nBut that takes effort and discipline, two things that ChatGPT sure isn't going to force on you. It might be flexible with prompting, but I haven't found it very promptable in general."}, {"id": 50669844, "au": "gedy", "dom": 170, "sr": 68, "sc": 2.42, "ep": 3.27, "bs": 0.0, "d": 0, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5897, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brain_agent", "flbl": "Brain & Agent (Feel)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.261, "bl": 0.0, "ds": 0.0, "txt": "\"agentic\" AI with one shot asks makes my brain rot and have 0 understanding afterwards.  When I ute AI as a tool to
