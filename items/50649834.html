": 0, "tier": "epistemic_gold", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": ["https://aresluna.org/ui-style-guides/BlackBerry/BlackBerry%2010%20UI%20Guidelines%20%282015%29.pdf"], "ig": 0.839, "fa": 2.35, "gp": 1.546, "bl": 0.0, "ds": 0.0, "txt": "Despite the failure that eventually was BlackBerry 10, in terms of competition, I really liked reading this bit in the [UI guide](https://aresluna.org/ui-style-guides/BlackBerry/BlackBerry%2...):\n\n> Moments of charm  \n> Surprise, delight, and show we're human"}, {"id": 50660373, "au": "pndy", "dom": 53, "sr": 3, "sc": 9.29, "ep": 9.29, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 34, "qw": 0, "k": 2589, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": ["https://store.kde.org/u/seeas81", "https://store.kde.org/u/phob1an", "https://web.archive.org/web/20010616113550/http://developer.kde.org/documentation/library/index.html"], "ig": 0.808, "fa": 2.35, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "Maybe you did bumped on this already but if not: some global themes from https://store.kde.org/u/seeas81 and https://store.kde.org/u/phob1an are really good recreations of that 90s GUI aesthetics.\n\nAnd this is what I could find on KDE2 reference guides: https://web.archive.org/web/20010616113550/http://developer...."}, {"id": 50656557, "au": "g-b-r", "dom": 17, "sr": 4, "sc": 8.7, "ep": 8.7, "bs": 0.0, "d": 4, "age": 6.24, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 27, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "singular_gender", "flbl": "Singular & Gender (English)", "urls": ["https://web.archive.org/web/20260221175436/https://aceseditors.org/news/2020/singular-they-continues-to-be-the-focus-of-language-change"], "ig": 0.246, "fa": 2.35, "gp": 0.981, "bl": 0.0, "ds": 0.0, "txt": "https://web.archive.org/web/20260221175436/https://acesedito... says that even few years ago it wasn't fully accepted\n\nI don't know by what degree, it might well be that it's been widely recommended for very long"}, {"id": 50652583, "au": "agileAlligator", "dom": 84, "sr": 5, "sc": 8.35, "ep": 8.35, "bs": 0.0, "d": 0, "age": 14.49, "grav": 155.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 239, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": [], "ig": 1.61, "fa": 1.23, "gp": 0.732, "bl": 0.0, "ds": 0.0, "txt": "i showed this to my claude it said\n\n- Symbian Belle: its \"2012 PDF\" link points to Nokia/Symbian3 UI Style Guide (1.0, 2010).pdf, and its Internet Archive link goes to symbian-3-ui-style-guide. Those are the same two links as the Symbian³ entry directly above it.\n\n- webOS: the page itself contradicts the 1999 dates. The \"1999 website mirror\" link goes to a folder named Palm Design Guide (2011). The page also calls webOS the successor to Palm OS, whose guidelines it dates to 2003, so webOS guidelines can't come from 1999.\n\nas far as i can tell it is right on both counts"}, {"id": 50657578, "au": "DonHopkins", "dom": 61, "sr": 6, "sc": 7.1, "ep": 7.1, "bs": 0.0, "d": 1, "age": 4.47, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 173, "qw": 0, "k": 25710, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "widgets_buttons", "flbl": "Widgets & Buttons (Design)", "urls": ["https://donhopkins.com/home/catalog/images/tnt.gif", "https://donhopkins.medium.com/the-story-of-sun-microsystems-pizzatool-2a7992b4c797", "https://www.donhopkins.com/home/archive/NeWS/pizzatool.txt"], "ig": 1.963, "fa": 0.62, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "I wrote a bunch of Open Look design docs and widgets and plumbing in object oriented PostScript for The NeWS Toolkit.\n\nhttps://donhopkins.com/home/catalog/images/tnt.gif\n\nPizzaTool was essentially a TNT 2.0 developer code example showing how to use most of the Open Look widgets, with lots of comments. It also actually ordered pizzas from Tony and Albas if you were on the internal Sun network by emailing a PostScript file to the NeWSPrint FAX server. They made me took that out before shipping in SVR4.\n\nhttps://donhopkins.medium.com/the-story-of-sun-microsystems-...\n\nPostScript PizzaTool source code:\n\nhttps://www.donhopkins.com/home/archive/NeWS/pizzatool.txt\n\nAnd email about it including a FAX receipt:\n\nhttps://www.donhopkins.com/home/archive/NeWS/pizzatool-mail....\n\nI recently hung out with Ben Stoltz (who wrote the original XView DevGUIDE version of PizzaTool that inspired me to make a TNT version) and his wife in Amsterdam, and we went on an epic canal boat safari! We went by a pizza shop on the canal where you can phone in an order and pick your pizza up in a boat, but we already had lots of picnic food.\n\nTNT Open Look widget design documents:\n\nSliders:\n\nhttps://www.donhopkins.com/home/archive/NeWS/tnt-sliders-des...\n\nhttps://www.donhopkins.com/home/archive/NeWS/slider-design.t...\n\nGauges:\n\nhttps://www.donhopkins.com/home/archive/NeWS/tnt-gauges-desi...\n\nMultiple Framebuffer"}, {"id": 50653169, "au": "krstffr", "dom": 1, "sr": 7, "sc": 6.76, "ep": 7.13, "bs": 0.0, "d": 0, "age": 13.17, "grav": 133.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 557, "kpp": 14.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": [], "ig": 1.423, "fa": 0.34, "gp": 1.942, "bl": 0.0, "ds": 0.0, "txt": "For some reason I did not expect this from the first page of the Amiga style guide from 1991:\n\n\"English doesn’t have a good, genderless, third-person pronoun and it’s very awkward to avoid using one. So instead of just using the masculine throughout or alternating chapters with masculine / feminine / masculine /etc., we’ve changed genders at random. That way it best mimics reality where some of your users will be men and others will be women.\n\nIf you find yourself being startled by this shift - maybe you needed to be. No business can afford to alienate a customer by being unaware of her.\""}, {"id": 50654806, "au": "WillAdams", "dom": 54, "sr": 8, "sc": 6.21, "ep": 6.21, "bs": 0.0, "d": 0, "age": 9.23, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 5636, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "widgets_buttons", "flbl": "Widgets & Buttons (Design)", "urls": [], "ig": 1.575, "fa": 0.34, "gp": 1.062, "bl": 0.0, "ds": 0.0, "txt": "Very cool to see that PenPoint made it. I lucked into a trove of PenPoint stuff from a generous developer and actually made a bit of money selling the (multiple) looseleaf copies of the UI guide on Amazon ages ago --- it was one of my favourite UIs, and my using an NCR-3125 running PenPoint (w/ FutureWave Smartsketch for sketching) as a portable, and a NeXT Cube as my desktop represented my high-water-mark for enjoying computing and experiencing reliability."}, {"id": 50658152, "au": "ogurechny", "dom": 44, "sr": 9, "sc": 6.08, "ep": 6.08, "bs": 0.0, "d": 1, "age": 3.6, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 260, "qw": 0, "k": 1205, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "widgets_buttons", "flbl": "Widgets & Buttons (Design)", "urls": [], "ig": 2.013, "fa": 0.28, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "I should remind you that the moment it became possible to waste memory on useless decorative bitmaps, and cover the performance lag of non-native UI elements with free MHz provided by new processors, everyone was doing skins, or at least added some gimmick.\n\nLet's say, in the beginning, on Windows 3 systems, all the code that drew all the widgets for all GUI processes resided in a single memory segment in a system library. That way, almost all memory of the inactive processes that created background windows could be swapped to disk, and redrawing (portions of) them could be done just by relaying window messages to default system handlers that were always there. Menu and dialog resources were detached for the same reason of being independent from internal logic and data.\n\nSoon they made skinned multimedia players that looked like home stereo systems. Obviously, by that time multimedia-capable PCs had no problem handling extra work.\n\nIn the late '90s, bitmap-based skins like that (WinAMP 2.x, for example) became common, and usually worked fast enough, so people didn't care whether, say, buttons were native or from some custom component library. Then noticeably... laggy... HTML... and... template... based... UIs... appeared (WinAMP 5.x dynamic skins were not snappy at all; when some program had to load IE for an embedded frame, you also had to wait). Still, after a 10× increase in"}, {"id": 50651643, "au": "pigbearpig", "dom": 49, "sr": 10, "sc": 4.84, "ep": 5.28, "bs": 0.0, "d": 0, "age": 17.12, "grav": 202.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 872, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 1.403, "bl": 0.0, "ds": 0.0, "txt": "Palm WebOS was a great UI. It really made common tasks intuitive and the multi-tasking interface was well done.\n\nMetro (Windows Phone) was my favorite though. It had a great balance of information and style in my opinion. Having the app tiles flip to show notifications was quite  a nice time and tap saver.\n\nReally cool to know these guides are still available."}, {"id": 50658342, "au": "ogurechny", "dom": 26, "sr": 11, "sc": 4.68, "ep": 4.97, "bs": 0.0, "d": 1, "age": 3.28, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 0, "k": 1205, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "simple_little", "flbl": "Simple & Little (Understand)", "urls": ["https://en.wikipedia.org/wiki/Political_correctness"], "ig": 0.9, "fa": 0.96, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "Kids these days... It was published during the first wave of media frenzy over being way holier than their consumers. People arguing about “progressive” topics today often don't even understand that images in their heads have been drawn 40 years ago.\n\nhttps://en.wikipedia.org/wiki/Political_correctness"}, {"id": 50653568, "au": "stsch", "dom": 36, "sr": 12, "sc": 4.57, "ep": 4.57, "bs": 0.0, "d": 0, "age": 12.19, "grav": 118.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 16, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "simple_little", "flbl": "Simple & Little (Understand)", "urls": [], "ig": 1.323, "fa": 0.0, "gp": 1.004, "bl": 0.0, "ds": 0.0, "txt": "I so much enjoy the old graphical user interfaces. They had very little room and often not many colors available. The result was very simple, but easy to understand and use interfaces.\n\nPersonally I think designs should be simple (no gloss, gradients, blurry shadows) not extreme in colors nor shapes."}, {"id": 50652363, "au": "dofm", "dom": 56, "sr": 13, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 0, "age": 15.09, "grav": 165.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "simple_little", "flbl": "Simple & Little (Understand)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 1.138, "bl": 0.0, "ds": 0.0, "txt": "Nice to see Openlook. Very stylish UI; I still miss it.\n\nAnd right below it, Palm OS, which always felt to me like it had a strikingly similar elegant simple vibe, especially in 1-bit."}, {"id": 50657866, "au": "bobthepanda", "dom": 18, "sr": 14, "sc": 3.48, "ep": 3.92, "bs": 0.0, "d": 5, "age": 4.05, "grav": 25.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 16647, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "singular_gender", "flbl": "Singular & Gender (English)", "urls": [], "ig": 0.986, "fa": 0.28, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "Maybe in a professional writing context but not in, for example, a customer service context.\n\nOver the intercom, something like “Would the owner of a Toyota Rav4 please move their car” is pretty common"}, {"id": 50652373, "au": "dofm", "dom": 59, "sr": 15, "sc": 3.47, "ep": 3.62, "bs": 0.0, "d": 1, "age": 15.04, "grav": 164.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "devices_llm", "flbl": "Devices & LLM (Screen)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "I still remember how hilariously fun it was to write in XView, which had IIRC less than a dozen major C entry points. Nine, ten?\n\nI built a compiler as a project at university, and one day decided it needed a text editor/compiler/runner app where the error report jumped the cursor to the line with the syntax error.\n\nIt was basically an afternoon and evening's work; people were gobsmacked and I kept quiet about how easy it was."}, {"id": 50656450, "au": "skydhash", "dom": 43, "sr": 16, "sc": 3.42, "ep": 3.57, "bs": 0.0, "d": 3, "age": 6.42, "grav": 46.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "widgets_buttons", "flbl": "Widgets & Buttons (Design)", "urls": [], "ig": 1.519, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mostly because html allows to put the “click” behavior on anything. In most UI toolkits, adding click and showing different states is kinda a pain. So everyone use the default widgets with maybe a few tweaks.\n\nAlso in something like GTK or UIKit, all the components you may need is already there (barring a few special cases). HTML has only the widgets suited for forms (which it was designed for) but anything else is an exercise left to the reader. And the latter is leaned towards creative instead of usable."}, {"id": 50651071, "au": "TehShrike", "dom": 48, "sr": 17, "sc": 3.38, "ep": 4.04, "bs": 0.0, "d": 0, "age": 18.67, "grav": 233.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1439, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "style_guide", "flbl": "Style & Guide (Webos)", "urls": [], "ig": 1.008, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I'm so glad to see this.  The early 2000s Windows UX guidelines were a great teacher to me.\n\nIt's good to read design guidelines from designers who care about functionality and usability even more than aesthetics."}, {"id": 50655252, "au": "cowlevel", "dom": 41, "sr": 18, "sc": 2.95, "ep": 3.46, "bs": 0.0, "d": 1, "age": 8.43, "grav": 68.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "widgets_buttons", "flbl": "Widgets & Buttons (Design)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.336, "bl": 0.0, "ds": 0.0, "txt": "Responsive design and the transition of everything to HTML, both of which came in reaction to smartphones. In Win32 or Windows Forms the primitives you have are things like buttons and checkboxes and fixed positioning. In HTML you mostly just have the arbitrarily styleable clickable area within a flow layout."}, {"id": 50660255, "au": "pndy", "dom": 50, "sr": 19, "sc": 2.9, "ep": 3.05, "bs": 0.0, "d": 1, "age": 0.22, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2589, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "devices_llm", "flbl": "Devices & LLM (Screen)", "urls": [], "ig": 1.296, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Metro was perfect for mobile devices - it indeed had both good visuals and functionality.\n\nMy mother really liked how her HTC and Nokia phones were so easy to use. And now she struggles using her Samsung even with interface font set as big as possible so applications wouldn't break."}, {"id": 50654024, "au": "mcculley", "dom": 67, "sr": 20, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 0, "age": 10.95, "grav": 100.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4895, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.639, "fa": 0.0, "gp": 0.914, "bl": 0.0, "ds": 0.0, "txt": "Where is the one for the web? I have been told for a long time that webapps can replace desktop apps and there is still no HIG."}, {"id": 50656087, "au": "irthomasthomas", "dom": 22, "sr": 21, "sc": 2.73, "ep": 3.17, "bs": 0.0, "d": 1, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4087, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "singular_gender", "flbl": "Singular & Gender (English)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.279, "bl": 0.0, "ds": 0.0, "txt": "I wonder if it would have been better to teach girls that they are included in the masculine pronouns used in literature, where the author cannot know in advance the gender of the reader. As in human, mankind and men.\n\nBut soon technology will allow the ebook to know it's reader and to customize style and even story to their taste."}, {"id": 50651829, "au": "Fabricio /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
