cussions from the United States. The entities which trade with Iran may be sanctioned by the US and EU and thus will find it difficult to sell goods internationally. Banks doing business with the sanctioned entity may be cut off from American and European financial systems, or themselves sanctioned.\n\n> At the end of the day, China selling some routers to Iran doesn't affect the US at all though.\n\nWell we said no you can’t do that because we are blockading the country. Plus China exports dual-use technology as we see with Russia (interesting how folks, especially Europeans, always forget that China supports Russia’s invasion) so some of those components might be used to kill children, murder foreign nationals in other countries who have nothing to do with Iran, or be used to oppress the domestic population or take other "}, {"id": 50643724, "au": "jackb4040", "dom": 145, "sr": 2, "sc": 12.12, "ep": 12.12, "bs": 0.0, "d": 2, "age": 1.69, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 65, "qw": 0, "k": 589, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": ["https://www.nature.com/articles/d41586-025-04048-7"], "ig": 1.407, "fa": 2.69, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "China leads the world in research in 90% of crucial technologies: https://www.nature.com/articles/d41586-025-04048-7\n\nThe idea that they are simply copying 1st-world technology is an outdated, yellow-peril idea from a time when they were still catching up. It has no ability to explain how they've pulled ahead in basically every technology except lithography - where they are still closing the gap twice as fast as expected. I urge you to reconsider."}, {"id": 50643435, "au": "piltdownman", "dom": 124, "sr": 3, "sc": 10.89, "ep": 10.89, "bs": 0.0, "d": 0, "age": 2.04, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 224, "qw": 0, "k": 1919, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": ["https://en.wikipedia.org/wiki/2004%E2%80%932005_Greek_wiretapping_case", "https://zepo.ai/blog/vendor-vishing-attack-ericsson-breach"], "ig": 2.166, "fa": 1.57, "gp": 0.916, "bl": 0.0, "ds": 0.0, "txt": "I mean Ericsson got the biggest fine in history of $1.26 billion due to Foreign Corrupt Practices Act (FCPA) penalties, mainly hinging on bribery and payments to ISIS in Iraq spanning 2011 to 2019.\n\nThey also got pinged for the same in China and Djibouti, and also for sanction-busting in Sudan by labelling the end-user as Botswana and sending over Satellite equipment despite their own compliance teams flagging it repeatedly.\n\nThis is the vendor you swapped out Huawei for on National Security concerns.\n\nAs for Huawei backdoors and malfeasant surveillance? Ericsson do plenty boasting about their lawful intercept capability for governments like the US. This same capacity was famously backdoored in Greece and eavesdroppers illegally monitored roughly 100 mobile phones, including the Greek Prime Minister, senior cabinet ministers, military officials, and U.S. embassy staff.\n\nUS Intelligence Agencies were blamed. Hard to know as the Network Planning Manager died at the age of 38 during the wiretapping case, in what appeared to be a suicide, but later was found to be a murder.\n\nhttps://en.wikipedia.org/wiki/2004%E2%80%932005_Greek_wireta...\n\nThis happened again in Belarus in December 2010 when the KGB used Ericsson-supplied lawful interception infrastructure to track and wiretap opposition protesters. And again in Macedonia where the UBK performed illegal wiretapping of over 20,000 ci"}, {"id": 50643940, "au": "yogthos", "dom": 11, "sr": 4, "sc": 10.5, "ep": 10.5, "bs": 0.0, "d": 3, "age": 1.45, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 19, "qw": 0, "k": 5220, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": ["https://www.tandfonline.com/doi/full/10.1080/01972243.2024.2315875"], "ig": 0.818, "fa": 2.69, "gp": 0.627, "bl": 0.0, "ds": 0.0, "txt": "They did not. A 2024 literature review found that U.S. warnings about Huawei have been largely ignored by the global south countries. https://www.tandfonline.com/doi/full/10.1080/01972243.2024.2..."}, {"id": 50642965, "au": "jmyeet", "dom": 109, "sr": 5, "sc": 10.18, "ep": 10.18, "bs": 0.0, "d": 2, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 276, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": ["https://theconversation.com/horseshoe-theory-is-nonsense-the-far-right-and-far-left-have-little-in-common-77588", "https://www.historicalmaterialism.org/fascism-is-a-reaction-to-capitalist-crisis-in-the-stage-of-imperialism/"], "ig": 1.881, "fa": 1.24, "gp": 1.537, "bl": 0.0, "ds": 0.0, "txt": "I have to say it: the horseshoe theory is complete nonsense [1]. If you look at the history of it, it goes back to 1930 when anti-capitalist Nazis left the party to form the Black Front. Their mistake was that the Nazis never were anti-capitalist and never would be. It was never more than a fringe movement. It's as nonsensical as \"MAGA communists\" (yes that's a thing).\n\nThe term \"horseshoe theory\" was popularized decades later and has come to be used as a tool for centrists to attack the left.\n\nCentrist parties worldwide will routinely ally with the far-right to attack leftist movements because centrists and the far-right are more similar than different. They're both capitalist and fascism is capitalism in crisis [2]. Leftism begins with anti-capitalism.\n\nA good recent example of this is France where the centrist president, Emmanuel Macron, called a snap election and the biggest winner was the leftist coalition under Melanchon. What did Macron do? He sought an alliance with French Nazi Marine Le Pen instead.\n\nAmerican foreign policy is uniparty. Once you understand that a lot of things become clear. For example, I called (correctly) that Trump's election victory wouldn't really change anything in Ukraine. And it hasn't. Because American foreign policy is inherently pro-war. Trump is not a Russian puppet. He simply idolizes strongmen and pretends to be one. He just happens to be"}, {"id": 50643487, "au": "skeledrew", "dom": 122, "sr": 6, "sc": 8.81, "ep": 8.81, "bs": 0.0, "d": 0, "age": 1.99, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 43, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": ["https://usunrome.usmission.gov/why-were-dismantling-the-icc/"], "ig": 0.444, "fa": 2.35, "gp": 0.739, "bl": 0.0, "ds": 0.0, "txt": "Hilarious in the light of them trying to dismantle the ICC⁰. US doesn't want to be subject to international court, but wants to make \"legal\" judgments internationally. They should stick to their \"might is right\" stance, and see how it holds against China.\n\n⁰ https://usunrome.usmission.gov/why-were-dismantling-the-icc/"}, {"id": 50643041, "au": "pessimizer", "dom": 138, "sr": 7, "sc": 8.67, "ep": 8.82, "bs": 0.0, "d": 0, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.538, "fa": 1.23, "gp": 1.17, "bl": 0.0, "ds": 0.0, "txt": "The US could have made China dependent on US chips and tech, but instead prevented exports requiring China to develop its own industry. This was based on the theory that not only are Americans smarter than Chinese people, but 4x smarter than Chinese people because there are 4x as many Chinese people. This theory is evidence of its own falsehood.\n\nNow that China is technologically independent of the US and barely behind on any metric, we're reduced to being as pathetic as Europeans. Good luck regulating China, especially over a country who we committed war crimes against and has never done anything to us.\n\nMark my words, 10 years from now China will be doing tech sanctions against the US, and the US will be complaining to the UN that the sanctions amount to a human rights violation."}, {"id": 50644896, "au": "kgeist", "dom": 131, "sr": 8, "sc": 7.4, "ep": 7.4, "bs": 0.0, "d": 2, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 3, "k": 5201, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.446, "fa": 0.96, "gp": 0.871, "bl": 0.0, "ds": 0.0, "txt": "Russia has larger reported reserves than the US of vanadium (100×), magnesite (66×), bauxite (33×), nickel (24×), platinum-group metals (19×), cobalt (11×), iron ore (9.7×), potash (9.1×), peat (6.7×), antimony (5.8×), gold (4×), silver (4×), zinc (3.1×), natural gas (2.6×), phosphate rock (2.4×), rare earths (2×), lead (1.9×), copper (1.7×), oil (1.6×)\n\nWhere the US leads: niobium (70×), helium (5×), molybdenum (3.2×), iodine (2.1×), coal (1.53×), rhenium (1.29×), boron (1.2×).\n\n(according to USGS)\n\n>much better farmland\n\nThe US has just 24.6% more arable land than Russia. Cereal yields/Ha are 1.5-2 times lower in Russia, but it has 2x more arable land per capita."}, {"id": 50643746, "au": "kakacik", "dom": 90, "sr": 9, "sc": 7.15, "ep": 7.29, "bs": 0.0, "d": 4, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.927, "fa": 0.34, "gp": 1.239, "bl": 0.0, "ds": 0.0, "txt": "Nope and nope. >50% folks voted for already known incompetent narcissist, potential pedophile (just look at photos with his daughter, no sane father would ever do such stuff and share it, its disgusting, on top of all photos and videos with his great friend Epstein), fraud, cheat, serial liar, incompetent, aggressive and arrogant beyond any measure and of course openly corrupt.\n\nMost folks veered away when his promises were not delivered and he tanked US economy, rose inflation and fuel prices due to consistently stupid behavior and starting a war that was lost on Day 1. Thats why the loss, not due to sudden moral awakening of big part of electorate.\n\nSo if you want to call all his voters magas thats fine but it seems like this is not what you are trying to say and its not even true.\n\nPlease lets not rewrite history and when someone fucks up, man up, ball up and admit it. The least one can do after such a massive moral failure."}, {"id": 50644058, "au": "andsoitis", "dom": 34, "sr": 10, "sc": 6.88, "ep": 6.88, "bs": 0.0, "d": 6, "age": 1.33, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": ["https://www.futurewei.com/", "https://www.huawei.com/en/media-center/transform/04/huawei-ipr-vision-and-strategy"], "ig": 1.253, "fa": 0.96, "gp": 0.83, "bl": 0.0, "ds": 0.0, "txt": "R&D, intellectual property licensing, corporate administration and support for legacy telecommunications customers.\n\nFuturewei is located in San Jose - https://www.futurewei.com/\n\nAnother subsidiary, Huawei Device USA is in Plano, TX.\n\nIP presence - https://www.huawei.com/en/media-center/transform/04/huawei-i...\n\nFrom my vantage point, they shifted after 2019 from accessing the US consumer and telco market to accessing US tech and innovation ecosystem, participating in technical standards, and monetizing its IP."}, {"id": 50643874, "au": "pessimizer", "dom": 94, "sr": 11, "sc": 6.87, "ep": 7.16, "bs": 0.0, "d": 4, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 282, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 2.06, "fa": 0.34, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "No you're right. Trump-endorsed candidates did horribly. MAGA thoughtfully sat out because Trump has totally aligned himself with Never Trumpers, Israel, and H1B. They also were willing to vote for local Democrats as long as they weren't campaigning on illegal immigration and transwomen.\n\nMAGA are voting on antimonopoly, anti-datacenter, anti-foreign intervention, anti-censorship, anti-surveillance, pro-infrastructure, pro-labor, anti-financial industry, etc.. It's why they voted for Trump in the first place, and its the reason why left-wing loosely-DSA candidates also cleaned up. Those candidates actually lost conservative Democrat votes, because \"Abundance©\" neocons and DLC scum were actively campaigning against them. Republicans and Republican-leaning independents probably propped them up - which is why you saw outperformance in places like Florida and Mississippi.\n\nedit: it's also important to say that MAGA always voted this way. They voted for Trump because Trump said that he would do this. Mainstream Democrats didn't even give this stuff lip service and actively campaigned against it. The group of neocons that Trump ultimately aligned with were literally called Never Trumpers which makes comically clear how opposed President Trump is to candidate Trump's rhetoric.\n\nLooking at Democratic leadership, however, and the fact that no new names have appeared for presidential con"}, {"id": 50642845, "au": "Pragmata", "dom": 149, "sr": 12, "sc": 6.46, "ep": 6.83, "bs": 0.0, "d": 1, "age": 2.94, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 23, "k": 572, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.471, "fa": 0.64, "gp": 1.065, "bl": 0.0, "ds": 0.0, "txt": ">There are some interesting issues here. If Huawei wants to do business in the US it will have to comply with US law.\n\nIs that even an incentive here? Huawei is being sanctioned already, and i find it unlikely that the US government will stop doing so to them and treat them like any other company going forward.\n\nSeems to me the only reasonable option for Huawei is to say fuck you to the US and treat it as the adversarial relationship it already is. That means not complying with any US laws or requests (including actually doing business with Iran and other sanctioned entities).\n\nI suspect the chinese would likely cover for them in that scenario if only as a warning to the US to not overstep its bounds when it comes to chinese companies.\n\nThe funny thing is, this might actually end up with huawei supplying chips to russia, since they now have no reason to stop it.\n\nChinese Corporation vs US puppet state proxy war lol"}, {"id": 50643475, "au": "Kuyawa", "dom": 129, "sr": 13, "sc": 6.01, "ep": 6.16, "bs": 0.0, "d": 0, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.636, "fa": 0.34, "gp": 0.93, "bl": 0.0, "ds": 0.0, "txt": "US is floating on an endless pool of printed money, throw some gas and a match and it will go down in flames without any resource to create anything, all it's left is war, dirty politics, economic strangulation, but sorry to tell you none of that will work in the end\n\nYou only have to blame politicians for that, they never cared about their nation, only their pockets (just look at the current state of affairs). China on the other hand, is also moved by politics like all countries, corruption, bureaucracy, but with 4000 years of history and tradition steering the wheel a bit towards greatness, without that it would be just like Russia\n\nIf you put USA, Russia and China in a simulator, Russia would outlast them all because their endless resources, China would outperform them all due to their technological prowess, and the USA, just the sad remains of what could have been"}, {"id": 50643637, "au": "andsoitis", "dom": 32, "sr": 14, "sc": 5.81, "ep": 6.4, "bs": 0.0, "d": 4, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 9, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.639, "fa": 1.37, "gp": 0.686, "bl": 0.0, "ds": 0.0, "txt": "> On the basis that they operate in the E.U though.\n\nHuawei DOES operate in the US. They used to be much bigger in the US until the 2019 sanctions.\n\nAlso, this is about activities in 2011 / 2012.\n\nWorth getting your facts right."}, {"id": 50644859, "au": "thephyber", "dom": 108, "sr": 15, "sc": 5.8, "ep": 6.24, "bs": 0.0, "d": 4, "age": 0.31, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.745, "fa": 0.34, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "Don't pretend like Trump didn't stand out in front of the Iran War and brag about it being his idea. After Little Marco blurted that the US joined because Israel was going to attack with or without us, Trump downplayed Israel's role and played up his own executive decision in the matter.\n\nHe bragged about the B1 bombers hitting Natanz last summer, he bragged about the US military invading Venezuela and stealing their president, and he bragged about \"winning\" the war with Iran in 2026.\n\nLoyalty is always \"in relation to what?\" In the US, the federal employees and the military are loyal to the US Constitution, not to the person holding the highest office. The thing you are complaining about is a feature of the US system, not a bug.\n\nThat's something you risk if you take over a major political party but don't have anyone who believes your weird ideology: you don't have a large pool of ideologically aligned candidates to staff the entire government. Oh well. Maybe let your weird ideology bake in the oven a little longer until it convinces more people."}, {"id": 50643893, "au": "mylastattempt", "dom": 79, "sr": 16, "sc": 5.57, "ep": 6.23, "bs": 0.0, "d": 0, "age": 1.49, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 115, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.433, "fa": 0.68, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "Nearly all of the comments here are no more than a display of how well propoganda (from any side) has worked on the commenter. Nobody even skimmed the article (bar one commenter).\n\nThis article is an update about the charges brought on against Huawei in 2018, related to them using a shell company (Skycom) to sell products to Iran in 2011, which violated sanctions.\n\nBut let's just immediately jump into the typical \"us vs them\" groupchat.."}, {"id": 50643052, "au": "rayiner", "dom": 110, "sr": 17, "sc": 5.55, "ep": 5.99, "bs": 0.0, "d": 3, "age": 2.57, "grav": 15.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 9, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.34, "fa": 0.42, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "> We don't have to be in conflict with China\n\nThis statement negates the rest of your analysis. The notion that you can have two world powers and not have some level of conflict between them is childish. It's not even childish--even my teenager understands it's nonsensical. China today is what the U.S. was right before World War I--a country with massive industrial capacity, but not much of a military. It turned out that industrial capacity can quickly be converted to military supremacy. China will follow the same trajectory, and conflict with China is inevitable. China is the Parthia to the U.S.'s Rome."}, {"id": 50644796, "au": "Zigurd", "dom": 125, "sr": 18, "sc": 5.45, "ep": 5.6, "bs": 0.0, "d": 1, "age": 0.4, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 12406, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.746, "fa": 0.28, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "I wrote the LI spec for a 3G GGSN being developed by a joint venture of Ericsson and Juniper, based on existing specs that mostly applied to voice switches. Those specs were revised so many times for previous products that they crashed Word if you did anything obscure like try to edit a footnote.\n\nIt was an education in LI requirements and how it's actually implemented. LI implementations are required to fly under the radar of network management so that carriers don't actually know what law-enforcement is intercepting. No logging to network management systems, for example.\n\nHang on, there's someone at the door..."}, {"id": 50643656, "au": "hax0ron3", "dom": 116, "sr": 19, "sc": 5.35, "ep": 5.79, "bs": 0.0, "d": 3, "age": 1.78, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.892, "fa": 0.0, "gp": 0.924, "bl": 0.0, "ds": 0.0, "txt": "Fascists want to use capitalism for pragmatic purposes (economic power, stability, maintaining certain kinds of social hierarchies that fascists like) but to have it be controlled by the fascist state. Some big business interests helped Hitler's rise to power, but once in power Hitler was not controlled by big business. Fascists tend to make a distinction between \"good\" capitalism (subordinate to the fascist state, working for the imagined good of the fascist society) and \"bad\" capitalism (working for its own interests, controlled by rootless cosmopolitans or Jews or whatever).\n\nHorseshoe theory is either right or wrong depending on what kind of horseshoe theory one means. Do the far left and the far right want the same policies? No, clearly not. Are they similar in some ways? Yes, they both tend to support more state intervention in the economy and society (there is a group of economic libertarians that is sometimes characterized as far-right because of their non-economic views, but it is small compared to the populist far-right), their messaging tends to be populist, they tend to draw support from people who are disaffected with the liberal order, they both tend to believe that the elites of the current liberal society do not deserve their status and privileges, etc."}, {"id": 50643507, "au": "piltdownman", "dom": 8, "sr": 20, "sc": 5.03, "ep": 5.17, "bs": 0.0, "d": 1, "age": 1.96, "grav": 11.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1919, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.602, "fa": 0.34, "gp": 0.303, "bl": 0.0, "ds": 0.0, "txt": "China backed OpenRAN heavily, lets not forget.\n\nChina Mobile helped establish the O-RAN Alliance, which was basically plugged elsewhere as a way of divesting away from Huawei in favour of agnostic and open source software layers and Virtualised Network Functions. Pure carrier telecom revenue, when Huawei were disclosing it separately, was 44% of their total revenue."}, {"id": 50643761, "au": "BLKNSLVR", "dom": 118, "sr": 21, "sc": 4.97, "ep": 5.41, "bs": 0.0, "d": 3, "age": 1.65, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 325, "qw": 0, "k": 15921, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.824, "fa": 0.0, "gp": 0.775, "bl": 0.0, "ds": 0.0, "txt": "From my admittedly skimming of the article, it seems to miss the point that is the methods, not the ideology, that converge on the fringes of left and right.\n\nAdditionally, one author's opinion does not make fact (and neither does mine). But the fact that both fascism and communism assert a level of control of the populace, and a restriction of freedoms, gives some validity to the idea of the horseshoe theory.\n\nNo one generally likes to admit it though, because 1. No one thinks they're extreme left or right, and 2. They fucking hate with all their might the opposing extreme, and so any common ground is just not possible in their world view, and they'll justify it in all the ways they can, except the one that matters.\n\nYour statement that \"Leftism starts with anti-capitalism\" doesn't ring true for me at all. You might have one example that may look like that, especially when you start by framing it as the foundational reason, but that's pure speculation about one person's motivations, which are often many and varied.\n\nI can use modern opposing anecdotes. Trump is simultaneously acting fascist in his ICE / immigration footgun policies, and communist in interesting government money into private enterprise, in addition to pressuring a private enterprise into nominating a CEO (and thirdly, having a jolly friendly time with his communist besties Xi and Vlad, what a trio they make).\n\n"}, {"id": 50644846, "au": "Danox", "dom": 70, "sr": 22, "sc": 4.56, "ep": 4.78, "bs": 0.0, "d": 4, "age": 0.34, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 638, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 0.602, "bl": 0.0, "ds": 0.0, "txt": "It seems to belong to them through 2100 at their trajectory. They’re not wasting money trying to police the world, useless wars, sanctions, tariffs, they are building infrastructure at a breakneck speed. Russia and United States seem to be the ones stuck in the mud along with the EU.\n\nIf it wasn’t for the war between Russia and the Ukraine, high-speed rail would already be all the way to eastern Europe from China, they have taken those lessons from Oak Ridge, Tennessee and are building Thorium reactors, there was a time in can-do, America where the challenge to build infrastructure would be answered. But that isn’t exactly true today we have an administration's making war on institutions of learning, medicine, infrastructure and the list goes on."}, {"id": 50642734, "au": "roenxi", "dom": 148, "sr": 23, "sc": 4.56, "ep": 5.74, "bs": 0.0, "d": 0, "age": 3.12, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 30627, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.652, "fa": 0.22, "gp": 0.846, "bl": 0.0, "ds": 0.0, "txt": "There are some interesting issues here. If Huawei wants to do business in the US it will have to comply with US law.\n\nThat being said, the US law in the Iran sanctions case appears to structurally weak. As a matter of procedural fairness it sounds impractical to regulate how Chinese and Iranian companies interact through US courts. As a matter of moral imperative it's hard to see the case why they can regulate this. Based on how the Middle East and European wars are playing out US also seems to lack the geopolitical heft to reliably enforce this sort of law either; it looks like Trump is going down before Iran is and the attempts to stop Asia-Russia trade have failed. That bodes poorly for any half-hearted attempts to bludgeon China.\n\nThey'd be much better off abandoning this sort of world police routine. It has always made them into something of a laughing stock and its part of the strategy that has failed so badly they're at risk of being outcompeted by Communists."}, {"id": 50643971, "au": "ianm218", "dom": 2, "sr": 24, "sc": 4.18, "ep": 4.7, "bs": 0.0, "d": 1, "age": 1.42, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.691, "fa": 0.0, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "Around Chinese companies and industries there is often an idea like \"US Chip export controls made China double down on domestic supply chain, huge mistake\" but ignores that this has a huge cost. The US views China as an adversary and now they have to spend hundreds of billions or even trillions that they could otherwise allocate to other strategic interests.\n\nIt's like yes China is a state with massive ability to respond to changing dynamics, they aren't going to roll over. Doesn't mean the US shouldn't play its cards to keep CCP controlled companies out of global telecoms or to slow dow their AI progress."}, {"id": 50642827, "au": "ftchd", "dom": 23, "sr": 25, "sc": 4.13, "ep": 4.57, "bs": 0.0, "d": 0, "age": 2.97, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 339, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.535, "fa": 0.95, "gp": 0.414, "bl": 0.0, "ds": 0.0, "txt": "The case is about 2011/2012, not today (well it could be about current events but I'm saying the original events happened in 2011)."}, {"id": 50642894, "au": "mirmor23", "dom": 85, "sr": 26, "sc": 4.09, "ep": 4.53, "bs": 0.0, "d": 2, "age": 2.83, "grav": 17.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 58, "k": 202, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.195, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> If this is in reference to the fact that Jensen's possibly getting a pass for the exact same behavior, it's important to remember that the policy of the American people and the policy of the Trump administration seem to have diverged on a great many things, as evidenced by the midterms, and that this might be one of those things.\n\nWhile i agree with what you are saying, the midterm flip wouldn't have happened without Iran war AND fuel hike in addition to general cost of living increases.\n\nBut let's not forget that 62M voters consistently voted for him in all 3 elections, and they might be jaded, but they would do it again in a heartbeat.."}, {"id": 50643045, "au": "jmyeet", "dom": 156, "sr": 27, "sc": 4.06, "ep": 5.6, "bs": 0.0, "d": 1, "age": 2.58, "grav": 15.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.594, "fa": 0.34, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "Sanctions only really work against allies. The most prominent example is apartheid South Africa, which collapsed when the US government withdrew support due to international and domestic pressure.\n\nRussia has had over 4 years of broad sanctions now and it's always weeks away from economic collapse. Yeah, it's not going to happen.\n\nAnd Iran? Decades. They produce their own food and energy. They're not going anywhere.\n\nSo as soon as the US decided to broadly sanction Huawei so there was no hope of having a US market, any pressure was gone. Huawei is going to do whatever it likes. It no longer matters what the US thinks or does.\n\nAnd is there hope of the US lifting sanctions against Huawei? No. Because China is intentionally positioned as a threat to sell weapons."}, {"id": 50643009, "au": "ericmay", "dom": 151, "sr": 28, "sc": 3.8, "ep": 5.34, "bs": 0.0, "d": 2, "age": 2.64, "grav": 15.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 100, "k": 8954, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.434, "fa": 0.42, "gp": 0.533, "bl": 0.0, "ds": 0.0, "txt": "> Seems to me the only reasonable option for Huawei is to say fuck you to the US and treat it as the adversarial relationship it already is. That means not complying with any US laws or requests (including actually doing business with Iran and other sanctioned entities).\n\n> I suspect the chinese would likely cover for them in that scenario if only as a warning to the US to not overstep its bounds when it comes to chinese companies.\n\nThe EU has sanctioned Iran too.\n\nThis China just stands up to the world and fights for the freedom of despots in Iran, North Korea, and Russia fantasy is very tiring. The Chinese will do some amount of work to defend their companies, like the US is doing for American tech companies in Europe, but at the end of the day the sanctions hurt and China can only do so much less they risk other actions from the US or EU with regards to violating sanctions on Iran.\n\n> The funny thing is, this might actually end up with huawei supplying chips to russia, since they now have no reason to stop it.\n\nSure there is. Well, first who says they’re not already supplying chips to Russia? Second, the EU will be very angry with China  for any overt support of Russia’s invasion of Ukraine and would enact retaliatory measures."}, {"id": 50642953, "au": "rjzzleep", "dom": 97, "sr": 29, "sc": 3.69, "ep": 4.57, "bs": 0.0, "d": 2, "age": 2.72, "grav": 16.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 8602, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.501, "fa": 0.0, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "You guys are really losing your mind over the fact that one of the most powerful Tech companies in the US didnt play along with the China is evil charade, eh? And no, NVIDIA did not do the same as Huawei.\n\nJensen did exactly the right thing if the US wanted to stay ahead in the AI Chips game. The US did exactly the wrong thing to keep Huawei away from becoming the worlds no1 5G infra provider.\n\nThe worst thing is that you don't even see that this game is exactly what is currently the biggest threat to ASML there is.\n\nI'm a pretty emotional guy myself, and I can't always control my temperament, but I really don't understand these short sighted emotional views of the world."}, {"id": 50643307, "au": "Kuyawa", "dom": 59, "sr": 30, "sc": 3.64, "ep": 4.89, "bs": 0.0, "d": 0, "age": 2.2, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.649, "fa": 0.0, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "Huawei is a (mental) threat to the US, a huge one. They overcame the Android/Apple lobbied sanctions and created their own OS that will rule the world, China for starters. Now they are trying to not just ban it but destroy it because they are building the next gen AI chips. So now starts a world war with Huawei calling them the devil, child molesters, porn enablers, nuke deployers, terrorists, whatever is in the politiks manual to demonize them. If you can't compete in your own definition of \"free market\" just destroy them using any means\n\nI wish Huawei the best and my next phone for sure I swear to god it will be a Huawei"}, {"id": 50643781, "au": "parineum", "dom": 141, "sr": 31, "sc": 3.32, "ep": 3.62, "bs": 0.0, "d": 2, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2550, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.539, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Familiarity breeds contempt, as they say.\n\nPeople spurn Tesla because Elon Musk did a \"Nazi Salute\" during a rally while they praise BYD, a company half owned by a country with actual concentration camps for a religious minority.\n\nThe consequences of one side of that happen at home and the other side's consequences are happening in some far off land. Out of sight and out of mind."}, {"id": 50644603, "au": "mixdup", "dom": 5, "sr": 32, "sc": 3.28, "ep": 4.38, "bs": 0.0, "d": 3, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 14, "k": 1945, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 0.858, "fa": 0.76, "gp": 0.135, "bl": 0.0, "ds": 0.0, "txt": "> So you're actually steering your competitor into being good at the best stuff\n\nBut the alternative is just giving them the good stuff up front without any cost. Their not having good or being good on their own, stuff, is not a possible outcome (without a war) so it seems to reason even if your point is 100% correct, it's still worth making them go through with building up that capability on their own. It will still slow them down and waste resources\n\nIf you don't do the export controls they get what you have and can spend their resources on going beyond you"}, {"id": 50644562, "au": "yieldcrv", "dom": 19, "sr": 33, "sc": 3.06, "ep": 3.72, "bs": 0.0, "d": 3, "age": 0.71, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.584, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Honestly it is an impossible standard, all natural and artificial persons are extensions of the CCP and have no analog to the western concept\n\nThis is used when convenient by both the CCP and Western governments\n\nand in the west, the corporate layer is thin and a parallel governance system to deal with, as the corporations control all facets of life instead of the party\n\nfunctionally no different for a resident, you know who you can’t criticize in both systems to remain deeply integrated in the respective societies"}, {"id": 50643414, "au": "BLKNSLVR", "dom": 60, "sr": 34, "sc": 3.01, "ep": 4.4, "bs": 0.0, "d": 1, "age": 2.06, "grav": 12.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 15921, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 0.756, "bl": 0.0, "ds": 0.0, "txt": "I hope they start selling GPUs for actual gaming, that'd ensure the love and admiration of multiple generations from multiple countries, including those not friendly to China or it's policies and ideologies.\n\nSome real mindshare and influence could be gained by filling that gaping maw in the market."}, {"id": 50642795, "au": "lenerdenator", "dom": 83, "sr": 35, "sc": 2.83, "ep": 3.49, "bs": 0.0, "d": 1, "age": 3.02, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 7452, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": ["https://www.usatoday.com/story/news/politics/2026/11/23/congress-reaction-to-jensen-huang-nvidia-return/92925133007/"], "ig": 0.511, "fa": 0.62, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "If this is in reference to the fact that Jensen's possibly getting a pass for the exact same behavior, it's important to remember that the policy of the American people and the policy of the Trump administration seem to have diverged on a great many things, as evidenced by the midterms, and that this might be one of those things. Congress isn't nearly as sold as Trump is [0]\n\nIf it's in reference to something else, nevermind.\n\n[0] https://www.usatoday.com/story/news/politics/2026/11/23/cong..."}, {"id": 50644222, "au": "siliconc0w", "dom": 121, "sr": 36, "sc": 2.71, "ep": 3.15, "bs": 0.0, "d": 0, "age": 1.14, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 5880, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "We should require microcodes and fine and then jail executives who supply chips to foreign adversaries.  If your chip is in a Russian drone, you are liable and your compensation package is now rebuilding the apartment building you just contributed to destroying."}, {"id": 50643588, "au": "iamnothere", "dom": 62, "sr": 37, "sc": 2.63, "ep": 4.18, "bs": 0.0, "d": 3, "age": 1.87, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.226, "fa": 0.28, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "That doesn’t imply that it won’t happen, it just means that there may be a further split in mainstream East and West tech compatibility. I am sure that China would prefer to reduce domestic use of Windows; the government is already phasing it out for obvious reasons.\n\nWindows doesn’t run at all on Loongson CPUs, for example."}, {"id": 50644097, "au": "rootusrootus", "dom": 89, "sr": 38, "sc": 2.5, "ep": 3.38, "bs": 0.0, "d": 6, "age": 1.29, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 28119, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.422, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "MAGA will never see the light, as it were, but I would not be shocked it it appears that way over the next few years.  Trump's winning strategy was to turn out low propensity voters, people who often just skip elections, and without those voters he would have lost badly.  But the other side of that magic trick is that when his name is not on the ballot those voters' propensity goes right back to where it started.  So unless JD Vance or Rubio or someone else can get these people to bother voting, the power of the movement is going to return back to Tea Party levels.  Visible but not controlling."}, {"id": 50643290, "au": "dopa42365", "dom": 152, "sr": 39, "sc": 2.4, "ep": 3.94, "bs": 0.0, "d": 3, "age": 2.22, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 407, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.453, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "There're some UN security council sanctions on Iran that cover a handful of very specific items.\n\nChina (and most other countries) interpret that as: we can trade everything else with Iran just fine if we want to\n\nUS (sometimes, depending on who runs the country) interprets it as: anyone who trades anything with Iran gets punished; might makes right (so much for the liberal international rules based order)\n\nAt the end of the day, China selling some routers to Iran doesn't affect the US at all though."}, {"id": 50643845, "au": "hollerith", "dom": 130, "sr": 40, "sc": 2.36, "ep": 3.31, "bs": 0.0, "d": 1, "age": 1.55, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 9, "k": 8144, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.426, "fa": 0.76, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": ">Russia would outlast them all because their endless resources\n\nWhich resource do you imagine Russia has more of than the US?\n\nRussia is known for its farmland and petroleum reserves. The US has much better farmland and produces more petroleum and natural gas (and did so even before the start of the war in Feb 2022)."}, {"id": 50644265, "au": "chvid", "dom": 3, "sr": 41, "sc": 2.35, "ep": 3.89, "bs": 0.0, "d": 2, "age": 1.08, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 5813, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.585, "fa": 0.0, "gp": 0.115, "bl": 0.0, "ds": 0.0, "txt": "Absolutely true - the Huawei campaign did cost Huawei billions and almost killed them off completely.\n\nHowever China tech is much more complex than a simple top down structure; and there are companies who much prefer to buy western products, have western customers and integrate into western ecosystems - in fact Huawei was at one point like that.\n\nToday those are companies like Bytedance, Alibaba, Lenovo - unless forced - they would buy NVIDIA etc over a Chinese alternative any day."}, {"id": 50643535, "au": "Kuyawa", "dom": 68, "sr": 42, "sc": 2.3, "ep": 6.98, "bs": 3.58, "d": 2, "age": 1.92, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.831, "fa": 0.62, "gp": 0.631, "bl": 1.35, "ds": 0.0, "txt": "Keep in mind that \"it's policies and ideologies\" are media perpetuated lies used as propaganda against a necessary enemy according to politiks for keeping the sheeple afraid and paralized\n\nIf you watch youtube or tiktok you can see the biggest cities flourishing like if they lived in the year 2050 and people lives as happy as they can almost without crime, walking out at night, enjoying all modern amenities, best cars, best trains, best everything\n\nI wish I could live in that \"human rights violating dictatorship\""}, {"id": 50643506, "au": "hnfong", "dom": 61, "sr": 43, "sc": 2.29, "ep": 3.84, "bs": 0.0, "d": 2, "age": 1.96, "grav": 11.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3145, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.96, "fa": 0.28, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "It's not going to happen. There's no way in hell Microsoft (for example) would help implement/allow DirectX support for Huawei GPUs. If Huawei implemented DirectX on their own it'd probably be some IP violation or something."}, {"id": 50643343, "au": "chvid", "dom": 1, "sr": 44, "sc": 2.16, "ep": 3.7, "bs": 0.0, "d": 0, "age": 2.16, "grav": 13.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5813, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "Huawei is a massive company; the US forcing them out of 5G infrastructure and mobile phones forced them seek new business including in AI, lithography, and self-driving cars."}, {"id": 50644718, "au": "Danox", "dom": 67, "sr": 45, "sc": 2.02, "ep": 3.34, "bs": 0.0, "d": 4, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 638, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.423, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It won’t make any difference. The rest of the world will go on. Europe is even making noises towards developing something. The rest of the world is open to the best or cheapest product on the market, Microsoft can’t go anywhere in the rest of the world they don’t do mobile. and that’s their death nail…\n\nIn the US, they are very fortunate that there are many companies still tied to them through inertia, they better figure out something soon, because time is running out. At some point within the next 2 to 3 generations, the M series chips from Apple will exceed Nvidia and many other commercial companies will start to jump ship."}, {"id": 50644544, "au": "thephyber", "dom": 26, "sr": 46, "sc": 2.0, "ep": 2.81, "bs": 0.0, "d": 2, "age": 0.73, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's very hard to disentangle any case prosecuted by Trump's DOJ as anything other than political.\n\nAlso, the biggest charge of racketeering was acquitted.\n\n\"Intentionally breaking NDAs\" what is this about? An NDA is a contract between two parties. This case was about criminal violations, not civil."}, {"id": 50644250, "au": "rayiner", "dom": 112, "sr": 47, "sc": 1.91, "ep": 3.23, "bs": 0.0, "d": 5, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 129422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.036, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The first U.S. military buildup happened in WWI, not WWII. The U.S. demobilized between the two wars. But WWI provide how quickly you could turn an industrial superpower into a military superpower. And yes, conflict is inevitable. Thinking otherwise is up there with flat-earthism: ignoring literally all the evidence in front of your eyes."}, {"id": 50644621, "au": "dragonelite", "dom": 38, "sr": 48, "sc": 1.77, "ep": 3.17, "bs": 0.0, "d": 4, "age": 0.63, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 905, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.348, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Reality is that the US will become less of an important market than China's surrounding neighborhood. With countries like Indonesia, Vietnam, Pakistan, Iran, Russia with huge population and developing economies that need industrial/capital intense goods the west won't sell its good eating for Chinese companies."}, {"id": 50644590, "au": "jmyeet", "dom": 119, "sr": 49, "sc": 1.72, "ep": 3.04, "bs": 0.0, "d": 4, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.292, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is definitionally true that leftism begins w8th anti-capitalism. If you are a capitalist, you can be a social democrat, a \"centrist\" (which is really just a product of the Overton window), right-wing or far-right wing but you are definitionally right-wing in all cases.\n\nWhy? Because it begins and ends with economics. Maybe you see yourself as progressive because of certain social issues but these so-called culture war issues were manufactured so we wouldn't talk about economics.\n\nImperialism is the highest form of capitalism with everything that entailed (eg colonialism, the transatlantic slave trade).\n\nYou know who agreed on all this? Adam Smith, Abraham Lincoln and Karl Marx."}, {"id": 50645035, "au": "ericmay", "dom": 154, "sr": 50, "sc": 1.63, "ep": 3.17, "bs": 0.0, "d": 5, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 8954, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.084, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The main problem about alleged US and EU keeping their “end of the bargain” is that the premise is faulty. First, the entire world should be “holding up their end of the bargain” because nuclear proliferation is not in anyone’s interest. Second why does Iran need special snowflake treatment to not build nuclear weapons? All other peaceful countries aren’t trying to build them, so why is Iran?"}, {"id": 50644204, "au": "zdragnar", "dom": 48, "sr": 51, "sc": 1.5, "ep": 3.04, "bs": 0.0, "d": 6, "age": 1.15, "grav": 7.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 13901, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Without an extradition treaty in place, getting people outside the country into the country to attend court for crimes committed within the country becomes a military matter.\n\nIt's a rather fine distinction, but it does exist."}, {"id": 50644502, "au": "thephyber", "dom": 55, "sr": 52, "sc": 1.43, "ep": 2.98, "bs": 0.0, "d": 3, "age": 0.78, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Huawei still has assets in the US and within the reach of US treaty allies. Also, the article mentions asset forfeiture after the sentencing.\n\nIf you pretend like Huawei is just one big Chinese company in China with all of their assets in Chinese banks, then you completely misunderstand how this case was built and prosecuted."}, {"id": 50643466, "au": "datakan", "dom": 144, "sr": 53, "sc": 1.42, "ep": 2.96, "bs": 0.0, "d": 1, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1383, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.259, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "China is the worlds largest copying machine. Without those sanctions they would have rebranded our own technology and sold it back to us at half the price using slave labor and shady lobbying tactics. China is no ones friend."}, {"id": 50644490, "au": "wolvoleo", "dom": 105, "sr": 54, "sc": 1.3, "ep": 2.85, "bs": 0.0, "d": 3, "age": 0.81, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well he does have a habit of changing his mind twice a day. Since the last meetup Xi was his best buddy ever. Tomorrow that can change.\n\nPutin seems to be the bigger constant here."}, {"id": 50643117, "au": "ozgrakkurt", "dom": 140, "sr": 55, "sc": 1.28, "ep": 2.82, "bs": 0.0, "d": 1, "age": 2.46, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1337, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.099, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "China would have developed it anyway. China is just winning so there doesn’t seem like US can do much without doing kamikaze into china’s economy.\n\nYou can watch the attitude difference between something like anthropic and deepseek, or byd and tesla, it makes it pretty obvious US is on a countdown at this point."}, {"id": 50644402, "au": "Danox", "dom": 37, "sr": 56, "sc": 1.28, "ep": 2.81, "bs": 0.0, "d": 3, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 638, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.195, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "And they (EU) are stepping up the pace. But it’s a sign of weakness. It is a sign of not wanting to keep pace and compete… the rest of the world is just moving on. and they will buy from China. Why? Because they still make things you will know when China is history when they stop making things, unfortunately for the USA, it seems like they’re gonna be making things until the end of the century, sanctions, tariffs, and crying isn’t going to keep up with China, Japan, Taiwan, and Korea."}, {"id": 50644970, "au": "neya", "dom": 18, "sr": 57, "sc": 1.28, "ep": 2.76, "bs": 0.0, "d": 3, "age": 0.13, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 14722, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "This doesn't go both ways, US companies like Google have been banned in China from day 1. They've been treated as a fraud even before being proven. So, what's your point?\n\nOn the contrary, Huawei has been caught sabotaging and spying on their users multiple times. I'm surprised they were even allowed to do business till now."}, {"id": 50644438, "au": "hgoel", "dom": 7, "sr": 58, "sc": 1.28, "ep": 2.66, "bs": 0.0, "d": 4, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 1.133, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Technologically speaking the US may have a lead, but economically speaking (ie profit and long term viability), it's far less clear. The Chinese approach seems to be much more focused on efficient models and capabilities that are most broadly relevant (ie heavily emphasizing coding), compared to the US companies' \"bet the economy on AGI\" approach.\n\nThough it's probably fair to say that China is being made to bet more of its economy on AI than it would've had to without the export controls."}, {"id": 50643906, "au": "surgical_fire", "dom": 15, "sr": 59, "sc": 1.28, "ep": 2.64, "bs": 0.0, "d": 2, "age": 1.48, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.785, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Should US tech companies be a considered a front for the US government? Especially considering how the government is now picking who leads those companies?\n\nMaybe other countries should be more wary of doing business with the US tol. You can be at the forefront of a new technology and be a fraud as well, after all."}, {"id": 50644890, "au": "adrian_b", "dom": 50, "sr": 60, "sc": 1.28, "ep": 2.52, "bs": 0.0, "d": 8, "age": 0.26, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 1.071, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But those extradition treaties are regarded by the US as unilateral, i.e. USA expects those countries to extradite anyone requested by USA, e.g. for things like copyright violation, but the US government does not hesitate to smuggle out of such countries US military personnel, to avoid their trial there for crimes like manslaughter, and once the wanted people are safe back home in USA there is no chance for them to be extradited back to the US \"allies\", to face the local justice."}, {"id": 50643947, "au": "ozgrakkurt", "dom": 142, "sr": 61, "sc": 1.28, "ep": 2.51, "bs": 0.0, "d": 3, "age": 1.44, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1337, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Who is more racist doesn't matter for economic success unfortunately. I mean their approach to production. Chinese companies are vastly more production and competition oriented."}, {"id": 50644720, "au": "thephyber", "dom": 104, "sr": 62, "sc": 1.28, "ep": 2.46, "bs": 0.0, "d": 3, "age": 0.49, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 1.048, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I suspect the analogy of Yalta  compared to last week's summit of Trump, Putin, Xi fits.\n\nI suspect Trump would absolutely stop all US tariffs if China gave him a  Trump tower in Every city in Asia. He doesn't care about actual results, only about how the results make him feel."}, {"id": 50643550, "au": "iamnothere", "dom": 54, "sr": 63, "sc": 1.28, "ep": 2.43, "bs": 0.0, "d": 2, "age": 1.91, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The US government will not find a way to compel payment from a Chinese company any more than China will compel the same from a US company. It’s not going to happen.\n\nMost likely this is just an excuse in the making for more tariffs or sanctions."}, {"id": 50644242, "au": "stvltvs", "dom": 91, "sr": 64, "sc": 1.28, "ep": 2.4, "bs": 0.0, "d": 5, "age": 1.1, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 981, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "I'm using \"diehard MAGA\" to designate the core of supporters who will never abandon Trump, not the larger population of Trump voters who may switch allegiances or simply drop supporter."}, {"id": 50643596, "au": "btown", "dom": 81, "sr": 65, "sc": 1.28, "ep": 2.33, "bs": 0.0, "d": 0, "age": 1.86, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 8, "k": 20220, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "> substantive bank fraud, wife fraud and IEEPA offenses.\n\nI assume that's supposed to say wire fraud, but in the age of Jensen Huang, I suppose anything's possible."}, {"id": 50642578, "au": "cyanydeez", "dom": 102, "sr": 66, "sc": 1.28, "ep": 2.19, "bs": 0.0, "d": 1, "age": 3.33, "grav": 20.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 2957, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I'm mostly intrigued by the horse-shoe theory of all this corruption.\n\nIts clear trump wants his administration in bed with China and Russia. They've went very far to install an administration that's only loyal to the orange menace. Yet, they continue to play footsy under the table with the dumbest stakes possible."}, {"id": 50644894, "au": "thephyber", "dom": 117, "sr": 67, "sc": 1.28, "ep": 2.19, "bs": 0.0, "d": 3, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The horseshoe theory only makes sense if you distill all of the political differences into a single 1D axis.\n\nPeople with a brain use 2D or 3D axes where there's no reasonable way to mistake two ideologies which as very far apart as if they are close."}, {"id": 50643128, "au": "somenameforme", "dom": 99, "sr": 68, "sc": 1.28, "ep": 5.19, "bs": 3.05, "d": 3, "age": 2.45, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 1.828, "fa": 0.0, "gp": 0.617, "bl": 1.15, "ds": 0.0, "txt": "In the age of LLMs apparent consensus, lack thereof, or any other sort of social indicators online are becoming increasingly meaningless. If you turn on showdead it's interesting seeing the surprisingly large number of accounts that are shadowbanned for being somewhat obvious LLMs. What's more interesting to imagine those that are not caught, and to speculate on the percent.\n\nI'd never claim any given person is a shill, troll, or whatever other term people want to use. The reason is that these systems are becoming good enough that it's probably now literally impossible to tell. Lots of accounts, if not the majority, post lots of low content short posts - you don't need a brilliant LLM to compellingly mimic this, and that's when we do have brilliant LLMs.\n\nAll digital communication should be taken with a grain of salt. Of course that's always been true, but now it's just orders of magnitude more true, and will grow increasingly true."}, {"id": 50644713, "au": "dragonelite", "dom": 153, "sr": 69, "sc": 1.28, "ep": 2.02, "bs": 0.0, "d": 4, "age": 0.51, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 905, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Im pretty sure those UN security council sanction were made void by China and Russia when Iran kept their end of the bargain with the Nuclear stuff. The EU and US failed to keep their end of the bargain of that Iran deal so its all void."}, {"id": 50643485, "au": "fidotron", "dom": 139, "sr": 70, "sc": 1.28, "ep": 3.14, "bs": 1.19, "d": 1, "age": 1.99, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 23, "k": 12896, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.758, "fa": 0.42, "gp": 0.114, "bl": 0.45, "ds": 0.0, "txt": "> The US could have made China dependent on US chips and tech, but instead prevented exports requiring China to develop its own industry.\n\nThis version of history denies a huge amount of agency to the Chinese, which they have felt justified in exercising for much longer than is widely appreciated."}, {"id": 50643639, "au": "_DeadFred_", "dom": 133, "sr": 71, "sc": 1.28, "ep": 1.87, "bs": 0.0, "d": 1, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 4395, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 0.385, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The only thing about China that is similar to 4000 years of history is power is devolved to each region. And they definately aren't steering to some fantasy ancient/feudal society."}, {"id": 50644366, "au": "kube-system", "dom": 49, "sr": 72, "sc": 1.28, "ep": 1.83, "bs": 0.0, "d": 7, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 27156, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.365, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The US has extradition treaties with 116 countries and it's pretty tough to commercially travel globally without connecting in one of them.  That's how they got Meng Wanzhou"}, {"id": 50643090, "au": "0xbadcafebee", "dom": 128, "sr": 73, "sc": 1.28, "ep": 1.8, "bs": 0.0, "d": 0, "age": 2.5, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 10, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.614, "fa": 0.0, "gp": 0.244, "bl": 0.0, "ds": 0.0, "txt": "> while also providing the technology to monitor and suppress dissent\n\nA certain ally of ours is famous for making and selling the same technology, but we don't seem to mind then"}, {"id": 50643954, "au": "etiennebausson", "dom": 45, "sr": 74, "sc": 1.28, "ep": 1.72, "bs": 0.0, "d": 6, "age": 1.44, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 316, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 0.629, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "Fair, though my understanding was that the raid against Maduro had everything to do with the U.S. executive power and nothing about the judiciary?"}, {"id": 50643832, "au": "neya", "dom": 14, "sr": 75, "sc": 1.28, "ep": 1.7, "bs": 0.0, "d": 1, "age": 1.57, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 14722, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.654, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "How you do business matters. Huawei is basically a front for the CCP and they've always resorted to unethical practices. You can be a forefront of new technology and be a fraud. Both things can be true."}, {"id": 50644194, "au": "BLKNSLVR", "dom": 20, "sr": 76, "sc": 1.28, "ep": 1.7, "bs": 0.0, "d": 3, "age": 1.17, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 15921, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Big tech? Yes, absolutely, and I'm pretty sure there are receipts.\n\nTrump, at least, protects them as if they're government assets. Nvidia is crucial to US National Security it would seem."}, {"id": 50644504, "au": "yipinwong", "dom": 127, "sr": 77, "sc": 1.28, "ep": 1.7, "bs": 0.0, "d": 0, "age": 0.78, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 198, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.659, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "In China, we have a saying, \"Cheat or be Cheated\" (more like you are stupid to be cheated).\n\nThis is a norm in Chinese companies with guanxi especially. Huawei built quanxi and were following the tradition."}, {"id": 50643605, "au": "hereme888", "dom": 75, "sr": 78, "sc": 1.28, "ep": 1.68, "bs": 0.0, "d": 1, "age": 1.86, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1518, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.715, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You sound like a pro-CCP agent, and completely ignore the reality of facts of theft and conspiracy stacked up against Huawei."}, {"id": 50644308, "au": "ianm218", "dom": 6, "sr": 79, "sc": 1.28, "ep": 1.52, "bs": 0.0, "d": 3, "age": 1.02, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "china_companies", "flbl": "China & Companies (Controls)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Right now the US has a large lead in AI largely because of export controls. There is a pretty good chance that the most pivotal years of AI the US will be in the driving seat while China is catching up. There is a tradeoff to any decision - China will go deeper on self reliance - but in this case its a great trade. China already had it as a top priority to be self reliant in critical industries and AI/ Semis is obviously a critical industry they were behind the ball on.\n\nI.e. right now even though China is doing a good job making open source models, US companies are largely the ones monetizing and getting all the revenue that can be recycled back into our own ecosystem. If DeepSeek or z.ai etc actually had the capacity to offer big plans or train more models they would just capture all that value."}, {"id": 50642836, "au": "throwa356262", "dom": 27, "sr": 80, "sc": 1.28, "ep": 1.5, "bs": 0.0, "d": 0, "age": 2.96, "grav": 17.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "huawei_chinese", "flbl": "Huawei & Chinese (Market)", "urls": [], "ig": 0.401, "fa": 0.0, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "Huawei is already locked out of the US market. Does it really matter to them what US courts come up with?"}, {"id": 50643432, "au": "hax0ron3", "dom": 103, "sr": 81, "sc": 1.28, "ep": 1.49, "bs": 0.0, "d": 2, "age": 2.04, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "russia_administration", "flbl": "Russia & Administration (China)", "urls": [], "ig": 0.36, "fa": 0.0, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "The man who started a trade war with China wants his administration in bed with China? Not saying it's impossible, but I mean there's definitely reason to think it's not true."}, {"id": 50642669, "au": "AnimalMuppet", "dom": 106, "sr": 82, "sc": 1.28, "ep": 1.39, "bs": 0.0, "d": 2, "age": 3.2, "grav": 19.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 0.508, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "The thing is, when you select people for their loyalty rather than their competence, you get people who are less competent than we expect.  That's been clear for a while now - many of these people are not \"the best and the brightest\", they're Trump loyalists whose loyalty is their primary credential.  They only got into office because Congress had enough loyalists to vote them in out of loyalty, rather than merit.  (And some of them didn't even clear that bar - they're in only because of the \"interim\" end-run around the law.)"}, {"id": 50644656, "au": "dragonelite", "dom": 63, "sr": 83, "sc": 1.28, "ep": 1.38, "bs": 0.0, "d": 3, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 905, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatt  0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "conflict_worldwide", "flbl": "Conflict & Worldwide (Foreign)", "urls": [], "ig": 0.899, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Just don't be an Uyghur, or practice any of the banned religions, or unregistered Tai Chi, or mention Tjanamen Square or Pooh Bear.\n\nTheir ideologies and policies are not all \"propaganda of the West\" but that doesn't exclude China from having great cities and opportunities for living a wonderful life - as long as you respect the (unwritten?) rules cough fascism cough.\n\nChina is just as mentally fragile about it's image as Trump, and will do morally reprehensible things to exact revenge for perceived insults. But so will Trump (in more comical, designed to fail ways) and Putin. And Australian intelligence immediately attempted to commercially fuck over East Timor after helping them to achieve independence. If any of them were in the form of an individual human I wouldn't piss on them if they were on fire (but probably would if they weren't).\n\nDon't pretend China is morally better than any other country. But that doesn't mean that the next century doesn't inevitably belong to then."}, {"id": 50644400, "au": "wolvoleo", "dom": 12, "sr": 87, "sc": 1.18, "ep": 1.18, "bs": 0.0, "d": 4, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "trump_voters", "flbl": "Trump & Voters (Maga)", "urls": [], "ig": 0.503, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It makes sense though. They have less power. Whether they are spied upon by the US or by China, for them it's about the same. And they don't have the size to raise their own industry."}, {"id": 50644823, "au": "throwaway7783", "dom": 71, "sr": 88, "sc": 1.0, "ep": 1.0, "bs": 0.0, "d": 1, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w
