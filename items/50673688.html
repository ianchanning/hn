", "count": 18, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 12}, {"category": "low_cred_or_joke", "count": 3}], "story_anchors": ["awards", "atari", "homebrew", "cancelled", "amount", "author", "change", "entries", "fully", "humans", "contest", "allow", "deal", "entirely", "goes", "interesting", "multiple", "necessary"], "largest_root": {"root_id": 50674062, "author": "jordanb", "slots": 92, "start_dom": 5, "end_dom": 96, "share_pct": 47.4, "top_dom1_age": 7.3, "top_dom1_author": "0_____0"}, "buried_cutoff": 58, "rescue_top_k": 39, "ablations": [], "tournament": [], "comments": [{"id": 50674367, "au": "Aurornis", "dom": 6, "sr": 1, "sc": 8.19, "ep": 8.19, "bs": 0.0, "d": 1, "age": 6.53, "grav": 47.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 30, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.586, "fa": 0.7, "gp": 1.705, "bl": 0.0, "ds": 0.0, "txt": "> It's crazy. I considered the vintage computing community to be immune to AI since that's really the only community writing software just for the fun of software and using simple computers\n\nI think this community is discovering that different people enjoy vintage computers for different reasons. Some people really do enjoy seeing something running on a vintage computer even if they didn't get there through hundreds of hours of manual labor. People enjoy hobbies different ways.\n\nI do understand why an award designed to reward that manual labor would need to call it quits at this point. The spirit of the award is no longer there, so leaving it to a bygone era makes sense.\n\nHowever I also think that a lot of these communities need to come to terms with the fact that different people have different ways of enjoying their hobbies. If someone wants to use AI as part of their own personal enjoyment of the hobby, that's fine. Let people enjoy things.\n\nIn other hobbies like woodworking people do things like document their builds so there's evidence that they used hand tools or carved details by hand instead of using the easier paths afforded by modern power tools. I suspect we'll see more of this where people livestream or record their development as proof. It's too high of a bar to include everyone doing it for fun, but those who like to share their work might be doing more of it."}, {"id": 50675561, "au": "tito", "dom": 2, "sr": 2, "sc": 7.3, "ep": 7.3, "bs": 0.0, "d": 1, "age": 2.55, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 135, "qw": 0, "k": 1067, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": ["https://ai-awards-for-atari.github.io/2026/"], "ig": 1.601, "fa": 1.24, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hey who wants to work on an \"AI Awards for Atari\" with me?\n\nThe original spirit of the competition is now gone. Sprits come and go. Let's find a new spirit!\n\nHere's instructions on how to make a compatible game: https://ai-awards-for-atari.github.io/2026/\n\nIf someone makes a game that's fun to play, that's a win! If someone has fun making it, even better. If you want to make a game with no AI, sure no problem! And if you can have an AI make a fun game with no human input, wow cool.\n\n- Contest: open to any and all entires through December 14th\n\n- Voting: open to anyone who has a Github account created before November 27, 2026. Every Github account gets one vote.\n\n- Voting opens December 14th and closes December 23rd.\n\nIf you want to stay informed on this, or be involved in some way, hit reply!"}, {"id": 50676053, "au": "Paracompact", "dom": 7, "sr": 3, "sc": 6.53, "ep": 6.68, "bs": 0.0, "d": 2, "age": 0.78, "grav": 6.3, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 78, "k": 971, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.653, "fa": 0.76, "gp": 0.435, "bl": 0.0, "ds": 0.0, "txt": "> In other hobbies like woodworking people do things like document their builds so there's evidence that they used hand tools or carved details by hand instead of using the easier paths afforded by modern power tools. I suspect we'll see more of this where people livestream or record their development as proof. It's too high of a bar to include everyone doing it for fun, but those who like to share their work might be doing more of it.\n\nAn even more relevant example is speedrunning. It's simple to cheat with TAS or other tools, and very hard to detect these cheats, especially given a lack of extra safeguards. So the default trend for leaderboards is that anyone can submit, and there's only cursory attention paid to 99% of the leaderboard. Who really cares if you cheat for mediocrity? The real attention, and the real requirements (e.g. handcams, livestreams) only gets placed on those claiming to be the best of the best.\n\nI suppose the biggest difficulty in actually adapting this approach to gamedev is that the process is much longer. Unless you're doing a single-day gamejam, who's to say you didn't consult AI between recording sessions?"}, {"id": 50675037, "au": "nlarion", "dom": 174, "sr": 4, "sc": 6.42, "ep": 6.42, "bs": 0.0, "d": 1, "age": 4.61, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 29, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.575, "fa": 0.68, "gp": 0.536, "bl": 0.0, "ds": 0.0, "txt": "No, you're not alone. Forgetting the economic and environmental impacts of ai, I think a lot of the anti-ai rhetoric is pure ego.. I mean, you spend 20 years doing something very technical and some ai comes along and can do it for 100x less and faster/better... that's a recipe for depression/apathy. That being said, might be an opportunity for someone else who wants to manage an ai fueled game jam maybe? On a side note, I've been having a blast making vibe coded Gameboy games and playing them on real hardware."}, {"id": 50675515, "au": "simonw", "dom": 36, "sr": 5, "sc": 6.1, "ep": 6.39, "bs": 0.0, "d": 7, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": ["https://store.steampowered.com/app/4957110/%E7%BE%A4%E4%BE%A0%E4%BC%A0%E5%B9%B8%E5%AD%98%E8%80%85/", "https://vibejam.com/"], "ig": 0.923, "fa": 0.96, "gp": 1.025, "bl": 0.0, "ds": 0.0, "txt": "Wuxia Survivors has over 3,000 Steam reviews, mostly positive. I've not tried it myself: https://store.steampowered.com/app/4957110/%E7%BE%A4%E4%BE%A...\n\nThe winners of https://vibejam.com/ are worth a look.\n\nIt's still pretty early though, Opus 5.5 and Fable 5.2 are less than three months old, and those are the models that really got good at game development."}, {"id": 50675443, "au": "suddenlybananas", "dom": 126, "sr": 6, "sc": 6.03, "ep": 6.03, "bs": 0.0, "d": 4, "age": 2.98, "grav": 18.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 100, "qw": 0, "k": 1473, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": ["https://civitai.com/images/147579069"], "ig": 1.344, "fa": 0.62, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "I will say, its astounding how bad the taste of people who are into AI-art is. It's either completely derivative (e.g. literally copying other people's work with a dumb twist) or the most uninteresting stuff ever. I got into an argument with someone once here about ai art and they cited this as a good piece of art. https://civitai.com/images/147579069 I found this so astounding that they cited that utter dreck as an example of art.\n\nI don't think this is a necessary fact about ai generation but maybe there's something about the personality that just cares so little about craft or effort that leads them to have horrible taste."}, {"id": 50674220, "au": "soneil", "dom": 122, "sr": 7, "sc": 5.87, "ep": 6.02, "bs": 0.0, "d": 2, "age": 6.84, "grav": 50.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 4808, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.586, "fa": 0.34, "gp": 0.914, "bl": 0.0, "ds": 0.0, "txt": "I think their explanation that it's difficult to define a hard line, makes a lot of sense to me.\n\nI mean, I think most of us would be okay with using AI to digest documentation, spitball ideas, etc.  And I think most of us would agree that entering a 100% vibecoded app is against the spirit of the competition.\n\nWhat about turning sprites into arrays?  I recall a lot of retro games involving laborious stuff like that, where I'd be very tempted to whip out the ol' Artificial Intern - but I don't think that detracts from the accomplishment at all.\n\nSo finding the line is tough, enforcing the line is tough - and from what I've seen in most communities, manning the floodgates is tough.  That's a lot of work that no-one signed up for."}, {"id": 50674013, "au": "guiambros", "dom": 146, "sr": 8, "sc": 5.86, "ep": 5.86, "bs": 0.0, "d": 0, "age": 7.26, "grav": 54.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 32, "qw": 0, "k": 11027, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": ["https://adventofcode.com/2026/about\u0023faq_leaderboard"], "ig": 1.205, "fa": 0.62, "gp": 0.872, "bl": 0.0, "ds": 0.0, "txt": "Disappointing, but that's a reasonable and expected outcome. These are the same issues Eric Wastl has been dealing for years with Advent of Code, which culminated in cancelling the global leaderboard last year [1].\n\n[1] https://adventofcode.com/2026/about\u0023faq_leaderboard"}, {"id": 50675605, "au": "tito", "dom": 19, "sr": 9, "sc": 5.79, "ep": 6.23, "bs": 0.0, "d": 2, "age": 2.36, "grav": 14.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 141, "qw": 0, "k": 1067, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": ["https://ai-awards-for-atari.github.io/2026/"], "ig": 1.287, "fa": 0.96, "gp": 0.323, "bl": 0.0, "ds": 0.0, "txt": "That's funny, I firmly believe that more people would genuinely attempt to climb Mount Everest if they built a cable car to the top.\n\nThe value of Mount Everest is that it's the highest point on Earth. It always will be! And if there was a path to getting there that was easy, so many more people would go, and get fascinated by the whole thing. And, so many people would want to have the authentic experience. People would even come up with hyper authentic experiences, like hiking up from the ocean all the way to the peak over many months, and paragliding back down.\n\nSure, you would drop from 100% of people \"working their way there\", but I believe the absolute number of humans who would hike to the top would rise.\n\nAll that said, maybe you want to make an AI game for Atari? https://ai-awards-for-atari.github.io/2026/"}, {"id": 50674243, "au": "tshaddox", "dom": 90, "sr": 10, "sc": 5.78, "ep": 6.22, "bs": 0.0, "d": 1, "age": 6.8, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 17, "k": 36998, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.304, "fa": 0.76, "gp": 0.684, "bl": 0.0, "ds": 0.0, "txt": "> that's really the only community writing software just for the fun of software and using simple computers\n\nThat was true by necessity when it was reasonably difficult to produce a piece of software for one of these retro systems, because the only people who would spend the energy doing it were people who were highly interested in that retro system.\n\nIn my view, that’s what community projects like this really want at the end of the day: people who are genuinely interested in the subject matter of the community. I’d love to see what the Atari homebrew dev community that existed pre-LLM can do now with the help of LLMs! But I’m not particularly interested in what literally anyone in the world with a $20 subscription can conjure into existence that runs on these systems."}, {"id": 50674417, "au": "simonw", "dom": 32, "sr": 11, "sc": 5.49, "ep": 5.93, "bs": 0.0, "d": 3, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 221, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.666, "fa": 0.0, "gp": 1.393, "bl": 0.0, "ds": 0.0, "txt": "I can absolutely see the appeal of vibe coding a retro game!\n\nImagine building a game like Doom or Wolfenstein 3D but getting it running on a C64.\n\nPrior to LLMs that would have taken months of work, likely including learning C64 assembly code and figuring out all kinds of new optimization tricks.\n\nThat's enough to put me off the idea, personally. I don't have months of my time to dedicate to that.\n\nBut if I can get a coding agent to spit it out... I get to demonstrate that it's possible for a Doom-style game to run on a C64. That would be a cool thing to see. I wouldn't feel any need to claim that I had done it unassisted.\n\n(This example is also neat because it's almost certainly not possible to do this - so if I tried without agents I would be spending months of my time in the expectation that it wouldn't work. I don't mind wasting an agent's time for a few hours.)\n\nI agree that I would never dream of entering such a thing into a competition unless that competition made it very clear that pure AI-generated entries were welcome.\n\nI expect we'll see competitions like that start to pop up all over the place. A lot of people are having a ton of fun building AI-assisted game projects right now, and there's going to be demand for platforms where they can demonstrate their work in good conscience."}, {"id": 50674749, "au": "bitwize", "dom": 123, "sr": 12, "sc": 5.42, "ep": 5.72, "bs": 0.0, "d": 3, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 37, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.519, "fa": 0.42, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "> What about turning sprites into arrays? I recall a lot of retro games involving laborious stuff like that, where I'd be very tempted to whip out the ol' Artificial Intern - but I don't think that detracts from the accomplishment at all.\n\nGenerating code was a thing before LLMs, you know. Back in the day we did it with regular old programs. Usually there wasn't an objection to code generation done in this way because you had to write the code that writes the code. But for retro computing platforms in particular, e.g., the demoscene, there's some division between \"oldskool\" demos which rely heavily on hardware exploitation vs. \"newskool\" demos which rely more on using modern tools to manage time/memory tradeoffs more powerfully than would have been practical in the 1980s."}, {"id": 50674054, "au": "georgemcbay", "dom": 136, "sr": 13, "sc": 5.35, "ep": 5.35, "bs": 0.0, "d": 1, "age": 7.18, "grav": 54.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 8, "k": 16548, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.374, "fa": 0.42, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "> Wouldn’t a solution be to just have multiple categories?\n\nDoesn't solve the organizer's stated problem of not wanting to have to deal with all the overhead of trying to decide if people are using AI or not.\n\nMany people lie even if only for the smallest amount of transient clout.  Some would enter the non-AI category with either fully or partially LLM created entries.  So the organizer is left with the same problem even if they introduce new categories.\n\nBest way to wash your hands of having to worry about it is just cancel the whole thing.  People can still participate in that community and develop retro Atari games, just no more awards competition."}, {"id": 50675655, "au": "tito", "dom": 17, "sr": 14, "sc": 4.96, "ep": 5.62, "bs": 0.0, "d": 1, "age": 2.18, "grav": 13.1, "surf": 4.1, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 154, "qw": 0, "k": 1067, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": ["https://ai-awards-for-atari.github.io/2026/"], "ig": 1.468, "fa": 0.62, "gp": 0.282, "bl": 0.0, "ds": 0.0, "txt": "The number of people who can make Atari games has exploded over night. The number of people who can have an idea, and then have that idea expressed, is at a new high. The possibility space of fun, wacky, weird games has exploded. Yes, anon, there will be infinitely more bad games than ever. But at the same time...\n\nKids can make games. People who don't code can make games. Gurus in ashrams can make games. People bored on an airplane can make games.\n\nWe're going to be able to explore the incredible space of all possible games and find ones that are even more fun than what exists. And Atari offers a nice set of constraints and brand.\n\nPeople may be building new Atari games until the heat death of the universe.\n\nLet the games begin!\n\nAll that said, maybe you want to make an AI game for the new “AI Awards for Atari”?\n\nhttps://ai-awards-for-atari.github.io/2026/"}, {"id": 50676140, "au": "meheleventyone", "dom": 102, "sr": 15, "sc": 4.9, "ep": 5.12, "bs": 0.0, "d": 2, "age": 0.41, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 6034, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.433, "fa": 0.28, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "AI is a tool but it’s also a step change in terms of capabilities. When I vibe coded a CRUD web page to interact with one of our services all I did was point it at the proto API and let it go. I did no meaningful work there at all other than setting the thing off.\n\nThat’s such an enormous difference that I effectively built nothing. I would not claim authorship.\n\nAs that’s possible I think it makes sense to disclose AI use because people want to know how much work done is actually attributable to the person claiming authorship. Whereas using vim or not doesn’t make that distinction so it’s less worthwhile to disclose."}, {"id": 50674052, "au": "yieldcrv", "dom": 181, "sr": 16, "sc": 4.78, "ep": 4.78, "bs": 0.0, "d": 2, "age": 7.18, "grav": 54.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.396, "fa": 0.28, "gp": 0.482, "bl": 0.0, "ds": 0.0, "txt": "I covered all the bases with intentional wording specifically to predict the presence of people like you\n\nlanguage exists to convey a shared concept, a good faith reply would reveal which wording you prefer to convey that I appreciate experiences that can be generated from all things that can generate the experiences, does that phrase exist, in your world?"}, {"id": 50675560, "au": "dmitrygr", "dom": 167, "sr": 17, "sc": 4.6, "ep": 5.04, "bs": 0.0, "d": 1, "age": 2.56, "grav": 15.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 9, "k": 14123, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.921, "fa": 0.76, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "> Using an llm to make a game is still hard.\n\nI literally just asked an LLM to do it, to see if you were right. Predictably, you are 100% wrong. I gave it three sentences. It made a game. The game worked. That was not hard compared to learning the assembly, CPU timing, memory maps, and making it all fit into the cycles available."}, {"id": 50674319, "au": "refactor_master", "dom": 59, "sr": 18, "sc": 4.3, "ep": 5.18, "bs": 0.0, "d": 5, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 1173, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.345, "fa": 0.34, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "Even before AI there has been a problem with millions of graduates with no jobs in sight because the market can only bear so many. This is a way to get any kind of “experience”, no matter how meager (or irrelevant, but people probably think it’s more relevant than food delivery). And it even has “award” in the name.\n\nAI has just made it easier.\n\nIt’s pretty well-known at this point that any job opening for pretty much any “engineering-like” position will be shotgunned by applicants from around the world. 95% probably won’t even have a valid visa, but they’ll think “the company will grant me one”.\n\nIt’s a bit of an insane number game, but some applicants are also up against insane numbers. And it’s probably only going to get worse, to the point where competitions either fold or restrict it to local residents."}, {"id": 50674228, "au": "MBCook", "dom": 52, "sr": 19, "sc": 4.14, "ep": 4.58, "bs": 0.0, "d": 4, "age": 6.83, "grav": 50.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.088, "fa": 0.34, "gp": 0.725, "bl": 0.0, "ds": 0.0, "txt": "What job opportunity do you think having won a competition for Atari 2600 coding is going to get you?\n\nWhat’s the point of recognition for something you can’t even do?\n\nThis whole thing puzzles me too. Seems like there are people who see being able to code a game for a retro system as an achievement, but don’t actually want to do it. They just want the “accomplishment“. And I guess winning a competition “validates“ that in a way? To make it not fake?\n\nStill seems incredibly fake to me.\n\nIf you had an idea and worked through making it, and kept asking an LLM for assistance on why something didn’t work or how to use a feature of a console, I could get that. And that could be a category or a different competition.\n\nBut people who basically haven’t make the whole game? _Why_?"}, {"id": 50674276, "au": "Skyy93", "dom": 62, "sr": 20, "sc": 4.06, "ep": 5.16, "bs": 0.0, "d": 5, "age": 6.75, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 21, "k": 208, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.294, "fa": 0.42, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "It makes you stand out from the crowd. Imagine you have a hiring process where two candidates are roughly at the same level, but one has apparently won a Homebrew Award or whatever. This translates for many HR people to: Yeah that person invested a huge chunk of his time and seems to be dedicated to something.\n\nThis can make a difference, and its fairly not much work with AI to do so.\n\n>What’s the point of recognition for something you can’t even do?\n>But people who basically haven’t make the whole game? _Why_?\n\nPeople who are doing this do not care. Getting likes on some platform is for some enough reason to post their whole life online, so why not simply use LLMs to do the very same thing."}, {"id": 50674936, "au": "thih9", "dom": 147, "sr": 21, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 0, "age": 4.9, "grav": 32.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 10141, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.571, "fa": 0.0, "gp": 0.205, "bl": 0.0, "ds": 0.0, "txt": "What’s going to happen to other fields, eg photography?\n\nOne day generating a photorealistic ai image will be similarly easier than taking a picture. There will be LLMs without watermarks and cameras without authenticity tracking.\n\nMore importantly, it will also be possible to add any amount of LLM input to the creative process.\n\nWill we stop seeing photo contests?"}, {"id": 50675914, "au": "Ampersander", "dom": 175, "sr": 22, "sc": 3.86, "ep": 4.0, "bs": 0.0, "d": 2, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 157, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.291, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A lot of the pro-ai rhetoric is pure ego. Spending 20 years being a wannabe programmer that can't get fizzbuzz right is a recipe for depression.\n\nFor any difficult skill that people are generally interested in, the group of people who have that skill is smaller than the group of people that wish they had it without spending any effort to learn. Actually it's the recognition that come with the skill that they are after, i.e., not learning to write a novel or writing a novel, but being someone that has written a novel."}, {"id": 50675413, "au": "ricardobayes", "dom": 108, "sr": 23, "sc": 3.81, "ep": 4.47, "bs": 0.0, "d": 0, "age": 3.08, "grav": 18.6, "surf": 3.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 2434, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "This is very understandable. It made me think fundamentally what is the differentiator of a human and AI-made code/game/software. Is it polish? Is it having bugs or the perceived lack of? Is it \"care\" that every component plays along well to form a cohesive unit?\n\nSome people might quote the Brian Eno quote: \"Whatever you now find weird, ugly, uncomfortable and nasty about a new medium will surely become its signature. CD distortion, the jitteriness of digital video, the crap sound of 8-bit—all of these will be cherished and emulated as soon as they can be avoided.\""}, {"id": 50674488, "au": "Sebguer", "dom": 152, "sr": 24, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 1, "age": 6.25, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 2807, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.42, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "The issue becomes that someone needs to do the labor of dealing with people who 'cheat' at the categories, and this is an exhausting and difficult effort. Even if it's obvious when AI assistance is used, even if the rules allow disqualification just for suspicion of AI usage, you have created a whole quite significant amount of new 'labor' and potential drama. It sounds exhausting, to be honest, and I can't blame the creator for not wanting to deal with it."}, {"id": 50675841, "au": "matsemann", "dom": 4, "sr": 25, "sc": 3.55, "ep": 4.43, "bs": 0.0, "d": 0, "age": 1.51, "grav": 9.6, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.585, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "AI has ruined so much fun. Now I would normally prepare for Advent of Code. Loved the rush of waking up ungodly early, skim through and blast out some code in minutes and seeing if I got on the leaderboard. That's gone.\n\nAlso seeps into non tech hobbies. Can't count how many vibe coded new training/runnin/cycle apps I get bombarded with each day, from new members not caring about the existing community."}, {"id": 50674718, "au": "jrmg", "dom": 141, "sr": 26, "sc": 3.52, "ep": 3.66, "bs": 0.0, "d": 5, "age": 5.58, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 5516, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.449, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "I think that in below the sarcasm and superiority of your comments, you're arguing that \"if you can't tell it doesn't matter\".\n\nI'm a happy user of AI to aid development - and I've even dabbled in retro-coding with LLMs - I'd also argue that the idea of a contest for humans that doesn't allow AI assistance is a valid (worthwhile, even) idea.\n\nIf a competition for woodworking didn't allow CNC machines, or a competition for hand-tool woodworking didn't allow the use of power tools, would you be there on the sidelines jeering \"A table saw would cut straight without so much effort - if I can't tell how a cut was made why does it matter?!\", or \"You could make a much higher quality table if you just used a CNC mill to cut out the legs - and no one would know!\"?"}, {"id": 50674268, "au": "DonaldPShimoda", "dom": 184, "sr": 27, "sc": 3.42, "ep": 6.11, "bs": 2.54, "d": 5, "age": 6.76, "grav": 49.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 45, "k": 2977, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.409, "fa": 0.42, "gp": 1.102, "bl": 0.96, "ds": 0.0, "txt": "I think I see what you're getting at, but adding \"respectively\" doesn't actually solve the grammatical problem at hand. Your revised sentence:\n\n> I’m glad more people and entities can express themselves in the ways they imagine or generate, respectively\n\nThe issue is that the verb phrase still corresponds to both the noun heads. It sounds like maybe what you wanted was more along the lines of:\n\n> I'm glad people can express themselves in the ways they imagine or, with assisting entities, generate\n\nor\n\n> I'm glad people, using entities, can express themselves in the ways they imagine or generate\n\nOr something to that effect; the critical aspect is decoupling the verb from the two nouns.\n\nIf this is what you had intended to convey then I apologize for misunderstanding. I might still have responded even with this altered wording because I still disagree with the underlying sentiment, but it would be a different discussion entirely."}, {"id": 50674156, "au": "przemub", "dom": 121, "sr": 28, "sc": 3.26, "ep": 3.92, "bs": 0.0, "d": 2, "age": 6.96, "grav": 51.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 583, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.493, "fa": 0.0, "gp": 0.285, "bl": 0.0, "ds": 0.0, "txt": "Yeah. My personal hypothesis is that it's a crossover from the professional environment. For artists it's still mostly unacceptable to replace their creation workflow with GenAI; for us, it's increasingly unacceptable NOT to. As we adapt, we accept this (or even force) in the hobby environment as well so we don't hate our careers and future. lol\n\nI believe it could be a good opportunity to do, as you say, hobby software engineering with no such pressures, but I don't envy good souls who try to deal with all the shitstorm. It should be a pleasant activity after all for all involved."}, {"id": 50674941, "au": "bluefirebrand", "dom": 39, "sr": 29, "sc": 3.13, "ep": 3.79, "bs": 0.0, "d": 7, "age": 4.89, "grav": 32.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 26, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.087, "fa": 0.42, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "> How about stuff that people put a TON of effort into, but they also used AI?\n\nI'd still rather see just about anything else, personally\n\n> A lot of people seem to assume that using AI = being lazy\n\nJust a point of view. Some people view elevators as efficient, some people view them as lazy. Same with cars, power tools, meh\n\nPersonally I just wish we lived in a world that valued human effort more than efficiency\n\nI would rather see projects where people came together and worked hard to build something cool than anything cooked up by one person prompting Claude"}, {"id": 50674242, "au": "fwlr", "dom": 164, "sr": 30, "sc": 3.06, "ep": 4.3, "bs": 0.0, "d": 1, "age": 6.8, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.552, "bl": 0.0, "ds": 0.0, "txt": "The author does not strictly value Atari games in and of themselves. They actually value something more complex and not precisely specified, something that is entwined with and undergirds, but is not identical to, Atari games. Phrases like “the art of making Atari games” and “the Atari game-maker community” are attempts to gesture at the outline of the complex thing.\n\nThe output of an LLM being an Atari game is a completely different thing to the complex thing - not because it is not itself complex, but rather because it is different. (A fireworks show and a drone light show are both visual spectacles in the night sky, and they are each complex in their own right, but they are nevertheless different things.)\n\nIt turns out that for various linguistic and historical reasons, many humans use “I like X” as a shorthand to mean “I like the complex deeper thing entwined with and undergirding X”. This can be confusing if one is unaware of the phenomenon."}, {"id": 50675068, "au": "doug_durham", "dom": 100, "sr": 31, "sc": 3.02, "ep": 3.38, "bs": 0.0, "d": 1, "age": 4.45, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1201, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "Do you say “made with vim and gcc” in the code you write?  The notion that AI is some special magical entity instead of simply a tools baffles me."}, {"id": 50674168, "au": "bentt", "dom": 155, "sr": 32, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 0, "age": 6.93, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2125, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "I'm reminded of the old SNL skit, the All Drug Olympics, where Joe Piscopo attempts to break the world powerlifting record and tears his arms off. \"He's torn his arms off ladies and gentlemen, oh that must be terribly disappointing for the big Russian\"."}, {"id": 50674907, "au": "dodger-dog", "dom": 156, "sr": 33, "sc": 2.86, "ep": 3.96, "bs": 0.0, "d": 0, "age": 4.99, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": -5, "kpp": -0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.604, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "He can't do this: \"Others would argue that AI is the inevitable way forward for retro game development and fully created AI games are just as valid as hand-coded games, the end result is what matters most.\"\n\nBecause \"Also, allowing fully AI programmed games made in a few days alongside games hand-coded games programmed over many months would surely result in justified outcries of inequity.\"\n\nAnd the foundational principle of \"The Atari Homebrew Awards were now challenged to make sure the work of human developers were still honoured amongst the new fully computer coded games.\"\n\nBut, \"justified outcries of inequity\" and why the awards were \"challenged to make sure the work of human developers were still honoured\" are not given any basis. The argument that \"the end is what matters most\" has not been addressed at all.\n\nI'd assume there is a \"game of the year\" and then other games of the year based on characteristics, so it should be a minor thing to adjust some categories.\n\nBut that is not what this is really about; it's a give-up and political statement. Odds are the awards will be several times larger this year, and likely for the next several years. Someone should just pick up the ball and run with it."}, {"id": 50674946, "au": "dodger-dog", "dom": 137, "sr": 34, "sc": 2.85, "ep": 3.58, "bs": 0.0, "d": 2, "age": 4.88, "grav": 32.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": -5, "kpp": -0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.184, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because the human-only category will be weak and low-interest, whereas the AI-assisted and full AI categories will have all the excitement, new members, etc.\n\nThis is a take-your-toys-and-go-home move we are witnessing here."}, {"id": 50674798, "au": "bluefirebrand", "dom": 8, "sr": 35, "sc": 2.82, "ep": 3.7, "bs": 0.0, "d": 2, "age": 5.35, "grav": 36.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 48, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.843, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> However I also think that a lot of these communities need to come to terms with the fact that different people have different ways of enjoying their hobbies. If someone wants to use AI as part of their own personal enjoyment of the hobby, that's fine. Let people enjoy things.\n\nThat's easy to say when you're not the one having to shut down a tradition you enjoyed because AI users can't respect that other people don't want AI submissions in their awards\n\nEdit: seriously, why is this criticism always directed at the no-AI spaces and not at the people using the AI to violate that policy? Is AI just so overpowering that people can't help themselves or something?"}, {"id": 50674770, "au": "dccoolgai", "dom": 33, "sr": 36, "sc": 2.8, "ep": 4.12, "bs": 0.0, "d": 4, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3776, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.696, "bl": 0.0, "ds": 0.0, "txt": "\"there's going to be demand for platforms where they can demonstrate their work in good conscience.\"\n\nI wonder if that's true. Speaking honestly, I haven't really enjoyed most of what gets created by vibing platforms. There are a few isolated exceptions, but I tend to take \"I didn't put much time, thought or effort into creating this\" as a motivation to avoid reading, playing or listening to whatever 'it' is."}, {"id": 50675104, "au": "JKCalhoun", "dom": 98, "sr": 37, "sc": 2.72, "ep": 3.82, "bs": 0.0, "d": 0, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 24496, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.492, "fa": 0.0, "gp": 0.213, "bl": 0.0, "ds": 0.0, "txt": "Guilty!\n\nI vibe-coded a demo app for the KIM-1 recently just to see if an LLM could do it.\n\nThen I vibed three games because I had ideas I wanted to see realized (and did not want to spend the time it would take to hand-code them).\n\nAn interesting thing came from the exercises. One game ended up not making the cut. In the end it was kind of lame and did not live up to my standards—so I binned it.\n\nOthers took a lot of iterations before they landed. I mean this is just the way game development goes—hit and miss, sometimes round and round.\n\nBut the fast iteration was what fascinated me. In fact I am inclined now to (re)write, from scratch (by myself, without looking at the LLM code) one of the games. And I know already that I will be happy with the game itself. It will not be time wasted."}, {"id": 50675695, "au": "morsch", "dom": 10, "sr": 38, "sc": 2.7, "ep": 3.58, "bs": 0.0, "d": 4, "age": 2.04, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 11403, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.097, "fa": 0.28, "gp": 0.14, "bl": 0.0, "ds": 0.0, "txt": "I like your idea of considering other hobbies e.g. woodworking. Documenting your work is a great approach. Although I suppose inevitably somebody will tell their agent to fake the evidence.\n\nIs there anything we can learn regarding policies? Presumably there are woodworking communities that only use hand tools, but at the same time many members will also own a table saw. Is it \"okay\" to use your table saw to make a specialized hand tool?"}, {"id": 50674262, "au": "mmaunder", "dom": 162, "sr": 39, "sc": 2.7, "ep": 3.8, "bs": 0.0, "d": 0, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 17970, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.394, "bl": 0.0, "ds": 0.0, "txt": "“Since the options of full AI exclusion, full AI inclusion or determining an AI cutoff for qualification were all unfeasible, there seemed to be no easy way forward for the Atari Homebrew Awards this year.”\n\nThe only option is full AI inclusion at any amount, because the majority uses AI, and the majority of code is now AI, and it’s not reliably detectable. But the organizer isn’t open to that, so the only other option is to cancel the event until they change their mind. This is how it is, and will be from now on. Change is hard."}, {"id": 50674349, "au": "ComplexSystems", "dom": 171, "sr": 40, "sc": 2.57, "ep": 3.96, "bs": 0.0, "d": 0, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 1430, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "While I respect the right of this guy to do whatever he wants, I admit that every time I see this kind of thing posted on Hacker News I always think the same thing: am I the only person left in the world who just does not care if people use AI to write code?\n\nAren't most developers using this stuff? Even if you like getting into super deep DSP wizardry of the sort needed to get stuff running on Atari, aren't you still at least using these things to check bugs and automate boilerplate and stuff? And if not, if you hate using them, that's fine, but is it really that bad if other people do?"}, {"id": 50674113, "au": "spankibalt", "dom": 194, "sr": 41, "sc": 2.54, "ep": 3.64, "bs": 0.0, "d": 1, "age": 7.07, "grav": 52.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 16, "k": 917, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.04, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Would it not make more sense to just require entrants to collaborate during the dev process?\n\nUmm... no? Just because you're a \"lone wolf\", doesn't mean you're a cuckcoder.\n\nAnd the latter category can still have their own awards where their LLM-avatars watch an autogenerated ceremony where LLMs judge their autogenerated entries."}, {"id": 50674143, "au": "the_af", "dom": 94, "sr": 42, "sc": 2.48, "ep": 3.58, "bs": 0.0, "d": 2, "age": 6.99, "grav": 52.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Which ones are chugging along just fine? I'm a regular in hobby and art communities, and it's an ongoing fight to keep AI slop out. A losing fight, too. Not sure why some people want AI to invade everything, and get really loud when admins tell them it's forbidden in a specific community.\n\nAn example of what I mean is the large number of fake crafting tutorials invading every hobby group. Fake, but very realistic, \"how to\" tutorials of people building dioramas, etc, with every step faked and the end result often as well. People posting photos of their \"dioramas\" which are AI generated. It boggles the mind."}, {"id": 50674355, "au": "Skyy93", "dom": 64, "sr": 43, "sc": 2.47, "ep": 4.28, "bs": 0.27, "d": 7, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 5, "k": 208, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.089, "fa": 0.42, "gp": 0.36, "bl": 0.1, "ds": 0.0, "txt": "Nobody knows? Also when you enter an environment that is fully on agentic coding  they care even less.\n\n>What is special about prompting?\n\nAlso this is a somewhat strange statement, do you think everyone that just types in \"yeah btw prove the riemann hypothesis, make no mistakes lol\" gets the result Alpöge got?"}, {"id": 50674668, "au": "bsder", "dom": 129, "sr": 44, "sc": 2.44, "ep": 3.54, "bs": 0.0, "d": 2, "age": 5.77, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 18, "k": 18963, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 0.998, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> How can someone submit AI slop to a hobby game contest and not be immediately ostracized? What the heck?\n\nBecause the volume of AI submissions means that you can't even effectively wade through them let alone punish the submitters.\n\nThis is the job search problem writ smaller--the submitters used AI so then the receivers used AI which means that the submitters needed to use MORE AI etc."}, {"id": 50674484, "au": "OptionX", "dom": 153, "sr": 45, "sc": 2.43, "ep": 3.68, "bs": 0.0, "d": 1, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 561, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.083, "fa": 0.34, "gp": 0.115, "bl": 0.0, "ds": 0.0, "txt": "People would just submit AI content to the non-AI category. It has happened before in other venues and would happen here and there is no good way to 100% being able to tell so there would be a lot of false negatives and, worse yet, false positives.\n\nJust a shitshow waiting to happen and why we can't have nice things."}, {"id": 50674512, "au": "userbinator", "dom": 158, "sr": 46, "sc": 2.42, "ep": 3.08, "bs": 0.0, "d": 0, "age": 6.19, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 91629, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": ["https://news.ycombinator.com/item?id=49226923", "https://news.ycombinator.com/item?id=50136637", "https://news.ycombinator.com/item?id=50460154"], "ig": 0.468, "fa": 0.62, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "So much pearl-clutching. I was a long-time skeptic of AI, but after seeing how much it's helped make things possible for the retrocomputing community[1][2][3][4], which before AI already had far more ideas than the time, effort, or knowledge to execute on them, I've flipped my opinion completely.\n\n[1] https://news.ycombinator.com/item?id=49226923\n\n[2] https://news.ycombinator.com/item?id=50136637\n\n[3] https://news.ycombinator.com/item?id=50460154\n\n[4] https://news.ycombinator.com/item?id=49501611"}, {"id": 50673991, "au": "0_____0", "dom": 1, "sr": 47, "sc": 2.24, "ep": 3.26, "bs": 0.0, "d": 0, "age": 7.31, "grav": 55.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 4115, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.862, "fa": 0.0, "gp": 0.852, "bl": 0.0, "ds": 0.0, "txt": "I have the utmost respect for people who are able to walk away from projects when the conditions that they were built on no longer exist. It requires a clarity about what you were actually trying to achieve in the first place, rather than a commitment to keep doing something that looks like the thing you did before.\n\nGodspeed."}, {"id": 50674172, "au": "k0dyn", "dom": 80, "sr": 48, "sc": 2.2, "ep": 3.74, "bs": 0.0, "d": 1, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 11, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.136, "fa": 0.0, "gp": 0.741, "bl": 0.0, "ds": 0.0, "txt": "I know nothing of this particular community, but I would speculate that writing/porting these games has historically required a decent bit of skill, and resulted in some level of prestige/respect for those doing the work. The fact that there was an 'Awards' inclines me to believe this.\n\nIf that was the case, why wouldn't someone who saw the prestige those developers earned - upon seeing an avenue to pursue it themselves - do so?\n\nI'm not expressing an opinion on the morality or correctness of such behaviour, merely noting a potential reward function / motivation."}, {"id": 50675873, "au": "matsemann", "dom": 13, "sr": 49, "sc": 2.12, "ep": 3.67, "bs": 0.0, "d": 3, "age": 1.39, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.338, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "For me it's the opposite: think of it as some people meeting every Sunday for a nice bike ride. It's social and fun. Then some people show up on motorcycles. \"It's the future, deal with it\" they say as they make a lot of noise and drown out everything we used to like.\n\nIt's not existing members switching, it's new members coming into existing spaces and taking over. You can call it gatekeeping if you want, but doesn't change who's doing the faux pas. Why couldn't the ai bros / motorcyclists make their own spaces? Is it because they want the recognition of the non-assisted ways?"}, {"id": 50674170, "au": "glimshe", "dom": 132, "sr": 50, "sc": 2.0, "ep": 3.1, "bs": 0.0, "d": 0, "age": 6.93, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.197, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "LLMs enriched the retro computing community more than anything that has ever touched it. Despite the many talented authors over the years, what I'm seeing now is the stuff of dreams.\n\nIts his competition so it's his call. While this is a retro award, it wouldn't hurt to be more forward thinking.\n\nI don't care if a retro game has been entirely done with AI. If it's a good game/conversion, that's all that matters to me."}, {"id": 50674074, "au": "ipaddr", "dom": 163, "sr": 51, "sc": 1.99, "ep": 3.38, "bs": 0.0, "d": 0, "age": 7.13, "grav": 53.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 8372, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.018, "fa": 0.0, "gp": 0.684, "bl": 0.0, "ds": 0.0, "txt": "\"was not interested in allowing fully non-human programmed games into the AHAs, I needed to determine what level of AI allowance would be appropriate\"\n\nWhy if the output is an Atari game?  Using an llm to make a game is still hard."}, {"id": 50674773, "au": "bwoodward", "dom": 99, "sr": 52, "sc": 1.99, "ep": 3.38, "bs": 0.0, "d": 0, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1336, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "I had a real argument in a chatroom the other day about simply disclosing that an app or script was vibe coded. The others didn't think it was necessary... which is crazy.\n\nI wish people would just be honest about the use. In this case it would be as simple as having a separate category."}, {"id": 50675057, "au": "simonw", "dom": 40, "sr": 53, "sc": 1.98, "ep": 4.37, "bs": 0.85, "d": 8, "age": 4.51, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.625, "fa": 0.0, "gp": 0.377, "bl": 0.32, "ds": 0.0, "txt": "I do understand where you're coming from here, and I, too, value human effort. I have no interest in AI-generated art, music, poetry, or fiction writing precisely because the human connection is the thing I care about there. I have no interest in reading a novel that the author couldn't be bothered to write.\n\nI don't have that feeling about code. I've been trying to figure out why that is.\n\nThe AI-in-games backlash concerns me, because building a game is so hard. It's common for indie game developers to spend years of their lives and tens or hundreds of thousands of dollars on a game which gets no traction at all. I get the impression that's the expected default in that space.\n\nWhen we say \"you shouldn't use AI for game development or asset creation\" we're effectively saying \"you need to struggle\". Why are we inflicting that on people who want to make a game? Why should an indie game developer have to spend months wrestling with low-level engine code and cranking out 3D assets for 15 different variants of bookshelf?"}, {"id": 50674407, "au": "bananaboy", "dom": 84, "sr": 54, "sc": 1.92, "ep": 3.46, "bs": 0.0, "d": 1, "age": 6.45, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1130, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.045, "fa": 0.0, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "I'm seeing a ton of stuff being vibe coded or ported by people who don't know how to program or don't know or want to learn the deep technical details. I've even seen comments like \"I don't know C or assembly and I don't want to learn them\". Personally I find it disappointing and even a bit demoralising, although it's not going to stop me from doing my thing in my own way."}, {"id": 50674169, "au": "UqWBcuFx6NV4r", "dom": 143, "sr": 55, "sc": 1.82, "ep": 3.14, "bs": 0.0, "d": 4, "age": 6.93, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 713, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.114, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "In DAYJOB code reviews i’ll flag when I think that the author has let Claude take the reins too much on something important, because I see too much Claude in what’s been submitted. It’ll be obvious to me, but reading the code, talking about it, etc is still very very tiring. I can’t fault anti e for wanting to avoid it all costs."}, {"id": 50674217, "au": "none_to_remain", "dom": 124, "sr": 56, "sc": 1.82, "ep": 3.35, "bs": 0.0, "d": 2, "age": 6.84, "grav": 50.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 790, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.337, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Because you can't practically exclude AI-assisted coding.\n\nPersonally I would just roll with it and let it be an AI-assisted competition, but this person doesn't care to do that. And even if it continued it would be something different, hardly a coding competition, now entirely idea and design.\n\nPerhaps if the \"handover\" faction gets their way you could have the contest again, with the panopticon machines of loving grace attesting that they provided no aid to their pets."}, {"id": 50676012, "au": "etatester", "dom": 107, "sr": 57, "sc": 1.82, "ep": 3.29, "bs": 0.0, "d": 1, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 256, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Meh. What matters and has always mattered are the underlying skills. There are tons of excruciatingly-bad services online built by humans with admin:admin entries.\n\nGovernment websites (those should really be reliable) are the best/worst example of this. Human-made, made of crap."}, {"id": 50674689, "au": "MBCook", "dom": 56, "sr": 58, "sc": 1.82, "ep": 3.8, "bs": 0.53, "d": 8, "age": 5.69, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.167, "fa": 0.28, "gp": 0.177, "bl": 0.2, "ds": 0.0, "txt": "I’m no game developer. I only tinkered once or twice. It was just another thing to try, like making a bit of an OS or whatever other random project tickled my fancy at the moment.\n\nMy interest in making games goes no further than I’m a programmer and I like video games. I have no real drive or inclination towards it at all, but I tinkered with it once or twice because why not.\n\nMy “engines” were always rather simple. I was targeting early 80s arcade or simple NES level complexity, never anything more."}, {"id": 50674062, "au": "jordanb", "dom": 5, "sr": 59, "sc": 1.82, "ep": 3.19, "bs": 0.0, "d": 0, "age": 7.17, "grav": 54.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 10214, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.532, "fa": 0.0, "gp": 1.34, "bl": 0.0, "ds": 0.0, "txt": "It's crazy. I considered the vintage computing community to be immune to AI since that's really the only community writing software just for the fun of software and using simple computers.\n\nLike, nobody needs a port of an obscure TRS 80 game to Amiga, people do it because it's a fun exercise.\n\nI would think there would be no other community to see the learning of the machine's interfaces and the writing of the software as being the point of the exercise."}, {"id": 50674427, "au": "cheschire", "dom": 176, "sr": 60, "sc": 1.82, "ep": 3.11, "bs": 0.0, "d": 1, "age": 6.41, "grav": 46.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 6401, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.323, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those of us that don’t care just aren’t up in arms in the comments. We are off fucking around and building neat things rapid fire and then deleting them and moving onto the next momentary flash of inspiration.\n\nSo you’re not alone. Just ignore the people solving “really important” questions about what even is creativity and lamenting repeatedly in comments about it."}, {"id": 50674398, "au": "XenophileJKO", "dom": 57, "sr": 61, "sc": 1.82, "ep": 3.09, "bs": 0.0, "d": 5, "age": 6.47, "grav": 46.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 942, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "I think the funny thing to me is that all of this is focusing on the programming.\n\nSure that is hard, but it is only like half the battle. Even with an LLM making a fun game that is a unique and artistic is not automatic.\n\nIt is obvious that people who think having an LLM aromatically makes it easy clearly have not created games with LLMs.\n\nThey remove barriers of the medium which in this case is what the host was complaining about, but they don't make award winning games in my experience. Not without significant designer thought."}, {"id": 50676008, "au": "westcoast49", "dom": 42, "sr": 62, "sc": 1.82, "ep": 3.06, "bs": 0.0, "d": 10, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 36, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I do not agree with this. You can use AI, I think, with exactly the precision level that you want to. If you want to use it just to write a single if-then block, then you can. If you want to use it to write a whole function, you can. If you want to use it to write a whole class or code file, you can. And indeed, if you want to use it to write a whole game, effectively, you can also, in many cases, the way that the tools work today. But the choice of which precision you want to use the tool at is yours entirely. And I guess that's part of Simon's point as well. It is a tool. And as long as you use it consciously, I do not see any reason why we should be making blanket statements about the usage of it in software development."}, {"id": 50674047, "au": "humblefly", "dom": 114, "sr": 63, "sc": 1.82, "ep": 5.57, "bs": 2.52, "d": 1, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.44, "fa": 0.28, "gp": 0.959, "bl": 0.95, "ds": 0.0, "txt": "And frankly, weird. I don't know why our community is doing this.\n\nTake a look at artists. Gen AI can make believable photos and paintings, but no one is throwing their easel on the ground. There are no debates about how much AI is OK in watercolor contests. The obvious answer is zero. No gray areas - if you get caught, you get the boot, end of story.\n\nIn hobby software engineering, in contrast, we resign ourselves to the position that there's nothing that can or should be done. How is that OK? How can someone submit AI slop to a hobby game contest and not be immediately ostracized? What the heck?"}, {"id": 50674474, "au": "ThrowawayR2", "dom": 65, "sr": 64, "sc": 1.82, "ep": 3.04, "bs": 0.0, "d": 8, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 9296, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.953, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The post specifically mentions \"...with some developers even releasing multiple games a week with the aid of AI.\" so there was clearly very little human creativity being put in."}, {"id": 50674939, "au": "Aurornis", "dom": 9, "sr": 65, "sc": 1.82, "ep": 3.02, "bs": 0.0, "d": 3, "age": 4.89, "grav": 32.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.762, "fa": 0.28, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "I wasn't criticizing the competition. I agree that it's sad that they can't easily separate out of the no-AI submissions, which is why I talked about the ways my other hobbies have already established more proof of work for these things.\n\nAlso I suggest re-reading the actual forum post, because one of the things they were struggling with was that most of the coders were using AI in some way, so they were having a hard time even drafting policies about AI use. For example, if coders wrote the code themselves but then used AI for testing, would that violate the policy? If they used AI to audit the code or ask for advice, did that violate the policy?\n\nThis wasn't a simple case of the bad AI coders infiltrating a no-AI space. The problem was that their space was not actually a no-AI space at all. Using AI was common in the space, but people used it at different levels.\n\nSo this isn't a simple battle between the no-AI people and the AI people. AI is already part of this space and its use is widespread."}, {"id": 50674343, "au": "tclancy", "dom": 88, "sr": 66, "sc": 1.82, "ep": 3.01, "bs": 0.0, "d": 1, "age": 6.6, "grav": 48.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 5646, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 1.195, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "That cuts both ways though. As some one whose favorite Christmas present of all time a an Atari 2600, I’d be interested to see how far the medium could be pushed. The reason Activision games were the best was the best of Ataris coders got out of the hot tub and pushed the envelope. It would be fascinating to see how interactive or how nice looking games could be on this constrained platform. Why do I have to treat it like it’s a religious icon? For the record, my wee shrine is in the basement closet, rarely used. But if I could spin up a sexy Custers Revenge, who knows how often I’d beat it?"}, {"id": 50675299, "au": "DaiPlusPlus", "dom": 101, "sr": 67, "sc": 1.82, "ep": 2.98, "bs": 0.0, "d": 2, "age": 3.46, "grav": 21.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 15, "k": 9518, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 0.436, "fa": 0.42, "gp": 0.523, "bl": 0.0, "ds": 0.0, "txt": "> The notion that AI is some special magical entity instead of simply a tools baffles me.\n\nBut AI is a special magical entity, compared to tools like a text-editor: they make decisions, assumptions, and the whole end-product for you if you have tokens to burn; but the AI isn't legally a person (yet) so taking responsibility for its output is still your job."}, {"id": 50675092, "au": "yieldcrv", "dom": 187, "sr": 68, "sc": 1.82, "ep": 2.94, "bs": 0.0, "d": 8, "age": 4.36, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve seen some things, and researchers have seen other things\n\nLets just table this and revisit this next year so we can give the language and wording some time to consolidate around a more shared understanding, even with philosophical differences on how we want to participate in this world, a shared understanding is the first step"}, {"id": 50674899, "au": "simonw", "dom": 34, "sr": 69, "sc": 1.82, "ep": 2.8, "bs": 0.0, "d": 5, "age": 5.03, "grav": 33.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.192, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Right, but we're rapidly going beyond the \"I didn't put much time, thought or effort into creating this\" phase.\n\nThere are people out there who have been working on vibe coded game projects for 6 months+ at this point. They've put a TON of thought and effort into creating them - but that thought and effort went into game design and iteration, not figuring out how to manually create the code and assets."}, {"id": 50674654, "au": "phkahler", "dom": 91, "sr": 70, "sc": 1.82, "ep": 2.78, "bs": 0.0, "d": 1, "age": 5.81, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 24044, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "Another reason to do these things is to see what old systems are capable of. Where the code came from could be of secondary importance if you're trying to push hardware to its limit.\n\nI've been trying with the idea of pushing my old Interact Home Computer to see what it might have been if the company didn't go under. But there are probably only 25 of them still functioning and nobody cares. But with AI I might just try it when I have some time."}, {"id": 50676078, "au": "makerofthings", "dom": 87, "sr": 71, "sc": 1.82, "ep": 2.77, "bs": 0.0, "d": 1, "age": 0.68, "grav": 5.9, "surf": 9.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 735, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "AI has lowered the bar for entry to communities like this to a very, very low level. The difficulty of participating before AI limited entries to people who really cared and had invested the time necessary to learn. AI is the Eternal September of the whole world."}, {"id": 50674550, "au": "Seattle3503", "dom": 192, "sr": 72, "sc": 1.82, "ep": 2.76, "bs": 0.0, "d": 2, "age": 6.11, "grav": 43.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2437, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.176, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm in a lot of book communities, and for the most part I haven't seen the generators run their own communities successfully. They generally try to include themselves in the communities for human writing. I think most people who are generating \"art\" are self-absorbed, in love with their own idea, and not interested in the selfless work necessary to build community."}, {"id": 50675157, "au": "ipaddr", "dom": 166, "sr": 73, "sc": 1.82, "ep": 2.76, "bs": 0.0, "d": 2, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8372, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 1.175, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Before llms people were copying other codebases and using frameworks why draw the line at llm code generators.\n\nHe should just judge every submission like he normally did and let the best codebase vibes win."}, {"id": 50674195, "au": "the_af", "dom": 75, "sr": 74, "sc": 1.82, "ep": 2.75, "bs": 0.0, "d": 4, "age": 6.88, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I thought about this, but who would brag -- outside of the very specific community where such bragging would be warranted -- about writing an Atari or C64 retro game? Most employers wouldn't even care or be impressed. I knew a guy who had a mini museum of retro computing in his house, and knew tons about the circuitry of old computers, and when layoff season came he was one of the first to go; his employers simply didn't care about his knowledge of retro computers (which, admittedly, didn't exactly come in handy for writing ReactJS)."}, {"id": 50674596, "au": "pigeons", "dom": 86, "sr": 75, "sc": 1.82, "ep": 2.72, "bs": 0.0, "d": 2, "age": 5.97, "grav": 41.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 900, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.334, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There is a supported 6502 CollapseOS right? I know its not identical to a c64 port but a different ballgame than vibecoding a 2600 game"}, {"id": 50674164, "au": "MBCook", "dom": 169, "sr": 76, "sc": 1.82, "ep": 3.15, "bs": 0.53, "d": 1, "age": 6.94, "grav": 51.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 1.002, "fa": 0.28, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "People can make competitions that allow AI. People can make competitions specifically FOR AI creations.\n\nThis person is choosing not to continue the competition because unless they choose “anything goes”, which is not what they want, the task of running it is effectively impossible."}, {"id": 50674031, "au": "sublinear", "dom": 193, "sr": 77, "sc": 1.82, "ep": 2.59, "bs": 0.0, "d": 0, "age": 7.23, "grav": 54.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4179, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Would it not make more sense to just require entrants to collaborate during the dev process?\n\nAI does change things, but not that much. The era of \"big reveals\" and \"lone wolves\" is over, but that's no reason to lose focus and shut down the broader idea. The community was the whole point wasn't it?"}, {"id": 50674153, "au": "MBCook", "dom": 115, "sr": 78, "sc": 1.82, "ep": 2.59, "bs": 0.0, "d": 2, "age": 6.98, "grav": 52.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.649, "fa": 0.0, "gp": 0.734, "bl": 0.0, "ds": 0.0, "txt": "You’re assuming they can’t celebrate it because they don’t think AI should ever be used.\n\nGP may have meant that they can’t celebrate it because you can’t even tell what is a human achievement anymore and what isn’t.\n\nThe second one is my view. You can use AI to make your own game if you want. But people should be able to have contests with limits, like you have to make the game yourself. That seems like an extremely fair thing to exist.\n\nAnd thanks to the tragedy of the commons, now we can’t."}, {"id": 50674161, "au": "sojournerc", "dom": 189, "sr": 79, "sc": 1.82, "ep": 2.59, "bs": 0.0, "d": 3, "age": 6.95, "grav": 51.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1052, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 1.1, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I cannot parse your second paragraph. Writing and thinking for oneself is now, more than ever, an important skill for real humans. Having to sift through half-ideas from reverse centaurs is not something I envy anyone."}, {"id": 50676261, "au": "thrance", "dom": 103, "sr": 80, "sc": 1.81, "ep": 2.5, "bs": 0.0, "d": 2, "age": 0.06, "grav": 3.7, "surf": 7.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3173, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.992, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Come on... vim and gcc didn't allow for outputting multiple atari games a week. And programmers who used this tool could still walk you through what they wrote and why, not so much with vibe coded projects."}, {"id": 50674377, "au": "Seattle3503", "dom": 150, "sr": 81, "sc": 1.81, "ep": 2.46, "bs": 0.0, "d": 0, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2437, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "The note mentions detection. Pangram works quite well on prose, and it seems fine for detecting AI code. But I don't know how easy it would be to deterministically re-write c
