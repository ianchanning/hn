ode to something semantically equivalent to evade detection."}, {"id": 50674649, "au": "LastTrain", "dom": 92, "sr": 82, "sc": 1.81, "ep": 2.4, "bs": 0.0, "d": 1, "age": 5.82, "grav": 40.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 2292, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.61, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is easy to romanticize it, but as a sometimes member and contributor w/ a couple 2600 titles under my belt, that community it is chock full of both good helpful people as well as gate-keeping dickheads of the highest order. I personally would not be interested in using AI to do retro programming, but I'm also aware that the vast majority of souls on this earth are not interested in retro programming with or without AI."}, {"id": 50674774, "au": "MiroslavPokorny", "dom": 170, "sr": 83, "sc": 1.81, "ep": 2.37, "bs": 0.0, "d": 2, "age": 5.43, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 385, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes I appreciate their motivations, i was just askin a side question about the types of creativity or lack thereof i suspect that AI is enabling."}, {"id": 50674103, "au": "StilesCrisis", "dom": 165, "sr": 84, "sc": 1.81, "ep": 2.37, "bs": 0.0, "d": 1, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1734, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.788, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "If you read the rest I think that's answered pretty well. Your standard is \"any amount of AI is OK.\" For others, they expect a person receiving the award to have actually MADE the game and not just asked a robot to make it. For still others, even using AI to test or debug is too far."}, {"id": 50674201, "au": "Morromist", "dom": 77, "sr": 85, "sc": 1.81, "ep": 2.31, "bs": 0.0, "d": 3, "age": 6.87, "grav": 50.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 699, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.983, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't understand either but its clear that some of the people \"recompiling\" old games are doing it for engagement/clout. What this engagement/clout will actually get them is a mystery to me.\n\nI guess you can say \"I'm the first person who got Fire Pro Wrestling: Iron Slam '96 recomplied for PC\" and put it on your resume and people will see that you are, indeed, someone who uses LLMs to do weird stuff and maybe hire you.\n\nCoding games for the C64 or something is even more obscure, but maybe the same motivations apply?"}, {"id": 50676111, "au": "dvfjsdhgfv", "dom": 23, "sr": 86, "sc": 1.81, "ep": 2.25, "bs": 0.0, "d": 3, "age": 0.55, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 14, "k": 6924, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.45, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> There's an appeal of \"I've always wanted to do X, but never had the capability\".\n\nI believe it's more \"I always wanted X to exist\", where X is a very specific thing. Because frankly I still don't have the capability, and I won't have the sense of achievement when an LLM builds it."}, {"id": 50675897, "au": "meheleventyone", "dom": 41, "sr": 87, "sc": 1.81, "ep": 2.23, "bs": 0.0, "d": 9, "age": 1.3, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 58, "k": 6034, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.441, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> When we say \"you shouldn't use AI for game development or asset creation\" we're effectively saying \"you need to struggle\". Why are we inflicting that on people who want to make a game? Why should an indie game developer have to spend months wrestling with low-level engine code and cranking out 3D assets for 15 different variants of bookshelf?\n\nNo one does that’s why game engines and asset stores are a thing.\n\nWhat people do want is soul in their entertainment and art. That’s something that comes from caring. The problem AI presents is that it’s easy to create without care. Hence so much slop and a backlash against it."}, {"id": 50674194, "au": "Skyy93", "dom": 95, "sr": 88, "sc": 1.81, "ep": 2.39, "bs": 0.27, "d": 3, "age": 6.88, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 208, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 0.939, "fa": 0.0, "gp": 0.125, "bl": 0.1, "ds": 0.0, "txt": "The last part about the fake crafting tutorials and \"how-to\" videos seems like something they do to make money, such as through YouTube ad revenue.\n\nI would argue that as soon as money or the chance to use recognition for personal gain is involved, people will be drawn to using AI for their own benefit."}, {"id": 50674091, "au": "przemub", "dom": 191, "sr": 89, "sc": 1.81, "ep": 1.97, "bs": 0.0, "d": 1, "age": 7.11, "grav": 53.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 583, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 0.837, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We entered a new era where coordinating a contest like this is going to be much more effort than churning out even multiple game ROMs. Will the participants be willing to put in that effort? We'll see."}, {"id": 50674432, "au": "Seattle3503", "dom": 172, "sr": 90, "sc": 1.81, "ep": 1.95, "bs": 0.0, "d": 1, "age": 6.38, "grav": 45.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2437, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.73, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "If you care about the art form of handwriting code you care. AI industrially generates code. Submitting AI work is like showing up to a blacksmith competition with machined work."}, {"id": 50675056, "au": "doug_durham", "dom": 148, "sr": 91, "sc": 1.81, "ep": 1.88, "bs": 0.0, "d": 0, "age": 4.52, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1201, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "The purpose of games are to be fun and to engage your imagination and emotions.  If a game does this who cares how it is written.  All of the games are the product of a human.  It seems like if you weight these qualities you can find games that are worthy of awarding."}, {"id": 50674267, "au": "phoghed", "dom": 140, "sr": 92, "sc": 1.81, "ep": 1.88, "bs": 0.0, "d": 4, "age": 6.77, "grav": 49.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1048, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.799, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are they slop factories or PEDs? I can’t keep up with the discourse surrounding LLM software development.\n\nIf they are PEDs I guess you just model it after body building competitions."}, {"id": 50675534, "au": "cpldcpu", "dom": 16, "sr": 93, "sc": 1.81, "ep": 3.27, "bs": 1.44, "d": 1, "age": 2.65, "grav": 15.9, "surf": 3.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 28, "k": 664, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.695, "fa": 0.42, "gp": 0.303, "bl": 0.545, "ds": 0.0, "txt": ">I considered the vintage computing community to be immune to AI since that's really the only community writing software just for the fun of software and using simple computers.\n\nI think its exactly the opposite. The entire point of this community is to develop retro software as an intellectual challenge. Finding new coding tricks on very limited hardware and taking it to heights unimaginable when the hardware was released. The product was hard earned, but the way to it is what counted.\n\nNow that AI takes out the challenging part, it completely changes the nature of this activity and make it largely pointless. Also compare to the demoscene.\n\nOf course there are also pure consumers of retro-games, but with an abundance of good productions, the focus is completely lost."}, {"id": 50674744, "au": "spaqin", "dom": 45, "sr": 94, "sc": 1.81, "ep": 1.81, "bs": 0.0, "d": 4, "age": 5.51, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 622, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.55, "fa": 0.0, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "Cool thing to see for few minutes, sure; but there's no easy way to appreciate forever the things you've learned along the way - to be able to explain what quirks of the hardware were exploited to get some extra capabilities or performance.\n\nOn the other hand, you wouldn't even come up with the idea unless you were somewhat involved before - knowing the tricks first to string them together into a working demo."}, {"id": 50674563, "au": "MBCook", "dom": 58, "sr": 95, "sc": 1.76, "ep": 2.29, "bs": 0.53, "d": 6, "age": 6.08, "grav": 43.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.976, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "That’s not the point to them though. The original post never said it was easy.\n\nIt’s fine to remove barriers to the medium. But that makes it way, way harder to run a contest, especially if you care to know how much was done by an LLM.\n\nNowhere in the article did it say that no one should be using them. Now where did it say LLMs were bad."}, {"id": 50674581, "au": "MBCook", "dom": 144, "sr": 96, "sc": 1.67, "ep": 2.2, "bs": 0.53, "d": 5, "age": 6.02, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.822, "fa": 0.0, "gp": 0.188, "bl": 0.2, "ds": 0.0, "txt": "Yeah, I know what you mean. I’ve seen the same thing.\n\nI don’t know what the Atari scene is like but I wouldn’t expect a lot of really polished games. Between how hard it is to program the system and how incredibly limited it is, I could see it being possible that it has gotten hard to tell the difference between slop and hand-coded by newer retro programmers."}, {"id": 50674078, "au": "phoghed", "dom": 138, "sr": 97, "sc": 1.54, "ep": "gp": 0.832, "bl": 1.92, "ds": 0.0, "txt": "In another comment you wrote \"I'm sorry to be hostile I feel I live in world hostile to craftsmanship and appreciation thereof\".\n\nI do not think your arguments make you hostile, but how you engage with critic or comments that you do not seem to like. In this discussion you only look for one talking point you can somehow make convenient for your case.\n\nYou might think that IKEA is similar to McDonald's. However, there are many other brands that also manufacture furniture. They are more expensive, of course, but they are still mass-produced and of a higher quality. Also when you look at the number of carpenter for furniture in particular, did their numbers raise or decreased over the last decades? And that is without the AI hype.\n\nIndustrial manufacturing and the scale it brings already took many jobs and people out of crafts. Currently you sound like someone who just wants to go back to the old fashioned ways where we did not have these abilities. The only reason why these crafts still exist, similar to Michelin star restaurants with humans, is that till now it was not in reach for someone to take a profit out of it with automation. This was true for many different kind of jobs that are now gone.\n\nPerhaps there is a small niche market in the future for people that want genuine handcrafted items, but it will never be as big as in the 1950,60,70,80,90,00,10s... .\n\nAlso the case wi"}, {"id": 50674824, "au": "bluefirebrand", "dom": 37, "sr": 110, "sc": 1.12, "ep": 1.12, "bs": 0.0, "d": 5, "age": 5.27, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.478, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's hard enough to find the time to engage meaningfully with all of the work online made by people who put in a lot of blood sweat and tears\n\nI have zero patience for the stuff that people put little to no effort into. Who has time to spend on projects that the builder themselves didn't have the time for until AI?"}, {"id": 50674086, "au": "sublinear", "dom": 93, "sr": 111, "sc": 1.1, "ep": 1.1, "bs": 0.0, "d": 1, "age": 7.12, "grav": 53.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 4179, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.468, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is immune for the exact reasons you laid out. If they don't want to pivot away from competition towards running an incubator, that's their call though.\n\nPlenty of other communities are still chugging along just fine and not tripping about AI."}, {"id": 50674403, "au": "solyin", "dom": 53, "sr": 112, "sc": 1.1, "ep": 1.1, "bs": 0.0, "d": 5, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 783, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.392, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "fun? I know doing that is antithetical to this forum, but making the whole game - there's a saying in the games industry, \"There are two types of game developers: those who make games, and those who make game engines.\" (Maybe that's no longer true. I am working on a game engine.)"}, {"id": 50674373, "au": "Aurornis", "dom": 25, "sr": 113, "sc": 1.01, "ep": 1.01, "bs": 0.0, "d": 3, "age": 6.52, "grav": 47.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.357, "fa": 0.0 , "bl": 1.28, "ds": 0.0, "txt": "Thank you, I appreciate that, the only additional thing I was also factoring in was agents generating things without being prompted by people, fully autonomously deciding to generate something new instead of waiting for a session\n\nThere are people here that would have corrected me about that too, if I had assumed people being assisted are the only ways LLMs act\n\nI can almost see how to write about my enthusiasm or at least observations while fully encompassing all the sentiments"}, {"id": 50674455, "au": "Skyy93", "dom": 67, "sr": 136, "sc": -0.41, "ep": 1.28, "bs": 1.7, "d": 9, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 208, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "I think you are not really answering to what I wrote. You are trying to make a point that its a difference between doing something by hand vs doing it by bot, where I agree. However, my point the whole time was to explain why people are doing it with a bot.\n\nIn general the argument \"takes actual skill and deep knowledge\" is true for many outdated crafts, like blacksmithing, leatherworking or handling horses. However, most of people do not do it and rely on easy to use tools and machines to do so and are very happy with the results. This is how technology changes the world, you can like it or not, but I think there is now way on going back.\n\nFor this specific community they perhaps find a format that gets the people to not use AI, or it will die. Nothing is forever."}, {"id": 50674644, "au": "pigeons", "dom": 119, "sr": 137, "sc": -0.42, "ep": 0.77, "bs": 1.19, "d": 5, "age": 5.83, "grav": 40.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 900, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme  know about my craft.\n\nI heard this so often the last couple of years. Till now everyone was wrong then they said this. AI can never do scientific discovery, protein folding, proving something humanity struggles for years, steer a robot, ... there are many cases. I would not rely on this argument.\n\n>Digging deep into the challenge of a thing for the sake of the challenge, not about filling your resume with bullshit accomplishment.\n\nThis is YOUR view, other do it for other reasons, is thus their view wrong?\n\n>When you need a cabinet, come talk to me about my outdated craft.\n\nI ask Ikea ;) I do not want to offend you. However, many people are seeing themself and their craft as something very important, which is true in their own life, but not overall."}, {"id": 50675083, "au": "bitwize", "dom": 48, "sr": 164, "sc": -3.61, "ep": 0.63, "bs": 4.24, "d": 5, "age": 4.41, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 13, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.266, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Checkmate, nerds! The idea guys have won! Is this the future you wanted?"}, {"id": 50675362, "au": "suddenlybananas", "dom": 35, "sr": 165, "sc": -3.63, "ep": 0.61, "bs": 4.24, "d": 6, "age": 3.23, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 0, "k": 1473, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.261, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Can you share any of these? I've yet to see anything interesting or non-derivative."}, {"id": 50676185, "au": "overscore", "dom": 14, "sr": 166, "sc": -3.63, "ep": 1.54, "bs": 5.17, "d": 4, "age": 0.29, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 300, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.654, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "To me, it seems much closer to ebikes giving people who previously couldn't the ability to cycle new routes. The latent demand was always there, but unserved as there was a barrier to entry. Now that barrier is gone and many more people are able to engage than before.\n\nThis literally happened with ebikes and caused enormous amounts of handwringing from those for whom the fitness challenge was integral to the experience, who vehemently disliked that people were now able to cycle routes casually just for the fun of it. But in the end, more people outside enjoying nature is unambiguously a positive outcome."}, {"id": 50674309, "au": "dboreham", "dom": 180, "sr": 167, "sc": -3.76, "ep": 0.48, "bs": 4.24, "d": 2, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 18260, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.206, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "I think we just saw a predictive text engine in action there."}, {"id": 50674846, "au": "vunderba", "dom": 46, "sr": 168, "sc": -3.82, "ep": 1.35, "bs": 5.17, "d": 4, "age": 5.19, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 14, "k": 9516, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://kweepa.itch.io/doom64"], "ig": 0.366, "fa": 0.0, "gp": 0.336, "bl": 1.95, "ds": 0.0, "txt": "> Imagine building a game like Doom or Wolfenstein 3D but getting it running on a C64.\n\nhttps://kweepa.itch.io/doom64\n\nNothing new under the sun. A lot of people say ideas are cheap, but I actually think the reverse is now true: implementation is cheap, but a genuinely novel idea is rare."}, {"id": 50676182, "au": "adamddev1", "dom": 97, "sr": 169, "sc": -3.86, "ep": 1.58, "bs": 5.43, "d": 0, "age": 0.3, "grav": 4.5, "surf": 12.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1774, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "whole_money", "flbl": "Whole & Money (Claude)", "urls": [], "ig": 0.659, "fa": 0.0, "gp": 0.019, "bl": 2.05, "ds": 0.0, "txt": "The whole LLM trend is (inadvertently or not) working to discourage and destroy all the human innovation it feeds on for training."}, {"id": 50674518, "au": "sublinear", "dom": 96, "sr": 170, "sc": -3.87, "ep": 1.3, "bs": 5.17, "d": 3, "age": 6.18, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 4179, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.552, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "A subreddit that exists solely to show off personal projects or share links to videos on social media is not a community.\n\nIt's like I said in my comments already: work together or die. This is happening at workplaces too, not just hobbies. You need more people and more ideas \"in the loop\" to make it worth human time."}, {"id": 50674307, "au": "tharkun__", "dom": 76, "sr": 171, "sc": -3.89, "ep": 1.27, "bs": 5.17, "d": 5, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 3148, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "game_competition", "flbl": "Game & Competition (Care)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "The question would be:\n\nIs it generalized interest/knowledge/ability in age": 5.75, "grav": 39.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.367, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "I used to be you. Then I said fuck it, the effort spent refining my perfect engine is detracting from the time I spend making games.\n\nSo now I have a rule: one game, one engine. I write just enough engine to support the game. I've learned how to skeletonize a basic engine very quickly and then make decisions and tradeoffs in the details: for example, whether to use an ECS or fat structs to represent game state depends on the language I'm using, the time/space tradeoffs I'm willing to concede, and my mood that day.\n\nYou may not choose to take the same turn down a different path than I did; and that's fine. Which leads me to wonder: if there aren't any games you're creating yourself, how do you expect your engine to gain traction? Do you have friends with game ideas you're trying to help them implement?"}, {"id": 50676155, "au": "lessartemploy", "dom": 120, "sr": 179, "sc": -4.53, "ep": 2.22, "bs": 6.76, "d": 2, "age": 0.37, "grav": 4.7, "surf": 11.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 10, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.432, "fa": 0.42, "gp": 0.008, "bl": 2.55, "ds": 0.0, "txt": "> but no one is throwing their easel on the ground.\n\nSeveral people are, in fact, doing just that. Some even forced to as they did it professionally. Copy writers and marketing panel artists is basically a 0 hire industry in the last quarter."}, {"id": 50674570, "au": "MBCook", "dom": 117, "sr": 180, "sc": -4.58, "ep": 0.19, "bs": 4.77, "d": 4, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "txt": "The problem was the bit I quoted, which states that \"entities\" (in direct contrast to \"people\") can \"express themselves\" — a notion with which I disagree adamantly."}, {"id": 50674674, "au": "defrost", "dom": 71, "sr": 184, "sc": -6.0, "ep": 1.21, "bs": 7.21, "d": 13, "age": 5.75, "grav": 39.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.516, "fa": 0.0, "gp": 0.0, "bl": 2.72, "ds": 0.0, "txt": "You haven't struck me as hostile, I appreciate the crafts and expect it'll be a good while before automation can replicate green wood joinery, murano glass cane work, etc."}, {"id": 50674390, "au": "sojournerc", "dom": 66, "sr": 185, "sc": -6.24, "ep": 0.97, "bs": 7.21, "d": 8, "age": 6.48, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1052, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.414, "fa": 0.0, "gp": 0.0, "bl": 2.72, "ds": 0.0, "txt": "I think backporting a game by hand takes actual skill and deep knowledge... Ffs, you can't tell the difference between telling a bot to do it and doing it by hand?"}, {"id": 50674974, "au": "Skyy93", "dom": 61, "sr": 186, "sc": -7.09, "ep": 1.39, "bs": 8.48, "d": 7, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 208, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "games_atari", "flbl": "Games & Atari (Human)", "urls": [], "ig": 0.59, "fa": 0.0, "gp": 0.0, "bl": 3.2, "ds": 0.0, "txt": "I am working at a university and also supervising bachelor and master students. From what they told me its abysmal. One guy (bachelor honours student), really talented guy, good with people, nice to talk to and work with, had now over applications all over the world. He is doing robotics and in many interviews the first round was AI interviews all along and he did not land any job.\n\nSeems like the market right now is fucked."}, {"id": 50674532, "au": "defrost", "dom": 69, "sr": 187, "sc": -7.34, "ep": 1.41, "bs": 8.74, "d": 11, "age": 6.15, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 55, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": ["https://en.wikipedia.org/wiki/Robot_jockey", "https://www.youtube.com/@ISHITANIFURNITURE/videos"], "ig": 0.6, "fa": 0.0, "gp": 0.0, "bl": 3.3, "ds": 0.0, "txt": "They're not barrel racing or breaking (yet? ever?) but robot jockey's have been a thing for two decades now.\n\nSure, camels and not horses .. still: https://en.wikipedia.org/wiki/Robot_jockey\n\nAs far as cabinets, I appreciate the offer but we're awash with karri, jarrah, she-oak etc. and prefer to make our own. We likely share an appreciation for Ishitani Furniture: https://www.youtube.com/@ISHITANIFURNITURE/videos"}, {"id": 50674630, "au": "sojournerc", "dom": 73, "sr": 188, "sc": -7.8, "ep": 1.61, "bs": 9.41, "d": 12, "age": 5.87, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1052, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 8, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "hand_hostile", "flbl": "Hand & Hostile (Robot)", "urls": [], "ig": 0.684, "fa": 0.0, "gp": 0.0, "bl": 3.55, "ds": 0.0, "txt": "Ok. IKEA is like McDonald's. Fine if that's what you like. There's still a big market for high-end restaurants, and still a big market for high-end millwork and cabinetry, and just like there's no Michelin star robot restaurants, shops like mine are not likely to be replaced by flat pack particle board.\n\nP.s. I grew up with horses, and if you think a car replaces going deep into the backcountry with an equine companion then you're sorely  mistaken"}, {"id": 50674703, "au": "pigeons", "dom": 188, "sr": 189, "sc": -8.16, "ep": 0.45, "bs": 8.61, "d": 5, "age": 5.63, "grav": 38.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 900, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "llms_community", "flbl": "LLMS & Community (Interested)", "urls": [], "ig": 0.191, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "No, the point is drop \"entities\", as was said, not add \"respectfully\"."}, {"id": 50673928, "au": "dmitrygr", "dom": 159, "sr": 190, "sc": -8.82, "ep": 0.0, "bs": 6.89, "d": 0, "age": 7.46, "grav": 57.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 5, "qw": 0, "k": 14123, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.206, "bl": 2.6, "ds": 0.0, "txt": "Well argued and makes sense."}, {"id": 50674090, "au": "fwlr", "dom": 157, "sr": 191, "sc": -8.87, "ep": 0.0, "bs": 6.89, "d": 0, "age": 7.11, "grav": 53.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 6, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.174, "bl": 2.6, "ds": 0.0, "txt": "A machine for turning commons into tragedies"}, {"id": 50674457, "au": "latentsea", "dom": 79, "sr": 192, "sc": -9.12, "ep": 0.0, "bs": 6.89, "d": 3, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 4, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.0, "bl": 2.6, "ds": 0.0, "t     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
