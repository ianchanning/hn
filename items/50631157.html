sider.com/microsoft-expects-very-few-people-to-accept-buyouts-cfo-says-2026-10"], "ig": 1.56, "fa": 1.24, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": "The Microsoft CFO, Amy Hood, expects 5% or fewer of eligible employees will accept the buyout offer. see https://www.businessinsider.com/microsoft-expects-very-few-p...\n\n  Earlier this year, Microsoft offered a different retirement buyout. In that situation, about one-third of eligible employees took the offer, and that helped Microsoft cut fewer employees in subsequent layoffs.\n\n  This week's buyout is getting a lot less uptake, according to the company."}, {"id": 50633235, "au": "runako", "dom": 1, "sr": 3, "sc": 7.42, "ep": 7.57, "bs": 0.0, "d": 0, "age": 4.21, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 10001, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.318, "fa": 0.95, "gp": 1.215, "bl": 0.0, "ds": 0.0, "txt": "Worth noting that Microsoft has fired (or is in the process of offering buyouts to) ~45% of their 2022-era staff. Over 25% of the current staff are right now deciding whether to take a buyout offer. This, as the company has not made any meaningful cuts to its commitments.\n\nIt's too easy to blame the outage on the cuts. But also it would be silly to think that a company could shrink so fast and not lose something.\n\nGiven the direction, it's likely they will cut until it's clear they have cut too far before starting to bulk up again. What does \"too far\" look like for a company as important as Microsoft?"}, {"id": 50631719, "au": "unethical_ban", "dom": 139, "sr": 4, "sc": 7.3, "ep": 7.44, "bs": 0.0, "d": 0, "age": 5.87, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 11236, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.797, "fa": 0.34, "gp": 1.552, "bl": 0.0, "ds": 0.0, "txt": "What do people use for incident response and management at large organizations?\n\nOddly enough, the best experience I had was when the company had Meetingplace. It had a whiteboard style notes page that could be edited by multiple people at once with text boxes. There were two: a general chat with notes and technical information, and a curated one by major incident managers (MIMs) that kept track of the state of the issue, impact, theories and teams working on it.\n\nI wonder what coordination tools are used today by large orgs when a system goes down. One place I've seen recently uses a Teams chat with over 1000 people in it to broadcast potential MIs, then break out into chats... not the most elegant."}, {"id": 50633743, "au": "surgical_fire", "dom": 74, "sr": 5, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 3, "age": 3.72, "grav": 23.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 8, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.756, "fa": 0.42, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "> Eng: so why isn’t that the standard process?\n\nHotfixes are typically very minor changes to fix (or in many cases mitigate) a verified bug that is causing immediate pain. Or, quite often, just a straight rollback commit.\n\nYou follow the process for regular changes, because the process exists for a reason. Ensuring quality and security is important. When you have a customer base, not impacting your customers negatively often is more important than pushing whatever shit you farted in a PR.\n\nThat I have to explain this to someone I presume to be an engineer is weird"}, {"id": 50635338, "au": "buredoranna", "dom": 151, "sr": 6, "sc": 6.11, "ep": 6.11, "bs": 0.0, "d": 0, "age": 1.74, "grav": 10.8, "surf": 3.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 258, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.939, "fa": 0.28, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "I was given cause to investigate a single suspect email...\n\nThis was my experience, I'm sure there are many like it, but this one was mine:\n\n  1. Run an Exchange Message Trace.\n\n  2. Locate the specific email.\n\n  3. Discover that Message Trace cannot display its contents.\n\n  4. Discover that Defender requires additional licensing.\n\n  5. Navigate an entirely separate administration portal.\n\n  6. Create an eDiscovery case.\n\n  7. Configure a data source.\n\n  8. Construct a search query.\n\n  9. Generate a sample.\n\n  10. Discover that the preview doesn't adequately expose the hyperlink.\n\n  11. Export the message.\n\n  12. Inspect the raw email and decode the URL."}, {"id": 50634040, "au": "cpeterso", "dom": 86, "sr": 7, "sc": 6.04, "ep": 6.18, "bs": 0.0, "d": 6, "age": 3.45, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 44314, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": ["https://en.wikipedia.org/wiki/Crash-only_software"], "ig": 1.201, "fa": 0.62, "gp": 1.1, "bl": 0.0, "ds": 0.0, "txt": "Perhaps k8s should remove graceful shutdown and make \"abnormal\" termination the only way to shut down. With a hostile, \"crash-only software\" environment, teams must make their code robust by design: https://en.wikipedia.org/wiki/Crash-only_software"}, {"id": 50635863, "au": "caboteria", "dom": 149, "sr": 8, "sc": 5.95, "ep": 5.95, "bs": 0.0, "d": 0, "age": 0.94, "grav": 7.0, "surf": 6.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 39, "k": 742, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.543, "fa": 0.42, "gp": 0.778, "bl": 0.0, "ds": 0.0, "txt": "> Amanda Silver, Microsoft's corporate vice president overseeing M365 Core and Work IQ, the company's workplace intelligence platform for AI agents, said in a separate memo on Monday that engineers had to work through a \"fog of war\" as the outage unfolded.\n\nI really wish that wealthy nerds, sitting in climate-controlled offices,  playing with patterns on their computer screens, would stop using such self-aggrandizing language.\n\nI once had a boss who had actually been to war. When the kids (myself included) would start to freak out he'd look out the window and say \"huh, I don't see any tracer rounds so I guess we can relax.\" I never forgot that message."}, {"id": 50632372, "au": "rcleveng", "dom": 145, "sr": 9, "sc": 5.83, "ep": 5.83, "bs": 0.0, "d": 0, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 37, "qw": 0, "k": 362, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": ["https://en.wikipedia.org/wiki/A_Few_Good_Men"], "ig": 1.189, "fa": 0.62, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "The headline actually reminded me of Jack Nicholson in https://en.wikipedia.org/wiki/A_Few_Good_Men\n\nI was trying to imagine Satya channeling Jack yelling it in a staff meeting.  Took all of a few minutes to stop imaging it and had AI make me that video."}, {"id": 50633347, "au": "greengreengrass", "dom": 65, "sr": 10, "sc": 5.74, "ep": 6.03, "bs": 0.0, "d": 2, "age": 4.08, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 231, "qw": 0, "k": 128, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.929, "fa": 0.0, "gp": 1.033, "bl": 0.0, "ds": 0.0, "txt": "See also:\n\nExec: We have this elaborate deployment process that our team must follow every time. To deploy our <inconsequential product>, it has all these fancy gates, CI checks, approval workflows (in several companies, up to and including exec sign-off). Every change in the build is tracked back to Jira tickets, and it can’t ship if they’ve not all been signed off by QA. A “release” to our cloud platform takes hours to do well; it’s a very specialist task, and our whole scrum process is designed to ensure this build goes every 2 weeks without fail. Staff stay late to make sure it happens.\n\nEngineer: What about hotfixes when we find a bug in prod, and customers are down or were embarrassed or whatever?\n\nExec: oh, we have a special _hotfix deployment_ process for that. You don’t use any of the tooling. You cut a branch, build locally and push direct to prod; whatever it takes.\n\nEng: so why isn’t that the standard process?\n\nThe number of times I’ve had to explain to dumbfounded management that the existence of this hotfix process with no safeties means it should be the standard deploy process, because it either works fine and doesn’t need all the comfort theatre that’s been engineered around a ship process, or it doesn’t work fine and we need to run it repeatedly to fix its problems before it really causes an issue.\n\nSometimes I’m successful."}, {"id": 50636461, "au": "johngalt", "dom": 152, "sr": 11, "sc": 5.56, "ep": 5.71, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 5758, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.617, "fa": 0.28, "gp": 0.766, "bl": 0.0, "ds": 0.0, "txt": "Yep everything microsoft is like that. The only unstated elements are:\n\n- The 3min page load time for every step.\n\n- One step in the process is enforcing some 'new experience' UI.\n\nThe only way to reasonably admin M365 is via graph/powershell. E.G. build an email investigation/triage script and run it each time. Rather than try to pull stuff out of the GUI."}, {"id": 50634890, "au": "runako", "dom": 11, "sr": 12, "sc": 5.41, "ep": 5.92, "bs": 0.0, "d": 2, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 10001, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.958, "fa": 0.0, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "People are not fungible over short timeframes. There is value to expertise doing specific jobs in specific cultures. The top engineer on PageRank is not a drop-in replacement for the top SRE on Outlook. There's a learning curve. And Microsoft is categorically shedding expertise, they are not trading like for like (otherwise why bother?).\n\nCompanies have long engaged in replacing expensive staff with cheaper employees, which I would wager is part of what's happening here. But the churn itself is the risk, as I highlighted initially.\n\nA broad buyout is also bound to cut in non-strategic places. People in high-demand specialties like security will exit with their package, even though those are the people Microsoft should be retaining. Additionally, morale for everyone has to be dampened given the giant ongoing continuous layoffs for half a decade.\n\nThere was a time when Microsoft understood the human factors behind their business. One perk from the Gates years was giving all (then most) engineers a solo office based on research that private offices make engineers more productive. I wonder what other parts of the culture are being abandoned."}, {"id": 50633258, "au": "deathanatos", "dom": 83, "sr": 13, "sc": 5.33, "ep": 5.77, "bs": 0.0, "d": 4, "age": 4.17, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 0, "k": 13191, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 1.891, "fa": 0.0, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "I agree wholeheartedly with you that handling abnormal termination is probably the first thing you should do.\n\nBut I disagree with you on \"the culture around k8s in practice ignores this to a dangerous degree\" — yes, k8s clusters have built-in methods of handling normal termination¹. But that because abnormal termination — while an expected and \"normal\" consequence of production in the sense that it will, invariably, happen — still has knock-on effects, like 500s. If I SIGKILL your serving process, those requests are dead². The graceful stuff is there to avoid inadvertently nuking requests like that during normal deployments.\n\nAgain, I absolutely agree: your desired workload should survive everything from SIGKILL to the machine just up and vanishing into thin air, and the subsequent delay that it will take health checks to realize \"huh, weird, that VM just poofed out of existence\". (And you should probably deal with that first, as systemic failures like what MS hit are less preferable than a few 5xxs here and there.)\n\n¹which for a workload, amounts to, pretty much \"handle SIGTERM\", or more practically, \"your web framework, if it is worth its salt, should already be doing this for you\"\n\n²while sometimes an upstream LB can smartly retry idempotent requests, if the requests aren't idempotent, there is no choice but 5xx"}, {"id": 50632882, "au": "dang", "dom": 100, "sr": 14, "sc": 5.32, "ep": 5.32, "bs": 0.0, "d": 1, "age": 4.62, "grav": 30.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 23, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": ["https://news.ycombinator.com/item?id=47616242"], "ig": 1.065, "fa": 0.68, "gp": 0.609, "bl": 0.0, "ds": 0.0, "txt": "Discussed at the time, if anyone wants to take a look:\n\nDecisions that eroded trust in Azure – by a former Azure Core engineer - https://news.ycombinator.com/item?id=47616242 - April 2026 (648 comments)"}, {"id": 50632507, "au": "steinnes", "dom": 163, "sr": 15, "sc": 5.24, "ep": 5.24, "bs": 0.0, "d": 0, "age": 5.03, "grav": 33.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 245, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.826, "fa": 0.0, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "I wouldn’t be surprised if a lot of people who warned this could happen were ignored, if not pushed out, over the years.  Given the awful state of most of their online services and the laughable track record of azure back when I was an SRE, I am almost surprised this kind of outage isn’t more common. I counted at least 5 (10 if I am being pedantic) full/partial page reloads or redirects when opening up their “offer marketplace” from their cloud console the other day, every navigation triggering probably a hundred xhr’s and gradually replacing variously incorrect little portlets. I remember thinking how bad I felt for their backend services."}, {"id": 50634485, "au": "oldmanhorton", "dom": 142, "sr": 16, "sc": 5.23, "ep": 5.52, "bs": 0.0, "d": 1, "age": 2.86, "grav": 17.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 532, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.648, "fa": 0.28, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "Microsoft uses a custom incident management system that, as far as internal Microsoft services go, is decent. It’s pretty highly tailored to the largest scale m365 and Azure services and it is integrated with Teams and telemetry sources well enough to provide a semblance of cohesion during major outages like this. It has no real relation, hilariously, to the Azure Monitor product offered to third party customers."}, {"id": 50634521, "au": "jonas21", "dom": 10, "sr": 17, "sc": 4.99, "ep": 5.87, "bs": 0.0, "d": 1, "age": 2.81, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 14926, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.878, "fa": 0.95, "gp": 0.759, "bl": 0.0, "ds": 0.0, "txt": "That would be a nice story, except that Microsoft hasn't actually shrunk since the 2022-era. Employee count by year:\n\n   2026  223,000\n   2025  228,000\n   2024  228,000\n   2023  221,000\n   2022  221,000\n\nThey are, as you said, currently offering a buyout to ~25% of their workforce, but only a small fraction are expected to accept."}, {"id": 50636347, "au": "mapontosevenths", "dom": 15, "sr": 18, "sc": 4.92, "ep": 5.58, "bs": 0.0, "d": 3, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 21, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.632, "fa": 0.42, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": ">  People in high-demand specialties like security will exit with their package, even though those are the people Microsoft should be retaining.\n\nThis is the bit that management misses with these buyouts, I think. The ones with the most choice, or who are already being paid bargain wages and can expect more elsewhere, are the ones who leave. Not the lazy good-for-nothings who aren't \"dedicated to the mission\" or whatever corpo-speak the c-levels use to describe the leavers.\n\nThey lose the best and brightest, and are left with sick people whose insurance is holding them hostage, people close to retirement, those who don't want to rock the boat, and people who are poor enough performers that they have few other choices. That's not a great mix for building driven and successful teams that get things done."}, {"id": 50633415, "au": "tpolm", "dom": 93, "sr": 19, "sc": 4.62, "ep": 5.5, "bs": 0.0, "d": 1, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 167, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.639, "fa": 0.34, "gp": 0.47, "bl": 0.0, "ds": 0.0, "txt": "Good luck with chaos monkey on production Azure/EXO machines randomly rebooting hosts hosting paying customer VMs or mailboxes / triggering migration/failover\n\nthe technology was there 10 years ago and was/is used by Bing internally. You can't let chaos money randomly reboot production hosts if your system was designed 20+ years ago assuming that reboot ordinary"}, {"id": 50634122, "au": "pjmlp", "dom": 32, "sr": 20, "sc": 4.6, "ep": 5.04, "bs": 0.0, "d": 2, "age": 3.34, "grav": 20.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.401, "fa": 0.28, "gp": 0.652, "bl": 0.0, "ds": 0.0, "txt": "People love to pull this quote, and is specifically ironic when they type it from a GNU/Linux system, powered by enough software that depends directly and indirectly, from IBM money.\n\nLike the Meta haters writing React applications."}, {"id": 50633077, "au": "this_user", "dom": 176, "sr": 21, "sc": 4.41, "ep": 4.41, "bs": 0.0, "d": 1, "age": 4.38, "grav": 28.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 4578, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.262, "fa": 0.34, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "I mean, Windows has been slop for a quarter of a century. Bill Gates famously complained in a 2003 email to MSFT executives that he couldn't figure out how to install Movie Maker. The remarkable thing is that the company still exists and still does well financially after all this time and all these broken products."}, {"id": 50633371, "au": "rootlyhq", "dom": 140, "sr": 22, "sc": 4.18, "ep": 5.28, "bs": 0.0, "d": 1, "age": 4.05, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 3, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.859, "fa": 0.0, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "Obviously biased but our platform Rootly is built for this, alongside competitors like incident.io and PagerDuty.\n\nThe goal of all of our tools is to create structure that manages the chaos - a single Slack channel dedicated to the incident, roles and workstreams that can be assigned to DRIs, a single feed of updates curated by the MIM that can automatically spray out to execs, etc, plus an AI scribe that can transcribe the incident bridge and provide realtime updates for those who are not on it.\n\nBasically, provide a tool that supports the system (ICS-like) - command, disseminate information, and make the response predictable."}, {"id": 50634830, "au": "schnevets", "dom": 94, "sr": 23, "sc": 4.15, "ep": 5.25, "bs": 0.0, "d": 2, "age": 2.43, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1720, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.761, "fa": 0.0, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Agreed. In fact, I believe Netflix has even acknowledged that chaos engineering was uniquely appropriate for their industry. If a simulated outage has an impact in their environment, a subscriber can't watch Gabby's Dollhouse (although my toddler may think that's the end of the world). When a hospital running on O365 encounters an outage, human lives are at risk.\n\nWith that said, I wonder if chaos engineering leaves an organization better equipped to handle this world of AI expanded attack surfaces."}, {"id": 50634590, "au": "evolve2k", "dom": 172, "sr": 24, "sc": 4.0, "ep": 4.0, "bs": 0.0, "d": 0, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 13, "k": 6803, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.006, "fa": 0.42, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "> Microsoft blamed the outage on an undetected Windows scalability defect introduced in July.\n\nHow confident can we be that this was very likely to have been LLM generated code, possibly introduced in a larger-than-historical mega pull request?"}, {"id": 50635223, "au": "zarldev", "dom": 54, "sr": 25, "sc": 3.79, "ep": 5.11, "bs": 0.0, "d": 2, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 10, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": ["https://netflix.github.io/chaosmonkey/"], "ig": 1.174, "fa": 0.62, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "https://netflix.github.io/chaosmonkey/\n\nBasically different size monkeys go through prod systems and take different parts of infra / services down to make sure everything is dynamic and can handle these scenarios.  Think service discovery etc ."}, {"id": 50633606, "au": "anoojb", "dom": 31, "sr": 26, "sc": 3.68, "ep": 4.34, "bs": 0.0, "d": 1, "age": 3.83, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 226, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.78, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "\"No one ever got fired for buying IBM.\"\n\nMSFT as a vendor has always offered lower than industry average quality of service. MSFT is the new IBM, except they learned the lesson of having a decent CorpDev and lobbying team. So you get preferential government contracts and things like the OpenAI investment.\n\nNotice that the buyouts largely didn't apply to the sales/marketing orgs. That will happen after the fiscal year boundary, if the products simply don't hunt."}, {"id": 50631613, "au": "steve1977", "dom": 158, "sr": 27, "sc": 3.44, "ep": 4.32, "bs": 0.0, "d": 0, "age": 6.01, "grav": 42.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 28, "k": 4609, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.062, "fa": 0.42, "gp": 0.435, "bl": 0.0, "ds": 0.0, "txt": "> Microsoft set a target of achieving worldwide resolution within an hour during  future incidents and plans to deploy  AI agents to help engineers  diagnose system health data more quickly.\n\nI'm currently getting up to speed with SRE AI (or whatever you want to call it) and have to wonder why Microsoft, with all their pushing of agents and copilots and whatnot, is apparently not using that already."}, {"id": 50631363, "au": "alephnerd", "dom": 124, "sr": 28, "sc": 3.37, "ep": 3.81, "bs": 0.0, "d": 0, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 14906, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "A code red at Microsoft means a C-suite to IC initiative to change processes. The title is editorialized for those who lack that context.\n\nBasically, MS is now going to mandate a 1 hour SLA to turn such services back on going forward."}, {"id": 50634186, "au": "codeduck", "dom": 62, "sr": 29, "sc": 3.33, "ep": 3.77, "bs": 0.0, "d": 3, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1508, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.503, "fa": 0.0, "gp": 0.162, "bl": 0.0, "ds": 0.0, "txt": "Some organisations become petrified of change, because change causes outages.  So they put in Byzantine processes around change, with CABs, go-no-gos, RAGs etc etc.\n\nSomehow, despite all this, the number of incidents goes up, and the severity increases.\n\nTale as old as Internet Time."}, {"id": 50631706, "au": "cheesecakegood", "dom": 156, "sr": 30, "sc": 3.32, "ep": 4.42, "bs": 0.0, "d": 0, "age": 5.88, "grav": 41.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 247, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.203, "fa": 0.34, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "Is Microsoft 363 inevitable at this rate? I understand that “roll stuff (including fixes) out faster” sounds like an appealing way of mitigating future outages, but I’m not really convinced this was their actual flaw."}, {"id": 50633471, "au": "rawgabbit", "dom": 41, "sr": 31, "sc": 3.32, "ep": 4.86, "bs": 0.0, "d": 1, "age": 3.96, "grav": 24.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5613, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.561, "fa": 0.28, "gp": 0.271, "bl": 0.0, "ds": 0.0, "txt": "Many years ago I used to work for tech company that lived and breathed Gordon Gekko style capitalism.  The software, technology, and staff's only purpose was to make money.  They measured customer satisfaction by how much ongoing litigation they were involved in.  Microsoft may end up in a mess of lawsuits with regard to outages and unmet SLAs."}, {"id": 50634958, "au": "runako", "dom": 40, "sr": 32, "sc": 3.09, "ep": 4.19, "bs": 0.0, "d": 2, "age": 2.25, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 10001, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.857, "fa": 0.68, "gp": 0.167, "bl": 0.0, "ds": 0.0, "txt": "Of the total staff ~2022, they will have fired or offered buyouts to about 45%.\n\nAs has been pointed out, headcount has not moved that much. Microsoft has been aggressively shedding expertise for years."}, {"id": 50634607, "au": "howunfortunate", "dom": 73, "sr": 33, "sc": 3.06, "ep": 3.5, "bs": 0.0, "d": 3, "age": 2.71, "grav": 16.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.666, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Half serious rebuttal:\n\nBecause the hotfix is made by the guru Principal who has been there for 12 years and wrote the system, while 80% of \"normal\" commits are made by juniors."}, {"id": 50632912, "au": "Erem", "dom": 126, "sr": 34, "sc": 2.92, "ep": 3.29, "bs": 0.0, "d": 2, "age": 4.58, "grav": 29.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 392, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.165, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "I think this means that when an incident takes longer than 1hr to mitigate, then the team roadmap gets deprioritized, favoring work that decreases future mitigation time instead"}, {"id": 50635705, "au": "onion2k", "dom": 23, "sr": 35, "sc": 2.77, "ep": 4.31, "bs": 0.0, "d": 4, "age": 1.23, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 50398, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.604, "fa": 0.0, "gp": 0.374, "bl": 0.0, "ds": 0.0, "txt": "Buyouts generally offer a bit more money than layoffs because they don't spook the market quite so badly.\n\nIf the headcount reduction target isn't met, layoffs come next.\n\nIf you're in a position to leave (near retirement, have a good skillset, fancy starting your own business, etc) then the buyout is a far better option than the risk of getting laid off."}, {"id": 50632225, "au": "sandworm101", "dom": 119, "sr": 36, "sc": 2.76, "ep": 3.86, "bs": 0.0, "d": 1, "age": 5.32, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 4, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.563, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": ">> 11,000 messages across 11 Teams chats\n\nSo the people fixing Teams were organizing their response via Teams? What could possibly go wrong?\n\nRealizing they probably had access to a more robust Teams implementation, the point standing that the system to fix a thing should itself rely on that thing. The business continuity plan/team should have a backup network capable of running without reference to any MS/Windows-based systems."}, {"id": 50633921, "au": "saghm", "dom": 2, "sr": 37, "sc": 2.71, "ep": 4.25, "bs": 0.0, "d": 1, "age": 3.55, "grav": 21.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 28, "k": 14366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.834, "fa": 0.7, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "> It's too easy to blame the outage on the cuts. But also it would be silly to think that a company could shrink so fast and not lose something.\n\nI'd further argue that people who are confident in their ability to find another job are more likely to take a buyout, whereas people who are less confident are more likely to stay. Moves like this disproportionately lose people who are valuable and retain people who are not as valuable, at least in terms of the job market (which I'd expect to at least somewhat reflect the actual value to a company employing them)."}, {"id": 50634937, "au": "runako", "dom": 27, "sr": 38, "sc": 2.69, "ep": 4.23, "bs": 0.0, "d": 2, "age": 2.27, "grav": 13.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 9, "k": 10001, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.184, "fa": 0.42, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "The message to employees: we don't want you, but we doubt you can find a better job in this market. If you don't take this buyout, we might just fire you anyway.\n\n> that helped Microsoft cut fewer employees in subsequent layoffs\n\nExcellent for morale, retention, and esprit de corps. Definitely will make people want to go above and beyond to clean up the messes from prior rounds of layoffs.\n\nOne could barely tailor a message better to tell the best performers to jump ship immediately."}, {"id": 50634182, "au": "SoftTalker", "dom": 179, "sr": 39, "sc": 2.61, "ep": 2.76, "bs": 0.0, "d": 2, "age": 3.3, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They would never have had an OS as good as NT if they tried to develop it themselves. They had to bring in someone like Cutler to achieve it.\n\nI'm reminded of the Steve Jobs quote: The problem with Microsoft is they just have no taste. They have absolutely no taste, and I don't mean that in a small way, I mean that in a big way, in the sense that they don't think of original ideas, and they don't bring much culture into their products."}, {"id": 50632260, "au": "magila", "dom": 113, "sr": 40, "sc": 2.52, "ep": 3.76, "bs": 0.0, "d": 1, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1994, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.296, "fa": 0.0, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "I'm surprised they don't have a policy of centralizing incident comms in one place. When I worked for a company that dealt with these sorts of incidents, declaring one automatically created a dedicated room for all incident related chat."}, {"id": 50634785, "au": "cratermoon", "dom": 19, "sr": 41, "sc": 2.5, "ep": 4.04, "bs": 0.0, "d": 2, "age": 2.49, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 7, "k": 16487, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.211, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "OK but in the last five years how much additional work has Microsoft taken on? How much has Azure grown? How many engineers have they committed to CoPilot?\n\n> only a small fraction are expected to accept.\n\nAnd Microsoft will lay of a large fraction of the ones who stay. The buyout is only a precursor to layoffs."}, {"id": 50633241, "au": "svaha1728", "dom": 171, "sr": 42, "sc": 2.5, "ep": 3.6, "bs": 0.0, "d": 0, "age": 4.2, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 390, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.963, "fa": 0.34, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "The Azure portal front end still runs Knockout.js from 2014. Can’t imagine what the backend looks like."}, {"id": 50632930, "au": "Dwedit", "dom": 153, "sr": 43, "sc": 2.48, "ep": 3.36, "bs": 0.0, "d": 0, "age": 4.56, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 4854, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.826, "fa": 0.34, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "\"Code Red\" was a famous virus from 2001 that exploited Microsoft IIS server.  So declaring \"Code Red\" might have an unintended secondary meaning."}, {"id": 50632931, "au": "spike021", "dom": 144, "sr": 44, "sc": 2.47, "ep": 3.35, "bs": 0.0, "d": 2, "age": 4.55, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 4134, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.6, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Reminds me of when I was at Amazon and on-call for thanksgiving in... 2020? or 2021? and there was a war room with probably hundreds of people for an outage. us-east-1 iirc."}, {"id": 50633391, "au": "rawgabbit", "dom": 110, "sr": 45, "sc": 2.38, "ep": 3.62, "bs": 0.0, "d": 3, "age": 4.03, "grav": 25.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 5613, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.54, "fa": 0.0, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "My bet is that Microsoft executives are treating their own products as dead-man-walking; they are trying to extract as much profit as possible before the music stops.  Where I work, even the top bosses are hinting we should stop deploying anything new to Azure and create a years long migration plan to move away from it.  Our customers are on Okta; it is our internal IT who uses Entra/Active Directory that are resisting the most."}, {"id": 50635887, "au": "Paracompact", "dom": 12, "sr": 46, "sc": 2.29, "ep": 3.83, "bs": 0.0, "d": 3, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 24, "k": 971, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.963, "fa": 0.42, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "> One perk from the Gates years was giving all (then most) engineers a solo office based on research that private offices make engineers more productive.\n\nHuh, really? Does this research still hold water? As someone who works in a shared space, you couldn't give me a private office if you tried. Face-showing, networking, and entertainment benefits are incomparable. And as far as sheer productivity under ideal conditions is concerned, private office is just wannabe work-from-home."}, {"id": 50633412, "au": "siliconc0w", "dom": 150, "sr": 47, "sc": 2.28, "ep": 3.38, "bs": 0.0, "d": 0, "age": 4.01, "grav": 25.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 5880, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "It's hard to recommend any of the clouds as a former SRE - none of them beat the reliability of a simple metal setup, nor do they save money, and these days it's hard to get capacity so they don't offer burst or flexibility.  It's literally a way to a spend a lot more for a lot less."}, {"id": 50633459, "au": "mosura", "dom": 85, "sr": 48, "sc": 2.26, "ep": 2.92, "bs": 0.0, "d": 5, "age": 3.97, "grav": 24.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1806, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You are arguing from idealism, while I am from what people actually do when presented with those mechanisms.\n\nI know infinitely more SV cos with zero abnormal termination recovery than those with graceful shutdowns for the simple reason one is tested all the time and the other is too hard to deal with so everyone hopes they have moved to the next company before dealing with it."}, {"id": 50633046, "au": "deathanatos", "dom": 116, "sr": 49, "sc": 2.21, "ep": 3.6, "bs": 0.0, "d": 1, "age": 4.42, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 13191, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "And in a 24h long outage, how much of that is management incessantly asking for a status update, instead of reading the last ≈3 messages in the thread which contain the status update?\n\nAnd then more management⇄management messages trying to work out how to spin this on the status page, how to spin this to the media, do we need to send out comms to customers, etc. etc."}, {"id": 50634201, "au": "BadBadJellyBean", "dom": 66, "sr": 50, "sc": 2.17, "ep": 3.27, "bs": 0.0, "d": 3, "age": 3.27, "grav": 19.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 207, "qw": 7, "k": 1356, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.8, "fa": 0.42, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "> so why isn’t that the standard process?\n\nBecause of people. I have once worked at a place that had no CI/CD and people made hotfixes in prod. What they didn't do was commit their changes back to git and when someone deployed a new version from git everything broke.\n\nCI/CD provides a path from git to prod if you do it right.\n\nI have worked at another company without CI/CD or tests for their legacy product. Every change by a developer was a shot in the dark. Will it work? Will everything explode? Who knew?\n\nCI/CD would have given a way to have some confidence. It's not perfect but it's worlds better than nothing.\n\nNow you might say: people should not forget to commit their stuff to git. True. But they do. Every process that is only written down and not enforced technically will be broken at some point. The more people the easier it happens.\n\nThat of course doesn't mean that there shouldn't never be a way to short circuit the default process. If everything is down you have a good chance you won't make it worse. But that's the point. It should be an emergency route not the norm. Just as the fire exit is not the normal exit even though it might be very fast and convenient."}, {"id": 50634541, "au": "alpha_squared", "dom": 21, "sr": 51, "sc": 2.13, "ep": 3.67, "bs": 0.0, "d": 2, "age": 2.79, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 2361, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.655, "fa": 0.68, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I suspect that they made the offer to so many employees with the expectation that only 5-10% accept. I'm very curious to know what would happen should >20% accept."}, {"id": 50635097, "au": "TeMPOraL", "dom": 59, "sr": 52, "sc": 2.07, "ep": 3.62, "bs": 0.0, "d": 4, "age": 2.05, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.475, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "That's good thinking because it also cuts straight through the bad conclusion many people make after learning of the \"Lethal Trifecta\", i.e. that it's solvable. It's not. It's fundamental to the nature of general systems, and the sooner people get out of the absolutist, binary mindset of naive cybersecurity (you're either provably secure or not secure at all), the sooner they can get to solving the real problem, which is how to prevent or mitigate the worst outcomes without nerfing the system to the point it's no longer useful."}, {"id": 50633635, "au": "bena", "dom": 57, "sr": 53, "sc": 2.03, "ep": 3.57, "bs": 0.0, "d": 2, "age": 3.81, "grav": 23.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 3949, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.893, "fa": 0.28, "gp": 0.466, "bl": 0.0, "ds": 0.0, "txt": "Because a lot of people get caught in the mindset of \"prevent problems from happening\" rather than \"what to do when problems happen\".\n\nThe first can work for a while, but the minute it doesn't, you're just kind of boned because you won't know what to do.\n\nWhereas with the second, as long as one of the problems you're prepared for is \"complete systems failure\", the exact nature of the problem isn't an issue."}, {"id": 50632580, "au": "nsbdhciebsbdhc", "dom": 175, "sr": 54, "sc": 2.03, "ep": 3.42, "bs": 0.0, "d": 0, "age": 4.95, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 46, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.98, "fa": 0.34, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Months ago Microsoft acknowledged that windows has become slop. Its clear their internal systems are slop also.\n\nMy money is on Microsoft 362 before anything real changes."}, {"id": 50633828, "au": "mywittyname", "dom": 134, "sr": 55, "sc": 1.95, "ep": 3.34, "bs": 0.0, "d": 2, "age": 3.64, "grav": 22.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 17434, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "I don't, nor have I ever worked at MS, but I expect the intent of this directive is to allow teams to prioritize work related to reliability and uptime over feature development.\n\nI imagine that, like most large tech companies, they are KPI driven and hardly anyone is going to work on projects that can't be tied back to KPIs."}, {"id": 50635300, "au": "marcosdumay", "dom": 53, "sr": 56, "sc": 1.95, "ep": 3.19, "bs": 0.0, "d": 2, "age": 1.79, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "Chaos monkey.\n\nIt means constantly taking parts of your system offline so that engineers have to make it reliable against partial loses, instead of growing something that needs total availability to a size where any \"total\" anything is impossible."}, {"id": 50632818, "au": "Leherenn", "dom": 130, "sr": 57, "sc": 1.95, "ep": 3.0, "bs": 0.0, "d": 2, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1267, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.17, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I mean, if you're charitable, that's the objective defined by the higher levels, to be implemented as required by the lower level functions. As least it's somewhat clear and objective.\n\nOf course, it cannot hold in absolutely every instances. But if you know, right now, that if you have an issue in prod, you cannot release a fix in under an hour because your CI takes 3, then you should fix it. Same for restoring backups, rolling back changes, ...\n\nAt least that's how I interpret it. Better than some nebulous \"do better\"/\"fix faster\". Then it's a question about whether the organisation will actually support and enable the changes required to reach the goal, but that's a different problem."}, {"id": 50632242, "au": "eddythompson80", "dom": 112, "sr": 58, "sc": 1.95, "ep": 2.99, "bs": 0.0, "d": 1, "age": 5.3, "grav": 35.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Most communication would be on voice/video for the duration of the outage though with chat messages being mostly for summaries, current hypotheses, data transfer, progress, or people asking for updates."}, {"id": 50636244, "au": "wsng", "dom": 72, "sr": 59, "sc": 1.95, "ep": 2.97, "bs": 0.0, "d": 4, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 43, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.853, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "At least for ISO 27001, this is not correct. You can have a lean approach which allows deploying to prod in minutes after merge to main, and only a peer review as ‘approval ceremony’ before the merge."}, {"id": 50636095, "au": "estaroc", "dom": 13, "sr": 60, "sc": 1.95, "ep": 2.96, "bs": 0.0, "d": 4, "age": 0.59, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 40, "kpp": 10.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.26, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As far as I'm aware, yes, though the cited study was largely based on \"perceived\" productivity. Most engineers intuitively agree with this, though. Do you mind sharing what kind of work you do? A lot of engineering work is very \"flow state\"-dependent, and open floorplans provide no end of distractions (networking and entertainment, two perks you noted, are typically not productive in the typical sense)."}, {"id": 50632766, "au": "andreidbr", "dom": 164, "sr": 61, "sc": 1.95, "ep": 2.95, "bs": 0.0, "d": 1, "age": 4.75, "grav": 31.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 43, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When I read that one of the reasons this wasn't spotted is that their test environments have fewer resources than Prod, I (once again) realized Microsoft isn't any better than any other company that neglects simulating load on their services.\n\nIt also reminded me of that saying \"every company has a test environment, some are smart enough to have a separate environment for production\""}, {"id": 50632478, "au": "Pingk", "dom": 108, "sr": 62, "sc": 1.95, "ep": 2.93, "bs": 0.0, "d": 1, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 485, "kpp": 9.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.248, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Coincidentally I read this series a few days before the outage and it filled me with dread with how much of a culture change is required to fix this holistically.\n\nThis isn't something to solve with different procedures, they need to slow waaay the hell down and re-architect it until they understand how their system works."}, {"id": 50632751, "au": "exmicrosoldier", "dom": 178, "sr": 63, "sc": 1.95, "ep": 2.93, "bs": 0.0, "d": 1, "age": 4.76, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 233, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.025, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Microsoft upper mangement has become slop.\n\nEverything else follows.\n\nThey used to listen to people like Cutler, but they don't seem to anymore."}, {"id": 50635895, "au": "marshray", "dom": 33, "sr": 64, "sc": 1.95, "ep": 2.88, "bs": 0.0, "d": 3, "age": 0.89, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 11883, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.815, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The quote goes back at least 40 years and is an observation about how IT shops have historically made conservative decisions when adopting a vendor for core infrastructure.\n\nIt's not actually about IBM as a company today."}, {"id": 50632918, "au": "mosura", "dom": 56, "sr": 65, "sc": 1.95, "ep": 2.8, "bs": 0.0, "d": 1, "age": 4.57, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1806, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.864, "fa": 0.0, "gp": 0.529, "bl": 0.0, "ds": 0.0, "txt": "It is incredible how effective it is if you get to do it.\n\nThe resistance though can be awe inspiring. Just ask your normal k8s fried mind about “graceful shutdowns”. Way too many people live in a world where they are so obsessed with graceful shutdowns they have no idea what happens when recovering from ungraceful shutdowns, so they leave this unhandled, when in reality that is the standard case and the graceful variant is merely a special case that can perform some optimization."}, {"id": 50635037, "au": "dessimus", "dom": 128, "sr": 66, "sc": 1.95, "ep": 2.79, "bs": 0.0, "d": 1, "age": 2.15, "grav": 13.0, "surf": 3.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 668, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nadella: \"Why are all our customers still complaining there is an outage, shouldn't it have been fixed already?\"\nSREs: \"TBF, there was no memo telling us how quickly to fix a global outage.\"\nNadella: \"Well, there's about to be one...\" tries to send email \"Dammit!\""}, {"id": 50633514, "au": "nsbdhciebsbdhc", "dom": 177, "sr": 67, "sc": 1.95, "ep": 2.76, "bs": 0.0, "d": 2, "age": 3.92, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 46, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's a pretty big difference between vanity products such as movie maker and a global outage causing trillions in damages. Windows server has historically been reasonably solid."}, {"id": 50632034, "au": "meowkit", "dom": 161, "sr": 68, "sc": 1.95, "ep": 2.7, "bs": 0.0, "d": 2, "age": 5.52, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1229, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.808, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The root cause analysis determined AI was not used.\n\nIt was funny on the day, but no need for these mindless hot takes anymore."}, {"id": 50632390, "au": "riffic", "dom": 185, "sr": 69, "sc": 1.95, "ep": 2.63, "bs": 0.0, "d": 0, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 6205, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.118, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Just pack up the offices and sell the company to another organization with competent Site Reliability Engineering capacities. Microsoft has never had the organizational culture to pull this off."}, {"id": 50634346, "au": "pjmlp", "dom": 37, "sr": 70, "sc": 1.95, "ep": 2.59, "bs": 0.0, "d": 4, "age": 3.06, "grav": 18.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because they could pick Apple or Microsoft, clang instead of GCC, Emacs and vi instead VSCode, plain JavaScript, Angular instead of React,...."}, {"id": 50632693, "au": "sorokod", "dom": 109, "sr": 71, "sc": 1.95, "ep": 2.56, "bs": 0.0, "d": 2, "age": 4.83, "grav": 31.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 5321, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.09, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"I had never seen an organization so far from reality\"\n\nIt is an structural, social and political disfunction. Technology is just stage decoration, it is not part of the problem or a solution."}, {"id": 50631813, "au": "marysol5", "dom": 157, "sr": 72, "sc": 1.95, "ep": 2.55, "bs": 0.0, "d": 1, "age": 5.76, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 176, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Seeing as how Microsoft lives on, and has taught legions of administrators to just, \"turn it off and on again\"....\n\nServer 1: BSOD\n\nLinux Admin: \"Pull the crash dump, so we can actually see what caused this\"\n\nWindows Admin: \"The what now? I rebooted it\""}, {"id": 50632755, "au": "jaggederest", "dom": 91, "sr": 73, "sc": 1.95, "ep": 2.55, "bs": 0.0, "d": 2, "age": 4.76, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 10755, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Honestly any properly set up datacenter you should be able to walk in and yank any single cable, virtually anywhere, without a serious issue. Although I suppose if you do that to the power cable to one of the larger UPCs you might create an arc flash hazard and barbecue yourself."}, {"id": 50633102, "au": "le-mark", "dom": 170, "sr": 74, "sc": 1.95, "ep": 2.53, "bs": 0.0, "d": 0, "age": 4.35, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 4439, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "Big layoffs, big outages. Usually they don’t effect quite so many industries, companies, and countries, so impactfully."}, {"id": 50636063, "au": "pjmlp", "dom": 34, "sr": 75, "sc": 1.95, "ep": 2.47, "bs": 0.0, "d": 4, "age": 0.64, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 1.052, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, today is usually made in a depreciative tone, as if they no longer matter, that forgets about what acquisitions were made of FOSS projects, in the sense where the devs are taking their payroll from."}, {"id": 50633355, "au": "kshacker", "dom": 30, "sr": 76, "sc": 1.95, "ep": 2.45, "bs": 0.0, "d": 1, "age": 4.07, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1126, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.965, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Maybe they would not have reduced the outages, but they could have reduced the duration of the outage. However good AI may be, at some point of time, you need dedicated eyes or dedicated hands on the problem, although they can say dedicated agents would be as good."}, {"id": 50632839, "au": "nsbdhciebsbdhc", "dom": 180, "sr": 77, "sc": 1.95, "ep": 2.44, "bs": 0.0, "d": 2, "age": 4.67, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 46, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 1.039, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Without looking I'm sure Microsoft is making record profits. Upper management isn't slop, but they're short sighted. They'll lose their foothold if they're not careful."}, {"id": 50633387, "au": "dominotw", "dom": 39, "sr": 78, "sc": 1.95, "ep": 2.42, "bs": 0.0, "d": 1, "age": 4.04, "grav": 25.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 4, "k": 6923, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.28, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> ~45% of their 2022-era staff.\n\nyou mean that was their peak at 2022? or specifically offered to employees who joined during that period."}, {"id": 50634493, "au": "surgical_fire", "dom": 79, "sr": 79, "sc": 1.95, "ep": 2.39, "bs": 0.0, "d": 5, "age": 2.85, "grav": 17.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 1.018, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No.\n\nSometimes a hotfix needs to be applied quicker. You may not have time to let it soak on a QA environment, go through your usual release approval process, etc.\n\nThe purpose of the process is to reduce the anount of times a hotfix is even needed and evaluate the risk of what is being shipped."}, {"id": 50635814, "au": "kozikow", "dom": 98, "sr": 80, "sc": 1.95, "ep": 2.25, "bs": 0.0, "d": 0, "age": 1.05, "grav": 7.4, "surf": 6.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1312, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Reading about this outage to me it almost sounds like they don't do proper gradual rollouts, feature flags, etc. ?"}, {"id": 50634183, "au": "orev", "dom": 115, "sr": 81, "sc": 1.95, "ep": 2.17, "bs": 0.0, "d": 2, "age": 3.3, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 7335, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.926, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unless every other method of communication is blocked, there will always be side channels. Sometimes to discuss more details that are too much for the main group, and other times because there are people who want special treatment to get their stuff moved to the top of the queue."}, {"id": 50635424, "au": "t43562", "dom": 76, "sr": 82, "sc": 1.95, "ep": 2.14, "bs": 0.0, "d": 5, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2851, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.846, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "When you have a broken system the risk/reward changes.  If you break it further the users may not notice so you might take more risk to get a hotfix out but then you keep it as simple as possible to limit that risk.\n\nIn normal development one would let through much larger changes, having put them through much more checking."}, {"id": 50633157, "au": "mosura", "dom": 82, "sr": 83, "sc": 1.95, "ep": 2.12, "bs": 0.0, "d": 3, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1806, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Exactly the brain rot I am on about.\n\nIt doesn’t matter that k8s does graceful shutdowns all the time, the point is you must handle when they do not as well, and if you did that the graceful ones are only a special case. The culture around k8s in practice ignores this to a dangerous degree."}, {"id": 50634400, "au": "whoamii", "dom": 114, "sr": 84, "sc": 1.95, "ep": 2.07, "bs": 0.0, "d": 2, "age": 2.98, "grav": 18.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 109, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.881, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is the case at Microsoft for trivial incidents also. When you’re going down many rabbit holes in a complex distributed system, you don’t want all the comms for that to happen real-time in one place though."}, {"id": 50635501, "au": "brookst", "dom": 28, "sr": 85, "sc": 1.95, "ep": 2.05, "bs": 0.0, "d": 3, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.871, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There weren’t many best performers left after the previous year or two of “maybe you’ll get laid off today, maybe tomorrow.\n\nThis is likely to get rid of what few stars were left.\n\nThere will be books written about how Microsoft tricked itself into self-destruction. It’s weird and sad and was totally avoidable."}, {"id": 50632841, "au": "EmX_3000", "dom": 166, "sr": 86, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 0, "age": 4.66, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.622, "fa": 0.0, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "Do they really have to care? MS is like Oracle and IBM, people use MS products because they've already been roped in, it's not like people are going to suddenly dump them and switch to some other vendor."}, {"id": 50635491, "au": "chokolad", "dom": 25, "sr": 87, "sc": 1.78, "ep": 1.78, "bs": 0.0, "d": 3, "age": 1.53, "grav": 9.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 966, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.343, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the offer is essentially lay off package. You might as well not take it and get it later if they decide to lay you off involuntarily. I highly doubt more than 20% will accept it."}, {"id": 50634433, "au": "bigstrat2003", "dom": 182, "sr": 88, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 1, "age": 2.94, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.753, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's unreal. They caused a massive outage with AI slop and lack of engineering, and their proposed solution is to double down on AI. It truly is a religion to these people."}, {"id": 50635347, "au": "snarfy", "dom": 169, "sr": 89, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 0, "age": 1.73, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 7124, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.696, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "It doesn't matter when everything is a code red.\n\nWhat they really need to code red is the leadership, business practices, and engineering quality."}, {"id": 50634733, "au": "EmX_3000", "dom": 168, "sr": 90, "sc": 1.68, "ep": 1.68, "bs": 0.0, "d": 2, "age": 2.56, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.716, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would agree that they have to appear to care. But in reality, will the whole government switch away? No. Even if this happens again and again. MS is locked in to those contracts, it would take an Act of Congress to change things."}, {"id": 50635151, "au": "stackghost", "dom": 174, "sr": 91, "sc": 1.62, "ep": 1.62, "bs": 0.0, "d": 0, "age": 1.97, "grav": 12.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 35, "k": 2862, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ibm_red", "flbl": "Ibm & Red (Server)", "urls": [], "ig": 0.66, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "> Despite deploying top engineering personnel, responders exchanged more than 11,000 messages across 11 Teams chats and struggled  to maintain a cohesive picture of hypotheses and decisions because diagnostic data was scattered across fragmented internal tracking systems, Silver said.\n\nYep that’s a very accurate description of how painful Microsoft products are to use for its customers."}, {"id": 50633979, "au": "SoftTalker", "dom": 90, "sr": 92, "sc": 1.6, "ep": 1.6, "bs": 0.0, "d": 2, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.68, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For me it was doing anything remotely that might cause me to lose remote access. Despite carefully thinking about it and proceeding very deliberately, more often than not I'd lock myself out."}, {"id": 50634314, "au": "shimman", "dom": 36, "sr": 93, "sc": 1.6, "ep": 1.6, "bs": 0.0, "d": 3, "age": 3.1, "grav": 18.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2056, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "graceful_k8s", "flbl": "Graceful & K8s (Shutdowns)", "urls": [], "ig": 0.68, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why is it ironic? You make it seem like workers have any autonomy to procure stuff to do their job and not the reality that they are being forced to use suboptimal/inefficient tools."}, {"id": 50634593, "au": "lenerdenator", "dom": 43, "sr": 94, "sc": 1.59, "ep": 1.59, "bs": 0.0, "d": 3, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 7452, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.676, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Gordon Gekko would resent being compared to Larry Ellison.\n\nSure, he's a corporate raider and inside trader, but so far as we know, he wasn't (allegedly) leaving a skeleton crew to make changes to software that hospitals use to do perioperative tasks (read: anesthesia work) on patients."}, {"id": 50633468, "au": "siliconc0w", "dom": 67, "sr": 95, "sc": 1.52, "ep": 1.52, "bs": 0.0, "d": 3, "age": 3.96, "grav": 24.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 5880, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.55, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "In fairness, a hotfix is a very tactical low risk change so the risk is much different from a feature release.\n\nThat said, generally agree that process heavy release processes with tons of human gates are unproductive."}, {"id": 50632732, "au": "darth_avocado", "dom": 143, "sr": 96, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 1, "age": 4.79, "grav": 31.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 13977, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "incident_services", "flbl": "Incident & Services (Microsoft)", "urls": [], "ig": 0.621, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "People get on a incident bridge, pull in the right people, spend some time in RCA, and then find out the right people were actually laid off 9 months ago. And now someone with no context is going to have a miserable day."}, {"id": 50635951, "au": "brewdad", "dom": 24, "sr": 97, "sc": 1.39, "ep": 1.39, "bs": 0.0, "d": 4, "age": 0.79, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 4583, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "buyout_microsoft", "flbl": "Buyout & Microsoft (Engineers)", "urls": [], "ig": 0.592, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Folks towards the end of their careers might well take a nice lump sum buyout and try out the retirement life for a while. Worst case, you start job hunting again when you decide you aren’t ready for that much free time.\n\nBaristaFIRE is quite popular."}, {"id": 50634219, "au": "greazy", "dom": 46, "sr": 98, "sc": 1.23, "ep": 1.23, "bs": 0.0, "d": 2, "age": 3.24, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1133, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.525, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yep that's the idea. This is why the CDC uses zombie outbreak scenario to demonstrate the importance of  preparedness.\n\nThe point is not to prepare for the known but the unknown. And zombies tick off a lot of boxes."}, {"id": 50633180, "au": "UltraSane", "dom": 138, "sr": 99, "sc": 1.12, "ep": 2.31, "bs": 1.19, "d": 0, "age": 4.26, "grav": 27.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 3383, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.698, "fa": 0.0, "gp": 0.465, "bl": 0.45, "ds": 0.0, "txt": "Not finding the concurrency bug before deploying the update to so many servers reveals some very poor engineering practices."}, {"id": 50635305, "au": "derriz", "dom": 77, "sr": 100, "sc": 0.83, "ep": 0.83, "bs": 0.0, "d": 5, "age": 1.79, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2681, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_change", "flbl": "Process & Change (Fix)", "urls": [], "ig": 0.354, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why should the process be the same whe
