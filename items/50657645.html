 "count": 19, "useful": 4, "useful_pct": 21.1, "terms": "victim, recovery, fraud, cover"}, {"slug": "general_commentary", "label": "General Commentary", "count": 25, "useful": 1, "useful_pct": 4.0, "terms": "general, commentary"}], "source_categories": [{"category": "primary_technical_doc", "count": 3}, {"category": "gov_legal", "count": 2}, {"category": "investigative_or_tech_press", "count": 1}, {"category": "general_web", "count": 1}], "story_anchors": ["wire", "price", "fraud", "government", "victim", "charging", "company", "paid", "ransomware", "victims", "firm", "system", "negotiating", "charged", "fbi", "group", "decryption", "ransom"], "largest_root": {"root_id": 50658367, "author": "wongarsu", "slots": 80, "start_dom": 1, "end_dom": 80, "share_pct": 50.6, "top_dom1_age": 24.5, "top_dom1_author": "wongarsu"}, "buried_cutoff": 47, "rescue_top_k": 32, "ablations": [], "tournament": [], "comments": [{"id": 50661599, "au": "somenameforme", "dom": 37, "sr": 1, "sc": 15.09, "ep": 15.09, "bs": 0.0, "d": 1, "age": 18.36, "grav": 226.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 229, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": ["https://www.law.cornell.edu/uscode/text/18/1343"], "ig": 1.755, "fa": 3.58, "gp": 0.529, "bl": 0.0, "ds": 0.0, "txt": "The wire fraud criminal code [1] dates back to 1952. It was originally intended to criminalize various little scams that were playing out on television advertising - bait and switch, exaggerations of quality of characteristics, and other such stuff [that's mostly expected in modern advertising ironically].\n\nBecause of this the legalese is super broad. It's now anything that 'obtains money or property by means of false or fraudulent pretenses or representations that is transmitted by wire, radio, or television communication.\" So basically any lie that can lead to the gain of anything material is wire fraud. For instance if you exaggerate your credentials on a resume that's sent by email, that's 100% wire fraud. You're probably not going to get prosecuted for that, but you could.\n\nIt's an absurdly broad law that needs to be reformed, but it won't be, precisely because it's now a super law. Anytime the government doesn't have an otherwise clear case against somebody - they can just charge them with wire fraud. And it comes with absolutely massive penalties including up to 20 years in prison.\n\n---------\n\nTo be clear I'm not saying what happened here shouldn't be illegal, but that there should be a law like 'false billing' when a company charges for services that were not actually carried out. The current wire fraud law is just too broad and too powerful a weapon for the government "}, {"id": 50659100, "au": "sam1714", "dom": 147, "sr": 2, "sc": 11.15, "ep": 11.15, "bs": 0.0, "d": 1, "age": 23.41, "grav": 338.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 28, "qw": 5, "k": 209, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": ["https://www.law.cornell.edu/wex/separate_sovereigns_doctrine"], "ig": 0.884, "fa": 2.77, "gp": 0.814, "bl": 0.0, "ds": 0.0, "txt": "> 8.2% of federal charges are dropped\n\nOften because of a successful state conviction. Parallel federal charges are often filed as a backup, as you can be prosecuted, found guilty and punished twice under the two jurisdictions. [1]\n\n[1] https://www.law.cornell.edu/wex/separate_sovereigns_doctrine"}, {"id": 50659653, "au": "avodonosov", "dom": 81, "sr": 3, "sc": 9.25, "ep": 9.25, "bs": 0.0, "d": 0, "age": 22.62, "grav": 319.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 126, "k": 2082, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.391, "fa": 1.37, "gp": 1.429, "bl": 0.0, "ds": 0.0, "txt": "Initially he only included a 2% margin - $260 over the around $13,000 requested by the fake ransomware group as the lowest possible price. And that $260 might have been just to account for bitcoin volatility.\n\nOnly after this was comminicated to the fake victim, the fake ransomware group agreed to reduce the price. What should have he done, tell the customer that his yesterday's quote was a mistake?\n\nAs for the initial $2,750 diagnostic fee, why can't he charge that, he did perform some initial study of the case.\n\n> The government said Palacio soon after contacted the fake ransomware group run by the FBI and requested the lowest possible price for the decryptor. FBI investigators responded with a price of .2 bitcoin, or around $13,000 at the time. Less than 48 hours later, Palacio allegedly told agents acting as the victim company that the diagnostic assessment was successful and that the cost of decrypting the files would be $13,260.\n\n> The following day, the government alleges, Palacio messaged the fictitious ransomware group operated by the feds and asked to reduce the ransom demand to $4,000 for the purchase of a decryption tool. The indictment states that the agreed upon price was around $6,000 in bitcoin, and that Palacio charged the FBI’s fake victim firm $16,010, including an initial $2,750 diagnostic fee and the full fee of $13,260."}, {"id": 50663181, "au": "Aurornis", "dom": 88, "sr": 4, "sc": 8.52, "ep": 8.67, "bs": 0.0, "d": 1, "age": 13.85, "grav": 144.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 14, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.219, "fa": 1.37, "gp": 1.309, "bl": 0.0, "ds": 0.0, "txt": "> What should have he done, tell the customer that his yesterday's quote was a mistake?\n\nIf you broker a deal for a client, you have to be honest about what they’re paying for. If you tell them that it costs $13,000 but it actually costs $4,000 and you pocket the difference, that’s fraud.\n\nIt would be different to say “I will solve your problem for $16K, leave the details to me”. That’s fair.\n\nCharging someone a $2,750 fee and then billing them a line item for $13,000 for what’s supposed to be a pass-through payment is fraud if you only actually pass through $4,000.\n\nIt feels like a fine line but it’s actually not once you consider what contracts and invoices would look like."}, {"id": 50659882, "au": "strangattractor", "dom": 131, "sr": 5, "sc": 8.4, "ep": 8.4, "bs": 0.0, "d": 3, "age": 22.28, "grav": 311.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 376, "qw": 0, "k": 1705, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 2.175, "fa": 0.68, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "No regulation - a government that doesn't enforce laws.\n\nUsing Gemini:\nEnforcement data from the Federal Trade Commission (FTC), Consumer Financial Protection Bureau (CFPB), and Department of Justice (DOJ) shows two distinct patterns: Florida both produces a disproportionately high share of nationwide telemarketing/debt-relief boiler rooms and ranks near the top for victim fraud reports per capita.\n\nWhy Florida Produces So Many Debt & Tax Relief Operations\n\n• Concentrated Telemarketing Infrastructure: For decades, Broward, Palm Beach, and Miami-Dade counties (especially cities like Fort Lauderdale, Boca Raton, Coral Springs, and Pompano Beach) have had a dense ecosystem of call-center operators, lead generators, and payment processors. When regulators shut down one operation, former managers and sales agents frequently spin up new LLCs nearby.\n• Low Barriers to Forming Shell LLCs: Registering a new limited liability company through Florida's Sunbiz portal is inexpensive and fast, allowing repeat offenders to rotate through dozens of front names, virtual mailboxes, and merchant accounts to stay ahead of chargebacks and lawsuits.\n• Recycled Industry Networks: Major federal crackdowns—such as the FTC and Florida Attorney General cases against Financial Freedom National (which operated under 11+ corporate names) and Accelerated Debt (shut down in October 2026 with a $106.8 million "}, {"id": 50658926, "au": "autoexec", "dom": 76, "sr": 6, "sc": 7.51, "ep": 7.65, "bs": 0.0, "d": 2, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 24, "k": 23004, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.715, "fa": 0.76, "gp": 1.004, "bl": 0.0, "ds": 0.0, "txt": "> Yeah - I'm struggling with this - was he deceiving people? How else were they thinking the data was being retrieved, magic?, brute force?, military/police attacks?\n\nYes, the service lied by saying they could brute force the encryption and crack it with their \"forensic servers of the maximum quantitative capacity\"\n\nFTFA:\n\nThe proposal stated that the recovery process involved reverse engineering the ransomware encryption using “510 preconfigured forensic servers of the maximum quantitative capacity located in different parts of the world.”\n\n“Our programmers will inject randomly the encryption codes extracted during the forensic and cryptographic analysis using brute force processes,” the proposal claimed."}, {"id": 50658920, "au": "hermannj314", "dom": 146, "sr": 7, "sc": 7.25, "ep": 7.4, "bs": 0.0, "d": 0, "age": 23.71, "grav": 345.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 3817, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 1.355, "fa": 0.95, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "It is important to note that the US government is often wrong.\nPer a google search, 8.2% of federal charges are dropped and 0.4% of defendants of all those charged are acquitted. (15% of those that go to trial are acquitted)\n\nAlso, there is about a 1.7% chance Trump will pardon you (70 fraud pardons in a year over around 4000 convictions in a year)\n\nThere is hope"}, {"id": 50659557, "au": "paulpauper", "dom": 52, "sr": 8, "sc": 7.02, "ep": 7.31, "bs": 0.0, "d": 2, "age": 22.77, "grav": 323.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 52123, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 1.249, "fa": 0.95, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Trump grants pardons to a tiny fraction of applicants, among the lowest rates of any recent president (excluding Jan 6th blanket pardon):\n\nClinton: 396 of 2,001, about 20%\n\nReagan: 393 of 2,099, about 19%\n\nGeorge H.W. Bush: 74 of 731, about 10%\n\nGeorge W. Bush: 189 of 2,498, about 8%\n\nTrump, first term: 144 of 1,969, about 7%\n\nObama: 212 of 3,395, about 6%\n\nBiden: 80 of 1,666, about 5%\n\nnot trying to defend Trump here, but just pointing out that the common narrative that Trump is giving pardons like candy is wrong. It's very hard to get a pardon from Trump--,much more so than many past presidents."}, {"id": 50663372, "au": "rjzzleep", "dom": 97, "sr": 9, "sc": 6.95, "ep": 7.25, "bs": 0.0, "d": 2, "age": 13.31, "grav": 135.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 8602, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.354, "fa": 0.95, "gp": 0.937, "bl": 0.0, "ds": 0.0, "txt": "Kinda wish the HN crowd had the same reaction to the plethora of SV executive fraudsters. But in the words of my favorite \"comedian\":\n\nIf I owe $1000 its my problem. If I owe $10 million its the banks problem. If I owe $1 billion I'm a successful businessman."}, {"id": 50663341, "au": "jibalt", "dom": 59, "sr": 10, "sc": 6.67, "ep": 7.11, "bs": 0.0, "d": 3, "age": 13.39, "grav": 137.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 16, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 1.674, "fa": 0.76, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "> not trying to defend Trump here\n\nThat is EXACTLY what you are doing. And you are not only fudging the numbers but you are ignoring who he is granting pardons to and why. His pardons have blocked payment of $2 billion in fraud restitution -- he pardons fraudsters because they pay him to. And the motto of his pardon office is \"No MAGA left behind\".\n\n> the common narrative that Trump is giving pardons like candy\n\nThat is NOT \"the common narrative\", it's an extremely strawmanned misrepresentation. The common charge is that Trump's policy is pardon-for-pay and for political favors. It's an ELITE service, not something for the everyman (except the J6ers whom you absurdly exclude). Yes, it's hard to get a DESERVED pardon from Trump, as opposed to many past Presidents.\n\nI refute extreme levels of intellectual dishonesty and bad faith but I don't otherwise engage so I won't be commenting further.\n\n[Meanwhile, any reasonable response to the way overbroad bothsidesy cynical claim of the GP has been derailed]"}, {"id": 50661468, "au": "nirvdrum", "dom": 36, "sr": 11, "sc": 6.36, "ep": 6.8, "bs": 0.0, "d": 4, "age": 18.76, "grav": 235.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3991, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.241, "fa": 0.95, "gp": 0.814, "bl": 0.0, "ds": 0.0, "txt": "The article says the ransomware group quoted 0.2 BTC (~$13,000) and he turned around and quoted the victim $13,260. After that he tried to negotiate the ransomware group down to $4,000 and settled at $6,000. Despite the successful negotiation, he still charged the victim the full $13,260 and tacked a made up $2,750 diagnostic fee on top of that for a total of $16,010. He was not negotiating on behalf of his customer."}, {"id": 50664131, "au": "14", "dom": 117, "sr": 12, "sc": 6.25, "ep": 6.25, "bs": 0.0, "d": 0, "age": 11.43, "grav": 107.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 179, "qw": 0, "k": 1805, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.523, "fa": 0.68, "gp": 0.507, "bl": 0.0, "ds": 0.0, "txt": "Ultimately as the broker/ middleman you are taking on the role of trusted expert in assisting with victims being blackmailed or coerced into a situation that they are not qualified to navigate. That puts you in a position of power over the victim. And like any profession that puts a person into a position of power they all come with ethical expectations that one will conduct themselves in a moral manner and not take advantage of the power you have over someone. \nSo by this company not being upfront and fully transparent it leaves them open to an accusation of abuse of power and thus fraud. \nIf they wanted more money all they needed to do is put it in the contract. Charge what you need to make it worth the effort and be upfront. Your reputation should rely on your track record of successfully negotiating and data recovery. If that means you need to change $10k or $20k so be it. But the second you lie then it makes it very hard to know if you are not actually part of the problem."}, {"id": 50666127, "au": "dannyw", "dom": 7, "sr": 13, "sc": 6.16, "ep": 6.6, "bs": 0.0, "d": 4, "age": 7.03, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 16166, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.585, "fa": 0.62, "gp": 0.768, "bl": 0.0, "ds": 0.0, "txt": "Ransomware payments are not specifically prohibited under Australian law, although you could face legal exposure if you end up paying someone who is sanctioned.\n\nThe laws also require you to generally disclose to an intelligence agency within (iirc) 24 hours after payment, however you receive some legal protection for that disclosure.\n\nIn practice, it's more of a deliberately obfuscated caution-and-report scheme."}, {"id": 50667957, "au": "the_af", "dom": 5, "sr": 14, "sc": 5.36, "ep": 5.8, "bs": 0.0, "d": 4, "age": 4.12, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 35, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.424, "fa": 0.64, "gp": 0.437, "bl": 0.0, "ds": 0.0, "txt": "> Yeah, the company may not actually care how they got the result and they probably know better, in fact. They are pretending to believe because they want a result but also want their asses covered legally.\n\nUnlikely, since some of the victims ended up tipping the FBI. Also, the scammers aggressively scan the victim's system to cover their tracks and delete ransom notes, etc, which is surely not something you want them doing in your corporate systems. If this was collusion between victim and the \"recovery service\", they wouldn't let them access and scan their systems or delete files!\n\nThis all points to actual fraud, and (at least some of) the victims being clueless. And upset when they found out, which is why they notified the FBI in at least some cases."}, {"id": 50658276, "au": "lnxsxu", "dom": 137, "sr": 15, "sc": 5.31, "ep": 7.83, "bs": 2.52, "d": 0, "age": 24.72, "grav": 370.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.344, "fa": 1.23, "gp": 0.803, "bl": 0.95, "ds": 0.0, "txt": "imagine being the fbi agent getting haggled down on a ransomware key while your colleague has a quote for “advanced cryptography” in their inbox. according to the indictment, the vendor talked the price down from about $13k to $6k and billed the customer $13,260 for decryption. pretty good negotiating for a company that said it never negotiated."}, {"id": 50664163, "au": "awesome_dude", "dom": 72, "sr": 16, "sc": 5.17, "ep": 5.61, "bs": 0.0, "d": 6, "age": 11.35, "grav": 106.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 1.52, "fa": 0.34, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "How so, it's an accurate interpretation of the advertised claims.\n\nThe problem people have is they apply an interpretation of their own that is heavily influenced by privilege.\n\nAn algorithm is only a \"a finite, step-by-step set of rules or instructions used to solve a problem, perform a calculation, or complete a task\"\n\nThem emailing for a key is an algorithm that does indeed obtain a ransomware removal tool that does indeed result in a 100% restoration of the data\n\nIf you disagree, which you are welcome to do, you could do the good faith thing and explain why it hasn't met those claims"}, {"id": 50661824, "au": "the_af", "dom": 33, "sr": 17, "sc": 5.0, "ep": 5.44, "bs": 0.0, "d": 4, "age": 17.77, "grav": 215.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 32, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.221, "fa": 0.64, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "> It sounds to me that he would contact the ransomers first to talk the price down, then offer a price above that reduced ransom but still below the initial ransom to his client.\n\nThat's not what he did in one of the cases mentioned in TFA. He simply asked what the ransom was, added a \"research fee\" and quoted that back to the client. Only then did he try to negotiate the ransom down with the hackers, for his exclusive benefit.\n\nThe customers would be willing to pay him more than the ransom because they trusted the bad guys weren't receiving a dime!\n\nHe wasn't providing any benefit to the client, only a markup for an alleged service he didn't actually provide (bypassing the hackers)."}, {"id": 50658638, "au": "lesuorac", "dom": 22, "sr": 18, "sc": 4.78, "ep": 5.22, "bs": 0.0, "d": 1, "age": 24.16, "grav": 356.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 7, "k": 5663, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.368, "fa": 0.42, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "> But is there intent to defraud here?\n\nUh yes?\n\nIf you say you don't do X to get somebody to give you money but you do X then it's textbook fraud. You're lying for financial gain.\n\nI'm willing to give some lee-way if you didn't intend to do X but it kinda just happened. Say you run a dog grooming service and you tell people you don't muzzle dogs but somebody's dog got super aggressive so you muzzled them while you waited for the owner to return. However, that's not the case here. They routinely just emailed the ransomware group to negotiate payment for decryption."}, {"id": 50660278, "au": "plandis", "dom": 79, "sr": 19, "sc": 4.76, "ep": 5.2, "bs": 0.0, "d": 2, "age": 21.47, "grav": 293.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2283, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.527, "fa": 0.22, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "The indictment is directly linked in the article and it outlines the facts and why/how the law was alleged to be violated. Did you read it?\n\nHe was deceiving people by claiming to use proprietary tools to decrypt the data without paying the ransom. The guy even allegedly gave customers a personally signed certificate certifying that he never contacted, negotiated with, or paid the ransomware group. The indictment directly quotes part of this certificate."}, {"id": 50660264, "au": "jongjong", "dom": 4, "sr": 20, "sc": 4.69, "ep": 5.13, "bs": 0.0, "d": 3, "age": 21.5, "grav": 293.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 3072, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.482, "fa": 0.34, "gp": 0.466, "bl": 0.0, "ds": 0.0, "txt": "Yeah, the company may not actually care how they got the result and they probably know better, in fact. They are pretending to believe because they want a result but also want their asses covered legally.\n\nIt seems more that they defrauded the government rather than the customers themselves... And maybe some clients were partially in on the fraud; pretending that they didn't know how he delivered results. The customer simply wanted everyone to believe that they refused to pay ransom. So the customer wasn't defrauded; they got exactly what they paid for...\n\nNow with this indictment, they all get to act surprised... I can imagine some top corporate CTO who has a PhD in cryptography and in charge of security \"Oh my, I'm shocked that this Ransomwarehelp business we used turned out to be a fraud! I had no idea that they couldn't actually crack 256-bit AES with Sha-512 key derivation!\""}, {"id": 50658231, "au": "nickff", "dom": 120, "sr": 21, "sc": 4.53, "ep": 4.68, "bs": 0.0, "d": 1, "age": 24.79, "grav": 371.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 10, "k": 12721, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.978, "fa": 0.64, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": ">\"conned people into believing they weren't paying off ransomware assholes\"\n\nIt may have also been the case that this was a scheme to give the victims plausible deniability, as paying ransoms is usually illegal. That said, such a scheme would mean that Mr. Escobar was the one assuming liability for the illegal payment (as well as for the wire fraud)."}, {"id": 50661188, "au": "ChrisMarshallNY", "dom": 13, "sr": 22, "sc": 4.36, "ep": 5.02, "bs": 0.0, "d": 2, "age": 19.49, "grav": 250.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 37, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.249, "fa": 0.42, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "> If you tell someone that the price is based on a dozen engineers working for hundreds of hours, or that it's for time used on some sophisticated compute resources, but none of it ever happened, then that's fraud.\n\nGuarantee that there's already a bunch of businesses doing just that, right now, but using LLMs. Just one guy in his living room in his sweats, running Claude, but telling customers that he runs a full-fat human shop.\n\nProbably a number of folks, right on this site, are doing that."}, {"id": 50658367, "au": "wongarsu", "dom": 1, "sr": 23, "sc": 4.0, "ep": 4.88, "bs": 0.0, "d": 0, "age": 24.55, "grav": 365.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 33666, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.398, "fa": 0.0, "gp": 1.097, "bl": 0.0, "ds": 0.0, "txt": "That's an interesting case. It's not immediately clear to me that this even is wire fraud. There is material deception (they claim \"We never promote, intermediate or pay ransom to threat actors on behalf of our clients\", while paying ransom). But is there intent to defraud here? The customer does get what they asked for after all: they get their data back, at the price they were willing to pay\n\nThat that price was substantially higher than what the ransomware groups were charging RansomwareHelp seems inconsequential, every business has markups. And RansomwareHelp might have been able to get substantial discounts by being a trusted repeat customer for those ransomware groups"}, {"id": 50665402, "au": "miki123211", "dom": 38, "sr": 24, "sc": 3.77, "ep": 4.43, "bs": 0.0, "d": 1, "age": 8.55, "grav": 69.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 196, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.697, "fa": 0.0, "gp": 0.307, "bl": 0.0, "ds": 0.0, "txt": "It's compliance fraud more than anything else.\n\nMost large companies don't want payments to OFAC-sanctioned Russian entities in their corporate bank statements, as those statements have a high risk of being audited by regulators. Payments to some American cybersecurity consultancy that is too small to matter to anybody, though? Well, they've had a cybersecurity incident, those things happen sometimes, obviously they would hire some cybersecurity experts to fix the mess. Go along, nothing to see here sir.\n\nThe service these companies are providing is not a way to deal with ransomware, it's a way to deal with ransomware that lets you pretend to your regulators that you didn't know where your money would end up going. You can't do that when you are paying the Russians directly.\n\nAnother service those companies are providing is letting you deal with ransomware using your standard corporate invoicing tools, and by asking your bank for a routine wire transfer to a reputable contractor, something that you have established processes for and that your employees in accounting and procurement know how to do well, instead of having to deal with potentially converting millions of dollars to monero and establishing an account at something called a \"cryptocurrency exchange.\""}, {"id": 50659564, "au": "sam1714", "dom": 149, "sr": 25, "sc": 3.53, "ep": 4.89, "bs": 0.85, "d": 3, "age": 22.77, "grav": 322.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 209, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.722, "fa": 0.0, "gp": 0.581, "bl": 0.32, "ds": 0.0, "txt": "I'd just say it's hard to draw conclusions based on numbers.\n\nBut also the fact that a conviction wasn't won doesn't mean the prosecutors were wrong. Could be that the defendant was just good at covering up the crime. The criminal system, by design, gives a significant advantage to the defendant; the burden of proof to a high level is on the prosecution.\n\nFederal trials are usually much more complex than state trials, as large crimes tend to spill over state lines, affect taxes and banks, etc. so there's a greater attack surface to poke holes in."}, {"id": 50658890, "au": "gtowey", "dom": 2, "sr": 26, "sc": 3.44, "ep": 4.54, "bs": 0.0, "d": 1, "age": 23.76, "grav": 346.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 1903, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.297, "fa": 0.0, "gp": 1.03, "bl": 0.0, "ds": 0.0, "txt": "The fraud part is they bill the client with made up items. If you tell someone that the price is based on a dozen engineers working for hundreds of hours, or that it's for time used on some sophisticated compute resources, but none of it ever happened, then that's fraud.\n\nOn the other hand, if they just told clients the price was based on negotiating with the hackers and adding a arbitrary mark-up, then there would be no crime here. But then I doubt they would have any customers, because the victims could do that themselves."}, {"id": 50660871, "au": "circuit10", "dom": 26, "sr": 27, "sc": 3.16, "ep": 4.48, "bs": 0.0, "d": 1, "age": 20.33, "grav": 268.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 10, "k": 1732, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.115, "fa": 0.42, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "> The customer does get what they asked for after all\n\nIf you assume the customer is entirely selfish, but having done the right thing by not paying criminals clearly has value to some people that they're willing to pay extra for\n\nImagine if I started a climate offsetting service that was just a complete scam and did nothing, then tried to claim \"but that didn't harm you, you would have lost that money anyway if I had done something\". Obviously that should still be fraud"}, {"id": 50659453, "au": "sandeepkd", "dom": 8, "sr": 28, "sc": 2.96, "ep": 3.63, "bs": 0.0, "d": 2, "age": 22.94, "grav": 326.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 958, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 0.325, "bl": 0.0, "ds": 0.0, "txt": "There is definitely a marketing fraud involved, but that is way too obvious. If breaking encryption was such an easy task then they would be on some governments payroll by now\n\nAt the same time, to be honest I do not know if its a good thing or bad thing to shut them down. Chances are that they might have some home managed tools for easier stuff. And they do bring expertise on the table to negotiating with the hackers/bad actors, something that most victims would lack. May be their terms of service could be refined to capture the true nature and scope of business value."}, {"id": 50667401, "au": "CrazyStat", "dom": 73, "sr": 29, "sc": 2.91, "ep": 3.79, "bs": 0.0, "d": 7, "age": 4.92, "grav": 32.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 41, "k": 4276, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.019, "fa": 0.42, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "> If you disagree, which you are welcome to do, you could do the good faith thing and explain why it hasn't met those claims\n\nSure, that’s easy. The website claims:\n\n> Cryptography experts then use proprietary tools and recovery algorithms to decrypt or reconstruct data without paying attackers.\n\n(emphasis added).\n\nIf you explicitly advertise that you recover data without paying attackers but you actually just pay the attackers then you are lying and committing fraud.\n\nhth."}, {"id": 50659253, "au": "kobalsky", "dom": 3, "sr": 30, "sc": 2.75, "ep": 3.63, "bs": 0.0, "d": 2, "age": 23.21, "grav": 333.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 21, "k": 1873, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.84, "fa": 0.42, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "> if they just told clients the price was based on negotiating with the hackers ..., then there would be no crime here\n\nisn't it illegal to pay hackers in many places? I thought that's why companies were using these services, so they get a neat and tidy invoice they can pay with fiat."}, {"id": 50667901, "au": "the_af", "dom": 158, "sr": 31, "sc": 2.6, "ep": 3.04, "bs": 0.0, "d": 3, "age": 4.21, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't think that's the case, after all some of these victims ended up tipping the FBI about the scam, which means they were upset. Also, the fraudster accessed their systems (under the pretense of doing an \"assessment\") so that they could cover their tracks and delete files that would give the customer a hint of the collusion between the \"recovery expert\" and the hackers.\n\nSo it all points to fraud, plain and simple, and not to the customers turning a blind eye."}, {"id": 50667663, "au": "Zambyte", "dom": 143, "sr": 32, "sc": 2.37, "ep": 3.03, "bs": 0.0, "d": 2, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.023, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Companies don't make decisions, people make decisions. The person making the decision to spend extra money on plausible deniability was not spending their own money, they were spending the companies money. Why wouldn't the person spend money that isn't theirs on plausible deniability? For the love of the company?"}, {"id": 50664079, "au": "tsimionescu", "dom": 82, "sr": 33, "sc": 2.35, "ep": 3.01, "bs": 0.0, "d": 1, "age": 11.54, "grav": 108.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 57, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 0.707, "fa": 0.42, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Here is what the company charges you for:\n\n> “Our cryptography experts use proprietary tools and algorithms to achieve 100% data recovery, all backed by a success rate of over 99%,” the website enthused, claiming the company had over 28 years of experience and a team of 80 experts in cryptography, cybersecurity, forensic analysis and reverse engineering. “We never promote, intermediate or pay ransom to threat actors on behalf of our clients.”\n\nSo even if his quote were entirely reasonable, or even if he paid 20k dollars while charging 16k, this would still be, pretty clearly, fraud."}, {"id": 50662306, "au": "Exoristos", "dom": 19, "sr": 34, "sc": 2.15, "ep": 3.25, "bs": 0.0, "d": 1, "age": 16.32, "grav": 187.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1126, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": "If it's illegal in some jurisdictions to negotiate with the hackers, I find it credible the marketing was inaccurate mainly as legal cover. In that case, it's even possible that customers are aware of what is actually transpiring. It would be like hiring a black-market negotiator or clean-up man."}, {"id": 50658664, "au": "ErrantX", "dom": 49, "sr": 35, "sc": 2.08, "ep": 3.18, "bs": 0.0, "d": 3, "age": 24.13, "grav": 355.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 14616, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "No but the client chose a company who claimed not to need to negotiate, Vs other companies who up-front are clear they will negotiate for you.\n\nIt's not like there was no market here and they just cleverly positioned themselves. They played on human desire not to reward criminals, and presumably assumptions this was the cheap option.\n\nIt's intentional deception which is the definition of fraud."}, {"id": 50662658, "au": "awesome_dude", "dom": 77, "sr": 36, "sc": 2.0, "ep": 3.54, "bs": 0.0, "d": 3, "age": 15.41, "grav": 171.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 19, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.998, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> “Our programmers will inject randomly the encryption codes extracted during the forensic and cryptographic analysis using brute force processes,”\n\nthe email to the people making the ransom demands... sounds like that was done as part of the \"forensic\" analysis...\n\nI mean - the claim of fraud seems to hinge on people thinking the words used mean a Jack the ripper style cracker was used - but could equally mean exactly what we now know was being done..."}, {"id": 50658814, "au": "awesome_dude", "dom": 67, "sr": 37, "sc": 1.91, "ep": 3.45, "bs": 0.0, "d": 1, "age": 23.87, "grav": 349.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Yeah - I'm struggling with this - was he deceiving people? How else were they thinking the data was being retrieved, magic?, brute force?, military/police attacks?\n\nOn the other hand, rather than fraud, he was positioning himself as the clean front for the ransomware groups, that is, he wasn't doing the break in and theft, but he was their facilitator for getting paid."}, {"id": 50658045, "au": "rconti", "dom": 119, "sr": 38, "sc": 1.89, "ep": 3.28, "bs": 0.0, "d": 0, "age": 25.07, "grav": 378.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 14008, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "Have to admit I laughed out loud on this one. Should I have? I don't know.\n\nIt just seemed oddly quaint that it was simply a markup scheme (and, of course, conned people into believing they weren't paying off ransomware assholes). Look, that sucks. People don't want to support this kind of behavior, I get it.\n\nI guess I just expected it was going to be a racket where the data was being locked by the same people who were charging you to get the data back. But no, just a simple markup."}, {"id": 50658873, "au": "QuantumNomad_", "dom": 30, "sr": 39, "sc": 1.88, "ep": 3.42, "bs": 0.0, "d": 2, "age": 23.8, "grav": 347.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.235, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "He wasn’t even negotiating it for the client though.\n\nHe just starts off with whatever amount the ransomware campaign owner initially asks, adds his markup + fee on TOP of that and tells the client to pay that amount to him for his “service”, and then tries to negotiate down the amount so that he can increase his own share.\n\nHe’s not helping anyone save money, he’s just extracting money from the victim of a ransomware situation."}, {"id": 50658541, "au": "RobotToaster", "dom": 141, "sr": 40, "sc": 1.76, "ep": 2.79, "bs": 0.0, "d": 0, "age": 24.33, "grav": 360.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 9871, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.746, "fa": 0.22, "gp": 0.282, "bl": 0.0, "ds": 0.0, "txt": "I thought it was an open secret that all of these ransomware unlocking companies just paid the ransom while giving plausible deniability?"}, {"id": 50660319, "au": "lordnacho", "dom": 112, "sr": 41, "sc": 1.75, "ep": 2.85, "bs": 0.0, "d": 0, "age": 21.41, "grav": 291.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 31662, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.033, "fa": 0.0, "gp": 0.291, "bl": 0.0, "ds": 0.0, "txt": "I wonder if you could write the contracts so it isn't fraud? Just put \"let us do whatever we need to do, including paying the ransom\" in the contracts, and tell people that's just a break-glass that will not normally be needed.\n\nBecause the way it's described, it definitely seems like fraud to market the thing as \"won't pay the ransom\" when you actually just do that."}, {"id": 50665264, "au": "vintermann", "dom": 23, "sr": 42, "sc": 1.65, "ep": 2.98, "bs": 0.0, "d": 2, "age": 8.91, "grav": 73.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It isn't just intend to defraud, these people are basically on the side of the ransomware gangs.\n\nRansomware gangs have several problems. One problem is that a good number of their victims would rather suffer than give money to the guys who hurt them. Very understandable.\n\nAn even more direct one is that people don't trust them - why would you trust someone who just did this to you? Maybe they'll take the ransom and not follow through, just for the lulz. They're anonymous, so they have no credible way to commit, and they're treacherous or they probably wouldn't have gained access in the first place.\n\nA \"respectable\" recovery expert who really just negotiates, solves both these problems very effectively for them. No wonder they get discounts."}, {"id": 50667332, "au": "csomar", "dom": 87, "sr": 43, "sc": 1.65, "ep": 2.53, "bs": 0.0, "d": 4, "age": 5.04, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 19236, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 1.075, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The system doesn't make a police to police it. As Trump said: smart people police themselves. It can help you understand, also, why in many countries the police doesn't handle petty crime against the average citizen. It's not exactly violence against the system."}, {"id": 50659056, "au": "munchler", "dom": 31, "sr": 44, "sc": 1.55, "ep": 3.09, "bs": 0.0, "d": 3, "age": 23.48, "grav": 339.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 4225, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I doubt that clients were willing to pay him more than the initial ransom amount when they could instead pay the ransom directly. It sounds to me that he would contact the ransomers first to talk the price down, then offer a price above that reduced ransom but still below the initial ransom to his client."}, {"id": 50659893, "au": "mpeg", "dom": 34, "sr": 45, "sc": 1.46, "ep": 3.0, "bs": 0.0, "d": 4, "age": 22.25, "grav": 310.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 3211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your average ransomware victim CEO is not going to pay a bitcoin ransomware (they wouldn’t even know how to), but they’ll pay more than that to make the issue go away quietly.\n\nThis is simply an arbitrage business which relies on knowing which ransomware groups are legit and will deliver the decryption key. The fraud was lying about those methods and about pocketing the discount (a more honest service would have pre-agreed to split the discount)"}, {"id": 50658972, "au": "astura", "dom": 156, "sr": 46, "sc": 1.45, "ep": 2.7, "bs": 0.0, "d": 1, "age": 23.62, "grav": 343.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 10416, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are you kidding? Wire fraud is when you try to obtain money electronically through make material misrepresentations. If you're advertising \"don't pay ransom, we can decrypt the files without paying the ransom\" and you actually are paying the ransom that's material misrepresentations. The people using this service are usually explicitly trying to avoid paying the criminals."}, {"id": 50660810, "au": "technion", "dom": 18, "sr": 47, "sc": 1.41, "ep": 2.95, "bs": 0.0, "d": 1, "age": 20.47, "grav": 271.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 7201, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.0, "fa": 0.0, "gp": 0.411, "bl": 0.0, "ds": 0.0, "txt": "I'm not suggesting it should be legal or that he should get away with it, but I feel like this has always been a very open secret. Companies know they can only get data if they pay a ransom, and they know politically it's better if they pay someone who can make it go away for just above the ransom cost using wink wink secret skills."}, {"id": 50659062, "au": "mixdup", "dom": 29, "sr": 48, "sc": 1.36, "ep": 2.9, "bs": 0.0, "d": 2, "age": 23.47, "grav": 339.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1945, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 1.233, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The fact that he said he was figuring out how to decrypt the data and not pay the ransom is a material difference in what was being done. Some (possibly the majority or all) of his customers probably sought him out to avoid paying the ransom and avoid the attackers profiting from the attack\n\nHe wasn't selling \"we'll get your data back whatever it takes\" he was selling \"we'll use crypto magic to get your data back, don't pay the ransom\" but ended up just paying the ransom. Not a large leap to get a jury of even unsophisticated people to agree that is fraud"}, {"id": 50667250, "au": "rcxdude", "dom": 91, "sr": 49, "sc": 1.34, "ep": 2.44, "bs": 0.0, "d": 3, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 11684, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 0.773, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It depends on the nature of the contract. Time and materials (plus some agreed-on and transparent markup) is pretty common, and often much more fair if you have good trust in your supplier to not abuse it."}, {"id": 50667231, "au": "cowlevel", "dom": 86, "sr": 50, "sc": 1.34, "ep": 2.88, "bs": 0.0, "d": 5, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's always fraud but only the more regular people end of the fraud spectrum gets punished.\n\nSomeone else mentioned climate offsets, those are a good example. They are almost universally fraud since buying one doesn't actually result in any change to the climate, not even indirectly. Most companies supplying offsets just take the money and literally don't do anything with it."}, {"id": 50658415, "au": "munchler", "dom": 28, "sr": 51, "sc": 1.29, "ep": 2.83, "bs": 0.0, "d": 1, "age": 24.49, "grav": 364.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 4225, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.664, "fa": 0.0, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "It does seem like he was offering an actual service by negotiating the ransom price down on behalf of his clients. He just shouldn’t have lied about the process."}, {"id": 50661848, "au": "the_af", "dom": 50, "sr": 52, "sc": 1.23, "ep": 2.55, "bs": 0.0, "d": 3, "age": 17.69, "grav": 213.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 15268, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.085, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Like another commenter said, this is like the client paying someone to safely dispose of hazardous waste, then the service provider taking the money and just dumping it in the river.\n\nIt's fraud: they didn't do what they claimed they would, and accomplished the goal in a way explicitly against the terms of the service they were allegedly providing, while lying to the customer about it."}, {"id": 50660780, "au": "tptacek", "dom": 25, "sr": 53, "sc": 1.17, "ep": 2.71, "bs": 0.0, "d": 1, "age": 20.55, "grav": 272.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "These are the elements of a fraud case: material deception, relied on by the victim, for the profit of the offender. Add telecommunications, its wire fraud."}, {"id": 50659802, "au": "granfalloon", "dom": 17, "sr": 54, "sc": 1.08, "ep": 2.63, "bs": 0.0, "d": 1, "age": 22.39, "grav": 314.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 939, "kpp": 10.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.857, "fa": 0.0, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "I was looking at reviews for a company like this a while back, and there were a bunch saying stuff like \"This was expensive, but I was not willing to pay the criminals and am so grateful I was able to fight back.\" I know that I would be pissed off and feel I was defrauded."}, {"id": 50667013, "au": "cowlevel", "dom": 84, "sr": 55, "sc": 0.98, "ep": 2.3, "bs": 0.0, "d": 3, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 0.977, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What gets me angry about this is that companies engage in this sort of accountability shielding all the time and get away with it, but this particular instance is one that you or I could have come up with and executed, and it's the one that gets punished, extremely severely."}, {"id": 50661127, "au": "Scoundreller", "dom": 21, "sr": 56, "sc": 0.98, "ep": 2.49, "bs": 0.0, "d": 2, "age": 19.65, "grav": 253.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 18042, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.059, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the alternative is explaining to someone in Accounting why it can't be net30, why you can/t do an OFAC verification, and why nobody with signing authority can sign the company's Anti-Slavery Supplier Commitment. And we haven't even gone into explaining cryptocurrency to them.\n\nBetter to wink/wink nudge/nudge with a domestic business that will look the other way without putting down on ink how life actually works."}, {"id": 50660870, "au": "tdeck", "dom": 40, "sr": 57, "sc": 0.98, "ep": 2.46, "bs": 0.0, "d": 1, "age": 20.33, "grav": 268.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 11051, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 0.766, "fa": 0.0, "gp": 0.457, "bl": 0.0, "ds": 0.0, "txt": "Of course there's intent to defraud, frankly I'm scratching my head at why so many commenters are having trouble with this.\n\nThey're accepting money claiming to perform a service one way and instead doing it in an objectionable way that customers are trying explicitly to avoid. It would be no different than a company taking payment to safely dispose of hazardous waste and then dumping it in the river instead."}, {"id": 50663534, "au": "sandeepkd", "dom": 10, "sr": 58, "sc": 0.98, "ep": 2.44, "bs": 0.0, "d": 4, "age": 12.91, "grav": 129.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 958, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 1.039, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I do not have specifics so its hard to say. Its possible that the company is an accomplice in some of these incidents too, there is a motivation for that.\n\nHowever at the same time, I can say for certainty that the gap between the people who know the business and the ones who know cryptography is wide. My point was that is value in providing a legal way for such business to exists which can bridge this gap."}, {"id": 50666163, "au": "stingraycharles", "dom": 83, "sr": 59, "sc": 0.98, "ep": 2.42, "bs": 0.0, "d": 2, "age": 6.94, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 17383, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.764, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes but companies aren’t allowed to pay hackers ransoms so this allows them to have plausible deniability. That’s what the whole setup is about."}, {"id": 50664330, "au": "olalonde", "dom": 110, "sr": 60, "sc": 0.98, "ep": 2.39, "bs": 0.0, "d": 2, "age": 11.0, "grav": 101.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 27853, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 1.017, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm just hoping the upvotes are coming from people who didn't read the article. He was clearly committing fraud on multiple levels. He even tried sabotaging a negotiation so the victim would pay a higher ransom."}, {"id": 50658456, "au": "eddythompson80", "dom": 20, "sr": 61, "sc": 0.98, "ep": 2.34, "bs": 0.0, "d": 1, "age": 24.44, "grav": 363.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "Paying a ransom (or hiring someone to pay it for you) can have legal implications, right? and I'd imagine some organizations would have a strict policy or regulation about that."}, {"id": 50658806, "au": "arwineap", "dom": 121, "sr": 62, "sc": 0.98, "ep": 2.32, "bs": 0.0, "d": 2, "age": 23.88, "grav": 349.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 512, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.986, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is that true?\n\nI suspect that it's completely legal for a private entity to pay a ransom so long as you're not paying a sanctioned individual\n\nObviously depending on your jurisdiction"}, {"id": 50663586, "au": "ulrikrasmussen", "dom": 24, "sr": 63, "sc": 0.98, "ep": 2.24, "bs": 0.0, "d": 1, "age": 12.74, "grav": 126.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 4284, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.825, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "What if the customer would rather lose their data than pay the ransom, and hired this firm as a possibly more expensive alternative which doesn't fund the attackers?"}, {"id": 50660083, "au": "autoexec", "dom": 142, "sr": 64, "sc": 0.98, "ep": 2.16, "bs": 0.0, "d": 1, "age": 21.85, "grav": 301.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 23004, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.652, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What company would pay 10s of thousands to millions of dollars just to get plausible deniability? There's basically 0 penalty for paying the ransom."}, {"id": 50659217, "au": "hermannj314", "dom": 148, "sr": 65, "sc": 0.97, "ep": 2.14, "bs": 0.0, "d": 2, "age": 23.25, "grav": 334.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3817, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thank you for clarifying that. It is an important almost nullifying context to my point.  Maybe the government gets it right quite a bit."}, {"id": 50658657, "au": "lesuorac", "dom": 140, "sr": 66, "sc": 0.97, "ep": 2.06, "bs": 0.0, "d": 2, "age": 24.13, "grav": 355.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 5663, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 0.876, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd imagine the FBI would largely take any price as they need to return the money anyways.\n\nYou need the money to actually move to make it wire fraud as opposed to conspiracy."}, {"id": 50664755, "au": "8n4vidtmkvmk", "dom": 106, "sr": 67, "sc": 0.97, "ep": 2.05, "bs": 0.0, "d": 3, "age": 10.02, "grav": 87.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2228, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 0.676, "fa": 0.0, "gp": 0.317, "bl": 0.0, "ds": 0.0, "txt": "If you lie about your uptime, yes, I think so?\n\nAnd if you fail your SLA, it's usually written into the agreement what the compensation is, no? That's not fraud unless you also fail to compensate what you promised."}, {"id": 50658630, "au": "ejb999", "dom": 48, "sr": 68, "sc": 0.97, "ep": 2.03, "bs": 0.0, "d": 2, "age": 24.17, "grav": 356.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3178, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.643, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "yea, but the client didn't choose to negotiate and pay it themselves, did they?\n\n(Not defending this scummy practice, but doesn't seem to rise to 'illegal' imo)"}, {"id": 50660287, "au": "cannonpalms", "dom": 103, "sr": 69, "sc": 0.97, "ep": 1.99, "bs": 0.0, "d": 1, "age": 21.46, "grav": 292.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 217, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.678, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "I would assume the problem is that they state unequivocally that they do NOT facilitate ransom payments or negotiate with ransomware groups."}, {"id": 50661680, "au": "tefkah", "dom": 9, "sr": 70, "sc": 0.97, "ep": 1.98, "bs": 0.0, "d": 3, "age": 18.16, "grav": 222.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 282, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.845, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Id lean to this being a good thing no? The fewer people actually ending up paying ransomware groups the better. This man was just providing an additional way for these groups to get paid where they otherwise may not have been"}, {"id": 50663816, "au": "grey-area", "dom": 109, "sr": 71, "sc": 0.97, "ep": 1.9, "bs": 0.0, "d": 1, "age": 12.2, "grav": 118.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 24936, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "victim_recovery", "flbl": "Victim & Recovery (Fraud)", "urls": [], "ig": 0.81, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "He should have told the victim that he was paying a ransom, instead of lying to them, which is fraud. Glad to see they’re throwing the book at him.\n\nReally shocking that this apologia for fraud is the top comment here."}, {"id": 50660086, "au": "jeremyjh", "dom": 35, "sr": 72, "sc": 0.97, "ep": 1.83, "bs": 0.0, "d": 3, "age": 21.85, "grav": 301.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 0.779, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What are you basing these statements on? The article I read says he negotiated with the sting operation. It would be crazy for them not to negotiate. What concerns me is that could easily lead to a cozy ongoing business relationship."}, {"id": 50659069, "au": "croes", "dom": 66, "sr": 73, "sc": 0.97, "ep": 1.77, "bs": 0.0, "d": 1, "age": 23.46, "grav": 339.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 25736, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 0.755, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you ask their customers if they prefer paying the ransomware group themselves or let another company do it plus an extra fee, what do you think would be the answer?"}, {"id": 50659479, "au": "lukan", "dom": 46, "sr": 74, "sc": 0.97, "ep": 1.74, "bs": 0.0, "d": 1, "age": 22.89, "grav": 325.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 0.658, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "\"The customer does get what they asked for after all\"\n\nIf the deal was to get the data back without paying ransom, then they broke the deal - or rather did fraud by never having the intention to honour that deal. It is a difference paying criminals - or not."}, {"id": 50658618, "au": "ejb999", "dom": 154, "sr": 75, "sc": 0.97, "ep": 1.72, "bs": 0.0, "d": 0, "age": 24.2, "grav": 357.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3178, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.734, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "scummy behavior, but is it illegal? He quoted a price for a service, client agreed to pay for it, he delivered what the client wanted; definitely scummy and rent-seeking, but illegal?"}, {"id": 50670274, "au": "CrazyStat", "dom": 75, "sr": 76, "sc": 0.97, "ep": 2.55, "bs": 0.85, "d": 9, "age": 0.73, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 4276, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "companies_deniability", "flbl": "Companies & Deniability (Plausible)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "No, it's really not. No reasonable person interprets \"proprietary Play ransomware removal tools and algorithms\" to include emailing the attackers and paying the ransom. You're just really invested in defending blatant fraud for some reason."}, {"id": 50658600, "au": "asperous", "dom": 47, "sr": 77, "sc": 0.97, "ep": 1.68, "bs": 0.0, "d": 1, "age": 24.23, "grav": 358.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 2682, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.635, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "They are tricking them out of money because they are charging them over the cost of the ransom. The client, if not tricked, could have chosen to negotiate and pay it themself."}, {"id": 50665513, "au": "skeptic_ai", "dom": 90, "sr": 78, "sc": 0.97, "ep": 1.65, "bs": 0.0, "d": 2, "age": 8.27, "grav": 66.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 117, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.701, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Which company ever showed a pass through price? I never seen such a thing. They never even show you the price they pay for it."}, {"id": 50662628, "au": "awesome_dude", "dom": 70, "sr": 79, "sc": 0.97, "ep": 1.62, "bs": 0.0, "d": 4, "age": 15.48, "grav": 172.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.688, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean - an email to the people making the demands with an offer to pay up is a ransomware removal tool and algorithm...."}, {"id": 50667333, "au": "embedding-shape", "dom": 94, "sr": 80, "sc": 0.97, "ep": 1.59, "bs": 0.0, "d": 3, "age": 5.04, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pardon_trump", "flbl": "Pardon & Trump (Claims)", "urls": [], "ig": 0.677, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the difference would be if you explicitly hired someone to get a couch for you, they come back to you saying it'd cost 5K so they'll charge you that, then in reality it cost 1K. I guess you could say it's misleading at best, but I'd also call that fraud."}, {"id": 50663607, "au": "ulrikrasmussen", "dom": 44, "sr": 81, "sc": 0.97, "ep": 1.59, "bs": 0.0, "d": 2, "age": 12.7, "grav": 126.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 4284, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ransom_pay", "flbl": "Ransom & Pay (Client)", "urls": [], "ig": 0.677, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, exactly! The customers probably already know the size of the ransom, so clearly they are willing to pay more to avoid the money going to the criminals. Doing what the customers could have done themselves but don't want to -- and with a hefty markup -- is clearly fraud."}, {"id": 50660291, "au": "cwillu", "dom": 95, "sr": 82, "sc": 0.97, "ep": 1.48, "bs": 0.0, "d": 1, "age": 21.44, "grav": 292.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8298, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lying_business", "flbl": "Lying & Business (Fraud)", "urls": [], "ig": 0.474, "fa": 0.0, "gp": 0.254, "bl": 0.0, "ds": 0.0, "txt": "Oh no, his criminal activity caused him problems.  What's a poor criminal to do, tell the customer?\n\nI realize this is the OG site
