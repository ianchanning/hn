bel": "Information & Live (Female)", "count": 7, "useful": 2, "useful_pct": 28.6, "terms": "information, live, female, buy"}, {"slug": "general_commentary", "label": "General Commentary", "count": 5, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 1}], "story_anchors": ["wynn-williams", "sarah", "ndas", "power", "tech", "company", "common", "information", "legal", "author", "meta", "place", "remember", "signed", "allowed", "outside", "sold", "book"], "largest_root": {"root_id": 50671639, "author": "sethops1", "slots": 23, "start_dom": 44, "end_dom": 66, "share_pct": 34.8, "top_dom1_age": 2.6, "top_dom1_author": "SideQuark"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50671755, "au": "KaiserPro", "dom": 19, "sr": 1, "sc": 8.59, "ep": 8.59, "bs": 0.0, "d": 0, "age": 3.76, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 313, "qw": 0, "k": 16739, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.469, "fa": 1.45, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "One of the things that may not be apparent from outside facebook is how the contracts work.\n\nVirtually everyone is on the same employment contract. The only thing that really changes is the name, wages and in some cases country specific addendums.\n\nThe same goes for when you are fired. Everyone is given an NDA to sign when they yeet you. It offers you a choice:\n\n1) sign it and Here is a large amount of cash (usually somewhere between 3 and 12 months wage) some health insurance, and a pathetic job search subscription.\n\n2) don't sign it and get nothing\n\nYou then are allocated 30 minutes with a lawyer, who tells you the choice is yours: take the money and sign the NDA, and never tell anyone of its existence.\n\nOr leave with nothing.\n\nThe NDA is wonderfully comprehensive and tailored to each state/country. In the UK it lists something like 500 specific laws you agree to not reference if you try and challenge. In the US it references standard NDA exceptions.\n\nWhat stays the same is this: you are never allowed to talk about facebook again in any situation where you opinion is either broadcast, recorded or written down. You may ask for permission first, but there is no expectation of facebook agreeing. They also want to be able to edit what is said.\n\nIf you break that condition, then they will take you to court for all yeeting cash, plus damages and legal fees. In return they promise n"}, {"id": 50672330, "au": "SideQuark", "dom": 1, "sr": 2, "sc": 7.93, "ep": 7.93, "bs": 0.0, "d": 0, "age": 2.6, "grav": 15.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 253, "qw": 0, "k": 3109, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.82, "fa": 0.95, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "Background:\n\nSarah Wynn-Williams worked at law firm 2002-2005, joined the New Zealand diplomatic service as a policy adviser 2007-2011, managing government relations at it's embassy in DC.\n\nShe joined Meta in 2011, was in 2017, signed a standard severance agreement with a non-disparagement clause and an arbitration provision, and received $780,000 severance. She did not have to sign it, but signed it to get the money. It's a legal contract. She's been a high powered lawyer and well enough connected it's not at all likely she knew what she was signing. Especially since after being in her position for 6 years at Meta she likely oversaw many similar such events from the Meta side.\n\nIn 2024, she filed a SEC complaint. In 2025 she publishes her book, Meta secures an emergency ruling from an American Arbitration Association arbitrator invoking her signed severance contract, she testifies to Congress. In 2026 she sued Meta Meta in federal court in the Northern District of California to vacate the arbitration, and U.S. District Judge Araceli Martínez-Olguín denies Wynn-Williams’s request to halt the arbitration.\n\nTo head off more conjectures, the American Arbitration Association is well respected, and has massive experience representing both sides of such things. The Judge, a female, has been a long time fighter for social justice, was nominated by Biden, also very well respected. Give"}, {"id": 50672699, "au": "defrost", "dom": 56, "sr": 3, "sc": 7.89, "ep": 7.89, "bs": 0.0, "d": 2, "age": 1.58, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": ["https://en.wikipedia.org/wiki/David_McBride_(whistleblower)"], "ig": 1.613, "fa": 1.12, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "Layers of complexity: https://en.wikipedia.org/wiki/David_McBride_(whistleblower)\n\nBlew the whistle on atrocities committed by elite soldiers while attempting to blow the whistle on perceived dangers of increasingly restrictive rules of engagement and the selective nature of investigations into some members of the special forces over others.\n\n  McBride’s prosecution and jailing has been described as exposing a tension between national security and international justice because official secrecy prevented the transmission of information about alleged war crimes into the public domain."}, {"id": 50673113, "au": "SpicyLemonZest", "dom": 6, "sr": 4, "sc": 5.72, "ep": 5.87, "bs": 0.0, "d": 4, "age": 0.59, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 31, "k": 10045, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 1.303, "fa": 0.76, "gp": 0.441, "bl": 0.0, "ds": 0.0, "txt": "> What does \"modal case\" and \"non-modal situation\" mean in a non-user-interface context?\n\nStatistically modal, was my interpretation. The most common kind of person subject to a nondisparagement agreement.\n\n> And what, exactly, is the public benefit of letting powerful people buy silence to avoid having to prove a negative?\n\nThere's no public benefit, but you have to solve for the equilibrium. Would Wynn-Williams be happier in a world where she's $780k poorer, and Facebook is running around telling everyone sordid details about her in an attempt to discredit her, but she's legally allowed to talk about it? (All parties seem to agree she left on bad terms, so presumably she would not have gotten severance just for the sake of it.)"}, {"id": 50672616, "au": "seizethecheese", "dom": 2, "sr": 5, "sc": 4.74, "ep": 5.03, "bs": 0.0, "d": 1, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 0.95, "fa": 0.62, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "A $780k severance does make me entirely unsympathetic to her grievance, specifically, however I might guess her response would be that she's fighting for the modal case of non-disparagement clauses, which may be less clear cut."}, {"id": 50672953, "au": "prepend", "dom": 48, "sr": 6, "sc": 3.74, "ep": 3.89, "bs": 0.0, "d": 2, "age": 0.98, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 22138, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.186, "fa": 0.34, "gp": 0.092, "bl": 0.0, "ds": 0.0, "txt": "For me it was how she wrote about all the terrible things she had to do and how she felt bad but wouldn’t quit because of the money. It seems to me that she was culpable and took millions in compensation from Facebook while doing morally gross things.\n\nAlso, she researched Facebook and sought out the position so claiming she didn’t know how Facebook sold skevey ads isn’t believable.\n\nAlso, she said she was shocked to find out how Facebook sold political ads when it’s obviously a common use case and was used heavily in 2012.\n\nShe’s either the dumbest rich lawyer in the world or just working on selling her book.\n\nThat made it hard for me to have sympathy."}, {"id": 50673106, "au": "everforward", "dom": 10, "sr": 7, "sc": 3.74, "ep": 4.18, "bs": 0.0, "d": 1, "age": 0.62, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 3033, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": [], "ig": 1.367, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For myself, and I suspect others, the amount I care about her severance is too small to measure with a microscope.\n\nThis is a fundamental issue to me: democracy does not function without access to information, and while $780,000 might be enough to buy an ex-employee's silence, that creates a debt of information to the American people (and any other people affected by Facebook, i.e. everyone).  That debt is proportional to the impact they may have on the system they live within and the amount that system does to protect and enable them, and their own research says they can tilt elections and the system is also building out power grids to support their AI ventures.\n\nI have zero sympathy for Meta.  If they want to pay bribes to keep information out of the public sphere, they can buy an island and fuck off to there.  They've got the money for it.  Otherwise, they should be good participants of the system they live in whether by choice or because no one cares to enforce the terms of their bribe."}, {"id": 50672346, "au": "Twirrim", "dom": 35, "sr": 8, "sc": 3.62, "ep": 3.77, "bs": 0.0, "d": 3, "age": 2.54, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 11683, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 1.459, "fa": 0.0, "gp": 0.237, "bl": 0.0, "ds": 0.0, "txt": "Wasn't part of my exit from Amazon, for what it's worth, albeit that was a decade ago.  Only thing I'm not supposed to do is talk about sensitive/competitive aspects of technology.  Which I haven't.\n\nThe really fun part was because I moved to another cloud provider (which I wasn't allowed to do based on overbearing non-compete contracts I'd signed which at the time practically blocked you from even working for anyone that uses the cloud), the lawyers had a fun conversation and came up with some extra restrictions only I guess some folks got really confused about what I'd worked on.  Instead of barring me from working on something parallel to the service I'd worked on, they barred me from working on a common component of cloud services, for a year.  I'd been overhauling my service's implementation when I left.  It was trivial to avoid working on that for a year."}, {"id": 50672578, "au": "3eb7988a1663", "dom": 12, "sr": 9, "sc": 3.54, "ep": 3.98, "bs": 0.0, "d": 2, "age": 1.95, "grav": 11.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 3421, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.323, "fa": 0.0, "gp": 0.598, "bl": 0.0, "ds": 0.0, "txt": "Does back channels mean current Facebook employees?\n\nI know nothing of her motivations, but from the outside, it seems like a terrible gamble. Take on the legal might of a trillion dollar company. One which felt the need to offer such a generous termination clause in the first place. She could have just pocketed the cash and found another job without years of sleepless nights.\n\nWhat do you think her employment prospects are after breaking a NDA - who wants to hire such a person, even if you potentially agree with the message she shared?"}, {"id": 50672657, "au": "fusslo", "dom": 47, "sr": 10, "sc": 3.45, "ep": 3.74, "bs": 0.0, "d": 3, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 1627, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 0.229, "bl": 0.0, "ds": 0.0, "txt": "My personal failing is that I couldn't finish her book. It felt like someone was trying to convince me the author was naive and able to be influenced. Like I should judge what these other people did, but be endeared to her. But yeah, literature was my worst subject in school and I really am not equipped to give a real critique. It was only how I felt\n\nShe was well educated. She was active in D.C. politics. She was very well connected (If I remember right, her family is well connected too? But maybe not). The first quarter of the book is her creating her own role in facebook by back-channeling her connections\n\nHer husband is a journalist who frequently recommended she quit.\n\nI stopped reading when she was traveling to Myanmar (I think) after abandoning her newborn to sell facebook to a military junta accused of human rights abuses and framed it as an amazing adventure.\n\nI'm not on her side. I'm even less on Meta's side. She made Meta and the world worse. I'm glad she's telling her stories. Meta is a massive machine with near unlimited resources."}, {"id": 50672438, "au": "3eb7988a1663", "dom": 57, "sr": 11, "sc": 3.25, "ep": 3.69, "bs": 0.0, "d": 1, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 3421, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 0.173, "bl": 0.0, "ds": 0.0, "txt": "It is the funny thing about these tell-alls. Person joins morally dubious organization. Stays there for years, accumulating significant wealth, and eventually says, \"Hey, now that I have my bag, this company is kinda icky. I am sure it is just a coincidence they were paying above-market rates.\"\n\nIt definitely requires great courage to speak up to describe the intimate details which can only be observed up close. Yet, it is hard to ever give the author a free pass when they knowingly entered into the arrangement."}, {"id": 50672663, "au": "cleansingfire", "dom": 40, "sr": 12, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 1, "age": 1.68, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 280, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.145, "fa": 0.0, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "The plane incident is upsetting. To one specific accusation, the proffered rebuttal was: \"This source says that while they can't remember the specifics — given how long ago it was — it was much more likely that Sandberg was merely trying to get Wynn-Williams to take some rest in the limited sleeping quarters available on the plane.\"\n\nThats worse than no response at all. It's the accused's friends saying \"I don't know, but i'm sure he didn't mean it that way.\""}, {"id": 50673185, "au": "torben-friis", "dom": 23, "sr": 13, "sc": 2.96, "ep": 3.25, "bs": 0.0, "d": 3, "age": 0.46, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 12, "k": 12153, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 0.873, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">and decided the sausage inside was much worse than could be accepted\n\nAny specifics you feel comfortable sharing? Just curious about the \"much worse\" part, considering that an outsiders' view of the company isn't exactly good."}, {"id": 50672838, "au": "SpicyLemonZest", "dom": 4, "sr": 14, "sc": 2.82, "ep": 3.26, "bs": 0.0, "d": 2, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 10045, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.119, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But she's said a number of things about Facebook that are only plausible because of her very non-modal situation. She represents practically the archetypal case of why non-disparagement agreements exist: even if she's lying about the terrible things she was told in private conversations, Zuckerberg and Sandberg could never hope to prove that, and in the absence of such proof having an argument about it only spreads the possible defamation further."}, {"id": 50672491, "au": "pessimizer", "dom": 50, "sr": 15, "sc": 2.78, "ep": 3.22, "bs": 0.0, "d": 2, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 22, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 0.86, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> us higly paid people have no choice, because if we did not do the wrong thing, we would be slightly less rich\n\nSort of a silly thing to say about a person who was paid three-quarters of a millions dollars to sign an NDA.\n\nThere was the choice to not take the money and to do the right thing, and this person failed. If they hadn't taken the money, they would have still been wealthy, and never have missed a meal."}, {"id": 50672666, "au": "mingus88", "dom": 13, "sr": 16, "sc": 2.74, "ep": 3.4, "bs": 0.0, "d": 3, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3155, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "I read the book.\n\nShe is not a tech professional. Her background is international diplomacy and she lobbied Facebook leadership for years to create her position that would work on international policy when Zuckerberg was barely thinking of U.S. policy.\n\nShe should be fine moving forward finding a job anywhere outside of big tech, which if you read the book, i am positive she would greatly prefer anyway."}, {"id": 50672541, "au": "defrost", "dom": 51, "sr": 17, "sc": 2.71, "ep": 3.15, "bs": 0.0, "d": 3, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "At the crunch point of being under stress and offered NDAs there is often a strong element of carrot and stick.\n\nWithout in any way defending her decision, the choice may well have been between agreeing to be silent and receiving almost a million versus not signing, not being paid, being fired, blacklisted, and being maliciously pursued and harassed by all the resource that, say, a million and half or more could bring to bear.\n\nAs things have come to pass, she likely has both the benefits of the first choice AND the ongoing sniping of the second path."}, {"id": 50672923, "au": "prepend", "dom": 41, "sr": 18, "sc": 2.69, "ep": 2.83, "bs": 0.0, "d": 2, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 22138, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "That’s how I read the encounter. The author was pregnant and working and Sandberg was trying to force her to go to bed. There’s only one bed and Sandberg didn’t want to give it up and instead wanted to share.\n\nThis seems more likely than the only documented case of sexual harassment with Sandberg, who isn’t gay, is with the author. It seems odd to me that people interpreted this as a sexual advance."}, {"id": 50673182, "au": "mindslight", "dom": 18, "sr": 19, "sc": 2.65, "ep": 3.09, "bs": 0.0, "d": 2, "age": 0.47, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 15640, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From what is obvious through front channels: Faceboot is basically doing this for self-centered reasons (eg money and power).\n\n\"From a legal perspective\" is boring. How about from a moral perspective? I'd say that any signing away of a natural right should be bounded in time, perhaps one year at most. Let gag orders go the way non-competes are going - ie paid garden leave if a company really values that ongoing silence."}, {"id": 50673093, "au": "chaosharmonic", "dom": 3, "sr": 20, "sc": 2.37, "ep": 3.03, "bs": 0.0, "d": 2, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 870, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 1.291, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem is that's Facebook executive money, and not anywhere near standard for this kind of thing.\n\nIt's more representative to talk about the use of it throughout American businesses.\n\nRegulatory agencies (see: the NLRB) ban it for a reason, because it restricts your right to talk about your pay and working conditions. It's trivially convenient to retaliate with, and comes with the same overall effect as stuff the companies aren't legally allowed to ask you to keep quiet about on the job."}, {"id": 50671863, "au": "alex1138", "dom": 65, "sr": 21, "sc": 2.35, "ep": 2.79, "bs": 0.0, "d": 2, "age": 3.6, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 533, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": [], "ig": 1.188, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is very funny. Instant 2 downvotes, an upvote of the parent comment, and a flag of one of the replies\n\nTech industry people: you can be neutral. You can read comments without shaping public narrative. I imagine I'll be yelled at by dang about this and \"don't comment on downvotes please\" but this place exists for the industry to support itself, pat itself on the back"}, {"id": 50671948, "au": "sethops1", "dom": 46, "sr": 22, "sc": 2.33, "ep": 2.99, "bs": 0.0, "d": 2, "age": 3.42, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 1444, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "She frames her joining of facebook as some idealic fantasy of doing good for the world. Maybe hindsight is 20/20 but to me it read as her climbing the ladder to power. It was her idea to put Zuck on the global stage. It was through her will and effort that put him there. She was his personal enabler into legitmaizing Zuck as a statesmen, and personally I view that as an act of evil."}, {"id": 50672295, "au": "lostmsu", "dom": 66, "sr": 23, "sc": 2.33, "ep": 2.99, "bs": 0.0, "d": 3, "age": 2.66, "grav": 15.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 6658, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's nothing funny about this. The only effect from losing even a mid management job at Facebook is you stop raking money at the rate \n3/4 people here would consider insane, and will have to switch to having income of a regular mortal in the worst case.\n\nWe aren't talking quitting mafia or protesting a totalitarian government here. She'd probably have 5+ years of runway if she quit. There's a reason she never mentions her total comp once. She is clearly a weasel."}, {"id": 50671751, "au": "gazpachotron", "dom": 53, "sr": 24, "sc": 2.26, "ep": 3.14, "bs": 0.0, "d": 1, "age": 3.76, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 22, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "I read the book, and it's not hard for me to be sympathetic, though I understand what you mean.  There were plenty of opportunities for her to quit, and \"I had a family\" is not really an excuse.  She could have taken a significantly lower-paid job and adjusted her standard of living accordingly, but chose not to.  She was also shockingly naive.\n\nShe wasn't central to anything, though.  Any time she had a difference of opinion on anything, she was absolutely steamrolled by Sandberg and Zuckerberg.  In fact it seemed like anyone reporting to Sandberg had little autonomy to speak of."}, {"id": 50672381, "au": "iaw", "dom": 11, "sr": 25, "sc": 2.08, "ep": 2.96, "bs": 0.0, "d": 1, "age": 2.47, "grav": 14.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 4601, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "From what I've heard through back channels: Sarah is basically doing this for self-centered reasons (e.g. fame and money).  She is likely bound by the severance contract she signed legally speaking.  From a moral and ethical perspective there is a discussion to be had.  From a legal perspective there is no discussion.\n\nAll this to say, Sarah may be a horrible messenger but that doesn't make anything she said about Meta wrong or inaccurate."}, {"id": 50672233, "au": "georgemcbay", "dom": 32, "sr": 26, "sc": 1.99, "ep": 2.43, "bs": 0.0, "d": 1, "age": 2.79, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 16548, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In a sane world, employment NDAs would legally only cover things directly relevant to protecting business-relevant proprietary information and not apply to protecting sociopaths from having their sociopathic personal behavior revealed."}, {"id": 50671702, "au": "watwut", "dom": 49, "sr": 27, "sc": 1.96, "ep": 2.84, "bs": 0.0, "d": 1, "age": 3.86, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.041, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "I found it easy. She was naive, yes. She enabled a lot, yes and she says so.\n\nAnd she is also a hero for actually breaking out. And for doing the right thing, unlike literally everyone else in Facebook.\n\nAnd unlike people on HN who routinelly flaunt \"us higly paid people have no choice, because if we did not do the wrong thing, we would be slightly less rich\" about once a week."}, {"id": 50672065, "au": "pbiggar", "dom": 39, "sr": 28, "sc": 1.83, "ep": 2.78, "bs": 0.0, "d": 0, "age": 3.17, "grav": 19.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 7975, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 1.183, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This was a truly excellent and extraordinary book, that didn't get the attention it deserved. We saw almost nothing come out of some incredible allegations, like Sheryl Sandberg demanding for her female staff to sleep with her, or the backdoor deal between Zuckerberg and Irish prime minister on taxes."}, {"id": 50672914, "au": "kmeisthax", "dom": 5, "sr": 29, "sc": 1.75, "ep": 2.41, "bs": 0.0, "d": 3, "age": 1.07, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 15086, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": [], "ig": 1.026, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What does \"modal case\" and \"non-modal situation\" mean in a non-user-interface context? And what, exactly, is the public benefit of letting powerful people buy silence to avoid having to prove a negative?"}, {"id": 50673363, "au": "Avicebron", "dom": 7, "sr": 30, "sc": 1.7, "ep": 2.8, "bs": 0.0, "d": 5, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 8, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 0.683, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> but you have to solve for the equilibrium.\n\nNo you don't? The story is interesting not necessarily because of her specific case, it's because of the broader implications of executive behavior. It's not some hypothetical balance, it's a news story because she's a case study in something.\n\nAnd no need for shibboleths here, you can just say \"unique\"."}, {"id": 50671890, "au": "alex1138", "dom": 30, "sr": 31, "sc": 1.36, "ep": 2.24, "bs": 0.0, "d": 2, "age": 3.55, "grav": 21.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 533, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "information_live", "flbl": "Information & Live (Female)", "urls": [], "ig": 0.954, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Jessica Alona is a bitch. I need to do something to keep my mind off her\"\n\n\"Dumb fucks\"\n\n\"I'm going to fuck [Winklevoss twins] probably in the ear\"\n\n\"You can be unethical and legal and that's how I live my life haha\""}, {"id": 50672308, "au": "GauntletWizard", "dom": 22, "sr": 32, "sc": 1.34, "ep": 2.66, "bs": 0.0, "d": 2, "age": 2.63, "grav": 15.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3947, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I can confirm; I was employed by Facebook, took the cash, and decided the sausage inside was much worse than could be accepted. The exit paperwork was very clear that they intend to sue. There's an amount that they will be laughed out of court, but can cause you severe pain and huge legal bills in the meantime. Be too specific, and they ruin you."}, {"id": 50671960, "au": "hinkley", "dom": 31, "sr": 33, "sc": 1.3, "ep": 2.4, "bs": 0.0, "d": 3, "age": 3.39, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If the twins had possessed a more nuanced view of what it is to be a computer nerd, I wonder if they would or wouldn’t have picked a less toxic one to approach.\n\nBut would we still be in the same spot because the sociopaths would have wrested control of the company from another person, like what happened with Google and their toxic ads team?"}, {"id": 50672667, "au": "dofm", "dom": 55, "sr": 34, "sc": 1.27, "ep": 2.15, "bs": 0.0, "d": 1, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 0.862, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "Whistleblowers are very rarely the best people. It's a dramatic myth that they are squeaky clean.\n\nBlowing the whistle is quite difficult to do from a position of innocence; you actually have to be in the thick of it, and thus subject to a certain sense of collective guilt, to have anything to talk about.\n\nPeople who are doing bad things don't recruit the scout leader type, do they?"}, {"id": 50671698, "au": "alex1138", "dom": 60, "sr": 35, "sc": 1.18, "ep": 2.51, "bs": 0.0, "d": 1, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 533, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 0.393, "fa": 0.28, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "She says multiple times IIRC she has a family and can't just quit\n\nBoy. Not that non-tech forums are always the best at discussing things but there's a LOT of apologism that happens here specifically"}, {"id": 50671888, "au": "hinkley", "dom": 62, "sr": 36, "sc": 1.02, "ep": 2.12, "bs": 0.0, "d": 2, "age": 3.56, "grav": 21.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "talk_subject", "flbl": "Talk & Subject (Wynn-williams)", "urls": [], "ig": 0.698, "fa": 0.0, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "That’s how most employment works? They give you enough to stay but not enough to become the competition.\n\nEven the office snacks of the dotcom boom were about fomenting inertia. Just stay here, it’s easier."}, {"id": 50673168, "au": "roenxi", "dom": 9, "sr": 37, "sc": 0.9, "ep": 2.44, "bs": 0.0, "d": 2, "age": 0.48, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 30627, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is what she and Meta are sorting out, that's why we're all reading an article where they've got her in court and under a gag order.\n\nAlthough I do would prefer the idea that an NDA has to come with an ongoing retainer, so rather than being open to being fined in court the consequence for violating an NDA is more like being fired. It seems like a bad idea to have someone legally compelled not to tell the truth for their entire life, with no way to get out of it."}, {"id": 50671639, "au": "sethops1", "dom": 44, "sr": 38, "sc": 0.82, "ep": 2.36, "bs": 0.0, "d": 0, "age": 3.99, "grav": 25.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1444, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "book_family", "flbl": "Book & Family (Quit)", "urls": [], "ig": 0.667, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "After reading the book it's hard to feel sympathetic for the author. She was not just cuplpable but in fact central to many of Facebook's progression of evil."}, {"id": 50671910, "au": "PaulKeeble", "dom": 38, "sr": 39, "sc": 0.7, "ep": 2.02, "bs": 0.0, "d": 2, "age": 3.49, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "view_perspective", "flbl": "View & Perspective (Company)", "urls": [], "ig": 0.861, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The overwhelming majority of leaders in the world are. Seems to be a trait most people intentionally vote for and consider all those without it \"weak\". Not surprisingly that power selects further sociopaths, people just like them."}, {"id": 50673116, "au": "slibhb", "dom": 15, "sr": 40, "sc": 0.7, "ep": 2.24, "bs": 0.0, "d": 4, "age": 0.59, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 5215, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nda_court", "flbl": "Nda & Court (Facebook)", "urls": [], "ig": 0.953, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "She's \"being silenced\" (aka sued) due to an NDA she signed, yet she published a book that has sold very well.\n\nIn china, the government would just kidnap her with no due process and possibly never release her."}, {"id": 50671710, "au": "rylando", "dom": 45, "sr": 41, "sc": 0.67, "ep": 2.21, "bs": 0.0, "d": 1, "age": 3.84, "grav": 24.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 138, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
