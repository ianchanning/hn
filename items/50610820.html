, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": ["https://en.wikipedia.org/wiki/Brompton_Bicycle"], "ig": 0.727, "fa": 1.3, "gp": 2.061, "bl": 0.0, "ds": 0.0, "txt": "[1963]\n\nVery interesting design choices, thank you. It is a pity this never made it ‘big’. Probably also because it was ahead of its time. The Brompton design was patented in 1979 (https://en.wikipedia.org/wiki/Brompton_Bicycle)"}, {"id": 50635869, "au": "jodrellblank", "dom": 92, "sr": 3, "sc": 7.83, "ep": 7.83, "bs": 0.0, "d": 1, "age": 15.97, "grav": 181.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 70, "qw": 0, "k": 14942, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": ["https://upride.eu/", "https://news.ycombinator.com/item?id=42625835"], "ig": 1.711, "fa": 0.96, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "https://upride.eu/ uses small wheels for folding, a custom 3-speed derailleur and a 2-speed planetary gear in the bottom bracket for speed; wide tyres and suspending the seat on the spring-steel steering tube for comfort.\n\nThe number one goal was to fit in a travel locker, airline carry-on, under a train seat, or train overhead luggage rack. Apparently they are developing an electric version for Spring 2027. Some Upride (formerly Kwiggle) links in a previous comment of mine: https://news.ycombinator.com/item?id=42625835"}, {"id": 50634747, "au": "hinkley", "dom": 77, "sr": 4, "sc": 7.0, "ep": 7.15, "bs": 0.0, "d": 1, "age": 17.57, "grav": 211.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.847, "fa": 0.62, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "The old farts I learned bicycle mechanics from waxed poetic about the Italians’ skill at braising, which is pretty much how frames were made until the late 80’s when for instance Cannondale TIG welded aluminum and Trek used epoxy on hybrid carbon fiber bicycles (and resulted in a recall due, IIRC, to coefficient of thermal expansion issues resulting in cracked tubing).\n\nThe thing is (was?) that the tubing most desirable for bicycles like Reynolds  531 doesn’t like the torch that much, doubly so for double butted tubing (thin in the middle where the water bottle and cabling fixtures need to be) which IIRC the Italians also did first. Any plumber could braise a low end steel bike, the good stuff took extra skill.\n\nWhat’s noteworthy to me about this bike is how many tubes it has to get the job done."}, {"id": 50639599, "au": "makeitdouble", "dom": 104, "sr": 5, "sc": 6.76, "ep": 6.76, "bs": 0.0, "d": 1, "age": 7.13, "grav": 53.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 81, "qw": 0, "k": 14485, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": ["https://www.birdybicycle.com/en-jp"], "ig": 1.427, "fa": 0.62, "gp": 1.13, "bl": 0.0, "ds": 0.0, "txt": "It depends a lot on the design. I wouldn't speak for Brompton but I hear they ride really well, my choice was on the BD-1 [0] like folding style.\n\nThe folding part is baked in the suspension and the main frame is fully rigid with no articulation, no folding. Only the stem gets a visible and dedicated folding mechanism.\n\nIt still rides like a small wheel bicycle, and that's a part I actually like. The suspensions and customizability are pretty great, at no point I felt the design was compromised.\n\n[0] https://www.birdybicycle.com/en-jp"}, {"id": 50640445, "au": "youngNed", "dom": 58, "sr": 6, "sc": 6.57, "ep": 6.57, "bs": 0.0, "d": 4, "age": 4.91, "grav": 32.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 888, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.435, "fa": 0.62, "gp": 0.989, "bl": 0.0, "ds": 0.0, "txt": "i have a g-line.  Its a lovely bike to ride, and it makes me happy.  Every bike should make you happy, a surprising amount don't.\n\nThings i hate about my g-line:\n\n- another user mentioned it, you can only take it where you can take it.  If i'm going to the cinema, i can't ride it into town, there is no way a could lock up a 3k bike in town - no, i take my pub-bike for that.\n\n- the price. i justify it to myself by saying 'i don't have a car' - but i could have a 2nd hand car for what i paid for it.\n\n- the gear range could be better.\n\n- stability when folded - i bought a thingy for my rack that pulls out and offers better stability, but i shouldn't have needed to spend close to 100 for that.\n\n- weight when folded - you ain't carrying this up multiple flights of stairs with regularity.\n\nfor all that, i'd buy it again in a hearbeat - the ride is bloody lovely."}, {"id": 50642189, "au": "jonasdegendt", "dom": 15, "sr": 7, "sc": 6.56, "ep": 6.71, "bs": 0.0, "d": 4, "age": 1.0, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 480, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.667, "fa": 0.68, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "I rode my Boosted Board e-skate every day, rain or shine, 20 miles per hour everywhere. I got their V1 on Kickstarter back in the day, and bought every subsequent generation as my boards broke over the years. (I had one with 6000 miles on it!)\n\nIt evidently took a really long time for my frontal lobe to develop. Recently picked it up again after two years of not touching it, at age 31, and I couldn’t believe it. My legs were spaghetti from the adrenaline after a half mile ride. Lots of scars to show for all the riding but it’s a miracle I never got seriously hurt."}, {"id": 50636159, "au": "asdff", "dom": 1, "sr": 8, "sc": 5.95, "ep": 6.24, "bs": 0.0, "d": 0, "age": 15.54, "grav": 173.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 16559, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.608, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "It takes some learning curve, but a skateboard is actually a really good way to get around an urban area. Biggest pluses are you can tuck it away anywhere, but unlike a folding bike, you can use it instantly. You end up saving time in all sorts of places that would be inappropriate with other vehicles, thanks to the speed differential being closer to a couple mile an hour walking than most other micro mobility that's closer to a 25mph car. Biking down the mezzanine to the train platform is a little egregious, but pushing a skateboard out of anyone's way is perfectly reasonable, and might save you quite a lot of time to make that train connection. Any clear patch of 25 feet in front of you, you might as well skate it in a half second."}, {"id": 50635261, "au": "WillAdams", "dom": 94, "sr": 9, "sc": 5.82, "ep": 5.97, "bs": 0.0, "d": 1, "age": 16.86, "grav": 197.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 65, "qw": 0, "k": 5636, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": ["https://www.pedalroom.com/bike/montague-swissbike-x50-blacked-out-30784", "https://twicycle.com/"], "ig": 1.48, "fa": 0.62, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "I have a Montague Swissbike X50 (civilian model of the Paratrooper) which I spent way too much time kitting out:\n\nhttps://www.pedalroom.com/bike/montague-swissbike-x50-blacke...\n\nand which I don't get to ride since my new job is almost twice the distance.\n\nI've love to have the Helix which is mentioned elsethread, but instead splurged on a Twicycle:\n\nhttps://twicycle.com/\n\nIf I don't buy a convertible I'll probably buy a Helix when I retire (and an Oru Kayak) --- want to try bikerafting."}, {"id": 50638767, "au": "oska", "dom": 102, "sr": 10, "sc": 5.73, "ep": 5.88, "bs": 0.0, "d": 0, "age": 9.48, "grav": 80.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 7834, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 1.792, "bl": 0.0, "ds": 0.0, "txt": "I'm curious if anyone else shares my fairly strong aversion to folding bikes ?\n\nThey've always struck me as 1) being 'too clever by half' i.e. yes, being very inventive in their design while also 2) still compromising the rideability of the bicycle (because the foldable design must introduce design compromises)\n\nI want a bicycle to be optimally designed for riding purpose only"}, {"id": 50634222, "au": "mslate", "dom": 90, "sr": 11, "sc": 5.56, "ep": 5.86, "bs": 0.0, "d": 0, "age": 18.27, "grav": 225.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 720, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.11, "fa": 0.28, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Folding bikes are great, the key is balancing wheel-diameter (comfort/speed) with compactness/ease of fold.\n\nHere are a few variants that are interesting beyond Brompton:\n\n- Strida\n\n- Kwiggle/Upride\n\n- Montague"}, {"id": 50636239, "au": "asdff", "dom": 142, "sr": 12, "sc": 5.47, "ep": 5.47, "bs": 0.0, "d": 1, "age": 15.41, "grav": 171.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 224, "qw": 0, "k": 16559, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.629, "fa": 0.34, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "That's basically a skateboard as long as you don't go bombing down hills out of control. Learning curve might be tough if you didn't do it as a kid however. But if you did, you've unlocked a pretty useful ability that meets all these things. Skate parts are cheap, even going name brand, but a blank deck is the same plywood as any. You can walk into any skateshop across town and get standardized replacement parts. You can get some of the best equipment on the market and only be out like $100-150 or so, for the complete build.\n\nBack to failure mode, if you aren't going at very out of control speeds it's no worry with big and soft longboard style wheels (vs harder skate wheels meant for tricks vs cruising). About as much as you'd do to yourself on a bike going reasonable speeds: maybe scrape up the palms catching yourself or twist an ankle or wrist if you really catch it awkwardly. Can't really have a non zero risk when walking itself is non zero risk of falling related injury or death.\n\nEscooters are also pretty great. xaomi mi platform is pretty standardized, only a couple hundred or so as well. Lot of handwringing about them in the press, but if you don't plan to drive drunk with your buddy on your back you should be alright."}, {"id": 50638044, "au": "Theodores", "dom": 34, "sr": 13, "sc": 5.36, "ep": 5.8, "bs": 0.0, "d": 1, "age": 11.3, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 610, "qw": 0, "k": 3934, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.794, "fa": 0.28, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Each to their own, however, there is the matter of 'use case'. I worked in a bicycle shop where we had skateboards as a sideline, my product knowledge was not there for them, I expected the customer to know what they needed (and for their mother to pay).\n\nMy knowledge was in the folding bicycles, and a surprising amount of knowledge was needed to guide customers through to a sale. We had all the UK brands, including Brompton, Dahon, Airnimal and Montague. My goal was to take their money, so I was never going to talk them out of the over-hyped Brompton to sell them the far superior Dahon. (Dahon have the more useful patents).\n\nHowever, if I knew the customer was going to be on a packed commuter train, I would sell them the Dahon, since it doubles up as a seat, when folded down, which the Brompton doesn't do.\n\nRegarding the article, we had this brand called Airnimal that were designed to fold up into boxes that could go on a plane, so we sold Airnimal to those customers. Airnimal bicycles took a while to setup, whereas the Brompton or Dahon could be deployed as one leaves the train door, for the bicycle to be rideable on the platform.\n\nThere were also the folding bicycles with really small wheels. These would suit canal-boat people, or people with camper vans. These customers didn't need much, but their requirements were carefully checked.\n\nPart of the sale was demonstrating the "}, {"id": 50639428, "au": "Lio", "dom": 19, "sr": 14, "sc": 5.31, "ep": 5.75, "bs": 0.0, "d": 4, "age": 7.65, "grav": 59.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 10512, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.651, "fa": 0.34, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "I’m pretty sure a bike can carry way more volume than a kickscooter.\n\nA Brompton folding bike has actual dedicated loading points for bags. Plus it has gears to help you lift that weight up hill.\n\nYou can clip a large bag to the front frame block without affecting the steering.\n\nIt’s also possible to keep that bag attached to the folded bike and use it as a freestanding trolley. Wheeling it around with you.\n\nOn the back, if you have a rack you can carry either panniers or a large rucksack standing vertically against the seat.\n\nThe Brompton design was originally launched in 1979 and has remained mostly unchanged ever since because in essence it is very, very good at what it does."}, {"id": 50639322, "au": "dolmen", "dom": 144, "sr": 15, "sc": 5.18, "ep": 5.33, "bs": 0.0, "d": 3, "age": 7.88, "grav": 61.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1380, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.476, "fa": 0.34, "gp": 0.613, "bl": 0.0, "ds": 0.0, "txt": "The best compromise for me: folding kickscooter.\n\nNo motor, very low maintenance, no mandatory insurance (we have that in France for e-scooter), brakes. Limited max speed, so no helmet.\n\nGo almost everywhere with it in Paris (stairs, office, train, metro, shops, bars, restaurants) except museums.\n\n12 years use, every work day."}, {"id": 50634403, "au": "ddrmaxgt37", "dom": 48, "sr": 16, "sc": 5.17, "ep": 5.32, "bs": 0.0, "d": 0, "age": 18.01, "grav": 219.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 466, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.221, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "I have a Brompton that I ride daily on either side of a train ride. It's a game changer where I live (Bay Area) because biking is the fastest way to get to the places I want to go (faster than public transit, cars, etc.)."}, {"id": 50636484, "au": "montebicyclelo", "dom": 2, "sr": 17, "sc": 5.12, "ep": 5.56, "bs": 0.0, "d": 1, "age": 14.99, "grav": 163.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1818, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.57, "fa": 0.0, "gp": 1.29, "bl": 0.0, "ds": 0.0, "txt": "Having both skateboard and bike commuted, the skateboarding relies heavily on having enough flat, decent quality surfaces, that aren't too busy. As soon as you add large portions of poor surfaces, hills, traffic, etc. a bicycle can just handle that way better. Plus the chance of being randomly thrown off due to some tiny rock you didn't see is a lot lower.\n\nEdit: and also... rain"}, {"id": 50634224, "au": "sllabres", "dom": 80, "sr": 18, "sc": 5.06, "ep": 5.58, "bs": 0.0, "d": 1, "age": 18.27, "grav": 225.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.669, "fa": 0.34, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "The Brompton, in the third image for comparison, looks more robust and probably a bit more comfortable to ride due to the larger wheels. And it is only a bit higher when folded but therefor narrower.\n\nI've tested a lot of small bikes some time ago with the goal of fitting two in the small trunk of a Smart Fortwo car. This worked without problems with  a Brompton, and even left a bit of room for a backpack. And the bike is quite comfortable to ride for it's size. (Not advertising, just still enthusiastic after 10 years about the clever mechanism).\n\nI thought the T&C Pocket Bici might be a bit lighter, as it looks more delicate. But that doesn't seem to be the case.\nThe weight figures I’ve found are 15.4 kg for the T&C, compared to a starting weight of 11.5 kg for the Brompton (presumably the single-speed version)."}, {"id": 50634704, "au": "qurren", "dom": 133, "sr": 19, "sc": 4.95, "ep": 4.95, "bs": 0.0, "d": 0, "age": 17.63, "grav": 212.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1164, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.424, "fa": 0.34, "gp": 0.437, "bl": 0.0, "ds": 0.0, "txt": "I used to ride a Dahon Speed P8 which I did multiple long distance (>1000km) trips with. It can be partially disassembled to fit in a Samsonite Oyster suitcase, which is how I moved it around internationally.\n\nIt has 20 inch wheels, which is much more practical for actual bike trips. I'm not aware of any other 20 inch bike which fits in a regulation check-in suitcase."}, {"id": 50638145, "au": "user_7832", "dom": 36, "sr": 20, "sc": 4.68, "ep": 5.12, "bs": 0.0, "d": 2, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 4972, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.637, "fa": 0.0, "gp": 0.879, "bl": 0.0, "ds": 0.0, "txt": "Thank you for your comment, that's some fascinating insights. Ever thought about making a small write up or blog about your learnings and posting it here (if you don't mind sharing them)?\n\nFor context I'm also a cycling fan, and while biking in the Netherlands is much better than other places, I still find it hard to navigate unless you can combine a bike with the metro/bus/train, which mandates only a folding bike. However, none of these skinny folding bikes with tiny wheels inspire much confidence for driving (safely) on wet cobblestone..."}, {"id": 50638134, "au": "digital-cygnet", "dom": 135, "sr": 21, "sc": 4.44, "ep": 4.73, "bs": 0.0, "d": 1, "age": 11.1, "grav": 102.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 329, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.681, "fa": 0.0, "gp": 0.538, "bl": 0.0, "ds": 0.0, "txt": "I have also been looking for this holy grail. The closest I've come is, within the service area, ubiquitous bike share. The membership is super cheap per use (a couple hundred dollars a year for unlimited rides), it's fun, fast but not too fast, pretty stable and safe, etc. The only compromise vs your list is that instead of being safe and easy to store and carry, you have to trust that the city will have sufficient coverage for the trip you're doing. Within a downtown core it's basically perfect; get too far afield and it becomes unusable"}, {"id": 50639596, "au": "Lio", "dom": 105, "sr": 22, "sc": 4.21, "ep": 4.94, "bs": 0.0, "d": 1, "age": 7.14, "grav": 53.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 10512, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.271, "fa": 0.34, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "Brompton bikes ride really well though. They are not particularly compromised on the road.\n\nI’ve done long event rides on mine, 150 milers, and been able to keep up with friends on road bikes.\n\nOn the Dunwich Dynamo you see a whole fleet of Bromptons because it’s so much easier to get to the start by train. (I’ve also ridden that on carbon road bikes for comparison)."}, {"id": 50634598, "au": "JoeAltmaier", "dom": 75, "sr": 23, "sc": 3.76, "ep": 4.42, "bs": 0.0, "d": 0, "age": 17.76, "grav": 214.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 28995, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "My cousin Phil McTaggart designed his own folding trike, that fit in its own case. When you unfolded it, the case mounted over the rear wheel and you could fit your normal suitcase inside it. So he could fly e.g. to Costa Rica and ride to his hotel, and use the bike the whole time he was there."}, {"id": 50634903, "au": "thatmf", "dom": 119, "sr": 24, "sc": 3.64, "ep": 3.86, "bs": 0.0, "d": 0, "age": 17.34, "grav": 206.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 377, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.775, "bl": 0.0, "ds": 0.0, "txt": "From a design perspective this (and the other products mentioned in comments here) are really cool.\n\nFor an infrastructure perspective, I wonder if the better solution for most people is a municipal bike system, where you can have a real, full-sized bike, instead of having to schlep a small one around with you (that probably has compromises made to accommodate the form factor)."}, {"id": 50641804, "au": "tmtvl", "dom": 103, "sr": 25, "sc": 3.6, "ep": 4.26, "bs": 0.0, "d": 1, "age": 1.63, "grav": 10.2, "surf": 5.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 3847, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.306, "fa": 0.34, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "I ride my Dahon to and from training twice a week, which is about 16 km from home, which takes me a bit over 3/4ths of an hour; and if the weather's really dire I can fold it up and take it on the bus. I can also take it on the train when I need to cover larger distances (although the Belgian rail network has some massive holes in coverage which is very annoying, especially when travelling between Flanders and Wallonia)."}, {"id": 50635738, "au": "kazinator", "dom": 78, "sr": 26, "sc": 3.46, "ep": 4.12, "bs": 0.0, "d": 1, "age": 16.2, "grav": 185.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 35795, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.347, "fa": 0.28, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Probably because people who travel with suitcases:\n\n- have transportation arrangements (buses, trains, planes, automobiles, ships ...)\n\n- don't want to fill their suitcase with a bicycle\n\n- have no good ay way to carry their suitcase while riding the bicycle they have taken out of that suitcase\n\nPeople who seriously travel with bicycles find ways for bicycles to carry their stuff, not for their stuff to carry their bicycle."}, {"id": 50634515, "au": "ljf", "dom": 84, "sr": 27, "sc": 3.37, "ep": 3.59, "bs": 0.0, "d": 1, "age": 17.85, "grav": 216.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 7299, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": ["https://bikefriday.com/product/bike-friday-new-world-tourist-folding-bike/"], "ig": 0.703, "fa": 0.62, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "I remember a folding bike that packed into a suitcase with big wheels, which could then be pulled as a trailer for touring.\n\nFound it - about 2/3 of the way down this page https://bikefriday.com/product/bike-friday-new-world-tourist..."}, {"id": 50634616, "au": "hinkley", "dom": 108, "sr": 28, "sc": 3.17, "ep": 3.87, "bs": 0.27, "d": 0, "age": 17.73, "grav": 214.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 0.526, "fa": 0.34, "gp": 1.15, "bl": 0.1, "ds": 0.0, "txt": "Is that a bicycle pump under the top tube?\n\nI didn’t think they started making that style until the 1980’s."}, {"id": 50635009, "au": "pm90", "dom": 123, "sr": 29, "sc": 3.16, "ep": 3.75, "bs": 0.0, "d": 1, "age": 17.22, "grav": 204.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 14404, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.157, "fa": 0.34, "gp": 0.043, "bl": 0.0, "ds": 0.0, "txt": "100% yes. I don’t get why cities aren’t aggressively building bike lanes and shared bike infrastructure everywhere. Its much cheaper than building new highways, is healthier and promotes commerce and community."}, {"id": 50640199, "au": "PJDK", "dom": 57, "sr": 30, "sc": 3.04, "ep": 3.77, "bs": 0.0, "d": 3, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 879, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.104, "fa": 0.34, "gp": 0.143, "bl": 0.0, "ds": 0.0, "txt": "I don't know if it's good or bad news but the G line is more or less that. They describe it as gravel but here's GCN taking it around some (fairly mild) trails.  I've never ridden one but they look pretty nice.\n\nI've got a classic Brompton I've had for 10 years that's still going strong with no more than standard maintenance."}, {"id": 50635989, "au": "jodrellblank", "dom": 55, "sr": 31, "sc": 2.79, "ep": 7.69, "bs": 3.58, "d": 1, "age": 15.79, "grav": 177.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 229, "qw": 0, "k": 14942, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": ["https://www.youtube.com/watch?v=eW2cRxXPc9s", "https://news.ycombinator.com/item?id=47926776", "https://news.ycombinator.com/item?id=47924953"], "ig": 1.745, "fa": 0.9, "gp": 0.703, "bl": 1.35, "ds": 0.0, "txt": "There's a guy on YouTube who has been riding the Brompton G-Line (Gravel) through South America for a year: \"Everything bad about the Brompton G line after 1 year\" - https://www.youtube.com/watch?v=eW2cRxXPc9s\n\nThe comments are interesting because they are a people saying \"what about <my favourite bike>?\" and him discussing, and ultimately he would choose the Brompton again. This is the kind of honest review I would like to see more people doing on YouTube, instead of free gifts, product placement, sponsorship deals, unboxings, and \"I just got this and it looks great!\". Especially about niche bikes like the folding ones mentioned in this thread - they can sell thousands over years and still have almost nothing online about people's real world experiences of them.\n\nFrom my previous comments about Bromptons:\n\n- Seth from Berm Peak started out complaining that Brompton was more expensive while offering less, then concluded that he likes it a lot, then a year later that he loves it and will never sell it: https://news.ycombinator.com/item?id=47926776\n\n- A Titanium Brompton customised to be even lighter: https://news.ycombinator.com/item?id=47924953\n\n- Why the Brompton fold is a particularly nice design compared to other folding bikes: https://news.ycombinator.com/item?id=47910598\n\n- People who use Bromptons to move house, pull trailers, etc. https://news.ycombinator.com/item?id=479"}, {"id": 50634093, "au": "dofm", "dom": 101, "sr": 32, "sc": 2.68, "ep": 3.34, "bs": 0.0, "d": 0, "age": 18.41, "grav": 227.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 17, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": ["https://en.wikipedia.org/wiki/A-bike"], "ig": 0.71, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "AFAIRR this was one of the inspirations for the (forward thinking but failed) Sinclair A-Bike folding bike:\n\nhttps://en.wikipedia.org/wiki/A-bike"}, {"id": 50640149, "au": "tomatocracy", "dom": 97, "sr": 33, "sc": 2.41, "ep": 3.29, "bs": 0.0, "d": 3, "age": 5.66, "grav": 39.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 1576, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I commuted daily on a Tern Verge (22\" wheels) for a while in London. I would take it on the tube to my children's school, drop them off, then cycle from school to the office. It worked pretty well for me because the timing meant it wasn't the height of peak hours (school dropoff was at 8am). I never tried it but I'd imagine it would have been fine on \"big\" commuter trains as well. As you say they ride much more like a \"normal\" bike which was the big selling point for me.\n\nObviously it wouldn't have worked on a packed tube train in central London at peak times but part of the point was to avoid those trains!"}, {"id": 50635276, "au": "thih9", "dom": 68, "sr": 34, "sc": 2.4, "ep": 3.06, "bs": 0.0, "d": 1, "age": 16.85, "grav": 197.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 10141, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "Wouldn't any random folding scooter be better?\n\nHere the seat looks uncomfortable and lacks amortization, you cannot stand while driving, the folding and unfolding process looks complex and long and \"suitcase\" form still takes quite a lot of space."}, {"id": 50642670, "au": "deltarholamda", "dom": 35, "sr": 35, "sc": 2.35, "ep": 3.89, "bs": 0.0, "d": 2, "age": 0.22, "grav": 4.2, "surf": 24.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 2596, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.489, "fa": 0.0, "gp": 0.268, "bl": 0.0, "ds": 0.0, "txt": "Pretty much every cruiser that buys a folding bike for their boat goes for the Dahons. Their marinized one, usually. Size, price, and repairability are the big selling points. Marinas can be pretty rough, and the big wheels make a huge difference.\n\nI've ridden the Dahons a bit, they're awfully good. It seems weird to ride around on a bike meant to collapse, but it works extremely well."}, {"id": 50635326, "au": "LittleLily", "dom": 128, "sr": 36, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 3, "age": 16.79, "grav": 196.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 31, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.981, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not the usual port for https (443), which means Ars hasn't added that domain:port combo as a valid CORS origin in their backend, causing all the fonts (and probably other assets) to not load due to CORS errors. So they probably use it for that purpose."}, {"id": 50639416, "au": "dolmen", "dom": 31, "sr": 37, "sc": 2.26, "ep": 3.58, "bs": 0.0, "d": 5, "age": 7.67, "grav": 59.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1380, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 0.908, "fa": 0.34, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "That stick might also bring brakes in your hands. Also smaller turns which is convenient to avoid obstacles.\n\nMy only few falls on kickscooter (14 years practice) were down on the sides and the stick wasn't involved in injuries. Cause: always slippery."}, {"id": 50638544, "au": "dolmen", "dom": 18, "sr": 38, "sc": 2.12, "ep": 3.22, "bs": 0.0, "d": 3, "age": 10.05, "grav": 88.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1380, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "+1\n\nThe kickscooter also allows occasional higher loads on longer distances than just walk (hanging bangs instead of having them in hands). Also more volume than on a bike (hanging shopping bags on a bike is more dangerous because of wind).\n\nThe only place where I couldn't enter with my kickscooter in hand are museums, so this is the only limit for usage as a city tourist who comes by train."}, {"id": 50642666, "au": "metalman", "dom": 117, "sr": 39, "sc": 2.05, "ep": 2.93, "bs": 0.0, "d": 0, "age": 0.23, "grav": 4.2, "surf": 55.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 398, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.235, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "This botherd me in a vaugue way till I realised the whole premise is to bicycle in areas that are seperated by the need to get in an airplane, I also feel a vauge desire to work a fish into my comment in some strait forward way, but thats the best I can do today."}, {"id": 50636323, "au": "lstodd", "dom": 20, "sr": 40, "sc": 1.85, "ep": 2.95, "bs": 0.0, "d": 2, "age": 15.24, "grav": 168.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 1244, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.032, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "As long as you painfully learn to move swiftly without braking and invest much time into keeping that skill topped up. Otherwise you end up with broken bones, and lucky if those are your own.\n\nI am myself a lifetime motorcycler - as in the most safe speed is 20 mph over the stream. But you must accept the inevitable: those who don't crash at least once in a season don't ride."}, {"id": 50634324, "au": "sllabres", "dom": 40, "sr": 41, "sc": 1.83, "ep": 2.93, "bs": 0.0, "d": 2, "age": 18.11, "grav": 222.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A montague looks similar to that bike regarding the folding mechanism and resulting size, but I didn't test either one. \nIt costs about half but is of course heavier (~10 to ~15 kg)\n\nedit: After taking another look at the folding mechanism, it turns out it’s perhaps not all that similar after all."}, {"id": 50634551, "au": "least", "dom": 96, "sr": 42, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 2, "age": 17.8, "grav": 215.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 2704, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Just need to be mindful of what the purpose of a folding bike is for you. I would not consider Tern's folding to be practical at all for commuting, but if you just need something that you can stow inside a closet after a ride or put in the trunk of your car, it's great and you'll get a much more normal riding experience.\n\nI'm overall happy with my Brompton, though I'm hoping to see some more takes on their tri-fold design now that their patent has expired. For commuting I haven't seen any design that really matched its practicality."}, {"id": 50635573, "au": "Cpoll", "dom": 69, "sr": 43, "sc": 1.83, "ep": 3.07, "bs": 0.0, "d": 2, "age": 16.44, "grav": 189.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2614, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah. It's a tribute to the (awesome) Honda Motocompo scooter of the 80s. The Motocompo was designed to fit neatly in a car trunk.\n\nUnfortunately, the Motocompacto is overpriced for the specs, and has some questionable design choices you identified."}, {"id": 50637561, "au": "yonaguska", "dom": 21, "sr": 44, "sc": 1.78, "ep": 3.32, "bs": 0.0, "d": 3, "age": 12.4, "grav": 121.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 17, "k": 1497, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 0.842, "fa": 0.42, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "> But you must accept the inevitable: those who don't crash at least once in a season don't ride.\n\nI ride year round through rain and snow. I haven't crashed in years. but I'm also older and much more risk averse. My friends that ride far more than me also aren't crashing once a season, track riding excluded."}, {"id": 50641017, "au": "VortexLain", "dom": 118, "sr": 45, "sc": 1.76, "ep": 2.64, "bs": 0.0, "d": 0, "age": 3.48, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 210, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "Why not just use an electric unicycle instead? Oh yes, it's banned in a lot of countries for purely bureaucratic reasons, such as legally requiring 2 wheels or a handlebar."}, {"id": 50633417, "au": "layer8", "dom": 83, "sr": 46, "sc": 1.7, "ep": 2.95, "bs": 0.0, "d": 0, "age": 19.04, "grav": 240.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 0.323, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "The practical issue is that the suitcase is too large to take it with you on the bike."}, {"id": 50635383, "au": "hinkley", "dom": 111, "sr": 47, "sc": 1.66, "ep": 3.17, "bs": 0.27, "d": 2, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.379, "bl": 0.1, "ds": 0.0, "txt": "In the 80’s and early 90’s it was more common to see a pump that relied on only one peg, and often directly on the top lug of the head tube.\n\nThe larger pumps also made repairs easier. However they were made of aluminum to keep the weight down and sometimes someone would bend the shaft and then you have to borrow someone else’s pump.\n\nThen they started making pumps a foot long with nested chambers and multiple seals, or even smaller with a CO2 cartridge."}, {"id": 50635279, "au": "jjice", "dom": 50, "sr": 48, "sc": 1.53, "ep": 3.07, "bs": 0.0, "d": 1, "age": 16.85, "grav": 197.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 7509, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.165, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "I love my Brompton. It's so compact and rides like a dream.\n\nI will say that after I purchased one, I realized it was actually less convenient to take it into places in my city that it was to lock up a normal bike a lot of the time. I use both the Brompton and a just under 30 year old Specialized gravel bike I got used day to day, depending on the use case."}, {"id": 50634732, "au": "intrasight", "dom": 91, "sr": 49, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 1, "age": 17.59, "grav": 211.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 6126, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bike_suitcase", "flbl": "Bike & Suitcase (Large)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Also don't forget Birdy!\n\nI just purchased a used Birdy with a Rohloff hub from a guy retiring from the symphony. This bike has traveled the world and will continue to do so with its new owner.\n\nOne of the great things about a folding bike is that if you fold it and throw a cover over it, you can wheel it into any place that you'd normally carry a suitcase, like a restaurant."}, {"id": 50635512, "au": "aldanor", "dom": 49, "sr": 50, "sc": 1.5, "ep": 3.04, "bs": 0.0, "d": 1, "age": 16.53, "grav": 191.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1720, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.25, "bl": 0.0, "ds": 0.0, "txt": "Brompton in London is also often literally the fastest method of transportation. Electric Brompton feels like a bit of a cheat but it makes life even easier.\n\nI've never parked it outside though (it wouldn't last long), just always taking it with me."}, {"id": 50637870, "au": "mceachen", "dom": 23, "sr": 51, "sc": 1.42, "ep": 2.74, "bs": 0.0, "d": 4, "age": 11.69, "grav": 111.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3531, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One eucalyptus pod \"correctly\" oriented can stop a skateboard cold. I'd expect substantially larger obstacles to require scooters (which have at least rollerblade wheels but many are much larger) to insta-halt."}, {"id": 50641116, "au": "williamdclt", "dom": 14, "sr": 52, "sc": 1.34, "ep": 2.88, "bs": 0.0, "d": 3, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4090, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.224, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some of them go damn fast (often illegally so). I used to have one, it really is a pleasure to use, it's a really nice cruising feeling that I've not found with other means of transport. But they are so much more dangerous than even electric scooters, I feel like I can't reasonably use them anymore, it feels like I'm just waiting for The Big Accident to happen."}, {"id": 50635346, "au": "nradov", "dom": 120, "sr": 53, "sc": 1.31, "ep": 2.7, "bs": 0.0, "d": 1, "age": 16.76, "grav": 195.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 44337, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.15, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The typical use case will be a commuter riding the bike from a train station to home, where there may be no bike share kiosk nearby. And as someone who has ridden shared municipal bikes in many cities, they're often in bad condition and uncomfortable to ride."}, {"id": 50635721, "au": "jdswain", "dom": 132, "sr": 54, "sc": 1.3, "ep": 2.4, "bs": 0.0, "d": 0, "age": 16.23, "grav": 186.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 389, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 0.956, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Another interesting design for a folding bike is the yike bike. It’s electric and doesn’t have a traditional bicycle riding style, but it is very compact when folded.\n\nIt didn’t succeed commercially however."}, {"id": 50637115, "au": "lstodd", "dom": 24, "sr": 55, "sc": 1.3, "ep": 2.84, "bs": 0.0, "d": 4, "age": 13.67, "grav": 141.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1244, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.208, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They are both the same. Small wheels, controlled by body balance.\n\n(Small wheels == anything w/o enough moment of inertia to actually resist stupid jerks. This unfortunately includes most bicycles, but amazingly not 14\" motor scooters.)"}, {"id": 50637579, "au": "xarope", "dom": 56, "sr": 56, "sc": 1.3, "ep": 2.81, "bs": 0.0, "d": 2, "age": 12.35, "grav": 120.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1446, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "design_ride", "flbl": "Design & Ride (Brompton)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have a montague paratrooper, and happy to take that offroad all the time, but always look with envy at the brompton riders deploying their folded bikes.  If they ever can make a capable MTB version (the wheels seem to be a limiting factor), I'd have to get try to resist."}, {"id": 50639440, "au": "atourgates", "dom": 10, "sr": 57, "sc": 1.3, "ep": 2.74, "bs": 0.0, "d": 2, "age": 7.6, "grav": 58.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3069, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "One of the ways I can tell I’m getting old: I broke out my longboard this summer for an unusual car drop situation, and skated about 3 miles. It had been close to a decade since I’d done anything like that.\n\nI picked it up pretty quick, and didn’t eat it.  Then I literally hobbled around for a week after, just from the muscle pain of the very unique motion of pushing yourself."}, {"id": 50642823, "au": "munksbeer", "dom": 51, "sr": 58, "sc": 1.3, "ep": 2.69, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1052, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "larger_london", "flbl": "Larger & London (Mile)", "urls": [], "ig": 1.145, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In London, bikes just get stolen if you lock them up outside. Really old bikes might be slightly safer, but still liable to be stolen. I try not to moan about London much, because it isn't nearly as bad as everyone outside of London wants you to believe, but bike theft really is bad."}, {"id": 50637634, "au": "nakedneuron", "dom": 17, "sr": 59, "sc": 1.3, "ep": 2.65, "bs": 0.0, "d": 2, "age": 12.24, "grav": 119.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 119, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 1.127, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Kickscooter really shone for me bridging long walks in a big train station and shopping. I would take the scooter into the shop, cruise around and at checkout put my stuff in a bag hanging from the steering rod. It was a miracle how quick of a deal shopping sometimes was and how fast I commuted from station to home when all other things fell into place (metro just in time, no waiting line at checkout)."}, {"id": 50638777, "au": "famahar", "dom": 136, "sr": 60, "sc": 1.3, "ep": 2.53, "bs": 0.0, "d": 1, "age": 9.46, "grav": 80.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 744, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "city_compromise", "flbl": "City & Compromise (Fast)", "urls": [], "ig": 0.621, "fa": 0.34, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "It's quite expensive at around $1000, but there are these shoes called moonwalkers that are make you walk 8 mph. Basically like rollerblades but motorized and only take as much effort as walking."}, {"id": 50634634, "au": "ultrasounder", "dom": 70, "sr": 61, "sc": 1.3, "ep": 2.52, "bs": 0.0, "d": 1, "age": 17.71, "grav": 214.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 622, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bicycle_commute", "flbl": "Bicycle & Commute (Folding)", "urls": [], "ig": 0.992, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "This solves the \"last-mile\" commute problem especially when car-pooling with another commuter. 12 miles is actually plenty IF you plan the car-share commute route properly. Will be visiting my local Honda dealership during the \"Black-friday\""}, {"id": 50634715, "au": "tetromino_", "dom": 98, "sr": 62, "sc": 1.3, "ep": 2.42, "bs": 0.0, "d": 3, "age": 17.61, "grav": 212.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2223, "kpp": 3.2, "t /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
