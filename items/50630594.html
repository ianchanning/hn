ount": 17, "useful": 4, "useful_pct": 23.5, "terms": "turn, computers, several, return"}, {"slug": "general_commentary", "label": "General Commentary", "count": 17, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 9}, {"category": "gov_legal", "count": 1}], "story_anchors": ["check", "security", "server", "actor", "internal", "management", "multiple", "attacker", "compromised", "attack", "data", "hfs", "attempts", "passwords", "several", "common", "exploitation", "script"], "largest_root": {"root_id": 50630851, "author": "mentalgear", "slots": 87, "start_dom": 3, "end_dom": 89, "share_pct": 59.6, "top_dom1_age": 14.9, "top_dom1_author": "miohtama"}, "buried_cutoff": 44, "rescue_top_k": 29, "ablations": [], "tournament": [], "comments": [{"id": 50637959, "au": "goodmythical", "dom": 14, "sr": 1, "sc": 14.79, "ep": 14.79, "bs": 0.0, "d": 4, "age": 10.62, "grav": 95.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 310, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": ["https://imgur.com/a/dcOqG4N", "https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf", "https://ic3.gov/AnnualReport/Reports/"], "ig": 1.896, "fa": 3.3, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "Sure, but we've not yet seen whether or not the asymetry truly exists.\n\nThere's lots of hype around teams getting laid off, and that the illusion is that any monkey with enough compute can crack any package, but we don't know really whether or not that's going to tip in the attackers' favor.\n\nIf anyone can throw compute at vulnerabilities and anyone is either a corporation that can throw $100k in compute because they decimated the security department and even spending $100k on compute for the one remaining engineer is \"a savings\" or a random collection of attackers that scrabble together $100k in compute between them without collaborating, then the security team should win because a thousand $100 attempts is not likely to scale against $100k of concentrated compute using the same (actually likely better given that mythos et al aren't available to the randoms) tools.\n\nIf '26 and/or '27 crime reports come out to be wildly higher/more impactful then the typical increasing pace we're currently seeing, then sure, the balance is cooked.\n\nBut, look at the numbers [0] and you'll see that the increase in assets lost is relatively flat (quite erratic, but less gain than previous years in record) and that the increase in number of claims, while high in '25, is still within the range of the record. (less than either '18 or '19)\n\nIf these tools were having a major impact, because we'd see m"}, {"id": 50632014, "au": "goodmythical", "dom": 5, "sr": 2, "sc": 9.98, "ep": 10.12, "bs": 0.0, "d": 2, "age": 19.72, "grav": 254.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 311, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 2.142, "fa": 0.96, "gp": 1.623, "bl": 0.0, "ds": 0.0, "txt": "But there are already more than hundreds of thousands working in fraud/scams/hacking.\n\nIn the US, the FBI's recieved more reports YoY every year since '18 except for a dip in '22 only for '23 to again return to beating '21. Complaints of cyber crimes have nearly trippled in the US (from ~350k to >1m reports) in that time frame, with the 24/25 jump being the largest in terms of reported financial losses.\n\nThe UN estimates that more than 300k people are \"trapped in scam compounds\" (being forced to or having no better option than to engage in fraud) across SEA alone, and similar compound infrastructers have been documented across five continents with new hubs emerging.\n\nMalware devs are estimated in the thousands, and there are estimated to be ten vendors to every dev.\n\nLow skill phishers are estimated anywhere between 100k and 1m globally.\n\nAnd that's just on the 'technical' side. How many are engaged in vote/view botting, astro-turfing, shilling, propoganda, etc?\n\nIf these new tools are worthwile for legitimate devs, webdevs, graphic designers, call-centers, etc, then they are certainly worthwhile for illegitimate actors in the same space.\n\nThe reality we already live in puts cybercrime losses at a minimum of $1,300,000,000,000 in direct financial theft (money succesfully captured by cyber criminals) and closer to $10,000,000,000,000 in general losses (money lost in downtime, li"}, {"id": 50638031, "au": "protocolture", "dom": 126, "sr": 3, "sc": 9.65, "ep": 9.65, "bs": 0.0, "d": 3, "age": 10.47, "grav": 93.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 259, "qw": 71, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.929, "fa": 1.32, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": ">One reality is too many enterprise companies can't respond quickly enough to most of this\n\nMy issue in all this is that Ubuntu maintains way too many different kernels and are really slow to fix the less interesting ones. Enterprise can move as swiftly as they like. This is what emergency changes are for under ITIL.\n\n>when all the preventative best practices and vendors fail.\n\nMultiple overlapping security controls are best practice. And very very very unlikely to fail. The number of people implementing best practice security is very very small. Rather than pretending it doesnt exist, or doesnt work, you should be pushing people towards best practices.\n\n>The issue is any device with a web page is potentially compromiseable.\n\nAny device with an open port can be compromised. Heck, sometimes it doesn't need that. Which is why you don't rely on a single control. Device uses web management. Whitelist the address space that can manage it. Not just on that device at the control plane, but at the firewall too. Filter against a management VPN. Logs from Firewall, Web interface and VPN should be ingested by SIEM. Critical events should trigger alerts. SOC response determines what to do, whether temporary or just more controls are required. etc. etc. etc.\n\n>If we think about edge switches like brocade, you can have all the web-based bells and whistles or manage it more securely over a ma"}, {"id": 50631562, "au": "ygjb", "dom": 34, "sr": 4, "sc": 8.91, "ep": 9.2, "bs": 0.0, "d": 2, "age": 20.26, "grav": 266.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 292, "qw": 0, "k": 2400, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 1.856, "fa": 0.95, "gp": 1.47, "bl": 0.0, "ds": 0.0, "txt": "Most people. Just by way of example, there was a study in 2006 from Kessler and Associates that said 13% of folks will just straight up steal from their employer, and another 66% will steal if they see others getting away from it.\n\nSome crime comes from sociapathy, some comes from mental illness, most petty crime comes from desperation, but there are social indicators that 'accepted crime' endorses the behaviour and causes proliferation and escalation.\n\nAssuming that people are good in general is just as unhealthy and risky as assuming everyone is bad in general.\n\nThis goes in multiple directions, including the prevailing attitude in business that 'you don't need to outrun the bear, just your competitor'\n\nRight now there has been a shift in capacity that rebalanced the cost of defense and the cost of offense, but it's a shift on a scale that already said defense on general is far more expensive than offense in particular.  The change in capacity is in scaling and automating attacks.  The rest of the system still works, traditional appsec still works, and traditional engineering still works.  It's just that the attackers have gotten much faster and it s substantially harder for defenders to acquire the budget to keep pace.\n\nCouple all of that with the social dynamics, and politicians who don't understand or have an agenda that requires them to pretend they don't, and it's a terr"}, {"id": 50637760, "au": "Panino", "dom": 117, "sr": 5, "sc": 7.62, "ep": 7.62, "bs": 0.0, "d": 1, "age": 11.1, "grav": 102.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 102, "qw": 0, "k": 2074, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": ["https://man.openbsd.org/rand"], "ig": 1.818, "fa": 0.62, "gp": 1.092, "bl": 0.0, "ds": 0.0, "txt": "This is what OpenBSD did many years ago with rand(3). Quoting the manpage:\n\nStandards insist that this interface return deterministic results.\nUnsafe usage is very common, so OpenBSD changed the subsystem to return\nnon-deterministic results by default.\n\nIn OpenBSD the seed variable is ignored, and strong random number results will be provided from arc4random(3).\n\n...\n\nIf the standardized behavior is required srand_deterministic() can be\nsubstituted for srand(), then subsequent rand() calls will return results\nusing the deterministic algorithm.\n\nhttps://man.openbsd.org/rand\n\nSo if you need pretend random numbers, you can still get them. But the preferred choice is to use the arc4random family of functions."}, {"id": 50630972, "au": "sigmar", "dom": 132, "sr": 6, "sc": 7.24, "ep": 7.24, "bs": 0.0, "d": 0, "age": 20.92, "grav": 280.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 43, "qw": 81, "k": 5415, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": ["https://news.ycombinator.com/item?id=50341462"], "ig": 1.2, "fa": 1.04, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": ">2026-11-02 02:28:27 UTC - By early November, other threat actors had begun to scan and attempt to abuse the compromised server. We observed the GT13 actor use a script to perform a self-check for a Linux IPv4 use-after-free bug (CVE-2026-98432). After the check, the actor attempted to patch the system using Linux’s own command-line tool nftables to drop IPv4 packets with IP options that may trigger the bug. This allowed the actor to protect their hop from others engaging in future exploitation of the bug.\n\nThis is the CVE that Ubuntu dragged their feet on (into November)[1]. This post describes the _attackers_ as trying to patch the compromised machine so other people couldn't get in. The world has changed in how quickly maintainers+admins need to distribute patches.\n\n[1] https://news.ycombinator.com/item?id=50341462"}, {"id": 50633125, "au": "omh", "dom": 108, "sr": 7, "sc": 7.16, "ep": 7.16, "bs": 0.0, "d": 0, "age": 18.5, "grav": 229.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1776, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.301, "fa": 0.96, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "It's not totally clear to me how the attacker gained initial access.\n\nThe link between multiple Check Point customers suggests that CVE-2026-16232 was the initial vector. Does that mean that all of these organisations had their Check Point Security Management Server accessible via the internet?"}, {"id": 50632632, "au": "yubblegum", "dom": 27, "sr": 8, "sc": 6.9, "ep": 7.34, "bs": 0.0, "d": 2, "age": 19.07, "grav": 241.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 44, "k": 1029, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.922, "fa": 0.42, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "> Also, people dont refrain from committing crime because they're incapable, and they certainly don't need llms. People don't commit crime because most people are good people, and the ones who aren't or are questionable face almost certain consequences at some point.\n\nCounterpoint:\n\nconsider interpersonal communications. People verbally act out in virtual environments. They chimp out. The most vulgar, unkind, caustic, and damaging interactions I've ever been exposed to have been online. Never have encountered people speaking like that in person.\n\nCounterpoint:\n\nconsider dick pics. Normally, men do not go around exposing themselves to women to sexually interest them. Same guy who sends a dick pic to some random woman would never drop his pants in an elevator to a random woman.\n\n> face ... consequences\n\nSociety. Turns out society exerts unseen pressures. There are invisible social control fields affecting our behavior in public. Because we know: there are \"certain consequences\" for bad behavior."}, {"id": 50631357, "au": "sigmoid10", "dom": 39, "sr": 9, "sc": 6.84, "ep": 7.28, "bs": 0.0, "d": 2, "age": 20.5, "grav": 271.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 6787, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": [], "ig": 1.538, "fa": 0.68, "gp": 1.19, "bl": 0.0, "ds": 0.0, "txt": "2 days ago I overheard cashiers at my local grocery chain talk about how they had to dump all the food from the fridges because they suddenly started heating in several stores. This was not reported anywhere yet, but after the exact same thing happened in France I'm 100% sure this was another cyberattack. Most companies probably have a really high incentive to never report this at all, because it would frighten away their customers. There are probably countless cases like this at smaller banks or financial providers that we'll never hear about because they will be swept under the rug for sure. Better write off the loss than write off the whole business."}, {"id": 50631572, "au": "ThePhysicist", "dom": 91, "sr": 10, "sc": 6.67, "ep": 6.67, "bs": 0.0, "d": 1, "age": 20.24, "grav": 266.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 13202, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.65, "fa": 0.28, "gp": 1.378, "bl": 0.0, "ds": 0.0, "txt": "It's such a simple mistake that you and LLM review can miss if not specifically looking for it, especially if it's in a dependency. Lots of folks don't know that Math.random() is insecure and they should be using Crypto.getRandomValue(), it's mostly bad language design, from an age where security was just an afterthought even more so than today. For LLMs it's trivial to find such instances.\n\nThat said any good security audit would have turned this up well before the age of LLMs, we were checking for weak RNG values first thing when looking at a new codebase as it was often an easy finding along with e.g. weak hashing algorithms like MD5 or SHA1. I believe a lot of static analysis code scanning tools have rules that flag Math.random() as insecure as well."}, {"id": 50633416, "au": "ba1afd89f34cb23", "dom": 122, "sr": 11, "sc": 6.19, "ep": 6.34, "bs": 0.0, "d": 1, "age": 18.18, "grav": 223.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 207, "qw": 0, "k": 79, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.762, "fa": 0.28, "gp": 0.965, "bl": 0.0, "ds": 0.0, "txt": "I'm not being snarky, but if you have to ask, you probably aren't qualified to run it securely. You can run it, but it'll be vulnerable because you'll not implement some best practices that'll bite you.\n\nAnyway, it's quite rare that control or management plane attacks can be carried out just via the data plane. Meaning, it's rare you can get onto a security appliance by passing traffic through it. Routing a packet a through a router shouldn't let you exploit a vulnerability on the router itself. Therefore, the best defense is to make sure the management planes of the routers and firewalls are not Internet accessible, and that the control planes are as locked down as possible (difficult with devices that terminate VPN tunnels from dynamic sources, and to some degree with WAN BGP peering).\n\nA Check Point security server probably shouldn't have its login page available on the Internet, though I haven't worked with that platform much. I guess if you want dynamic endpoints, like branch offices, to connect to it for management that could make sense, but I find that icky and would strongly prefer some sort of overlay network solution managed in-house or managed by some service provider to lock that down a lot rather than just make the box public."}, {"id": 50635289, "au": "macintux", "dom": 110, "sr": 12, "sc": 5.78, "ep": 5.93, "bs": 0.0, "d": 2, "age": 15.98, "grav": 181.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 18775, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.63, "fa": 0.34, "gp": 0.78, "bl": 0.0, "ds": 0.0, "txt": "Not the same exposure, but I was unpleasantly surprised when setting up hardware at a major regional data center to discover that the network we were given for data backup services was wide open to anyone deployed there. I looked for other IP addresses, connected via SSH to confirm my suspicions, and let the provider know.\n\nUnfortunately, ~25 years ago, people weren't quite so paranoid. I assume they eventually cleaned that up, but I'd wager it wasn't promptly."}, {"id": 50631273, "au": "reaperducer", "dom": 76, "sr": 13, "sc": 5.69, "ep": 6.13, "bs": 0.0, "d": 1, "age": 20.61, "grav": 273.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 36571, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.24, "fa": 0.68, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "soon the chaotic landscape of 100.000s of cyber criminals will just use compute to prompt models to \"Make me as much money as possible\" , with the result of these models/swarms attacking any online service including critical infrastructure.\n\nI recently had to conduct some business with the state in which I live.  I had to make a ~$400 payment via check because this particular department only takes cash, checks, and money orders because it is so often the target of cyber fraud.\n\nLooks like the big cultural shift of A.I. will be swinging back to some of the old ways of doing things.\n\nI'm OK with that.  I'd rather skip the $4 cash back from my credit card and know that my transaction, information, and government are safe."}, {"id": 50634726, "au": "Grimburger", "dom": 78, "sr": 14, "sc": 5.62, "ep": 6.06, "bs": 0.0, "d": 1, "age": 16.73, "grav": 195.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 7, "k": 2408, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 0.754, "fa": 1.1, "gp": 0.792, "bl": 0.0, "ds": 0.0, "txt": ">Make me as much money as possible\n\nSo I actually gave this a go and ended up losing a thousand on polymarket with real tests, all my models on backtesting and current bids are barely breaking even, best one barely making 2%. Turns out frontier models either suck at this game or its completely saturated already, take your guess on that one\n\nThe funniest part is im up maybe $60k manually making wagers starting from 3k, long after llms cam into existence too so got plenty to play around with for the fun of it, at this point pulled out enough to laugh if it all goes wrong."}, {"id": 50635011, "au": "ba1afd89f34cb23", "dom": 125, "sr": 15, "sc": 5.55, "ep": 6.69, "bs": 0.85, "d": 3, "age": 16.36, "grav": 188.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 0, "k": 79, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": ["https://codilime.com/blog/management-plane-vs-control-plane-vs-data-plane/"], "ig": 1.522, "fa": 0.62, "gp": 0.929, "bl": 0.32, "ds": 0.0, "txt": "Here’s a random link that explains control vs data vs mgmt plane on a network device: https://codilime.com/blog/management-plane-vs-control-plane-...\n\nThey have nothing to do with console port vs web interface. The management interface simply shouldn’t be accessible to attackers at all unless they’ve already deeply penetrated the network. You want devices with a dedicated management interface and disable all in-band (ie, via the data plane) management."}, {"id": 50634584, "au": "bumblehean", "dom": 109, "sr": 16, "sc": 5.19, "ep": 5.71, "bs": 0.0, "d": 1, "age": 16.91, "grav": 198.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 19, "k": 216, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.426, "fa": 0.42, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": ">Does that mean that all of these organisations had their Check Point Security Management Server accessible via the internet?\n\nI have no knowledge on this specific incident, but from experience I can tell you that orgs having the management plane for their network equipment wide open to the internet is shockingly common. Usually (again, IME) set up by lazy MSPs or consultants who either don't know any better or don't want to bother with connecting to a VPN.\n\nBack when I did networking work this was always one of the first things I checked at a new client."}, {"id": 50631047, "au": "PyWoody", "dom": 90, "sr": 17, "sc": 5.11, "ep": 5.26, "bs": 0.0, "d": 0, "age": 20.83, "grav": 278.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 1066, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": [], "ig": 1.391, "fa": 0.34, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "2026-10-02 13:17:45 UTC - The actor scanned and began exploitation against the HFS server. Each POST to the HFS loginSrp1 endpoint returns a new signed session cookie containing a “sid” value drawn from JavaScript’s Math.random() function. Through conducting several logins in succession, the actor collected enough output to reconstruct the internal state of the V8 PRNG algorithm, and thus recover an HFS session-cookie signing key, then forge a signed admin session cookie. This allows the attacker to login as admin without a password.\n\nI cannot believe this is still an issue. I remember mucking around with this vector on Burp Suite a decade ago."}, {"id": 50635908, "au": "cyberax", "dom": 103, "sr": 18, "sc": 4.77, "ep": 5.06, "bs": 0.0, "d": 3, "age": 15.04, "grav": 164.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 7233, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.983, "fa": 0.68, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "BTW, a way to fix it is to create your own \"localhost\" name and issue a certificate for it. Then just commit it into your code repository.\n\nI used to do that once every 3 years with a \"regular\" SSL provider. Unfortunately, now the longest period is 200 days. I'll have to set up Let's Encrypt automation for it eventually :("}, {"id": 50637849, "au": "autoexec", "dom": 13, "sr": 19, "sc": 4.64, "ep": 5.08, "bs": 0.0, "d": 4, "age": 10.88, "grav": 99.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 43, "k": 23004, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 1.349, "fa": 0.42, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "> But breaking and destroying systems is a piece of cake, you just send enough dumb agents to try all kinds of random vectors of attack until one succeds. You dont really need to know what you're doing, just throw compute on the problem.\n\nThat's been going on long before LLMs too. Script kiddies have always used automated tools to seek out systems and hurl attacks at them just to see what sticks. Those automated attacks can happen all at once or be drawn out over long periods of time and spread out over many bots to avoid triggering defenses. Scale and compute aren't really a new problem.\n\nMaybe we'd be in trouble if everyone could just tell chatgpt to hack a bank and it would, but that isn't the case so we're pretty much back to where we started. Attackers will still have to find/buy and set up the scripts/toolkits/LLMs to do what they couldn't do without them."}, {"id": 50635434, "au": "pokpokpok", "dom": 93, "sr": 20, "sc": 4.6, "ep": 5.04, "bs": 0.0, "d": 3, "age": 15.78, "grav": 177.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 390, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.976, "fa": 0.68, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "I had code using math.random() to generate passwords introduced into my codebase, written by opus 4.6 in Febuary 2026, and not found until November 2026"}, {"id": 50634685, "au": "j45", "dom": 124, "sr": 21, "sc": 4.48, "ep": 5.36, "bs": 0.0, "d": 2, "age": 16.79, "grav": 196.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 267, "qw": 0, "k": 4935, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.748, "fa": 0.0, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "Seeing the qualified people being hit with it whether they're qualified or not, is usually the people I help.\n\nI often help figuring things out beyond assumptions like that when all the preventative best practices and vendors fail.\n\nOne reality is too many enterprise companies can't respond quickly enough to most of this, let alone their vendors.. let alone either suitably understand the cutting edge of AI threat vectors as they change weekly, let alone protect users.\n\nThere's also everyone that's not an enterprise customer also just as exposed to all of this.\n\nI mentioned something pfsense (Netgate) based.  That might handle some of it, for some use cases.\n\nOne thing about reading your approach is how common it is, or isn't.  You can imagine businesses that primarily use the cloud, or increasingly having some on-prem again.\n\nI doubt doubt a checkpoint server has it's login page available on the internet, but it won't be a surprise if it ends up being accessed indirectly and available from the site.  The issue is any device with a web page is potentially compromiseable.\n\nIf we think about edge switches like brocade, you can have all the web based bells and whistles, or manage it more securely over a managed link cable.\n\nCybersecurity has gone the way increasingly of convenience (web based), while I'm not against that, there's a lot bigger and many more layers or attack surfaces"}, {"id": 50632754, "au": "asdfman123", "dom": 22, "sr": 22, "sc": 4.4, "ep": 4.84, "bs": 0.0, "d": 2, "age": 18.93, "grav": 238.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 57, "k": 8813, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 0.609, "fa": 0.76, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "> Also, people dont refrain from committing crime because they're incapable\n\nThey often refrain because it's not profitable given the risk profile. And the large majority of criminals aren't actually smart enough for sophisticated cybercrime.\n\n> and they certainly don't need llms.\n\nLLMs make it profitable given the risk profile, and don't require as much intelligence to operate.\n\n> People don't commit crime because most people are good people\n\nI actually agree that most people are good people, but if you give LLM swarms to the 5% of the world comprised of shameless scammers that's a big problem.\n\n> and the ones who aren't or are questionable face almost certain consequences at some point. The same social frameworks that exist now to prevent crime will exist then as well.\n\nThe ones you know about have faced consequences."}, {"id": 50631002, "au": "morkalork", "dom": 59, "sr": 23, "sc": 3.91, "ep": 5.01, "bs": 0.0, "d": 2, "age": 20.88, "grav": 280.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 5739, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.784, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "If I had to guess, free and open internet where networks route traffic for all. Can already see it coming with all the ID verification laws to access porn sites. Google requiring accounts and government ID to create side-loaded apps. Banking and other services wanting full chain of trust down through OS to hardware on phones. The future internet is going to look like the French Minitel of the past. Bad actors won't even be allowed to send a packet without impersonating a corporate entity first. /doomerism"}, {"id": 50636382, "au": "pixl97", "dom": 123, "sr": 24, "sc": 3.69, "ep": 4.88, "bs": 0.53, "d": 2, "age": 14.28, "grav": 151.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 19, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.266, "fa": 0.42, "gp": 0.485, "bl": 0.2, "ds": 0.0, "txt": ">the best defense is to make sure the management planes of the routers and firewalls are not Internet accessible\n\nIn a low to zero trust world they should be isolated from your internal network too. We have seen a pile of different IOT devices perform network scans in the past few years. The inside shouldn't be considered safe either."}, {"id": 50631220, "au": "zkmon", "dom": 144, "sr": 25, "sc": 3.54, "ep": 4.42, "bs": 0.0, "d": 0, "age": 20.66, "grav": 275.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2336, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.686, "fa": 0.0, "gp": 0.316, "bl": 0.0, "ds": 0.0, "txt": "There is panic in every large highly regulated companies about \"do something about cyber-attacks by AI agents\".\n\nThe funny thing the companies are under attack on both sides - externally and internally. External one might be just a threat, but the internal one is real - the security department is rampaging across the floors and business units, dictating everyone, drafting new rules, pouring money to vendors to install something they don't understand. No rules, no process. Whatever they command, must be delivered, within minutes. It's total anarchy.\n\nThe"}, {"id": 50631602, "au": "pwython", "dom": 35, "sr": 26, "sc": 3.32, "ep": 4.2, "bs": 0.0, "d": 2, "age": 20.2, "grav": 265.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 5, "k": 800, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 0.53, "fa": 0.64, "gp": 0.777, "bl": 0.0, "ds": 0.0, "txt": "> Thats not how it works\n\nYet. It has only been a few months since \"swarms\" of agents have shown their capabilities. <100B open models being just as good as Fable/Astra in a year is perfectly plausible. And by then, inference software will be much easier than even LM Studio."}, {"id": 50633422, "au": "ilamont", "dom": 15, "sr": 27, "sc": 3.03, "ep": 3.7, "bs": 0.0, "d": 3, "age": 18.18, "grav": 223.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 55679, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "It will eventually reach an inflection point where countries will be forced to take far stronger action. New laws that put a liability burden with teeth on telcos, Google, and AI platforms would be a first step, but it won't end there. Going full transnational \"Turing Police\" a la Neuromancer is not out of the question if the exploits extend to acts of mass murder or terrorism."}, {"id": 50637400, "au": "urikaduri", "dom": 12, "sr": 28, "sc": 3.02, "ep": 4.12, "bs": 0.0, "d": 3, "age": 11.98, "grav": 115.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.467, "fa": 0.0, "gp": 0.463, "bl": 0.0, "ds": 0.0, "txt": "I think you're missing the asymetry that llms bring.\n\nWe needed pretty powerful models and methodologies to build good reliable software that adds value.\n\nBut breaking and destroying systems is a piece of cake, you just send enough dumb agents to try all kinds of random vectors of attack until one succeds. You dont really need to know what you're doing, just throw compute on the problem."}, {"id": 50636033, "au": "miohtama", "dom": 1, "sr": 29, "sc": 2.97, "ep": 3.37, "bs": 0.0, "d": 0, "age": 14.86, "grav": 161.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 13640, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Hello my old friend PRNG.\n\n”The actor scanned and began exploitation against the HFS server. Each POST to the HFS loginSrp1 endpoint returns a new signed session cookie containing a “sid” value drawn from JavaScript’s Math.random() function. Through conducting several logins in succession, the actor collected enough output to reconstruct the internal state of the [Node.js] V8 PRNG algorithm, and thus recover an HFS session-cookie signing key, then forge a signed admin session cookie. This allows the attacker to login as admin without a password.”"}, {"id": 50634413, "au": "20after4", "dom": 112, "sr": 30, "sc": 2.95, "ep": 3.31, "bs": 0.0, "d": 0, "age": 17.14, "grav": 202.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2592, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.942, "fa": 0.0, "gp": 0.759, "bl": 0.0, "ds": 0.0, "txt": "Am I the only one that thinks Math.random should be fixed instead of the hundreds of apps that used it wrong?  Why shouldn't we make all random number generators at least somewhat secure?"}, {"id": 50640492, "au": "mschuster91", "dom": 36, "sr": 31, "sc": 2.74, "ep": 3.63, "bs": 0.0, "d": 2, "age": 3.94, "grav": 24.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 21, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "turn_computers", "flbl": "Turn & Computers (Several)", "urls": [], "ig": 1.034, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  I don't think its healthy to assume this and just insitgate unecessary anxiety just because you think some lawless sci-fi future exists.\n\nLook at Indian phone scammers, go watch some Scammer Payback on Youtube. Make an AI harness that allows these scammers to easily direct AI swarms and the future will be lawless.\n\nThe only way out of this would be to sanction India and Myanmar to hell and beyond until they actually go and prosecute scammers."}, {"id": 50634479, "au": "grg0", "dom": 113, "sr": 32, "sc": 2.68, "ep": 4.08, "bs": 0.0, "d": 1, "age": 17.04, "grav": 201.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 733, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.571, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "I think this is a more general question because C's rand() also comes to mind as sucking very hard. There are, across languages and OSes, very bad decisions from the past that we keep dragging on.\n\nI just see this as a natural development of things. Companies have prioritized shipping shit fast. The security industry is snake oil on top of bad software (sorry, guys), and the software industry is even a larger joke. Now we are seeing the consequences. The only way forward is to increase spend on real security and to slow the fuck down."}, {"id": 50637074, "au": "cyberax", "dom": 105, "sr": 33, "sc": 2.68, "ep": 3.12, "bs": 0.0, "d": 5, "age": 12.91, "grav": 129.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 7233, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.326, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Local CAs are a pain in the ass to maintain, and they are a huge vulnerability. If your CA private keys leak, your devices can be MITM-ed.\n\nIt pops up in all kinds of places, like CI/CD runs or automated tests."}, {"id": 50636910, "au": "logicallee", "dom": 143, "sr": 34, "sc": 2.63, "ep": 3.73, "bs": 0.0, "d": 0, "age": 13.28, "grav": 135.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 3367, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.586, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "interesting perspective. I got a notification about this just after explaining that it's a hard sell to have users give control of their bank accounts to an AI, given that the public posture is that AI's and the companies that operate them have no responsibility when they fail, i.e. the user's money is all stolen.\n\nI like to give away valuable advice, I've pointed it out and would be happy to solve it in a paid consultation. I myself operate a custodial user account wallet managed by AI, and my last position was at an accounting firm. If you feel this is an intrusion (I'll solve all your business problems for you in an afternoon), well, imagine how your users feel!"}, {"id": 50632409, "au": "prescriptivist", "dom": 29, "sr": 35, "sc": 2.48, "ep": 3.36, "bs": 0.0, "d": 2, "age": 19.31, "grav": 246.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 3, "k": 405, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.742, "bl": 0.0, "ds": 0.0, "txt": "> insitgate unecessary anxiety\n\nIf you work at an org with a dedicated security team that has access to the frontier labs security tools then you know anxiety levels are at their asymptotic ceiling already."}, {"id": 50631096, "au": "persedes", "dom": 38, "sr": 36, "sc": 2.41, "ep": 3.73, "bs": 0.0, "d": 1, "age": 20.79, "grav": 278.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 351, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "just came back from the honda dealer, they could not install a software update because honda got \"cyberhacked\" and they corrupted the update file, which caused the steering unit? to brick. The unit has been backordered now as a result and they've suspended all software updates until they know what's going on.\n\nIf that is true (and the whole in person software update thing aside), these orgs will experience a lot of pain for years of neglect with their software practices..."}, {"id": 50636179, "au": "pixl97", "dom": 25, "sr": 37, "sc": 2.24, "ep": 3.12, "bs": 0.0, "d": 3, "age": 14.64, "grav": 157.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean most people that commit crime are committing low tech crime because they are not very smart. Hi-tech crime isn't that hard if you have the knowledge,  but if you have the knowledge it's easy to get employed... at least till AI takes your job.\n\nThe number of tech crimes is increasing too. Things like crime syndicates that install massive numbers of skimmers are common now, we've had a lot of issues with this down in Texas.\n\nIf/when LLMs make it easier there are a lot of people that will branch out"}, {"id": 50630851, "au": "mentalgear", "dom": 3, "sr": 38, "sc": 2.17, "ep": 3.71, "bs": 0.0, "d": 0, "age": 21.05, "grav": 283.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4741, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.798, "bl": 0.0, "ds": 0.0, "txt": "Buckle up, this is just the beginning of the end. ATM only more sophisticated cyber criminals or state actors use LLMs to penetrate, but soon the chaotic landscape of 100.000s of cyber criminals will just use compute to prompt models to \"Make me as much money as possible\" , with the result of these models/swarms attacking any online service including critical infrastructure."}, {"id": 50637779, "au": "dboreham", "dom": 2, "sr": 39, "sc": 2.15, "ep": 2.95, "bs": 0.0, "d": 1, "age": 11.05, "grav": 101.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 18260, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.257, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Pretty bad, but this bug was fixed in July. So more about: JS mystery-meat dependency goo and the difficulty to get security patches into any sizable codebase because all the application logic and transitive dependencies break because nobody sticks to the same interfaces for more than a day."}, {"id": 50642294, "au": "SAI_Peregrinus", "dom": 138, "sr": 40, "sc": 2.09, "ep": 3.19, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 7404, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.017, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AIs have raised the complexity floor for an attack to be out of range of script kiddies. Previously \"complex\" chained attacks are now easy."}, {"id": 50634406, "au": "alephnerd", "dom": 89, "sr": 41, "sc": 1.88, "ep": 3.42, "bs": 0.0, "d": 5, "age": 17.14, "grav": 203.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 14906, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.042, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree with you to a degree as well. There is value from what is being identified and chained, but HN is where nuance goes to die.\n\nBut the triagepocalypse already started shortly before GPT was GAed, when MTTR reduced from weeks to 2-3 days in the early 2020s.\n\nYou can't have a sensible conversation about security nor AI, let alone both together on here."}, {"id": 50636575, "au": "ifwinterco", "dom": 94, "sr": 42, "sc": 1.75, "ep": 3.07, "bs": 0.0, "d": 4, "age": 13.95, "grav": 146.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1637, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Lots of old examples of code using Math.random() in the training data, probably more than Crypto.getRandomValue, given that Math.random has been around a lot longer.\n\nYou can try and train it out afterwards but there’ll always be a part of the model that wants to write everything with Math.random because so many people did in the past"}, {"id": 50633206, "au": "vesinisa", "dom": 68, "sr": 43, "sc": 1.49, "ep": 3.03, "bs": 0.0, "d": 2, "age": 18.41, "grav": 227.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 5769, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Not sure if that is the case. The experience from OSS projects currently seems to be that the bottleneck for accepting fixes for LLM-discovered soundness issues lies in the non-trivial cost of human review. And since the human review is something we can not really forego, it would seem adversarial LLMs have the upper hand here.\n\nIt is a bit similar to how in mathematics proving a theorem is usually really hard, but disproving it is as simple as finding just one counterexample. Proofing a software system against all adversaries is hard and laborious, while just one critical vulnerability is  usually enough to invalidate all the defences."}, {"id": 50631165, "au": "bakies", "dom": 136, "sr": 44, "sc": 1.45, "ep": 2.69, "bs": 0.0, "d": 0, "age": 20.71, "grav": 276.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 792, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 0.973, "fa": 0.0, "gp": 0.28, "bl": 0.0, "ds": 0.0, "txt": "Security appliances increase attack surface area and stop cyber attacks as frequently as TSA stops bombs on planes."}, {"id": 50634370, "au": "christophilus", "dom": 92, "sr": 45, "sc": 1.42, "ep": 2.96, "bs": 0.0, "d": 2, "age": 17.2, "grav": 204.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 14315, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.797, "fa": 0.34, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "I don’t think any LLM would miss the use of Math.random where a cryptographic random should be used. Then again, I don’t think I know any programmers that would miss it. It’s not some advanced concept. It’s security 101 stuff."}, {"id": 50631185, "au": "fedupnow", "dom": 4, "sr": 46, "sc": 1.4, "ep": 2.5, "bs": 0.0, "d": 1, "age": 20.7, "grav": 275.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 0.577, "fa": 0.0, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "Thats not how it works, but sure. I don't think its healthy to assume this and just insitgate unecessary anxiety just because you think some lawless sci-fi future exists.\n\nAlso, people dont refrain from committing crime because they're incapable, and they certainly don't need llms. People don't commit crime because most people are good people, and the ones who aren't or are questionable face almost certain consequences at some point. The same social frameworks that exist now to prevent crime will exist then as well."}, {"id": 50631513, "au": "djeastm", "dom": 45, "sr": 47, "sc": 1.36, "ep": 2.9, "bs": 0.0, "d": 3, "age": 20.31, "grav": 267.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1425, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_money", "flbl": "Models & Money (Cyber)", "urls": [], "ig": 1.233, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My local Walmart also recently decided to replace the entire cooler section of the grocery department along with other more cosmetic renovations... Coincidence? Probably. But it certainly caught my attention."}, {"id": 50635029, "au": "oldsj", "dom": 131, "sr": 48, "sc": 1.35, "ep": 2.89, "bs": 0.0, "d": 1, "age": 16.33, "grav": 187.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 100, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t really trust opn/ pfsense much more either plus it’s kind of clunky to work with in the age of agents. I recently moved to a nixos based router + firewall so now all config and package dependencies are based in git and I can use Renovate to keep everything up to date, with cooldowns for some additional supply chain safety. Router changes and updates can then be tested and validated in CI like anything else"}, {"id": 50637375, "au": "urikaduri", "dom": 32, "sr": 49, "sc": 1.3, "ep": 2.84, "bs": 0.0, "d": 2, "age": 12.06, "grav": 116.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 0.508, "fa": 0.34, "gp": 0.47, "bl": 0.0, "ds": 0.0, "txt": "We're not talking about the good people, we are talking about the hundreds of thousands, a tiny fraction of the world population, who are cybercriminals.\n\nToday they send ransomware, tomorrow they send agents that will cause 100x more chaos."}, {"id": 50636492, "au": "teravor", "dom": 116, "sr": 50, "sc": 1.27, "ep": 2.82, "bs": 0.0, "d": 1, "age": 14.11, "grav": 148.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 626, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.072, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "the objection is something along the lines of how the people who depend on it assume high performance and if every PRNG was made into a CSPRNG there would be performance regressions or something.\n\nfrankly, it should be made their problem and if the performance isn't good enough for them they should migrate to custom insecure PRNGs themselves."}, {"id": 50636302, "au": "happyopossum", "dom": 130, "sr": 51, "sc": 1.24, "ep": 3.63, "bs": 0.85, "d": 3, "age": 14.43, "grav": 154.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 18792, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.429, "fa": 0.0, "gp": 0.184, "bl": 0.32, "ds": 0.0, "txt": "The point is that vendors never provided absolute security.  This also isn't a failure of a network security product - it's their management server, which has no reason to be sitting wide open on the internet.\n\nFollow established security practices, audit them, re-evaluate your procedures constantly, and basically do the job of a proper cybersecurity team."}, {"id": 50636410, "au": "pixl97", "dom": 137, "sr": 52, "sc": 1.21, "ep": 3.13, "bs": 0.53, "d": 1, "age": 14.23, "grav": 150.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 0.922, "fa": 0.34, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Eh, I won't say this is 100% true.\n\nMost hack attempts are really stupid and going for the lowest hanging fruit. They tend to block all kind of dumb crap from phishing attacks to users clicking on shit they shouldn't.\n\nWhere they fail is more complex attacks."}, {"id": 50632778, "au": "asdfman123", "dom": 66, "sr": 53, "sc": 1.21, "ep": 2.75, "bs": 0.0, "d": 1, "age": 18.91, "grav": 238.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 8813, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.688, "fa": 0.0, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "I agree, but I believe the defenders will be able to catch up using LLM analysis of their own. The question is how long are we going to deal with this before we develop effective countermeasures."}, {"id": 50636431, "au": "pixl97", "dom": 142, "sr": 54, "sc": 1.16, "ep": 2.57, "bs": 0.53, "d": 2, "age": 14.2, "grav": 150.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crime_social", "flbl": "Crime & Social (LLM)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Yep, or you get multiple bots fighting on the same box and someone notices.\n\nAt this point I want to turn an LLM into a kill bot that hacks into and permanently kills devices that can be hacked into. That's one way to keep them out of botnets."}, {"id": 50631338, "au": "nukanse", "dom": 80, "sr": 55, "sc": 1.15, "ep": 2.69, "bs": 0.0, "d": 1, "age": 20.53, "grav": 272.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.952, "fa": 0.0, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "No. We are passing the long hanging fruit stage. After it, finding and exploiting bugs will be much harder.\n\nThe largest security hole is that all computers have an us mandated chip that takes over. If that's hacked, the only solution will be a complete computer replacement"}, {"id": 50636689, "au": "ifwinterco", "dom": 114, "sr": 56, "sc": 1.15, "ep": 2.48, "bs": 0.0, "d": 1, "age": 13.73, "grav": 142.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1637, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 0.938, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Maybe but then it would end up being secure only on newer environments (new browsers for client side code, which is something you don’t control), while the same code would be insecure when run on an older environment.\n\nThat also isn’t ideal"}, {"id": 50631628, "au": "alephnerd", "dom": 87, "sr": 57, "sc": 1.15, "ep": 2.44, "bs": 0.0, "d": 3, "age": 20.16, "grav": 264.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 14906, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "internet_security", "flbl": "Internet & Security (Management)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I worked in this space since Operation Aurora. Some of the attack chains I worked on back when I was still a SWE are likely still rattling in some XDR or CNAPP.\n\nMost HNers are out of the loop for most things security, cloud, and even AI."}, {"id": 50642204, "au": "PeterisP", "dom": 67, "sr": 58, "sc": 1.15, "ep": 2.44, "bs": 0.0, "d": 2, "age": 0.12, "grav": 3.9, "surf": 60.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 22933, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This campaign seems to be the case where LLM analysis couldn't possibly have helped - as in, the bug was already found, analyzed and fixed, but the fix isn't appropriately deployed."}, {"id": 50631817, "au": "nsbdhciebsbdhc", "dom": 99, "sr": 59, "sc": 1.15, "ep": 2.4, "bs": 0.0, "d": 2, "age": 19.93, "grav": 259.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 46, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "random_math", "flbl": "Random & Math (Security)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Let's not forget that crypto.getrandomvalue requires https which can force developers not using local https to use the insecure methods which they inevitably /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
