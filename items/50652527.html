, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.408, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "I don't blame them for cutting costs to become profitable. I hope they succeed. I also hope they're careful to do it in ways that don't reduce the value for users.\n\nRight now there is competition in the industry, if either Anthropic or OpenAI fail it will be bad for EVERY consumer of AI as the remaining giant will lose most of it's motivation to keep improving and move to the enshittification stage."}, {"id": 50662513, "au": "wry_xy", "dom": 146, "sr": 81, "sc": 3.14, "ep": 3.53, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 9.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 73, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.493, "fa": 0.0, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "For me, the entire 6 series has been incredibly inconsistent. 5.4 - 5.6 were amazingly dependable. I knew exactly what they could accomplish, where their weak points were, and they stayed in those lanes 24/7.\n\nWhen Astra dropped, suddenly 5.6 started to wobble with all their models and it's been that way throughout. I accepted it because Claude at the time was insufferable but with Opus 5.5 and Fable 5.2 I'm increasingly leaning on Claude because they're so much more predictable, but I'd kill to have the old workhorse of 5.6 back, even if it's weaker than these newer models at their best. Predictability is so underrated."}, {"id": 50659169, "au": "SOLAR_FIELDS", "dom": 241, "sr": 82, "sc": 3.14, "ep": 3.51, "bs": 0.0, "d": 1, "age": 7.55, "grav": 58.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 14, "k": 8320, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 0.852, "fa": 0.28, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": ">Same thing happened with Opus, 4.5 was amazing, and gradually got worse until we hit 5.5\n\nWould love to see an eval benchmark that shows the same task degrading over time to demonstrate this. Else it's just feels."}, {"id": 50660050, "au": "InsidiousWombat", "dom": 63, "sr": 83, "sc": 3.14, "ep": 3.48, "bs": 0.0, "d": 8, "age": 6.17, "grav": 43.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "Well, that particular part of industry heavily relies on hyping up massive revolutions in how work is done everywhere all at once, rather that admitting that it might not be a silver bullet and just focusing on making actually sustainable business models"}, {"id": 50659694, "au": "q17", "dom": 186, "sr": 84, "sc": 3.14, "ep": 3.48, "bs": 0.0, "d": 0, "age": 6.81, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 41, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "Surely this assumes that the cost to the customer is proportional to the net cost to OpenAI?\n\nBut OpenAI charging customers less doesn’t mean they’re controlling their own costs, in fact it could imply the reverse"}, {"id": 50659891, "au": "ACCount39", "dom": 72, "sr": 85, "sc": 3.14, "ep": 3.46, "bs": 0.0, "d": 7, "age": 6.53, "grav": 47.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.143, "bl": 0.0, "ds": 0.0, "txt": "That's the thing - OpenAI has actual world-changing tech. AI is a world-changing tech, and OpenAI is a frontier lab at the bleeding edge of AI. They're trading blows with Anthropic at the top of the line premium offerings while having a broader userbase, and they're still getting performance gains release to release.\n\nBut some of the decisions they make are ill-conceived at best. Their \"let's make a device\" being one of them."}, {"id": 50662132, "au": "LoganDark", "dom": 8, "sr": 86, "sc": 3.14, "ep": 3.41, "bs": 0.0, "d": 3, "age": 1.07, "grav": 7.5, "surf": 6.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.428, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "To me, it seems like Claude and GPT were just trained by different neurotypes. In my experience, GPT is more pragmatic and algorithmic in thinking style (and acts like a tool), while Claude is more principled and emotional (and acts like a person). They can be just as good, but they give different results and make different interpretations, so one or the other tends to be better for certain types of things.\n\nGemini is perhaps the most balanced model I'm aware of. If I were to think of it like a person, it would share GPT's neurotype, but have been raised more neutrally and more inclusively, I would suppose. It seems more agnostic than GPT, and way more than Claude, in general."}, {"id": 50659851, "au": "techpression", "dom": 9, "sr": 87, "sc": 3.14, "ep": 3.37, "bs": 0.0, "d": 3, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 709, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 0.928, "fa": 0.0, "gp": 0.822, "bl": 0.0, "ds": 0.0, "txt": "My experience is the opposite, Astra was the first model I got something good and stable out of, without unreadable Claudism commentary. Swapped from Anthropic on the spot."}, {"id": 50659895, "au": "tezza", "dom": 125, "sr": 88, "sc": 3.14, "ep": 3.36, "bs": 0.0, "d": 1, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1864, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.113, "fa": 0.0, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "Can you share some specific cases?\n\nI use both OpenAI and Anthropic, a lot, on large codebases. To me it seems that both providers are very strong all around with each having extra powers in some areas.\n\nAnthropic good at flowery stuff like text, UI design.\n\nOpenAI is good at following what you asked it to do and technically stronger and faster, especially with complex code"}, {"id": 50659456, "au": "shepherdjerred", "dom": 221, "sr": 89, "sc": 3.14, "ep": 3.34, "bs": 0.0, "d": 0, "age": 7.2, "grav": 54.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5764, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.063, "fa": 0.0, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "Businesses are cutting back on AI spend. OpenAI already has pretty good models. It seems like they are just reacting to the trend to position themselves as the best price/performance ratio.\n\nThey could also be in trouble, but I don't think this is a reliable indicator."}, {"id": 50660508, "au": "IshKebab", "dom": 139, "sr": 90, "sc": 3.14, "ep": 3.32, "bs": 0.0, "d": 3, "age": 5.32, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 3, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.415, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> no blank lines\n\nYeah what's up with that? I get it doesn't help the models but they seem to manage blank lines in other situations, yet Opus 5.5 will almost never put them in Rust functions unless I explicitly tell it to (which does work). Seems to be language dependent too. It happily puts blank lines in other languages."}, {"id": 50661177, "au": "segmondy", "dom": 161, "sr": 91, "sc": 3.14, "ep": 3.26, "bs": 0.0, "d": 1, "age": 3.78, "grav": 23.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 9052, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.889, "fa": 0.34, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "I lived in that era, it's not comparable.  There's no race to bottom, demand will go up for the next 10 years. You can generate your own tokens locally"}, {"id": 50660909, "au": "aerhardt", "dom": 127, "sr": 92, "sc": 3.14, "ep": 3.24, "bs": 0.0, "d": 3, "age": 4.51, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1405, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "I see the same with both model families, I've honestly come to believe that current commercially available models can't produce \"decent\" code unless you load your codebase to the gills with static analysis tooling and checks."}, {"id": 50660956, "au": "pier25", "dom": 258, "sr": 93, "sc": 3.14, "ep": 3.23, "bs": 0.0, "d": 0, "age": 4.4, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 17376, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "It's not surprising. The majority of users aren't paying for ChatGPT and most that do are on a heavily subsidized subscription.\n\nWe still don't know how much the API tokens are subsidized too. The cost of electricity and GPU time might be covered but other big expenses like training and R&D are probably not included in inference costs. And I believe OpenAI is counting some of the inference costs as marketing too."}, {"id": 50659584, "au": "mvkel", "dom": 239, "sr": 94, "sc": 3.14, "ep": 3.23, "bs": 0.0, "d": 0, "age": 6.99, "grav": 52.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 3749, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.03, "fa": 0.0, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "It's not cost control, it's a knee-jerk safety reaction to the hugging face incident. But they swung the pendulum too far to the other side"}, {"id": 50660085, "au": "InsidiousWombat", "dom": 206, "sr": 95, "sc": 3.14, "ep": 3.2, "bs": 0.0, "d": 2, "age": 6.12, "grav": 43.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's very good for consumers. More and more tasks can be done just fine with non frontier open models.\n\nFrontier labs are essentially competing for smaller and smaller part of of the pie.\n\nSure, smarter models unlock some cases that can earn good money, but that might not be enough to be sustainable with open models eating more and more of the use cases"}, {"id": 50659110, "au": "LaurensBER", "dom": 213, "sr": 96, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 2, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 1826, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The challenge is that their lead in the consumer space is being challenged as well given that competitors seem to have models that \"feel\" better.\n\nMy GF employer uses Gemini so she uses it outside work as well and the latest models are actually genuinely good. I had a personal ChatGPT subscription but used Claude at work and I do prefer it for anything technical so I switched my personal subscription as well.\n\nThe ChatGPT models are obvious smart but they're not as enjoyable to work with. if OpenAI cannot tackle reinforcement learning people will still prefer other models both at and outside work."}, {"id": 50659380, "au": "fedupnow", "dom": 2, "sr": 97, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 1, "age": 7.28, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 0.83, "fa": 0.0, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "They raised 1/3rd of their target in last round and Im constantly hearing of people leaving OpenAI for other labs in the last few weeks.\n\nId say it's not looking good."}, {"id": 50662343, "au": "Grombobulous", "dom": 272, "sr": 98, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 1, "age": 0.47, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.316, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem with OpenAI is Sam Altman. He’s a moron, he’s a compulsive liar, and he’s a liability to his company perhaps even worse than Jensen Huang.\n\nOpenAI is doing poorly because their own CEO doesn’t understand the best way to maximize the value of their core product."}, {"id": 50660380, "au": "jurgenburgen", "dom": 25, "sr": 99, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 3, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 637, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.821, "fa": 0.0, "gp": 0.777, "bl": 0.0, "ds": 0.0, "txt": "All the discussions on models remind me of coffee aficionados comparing tasting notes. I’m not ruining the coffee by adding milk, the models are the same. I’ve used both and I really can’t tell the difference."}, {"id": 50661916, "au": "TuxSH", "dom": 263, "sr": 100, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 3, "age": 1.74, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 350, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 0.888, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Local models are a bit of a meme.\n\nHowever, \"your\" company buying and operating a few B200s to run DS 4.1 Flash 1017 for their own employees is a realistic scenario."}, {"id": 50662335, "au": "malloryerik", "dom": 153, "sr": 101, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 0, "age": 0.49, "grav": 5.2, "surf": 11.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2272, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Oddly I've been using Sol 6.2 high for Elixir for the past few hours and it's been wonderful. And I mean in \"chat\" mode, not even Codex. Of course the all-you-can-eat chat mode is going away soon, but still. Not to say it's better than Claude or Neon btw."}, {"id": 50660076, "au": "kobalsky", "dom": 204, "sr": 102, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 1, "age": 6.12, "grav": 43.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1873, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "there are third parties, who don't have the luxury of burning money, selling access to open weights models at affordable prices\n\nthey may not be as good as frontier models but not that bad either, and harnesses will only continue improving."}, {"id": 50659329, "au": "jcrben", "dom": 171, "sr": 103, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 0, "age": 7.35, "grav": 55.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 571, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.911, "fa": 0.0, "gp": 0.586, "bl": 0.0, "ds": 0.0, "txt": "One thing that's a little strange about this article is that it doesn't mention effort at all\n\nYou can always turn the dial up with effort to increase the reasoning right? Maybe they're just giving people more control over the reasoning"}, {"id": 50660647, "au": "CoolestBeans", "dom": 93, "sr": 104, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 1, "age": 5.07, "grav": 33.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1036, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "Good analogy. The main friction point in my opinion is that agents can generate until the cows come home and you could end up doing more work pruning than you ever did gardening. Also a lot of devs tend to enjoy growing way more than pruning. Making their job weed pullers is gonna cause a lot of people to burn out. Sorry for torturing the analogy even more."}, {"id": 50660589, "au": "danpalmer", "dom": 58, "sr": 105, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 8, "age": 5.17, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 25003, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.238, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is what Anthropic was too. Then they needed more data so they built an API to get more data. Then they needed more funding so they put more time into the product to generate revenue to help generate more funding. Then they maxed out the private markets so needed more funding via the public markets.\n\nHow is SSI different, rather than just being earlier on in that process?"}, {"id": 50659455, "au": "Havoc", "dom": 276, "sr": 106, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 0, "age": 7.2, "grav": 54.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 27478, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.87, "fa": 0.22, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Not just OAI. The recent GLM/ZAI model appears to have come with a punchy reduction in concurrency limits"}, {"id": 50661892, "au": "fedupnow", "dom": 56, "sr": 107, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 8, "age": 1.81, "grav": 11.1, "surf": 3.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "Personally I dont want an Israel based company being the entity in control of \"super intelligence\".\n\nAnd I do not mean this in an antisemitic way!!!!! I really like Ilya, he seems genuinely in it for mission, not for money, I just do not trust that government!!!"}, {"id": 50661842, "au": "latentsea", "dom": 128, "sr": 108, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 4, "age": 1.97, "grav": 12.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 35, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 0.706, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">I see the same with both model families, I've honestly come to believe that current commercially available models can't produce \"decent\" code unless you load your codebase to the gills with static analysis tooling and checks.\n\nThis is just sort of the way you're supposed to do it. At least, that has been what works. If they train the models to be good at doing that, then the models can constrain their own outputs to what make sense using that as a strategy. Might seem hacky, but... it does work, so it's a viable strategy."}, {"id": 50660742, "au": "unbrice", "dom": 121, "sr": 109, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 2, "age": 4.9, "grav": 32.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 71, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Notice that most confidence intervals overlap. Glancing at the docs I strongly suspect problems beyond sample size. Eg properly handling differences in CoT obfuscation or context lengths requires som sion. AI tokens can’t be subsidized forever. Particularly when you still need a SWE to get anything complex to actually work.\n\nWould be encouraging if Anthropic follows suit."}, {"id": 50659388, "au": "verti", "dom": 182, "sr": 129, "sc": 2.24, "ep": 7.81, "bs": 5.57, "d": 1, "age": 7.28, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.759, "fa": 0.96, "gp": 0.646, "bl": 2.1, "ds": 0.0, "txt": "as employee of enterprise on api costs i will tell you that the cost per task on aa is pure bullshit. sure it is cheaper than anthropic, but \"the task\" is defined so dubiously that it doesn't really reflect real world dev usage.\n\nif i decide to use sol instead of ds 4.1 for my daily tasks i end up with ~8x higher daily cost, whereas aa claims it should be at most 2x higher. the closest thing to real costs was taking the average token read/write ratios and then multiplying that by api rates."}, {"id": 50660553, "au": "danpalmer", "dom": 42, "sr": 130, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 5, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 25003, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A harness is a lot more than a system prompt.\n\nIt's the agent calling loops, tool call interface, choices around when compaction happens, shims to paper over incorrect calls, and then a load of evals to know that it works/doesn't. The evals are probably the hardest bit – building a system to know whether your change improves or harms the performance is hard.\n\nThen you also need a great UI. Not in terms of performance or reliability (those things matter), but in terms of trust. You've got to build a UI that convinces users that the agent is trustworthy – exposing the right amount of info, not too much, balancing the needs of experienced software engineers against vibe coders who have no clue what's going on. That's not just engineering/UI work, it's figuring out what is going to actually change peoples understanding and trust, and that requires a lot of trial and error.\n\nIs there special sauce in a harness? I think the only true special sauce is the evals, without those you're literally just guessing. But even if there's no special sauce, it's a LOT more than a prompt."}, {"id": 50659920, "au": "kragen", "dom": 277, "sr": 131, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 1, "age": 6.45, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 25, "qw": 0, "k": 39394, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": ["https://docs.z.ai/devpack/usage-policy"], "ig": 0.929, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What are concurrency limits?  What's a punchy reduction?  Are we talking about GLM as hosted by z.ai, rather than locally or by other inference providers, and https://docs.z.ai/devpack/usage-policy?"}, {"id": 50659193, "au": "jfrbfbreudh", "dom": 257, "sr": 132, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 0, "age": 7.53, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 444, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.28, "fa": 0.34, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "They just tried to raise $30B and ended up with only half of that, so perhaps not too surprising."}, {"id": 50661157, "au": "syshyk", "dom": 101, "sr": 133, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 1, "age": 3.84, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
