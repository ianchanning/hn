: "code_repository", "count": 2}, {"category": "investigative_or_tech_press", "count": 2}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["cost", "control", "chart", "openai", "reasoning", "mode", "tokens", "sol", "output", "astra", "tuned", "gpt", "per", "compared", "gpt-6", "task", "battle", "data"], "largest_root": {"root_id": 50659214, "author": "stillpointlab", "slots": 110, "start_dom": 1, "end_dom": 110, "share_pct": 36.5, "top_dom1_age": 7.5, "top_dom1_author": "stillpointlab"}, "buried_cutoff": 90, "rescue_top_k": 60, "ablations": [], "tournament": [], "comments": [{"id": 50659674, "au": "seizethecheese", "dom": 120, "sr": 1, "sc": 16.64, "ep": 16.64, "bs": 0.0, "d": 1, "age": 6.85, "grav": 50.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 99, "qw": 24, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://github.com/bottomless/agent-duel", "https://agentduel.com/leaderboard\u0023pareto"], "ig": 1.783, "fa": 3.73, "gp": 1.254, "bl": 0.0, "ds": 0.0, "txt": "Yes, it seems like it. Another commenter here pointed out that enterprise customers pay attention to the Artificial Analysis pareto frontier, and GPT-6.2 models are dominating it. I checked, and here's the data for what range is dominated by what model:\n\n  Gemini 4 Neon (xhigh)      66.0%\n  GPT-6.2 Sol (xhigh)        17.9%\n  GPT-6.2 Astra (max)         8.8%\n  Muse Ember (max)            3.4%\n  Gemini 4 Hydrogen (xhigh)   3.3%\n\n\n> If those benchmarks are good enough proxies for the work you're doing and you're paying API rates, its a compelling place to be\n\nThat's a big \"if\"! The blog post is based on votes from a battle system built on OpenCode (https://github.com/bottomless/agent-duel), basically designed to be a better proxy than benchmarks. On that leaderboard (https://agentduel.com/leaderboard\u0023pareto), OpenAI dominates 0% of the pareto curve:\n\n  Claude Fable 5.2    65.5%\n  Claude Opus 5.5     18.5%\n  Gemini Carbon       7.6%\n  Qwen 4 Max          5.2%\n  DeepSeek V4.1 Flash 2.7%"}, {"id": 50661314, "au": "pdfernhout", "dom": 97, "sr": 2, "sc": 14.68, "ep": 14.68, "bs": 0.0, "d": 1, "age": 3.41, "grav": 20.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 363, "qw": 0, "k": 750, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": ["https://www.infoq.com/presentations/Simple-Made-Easy/", "https://web.archive.org/web/20240314160745/http://www.t0.or.at/delanda/meshwork.htm"], "ig": 1.946, "fa": 2.97, "gp": 1.13, "bl": 0.0, "ds": 0.0, "txt": "This perhaps won't be a popular opinion on Hacker News, but for decades I've been increasingly convinced that one of the main issues in the computing landscape is that we already have 100X more code and applications and even programmers than we need. Many of these programmers with much of this code are mainly just making needless work for each other. For example, how many accounting systems do we really need as a global society? How many email clients?\n\nWhat we really need IMHO is fewer applications but ones of higher quality and greater flexibility and greater simplicity, based around a few flexible, extensible, widely-agreed-on standards, with all of it being free and open source and unencumbered by software patents.\n\nRelated: \"Simple Made Easy\":\nhttps://www.infoq.com/presentations/Simple-Made-Easy/\n\n(Granted games might be a special category since part of their appeal is novelty, but even there they could use common libraries and data standards.)\n\nAI coding just increases this problem massively (which is in accord with an aspect of your software gardening analogy and pruning weeds).\n\nTo be clear, I think everyone who wants to should learn to program should as part of a good education and personal self-development. It's just that we need, say, less widely-used monstrosities like, say, PHP (even if PHP got ease-of-hello-world right and got web-server-integration-out-of-the-box"}, {"id": 50660497, "au": "0o777", "dom": 259, "sr": 3, "sc": 10.72, "ep": 10.72, "bs": 0.0, "d": 0, "age": 5.34, "grav": 36.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 45, "qw": 0, "k": 51, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://gdpx.semianalysis.com/?domain=chip-design,biology,finance,legal,quant-trading,hardware-design,materials-science"], "ig": 1.557, "fa": 2.08, "gp": 0.785, "bl": 0.0, "ds": 0.0, "txt": "They verifiably improved GPT-6.2 Astra for all knowledge work except web development and the universal popular verdict is that 6.2 is a disappointment.\n\nIt is crazy how a small handful webdevs on twitter are the public's judges and evaluators of one of the most important technologies ever created.\n\nhttps://gdpx.semianalysis.com/?domain=chip-design,biology,fi..."}, {"id": 50659231, "au": "seizethecheese", "dom": 178, "sr": 4, "sc": 10.68, "ep": 10.68, "bs": 0.0, "d": 1, "age": 7.5, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 95, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://agentduel.com/leaderboard\u0023pareto"], "ig": 1.751, "fa": 1.85, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "Yes, that would make the data in the blog post make sense. Perhaps to win in enterprise they benchmark + cost tuned the 6.2 series.\n\nEnterprises probably should be paying attention to real world cost per task. For what it's worth, the blog post comes from a battle system built on OpenCode, which should get close to the ideal metric. There's actually a Pareto chart for the here: https://agentduel.com/leaderboard\u0023pareto. Claude dominates the top of the chart, followed by Gemini Carbon, Qwen 4 Max then DeepSeek 4.1 Flash.\n\nShare of dollar range:\n\n  Claude Fable 5.2 65.5%\n  Claude Opus 5.5 18.5%\n  Gemini Carbon 7.6%\n  Qwen 4 Max 5.2%\n  DeepSeek V4.1 Flash 1017 2.7%"}, {"id": 50659903, "au": "seizethecheese", "dom": 227, "sr": 5, "sc": 10.23, "ep": 10.23, "bs": 0.0, "d": 3, "age": 6.49, "grav": 47.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.802, "fa": 1.51, "gp": 1.17, "bl": 0.0, "ds": 0.0, "txt": "I'm glad there are differences, otherwise what would be the point!\n\nArtificial Analysis - it's well documented that models behave differently when running benchmark-like questions. For better or for worse, the correlation between our cost and theirs is like 0.30 (I have an unpublished analysis on this.)\n\nI haven't dug into LiveBench, but looking at their Opus 5.5 cost ($6.72) compared to Astra 6.2 ($1.94) doesn't pass the sniff test. (Yes, I know the article says that Astra was cost tuned, but man > 3x multiple doesn't pass the sniff test.)\n\nArena's code methodology is not as similar to Agent Duel as you might think! They actually only run one agent per task, randomizing the agent, rather than running them head to head. Also, they run all agents in cloud containers, whereas ours is run in the user's local environment.\n\nOne difference here might be effort level. Since we're aiming for people to do real work, our models are set closer to their default thinking level (For example, Arena 6.2 in Arena's leaderboard is running on Max)."}, {"id": 50659128, "au": "seizethecheese", "dom": 248, "sr": 6, "sc": 10.23, "ep": 10.23, "bs": 0.0, "d": 1, "age": 7.62, "grav": 58.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 28, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": ["https://github.com/bottomless/agent-duel"], "ig": 0.859, "fa": 2.36, "gp": 1.021, "bl": 0.0, "ds": 0.0, "txt": "It certainly seems like this, since Sol 6.2 outperforms Sol 6.1 at lower cost on benchmarks, but not in real world battles from real people (the data is from here https://github.com/bottomless/agent-duel)."}, {"id": 50661951, "au": "seizethecheese", "dom": 118, "sr": 7, "sc": 9.62, "ep": 9.62, "bs": 0.0, "d": 7, "age": 1.65, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 29, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.576, "fa": 1.37, "gp": 1.388, "bl": 0.0, "ds": 0.0, "txt": "Okay, fine, more than a notch, I'll self regulate this.\n\nIt's definitely not true that self promotion is \"all I do\" over the last 40 days. I asked Astra 6.2 (hah) to categorize all my comments over the last 40 days:\n\n  Not self-promotion:           224 (75.2%)\n  Self-promotion with links:    62  (20.8%)\n  Self-promotion without links: 12  (4.0%)\n\n> Please don't use HN primarily for promotion. It's ok to post your own stuff part of the time, but the primary use of the site should be for curiosity.\n\n*primarily being the operative word here. I'm genuinely using HN as an active user (as I have been for years) and posting when my project has something to add.\n\nKarma might not be a perfect proxy here, but funny enough, the \"self promotion\" comments are more likely to have greater than one point (59% vs 54%).\n\nThis thread might become too long for people to reply. My email is discoverable , I’d like to hear what people think. I love HN."}, {"id": 50659812, "au": "roncesvalles", "dom": 3, "sr": 8, "sc": 9.39, "ep": 9.54, "bs": 0.0, "d": 2, "age": 6.64, "grav": 48.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 3063, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.685, "fa": 1.23, "gp": 1.429, "bl": 0.0, "ds": 0.0, "txt": "They simply lost to the competition. Anthropic has better models and a better coding harness around it. I was so disappointed with GPT-6 Astra when it first came out in September, I asked for a refund on the $20 OpenAI subscription. Opus 5.5 a couple of weeks later was the final nail for OpenAI.\n\nThis month I finally upgraded to Claude's $100 plan after months of using the $20 plan because I'm just so happy with Fable 5.2 and want to keep using it. Meanwhile I keep re-evaluating newer GPT versions and they're still just... bad. The benchmarks show that GPT and Claude models are neck to neck but I don't buy it. I genuinely think there's something like Dieselgate going on with the benchmaxxing."}, {"id": 50662412, "au": "trollbridge", "dom": 7, "sr": 9, "sc": 8.99, "ep": 9.28, "bs": 0.0, "d": 3, "age": 0.28, "grav": 4.4, "surf": 10.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 5522, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.801, "fa": 1.51, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "OAI has a few things going for it over A\\:\n\n1. OpenAI has far more brand recognition (through ChatGPT) than Claude does. Most people who want to go tinker with AI are going to start with ChatGPT; likewise, that'll be someone's first $20 subscription.\n\n2. OpenAI's models are not nearly as bad as Anthropic's about bogus refusals, bogus guardrails, and so on.\n\n3. A lot of people don't really need the absolutely best model (hence why people are paying $20 a month to Anthropic instead of $100 or $200). OpenAI fills this niche well.\n\n4. OpenAI's tooling for everything other than the model itself is generally better. Codex/ChatGPT Desktop is simply a more complete app. The same goes for their implementation of Dots. Anthropic's harnesses are simply not great.\n\n5. OpenAI doesn't lock people into only using their official harness, whereas Anthropic threatens to ban you if you want to use something other than Claude.\n\n6. I can use OpenAI for evaluating cybersecurity issues with my software, network setup, etc. - Claude will simply hard refuse.\n\nFor what it's worth, I use side by side every day, all day."}, {"id": 50659148, "au": "preommr", "dom": 216, "sr": 10, "sc": 8.55, "ep": 8.55, "bs": 0.0, "d": 2, "age": 7.59, "grav": 58.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 7, "k": 5068, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.641, "fa": 1.04, "gp": 1.19, "bl": 0.0, "ds": 0.0, "txt": "> OpenAI's business is heavily skewed towards consumer\n\nYea, that's the problem: \"skewed\".\n\nNot actually for, but leaning towards. Their models were too smart in comparison to earlier gemini flash models that's so cheap that google can give out tonnes of it for free, or even grok on X.\n\nLike which general consumer is going to pay $500/mo?\n\nFor a while, they seemed like the more \"practical\" option in contrast to anthropic's horrible usage limits and overzealous safety checks. Their models had a really good blend of intelligence and affordability.\n\nAll that shit went out the window in the last few months (really since dev day)."}, {"id": 50660707, "au": "alexpotato", "dom": 157, "sr": 11, "sc": 8.49, "ep": 8.49, "bs": 0.0, "d": 0, "age": 4.97, "grav": 33.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 7608, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.751, "fa": 0.62, "gp": 1.799, "bl": 0.0, "ds": 0.0, "txt": "For those of us who lived through the late 1990s/early 2000s, tokens are starting to feel a lot like long distance cell phone minutes.\n\nThe similarities:\n\n- new technology\n\n- huge demand\n\n- only a few big players/oligopolistic market\n\n- tons of infra needed (cell phone towers/fiber)\n\n- great business model for ~5 years\n\n- then moved to a race to the bottom/flat rate per month"}, {"id": 50660314, "au": "tyushk", "dom": 228, "sr": 12, "sc": 8.2, "ep": 9.41, "bs": 0.85, "d": 4, "age": 5.68, "grav": 39.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 100, "qw": 0, "k": 194, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://arena.ai/leaderboard/code/webdev\u0023:~:text=View%20all-,Pareto%20frontier,-Best%20score%20for"], "ig": 1.841, "fa": 1.24, "gp": 1.07, "bl": 0.32, "ds": 0.0, "txt": "LiveBench: API costs are fairly well-recognized as higher for Anthropic's offerings compared to OpenAI's, ie. Artificial Analysis showing ~2.5x cost per task on Opus 5.5 vs. Astra 6.2. That's the part that doesn't pass my sniff test for your benchmarks.\n\nWhile that first chart wasn't it, Arena also does head-to-heads for web tasks [0], done under a battle system. Their chart similarly disagrees with yours. Outside of being a cloud environment, how does Agent Duel differ?\n\nAssuming s/Arena 6.2/Astra 6.2/, Arena does use multiple thinking levels but the chart doesn't highlight them as well. Mouse around and you'll find Medium..Max for various models.\n\n[0]: https://arena.ai/leaderboard/code/webdev\u0023:~:text=View%20all-..."}, {"id": 50660215, "au": "superfrank", "dom": 145, "sr": 13, "sc": 8.1, "ep": 8.1, "bs": 0.0, "d": 1, "age": 5.87, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 4245, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.599, "fa": 0.68, "gp": 1.655, "bl": 0.0, "ds": 0.0, "txt": "I’ve been a massive fan of OAIs models for 9 or 10 months now. IMO, about a month ago the quality of the models really took a nose dive. This was before the 6.2 release, so 6.1 Sol High was my daily driver and overnight it just went to total shit. I was hoping for 6.2 to be better, but IMO it’s even worse than how 6.1 is now.\n\nI’m anthropomorphizing a bit, but it feels like they’re lazy and only half paying attention.\n\nI’m saying all that mainly because I want to say that Astra and Sol were really good. On par with Anthropic’s and even better at certain things, IMO. They just went to shit and I don’t know why.\n\nLike I said, I’ve been mainly a codex user since January and this week I downgraded my sub from the $100/mo to the $20/mo as I start to transition away and will cancel once I’ve confirmed I get enough usage out of other subscriptions. I’m really loving Google’s new models so that’ll probably be where I end up with something like OpenCode Go to supplement."}, {"id": 50662289, "au": "Grombobulous", "dom": 253, "sr": 14, "sc": 8.0, "ep": 8.0, "bs": 0.0, "d": 1, "age": 0.63, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.835, "fa": 0.96, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "This seems very much like a mental gymnastics to defend your preferred brand. I don’t think any company’s mission is binding. Most company missions seem rather cynical. For example, Amazon’s mission statements around climate and sustainability seem completely hypocritical to their business of getting you to buy as much disposable stuff as possible. Amazon even gives me badges for the number of orders where I’ve done something to “help the environment” even though more badges = more purchases, more consumption.\n\nMy impression is that most subscription plans of different AI vendors offer very similar value propositions. A $100 Claude subscription gives you roughly the same amount of utility as a $100 OpenAI subscription. Am I wrong?\n\nHere’s what you’re ignoring about OpenAI: they’re bleeding B2B market share to Claude and Gemini. That’s why their mission to raise further capital is going to be a lot more grim compared to Anthropic. They need to cut costs because they’ll literally run out of money if they don’t. They don’t have the same light at the end of the tunnel as their competitors."}, {"id": 50660116, "au": "seizethecheese", "dom": 141, "sr": 15, "sc": 7.64, "ep": 10.3, "bs": 2.52, "d": 1, "age": 6.06, "grav": 42.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 75, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": ["https://agentduel.com/leaderboard"], "ig": 1.506, "fa": 1.85, "gp": 1.027, "bl": 0.95, "ds": 0.0, "txt": "This is an area to not lump Astra in with Sol.\n\nI used Jev to label battles from both into coding and non-coding buckets and it looks like Sol is bad at both while Astra is good at coding and bad at non-coding:\n\n  Sol 6.2:\n  coding:     39% (32/83)\n  non-coding  38% (23/61)\n\n  Astra 6.2:\n  coding:     65% (47/72)\n  non-coding  30% (14/47)\n\np-val on diff between the two Astra proportions is p=0.0002\n\nData from: https://agentduel.com/leaderboard\n\nIt looks like Sol is optimized a bit too heavily for chat whereas Astra perhaps isn’t enough."}, {"id": 50661733, "au": "somenameforme", "dom": 4, "sr": 16, "sc": 7.34, "ep": 8.0, "bs": 0.0, "d": 3, "age": 2.32, "grav": 13.9, "surf": 3.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.703, "fa": 0.95, "gp": 0.89, "bl": 0.0, "ds": 0.0, "txt": "I don't think this is reasonable. Everybody has their preferred models and will insist everything else is worse, basically by definition. Not only is OpenAI still preferred by plenty, but they also still have the most recognized brand, by an extremely wide margin. That doesn't mean so much when it's an industry where like 1% of users are generating 80% of revenue, but in more sane times it will be quite important.\n\nThe issue is obviously that Anthropic's IPO results were far below expectations and that's freaking OpenAI out. Anthropic was initially targeting a valuation of $2 trillion. Then that got dramatically pushed down to $1.3-$1.4 trillion. They're currently trading at $1.1 trillion and continuing to fall. The bubble is starting to wobble and OpenAI's probably not going to get to go public before it pops, and are also missing their own private fund raising goals. So them looking to reign in costs is basically a forced play."}, {"id": 50661293, "au": "andai", "dom": 27, "sr": 17, "sc": 7.11, "ep": 7.55, "bs": 0.0, "d": 4, "age": 3.47, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.566, "fa": 0.95, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": "Reminds me of that thing where they put the same $5 wine in expensive bottles and got people talking about subtle notes of oak and whatnot.\n\nWould be interesting to have a setup where models are swapped randomly, to see how much of it is just favoritism and placebo, vs actual suck.\n\nEven funnier if they could release an old model with a new version number and suddenly everyone would be raving about how much better it is. I remember when Fable came out people started giving it more ambitious projects. I remember one that was \"$4000 in tokens and 45 minutes of reasoning!\" and then it turned out DeepSeek can do the same thing in 5 minutes lol\n\nIt's like, the version number (or model size) going up just gives you \"permission\" to try things you thought the AI was too stupid to handle before."}, {"id": 50659500, "au": "johnnyApplePRNG", "dom": 238, "sr": 18, "sc": 7.04, "ep": 7.04, "bs": 0.0, "d": 0, "age": 7.13, "grav": 53.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 1646, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": ["https://x.com/thsottiaux/status/2125784147889393806"], "ig": 1.194, "fa": 0.96, "gp": 1.032, "bl": 0.0, "ds": 0.0, "txt": "Not only has the size of their models dropped, they had a \"billing error\" the other day and they're cutting usage by 40% as a result across the board. [0]\n\nI've noticed my Claude Code usage limits drop precipitously since the IPO as well FWIW.\n\n[0] https://x.com/thsottiaux/status/2125784147889393806"}, {"id": 50659112, "au": "jrflo", "dom": 240, "sr": 19, "sc": 6.48, "ep": 6.62, "bs": 0.0, "d": 0, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.464, "fa": 0.28, "gp": 1.644, "bl": 0.0, "ds": 0.0, "txt": "This is a common pattern over the last few years. Same thing happened with Opus, 4.5 was amazing, and gradually got worse until we hit 5.5. Seems like the labs follow the formula:\n\n1) release amazing model\n\n2) distill it and optimize for inference costs while trying to maintain perf\n\n3) repeat"}, {"id": 50662239, "au": "Grombobulous", "dom": 5, "sr": 20, "sc": 6.42, "ep": 7.3, "bs": 0.0, "d": 4, "age": 0.8, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 66, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://valueaddvc.com/blog/anthropic-market-share-2026-40-percent-enterprise-llm-spend-openai"], "ig": 1.611, "fa": 0.96, "gp": 0.539, "bl": 0.0, "ds": 0.0, "txt": "The problem is that your belief in the OpenAI brand’s strength isn’t reflected in marketshare data. OpenAI is bleeding customers to competitors.\n\nApologies for the slop blog but you can find this data elsewhere as well, this is just the first link that showed it on a chart. Gemini and Anthropic are eating OpenAI’s enterprise marketshare rapidly.\n\nhttps://valueaddvc.com/blog/anthropic-market-share-2026-40-p...\n\nScroll to the section “ How Anthropic's Market Share Changed Since 2023”"}, {"id": 50659549, "au": "seizethecheese", "dom": 183, "sr": 21, "sc": 6.15, "ep": 9.47, "bs": 2.52, "d": 2, "age": 7.05, "grav": 52.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://agentduel.com/leaderboard"], "ig": 1.369, "fa": 1.57, "gp": 1.227, "bl": 0.95, "ds": 0.0, "txt": "Yes, I've come to the same conclusion.\n\nFor what it's worth, the data from the leaderboard that this blog post is built off of (https://agentduel.com/leaderboard) aligns more closely with your 8x cost difference than the 2x difference (which is clearly wrong):\n\nDeepSeek 4.1 Flash - $0.07 per task\nGPT-6.2 Sol -        $0.43\n\nThis is a 6.1x multiple."}, {"id": 50659578, "au": "arecurrence", "dom": 244, "sr": 22, "sc": 6.03, "ep": 6.54, "bs": 0.0, "d": 2, "age": 7.01, "grav": 52.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 817, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.464, "fa": 0.56, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "The culprit is the system prompts.  All of the trackers that state there has been no change in performance also specifically require pinning the system prompt.  They often pin all the way back to the original release that the model came out with regardless of how long it has been since it shipped.\n\nThis makes a lot of sense as increasing complexity and directiveness in system prompts has had a significant impact on model performance."}, {"id": 50658660, "au": "voxgen", "dom": 234, "sr": 23, "sc": 5.62, "ep": 6.5, "bs": 0.0, "d": 0, "age": 8.39, "grav": 67.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 55, "qw": 0, "k": 90, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://codex-resets.com/"], "ig": 1.367, "fa": 0.62, "gp": 1.046, "bl": 0.0, "ds": 0.0, "txt": "They're also dispensing resets dramatically less frequently[1]. One of this week's resets was even limited to just Business plans.\n\nPerhaps this is a test of the mobility of their customer base? They knew they were going to have a bad month after the GPT-6.2 models were panned on launch, but aren't visibly trying to keep customers.\n\n[1] https://codex-resets.com/"}, {"id": 50660567, "au": "martythemaniak", "dom": 271, "sr": 24, "sc": 5.61, "ep": 6.05, "bs": 0.0, "d": 0, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 11235, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 2.057, "fa": 0.0, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "I think all of OpenAI's troubles are ultimately lack of focus. Anthropic has been super focused since at least v3 (arguably v2): coding coding coding. No image generators, no video models, no voice, just coding and very closely related analytical tasks (analysis, data science etc).\n\nOpenAI OTOH, yikes. Images! Ghibli images! TikTok, but AI! Creepy Scarlett Johansson impersonator! Virtual Waifus! Claws! Dots! Coding! A Browser! Shopping! Ads! Jony Ive thingee!\n\nJust imagine the amount of time, effort and compute spent chasing all of the above. Google also competes in everything, but they have one of the world's largest money printers, they can afford it."}, {"id": 50661495, "au": "anakaine", "dom": 45, "sr": 25, "sc": 5.6, "ep": 6.49, "bs": 0.0, "d": 5, "age": 2.97, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1905, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.879, "fa": 0.34, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "Yet we recently have researchers pulling off things like Inkling 2 Mini, which seemingly has a much better memory footprint and tokens/s thanks to some pre-token looping arrangement.\n\nResearchers are not useless, and it is a mix of them and engineers who stand the best chance of calming down the ever increasing compute and memory requirement madness. Research isnt a tiktok reel though, it takes longer than 30 seconds and often doesnt appear with a bang."}, {"id": 50661658, "au": "alexpotato", "dom": 159, "sr": 26, "sc": 5.56, "ep": 5.92, "bs": 0.0, "d": 2, "age": 2.47, "grav": 14.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 7608, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.553, "fa": 0.34, "gp": 0.9, "bl": 0.0, "ds": 0.0, "txt": "I remember being in an econometrics class and the professor mentioned a customer survey about how many movies people would watch a month (this was for on demand movies).\n\nThe numbers seemed great until someone pointed out it was the equivalent of watching movies 18 hours a day.\n\nI'm sure there are people who do that just like there are people who build software factories.\n\nI don't believe that the number of people in the above category is enough to warrant huge usage due to diminishing marginal returns.\n\n(There is also that chart that shows the distribution of Claude usage)"}, {"id": 50659716, "au": "cubefox", "dom": 298, "sr": 27, "sc": 5.27, "ep": 6.37, "bs": 0.0, "d": 0, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://x.com/EpochAIResearch/status/2122762411287748696"], "ig": 1.36, "fa": 0.9, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "GPT-6.x models are so far the only frontier models that use a looped architecture:\n\nhttps://x.com/EpochAIResearch/status/2122762411287748696\n\nSo they do multiple forward passes per token. So the cost per token is higher. So, naturally, they are tuned to reason less (measured in tokens) and to generally return fewer tokens as output."}, {"id": 50659214, "au": "stillpointlab", "dom": 1, "sr": 28, "sc": 5.23, "ep": 6.33, "bs": 0.0, "d": 0, "age": 7.51, "grav": 57.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 1325, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.715, "fa": 0.0, "gp": 1.589, "bl": 0.0, "ds": 0.0, "txt": "Hard to say how concerning this is. I've been thinking about software dev like gardening to try to wrap my head around what this transition to agent-centric dev has meant. In a tortured analogy, agent-centric dev feels like having fertilizer and now all of a sudden my garden is heavily over-grown and my task feels more like pruning since weeds respond to the fertilizer as well as the vegetables.\n\nSo perhaps we are just now locked in cycles of massive unwieldy growth followed by judicious pruning. And we might just see this reflected in models, where there is an explosion in token usage that gives significant gains in performance followed by periods of reclamation."}, {"id": 50662033, "au": "pluralmonad", "dom": 200, "sr": 29, "sc": 5.22, "ep": 6.02, "bs": 0.0, "d": 5, "age": 1.4, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 502, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 2.039, "fa": 0.0, "gp": 0.85, "bl": 0.0, "ds": 0.0, "txt": "I give it tools that allow it to explore my library by various metadata. I've developed a panel of choices that I present it to help the smaller model interpret my requests into correct actions. Things like delineating an immediate request (\"play Spanish Pipedream next\") from an update to the existing direction (\"add some weezer into the current mix at one part weezer to 5 parts existing mix\"). I generally use STT to make requests. The DJ has complete control over the now playing queue.\n\nEdit: the main feature I use is \"smart queue\" that continuously reups the up next queue based on the current direction."}, {"id": 50660711, "au": "dudeism_est_03", "dom": 147, "sr": 30, "sc": 5.19, "ep": 5.93, "bs": 0.0, "d": 2, "age": 4.96, "grav": 32.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 224, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.67, "fa": 0.34, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "I totally agree. Working with 6.2 was very painful. It wrote really bad code and missed loads of details during a modest python package rewrite. It was def. lazy, but to me it almost looked like it was designed to shut down any long running sessions.\n\nI am working on a couple of more complex apps right now and asked two agents to work through an entire list and both kept stopping after 15 minutes or so to tell me that they did a but haven’t done b, c, d etc. Very annoying!\n\nI tried various different prompts without success. Then I thought it might be 6.2 and I went back to 6.1  and things improved again. The long sessions worked straight away. I re-started migration work and it was a lot better. It somehow doesn’t feel as good as it would have maybe been a few weeks ago… but that’s more of a feeling…\n\nI pretty much have all the agents mentioned here on xhigh or ultra.\n\nBut I agree - I will try Claude and maybe get it to do the same job and see how well it can handle it.\n\nUntil now I was pretty happy with codex. Most of my llm work so far has been python and c++.\n\nAlso, I think that a lot of the varying experiences on here are workload based and it would be nice if people mentioned what type of work it is that llm xyz is better at in their experience."}, {"id": 50661871, "au": "gnabgib", "dom": 117, "sr": 31, "sc": 4.96, "ep": 5.77, "bs": 0.0, "d": 6, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 29, "k": 26203, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": ["https://news.ycombinator.com/newsguidelines.html"], "ig": 0.736, "fa": 1.04, "gp": 0.74, "bl": 0.0, "ds": 0.0, "txt": "More than a notch would be idea, don't take votes as a positive indicator - HN specifically asks you not to self promote, which in the last 40 days seems to be all you do.\n\n> Please don't use HN primarily for promotion. It's ok to post your own stuff part of the time, but the primary use of the site should be for curiosity.\n\nhttps://news.ycombinator.com/newsguidelines.html"}, {"id": 50660970, "au": "leafingensemble", "dom": 160, "sr": 32, "sc": 4.78, "ep": 5.95, "bs": 0.0, "d": 1, "age": 4.37, "grav": 28.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": ["https://news.ycombinator.com/item?id=50660273"], "ig": 1.377, "fa": 0.62, "gp": 0.653, "bl": 0.0, "ds": 0.0, "txt": "Many tokens are from different models to the model advertised, different quantizations or 3rd party subprocessors.\n\n'USA' based inference providers, several of which are on Openrouter (Novita, AtlasCloud) have been routing tokens to API providers based in China and Singapore.\n\nhttps://news.ycombinator.com/item?id=50660273"}, {"id": 50659774, "au": "ACCount39", "dom": 67, "sr": 33, "sc": 4.67, "ep": 5.11, "bs": 0.0, "d": 5, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 0.779, "bl": 0.0, "ds": 0.0, "txt": "OpenAI bought a device company in a world that already has PCs, laptops and smartphones, owned by just about anyone worth caring about.\n\nThey made plenty of questionable decisions, but \"let's make a device\" is the most baffling one.\n\nWhat are they even trying to do that there's no offering on the device market for? Some sort of \"wearable AI pin\"? Something like what Rabbit tried? What does that give over, you know, a well tuned app on an off the shelf smartphone that your user already happens to own?\n\nI'd get it if they were caught poaching from Figure and Tesla and building AI robots. That's a niche they could, potentially, break into with their bleeding edge AI tech. But a normal consumer electronics device? Why?"}, {"id": 50660467, "au": "darepublic", "dom": 175, "sr": 34, "sc": 4.65, "ep": 5.75, "bs": 0.0, "d": 0, "age": 5.4, "grav": 36.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 2938, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.945, "fa": 0.0, "gp": 0.816, "bl": 0.0, "ds": 0.0, "txt": "sometimes my jaw drops at how stupid gpt astra is.  Other times it works really well.  I feel for CRUD apps, my old bread and butter.  I feel a ton of confidence prompting it for new UI, wired up endpoints and db ORM.  Maybe.. it still lacks some taste in terms of doing things, every once in a while it will pull a boner in terms of doing something inefficiently.  But on the whole it's a highly reliable usecase.\n\nBut in terms of tasks that require.. ostensibly similar reasoning capabilities but are off the beaten path.. i.e. designing agent prompts for automation workflows, etc.  My jaw sometimes drops when I have been neglectful and I see what it has done with my instructions. In terms of just the stupidity.. and constantly injected verbosity, doubt and self talk into the system."}, {"id": 50661331, "au": "rspeele", "dom": 158, "sr": 35, "sc": 4.58, "ep": 6.12, "bs": 0.0, "d": 1, "age": 3.36, "grav": 20.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1530, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.696, "fa": 0.34, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "One difference: a person can maximally use 1440 minutes a day and realistically can only utilize maybe 480 a day at most. But with parallel agent swarms and such, customers can demand infinite tokens.\n\nWhether that parallelization actually pays off on all problem types, I am not so sure. For stuff that's verifiable (like the mathematics proofs) it sure does. For a lot of mushy nonverifiable stuff, once the bottleneck becomes a human looking and liking/disliking, there isn't much point in throwing more tokens at it because you can't go any faster than the quality check. But nevertheless, some customers will try to Gas Town everything."}, {"id": 50660603, "au": "slopinthebag", "dom": 138, "sr": 36, "sc": 4.52, "ep": 5.84, "bs": 0.0, "d": 3, "age": 5.14, "grav": 34.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 1434, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.657, "fa": 0.34, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "this has been happening since astra was released and it affects sol as well now. i think it's a side effect of how it's trained to emit tool calls, it's optimising for conciseness when outputting a 200 line python tool call, and that bleeds into the code that it generates. it's so bad that i had to stop using those models, even though they were effective (sorry i still care about the code) and the code technically works. i think a lot of people simply dont care and even see it as a positive (more concise for the model to understand). it just doesn't care about human readability at all, perhaps it was even explicitly trained to do this, who knows.\n\noh well, neon is my new model of choice and is a breath of fresh air compared to gpt's codeslop and claude's wordslop."}, {"id": 50659277, "au": "Havoc", "dom": 195, "sr": 37, "sc": 4.36, "ep": 4.66, "bs": 0.0, "d": 1, "age": 7.43, "grav": 56.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 27478, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.524, "fa": 0.0, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "It definitely isn't.\n\nHosting a non-terrible model locally can be done with capital outline that is high for a hobby/toy but not unreasonable. So AI coding is absolutely within financial reach of many.\n\nIt's when people insist on using SOTA beasts of models to design their blog where things get sketchy on economics.\n\nAI is here to stay...routine use of SOTA as default...not so sure about that"}, {"id": 50659939, "au": "seizethecheese", "dom": 180, "sr": 38, "sc": 4.27, "ep": 8.18, "bs": 2.52, "d": 3, "age": 6.41, "grav": 46.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.643, "fa": 0.95, "gp": 1.114, "bl": 0.95, "ds": 0.0, "txt": "Man, this is a pet peeve of mine and I'm guilty of this myself. Yes, accounting for uncertainty bars:\n\nAverage share of the dollar range across 1,000 resamples\n\n  Claude Opus 5.5           34.3%\n  Claude Fable 5.2          32.2%\n  Gemini Carbon             18.7%\n  DeepSeek V4.1 Flash 1017   6.6%\n  Qwen 4 Max                 3.9%\n  Kimi K3.1 Pro              2.4%\n\nGPT 6.2 series still doesn't make it (I cut off the long tail, I think Astra was under 1%)."}, {"id": 50660566, "au": "BikiniPrince", "dom": 220, "sr": 39, "sc": 4.27, "ep": 5.15, "bs": 0.0, "d": 0, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.317, "fa": 0.34, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "OpenAI sent a letter stating they had screwed up and usage would be about 20% more going forward.\n\nI already noticed had screwed up and I burned that candle day and night. They even gave me a reset token.\n\nThese numbers are suspicious at the moment."}, {"id": 50659553, "au": "tyushk", "dom": 226, "sr": 40, "sc": 3.98, "ep": 5.37, "bs": 0.0, "d": 2, "age": 7.04, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 194, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://artificialanalysis.ai/evaluations/artificial-analysis-intelligence-index\u0023intelligence-index-vs-cost-per-task-chart", "https://arena.ai/leaderboard/agent/code\u0023:~:text=View%20all-,Pareto%20frontier,-Best%20index%20for", "https://livebench.ai/\u0023/:~:text=02-,Insights,-A%20few%20analytical"], "ig": 1.21, "fa": 0.62, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "As the creator of the app used for the data, do you have any insights as to why your cost per task results run counter to ie. Artificial Analysis's [0], Arena's  (which is incredibly similar to the methodology described in your's) [1], or LiveBench's [2]?\n\n[0]: https://artificialanalysis.ai/evaluations/artificial-analysi...\n\n[1]: https://arena.ai/leaderboard/agent/code\u0023:~:text=View%20all-,...\n\n[2]: https://livebench.ai/\u0023/:~:text=02-,Insights,-A%20few%20analy..."}, {"id": 50661518, "au": "aleph_minus_one", "dom": 99, "sr": 41, "sc": 3.91, "ep": 5.45, "bs": 0.0, "d": 2, "age": 2.9, "grav": 17.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 13, "k": 5091, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.062, "fa": 0.7, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "> For example, how many accounting systems do we really need as a global society?\n\nA lot, since there are\n\n- so many countries with accounting and taxation laws that differ a lot,\n\n- so many industries, which have different requirements on an accounting system, and which are sometimes very regulated by regulatory bodies; this introces a lot of very special requirements for the accounting systems.\n\nSo, this rhetorical question can basically be reduced to: How many laws do we really need as a global society?"}, {"id": 50661516, "au": "keyle", "dom": 270, "sr": 42, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 0, "age": 2.9, "grav": 17.5, "surf": 5.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 17279, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.486, "fa": 0.0, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "Of course they are, they're racing to an IPO and their metrics will be compared against anthropic. So they're going to milk the crap out of people as much and as fast as possible to look better.\n\nI got off the OAI bus early this year, the writing was on the wall; every version for a while, and every pricing structure change for subscribers was clearly a nerf and a discombobulated mess, they're in enshittification mode.\n\nIn AI, even at the frontier, you have no moat. Even if you solve P = NP, you will be a paragraph in wikipedia and that does not give you market shares. The only moat is to have something someone can't have easily. And since we've proven that the tech work, it just needs \"more of it, better\", the moat has completely evaporated."}, {"id": 50659259, "au": "jrflo", "dom": 242, "sr": 43, "sc": 3.88, "ep": 5.42, "bs": 0.0, "d": 2, "age": 7.47, "grav": 57.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.425, "fa": 0.28, "gp": 0.879, "bl": 0.0, "ds": 0.0, "txt": "It is just feels unfortunately. They match or exceed most benchmarks on release, but seem to lose some intangible “spark” unless it’s one of the major upgrades.\n\nMaybe it’s just “getting used to” the new capabilities, but I’m not surprised by this post.\n\nI don’t think the mid-release nerfing is real, but I think the incremental releases are usually just cost optimizations"}, {"id": 50660288, "au": "pluralmonad", "dom": 197, "sr": 44, "sc": 3.85, "ep": 5.39, "bs": 0.0, "d": 3, "age": 5.72, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 502, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.9, "fa": 0.0, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "Not GP, but I will share anyway. GLM 5.3 flash at Q3 has been very good. Not the fastest, but easily handles things like simple site building, updating, and 3d modeling in openscad. I've stretched its context going a few dozen rounds of iterations on a cad model and it worked surprisingly well.\n\nI tried to use it as the intelligence backing an AI music DJ setup, I built for home use, and it was too slow. The MTP Gemma4 model is my current DJ model.\n\nEdit: not for _AI music_ but an AI DJ driving radio of my own collection of human made music."}, {"id": 50659885, "au": "theGeatZhopa", "dom": 243, "sr": 45, "sc": 3.83, "ep": 5.37, "bs": 0.0, "d": 3, "age": 6.54, "grav": 47.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 488, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.891, "fa": 0.0, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "I can second this. I'm usually have the same perception but it's often mid-release and on major releases. Some releases are starting off very good and after a few weeks some changes make them \"dumber\", it's suddenly less reasoning, less remembering - the day before rules where followed, then suddenly not anymore, etc. Between the major versions personally opus 5 was the worst in that terms. Started low and become even lower. Opus 5.5 is very good now, but for how long? Opus 4.6 got better after release and opus 4.7 was dumb again. Opus 4.8 was very good and after three weeks it became worser in my use cases of vibing.\n\nI think they start up with a release, doing a/b tests of the system prompts they have created, take the user feedback questionnaire (always press 1 for bad) and may be success or whatever criteria they internally use, to find the \"best system prompt\" or guards or caching behavior, etc.. and of course, when it's dumber but still working, some work is done, yet, it costs less. Nice side effect."}, {"id": 50659847, "au": "PaulKeeble", "dom": 188, "sr": 46, "sc": 3.79, "ep": 4.89, "bs": 0.0, "d": 0, "age": 6.6, "grav": 48.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.596, "fa": 0.0, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "I think we see the same approach to reducing cost of inference in the Chinese models as well. A lot of the changes they have made to context and MOE models has drastically cut costs and there is a lot of competition in that top 20 space driven by task cost.\n\nWhen models are getting substantially smarter with each iteration you likely don't bother spending research time trying to make running costs lower to either make more profit now or be more price competitive. However if you are loosing on smarts or don't think you can wring much more out some of these changes are relatively cheaper to do with bigger impact."}, {"id": 50660759, "au": "dofm", "dom": 26, "sr": 47, "sc": 3.64, "ep": 5.18, "bs": 0.0, "d": 4, "age": 4.86, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 293, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.805, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "As a pragmatic coffee nerd I think you mean \"wine snobs\" ;-) ;-)\n\nIn all seriousness it's an interesting comparison, because I think in both cases it is easier to spot the big differences once your attention is drawn to what in principle can differ in a consistent way. (Check out Tom Scott's \"I don't like coffee\" video where James Hoffman shows him what can be spotted, and does so in a consistent, pragmatic, unstuffy way)\n\nI think it is true that if you're going to make a filter coffee and put milk in it, you probably want a medium roast Colombian coffee, because as a bean it has a high level of consistency and tolerance to preparation differences, and strongly represents all the flavours that milk tends to enhance.\n\nWith any other bean the differences will go away (because milk evens out bitterness/acidity and the fats and its own flavour can obscure many tasting notes). Might as well have a Colombian, in most cases. Maybe Brazil, but through the  milk, you may find it hard to tell.\n\nSo at some level, once you're behind a really extensive system prompt in OpenCode, say, working on a typescript/react/postgresql project, you are in that \"coffee with milk\" context; at that level you are in the agentic code happy path, interacting with the commonality of LLMs, through a very thick layer that is burying the differences.\n\nWhen you are working with the bare LLM itself with no system "}, {"id": 50660439, "au": "zmmmmm", "dom": 189, "sr": 48, "sc": 3.56, "ep": 4.66, "bs": 0.0, "d": 0, "age": 5.45, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 22255, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.231, "fa": 0.28, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "The whole of the article is proving that less tokens are output.  But less tokens can also be output if the model is just smarter and gets to its conclusion more quickly - per token may even be more expensive if the model is more expensive to run.\n\nNot saying that this thesis is wrong, but it isn't presenting the necessary evidence to support its argument."}, {"id": 50662045, "au": "i_like_apis", "dom": 252, "sr": 49, "sc": 3.53, "ep": 3.89, "bs": 0.0, "d": 0, "age": 1.36, "grav": 8.9, "surf": 6.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 923, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.147, "bl": 0.0, "ds": 0.0, "txt": "You may be ignoring that they are interested in making AI affordable and accessible. It is in their mission. It's almost impossible to have public opinion acknowledge this sort of thing, especially when there are two companies in a seemingly zero-sum competition to be viewed as \"most altruistic\". It's more likely to be spun as some sort of a defect of an \"evil\" or \"failing\" company.\n\nI can barely afford what I want to do with AI, and I do it only by virtue of OpenAI's prices. Their models and api availability are unmatched for me, and I check regularly.\n\nThis is the day when traditionally we count our blessings."}, {"id": 50662378, "au": "rspeele", "dom": 87, "sr": 50, "sc": 3.47, "ep": 5.01, "bs": 0.0, "d": 3, "age": 0.38, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1530, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.696, "fa": 0.0, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "If anything the free tier leads to the average Joe getting this perception \"ChatGPT is the shitty AI you ask about brownie recipes, but real companies use Claude which is Smart and Writes Code\". The regular person outside the HN bubble does not think in terms of Sonnet/Opus/Fable or Luna/Sol/Astra but just Claude and ChatGPT. This perception, in my anecdotal experience, held even during the little windows where OpenAI actually had the superior high-end product."}, {"id": 50661239, "au": "drivebyhooting", "dom": 193, "sr": 51, "sc": 3.29, "ep": 4.39, "bs": 0.0, "d": 0, "age": 3.62, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1150, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.269, "fa": 0.34, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "I started using Neon a lot more. Besides having some “legacy workflows” on Codex I could just switch entirely to Gemini ecosystem.\n\nI should go ahead and ask AI to help me migrate to save $200/month."}, {"id": 50660080, "au": "dwb", "dom": 126, "sr": 52, "sc": 3.24, "ep": 4.78, "bs": 0.0, "d": 2, "age": 6.12, "grav": 43.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1294, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.332, "fa": 0.0, "gp": 1.139, "bl": 0.0, "ds": 0.0, "txt": "It’s a 1.5M line TypeScript and Rust codebase, fairly conceptually dense and complex, but in decent shape otherwise. Both models will happily write 200-line functions, no blank lines or comments, badly named variables, un-factored, horrible to read. They can manage better when told to improve it but I don’t remember code generation being this bad off the bat since pre-Opus 4.5."}, {"id": 50660438, "au": "torginus", "dom": 111, "sr": 53, "sc": 3.22, "ep": 4.61, "bs": 0.0, "d": 0, "age": 5.46, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.533, "fa": 0.0, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "Personally I wouldn't read too deeply into this. Astra 6.2 was a timed release, scheduled to go against the ANT IPO. The model might be undercooked.\n\nThey really look like they went for cost savings, and they probably gave up some performance in exchange, even though they might've improved on their previous Pareto frontier.\n\nThere have been model releases like this, that were less well received for whatever reason, and there was the assorted doom and gloom, and far reaching conclusions were always made.\n\nI'd argue this is a single datapoint."}, {"id": 50659291, "au": "ac29", "dom": 119, "sr": 54, "sc": 3.15, "ep": 4.4, "bs": 0.0, "d": 0, "age": 7.4, "grav": 56.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 7429, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.026, "fa": 0.28, "gp": 0.823, "bl": 0.0, "ds": 0.0, "txt": "The most obvious explanation is that they are tuning to be on the pareto frontier of cost/intelligence on benchmarks. If those benchmarks are good enough proxies for the work you're doing and you're paying API rates, its a compelling place to be"}, {"id": 50661441, "au": "kphorn", "dom": 223, "sr": 55, "sc": 3.14, "ep": 4.24, "bs": 0.0, "d": 0, "age": 3.07, "grav": 18.6, "surf": 3.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 475, "kpp": 10.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.591, "bl": 0.0, "ds": 0.0, "txt": "I’m not sure this is the right take. With all of the discussions of verbosity and LLM slop, a model that is tuned to be more succinct is probably a good thing.\n\nOpenAI HAS TO start thinking about cost control at some point but pointing out quantity of tokens as the only metric doesn’t seem to capture the whole story.  Are capturing the balance with meaningfully less compute? That would be more concurrency leading to fewer servers and token efficiency does help. 6.2 may also be larger models with a net increase in compute demand. We don’t know."}, {"id": 50660034, "au": "superfrank", "dom": 91, "sr": 56, "sc": 3.14, "ep": 4.63, "bs": 0.0, "d": 1, "age": 6.21, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 17, "k": 4245, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.131, "fa": 0.42, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "> So perhaps we are just now locked in cycles of massive unwieldy growth followed by judicious pruning.\n\nMost companies I’ve worked at were already like pre-AI. Build, build, build until things start to be unmanageable or costs start getting out of control and then there’s a big push to simplify and scale back."}, {"id": 50660824, "au": "seizethecheese", "dom": 112, "sr": 57, "sc": 3.14, "ep": 6.88, "bs": 2.52, "d": 1, "age": 4.71, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.63, "fa": 0.68, "gp": 0.769, "bl": 0.95, "ds": 0.0, "txt": "Yes, I think this analysis is correct for Astra, but Sol looks catastrophically bad, at least inside of a coding harness (the data from our is from a battle system built on opencode.\n\nSol 6.2 only won 73 / 213 battles so far. It's 94% likely to be on the bottom four slots in Elo score. Our system includes DeepSeek 4.1 Flash, Mimo v2.6 Flash, Muse Wonder (not Full) and Grok 4.7, so there's no way Sol 6.2 should be in the bottom 4."}, {"id": 50661283, "au": "root_axis", "dom": 33, "sr": 58, "sc": 3.14, "ep": 4.26, "bs": 0.0, "d": 3, "age": 3.49, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 12914, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 0.832, "fa": 0.68, "gp": 0.255, "bl": 0.0, "ds": 0.0, "txt": "Crazy to me that we're like 4 years into LLMs and people are still making confident proclamations about which model is the best, and every single time the replies are full of comments with 100 different varying opinions."}, {"id": 50660038, "au": "bagacrap", "dom": 109, "sr": 59, "sc": 3.14, "ep": 4.93, "bs": 0.85, "d": 4, "age": 6.2, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 4014, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 0.657, "bl": 0.32, "ds": 0.0, "txt": "Do you have an alternative definition for taste?\n\nIn research, taste means knowing what experiment to run based on the results of past experiments. Experiments are large, long running tasks. Ideas spanning multiple experiments are even longer running. Ai can currently only do well on tasks of a few minutes or hours.\n\nIn software, taste is system design: maintainability, extensibility. This is also a long running task. (Months, years, or indefinitely.)"}, {"id": 50660494, "au": "joeyhage", "dom": 154, "sr": 60, "sc": 3.14, "ep": 4.04, "bs": 0.0, "d": 0, "age": 5.35, "grav": 36.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 15, "qw": 0, "k": 163, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": ["https://www.bleepingcomputer.com/news/artificial-intelligence/openai-warns-gpt-62-astra-will-hit-usage-limits-40-percent-faster-because-it-fixed-a-bug/"], "ig": 0.548, "fa": 0.75, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "Even worse: the cheaper cost of those two models was, per OpenAI, a bug with billing: https://www.bleepingcomputer.com/news/artificial-intelligenc..."}, {"id": 50659124, "au": "posnet", "dom": 177, "sr": 61, "sc": 3.14, "ep": 4.03, "bs": 0.0, "d": 0, "age": 7.63, "grav": 58.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1600, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.9, "bl": 0.0, "ds": 0.0, "txt": "enterprises that are on api costs pay close attention to the cost per task pareto on artificialanalysis, where openai currently leads on everything except the extreme end with fable 5.2"}, {"id": 50659780, "au": "operatingthetan", "dom": 214, "sr": 62, "sc": 3.14, "ep": 5.62, "bs": 1.59, "d": 3, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 3278, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.509, "fa": 0.34, "gp": 0.761, "bl": 0.6, "ds": 0.0, "txt": "Yep.  Gemini long term is going to be the consumer's general choice, just like Google search.  Google gives a lot of usage for free, and the $20 a month plan includes all kinds of random stuff like Youtube premium light, storage space, multiple buckets of AI usage etc."}, {"id": 50659323, "au": "inshard", "dom": 106, "sr": 63, "sc": 3.14, "ep": 4.01, "bs": 0.0, "d": 1, "age": 7.36, "grav": 56.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 64, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.597, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "I think agent dev is going to be increasingly like running a company as a visionary CEO. You soon won’t be the one with optimal solutions or the frontier of thinking. That’s bounded rationality, even for the smartest humans. So it would mostly be telling an aligned model to figure out the mechanics, and you setting the vision, possibly taste but I feel that too will fall. And securing resources and real-world legal domain to operate. That’s it."}, {"id": 50659820, "au": "vlovich123", "dom": 294, "sr": 64, "sc": 3.14, "ep": 3.98, "bs": 0.0, "d": 0, "age": 6.63, "grav": 48.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 22, "k": 16820, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.093, "fa": 0.42, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "> In conclusion, Astra and Sol appear to be cost tuned compared to their predecessors, and to a degree that makes them underthinking outliers.\n\nUmmm don’t you want fewer thinking tokens as long as the task is completed properly? That suggests a smarter model that goes down fewer false paths"}, {"id": 50661178, "au": "epihelix", "dom": 28, "sr": 65, "sc": 3.14, "ep": 3.88, "bs": 0.0, "d": 4, "age": 3.78, "grav": 23.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 672, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.582, "fa": 0.0, "gp": 0.11, "bl": 0.0, "ds": 0.0, "txt": "Agreed.  Having now tried Opus 5.5, I haven't (yet) seen a noticeable difference to Sol, for what I do, at least.  I suspect Google's offerings are similarly decent (but haven't tried these).\n\nI have been extremely happy with frontier model performance since the second half of this year, and am more and more convinced that I can switch between OAI, Anthropic and Google without issue.  I'll go wherever the inference is cheapest (and the data protections still acceptable)."}, {"id": 50660039, "au": "tekacs", "dom": 55, "sr": 66, "sc": 3.14, "ep": 3.87, "bs": 0.0, "d": 7, "age": 6.2, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 56, "qw": 0, "k": 4963, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "device_tech", "flbl": "Device & Tech (Openai)", "urls": ["https://ssi.inc"], "ig": 0.561, "fa": 0.62, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Ilya's SSI has been clear from the start that they're squarely focused on SSI, not incremental shipping (literally look at https://ssi.inc [1]), so I'm not sure that this is particularly a dunk. Pretty sure that the same was said to their investors.\n\n[1]: We have started the world’s first straight-shot SSI lab, with one goal and one product: a safe superintelligence."}, {"id": 50661811, "au": "tyushk", "dom": 230, "sr": 67, "sc": 3.14, "ep": 6.38, "bs": 2.54, "d": 6, "age": 2.09, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 27, "k": 194, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.667, "fa": 0.42, "gp": 0.87, "bl": 0.96, "ds": 0.0, "txt": "> resolve the battle on each turn an generate a new battle.\n\nThis needs clarification. Does this mean a future agent gets the reasoning and work of a previous agent which could be a different model?\n\n> isn't that what you'd expect, given Astra is OpenAI's largest model and Opus being Anthropic's second largest?\n\nNo? OpenAI's been marketing heavily on cost efficiency, both through direct cost per [input, cached, output] million tokens and through token efficiency, and even that is two-fold (larger tokens, more efficient reasoning). I'm interested in your measurements as, anecdotally, we've seen some pretty extreme cost savings in dropping from Opus 5.5 to GPT Sol 6.2 for our agent workloads."}, {"id": 50661833, "au": "Pedro_Ribeiro", "dom": 10, "sr": 68, "sc": 3.14, "ep": 3.83, "bs": 0.0, "d": 4, "age": 2.02, "grav": 12.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 164, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.61, "fa": 0.0, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "Astra 6.0 at release was mind blowing, but it got progressively worse. Astra 6.2 is seemingly more competent but the prose is mind-melting. It's not claudism in terms of using loaded expressions but it's very poor sentence structuring and talking about shit it referenced in the middle of its CoT but the user has no knowledge of.\n\nNeon, on the other hand, is very fun to work with even if it's a slow horse.\n\nRight now I'm rocking Neon for architecture / sketching and then having it drive Astra for implementation."}, {"id": 50660206, "au": "yieldcrv", "dom": 201, "sr": 69, "sc": 3.14, "ep": 3.81, "bs": 0.0, "d": 3, "age": 5.89, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "for Apple Silicon use kapitsa + pi + Qwen 3.5 35B\n\nditch omlx and llama.cpp for now, and kapitsa handles all parts of the stack through its CLI\n\nhighly optimized for higher tokens/sec in ways that the one-size-fits-all inference engines are fumbling on"}, {"id": 50661879, "au": "smallerfish", "dom": 185, "sr": 70, "sc": 3.14, "ep": 3.8, "bs": 0.0, "d": 0, "age": 1.85, "grav": 11.3, "surf": 22.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 3877, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.157, "fa": 0.22, "gp": 0.317, "bl": 0.0, "ds": 0.0, "txt": "I think OpenAI agents are a lot less consistent than Claude agents. Some are very good (and when they are, I like them much better than Claude). Some are \"lazy\", \"corner-cutting\", and \"expedient\", and they can make a real mess if left to churn. Maybe it depends on which data center they're in and how much resources they have available to them, or something along those lines? Or maybe they are A/B testing different builds?"}, {"id": 50660897, "au": "seizethecheese", "dom": 122, "sr": 71, "sc": 3.14, "ep": 3.79, "bs": 0.0, "d": 3, "age": 4.53, "grav": 29.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "model_tokens", "flbl": "Model & Tokens (System)", "urls": [], "ig": 1.523, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Yes, most confidence intervals overlap, we need more voters! (Plug: free inference.)\n\nWe can still confidently say that Sol got worse from 6.1 to 6.2, though. And also that both spent less per battle. This is only because the effects are so large. You can see this this in the article.\n\nCoT obfuscation isn't an issue because we don't share reasoning between models, we scrub it (which is itself an issue). Context lengths we compact at ~270k for everyone, so if a model does a lot better with really long contexts it will suffer (though see Fable not suffering).\n\nIf you have a lot of domain knowledge here, I'd love to chat (email is findable). We have to make a lot of trade-off decisions in this regard."}, {"id": 50660859, "au": "aerhardt", "dom": 32, "sr": 72, "sc": 3.14, "ep": 3.76, "bs": 0.0, "d": 3, "age": 4.62, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1405, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.033, "fa": 0.34, "gp": 0.247, "bl": 0.0, "ds": 0.0, "txt": "This has been the narrative for, what, two years now?\n\nI pay the $100 subs for both Anthropic and OpenAI and I lean much more heavily on Astra. I can use it as my daily development driver most weeks and it's better than Opus. For higher-level tasks, I'd say Astra and Fable are more or less on par."}, {"id": 50661739, "au": "enraged_camel", "dom": 24, "sr": 73, "sc": 3.14, "ep": 3.71, "bs": 0.0, "d": 5, "age": 2.29, "grav": 13.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 18573, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cost_per", "flbl": "Cost & Per (Openai)", "urls": [], "ig": 1.528, "fa": 0.0, "gp": 0.08, "bl": 0.0, "ds": 0.0, "txt": "I don’t have a strong opinion on Astra’s intelligence but I can say that it is lazy as hell and also constantly gets lost in the weeds. The other day I tried 6.2 for something I would consider medium difficulty. After working for two hours it started freaking out about “security” and paused and asked me a bunch of strange implementation detail questions. At that point I got fed up and gave the task to Opus which completed it in a little over an hour."}, {"id": 50661460, "au": "anakaine", "dom": 36, "sr": 74, "sc": 3.14, "ep": 3.6, "bs": 0.0, "d": 4, "age": 3.03, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1905, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.505, "fa": 0.0, "gp": 0.042, "bl": 0.0, "ds": 0.0, "txt": "Probably not. It is very common to have a high IPO worth followed by an immediate drop as the hype dies off. A high IPO is yesterday's news and investors no longer have FOMO since they can buy.\n\nThe question I have, is will the slow down be a pop or a fizzle?\n\nHaving OpenAI drop out is not a benefit, as Anthropic does need a large competitor or two who is capable of meeting the same quality of product to drive either quality up, or cost down. Preferably both."}, {"id": 50660521, "au": "IshKebab", "dom": 203, "sr": 75, "sc": 3.14, "ep": 3.6, "bs": 0.0, "d": 2, "age": 5.28, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 7, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 1.021, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  Hosting a non-terrible model locally can be done\n\nI would argue that it can't. Depending on your definition of terrible. For coding Astra and Opus 5.5 were the first models that don't produce slop and none of the open models I've tried come close to those."}, {"id": 50662244, "au": "tty456", "dom": 140, "sr": 76, "sc": 3.14, "ep": 3.57, "bs": 0.0, "d": 2, "age": 0.78, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 223, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.518, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What is your take on either for running tests on its code. I don't mean just unit tests, but end to end integration tests involving multiple services the agent has access to build and run. I've seen claude opus and fable excel with this, including screenshot testing at the end of a full integration stack it had built up. I have not tried it on Codex yet."}, {"id": 50660365, "au": "mycall", "dom": 11, "sr": 77, "sc": 3.14, "ep": 3.56, "bs": 0.0, "d": 4, "age": 5.58, "grav": 38.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1864, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.515, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Since there is no well-defined way to use AI, and the applied work is so vastly different, one person's experience can be wildly different than others.  I for one find GPT-Astra does excellent work with a good plan, although I tend to watch and guide it all the time.  I prefer that style since I often can think of refinements to the work as I wait for next summary output.  Other people often vibe and expect it to just understand."}, {"id": 50660258, "au": "globular-toast", "dom": 151, "sr": 78, "sc": 3.14, "ep": 3.56, "bs": 0.0, "d": 1, "age": 5.78, "grav": 40.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_code", "flbl": "Claude & Code (Experience)", "urls": [], "ig": 1.174, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What specifically is it bad at? I've used both and found Claude significantly worse. But I've been using Sol heavily via a subscription and only use Claude occasionally via tokens. Maybe it's just what we're used to? Or maybe we use them very differently. I'm still the chef in my kitchen. I know what I want and how I want it to be done. No idea what it's like to work with an agent from the front of house, though."}, {"id": 50659691, "au": "dwb", "dom": 124, "sr": 79, "sc": 3.14, "ep": 3.54, "bs": 0.0, "d": 0, "age": 6.81, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1294, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sol_models", "flbl": "Sol & Models (Coding)", "urls": [], "ig": 0.69, "fa": 0.0, "gp": 1.323, "bl": 0.0, "ds": 0.0, "txt": "We’ve recently switched from Claude to Codex at work (cost, of course!), and I was very surprised at how much worse Astra/Sol 6.x have been at coding. Like, really bad."}, {"id": 50659287, "au": "mapontosevenths", "dom": 280, "sr": 80, "sc": 3.14, "ep": 3.54, "bs": 0.0, "d": 0, "age": 7.41, "grav": 56.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71
