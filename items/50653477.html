eful": 1, "useful_pct": 2.5, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 18}, {"category": "github_artifact", "count": 4}, {"category": "code_repository", "count": 3}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["ai", "servers", "mcp", "agents", "google", "workspace", "gmail", "send", "tool", "agent", "create", "terms", "access", "drive", "api", "email", "client", "product"], "largest_root": {"root_id": 50658840, "author": "Schnitz", "slots": 93, "start_dom": 1, "end_dom": 93, "share_pct": 28.4, "top_dom1_age": 23.1, "top_dom1_author": "Schnitz"}, "buried_cutoff": 98, "rescue_top_k": 66, "ablations": [], "tournament": [], "comments": [{"id": 50655919, "au": "g-b-r", "dom": 253, "sr": 1, "sc": 12.92, "ep": 12.92, "bs": 0.0, "d": 5, "age": 27.88, "grav": 452.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 123, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": ["https://web.archive.org/web/20260227170952/https://docs.paperless-ngx.com/usage/\u0023incoming-mail", "https://github.com/paperless-ngx/paperless-ngx/pull/13432"], "ig": 1.671, "fa": 2.57, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I'm not too interested in debating what should be considered a bug, but it doesn't seem to make sense to use IMAP in that way\n\nTheir documentation before the fix stated that \"Paperless keeps track of emails it has processed in order to avoid processing the same mail multiple times. This uses the message UID provided by the mail server, which should be unique for each message.\" (https://web.archive.org/web/20260227170952/https://docs.pape...).\n\nI think it's reasonable for a user to understand processing as in not downloading, either... (especially when it uses IMAP)\n\nNice how they called this \"de-duplicating\" by the way, in https://github.com/paperless-ngx/paperless-ngx/pull/13432 .......\n\nIt's especially bad for a product meant to be hosted on a server, where you're very unlikely to notice huge unexpected traffic (and where you're going to have a fast connection)."}, {"id": 50654510, "au": "g-b-r", "dom": 251, "sr": 2, "sc": 9.91, "ep": 10.06, "bs": 0.0, "d": 3, "age": 30.36, "grav": 522.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 30, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": ["https://github.com/paperless-ngx/paperless-ngx/issues/13175"], "ig": 0.854, "fa": 2.35, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "https://github.com/paperless-ngx/paperless-ngx/issues/13175 , crazy, and they failed to see it as a bug?\n\nI've been leaving almost all my mail as unread for decades, but I've never seen a client redownloading everything at every check..."}, {"id": 50658725, "au": "nickcw", "dom": 300, "sr": 3, "sc": 9.74, "ep": 9.74, "bs": 0.0, "d": 0, "age": 23.26, "grav": 334.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 244, "qw": 0, "k": 4965, "kpp": 8.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.962, "fa": 0.95, "gp": 1.667, "bl": 0.0, "ds": 0.0, "txt": "This change is going to affect rclone.\n\nRclone has its own built in client_id for Google Drive (and Photos) to make it easy for users to use rclone, which I've jumped through many hoops of fire to keep working over the years.\n\nHowever unless we move to the \"Scaled\" pricing model discussed in the article we'll have to accept rate limiting. The Google cost estimator says the \"Scaled\" pricing model would cost us $130k/month which is a little out of budget for an open source project ;-)\n\nThe consequence will be that anyone not using their own client_id with rclone and Google Drive will be rate limited to a very small (most likely unusable) amount) as we are something like 400x over quota.\n\nWe have been advising users to make their own client_ids for years, but it is quite a long and annoying process even if you don't want to provide public access to it and honestly I don't know why it is needed. The client_id identifies rclone, the user is perfectly well identified so why bother making client_ids so annoying to use?\n\nGoogle also haven't figured out what to do about people enrolled in the Advanced Protection Program who can't make their own client_id's. Rclone's built in one is whitelisted for the program.\n\nI suspect a lot of rclone users will be rather unhappy on 1st April 2027 (great cutoff date!) when their transfers to Google Drive stop working at any sane speed."}, {"id": 50654559, "au": "g-b-r", "dom": 254, "sr": 4, "sc": 9.51, "ep": 9.8, "bs": 0.0, "d": 4, "age": 30.26, "grav": 519.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 10, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": ["https://github.com/paperless-ngx/paperless-ngx/releases/tag/v3.1.0"], "ig": 0.322, "fa": 2.63, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "described as \"More efficient mail fetching\" in the changelog xD\n\nhttps://github.com/paperless-ngx/paperless-ngx/releases/tag/..."}, {"id": 50654612, "au": "antihero", "dom": 275, "sr": 5, "sc": 9.09, "ep": 9.53, "bs": 0.0, "d": 1, "age": 30.15, "grav": 516.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 37, "qw": 0, "k": 7523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": ["https://github.com/radiosilence/fastmail-cli"], "ig": 0.911, "fa": 2.08, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": "Thanks for making an official MCP server! I do also maintain an OSS one that you can self-host which does more :) I may need to update the feature matrix if you've added more things to the official one.\n\nhttps://github.com/radiosilence/fastmail-cli"}, {"id": 50654290, "au": "cadamsdotcom", "dom": 310, "sr": 6, "sc": 8.97, "ep": 8.97, "bs": 0.0, "d": 0, "age": 30.85, "grav": 536.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 374, "qw": 0, "k": 3054, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.851, "fa": 0.95, "gp": 1.319, "bl": 0.0, "ds": 0.0, "txt": "If you're fed up with this sort of malarkey, consider Fastmail. It was a much easier migration than I expected.\n\nAll my data came over (131000 emails covering 22ish years, all my labels, and allll the attachments)\n\nSearch works\n\nSpam blocking doesn't catch all the spam and phishing emails I get (maybe only 95%). Luckily it's easy to mark as spam. And the app helps by being fast. No swish animation, no rainbow celebration animations affirming your ability to tap the screen, no achievement unlocked, no kablingynoise. It just marks the email as spam and puts you back at your inbox with one less email.\n\nThey even let you make disposable email addresses that route to your inbox, for hiding your real email address. They have per-app passwords.. all the calendar integrations and exports you'll need, all the mail filtering you'd expect.. all of Gmail's subtlest features you've come to depend on over the years. They're all there, and the app is FAST.\n\nUpdates to Fastmail's iOS app are like 17mb. Did I mention it? the app is fast.\n\nAlso they don't pull dumb crap like putting a sparkle button strategically so you accidentally hit it then urgently wonder what is the quickest way to fuck this god damn \"welcome to our AI!\" off so you can do what you wanted to do. Nope. Just emails, 24/7. Helloooo Gmail? Is there a setting \"hide stupid sparkle button so I don't tap it by mistake\"? Hello? You "}, {"id": 50663895, "au": "jaccola", "dom": 306, "sr": 7, "sc": 8.1, "ep": 8.1, "bs": 0.0, "d": 0, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 73, "qw": 34, "k": 795, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://workspace.google.com/terms/ai-tools/"], "ig": 1.588, "fa": 1.04, "gp": 0.968, "bl": 0.0, "ds": 0.0, "txt": "This seems not fully thought through. E.g. their new terms addendum (https://workspace.google.com/terms/ai-tools/) says\n\n> [You may not] retain any user data obtained via GWS Access Tools or any Google Technical Information after you have disconnected the GWS Access Tool or revoked its access to the GWS Access Point(s);\n\nN.b. this is for any access tool, not just AI.\n\nThis kills a whole bunch of products. No backup product can use the API, I can't connect my email to my accounting package and say 'please keep these receipts / documents safe for me' via the API.\n\n\"Google Technical Information\" is essentially any derived information.\n\nIn essence your emails are no longer yours with this policy."}, {"id": 50655950, "au": "g-b-r", "dom": 258, "sr": 8, "sc": 8.03, "ep": 8.47, "bs": 0.0, "d": 6, "age": 27.84, "grav": 451.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 10, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/paperless-ngx/paperless-ngx/pull/13432/commits"], "ig": 0.121, "fa": 2.35, "gp": 1.03, "bl": 0.0, "ds": 0.0, "txt": "It seems they didn't handcraft it either, by the way (https://github.com/paperless-ngx/paperless-ngx/pull/13432/co...)"}, {"id": 50654443, "au": "alexdobrenko", "dom": 160, "sr": 9, "sc": 7.55, "ep": 7.55, "bs": 0.0, "d": 0, "age": 30.52, "grav": 526.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 53, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": ["https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server"], "ig": 1.507, "fa": 0.62, "gp": 1.549, "bl": 0.0, "ds": 0.0, "txt": "biggest thing that this article misses - the gmail MCP server can create drafts. its 10 tools are create_draft, list_drafts, get_message, get_thread, search_threads, list_labels, and label/unlabel for messages and threads. what's missing is send, reply, forward, editing or deleting a draft, and attachments: https://developers.google.com/workspace/gmail/api/guides/con..."}, {"id": 50664620, "au": "ivanmontillam", "dom": 222, "sr": 10, "sc": 7.46, "ep": 8.31, "bs": 0.85, "d": 3, "age": 9.57, "grav": 82.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 20, "k": 997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": ["https://x.com/eastdakota/status/2126089370893529224"], "ig": 1.699, "fa": 1.04, "gp": 0.93, "bl": 0.32, "ds": 0.0, "txt": "> That's a fair point for personal use, but your Fastmail is going in my Gmail spam folder until Google decides otherwise.\n\nExactly my point, with enough users _over time_ Google will have no choice but to recognize the legitimacy of smaller (albeit growing) players.\n\nAlso, I see the sentiment of challenging Gmail's crown. Yesterday Matthew Prince hinted[0] if CloudFlare should create Cmail.\n\nI know that Grok bot already has the concept of agentic email, and lets you have an auto-assigned email address for that.\n\n--\n\n[0]: https://x.com/eastdakota/status/2126089370893529224"}, {"id": 50660551, "au": "jeffbee", "dom": 23, "sr": 11, "sc": 7.04, "ep": 7.04, "bs": 0.0, "d": 3, "age": 20.2, "grav": 265.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 0, "k": 24593, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://support.google.com/mail/answer/12921167?hl=en", "https://developers.google.com/apps-script/samples/automations/mail-merge"], "ig": 1.531, "fa": 0.62, "gp": 1.159, "bl": 0.0, "ds": 0.0, "txt": "Suddenly enabling SMTP then sending a bunch of mail (that in all likelihood nobody wanted) on a consumer gmail account is a strong signal that your account was taken over by spammers. Google offers this feature to paid, non-gmail accounts, which have completely different abuse rules: https://support.google.com/mail/answer/12921167?hl=en\n\nEven with a consumer account, SMTP is not a good way to do this. Script a mail merge as described in: https://developers.google.com/apps-script/samples/automation..."}, {"id": 50661347, "au": "efitz", "dom": 134, "sr": 12, "sc": 6.95, "ep": 6.95, "bs": 0.0, "d": 5, "age": 18.3, "grav": 225.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 367, "qw": 0, "k": 7216, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 2.017, "fa": 0.0, "gp": 1.521, "bl": 0.0, "ds": 0.0, "txt": "Proton can’t change the fundamental nature of IMAP or SMTP (and still be an “email” service.  Their MTA must be able to read certain fields in the plain text email header; this doesn’t even change with PGP encrypted mail.  Most MTAs use TLS for transport security.  That prevents eavesdropping in transit.  If you want maximal privacy from Proton, then you have the option of using PGP which introduces very high bars to working with others over email- you have to exchange keys out of band in a secure fashion, and then the other party has to either use a PGP-enabled mailer or has to know hotel to encrypt and decrypt.\n\nProton claims that their MTAs store the messages encrypted with a key for which they don’t possess the decryption key.  This doesn’t seem like an unreasonable claim; this is a very well established pattern.\n\nThere is a window of time where for some messages they possess the plaintext of the message body that arrived at the MTA, and they make claims (I haven’t checked recently but was an early adopter and read them thoroughly when I first subscribed) that they don’t use that plaintext for business purposes and that they eliminate it from memory as fast as possible.  Since I am not trying to defend myself against nation states, I’m willing to accept terms of service and implied contract as risk mitigation there.\n\nIf I capture the attention of Law Enforcement, then they "}, {"id": 50660850, "au": "dragonwriter", "dom": 76, "sr": 13, "sc": 6.87, "ep": 7.01, "bs": 0.0, "d": 3, "age": 19.61, "grav": 252.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 25, "k": 128482, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.65, "fa": 0.7, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "> the number of serious real-world security incidents traced to traced to prompt injection and adjacent problems, poor MCP security etc seems to be effectively zero.\n\nFrom what I gather through a dumb RTO implementation that has me sitting in an area surrounded by our orgs security people who seem to do all their work in loud phone calls and Teams meetings, there’s a lot attributed to unexpected actions by AI agents and poor forensics around attributing those reliably to a more specific root cause."}, {"id": 50663664, "au": "Dylan16807", "dom": 266, "sr": 14, "sc": 6.68, "ep": 7.12, "bs": 0.0, "d": 5, "age": 11.81, "grav": 112.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 38990, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.301, "fa": 0.95, "gp": 0.938, "bl": 0.0, "ds": 0.0, "txt": "Bounce a powerpoint back and forth while working on it and that can easily be 200MB in a day for everyone on the team.  If that's a typical day then that stream of data alone is 50-70GB per year and turns into 800GB before you know it.\n\nSo sure it's \"a lot\" but you can get a lot of data with pretty straightforward use of email.  It doesn't take crazy thinking."}, {"id": 50654593, "au": "blfr", "dom": 151, "sr": 15, "sc": 6.67, "ep": 6.67, "bs": 0.0, "d": 0, "age": 30.19, "grav": 517.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 8665, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.437, "fa": 0.28, "gp": 1.718, "bl": 0.0, "ds": 0.0, "txt": "It doesn't seem like this will really affect anyone:\n\n* large providers have their own access, like the verified public apps of yesteryear, and at least the Claude connector does include sending (and some other stuff) above this,\n\n* users of self-hosted setups can easily wrap their sending calls in SMTP or whatever.\n\nThe only real limit is the 5k requests which... just seems fair."}, {"id": 50654416, "au": "michaelanckaert", "dom": 260, "sr": 16, "sc": 6.54, "ep": 6.98, "bs": 0.0, "d": 1, "age": 30.57, "grav": 528.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 811, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.4, "fa": 0.68, "gp": 1.206, "bl": 0.0, "ds": 0.0, "txt": "I'd love to switch over our users to fastmail especially after the way Google is handling this MCP issue. \nThe main hurdle we would have is the limit of 300Gb per user. Yes I know, it's insane but we have users who have over 800Gb in their mailboxes (years worth of correspondence). \nAre there plans to offer higher storage limits?"}, {"id": 50658658, "au": "ivanmontillam", "dom": 179, "sr": 17, "sc": 6.43, "ep": 6.43, "bs": 0.0, "d": 1, "age": 23.37, "grav": 337.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 53, "qw": 0, "k": 997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": ["https://www.merriam-webster.com/dictionary/agent"], "ig": 1.526, "fa": 0.62, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "I attribute it to the \"agent\" name. \"Generally a person, entity, or thing authorized or capable of acting on behalf of another, producing a specific effect, or serving as a means to achieve a result.\"[0]\n\nSo I'm not surprised it's understood as such, even when it's conflated with impersonation (acting on behalf of another by using that other's identity).\n\n--\n\n[0]: https://www.merriam-webster.com/dictionary/agent"}, {"id": 50662599, "au": "thephyber", "dom": 75, "sr": 18, "sc": 6.42, "ep": 6.71, "bs": 0.0, "d": 3, "age": 14.8, "grav": 160.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 2.063, "fa": 0.28, "gp": 0.735, "bl": 0.0, "ds": 0.0, "txt": "This seems naive.\n\nThere have been several companies who admitted that they stopped using website chatbots, for example, because users were extremely creative with using it to hallucinate discounts, to leak internal documents, and generally to use it for free LLM output unrelated to the website. All of these would be considered \"prompt injection\".\n\nYou seem to care about some extremely high severity prompt injection. The Binance hackers used Binance's internal AI tool to describe the topology of the network and create a blueprint of sorts to identify how to extract the funds. It may not qualify as \"prompt injection\" in your mind, but a layer designed to resist malicious use (eg. Prompt injection) should probably have rejected those prompts."}, {"id": 50659534, "au": "msy", "dom": 74, "sr": 19, "sc": 6.25, "ep": 6.69, "bs": 0.0, "d": 2, "age": 22.06, "grav": 306.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 3584, "kpp": 8.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.887, "fa": 0.0, "gp": 1.553, "bl": 0.0, "ds": 0.0, "txt": "This is something I'm increasingly curious about - we're a fair way in to mass corporate adoption of agents and AI (at least in tech) and yet the number of serious real-world security incidents traced to traced to prompt injection and adjacent problems, poor MCP security etc seems to be effectively zero.\n\nThe theoretical risk seems huge, and the 'payoff' the same impacts that drive aggressive and sophisticated ransomware etc campaigns so why is not clear. Maybe people are just keeping quiet but the tenor the security industry doesn't seem to be mapping to the real world in this case and why isn't clear."}, {"id": 50654233, "au": "ritzaco", "dom": 303, "sr": 20, "sc": 6.23, "ep": 6.23, "bs": 0.0, "d": 1, "age": 30.98, "grav": 540.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1657, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.683, "fa": 0.34, "gp": 0.901, "bl": 0.0, "ds": 0.0, "txt": "Hey, owner of Ritza/Techstackups (and I guess Al) here -- I don't like it either, but Al's stuff is now more often on front page HN than mine ever was.\n\nMy current take is that AI is actually really good at 'round-up' style content. It can read through 100 articles, find the most interesting excerpts and tie it together into an article I want to read (yes, I read them before submitting them)\n\nIt still is quite bad at other forms of content, and the cliches annoy me, but I love how quickly it can find me relevant information and put it in one place."}, {"id": 50654225, "au": "perdy", "dom": 94, "sr": 21, "sc": 6.2, "ep": 6.2, "bs": 0.0, "d": 0, "age": 30.99, "grav": 541.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "They are concerned about \"human confirmation\" in their request path, but MCP already has a primitive for exactly this: elicitation lets a server pause a tool call and ask the user to confirm before it proceeds. As a send message tool could be gated behind an elicitation, so making it partner-only seems more like a business decision than a safety concern."}, {"id": 50656512, "au": "spawrks", "dom": 219, "sr": 22, "sc": 6.07, "ep": 6.43, "bs": 0.0, "d": 0, "age": 26.85, "grav": 425.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 11, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.865, "fa": 0.0, "gp": 1.415, "bl": 0.0, "ds": 0.0, "txt": "Serious question for those that have poked here before.  What do we do about the email mafia? I don't know a good answer.  On one side the email monopoly of several providers has offered us protections from unsolicited spam for over a decade, on the other hand the new world of agents sending email is being curbed and limits innovation.  How are we supposed to revisit this problem this time wisely?  We need any new upstart to have an agent send email  of interest from a non Gmail domain and actually arrive in your inbox and have you read it if it matches your interests.  At the same time Mr Volume I'm going to blast everyone about product or service X and I'll just have my army of agents harass everyone needs to be curbed enthusiastically.  I'm afraid existing infra and Baynesian techniques won't work this time around.  We need a novel approach that frankly the existing providers aren't incentivized to design."}, {"id": 50654055, "au": "waseems", "dom": 309, "sr": 23, "sc": 5.71, "ep": 5.93, "bs": 0.0, "d": 0, "age": 31.39, "grav": 552.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.812, "fa": 0.0, "gp": 1.153, "bl": 0.0, "ds": 0.0, "txt": "This pattern of getting trapped in walled gardens owned by big tech is becoming a huge PITA. I have been building (shameless plug incoming) www.inbox2.com which gives me local MCP access with asynchronous email/messaging providers (such as google) behind it. The idea is to move the point of who gets to decided what i can and cannot do with my own data in my own hands since all data is pulled locally first.\n\nAdd a local LLM aas well and you have just broken the wall…"}, {"id": 50654115, "au": "Ungh", "dom": 127, "sr": 24, "sc": 5.63, "ep": 6.0, "bs": 0.0, "d": 1, "age": 31.28, "grav": 549.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 252, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.766, "fa": 0.34, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "For both personal and business cases, I spent the last 2-3 years moving everything as offline as possible.\n\nSo I'm just using a local IMAP provider (Mythic Beasts in UK). Thunderbird as the mail client. All files are local and LibreOffice Calc/Writer. If I need to share something it's a PDF only. If I need to take something with me, I take my laptop.\n\nHaven't had any issues collaborating with anyone and it's secure, stable and private.\n\nI use imap-backup to archive the mailboxes offline as a backup with the file backups."}, {"id": 50659171, "au": "htrp", "dom": 314, "sr": 25, "sc": 5.59, "ep": 5.81, "bs": 0.0, "d": 0, "age": 22.53, "grav": 317.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 5, "k": 5757, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.536, "fa": 0.42, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "Shameless naked cash grab....\n\n> Apr 1, 2027   —  Billing & Standard Quota Enforcement\nWorkspace begins enforcing Standard Tier limits across all existing projects, and Scaled Tier billing begins for projects opting into higher limits.\n\nYour agents will be tolled to access the same features that you would get for free normally."}, {"id": 50654962, "au": "nekusar", "dom": 241, "sr": 26, "sc": 5.52, "ep": 5.96, "bs": 0.0, "d": 0, "age": 29.52, "grav": 498.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.847, "fa": 0.0, "gp": 1.117, "bl": 0.0, "ds": 0.0, "txt": "Yeah this is a rock and hard place.\n\nI want my agent/LLM to be able to read and send emails to domains I approve of. But email services don't allow delegated access like this.\n\nSo it's roundcube and local email time.\n\nBut self-hosting email then puts you in SPF/DKIM/DMARC hell and wheverver LookOut and Gmail decide to silently delete your incoming emails.\n\nHow I've been using agents is by creating a 'llmuser' account and giving appropriate access to that account. That includes on my router and other places on my network. I've still yet to figure out how to delegate appropriate access to limit badness for logged in webservices."}, {"id": 50659301, "au": "shepherdjerred", "dom": 96, "sr": 27, "sc": 5.45, "ep": 5.82, "bs": 0.0, "d": 2, "age": 22.36, "grav": 313.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 48, "qw": 0, "k": 5764, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": ["https://code.claude.com/docs/en/mcp\u0023require-approval-for-a-specific-tool"], "ig": 1.392, "fa": 0.62, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": "Each harness implements it differently. The elicitation can say \"a human must approve this even in auto/bypass\", but of course it is up to the harness to respect this.\n\ne.g. https://code.claude.com/docs/en/mcp\u0023require-approval-for-a-s...\n\nAutomated abuse can/will always happen in some other forms: direct API calls, an agent or human in-browser, etc."}, {"id": 50659736, "au": "efitz", "dom": 130, "sr": 28, "sc": 5.12, "ep": 5.85, "bs": 0.0, "d": 3, "age": 21.73, "grav": 298.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 7216, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.58, "fa": 0.28, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "I’d like to see your evidence that “the only one from reading your email is yourself”.\n\nI have fallen out of love with Proton the company, but ProtonMail does seem to fulfill its promise of encryption of incoming email at the MTA and storing only the cipher text.  And their jurisdiction means that would be snoops in government agencies have to get cross-international-boundary data warrants (if you’re not Swiss).  This seems to me like a very reasonable trade between privacy and ability of government to investigate crimes.\n\nThey have well integrated PGP support; it’s not their fault that no one uses it.\n\nIf you turn on any of their indexing stuff then yeah, all bets are off.\n\nHate on their business practices, sure, but if you’re going to attack their tech stack then back it up with facts and explain how anyone could do it better."}, {"id": 50658589, "au": "ivanmontillam", "dom": 220, "sr": 29, "sc": 5.08, "ep": 5.82, "bs": 0.0, "d": 1, "age": 23.49, "grav": 340.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.754, "fa": 0.34, "gp": 0.501, "bl": 0.0, "ds": 0.0, "txt": "To me, the answer is pretty clear: Vote with your wallet.\n\nStop using free email services like Gmail and Outlook, migrate to smaller, paid ones like Fastmail or whatever fancies your heart. These have a legit change to turn the ship around over time, if we really committed to use/pay for them.\n\nBeen a happy Fastmail customer since 4 years ago or so.\n\nSame with the browser wars (I use Firefox, the only true independent engine, besides Ladybird and Safari)."}, {"id": 50654452, "au": "skeledrew", "dom": 152, "sr": 30, "sc": 5.07, "ep": 5.51, "bs": 0.0, "d": 0, "age": 30.5, "grav": 526.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Well... just have a custom GMail app that can be used by agents. That's pretty much my goto pattern: build things that allow both human and agents to use them together. Any place that's anti-AI or similar will have to find a way to distinguish, which won't be possible if the agent use pattern is similar enough to human or the app itself masks usage patterns. Either allow both, or ban both."}, {"id": 50664365, "au": "probably_wrong", "dom": 9, "sr": 31, "sc": 4.88, "ep": 5.98, "bs": 0.0, "d": 4, "age": 10.16, "grav": 89.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://7c0h.com/blog/new/lost_gmail_ii.html"], "ig": 1.27, "fa": 0.62, "gp": 0.846, "bl": 0.0, "ds": 0.0, "txt": "I wrote a blog post of my experience. In short: I demanded a copy of all the personal data that they have on me (including emails) and they ended up restoring my access because (my guess) it was easier to do that than verifying my identity and sending me a personalized file.\n\nThe blog post: https://7c0h.com/blog/new/lost_gmail_ii.html"}, {"id": 50663849, "au": "dbuxton", "dom": 109, "sr": 32, "sc": 4.7, "ep": 5.36, "bs": 0.0, "d": 0, "age": 11.36, "grav": 106.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 774, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.487, "fa": 0.0, "gp": 1.288, "bl": 0.0, "ds": 0.0, "txt": "Net-net this is a good thing. e.g. Google Docs API for over a decade has had missing features e.g. inability to attach a comment to a range (basically, comments don't work) and suggestion mode unavailable. At least MCP has forced these APIs to be created. I do have sympathy with the \"can't send via gmail\" crowd but there will be tons of workarounds for people who really want to go full agent."}, {"id": 50659512, "au": "p_j_w", "dom": 125, "sr": 33, "sc": 4.56, "ep": 5.44, "bs": 0.0, "d": 2, "age": 22.09, "grav": 307.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2335, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 0.799, "fa": 0.96, "gp": 0.567, "bl": 0.0, "ds": 0.0, "txt": "1. Calling that an office suite is extremely generous.\n\n2. Going from Google to Anthropic is a sidegrade as far as shitty companyness goes. They’re only a few years into their existence but Anthropic is already looking more like 2010 Google than 2002 Google."}, {"id": 50659493, "au": "Zigurd", "dom": 180, "sr": 34, "sc": 4.51, "ep": 5.31, "bs": 0.0, "d": 1, "age": 22.11, "grav": 307.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 12406, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.523, "fa": 0.28, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "It could've worked that way had apps had a standardized approach to agent permissions under a different identity than the users identity.\n\nIt looks like it will end up as MCPs and on device MCP-like APIs acting under the user's identity, and therefore getting nerfed around potentially dangerous actions."}, {"id": 50654909, "au": "ethagnawl", "dom": 138, "sr": 35, "sc": 4.48, "ep": 5.58, "bs": 0.0, "d": 2, "age": 29.61, "grav": 500.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 2746, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.537, "fa": 0.34, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "I would have agreed until very recently. I've been a paying customer for almost 10 years but they seem to have lost their way recently and are focused on features I don't care about (crypto wallet and chatbot) instead of the ones I do (Linux Drive and overall performance and usability). Their CEO also has a raging case of AI psychosis and I no longer have any faith in the slop they're excreting at his insistence."}, {"id": 50661404, "au": "pavo-etc", "dom": 214, "sr": 36, "sc": 4.43, "ep": 5.31, "bs": 0.0, "d": 0, "age": 18.14, "grav": 222.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 19, "qw": 0, "k": 859, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://github.com/zachpmanson/docket"], "ig": 0.883, "fa": 0.75, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "I made a CLI for Gmail and gCal for this exact reason. Gives agents full access to IMAP controls and caldav.\n\nhttps://github.com/zachpmanson/docket"}, {"id": 50663255, "au": "hparadiz", "dom": 149, "sr": 37, "sc": 4.15, "ep": 4.81, "bs": 0.0, "d": 2, "age": 12.86, "grav": 128.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 2303, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.409, "fa": 0.28, "gp": 0.486, "bl": 0.0, "ds": 0.0, "txt": "It works both ways. Before AI Google cameras for example were easier for me because I didn't have to set anything up. Now they are annoying and in the way when I just wanna pull a frame from one of them. I have to ask Google politely for the privilege. Now I just don't buy Google devices anymore. It actually makes me very angry that I can't access my own smart devices with my agents. I could have built myself a beautiful smart home panel by now were it not for Google's API being in the way. Like every big corporation they will never get it until a competitor eats their lunch."}, {"id": 50660270, "au": "jphone1900", "dom": 133, "sr": 38, "sc": 3.92, "ep": 7.98, "bs": 2.52, "d": 4, "age": 20.73, "grav": 276.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 138, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://proton.me/learn/encryption/types-of-encryption/zero-access"], "ig": 2.015, "fa": 0.62, "gp": 1.021, "bl": 0.95, "ds": 0.0, "txt": "It seems obvious?\n\nProton reads all incoming email from non-Proton addresses, before message is encrypted with what they call Zero-access encryption. Zero access then seems more like a marketing gimmick, since technically, Proton has already accessed the contents at least once?\n\nQuoted from their website:\n\n... when an email is sent from Gmail to Proton Mail, Proton’s servers can briefly read the message ... Proton then encrypts the email using the recipient’s public key, after which only the recipient can decrypt it and Proton no longer has access.\n\nhttps://proton.me/learn/encryption/types-of-encryption/zero-...\n\nSo you ge a somewhat false sense of privacy for emails at large . All those password reset emails from various devices, emails from anyone not on Proton etc... all accessible by Proton. Optimistically to protect you.\n\nMeanwhile, if you lose your Proton recovery phrase you're potentially locked out of all those emails forever..."}, {"id": 50660286, "au": "mv4", "dom": 61, "sr": 39, "sc": 3.9, "ep": 5.22, "bs": 0.0, "d": 1, "age": 20.7, "grav": 276.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1508, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.518, "fa": 0.0, "gp": 1.141, "bl": 0.0, "ds": 0.0, "txt": "I made an agent with Gmail connectors (so your agent can draft emails for you not even send) and had to go through a lengthy API OAuth Dev Verification process with Google. Completed it, and now they want me to complete an ADA-CASA AL1 (formerly Tier 2) security assessment for my application. It's a paid service through one of their partner labs.\n\nMakes me wonder whether they don't want me doing this at all, which sucks because I built the app for Google Cloud and Gemini. Sigh."}, {"id": 50659962, "au": "BeetleB", "dom": 239, "sr": 40, "sc": 3.86, "ep": 4.74, "bs": 0.0, "d": 0, "age": 21.34, "grav": 290.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 0, "k": 18403, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": ["https://notmuchmail.org/"], "ig": 0.921, "fa": 0.62, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "I use notmuch to index my emails, and made my own notmuch MCP server.\n\nI can't imagine the need to use their MCP servers, nor why people are so upset. You can use IMAP to download your emails and have your cake too.\n\nhttps://notmuchmail.org/"}, {"id": 50654099, "au": "remus", "dom": 167, "sr": 41, "sc": 3.8, "ep": 4.9, "bs": 0.0, "d": 0, "age": 31.31, "grav": 550.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3124, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Perhaps the idea here is to try and limit spam? Agents sending emails could generate large volumes of very realistic looking mail and add to the flood."}, {"id": 50659024, "au": "hmokiguess", "dom": 311, "sr": 42, "sc": 3.72, "ep": 4.6, "bs": 0.0, "d": 0, "age": 22.79, "grav": 323.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 3514, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.544, "fa": 0.0, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "enterprise large corp stuff is so weird, every time I think that there is as many employees as there are humans in some large cities, and that there is more lines of code than we have time to read through it all in their repos, I can't help but think the whole thing makes no sense considering the surface area of the product and its features\n\nwhat is everything even doing in those servers, it's almost like there's just a ball game being played internally there where things are pointlessly moving from one redundant highly available node to another so that numbers can be shared in a presentation and the game can keep on playing"}, {"id": 50659598, "au": "physicsguy", "dom": 147, "sr": 43, "sc": 3.7, "ep": 4.95, "bs": 0.0, "d": 0, "age": 21.95, "grav": 303.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3134, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.396, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is going to happen everywhere which is why I was skeptical about many things people were claiming.\n\nMy employer started switching their APIs to usage based pricing a couple of years ago but has really hammered working on extending that this year. Want to extract information? Sure, you can do it, but it is going to cost you a lot of money, and if you try and do it through the client then you’ll get your account suspended for breaking the Ts and Cs. Clients are corporates so they aren’t going to risk being sued."}, {"id": 50665064, "au": "aja12", "dom": 37, "sr": 44, "sc": 3.7, "ep": 5.24, "bs": 0.0, "d": 3, "age": 8.6, "grav": 70.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 62, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.774, "fa": 0.0, "gp": 0.74, "bl": 0.0, "ds": 0.0, "txt": "The prospect of users trusting all their data to Google and risking to lose everything when Google unilaterally decide to close their account is chilling.\n\nI've switched to other providers for everything (I no longer have a Google or Apple or Meta accounts, and I back everything up locally) and I sleep much better that way.\n\nBTW, isn't that 4 months delay longer than the maximum allowed by GDPR? IIRC a recipient of a GDPR data access request has a maximum delay of 1 month to acknowledge it and request an extension, and has maximum 3 months to comply"}, {"id": 50654039, "au": "k9294", "dom": 111, "sr": 45, "sc": 3.47, "ep": 5.01, "bs": 0.0, "d": 0, "age": 31.43, "grav": 554.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 287, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.085, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "I've been thinking about moving away from Google's infrastructure for quite some time.\n\nAre there any good alternatives for personal and business use cases (email/drive/docs)?\n\nI'd appreciate any advice."}, {"id": 50654136, "au": "imrehg", "dom": 302, "sr": 46, "sc": 3.46, "ep": 4.71, "bs": 0.0, "d": 0, "age": 31.22, "grav": 547.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1432, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.498, "fa": 0.0, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "Topic's interesting, however...\n\n    Al Smith\n    AI agent writer at Ritza\n    Al Smith is the byline for every TechStackups article written by an AI agent. Al's articles are researched and drafted by agents at Ritza, then reviewed by a human editor before publication.\n\nHm, still..."}, {"id": 50660205, "au": "probably_wrong", "dom": 3, "sr": 47, "sc": 3.45, "ep": 4.99, "bs": 0.0, "d": 2, "age": 20.87, "grav": 279.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.404, "fa": 0.0, "gp": 1.17, "bl": 0.0, "ds": 0.0, "txt": "Just in case: I once enabled SMTP access to my account because I had to contact a bunch of volunteers for an event and wanted to send personalized emails instead of \"Dear volunteer\". GMail flagged me as a spammer, banned my account, and it took four months and the GDPR to get it back.\n\nSo if you want to use SMTP but haven't done so until now I suggest you start enabling it to \"warm up\" their spam detector."}, {"id": 50662659, "au": "thephyber", "dom": 104, "sr": 48, "sc": 3.45, "ep": 4.62, "bs": 0.0, "d": 2, "age": 14.65, "grav": 157.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 5949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.677, "fa": 0.0, "gp": 0.471, "bl": 0.0, "ds": 0.0, "txt": "GMail comes with Google Workspaces, so it can be paid.\n\nI suspect Google simply wants to limit the headaches related to the use of their product by automated systems, similar to CAPTCHAs. They will update the policy later if they find value in this as a business decision. More likely, they will offer it as a feature to users who exclusively use their Gemini subscription as opposed to 3rd party agents using a GMail account for arbitrary use."}, {"id": 50654185, "au": "nmjenkins", "dom": 248, "sr": 49, "sc": 3.32, "ep": 7.91, "bs": 3.05, "d": 2, "age": 31.09, "grav": 543.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 8, "k": 1648, "kpp": 10.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.866, "fa": 0.68, "gp": 1.092, "bl": 1.15, "ds": 0.0, "txt": "> Did you just scan for tokens called \"paperless*\"\n\nYes, exactly that. As for why…\n\nPaperless was absolutely hammering our server. The internal email thread about it began: \"Every 10 minutes we see a massive outgoing network spike that's almost 3 times our normal bandwidth. What is going on there?\"\n\nTurned out paperless was downloading the entire contents of every single message in the account it's connected to (often GBs of data!) every 10 minutes. We run ludicrously powerful hardware and give ourselves capacity headroom so we could cope, but this was clearly broken behaviour and had the potential to impact other users. We added better per-user throttling to deal with it on our end, but also made sure that Paperless fixed this, and then wanted to ask people who looked like they might be using it to update. It will save you a ton of bandwidth and compute too."}, {"id": 50654322, "au": "anshumankmr", "dom": 237, "sr": 50, "sc": 3.18, "ep": 4.28, "bs": 0.0, "d": 0, "age": 30.78, "grav": 534.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1034, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.327, "fa": 0.0, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": "That feels like a good thing and a bad thing at the same time. Good thing is some moron with a Python script can genuinely flood my inbox with even more customized slop or have a swarm of agents do it, and while it is already swamped, it would become even worse. But not having a personal email MCP sucks and I have to rely on Claude to do it for some complex legal stuff thats ongoing."}, {"id": 50654843, "au": "elwebmaster", "dom": 178, "sr": 51, "sc": 3.15, "ep": 4.54, "bs": 0.0, "d": 0, "age": 29.72, "grav": 503.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 281, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 0.89, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Why does the industry keep making AI agents act from their owners accounts? AI agent is a not, treat it like your assistant. It should have its own email and forward you any correspondence."}, {"id": 50659237, "au": "mapontosevenths", "dom": 246, "sr": 52, "sc": 3.13, "ep": 4.67, "bs": 0.0, "d": 2, "age": 22.47, "grav": 315.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.689, "fa": 0.0, "gp": 0.486, "bl": 0.0, "ds": 0.0, "txt": "I was going to put up with the AI, just because the cost of switching is so high, but then I found out that as part of the AI nonsense they force on you now the TOS includes the \"right\" for Google to put your actual content directly in front of low paid human reviewers. So now you've got actual humans reading your email and looking at your personal photos, and Google potentially training their AI's on your confidential business secrets.\n\nGmail has gotten EXPENSIVE.\n\nNow I'm trying to find a plan to escape Google that doesn't just leave me in the hands of a slightly different corporation I'll have to flee in a few more years. Self hosting email stinks, I did it for decades."}, {"id": 50662776, "au": "jmathai", "dom": 55, "sr": 53, "sc": 3.1, "ep": 4.64, "bs": 0.0, "d": 1, "age": 14.34, "grav": 152.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5717, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.42, "fa": 0.0, "gp": 0.901, "bl": 0.0, "ds": 0.0, "txt": "I don't understand how Gemini in Google Sheets can be so bad. I routinely fail trying to get it to generate charts or analyze the data in the cells immediately adjacent to it.\n\nI would work inside Sheets so much more if they fixed this. Instead I mostly use Sheets through Claude Code via the Sheets API."}, {"id": 50659303, "au": "lmeyerov", "dom": 233, "sr": 54, "sc": 3.0, "ep": 4.1, "bs": 0.0, "d": 0, "age": 22.36, "grav": 313.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 3385, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.382, "fa": 0.0, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "Re:30 day, I don't understand how it is legal to limit how people use their own data. Google doesn't own the emails.\n\nSomething similar in X, where they have limits on how you can use tweets, eg, sharing generally must be by ID, not hydrated tweet.\n\nScummy and type of open competition I'd like congress to legislate, they are 1-2 decades behind now."}, {"id": 50654042, "au": "mattmight", "dom": 176, "sr": 55, "sc": 2.94, "ep": 4.04, "bs": 0.0, "d": 0, "age": 31.42, "grav": 553.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2848, "kpp": 17.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 1.098, "bl": 0.0, "ds": 0.0, "txt": "Wow. What a slap in the face. This is enough to get me to rethink my entire decades-long relationship with Google.\n\nAre there any agent-friendly alternatives to Docs and Drive? Or do I need to create one?"}, {"id": 50654101, "au": "nmjenkins", "dom": 242, "sr": 56, "sc": 2.94, "ep": 4.23, "bs": 0.0, "d": 0, "age": 31.31, "grav": 550.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 1648, "kpp": 10.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 1.25, "bl": 0.0, "ds": 0.0, "txt": "At Fastmail we believe it's your data, so up to you what you want to do with it and who you want to give access to. (Of course, you are also responsible for what your agents do.)\n\nOur MCP server continues to be available for all (no \"partner only\" tools), and if you want to do something even more powerful, agents are pretty good at whipping up code to connect to our full JMAP API…"}, {"id": 50662730, "au": "Joker_vD", "dom": 156, "sr": 57, "sc": 2.94, "ep": 4.18, "bs": 0.0, "d": 1, "age": 14.46, "grav": 154.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 21, "k": 7643, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 0.855, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> which won't be possible if the agent use pattern is similar enough to human or the app itself masks usage patterns.\n\nThere is no much reason to have an agent that reads 0.2 email/s, one by one, is there? And if you still decide to have it for some reason, sure, we can serve it 1 lightweight request every 5 seconds, that's not a problem. The problem is that most agents don't have such use patterns, theirs are much more aggressive."}, {"id": 50662025, "au": "jefftk", "dom": 181, "sr": 58, "sc": 2.94, "ep": 4.18, "bs": 0.0, "d": 1, "age": 16.41, "grav": 189.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 24185, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": ["https://support.google.com/mail/answer/138350"], "ig": 0.904, "fa": 0.62, "gp": 0.196, "bl": 0.0, "ds": 0.0, "txt": "I mean, it's very common for people to give assistants access to their email account, and even allow them to reply on their behalf.\n\nGmail even has specific support for this, which it calls \"delegation\": https://support.google.com/mail/answer/138350"}, {"id": 50659662, "au": "evenhash", "dom": 120, "sr": 59, "sc": 2.94, "ep": 4.14, "bs": 0.0, "d": 1, "age": 21.84, "grav": 301.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 113, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 0.813, "fa": 0.68, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "I know why people here haven’t mentioned it, but Microsoft 365 Business Basic plan is the most obvious alternative. It’s $8/mo or something like that for the full cloud Office365 suite. You can easily set up email from your own domain."}, {"id": 50658840, "au": "Schnitz", "dom": 1, "sr": 60, "sc": 2.94, "ep": 4.11, "bs": 0.0, "d": 0, "age": 23.09, "grav": 330.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 931, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 0.704, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "The sad part is that this won’t even work. People will just have the agent operate a browser to send email and it’ll be unnecessarily messy and wasteful."}, {"id": 50662411, "au": "rovr138", "dom": 135, "sr": 61, "sc": 2.94, "ep": 4.09, "bs": 0.0, "d": 6, "age": 15.27, "grav": 168.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 45, "k": 2027, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.109, "fa": 0.42, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "> Proton can’t change the fundamental nature of IMAP or SMTP\n\nExactly.\n\n> If I capture the attention of Law Enforcement, then they can theoretically obtain orders to hand over logs, stored data, encryption keys, or (depending on jurisdiction), install or reconfigure systems to intercept plaintext prior to encryption.\n\nYou forgot, the same thing, on other webmail provider searching for emails sent to you. If they don't encrypt, the only place it's encrypted it's on your side.\n\nSo, to the original comment, they're right. They're still in clear-text elsewhere. Either on the wire, or on the server of the person you communicated with."}, {"id": 50664871, "au": "pjc50", "dom": 77, "sr": 62, "sc": 2.94, "ep": 4.03, "bs": 0.0, "d": 4, "age": 9.0, "grav": 74.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 113553, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.604, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "AI agents are amazing: they're an accountability sink!\n\nBecause they're nondeterministic and difficult to diagnose, and genuinely do cause enough of a problem rate for everyone to notice, everything can be blamed on them. But since they're not a human in the organization hierarchy, this doesn't threaten the organization. Additionally, AI has the backing of management, so the agent won't be removed no matter how many problems it causes. Everyone can happily keep going round in circles."}, {"id": 50655008, "au": "ygjb", "dom": 264, "sr": 63, "sc": 2.94, "ep": 4.02, "bs": 0.0, "d": 3, "age": 29.41, "grav": 495.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2400, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.11, "fa": 0.34, "gp": 0.306, "bl": 0.0, "ds": 0.0, "txt": "800gb isn't a lot for people who relied on email as the primary exchange for media files, and aren't technically savvy to know how to download, and migrate them to a better service for archive and search."}, {"id": 50660063, "au": "thorio", "dom": 189, "sr": 64, "sc": 2.94, "ep": 3.94, "bs": 0.0, "d": 0, "age": 21.13, "grav": 285.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 23, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.95, "bl": 0.0, "ds": 0.0, "txt": "Might this not be part of a walled garden around Gemini since Gemini's native Google workspace integration has almost full feature access and definitely can send mails?"}, {"id": 50664309, "au": "littlecranky67", "dom": 22, "sr": 65, "sc": 2.94, "ep": 3.93, "bs": 0.0, "d": 4, "age": 10.29, "grav": 91.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 5938, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.574, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "I also once used the GDPR to get an account (not Google) back after being enough of a pain in the ass: The provider refused to tell me the reason for the ban, and also admitted at some point that \"some data\" is retained to prevent me from signing up again. I really pushed for the GDPR here, citing that they have to tell me which data that is. They were basically claiming their abuse prevention logic is subject to trade secrets and needs to be kept a secret, and that data cannot be disclosed else I would use it to circumvent their protection and signup again. After threating to file a GDPR violation with their local officer, they caved and re-instated the account."}, {"id": 50653988, "au": "Den_VR", "dom": 229, "sr": 66, "sc": 2.94, "ep": 3.93, "bs": 0.0, "d": 0, "age": 31.61, "grav": 559.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 473, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.818, "bl": 0.0, "ds": 0.0, "txt": "I’ve been interacting with my Google workspace solely through openai and Gemini offerings for a while now. It’s been thought provoking but not life changing. And yet this change would be enough friction for me to move off Google services."}, {"id": 50664814, "au": "jillesvangurp", "dom": 51, "sr": 67, "sc": 2.94, "ep": 3.92, "bs": 0.0, "d": 2, "age": 9.12, "grav": 76.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.558, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "You can also just get a sendgrid or similar account and send email from there. There are multiple ways. And if you are going to use SMTP, you might as well use IMAP and work with a local database with all your emails instead of making your AI bottleneck everything over API calls. Besides, gmail's search isn't exactly great (considering Google is providing that).\n\nMost inboxes are small enough that you can index them properly locally with some vector database and treat them as a little rag knowledge base. Downloading your email locally is of course nothing new, it's what email clients have been doing for decades."}, {"id": 50660631, "au": "cyberax", "dom": 47, "sr": 68, "sc": 2.94, "ep": 3.85, "bs": 0.0, "d": 2, "age": 20.07, "grav": 262.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 7233, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.386, "fa": 0.0, "gp": 0.407, "bl": 0.0, "ds": 0.0, "txt": "Gmail's SMTP is bad. You need to create an app token that also allows IMAP access to your inbox. There's no way to create a \"send only\" account.\n\nI wanted to use SMTP for automated notifications from my home monitoring system, and it was _easier_ to build a freaking Telegram bot rather than just setting up SMTP."}, {"id": 50654341, "au": "TimByte", "dom": 102, "sr": 69, "sc": 2.94, "ep": 3.84, "bs": 0.0, "d": 1, "age": 30.73, "grav": 533.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 476, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.128, "fa": 0.34, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "Yeah 100 percent a business thing. If they only cared about human confirmation gmail has had push confirmations and 2fa for ages already, no need to give sending only to Anthropic and the other giants"}, {"id": 50654031, "au": "sklargh", "dom": 307, "sr": 70, "sc": 2.94, "ep": 3.74, "bs": 0.0, "d": 0, "age": 31.48, "grav": 555.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2560, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.732, "bl": 0.0, "ds": 0.0, "txt": "Gmail can’t serve ads in OpenAI or Anthropic UI to normies, hence this. I’m sure there’s some spam element but it’s always about collection and ads serving apertures with Google."}, {"id": 50666975, "au": "ceejayoz", "dom": 18, "sr": 71, "sc": 2.94, "ep": 3.7, "bs": 0.0, "d": 6, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 98129, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.486, "fa": 0.0, "gp": 0.143, "bl": 0.0, "ds": 0.0, "txt": "Spam is unsolicited commercial email.\n\nExpected non-commercial mail that has a bit of mail merge in it doesn't hit that definition.\n\nGmail already has sends-per-minute limits in place to prevent the high volume thing.\n\nA false positive shouldn't take four months and a legal threat to fix."}, {"id": 50662534, "au": "tekacs", "dom": 312, "sr": 72, "sc": 2.93, "ep": 3.7, "bs": 0.0, "d": 0, "age": 14.97, "grav": 163.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 22, "k": 4963, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 0.867, "fa": 0.42, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "> You may not...\n  >\n  > Use any user data or Google Technical Information to develop a product or service that is similar to a GWS Service.\n\nIn the list of prohibited activities is... this. As they add more AI functionality to the surface, I can't help but wonder what this prohibits you doing against Google services!"}, {"id": 50654529, "au": "gadders", "dom": 322, "sr": 73, "sc": 2.93, "ep": 3.69, "bs": 0.0, "d": 0, "age": 30.32, "grav": 521.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 10826, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.387, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "The enshittification has started. I think these revenue-maximising douche bags will prevent AGI ever happening just by shite like this.\n\n\"No you can't use your own Claude/ChatGPT/Whatever to look on Amazon/read your Gmail. You need to use our crippled MCP server or our own shitty LLM.\""}, {"id": 50655942, "au": "gf000", "dom": 129, "sr": 74, "sc": 2.93, "ep": 3.69, "bs": 0.0, "d": 2, "age": 27.85, "grav": 451.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.347, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I used to be a paying customer, but encrypted email is a scam, the only one prevented from reading your emails is you yourself.\n\nAnd this is quite literally true, I discontinued
