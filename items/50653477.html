: [], "ig": 0.963, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Q: What's the difference between a human and an agent?\n\n>A: The agent can go much much faster.\n\nFaster than a script that queues a bunch of emails for sending?\n\nFaster than an email client that sends emails from the outbox?\n\nInquiring minds want to know."}, {"id": 50654516, "au": "jesse_dot_id", "dom": 243, "sr": 78, "sc": 2.93, "ep": 3.43, "bs": 0.0, "d": 1, "age": 30.34, "grav": 521.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 2174, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "I switched to Fastmail the second I accidentally clicked an AI button in my GMail inbox meant to look like the inbox and it indexed my shit without asking me. I've loved it so far. Can't speak to the MCP server as I think it's royally dumb to hook agents to anything that I care about when they can't intuit what I would or would not want them to do."}, {"id": 50659502, "au": "perdy", "dom": 99, "sr": 79, "sc": 2.93, "ep": 3.4, "bs": 0.0, "d": 2, "age": 22.1, "grav": 307.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In their own wording: \"Policy checks, data boundaries, and human confirmation have to live in the request path\". It's not exactly a \"read\" vs \"write\" matter, since the public Gmail server can create drafts or trash emails. They restricted send, reply and forward to partners."}, {"id": 50654206, "au": "TeMPOraL", "dom": 274, "sr": 80, "sc": 2.93, "ep": 3.39, "bs": 0.0, "d": 1, "age": 31.04, "grav": 542.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.227, "fa": 0.0, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": "Thank you for that.\n\nYour MCP server is now a cornerstone of our busy life as parents of little kids. We use a shared calendar to keep on top of everything, and Claude has been managing it for the past few months, via your MCP."}, {"id": 50654132, "au": "darkwater", "dom": 247, "sr": 81, "sc": 2.93, "ep": 3.3, "bs": 0.0, "d": 1, "age": 31.23, "grav": 547.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 7777, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.365, "bl": 0.0, "ds": 0.0, "txt": "While you are here, it was funny and a bit \"scaring\" at the same time to get your email about upgrading my installation of Paperless-ngx connected to my Fastmail account :)\n\nDo you have any more insights on that one? Was it overloading the servers for no good reason I guess? Did you just scan for tokens called \"paperless*\" or did you use some extra heuristic?"}, {"id": 50654538, "au": "thih9", "dom": 153, "sr": 82, "sc": 2.93, "ep": 3.27, "bs": 0.0, "d": 1, "age": 30.3, "grav": 520.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 10141, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't count on this working long term. An agent is likely to perform detectable automated actions even via custom app. And if it works and google is serious then, as you say, they can ban custom gmail apps."}, {"id": 50654300, "au": "PaulHoule", "dom": 316, "sr": 83, "sc": 2.93, "ep": 3.23, "bs": 0.0, "d": 0, "age": 30.82, "grav": 535.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 110849, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.133, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "APIs are rarely a gift, they are usually in fact a take-away meant to limit, throttle, and channel automated behavior."}, {"id": 50658719, "au": "dofm", "dom": 223, "sr": 84, "sc": 2.93, "ep": 3.22, "bs": 0.0, "d": 1, "age": 23.27, "grav": 334.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 23, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 0.862, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> We need any new upstart to have an agent send email of interest from a non Gmail domain and actually arrive in your inbox\n\nDoes this change threaten to stop that?\n\nI think they aren't saying \"if you want to email Gmail users from an agent you need to use our MCP to do it\".\n\nAre they not saying: if you want to develop an agent that operates Google Workspace on the user's behalf, these are the only ways you can do it."}, {"id": 50659081, "au": "aleksiy123", "dom": 95, "sr": 85, "sc": 2.93, "ep": 3.21, "bs": 0.0, "d": 1, "age": 22.68, "grav": 320.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 899, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.057, "fa": 0.0, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "So I don’t fully know the api here but the actual confirmation is client side right?\n\nThere’s nothing stopping the client side from auto approving right?\n\nI’m fairly sure the reason for this is to prevent automated abuse"}, {"id": 50660342, "au": "lmeyerov", "dom": 235, "sr": 86, "sc": 2.93, "ep": 3.19, "bs": 0.0, "d": 2, "age": 20.6, "grav": 273.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3385, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I pay for both, that's why I don't understand it\n\nX is somewhat arguable in that it's other people's tweets, but similar to LI, caselaw has shown when it's public (not behind an auth gate), it's generally fair game\n\ngmail makes little sense as it's the content owner wanting to do things with their content"}, {"id": 50661561, "au": "shepherdjerred", "dom": 86, "sr": 87, "sc": 2.93, "ep": 3.15, "bs": 0.0, "d": 5, "age": 17.72, "grav": 214.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5764, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.34, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are much simpler ways -- look at the sibling comments.\n\nPutting those aside: I am sure you could save the Gmail HTML/JS locally, give it to an agent, and have a Gmail client in a day\n\nEven putting LLMs aside, people have been doing this kind of thing for a long time. Reverse engineering is not new."}, {"id": 50663006, "au": "oblio", "dom": 173, "sr": 88, "sc": 2.93, "ep": 3.14, "bs": 0.0, "d": 2, "age": 13.55, "grav": 139.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 28169, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.239, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "What are you folks doing with your Gmail accounts that their spam filters can't handle it? I have a 15+ year old Gmail account that has been on the internet forever and it basically leaves through 0 spam. Mark messages as spam, use Important/Not important, unsubscribe from garbage, etc."}, {"id": 50654349, "au": "FabCH", "dom": 139, "sr": 89, "sc": 2.93, "ep": 3.13, "bs": 0.0, "d": 1, "age": 30.72, "grav": 533.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1083, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "I self-host everything except email.\n\nDrive = a simple folder on a server, with WebDAV in front of it to allow random apps to store data.\n\nDocs = Aforementioned folder, with LibreOffice.\n\nPhotos = Immich"}, {"id": 50662911, "au": "nmjenkins", "dom": 297, "sr": 90, "sc": 2.93, "ep": 3.12, "bs": 0.0, "d": 2, "age": 13.83, "grav": 144.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1648, "kpp": 10.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 0.989, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The only way to do this at the moment would be to create a user specifically for the agent (e.g. on our duo/family plans). You can also share specific folders from your own user into that too (either read-only or read-write)."}, {"id": 50661571, "au": "aussieguy1234", "dom": 238, "sr": 91, "sc": 2.93, "ep": 3.11, "bs": 0.0, "d": 0, "age": 17.68, "grav": 213.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2273, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.044, "fa": 0.0, "gp": 0.452, "bl": 0.0, "ds": 0.0, "txt": "Switch your domain over to Proton Mail or another provider and use its SMTP.\n\nAs others have said, trying to work around this with SMTP Gmail will likely get your entire Google Account banned, possibly for months or longer before you can get it back."}, {"id": 50662445, "au": "scottpersinger", "dom": 122, "sr": 92, "sc": 2.93, "ep": 3.06, "bs": 0.0, "d": 1, "age": 15.2, "grav": 167.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 21, "qw": 0, "k": 40, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": ["https://github.com/freeflow-im/flow"], "ig": 0.723, "fa": 0.45, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "I've been rebuilding the Google Suite, for my own purposes. Give it a try or lend a hand. App passwords work (so far). https://github.com/freeflow-im/flow"}, {"id": 50655139, "au": "mickeyp", "dom": 283, "sr": 93, "sc": 2.93, "ep": 3.05, "bs": 0.0, "d": 1, "age": 29.17, "grav": 488.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 2307, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 0.77, "fa": 0.34, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "How do you guys handle someone who has run their own mail stuff for 16 years but want their own private IMAP, but Fastmail for sending regular, old human-authored emails? Happy to pay."}, {"id": 50654075, "au": "waseems", "dom": 145, "sr": 94, "sc": 2.93, "ep": 3.03, "bs": 0.0, "d": 1, "age": 31.35, "grav": 551.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.29, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "See my comment elsewhere in this thread, i built www.inbox2.com its not ready for prime time but feel free to hit me up to bounce ideas around. Waseem @"}, {"id": 50663584, "au": "spawrks", "dom": 224, "sr": 95, "sc": 2.93, "ep": 3.01, "bs": 0.0, "d": 2, "age": 11.99, "grav": 115.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 11, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.281, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it signals that Google (fairly I might add) is not down with people automating bots using Gmail going forward. Which is fair. But also they don't have competition to drive their MCP API to be in a users best interest.  Let's be honest, they have paid for amazing email for years, given it to us for free, I don't think Google is doing anything wrong here, but if you use Google Workspace and pay them you don't suddenly get fair access, they are saying these are the only things you can do.  That's different than \"these are the only ways you can do it.\"  The latter I totally get but the former is ... fair but an issue."}, {"id": 50658891, "au": "mooreds", "dom": 73, "sr": 96, "sc": 2.93, "ep": 3.0, "bs": 0.0, "d": 1, "age": 23.0, "grav": 328.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 98046, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.278, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Respectfully disagree, in part.\n\nFolks who care about security will push Gmail to have an MCP task to send email.\n\nPeople who don't care about security will either use the API or the browser, as you mention. But the first time an agent is prompt injected and substantially harms someone (esp someone famous or notable), it will be front page news."}, {"id": 50655034, "au": "elwebmaster", "dom": 183, "sr": 97, "sc": 2.93, "ep": 3.0, "bs": 0.0, "d": 2, "age": 29.36, "grav": 493.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 281, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So is AI spams people it should pretend the owner is spaming people? SPAM has existed long before AI and scripts have automated spaming for years. If anything AI makes spam more personalized/random and slightly less annoying."}, {"id": 50656159, "au": "persolb", "dom": 154, "sr": 98, "sc": 2.93, "ep": 3.0, "bs": 0.0, "d": 2, "age": 27.47, "grav": 441.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 143, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t see how they could do this without also banning any unattested browser.\n\nThis is going the way that gaming anti-cheat has gone. You need root access to prevent automation on the machine… but that just pushes people to automate at the human UI level via KVM setups."}, {"id": 50659735, "au": "fweimer", "dom": 271, "sr": 99, "sc": 2.93, "ep": 2.97, "bs": 0.0, "d": 3, "age": 21.73, "grav": 298.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1951, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 0.439, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "20 years of the linux-kernel mailing list is about 75 GiB. And it isn't the only mailing list."}, {"id": 50659839, "au": "MBCook", "dom": 158, "sr": 100, "sc": 2.93, "ep": 2.95, "bs": 0.0, "d": 1, "age": 21.58, "grav": 295.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "account_emails", "flbl": "Account & Emails (Smtp)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have a feeling they don’t WANT any tool sending email. Anything they open like that is going to be abused to hell by spammers.\n\nIn my eyes, this looks exactly like an anti-spam thing. And if you want to send email, you have to get qualified through them which lets them put up a bunch of barriers to try and stop spammers way easier than they could if they were playing whack-a-mole."}, {"id": 50663406, "au": "knodi123", "dom": 169, "sr": 101, "sc": 2.93, "ep": 2.95, "bs": 0.0, "d": 1, "age": 12.45, "grav": 122.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 6546, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_send", "flbl": "Agent & Send (Browser)", "urls": [], "ig": 1.242, "fa": 0.0, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "based on the tools available to the MCP (no delete either), it seems more likely that they are limiting irrevocable actions in an attempt to dodge risk or liability.  If an agent can't send email, then a malfunctioning agent can't send erroneous email.  And so on..."}, {"id": 50663157, "au": "alterom", "dom": 157, "sr": 102, "sc": 2.93, "ep": 2.94, "bs": 0.0, "d": 2, "age": 13.16, "grav": 133.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 17, "k": 941, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 0.741, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">There is no much reason to have an agent that reads 0.2 email/s, one by one, is there?\n\nWhat are you on?\n\nMy email client simply fetches all messages, and from there on it's all offline.\n\nThe server wouldn't know how the emails are read.\n\nThat's, you know, how email has always worked. It doesn't require you to be online all the time."}, {"id": 50669619, "au": "epistasis", "dom": 58, "sr": 103, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 4, "age": 0.86, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 32445, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)", "urls": [], "ig": 1.242, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It seems likely that the particular model for Gemini used in Sheets, GMail, and even search, is something far worse than what's in antigravity.\n\nThe hallucination i get from Search interactions reminds me of models more than a year old at this point."}, {"id": 50660846, "au": "SpicyLemonZest", "dom": 193, "sr": 104, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 19.62, "grav": 252.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 10045, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mail_fastmail", "flbl": "Mail & Fastmail (Customer)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, right. If agentic interaction with software is the future, that's what we should expect to happen to all paid services, the same way that everyone adopted cloud licensing terms rather than letting you buy one CD and install it on all your servers."}, {"id": 50654766, "au": "rolymath", "dom": 324, "sr": 105, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 0, "age": 29.86, "grav": 507.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 173, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.158, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "I would never use something like this. This is just asking to get your entire life banned by Google. I know it's official, but the list of things you can and can't t, masquerades the From/To and maps reads/incoming mail to a specific folder."}, {"id": 50661020, "au": "talmr", "dom": 186, "sr": 145, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 1, "age": 19.22, "grav": 244.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 113, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 0.98, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not sure if I’m the only one but I had a honeymoon phase with connecting bunch of stuff using MCP.\n\nBut now I have so many issues and bugs, or outcomes which get stuck or are wrong. My expectations have increased for sure.\n\nI don’t know a solution, but I am getting integration fatigue. Call me crazy, but I don’t know that I need this level of automation for most things, esp. when the automation simply doesn’t work."}, {"id": 50662227, "au": "circularfoyers", "dom": 217, "sr": 146, "sc": 2.3, "ep": 3.15, "bs": 0.85, "d": 3, "age": 15.81, "grav": 178.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 848, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "mcp_server", "flbl": "Mcp & Server (Data)", "urls": [], "ig": 1.072, "fa": 0.22, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I by no means disagree with you on any of those points. But unless I missed it, I didn't see any mention of it spoofing email clients. You might have excluded it intentionally, but knowing that it is, is important to know since it means it's unlikely to get you banned, like other methods might."}, {"id": 50663601, "au": "spawrks", "dom": 221, "sr": 147, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 2, "age": 11.96, "grav": 115.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 11, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_gemini", "flbl": "Google & Gemini (Agents)     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
