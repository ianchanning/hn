handling everything responsibly and transparently—but it is working as intended, and it’s fair to say that it’s only the tip of the iceberg of the IP you entrust to Convex (assuming we earn your trust).\n\nIf people have more questions, fire away."}, {"id": 50671478, "au": "jack_pp", "dom": 97, "sr": 2, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 3, "age": 19.71, "grav": 254.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 2096, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 1.281, "fa": 0.95, "gp": 0.753, "bl": 0.0, "ds": 0.0, "txt": "They'd permanently destroy all user trust if they started doing that and I doubt even their internal models are at the level of running a business 100% autonomously. Could argue they're hoovering everything and in a few years they could do that but still, people already hate them, you think if you ran a 1000 user business with 10$ subs all your subs will switch to their version if you told them they copied your project? I for one wouldn't save 5$ a month to support such behaviour and I bet a lot of people would do the same.\n\nSo they have no guarantee they can monetize your ideas, even if they did they'd have to compete on price so they'd make less than you, would have to trust their models to run a business 100% and lose all their core business users. Risk all of that for what?"}, {"id": 50670813, "au": "arjie", "dom": 103, "sr": 3, "sc": 6.02, "ep": 6.02, "bs": 0.0, "d": 0, "age": 20.86, "grav": 279.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 10985, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 1.799, "fa": 0.0, "gp": 1.239, "bl": 0.0, "ds": 0.0, "txt": "A lot of open-source software is better vendorized through pointing an LLM at them and copying the bits you want. There is really not much use to libraries like this. You're just setting yourself up for unhappiness. Save yourself the \"oh no, this is so unprofessional\" when they inevitably have their CI hacked and you install a supply-chain hacked version that steals all your stuff.\n\n\"Stealing your idea\" is not a thing. Everyone has the same ideas. But they're going to get hacked one day and your program is going to download their script and run it on your computer and you're going to sit there like a fool wondering why you even installed someone else's vibecoded software to save yourself two hours of vibecoding.\n\n    curl -fsS --max-time 15 -X POST \"$BASE/generate\" \\ \n    -H 'content-type: application/json' \\ \n    --data \"$(node -e 'process.stdout.write(JSON.stringify({idea:process.argv[1],template:\"nextjs-shadcn\"}))' \"$IDEA\")\" \\ \n    | node -e 'let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{try{process.stdout.write(JSON.parse(s).id||\"\")}catch{}})') || true"}, {"id": 50675256, "au": "maldeh", "dom": 15, "sr": 4, "sc": 5.99, "ep": 6.13, "bs": 0.0, "d": 4, "age": 9.98, "grav": 87.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 519, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 1.472, "fa": 0.56, "gp": 0.744, "bl": 0.0, "ds": 0.0, "txt": "I understood what you intended in the first post and it’s equally illuminating to me that a number of people strongly feel it implies the opposite… a classic matter of semantic hair-splitting, but communication is after all a process.\n All the posters including parent seem to be in agreement that the default state should be “opted-out”(i.e not “opted-in” aka disabled), with explicit consensual action needed by the user to “opt-in” for telemetry."}, {"id": 50671019, "au": "pixelready", "dom": 71, "sr": 5, "sc": 5.76, "ep": 5.76, "bs": 0.0, "d": 1, "age": 20.46, "grav": 270.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 708, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 1.726, "fa": 0.0, "gp": 1.174, "bl": 0.0, "ds": 0.0, "txt": "Ideas have always been cheap, but implementation was expensive, so implementation itself was a signal of commitment. Now ideas and implementation are both cheap, so signaling commitment will become expensive. For any product without network lock-in the only moat left is a reputation of long term follow through and strong customer service. That’s what will separate the tidal wave of fly-by-night LLM copycats from actual services.\n Serving customers is a slog that most folks who are high on the dopamine hit of “I told Claude to mix this thing with that thing last night in a bout of inspiration and lookie here in an hour it built the thing and it works! Zomg!”  Don’t have the patience for, unlike actual businesses. When the dopamine wears off they’re on to the next whim, leaving a graveyard of prototypes in their wake."}, {"id": 50670305, "au": "andai", "dom": 80, "sr": 6, "sc": 5.37, "ep": 5.52, "bs": 0.0, "d": 0, "age": 21.68, "grav": 297.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 18597, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 1.491, "fa": 0.0, "gp": 1.391, "bl": 0.0, "ds": 0.0, "txt": "Doesn't Claude do that too? And ChatGPT, and every BigAI? Everything you type into them goes to a remote server. That's how it works! (ChatGPT even while typing, before pressing send.)\n\n(ChatGPT now even trains on your chats by default! I had to turn this setting off, again, if memory serves me... Gemini, too and I think there you can't even turn it off... Not sure what the situation is in Claude land though.)\n\nI've heard some mathematicians becoming increasingly reluctant to type anything into a chatbot these days. Especially if they've been working on it for a few years...\n\n(Not saying this makes it better, obviously, just a bit of perspective. It's like, this service which is entirely oriented around violating my privacy, had its sanctity violated by a 3rd party violation of privacy!)"}, {"id": 50672044, "au": "fragilerock", "dom": 29, "sr": 7, "sc": 5.24, "ep": 5.54, "bs": 0.0, "d": 3, "age": 18.59, "grav": 231.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 48, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 1.484, "fa": 0.5, "gp": 0.431, "bl": 0.0, "ds": 0.0, "txt": "I don't disagree with your point here, your users are clearly trusting you with their ideas in the first place. However, the first snippet in the GitHub issue appears to show code which sends \"the user's one sentence idea\" to an endpoint, with a comment which labels it as \"telemetry 1/3\" so it seems a bit comical to me that you're denying that it's telemetry. Moreover, the last snippet shows instructions to try and hide this request from the user's safety tooling. I might be mistaken about what the code does here but surely you can see how this looks quite clandestine?"}, {"id": 50671418, "au": "SoftTalker", "dom": 51, "sr": 8, "sc": 4.61, "ep": 4.76, "bs": 0.0, "d": 3, "age": 19.83, "grav": 257.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 12, "k": 26976, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 1.238, "fa": 0.42, "gp": 0.448, "bl": 0.0, "ds": 0.0, "txt": "> You can vibe code an idea, find some users and then what?\n\nYes, I think that ironcially, AI makes it harder to do a startup. Building the idea is no longer a roadblock. Building and executing a sustainable business is everything now. There is no other filter, so you'll have more competition than ever before, including people who are now able to build software for themselves and not even look at what products exist in the marketplace.\n\nI was talking to a friend the other day who was all excited because he had made an app to handle some aspect of his retail business, and he thought he was now going to be able to sell that to others like him. I wondered why those people wouldn't just ask an AI to do that, like he had."}, {"id": 50675594, "au": "chii", "dom": 40, "sr": 9, "sc": 3.84, "ep": 3.84, "bs": 0.0, "d": 1, "age": 8.73, "grav": 71.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 20766, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 1.634, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, but the condition for this to happen is commodity hardware available to the average person, at commodity prices.\n\nCurrently, the prices are so high they're even pulling up \"unrelated\" prices like spinny hard drives (as SSD substitutions).\n\nSo the only way to reach self-hosted models (that are competitive with frontier private models) is for china to mass produce more chips and hardware at similar quality to current western ones.\n\nThe US is not going to like that, and will employ every economic sanction to try prevent it."}, {"id": 50677152, "au": "port11", "dom": 34, "sr": 10, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 1, "age": 3.48, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1338, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 1.539, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This isn’t much different from the current debauchery that takes place with, mainly, mobile apps. Our parenting app tries to connect to malware domains, only Little Snitch was able to spot that.\n\nI see Claude getting something out of Hugging Face endpoints, maybe it’s using some local model?\n\nI wouldn’t trust skills at all unless you can read them (markdown and code) or have your agent inspect them. Otherwise it’s just untrusted code."}, {"id": 50671491, "au": "solyin", "dom": 63, "sr": 11, "sc": 3.41, "ep": 3.71, "bs": 0.0, "d": 4, "age": 19.68, "grav": 254.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 845, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 1.578, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I say it because idea's aren't the hard part. Even in the age of AI, building, say, Uber but for hairdressers is still a multi-month or years worth of commitment. They gonna go to trade shows? Be on call for customer support? If all \"the idea guy\" did was to contribute that idea, and then they're sitting back and not contributing at all, then giving any significant portion of the business to them is not a good business deal.\n\nHow much is such a business partner worth?\n\nThe notion as a whole, that ideas at worthless as a whole in an armchair conversation is one thing, but usually it's more that a friend comes to me with their idea, but unless we get lawyers and NDAs and non-competes involved, we can't proceed. Usually people either balk at getting lawyers involved, or I tell them ideas are worthless - that overnight success is still the result of years for work, and then I'm able to spell out the actual work required to launch a project. Not just the coding end but all the rest of it.\n\nSo it's less about the idea being totally worthless and it's just a way to move the conversation forwards. It usually doesn't get past the stage of explaining what work is still expected of them. Sometimes it's because the ideas already been done, which goes to your original \"most people don't have original ideas\" statement though."}, {"id": 50672251, "au": "dahart", "dom": 54, "sr": 12, "sc": 3.18, "ep": 3.63, "bs": 0.0, "d": 6, "age": 18.13, "grav": 222.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 19157, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "I’d guess forever, that steady state is some percent of people have a bread machine and some (maybe larger) percent don’t. There are plenty of reasons that not everyone will end up with a bread machine, including cost & space, people being intimidated or busy or lazy and not wanting to plan. I think there are hundreds of examples out there of things that are cheaper when you DIY, and still many people don’t necessarily adopt it."}, {"id": 50671971, "au": "noAnswer", "dom": 98, "sr": 13, "sc": 3.07, "ep": 3.58, "bs": 0.0, "d": 4, "age": 18.74, "grav": 234.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 11, "k": 614, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 1.015, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> They'd permanently destroy all user trust if they started doing that\n\nName one company scandal in the history of humanity that had a long lasting negative effect on said company. \"Every news is good news\" it the truest saying ever contrived. Does the child slavery thing hurt Nestlé? No! So why would stealing ideas hurt Convex?"}, {"id": 50672685, "au": "smrtinsert", "dom": 59, "sr": 14, "sc": 2.83, "ep": 3.27, "bs": 0.0, "d": 2, "age": 16.98, "grav": 200.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2468, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.941, "fa": 0.28, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Not really.  My idea is a new search engine for example.  How cheap is that? If your idea is a calculator then yes but most non trivial projects cost money or time"}, {"id": 50671216, "au": "creato", "dom": 69, "sr": 15, "sc": 2.82, "ep": 3.26, "bs": 0.0, "d": 2, "age": 20.16, "grav": 264.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 9, "k": 6365, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.878, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Why don't LLMs flood the place with great ideas?\n\nI think they are flooding the place with great ideas. But they're also flooding the place with garbage, so it's harder for the great ideas to get visibility and traction.\n\nUnfortunately, I think reputation and influence are now even more important than they were before when it comes to gaining mind/market share. It's a step even further away from a meritocratic ideal."}, {"id": 50670659, "au": "delichon", "dom": 108, "sr": 16, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 0, "age": 21.12, "grav": 285.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 11774, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "This is disturbing and somebody should be spanked, but ... how much are naked app ideas worth? The ideas I tend to hear from people don't on average seem better than the ones that chatbots can generate in gobs."}, {"id": 50676380, "au": "BoiledCabbage", "dom": 8, "sr": 17, "sc": 2.77, "ep": 3.21, "bs": 0.0, "d": 5, "age": 5.88, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 8, "k": 6916, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.692, "fa": 0.42, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "> An \"opt-in\" model is a \"by default opted-out\" model.\n\nClose but still not quite. Yes on the meaning, not quite on the wording.\n\nOpt is to choose. A setting has a default. That default can be \"out\" or \"in\". Ie off or on. If a user can then choose the opposite setting by \"opting\" to that setting.\n\nSo it would be a \"default off\" and a user can \"opt in\".\n\nOr the opposite would be \"default on\" and a user would \"opt out\".\n\nThe specific phrase \"default opt out\" doesn't really make sense. There is a default, and you can \"opt\" for a different setting value."}, {"id": 50676175, "au": "orphea", "dom": 23, "sr": 18, "sc": 2.67, "ep": 3.11, "bs": 0.0, "d": 5, "age": 6.62, "grav": 48.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1086, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.763, "fa": 0.28, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You keep saying it backwards.\n\nThere are no \"default opt-in\" and \"default opt-out\", you don't use \"default\" with \"opt-something\".\n\n* \"Opt-in\" is a feature switched off by default, the user must enable it explicitly.\n\n* \"Opt-out\" is the opposite: switched on by default, an explicit action to switch off.\n\nThe way to say what you mean everyone would understand is: \"Opt-out for telemetry is an insult to users.\""}, {"id": 50673176, "au": "EMM_386", "dom": 92, "sr": 19, "sc": 2.66, "ep": 3.1, "bs": 0.0, "d": 1, "age": 15.84, "grav": 178.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 6858, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 1.091, "fa": 0.0, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "Not just Claude.\n\nOpenAI Codex CLI will upload websites you create to \"ChatGPT Sites\" by default.\n\nThey are all doing this. I wasn't expecting it when I saw it and had to ask the model exactly what it just did when I saw the tool calls - then ask it to remove it and ensure it doesn't happen again."}, {"id": 50673538, "au": "cortesoft", "dom": 90, "sr": 20, "sc": 2.66, "ep": 3.1, "bs": 0.0, "d": 5, "age": 14.87, "grav": 161.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 29726, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 0.978, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am specifically talking about the fact that an outgoing API call is made at all.\n\nThat is separate from being concerned about what the data sent out is being used for. Not saying you can't be upset that your chat history is being used for training, I am just saying you did know your chat history was being sent to ChatGPT"}, {"id": 50670595, "au": "MickyTheMouse", "dom": 102, "sr": 21, "sc": 2.57, "ep": 3.45, "bs": 0.0, "d": 1, "age": 21.23, "grav": 287.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 1.467, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Convex is a backend platform. These same skills download an unpinned shell script from a server and run it. The skill also tells the agent to split the download and the run into separate commands because harness safety classifiers would block a single command like that. The plugin is listed in Anthropic's official marketplace."}, {"id": 50671202, "au": "varispeed", "dom": 47, "sr": 22, "sc": 2.56, "ep": 3.22, "bs": 0.0, "d": 2, "age": 20.18, "grav": 264.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 3222, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "Implementation != execution.\n\nPeople underestimate how much work goes into things that are not implementation but are necessary for the delivery of the product.\n\nYou can vibe code an idea, find some users and then what? If it is serious then it has to provide income for you to do it full time. It has to provide enough margin to sustain the business, hire people, support, premises, legal, equipment and so on.\n\nEven finding commercial property to lease and then lease it is harder than most ideas that become a product."}, {"id": 50671789, "au": "dofm", "dom": 37, "sr": 23, "sc": 2.55, "ep": 2.92, "bs": 0.0, "d": 1, "age": 19.09, "grav": 241.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5484, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.345, "bl": 0.0, "ds": 0.0, "txt": "It always was.\n\nAs much as it is wearing-a-hair-shirt territory right now — pointless to deny it is fiddly, frustrating, fast-moving, tiring, incredibly dense, and up-front-expensive — it's so obviously worth the psychological effort to start thinking about what exerting that kind of control is going to involve."}, {"id": 50671581, "au": "user-", "dom": 41, "sr": 24, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 0, "age": 19.48, "grav": 249.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 402, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.531, "fa": 0.0, "gp": 0.74, "bl": 0.0, "ds": 0.0, "txt": "Why is the Author of the youtube 'punish' post thats on the front page of hackernews also in this issue comments promoting his personal media website page??? Im so confused"}, {"id": 50674988, "au": "KPGv2", "dom": 32, "sr": 25, "sc": 2.18, "ep": 2.62, "bs": 0.0, "d": 2, "age": 11.05, "grav": 101.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 2, "k": 1136, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.776, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> default opt-out\n\nThe term you're looking for is \"opt in\"\n\nopt-out means \"we assume you want telemetry turned on. you have to disable it yourself\"\n\n\"Opt\" here means \"to choose\" so \"opt out\" means \"you [must] choose 'out' [because it's not pre-set that way]\"\n\n\"Default opt-[anything]\" is meaningless because \"opt\" is the user choosing something, and \"default\" is the non-user choosing something. They're terms in opposition to each other.\n\nIt's like saying \"this car is default configured with your choices.\" It's not possible, because you're describing something other than a default."}, {"id": 50674839, "au": "bill10", "dom": 110, "sr": 26, "sc": 1.96, "ep": 2.62, "bs": 0.0, "d": 0, "age": 11.52, "grav": 108.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 8, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 0.695, "fa": 0.28, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "telemetry is ok but default on is just not killing the public trust. With millions of new apps/skills every day, I don't think any such project has a second chance to earn the trust back."}, {"id": 50670512, "au": "542458", "dom": 81, "sr": 27, "sc": 1.9, "ep": 2.56, "bs": 0.0, "d": 1, "age": 21.36, "grav": 290.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 7656, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.882, "bl": 0.0, "ds": 0.0, "txt": "This is like saying \"I don't know what the big deal with credit card skimmers is, weren't you trying to send your payment details out anyways?\" - there's a big difference between intentionally sending something to somebody and having it happen surreptitiously."}, {"id": 50671498, "au": "jamwt", "dom": 28, "sr": 28, "sc": 1.64, "ep": 2.97, "bs": 0.0, "d": 2, "age": 19.67, "grav": 253.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 2072, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 0.786, "fa": 0.28, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "Hi!\n\nIt’s not telemetry, it’s a feature. We generate backend code for your app based upon your prompt."}, {"id": 50671197, "au": "AnEro", "dom": 44, "sr": 29, "sc": 1.63, "ep": 2.51, "bs": 0.0, "d": 2, "age": 20.19, "grav": 265.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 736, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.526, "fa": 0.34, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "Plenty of room on implementation and execution of everything, from code to design. If it was only about ideas, General Magic would have had us with smart phones before the 2000's. If it was only about engineering, betamax would have won. It's about intuition and knowing just the right amount of everything now"}, {"id": 50670860, "au": "Loquebantur", "dom": 68, "sr": 30, "sc": 1.61, "ep": 2.49, "bs": 0.0, "d": 1, "age": 20.76, "grav": 277.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.678, "fa": 0.0, "gp": 0.62, "bl": 0.0, "ds": 0.0, "txt": "That startup-trope is particularly hilarious when looked at in the age of AI:\n\nWhy don't LLMs flood the place with great ideas?\n\nIdeas don't work the way people here imagine. A lot of things don't."}, {"id": 50673097, "au": "tomrod", "dom": 12, "sr": 31, "sc": 1.57, "ep": 2.23, "bs": 0.0, "d": 3, "age": 16.02, "grav": 182.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 18342, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.542, "fa": 0.0, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "I appreciate the note. I reread and think I said what I intended, though agree that it's unintentionally muddled for the reason you mentioned. The right pattern is that people should be in an opt-out status until they choose otherwise, and any other pattern is disrespect for users.\n\nI have a few languages bouncing around in the noggin that get mixed from time to time. I appreciate your tactful consideration."}, {"id": 50670473, "au": "6thbit", "dom": 86, "sr": 32, "sc": 1.43, "ep": 2.31, "bs": 0.0, "d": 1, "age": 21.43, "grav": 292.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1209, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 0.632, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "This is different because it's a skill doing an http POST to a server that is not related to you or the AI service provider."}, {"id": 50677349, "au": "tomrod", "dom": 24, "sr": 33, "sc": 1.33, "ep": 2.21, "bs": 0.0, "d": 6, "age": 3.1, "grav": 18.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 18342, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.601, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I fail to parse it the way you are parsing it.\n\nFor the sake of ending a conversation thread focused on the wrong target, the default for telemetry should be off."}, {"id": 50677974, "au": "Tanjreeve", "dom": 56, "sr": 34, "sc": 1.31, "ep": 2.41, "bs": 0.0, "d": 6, "age": 2.14, "grav": 12.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 347, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 1.024, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "And yet people still go to bakeries. Hell good/hyped bakeries still have queues round the block in many major cities. This homos economicus  thing consistently doesn't seem to survive contact with the world outside of tech podcasts."}, {"id": 50673052, "au": "lxgr", "dom": 39, "sr": 35, "sc": 1.23, "ep": 2.63, "bs": 0.0, "d": 1, "age": 16.11, "grav": 183.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "What difference would that make here? If a remote inference agent can be convinced to exfiltrate your data (whether that’s a skill working as designed or maliciously), so could your agent powered by a self-hosted model, no?"}, {"id": 50670859, "au": "TZubiri", "dom": 66, "sr": 36, "sc": 1.02, "ep": 2.35, "bs": 0.0, "d": 1, "age": 20.76, "grav": 277.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2193, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.598, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "I think so too, but simultaneously, if I work with someone who doesn't believe that their ideas are cheap, I should still take care of them.\n\nIgnoring someone's beliefs and acting upon your own is like a 5 year old moral blunder. If my friend or a client believes his stones carry spiritual energy, I'm behaving as if those stones carried spiritual energy. You can always choose not to engage with that person if you want, but if you engage you respect their rules."}, {"id": 50671466, "au": "Loquebantur", "dom": 70, "sr": 37, "sc": 0.95, "ep": 2.06, "bs": 0.0, "d": 3, "age": 19.73, "grav": 255.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.874, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You fail to notice, the central problem with \"ideas\" always was how to judge them.\n\nArbitrary (bad) ideas are cheap and always have been.\n\nGood ones never were and aren't now.\n\nReputation is a very flawed proxy to make proper judgement of ideas, that hasn't changed."}, {"id": 50677826, "au": "dash-44", "dom": 6, "sr": 38, "sc": 0.94, "ep": 2.04, "bs": 0.0, "d": 5, "age": 2.35, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 51, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.527, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Defaulted opt-in\" is an oxymoron, it doesn't make any sense.\n\nYou either have:\n\nTelemetry is disabled by default, and the user has to opt-in. The telemetry is opt-in.\n\nTelemetry is enabled by default, and the user has to opt-out. The telemetry is opt-out."}, {"id": 50674635, "au": "jack_pp", "dom": 99, "sr": 39, "sc": 0.8, "ep": 2.34, "bs": 0.0, "d": 5, "age": 12.16, "grav": 118.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 2096, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I was not saying it would hurt convex, I'm saying if proven without a doubt the big players are stealing their users ideas it would hurt them.\n\nI would trust a small player less because they have more to gain from stealing and less to lose"}, {"id": 50677498, "au": "Mawr", "dom": 58, "sr": 40, "sc": 0.77, "ep": 2.31, "bs": 0.0, "d": 4, "age": 2.9, "grav": 17.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 22, "k": 1595, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.475, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> including people who are now able to build software for themselves and not even look at what products exist in the marketplace\n\nWoah, both of them? You're in a bubble if you think your average Joe is going to be building himself anything, much less maintaining it long-term, AI or not."}, {"id": 50674970, "au": "Imustaskforhelp", "dom": 79, "sr": 41, "sc": 0.51, "ep": 3.59, "bs": 1.99, "d": 1, "age": 11.1, "grav": 102.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 2888, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": ["https://smileplease.mataroa.blog/blog/i-dont-want-brand-age-i-want-authenticity-age/"], "ig": 0.777, "fa": 0.62, "gp": 0.0, "bl": 0.75, "ds": 0.0, "txt": "Authenticity and trust are definitely gonna be more valuable within the future. Talking to people, it's just the feeling that I get sometimes.\n\nA blog post which I had written sometime ago about it: https://smileplease.mataroa.blog/blog/i-dont-want-brand-age-..."}, {"id": 50675461, "au": "amstan", "dom": 16, "sr": 42, "sc": 0.48, "ep": 1.8, "bs": 0.0, "d": 5, "age": 9.22, "grav": 77.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 297, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.501, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No, I think this is one of those \"You can't make someone understand something their paycheck depends on them not understanding\" things. You're trying to argue ethics of having the default be not uploading, maybe a setting for uploading with someone that wants the default to be upload EVERYTHING. I'm not surprised there's misleading misnomers being thrown around in order to make that evilness appear less evil."}, {"id": 50673764, "au": "Aurornis", "dom": 38, "sr": 43, "sc": 0.36, "ep": 1.68, "bs": 0.0, "d": 1, "age": 14.18, "grav": 150.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 65614, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.6, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "This occurred in a skill file. It would have been triggered if you used a self-hosted, open weight model, too.\n\nThe POST request was not going back to the model provider."}, {"id": 50672940, "au": "jasonlotito", "dom": 82, "sr": 44, "sc": 0.26, "ep": 1.8, "bs": 0.0, "d": 2, "age": 16.36, "grav": 188.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 4, "k": 8159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_prompt", "flbl": "Code & Prompt (Agent)", "urls": [], "ig": 0.707, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "> This is like saying...\n\nAmex is getting your purchase data every time you make a purchase and it knows where you are shopping."}, {"id": 50673197, "au": "echoangle", "dom": 14, "sr": 45, "sc": 0.25, "ep": 1.79, "bs": 0.0, "d": 4, "age": 15.81, "grav": 178.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 5372, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.261, "fa": 0.28, "gp": 0.261, "bl": 0.0, "ds": 0.0, "txt": "That’s not what opt out means. You want telemetry to be an opt-in feature. I don’t think anyone says “default opt-out status” for that."}, {"id": 50676552, "au": "ps2802", "dom": 33, "sr": 46, "sc": 0.17, "ep": 3.49, "bs": 2.52, "d": 0, "age": 5.27, "grav": 35.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 1.382, "fa": 0.0, "gp": 0.169, "bl": 0.95, "ds": 0.0, "txt": "We're building in the enterprise AI space and this is exactly the kind of thing that comes up in conversations with banks or even fintech security teams.\n\nThe issue isn't necessarily where the data goes or how long its retained. Its whether the developer even know its leaving their machine - With the number of 3rd-party skills we're all installing these days, I wonder if skills needs something equivalent to mobile app permissions. Explicit visibility into what they can access and where they can send it before execution"}, {"id": 50675901, "au": "kukkeliskuu", "dom": 64, "sr": 47, "sc": 0.16, "ep": 1.7, "bs": 0.0, "d": 5, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 747, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are many separate things you are conflating:\n\n(1) the value of ideas. It is obvious from hindsight that some ideas are more profitable business ideas, and there many more ideas that are not so great.\n(2) Execution is extremely important. Without execution, the idea is worthless.\n(3) Inventors value their ideas much higher than others. That is a known phenomena.\n(4) Some inventors may mess up their idea by being too protective, requiring NDAs etc.\n\n(2) and (3) and (4) do not prove (1) wrong.\n\nMost ideas are crap, and people think that their \"Über for hairdressers\" is somehow revolutionary. But there are genuinely great ideas as well, and they are immediately recognizable as something that makes sense.\n\nAt least 3 ideas have been \"stolen\" from me, and then messed up because they did not understand the idea well enough, and that is because they did not invent it."}, {"id": 50670836, "au": "leobuskin", "dom": 43, "sr": 48, "sc": 0.12, "ep": 2.86, "bs": 1.19, "d": 1, "age": 20.8, "grav": 278.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 365, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.512, "fa": 0.0, "gp": 1.141, "bl": 0.45, "ds": 0.0, "txt": "That was true in a previous epoch(s). In the current one - ideas are everything, because an ability to implement is equalizing."}, {"id": 50675919, "au": "kukkeliskuu", "dom": 109, "sr": 49, "sc": 0.06, "ep": 1.31, "bs": 0.0, "d": 1, "age": 7.53, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 747, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.557, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Maybe people don't share their best ideas, maybe those people with the best ideas don't share their ideas in general, and maybe there are only some gems even in the ideas you hear, you cannot value it based on averages?"}, {"id": 50670933, "au": "marginalia_nu", "dom": 61, "sr": 50, "sc": 0.05, "ep": 1.59, "bs": 0.0, "d": 2, "age": 20.61, "grav": 274.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 26393, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.676, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If implementation costs nothing then neither does ideas.  What's historically prevented copying of has primarily been the cost of execution.  The supposed first mover's advantage is mostly a myth outside of rare winner takes all markets.\n\nPatents exist too I guess, but if you wait for patent registration someone else will definitely have already taken your idea to market before you've patented it."}, {"id": 50677773, "au": "dash-44", "dom": 11, "sr": 51, "sc": -0.01, "ep": 1.53, "bs": 0.0, "d": 5, "age": 2.44, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 51, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.311, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah not sure why there's so much confusion by this.\n\nTelemetry being 'opt-in' means it's disabled by default and you need to change something to turn it on."}, {"id": 50670901, "au": "marginalia_nu", "dom": 83, "sr": 52, "sc": -0.06, "ep": 1.27, "bs": 0.0, "d": 2, "age": 20.68, "grav": 275.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 26393, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 0.461, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "I think they're saying the AI labs also use your stuff for training and other unspecified uses.  It's extraction economy all the way down.  Technically the payment processors do subsist on skimming off the top on each transaction so the analogy isn't that far off."}, {"id": 50670985, "au": "wiether", "dom": 95, "sr": 53, "sc": -0.17, "ep": 1.38, "bs": 0.0, "d": 2, "age": 20.54, "grav": 272.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1970, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.585, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "On the other hand, they're in the perfect position to start sherlocking every business idea that is submitted to their models.\n\nNot only they work with virtual resources, but they also don't need human workforce to build and operate anything.\n\nThey can even promote their own version to their users while voluntarily slowing the progress of competitors if they keep relying on their models.\n\nAmazon & AliExpress would love to be in this situation!"}, {"id": 50671431, "au": "quantum_state", "dom": 35, "sr": 54, "sc": -0.3, "ep": 2.75, "bs": 1.19, "d": 0, "age": 19.8, "grav": 256.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 387, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.355, "fa": 0.0, "gp": 1.321, "bl": 0.45, "ds": 0.0, "txt": "This says self hosted open weight model is the way to go in the long run ..."}, {"id": 50673264, "au": "kukkeliskuu", "dom": 73, "sr": 55, "sc": -0.34, "ep": 1.2, "bs": 0.0, "d": 1, "age": 15.67, "grav": 175.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 747, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.458, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "Only people with cheap ideas think like that -- and venture capitalists. People have been sold this lie so that they would share their best ieas freely. Most people have very bad ideas, and they think bad ideas and good ideas are almost the same. But good (business) ideas are very different from bad (business) ideas."}, {"id": 50670806, "au": "cowlevel", "dom": 84, "sr": 56, "sc": -0.34, "ep": 1.3, "bs": 0.0, "d": 2, "age": 20.88, "grav": 279.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 0.463, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "it's not surreptitious, it's the entire point of the thing. It's like saying \"I don't get what the big deal is with POS terminals sending my credit card data to the merchant's bank\""}, {"id": 50671279, "au": "andai", "dom": 89, "sr": 57, "sc": -0.34, "ep": 2.66, "bs": 1.59, "d": 4, "age": 20.08, "grav": 262.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 3, "k": 18597, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_send", "flbl": "Chatgpt & Send (Claude)", "urls": [], "ig": 1.133, "fa": 0.0, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": ">without telling them\n\nI certainly wasn't informed that ChatGPT has been training on my chats for the last several years. I remember checking that a while back, and I'm assuming it's changed in the meantime.\n\nI remember learning that Gemini does that, and feeling smugly superior for using ChatGPT, since I remember opting out of that. But it turns out, ChatGPT just been doing the same shit the whole time without my knowledge or consent. (I'm assuming they switched the toggle back at some point, as I've seen companies do in the past, but I don't know.)\n\nBut yeah, the whole thing is my fault for not being able to afford local AI in the first place :)"}, {"id": 50671540, "au": "skydhash", "dom": 57, "sr": 58, "sc": -0.34, "ep": 2.23, "bs": 1.19, "d": 4, "age": 19.57, "grav": 251.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 6797, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.399, "fa": 0.0, "gp": 0.894, "bl": 0.45, "ds": 0.0, "txt": "Building the idea was never the roadblock if you had the execution means. Hiring expertise was fairly trivial when compared to actually organizing everything."}, {"id": 50672774, "au": "taneq", "dom": 18, "sr": 59, "sc": -0.34, "ep": 0.97, "bs": 0.0, "d": 3, "age": 16.77, "grav": 195.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 30078, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.336, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "Apparently a bunch of people decided that “opt-in” now just means that there’s a check box that needs to be checked for the thing to happen, and that it is fine for that box to be checked by default."}, {"id": 50676387, "au": "ptx", "dom": 10, "sr": 60, "sc": -0.34, "ep": 0.95, "bs": 0.0, "d": 5, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5245, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.224, "fa": 0.0, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "But there is no opting going on by default. You get the default choice before you have an opportunity to opt. That's why \"opted by default\" doesn't make any sense.\n\nOpting is what you do after considering the default. If the default is in, then you can opt out and this case can be called opt-out."}, {"id": 50671614, "au": "SoftTalker", "dom": 53, "sr": 61, "sc": -0.34, "ep": 1.76, "bs": 0.85, "d": 5, "age": 19.41, "grav": 248.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 26976, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.414, "fa": 0.0, "gp": 0.54, "bl": 0.32, "ds": 0.0, "txt": "But now people have bread machines, and they don't even have to load them with ingredients or clean them afterwards, they can just say \"make me some bread\" and it produces bread, and much more cheaply than buying it ready-made.\n\nThere's some inertia and habits that will keep people going to the market for a while, but how long can that last?"}, {"id": 50671520, "au": "varispeed", "dom": 52, "sr": 62, "sc": -0.34, "ep": 2.04, "bs": 1.19, "d": 4, "age": 19.62, "grav": 252.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 15, "k": 3222, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "business_age", "flbl": "Business & Age (Models)", "urls": [], "ig": 0.314, "fa": 0.0, "gp": 0.895, "bl": 0.45, "ds": 0.0, "txt": "> I wondered why those people wouldn't just ask an AI to do that, like he had.\n\nMy favourite analogy is that recipe for bread is known, yet people still go to bakery."}, {"id": 50672825, "au": "taneq", "dom": 48, "sr": 63, "sc": -0.34, "ep": 0.82, "bs": 0.0, "d": 3, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 30078, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "implementation_everything", "flbl": "Implementation & Everything (Execution)", "urls": [], "ig": 0.35, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The biggest surprise for me in starting a business was just how little of your time and energy is spent doing the thing that your business “does”. It’s everything else that takes the time."}, {"id": 50673515, "au": "OJFord", "dom": 4, "sr": 64, "sc": -0.34, "ep": 0.8, "bs": 0.0, "d": 3, "age": 14.94, "grav": 163.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 24408, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "default_optin", "flbl": "Default & Opt-in (Telemetry)", "urls": [], "ig": 0.276, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "You're both wrong, you mean 'opt-in', i.e. any opting that you do is to get 'in' to the programme.\n\nOpt-out means you have to elect to be out, and 'default[ed] opt-[anything]' just doesn't really make sense and requires inferring the intended meaning from context.\n\n(Because the default is inherently always the opposite of what you have to opt for.)"}, {"id": 50671150, "au": "throwaway132448", "dom": 62, "sr": 65, "sc": -0.34, "ep": 0.7, "bs": 0.0, "d": 3, "age": 20.25, "grav": 266.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 369, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "busines
