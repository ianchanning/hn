mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.179, "fa": 0.0, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "I do to (Europe based) and would have hoped it's the only possibility, but it seems that some transactions can still go through without that. I found out when I noticed some ~5 euro suspect transactions, called the bank, they said \"oh, yeah, this was without MFA (me: what?! can we you do that) will send you another card\". So watch-out, just because you get asked a code for some transactions it doesn't mean it would appear for all."}, {"id": 50672524, "au": "shakesbeard", "dom": 259, "sr": 80, "sc": 3.26, "ep": 3.47, "bs": 0.0, "d": 0, "age": 17.5, "grav": 209.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 174, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "PCI DSS requirement 11.6.1 actually requires every merchant to monitor scripts and headers on their payment pages to combat magecart/skimming attacks. So best to use a hosted solution or one that solves this for you (e.g. Stripe Elements)."}, {"id": 50670146, "au": "wat10000", "dom": 197, "sr": 81, "sc": 3.26, "ep": 3.47, "bs": 0.0, "d": 4, "age": 21.96, "grav": 304.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 7079, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The side showing the ads should be fully responsible. It’s their site, after all. If they want to pin the blame on someone else then they can sue to recover damages afterwards, but that should be a separate issue. Ford doesn’t get to say “oh, our faulty brakes were made by Bosch, go after them, we have no responsibility.” Why should web sites be any different?"}, {"id": 50669109, "au": "fidotron", "dom": 26, "sr": 82, "sc": 3.26, "ep": 3.46, "bs": 0.0, "d": 1, "age": 23.37, "grav": 337.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 12973, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.354, "fa": 0.0, "gp": 0.194, "bl": 0.0, "ds": 0.0, "txt": "I do think it's fair to say if you were inventing WebRTC today the entire P2P and STUN/TURN aspect of it would need to go. (mdns also seems like a technology from a more naive time).\n\nThe MoQ people are annoying, but in one respect they are right, and that is that having browsers have channels of communication outside of the usually expected HTTP is a recipe for trouble."}, {"id": 50671482, "au": "criley2", "dom": 167, "sr": 83, "sc": 3.26, "ep": 3.34, "bs": 0.0, "d": 4, "age": 19.75, "grav": 255.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4735, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Your browser Claude can only get access to all of your Mac files if you practice the shockingly bad pattern of giving an agent access to all of your files on your personal computer.\n\nAgents in the cloud only, coordinated from anywhere.\n\nIt's not dangerous to have agents with full access to an ondemand VM. Well, it's much less dangerous..."}, {"id": 50672009, "au": "lxgr", "dom": 87, "sr": 84, "sc": 3.26, "ep": 3.3, "bs": 0.0, "d": 2, "age": 18.7, "grav": 233.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "A seemingly elegant justification for the status quo, but I don't think it's actually true. (I do think that the ideal amount of fraud is greater than zero, but it's probably much lower than current numbers too.)\n\nI think it's rather a collective action problem: If all issuers were to make card payments just a little bit more secure (and in the process less convenient too), consumers would have no choice but adapt. But since it's in each issuer's individual interest to keep that dial just a liiitle bit more to the \"convenient but insecure\" position than their competitors, the only equilibrium ends up being everybody approving as much fraud as they can accept. A very similar consideration applies on the merchant side.\n\nUnregulated markets do often produce optimal solutions, but that doesn't mean that literally every solution they produce is also optimal."}, {"id": 50673346, "au": "BenjiWiebe", "dom": 78, "sr": 85, "sc": 3.23, "ep": 3.23, "bs": 0.0, "d": 6, "age": 15.47, "grav": 172.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 2965, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.375, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Then it's improved since I had money stolen via my debit card.  I had to have an appointment with the banker at the bank and fill out paperwork, and got the money back a couple weeks later.\n\nI've had my credit card number stolen once, and another time a single fraudulent transaction, and both times it was super easy and very fast to get my money back."}, {"id": 50669550, "au": "brewdad", "dom": 57, "sr": 86, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 3, "age": 22.78, "grav": 323.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 4583, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have only ever had to do it while making an online purchase from overseas with my US card, like museum tickets while on vacation.\n\nOne time, I couldn’t receive the 2FA code, so had to try a different card until I didn’t need such a code. Two of the other three times I can recall, the entire transaction was declined before I received the code. One I was able to try again after submitting the code. The other time I simply abandoned the transaction."}, {"id": 50672901, "au": "59percentmore", "dom": 136, "sr": 87, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 3, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 239, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "White collar crime needs to be punished more harshly. It's a culture of lawlessness that leads to this kind of hubris. Officials need to take a \"broken windows\" approach, and once executives are going to prison for data leaks and wage theft, maybe they'll start to care.\n\n(I can't tell how much I'm joking here.)"}, {"id": 50669630, "au": "forgetfreeman", "dom": 104, "sr": 88, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 1, "age": 22.64, "grav": 319.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2373, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Is that the crazy part here? Global annual losses from online fraud and cybercrime is north of a trillion USD, or if you prefer the GDP of Saudi Arabia. What seems in need of justification is the broad availability of electronic funds transfers."}, {"id": 50672212, "au": "amluto", "dom": 186, "sr": 89, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 6, "age": 18.25, "grav": 224.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Right now I think no one is liable if no data was actually exfiltrated and no systems were actually accessed without permission.\n\nI’m suggesting that negligently leaving one’s digital door open be treated as if someone went in and robbed someone regardless of whether this actually occurred.  And that the entity leaving the door open be jointly liable with the robber."}, {"id": 50669849, "au": "dboreham", "dom": 244, "sr": 90, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 1, "age": 22.36, "grav": 313.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 18272, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.322, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To make more money, the site owner allowed mystery-meat code to be loaded onto their payment page. Normally that code is effectively sandboxed, but the attacker figured out how to evade the sandboxing. The attacker only had to pay (via an intermediary) to get their payload onto the page."}, {"id": 50676127, "au": "pcthrowaway", "dom": 42, "sr": 91, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 4, "age": 6.82, "grav": 50.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.099, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I know that's common where I live (Canada) but has that rolled out in the U.S. finally? I was under the impression cards there still just had the magnetic strip that afaik is just sending roughly the equivalent of entering the printed card details?"}, {"id": 50669251, "au": "techjamie", "dom": 76, "sr": 92, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 4, "age": 23.19, "grav": 332.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.219, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "That's part of why I don't typically use a debit card. A bad transaction on a debit card can still be your problem and take some doing to fight. If I get defrauded on my credit card, a chargeback is a click away, and Mastercard will make the money the vendor's problem to work out.\n\nFortunately I've never been defrauded, but my dad was once via his debit and it was a pain."}, {"id": 50671860, "au": "kccqzy", "dom": 101, "sr": 93, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 3, "age": 19.02, "grav": 240.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 20184, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "From my own experience Apple Pay is hard to use for all transactions that are recurring. I haven’t looked deeply into it to determine whether it’s my bank or Apple Pay itself, but basically all recurring transactions I set up with Apple Pay start to be declined long before the actual expiration of the card. Monthly subscriptions seem to be better, but yearly subscriptions are terrible: I’ve never had a merchant successfully process my subscription renewal during the second year if I’m using Apple Pay."}, {"id": 50671533, "au": "allthetime", "dom": 142, "sr": 94, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 19.63, "grav": 253.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 623, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.834, "fa": 0.0, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "Who does? They are uninformed and not worth taking seriously. Sketchy ad servers are the number one vector for malware on the browser."}, {"id": 50669379, "au": "K0nserv", "dom": 24, "sr": 95, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 4, "age": 23.0, "grav": 328.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5347, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it might. With a cooperating peer on an internet-routable IP address using ICE-lite you can use a static answer and it should still be possible for ICE to establish.\n\nHaven't tried but in theory it should work.\n\nYou can apparently block WebRTC with `Content-Security-Policy: webrtc 'block'`"}, {"id": 50676923, "au": "hobo123", "dom": 113, "sr": 96, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 2, "age": 4.1, "grav": 25.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 379, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.279, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Maybe it's time to reboot. Just like \"Google AMP\" tried to reinvent pages that aren't slow as molasses, we could invent \"secure websites\" that run without JS, or only with whitelisted standard frameworks and make it a thing. Browsers would only enable payment stuff on those secure websites and display a super green icon."}, {"id": 50672978, "au": "h1srf", "dom": 72, "sr": 97, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 3, "age": 16.33, "grav": 187.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 137, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some Baader-Meinhof going on here. Yesterday I got a text message with a pin from Amex when paying for a large purchase. I vaguely remember a Verified by Visa action earlier this year when purchasing European train tickets while I was still in the US. So my completely anecdotal conclusion is that they do when they deem it suspicious: out of the ordinary large purchase, online non-USD purchase(maybe travel related and not being shipped to you) etc."}, {"id": 50668876, "au": "miniwark", "dom": 241, "sr": 98, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 0, "age": 23.72, "grav": 345.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 330, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.534, "fa": 0.0, "gp": 1.188, "bl": 0.0, "ds": 0.0, "txt": "I did not understand all: How did this land on the affected websites in the first place ?"}, {"id": 50674764, "au": "pampas", "dom": 161, "sr": 99, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 1, "age": 11.8, "grav": 112.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 137, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "I have ads on my site and my agency wants me to drop safe frames to get higher CPMs. No way I'm doing that! Firstly it wastes my time dealing with many complaints about rogue ads so I don't believe it's profitable. And even if it was the security concerns are not worth it."}, {"id": 50669000, "au": "coldfloor", "dom": 275, "sr": 100, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 23.52, "grav": 340.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 52, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.25, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ironically the same reason businesses keep pushing you to go mobile and download the app, please: Far harder for users to audit, far less likely for users to have content blockers in place."}, {"id": 50676621, "au": "akoboldfrying", "dom": 159, "sr": 101, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 5, "age": 5.02, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 199, "qw": 0, "k": 2090, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.902, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You are depriving them of the ad revenue that they ask for as part of the implicit contract that they offer on their site. (This ad revenue may be literally necessary to keep the site running at all. Note that this is not critical to my argument that it is unethical, which is based only on the concept of a contract; it is, however, a reason why a purely self-interested person might rationally choose to honour the contract anyway -- specifically, because if everyone likewise chose not to honour it, there would be much less free (as in no-money-required) stuff available overall.)\n\nThe ethical options for a site visitor are to take the site owner's implicit contract or leave it. That is, to consume the content and tolerate the ads (that is, \"pay with their attention\"), or to not consume the content. The fact that enforcing this contract is hard to do, and in fact easily evaded by sufficiently technical people, doesn't affect whether or not violating it is ethical. If it were not possible to build a decent bike lock, it would still be a crime to steal a bike, because the ethics of an act are not contingent on whether enforcement is technically possible."}, {"id": 50670151, "au": "eptcyka", "dom": 287, "sr": 102, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 0, "age": 21.96, "grav": 304.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 5432, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.113, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "Isn’t iframe isolation supposed to solve this? Oh wait, isolation.\n\nI nominally put a lot of trust in KVM to isolate guests, but if we can’t isolate web contexts from one another, what hope can we have for whole simulated CPUs?"}, {"id": 50671441, "au": "SoftTalker", "dom": 89, "sr": 103, "sc": 2.85, "ep": 3.7, "bs": 0.85, "d": 3, "age": 19.82, "grav": 256.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 26976, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.132, "bl": 0.32, "ds": 0.0, "txt": "Whatever amount is worth dealing with to have a smooth and easy online purchasing experience, since a fraud-free one would have more friction (edit to add: and likely higher fees/costs).\n\nThat varies by individual of course but we're talking about consumers as a group here."}, {"id": 50674952, "au": "IlikeMadison", "dom": 293, "sr": 104, "sc": 2.82, "ep": 2.82, "bs": 0.0, "d": 1, "age": 11.21, "grav": 104.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 181, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.201, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yes, as Apple Pay only shares a single usage token per transaction that doesn't even look like your actual credit card number/cvv anyway.\n\nit would only affect people entering their card credentials manually."}, {"id": 50673048, "au": "heresie-dabord", "dom": 205, "sr": 105, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 16.17, "grav": 184.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 25, "k": 4589, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.42, "fa": 0.64, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It amazes me that ad companies are allowed to let anyone with a few dollars shove arbitrary JavaScript/assets down the throats of the wider internet.\n\nIt is unclear to my why the Internet would somehow be immune to monetisation, organised crime, and the worst tendencies of human nature.\n\nBecause we can see that by any measure, it is not immune."}, {"id": 50669367, "au": "mitchweaver", "dom": 280, "sr": 106, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 0, "age": 23.01, "grav": 328.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "Google and Mozilla were still busy high-fiving each other after removing the TLS \"lock\" icon from their browsers to notice that WebRTC could be an attack vector.\n\nWhy would those features need to be enabled in an e-commerce checkout cart?"}, {"id": 50674817, "au": "pampas", "dom": 277, "sr": 107, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 3, "age": 11.64, "grav": 110.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 137, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have to add to your complaint. The spam to download the apps is awful. Somehow the Reddit website can take over my iPhones browser fullscreen with a \"install the app\" banner and the only way to dismiss it is to go to the home screen."}, {"id": 50678689, "au": "forgetfreeman", "dom": 110, "sr": 108, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 5, "age": 0.94, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2373, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"and no more secure\"\n\nlol what? The crypto exchange family of thefts alone puts the lie to that and that's without even scratching the surface of what's possible with light automation and a purchased card dump. While check fraud is sort of a thing having to be physically present (and likely on camera) to present it has historically placed a pretty hard upper bound on what was possible there."}, {"id": 50672253, "au": "schaefer", "dom": 223, "sr": 109, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 2, "age": 18.17, "grav": 223.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1717, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "Are you aware the FBI has issued a notice to all Americans, telling them block ads because of the unmitigated threat of malware?\n\nIf there’s a social contract being broken, it’s the ad networks, not the ad blockers in the wrong at the moment.\n\nLet them clean up their act, and start rebuilding trust and the balance might change."}, {"id": 50671756, "au": "dpkirchner", "dom": 198, "sr": 110, "sc": 2.69, "ep": 2.69, "bs": 0.0, "d": 5, "age": 19.17, "grav": 243.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2337, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "As far as making the user whole, I agree that the site should be responsible. However, criminal charges should be spread throughout due to the fraud or damage."}, {"id": 50673787, "au": "Groxx", "dom": 71, "sr": 111, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 6, "age": 14.15, "grav": 149.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 21177, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It pretty frequently seems to be middle-layer rejections that don't understand extra checks, yeah.  Multiple silent rejections I've had turned out to be my credit card requiring 3DS."}, {"id": 50673445, "au": "fc417fc802", "dom": 70, "sr": 112, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 5, "age": 15.17, "grav": 166.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 5831, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.128, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No, this is either a technical problem with the payment network or it's the vendors not doing their jobs properly. All the payment providers that I've used in the US are definitely capable of at least SMS and app based verification (if not also TOTP and various others). They can also manually nerf the fraud checks temporarily if you call customer service after having a payment declined by the processor themselves.\n\nThe problem is sometimes vendors just drop the transaction on their end and lie to you that it was declined."}, {"id": 50670331, "au": "wat10000", "dom": 202, "sr": 113, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 6, "age": 21.68, "grav": 297.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7079, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.125, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you go to a shopping site and you buy something and it’s defective, that’s like a dealership selling you a faulty car. If you go to a shopping site and the site itself is defective and defrauds you, that’s more like a dealership having a crooked salesperson who rips you off. The dealership would be responsible for that."}, {"id": 50676886, "au": "fidotron", "dom": 32, "sr": 114, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 7, "age": 4.21, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 12973, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.108, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Work in videogames for two minutes and try to hold that opinion afterwards. Or, for that matter, make a slightly controversial post on here.\n\nI'd prefer the world like yours and one where mdns was reasonable because we could trust everything on our subnets not to be using it to spy on us, but that's not the reality we occupy anymore. (TBH I find the entire need for security utterly tedious)."}, {"id": 50675179, "au": "t-3", "dom": 152, "sr": 115, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 6, "age": 10.32, "grav": 91.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 4742, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Free software is equivalent to a gift to the world, almost nobody asks for money. A very, very, very small proportion of FOSS development is supported by charity. Probably far less than the amount paid for by corporations who use FOSS."}, {"id": 50675731, "au": "pmontra", "dom": 262, "sr": 116, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 1, "age": 8.27, "grav": 66.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 24, "qw": 0, "k": 17845, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": ["https://addons.mozilla.org/en-US/firefox/addon/happy-bonobo-disable-webrtc/", "https://addons.mozilla.org/en-US/firefox/addon/webrtc-control/"], "ig": 1.061, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The two Firefox extensions I know about block WebRTC globally\n\nhttps://addons.mozilla.org/en-US/firefox/addon/happy-bonobo-...\n\nhttps://addons.mozilla.org/en-US/firefox/addon/webrtc-contro...\n\nI would like Firefox to expose a per site scoped API like for camera and audio access."}, {"id": 50673419, "au": "fc417fc802", "dom": 64, "sr": 117, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 4, "age": 15.23, "grav": 168.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 5831, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.053, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How frustrating but it explains prior experience for me. Several times I've had a payment \"declined\" but no message from the bank and when I call they don't see it on their end.\n\nIt's completely absurd. Processing payments and figuring out fraud is the payment processors responsibility - leave it to them, you aren't going to be able to do it correctly! Are vendors not able to flag suspected fraud when sending a transaction to the processor?"}, {"id": 50676777, "au": "calgoo", "dom": 7, "sr": 118, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 4.49, "grav": 29.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1972, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "I would say that sites should lock down their third party imports instead of just trusting remote locations by default."}, {"id": 50670576, "au": "sufianrhazi", "dom": 12, "sr": 119, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 21.3, "grav": 289.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 12, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "Also, WebRTC is really hard to inspect even with devtools. Chrome DevTools just doesn't surface WebRTC connections or data transfer at all. There's just chrome://webrtc-internals/ and chrome://webrtc-logs/ which are very hard to use."}, {"id": 50673863, "au": "pants2", "dom": 126, "sr": 120, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 2, "age": 13.98, "grav": 146.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3924, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.484, "fa": 0.34, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "The $6B Binance hack happened in part because a developer there clicked a Google ad to \"Install Homebrew\" and that led them to download malware."}, {"id": 50671169, "au": "hathawsh", "dom": 173, "sr": 121, "sc": 2.44, "ep": 3.28, "bs": 0.85, "d": 4, "age": 20.27, "grav": 266.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 2874, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.212, "bl": 0.32, "ds": 0.0, "txt": "We should expect some AI companies to have misaligned incentives also. Your AI might not inject malware, but someone else's might.\n\nI can see what you're saying. I think you're saying that not only is it ridiculous that companies allow ad providers to modify their page in arbitrary ways, it's wrong that we ever got into this situation by making JS so powerful. Yeah, I'm with you there. I just don't think that asking everyone to figure out how to solve this on their own (using AI) is a viable solution."}, {"id": 50674273, "au": "est", "dom": 261, "sr": 122, "sc": 2.42, "ep": 2.42, "bs": 0.0, "d": 0, "age": 13.1, "grav": 132.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 9604, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.976, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "You can disable jabberscript, cookie per website, but you CAN NOT disable WebRTC nor parts of WebRTC.\n\nCan browser vendors explain the motivation here?"}, {"id": 50669645, "au": "dpkirchner", "dom": 196, "sr": 123, "sc": 2.38, "ep": 2.38, "bs": 0.0, "d": 3, "age": 22.61, "grav": 319.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2337, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The advertising company should be ultimately responsible, however the ad network and especially the site showing the ads needs to face repercussions as well. Until we start prosecuting publishers for hosting malware the ad blocker will stay up."}, {"id": 50676762, "au": "ChaosOp", "dom": 3, "sr": 124, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 1, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 188, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.861, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "This is hardly the answer, WebRTC is used by many different non-conferencing sites. Games is a big one but there are others as well like live broadcasting"}, {"id": 50668909, "au": "TheRealPomax", "dom": 46, "sr": 125, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 1, "age": 23.66, "grav": 344.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 8257, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.554, "fa": 0.0, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "I don't know about your banks, but if I use my credit card to pay for something online, I have to entire an MFA code before that payment goes through."}, {"id": 50675721, "au": "LegitShady", "dom": 233, "sr": 126, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 1, "age": 8.31, "grav": 66.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2999, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.989, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The only people I've heard get sanctimonious about blocking ads directly benefit from them - either using ads on their sites or working for ad centric firms.\n\nIt is safe to ignore self interest pretending to talk about morality."}, {"id": 50669973, "au": "eddythompson80", "dom": 213, "sr": 127, "sc": 2.32, "ep": 3.17, "bs": 0.85, "d": 3, "age": 22.21, "grav": 309.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.347, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I guarantee you it won't. Actual malware (though I guess the disagreement might be on how we define malware) served through known ad networks that have been included in uBlock Origin's default ad block lists happens, but is rare. It can hardly be described as \"disproportionately committing crimes\".\n\nAgain, if you don't do some create redefining of \"committing crimes\" as \"well, they noted down the profile of the person who answered the door, a quick survey of everything they could see and hear in the house, conducted a quick psychological assessment on the personality of the person answering and determined that they are more likely to buy a toilet plunger in the next 2 months\" and that's a crime."}, {"id": 50669231, "au": "TazeTSchnitzel", "dom": 23, "sr": 128, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 3, "age": 23.22, "grav": 333.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 27293, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The article says that can only block the part of the WebRTC setup process that requires an HTTP request, though? So I wonder if it is possible for a WebRTC request to be set up with no external HTTP request at all."}, {"id": 50670744, "au": "rsync", "dom": 224, "sr": 129, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 2, "age": 21.02, "grav": 283.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 24682, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.914, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "There is no sanctimony.\n\nNo serious person is sanctimonious about ad blockers.\n\nIn your analogy, I put the sign in front of my house because fuck you, that’s why.\n\nSame with my web browser."}, {"id": 50672275, "au": "buzer", "dom": 187, "sr": 130, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 6, "age": 18.12, "grav": 222.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 1372, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 0.919, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Making everyone in the chain jointly liable in regards to end user solves the issue of figuring out who exactly you need to sue and being able to show they were precisely the ones who caused it. It also protects against the currently liable party from being judgement-proof, like if currently the advertiser is the liable party and that advertiser didn't truly even exist, the end user would need to sue the criminal who is in country which doesn't care (and would need to figure out who it actually even is).\n\nGDPR and EU261 (flight compensation) has similar provisions. Essentially end user can choose who to sue (within the \"chain\" defined by the law), get the compensation and the companies are free to fight out who is responsible for it. Now companies suddenly have interest on making sure they are not the ones who are left holding the bag (contractually & making sure they can actually recover money from ultimately liable party)."}, {"id": 50677535, "au": "coldtea", "dom": 117, "sr": 131, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 2, "age": 2.87, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 51, "k": 94018, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.409, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Are you making a case for built-in components for e.g. sorting and filtering and what have you? To me that's just way more clunky than having an actual programming language.\n\nI'd take more clunky over what we have any day of the week.\n\n>A toy example, but HTML+CSS is Turing complete.\n\nAnd it shouldn't be. Problem fixed.\n\n>Even PDF, a static document format with no real user interaction, has a programming language (PostScript) embedded.\n\nGiven the millions of PDF exploits, that's likely the worst example one could give in support of this."}, {"id": 50672397, "au": "OptionOfT", "dom": 247, "sr": 132, "sc": 2.05, "ep": 3.24, "bs": 1.19, "d": 0, "age": 17.85, "grav": 216.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5028, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 0.99, "fa": 0.0, "gp": 0.632, "bl": 0.45, "ds": 0.0, "txt": "Interesting. A while back I couldn't even see event streams messages in Edge's debugger.\n\nI feel like this should become a checkbox on MDN: debugger tools exist without adding console.log."}, {"id": 50670944, "au": "Groxx", "dom": 68, "sr": 133, "sc": 2.03, "ep": 2.03, "bs": 0.0, "d": 3, "age": 20.64, "grav": 274.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 21177, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.766, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "As a USAian: I would much prefer to have this, but I've literally never seen it. Purchases either work with just a CVV or they fail for invisible reasons and basically nothing works around it when that happens so you just use PayPal instead."}, {"id": 50669200, "au": "deathanatos", "dom": 289, "sr": 134, "sc": 2.0, "ep": 2.0, "bs": 0.0, "d": 1, "age": 23.25, "grav": 334.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 13210, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "WebRTC is just the exfiltration mechanism. The attack could have used a JSON/AJAX call, or even an img tag."}, {"id": 50669608, "au": "trashcan_man", "dom": 222, "sr": 135, "sc": 1.97, "ep": 1.97, "bs": 0.0, "d": 2, "age": 22.68, "grav": 320.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "That's two very different tiers of threats. Blocking JS is the equivalent of bricking up all your windows, blocking ads is closing the blinds so somebody is less likely to hit you from the bushes. There are plenty of legitimate threat mitigations by blocking ads beyond the cosmetic improvements.\n\nThey each have a place, but to compare blocking ads to a \"no solicitations sign\" is inaccurate. We'll reserve that for the DNT header field."}, {"id": 50673411, "au": "drnick1", "dom": 263, "sr": 136, "sc": 1.94, "ep": 1.94, "bs": 0.0, "d": 0, "age": 15.26, "grav": 168.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3772, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.753, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "WebRTC should really be one of those things that is disabled by default. It just adds to the already enormous attack surface of Web browsers."}, {"id": 50669376, "au": "AlexandrB", "dom": 195, "sr": 137, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 2, "age": 23.0, "grav": 328.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 29866, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 0.494, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "The problem is there's no liability for doing so. If the arbitrary JavaScript would make the ad company liable for tens of thousands in damages per user there would be a lot of innovation around making ad delivery safe."}, {"id": 50669219, "au": "amluto", "dom": 182, "sr": 138, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 2, "age": 23.23, "grav": 333.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.681, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "It amazes me that site operators are willing to include ad networks in a way that gives them code execution."}, {"id": 50671968, "au": "lxgr", "dom": 83, "sr": 139, "sc": 1.84, "ep": 3.16, "bs": 1.32, "d": 4, "age": 18.79, "grav": 235.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.347, "fa": 0.0, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "Your card issuer actually cares a lot, since they end up paying for fraud on 3DS or stolen card transactions (which are vastly more likely without cards having a PIN).\n\nHowever, they care even more about not losing your business to their competitors not implementing any safety measures, so they also don't. It's a classic race to the bottom."}, {"id": 50673794, "au": "kevin_thibedeau", "dom": 154, "sr": 140, "sc": 1.81, "ep": 1.81, "bs": 0.0, "d": 6, "age": 14.14, "grav": 149.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 23650, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem is that the industry has decided ads require JavaScript. Safe ads can be delivered without any untrusted code but they won't do that."}, {"id": 50671472, "au": "Hackbraten", "dom": 92, "sr": 141, "sc": 1.79, "ep": 1.79, "bs": 0.0, "d": 3, "age": 19.76, "grav": 255.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 3633, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.76, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fraud prevention, like most things, becomes subject to diminishing returns at a point.\n\nThe consumer is who pays the price no matter what, so the sweet spot that is ideal for the provider is likely ideal for the consumer too."}, {"id": 50677484, "au": "coldtea", "dom": 4, "sr": 142, "sc": 1.78, "ep": 1.78, "bs": 0.0, "d": 2, "age": 2.96, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 94018, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.757, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What technology we use to render payment forms and what we use for live broadcasting should never coexist in the same page."}, {"id": 50669772, "au": "CookieCrisp", "dom": 79, "sr": 143, "sc": 1.74, "ep": 1.74, "bs": 0.0, "d": 5, "age": 22.46, "grav": 315.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 244, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.74, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They make it look one click away, but, the one time I had to use it with a Discover card I had to do a lot of legwork to get it refunded and it took nearly three months. If I hadn't been so annoyed at the fraud I would have just eaten it"}, {"id": 50670560, "au": "kenferry", "dom": 100, "sr": 144, "sc": 1.73, "ep": 1.73, "bs": 0.0, "d": 2, "age": 21.33, "grav": 289.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 2135, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.737, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you mean hard to use for the merchant? I use Apple Pay whenever possible, and it’s easier than entering credit card details."}, {"id": 50670255, "au": "derektank", "dom": 199, "sr": 145, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 5, "age": 21.8, "grav": 300.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 3195, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 0.393, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "The website owners are more similar to dealerships in this analogy I think, and (I could be wrong) but I don’t think dealerships are held liable if cars they’ve sold are faulty."}, {"id": 50670964, "au": "Refreeze5224", "dom": 190, "sr": 146, "sc": 1.7, "ep": 1.7, "bs": 0.0, "d": 5, "age": 20.6, "grav": 273.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 1270, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.722, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The fact that the surveillance-based targeting of individuals to influence behavior, enabled by cutting edge psychological persuasion techniques developed intentionally by psychologists, and deployed on a global scale, is considered completely benign and even defended by many on this site, is disgusting.\n\nI don't care if your business model is untenable if you don't use ads. You can join the rest of the economy and charge money for your product or service, instead of relying on exploitation to peddle likely worthless junk, if it has so little value that no one will pay for it otherwise.\n\n\"But I like targeted ads, how else would people find stuff?\" This is where ad defenders usually act like their manipulative surveillance is somehow similar to a print ad in a newspaper. If your product actually has value to people, then they will find you, the same way they have throughout the history of markets."}, {"id": 50670047, "au": "pavel_lishin", "dom": 214, "sr": 147, "sc": 1.56, "ep": 1.56, "bs": 0.0, "d": 4, "age": 22.1, "grav": 307.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 59762, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 0.665, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not just malware - it's also flagrantly scammy ads, banners that pretend to be download buttons, etc.\n\nI don't particularly care what people think of me blocking ads. To me, it's morally equivalent to putting on my headphones and not making eye contact with the Salvation Army Santa ring-a-dinging his bell."}, {"id": 50674786, "au": "criley2", "dom": 169, "sr": 148, "sc": 1.54, "ep": 1.54, "bs": 0.0, "d": 6, "age": 11.74, "grav": 111.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 4735, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.654, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Every major harness supports coordination over ssh. You can run an old computer and control it out of the box with any harness. I think you grossly overestimate how many people behave as poorly as you think.\n\nAt this point, I would say only beginners/newbs are still doing no-permissions on their main machine. Certainly the majority I know are using the built in ssh feature, or cmux, or t3code or one of the many solutions."}, {"id": 50672200, "au": "lxgr", "dom": 99, "sr": 149, "sc": 1.48, "ep": 2.8, "bs": 1.32, "d": 2, "age": 18.28, "grav": 225.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.193, "fa": 0.0, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "These actually all largely use symmetric cryptography, except for payments at offline terminals or as an additional layer of security against certain types of attacks.\n\nEMV is a symmetric key system at its core, since asymmetric cryptography capabilities were prohibitively expensive to implement in smartcards when it was originally introduced."}, {"id": 50671561, "au": "mrguyorama", "dom": 91, "sr": 150, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 3, "age": 19.57, "grav": 251.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 14027, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not zero.\n\nThe only possible way to get zero fraud is to have zero transactions. Anything else requires you accept some probability of fraud, and then it's just luck of the draw whether you allow a fraudulent transaction or not."}, {"id": 50676289, "au": "PhilipRoman", "dom": 53, "sr": 151, "sc": 1.45, "ep": 3.44, "bs": 1.99, "d": 5, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 2008, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": ["https://safeguard.sh/resources/blog/psd2-sca-exemptions-developer-cheat-sheet"], "ig": 0.712, "fa": 0.62, "gp": 0.0, "bl": 0.75, "ds": 0.0, "txt": "There is a list of exemptions https://safeguard.sh/resources/blog/psd2-sca-exemptions-deve...\n\nI believe how Amazon does it in EU is by having it's own acquirer (Amazon Payments Europe) which requests exemptions, for which Amazon also is then liable in case of fraud."}, {"id": 50673472, "au": "MarloweG", "dom": 168, "sr": 152, "sc": 1.42, "ep": 3.94, "bs": 2.52, "d": 5, "age": 15.1, "grav": 165.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.263, "fa": 0.34, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "It's not simple to actually break this pattern, most oses don't really provide ways to handle this. Multiple user accounts can help on nix, but then you run into issues if you want to code in a gu. Even so, this \"shockingly bad pattern\" is probably used by 99.9% of people running agents"}, {"id": 50673731, "au": "Refreeze5224", "dom": 192, "sr": 153, "sc": 1.36, "ep": 1.36, "bs": 0.0, "d": 7, "age": 14.33, "grav": 152.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1270, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 0.578, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No one needs to acknowledge this, it's obvious to everyone. What is intentionally obscured is the point I made, and people are intentionally led to conflate one with the other.\n\nBillboards and print ads and podcast product mentions, despite being annoying and wasteful, are not the same issue, and hardly worth discussing."}, {"id": 50668884, "au": "jszymborski", "dom": 124, "sr": 154, "sc": 1.35, "ep": 2.54, "bs": 1.19, "d": 0, "age": 23.71, "grav": 345.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 10195, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.229, "fa": 0.0, "gp": 1.38, "bl": 0.45, "ds": 0.0, "txt": "People like to get sanctimonious about blocking ads, but this is one of the many good reasons why I'll never feel bad about it."}, {"id": 50672373, "au": "lxgr", "dom": 106, "sr": 155, "sc": 1.33, "ep": 2.65, "bs": 1.32, "d": 2, "age": 17.9, "grav": 217.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.129, "fa": 0.0, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "Not sure if that would actually solve this problem. Electronic funds transfers have been available in Europe for decades, yet cards are still widely used for online payments. But cards are also much cheaper and more secure there (PINs and 3DS are ubiquitous)."}, {"id": 50672089, "au": "tonymet", "dom": 291, "sr": 156, "sc": 1.31, "ep": 2.5, "bs": 1.19, "d": 0, "age": 18.52, "grav": 230.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 4389, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
