github.com/joshwcomeau/button-sounds/blob/main/docs/raw-audio-files.md"], "ig": 0.421, "fa": 2.35, "gp": 1.31, "bl": 0.0, "ds": 0.0, "txt": "If you scroll down a bit, you'll discover that there is indeed a way to download the sounds themselves, as well as instructions for how to use them. https://github.com/joshwcomeau/button-sounds/blob/main/docs/..."}, {"id": 50642657, "au": "modinfo", "dom": 23, "sr": 3, "sc": 9.26, "ep": 9.26, "bs": 0.0, "d": 1, "age": 8.73, "grav": 71.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 34, "qw": 0, "k": 7992, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": ["https://github.com/skorotkiewicz/typing-asmr"], "ig": 1.089, "fa": 2.08, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "I made a typing asmr with this fantastic package, that user put own text and it types, it's great, because I love sometimes open youtube video with someone just typing on keyboard, now I can just press play: https://github.com/skorotkiewicz/typing-asmr"}, {"id": 50648988, "au": "urbnspacecowboy", "dom": 37, "sr": 4, "sc": 8.16, "ep": 8.16, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 38.6, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 24, "qw": 0, "k": 159, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": ["https://github.com/joshwcomeau/button-sounds"], "ig": 0.938, "fa": 2.08, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "For anyone else finding the demo site's value to resource use ratio is much too low, the sounds are stored in the git repo: https://github.com/joshwcomeau/button-sounds"}, {"id": 50638438, "au": "masenf", "dom": 9, "sr": 5, "sc": 8.1, "ep": 8.1, "bs": 0.0, "d": 0, "age": 18.83, "grav": 236.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 40, "k": 173, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.483, "fa": 0.76, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "> Frustratingly, browsers can decide to block a website from playing any sound. iOS Safari seems particularly strict about this. So, if you’re not hearing a click sound when tapping the big red button, please check out this website on a desktop computer.\n\nWhile I understand this behavior from Apple in a user-first perspective and do find audio on mobile web to be annoying in most cases, an easy way to allow audio to play on an iPhone that isn't \"use a desktop\" seems to be flipping the hardware switch to turn off silent mode.\n\nI'm not proud to admit it took 5 minutes of poking and a Google/Gemini search to figure that out..."}, {"id": 50640961, "au": "HelloUsername", "dom": 25, "sr": 6, "sc": 7.59, "ep": 7.59, "bs": 0.0, "d": 0, "age": 12.11, "grav": 117.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 67, "qw": 0, "k": 4282, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": ["https://itch.io/game-assets/tag-sound-effects", "https://switchlab.app", "https://news.ycombinator.com/item?id=50164780"], "ig": 1.524, "fa": 0.96, "gp": 0.875, "bl": 0.0, "ds": 0.0, "txt": "Why record/export in stereo and not mono? Since it's in a sound treated environment with the XY mics very close to the source, seems like there's not really additional interesting information in the side channels.\n\nNone the less, very cool project, and satisfying to click around with! Could be a nice asset package to upload on https://itch.io/game-assets/tag-sound-effects\n\nThis might interest you as well: \"Sound library cataloging 100 different keyboard switches: https://switchlab.app\" (https://news.ycombinator.com/item?id=50164780)"}, {"id": 50640220, "au": "ShadowOfThePit", "dom": 36, "sr": 7, "sc": 7.41, "ep": 7.56, "bs": 0.0, "d": 0, "age": 13.93, "grav": 145.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 153, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "etc_slow", "flbl": "Etc & Slow (Crt)", "urls": ["https://buttons.joshwcomeau.com/assets/index-CJeelgWZ.js"], "ig": 1.308, "fa": 0.96, "gp": 1.209, "bl": 0.0, "ds": 0.0, "txt": "The site is using half of my CPU, and lags out my entire browser. It's extremely slow and borderline unusable!\n\nWhat in the world could it possibly be doing in the background?? Is it a bad implementation of a react SPA? Since the entire site is stored in this 700kb JS file...\n\nhttps://buttons.joshwcomeau.com/assets/index-CJeelgWZ.js"}, {"id": 50643514, "au": "vunderba", "dom": 24, "sr": 8, "sc": 7.37, "ep": 7.52, "bs": 0.0, "d": 2, "age": 7.46, "grav": 57.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 80, "qw": 0, "k": 9516, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": ["https://hackerman.specr.net"], "ig": 1.685, "fa": 0.96, "gp": 0.57, "bl": 0.0, "ds": 0.0, "txt": "Same. I really enjoy having live coding videos playing in the background while I work, but it’s surprisingly difficult to find hour+ videos without commentary on YouTube, so I made Hackerman.\n\nIt basically lets you pick an IDE and a computer (5150, Apple II, etc), then hit the screensaver button. It randomly pulls source files from GitHub and types them out for infinite programmer ASMR. It also has a writing mode where you can listen to the sound of somebody writing out a book with a quill pen.\n\nhttps://hackerman.specr.net"}, {"id": 50639450, "au": "hunter2_", "dom": 7, "sr": 9, "sc": 7.07, "ep": 7.07, "bs": 0.0, "d": 0, "age": 16.05, "grav": 182.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 287, "qw": 0, "k": 3643, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 1.958, "fa": 0.28, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is really cool. I have a suggestion, though: the samples within a button seem to have several modification types including a pitch shifter. For example, \"DOWN4\" under the \"Multi-sampled sounds\" heading sounds nearly a semitone lower than the other DOWN variants. I suggest eliminating all pitch shifting (or at least confining your use to a few cents), leaving only timbre variation. Go nuts creating variation through EQ, distortion, formant shifting, reflections/delay/reverb, etc. but keep the pitch locked. Why? Because the pitch of everything in this world is based on its resonant frequency, which is based on the size of whatever can vibrate, and in the case of a button it's resonating based on the size of the button. Many aspects of the sound would change based on things like how quickly the button is pushed or how much dampening the finger pushing it imparts, but the fundamental pitch is not one of them.\n\nWhen playing a violin, if you move up the fingerboard, the pitch of the string increases. But if instead of playing the string you knock on the body as if knocking on someone's front door, the main pitch of that knocking never changes. The sympathetic vibrations of the strings will have frequencies that vary as the finger position varies, and the brightness and RT60 of the reverberation through the wood will vary from knock to knock, but the fundamental frequency general"}, {"id": 50642249, "au": "bookofjoe", "dom": 129, "sr": 10, "sc": 6.84, "ep": 6.84, "bs": 0.0, "d": 3, "age": 9.4, "grav": 79.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 37, "qw": 0, "k": 115344, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": ["https://www.gq.com/story/apple-airpods-everywhere"], "ig": 1.165, "fa": 0.96, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "\"There is color and form and the overall sort of architecture, but then those more difficult-to-define and concept behaviors, like the noise of a click and the force of a magnet that draws something closed.\" — Jony Ive (2019)\n\nSource: https://www.gq.com/story/apple-airpods-everywhere"}, {"id": 50638293, "au": "functionmouse", "dom": 59, "sr": 11, "sc": 5.67, "ep": 5.89, "bs": 0.0, "d": 0, "age": 19.23, "grav": 244.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 42, "k": 951, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 0.971, "fa": 0.7, "gp": 1.11, "bl": 0.0, "ds": 0.0, "txt": "> The sounds were recorded in the same sound-treated room using a Zoom H4 recorder, with additional processing to remove noise in Adobe Audition. The only exceptions are synth-on and synth-off, which were created digitally using the Current VST synth. All sounds are stereo.\n\nThis is impressive, nice work, thanks for this contribution! A writeup on this process specifically could be intriguing. Just to clarify, I understand you've chosen to license the sounds themselves are under the MIT license?"}, {"id": 50641462, "au": "onli", "dom": 116, "sr": 12, "sc": 5.52, "ep": 5.67, "bs": 0.0, "d": 2, "age": 10.85, "grav": 99.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 9544, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.541, "fa": 0.28, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "VW is strange about things like that. At university (Human-Computer-Interaction), we had a guest presentation of a guy working in VW's design department explaining why VW works with real buttons for their controls: That they are a must-have as they can be used without looking for example. So completely the right usability perspective. A few years later VW went all-in on touch controls - despite people hating them, despite there being court decisions in Germany about which controls can't be used while driving when they are touch controls, evidently despite them having (had) the internal knowledge that it's a very bad idea that will kill people. But they did it anyway (and now have to revert that, too much pushback).\n\nSo I'd guess the same thing happening with Audi doors: They have the department, they could get the sound right, they just don't to save a few cents or so that some manager gets his way."}, {"id": 50641271, "au": "DimitriBouriez", "dom": 22, "sr": 13, "sc": 5.38, "ep": 6.11, "bs": 0.0, "d": 0, "age": 11.34, "grav": 106.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 64, "qw": 0, "k": 21, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": ["https://mechvibes.com/u/dimitri-bouriez"], "ig": 1.511, "fa": 0.62, "gp": 0.548, "bl": 0.0, "ds": 0.0, "txt": "I made Mechvibes sound packs (the app that plays keyboard sounds when you type) from these, since the audio is under MIT: the 4 keyboards (Hi75, Halo75 V2, UHK60, ASUS rubber dome) and the 4 mice. The press and release samples are spread across the keys so it's not the same click on every key.\n\nhttps://mechvibes.com/u/dimitri-bouriez\n\nJosh is credited and the MIT license is included in each pack."}, {"id": 50639394, "au": "KellyCriterion", "dom": 101, "sr": 14, "sc": 5.04, "ep": 5.34, "bs": 0.0, "d": 0, "age": 16.22, "grav": 185.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.731, "fa": 0.0, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "OT:\n\na friend was working for a very large automotive manufacturer. He was working in the \"audio control\".\n\nIn the \"audio control\" responsible for meassuring if each of the poduced cars doors had the >correct sound< when opening/closing the door and how it sounds if you pick/release the door handle.\n\nHe explained that car manufacturers investing huge money to get >that specific brand touch< when you are experiencing the >audio performance< of a car: They found out that some sounds/frequency spectrums are perceived as of higher/better quality than others, thus designers even have attention on how it sounds if your put your bunch of keys with the car key attached onto a wood table etc."}, {"id": 50639263, "au": "hunter2_", "dom": 13, "sr": 15, "sc": 4.99, "ep": 5.14, "bs": 0.0, "d": 2, "age": 16.48, "grav": 190.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 32, "k": 3643, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 1.522, "fa": 0.42, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "> I've taken to putting a button on any page I make that uses audio with the label \"Click here to unmute\". Have it play a silent audio clip when it's pressed. After that, audio works.\n\nSo anyone who wants to defy the reason for this limitation simply needs to lead the visitor to click something that doesn't reload the page? Instead of \"unmute,\" maybe a throbbing \"next\" arrow or any innocuous link such as a menu item...\n\nI wonder if some set of navigation-like things, such as doing a history.pushState() to change the address bar, cancels what this trick would otherwise achieve."}, {"id": 50641249, "au": "swiftcoder", "dom": 16, "sr": 16, "sc": 4.8, "ep": 5.09, "bs": 0.0, "d": 2, "age": 11.39, "grav": 106.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.589, "fa": 0.28, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "I believe the intent of the silent switch is to silence the ringer, not to mute the whole OS. For example, music keeps playing at the selected volume even when you activate silent mode.\n\nHowever, a bunch of 3rd-party apps misinterpreted the meaning of this signal, so for example, a number of popular games mute all of their audio when the silent switch is enabled, meaning I have to un-silence the ringer just to hear game audio."}, {"id": 50638727, "au": "josephg", "dom": 10, "sr": 17, "sc": 4.5, "ep": 4.94, "bs": 0.0, "d": 1, "age": 18.08, "grav": 221.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 22391, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.679, "fa": 0.0, "gp": 0.689, "bl": 0.0, "ds": 0.0, "txt": "The general rule is that audio in a tab on ios is banned until a user initiated event (eg a play button) plays audio. After that, audio works.\n\nAfter a lot of trial and error, I've taken to putting a button on any page I make that uses audio with the label \"Click here to unmute\". Have it play a silent audio clip when it's pressed. After that, audio works.\n\nThe UI on this page should work fine on ios if the big red play button simply plays audio directly via webaudio. Who knows how it's actually coded though. It looks like an LLM's work. Probably a mess."}, {"id": 50643313, "au": "talkingtab", "dom": 1, "sr": 18, "sc": 4.37, "ep": 5.03, "bs": 0.0, "d": 0, "age": 7.7, "grav": 59.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 2562, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 1.536, "fa": 0.0, "gp": 0.981, "bl": 0.0, "ds": 0.0, "txt": "The discussion about the value of sound in cars is especially interesting, but there is a further point behind it. That In Real Life We humans are adapted to use sound, not because we find it pleasant but because it tells us something about our environment. If you are old like I am, you know the real sound that a turn signal makes. It was caused as a electric relay repeatedly opened and closed. Now that sound is just an artifact (like roll up the window). But it is incredibly disturbing to hear the click stop when some other sound needs to play in my car while I am making a turn.\n\nMy conjecture is that we drastically underestimate the importance of using \"sensory complete\" interfaces. So yeah. A button should click."}, {"id": 50640509, "au": "nippoo", "dom": 120, "sr": 19, "sc": 4.12, "ep": 4.56, "bs": 0.0, "d": 2, "age": 13.24, "grav": 134.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1846, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.227, "fa": 0.34, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "This is a field I'm in, and generally go by \"automotive sound design\" or \"automotive audio engineering\" depending how much the particular client wants me to design a little click sound vs engineer their $1 car horn hardware to be meatier..."}, {"id": 50642421, "au": "al_borland", "dom": 17, "sr": 20, "sc": 3.88, "ep": 4.54, "bs": 0.0, "d": 3, "age": 9.12, "grav": 76.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 237, "qw": 0, "k": 13376, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.7, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "I like to think of it more like an unplanned audio silent switch.\n\nWith a timer or alarm, I explicitly want to be interrupted so those break through.\n\nWith music or a video that I’m explicitly starting, I want I to break through.\n\nFor anything else that may be background noise that I’m not expecting, like any auto-play music/videos in the browser, sound effects, phone calls, texts, and game noise… I want it to respect the silent switch.\n\nWe’ve all seen, or been, the person who opens something on our phones in a public place that is quiet, to have the phone start playing something unintentionally. It can often be rather embarrassing. A silent switch with broad application prevents almost all of this.\n\nI understand where you’re coming from, and I think it would require a separate switch. One for the ringtone, and one for the idea I’m talking about. But this might get even more confusing for the users.\n\nIf there is a game you play often that you want audio for, a shortcut could be setup to automatically turn silent mode on/off when the app is opened or closed. I was looking to see if there was a game mode trigger to apply more broadly, but it doesn’t look like it.\n\nI do see an option in the Sound & Haptics settings to match Alerts and System Sounds to the ringtone volume. I wonder if turning that off would move the silent switch to a pure ringtone mute, like you want? It’s worth a"}, {"id": 50638921, "au": "isomorphic", "dom": 74, "sr": 21, "sc": 3.84, "ep": 4.06, "bs": 0.0, "d": 0, "age": 17.56, "grav": 211.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1458, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "The sounds with multiple samples are very nicely done.\n\nFor me this website spins up the fans on my M4 Pro Mac mini when running it in Firefox Developer Edition.\n\nIronically, I think it's the \"Whimsical Animations\" ad banner."}, {"id": 50646379, "au": "miladyincontrol", "dom": 72, "sr": 22, "sc": 3.51, "ep": 3.95, "bs": 0.0, "d": 0, "age": 3.62, "grav": 22.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 561, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 1.598, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I might be going against the grain here, but audio cues when done have to be mindfully done.\nVariations in pitch, notes, samples, and other general subtle variations help. However throwing in noise just for the sake of feedback can become grating as well.\n\nSome the worst offenders imo can be short form video that throw in obnoxious \"asmr-like\" noises into every single interaction, its like please, dont."}, {"id": 50639703, "au": "KellyCriterion", "dom": 122, "sr": 23, "sc": 3.39, "ep": 3.83, "bs": 0.0, "d": 2, "age": 15.41, "grav": 171.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 11, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 0.687, "fa": 0.7, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": ">what would they say is the name of what they offer?\n\nId say classic engineering offices/companies are sourced; there are tons of smaller engineering shops, specialized in whatever niche; e.g. I know a company supporting online subscription services in finding \"the optimal price\" for their subscriptions for different customer bucktes. \nSo I would bet therefore that companies doing such things already exist."}, {"id": 50640240, "au": "MiroslavPokorny", "dom": 69, "sr": 24, "sc": 3.31, "ep": 3.31, "bs": 0.0, "d": 0, "age": 13.89, "grav": 145.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 385, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_slow", "flbl": "Etc & Slow (Crt)", "urls": [], "ig": 1.016, "fa": 0.0, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "Starred and followed! Thanks for sharing.\n\nSmall nitpick - the CRT slider doesnt adjust a scanlines only the gun glow."}, {"id": 50642718, "au": "nolroz", "dom": 117, "sr": 25, "sc": 3.1, "ep": 3.76, "bs": 0.0, "d": 3, "age": 8.64, "grav": 70.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 360, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.6, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Touch control to roll the back windows down - always rolling the wrong windows down. I call the freaking roadside assistance every time I want to turn the overhead light on. At least 3 smashy clicks at least to turn the heat on. The haptics they added to the steering wheel feel weird and unnatural. Good thing it was cheap and drives like a banshee."}, {"id": 50639936, "au": "markasoftware", "dom": 56, "sr": 26, "sc": 2.94, "ep": 3.82, "bs": 0.0, "d": 0, "age": 14.78, "grav": 160.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 1051, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.643, "bl": 0.0, "ds": 0.0, "txt": "Very happy to see the hi75 keyboard at the top! I have it (albeit with different switches, though it's my understanding that most of the sound is not determined by the switches) and can confirm it's unbelievably thocky (\"marbley\" is my favorite adjective for it). I bought it right away after seeing someone else use it irl even though I already had other mech keyboards."}, {"id": 50639506, "au": "hunter2_", "dom": 119, "sr": 27, "sc": 2.87, "ep": 3.75, "bs": 0.0, "d": 1, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 3643, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound ds": 0.0, "txt": "20 years ago I used to drive a Renault Symbol (back then it was the cheapest offer from them), and one friend told me how cheap the doors sounded, and I agreed.\n\nHowever, they were also the strongest doors ever, surviving all the abuse by a lot of mindless university students."}, {"id": 50640812, "au": "osener", "dom": 70, "sr": 37, "sc": 2.2, "ep": 3.3, "bs": 0.0, "d": 0, "age": 12.46, "grav": 122.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1001, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 0.525, "bl": 0.0, "ds": 0.0, "txt": "very nice collection. this would be so much easier to browse through if the \"select sound\" items clicked with the associated sound though. but click -> space works ok if you don't want to keep moving the cursor"}, {"id": 50641602, "au": "pembrook", "dom": 94, "sr": 38, "sc": 2.18, "ep": 3.28, "bs": 0.0, "d": 0, "age": 10.52, "grav": 94.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 10324, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 1.021, "fa": 0.28, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "This is super cool, however there's some issues with the left/right stereo balance on a lot of these.\n\nTypically with samples you don't want a right channel pan embedded in to the file for example"}, {"id": 50639229, "au": "Retr0id", "dom": 67, "sr": 39, "sc": 2.18, "ep": 3.28, "bs": 0.0, "d": 0, "age": 16.56, "grav": 192.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 16791, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.692, "bl": 0.0, "ds": 0.0, "txt": "Awesome, I  machine so beware if you are running an alternative browser. I haven't checked Chrome yet."}, {"id": 50641319, "au": "Akasazh", "dom": 102, "sr": 43, "sc": 1.9, "ep": 3.45, "bs": 0.0, "d": 1, "age": 11.19, "grav": 103.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 18, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "A while ago a guy came in a radio programme with the special talent that he could tell cats apart by the sound of the door closing. I was really impressed by it because I've never played attention to this (probably why I drive a Dacia lol).\n\nBut after reading your comment I realized that those sounds are designed and an integral part of the design of the car. Thanks for enlightening me!"}, {"id": 50644642, "au": "cush", "dom": 2, "sr": 44, "sc": 1.76, "ep": 2.72, "bs": 0.0, "d": 1, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 2753, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 0.589, "fa": 0.28, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "Capacitive buttons are the absolute worst. Combine that with any kind of delay or latency and it's basically useless"}, {"id": 50639643, "au": "cootsnuck", "dom": 65, "sr": 45, "sc": 1.76, "ep": 2.86, "bs": 0.0, "d": 0, "age": 15.52, "grav": 173.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 628, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 0.786, "fa": 0.0, "gp": 0.698, "bl": 0.0, "ds": 0.0, "txt": "This is so neat! I've been wanting to make more like tactile user interfaces for web apps and the like. Looking forward to playing around with these sounds!"}, {"id": 50642922, "au": "strenholme", "dom": 106, "sr": 46, "sc": 1.75, "ep": 3.29, "bs": 0.0, "d": 1, "age": 8.28, "grav": 66.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1686, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "A long time ago, a buddy of mine had this really nice Porsche car.  One time, something in his car door fell out or broke, and instead of making a nice “thunk” when the car door closed, it made this cheap sounding sound like it was an old used car instead.  Needless to say, he made sure the thunkers for the doors of his Porsche were quickly replaced."}, {"id": 50640933, "au": "Cthulhu_", "dom": 111, "sr": 47, "sc": 1.71, "ep": 3.25, "bs": 0.0, "d": 1, "age": 12.19, "grav": 118.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 34017, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "Can confirm (as a person using cars); I've driven a few VAG cars (VW, Skoda, Audi) some years ago, and while they pretty much have the same basic undercarriage, engine and dashboard, the difference was in the trimmings and sound / feel. VW Polo was basically thin bare metal doors, Audi A1 had thick padded doors with a satisfying dampened sound when closing doors, and Skoda was somewhere in between. But they all had like a 1l 3 cylinder engine and a price difference of 20K (they were all lease/rentals from work)."}, {"id": 50641484, "au": "scoot", "dom": 103, "sr": 48, "sc": 1.7, "ep": 3.24, "bs": 0.0, "d": 2, "age": 10.81, "grav": 98.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 15, "k": 2521, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 0.868, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  special talent that he could tell cats apart by the sound of the door closing\n\nUntil I read your full comment I had visions of cats pawing at doors and making different scratching noises, but wondered how the owner trained them to close the door behind them"}, {"id": 50646909, "au": "0x4e", "dom": 60, "sr": 49, "sc": 1.69, "ep": 2.79, "bs": 0.0, "d": 0, "age": 2.97, "grav": 17.9, "surf": 10.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 122, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 1.123, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Thank you Josh & whoever else is behind this. Thanks to people like you that put things up on the internet, I can learn about what's possible and replicate it in my own projects. Open source is not only about having a GitHub repo, but also making your work public so others can use it. Maybe this isn't what you intend, but when I see something I like on the internet, I bookmark it so I can replicate it in the different projects I use."}, {"id": 50640804, "au": "josephg", "dom": 14, "sr": 50, "sc": 1.46, "ep": 2.79, "bs": 0.0, "d": 3, "age": 12.49, "grav": 123.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 22391, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.185, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah more or less. I’ve seen people put a big invisible button over the whole page that plays a silent audio clip when pressed, so any touch interaction enabled audio. Last I checked it worked fine."}, {"id": 50640208, "au": "steve_adams_86", "dom": 20, "sr": 51, "sc": 1.4, "ep": 2.5, "bs": 0.0, "d": 0, "age": 13.95, "grav": 146.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 0.422, "fa": 0.0, "gp": 1.043, "bl": 0.0, "ds": 0.0, "txt": "This is one of those things that's so gratifying and fun that it makes me want to go build something. I love Josh's work."}, {"id": 50640981, "au": "ChrisMarshallNY", "dom": 112, "sr": 52, "sc": 1.31, "ep": 2.85, "bs": 0.0, "d": 1, "age": 12.07, "grav": 116.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sound_car", "flbl": "Sound & Car (Doors)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "This is an old concept.\n\nBack in the 1970s, there was a sort of \"shared wisdom,\" that you could tell the quality of a car, by the sound of its door closing.\n\nThis became so prevalent, that car manufacturers spent a lot of effort, making sure that their doors \"clunked\" properly.\n\nBut I suspect your friend worked for a high-end manufacturer. They take that kind of thing to the next level (I used to work for a high-end camera company).\n\n[EDIT] I see that it was Mercedes, which tracks."}, {"id": 50639171, "au": "harrisi", "dom": 11, "sr": 53, "sc": 1.25, "ep": 2.35, "bs": 0.0, "d": 2, "age": 16.75, "grav": 195.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 23, "qw": 0, "k": 552, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_slow", "flbl": "Etc & Slow (Crt)", "urls": ["https://github.com/joshwcomeau/button-sounds", "https://www.joshwcomeau.com/ai-policy/"], "ig": 0.365, "fa": 0.45, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Largely not an LLM's work as far as I can tell: https://github.com/joshwcomeau/button-sounds\n\nAlso, here's the author's AI policy: https://www.joshwcomeau.com/ai-policy/\n\nThey're also a somewhat active user here."}, {"id": 50648670, "au": "spdustin", "dom": 19, "sr": 54, "sc": 1.13, "ep": 2.23, "bs": 0.0, "d": 0, "age": 0.5, "grav": 5.2, "surf": 36.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 4900, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "button_pitch", "flbl": "Button & Pitch (Sounds)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "On Safari 27.3 (22626.1.12.11.4) (current macOS Golden Gate beta), the \"Press me!\" button and the list of sounds are strobing like crazy, what's going on with the page?"}, {"id": 50644178, "au": "idle_zealot", "dom": 92, "sr": 55, "sc": 1.13, "ep": 2.23, "bs": 0.0, "d": 1, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 6346, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nice_sound", "flbl": "Nice & Sound (Love)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "On my Safari the interface flickers. I guess it's using some UI framework that outputs to canvas rather than DOM?"}, {"id": 50638622, "au": "al_borland", "dom": 15, "sr": 56, "sc": 1.13, "ep": 2.52, "bs": 0.0, "d": 1, "age": 18.32, "grav": 226.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 13376, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "silent_switch", "flbl": "Silent & Switch (Audio)", "urls": [], "ig": 1.073, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Having audio in the browser respect the silent mode switch seems perfectly reasonable.\n\nI would find it frustrating if my phone was set to silent and it played button noises on a website."}, {"id": 50642766, "au": "Balinares", "dom": 126, "sr": 57, "sc": 1.13, "ep": 2.27, " /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
