lic figure who to my knowledge has seen no (successful?) lawsuits.\n\nYou should take pains not to misrepresent legal situations like that, they can give the appearance of bad faith even if that were not your intent.\n\nhttps://storage.courtlistener.com/recap/gov.uscourts.nysd.67...\n\nhttps://news.sulat.com/2026/11/10/new-york-times-sues-brave-..."}, {"id": 50635012, "au": "lloeki", "dom": 88, "sr": 2, "sc": 10.75, "ep": 10.9, "bs": 0.0, "d": 6, "age": 6.18, "grav": 43.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 45, "qw": 0, "k": 12677, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": ["https://cryptomator.org/blog/2016/06/16/indepth-french-app-store/", "https://github.com/MobiusSync/MobiusSync/issues/27"], "ig": 0.992, "fa": 2.35, "gp": 1.287, "bl": 0.0, "ds": 0.0, "txt": "Probably import/export declaration of the thing using some encryption. It's rubberstamp bureaucracy mostly.\n\nhttps://cryptomator.org/blog/2016/06/16/indepth-french-app-s...\n\nAIUI it's _declarative_ i.e nobody's going to say no, but you have to go through the motion, which apparently includes writing French and snail mail.\n\nAn example which took way too long: https://github.com/MobiusSync/MobiusSync/issues/27"}, {"id": 50631200, "au": "alcinos", "dom": 110, "sr": 3, "sc": 9.29, "ep": 9.58, "bs": 0.0, "d": 2, "age": 10.51, "grav": 94.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 140, "qw": 9, "k": 95, "kpp": 11.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": ["https://quad9.net/news/blog/au-revoir-france/"], "ig": 1.54, "fa": 1.6, "gp": 0.968, "bl": 0.0, "ds": 0.0, "txt": "> Quad9 refuses to stop sending users to that content\n\nThey argued (see [0]) that it's not technically feasible to do so, since they don't track their users (by design), hence do not know who's French (or more accurately subject to French legislation) and who isn't. They basically have two options to try and comply:\n\n- Block those DNS requests for everyone, everywhere: That's clear overreach, a decision by a judge in a single country shouldn't have that much power worldwide\n\n- GeoIP blocking: they tried that in a previous case in Germany, and the plaintiff argued that it can be bypassed by VPN, therefore isn't a valid technical solution (to which the judge agreed)\n\nSo it looks like there's no valid technical path towards a block.\n\nRegardless of one's opinion of whether DNS blocking is the right solution to prevent piracy, framing it as if it was ever in Quad9's power to do anything about it is disingenuous.\n\n[0] https://quad9.net/news/blog/au-revoir-france/"}, {"id": 50627480, "au": "pi-r-p", "dom": 9, "sr": 4, "sc": 8.21, "ep": 8.65, "bs": 0.0, "d": 0, "age": 14.74, "grav": 159.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 8, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 1.879, "fa": 0.62, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "confirmed, effective since today, 24 of november 2026.\n\n; <<>> DiG 9.20.27 <<>> @9.9.9.9 news.ycombinator.com\n\n; (1 server found)\n\n;; global options: +cmd\n\n;; Got answer:\n\n;; ->>HEADER<<- opcode: QUERY, status: REFUSED, id: 56104\n\n;; flags: qr rd ra; QUERY: 1, ANSWER: 0, AUTHORITY: 0, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n\n; EDNS: version: 0, flags:; udp: 1232\n\n; EDE: 18 (Prohibited): (Service unavailable due to French legal \nconstraints)\n\n;; QUESTION SECTION:\n\n;news.ycombinator.com.          IN      A\n\n- One (more) proof french judges are digitaly illiterates.\n\n- Really want to see tomorrow articles about that, I bet some big french companies and administrations still have quad9 as default DNS."}, {"id": 50630432, "au": "Grombobulous", "dom": 31, "sr": 5, "sc": 7.0, "ep": 7.44, "bs": 0.0, "d": 1, "age": 11.34, "grav": 106.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.855, "fa": 0.34, "gp": 1.459, "bl": 0.0, "ds": 0.0, "txt": "I don’t think French judges are illiterate, I think Quad9 lost a pretty straightforward civil case.\n\nbeIN Sports France knew about entities illegally re-distributing their content, told Quad9 about it, Quad9 refuses to stop sending users to that content. As soon as Quad9 has awareness, it becomes Quad9’s active choice to harm beIN Sports France rather than a passive and neutral occurrence.\n\nWhat is beIN Sports France supposed to do, sit on their hands? If you were an athletic trainer for a soccer club how would you feel about your salary being reduced because your club’s TV deal was cut by 10% because piracy was easy and available thanks to companies like Quad9?\n\nYou don’t have to be digitally literate to understand the logic.\n\nI think anyone who has produced intellectual property as part of their livelihood understands the logic here."}, {"id": 50627466, "au": "gnabgib", "dom": 8, "sr": 6, "sc": 6.55, "ep": 6.55, "bs": 0.0, "d": 0, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 19, "qw": 0, "k": 26203, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": ["https://news.ycombinator.com/item?id=50195959", "https://news.ycombinator.com/item?id=50538994"], "ig": 0.924, "fa": 0.95, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Discussion (1382 points, 1 month ago, 481 comments) https://news.ycombinator.com/item?id=50195959\n\nOr Quad9's withdrawal from France: A canary in the coal mine (911 points, 1 week ago, 457 comments) https://news.ycombinator.com/item?id=50538994"}, {"id": 50632758, "au": "ImPostingOnHN", "dom": 80, "sr": 7, "sc": 6.45, "ep": 6.89, "bs": 0.0, "d": 6, "age": 8.75, "grav": 71.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 35, "k": 2596, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 1.586, "fa": 0.64, "gp": 0.922, "bl": 0.0, "ds": 0.0, "txt": "> the plaintiff wanted relief from their chosen defendant, and they won their case.\n\nAnd as many people have noted, this appears to be one of the many court cases throughout history which was poorly decided. That doesn't mean Quad9 can ignore it, of course. They took the totally legal avenue of fully complying with the ruling, by withdrawing their services.\n\n> I think that makes them seem rather immature, like a child who breaks all the toys rather than following the rules at play time.\n\nIt's more like one child having another over for playtime, but throwing a fit and demanding that the second child not say anything he doesn't like as long as they're in his house. The second, more mature child instead leaves the house and goes to play with all the other kids instead, leaving the first one standing alone. Totally valid and, IMO, the right call. Quad9 stands against  censorship."}, {"id": 50633982, "au": "pgl", "dom": 1, "sr": 8, "sc": 6.29, "ep": 6.29, "bs": 0.0, "d": 0, "age": 7.5, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1854, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.683, "fa": 0.0, "gp": 1.61, "bl": 0.0, "ds": 0.0, "txt": "I've set up an open Quad9 DNS proxy for anyone in France who'd like a (fairly) drop-in replacement. All it does is cache and forward DNS requests to Quad9, and it's set up to work with DoH, DoT, Do53 UDP+TCP, IPv4 and IPv6.\n\n    DoT: quad9.domainintelligence.uk\n    DoH: https://quad9.domainintelligence.uk/dns-query\n    213.171.214.215\n    2a00:da00:f47f:3600::1\n\n    DoT: quad9-unfiltered.domainintelligence.uk\n    DoH: https://quad9-unfiltered.domainintelligence.uk/dns-query\n    213.165.84.229\n    2a00:da00:f47f:3600::2\n\nIt was frustrating for me this morning to find out that my servers were getting REFUSED replies from Quad9, I didn't even realise that they were in France (I just knew it was the EU). Let me know if there's any issues."}, {"id": 50630696, "au": "mbesto", "dom": 101, "sr": 9, "sc": 6.08, "ep": 6.52, "bs": 0.0, "d": 2, "age": 11.03, "grav": 101.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 26, "k": 16354, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.253, "fa": 0.76, "gp": 0.97, "bl": 0.0, "ds": 0.0, "txt": "> As soon as Quad9 has awareness, it becomes Quad9’s active choice to harm beIN Sports France\n\nIf I build a road and someone kills someone on the road with their car, am I at fault for building a perfectly useful road?\n\nNot very straight forward.\n\n> because your club’s TV deal was cut by 10% because piracy\n\nDo you know this for a fact? I hardly believe that piracy was causing a 10% reduction in pay and more so that all the pirated traffic going through Quad9 would represent that much loss of business."}, {"id": 50631672, "au": "tristor", "dom": 15, "sr": 10, "sc": 5.94, "ep": 6.6, "bs": 0.0, "d": 2, "age": 9.92, "grav": 86.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 11, "k": 11284, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.629, "fa": 0.42, "gp": 1.09, "bl": 0.0, "ds": 0.0, "txt": "> I wondered before when and who can remove judges who are incompetent.\n\nUnfortunately, I think the current situation makes it clear modern democracies are not really equipped to deal with crises of competency.  They are happening at every level of government in pretty much all Western countries.  Part of it may simply be because the powerful are aging, but it is also in some way because technology shifts have changed the competency signals from those used to elevate people to positions of power.  Set aside, for a moment, the also rampant problem of corruption (especially in the US), I think this competency crisis is even more critical, and it will only worsen as younger generations lose their ability to critically think thanks to AI."}, {"id": 50632157, "au": "AnthonyMouse", "dom": 123, "sr": 11, "sc": 5.8, "ep": 6.24, "bs": 0.0, "d": 4, "age": 9.38, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 28, "k": 39909, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.638, "fa": 0.42, "gp": 0.82, "bl": 0.0, "ds": 0.0, "txt": "> What makes DNS special here?\n\nThe special thing isn't DNS, it's that it's an unrelated third party. It's like ordering a specific cabbie to stop transporting French citizens to a given location. It's totally asinine because they both have no way to know who is a French citizen and are only one of an unlimited number of car service drivers, not to mention that the individual can also do it themselves.\n\n> What other purpose would there be to visit an illegal sports streaming site? What else can you do at that target web address?\n\nAre you sure that's what you want to hang your hat on? What happens when the illegal sports streaming site puts up a blog with political advocacy to legalize sports streaming or oppose DNS blocking? Now blocking their DNS resolution is also censoring their political speech opposing your DNS blocking.\n\nWhat happens, for that matter, when it's a generic foreign social media site or content host that just doesn't take down sports streams?"}, {"id": 50630753, "au": "reincoder", "dom": 162, "sr": 12, "sc": 5.56, "ep": 6.0, "bs": 0.0, "d": 1, "age": 10.98, "grav": 100.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 0, "k": 396, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": ["https://ipinfo.io/countries/sc\u0023asns", "https://ipinfo.io/AS46805\u0023geolocation"], "ig": 1.007, "fa": 0.9, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "ASN registration does not equate to the location of the end user. For example, check out Seychelles here: https://ipinfo.io/countries/sc\u0023asns\n\nCheck some of the ASNs and see the location distribution of those IP addresses. Example: https://ipinfo.io/AS46805\u0023geolocation"}, {"id": 50630812, "au": "breakwaterlabs", "dom": 32, "sr": 13, "sc": 5.45, "ep": 5.89, "bs": 0.0, "d": 2, "age": 10.91, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 1.855, "fa": 0.0, "gp": 1.059, "bl": 0.0, "ds": 0.0, "txt": "Quad9 refuses to stop sending users to that content\n\nThis is where you lost the plot. Quad9, as a resolver, is answering the question \"what IP is registered at this domain\".\n\nThe concept of making that answer illegal is somewhat absurd, and this isn't just a \"geeks don't interact with reality\" principled stand. Principals are often grounded in \"what fundamentally works\", as in this case: trying to keep secret that \"popularSite\" is equivalent to some particular number, is not a solveable problem. You can attack large companies that answer this question, but every attempt since \"the internet\" to keep these kinds of \"open secrets we can't acknowledge\" has failed spectacularly.\n\nIf the site is illegal, block the illegal part: its registration, or its hosting. Don't try to block others talking about the real fact that it is hosted, at a particular IP, and that its domain is in fact publicly registered, with certain easily found addresses.\n\nYou might as well note that drugs are illegal, drug dealers are breaking the law, and so we must criminalize the act of ever acknowledging that drug dealing is rampant on the corner of first and main.\n\nIt's not simply that this isn't technically right; it can't work, and it punishes everyone in a futile attempt to solve a problem in the wrong way."}, {"id": 50631888, "au": "iagiagiag", "dom": 75, "sr": 14, "sc": 5.33, "ep": 6.43, "bs": 0.0, "d": 4, "age": 9.68, "grav": 83.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 336, "qw": 23, "k": 27, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.667, "fa": 0.42, "gp": 0.905, "bl": 0.0, "ds": 0.0, "txt": "> Quad9 has the technical ability to stop answering “what IP is registered at this domain” for domains that are engaged in illegal activity.\n\nIt doesn't work like that. Quad9 provides a service for the whole world without discrimination. An \"illegal activity\" in a country might not be illegal in another country. Accepting legal requests for some countries means they could be required to accept them for all laws for all countries of the world, and potentially apply that to all users. You could think all companies must obey the law, but DNS can't see where users are located, they can only have a very approximate location (which is what they're using now to block \"users in France\").\n\nIt's not just \"philosophical reasons\". Quad9 interprets the intent of beIn as \"we want to stop piracy of our content\". Quad9 says that attempting to block that content for France with a DNS would not help the goal of beIn, while causing too much risks for Quad9. That's a valid technical reason. It's a civil lawsuit, it must evaluate the pros and cons for both businesses. They lost but imo the case was misjudged. Quad9 blocking or exiting France will change nothing for piracy of beIn content in France, the content can still be accessed, the servers are still there, the ISPs still accept to redirect to the content (not their DNS but their routers will transfer the packets). It has no pros, and they expl"}, {"id": 50636083, "au": "zajio1am", "dom": 144, "sr": 15, "sc": 5.32, "ep": 5.32, "bs": 0.0, "d": 1, "age": 4.61, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2646, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.311, "fa": 0.56, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "Latency. For resolver at home it is likely that queries to commonly visited domains have period larger than TTL and therefore are often didcarded and refetched. While public resolver would likely have popular domains cached."}, {"id": 50634724, "au": "croon", "dom": 111, "sr": 16, "sc": 5.14, "ep": 5.58, "bs": 0.0, "d": 2, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 87, "qw": 0, "k": 5225, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": ["https://en.wikipedia.org/wiki/Is%E2%80%93ought_problem"], "ig": 1.257, "fa": 0.62, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "You are arguing from the judgment [0], which ignores 1) what other jurisdictions would do, and 2) whether it on its merits is right, regardless of 1.\n\nIt's an entirely pointless argument if it's not informed by anything outside of this specific judgment, since by this definition any court judgment would be just/fair by default.\n\nIt's like a sports ref making a bad call. Sure, it is what it is for the match unless it can be overruled, but it's still fair game to criticize on the merits of what actually happened.\n\n[0]: https://en.wikipedia.org/wiki/Is%E2%80%93ought_problem"}, {"id": 50636626, "au": "traceroute66", "dom": 4, "sr": 17, "sc": 5.09, "ep": 6.09, "bs": 0.85, "d": 3, "age": 3.66, "grav": 22.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 6093, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.532, "fa": 0.62, "gp": 0.496, "bl": 0.32, "ds": 0.0, "txt": "Even on the most primitive level, its not even in the same jurisdiction.  213.171.214.215 resolves to a UK hosted IP according to RIPE, and I'm assuming you (the person/company behind this) are not under Swiss jurisdiction either.\n\nIf people want to venture outside of Swiss jurisdiction there are already many other well-known public DNS resolvers out there which I'm sure I don't need to name.\n\n\"logging is disabled\" sure, but what about your cloud provider running DPI or whatever ?  And that's not the only area of concern anyway.  How do we know about many other things.... there are literally hundreds of unanserwed questions.\n\nAs I said, I respect the sentiment, but it really is not the solution, long-term, short-term or anything else.  Its just plain \"no\".\n\nAlways beware of a stranger bearing gifts ...."}, {"id": 50636722, "au": "jeremyjh", "dom": 74, "sr": 18, "sc": 4.93, "ep": 5.37, "bs": 0.0, "d": 6, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 1.376, "fa": 0.34, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "Its pretty obvious from this thread that you don't actually understand what a recursive resolver is. Quad9 does not manage DNS records. You can go for the DNS record, absolutely please fucking do that. Remove the record from its root server. Stop going after literally everyone in France who knows how to lookup that DNS record at its source. Every single person in France could setup their own recursive revolver in 5 minutes. And now you will go get court orders to stop all of them? Are you fucking insane?"}, {"id": 50633033, "au": "AnthonyMouse", "dom": 59, "sr": 19, "sc": 4.88, "ep": 6.2, "bs": 0.0, "d": 8, "age": 8.44, "grav": 68.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 13, "k": 39909, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.583, "fa": 0.42, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "> the plaintiff in a civil case can choose whoever they want to go after.\n\nThat's kind of the issue in contention, isn't it? Why should they be able to sue random innocent people who aren't the ones operating the streaming service?\n\nIn theory Michelin could integrate a GPS tracker into their tires that reports the vehicle's location to the company at all times and deflates the tires if the company's servers have the location on a list of banned addresses. It would cost them money to implement without compensation and be a huge invasion of privacy, but it's definitely technologically possible. Should plaintiffs be able to sue them and force them to do that?"}, {"id": 50633182, "au": "jiveturkey", "dom": 172, "sr": 20, "sc": 4.61, "ep": 4.61, "bs": 0.0, "d": 0, "age": 8.26, "grav": 66.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 8, "k": 2476, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.258, "fa": 0.42, "gp": 0.314, "bl": 0.0, "ds": 0.0, "txt": "> Quad9’s mission is to protect users from harm\n\ndirect quote from \"Todd\", presumably John Todd, CTO of Quad9. (article just says \"Todd\")\n\nVery one-sided view. Also, if they are the protector, then they could have done less harm by still providing service but following the court's block orders."}, {"id": 50632511, "au": "breakwaterlabs", "dom": 77, "sr": 21, "sc": 4.54, "ep": 6.08, "bs": 0.0, "d": 6, "age": 9.02, "grav": 75.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.659, "fa": 0.28, "gp": 0.954, "bl": 0.0, "ds": 0.0, "txt": "You are demonstrating a fundamental non-understanding of how DNS works. To comply with this ruling would require Quad9 to apply French censorship to all of their users.\n\nThe courts specifically determined that identifying only french users (e.g. by geolocation) would be insufficient: the block would have to be global.\n\nThe implications of this would soon be that sites discussing Tiananmen square, or democracy, or pro-ukrainian topics would soon join the list and pretty soon Quad9's entire raison d'etre would disappear.\n\nThe correct move for them is to leave and let France continue tilting at that windmill rather than join them in their folly."}, {"id": 50631454, "au": "ImPostingOnHN", "dom": 69, "sr": 22, "sc": 4.1, "ep": 5.64, "bs": 0.0, "d": 6, "age": 10.21, "grav": 90.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 2596, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.726, "fa": 0.0, "gp": 1.092, "bl": 0.0, "ds": 0.0, "txt": "Because going after DNS providers because their DNS servers might process a response that points to piracy is equivalent to going after Mozilla because their browser might process a response that points to piracy.\n\nThe tools are agnostic to the content, and providing or using them isn't wrong. Not in general, not even in specific cases of actually processing \"wrong\" content (like here). If the content is \"wrong\", then it is the content provider (and potentially consumer) who are in the wrong. Consequently, this legal action is effectively a collective punishment of multiple parties for wrongs which were committed by none of them.\n\nWhere I see this leading in the next few years is equivalent laws and actions and bans against open home computing and open-weight models which can process (view / store / say / execute) \"wrong\" content. Whether that would efficaously serve a good purpose in the long term, and be worth the trade-offs, is a judgement left to the reader."}, {"id": 50628376, "au": "arcfour", "dom": 26, "sr": 23, "sc": 3.84, "ep": 4.28, "bs": 0.0, "d": 4, "age": 13.57, "grav": 140.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 1, "k": 1182, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 1.337, "bl": 0.0, "ds": 0.0, "txt": "> often\n\nI find it a little dubious that this happens to you. I have never experienced it and I appreciate that they don't leak my ECS. How are you measuring this?\n\nWhat CDN other than archive.today is requiring ECS? Mind you CF runs the largest CDN in the world and are very performance obsessed..."}, {"id": 50631890, "au": "cedilla", "dom": 16, "sr": 24, "sc": 3.83, "ep": 5.37, "bs": 0.0, "d": 3, "age": 9.68, "grav": 83.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 202, "qw": 0, "k": 2129, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.654, "fa": 0.0, "gp": 1.025, "bl": 0.0, "ds": 0.0, "txt": "I think there is a competency crisis here, but it's more in a general lack of understanding of what judges do and don't.\n\nJudges apply the law, and in civil proceedings, usually based on the facts brought forth by the parties. That means that an argument that neither side has made is never considered.\n\nIn this case, where do y'all think is the mistake the court has made here? I assume most people here are too unfamiliar with French law to conclude that they applied the law itself incorrectly.\n\nAnd from a technical side, as I understand it, the plaintiffs asked the court to order Quad9 to stop resolving certain domains within the court's jurisdiction. And I guess that happened and I don't see any gross incompetence here. It won't solve the whole issue of privacy – but it would be an undue burden on any plaintiff to ask only for measures that solve a whole category of problems.\n\nIn the end, I assume that the court correctly applied French law, and that the law simply states that anyone involved in copyright infringement, even in an incidental and unintended way, can be asked to cease that involvement. I don't see any issue in the judgement or the technical understanding, even if I hate the outcome."}, {"id": 50634068, "au": "AnthonyMouse", "dom": 125, "sr": 25, "sc": 3.82, "ep": 5.36, "bs": 0.0, "d": 6, "age": 7.41, "grav": 56.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 39909, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.478, "fa": 0.28, "gp": 0.752, "bl": 0.0, "ds": 0.0, "txt": "There are plenty of generic file hosts that Quad9 doesn't block even though some of the files might be malware, and people would be quite unwilling to use it if they were required to do that. For example, there is nothing stopping anyone from storing malware on Google Drive.\n\nThere is also an obvious difference between malware blocking and censorship, which is that the end user wants malware to be blocked and then takes no action to work around the block unless it's a false positive. And for example, Quad9 doesn't block MalwareBazaar because it's where a user would go to get malware on purpose rather than by accident. So the decision is not \"does this contain malware\" but \"does the user want this blocked\".\n\nWhich is the reason DNS blocking for malware can have some effectiveness. The user can trivially disable the blocking, but doesn't want to. Whereas if you try to use it to censor something the user actually wants, it's completely pointless."}, {"id": 50633071, "au": "markhahn", "dom": 151, "sr": 26, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 0, "age": 8.39, "grav": 67.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 810, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "weird to pick on DNS.\n\nif someone is upset about a particular site being reachable, why not do it right, and demand that internet carriers that operate in FR drop the relevant IPs at the BGP level?\n\none amusing legal consequence would be that whoever chooses the IPs would be liable if they were the wrong IPs.  exactly as they should be: they demand a behavior which has technical cost, so should bear it themselves."}, {"id": 50638045, "au": "memoriesofsmell", "dom": 7, "sr": 27, "sc": 3.53, "ep": 3.82, "bs": 0.0, "d": 1, "age": 0.26, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 31, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.948, "fa": 0.56, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd be more inclined if the domain wasn't domainintelligence.uk and your website didn't specifically call out \"Enriched with unique data\" and \"Enriched with DNS telemetry\"..."}, {"id": 50628169, "au": "load-bearing", "dom": 25, "sr": 28, "sc": 3.45, "ep": 3.89, "bs": 0.0, "d": 3, "age": 13.82, "grav": 144.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 61, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.315, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Bad idea if you live in the sticks like I do. Cloudflare explicitly does not support ECS, which leaks less information about you, but often resolves CDN/etc addresses to IPs on the other side of the planet. Which is how you end up with weird latency spikes if you mix their DNS with other servers."}, {"id": 50633296, "au": "AnthonyMouse", "dom": 19, "sr": 29, "sc": 3.23, "ep": 4.77, "bs": 0.0, "d": 6, "age": 8.13, "grav": 64.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 39, "k": 39909, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.231, "fa": 0.42, "gp": 0.469, "bl": 0.0, "ds": 0.0, "txt": "> In this case, facilitating access to internet services is the whole business of Quad9.\n\nThis is like saying making cars is the whole business of Toyota. What is that supposed to imply about the reasonableness of dumping someone else's problem on them without regard for costs, trade offs or effectiveness?\n\n> I don't see how this particular judgement could have been avoided, outside of lobbying upstream to prevent the law from being passed in the first place.\n\nDoes France have nothing in its constitution to allow a judge to reject a law?"}, {"id": 50636531, "au": "traceroute66", "dom": 2, "sr": 30, "sc": 3.01, "ep": 3.68, "bs": 0.0, "d": 1, "age": 3.85, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 6093, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "Yeah, erm ....\n\nI respect the sentiment, I really do.\n\nBut I would suggest to others reading this that MiTM your DNS queries to some unknown Joe Bloggs is not the wisest idea in the world.  Even more so in today's security environment.\n\nYes, loosing Quad9 in France is very unfortunate. But this is not the solution."}, {"id": 50628977, "au": "goobatrooba", "dom": 156, "sr": 31, "sc": 2.99, "ep": 4.09, "bs": 0.0, "d": 0, "age": 12.94, "grav": 129.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 224, "qw": 0, "k": 471, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.593, "fa": 0.0, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "There were already extensive discussions in the other thread I have to say I understand quad9's decision, but I equally understand the French position: no matter how minor, if you know an entity helps in some min9r role to facilitate something illegal, it seems impossible to just ignore it.\n\nLeave the fairness of the specific laws concerned out of the discussion (we don't really know details it seems, but it applies to any:  copyright, extremist content, scans and phishing, child abuse, ...)  and take it at face value: the authorities are obliged to enforce the law, and consider that quad9 plays a - minor but real - role in breaking it. Quad9 clearly has the ability to do what is requested (as they block some content), but do not comply willingly what is under french law a legal order for an applicable law. So they fine quad9.\n\nI don't like the result and don't like some of the laws that are likely at the bottom of this, but from all the people outraged about this, what else should the french authorities have done? Yes they should do other things more, like take down content and servers hosting it, getting domains shut off (but extraterritoriality applies for most of those), etc. But I don't see how anyone can ask the authorities to not enforce the law as regards quad9 (and presumably any other DNS provider)."}, {"id": 50630143, "au": "khnov", "dom": 131, "sr": 32, "sc": 2.77, "ep": 3.21, "bs": 0.0, "d": 0, "age": 11.63, "grav": 110.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 9, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.727, "fa": 0.0, "gp": 1.035, "bl": 0.0, "ds": 0.0, "txt": "I got my lan telling me that internet is down.\nTook a while to understand it is because my Adguard home that is not getting access to upstream"}, {"id": 50631250, "au": "vaylian", "dom": 57, "sr": 33, "sc": 2.71, "ep": 4.22, "bs": 0.85, "d": 6, "age": 10.45, "grav": 93.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 8, "k": 3678, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.982, "fa": 0.42, "gp": 0.493, "bl": 0.32, "ds": 0.0, "txt": "> Why should the court care about that distinction?\n\nBecause the DNS record will be removed automatically from all DNS servers, once the actual domain ownership is revoked at the source.\n\nGoing to Quad9 and asking for special treatment for one domain is absurd."}, {"id": 50627939, "au": "greatgib", "dom": 147, "sr": 34, "sc": 2.56, "ep": 3.66, "bs": 0.0, "d": 0, "age": 14.14, "grav": 149.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 6565, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.869, "fa": 0.0, "gp": 1.12, "bl": 0.0, "ds": 0.0, "txt": "As said previously, that their move would have been honorable if they still provided the service from outside of France assuming that they couldn't do business there or sell anything to the users there or have any representative.\n\nBut now it is like just doing exactly what the bully wanted."}, {"id": 50632155, "au": "Grombobulous", "dom": 76, "sr": 35, "sc": 2.47, "ep": 4.01, "bs": 0.0, "d": 5, "age": 9.39, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.486, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I think you’re looking at this from an angle that is irrelevant to the context of a civil lawsuit.\n\nCompany A felt wronged by company B, they filed a lawsuit, Company B lost the lawsuit.\n\nYou say that you disagree with that outcome, and that’s fine. You say that the outcome won’t prevent piracy, and you’re probably right.\n\nBut the plaintiff wanted relief from\ntheir chosen defendant, and they won their case.\n\nThe implications for French users are not in the scope of the case at all. Furthermore, it’s Quad9’s choice to leave the country rather than comply with the ruling. They’re more interested in noncompliance with the ruling than they are in providing their privacy-preserving service to French users. I think that makes them seem rather immature, like a child who breaks all the toys rather than following the rules at play time."}, {"id": 50632650, "au": "subscribed", "dom": 109, "sr": 36, "sc": 2.28, "ep": 2.95, "bs": 0.0, "d": 4, "age": 8.87, "grav": 73.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 1780, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"a state\"? :)\n\nA road is the transport link made by someone. Might be a state, might be private company or even a collective. There are countless public roads built and/or operated by private entities.\n\nIf the road is built to the highest standards, with the best materials, not favouring any tyle of the vehicles, it's on the driver's if they drive recklessly.\n\nIf the police doesn't like the speeding users in the particular place, they're free to put a speed camera.\n\nAt any point a bunch of the drivers breaking the law is the road operator fault."}, {"id": 50633000, "au": "seszett", "dom": 102, "sr": 37, "sc": 2.24, "ep": 2.9, "bs": 0.0, "d": 3, "age": 8.48, "grav": 68.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 7097, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you own a private way that is known to be used by dealers, the authorities can actually ask you to secure it and prevent the dealers from using it to conduct their trade. If after being requested to do this, you refuse to take action then you would effectively be considered as facilitating illegal activities and legal action would be taken against you.\n\nIn this case Quad9 decided to close the way to everyone instead of controlling the individual users, which is fine by the law."}, {"id": 50630349, "au": "walrus01", "dom": 163, "sr": 38, "sc": 2.23, "ep": 3.48, "bs": 0.0, "d": 1, "age": 11.43, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 39862, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.318, "fa": 0.0, "gp": 0.263, "bl": 0.0, "ds": 0.0, "txt": "Trying to say that a specific ASN operates in only one country would be a really fundamental mistake. Go look at the CAIDA ASRANK list of like, top 200 AS by size and tell me that any of those operate in only one country.\n\nAn ASN isn't assigned to a country, it's assigned to a corporate entity, or in cases of ISPs that have acquired or merged with many other ISPs, one 'parent' corp might have a dozen or them or more."}, {"id": 50636546, "au": "waterTanuki", "dom": 154, "sr": 39, "sc": 2.22, "ep": 3.32, "bs": 0.0, "d": 0, "age": 3.84, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 192, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.39, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "Fining internet infrastructure providers for \"piracy activity\" is no different than fining a car maker for a robbery or a match company for arson. Unless you can prove beyond a reasonable shred of doubt that they actively facilitated this activity, where is the fault?"}, {"id": 50627601, "au": "binaryturtle", "dom": 23, "sr": 40, "sc": 2.19, "ep": 3.29, "bs": 0.0, "d": 1, "age": 14.6, "grav": 157.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 544, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.743, "fa": 0.0, "gp": 1.066, "bl": 0.0, "ds": 0.0, "txt": "Probably a smart time to rethink my own OpenWRT/ router setup too. It's not smart to only depend on a single DNS provider by default in case that one runs into trouble."}, {"id": 50632087, "au": "lokar", "dom": 136, "sr": 41, "sc": 2.09, "ep": 3.19, "bs": 0.0, "d": 0, "age": 9.46, "grav": 80.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 7161, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "If the French state really wants to do this, it would have been better to require all residential ISPs to enforce the ban (block dns, run resolvers for their users)."}, {"id": 50633228, "au": "cesarb", "dom": 68, "sr": 42, "sc": 2.06, "ep": 2.94, "bs": 0.0, "d": 6, "age": 8.21, "grav": 65.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 20, "k": 15861, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.563, "fa": 0.42, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "> Why are you allowed to go for the server and domain and not allowed to go for the DNS record?\n\nYou are allowed to go for the DNS record! At the place where it's located: the authoritative DNS servers for that domain. Quad9 is just a cache."}, {"id": 50633522, "au": "reamaer", "dom": 20, "sr": 43, "sc": 2.03, "ep": 2.91, "bs": 0.0, "d": 4, "age": 7.91, "grav": 62.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 22, "k": 2, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 0.731, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "(Not specific to this; but general case)\n\n> usually based on the facts brought forth by the parties.\n\nYou need competency to understand facts. Dumbing facts down, distorts the facts and situation.\n\n> anyone involved in copyright infringement, even in an incidental and unintended way\n\nI'm sure we could think of some edge case, that judge would outright dismiss as nonsensical (against judge's common sense)."}, {"id": 50630944, "au": "GuB-42", "dom": 98, "sr": 44, "sc": 2.02, "ep": 3.56, "bs": 0.0, "d": 2, "age": 10.77, "grav": 98.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.163, "fa": 0.0, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "I also think some people misunderstand a judge's job.\n\nA judge is here to rule with regard to the law. The judge doesn't care about the effectiveness of DNS blocking. If the law says they should block, that they have the technical abilities to do the blocking the law says they should do, and they don't, then the judge should rule against them. Judges can't simply ignore the laws they don't like.\n\nAnd in the end, they implemented the blocking, but instead of blocking just the domains beIN wanted them to block, they blocked the whole country.\n\nAnd quad9 doesn't criticize the judges, they did what they had to do, they criticize the policymakers, those who made the law the judge had to apply."}, {"id": 50629513, "au": "karad71", "dom": 27, "sr": 45, "sc": 2.0, "ep": 6.05, "bs": 2.52, "d": 5, "age": 12.32, "grav": 120.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 88, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": ["https://news.ycombinator.com/item?id=50539856"], "ig": 1.451, "fa": 0.62, "gp": 0.604, "bl": 0.95, "ds": 0.0, "txt": "Yes as stated our default 9.9.9.9 does not bleed ECS, We consider that too close to the user and we will always default on privacy. We do have 9.9.9.11 with the same malware/phishing blocking and with ECS available for those who feel they need it. We also have 9.9.9.10 which doesn't offer malware/phishing blocking and is just a pure caching resolver DNSSEC enabled.\n\nFull Disclosure if not obvious from this post I am an Engineer with Quad9, for questions around the exit from France you can read our CTO's post here\n\nhttps://news.ycombinator.com/item?id=50539856"}, {"id": 50630128, "au": "rdtsc", "dom": 10, "sr": 46, "sc": 1.81, "ep": 2.7, "bs": 0.0, "d": 1, "age": 11.65, "grav": 110.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 46159, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.617, "fa": 0.0, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "I wondered before when and who can remove judges who are incompetent. Imagine this was a surgeon who only did frog dissections in high school and are handed a scalpel to perform spine surgery and they kill patients. They clearly show they don't know how any of this works and well soon enough someone would remove that doctor. Who gets to remove the judge for incompetence?"}, {"id": 50635120, "au": "brookst", "dom": 118, "sr": 47, "sc": 1.72, "ep": 2.82, "bs": 0.0, "d": 6, "age": 6.02, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 0.861, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Can you cite the statute that would be illegal under?\n\nNotwithstanding that search is very different from resolving a semantic address to a physical address (lat/lon in geo, IP in networking)."}, {"id": 50633893, "au": "Anonyneko", "dom": 141, "sr": 48, "sc": 1.69, "ep": 2.72, "bs": 0.0, "d": 1, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 487, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.157, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Next step would be to install a traffic filtering black box at every ISP so that the state can always ban things itself without wasting time on all of the bureaucracy.\n\nThis is obviously <s> but I lived through this."}, {"id": 50629722, "au": "trvz", "dom": 161, "sr": 49, "sc": 1.58, "ep": 2.98, "bs": 0.0, "d": 0, "age": 12.1, "grav": 117.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 786, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.917, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "You can always get the current ASN for an IP, and ASNs are assigned to a country. You could just block all French ones.\n\nQuad9 just reinforce my existing view of them that they’re quite amateurish."}, {"id": 50631880, "au": "nextgens", "dom": 28, "sr": 50, "sc": 1.55, "ep": 3.09, "bs": 0.0, "d": 6, "age": 9.69, "grav": 83.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 186, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Have you considered pulling the reverse uno card?\n\nBlocking globally all resolutions of any domain registered by the claimants as well as any record pointing to any IP in any AS they control? Or redirecting them to a page explaining the problem?\n\nAfter all you do not have to provide \"free service\" to them (or their users)... when they get inclined to settle negotiate from a position of strength."}, {"id": 50630144, "au": "anfragment", "dom": 29, "sr": 51, "sc": 1.52, "ep": 2.62, "bs": 0.0, "d": 5, "age": 11.63, "grav": 110.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 39, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 1.117, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Google Meet and some other Google services are incredibly slow for me when I use resolvers without ECS (I'm in Central Asia), so I suspect they do DNS-based routing"}, {"id": 50635993, "au": "harry8", "dom": 143, "sr": 52, "sc": 1.47, "ep": 2.72, "bs": 0.0, "d": 0, "age": 4.75, "grav": 31.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 9050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.855, "fa": 0.0, "gp": 0.489, "bl": 0.0, "ds": 0.0, "txt": "unbound seems to work pretty well for home usage (mine with pihole). Is there some reason it doesn't scale? Is there an advantage to using quad9/1.1.1.1/8.8.8.8 or whatever over your own dns?"}, {"id": 50632847, "au": "seszett", "dom": 18, "sr": 53, "sc": 1.46, "ep": 3.0, "bs": 0.0, "d": 5, "age": 8.65, "grav": 70.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 7097, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.279, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In this case, facilitating access to internet services is the whole business of Quad9.\n\nIf they cannot avoid facilitating access to illegal services, which is illegal in itself, then their business is simply not viable in France (from the point of view of French law and authorities).\n\nEvidently, in the end they were actually able to stop this and they did.\n\nHonestly I don't like this law very much (and I am French, though not living in France) but I don't see how this particular judgement could have been avoided, outside of lobbying upstream to prevent the law from being passed in the first place."}, {"id": 50636603, "au": "pgl", "dom": 3, "sr": 54, "sc": 1.31, "ep": 2.85, "bs": 0.0, "d": 2, "age": 3.71, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1854, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hey! That's MR Joe Bloggs to you.\n\nFor the record, logging is disabled.\n\nYou're right though, this isn't the answer, but it might help if you want to use Quad9's service (especially the malware protection), without having to evaluate another provider which may or may not be filtering domains at the request of some government. It's not a long-term solution."}, {"id": 50632697, "au": "ImPostingOnHN", "dom": 71, "sr": 55, "sc": 1.23, "ep": 3.18, "bs": 0.85, "d": 8, "age": 8.83, "grav": 72.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 13, "k": 2596, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.844, "fa": 0.42, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "From the article:\n\n> The exit comes after a Paris court ordered it to block pirate tennis streams\n\nWhile government can colloquially mean \"the executive branch of the government\" in some countries, here I am using it to mean the whole government, including the judicial branch. And the court would not have a right of action to do anything with regards to the plaintiff's complaints, had not the government enacted such a right of action into law."}, {"id": 50637655, "au": "mindslight", "dom": 30, "sr": 56, "sc": 1.23, "ep": 2.71, "bs": 0.0, "d": 4, "age": 1.16, "grav": 7.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 15640, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.4, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh no, the horror. Anything but 200ms of more latency to grab megabytes of javascript that take tens of seconds to render."}, {"id": 50632110, "au": "ImPostingOnHN", "dom": 97, "sr": 57, "sc": 1.23, "ep": 5.63, "bs": 3.05, "d": 4, "age": 9.44, "grav": 80.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 2596, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.933, "fa": 0.0, "gp": 0.749, "bl": 1.15, "ds": 0.0, "txt": "Imagine, for the purposes of a silly analogy, that this happened before the internet. In medieval times! Richard the rancher has spent decades breeding and selling cattle, and Richard's Cow is known throughout the kingdom as a good pedigreed breed.\n\nOne day, one of Richards Cows he sold to a customer gives birth. The customer, Henry the herder, thought that was really neat, and so he breeds the cow, and keeps getting more. But he can't feed all these cows, so he gives them away for free. Richard is pissed: all that work he did! And now his ranching business is making way less money!\n\nShould the king step in and stop Henry from giving away free cows? That's a bigger question for another time. Back to the story. Thomas the teller overheard where Henry lives from a conversation at the pub. So when people looking for free cows ask him where Henry lives, Thomas tells them.\n\nThis is like jailing Thomas for telling people where to find Henry. It's fucked."}, {"id": 50632047, "au": "bradknowles", "dom": 12, "sr": 58, "sc": 1.23, "ep": 2.47, "bs": 0.0, "d": 3, "age": 9.5, "grav": 81.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2866, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Keep in mind that French law is not like US or UK law, and French judges don’t work the same way as judges in US or UK law.\n\nYou’d need to get an actual French lawyer in here to explain the differences.\n\nOn the surface, it seems to be the same.  But underneath, it is not."}, {"id": 50637207, "au": "lkjdsklf", "dom": 22, "sr": 59, "sc": 1.23, "ep": 2.47, "bs": 0.0, "d": 3, "age": 2.38, "grav": 14.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 289, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This doesn't seem to be a case of incompetency\n\nThe judge and the law understand exactly what they're doing.\n\nThey've decided that censoring content is okay and are forcing compliance in that effort.\n\nThat might be a fundamental difference of values, but it's not a lack of competency."}, {"id": 50631016, "au": "ferroman", "dom": 122, "sr": 60, "sc": 1.23, "ep": 2.46, "bs": 0.0, "d": 4, "age": 10.7, "grav": 97.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 62, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 0.963, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "I think it's half measure. Let's start blocking source of illegal content by IP  directly on routers. IP protocol is not special."}, {"id": 50636898, "au": "jeremyjh", "dom": 152, "sr": 61, "sc": 1.23, "ep": 5.43, "bs": 3.05, "d": 1, "age": 3.13, "grav": 19.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 415, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 1.613, "fa": 0.34, "gp": 0.464, "bl": 1.15, "ds": 0.0, "txt": "They could choose to do so, but it would not work as well. The litigant is the one who chooses DNS resolvers. They do so, because it is sticky. If people have an app, or a shortcut or link to a service, that service can easily change its IP address. But it cannot change its DNS name without updating the apps or telling all its users the new DNS name.\n\nThis is not a case where someone is considering facts like who is hosting, transporting or providing that content and trying to find the best way to stop them from doing that. Those people may not be exposed to French law. It is also not a case where someone is trying to figure out who owns that DNS name and wants to get it unlisted. Those are all the reasonable things to go after - since those are entities that have business relationships with the pirates - but they'll have chosen host countries that don't give a fuck about what any French court says.\n\nThe litigator just want to submit host names to a legion of DNS resolvers in France and have them all blocked instantly. Nevermind that every single person in France could host their own resolver that just looks up the root nameserver. Most of them won't do that.\n\nSo if you can get all the ISPs in France to block your names whenever you submit a new one to them, you are in business but then word starts to spread that you can change your DNS settings to use a different resolver like"}, {"id": 50631773, "au": "thaumasiotes", "dom": 46, "sr": 62, "sc": 1.23, "ep": 3.5, "bs": 1.19, "d": 7, "age": 9.8, "grav": 85.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 24, "k": 24762, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.47, "fa": 0.42, "gp": 0.828, "bl": 0.45, "ds": 0.0, "txt": "> Has this ever worked? Has it ever helped democracy, transparency, society to use the law as a cudgel to hush-up reporting of objective public facts?\n\nCopycat crimes would be a good example; reporting on objective public facts can cause quite a lot of damage that would otherwise not occur at all."}, {"id": 50634966, "au": "Cpoll", "dom": 116, "sr": 63, "sc": 1.23, "ep": 2.31, "bs": 0.0, "d": 6, "age": 6.23, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2614, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "Not a good comparison, since a DNS resolver isn't a search engine. The query is more akin to \"55 River Street A1A 1A1\" than \"drug dealers in my area.\" So, should Google Maps remove 55 River Street because people are searching for driving directions to a drug dealer at that address?"}, {"id": 50633696, "au": "TheCondor", "dom": 124, "sr": 64, "sc": 1.23, "ep": 2.27, "bs": 0.0, "d": 5, "age": 7.76, "grav": 60.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1502, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Does that apply to the malware blocking the quad9 also does?  That's their purpose to exist.   Do the malware hosts just need to provide a valid legal service, maybe \"Free Tibet!\"  And then they have a valid reason to exist?"}, {"id": 50636497, "au": "lovich", "dom": 13, "sr": 65, "sc": 1.23, "ep": 2.25, "bs": 0.0, "d": 4, "age": 3.92, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 9910, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.959, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Louisiana in the United States has a lot of legal quirks relative to the rest of the country as well due to being based off the French legal system"}, {"id": 50629296, "au": "stavros", "dom": 160, "sr": 66, "sc": 1.23, "ep": 2.07, "bs": 0.0, "d": 1, "age": 12.56, "grav": 124.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 78732, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 0.88, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's simple: It's not the place of DNS operator to choose whom to block and whom to allow, just like it's not up to toll booth operators to prevent thieves from traveling on the road."}, {"id": 50630923, "au": "Grombobulous", "dom": 113, "sr": 67, "sc": 1.23, "ep": 3.65, "bs": 1.59, "d": 3, "age": 10.8, "grav": 98.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 16, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.043, "fa": 0.42, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": "Is it overreach because DNS is some kind of special snowflake that doesn’t adhere to laws or what?\n\nWhat makes DNS special here?\n\n> Looking up a DNS entry does not imply that that information will be used for illegal purposes.\n\nIn this case in this lawsuit it did. What other purpose would there be to visit an illegal sports streaming site? What else can you do at that target web address?"}, {"id": 50630889, "au": "Grombobulous", "dom": 36, "sr": 68, "sc": 1.23, "ep": 3.62, "bs": 1.59, "d": 3, "age": 10.83, "grav": 98.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 1.2, "fa": 0.0, "gp": 0.55, "bl": 0.6, "ds": 0.0, "txt": "This is an ultimately a technical excuse for a dispute with a clear legal answer.\n\nQuad9 has the technical ability to stop answering “what IP is registered at this domain” for domains that are engaged in illegal activity.\n\nThey just don’t want to do that for philosophical reasons that clash with the civil lawsuit they lost."}, {"id": 50631664, "au": "karad71", "dom": 38, "sr": 69, "sc": 1.23, "ep": 4.48, "bs": 2.52, "d": 5, "age": 9.93, "grav": 86.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.392, "fa": 0.0, "gp": 0.834, "bl": 0.95, "ds": 0.0, "txt": "No one has pointed out yet that anyone can run their own recursive resolver on their home network even on their laptop and get the answers. So if anyone can easily get the answers by using the DNS system and bypassing public resolvers, service provider resolvers etc. It would be a big game of whack a mole.  As others have pointed out, taking down the domain registration would solve this as nobody would be able to get the answer to where www.illegalstreaming.com is."}, {"id": 50631285, "au": "brookst", "dom": 87, "sr": 70, "sc": 1.23, "ep": 1.93, "bs": 0.0, "d": 5, "age": 10.42, "grav": 93.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.823, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yep. Was setting up a small utility app for iOS, and an App Store question “will this be available in France” made it obvious it’d be a pain if I said yes. So, not available in France. I don’t even know what the policy was, but not worth the time to figure it out."}, {"id": 50630617, "au": "haellsigh", "dom": 132, "sr": 71, "sc": 1.23, "ep": 1.9, "bs": 0.0, "d": 1, "age": 11.11, "grav": 102.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 28, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.808, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I had a similar issue where nothing in my entire Tailscale network was able to resolve DNS addresses, which was confusing!"}, {"id": 50632133, "au": "breakwaterlabs", "dom": 45, "sr": 72, "sc": 1.23, "ep": 6.09, "bs": 4.24, "d": 8, "age": 9.41, "grav": 80.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 8, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 1.733, "fa": 0.28, "gp": 0.842, "bl": 1.6, "ds": 0.0, "txt": "Insider trading is just an application of objective fact.\n\nPlease do not misrepresent my points in your reply. \"Public\" was a key part of my comment which you omitted, and insider trading specifically applies to \"material NON-PUBLIC information\".\n\nDNS records are published by the registrars, and must be discoverable through recursion, in order for the internet to work. It is technically infeasible, without building a HTTPS-intercepting \"Great Firewall of France\", to block DNS queries in this manner; and even that is futile as can be observed by the porous nature of Golden Shield."}, {"id": 50631007, "au": "sroussey", "dom": 86, "sr": 73, "sc": 1.23, "ep": 1.8, "bs": 0.0, "d": 4, "age": 10.7, "grav": 97.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 5906, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.674, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Less infrastructure for France is fine. Eventually they will have no DNS, no AI, everything will be safe."}, {"id": 50631038, "au": "andreapaiola", "dom": 82, "sr": 74, "sc": 1.23, "ep": 1.77, "bs": 0.0, "d": 4, "age": 10.66, "grav": 96.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 202, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.665, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "They don't have \"the technical ability\" because an IP could be whatever service(s).\nThe server that respond to a public IP know what service is, not the resolver of DNS."}, {"id": 50637376, "au": "teravor", "dom": 134, "sr": 75, "sc": 1.23, "ep": 1.74, "bs": 0.0, "d": 0, "age": 1.88, "grav": 11.5, "surf": 13.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 626, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.597, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "does Quad9 have offices or personnel in France? if not, is anything stopping them from completely ignoring the French authorities?"}, {"id": 50635116, "au": "petcat", "dom": 173, "sr": 76, "sc": 1.23, "ep": 1.57, "bs": 0.0, "d": 1, "age": 6.02, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 4597, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the point is that they are taking a principaled stance not to comply with tyrants.  The French people are getting what they deserve."}, {"id": 50630941, "au": "vaylian", "dom": 55, "sr": 77, "sc": 1.23, "ep": 2.76, "bs": 1.19, "d": 4, "age": 10.78, "grav": 98.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 23, "k": 3678, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.579, "fa": 0.42, "gp": 0.136, "bl": 0.45, "ds": 0.0, "txt": "> Quad9 has the technical ability to stop answering “what IP is registered at this domain” for domains that are engaged in illegal activity.\n\nIf a domain is engaged in illegal activity, then you should go for the server and the domain itself instead of third-party information services like DNS servers."}, {"id": 50631302, "au": "breakwaterlabs", "dom": 92, "sr": 78, "sc": 1.23, "ep": 3.69, "bs": 2.38, "d": 6, "age": 10.41, "grav": 93.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.318, "fa": 0.0, "gp": 0.407, "bl": 0.9, "ds": 0.0, "txt": "Quad9 ended up in court because they recognize both the intractability of what the plaintiffs are attempting, and its dire implications when every government proceeds to use DNS resolvers to impose their norms on the world.\n\nThis somehow manages to hit the perfect intersection of \"Things that won't work\" X \"Things that are terrible for society\" X \"Things that are technically incorrect\"."}, {"id": 50638162, "au": "breakwaterlabs", "dom": 79, "sr": 79, "sc": 1.23, "ep": 3.69, "bs": 2.38, "d": 8, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.154, "fa": 0.28, "gp": 0.121, "bl": 0.9, "ds": 0.0, "txt": "The literal point of this article is that France does not have that means, because Quad9 left, specifically because of the risk I mentioned.\n\nMeanwhile everyone else can just point at any of the ten thousand other recursive resolvers and the suit is a pointless attack on the wrong thing."}, {"id": 50636781, "au": "jeremyjh", "dom": 95, "sr": 80, "sc": 1.19, "ep": 1.19, "bs": 0.0, "d": 6, "age": 3.41, "grav": 20.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.508, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Quad9 doesn't take down infringing content because it does not host, transport or serve that content."}, {"id": 50631313, "au": "brookst", "dom": 114, "sr": 81, "sc": 1.17, "ep": 2.36, "bs": 1.19, "d": 4, "age": 10.39, "grav": 92.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 0.479, "bl": 0.45, "ds": 0.0, "txt": "Would you support laws prohibiting mapping applications from giving directions to street addresses where illegal activity has been reported?"}, {"id": 50631229, "au": "breakwaterlabs", "dom": 37, "sr": 82, "sc": 1.04, "ep": 4.28, "bs": 3.23, "d": 4, "age": 10.48, "grav": 94.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 1.443, "fa": 0.0, "gp": 0.61, "bl": 1.22, "ds": 0.0, "txt": "They don't want to do it because it's a mind-bogglingly stupid request.\n\nDo you have an answer to my example of \"just criminalize all discussion of the rampant drug dealing on first and main\"? Because that is what you're suggesting as the \"clear legal answer here\".\n\nHere's an alternative that's clearer, use legal means to compel the de-registration of the domain, or the takedown of their hosting provider. Stop offloading your externalities onto DNS resolvers; \"telling the truth\" should essentially always be legal."}, {"id": 50630982, "au": "Grombobulous", "dom": 56, "sr": 83, "sc": 1.03, "ep": 2.62, "bs": 1.59, "d": 5, "age": 10.73, "grav": 97.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.55, "bl": 0.6, "ds": 0.0, "txt": "Why are you allowed to go for the server and domain and not allowed to go for the DNS record? Is that philosophy of only going for the server and domain an opinion or based in some kind of legal theory? Why should the court care about that distinction?\n\nKeep in mind that the plaintiff chooses their set of defendants in civil cases. It wasn’t the government who decided Quad9 was the defendant."}, {"id": 50632026, "au": "Grombobulous", "dom": 100, "sr": 84, "sc": 1.02, "ep": 2.61, "bs": 1.59, "d": 3, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 1.111, "fa": 0.0, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": "Right, and I’m also making the point that in the context of civil law, the judge’s job is to resolve a dispute between parties.\n\nA lot of criticism revolves around the fact that going after DNS is the wrong way to go, and maybe that’s true, but in a civil case the plaintiff is the one deciding who they want to sue."}, {"id": 50633060, "au": "seszett", "dom": 115, "sr": 85, "sc": 1.02, "ep": 2.21, "bs": 1.19, "d": 5, "age": 8.41, "grav": 67.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 7097, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.266, "fa": 0.0, "gp": 1.094, "bl": 0.45, "ds": 0.0, "txt": "It would actually be illegal for Google Maps to have a \"drug dealer\" category and make drug dealers searchable. To take an obvious example."}, {"id": 50629866, "au": "lokar", "dom": 164, "sr": 86, "sc": 0.8, "ep": 1.99, "bs": 1.19, "d": 1, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 7161, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drug_google", "flbl": "Drug & Google (Main)", "urls": [], "ig": 0.657, "fa": 0.0, "gp": 0.308, "bl": 0.45, "ds": 0.0, "txt": "How does that work for big multi-national companies?  I recall Google had one main ASN.\n\nIs it just more true for residential ISPs?"}, {"id": 50637735, "au": "cowlevel", "dom": 6, "sr": 87, "sc": 0.7, "ep": 3.22, "bs": 2.52, "d": 1, "age": 0.98, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 1.255, "fa": 0.0, "gp": 0.186, "bl": 0.95, "ds": 0.0, "txt": "Just run your own DNS resolver unless you need their malware filtering (which I'm assuming isn't very good anyway) instead of relying on either quad9 or Joe Bloggs.\n\nI suggest using unbound. It's very easy if you know basic Linux admin."}, {"id": 50631565, "au": "efdee", "dom": 81, "sr": 88, "sc": 0.63, "ep": 1.82, "bs": 1.19, "d": 4, "age": 10.08, "grav": 88.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1902, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quad9_france", "flbl": "Quad9 & France (Content)", "urls": [], "ig": 0.697, "fa": 0.0, "gp": 0.125, "bl": 0.45, "ds": 0.0, "txt": "A phone book will also give you telephone numbers of people living at addresses that engage in illegal activity. Your point does not hold up."}, {"id": 50631010, "au": "hobofan", "dom": 90, "sr": 89, "sc": 0.5, "ep": 1.69, "bs": 1.19, "d": 4, "age": 10.7, "grav": 97.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 8361, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "isp_resolver", "flbl": "Isp & Resolver (Bloggs)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.133, "bl": 0.45, "ds": 0.0, "txt": "Sure, let's also block Facebook, Twitch, Youtube, etc. then. You'll sureley find an IP rights holder whose IP is being infringed on, on any of those platforms."}, {"id": 50637966, "au": "breakwaterlabs", "dom": 66, "sr": 90, "sc": 0.43, "ep": 2.81, "bs": 2.38, "d": 8, "age": 0.44, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "road_address", "flbl": "Road & Address (Operator)", "urls": [], "ig": 1.198, "fa": 0.0, "gp": 0.0, "bl": 0.9, "ds": 0.0, "txt": "It is. You can demand the deregistration of the DNS name; that is the proper channel for this and it is possible with a solid case.\n\nOf course in so doing you will run smack into the non-territorial nature of the internet, and the pandoras box that trying to make it territorial unleashes (what if the CCP decides that all .govs are subversive?)"}, {"id": 50631997, "au": "Grombobulous", "dom": 70, "sr": 91, "sc": 0.35, "ep": 1.94, "bs": 1.59, "d": 7, "age": 9.56, "grav": 81.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "civil_dns", "flbl": "Civil & DNS (Domain)", "urls": [], "ig": 0.317, "fa": 0.0, "gp": 0.824, "bl": 0.6, "ds": 0.0, "txt": "The thing is that “going after” DNS resolvers was the choice of the plaintiff in a civil case, not the government."}, {"id": 50637950, "au": "breakwaterlabs", "dom": 53, "sr": 92, "sc": 0.35, "ep": 2.73, "bs": 2.38, "d": 6, "age": 0.47, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k
