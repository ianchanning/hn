ul_pct": 23.8, "terms": "hear, volume, piano, sound"}, {"slug": "general_commentary", "label": "General Commentary", "count": 25, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 9}, {"category": "code_repository", "count": 7}, {"category": "primary_technical_doc", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["pipewire", "windows", "loudness", "equalization", "limiter", "volume", "plugin", "apps", "playback", "app", "settings", "software", "output", "power", "gain", "signal", "device", "together"], "largest_root": {"root_id": 50641408, "author": "getfacl", "slots": 52, "start_dom": 44, "end_dom": 95, "share_pct": 29.1, "top_dom1_age": 14.0, "top_dom1_author": "dintech"}, "buried_cutoff": 54, "rescue_top_k": 36, "ablations": [], "tournament": [], "comments": [{"id": 50645691, "au": "ssl-3", "dom": 27, "sr": 1, "sc": 14.97, "ep": 14.97, "bs": 0.0, "d": 2, "age": 11.43, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 458, "qw": 53, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://github.com/xoxorwr/pw-loudness-eq", "https://en.wikipedia.org/wiki/LUFS"], "ig": 1.909, "fa": 3.45, "gp": 0.448, "bl": 0.0, "ds": 0.0, "txt": "I'm an audio guy who has been learning about DSP.\n\nThe answer you're not looking for is that people get all bent out of shape about their terms, especially when those terms are commonly abbreviated in typical parlance.\n\nA more-practical answer is that when people refer to equalization, they often refer to frequency-domain equalization.  Traditionally accomplished with a graphic equalizer (which is \"graphic\" because a person can see the curve being applied on the faders[1]), or a parametric equalizer (which has than one control per band).\n\nThe ostensible intent of frequency equalization is to make a system (and its flaws) equal across the frequency range (from 20Hz 20KHz or from DC to daylight or whatever).  The term \"frequency equalization\" almost always gets shortened to \"equalization.\"\n\nBut dialects differ.  Sometimes, people say[0] \"equalization\" and mean something in the realm of dynamic range equalization, instead.  They use the term to mean an impartation of dynamic sameness, or equality.\n\nPerhaps this means dynamic compression, or limiting, or both.  You know, to smooth out the dynamic peaks and dips in a singular track (to convert something like the 1812 Overture from a raucous affair into something that can be background music).  Or, in the case of the Windows software mixer, to avoid the commonly-undesirable behavior of clipped samples.\n\nOr perhaps they mean peak equa"}, {"id": 50650908, "au": "ssl-3", "dom": 29, "sr": 2, "sc": 12.14, "ep": 12.29, "bs": 0.0, "d": 4, "age": 2.88, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 132, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://www.ranecommercial.com/legacy/pdf/ranenotes/Sound_System_Interconnection.pdf"], "ig": 1.925, "fa": 2.35, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "See what I mean?  Even my above-and-beyond list of names lacks detail.  :)\n\nAnd they're often interchangeable.  A TS plug can connect to a TRS jack, and sometimes that's even desirable[1] for things like connecting a transformer-balanced output to a single-ended input.  Or:  TRS plugged into a TRRS hole can be used to detect the lack of a microphone.\n\nAnd it gets weird than that:  TRS to RCA[2] adapters, with T and R shorted together in the adapter itself, are a relatively universal way to turn a normalled TRS insert point on a mixer into an output for an RCA-equipped recorder without altering signal flow within that mixer.  But this same adapter won't produce any signal at all when plugged into a balanced TRS output, whether transformer-equipped or not.\n\n[1]: https://www.ranecommercial.com/legacy/pdf/ranenotes/Sound_Sy...\n\n[2]: I call them RCAs.  Some others refer to them as phono, cinch, pin, or tulip connectors."}, {"id": 50642470, "au": "DaveFlater", "dom": 54, "sr": 3, "sc": 9.97, "ep": 9.97, "bs": 0.0, "d": 1, "age": 15.79, "grav": 178.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 33, "qw": 6, "k": 600, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://github.com/DaveFlater/DRD"], "ig": 0.949, "fa": 2.2, "gp": 1.017, "bl": 0.0, "ds": 0.0, "txt": "> A composition has a dynamic range for a reason.\n\nPeople get rid of dynamic range for more immediately compelling reasons.  Here's my favorite filter.  I never had much luck with perceptual loudness normalization, and brick wall limiters are too sensitive to transient pops.\nhttps://github.com/DaveFlater/DRD"}, {"id": 50644750, "au": "gbraad", "dom": 33, "sr": 4, "sc": 9.33, "ep": 9.33, "bs": 0.0, "d": 2, "age": 12.72, "grav": 126.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 44, "qw": 0, "k": 1074, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://github.com/Digitalone1/EasyEffects-Presets"], "ig": 1.146, "fa": 2.08, "gp": 0.487, "bl": 0.0, "ds": 0.0, "txt": "Right, as expected. Not sure why someone else had to give a snarky remark instead.\n\nIt is a single plugin, which is convenient,  but this was possible before using ladspa plugins, like easyeffects; https://github.com/Digitalone1/EasyEffects-Presets which even states \"It's similar to the Loudness Equalization option in Microsoft Windows.\""}, {"id": 50646395, "au": "vrganj", "dom": 132, "sr": 5, "sc": 9.22, "ep": 9.22, "bs": 0.0, "d": 10, "age": 10.35, "grav": 92.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 111, "qw": 25, "k": 5801, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": ["https://news.ycombinator.com/item?id=50644040"], "ig": 1.809, "fa": 1.04, "gp": 1.383, "bl": 0.0, "ds": 0.0, "txt": "I believe your entire comment slips in between objective descriptors and ideological assertions quite frequently and fluently.\n\nJust as a quick example, the very first half-sentence already asserts a definiton of harm without establishing it objectively. You can't say any harm is worse than no harm before first establishing a conception of harm itself.\n\nOr as another example:\n\n> Private property is not part of natural law itself, but it is an ordinance of human reason.\n\nWho gets to define reason?\n\n> It exists to promote order, care, and peace\n\nWhose order? Care towards whom? Peace from what?\n\nAll of these effectively are elaborate self-justification mechanisms to naturalize a socially contingent arrangement. The only objective reality is the material reality on the ground.\n\nLet me know if you want me to demonstrate a few more instances, but I think I made my larger meta-point here already: https://news.ycombinator.com/item?id=50644040"}, {"id": 50646199, "au": "lo_zamoyski", "dom": 131, "sr": 6, "sc": 9.01, "ep": 9.16, "bs": 0.0, "d": 9, "age": 10.61, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 729, "qw": 74, "k": 2050, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 2.071, "fa": 0.92, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "> That is a value-laden assertion, not an uncontroversial fact.\n\nAny harm is always greater than no harm, mathematically, and the fact/value dichotomy is bogus. If a harm is occurring, it is occurring objectively, not because some arbitrary constructed axiology tells us there is one. And if you can't tell, then you can't really make the accusation you make in the first place.\n\nBut this is besides the point. Fundamentally, this isn't a question of harm. It's a question of justice and respecting rightful due. The demands of justice don't go away just because you cause no economic harm to someone. You might ask \"what constitutes rightful due?\", and here it suffices to say fair compensation for work and service (you're not just paying the Waltons, you're also paying the farmers and truck drivers and accountants, etc, etc who contributed to providing them with those tomatoes).\n\nNow, I am not claiming that classical liberal property rights - which can tend toward property absolutism - aren't problematic. In a liberal conception, private property is conceived of as prior to the common good. The common good is then redefined as effectively a grudging cession of private property. This naturally pits private property against the common good. But this is a flawed and shall we say ahistorical understanding of property.\n\nPrivate property is not part of natural law itself, but it is an ordin"}, {"id": 50642212, "au": "mapontosevenths", "dom": 151, "sr": 7, "sc": 7.74, "ep": 7.74, "bs": 0.0, "d": 1, "age": 16.2, "grav": 185.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.805, "fa": 0.9, "gp": 0.643, "bl": 0.0, "ds": 0.0, "txt": "It's buried in the basement of windows inside a locked filing cabinet, in a disused lavatory, with a sign on the door saying \"beware of leopard.\"\n\nI used to enable it to help with Zoom calls so when that one jackass using his 2015 \"free in a box of cereal\" headphones for a mic got on I didn't have to turn him up to the point that normal people gave me hearing damage. Now Zoom takes over the audio and does their own, worse, volume normalization so I'm getting permanent hearing loss. One day there will be glorious lawsuits for everyone!\n\nIn the meantime:\n\n1) Go to the old control panel, not settings\n\n2) Sound (the old-timey windows XP one)\n\n3) Manage audio devices\n\n4) Pick the device\n\n5) Properties\n\n6) Enhancement\n\n7) Loudness Equalization"}, {"id": 50645753, "au": "phkahler", "dom": 142, "sr": 8, "sc": 7.07, "ep": 7.07, "bs": 0.0, "d": 2, "age": 11.34, "grav": 106.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 10, "k": 24044, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.597, "fa": 0.76, "gp": 0.793, "bl": 0.0, "ds": 0.0, "txt": ">> If you use that hack, please do not ship it.\n\nNo worries it's not shipping anywhere. It's 110% vibe coded because I didn't care about quality, just wanted the thing to work. Also turns out doing heavily interactive programming sessions with Claude is slowed down a LOT by having the spoken voice. I can skim the text and carefully read (and reread) the important parts a lot faster than listening, and the voice is too disruptive to reading to do both. It was a fun experiment though.\n\nI will say that it was interesting to have Claude diagnose the issue. On a Linux desktop it could tap into many points in the audio chain to figure out where the volume ramp was occurring."}, {"id": 50642440, "au": "ndriscoll", "dom": 125, "sr": 9, "sc": 6.81, "ep": 7.95, "bs": 0.85, "d": 5, "age": 15.85, "grav": 179.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 171, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": ["https://git.eden-emu.dev/eden-emu/eden/"], "ig": 1.242, "fa": 1.24, "gp": 1.034, "bl": 0.32, "ds": 0.0, "txt": "There is a wild difference in kind between theft and just making your computer do what you want. You don't not steal because of the consequences; you don't steal because it harms others. Making your computer's sound work how you'd like doesn't harm others. If you really want a tortured analogy to taking food, it's more like freeganism. Except even that isn't really a good analogy because really all you're doing is copying someone's idea for how to use your property.\n\nClaiming software is the new means of production is also silly. It's like saying ideas are the new means of production, and essentially agrees with the idea that ideas are property in the first place (and that we should therefore analyze them in property-like terms). Just reject that notion. Speak in plain terms without analogy: it is fine to use other people's ideas. That is how humanity has come to dominate the Earth.\n\nFor practical purposes, \"capital\" has no ability to police the distribution of a 600 kB repo.\n\nYuzu lives on as Eden: https://git.eden-emu.dev/eden-emu/eden/"}, {"id": 50651095, "au": "thejazzman", "dom": 84, "sr": 10, "sc": 5.86, "ep": 6.22, "bs": 0.0, "d": 6, "age": 2.4, "grav": 14.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 0, "k": 757, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://pixelbrite.site"], "ig": 1.382, "fa": 0.62, "gp": 0.834, "bl": 0.0, "ds": 0.0, "txt": "To further this point, they often drop channels altogether let alone doing anything clever. You may be losing the center channel entirely. Otherwise th downmixing should be additive so you get LCR etc.\n\nI'm running a 2.0 and 2.1 setup myself; went deep with this while working on https://pixelbrite.site"}, {"id": 50645982, "au": "iza", "dom": 100, "sr": 11, "sc": 5.61, "ep": 6.05, "bs": 0.0, "d": 0, "age": 10.94, "grav": 100.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 577, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": ["https://loudmax.blogspot.com/"], "ig": 1.116, "fa": 0.62, "gp": 1.143, "bl": 0.0, "ds": 0.0, "txt": "Windows loudness equalization does not sound very good. For the last several years I've been using https://loudmax.blogspot.com/ instead, via PipeWire filter-chain on Linux and Equalizer APO on Windows. Sounds way better than every other plugin I tried."}, {"id": 50645582, "au": "bob1029", "dom": 68, "sr": 12, "sc": 5.5, "ep": 5.8, "bs": 0.0, "d": 2, "age": 11.56, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 12, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.51, "fa": 0.42, "gp": 0.726, "bl": 0.0, "ds": 0.0, "txt": "> a speaker setup that's capable of the dynamic range need for an orchestra\n\nThis speaker setup does not actually exist.\n\nThere are instrument geometries that produce output that simply cannot be reproduced artificially via whatever normalized loudspeaker geometry.\n\nThe piano and cymbals being strong examples. The initial transient of a cymbal crash is beyond hopeless to deal with. Plasma tweeters are probably as close as you can get on this one."}, {"id": 50645833, "au": "entropicdrifter", "dom": 7, "sr": 13, "sc": 5.49, "ep": 5.49, "bs": 0.0, "d": 3, "age": 11.2, "grav": 104.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2050, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.379, "fa": 0.62, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "There's only one reason someone like you (or me, with a low end professional recording studio setup) would set the digital volume below 100%, and that's if the sound card is running at a higher bit depth than the audio being played back, for instance listening to CD audio when the sound card is at 24 bits, or watching a 24-bit audio dvd/blu-ray with the sound card running at 32 bits"}, {"id": 50644363, "au": "mapontosevenths", "dom": 153, "sr": 14, "sc": 5.4, "ep": 5.55, "bs": 0.0, "d": 3, "age": 13.21, "grav": 134.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.554, "fa": 0.34, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "What blows my mind is that Discord does this really well. Why can't serious grown-up software that I'm forced to use for 8+ hours everyday?\n\nThese aren't tiny mom and pop companies. Zoom has a $25B market cap and they're actively damaging millions of peoples hearing every day due to simply not giving a crap."}, {"id": 50643693, "au": "dintech", "dom": 1, "sr": 15, "sc": 5.25, "ep": 5.39, "bs": 0.0, "d": 0, "age": 13.99, "grav": 146.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 168, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.824, "fa": 0.0, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Interesting for audio nerds: Windows actually has an audio limiter. If you playback audio via loopback shared WASAPI, DirectSound or MME it actually gets compressed very slightly as it nears the peaks. The same does not happen via WASAPI exlcusive or ASIO.\n\nPlaying loudly mastered audio out of your PC will be very slightly different from the true audio source by about -0.1dbps with the compressor affecting the peaks.\n\nIt works via audiodg.exe (CAudioLimiter in AudioEng.dlll) on the shared-mode render path after all the streams get mixed, even if there's just one playing currently. This is necessary because two loud signals being mixed together might clip your DAC and that sounds nasty, so it's understandable that it's there.\n\nWhy would you care though? I was building a audio metering system to monitor audio via loopback and the properties of the audio I played in were being modified by the limiter in these normal modes. Maybe audio purists might not enjoy it either."}, {"id": 50641761, "au": "jcelerier", "dom": 170, "sr": 16, "sc": 5.07, "ep": 5.07, "bs": 0.0, "d": 1, "age": 16.94, "grav": 199.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 11940, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": ["https://blogs.microsoft.com/on-the-issues/2023/09/07/copilot-copyright-commitment-ai-legal-concerns/"], "ig": 1.074, "fa": 0.62, "gp": 0.538, "bl": 0.0, "ds": 0.0, "txt": "Microsoft themselves have a legal program where they claim they'll support people using AI if anyone else comes forward and say that they own copyright on the AI-user's generated code: https://blogs.microsoft.com/on-the-issues/2023/09/07/copilot...\n\nSo it's going to be pretty hard for them to go against OP in front of a judge"}, {"id": 50642514, "au": "zelphirkalt", "dom": 80, "sr": 17, "sc": 5.03, "ep": 5.47, "bs": 0.0, "d": 2, "age": 15.7, "grav": 176.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 8562, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.425, "fa": 0.34, "gp": 0.796, "bl": 0.0, "ds": 0.0, "txt": "Brought back? I think it is still going on. Watch any modern series and you have that issue of tiny bit of dramatic moment, and they will blast your ears off with loudness, forcing you to decrease volume, while leaving you scrambling to increase volume when 2 people have a conversation, so that you can actually hear the words.\n\nI used to have a music player, that let me regulate the volume of each track separately, in 10% steps. Wish that could be brought back to some modern music players. I don't mean just in some metadata, but a property of a playlist, that I change live in my player."}, {"id": 50648818, "au": "ZoomZoomZoom", "dom": 20, "sr": 18, "sc": 5.01, "ep": 5.96, "bs": 0.0, "d": 2, "age": 7.0, "grav": 52.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 2162, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.86, "fa": 0.34, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "I understand the name was copied to be recognizable, but that's not doing much service as the intersection of GNU/Linux users and those who know of the original Windows feature is much smaller than the number of regular PipeWire users who might get confused by the incorrectly used term.\n\nMy question was more of specific features of that implementation that make it more desirable than regular stuff in EasyEffects or Libavfilter or standard loudness normalization approaches (EBU R 128, ReplayGain, etc).\n\nI perfectly understand when loudness normalization can be useful. My mpv input.conf has this heavy-handed line for catastrophically quiet stuff:\n\n  f2 af toggle lavfi=\"acompressor=threshold=0.75:ratio=1.8:makeup=2,loudnorm=i=-12:lra=8\""}, {"id": 50642871, "au": "code-blooded", "dom": 160, "sr": 19, "sc": 4.97, "ep": 5.19, "bs": 0.0, "d": 1, "age": 15.14, "grav": 166.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 315, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.596, "fa": 0.28, "gp": 0.446, "bl": 0.0, "ds": 0.0, "txt": "I'd argue we have already decided to go down that path when we deemed AI learning and \"creatively reproducing\" copyrighted material legal to do.\n\nThe full consequences are to be seen, but most software companies are no longer viable the way they are. You can just \"creatively reproduce\" all the intellectual property.\n\nEven AI labs future is questionable since their models can be distilled and sold on the cheap.\n\nIt's definitely super interesting and exciting times we're living in!"}, {"id": 50644549, "au": "adrian_b", "dom": 117, "sr": 20, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 3, "age": 12.98, "grav": 130.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.695, "fa": 0.0, "gp": 0.658, "bl": 0.0, "ds": 0.0, "txt": "That is a patent, not a copyright.\n\nAlgorithms cannot be copyrighted, only specific programs that implement an algorithm.\n\nTraditionally, algorithms could not be patented, but the practice of the US patent law has invented loopholes for patenting algorithms and eventually many algorithms have been patented, and USA has also blackmailed other countries to change their patent laws, though in many countries such lax interpretations of the patent laws are still not accepted.\n\nAlgorithms and formulae do not deserve to be patented, because with very rare exceptions it is very easy to rediscover them completely independently and there exists no justification for punishing the independent discoverers just because someone else happened to also discover the same algorithm, but one day earlier or one year earlier, because by chance they encountered earlier a problem for which that algorithm is needed."}, {"id": 50641801, "au": "sedictious", "dom": 175, "sr": 21, "sc": 4.84, "ep": 4.99, "bs": 0.0, "d": 3, "age": 16.87, "grav": 197.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.757, "fa": 0.0, "gp": 0.593, "bl": 0.0, "ds": 0.0, "txt": "I agree with your thesis overall and that this whole trend is a bit orthogonal to the \"hacker spirit\" (at least as far as pushing boundaries is concerned), but I'm also not sure if piracy is the right framing.\n\nThe base idea is also not new, equalisation algorithms and research on psychoacoustic-based metrics have been a think for ages. Iirc there are even ITU standards on this exact thing. Reversing the Windows implementation usually was accompanied by some new insight on specific reverse techniques or perhaps some unique realisation of the author. There was no one spending hours on going through RE something some specific without at least gaining a ton of specialised knowledge along the way.\n\nNow this part is almost trivial so sharing it with an AI README is just mostly noise. But I guess not many motivated people are left actually pushing forward, so without those articles HN would be left with nothing. The reader is left to decide whether this would be preferable to the current state of the front page.\n\nBut I digress, I think opening with calling it \"piracy\" is not quite what you were going for"}, {"id": 50645905, "au": "ssl-3", "dom": 12, "sr": 22, "sc": 4.77, "ep": 5.94, "bs": 0.0, "d": 4, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.814, "fa": 0.34, "gp": 0.491, "bl": 0.0, "ds": 0.0, "txt": "My current \"sound card\" accepts 24-bit PCM audio (over USB or Dante or whatever), processes it in hardware as 32-bit floats, and emits 24-bit PCM audio (which is ultimately converted to analog for driving power amplifiers directly).\n\nThe physical volume control is a single-track potentiometer connected to GPIO that digitizes its value.  Gain/attenuation is thus adjusted in DSP-land.\n\nI don't have to care as much anymore -- I get all 16 original bits worth of dynamic range through that pipeline just fine, without truncation.  (But even though I don't care, the software mixer in the PC is still set to 100% and this never gets adjusted at all.)"}, {"id": 50642310, "au": "phkahler", "dom": 140, "sr": 23, "sc": 4.77, "ep": 4.92, "bs": 0.0, "d": 0, "age": 16.07, "grav": 183.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 24044, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "I hate this kind of thing.  Recently had Claude make an avatar with voice IO and the voice would always start each response quiet and then ramp up, causing me to not hear the first word. So Claude proposed having the app produce a small inaudible low frequency the entire time it was running to circumvent the automatic gain control that was somewhere in my setup.\n\nApps should be well behaved and have sensible volume settings of their own, so we don't get into a war over volume control."}, {"id": 50642489, "au": "aa-jv", "dom": 59, "sr": 24, "sc": 4.65, "ep": 5.09, "bs": 0.0, "d": 3, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1046, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 0.717, "fa": 0.95, "gp": 0.478, "bl": 0.0, "ds": 0.0, "txt": "If you have system alerts at 80% and movie sounds at 40% and chat alerts at 15%, you're going to not hear things if you turn master volume to 30%.\n\nThis fixes that.\n\nBut of course - you don't have to use it!"}, {"id": 50642464, "au": "aa-jv", "dom": 164, "sr": 25, "sc": 4.58, "ep": 4.58, "bs": 0.0, "d": 2, "age": 15.8, "grav": 178.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 1046, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.656, "fa": 0.0, "gp": 0.476, "bl": 0.0, "ds": 0.0, "txt": "That cats not going back in the bag. We have crossed the rubicon, in my opinion.\n\nBy way of cute anecdote - I'm already at the point that I no longer see the Linux portions of my DGX Spark cluster much  - instead I see the immense prompting power it provides, and if there is something I want to do that can't be sourced from the Linux repo, the models/agents/harness rig I'm running will just 'port' it for me.\n\nThis is now very, very productive in many ways.  I'm very sorry to report that I no longer need to seek applications for the task - I simply prompt them into existence, now.  I can do this because I have decades of systems software development experience, and am not afraid of newly minted CMakeLists.txt files, nossir ..\n\nThat capability will be consumer-grade within the year, I bet.\n\nYes, its scary.  No, its nothing to be worried about."}, {"id": 50641601, "au": "hypfer", "dom": 174, "sr": 26, "sc": 4.41, "ep": 4.92, "bs": 0.0, "d": 2, "age": 17.27, "grav": 205.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 5, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.251, "fa": 0.42, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "> on so called 'Hacker News'\n\nShare your thoughts please.\n\nBecause that road you probably do not want to go down if your good example is someone telling claude to \"take this and clone it. make no mistakes\" and then calls it a day.\n\nThat is not craftsmanship or interesting. It is \"I've pressed a button\".\n\nSo I agree that it doesn't belong on HN, but I think that's not what you wanted to say.\n\nI've also tried to actually turn this into something worthy of being here, but that was then downvoted and attempted to shut down by some 7 month old account.\n\nIdk dang maybe you want to do something about the vibekids?"}, {"id": 50644757, "au": "bob1029", "dom": 2, "sr": 27, "sc": 4.1, "ep": 5.64, "bs": 0.0, "d": 1, "age": 12.71, "grav": 126.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 27, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.091, "fa": 0.76, "gp": 0.627, "bl": 0.0, "ds": 0.0, "txt": "> Playing loudly mastered audio out of your PC will be very slightly different from the true audio source by about -0.1dbps with the compressor affecting the peaks.\n\nI've never had a setup where I would take my windows mixer output to 100%. I put the desired gain in the downstream amplification, not in the source. Maxing out your DSP chain because your speakers are insensitive is better addressed at the amplifier."}, {"id": 50642166, "au": "ZoomZoomZoom", "dom": 18, "sr": 28, "sc": 3.96, "ep": 5.5, "bs": 0.0, "d": 0, "age": 16.26, "grav": 186.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 2162, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 1.468, "bl": 0.0, "ds": 0.0, "txt": "Please, don't confuse the things even more than required and don't use \"Equalization\" unless you manipulate gain in a frequency-dependent manner.\n\nThis is loudness normalization.\n\nAlso, from what I can see from the description, the described algorithm would be susceptible to increasing gain of focused impulses, such as whistle or other pure tones. This is why it requires additional limiting at the end.\n\nDo people consider Windows loudness treatment desired, so it requires a reimplementation?"}, {"id": 50642049, "au": "getfacl", "dom": 60, "sr": 29, "sc": 3.89, "ep": 4.77, "bs": 0.0, "d": 2, "age": 16.45, "grav": 190.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 8, "k": 223, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.272, "fa": 0.42, "gp": 0.404, "bl": 0.0, "ds": 0.0, "txt": "> But if I've got multiple applications going on\n\nI guess this is not something I do. I can't think of any situation where I would want to be listening to audio from multiple application at once.\n\nI mostly listen to music and I put a lot of effort into getting bit perfect playback. I use visual alerts rather than sound effects where ever possible. If I'm on a call or gaming them I'm not listening to something else at the same time."}, {"id": 50641411, "au": "aa-jv", "dom": 162, "sr": 30, "sc": 3.88, "ep": 4.25, "bs": 0.0, "d": 0, "age": 17.69, "grav": 213.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1046, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.543, "fa": 0.0, "gp": 0.43, "bl": 0.0, "ds": 0.0, "txt": "The interesting part of this, is the reverse engineering .. features of one operating system are now easily transmutable to another operating system, within the limits of the operator and the models' access to the system.  This example is just about a simple EQ function - but we have seen in recent times, full ports of previously-though impossible programs from one OS to the other.\n\nI imagine a day in the future where we won't really have a distinction between operating systems - we'll be running prompts, instead."}, {"id": 50642887, "au": "sigbottle", "dom": 23, "sr": 31, "sc": 3.85, "ep": 5.4, "bs": 0.0, "d": 1, "age": 15.1, "grav": 165.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 803, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.643, "fa": 0.28, "gp": 0.509, "bl": 0.0, "ds": 0.0, "txt": "I'm a CS guy who somehow landed at a DSP job, no physics or engineering background at all.\n\nWhat is equalization? The \"most specific\" description I can come up with is \"estimating a channel and correcting for it\", where \"channel\" specifically means, attenuation, phase, and multipath corrections, and it assumes an LTI effect (meaning things like carrier frequency offset are not included, despite it being an effect you should correct for). If that description is accurate, why is that a good characterization of a class of noise?"}, {"id": 50644977, "au": "vt240", "dom": 104, "sr": 32, "sc": 3.66, "ep": 4.32, "bs": 0.0, "d": 0, "age": 12.37, "grav": 121.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 284, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.698, "bl": 0.0, "ds": 0.0, "txt": "I always preferred the tune-able algorithm implemented in Media Player Classic/MPC-HC for movies on Windows.  Same with the ease of adjusting the audio switcher for downmixing and a lot of other features.  The Windows built-in one is pretty good though for general use.  On my Lenovo it is disabled in favor of some Dolby version which is significantly inferior."}, {"id": 50643368, "au": "ryandrake", "dom": 50, "sr": 33, "sc": 3.66, "ep": 4.32, "bs": 0.0, "d": 2, "age": 14.39, "grav": 153.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.477, "fa": 0.0, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "When it comes to enjoying media with non-audiophiles, you are right. But it still makes me a little sad.\n\nI worked hard on my home theater system, amp and speaker selection, tuning every audio and video setting so that everything's dead on, and I have all that wonderful dynamic range. When I play a piece of music for myself, it's glorious! Then, my wife, kid, and I sit down to watch a movie, and all night it's \"I can't hear the dialog! Turn it up!\" and \"Now the explosions are too loud! Turn it down!\" and then \"Is there any sound? Turn it up! I thought this was a good stereo!\" over and over, and I just sit there like a dummy, adjusting the volume control for two hours."}, {"id": 50641874, "au": "vrganj", "dom": 120, "sr": 34, "sc": 3.58, "ep": 5.12, "bs": 0.0, "d": 0, "age": 16.73, "grav": 195.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 5801, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.565, "fa": 0.0, "gp": 0.994, "bl": 0.0, "ds": 0.0, "txt": "It feels like while this is cool as a nerd that wants good things, I worry about the effect this sort of thing will have for Linux and the Open Source community in the long term.\n\nObviously, no serious project is going to upstream code that is a Claude RA of proprietary code.\n\nBut the harm is deeper than that: Now that this code is out there, it kind of poisons the well for somebody else to build something similar in a less sketchy way. Now all Loudness Equalization code will be looked at through a lens of suspicion, they will be seen as potential legal exposure.\n\nAs a nerd that likes building things myself and that likes contributing to Open Source projects, that feels like a shame."}, {"id": 50642579, "au": "nbevans", "dom": 158, "sr": 35, "sc": 3.58, "ep": 4.17, "bs": 0.0, "d": 0, "age": 15.59, "grav": 174.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 587, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "Isn't this just theft and inevitably going to cause a lawsuit?\n\nWhat's next? Stealing all the DSP algorithms that Dolby and THX et al put together and ride their entire business on?"}, {"id": 50645285, "au": "ssl-3", "dom": 3, "sr": 36, "sc": 3.42, "ep": 4.74, "bs": 0.0, "d": 2, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.271, "fa": 0.34, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I always kept the software mixer at 100% (ie, unity) because when I've already paid for all 16 bits, it is my intent to keep each and every one of them available for use.\n\nI then ran the volume up and down with a knob on the preamp.\n\nIt worked exactly the same as it would if I were playing a compact disc in a regular standalone audio CD player."}, {"id": 50650536, "au": "dasyatidprime", "dom": 28, "sr": 37, "sc": 3.35, "ep": 4.89, "bs": 0.0, "d": 3, "age": 3.77, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 727, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.838, "fa": 0.0, "gp": 0.394, "bl": 0.0, "ds": 0.0, "txt": "Well Actually TRS is supposed to refer to the kind with three conductors total (often two signal + one ground for stereo) and doesn't specify the size. Stands for tip–ring–sleeve, because that's what the contact points look like. You can add and remove R's to refer to different conductor counts, so an unbalanced mono cable is just a TS, and the headset I use uses an ⅛-in TRRS connector for carrying stereo signal to the headphones and mono signal from the microphone simultaneously.\n\nIn practice I do think people often say TRS regardless of how many R are actually present. I know there's some de facto intercompatibility with incorrect ring numbers at least in consumer gear, because a mismatch will either short a signal to ground or leave it floating, but the size thing is still relevant."}, {"id": 50642521, "au": "jareklupinski", "dom": 101, "sr": 38, "sc": 3.18, "ep": 4.28, "bs": 0.0, "d": 0, "age": 15.68, "grav": 176.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3319, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.885, "fa": 0.34, "gp": 0.851, "bl": 0.0, "ds": 0.0, "txt": "Windows Loudness Equalization was the only way i could actually enjoy early 2010's youtube memes\n\nyoutube seems to have added it to some videos, but humor has moved on it seems?"}, {"id": 50641971, "au": "pocketman", "dom": 36, "sr": 39, "sc": 3.17, "ep": 4.27, "bs": 0.0, "d": 0, "age": 16.58, "grav": 192.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 12, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 1.249, "bl": 0.0, "ds": 0.0, "txt": "No need to steal this, I would guess that a “limiter” is what is wanted here, and there are plenty of algorithms available. It won’t take away from the dynamics of the audio either, it will merely cap the loudest parts so that one isn’t exceedingly loud while the next is normal."}, {"id": 50649840, "au": "kstrauser", "dom": 4, "sr": 40, "sc": 3.07, "ep": 3.95, "bs": 0.0, "d": 3, "age": 5.26, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 250, "qw": 0, "k": 34291, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.541, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "This is it. You want to keep the full levels up until the moment you don't want to use them anymore.\n\nFor those with a math background but not electronic music experience:\n\nYou're doing arithmetic with ints. Suppose you have an 8-bit volume range between 0..255. You cut the volume in half by dividing by 2, rounding down. Now your range is 0..127. Then you want to double the volume again, so you multiply everything by 2 again. But now your range is 0..254 (not 255), and you only have the even numbers. That series of samples you took like [125, 126, 127, 128, 129]? Now it's [124, 126, 126, 128, 128]. You'll never get those original values back. You can't. They're lost.\n\nSo instead, you keep that full range up until you get to the speakers, and then you cut the volume down at that point. When you turn it back up, you have the full range of values again.\n\nIt's almost exactly the same for analog gear, too. In general, you always want to run your pre-amplifier stages as close to maximum as possible without actually maxing them out. (If you do, your guitars sound great and distorted, but almost everything else just sounds bad.) If you start with a CD-quality signal at nearly full strength up until the amps, the output will sound crystal clear. But if your input signals are turned way down, and you have to crank the amps to bring everything up to the desired volume, you'll end up ampli"}, {"id": 50646440, "au": "SilentM68", "dom": 154, "sr": 41, "sc": 3.05, "ep": 4.15, "bs": 0.0, "d": 0, "age": 10.29, "grav": 91.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 62, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.297, "fa": 0.28, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "I notice that some audio playback in Facebook videos, for example, play at different levels due to the way they are spliced together by the creators. Would pw-loudness-eq be able to intelligently adjust the audio playback and normalize all audio on the fly?"}, {"id": 50643103, "au": "gbraad", "dom": 31, "sr": 42, "sc": 2.96, "ep": 3.77, "bs": 0.0, "d": 0, "age": 14.74, "grav": 159.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1074, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.105, "fa": 0.0, "gp": 0.81, "bl": 0.0, "ds": 0.0, "txt": "I don't get why this needed to do reverse engineered from a windows dll. This is not magic, ...\n\nNote: seems many share the same opinion. This is quite simple to implement and wonder why this approach was taken; it can get unethical soon."}, {"id": 50641395, "au": "ephaeton", "dom": 167, "sr": 43, "sc": 2.77, "ep": 3.87, "bs": 0.0, "d": 0, "age": 17.76, "grav": 215.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.388, "fa": 0.0, "gp": 0.416, "bl": 0.0, "ds": 0.0, "txt": "If we enable this: can we _not_ have the output limiter always active please?\n\nNice effort, but frankly, I hope this will not be usurped/consumed/included by pipewire, worse yet, on by default.\n\nI'm doing audio engineering on linux, and (hidden) system-wide EQs or compressors are a true problem for that..."}, {"id": 50641428, "au": "aa-jv", "dom": 57, "sr": 44, "sc": 2.41, "ep": 3.95, "bs": 0.0, "d": 1, "age": 17.66, "grav": 213.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 1046, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.317, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "This is what you want, when that composition is based on multiple, discrete, individual applications generating audio, though.\n\nSure, if you're listening to a mastered recording - turn this off and/or simply don't use it.\n\nBut if I've got multiple applications going on, I don't want my system beep to completely overpower the audio those applications are generating, independent of each other - I want all the sounds in my system, whether effects or audio streams, to 'sit in the pocket'.  Its great that this has made its way to those of us using Linux for high performance audio applications."}, {"id": 50650452, "au": "dasyatidprime", "dom": 5, "sr": 45, "sc": 2.38, "ep": 3.26, "bs": 0.0, "d": 4, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 727, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.387, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is true for integer sample processing, but my impression was that it's much more common to do software mixing in 32-bit float across the board these days; technically you still want to avoid an unnecessary profusion of gain multiplications both because of the unnecessary CPU work and because there's still some rounding error accumulation, but you don't hard-lose relative precision in the same way, right?"}, {"id": 50645005, "au": "toast0", "dom": 53, "sr": 46, "sc": 2.37, "ep": 3.69, "bs": 0.0, "d": 3, "age": 12.33, "grav": 120.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's probably worth seeing if you can setup presets. Your current settings and then a 'theater mode' where there's some light compression, the center channel is boosted and the subwoofer(s) are limited.\n\nAnd then for some films, you'll need to turn down the sub a bit more, cause I dunno, some mixes are rediculous... shake my house for a rocket launch, sure; shake my house cause a compact car is rumbling down the street is a bit much."}, {"id": 50648472, "au": "cwillu", "dom": 8, "sr": 47, "sc": 2.32, "ep": 3.86, "bs": 0.0, "d": 4, "age": 7.55, "grav": 58.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 8298, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.587, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "As long as the final output's range covers at least 16 bits, it matters not in the slightest if the source was 32 bit and the chain was 24.\n\n24 bits is enough to record a grasshopper next to a jackhammer.  32 bits is enough to record that same grasshopper next to spacex's superheavy starship booster during liftoff.\n\nThe only reason to have more than 16 bits is to permit software processing (including volume control) without quality loss."}, {"id": 50645433, "au": "ck2", "dom": 176, "sr": 48, "sc": 2.22, "ep": 2.88, "bs": 0.0, "d": 0, "age": 11.74, "grav": 111.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 19, "qw": 0, "k": 32346, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": ["https://winampplugins.co.uk/enhancer/enhancer.html"], "ig": 0.884, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "now reverse-engineer the Winamp \"Enhancer\" DSP plugin\n\n* https://winampplugins.co.uk/enhancer/enhancer.html\n\nbecause I've never found anything else that makes everything sound so amazing"}, {"id": 50648296, "au": "lpribis", "dom": 25, "sr": 49, "sc": 2.19, "ep": 3.73, "bs": 0.0, "d": 3, "age": 7.79, "grav": 60.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 322, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A \"graphic equalizer\" in the audio world is what you're describing (array of band passes that you independently adjust the gains of then sum back up). Parametric EQs don't necessarily split frequency bands like that, and \"equalization\" in the comms/RF sense can be wildly different. E.g. a viterbi decoder could be considered a form of equalization, or an MMSE. Both of which are so far off a classic bank of band passes.\n\nIt's such an overloaded term that it ceases to mean anything other than \"an algorithm that corrects for the environment\"."}, {"id": 50644376, "au": "diego_sandoval", "dom": 72, "sr": 50, "sc": 2.17, "ep": 3.71, "bs": 0.0, "d": 1, "age": 13.19, "grav": 133.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1732, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.412, "fa": 0.0, "gp": 0.268, "bl": 0.0, "ds": 0.0, "txt": "For a couple of years, my hearing was extremely sensitive (for being an ignorant musician that didn’t wear hearing protection), and watching Youtube videos was really annoying, since some idiots put jumpscares with loud noises in their videos.\n\nDuring those years, I had to use a loudness normalizer whenever I used headphones."}, {"id": 50643629, "au": "parineum", "dom": 83, "sr": 51, "sc": 2.15, "ep": 3.69, "bs": 0.0, "d": 5, "age": 14.09, "grav": 148.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2550, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.233, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This happens a lot when you're listening to an audio stream that isn't mixed for your speaker setup. If you're listening on a laptop, you've got 2.0 stereo setup. If whatever audio player you're using is playing the 5.1 audio stream, it's going to have to do some software downmixing to 2.0 and that isn't going to perform as well as a specifically mixed 2.0 stereo track that usually is available on the disc/stream the media was distributed on originally."}, {"id": 50641597, "au": "skeledrew", "dom": 105, "sr": 52, "sc": 2.06, "ep": 3.16, "bs": 0.0, "d": 0, "age": 17.27, "grav": 205.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.779, "fa": 0.0, "gp": 0.918, "bl": 0.0, "ds": 0.0, "txt": "Been wanting something like this for a while now and never got around to looking. Although this probably still isn't quite there as I want something that works within app. Ain't nothing like watching something and having to turn the volume way up because of seriously low whispering, then having to turn it way down again because of a sudden loud scene."}, {"id": 50650643, "au": "kstrauser", "dom": 6, "sr": 53, "sc": 2.03, "ep": 3.58, "bs": 0.0, "d": 5, "age": 3.55, "grav": 21.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 34291, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.074, "fa": 0.28, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "That should be the case, but AFAIK there are still lots of integer units between here and there. That's especially likely if there are any external USB devices involved. For example, while it's been a while since I looked, last I checked a lot of outboard digital-to-audio converters (aka DACs) used 16-bit integers."}, {"id": 50642323, "au": "noselasd", "dom": 145, "sr": 54, "sc": 1.98, "ep": 3.08, "bs": 0.0, "d": 1, "age": 16.05, "grav": 182.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2926, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.309, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ok for what ? That's the important thing.\n\nGenerally though, MIT allows you to use the code however you like.\n\nBut you have to include the original copyright. You can't hold the authors liable for anything or use their trademark/branding. You can combine the code pretty much anything as long as the MIT licensed code retains its license and copyright. You can't remove the MIT license."}, {"id": 50642483, "au": "hackinthebochs", "dom": 45, "sr": 55, "sc": 1.95, "ep": 3.5, "bs": 0.0, "d": 1, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 6094, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "I listen to most of my music (instrumental) these days with loudness equalizing on. Used to be a big audiophile, now when I play music it's just background. High dynamic range works against having a pleasant sound for background music as either the loud parts are too loud or the quiet parts imperceptible. Compressing the dynamic range increases enjoyment."}, {"id": 50645930, "au": "icegreentea2", "dom": 19, "sr": 56, "sc": 1.95, "ep": 3.28, "bs": 0.0, "d": 1, "age": 11.03, "grav": 101.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5152, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.127, "fa": 0.0, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "You're right that it's a compressor or normalizer, but the name of the setting in Windows is \"Loudness Equalization\".\n\nIt's off by default, you need to toggle it on by output device.\n\nI think its most desirable when:\n\na) Your laptop speakers kinda suck\n\nb) You're listening to a podcast or random video in a noisy environment\n\nc) a+b"}, {"id": 50641543, "au": "hypfer", "dom": 169, "sr": 57, "sc": 1.95, "ep": 3.27, "bs": 0.0, "d": 0, "age": 17.41, "grav": 208.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "Cool that it is possible, but also just piracy/stealing.\n\nThis feels like a problem where an equivalent result would've been possible by maybe taking the Windows implementation as a starting point, then further pondering together with the clanker what exactly makes it tick and why.\n\nAnd then build something new out of those learnings.\n\nOr at the very least don't make it as blatantly obvious that it is simply stolen."}, {"id": 50641658, "au": "kqp", "dom": 58, "sr": 58, "sc": 1.95, "ep": 3.2, "bs": 0.0, "d": 2, "age": 17.15, "grav": 203.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 663, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "But I do multiple things at once. I don’t want notifications to be undisturbing if I’m listening to background music and booming if I’m watching a movie, I want them to be an appropriate volume for notifications. Sometimes, mostly based on environment, I do want everything quieter or louder, but then I adjust the system volume, not the volume of random apps."}, {"id": 50644802, "au": "marcosdumay", "dom": 24, "sr": 59, "sc": 1.95, "ep": 3.2, "bs": 0.0, "d": 2, "age": 12.66, "grav": 125.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 3, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "> What is equalization?\n\nAn equalizer is a multi-filter device that demultiplexes your sound into several channels (usually by frequency), filters each one independently, and then merges the result back.\n\nIt has that name because it's supposed to be used for reversing the non-linearities on your sound system, so it amplifies all parts (usually frequencies) by the same amount. But the device by itself doesn't make anything equal, and many people like to use it to distort the sound, what makes the name very confusing."}, {"id": 50642482, "au": "bryanlarsen", "dom": 37, "sr": 60, "sc": 1.95, "ep": 3.16, "bs": 0.0, "d": 1, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 43695, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.286, "bl": 0.0, "ds": 0.0, "txt": "It's not the algorithm, it's the tuning of that algorithm.   I guess that Microsoft tested this across a bunch of different computer speakers and users.  Likely resulting in something that is optimal for nobody but reasonably good for a broad range."}, {"id": 50644040, "au": "vrganj", "dom": 130, "sr": 61, "sc": 1.95, "ep": 8.14, "bs": 5.09, "d": 10, "age": 13.61, "grav": 140.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 265, "qw": 17, "k": 5801, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 9, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.822, "fa": 0.7, "gp": 1.283, "bl": 1.92, "ds": 0.0, "txt": "Agreed, enough talk about the Waltons in specific, the point is that in their socioeconomic system, they have private ownership of their large enterprise.\n\nThe piece of paper denoting private ownership is just as arbitrary and socially constructed as the one giving Microsoft the right to Windows.\n\nLet me give you an example of what I mean when I talk about socially and ideologically constructed realities.\n\n> Property rights presume people can control specific objects\n\nYes, sure.\n\n> and make sense given resources are finite\n\nThis is where we cross into ideology. Yes, there is a need to assign resources. No, that doesn't automatically mean private property rights are the optimal solution, that is precisely where we unconsciously smuggle in our ideological priors.\n\nFor example, from my own priors, I would disagree because in my opinion the most precious resource is our biosphere and in my view informed by that concern, runaway shareholder capitalism is threatening it, through irresponsible resource use, especially when it comes to AI.\n\nNow, you may disagree with that statement, and based on your own priors you very well might.\n\nBut my point still stands. What follows is that your whole perception of harm only works if you follow your ideology and treat one of those papers as more sacred than the other.\n\nI choose to reject either paper. I am concerned about the material reality on "}, {"id": 50644296, "au": "asveikau", "dom": 16, "sr": 62, "sc": 1.95, "ep": 2.89, "bs": 0.0, "d": 2, "age": 13.29, "grav": 135.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's kind of in the name. When an application wants to be mixed with sounds played by other applications, it opens the audio API in shared mode. When it wants exclusive access to the audio hardware (maybe some kind of professional audio scenario), it opens in exclusive mode."}, {"id": 50646452, "au": "danadam", "dom": 157, "sr": 63, "sc": 1.95, "ep": 2.79, "bs": 0.0, "d": 1, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 76, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.773, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not by default. By default they only get a limiter that engages when the signal goes above 0.985 = -0.13 dBFS after the volume change, so practically only if you leave the volume at 100%."}, {"id": 50642348, "au": "ndriscoll", "dom": 123, "sr": 64, "sc": 1.95, "ep": 2.75, "bs": 0.0, "d": 3, "age": 16.0, "grav": 181.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.17, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What better way than to make it painfully obvious that all of this stuff is right there, able to be used by anyone, and it's only a nonsensical belief that one \"shouldn't\" that stops you?\n\n\"Serious\" projects like Redhat might not take it, but it's easy enough to have overlays of owner software that just does whatever someone wants, and for a distribution to emerge that enables this stuff by default for people who don't care about imaginary property."}, {"id": 50646178, "au": "ssl-3", "dom": 51, "sr": 65, "sc": 1.95, "ep": 2.71, "bs": 0.0, "d": 3, "age": 10.64, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Turn it up for the dialogue.  Stay for the explosions.  Hands off the volume control.\n\nExcept:  Not everybody enjoys that.\n\nSo...  Compress it.  Some media players and audio systems have that dynamic range compression functionality built-in, and it can often be added to systems that use things like Kodi or VLC.  Compression can essentially run the volume control up and down on your behalf.  (Turn that stuff back off again when the wife and kids aren't home.  Or don't.  It's your audio system; please use it however it is most pleasing.)"}, {"id": 50643653, "au": "simonra", "dom": 43, "sr": 66, "sc": 1.95, "ep": 2.67, "bs": 0.0, "d": 1, "age": 14.04, "grav": 147.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 71, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.136, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When I've used it in the past it has most often been to make voice calls with very quiet participants easier to follow. So basically putting everyone at the same loudness and obliterating dynamics, so that I can hear everyone and also not have my ears blown out.\n\nWhen I've wanted limiters I've always just turned down the global volume."}, {"id": 50642021, "au": "vrganj", "dom": 122, "sr": 67, "sc": 1.95, "ep": 2.66, "bs": 0.0, "d": 2, "age": 16.5, "grav": 190.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 5801, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.133, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sure. But to get there, we need to end incentives to have copyright and these licensing agreements in the first place. We'd need to effectively end tech capitalism, for one.\n\nListen, I'm on board with that. I'm probably one of the few open Marxists on this forum, check my other comments. I also believe that because code is the key means of production of our time, in many ways rms was a successor to Marx.\n\nBut until we can convince a critical mass of people of that view and enact systemic change, those factors are still real and need to be taken into account."}, {"id": 50642235, "au": "cannonpalms", "dom": 171, "sr": 68, "sc": 1.95, "ep": 2.65, "bs": 0.0, "d": 2, "age": 16.17, "grav": 184.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 217, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 1.129, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That extends to claims resulting from otherwise innocent usage of AI tools, not deliberately reverse engineering proprietary software and publishing it under a different license."}, {"id": 50643497, "au": "InsidiousWombat", "dom": 152, "sr": 69, "sc": 1.95, "ep": 5.67, "bs": 3.05, "d": 2, "age": 14.23, "grav": 150.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.717, "fa": 0.28, "gp": 0.574, "bl": 1.15, "ds": 0.0, "txt": "It's honestly amazing that none of the popular video conferencing apps have\n\n* user's own volume meter - you might not even know your sound is fucked up\n* everybody's else VU meter -arguably less important but useful for the meeting host\n* per talker normalization by default - it's just sensible\n* loopback test - old skype had loopback number that returned your signal with delay so you could test your setup - nothing like this here\n\nBest we get is some badly made laggy meter when connecting in MS teams"}, {"id": 50641679, "au": "Yokolos", "dom": 90, "sr": 70, "sc": 1.95, "ep": 2.56, "bs": 0.0, "d": 1, "age": 17.1, "grav": 202.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 487, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Then this isn't for you, is it? This is exactly what I want, because the audio mixing on movies is such that on stereo speakers, the spoken dialogue is whisper quiet and anything beyond that blows out my ears if I turn up the volume to be able to understand the dialogue.\n\nI don't really understand takes like this. You realize that not everything is meant for you or for every demographic, right? Things are allowed to be for some people and not for others."}, {"id": 50643326, "au": "Pxtl", "dom": 49, "sr": 71, "sc": 1.95, "ep": 2.45, "bs": 0.0, "d": 2, "age": 14.44, "grav": 154.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 17739, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.042, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Just give me a simple slider in the volume control. If KDE Plasma can give me sliders popping out for all the Output Devices I'm not currently using (and will never use), I can have a slider for loudness equalisation."}, {"id": 50643516, "au": "gchamonlive", "dom": 78, "sr": 72, "sc": 1.95, "ep": 2.43, "bs": 0.0, "d": 4, "age": 14.2, "grav": 150.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 4455, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 1.033, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've originally said in the comment that a soundbar goes a long way. I have a 3.1.2 soundbar, the one that has two front speakers aimed to the ceiling so it simulates surround sound without rear speakers.\n\nIt's really good, way better than regular TV speakers. I calibrate the audio for regular dialogues and let the loud parts get loud."}, {"id": 50642274, "au": "alt227", "dom": 62, "sr": 73, "sc": 1.95, "ep": 2.39, "bs": 0.0, "d": 4, "age": 16.13, "grav": 184.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3331, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.017, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is easily adjusted by individual volume sliders on friends in discord etc. No need to have an algorithm ruin musical dynamics to achieve this."}, {"id": 50643049, "au": "mortos", "dom": 81, "sr": 74, "sc": 1.95, "ep": 2.39, "bs": 0.0, "d": 3, "age": 14.83, "grav": 161.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 74, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 1.015, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What you're describing is dynamic range, where loud things are loud and quiet is quiet. The loudness wars is the opposite, where dynamic range is crushed to increase the perceived loudness. You can always correct this with a \"night mode\" usually found in your TV or sound bar but you can never get back the lost dynamic range.\n\nFor your second bit, while it's not quite the same, does your player not have a loudness leveling option?"}, {"id": 50645874, "au": "drnick1", "dom": 113, "sr": 75, "sc": 1.95, "ep": 2.38, "bs": 0.0, "d": 1, "age": 11.14, "grav": 103.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 0.976, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Perhaps the concept of intellectual property should be completely abandoned or at least significantly revamped. When I buy a chair, I am free to disassemble it, document the individual parts, and make and sell clones. Why should software be different?"}, {"id": 50642193, "au": "layer8", "dom": 150, "sr": 76, "sc": 1.95, "ep": 2.31, "bs": 0.0, "d": 1, "age": 16.23, "grav": 185.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.645, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s an option in the output device Properties dialog.\n\nIt adds latency, so you may not want to have it on by default."}, {"id": 50643062, "au": "ozgrakkurt", "dom": 74, "sr": 77, "sc": 1.95, "ep": 2.3, "bs": 0.0, "d": 1, "age": 14.8, "grav": 160.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1337, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "It is more of a mixed case issue. You may be listening to music, then watching a youtube video, then playing a movie in vlc, then opening a audio message on whatsapp web.\n\nOr you could be watching a movie that has annoying jumps like dune?"}, {"id": 50645026, "au": "ltbarcly3", "dom": 155, "sr": 78, "sc": 1.95, "ep": 2.25, "bs": 0.0, "d": 0, "age": 12.3, "grav": 120.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 4254, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 0.794, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "Do the research and make your own algorithm.  Just stealing someone else's work and giving it away is exactly the kind of behavior that people attacked Microsoft for."}, {"id": 50651795, "au": "Spivak", "dom": 40, "sr": 79, "sc": 1.95, "ep": 2.23, "bs": 0.0, "d": 3, "age": 0.52, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 19462, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We finally have the tools to actively combat closed source software and open up the knowledge to everyone and you're getting feisty."}, {"id": 50643098, "au": "mortos", "dom": 91, "sr": 80, "sc": 1.95, "ep": 2.23, "bs": 0.0, "d": 2, "age": 14.74, "grav": 159.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 23, "k": 74, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.439, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> This is exactly what I want, because the audio mixing on movies is such that on stereo speakers, the spoken dialogue is whisper quiet\n\nYou probably want a proper stereo mix or a dialogue boost option. Movies are mixed such that the dialogue comes through the center speaker which you don't have, so you need that problem fixed."}, {"id": 50642726, "au": "ndriscoll", "dom": 129, "sr": 81, "sc": 1.95, "ep": 6.4, "bs": 4.24, "d": 9, "age": 15.38, "grav": 170.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 307, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 8, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.672, "fa": 0.34, "gp": 1.038, "bl": 1.6, "ds": 0.0, "txt": "There truly is a qualitative difference between moral scenarios that involve tangible property (e.g. theft) and those that don't (e.g. copying): whether I copy or not has literally zero effect on the other party. None. Saying theft has exactly zero effect on their wellbeing is simply wrong. It maybe has 0.0000001 units of effect, which is close to zero, and your values may be that it's \"close enough,\" but it is still not zero. Not interacting with someone actually has precisely zero effect on them. Whether I just use the existing sound system or this plugin affects no one. Whether I grow my tomatoes or buy from Costco has no effect on Walmart. Microsoft is not part of the scenario. Walmart is not part of the scenario.\n\nGrowing your own tomatoes does not affect them except in their imagination. You are not interacting with them at all. You are not their tomato buying thrall. It's the \"I consent. I consent. I don't\" meme. Microsoft is the incel. You and Linux are Chad and Stacey.\n\nProperty rights presume people can control specific objects, and make sense given resources are finite. If there are only 1 billion tomatoes in the world right now, we must decide who gets them. If there's a tomato in front of us, only one of us can have it, or we can each only get a fraction. Rights to ideas presume people can control people's general behavior. Ideas are not finite: when you learn my i"}, {"id": 50643455, "au": "skydhash", "dom": 77, "sr": 82, "sc": 1.95, "ep": 2.07, "bs": 0.0, "d": 3, "age": 14.28, "grav": 151.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve got a 5.1 setup (not a very expensive one) and I can say that the inaudible part of Tennet are basically irrelevant. The dynamic range part is a big part of the feeling of movies, even when purposefully manipulated and not realistic. But having a specific speaker for dialogs and important sound is great because your brain can tune itself to it."}, {"id": 50643190, "au": "voakbasda", "dom": 141, "sr": 83, "sc": 1.95, "ep": 2.0, "bs": 0.0, "d": 1, "age": 14.62, "grav": 157.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4327, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_cause", "flbl": "Reverse & Cause (Engineering)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you use that hack, please do not ship it.  That will cause all sorts of problems for people that have their Bluetooth headphones connected to both their computer and phone at the same time."}, {"id": 50642381, "au": "joenot443", "dom": 63, "sr": 84, "sc": 1.95, "ep": 1.96, "bs": 0.0, "d": 5, "age": 15.96, "grav": 181.0, "surf": 0.0, "fade": "c00", "dt
