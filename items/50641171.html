ays, you just can't have it if you have noise. Trying to keep it just makes the entire experience horrible."}, {"id": 50642947, "au": "tialaramex", "dom": 38, "sr": 94, "sc": 1.58, "ep": 1.58, "bs": 0.0, "d": 2, "age": 14.98, "grav": 163.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.471, "fa": 0.0, "gp": 0.323, "bl": 0.0, "ds": 0.0, "txt": "Also, different, even if better, is different and most people will notice. Even if they wouldn't have significantly preferred A or B, they're used to A and so if you offer B then they're mad, why is this different?"}, {"id": 50642650, "au": "brnt", "dom": 89, "sr": 95, "sc": 1.51, "ep": 1.51, "bs": 0.0, "d": 1, "age": 15.48, "grav": 172.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 6108, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.643, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A lot of musical doesnt actually these days, including remastered versions of older music, since we all now listen through YouTube and Spotify on phones and laptop speakers.\n\nI also rarely take time for listening but I do keep my Flacs and specific remasters around. But for TV I hate dynamic range, we always have it on low anyway with subtitles on because we actually do not like the cinema experience at all."}, {"id": 50645452, "au": "sirtaj", "dom": 67, "sr": 96, "sc": 1.43, "ep": 1.43, "bs": 0.0, "d": 1, "age": 11.72, "grav": 111.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 629, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.547, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Unless you're listening to a speaker setup that's capable of the dynamic range need for an orchestra, you need some level of high pass, limiting and compression. I can imagine why they optimised for the tinny pc and laptop speakers people were connecting to their computers."}, {"id": 50647817, "au": "teolandon", "dom": 42, "sr": 97, "sc": 1.41, "ep": 1.41, "bs": 0.0, "d": 1, "age": 8.46, "grav": 68.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 457, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.602, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What you described is taking away from the dynamics of the audio. That's what a limiter does, definitionally and fundamentally."}, {"id": 50648745, "au": "gbraad", "dom": 35, "sr": 98, "sc": 1.34, "ep": 1.34, "bs": 0.0, "d": 4, "age": 7.12, "grav": 53.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1074, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.571, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Describe what the issue is, as I am sure someone can help/improve it: it might be multiple active voices/apps? Can be done, I just don't use this (especially not that way)."}, {"id": 50645276, "au": "TiredOfLife", "dom": 34, "sr": 99, "sc": 1.33, "ep": 1.33, "bs": 0.0, "d": 3, "age": 11.94, "grav": 114.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 12047, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.567, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have tried a bunch of those EasyEffects pressets and none are even close to what windows does"}, {"id": 50645791, "au": "bob1029", "dom": 70, "sr": 100, "sc": 1.31, "ep": 2.16, "bs": 0.85, "d": 4, "age": 11.27, "grav": 105.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "hear_volume", "flbl": "Hear & Volume (Piano)", "urls": [], "ig": 0.918, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "The piano's soundboard is an absolutely massive acoustic radiator. You can emulate the piano accurately if the pianist is playing something gentle and in the middle registers. If the pianist is playing Rachmaninoff, I think it might actually be worse than the cymbals in some ways."}, {"id": 50650871, "au": "WarOnPrivacy", "dom": 103, "sr": 101, "sc": 1.29, "ep": 1.29, "bs": 0.0, "d": 0, "age": 2.98, "grav": 18.0, "surf": 11.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 12239, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equalization_windows", "flbl": "Equalization & Windows (Loudness)", "urls": [], "ig": 0.457, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "I'd like to get Windows Loudness Equalization - for Windows.\n\nI haven't seen it in any of my Windows installs for some time. I keep looking for it."}, {"id": 50642572, "au": "ndriscoll", "dom": 127, "sr": 102, "sc": 1.26, "ep": 3.81, "bs": 2.54, "d": 7, "age": 15.6, "grav": 174.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 1.619, "fa": 0.0, "gp": 0.0, "bl": 0.96, "ds": 0.0, "txt": "A microharm is different from literally zero harm, and yes theft takes from the victim, and leads to things like store closures and so-called \"food deserts\" as it actually incurs a cost to provide these things. Copying ideas does not. Whether or not I use this sound plugin, I'm not using Windows. I am not their target market and never will be. There is literally zero possible impact on Microsoft. It's more like saying growing your own tomatoes in your backyard affects the Waltons. No it does not.\n\nA cursory look suggests that Nintendo settled with their LLC, and didn't go after the individual developers. They likely just took the donations (or sales? Was yuzu the one selling early access to builds) to the project."}, {"id": 50642886, "au": "goda90", "dom": 47, "sr": 103, "sc": 1.25, "ep": 1.25, "bs": 0.0, "d": 2, "age": 15.1, "grav": 165.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5517, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_volume", "flbl": "Audio & Volume (Default)", "urls": [], "ig": 0.459, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Sometimes I'll listen to a piece on a sound system of some kind and just wish I could go back to when I heard it played by a live orchestra and it shook my soul. That missing range matters sometimes."}, {"id": 50641899, "au": "Yokolos", "dom": 93, "sr": 104, "sc": 1.24, "ep": 1.24, "bs": 0.0, "d": 3, "age": 16.69, "grav": 194.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 487, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "property_harm", "flbl": "Property & Harm (Giving)", "urls": [], "ig": 0.526, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No, it's just complaining. Which is weird, because this is something somebody did in their free time because they wanted it and because they felt some other people might want this particular functionality, and they're providing it for free to others. Which from my point of view is commendable, even if it didn't appeal to me personally.\n\nBut that's par for the course for Hacker News, I guess. We can /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
