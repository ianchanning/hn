"useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 6}, {"category": "low_cred_or_joke", "count": 5}], "story_anchors": ["system", "citro", "hydraulic", "height", "ride", "fluid", "road", "suspension", "cars", "wheel", "comfort", "steering", "far", "range", "rear", "driving", "front", "place"], "largest_root": {"root_id": 50671238, "author": "Squeeeez", "slots": 20, "start_dom": 9, "end_dom": 28, "share_pct": 24.7, "top_dom1_age": 18.7, "top_dom1_author": "jacquesm"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50675559, "au": "yason", "dom": 52, "sr": 1, "sc": 8.77, "ep": 8.77, "bs": 0.0, "d": 1, "age": 8.95, "grav": 74.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 469, "qw": 0, "k": 8350, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.746, "fa": 1.23, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "Reliability is not really the issue. The 2000's hydropneumatic Citroëns rarely have problems with pipes and the suspension spheres have double-membrane so they won't leak the nitrogen and they'll last for years and years. To give some idea, having owned multiple hydraulic and non-hydraulic suspension cars in the last 25 years:\n\n- I've changed countless dead/leaked shock absorbers on cars with springs, as well as broken springs, and nearly nothing on multiple Citroëns. These jobs take time, especially in the front where you nearly always have to remove the whole strut and spring just to get to the absorber.\n\n- The spheres are easy to replace, they don't cost much, and I've only ever changed them because I want the ultimate suspension response, not because any of them actually broke. Some of them were originals that felt harder than they should but they still did up and down.\n\n- I've had a couple of hydraulic hoses slowly leak from the pressed sleeve between the hard pipe and hose, and these have been easy replacements.\n\n- I've changed more brake pipes in post-Xantia Citroëns than hydraulic pipes in total. Sure, in the 80's the pipes rusted but so did everything else.\n\nIf I had the choice I'd 10-to-1 get a hydropneumatic suspension rather than pieces of some twisted steel if not for anything else but less maintenance even if I didn't care for ride quality.\n\nWhy this isn't common "}, {"id": 50672041, "au": "jacquesm", "dom": 1, "sr": 2, "sc": 8.37, "ep": 8.37, "bs": 0.0, "d": 0, "age": 18.67, "grav": 233.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 390, "qw": 0, "k": 248623, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.527, "fa": 0.95, "gp": 1.432, "bl": 0.0, "ds": 0.0, "txt": "I've owned 1x2cV, 3xDS/ID (one a donor car), 2x Xantia and 1 XM. All of them had something that very few modern cars have, which is that they were quirky but interesting, both technology wise and to drive. If you knew them well you could do just about anything with them.\n\nAnyway, about that hydraulic system: a friend of mine who lived in IJmuiden was improving his house. To do so he had bought a load of concrete tiles in Amsterdam on an impulse (really, really good deal). So he called me up and asked if I could come and help shift them to IJmuiden. When I got there there was this absolutely massive pile and I figured this is not going to end well. I had dropped the rear seat (which you could pull out fairly easily, but the back cushions stayed in place) so there was quite a bit of room and two tiles fit side by side. So we stacked them pretty much to the ceiling and miraculously, the car just kept on adjusting ride height and never gave any sign that it couldn't handle the load. All of the tiles fit. Then we drove to IJmuiden. It all went well until we hit the overpass over the road between Amsterdam and Haarlem on A9. The car took a bit of a dive into the dip and then came back out and came back out further than it went in. And did it again. Before long it was bouncing like a ball with the rear (which was pretty heavy) coming off the ground. I lost some speed and finally got t"}, {"id": 50671877, "au": "Svip", "dom": 29, "sr": 3, "sc": 8.36, "ep": 8.36, "bs": 0.0, "d": 0, "age": 19.02, "grav": 240.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 283, "qw": 0, "k": 5383, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "loved_weird", "flbl": "Loved & Weird (Steering)", "urls": [], "ig": 1.741, "fa": 0.68, "gp": 1.61, "bl": 0.0, "ds": 0.0, "txt": "Generally goes unnoticed (though not unmentioned), but until after the Xantia, the suspension system also included the brakes and the steering (which would technically not be permitted under modern EU car standards); which meant a leak would eventually not just cause a loss of suspension, but also a loss of steering and braking.\n\nWhy incorporate the braking and the suspension?  The mechanical height regulator could \"feel\" how much fluid it needed to fill the suspension with, in order to obtain the desired ride height; which meant it \"knew\" how heavy the vehicle was loaded, and thus apply the brakes accordingly.  This is why in a proper Citroën hydraulic car, the brake pedal feels \"weird\", in that it doesn't go far down (and quickly becomes hard to press) (the DS tried to make this less confusion by making the pedal a \"mushroom\" button instead); because the idea is that you should apply gentle braking, and the car will figure out the necessary amount of braking force required (unlike just hitting the pedal like in a normal car, which would result in an almost hard stop).\n\nWhy the steering then?  I think that's more of a convenience thing, mechanically speaking, as it was already there to provide a form of power steering; though it is funny feeling it getting pumped up (steering was always the last portion to receive fluid during the pumping).  At least, as far as I can tell, it "}, {"id": 50672054, "au": "Svip", "dom": 34, "sr": 4, "sc": 6.95, "ep": 7.1, "bs": 0.0, "d": 2, "age": 18.65, "grav": 232.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 274, "qw": 0, "k": 5383, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "remember_xantia", "flbl": "Remember & Xantia (Activa)", "urls": [], "ig": 1.605, "fa": 0.28, "gp": 1.746, "bl": 0.0, "ds": 0.0, "txt": "I should note, that I am obviously a bit biased in answering this; and I've seen some videos with people attempting (and failing) in replicating the moose test result.\n\nHowever, a thing to note in those videos, is that their Activa suspension is not performing as it should (I also noted, that the videos did not mention attempts to fix the Activa suspension; it's frankly not that hard, if you know what you're doing.  Side note: with the car on a lift, and a screwdriver, you can make the suspension's anti-roll system move around while it's standing still.), so it therefore seems underwhelming.\n\nThat said, when it is working, the car basically drives like a go-cart: it just sticks to the road, the first few times, it's uncanny.  Again, other cars do this, like sports cars, but I doubt any other car does it that well while being as practical as the Xantia is.  I remember a video (from a YouTuber whose name escapes me), mentioning how it was unusual to sit so high, while taking corners at those speeds.\n\nSaying it's the GOAT of its time may be slightly overstating it, but in the price range?  I don't think anything comes close (even now).  It's a driver's car.\n\nThat being said: finding spare parts for it is hard, because Citroën stopped production decades ago, and it has tonnes of different parts.  Fortunately, there are some dedicated enthusiasts out there, so there is hope; some ev"}, {"id": 50676063, "au": "lloeki", "dom": 75, "sr": 5, "sc": 6.76, "ep": 6.76, "bs": 0.0, "d": 2, "age": 7.12, "grav": 53.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 12, "k": 12677, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.483, "fa": 0.76, "gp": 0.766, "bl": 0.0, "ds": 0.0, "txt": "> i guess there was a lot of product placement of it in that era.\n\nWell the series began in 1992 and the DS stopped being produced in the '70s, it was already squarely a classic automotive icon. Hardly product placement when you can't buy the product!\n\nPart of Highlander took place in France and DS was simply the most iconic car fitting the \"romantic bohème Paris\" style (quite similar to Amélie Poulain) especially for an American audience."}, {"id": 50673579, "au": "rubayeet", "dom": 42, "sr": 6, "sc": 6.5, "ep": 6.5, "bs": 0.0, "d": 0, "age": 14.82, "grav": 160.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 657, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": ["https://en.wikipedia.org/wiki/Car_SOS?wprov=sfti1"], "ig": 1.206, "fa": 0.62, "gp": 1.31, "bl": 0.0, "ds": 0.0, "txt": "Coincidentally, just today, I watched an episode of Car SOS[O] where they restored a Citroen DS.\n\nHighly recommend the show. I am not a car enthusiast, but the show does a good job of communicating the engineering of the classic cars and it’s entertaining to watch how they restore them to a road worthy state.\n\n[0] https://en.wikipedia.org/wiki/Car_SOS?wprov=sfti1"}, {"id": 50672601, "au": "shakow", "dom": 27, "sr": 7, "sc": 6.05, "ep": 6.05, "bs": 0.0, "d": 2, "age": 17.34, "grav": 206.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 10, "k": 3242, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "remember_xantia", "flbl": "Remember & Xantia (Activa)", "urls": ["http://cibix.free.fr/suspension.htm"], "ig": 0.985, "fa": 1.04, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "> I think there was also a control to rise it even further.\n\nYes, it had 4 positions: very low (never use it), low (wanna go fast), high (wanna go rough), very high (wanna change a wheel or drive through 15cm of snow).\n\nhttp://cibix.free.fr/suspension.htm"}, {"id": 50672950, "au": "Doctor_Fegg", "dom": 76, "sr": 8, "sc": 5.38, "ep": 5.53, "bs": 0.0, "d": 2, "age": 16.43, "grav": 189.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 0, "k": 8838, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "loved_weird", "flbl": "Loved & Weird (Steering)", "urls": ["http://www.citroenet.org.uk/passenger-cars/psa/c3/sensodrive/sensodrive-2.html"], "ig": 0.729, "fa": 0.96, "gp": 0.747, "bl": 0.0, "ds": 0.0, "txt": "Citroen had that until about 15 years ago - they called it SensoDrive in the C3 range. http://www.citroenet.org.uk/passenger-cars/psa/c3/sensodrive...\n\n(I had a C3 Pluriel, Citroen's glorious failure of a successor to the 2CV. Bonkers car. I loved it.)"}, {"id": 50672772, "au": "jacquesm", "dom": 50, "sr": 9, "sc": 5.35, "ep": 5.5, "bs": 0.0, "d": 2, "age": 16.86, "grav": 197.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 248623, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.543, "fa": 0.34, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "I've done 100's of thousands of KM in hydraulic suspension Citroens, it broke once and still drove (minus suspension, power steering, brakes) and limped home. The fix was 10 minutes (a short segment of line had failed because an engine support broke, that was the bigger problem). I would say for the day it was engineered reasonably well, though with the SM the pump was placed very awkwardly (Maserati engine, fortunately I never had one of these, very rare and finicky).\n\nDon't get me started on the electronic injection system though, Volvo used the same system, those never leaked, the Citroen ones leaked in the showroom... It's one of the main reasons the 2.3ie are very rare, and always have a big fire extinguisher on board."}, {"id": 50672562, "au": "shakow", "dom": 13, "sr": 10, "sc": 4.96, "ep": 5.1, "bs": 0.0, "d": 4, "age": 17.44, "grav": 208.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 3242, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "remember_xantia", "flbl": "Remember & Xantia (Activa)", "urls": ["https://www.threads.com/@ottocrank/post/DBRNI5ZJ0tu"], "ig": 0.865, "fa": 0.62, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "Yes, at the time were T-modell were the wagon version of what would become the E class, and not the modern T series (W415/W420).\n\nThese had, on top of the classical 2+3 forward facing seats, had 2 additional foldable seats in the back floor, that were rear-facing (and quite uncomfortable).\n\nhttps://www.threads.com/@ottocrank/post/DBRNI5ZJ0tu"}, {"id": 50678714, "au": "ErroneousBosh", "dom": 38, "sr": 11, "sc": 4.82, "ep": 5.11, "bs": 0.0, "d": 2, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 17, "k": 1944, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "remember_xantia", "flbl": "Remember & Xantia (Activa)", "urls": [], "ig": 1.449, "fa": 0.42, "gp": 0.351, "bl": 0.0, "ds": 0.0, "txt": "> I'm very curious, is the Xantia Activa V6 truly the goat of its time or a tiny bit overrated?\n\nI know someone who put a set of fairly substantial aftermarket alloys on his 2 litre turbo Activa, because he thought the factory ones looked a bit too heavy and chunky.\n\nWithin an afternoon of spirited driving they were absolutely *destroyed*. Pringles-shaped. Wrecked by the ridiculous lateral G.  They could do something like 0.95G, rather more than even a modern mass-produced performance car and way over the top for something you'd expect to see pootling up the M6 pulling a caravan."}, {"id": 50677486, "au": "27183", "dom": 15, "sr": 12, "sc": 4.76, "ep": 5.05, "bs": 0.0, "d": 4, "age": 3.0, "grav": 18.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 368, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.474, "fa": 0.34, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "The W123 and W124 wagons had SLS. I owned a 1984 W123 300TD Turbodiesel wagon for a while, it was a great car and the SLS was wonderful when it worked, but eventually the hydraulic struts blew out and I wasn't able to source replacements. I built a standard rear suspension using some Bilstein HD shocks from a W123 sedan and lowering springs from a Mercedes-Benz S600. It worked well, but didn't have the magic ability to absorb all the weight you can throw at it."}, {"id": 50677589, "au": "mattyokan", "dom": 54, "sr": 13, "sc": 4.73, "ep": 5.02, "bs": 0.0, "d": 2, "age": 2.8, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 15, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.334, "fa": 0.34, "gp": 0.632, "bl": 0.0, "ds": 0.0, "txt": "Toyota AHC? There are plenty of 100/200 series Land Cruisers on the road with their hydraulic suspension pushing 300k miles/25yr+ without trouble. The lines are prone to rusting of course and they become trouble if that happens, but it’s otherwise a very robust system that mostly just requires AHC fluid changes every 60k miles."}, {"id": 50671094, "au": "Groxx", "dom": 47, "sr": 14, "sc": 4.11, "ep": 4.55, "bs": 0.0, "d": 0, "age": 20.43, "grav": 270.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 21177, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 1.565, "bl": 0.0, "ds": 0.0, "txt": "I've always kinda wondered why this isn't more common, especially with computer control.  Did it break frequently?  Surely it's not just cost, extremely expensive cars exist, and many don't have active control like this."}, {"id": 50672177, "au": "user_7832", "dom": 2, "sr": 15, "sc": 4.06, "ep": 4.21, "bs": 0.0, "d": 1, "age": 18.36, "grav": 226.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 4972, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "Thanks for that anecdote, I've seen you around the site a fair bit but never knew you liked such cars.\n\nI learnt about this suspension system myself after seeing an (unfortunately not very well maintained) Citroen somewhere near Rijswik. (Back home in India we really don't have a lot of old Citroens.)\n\nBy an interesting coincidence, while walking past the car park today I was wishing for a more exciting car - one that is \"properly\" engineered - and was thinking of this suspension setup.\n\nLadder frames, or even tubed space chassis, for that matter, can be far more robust. Layering 2 suspensions in a vehicle could probably reduce vibration and improve comfort a significant bit. I wonder why GT cars never appeared to do this.\n\nEven standalone, this suspension is in my opinion an absolute engineering marvel, and I really wish more companies beyond just Rolls Royce would care to use it today.\n\nBut I suppose the finance guys and bean counters end up winning."}, {"id": 50671238, "au": "Squeeeez", "dom": 9, "sr": 16, "sc": 3.97, "ep": 4.63, "bs": 0.0, "d": 0, "age": 20.21, "grav": 265.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 129, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 0.999, "fa": 0.0, "gp": 1.576, "bl": 0.0, "ds": 0.0, "txt": "I still remember having to wait for the car to rise, as a child. Didn't know how smooth my rides were until we switched from citroen to renault. But the hydraulic system membranes seem to have needed extensive maintenance, quite sad. Mechanics didn't love them."}, {"id": 50671252, "au": "rpcope1", "dom": 48, "sr": 17, "sc": 3.82, "ep": 4.26, "bs": 0.0, "d": 1, "age": 20.21, "grav": 265.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 2180, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.755, "bl": 0.0, "ds": 0.0, "txt": "Given how many times I've witnessed hydraulic lines leak or cause problems on heavy equipment, I'd be hard pressed to believe it would be any better here. It's probably like the airbag suspensions that got put into Cadillacs and big SUVs: nice when it rolls off the floor, but prone to all sorts of nasty failures you'd never see in a conventional leaf or coil spring setup."}, {"id": 50671981, "au": "speedgoose", "dom": 31, "sr": 18, "sc": 3.53, "ep": 4.19, "bs": 0.0, "d": 1, "age": 18.8, "grav": 235.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 9708, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "remember_xantia", "flbl": "Remember & Xantia (Activa)", "urls": [], "ig": 1.444, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "I'm very curious, is the Xantia Activa V6 truly the goat of its time or a tiny bit overrated?\n\nI have understood that its famous high speed pass on moose test couldn't be replicated by some, despite modern tires.\n\nMy father had a no-turbo diesel Xantia at some point in the 90s. I remember that the car could go up and down, very slowly. It was good for handbrake turns I guess. I remember requesting handbrake turns as a kid."}, {"id": 50671634, "au": "GuB-42", "dom": 26, "sr": 19, "sc": 3.23, "ep": 4.11, "bs": 0.0, "d": 2, "age": 19.45, "grav": 249.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 22537, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.542, "fa": 0.0, "gp": 0.337, "bl": 0.0, "ds": 0.0, "txt": "I had a used Citroen CX, it was my first car and there was indeed a control: fully down, normal, raised (for bumpy roads) and maximum position (for tire changes).\n\nThe tire change mode was particularly interesting, because it let you change change tires without a jack: put the suspension in the maximum position to lift the car, put the car on stands, then set the suspension down to raise the tires.\n\nAbout the raising car, yes, you had to wait for it to raise. But it was for the best in my case. My car was an old diesel, the kind that took time to warm up, so waiting for the car to raise was a good reminder to let the engine get up to temperature.\n\nSmall anecdote, I once popped the license place to the car parked in front of me clean off. What happened is that I parked very close to the car in front of me, but not touching, that car had its licence plate hanging down a bit. After I left, the car slowly went under the licence plate, and when I restarted it, it rose back up, taking the licence plate with it. In the end there was almost no damage, the license plate just had to be riveted back."}, {"id": 50676560, "au": "prmoustache", "dom": 39, "sr": 20, "sc": 3.23, "ep": 3.45, "bs": 0.0, "d": 0, "age": 5.33, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 8038, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "As a kid of the 80's and teenager in the 90's in France I can only really appreciate them now. The problem at the time was that the tech was considered so cool by their owners that they kept annpying people about that and nobody wanted to be that guy. This means that Citroën quickly became a brand associated to old people in early dementia. Not really the brand image you want to have as a company.\n\nI think it would have probably died as a brand if not for the involvment in Motorsport, with the many wind at the Dakar and later the domination of Sebastien Loeb in WRC which put back the brand in the spotlight for the newer generarions."}, {"id": 50672185, "au": "platevoltage", "dom": 72, "sr": 21, "sc": 3.2, "ep": 3.5, "bs": 0.0, "d": 0, "age": 18.34, "grav": 226.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1200, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "loved_weird", "flbl": "Loved & Weird (Steering)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "Weird coincidence that A friend is currently forcing me to watch Buffy for the first time, and the Librarian guy happens to drive one of these very strange cars."}, {"id": 50672007, "au": "orbital-decay", "dom": 68, "sr": 22, "sc": 2.73, "ep": 2.73, "bs": 0.0, "d": 1, "age": 18.75, "grav": 234.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 7333, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 1.075, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Not sure about regular, but many modern higher tier cars do have actual active suspension, from Porsche to upper-tier BYD (including the obstacle jumping trick). Even motorcycles have semi-active suspension systems nowadays."}, {"id": 50675499, "au": "ssl-3", "dom": 66, "sr": 23, "sc": 2.69, "ep": 3.13, "bs": 0.0, "d": 1, "age": 9.19, "grav": 77.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.331, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It has been my experience that on a long-enough timeline, all regular cars (with less-interesting suspension, like a turn-of-the-century Toyota) behave that way eventually.\n\nThat sitting-on-a-sofa floating-over-the-bumps thing happens after the shocks and struts become completely and utterly worn out from aging materials, corrosion, and wear from use."}, {"id": 50675768, "au": "yawniek", "dom": 64, "sr": 24, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 0, "age": 8.14, "grav": 64.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 603, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 0.83, "fa": 0.0, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "I had multiple cx 2 and cx turbo 2, such nice cars! And incredible all the tech and comfort it had for its time. I hope i can once have the money space to have a nice restored version again"}, {"id": 50676446, "au": "pezezin", "dom": 40, "sr": 25, "sc": 2.52, "ep": 3.18, "bs": 0.0, "d": 0, "age": 5.73, "grav": 39.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1988, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.159, "fa": 0.0, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "My grandpa was a sales representative who spent his days on the road, and a big fan of Citroën cars. I remember being a kid, getting in his car, and being amazed at the hydraulic system adjusting when the car started. To my child mind it was the coolest thing ever, like the car was going to take off, any other car seemed boring in comparison xD"}, {"id": 50671907, "au": "ece", "dom": 80, "sr": 26, "sc": 2.31, "ep": 2.53, "bs": 0.0, "d": 0, "age": 18.95, "grav": 238.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 933, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 1.075, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Given semi-active suspensions of today like GMs magnetic ride, or Lexus APSSS, seems like the industry has moved forward. Sure Citroen was ahead of its time for the 1970s. Hydraulic semi-active designs are still around too."}, {"id": 50678734, "au": "ErroneousBosh", "dom": 49, "sr": 27, "sc": 2.13, "ep": 3.23, "bs": 0.0, "d": 2, "age": 0.91, "grav": 6.8, "surf": 29.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1944, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have an old Range Rover with air suspension. About the only failures I've had is the 30-year-old compressor being a bit weak, which you can rebuild. I've heard of people bursting bags but only because they've been doing silly stuff on incredibly old and worn out ones.\n\nContrast this with coil springs which will snap on the smallest impact and send a razor-sharp edge through the sidewall of the tyre, causing an immediate and irrecoverable loss of control."}, {"id": 50679258, "au": "restalis", "dom": 8, "sr": 28, "sc": 2.12, "ep": 3.0, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 73.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 669, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "\"you can compress a gas but cannot compress a fluid\".\n\nThe correct word is \"liquid\" instead of \"fluid\". Fluids are things that (can) flow, which includes gases, liquids, and plasma. This is a small but an important nitpick, considering the article's intended audience."}, {"id": 50676854, "au": "euroderf", "dom": 57, "sr": 29, "sc": 1.89, "ep": 2.77, "bs": 0.0, "d": 0, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 4208, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "It sounds like this could be the basis for a great educational toy. How about a kit with metal hydraulic components and everything else 3-D printed. For the upgrade, add an ESP-32."}, {"id": 50672662, "au": "ekaryotic", "dom": 74, "sr": 30, "sc": 1.85, "ep": 3.39, "bs": 0.0, "d": 1, "age": 17.13, "grav": 202.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 63, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "the  citroen DS is also featured a lot in the highlander tv series, almost as much as the protagonist. i guess there was a lot of product placement of it in that era.\n\ni never drove one but what i like about them is the clutching is automatic, so you get the reliability of manual with the ease of operation of automatic. i do wonder why that never took off more, but i do understand india has man automated manuals presently as they are more affordable."}, {"id": 50671600, "au": "tecleandor", "dom": 16, "sr": 31, "sc": 1.67, "ep": 2.11, "bs": 0.0, "d": 1, "age": 19.52, "grav": 250.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3734, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "loved_weird", "flbl": "Loved & Weird (Steering)", "urls": [], "ig": 0.406, "fa": 0.34, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "My dad also switched from a GS Palas to a Renault 14, and the downgrade was quite big. But yeah, it was difficult to find mechanics for the GS back in the day (Spain)"}, {"id": 50676603, "au": "rajamukherji", "dom": 32, "sr": 32, "sc": 1.66, "ep": 5.72, "bs": 2.52, "d": 2, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.527, "fa": 0.34, "gp": 0.8, "bl": 0.95, "ds": 0.0, "txt": "I drove a 2.0L turbo Activa for around 10 years and honestly nothing compares in terms of comfort and handling, gliding over ramps and taking roundabouts like they were straight roads, all on relatively narrow (205) tyres. Fuel consumption was terrible though.\n\nI still have two in need of restoration, but I just haven't gotten around to it yet. I'd actually consider trying to get one converted to electric if possible, that would be my ideal car.\n\nOh, and the body format (looks like a saloon but opens like a hatchback) was remarkably practical ... you could get an upright washing machine in there."}, {"id": 50671595, "au": "KaiserPro", "dom": 51, "sr": 33, "sc": 1.63, "ep": 3.17, "bs": 0.0, "d": 1, "age": 19.53, "grav": 250.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 16739, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.117, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "Dad had a BX.\n\nTHe things that broke were the green balls. Basically when the waft stopped wafting, it was time to replace them.\n\nThe other thing you had to watch out for is flat tyres. Because the suspension is self levelling it meant that as the tyre deflated, it would raise that corner. On the back tyres the only real clue was the noise. The front you felt through the wheel."}, {"id": 50673047, "au": "hashhar", "dom": 45, "sr": 34, "sc": 1.62, "ep": 2.06, "bs": 0.0, "d": 1, "age": 16.2, "grav": 185.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1788, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 0.878, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thank you for sharing. It's so interesting to learn so much about how the suspensions work and also interesting to learn about US history regarding cars and imports which impacted both Citroen and Maserati."}, {"id": 50672792, "au": "KennyBlanken", "dom": 53, "sr": 35, "sc": 1.59, "ep": 3.13, "bs": 0.0, "d": 1, "age": 16.81, "grav": 196.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5640, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 0.998, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Nearly every car that has had active hydraulic suspension has been a reliability and maintenance nightmare. The systems are complex, the parts are expensive, and so on. They all fail with age. All of them.\n\nThese systems are also dangerous to work on due to the high hydraulic pressure."}, {"id": 50675478, "au": "De_Delph", "dom": 6, "sr": 36, "sc": 1.33, "ep": 2.73, "bs": 0.0, "d": 4, "age": 9.25, "grav": 78.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 43, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not _that_ random apparently for car guys with an IT degree to live on or near the Beatrixlaan in Rijswijk :p. \nI was warned by my dad who was a mechanic about (the complexities of) the Citroëns, so instead I went the Japanese way and imported an R32 Skyline... Then after some impossible part sourcing: \"maybe you should've gotten that CX after all, son\""}, {"id": 50676951, "au": "bjarteaarmolund", "dom": 41, "sr": 37, "sc": 1.3, "ep": 2.4, "bs": 0.0, "d": 0, "age": 4.08, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 47, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 0.91, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "My parents had such an Citroën at one point, and when it had showed heavily they could use the hydraulics to thump the snow down so that the car was free to move. Not a sustainable strategy to get through the winter, but a nice trick"}, {"id": 50678778, "au": "ErroneousBosh", "dom": 55, "sr": 38, "sc": 1.17, "ep": 2.71, "bs": 0.0, "d": 2, "age": 0.85, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1944, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is such an incredible bit of nonsense.\n\nThey're far more reliable, and coil springs are literally killers. If a car with coil springs needs its suspension worked on it can only be done in very specialised workshops with safety cages containing special tools for releasing the dangerous springs."}, {"id": 50678837, "au": "psd1", "dom": 56, "sr": 39, "sc": 1.14, "ep": 2.68, "bs": 0.0, "d": 2, "age": 0.73, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1236, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "springs_coil", "flbl": "Springs & Coil (Suspension)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your thesis is twaddle. You change the bushings in your suspension linkages, and I'll change the spheres in an old Citroen, and I'll be on my fourth beer while you're still trying to fuck your control arms back on.\n\nAre hydraulic systems \"dangerous\", sure, mineral oil might squirt in your eye. But I've changed coil springs. Take your car to a professional, for your own safety."}, {"id": 50673522, "au": "yipikaye", "dom": 58, "sr": 40, "sc": 1.07, "ep": 4.25, "bs": 2.52, "d": 0, "age": 15.0, "grav": 164.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.818, "bl": 0.95, "ds": 0.0, "txt": "My dad had a DS and then XM. He always tood 2 things :\nRolls Royce suspension cane from citroen. \nXM was designed by Bertone, Pinninfarina ecole.\n\nAmazing cars but when i was a kid , i puked all the time in the snaky road of the Pyrenees mountains crossing spain/france border...\nWas fun though... once we arrived to vacation spot..."}, {"id": 50676508, "au": "psd1", "dom": 20, "sr": 41, "sc": 0.84, "ep": 1.28, "bs": 0.0, "d": 2, "age": 5.49, "grav": e": 0, "tier": "crowd_chatter", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 0.108, "bl": 0.7, "ds": 0.0, "txt": "Hehe, I used to take the tramrails crosswise without even slowing down in Amsterdam. That worked very well. Until one day I was driving an Austin Maxi instead of my DS and forgot that not all cars are able to ignore level differences on the road. I think I hit my head against the ceiling.\n\nMercedes has air suspension in their high end models, it still isn't as good as what Citroen had 60+ years ago."}, {"id": 50671358, "au": "throwaway270925", "dom": 59, "sr": 51, "sc": -1.34, "ep": 3.34, "bs": 3.58, "d": 0, "age": 20.03, "grav": 261.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 26, "qw": 0, "k": 525, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "today_cars", "flbl": "Today & Cars (Porsche)", "urls": ["https://www.youtube.com/watch?v=kKDdSXDu4wA"], "ig": 0.815, "fa": 0.0, "gp": 0.981, "bl": 1.35, "ds": 0.0, "txt": "Wow, this seems to be everywhere suddenly. Either UPnDown went all out advertising his YouTube reels or everyone must have rewatched that classic Top Gear Review:\n\nhttps://www.youtube.com/watch?v=kKDdSXDu4wA"}, {"id": 50676407, "au": "jacquesm", "dom": 7, "sr": 52, "sc": -1.62, "ep": 1.77, "bs": 1.85, "d": 5, "age": 5.86, "grav": 40.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 248623, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "system_amsterdam", "flbl": "System & Amsterdam (Car)", "urls": [], "ig": 0.755, "fa": 0.0, "gp": 0.0, "bl": 0.7, "ds": 0.0, "txt": "Oh, I forgot to put those in my list... I also had two CXs, but they lasted for so short that I think your dad was right. One blew a hole in a piston (2.4L engine, not the best Citroen made...) and the other had the engine drop out from under it (that second one had been rep (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
