ful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 8}, {"category": "low_cred_or_joke", "count": 3}, {"category": "code_repository", "count": 1}], "story_anchors": ["culture", "emoji", "company", "slack", "custom", "measure", "number", "usually", "amount", "added", "teams", "works", "default", "software", "important", "job", "corporate", "else"], "largest_root": {"root_id": 50662624, "author": "locallylinear", "slots": 76, "start_dom": 1, "end_dom": 76, "share_pct": 27.4, "top_dom1_age": 15.2, "top_dom1_author": "locallylinear"}, "buried_cutoff": 83, "rescue_top_k": 55, "ablations": [], "tournament": [], "comments": [{"id": 50664649, "au": "LtWorf", "dom": 100, "sr": 1, "sc": 10.49, "ep": 10.49, "bs": 0.0, "d": 2, "age": 9.98, "grav": 87.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 55, "qw": 0, "k": 2729, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": ["https://codeberg.org/ltworf/localslackirc"], "ig": 1.453, "fa": 2.08, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "My slack-IRC bridge[1] doesn't show reactions. I didn't even try to do anything to implement it because of how low value they are.\n\nHowever since I had some less-than-nice coworkers who were putting laughing emojis constantly just to undermine, it has a feature to react randomly to certain people's messages with an emoji selected from a certain set.\n\n1: https://codeberg.org/ltworf/localslackirc"}, {"id": 50662057, "au": "andai", "dom": 137, "sr": 2, "sc": 9.83, "ep": 9.83, "bs": 0.0, "d": 2, "age": 16.79, "grav": 196.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 86, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": ["https://en.wikipedia.org/wiki/Emoticon", "https://en.wikipedia.org/wiki/Emoji", "https://en.wikipedia.org/wiki/Miscellaneous_Symbols"], "ig": 1.737, "fa": 1.58, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "Emoticons are... well I used to think they were the animated smileys in MSN and Skype but now I'm not sure anymore. Maybe they're text too?\n\nEdit: just read this on Wikipedia, gave me a laugh\n\nThere has been discussion among legal experts on whether or not emoji could be admissible as evidence in court trials.\n\n...\n\nIn 2000, Despair, Inc. obtained a U.S. trademark registration for the \"frowny\" emoticon :-( when used on \"greeting cards, posters and art prints\". In 2001, they [announced] that they would sue Internet users who typed the frowny.\n\nhttps://en.wikipedia.org/wiki/Emoticon\n\nhttps://en.wikipedia.org/wiki/Emoji\n\nhttps://en.wikipedia.org/wiki/Miscellaneous_Symbols"}, {"id": 50664636, "au": "jks", "dom": 107, "sr": 3, "sc": 7.61, "ep": 7.61, "bs": 0.0, "d": 1, "age": 10.02, "grav": 87.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 564, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.938, "fa": 0.34, "gp": 1.439, "bl": 0.0, "ds": 0.0, "txt": "500 party parrots? We have that many copies of the thumbs-up emoji (including, naturally, :never-gonna-give-you-up:, :never-gonna-let-you-down:, :never-gonna-make-you-cry:, :never-gonna-run-around-and-desert-you:, :never-gonna-say-goodbye:, :never-gonna-tell-a-lie-and-hurt-you:), all the Pokemon (albeit missing many shiny and shadow variants), all the Bufos... over 14k custom emojis today.\n\nThe incentive that encourages this is a bot that posts all new emojis on \u0023emoji-feed. People have discussions on that channel by uploading new emojis that comment on the preceding ones."}, {"id": 50664371, "au": "mstaoru", "dom": 152, "sr": 4, "sc": 7.45, "ep": 7.45, "bs": 0.0, "d": 1, "age": 10.64, "grav": 96.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 236, "qw": 0, "k": 1293, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.912, "fa": 0.62, "gp": 0.822, "bl": 0.0, "ds": 0.0, "txt": "Exactly how it is in my BigCo (EU). We use Teams (ouch) and everyone has to be added to these large announcement or project channels. The channels are \"post\" format and threaded, so posting a simple question or something curious you found is rather awkward. Therefore, channels are reserved for Big Posts, which are usually one of the two: \"welcome all to the new channel\" or \"this channel will be archived\".\n\nAs an internal consultancy, we run 30-40 projects at once, which are managed similar to waterfall (ouch). There are obligatory bi-weekly calls where everyone must say that everything is on track, or find someone else to blame if it's not. The actual knowledge about the project is with the project \"lead\" (who's usually just solo because they follow 1 senior + 1-2 students whose only true motivation is to survive till the end of 6 months).\n\nAnything substantial then is discussed in \"can I call you now\" Teams calls, not recorded of course (EU). Theoretically, this knowledge goes to the corporate SharePoint, but with 30-40 projects at once, it never does, and if it does, it only goes there to die, because search in SharePoint is a broken mess since at least 2001.\n\nSo the best place to end up in this structure is with a small-scale project where you're mostly solo, because any kind of teamwork is impossible. And my department kind of self-regulated itself into this groove. It is s"}, {"id": 50668206, "au": "bpavuk", "dom": 249, "sr": 5, "sc": 6.88, "ep": 6.88, "bs": 0.0, "d": 2, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 34, "k": 478, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.591, "fa": 0.76, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "> a company with a bad culture or one with a good culture, with the same salary, which one would you choose?\n\ngood culture of course. C=40 is my personal threshold when it's overdone and actually counter-productive.\n\n> Of course this works if people have options, otherwise both salaries are going to be low.\n\nwell, due to tech overhiring now backfiring spectacularly, we won't have them options for a while. but everyone should hold their boundaries on their wages, no matter what. if anything, tech gave quite a lot of people quite an opportunity to save up.\n\nI know a guy from moscow who regrets living a luxury life in the past because otherwise, at his current lifestyle, he'd have 10 years worth of runway but now he only has 3."}, {"id": 50662467, "au": "eclipticplane", "dom": 106, "sr": 6, "sc": 6.79, "ep": 6.93, "bs": 0.0, "d": 0, "age": 15.64, "grav": 175.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1255, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.353, "fa": 0.34, "gp": 1.921, "bl": 0.0, "ds": 0.0, "txt": "Nah you have to measure them based on actual usage.\n\nSomeone in my Slack bulk loaded like 500 party parrot variations - basically a party version of almost every core emoji. Only 5-10 get real usage.\n\nBut I love this as a metric."}, {"id": 50662624, "au": "locallylinear", "dom": 1, "sr": 7, "sc": 6.37, "ep": 6.37, "bs": 0.0, "d": 0, "age": 15.22, "grav": 167.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 6, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "In all seriousness, a related way I’ve observed culture differences in tech companies is in the presence, or lack thereof, of slack channels for random non work topics\n\nAt one company i worked there were dozens of slack channels for just talking about sports to tv shows to pets and more; and very active. To the point where I genuinely questioned how some people could be so active at risk of the perception that would leave for ability to get actual work done\n\nAnd at my current company, sure there’s a \u0023pets channel but probably gets one post every 6 months.\n\nAnd if you’re curious, yes the company with less non-work slacks is the (far more) successful one."}, {"id": 50663266, "au": "csbartus", "dom": 205, "sr": 8, "sc": 6.27, "ep": 6.27, "bs": 0.0, "d": 0, "age": 13.32, "grav": 136.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1421, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.587, "fa": 0.34, "gp": 1.088, "bl": 0.0, "ds": 0.0, "txt": "Although the article might be precious, I bounced back immediately because of the default dark mode + no theme switcher.\n\nIt happens many times even on bigger outlets. When I have no alternative I toggle the reader view, but that's an ugly patch.\n\nI guess, to deliver the message to everyone, one should spend 10 minutes and set up those two themes and a theme switcher."}, {"id": 50664734, "au": "prinny_", "dom": 145, "sr": 9, "sc": 6.18, "ep": 6.18, "bs": 0.0, "d": 0, "age": 9.8, "grav": 85.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 735, "kpp": 7.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.485, "fa": 0.22, "gp": 1.42, "bl": 0.0, "ds": 0.0, "txt": "The way I use slack to identify failure, especially with regards to ownership, is to monitor the number of participants in an initiative's channel. If we are working on a feature and we started from a channel with 10 people (a couple team leads, a designer, a PO and the main stakeholder) and 1 month in we are still at that number then most of the time that feature is on track. If on the other hand we reach 60+ people in the span of a couple of months then this signals lack of ownership and unclear understanding of what we are building and most of the time there are massive delays."}, {"id": 50665041, "au": "xandrius", "dom": 140, "sr": 10, "sc": 6.08, "ep": 6.23, "bs": 0.0, "d": 4, "age": 9.13, "grav": 76.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 3521, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.466, "fa": 0.56, "gp": 0.82, "bl": 0.0, "ds": 0.0, "txt": "Often emoticons require you to tilt your head sideways and there is the condensed version and the expanded one. For instance the classic smiley:\n\n1. :)  = condensed / normal\n\n2. :-) = expanded (with nose)\n\nSo you can start understanding emojis like:\n\n- ;) (winking)\n\n- >:) (evil)\n\n- XD (cartman laughing face)\n\nSome might stare directly at you like:\n\n- ç_ç (crying)\n\n- oO (surprised shocked)\n\n- o_o (eyes open)\n\n- -_- (someone made a lame joke)\n\nThen you get other complex emojis, more popular initially in Japan where there is a more complicated character in a scene, like the ones posted above."}, {"id": 50669225, "au": "parpfish", "dom": 48, "sr": 11, "sc": 6.08, "ep": 6.23, "bs": 0.0, "d": 4, "age": 1.92, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 5120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.694, "fa": 0.34, "gp": 0.88, "bl": 0.0, "ds": 0.0, "txt": "100%.\n\ni've seen a real uptick in the \"i'm not at work to make friends, just let me do my job and go back to my real life\" ethos online by people that claim to be espousing a healthy work-life balance. but... i think i think it's pretty unhealthy to take work so seriously.\n\nthis mindset seems to have some underlying assumption that if you embrace fun/whimsy/friendships in your job it somehow dilutes the \"real\" fun you have outside of work. it's not like skipping a couple jokey slack messages would reclaim a meaningful amount of time that would let me quit work early."}, {"id": 50664289, "au": "michaelt", "dom": 86, "sr": 12, "sc": 6.07, "ep": 6.22, "bs": 0.0, "d": 2, "age": 10.82, "grav": 98.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 39361, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 2.105, "fa": 0.0, "gp": 0.879, "bl": 0.0, "ds": 0.0, "txt": "Some jobs require lengthy periods of uninterrupted thought.\n\nA university professor reading a dense academic paper will usually give it their full attention, and might respond to e-mails in a batch, one or twice a day. A professor who lets their longer-term academic work suffer because they let themselves get distracted by phone notifications is a professor whose career will stall until they learn better time management skills.\n\nSome jobs in programming require a mixture of deep thought and prompt incident response. In this case you need to get good with your tools (and relationships with colleagues) so you get interrupted when it's appropriate (e.g. if I can help fix a critical issue that's losing $$$$ every second) but don't get interrupted when it's less urgent (e.g. a cute picture is posted to \u0023cats )"}, {"id": 50670049, "au": "braza", "dom": 77, "sr": 13, "sc": 5.89, "ep": 5.89, "bs": 0.0, "d": 0, "age": 0.79, "grav": 6.3, "surf": 39.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 241, "qw": 0, "k": 1236, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.729, "fa": 0.34, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "Maybe this is a controversial take, but I really enjoy that my company is on Microsoft Teams.\n\nI do not know if there is some term in design or organizational culture in a phenomenon that some tool is so bad that people restrain from using it in a bare minimum necessary, preventing them from using it extensively in things that does not matter.\n\nI worked in a company that used Slack and since the UX/UI is nice, people are more prone to prose more (that is OK for me), but at the same time, engage in a lot of watercooling, off-topics and so on, or opening side threads about things not related with work.\n\nIn Teams, at least in my case, the tool is so outdated and bad that I feel some sort of obligation in terms of an invisible social contract with who is writing in a sense that I think to myself: \"Damn, this person lost 5 minutes to write it in this platform, this _might be important_\".\n\nPut in a simple analogy, the Slack is for me when I got my first cell phone with whatsapp/messaging where people were more prone to text non-important things; but with the pager when someone took the time to call to a pager central message place (yes kids, to send a pager you need to call a place and dictate your message to be sent) to send a message to you; you know for sure that shit did hit the fan and something serious needed to be done."}, {"id": 50664552, "au": "vineyardmike", "dom": 33, "sr": 14, "sc": 5.8, "ep": 6.09, "bs": 0.0, "d": 3, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 9126, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.722, "fa": 0.28, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "I’ll go a step farther - if you’re a young person, early career, you should absolutely NOT give off the impression that you’re at work just for the money and everything else is background noise. Everyone is at work for the money, no one is confused by this. You have to be present at work and a good person to be around too. It’s an unspoken part of the job.\n\nFor example, if you have an optional team-lunch every Tuesday, go to it, ESPECIALLY if you work somewhere with free food. If you regularly no-show to team social opportunities (especially that happen during work hours), people talk about it. You could make friends by socializing. You’re being passed up for opportunities too. Your manager is using that as a signal to distribute work or decide who to put effort into promoting. Part of being on a “team” is the interpersonal aspects. I have had multiple in person chats with managers about their perception of individuals based on these sort of things."}, {"id": 50662075, "au": "phendrenad2", "dom": 270, "sr": 15, "sc": 5.77, "ep": 5.99, "bs": 0.0, "d": 0, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 48, "qw": 0, "k": 8273, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": ["https://steveblank.com/2009/12/21/the-elves-leave-middle-earth-%E2%80%93-soda%E2%80%99s-are-no-longer-free/amp/"], "ig": 1.442, "fa": 0.62, "gp": 0.574, "bl": 0.0, "ds": 0.0, "txt": "In the tech world, the number of companies with zero culture is at an all-time high. It'll remain this way until software engineers become in-demand again.\n\nOnce upon a time, removing free sodas from the breakroom was seen as a harbinger of tech company decline. How things have changed. https://steveblank.com/2009/12/21/the-elves-leave-middle-ear..."}, {"id": 50662741, "au": "sp1nningaway", "dom": 212, "sr": 16, "sc": 5.52, "ep": 5.52, "bs": 0.0, "d": 0, "age": 14.93, "grav": 162.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 227, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.711, "fa": 0.0, "gp": 1.034, "bl": 0.0, "ds": 0.0, "txt": "Reading some of this thread’s endorsements feels like people arguing that the pieces of flair in Office Space indicated a strong corporate culture at TGI Fridays. I’m an unapologetic millennial GIF overuser, but I much prefer working at an organization of uneffusive, thoughtful, kind people who do their work earnestly and then go home. Very few emojis get passed around; it's great."}, {"id": 50662397, "au": "redloon", "dom": 79, "sr": 17, "sc": 5.51, "ep": 8.32, "bs": 2.52, "d": 0, "age": 15.81, "grav": 178.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.554, "fa": 0.62, "gp": 2.0, "bl": 0.95, "ds": 0.0, "txt": "It feels like you could extend this in another direction, and measure culture within a team/org by the amount & variety of emoji reactions to messages (on average).\n\nThe best teams I've been on would have incredibly high response rate % average.\n\nIn contrast, when I see an announcement go out to an 800 person org and all it gets is 4 generic emojis, the silence feels deafening (at least in my mind)."}, {"id": 50661367, "au": "jamesfinlayson", "dom": 219, "sr": 18, "sc": 5.44, "ep": 5.44, "bs": 0.0, "d": 1, "age": 18.76, "grav": 234.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 1255, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.945, "fa": 0.0, "gp": 0.598, "bl": 0.0, "ds": 0.0, "txt": "Urgh, years ago I worked at a place that switched from Slack to HipChat (pushed by one guy, who I assume was trying to ingratiate himself with some penny-pinching higher-up).\n\nIt was terrible - no delete button for messages and the only way to edit was using sed expressions (barely tolerable for devs, incomprehensible for non-tech people). The company loved the giphy plugin too, but Slack's plugin lets you cycle through and choose an appropriate one while HipChat just went with the first it found (and when there's no delete button it quickly became a game of giphy Russian roulette).\n\nI think everyone there cheered when Atlassian finally killed Stride (HipChat's relaunch). I wouldn't want to replace Slack with Teams, but there were worse options."}, {"id": 50660289, "au": "Fordec", "dom": 206, "sr": 19, "sc": 5.37, "ep": 5.37, "bs": 0.0, "d": 0, "age": 21.19, "grav": 286.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 2349, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 1.163, "bl": 0.0, "ds": 0.0, "txt": "This raises a question for me then. If agents are like organizations, and inter agent communication doesn't have such shorthands, what is the downside of that? What is \"Agent Culture\"? I fully expect dismissal of this because they're just bots, but does that say more about the humans managing the agents and how they view the development process? Are emojis a method of communication compression that is worth transferring as part of what brings taste to your agentic dev environment? I'm less advocating and more just questioning out loud."}, {"id": 50661040, "au": "steve_adams_86", "dom": 257, "sr": 20, "sc": 5.11, "ep": 5.33, "bs": 0.0, "d": 1, "age": 19.65, "grav": 253.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 37, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": ["https://{org}.slack.com/customize/emoji"], "ig": 1.18, "fa": 0.62, "gp": 0.541, "bl": 0.0, "ds": 0.0, "txt": "Go to https://{org}.slack.com/customize/emoji\n\nIt should say exactly how many (378 in my org's case)\n\nIf you've got a slack app with emoji:read privileges, you could cd into that directory and run:\n\n    slack api emoji.list | jq '.emoji | length'"}, {"id": 50662855, "au": "bpavuk", "dom": 247, "sr": 21, "sc": 5.09, "ep": 5.68, "bs": 0.0, "d": 0, "age": 14.53, "grav": 155.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 478, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.757, "fa": 0.0, "gp": 1.066, "bl": 0.0, "ds": 0.0, "txt": "paint me toxic but I consider culture-boosting an aggressive wage suppression tactic. as a paycut tactic, it works through boosting morale and hence tolerance, usually hand-in-hand with hiding actual salary data from job postings and from between employees.\n\nif the company culture was an actually reliable heuristic like this article assumes, likely for humorous purposes, I'd cut off any company with C above 40."}, {"id": 50669277, "au": "parpfish", "dom": 70, "sr": 22, "sc": 4.84, "ep": 5.5, "bs": 0.0, "d": 4, "age": 1.85, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 5120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.41, "fa": 0.34, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "i would assume folks here would know enough about queuing theory to know that you dont want your system running at 100% utilization rate all the time. you gotta keep slack in the system (pun intended) to handle incoming spikes."}, {"id": 50660943, "au": "moomin", "dom": 209, "sr": 23, "sc": 4.82, "ep": 4.82, "bs": 0.0, "d": 0, "age": 19.92, "grav": 259.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 12357, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.39, "fa": 0.0, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "My last firm was deeply into the late stage. We had over twenty variants of parrot alone. Ironically, my own major contribution was an extremely boring gRPC logo. I would add it to conversations to indicate “We wouldn’t have this problem if we’d adopted gRPC but I can’t be bothered going over this again.”"}, {"id": 50664450, "au": "tokioyoyo", "dom": 32, "sr": 24, "sc": 4.79, "ep": 5.45, "bs": 0.0, "d": 2, "age": 10.48, "grav": 94.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2769, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.233, "fa": 0.56, "gp": 0.66, "bl": 0.0, "ds": 0.0, "txt": "I’ll put out a counter-example and say it really depends on your team. Some of my closest friends are the ones I made ~10 years ago at work, and we used to talk shit on Slack a lot. Also a fairly profitable company as well.\n\nEverything, as always, is what you make out of it. I’d suggest young people not to discount work as a potential way to make new friends. But again, everything depends*."}, {"id": 50667489, "au": "neogodless", "dom": 54, "sr": 25, "sc": 4.78, "ep": 5.89, "bs": 0.0, "d": 2, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 11241, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.772, "fa": 0.28, "gp": 0.636, "bl": 0.0, "ds": 0.0, "txt": "Maybe you can apply blanket statements like this to specific subclasses of companies, for example, Brand New startup SaaS. But I've been at a super fun agency (mix of video, media, education, tech) that continues to be successful in their third decade... but also a really fun software-focused agency who never recovered from the COVID business drought, and is a tiny shell of a company now.\n\nThe fun chat channels did not seem to be reliable indicators of how successful they were."}, {"id": 50662214, "au": "tharkun__", "dom": 189, "sr": 26, "sc": 4.76, "ep": 5.2, "bs": 0.0, "d": 3, "age": 16.33, "grav": 187.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 3148, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.501, "fa": 0.28, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "That's a too simplistic approach to emojis. What you're writing amounts to saying there is no context in emoji use.\n\nIn your above context, and in slack specifically for example, where :) as text actually is :slightly-smiling-face your read would be correct.\n\nIn another context a :) would simply be a (slightly) smiling face, neutral or actually happy in a way that :grin would be \"too much\". In fact, the context around the context might even change it. As in: If the exact \"conversation\" you showed were to happen between myself and someone I know well and that we talked about \"doing something with Rust\" it changes this whole thing entirely vs. the architect I'm foes with ;) (what does a :wink mean in this context :P oh no another emoji with context :mindblown)"}, {"id": 50663428, "au": "oerjan", "dom": 163, "sr": 27, "sc": 4.43, "ep": 7.39, "bs": 2.52, "d": 0, "age": 12.88, "grav": 129.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.155, "fa": 0.95, "gp": 1.357, "bl": 0.95, "ds": 0.0, "txt": "I would love to see stats around the ratio of public, private and DM messages. I think that it would be a great indicator of culture.\n\n7% public, 15% private and 78% DMs as one data point. And culture isn't great."}, {"id": 50663033, "au": "refactor_master", "dom": 92, "sr": 28, "sc": 4.24, "ep": 5.34, "bs": 0.0, "d": 4, "age": 13.97, "grav": 146.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1173, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.382, "fa": 0.34, "gp": 0.777, "bl": 0.0, "ds": 0.0, "txt": "Weird thing to read into it, but I guess we all have \"micro styles\", such as using periods coming off as aggressive, thumbs up as \"okay whatever\", etc...\n\nI try to give my colleagues the benefit of doubt, and I think managers should think about whether their optics are the \"right ones\", as they might as well be seen as passive aggressive by their colleagues who are 10 years younger (even though the manager genuinely means no harm)."}, {"id": 50666586, "au": "alistairSH", "dom": 74, "sr": 29, "sc": 4.22, "ep": 5.54, "bs": 0.0, "d": 2, "age": 5.94, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 16667, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.591, "fa": 0.34, "gp": 0.577, "bl": 0.0, "ds": 0.0, "txt": "I wonder if company size or age is more relevant than Slack usage?\n\nMy employer is ~60 years old, mid-sized (thousand of employees, ~1 billion revenue) and global (large offices in IE, US, MX, IN with smaller ones dotted all over). If there are politics or \u0023random channels, I haven't seen them.  Nor would I have much interest in perusing them."}, {"id": 50663121, "au": "xboxnolifes", "dom": 97, "sr": 30, "sc": 4.07, "ep": 4.51, "bs": 0.0, "d": 2, "age": 13.75, "grav": 143.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 6722, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 0.926, "fa": 0.68, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "I think the scale matters. Is this a channel with 800 people in it? I'd rather see 100 thumbs up instead of 100 \"LGTM\", \"Nice\", \"Looks good\", \"I'm excited\" pushing the message up for no good reason. It's basically \"bump\" spam."}, {"id": 50670456, "au": "vineyardmike", "dom": 41, "sr": 31, "sc": 3.98, "ep": 4.86, "bs": 0.0, "d": 7, "age": 0.2, "grav": 4.1, "surf": 7.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 9126, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.705, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "It won’t. You’re just confused on how and what productivity looks like.\n\nWork is a team activity, and people who are good “team players” are exhibiting a core competency of work.\n\nUnless you work as a mindless assembly line worker, a big part of actual work is teamwork and interpersonal communication. There is more to work than being a coding robot turning tickets into pull requests. If you’re not a good team member, and don’t understand the rest of this, honestly, the management around you is probably shielding that part of work from you."}, {"id": 50665862, "au": "bjackman", "dom": 197, "sr": 32, "sc": 3.97, "ep": 4.63, "bs": 0.0, "d": 0, "age": 7.25, "grav": 54.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 5033, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.6, "fa": 0.0, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "Having recently switched to my first Slack-based employer: holy shit, how have I been operating without slack emojis all this time?\n\nI feel bad coz I believe whatever the fuck Google chat is called actually has this feature, but it never occurred to me that it could be used creatively.\n\nNow every time I'm messaging on other apps I'm lost. Where are my :thing-intensifies: emojis I can't communicate without them."}, {"id": 50661563, "au": "Washuu", "dom": 177, "sr": 33, "sc": 3.93, "ep": 4.95, "bs": 0.0, "d": 0, "age": 18.21, "grav": 223.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1029, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 0.986, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "My day job is >1,000.  Over 57,000 emoji.  There are entire alphabets in there in multiple styles including kanji.  There are plenty that are used in a passive aggressive manner."}, {"id": 50661994, "au": "__MatrixMan__", "dom": 102, "sr": 34, "sc": 3.8, "ep": 3.8, "bs": 0.0, "d": 0, "age": 16.99, "grav": 200.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.497, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "It says a lot about how caught off guard we were that :corona-virus: (a ball of beer bottles) predates :coronavirus: (a viral capsid) by about 30 days."}, {"id": 50663878, "au": "nunez", "dom": 151, "sr": 35, "sc": 3.8, "ep": 5.05, "bs": 0.0, "d": 0, "age": 11.79, "grav": 112.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 8379, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.903, "bl": 0.0, "ds": 0.0, "txt": "Mostly accurate but heavily varies by department. I'd tweak this so that C is based on the emoji used in channels you are subscribed to. There's also how often others use Slack (especially on public channels) that needs consideration. Some places I've been at used public channels for announcements while everything important happens in DMs, (unrecorded) meetings and phone calls. Nightmare."}, {"id": 50668595, "au": "ishouldnotbutk8", "dom": 9, "sr": 36, "sc": 3.62, "ep": 5.16, "bs": 0.0, "d": 2, "age": 2.84, "grav": 17.1, "surf": 4.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 60, "k": 77, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.397, "fa": 0.42, "gp": 0.467, "bl": 0.0, "ds": 0.0, "txt": ">Yes, I see people who way overdo it on the chatting channels and it’s a bad look.\n\nThere is no way to overdo chatting. It is possible to neglect work, and chatting too much may be a cause of failing at work, but there are many other ways to be unproductive.\n\n>it’s a bad look\n\nBad look for who? As long as people are doing their job properly they should be free to socialize with their coworkers. If someone cares too much about what other people are doing it's a bad look for them.\n\n>Or even worse, the political channels. I have never understood the desire to get involved in those.\n\nMe too, but ultimately people are free to talk about what they like (as long as it's legal). Especially when it's important topics, like the Ukraine war.\n\n>Sometimes I do think of starting one for my hobby but then I don’t want to have people look at me as someone who isn’t serious at work\n\nI couldn't work in a place like this. One of the things I enjoy the most in my current company is the lively discussion about all kinds of topics. Especially important now that we work almost exclusively remotely. The people who participate the most are, almost without exception, the most productive and efficient too."}, {"id": 50661058, "au": "joshmoody24", "dom": 225, "sr": 37, "sc": 3.49, "ep": 4.59, "bs": 0.0, "d": 0, "age": 19.62, "grav": 252.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 78, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "My favorite slack emoji is a visual clone of the basic smiley face, but named :thank-you-very-much-for-sharing-also-this-belongs-in-the-random-channel:\n\nAfter using it, wait for someone else to react with it, then remove yours."}, {"id": 50663751, "au": "SkiFire13", "dom": 25, "sr": 38, "sc": 3.36, "ep": 4.9, "bs": 0.0, "d": 1, "age": 12.11, "grav": 117.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 18, "k": 2107, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.96, "fa": 0.42, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "> And if you’re curious, yes the company with less non-work slacks is the (far more) successful one.\n\nI wonder though if this was the case in the past.\n\nIt's not unprobable that the company stopped having a thriving culture once they became successful and grew past a certain size."}, {"id": 50669710, "au": "michaelt", "dom": 88, "sr": 39, "sc": 3.26, "ep": 5.65, "bs": 0.85, "d": 4, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 39361, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.819, "fa": 0.0, "gp": 0.949, "bl": 0.32, "ds": 0.0, "txt": "Yes, even within the same company different roles - or even different interpretations of the same role - can differ a lot in what they demand of us.\n\nWhen I've been the sort of system architect who uses TLA+ to formally prove the proposed system design will meet requirements, I've needed long uninterrupted periods to get the work done.\n\nWhen I've been the sort of system architect who brings together stakeholders from different teams to decide which parts of a major cross-team deliverable lie where, the 'interruptions' are the whole job."}, {"id": 50669166, "au": "rrradical", "dom": 2, "sr": 40, "sc": 3.12, "ep": 4.66, "bs": 0.0, "d": 1, "age": 2.0, "grav": 12.1, "surf": 13.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 1011, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.68, "fa": 0.0, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "I appreciate your perspective, but I think a missing element here is startup vs. established company.\n\nI think a startup would generally benefit from a tighter social network, more off topic slack conversations, more work/social life integration in general.\n\nAnd then as the startup grows into a bigger company, that gradually disappears and becomes a more clock in / clock out situation.\n\nGenerally to build a successful company from a startup you need people to really prioritize the company in a way that you don't in a bigger company.\n\nSo I think in sense you're seeing a form survivorship bias. The 'less non-work slack' company is more successful b/c that more successful companies are by definition the ones that evolved past the tight-knit startup phase.\n\nJust my 2 cents based on my experience in growing startups."}, {"id": 50661888, "au": "wakamoleguy", "dom": 154, "sr": 41, "sc": 3.08, "ep": 4.18, "bs": 0.0, "d": 0, "age": 17.29, "grav": 205.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 784, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 1.096, "bl": 0.0, "ds": 0.0, "txt": "While I appreciate the blast (Teams is indeed bad), you can have custom emojis in Teams. It’s enabled as an admin setting somewhere.\n\nSource: I added a custom emoji to our Teams last week."}, {"id": 50664019, "au": "duggan", "dom": 53, "sr": 42, "sc": 3.02, "ep": 4.56, "bs": 0.0, "d": 1, "age": 11.38, "grav": 106.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 18, "k": 2722, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.178, "fa": 0.42, "gp": 0.412, "bl": 0.0, "ds": 0.0, "txt": "> And if you’re curious, yes the company with less non-work slacks is the (far more) successful one.\n\nThis aligns with my experience. The company with lots of random, busy channels was the most fun company to work for, but ultimately perished.\n\nThe unfun ones, or ones with, yeah, the Mandated Joviality of a “pets” channel, are still going."}, {"id": 50662300, "au": "horticulturist", "dom": 242, "sr": 43, "sc": 2.99, "ep": 3.65, "bs": 0.0, "d": 0, "age": 16.07, "grav": 183.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 29, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.057, "fa": 0.0, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "at my job a new HR leader was hired and ordered the removal of emojis, resulting in the loss of thousands, including many very popular bufo ones. that’s the day the company died."}, {"id": 50663528, "au": "socalgal2", "dom": 101, "sr": 44, "sc": 2.88, "ep": 4.42, "bs": 0.0, "d": 1, "age": 12.66, "grav": 125.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 8, "k": 3831, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.548, "fa": 1.1, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> an announcement go out to an 800 person org\n\nSounds like 800 people just had a bunch of their time and attention wasted. So for me that's a bad work culture. Not realizing that interrupting 800 people is bad."}, {"id": 50662080, "au": "mrheosuper", "dom": 188, "sr": 45, "sc": 2.81, "ep": 4.21, "bs": 0.0, "d": 2, "age": 16.7, "grav": 194.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.286, "fa": 0.28, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "you mean \":)\" ? , as a gen z, i understand this emoji is used to represent state of \"speechless\", because this emoji is so simple to type, so it's used when other in a shock state(usually bad shock). Ex:\n\n- We should rewrite the entire codebase in Rust\n\n- :)"}, {"id": 50662413, "au": "anamexis", "dom": 221, "sr": 46, "sc": 2.8, "ep": 3.17, "bs": 0.0, "d": 3, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5027, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.349, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It certainly shouldn't be the primary way to edit in a chat app, but I found it extremely useful as a dev and \"power\" user. It made it extremely easy to fix little typos - you didn't have to leave the input box, just type /s/teh/the/"}, {"id": 50668512, "au": "solatic", "dom": 227, "sr": 47, "sc": 2.8, "ep": 3.9, "bs": 0.0, "d": 0, "age": 2.96, "grav": 17.9, "surf": 16.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 8798, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "This is an interesting dimension for employee engagement, but I think it’s incredibly judgemental to deride low-social-engagement-Slack as bad (or lacking) culture. How many of those emojis are happy emojis, vs sad ones? How often are each used? If you have a high ratio of happy to sad, is it because people are genuinely happy or because expressions of sadness are punished?\n\nYou cannot measure culture. End of story."}, {"id": 50662797, "au": "Esophagus4", "dom": 7, "sr": 48, "sc": 2.78, "ep": 4.32, "bs": 0.0, "d": 1, "age": 14.72, "grav": 159.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1354, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.8, "fa": 0.0, "gp": 1.683, "bl": 0.0, "ds": 0.0, "txt": "Yes, I see people who way overdo it on the chatting channels and it’s a bad look.\n\nOr even worse, the political channels. I have never understood the desire to get involved in those.\n\nSometimes I do think of starting one for my hobby but then I don’t want to have people look at me as someone who isn’t serious at work"}, {"id": 50665439, "au": "woadwarrior01", "dom": 251, "sr": 49, "sc": 2.77, "ep": 3.87, "bs": 0.0, "d": 0, "age": 8.18, "grav": 65.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.407, "bl": 0.0, "ds": 0.0, "txt": "Some PHB / HR drone is going to read this and start stuffing emojis into their company slack to use the delta as a statistic in their next performance appraisal. :D\n\nGoodhart's law and Gervais Principle reign supreme in corporate environments."}, {"id": 50661334, "au": "kikoreis", "dom": 148, "sr": 50, "sc": 2.7, "ep": 3.58, "bs": 0.0, "d": 0, "age": 18.83, "grav": 236.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 597, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is fun and actually well thought through, but remember Goodhart's law comes for all advertised metrics, silly or not."}, {"id": 50662084, "au": "leidenfrost", "dom": 158, "sr": 51, "sc": 2.6, "ep": 3.63, "bs": 0.0, "d": 2, "age": 16.69, "grav": 194.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 966, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.326, "fa": 0.0, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "My experience with Teams isn't so bad. However, since the days when I had an Athlon II with 1G of ram, I always run web apps in a pinned Firefox Tab. Everything usually works better."}, {"id": 50670187, "au": "dijit", "dom": 78, "sr": 52, "sc": 2.53, "ep": 3.12, "bs": 0.0, "d": 1, "age": 0.59, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 39333, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.327, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your comment is predecated on the idea that communication is bad.\n\nIf communication is bad and should be a minimum, of course teams is better.\n\nI'd argue that email is even better in that case, because at least people can log into it from more places, use it to talk to people from different companies, you can organise conversations using mail clients and... ok, maybe I talked myself out of this notion."}, {"id": 50662406, "au": "walth", "dom": 258, "sr": 53, "sc": 2.45, "ep": 3.69, "bs": 0.0, "d": 2, "age": 15.78, "grav": 177.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 155, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.16, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "35,000 here.\n\nWe were embedding our entire Slack emoji set in some internal web-based tools and realized we could save a real chunk of TTFB and LCP by not loading them in all contexts."}, {"id": 50667928, "au": "png732", "dom": 254, "sr": 54, "sc": 2.45, "ep": 3.55, "bs": 0.0, "d": 0, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 13, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.462, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "Probably will get downvoted to hell, but I don't identify with this at all, jokey or not.  So unless you have a cliquey group using a certain product and cutey graphics, you have no culture?  Maybe the culture is a group of people that can write in complete sentences that can just as subtly convey meaning, don't expect instant gratification in response to what they write (i.e., can use email, or even God forbid the phone or in person conversation), and still can produce good software?  Not to disparage people that are on Slack all day, maybe that works for you and your product rocks.  But it is certainly not the only way, as many could attest.  Whatever did they do before instant messages?"}, {"id": 50662895, "au": "0xbadcafebee", "dom": 272, "sr": 55, "sc": 2.32, "ep": 3.42, "bs": 0.0, "d": 0, "age": 14.38, "grav": 153.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "\"Culture cannot be manufactured with values posters or mandatory fun.\" - but apparently it can be manufactured with Slack emojis.\n\nI am responsible for the majority of Slackmojis in every company I go to. A few weeks after I join, I upload about 50 slackmojis. I guess I'm the most powerful force in corporate culture."}, {"id": 50663916, "au": "nunez", "dom": 216, "sr": 56, "sc": 2.32, "ep": 3.6, "bs": 0.0, "d": 2, "age": 11.68, "grav": 111.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 8379, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.265, "fa": 0.0, "gp": 0.436, "bl": 0.0, "ds": 0.0, "txt": "takes forever to start\n\nux is worse\n\nmeetings are three separate products in a trenchcoat\n\nits usually used because it comes with MS365 and management is cheap"}, {"id": 50667803, "au": "cwnyth", "dom": 68, "sr": 57, "sc": 2.32, "ep": 3.48, "bs": 0.0, "d": 5, "age": 4.09, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 21, "k": 686, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.973, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It is interesting that their misreading of the conclusion has produced a post-hoc rationalization that is probably aligned with their current beliefs.\n\nIt is not aligned with my beliefs at all, it was merely an attempt to explain an unusual conclusion, which I too hastily read this morning before coffee. It's my mistake, but I find it ironic that it sparked a \"misreading\" of my beliefs. We can just end it there and not guess at someone's psychology based on the thinnest of information."}, {"id": 50662357, "au": "hirsin", "dom": 186, "sr": 58, "sc": 2.32, "ep": 3.48, "bs": 0.0, "d": 2, "age": 15.91, "grav": 180.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2342, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": ":thumbs-up: is also considered passive aggressive, which I can get in the context of a high emoji context, where it becomes \"sure, whatever\", \"knock yourself out\", \"great, kid\" by virtue of not choosing a more expressive emoji to signal agreement.\n\nAs with all things, context makes the meaning :shrug:"}, {"id": 50662419, "au": "vigilantpuma", "dom": 96, "sr": 59, "sc": 2.32, "ep": 3.44, "bs": 0.0, "d": 1, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 291, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.151, "fa": 0.0, "gp": 0.509, "bl": 0.0, "ds": 0.0, "txt": "This is interesting, because (and maybe I’m dating myself here) I feel like slack response emojis are a poor substitute for actual responses. When I send a message but the only response I get are reaction emojis, that also feels like deafening silence. It’s better than no response at all, but just barely.\n\nBack in my day people actually used to talk to each other!"}, {"id": 50660695, "au": "zaps", "dom": 255, "sr": 60, "sc": 2.32, "ep": 3.38, "bs": 0.0, "d": 0, "age": 20.46, "grav": 270.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 175, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "That’s great but how do I, as an employee of Globex Corporation, determine how many custom emojis our company has? Submit a ticket to IT? Yup that will go over well."}, {"id": 50664027, "au": "voidfunc", "dom": 45, "sr": 61, "sc": 2.32, "ep": 3.35, "bs": 0.0, "d": 2, "age": 11.37, "grav": 106.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 10030, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "Pretty much this. Ill make friends at work and have kept friendships beyond employment at companies but im fundamentally at work to do a job and make money. All the nonsense with Slack IMO is a sign of a deeply unserious work culture."}, {"id": 50666233, "au": "ozim", "dom": 167, "sr": 62, "sc": 2.32, "ep": 3.34, "bs": 0.0, "d": 0, "age": 6.55, "grav": 47.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7834, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.078, "fa": 0.0, "gp": 0.556, "bl": 0.0, "ds": 0.0, "txt": "I blocked adding custom emojis because people started one-upping on who adds more edgy emoji.\n\nI didn’t want to get anyone fired or that I would have to explain to HR they went on stupid game."}, {"id": 50665817, "au": "a34729t", "dom": 252, "sr": 63, "sc": 2.32, "ep": 3.33, "bs": 0.0, "d": 0, "age": 7.31, "grav": 55.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 440, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.241, "fa": 0.0, "gp": 0.288, "bl": 0.0, "ds": 0.0, "txt": "The availability and usage of mildly offensive (to lame people) emoji (poo smiley face, south park \"nice\", hodor, etc) is a sign that at least some things are well and good."}, {"id": 50664611, "au": "awesome_dude", "dom": 49, "sr": 64, "sc": 2.32, "ep": 3.33, "bs": 0.0, "d": 2, "age": 10.08, "grav": 88.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "I spend at least one third of my life at work - more time than with my family, almost as much time as I sleep.\n\nI need people around me that are friendly, willing to stop and appreciate life once in a while, as well as ready to put their nose to the grindstone when required.\n\nThere's no easy formula to how a workplace should be."}, {"id": 50665507, "au": "poszlem", "dom": 58, "sr": 65, "sc": 2.32, "ep": 3.31, "bs": 0.0, "d": 2, "age": 8.02, "grav": 63.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1611, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.185, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I've worked at many, some successful, some not. One of the successful ones had a very vibrant \u0023politics channel. It worked for years, until it didn't. It stopped working around the time when we hired a bunch of new hires during the golden ZIRP days.\n\nIMO, a good \u0023politics channel needs a certain type of people: mostly people who can \"declutch\" (for lack of a better word) from strong emotions and talk about politics in an almost autistic way, like you would about physics or maths. As soon as you get people who want to treat politics as activism, you're in a downward spiral."}, {"id": 50667048, "au": "red-iron-pine", "dom": 20, "sr": 66, "sc": 2.32, "ep": 3.3, "bs": 0.0, "d": 3, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 4466, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.994, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "define \"overdoing it\"\n\nthe only legitimate \"10x rockstar\" programmer I've ever met used to talk shit constantly in the watercooler chat about fantasy football teams.  ruthless and hilarious."}, {"id": 50665397, "au": "croon", "dom": 73, "sr": 67, "sc": 2.32, "ep": 3.3, "bs": 0.0, "d": 2, "age": 8.29, "grav": 66.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5225, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.296, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Same here. In the dozen or so places I've worked, more relaxed culture and getting to know people has always led to less friction when discussing work, more people speak up and discuss designs/details without any perceived hostility.\n\nBut of course YMMV."}, {"id": 50667409, "au": "hakkoru", "dom": 173, "sr": 68, "sc": 2.32, "ep": 3.29, "bs": 0.0, "d": 1, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 48, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "A coworker told me that at a previous job of his that used Teams, a group of them learned that Teams has a feature that lets you make bottom-text style image macros. During a point of rock-bottom morale they made incredibly absurd ones and sent them to each other to keep sane"}, {"id": 50663463, "au": "jen20", "dom": 162, "sr": 69, "sc": 2.32, "ep": 3.27, "bs": 0.0, "d": 2, "age": 12.78, "grav": 127.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 6498, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.392, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Teams is atrocious software certainly, but the real cultural indicator is the kind of decision-making process that allows the idea of Teams to take hold in an organization in the first place.\n\nI now use it as a bright red flag for places I absolutely do not want to work."}, {"id": 50666511, "au": "plaidfuji", "dom": 269, "sr": 70, "sc": 2.32, "ep": 3.23, "bs": 0.0, "d": 0, "age": 6.04, "grav": 42.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 31, "k": 2797, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.849, "fa": 0.42, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "The first company I worked at had an extremely high Emoji Coefficient and I’ve just been disappointed by everything else since.\n\nAlso can confirm this:\n\n> If your company uses Microsoft Teams, there is no equivalent formula. There doesn’t need to be. If you use Teams, your lack of culture is probably the least of your problems."}, {"id": 50662954, "au": "nixpulvis", "dom": 90, "sr": 71, "sc": 2.32, "ep": 3.18, "bs": 0.0, "d": 3, "age": 14.2, "grav": 150.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 4737, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 0.822, "fa": 0.34, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "It was more like, he thought it came off like I wasn't busy because I took the time to respond.\n\nBut meanwhile I message people I need input from and end up waiting like 2 days sometimes to hear back. In the old days, I would have just walking over to them and asked them."}, {"id": 50662377, "au": "throwaway173738", "dom": 210, "sr": 72, "sc": 2.32, "ep": 3.16, "bs": 0.0, "d": 1, "age": 15.86, "grav": 179.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1404, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.347, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I added a “Lennart” emoji because we use a lot of stuff from FreeDesktop and we once got hit by a bug that would’ve been easy to fix with a feature in Systemd that he thought was unimportant. It’s a symbol of our love-hate relationship with Systemd and Avahi and similar. For the record both have made my life significantly easier."}, {"id": 50667181, "au": "parpfish", "dom": 166, "sr": 73, "sc": 2.32, "ep": 3.14, "bs": 0.0, "d": 1, "age": 4.99, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 5120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One place I worked had a nasty habit of never making channels. They preferred to inflict a combinatorial explosion of group dms.\n\nNobody could remember who knew what.\n\nNew employees could  not see any context."}, {"id": 50663655, "au": "SkiFire13", "dom": 248, "sr": 74, "sc": 2.32, "ep": 3.11, "bs": 0.0, "d": 1, "age": 12.33, "grav": 120.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2107, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not technically wrong, but on the flip side if you had the option to get hired at a company with a bad culture or one with a good culture, with the same salary, which one would you choose? I feel that bad culture companies will inevitably have to pay a salary premium to compensate for the bad culture and get people to stick working there. Of course this works if people have options, otherwise both salaries are going to be low."}, {"id": 50667282, "au": "parpfish", "dom": 37, "sr": 75, "sc": 2.32, "ep": 3.08, "bs": 0.0, "d": 5, "age": 4.86, "grav": 32.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.309, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not only does being friendly with coworkers make work more pleasant/fun, it makes your workplace better:\n\npeople will more freely brainstorm new ideas, feel safe admitting mistakes, and be responsive to your feedback/criticism"}, {"id": 50664957, "au": "skrebbel", "dom": 175, "sr": 76, "sc": 2.32, "ep": 3.08, "bs": 0.0, "d": 2, "age": 9.3, "grav": 78.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 37501, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.309, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The business-related justification is custom emojis function as easy, accessible in-jokes and being in on in-jokes adds to team spirit. If the company ever does \"team building events\" and the likes, then it's the same expected outcome just cheaper."}, {"id": 50669898, "au": "catlifeonmars", "dom": 24, "sr": 77, "sc": 2.32, "ep": 3.07, "bs": 0.0, "d": 2, "age": 1.0, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 16, "k": 2088, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.798, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> then I don’t want to have people look at me as someone who isn’t serious at work\n\nThen there’s the company where everyone reads wayyy too much into how everyone is using company time. The moment I start caring what “look” I’m presenting at work is the moment that I should move on to greener pastures."}, {"id": 50661096, "au": "dannyboland", "dom": 147, "sr": 78, "sc": 2.32, "ep": 3.05, "bs": 0.0, "d": 0, "age": 19.5, "grav": 250.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 28, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.59, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I think the more interesting measure would be looking at this over time. Is your company past its cultural peak?"}, {"id": 50665619, "au": "pjmlp", "dom": 215, "sr": 79, "sc": 2.32, "ep": 3.05, "bs": 0.0, "d": 2, "age": 7.75, "grav": 60.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.794, "fa": 0.28, "gp": 0.263, "bl": 0.0, "ds": 0.0, "txt": "- Threaded discussions\n\n- Can share up to two screens at time\n\n- Quite easy to split content and participants views"}, {"id": 50666710, "au": "aleph_minus_one", "dom": 60, "sr": 80, "sc": 2.32, "ep": 3.04, "bs": 0.0, "d": 3, "age": 5.73, "grav": 39.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 5091, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.295, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> \nIMO, a good \u0023politics channel needs a certain type of people: mostly people who can \"declutch\" (for lack of a better word) from strong emotions and talk about politics in an almost autistic way, like you would about physics or maths. As soon as you get people who want to treat politics as activism, you're in a downward spiral.\n\nMany people are similarly activistic with respect to mathematics and physics. :-)"}, {"id": 50667123, "au": "matsemann", "dom": 111, "sr": 81, "sc": 2.32, "ep": 3.04, "bs": 0.0, "d": 1, "age": 5.07, "grav": 33.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.048, "fa": 0.0, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "Hah, came here to post how I've increased the score everywhere I've worked then. You need the 500, it's like the features of Excel. Everyone only uses a few of them, but different ones! It's one for every situation!"}, {"id": 50667855, "au": "hilariously", "dom": 21, "sr": 82, "sc": 2.32, "ep": 3.04, "bs": 0.0, "d": 4, "age": 4.02, "grav": 25.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 920, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a show of power - either you have the power to fuck off because nobody can touch you because you DELIVER or because you are the kid of the CEO.\n\nWhen someone flaunts the rules or somehow can do stuff that you would get sniped for, you're looking at the real flows of power vs the stated ones in process or job titles."}, {"id": 50664873, "au": "sjamaan", "dom": 34, "sr": 83, "sc": 2.32, "ep": 2.98, "bs": 0.0, "d": 4, "age": 9.49, "grav": 81.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 565, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "+1 on this. This will pay dividends in the future too. People who fondly remember working with you are more likely to bring you on board in their new company when job openings arise. The majority of job openings probably don't even make it onto the \"open market\"."}, {"id": 50666201, "au": "burcsahinoglu", "dom": 171, "sr": 84, "sc": 2.32, "ep": 2.94, "bs": 0.0, "d": 0, "age": 6.6, "grav": 48.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 3, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.907, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "I often wondered if there was a product there: measuring the mood, the efficiency of a company by evaluating conversations in a private way."}, {"id": 50661016, "au": "OJFord", "dom": 260, "sr": 85, "sc": 2.32, "ep": 2.91, "bs": 0.0, "d": 1, "age": 19.73, "grav": 255.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 24383, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.239, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Go to the customise Slack page where you can add/delete/alias them, it might even say the number (in terms of page limit and pages perhaps) but if not you can look at the API requests for them. People do this to export them usually (you'll find tonnes of gists) but you could use it to just count entries too."}, {"id": 50664803, "au": "nchie", "dom": 192, "sr": 86, "sc": 2.32, "ep": 2.88, "bs": 0.0, "d": 2, "age": 9.64, "grav": 82.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 131, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.199, "fa": 0.0, "gp": 0.043, "bl": 0.0, "ds": 0.0, "txt": "We used to alias :passive-aggressive-smile: to that emoji. Whenever someone used it you'd have to hover it to find the real \"tone\" of their message (in a message, you couldn't tell the difference in a reaction).\n\nWe've since switched to Teams and company culture has suffered immensely (though also from layoffs)"}, {"id": 50666136, "au": "matwood", "dom": 46, "sr": 87, "sc": 2.32, "ep": 2.87, "bs": 0.0, "d": 3, "age": 6.74, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 21237, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think there’s a balance. I’m old enough that I’ve been in startups that were in person and pre-slack/hipchat. We ate lunch together almost every day, and many days played pool or ping pong after work while sipping beer from the keg. We worked really hard but also had fun together.\n\nHow do we replicate some of that morale building and trust in our teammates in a remote-only environment?"}, {"id": 50670143, "au": "AMerrit", "dom": 35, "sr": 88, "sc": 2.32, "ep": 2.85, "bs": 0.0, "d": 5, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 143, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is so true. I've gotten better job offers from the guy I used to do fantasy baseball with at work when I was starting out than from any recruiter. He's helped found a couple of companies since those days, and just being in his pool of \"people he likes to work with\" has paid dividends."}, {"id": 50662536, "au": "tavavex", "dom": 159, "sr": 89, "sc": 2.32, "ep": 2.84, "bs": 0.0, "d": 2, "age": 15.46, "grav": 172.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 1.001, "fa": 0.0, "gp": 0.337, "bl": 0.0, "ds": 0.0, "txt": "Scrub the 'culture', just 'damage' describes it well. The surgical precision in which Teams fails at everything it touches should be studied sometime."}, {"id": 50665243, "au": "dimamik", "dom": 80, "sr": 90, "sc": 2.32, "ep": 2.84, "bs": 0.0, "d": 1, "age": 8.71, "grav": 71.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 95, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "Yes! This makes so much sense to me! The speed and quality of the response - either an emoji or a thread message measures an organization culture.\n\nFrom my experience, folks that believe in the mission and success of what they’re doing are extremely responsive."}, {"id": 50662158, "au": "pluralmonad", "dom": 235, "sr": 91, "sc": 2.32, "ep": 2.79, "bs": 0.0, "d": 0, "age": 16.45, "grav": 190.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 19, "k": 502, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 0.683, "fa": 0.0, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "> If you use something else, I don’t really have any advice for you. I only added this section to blast Teams.\n\nDoing the lords work.\n\nEdit: I cannot tell if this is supposed to be completely a joke or only mostly."}, {"id": 50666221, "au": "alfanick", "dom": 239, "sr": 92, "sc": 2.32, "ep": 2.78, "bs": 0.0, "d": 2, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 865, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.184, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Internally Amazon moved from Chime to Slack years ago, while (not sure whether it's still a thing) Slack uses video conferencing product/infra from Chime as part of Slack product. Chime wasn't built inhouse, it was something they bought (Biba? or something like that) and extended."}, {"id": 50667851, "au": "leokennis", "dom": 4, "sr": 93, "sc": 2.32, "ep": 2.78, "bs": 0.0, "d": 1, "age": 4.03, "grav": 25.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 4602, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.959, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "I appreciate different people fitting different company cultures. But I’m so glad I’m in a “thumbs up emoji” office where in the morning people log on to do a job, and in the evening log off when they’ve done it well."}, {"id": 50666561, "au": "pitched", "dom": 161, "sr": 94, "sc": 2.32, "ep": 2.74, "bs": 0.0, "d": 3, "age": 5.98, "grav": 42.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1059, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can’t discover channels in Teams, find out what others are working and take part. Teams has a channel-like thing but is invite-only. So thats the culture difference, Slack is open by default and Teams is closed without the possibility of being open."}, {"id": 50669390, "au": "greggsy", "dom": 19, "sr": 95, "sc": 2.32, "ep": 2.71, "bs": 0.0, "d": 8, "age": 1.68, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2365, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "politics_chat", "flbl": "Politics & Chat (Type)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mate ‘most people’ I work with can type well and fast enough to engage in a chat room. Chat is inherently informal, so I’m not sure where the reading comprehension part comes in?\n\nI’d hate to work in whatever environments prompted you to make such a weird generalisation."}, {"id": 50667679, "au": "Esophagus4", "dom": 23, "sr": 96, "sc": 2.32, "ep": 2.69, "bs": 0.0, "d": 3, "age": 4.26, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1354, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh yes… I used to work at one. I didn’t enjoy working with them.\n\nEven worse, they would then become emboldened to push company leadership to care about their thing of the day, and they’d push all of us to care.\n\nWeird place, it was.\n\nAnd not coincidentally, its business was doing terribly."}, {"id": 50662147, "au": "Liuser", "dom": 193, "sr": 97, "sc": 2.32, "ep": 2.68, "bs": 0.0, "d": 2, "age": 16.49, "grav": 190.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0
