, "w": 27, "qw": 0, "k": 179, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh you’re just learning what it means?  It’s fine, everyone learns at their own pace.  :)\n\nEdit: serious note though, context of emoji usage is always important."}, {"id": 50664307, "au": "ideasphere", "dom": 234, "sr": 98, "sc": 2.32, "ep": 2.66, "bs": 0.0, "d": 0, "age": 10.78, "grav": 98.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 344, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.834, "fa": 0.0, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "Once at an interview I was asked which of the company’s values I most identified with. I chose ‘Hustle’ and got the job, but it was just the shortest and easiest to remember. Many custom slack emoji there."}, {"id": 50667221, "au": "parpfish", "dom": 8, "sr": 99, "sc": 2.32, "ep": 2.64, "bs": 0.0, "d": 2, "age": 4.94, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 0.877, "fa": 0.0, "gp": 0.399, "bl": 0.0, "ds": 0.0, "txt": "If you work remote, you really should be proactive about chatting in those groups.\n\nYou need to make an effort to establish a presence and try to build rapport with folks, especially if it’s a hybrid office and other people are working face to face."}, {"id": 50660245, "au": "munk-a", "dom": 229, "sr": 100, "sc": 2.32, "ep": 2.63, "bs": 0.0, "d": 0, "age": 21.29, "grav": 289.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.526, "fa": 0.0, "gp": 0.961, "bl": 0.0, "ds": 0.0, "txt": "This rule holds true for companies that use Teams, too.  They have no slack emojis and thus no culture."}, {"id": 50664878, "au": "alkonaut", "dom": 157, "sr": 101, "sc": 2.32, "ep": 2.61, "bs": 0.0, "d": 2, "age": 9.48, "grav": 80.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 24589, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.006, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I've used teams for years and while it has some weird corners, I never had any big issues with it.\n\nWhat are peoples' chief complaints with it? (Assume that they aren't just very used to using another product and compare it to that)?"}, {"id": 50666636, "au": "alistairSH", "dom": 81, "sr": 102, "sc": 2.32, "ep": 2.58, "bs": 0.0, "d": 2, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 16667, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 1.099, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The speed? That's an odd one to me. I have most channels muted so I can get work done.  I don't need to instantly read or react to product announcements for stuff I've never seen and won't touch anytime soon.  Not to mention, a good chunk of those announcements are coming out of different time zones, so instant reaction isn't possible (I'm in bed, or they're in bed)."}, {"id": 50667776, "au": "nixpulvis", "dom": 87, "sr": 103, "sc": 2.31, "ep": 2.58, "bs": 0.0, "d": 3, "age": 4.11, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 4737, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 1.096, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think that's making a lot of assumptions about how different people work. Some people are better at context switching than others, and a quick, \"hey I saw this message and you just need to click this button\" doesn't purge your workflow. Especially as we move to using AI more and more, I have plenty of moments in between thoughts on one topic to respond to other topics. I'd say multi-tasking is going to become more and more important as things continue, which is why the feedback I got felt so wrong."}, {"id": 50668698, "au": "ketzu", "dom": 168, "sr": 104, "sc": 2.31, "ep": 2.51, "bs": 0.0, "d": 1, "age": 2.69, "grav": 16.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1679, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I once got a shout out in the company custom emoji channel \"this month's top contributors ... Also, are you okay @david?\" I added some poison and alcohol emoji that week. (it was all in good spirit though)"}, {"id": 50664634, "au": "lemper", "dom": 176, "sr": 105, "sc": 2.31, "ep": 2.47, "bs": 0.0, "d": 1, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1859, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 1.051, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "i frequently use the custom emoji. mostly cats that don't seem too intimidating. i'm trying to create an approachable image at work so things flow more smoothly."}, {"id": 50668880, "au": "tefkah", "dom": 117, "sr": 106, "sc": 2.31, "ep": 2.34, "bs": 0.0, "d": 3, "age": 2.41, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 282, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "interesting, i agree with you yeah. the expressiveness of `> <` is already very high that the `_` and `.` diff doesn't really matter, but the intended expression of `> >` is a lot more vague to me that the diff between `_` and `.` reads as \"aspecific look\" and \"surprise\" to me\n\nrelated: do you read `> >` as looking left (eyelashes) or looking right? at first i thought it was right, but now i can only see them as facing left"}, {"id": 50662238, "au": "persedes", "dom": 232, "sr": 107, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 1, "age": 16.28, "grav": 186.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 351, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 0.981, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I was surprised to learn that teams does have custom emojis now. \n...And much less surprised that the implementation was buggy so emojis would take days to actually show up and that they sometimes freeze mid animation."}, {"id": 50662123, "au": "mrheosuper", "dom": 224, "sr": 108, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 1, "age": 16.57, "grav": 192.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.97, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Man i would rather our company uses Discord than whatever this dumpster fire called \"Team(V2)(New)\""}, {"id": 50663445, "au": "raydev", "d t's a cultural wasteland"}, {"id": 50664663, "au": "Wiles_7", "dom": 246, "sr": 112, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 9.95, "grav": 87.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 57, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.944, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When the company I worked for was acquired the new owners purged thousands of emoji and eventually transitioned us entirely to Teams."}, {"id": 50669879, "au": "locallylinear", "dom": 3, "sr": 113, "sc": 2.15, "ep": 2.15, "bs": 0.0, "d": 2, "age": 1.02, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 6, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.915, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That’s fair, I’d agree with that! Obviously the sample size is small and ultimately, culture and slack culture is one of many factors that will go into how a company pans out."}, {"id": 50664888, "au": "alkonaut", "dom": 262, "sr": 114, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 1, "age": 9.46, "grav": 80.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 24589, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "emoji_custom", "flbl": "Emoji & Custom (Face)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What is custom emoji in this context? There's a seemingly infinite amount of emoji + a button saying \"upload custom emoji anyone in the organization can use\" and of course the whole of giphy etc."}, {"id": 50664651, "au": "anentropic", "dom": 261, "sr": 115, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 0, "age": 9.98, "grav": 87.4, "surf": 0.0, "fade": "c00", "dt":  & Custom (Face)", "urls": [], "ig": 0.796, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am still trying to work a Lenny Face ( ͡° ͜ʖ ͡°) in somewhere without getting sent to HR, haven't managed yet."}, {"id": 50666681, "au": "steve1977", "dom": 40, "sr": 119, "sc": 1.82, "ep": 1.82, "bs": 0.0, "d": 6, "age": 5.77, "grav": 40.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4609, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's highly inefficient that there are so many incompetent people in positions they shouldn't be, just because they get along with the \"right\" people (who are usually also in positions they shouldn't be).\n\nIt will greatly increase productivity if we can get rid of that layer.\n\nSo, not sarcasm, but phrased a bit bluntly maybe."}, {"id": 50667621, "au": "jq-r", "dom": 267, "sr": 120, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 1, "age": 4.32, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 533, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Much more realistic formula. I wish somewhere there would be a ratio of managers to ICs and it would be even more precise."}, {"id": 50663662, "au": "kaashif", "dom": 67, "sr": 121, "sc": 1.68, "ep": 1.68, "bs": 0.0, "d": 4, "age": 12.31, "grav": 120.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_culture", "flbl": "Company & Culture (Channels)", "urls": [], "ig": 0.717, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is interesting that their misreading of the conclusion has produced a post-hoc rationalization that is probably aligned with their current beliefs.\n\nOr maybe that isn't interesting and is completely expected."}, {"id": 50662989, "au": "pinkmuffinere", "dom": 240, "sr": 122, "sc": 1.57, "ep": 1.57, "bs": 0.0, "d": 2, "age": 14.11, "grav": 148.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3655, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.257, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To be fair it probably (hopefully???) isn’t. But it still was in use when I left Amazon 1.5 years ago"}, {"id": 50667422, "au": "benrutter", "dom": 150, "sr": 123, "sc": 1.52, "ep": 1.52, "bs": 0.0, "d": 2, "age": 4.62, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 56, "k": 3553, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "team_everything", "flbl": "Team & Everything (Job)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I wish they did, even if just so that everyone else could also appreciate the best section that made me genuinely laugh out loud:\n\n> What If You Don’t Use Slack?\n\n> If your company uses Microsoft Teams, there is no equivalent formula. There doesn’t need to be. If you use Teams, your lack of culture is probably the least of your problems.\n\n> If you use something else, I don’t really have any advice for you. I only added this section to blast Teams."}, {"id": 50661318, "au": "robenheimer", "dom": 213, "sr": 124, "sc": 1.49, "ep": 4.01, "bs": 2.52, "d": 0, "age": 18.87, "grav": 237.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "teams_slack", "flbl": "Teams & Slack (Place)", "urls": [], "ig": 0.91, "fa": 0.
