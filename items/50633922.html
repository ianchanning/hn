n a batch and forget it, then come back and curate the final results.\n\nAlso, look into the FP8 custom node package (assuming you're using ComfyUI). I think it adds a ton of nice acceleration paths specifically for the M5.\n\nhttps://github.com/pawel-mazurkiewicz/ComfyUI-AppleSilicon-F..."}, {"id": 50635106, "au": "ariwilson", "dom": 1, "sr": 3, "sc": 12.09, "ep": 12.24, "bs": 0.0, "d": 0, "age": 23.51, "grav": 340.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 155, "qw": 0, "k": 1431, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": ["https://fairbake.dev/signature/tasks?language=javascript"], "ig": 1.95, "fa": 1.85, "gp": 1.643, "bl": 0.0, "ds": 0.0, "txt": "With this new Ternary Bonsai model (Q2 GGUF), I'm seeing about 22-25 tokens/s on a Mac Mini M5 Pro 24G RAM/512G SSD, sample Python generation prompt:\n\n  Prompt eval 2.05s\n  Prompt speed 222.9 tok/s\n  Generation 83.49s\n  Speed 22.3 tok/s\n  Tokens 1,860\n  First token 2.12s\n\nI can get up to 128k context in memory easily which makes it potentially useable for agentic coding. Pretty impressive for a small model. Will have to try a simple agentic task. Might be useful for batch agentic coding.\n\nInkling 2 mini (UD-Q3_K_XL) gets about 28 tokens/s with same prompt but only 16k context:\n\n  Prompt eval 1.07s\n  Prompt speed 285.3 tok/s\n  Generation 108.29s\n  Speed 27.6 tok/s\n  Tokens 2,993\n  First token 1.21s\n\nEdit: it was able to solve the simplest bug fix from my benchmark via pi (https://fairbake.dev/signature/tasks?language=javascript) \"Sharing from a phone skips the upload cap\", with one held-out test fixed and nothing else broken across 25 tests.\n\n  Bonsai 2.5 27B (local, Q2_0)  Median of the 45 stored runs\n  Time 6 min 0 s 1.0 min\n  Output tokens 6,607 about 2,000\n  Outcome solved all solved"}, {"id": 50642978, "au": "jckahn", "dom": 88, "sr": 4, "sc": 10.95, "ep": 10.95, "bs": 0.0, "d": 0, "age": 6.15, "grav": 43.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 28, "qw": 0, "k": 1091, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": ["https://bonsai-tetris.vercel.app/", "https://github.com/jeremyckahn/bonsai-tetris"], "ig": 1.181, "fa": 2.42, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "This quant is absolutely incredible. I had it make this excellent Tetris clone on my Mac mini 24 GB via Hermes, totally autonomously: https://bonsai-tetris.vercel.app/\n\nSource code: https://github.com/jeremyckahn/bonsai-tetris\n\nSpeed was around 7-8 tk/s."}, {"id": 50636582, "au": "thepoet", "dom": 91, "sr": 5, "sc": 9.44, "ep": 9.44, "bs": 0.0, "d": 0, "age": 21.24, "grav": 287.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1344, "kpp": 10.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.374, "fa": 1.23, "gp": 1.865, "bl": 0.0, "ds": 0.0, "txt": "Some numbers for a self-created benchmark I have for running long horizon tasks with local models on my Mac (Opus 5.5 gets a 8 of 8 Passed). The tps remains the same, but the overall task completion time has improved.\n\n                 Passed   Steps            Time\n  Bonsai2        5 of 8   358              107 min\n  Bonsai2.5      5 of 8   296 (17% fewer)   76 min (29% less)"}, {"id": 50644884, "au": "rsolva", "dom": 111, "sr": 6, "sc": 9.01, "ep": 9.16, "bs": 0.0, "d": 3, "age": 3.73, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 102, "qw": 0, "k": 1020, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": ["https://forge.dmz.skyfritt.net/ruben/llama-inkling-2-mini"], "ig": 1.677, "fa": 1.3, "gp": 1.043, "bl": 0.0, "ds": 0.0, "txt": "I got Inkling 2 Mini from 28 t/s decode and 300t/s prefill to ~92-210t/s  and 2300 t/s on my AMD 7900 XTX (24 GB VRAM) with a few days of Claude optimizing and patching llama.cpp and rearranging the weights. That is with 384k tokens and vision in GPU, not offloaded to CPU.\n\nClaude is currently trying to optimize it further to get 512k context fit in VRAM. Claude pushes to my repo here, as advances are verified: https://forge.dmz.skyfritt.net/ruben/llama-inkling-2-mini\n\nSo far, this model has suprised me and I find it very pleasant to use. It speaks Norwegian very well, which the Qwen models, even the large ones, never mastered. Could indicate less benchmaxxing."}, {"id": 50634883, "au": "Foobar8568", "dom": 128, "sr": 7, "sc": 8.54, "ep": 8.54, "bs": 0.0, "d": 1, "age": 23.81, "grav": 347.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1250, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.744, "fa": 0.95, "gp": 1.192, "bl": 0.0, "ds": 0.0, "txt": "I feel you would need a fairly expensive FPGA board to be able to have proper performance for these models. And you would be limited by the usual low bandwith, even with HBM, 90%~ on decode of 700GB/sec? I don't remember, but basically worse than a MacBook Pro, and the FPGA board would cost 3-5 times the price.\n\nedit: Alveo V80 is like 10k and 800GB/sec for 32GB of HBM and 2.6M LUT for 190W, and on mouser, next delivery date is July 2027."}, {"id": 50635085, "au": "mlmonkey", "dom": 103, "sr": 8, "sc": 8.39, "ep": 8.39, "bs": 0.0, "d": 1, "age": 23.55, "grav": 341.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1596, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.19, "fa": 1.51, "gp": 0.887, "bl": 0.0, "ds": 0.0, "txt": "I was about to make the same comment, but decided to re-read the article, and from what I can tell, the QWen is 27B (i.e. 27B parameters, so about 27GB memory footprint), whereas this model (Ternary Bonsai) is around 5.7GB. So it's about 5X smaller with similar performance on popular benchmarks."}, {"id": 50635132, "au": "PaulKeeble", "dom": 104, "sr": 9, "sc": 8.1, "ep": 8.25, "bs": 0.0, "d": 2, "age": 23.47, "grav": 339.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.604, "fa": 0.95, "gp": 1.22, "bl": 0.0, "ds": 0.0, "txt": "By default a model comes at FP16, or 2 bytes per value and this is indeed Qwen 3.8 with 27Billion parameters, each of which takes 2 bytes by default so its about a bit bigger than 54GB for the model.\n\nMost people are quantising it (reducing the size) and early tests on this model showed it retains pretty well down to about q4, or half a byte per parameter which is ~16GB or so. You also need space for context to get anything done, multiple GBs worth of it so you in practice can't really use Q4 on a 16GB card, 32GB allows the full 256k context.\n\nThese are compressing it down to 2 bits or even less per parameter on average, this means some parameters have more in places that matter with the goal of retaining as much as possible while shrinking it to fit on cards with less VRAM."}, {"id": 50634638, "au": "NoidFonsense", "dom": 117, "sr": 10, "sc": 8.03, "ep": 8.03, "bs": 0.0, "d": 1, "age": 24.14, "grav": 355.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 244, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.133, "fa": 1.51, "gp": 0.733, "bl": 0.0, "ds": 0.0, "txt": "Why not run 4x Qwen 3.8 27b in parallel? If you want more intellegence at only slightly more memory and flops, at the cost of greater latency. Use llama.cpp's --parallel flag for instance, you will find that the aggregate t/s increases with more requests in parallel.\n\nIf you can run qwen 3.8 27B at q4 already, this model is not for you. Wrong tradeoffs. Also you do not need 4x the memory to run the same model 4x in paralell, thats your other wrong assumption. Good question though."}, {"id": 50634586, "au": "nik_s", "dom": 42, "sr": 11, "sc": 7.74, "ep": 7.74, "bs": 0.0, "d": 0, "age": 24.21, "grav": 357.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 211, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.681, "fa": 0.62, "gp": 1.393, "bl": 0.0, "ds": 0.0, "txt": "Unless I'm totally mistaken, this scores equivalent to opus 4.6 (released feb 2026) on SWE-bench verified. I'd be curious to which extent this is Ternary Bonsai bechmaxxing, the underlying benchmark moving, or just us seeing frontier-like behavior on benchmarks in tiny models with a ~6 month lag: probably a bit of all three? I'll be the first to say that SWE-bench verified is clearly not the most representative of benchmarks sadly, but progress in small models is really exciting nevertheless!"}, {"id": 50637540, "au": "serf", "dom": 114, "sr": 12, "sc": 7.07, "ep": 7.36, "bs": 0.0, "d": 3, "age": 18.9, "grav": 237.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 12, "k": 11540, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.686, "fa": 0.7, "gp": 0.968, "bl": 0.0, "ds": 0.0, "txt": "> and you need to cross the 40-60tok/s barrier to really be useful.\n\npeople always say that, but the big GPT models all run at like ~30tok/s until recently with the 6.2s\n\n6.1-sol on openrouter reports 39 under standard routing, for example, a week or two ago it reporting 31tok/s for the sol model, slower for the astra model.\n\ndo people mean total tok/s over all the slots they have opened with the provider? total tok/s per transaction including all delegations/etc ?\n\nkind of a deceptive metric.\n\np.s. also there is a 3bit quant for inkling; they warn against it in their docs iirc."}, {"id": 50636367, "au": "lossolo", "dom": 132, "sr": 13, "sc": 7.07, "ep": 7.21, "bs": 0.0, "d": 2, "age": 21.6, "grav": 296.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 26, "k": 3518, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 0.989, "fa": 1.37, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "> edit: Alveo V80 is like 10k and 800GB/sec for 32GB of HBM and 2.6M LUT for 190W, and on mouser, next delivery date is July 2027.\n\nSo it seems a better deal is just to buy an NVIDIA card, seems like even 5090 (1.8 TB/s) with 32 GB GDDR7 is  better than this FPGA with 32 GB of HBM for LLMs."}, {"id": 50635960, "au": "ekidd", "dom": 52, "sr": 14, "sc": 7.02, "ep": 7.16, "bs": 0.0, "d": 2, "age": 22.26, "grav": 310.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 24, "k": 11620, "kpp": 9.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.804, "fa": 0.42, "gp": 1.191, "bl": 0.0, "ds": 0.0, "txt": "> Like, seriously: I would be prepared to bet that the experience with this model, impressive though it is, does not match Opus 4.6 in practical use.\n\nI suspect that there are local models that match Opus 4.6 in practical use, but I doubt that Ternary Bonsai or Inkling 2 Mini meet that threshold. Those two are both weaker than Qwen3.8 27B (6 bit quants or above) in practice.\n\nQwen3.8 27B is pretty clearly stronger than Sonnet 4.5. Whether it beats Opus 4.5 might come down to matters of taste.\n\nThere's a larger tier of models—Qwen3.8 Flash Next, DeepSeek V4 Flash and Hy4 Flash—that you can just run with a high end gaming GPU, plenty of VRAM, and a highly-optimized inference engine like Basalt. (Basalt is Blackwell only, and it profiles expert usage and does intelligent VRAM allocation.) Some of these models plausibly play in Opus 4.6 and 4.7 range. They're actually quite useful in practice, for real software work, though each has some idiosyncracies."}, {"id": 50634758, "au": "jedbrooke", "dom": 150, "sr": 15, "sc": 6.97, "ep": 7.19, "bs": 0.0, "d": 0, "age": 24.0, "grav": 352.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 687, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.749, "fa": 0.34, "gp": 1.458, "bl": 0.0, "ds": 0.0, "txt": "Bonsai 2 was a huge leap from Bonsai 1 (Bonsai 1 could barely do anything multi-turn, it would get confused by the second message and keep responding to the first one, frequent doom loops, etc).\n\nBonsai 2 I would describe as Certified Usable™*, So I’m excited to see what they’ve cooked up with 2.5.\n\n*: probably on par with Luna or Sonnet, definitely not Opus. Vibes wise it’s able to do multi step agent workflows, but has trouble conforming to my style guide. It reeks heavily of clauditis in its stock configuration (tons of “My genuine honest opinion” stuff), but I was able to get that down maybe 70% with a style guide"}, {"id": 50636486, "au": "vunderba", "dom": 31, "sr": 16, "sc": 6.68, "ep": 7.19, "bs": 0.0, "d": 3, "age": 21.43, "grav": 292.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 6, "k": 9516, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.706, "fa": 0.76, "gp": 0.703, "bl": 0.0, "ds": 0.0, "txt": "> finally for small LLMs/image generation\n\nAs somebody who does a fair amount of gen AI stuff on a headless linux machine with a dedicated nVidia RTX 24GB card, I'm always interested to hear what kind of performance people are getting out of unified-memory Mac systems outside of bog LLM work.\n\nHow is it working out for you? What kind of generation times are you seeing with image models like Flux2, Qwen Image 2.1, or Krea2 at 1 MP?\n\nIs video gen using something like LTX 2 or Minimax H3 feasible on that machine?"}, {"id": 50634846, "au": "zerd", "dom": 96, "sr": 17, "sc": 6.48, "ep": 6.77, "bs": 0.0, "d": 3, "age": 23.87, "grav": 349.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 586, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.257, "fa": 0.96, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "The link to the previous announcement has some more details: “Ternary Bonsai 2 27B uses ternary {−1, 0, +1} weights with FP16 group-wise scaling, for 1.76 effective bits per weight and a total model footprint of 5.9GB.” … “ while retaining 98.2% of aggregate benchmark performance”."}, {"id": 50636371, "au": "sleight42", "dom": 159, "sr": 18, "sc": 6.1, "ep": 6.1, "bs": 0.0, "d": 0, "age": 21.59, "grav": 295.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1208, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.5, "fa": 0.28, "gp": 1.226, "bl": 0.0, "ds": 0.0, "txt": "Incredibly frustrating when people post LLM benchmarks without indicating which quantization, model file format, and engine. Establishing and controlling for variables in an experiment is basic scientific method. So many people leave out this important context.\n\nI, too, can achieve blazing speeds... when using a 1-bit quant with vllm and a tiny context."}, {"id": 50637111, "au": "dofm", "dom": 55, "sr": 19, "sc": 5.98, "ep": 6.27, "bs": 0.0, "d": 4, "age": 20.13, "grav": 263.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.74, "fa": 0.34, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "Indeed I don't know. I have a passing familiarity with what a client is getting from Claude Opus and Sonnet but he and I have different approaches/principles/problems where this is concerned.\n\nBut I am not even using the biggest open weights models myself because I have a 64GB M1 Max, which makes longer-context work less fun due to quite slow prefills, so I might as well stick to models that offer reasonable multi-turn agentic performance within those bounds, which better fits my own needs.\n\nI am absolutely not knowledgeable about the larger frontier open weights models at the moment.\n\nMy personal process is to develop skills rather than dependencies. I will get to those models eventually I am sure. But for now I am interested in building myself back up after years of burning, augmenting my process, actually learning."}, {"id": 50637471, "au": "dofm", "dom": 135, "sr": 20, "sc": 5.82, "ep": 6.11, "bs": 0.0, "d": 1, "age": 19.11, "grav": 242.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 199, "qw": 16, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.755, "fa": 0.42, "gp": 0.543, "bl": 0.0, "ds": 0.0, "txt": "> What's a smarter model? One with more parameters and fewer bits, or more bits and fewer parameters?\n\nThere are many more variables to consider now. The impact of the harness, various forms of QAT, streaming experts, looping, post-training to reduce thinking overhead, post-training to match the harness…\n\nLocal weights models might be outgunned by frontier cloud models, but my contention is that if you want to be actually relevant in the future, you have to have some instincts for all this stuff — some broad sense of how and why. When the labs people say \"learn AI\", a lot of them mean \"learn our SaaS product\" — learn a dependency.\n\nI say, if you can run even the smallest local weights model (Gemma 4 E4B QAT, Nvidia Dory, Gemma 4 12B QAT, and up) you really should. Get a sense for what they can and can't do, run the whole stack, get Pi, understand how tool calling really works, write tools, etc.\n\nThis is a way to start building the core skills, or at least the footing for the core skills, that develops some cognitive independence.\n\nOne day very soon, I think, the talk of open weights will be much closer to practical, much closer to necessary, and I think being slightly further along in understanding is going to help.\n\nAnd I say this as really a perpetual novice."}, {"id": 50635141, "au": "dofm", "dom": 82, "sr": 21, "sc": 5.48, "ep": 6.14, "bs": 0.0, "d": 3, "age": 23.46, "grav": 339.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.492, "fa": 0.56, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "Goodhart's Law is undefeated.\n\nI feel a little sorry for Thinking Machines Lab. Their press release for Inkling 2 Mini was pretty honest as far as these launch announcements go.\n\n(And it really is objectively good)\n\nBut I think we should assume these benchmarks (especially the silly Artificial Analysis graphs) are now not much use, not least because there are so many to choose from.\n\nAnd this model is a post-hoc quantization to a (clever but small) bit depth, of a model that, while excellent, itself does not match Opus 4.6 on most things. So the odds are stacked against it really being better.\n\nI am sure it will be impressive given its size, though.\n\nHaving said that, when I made my comment I wasn't aware that Opus 4.6 is actually still available. So it is at least possible to make head to head comparisons."}, {"id": 50636861, "au": "dofm", "dom": 44, "sr": 22, "sc": 5.27, "ep": 6.15, "bs": 0.0, "d": 2, "age": 20.7, "grav": 276.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.684, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "It feels superficially good actually — but it seems to overthink even on Low reasoning mode (unless maybe the chat template is broken and the reasoning effort selector in Unsloth Desktop isn't working — I need to test that)\n\nI think there will at some point be merit in a test that compares this, other low-bit quants of 27B, Nemotron Bolt and Inkling 2 Mini. Because the challenge is only to find the best model that fits in those smaller spaces.\n\nI think if one has the resources to run really any Q4 version of Muse Glimmer or the Ukisa or BottleCap versions of 27B, it's automatically better to do so.\n\nYou may be seeing lower raw token speeds but you will get usable results on low reasoning more quickly in practice,  because low bit and MoE models seem to need to spend more time reasoning to catch up."}, {"id": 50634683, "au": "codazoda", "dom": 119, "sr": 23, "sc": 5.26, "ep": 5.41, "bs": 0.0, "d": 1, "age": 24.09, "grav": 354.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 0, "k": 4831, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://joeldare.com/a-local-open-weight-model-builds-its-first-web-app"], "ig": 1.148, "fa": 0.62, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "I feel like I can get these to work but they require a bit more tuning of prompts and instructions than I’m willing to spend time on at the moment. Love the idea and eventually I’ll have time.\n\nI wrote a bit about my first successful run.\n\nhttps://joeldare.com/a-local-open-weight-model-builds-its-fi..."}, {"id": 50636006, "au": "zmmmmm", "dom": 43, "sr": 24, "sc": 5.22, "ep": 5.66, "bs": 0.0, "d": 1, "age": 22.2, "grav": 309.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 22255, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.371, "fa": 0.34, "gp": 1.012, "bl": 0.0, "ds": 0.0, "txt": "Previous iteration of this got some hype but in actual quality people found it to be incredibly bad. Hope this one is better, but won't be jumping in until I hear confirmation from others.\n\nCurrently I am able to run Qwen 3.8 using the byteshape quant very satisfactorily with < 16GB VRAM with close to full quality at 40-50 tps - I don't see too much reason to shift from that."}, {"id": 50635253, "au": "veemjeem", "dom": 147, "sr": 25, "sc": 5.1, "ep": 5.54, "bs": 0.0, "d": 1, "age": 23.31, "grav": 335.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1103, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.654, "fa": 0.34, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "did you properly configure sampling parameters?  many bonsai runtimes default to a temp of 0, which can yield loops.  greedy decoding is great for showing off runtime speeds, but not great at doing actual work.  I've been able to run v2 bonsai on some tasks for an hour without seeing any loops.  I use bonsai on my 12gb 4070ti using the ninfer engine and pi harness, which gets around 3.5k pp and 120 tg, with 200k context at q4_0.  It's great for terminal work."}, {"id": 50635453, "au": "futhey", "dom": 18, "sr": 26, "sc": 5.05, "ep": 5.49, "bs": 0.0, "d": 2, "age": 23.06, "grav": 329.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 705, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.441, "fa": 0.34, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "Things are moving in an interesting direction but this is still underpowered to do economically meaningful work. If this is your budget wait a year, put $50 into open router, or Deepinfra, try some models, and find one you like, then figure out how it runs on real hardware. It's hard to recommend that specific machine for local inference if you haven't spent a bunch of time testing models and found one you love for your own use-case."}, {"id": 50642078, "au": "noiv", "dom": 34, "sr": 27, "sc": 4.67, "ep": 5.77, "bs": 0.0, "d": 2, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 548, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.4, "fa": 0.68, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "My M4 Pro/24GB, barely runs inkling/qwen3.8, both can create working Tetris clones with PI/oMLX/iogpu.wired_limit_mb, but it is too noisy. I'm going for 64GB when budget allows again, don't think the 27B class will fly one day."}, {"id": 50636023, "au": "devy", "dom": 61, "sr": 28, "sc": 4.58, "ep": 5.24, "bs": 0.0, "d": 4, "age": 22.17, "grav": 309.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 10827, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.335, "fa": 0.34, "gp": 0.784, "bl": 0.0, "ds": 0.0, "txt": "It's true. GPU shortage is real in China for the short term after GPU rental in Southeast Asia loophole is plugged since 2025. Long term, Huawei will have plenty of custom silicon (NPUs and ASICs, not GPU) to fill the gap. All Chinese frontier labs will migrate to optimize kernels and runtimes for Chinese version of the HW, CUDA ecosystem could deteriorate. Jensen knows this and he is right."}, {"id": 50635958, "au": "crab_galaxy", "dom": 29, "sr": 29, "sc": 4.41, "ep": 5.73, "bs": 0.0, "d": 4, "age": 22.26, "grav": 311.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 230, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.29, "fa": 0.68, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "Yeah but you do want to consider that maxing out the RAM utilization on a 24gb Mac means running a quantized 26b model with small context windows.\n\nI have a 24gb Mac mini and get some fun use out of it for running the Gemma models (E4B can call tools!) locally but that’s really it. Nothing else is very usable."}, {"id": 50635024, "au": "onaclov2000", "dom": 118, "sr": 30, "sc": 4.33, "ep": 4.84, "bs": 0.0, "d": 2, "age": 23.64, "grav": 343.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 70, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.349, "fa": 0.34, "gp": 0.486, "bl": 0.0, "ds": 0.0, "txt": "I could be mistaken but the problem I ran into with parallel is that it reduced the context I had available per process. Dunno, yes it went faster but I had to get what I needed done in less context (dual 16gb GPUs, running 4 bit quant, and mtp/speculative decoding)"}, {"id": 50635095, "au": "PaulKeeble", "dom": 146, "sr": 31, "sc": 4.23, "ep": 5.04, "bs": 0.0, "d": 0, "age": 23.53, "grav": 340.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.474, "fa": 0.0, "gp": 1.085, "bl": 0.0, "ds": 0.0, "txt": "I tried the V2 and it was unfortunately really bad. It ran but it got stuck in loops and the output was comparatively poor. I think the most welcome change is that it will run on stock llama.cpp, well the Q2s do anyway which makes managing it with other models a fair bit easier. Hopefully it works better now, thankfully I have more VRAM and I don't need to cut this deeply anymore.\n\nThe other option that is really worth considering down at these quants is exllama and its heavily quantised models, they work really well in my experience, fast and the parallel behaviour is also good so you get really good performance out of them."}, {"id": 50639861, "au": "walrus01", "dom": 35, "sr": 32, "sc": 4.13, "ep": 5.01, "bs": 0.0, "d": 2, "age": 12.94, "grav": 130.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 39862, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 0.979, "fa": 0.68, "gp": 0.531, "bl": 0.0, "ds": 0.0, "txt": "Realistically on a 24G system you'd be far better off buying a $10/mo opencode plan and using DeepSeek v4.1 flash 1017. And maybe buy an extra $10 of credit a month on top of that depending on how much you use it."}, {"id": 50635584, "au": "ariwilson", "dom": 30, "sr": 33, "sc": 4.09, "ep": 5.89, "bs": 0.27, "d": 2, "age": 22.86, "grav": 325.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1431, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.489, "fa": 0.34, "gp": 0.984, "bl": 0.1, "ds": 0.0, "txt": "Can't beat it for $1299 at Microcenter! I didn't primarily get it for agentic coding - mostly for large scale cloud agent work, secondarily for batch processing, and finally for small LLMs/image generation.\n\nObviously RAM is your limiting factor. I think the RAM-to-tokens/s ratio is decent though."}, {"id": 50643750, "au": "vunderba", "dom": 11, "sr": 34, "sc": 4.07, "ep": 4.95, "bs": 0.0, "d": 6, "age": 5.13, "grav": 34.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 9516, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.691, "fa": 0.0, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "Agreed. I used to use itch.io for my games, but then later migrated everything over to my VPS. I also switched from Nginx to Caddy several years ago because I found it much easier to manage. If you subdomain everything, deploying new stuff is even easier - basically just a quick update in the Caddyfile.\n\nThere are also really nice open-source tools like Coolify and CapRover, which help you manage your own platform for deploying new applications and services. But I still prefer to manage everything from the terminal."}, {"id": 50640531, "au": "graboid", "dom": 112, "sr": 35, "sc": 3.62, "ep": 5.16, "bs": 0.0, "d": 3, "age": 11.17, "grav": 103.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 131, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.392, "fa": 0.34, "gp": 0.634, "bl": 0.0, "ds": 0.0, "txt": "I actually pushed Claude for about half a day to write me a custom inference engine in C for Inkling Mini, optimized to my M2 Max Macbook.\n\nwith Q4_0 quants, 32k context, I get 52.5 tok/s. 494 tok/s prefill on a 32k prompt. I tested it in a Pi harness and its very usable for local coding, at least in my quick tests."}, {"id": 50635894, "au": "z2", "dom": 20, "sr": 36, "sc": 3.61, "ep": 5.16, "bs": 0.0, "d": 3, "age": 22.36, "grav": 313.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1918, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.436, "fa": 0.34, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "Exactly. I've no regrets splurging on a 48GB M5 pro. I'm also addicted to the speed from the Splash engine's speculative decoding on Qwen models, 70t/s on Qwen3.8 27b, 200t/s for Qwen3.6 35b-a3b, and can just throw long running background batches at it like photo/video annotation, while still using it normally."}, {"id": 50644922, "au": "z2", "dom": 23, "sr": 37, "sc": 3.59, "ep": 5.13, "bs": 0.0, "d": 5, "age": 3.69, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 1918, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.749, "fa": 0.0, "gp": 0.702, "bl": 0.0, "ds": 0.0, "txt": "I've been running batches of roughly 2 concurrent requests at 20-50k input tokens, with context window pretty inefficiently set at 150k tokens. If this were sequential it's probably closer to 50 t/s for the 27b Splash q4 variant and 150 t/s for the 35b-a3b. M5 Pro 20-core GPU Macbook Pro.\n\nAs an aside, it does get hot to ~80C if left to its own cooling, and while supposedly OK, I fully intend to use this computer for the next decade, so I ended up getting one of those laptop cooler bases which can keep the CPU/GPUs at 60C and the battery at room temperature."}, {"id": 50636365, "au": "vunderba", "dom": 3, "sr": 38, "sc": 3.5, "ep": 4.6, "bs": 0.0, "d": 2, "age": 21.61, "grav": 296.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 54, "qw": 0, "k": 9516, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": ["https://en.wikipedia.org/wiki/Geometry_Dash"], "ig": 1.034, "fa": 0.62, "gp": 0.281, "bl": 0.0, "ds": 0.0, "txt": "I mean, it's neat that it was able to make it without errors, but that's a direct ripoff of several very popular Geometry Dash levels (the exact gravitational mechanic and game play).\n\nAlso OOC why is it hosted on claude.ai? Did you just copy Bonsai's code to there and then ask it to wrap it?\n\nhttps://en.wikipedia.org/wiki/Geometry_Dash"}, {"id": 50634850, "au": "Lramseyer", "dom": 127, "sr": 39, "sc": 3.44, "ep": 4.32, "bs": 0.0, "d": 0, "age": 23.87, "grav": 349.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 643, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 1.37, "bl": 0.0, "ds": 0.0, "txt": "This is really cool! I am glad that people are asking questions about the optimal bit depth for a language model! What's a smarter model? One with more parameters and fewer bits, or more bits and fewer parameters?\n\nBut I have a dumb question about this model - is there hardware acceleration for ternary weights aside from an FPGA?"}, {"id": 50639000, "au": "lettergram", "dom": 141, "sr": 40, "sc": 3.44, "ep": 4.32, "bs": 0.0, "d": 0, "age": 15.3, "grav": 169.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 13310, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.012, "fa": 0.34, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "They should do this for a >100B model, if we're looking at a 90% reduction in memory requirements you can effectively bring the largest models to a maxed out macbook, or a home computer with a couple of GPUs."}, {"id": 50636825, "au": "minimaxa", "dom": 144, "sr": 41, "sc": 3.2, "ep": 4.3, "bs": 0.0, "d": 0, "age": 20.79, "grav": 277.9, "surf": ning other local models?"}, {"id": 50635809, "au": "hatthew", "dom": 124, "sr": 47, "sc": 2.67, "ep": 3.55, "bs": 0.0, "d": 0, "age": 22.52, "grav": 317.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 2022, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.012, "fa": 0.0, "gp": 0.806, "bl": 0.0, "ds": 0.0, "txt": "I would be interested in seeing direct comparisons to equivalently small models, e.g. a popular Q1/Q2 quant of Qwen3.8 or some SOTA model in the 1B-10B range."}, {"id": 50634686, "au": "tompagenet2", "dom": 92, "sr": 48, "sc": 2.65, "ep": 4.19, "bs": 0.0, "d": 0, "age": 24.08, "grav": 354.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1105, "kpp": 10.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 1.141, "bl": 0.0, "ds": 0.0, "txt": "Asking genuinely as I know I'm surely being daft here: the scores for this model in the table shown seem worse than Qwen. Am I reading it right and is the upside something else (memory use, speed etc)?"}, {"id": 50636808, "au": "ycui7", "dom": 138, "sr": 49, "sc": 2.64, "ep": 3.74, "bs": 0.0, "d": 0, "age": 20.83, "grav": 278.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 130, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 0.689, "fa": 0.34, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "for the first time, bonsai passed my 2048 needles dense retrieval test over 256K context length. really good progress for them."}, {"id": 50638501, "au": "isomorphic", "dom": 21, "sr": 50, "sc": 2.54, "ep": 4.08, "bs": 0.0, "d": 4, "age": 16.63, "grav": 193.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1458, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.02, "fa": 0.34, "gp": 0.495, "bl": 0.0, "ds": 0.0, "txt": "Thank you for mentioning the Splash engine, which I was unaware of.\n\nWith the simonw prompt \"Generate an SVG of a pelican riding a bicycle\", on an M4 Pro Mac mini 64GB, Splash engine, I'm getting 48.21 tok/s--which is around double what I get with other engines!"}, {"id": 50635177, "au": "PaulKeeble", "dom": 116, "sr": 51, "sc": 2.43, "ep": 3.98, "bs": 0.0, "d": 1, "age": 23.41, "grav": 338.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.049, "fa": 0.34, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "Instead of doing that what you actually do is run the inference engine with --parallel 4 (llama.cpp) or look up what it is on your engine and it will copy only the context that model uses per person and share the weights. Some of them can do some context sharing to reduce the impact of that but this will take up less space than 4x bonsai models + context."}, {"id": 50638115, "au": "dofm", "dom": 102, "sr": 52, "sc": 2.34, "ep": 3.66, "bs": 0.0, "d": 2, "age": 17.58, "grav": 211.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.545, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Yes. If you can fit 4 bit Qwen it will, I am pretty confident, be better. If it is slow, I would suggest trying BottleCap AI’s ThinkingCap, or Ukisa Swift 1.5, both of which are fine tunes of 3.8 27B that are designed to get to their answers with much less thinking.\n\nI am not sure but I don’t think this Bonsai model is just a clever quantisation; I haven’t been able to prove it but it feels like it thinks a lot more on low reasoning mode than Qwen does, and that this is likely the result of their post training that they have done to try to address looping and broken tool calls and other things that go wrong in long context work with aggressive quantisations.\n\nIn its size class I think it is clear there is nothing much that gets close, though maybe a streaming weights engine with Nemotron Bolt (which is only 9B active parameters) would."}, {"id": 50637919, "au": "suprjami", "dom": 134, "sr": 53, "sc": 2.27, "ep": 3.81, "bs": 0.0, "d": 1, "age": 18.01, "grav": 220.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 2875, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.536, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "It's not quite that simple.\n\nYou can quantize some tensors heavily before capability drops off.\n\nOther tensors really need to be kept at full size otherwise the model degrades fast.\n\nThis is the idea behind quant schemes like Unsloth Dynamic.\n\nThere are also improvements one can make during quantization, like EXL3 uses Hessians instead of llama.cpp's diagonals, which should result in less quantization loss."}, {"id": 50636463, "au": "PaulKeeble", "dom": 148, "sr": 54, "sc": 2.18, "ep": 3.58, "bs": 0.0, "d": 2, "age": 21.47, "grav": 293.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.359, "fa": 0.0, "gp": 0.264, "bl": 0.0, "ds": 0.0, "txt": "Yes I did, I had a particular problem that I was running a lot of models on to compare them via open router and local. I set up Bonsai V2 with it's custom llama.cpp port and the parameters it set in the model description and it was the only one that failed to finish. Ornith 1.0 was also unable to correct it's bugs but that was preferred to no output. I had a bad experience with it in pi harness and moved on to other options."}, {"id": 50637427, "au": "serf", "dom": 50, "sr": 55, "sc": 2.17, "ep": 3.71, "bs": 0.0, "d": 2, "age": 19.19, "grav": 243.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 11540, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.516, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "my previous bonsai experience : it was good and fast until it got caught in a death loop, which was often, so it needed a lot of babysitting.\n\nqwen3.8 27b variants are a lot better in the death-loop department, \"But wait..\"; it tends to catch itself repeating, the older bonsai model just filled text buffers until terminated.\n\nvery fast though. it flies on RTXs."}, {"id": 50635911, "au": "dlcarrier", "dom": 129, "sr": 56, "sc": 2.17, "ep": 3.65, "bs": 0.0, "d": 2, "age": 22.34, "grav": 312.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 3539, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.481, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "FPGAs aren't great at doing math.  Most of them basically cheat by having internal ALUs that get used for math, but a GPU has a lot more of them and will significantly outperform FPGAs for a given die area and power consumption, on the same process.\n\nWhere FPGAs really shine is super-low-power applications, like detecting wakewords for voice prompts, where the neural network has thousands of parameters at most."}, {"id": 50637371, "au": "ricardobeat", "dom": 110, "sr": 57, "sc": 2.17, "ep": 3.64, "bs": 0.0, "d": 2, "age": 19.37, "grav": 247.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 0.802, "fa": 0.34, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I think it barely fits in 32GB (there is no <4bit quant that I've seen), and you need to cross the 40-60tok/s barrier to really be useful."}, {"id": 50635308, "au": "iagiagiag", "dom": 120, "sr": 58, "sc": 2.17, "ep": 3.43, "bs": 0.0, "d": 1, "age": 23.25, "grav": 334.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 27, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "Sure, you \"just\" need the code to optimize swarm of AI agents. It's what they use at Anthropic and OpenAI to solve math problems. Though I'm not sure if 4 agents would qualify as a swarm, but I'm sure they could provide better results than 1 agents provided they're used correctly. It turns the \"intelligence\" problem into an \"intelligence + bruteforce\" problem. You don't have to be too smart if you can try 10.000 \"ok\" solutions per minute."}, {"id": 50634804, "au": "dofm", "dom": 51, "sr": 59, "sc": 2.17, "ep": 3.41, "bs": 0.0, "d": 1, "age": 23.93, "grav": 350.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "My neighbour's cat scored equivalent to Opus 4.6 this week.\n\nLike, seriously: I would be prepared to bet that the experience with this model, impressive though it is, does not match Opus 4.6 in practical use.\n\nSame with Inkling 2 Mini. Is it very good? Yes, it's really very good for an MoE. Are there speed improvements to come: yes. Is it entirely worth the hype: no.\n\nThis is a cycle and we should be wary of it. It will go into overdrive if Alibaba can find enough GPUs to finish Qwen 4 27B.\n\n(I use only open weights)"}, {"id": 50635940, "au": "dlcarrier", "dom": 131, "sr": 60, "sc": 2.17, "ep": 3.32, "bs": 0.0, "d": 3, "age": 22.28, "grav": 311.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 3539, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.414, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's lots of work showing ASICs built around specific models or even a generic transformer architecture have huge performance advantage over GPUs.  FPGAs, on the other hand, need enough baked-in IP to get any reasonable performance that they're just ASICs running a model on a die that also contains an FPGA."}, {"id": 50635242, "au": "iagiagiag", "dom": 133, "sr": 61, "sc": 2.17, "ep": 3.31, "bs": 0.0, "d": 1, "age": 23.32, "grav": 336.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 27, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "In the end I'm sure all models will be 1 bit per parameter. For now it's still problematic because we can't (easily) train models like that. Idk if we'll find a way to train models that way or if we'll do it with better quantization methods. I've not looked too deep into how bonsai models work during inference, but you have hardware acceleration for any weight provided you give them the right size during inference, and you do have acceleration for some binary operations. So they use tricks. I think the last generation of GPUs has nvfp4 (4 bits) min."}, {"id": 50634827, "au": "liuliu", "dom": 154, "sr": 62, "sc": 2.17, "ep": 3.26, "bs": 0.0, "d": 2, "age": 23.9, "grav": 350.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 3376, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 0.974, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "MoE, thus, you can run it fine with ~8GiB runtime VRAM without any additional quantization (native NVFP4 / MXFP8 weights)."}, {"id": 50643766, "au": "nittanymount", "dom": 140, "sr": 63, "sc": 2.17, "ep": 3.25, "bs": 0.0, "d": 0, "age": 5.11, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 154, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 1.284, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "with  MBP, M2, 32G, llama.cpp, tried a simple web app for loan calculation. \nit runs 20-30t/s,  but keep talking, long time, failed due to output limit, the output is not not usable..."}, {"id": 50635416, "au": "piyh", "dom": 19, "sr": 64, "sc": 2.17, "ep": 3.18, "bs": 0.0, "d": 2, "age": 23.12, "grav": 331.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1870, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 0.825, "fa": 0.0, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "Speaking with an M4 Pro, my biggest regret is not getting the RAM upgrade.  You can run inkling quants, but can't have anything else open and the context is gutted.  I'd be able to actually use my computer for other things and have useful context windows with 48 gigs."}, {"id": 50639007, "au": "shermanyo", "dom": 45, "sr": 65, "sc": 2.17, "ep": 3.05, "bs": 0.0, "d": 3, "age": 15.29, "grav": 169.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 233, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The model card says:\n\nThe model uses xhigh reasoning effort by default (most accurate); use medium for shorter responses and a balance of speed and accuracy. low reasoning effort is not supported and when selected the model will behave close to xhigh."}, {"id": 50639739, "au": "whatifitoldyou", "dom": 47, "sr": 66, "sc": 2.17, "ep": 2.96, "bs": 0.0, "d": 5, "age": 13.29, "grav": 135.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 60, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 1.259, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In my testing medium on qwen3.8 27b is not worth it. It does not reduce thinking significantly but still affects the results. The swift 1.5 fine tune or a similar fine tune gives significantly more tokens without affecting quality as much."}, {"id": 50634989, "au": "NBJack", "dom": 83, "sr": 67, "sc": 2.17, "ep": 2.89, "bs": 0.0, "d": 3, "age": 23.68, "grav": 344.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2255, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Selling stuff. Making money. Impressing you. Drawing your attention. Marketing.\n\nI've lost track of how many times someone said how great a local model is at x or y, only to learn they limit the conditions of its use, have some secret sauce in their harness, etc. to make it work."}, {"id": 50634601, "au": "StevenNunez", "dom": 161, "sr": 68, "sc": 2.17, "ep": 2.88, "bs": 0.0, "d": 0, "age": 24.2, "grav": 357.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 148, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 0.67, "fa": 0.0, "gp": 0.902, "bl": 0.0, "ds": 0.0, "txt": "I really want to like this family of models but I'm always disappointed and feel gaslit by the developers."}, {"id": 50635071, "au": "woopsn", "dom": 122, "sr": 69, "sc": 2.17, "ep": 2.86, "bs": 0.0, "d": 1, "age": 23.57, "grav": 342.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 270, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.215, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not great below q8 (which requires some hardware unfortunately), and you also need to set reasoning to low or Qwen will just second guess itself until it runs out of context. At q4 I liked Poolside's Laguna 2.1 XS a lot better, although there will probably never be another release."}, {"id": 50644046, "au": "gus_massa", "dom": 107, "sr": 70, "sc": 2.17, "ep": 2.78, "bs": 0.0, "d": 0, "age": 4.81, "grav": 31.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 20321, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "open_weight", "flbl": "Open & Weight (Skills)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Side question: The ternary method uses weights {1, 0, -1}. Has anyone tried a quaternary unsymmetrical method, perhaps like  {1, 1/2, 0, -1} or something like that? I'm not sure if the implementation would be slower, but it would be more efficient to store the coefficients in the hard disk."}, {"id": 50634870, "au": "trvz", "dom": 98, "sr": 71, "sc": 2.17, "ep": 2.77, "bs": 0.0, "d": 3, "age": 23.82, "grav": 348.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 786, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You wouldn't use Qwen 3.8 at less than Q4. Preferably at Q8, but even going to full BF16 might make sense.\n\nBonsai 2.5 is basically/supposedly a really good Q2 quant.\n\nGive up a bit of quality for an order of magnitude faster inference. Previous Bonsais were rather bad, so we'll see whether it's actually just \"a bit\" now."}, {"id": 50640401, "au": "akavel", "dom": 14, "sr": 72, "sc": 2.17, "ep": 2.72, "bs": 0.0, "d": 1, "age": 11.44, "grav": 107.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4780, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Bonsai)", "urls": [], "ig": 0.582, "fa": 0.22, "gp": 0.501, "bl": 0.0, "ds": 0.0, "txt": "May I ask how are you running them both? llama.cpp or something else? (Inklink reportedly currently requires their fork of llama.cpp on a Mac, right?)"}, {"id": 50634910, "au": "dimator", "dom": 81, "sr": 73, "sc": 2.17, "ep": 2.7, "bs": 0.0, "d": 2, "age": 23.77, "grav": 346.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1420, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 0.507, "fa": 0.28, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "If this is true, of what utility are all these benchmarks at this point? Is the only alternative really for everyone to try a model themselves and judge it against exactly what they're doing?"}, {"id": 50636328, "au": "drob518", "dom": 101, "sr": 74, "sc": 2.17, "ep": 2.68, "bs": 0.0, "d": 1, "age": 21.68, "grav": 297.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 2968, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "size_model", "flbl": "Size & Model (Opus)", "urls": [], "ig": 1.139, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you have the memory to run a less-quantized version of Qwen, you’ll get better output doing that. This model is deliberately trying to crunch things down to a minimum size. For its size, it’s doing pretty well with output quality, just judging from the self reported numbers, but there is a trade off here, and if you aren’t forced to make it, you’ll should choose Qwen. Even Qwen at 4-bit is likely better."}, {"id": 50636865, "au": "ariwilson", "dom": 32, "sr": 75, "sc": 2.17, "ep": 2.81, "bs": 0.27, "d": 4, "age": 20.69, "grav": 275.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1431, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mac_pro", "flbl": "Mac & Pro (LLM)", "urls": [], "ig": 0.782, "fa": 0.34, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "I just got the machine yesterday so not a ton of experience. MOSS-Image was generating images with 30 passes at 1 megapixel in somewhere between 2-3 minutes."}, {"id": 50634751, "au": "tompagenet2", "dom": 94, "sr": 76, "sc": 2.17, "ep": 2.53, "bs": 0.0, "d": 2, "age": 24.0, "grav": 352.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1105, "kpp": 10.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "parameters_qwen", "flbl": "Parameters & Qwen (Per)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks, sorry it that's obvious from the page - I get lost in the mix (in general, not just with this model) of parameters Vs active parameters Vs memory usage etc"}, {"id": 50634740, "au": "mahdi7d1", "dom": 100, "sr": 77, "sc": 2.17, "ep": 2.34, "bs": 0.0, "d": 1, "age": 24. /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
