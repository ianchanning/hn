d-sightlines", "https://i.redd.it/qhis4tdy165h1.png"], "ig": 1.93, "fa": 0.62, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "It's not the size of the screen, it's the Field of View (FoV) which is a function of viewing distance and screen size. This chart shows the FoVs recommended by SMPTE (Society of Motion Picture and Television Engineers), THX and 20th Century Fox: https://acousticfrontiers.com/blogs/articles/home-theater-vi.... RTings.com has one that's basically a blend of those: https://i.redd.it/qhis4tdy165h1.png.\n\nThere's no \"correct\" value because across that middle range, people have different preferences. As a home theater enthusiast and long-time video engineer (with an actual shiny Prime Time Emmy for Technical Achievement!) I've developed an opinion over many years across a lot of ideal screening rooms including Dolby's in SF, the old one on the 20th Century lot and more than a few multi-million dollar private rooms. I've learned my sweet spot for viewing cinematic content is right around 45 degrees. My wife prefers around 35. At home we have a custom theater with a 3-laser 4K front projector filling a 150\" screen. Sitting in my custom recliner, the screen fills 45.2 degrees of my field of view.\n\nSince I also enjoy some gaming and sports in our theater (at that size, GTA 6 on PS5 Pro is amazing), I wouldn't want the FoV any wider as I'd need to turn my head to track moving objects to the edges of the screen, so it really comes down to what your optimal peripheral vision zone is. Trackin"}, {"id": 50647299, "au": "hmartin", "dom": 74, "sr": 3, "sc": 6.87, "ep": 6.87, "bs": 0.0, "d": 0, "age": 13.36, "grav": 136.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 148, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://techcrunch.com/author/lucas-ropek/"], "ig": 0.859, "fa": 0.96, "gp": 1.461, "bl": 0.0, "ds": 0.0, "txt": "Journalistic investigation in 2026: I wrote down feelings about my experiences last night in a dramatic vocabulary and even skimmed a few Reddit comments.\n\nAlso Jensen and Elon and Palmer are bad. [1]\n\n[1] https://techcrunch.com/author/lucas-ropek/"}, {"id": 50647602, "au": "Animats", "dom": 59, "sr": 4, "sc": 6.83, "ep": 6.83, "bs": 0.0, "d": 0, "age": 12.96, "grav": 130.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 0, "k": 168316, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": ["https://images.squarespace-cdn.com/content/v1/5c647bc99b7d150fe925ea5c/1582994063807-1TERPI6VNUGZAJ6LUZ37/wall+to+wall+tv+1958.jpg", "https://immersivestudio.co.uk/wp-content/uploads/2026/02/LED-Video-Wall-Immersive-Studio.jpg"], "ig": 1.093, "fa": 0.62, "gp": 1.723, "bl": 0.0, "ds": 0.0, "txt": "Wall sized TVs were predicted in the 1950s.[1] It's taken a long time, but they're here, although expensive. \"Video walls\" made of seamless tiles of screens are available.[2] They're all over high-end retail now. A bit much for a living room.\n\n[1] https://images.squarespace-cdn.com/content/v1/5c647bc99b7d15...\n\n[2] https://immersivestudio.co.uk/wp-content/uploads/2026/02/LED..."}, {"id": 50647165, "au": "ricardobeat", "dom": 8, "sr": 5, "sc": 6.76, "ep": 6.76, "bs": 0.0, "d": 0, "age": 13.55, "grav": 139.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.374, "fa": 0.34, "gp": 1.766, "bl": 0.0, "ds": 0.0, "txt": "There is very little investigation here, and so many factors at play. The author didn't consider refresh rate, the particular kind of OLED in their TV (there are several), their content settings, lighting in the room, etc etc.\n\nIf you're looking for a large screen, I encourage you to try a UST projector [having ditched TVs myself back in 2019]. The image may not be as bright, but at night it is irrelevant, latest gen devices have > BT2020 color space, and it never gives you that headache-y feeling you get after watching TV for a while."}, {"id": 50646963, "au": "drnick1", "dom": 67, "sr": 6, "sc": 6.68, "ep": 6.68, "bs": 0.0, "d": 0, "age": 13.83, "grav": 144.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 1.351, "fa": 0.5, "gp": 1.437, "bl": 0.0, "ds": 0.0, "txt": "I think resolution is the limiting factor here. Increasing the size while keeping the resolution fixed lowers pixel density, so a larger screen can end up looking worse. This also depends on the viewing distance. On a desktop, I don't think you can go much above 32\" at 4K for example. 28\" is probably ideally sharp at 4K, but a bit small IMO for a single monitor setup."}, {"id": 50608454, "au": "bob1029", "dom": 25, "sr": 7, "sc": 6.58, "ep": 6.58, "bs": 0.0, "d": 0, "age": 74.96, "grav": 2484.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.334, "fa": 0.34, "gp": 1.709, "bl": 0.0, "ds": 0.0, "txt": "I think the primary cause is bad algorithms for driving the active elements. The OLED in the new MacBook has an issue with low PWM frequency.\n\nWith very large displays, you need to get pretty aggressive with the power management to keep the total consumption down. My 65\" panasonic plasma would pull over 800 watts in some scenes. I'm pretty sure this is a felony in California now."}, {"id": 50647886, "au": "rahimnathwani", "dom": 33, "sr": 8, "sc": 6.55, "ep": 6.7, "bs": 0.0, "d": 1, "age": 12.6, "grav": 124.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 16555, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 1.486, "fa": 0.9, "gp": 0.441, "bl": 0.0, "ds": 0.0, "txt": "if you are sitting 3 times height or more away from the TV, you will not be able to see a difference in detail between a HD and 4K TV\n\nThis would probably be true if both TVs were showing equivalent sources, for example:\n\n- the same 4K stream, or\n\n- native-resolution sources with full colour resolution (4:4:4) on both.\n\nIn practice, though:\n\n- most video has half the colour resolution of its brightness resolution (4:2:0), so a 1080p source has only 540 lines of colour\n\n- a 1080p TV usually gets a lower-bitrate stream from a streaming service, with more visible compression artifacts."}, {"id": 50647528, "au": "mauvehaus", "dom": 81, "sr": 9, "sc": 6.44, "ep": 6.44, "bs": 0.0, "d": 0, "age": 13.06, "grav": 131.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 7063, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 1.316, "fa": 0.34, "gp": 1.642, "bl": 0.0, "ds": 0.0, "txt": "I built a TV stand/entertainment center for a client who had an 85\" TV. It was so big, I could lie down behind it and not stick out on either end. He wanted the TV flush with the front edge of the piece, so to prevent to whole thing from flopping forward and smooshing someone, I cast a 150 pound concrete counterweight for the back.\n\nYes. A TV can be too big."}, {"id": 50608294, "au": "d3Xt3r", "dom": 37, "sr": 10, "sc": 6.37, "ep": 6.37, "bs": 0.0, "d": 0, "age": 75.39, "grav": 2509.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 46, "k": 1515, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.157, "fa": 0.42, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "> one theory that sprang to mind was that it might just be my eyes’ inexperience with viewing such a big screen. The TV was so large that it often felt like my eye had to trace different parts of the screen to take in the whole picture\n\nI don't buy this argument. I mean, most of us also go to movie theaters and we don't experience this. Heck, there's even IMAX and 360° screens where you may have to actually move neck around to take in the whole picture.\n\nAlso, I've got a 65\" OLED as well, and when I first got it the only thing I felt was that it seemed a little too big for my room, but I got used to it soon. I didn't get experience any feelings of nausea, nor did my flatmates or my family or other guests who came to visit (none of whom were used to a 65\" either)."}, {"id": 50647093, "au": "kuhsaft", "dom": 60, "sr": 11, "sc": 6.2, "ep": 6.42, "bs": 0.0, "d": 0, "age": 13.68, "grav": 141.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 0, "k": 295, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": ["https://www.rtings.com/tv/reviews/by-size/size-to-distance-relationship"], "ig": 1.121, "fa": 0.62, "gp": 1.392, "bl": 0.0, "ds": 0.0, "txt": "Terrible article. Doesn't mention the actual model of the previous TV. Doesn't mention anything about screen distance, FOV, and display resolution. An actual investigation would be sitting closer/farther, and testing with different display types.\n\nRTINGS has a recommended screen size calculator: https://www.rtings.com/tv/reviews/by-size/size-to-distance-r..."}, {"id": 50653365, "au": "mrandish", "dom": 14, "sr": 12, "sc": 5.87, "ep": 6.02, "bs": 0.0, "d": 2, "age": 0.68, "grav": 5.9, "surf": 9.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 11161, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 1.835, "fa": 0.28, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "Having used both for many years, they just create very different visuals. On an LED/LCD/OLED flat screen the emitters are shooting light toward you, whereas in a front projector the light is reflecting off a screen (typically 1.0 to 1.2 gain). Because of that a theater screen has no surface reflections and a good screen driven by a high-end theater projector that's professionally calibrated in a fully-light controlled room is still 'cinematic' in a way nothing else is.\n\nThe advantage of active flat screens is they can get very bright, so I use them for environments where I don't have good light control. And recent OLEDs can manage good contrast at higher brightness. But we put an LG C5 OLED in my theater room alongside the projector and tried to calibrate it using professional tooling to match the front projector's reference image and we couldn't get full gamut saturation and high contrast in a cinematic brightness range (which is lower than active screen's optimal range). Active screens just want to be photon canons and, if that's what your environment dictates, they're usually the best option. Cinema projectors excel at throwing very large images in dark environments that look spectacularly cinematic."}, {"id": 50652916, "au": "bdavbdav", "dom": 30, "sr": 13, "sc": 5.65, "ep": 5.65, "bs": 0.0, "d": 0, "age": 1.76, "grav": 10.8, "surf": 231.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 908, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 1.404, "fa": 0.68, "gp": 0.283, "bl": 0.0, "ds": 0.0, "txt": "I got this issue with gaming quite a lot when I upgraded computer monitors to a 32” curved panel. I ended up realising it was much more pleasurable to play on my old 1440p 60hz Dell U2515h at the time, keep FOV high, fps higher, and enjoy the game without feeling sick within 10 minutes."}, {"id": 50653014, "au": "mrandish", "dom": 6, "sr": 14, "sc": 5.4, "ep": 5.55, "bs": 0.0, "d": 2, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 236, "qw": 0, "k": 11161, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 2.034, "fa": 0.0, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "The room is outfitted in a set of custom-made recliners which fit together in curved sections which match  the arc of each level of seating. I don't have the company name as it was a vendor of the company that designed and built the entire room, which was constructed in a warehouse, then disassembled and trucked here and installed by a team of four over a period of weeks into the empty room shell.\n\nThe full multi-layer sound-proofing is finished in acoustic foam under upholstered fabric over every inch or wall, door and ceiling and was a big part of the work including custom moulding, in-wall speaker enclosures, projector hush box, etc. Everything in the room from the stage lighting, motorized curtains, animated LED accent lighting, soffit, carpet, recessed lighting fixtures, authentic theater in-wall backlit poster enclosures and every trim element was part of the custom design and matches the custom color scheme and fabrics. The room size and shape were designed to minimize nulls and standing waves. When the auto-sealing four-edge door is closed, the acoustics sound like an anechoic chamber. With power off and lights off it's essentially a pitch black sensory deprivation chamber where you can hear your heartbeat. Because the room was designed by the theater architect and then house designed around it by a different firm, it's full structural isolation, so when the subs are cr"}, {"id": 50653028, "au": "roryirvine", "dom": 75, "sr": 15, "sc": 4.87, "ep": 4.87, "bs": 0.0, "d": 0, "age": 1.48, "grav": 9.5, "surf": 14.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 1417, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.732, "fa": 0.0, "gp": 0.552, "bl": 0.0, "ds": 0.0, "txt": "TV size is a massive class shibboleth in the UK.\n\nWorking class? Knock yourself out, go as large as you can afford\n\nLower middle? Up to 50\" is fine, as long as it's not too blingy\n\nSolid middle? Up to 50\" if it's not in the primary living area, 42\" otherwise\n\nUpper middle? 42\" maximum, but preferably nowhere that guests might see it\n\nUpper? A dinky flatscreen or small colour CRT is acceptable in the scullery or a lightly-used corner of the kitchen. Otherwise, go for a black & white CRT stored on a dusty trolley - preferably rented on a contract that hasn't changed since the 1970s.\n\n(Both working & lower middle can consider building a dedicated cinema room of some sort if they're sufficiently wealthy. Anyone above that will make do with BFI membership or being a patron of their local arthouse cinema)"}, {"id": 50650572, "au": "bradknowles", "dom": 61, "sr": 16, "sc": 4.75, "ep": 4.9, "bs": 0.0, "d": 1, "age": 7.9, "grav": 61.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 37, "k": 2866, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.364, "fa": 0.42, "gp": 0.341, "bl": 0.0, "ds": 0.0, "txt": "The first paragraph says:\n\n> For the past couple of years, I’ve wanted to upgrade my home entertainment situation from the humble trappings of my long-sufficient 55-inch TCL smart TV to the model much coveted by cinephiles the world over: the OLED.\n\nIt’s a 55-inch TCL smart TV.  Doesn’t matter much what kind of LCD that is, because we know it’s not OLED.\n\nAnd if it’s TCL and a 55-inch, I think we can safely assume that it’s a 4k, since TCL is not a brand that is that old.\n\nI do agree that they need to do the screen size calculator things before they buy.  Not doing that is making a huge mistake.  Also a mistake to not do research into the different technologies, and seeing them in circumstances similar to what you would have at home.\n\nIf you’re buying at Sam’s Club, Costco, Target, or any other big box store, you’re almost certainly making a mistake.  You need to go to a more specialist store to be able to see them properly set up, in appropriate circumstances."}, {"id": 50653444, "au": "TeMPOraL", "dom": 35, "sr": 17, "sc": 4.6, "ep": 4.89, "bs": 0.0, "d": 3, "age": 0.49, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.755, "fa": 0.0, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "I bet the value is beyond limits of \"fundamental limitation\" for a... mean spherical monkey in viewing conditions that nobody encounters in real life, using hardware of quality never again achieved once the testing was concluded.\n\nThat's what I see always happening when someone optimizes for human perception. On paper and in isolation, it almost makes sense. But in practice, perceptual ranges are a wide distribution, and then everyone in the software and hardware chain value-optimizes everything hard, and this stacks up to make the supposedly imperceptible trick very perceptible to majority of consumers."}, {"id": 50647396, "au": "solids", "dom": 64, "sr": 18, "sc": 4.27, "ep": 4.49, "bs": 0.0, "d": 0, "age": 13.23, "grav": 134.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 246, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 0.787, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Few months ago I went from 55 to 75, the first day I thougt I made a terrible mistake, I didnt knew where too look. The feeling went away the day after and I love it now"}, {"id": 50652062, "au": "iqp", "dom": 85, "sr": 19, "sc": 4.23, "ep": 4.23, "bs": 0.0, "d": 0, "age": 3.92, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 62, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.119, "fa": 0.34, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "Honestly, I've held onto my 32\" dumb TV for like 8 years, and I'm glad I did. It has SCART for my consoles, 4 HDMI ports, and doesn't spy on me.\n\nAlso, having an 80\" TV means jack if you're just watching dumbed down crap on Netshits or whatever. The content matters more than the size of the screen."}, {"id": 50653240, "au": "MaulingMonkey", "dom": 52, "sr": 20, "sc": 4.03, "ep": 4.25, "bs": 0.0, "d": 0, "age": 1.0, "grav": 7.2, "surf": 19.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4363, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.236, "fa": 0.34, "gp": 0.258, "bl": 0.0, "ds": 0.0, "txt": "I scooped up a cheap previous generation 75\" for the living room (4k @ 60hz.)\n\nMy one complaint is entirely self inflicted: it's awkwardly bulky to move around on my own.  Using ratchet straps and other shenannigans I've been able to position it on the shelves I wanted, but I think going this big will be a once-off for me."}, {"id": 50647689, "au": "ChrisMarshallNY", "dom": 54, "sr": 21, "sc": 3.81, "ep": 4.25, "bs": 0.0, "d": 0, "age": 12.83, "grav": 128.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I watch a basic 4K 40-inch LG. It's fairly old, and works fine for me.\n\nHowever, I don't game on it, sit six feet away from it, and am kinda old.\n\nWFM. YMMV."}, {"id": 50647754, "au": "MBCook", "dom": 45, "sr": 22, "sc": 3.76, "ep": 3.91, "bs": 0.0, "d": 2, "age": 12.75, "grav": 127.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "The issue is the size of the picture in your visual field relative to everything else. Not the absolute size of the screen.\n\nAlso, movies have a specific limitation built in: 24 frames per second. If you try to whip the camera around, it’s not gonna look good at all. So directors usually don’t.\n\nSome TV shows are shot at higher frame rates, so they don’t have to worry about it as much. Plus, since most people are watching a smaller TV in their field of view than a movie, they’re safe to do more extreme movements of the camera.\n\nAnd we’ve seen movies make people sick. Shaky-cam stuff is notorious for it, as is “lost footage“ movies like Blair Witch."}, {"id": 50646559, "au": "globular-toast", "dom": 92, "sr": 23, "sc": 3.63, "ep": 3.85, "bs": 0.0, "d": 0, "age": 14.32, "grav": 152.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.135, "fa": 0.34, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "I had a projector with a 120\" screen and sat about the same distance as the author. No motion sickness, and I do suffer from it otherwise.\n\nOne thing I've noticed about TVs is they are far too bright, probably because normie rooms are full of ambient light. Decent projectors aren't that bright, so you have to turn the lights completely off. The other thing maybe is the refresh rate. I only really ran my projector at 24fps."}, {"id": 50646770, "au": "keroro", "dom": 70, "sr": 24, "sc": 3.21, "ep": 3.65, "bs": 0.0, "d": 0, "age": 14.1, "grav": 148.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 81, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 0.842, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "The reported headaches/nausea has got to be due to OLED PWM dimming (dimming via rapidly turning on and off the display)"}, {"id": 50646900, "au": "staticshock", "dom": 96, "sr": 25, "sc": 3.14, "ep": 3.58, "bs": 0.0, "d": 1, "age": 13.94, "grav": 146.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1156, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 0.096, "bl": 0.0, "ds": 0.0, "txt": "Their business model is to run ads. That's what keeps the lights on, and that's what pays their journalists. The popularity of ad-supported business models is downstream of human psychology: we chose not to pay, putting them between a rock and a hard place: find money elsewhere or close up shop. When you use the services of ad-supported businesses, you are not the customer, you are the product. \"Enshitification\" here is just a way of talking about the free lunch you thought you were entitled to."}, {"id": 50653142, "au": "empiricus", "dom": 53, "sr": 26, "sc": 2.87, "ep": 3.31, "bs": 0.0, "d": 0, "age": 1.23, "grav": 8.3, "surf": 17.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 377, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "The extreme of screen size is watching VR180 videos in VR headset. Any movement of the camera has the potential of creating nausea. But stationary shots are great, closest thing to reality capture. Moving forward without direction changes also works."}, {"id": 50652997, "au": "izacus", "dom": 23, "sr": 27, "sc": 2.83, "ep": 3.78, "bs": 0.0, "d": 1, "age": 1.56, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 54, "k": 28301, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 0.591, "fa": 0.76, "gp": 0.155, "bl": 0.0, "ds": 0.0, "txt": "> If you're looking for a large screen, I encourage you to try a UST projector [having ditched TVs myself back in 2019]. The image may not be as bright, but at night it is irrelevant, latest gen devices have > BT2020 color space, and it never gives you that headache-y feeling you get after watching TV for a while.\n\nSo... why would any of that be preferrable to my 77\" OLED with 144Hz VRR display and matte non-reflective coating which looks great both during the day and during the night?"}, {"id": 50647722, "au": "MBCook", "dom": 26, "sr": 28, "sc": 2.73, "ep": 2.88, "bs": 0.0, "d": 1, "age": 12.8, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 35845, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Size is a BIG issue, I’ve experienced it myself even on LCD.\n\nThe bigger the TV, the more of your field of view it fills, the less visual reference your brain has that matches your inner ear.\n\nIf you know you’re prone to motion sickness it’s obvious, or at least was to me. Bigger TVs (at the same distance) made it worse.\n\nI’m happy with my 48”. For the distance I sit it’s the upper limit of what I’d want."}, {"id": 50647369, "au": "rootusrootus", "dom": 38, "sr": 29, "sc": 2.69, "ep": 2.98, "bs": 0.0, "d": 1, "age": 13.26, "grav": 135.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 28119, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 1.163, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I would not dismiss it out of hand.  I get motion sickness for a couple days if I upgrade to a new larger smartphone.  Once I get used to it, no big deal, but it can be uncomfortable for a bit.\n\nI'm jealous of people who only occasionally feel motion sickness.  It is a regular, if unwelcome companion in my life."}, {"id": 50647319, "au": "zapzupnz", "dom": 86, "sr": 30, "sc": 2.58, "ep": 3.24, "bs": 0.0, "d": 0, "age": 13.34, "grav": 136.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 2667, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 0.668, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "If you skip to the conclusion of the article, you would think you've skipped past a review of a two year old television."}, {"id": 50646830, "au": "Aaargh20318", "dom": 41, "sr": 31, "sc": 2.51, "ep": 3.61, "bs": 0.0, "d": 1, "age": 14.03, "grav": 147.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 4932, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "I went from 65” to 77” and now 83” (all OLED). At my viewing distance of about 2.7 meters it just about reaches the THX recommended viewing angle of 36°. It’s pretty great, especially together with a 7.1.4 surround system. Never had any complaints about nausea. This is in a dedicated media room.\n\nI also have a 55” OLED in my living room for watching the news and other content that doesn’t benefit from the full home theater experience. It’s a perfect size for my living room as it doesn’t distract too much from the fireplace which is the focal point of that room.\n\nBefore I lived in a small apartment and had a 77” OLED in my living room and it never felt too big for that either.\n\nMy advice to people is usually to buy the biggest OLED they can afford. Unless you’re Elon Musk rich it will probably be too small. You can buy huge LCDs for very little but LCD is unwatchable in my opinion."}, {"id": 50647346, "au": "ljf", "dom": 9, "sr": 32, "sc": 2.43, "ep": 7.33, "bs": 3.58, "d": 1, "age": 13.3, "grav": 135.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 83, "qw": 0, "k": 7299, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": ["https://www.youtube.com/watch?v=kHB6bxxEZW8"], "ig": 1.516, "fa": 0.68, "gp": 1.261, "bl": 1.35, "ds": 0.0, "txt": "If anyone wants a good summary of UST options, check out https://www.youtube.com/watch?v=kHB6bxxEZW8\n\nI went for a far far cheaper set up than TechMoan - in all my projector (2nd hand) and 100 inch screen were less than £200, plus I added a chromecast ultra and a decent pc speakerset up.\n\nWe don't use the projector daily, but for weekend and occasional use it is great fun.\n\nI'd happily upgrade if we had the cash, but for now this is a lot of bang for our buck. A projector just makes a movie feel more fun to me."}, {"id": 50653158, "au": "busssard", "dom": 58, "sr": 33, "sc": 2.32, "ep": 2.98, "bs": 0.0, "d": 0, "age": 1.18, "grav": 8.0, "surf": 18.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 289, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 1.136, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "i am not a fan of having a big black reflective surface covering my wall when not using the media.\n\ni am a fan of projectors, its just a small box, and it has good resolution, if you want extra you mount a screen at the ceiling, you can unroll for better light values."}, {"id": 50647018, "au": "RajT88", "dom": 43, "sr": 34, "sc": 2.27, "ep": 2.71, "bs": 0.0, "d": 2, "age": 13.77, "grav": 143.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 8588, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 1.155, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We have a 77\" OLED.  Our living room is pretty big, but it's watchable with a big group of people.  A bigger OLED would be more watchable for big groups.\n\nWhen it's just us, we have a smaller couch we watch on which is closer, and we angle the screen towards it.\n\nThis is a TV that is bigger than any TV on the market when I was a kid.  It's insane to think about.  Big groups of people would watch smaller TV's from greater distances.\n\nUphill, both ways, in the snow!"}, {"id": 50653339, "au": "prmph", "dom": 49, "sr": 35, "sc": 2.17, "ep": 3.05, "bs": 0.0, "d": 0, "age": 0.74, "grav": 6.1, "surf": 23.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 4024, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 1.198, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "Honest question: Why do  most people need these huge screens in the first place?\n\nAt most 55-ish inches (at most 60inch) seems fine for most people, unless you have a huge living room. Anything larger becomes hard to even move around. I used a 40+ screen in my small apartment for many years and did not wish for anything bigger.\n\nOr is it simply a flex, and doing thing just because they can be done?"}, {"id": 50651842, "au": "toast0", "dom": 15, "sr": 36, "sc": 1.87, "ep": 3.2, "bs": 0.0, "d": 2, "age": 4.57, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 1.202, "fa": 0.0, "gp": 0.256, "bl": 0.0, "ds": 0.0, "txt": "TVs stop being cheap above a certain size. I've got a very nice projector with a stuck pixel in the middle of the frame, so I've been shopping for a replacement off and on.\n\nNot quite 100\" is surprisingly affordable (but today's prices are atypical), but beyond that isn't. Not a lot of people need 100\" or more, but I built a theater room around a 120\" screen, and it'd be sad to go smaller."}, {"id": 50647125, "au": "cherioo", "dom": 28, "sr": 37, "sc": 1.6, "ep": 3.0, "bs": 0.0, "d": 1, "age": 13.62, "grav": 140.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 702, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Large format display don’t really use slow refresh pwm dimming. That’s mostly a problem for small screen displays.\n\nThat said, the lg c4 has some brightness dip issue, but seems unlocked to be the cause here.\n\nYou can check rting reviews for more details in to flickering"}, {"id": 50651991, "au": "wewewedxfgdf", "dom": 84, "sr": 38, "sc": 1.56, "ep": 2.66, "bs": 0.0, "d": 0, "age": 4.13, "grav": 26.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 2579, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 0.437, "fa": 0.34, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "No.\n\nEven a 300 inch TV would not be enough.\n\nI will only be satisified with iMax in my lounge room."}, {"id": 50652972, "au": "buran77", "dom": 3, "sr": 39, "sc": 1.53, "ep": 2.92, "bs": 0.0, "d": 2, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 6923, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Isn't the FOV in this case the FOV of your eyesight, not the FOV of your game character (what's displayed on the screen)? If you sit 2m away from a 17\" screen, the screen will be a tiny portion of your FOV with the rest being the wall behind. If you sit an arm's length from a 100\" TV your FOV will cover a fraction of the screen and have to turn your head around just to see different parts of the screen.\n\nSo the size of the screen needs to be balanced with the distance you sit away from it. In this light there is no TV too big, just unsuited for the viewing distance."}, {"id": 50646572, "au": "leptons", "dom": 44, "sr": 40, "sc": 1.47, "ep": 2.13, "bs": 0.0, "d": 1, "age": 14.31, "grav": 152.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2165, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, the size hypothesis doesn't make sense as people have been flocking to movie theaters with bigger and bigger screens for 100+ years.\n\nI have a 65 inch and it's just fine. I'm considering an 85 inch. And I know for sure the only thing it's going to hurt is my bank account."}, {"id": 50652553, "au": "adrianmsmith", "dom": 24, "sr": 41, "sc": 1.36, "ep": 2.46, "bs": 0.0, "d": 0, "age": 2.54, "grav": 15.3, "surf": 164.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 3794, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 0.847, "fa": 0.0, "gp": 0.326, "bl": 0.0, "ds": 0.0, "txt": "If screen size were really a problem surely everyone would feel sick each time they went to the cinema, which isn't the case? So it seems likely it's something else other than screen size."}, {"id": 50653418, "au": "AlfeG", "dom": 50, "sr": 42, "sc": 1.16, "ep": 1.75, "bs": 0.0, "d": 1, "age": 0.56, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 332, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bigger_sickness", "flbl": "Bigger & Sickness (Motion)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "It's a matter of preference\nI do like to sit very close near my 65 inch TV. Like  1.5 meter. \nSo that Field of view is very close to the Cinema on the 3-6 rows.\nMy wife in the same time prefer to be in like 3-5 meters from TV."}, {"id": 50650751, "au": "ricardobeat", "dom": 18, "sr": 43, "sc": 1.13, "ep": 2.67, "bs": 0.0, "d": 2, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "cro ontent ? When playing FPS, i prefer smaller FOV since too large means too many things to keep track, but when playing open world games, i enjoy large FOV."}, {"id": 50653160, "au": "Grombobulous", "dom": 20, "sr": 47, "sc": 0.92, "ep": 2.47, "bs": 0.0, "d": 4, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What about the screen for the projector? Isn’t the paint on your wall less than ideal, especially if your walls have color in them?\n\nI’m legitimately curious at what the solution is without making the house look like it’s a middle school classroom with a projector screen."}, {"id": 50646690, "au": "morphle", "dom": 95, "sr": 48, "sc": 0.92, "ep": 2.17, "bs": 0.0, "d": 0, "age": 14.17, "grav": 149.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1065, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "living_room", "flbl": "Living & Room (Huge)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "An add blocker detector javascript removed the page content a second after it displayed. The slow march of enshittification, now they (the tech bros and their programmers in the US) do not want you to see web pages anymore?"}, {"id": 50653657, "au": "kakacik", "dom": 12, "sr": 49, "sc": 0.85, "ep": 2.17, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 30.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "resolution_previous", "flbl": "Resolution & Previous (Sitting)", "urls": [], "ig": 0.902, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "I don't get any headaches from TV, neither so I know a single person who ever mentioned that... Either you have some special condition that makes this happen for you or something NOK with your (previous) TV"}, {"id": 50647585, "au": "wccrawford", "dom": 65, "sr": 50, "sc": 0.72, "ep": 1.96, "bs": 0.0, "d": 1, "age": 12.99, "grav": 130.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 17647, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "screen_theater", "flbl": "Screen & Theater (Fov)", "urls": [], "ig": 0.835, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I talked my wife into a 75\" and she was very much against it, but after a while I asked how she liked it and she is happy with it...  And I'm the one that thinks it's too big.  :D\n\nI think we'd be just as happy with a 65\", and IMO it's easier to game on a 65\" because it's just too screen area to watch for most games.  We don't do much gaming in that room, though, so it's not a big deal."}, {"id": 50648594, "au": "para_parolu", "dom": 13, "sr": 51, "sc": 0.64, "ep": 3.37, "bs": 1.19, "d": 1, "age": 11.59, "grav": 109.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 592, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 0.618, "fa": 0.0, "gp": 1.324, "bl": 0.45, "ds": 0.0, "txt": "TVs become so cheap and good that there is not much insensitive to use projectors anymore unless space constraints."}, {"id": 50649366, "au": "sdeframond", "dom": 40, "sr": 52, "sc": 0.41, "ep": 1.95, "bs": 0.0, "d": 1, "age": 10.35, "grav": 92.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 978, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "projector_large", "flbl": "Projector & Large (Screen)", "urls": [], "ig": 0.783, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "I almost /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
