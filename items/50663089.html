al_commentary", "label": "General Commentary", "count": 46, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 34}, {"category": "code_repository", "count": 13}, {"category": "primary_technical_doc", "count": 4}, {"category": "github_artifact", "count": 1}, {"category": "doi_peer_reviewed", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["verifiable", "mainstream", "language", "formally", "software", "engineering", "projects", "engineers", "proof", "llms", "programming", "change", "achieve", "verify", "industry", "save", "project", "tools"], "largest_root": {"root_id": 50663245, "author": "hresvelgr", "slots": 65, "start_dom": 85, "end_dom": 149, "share_pct": 21.8, "top_dom1_age": 9.4, "top_dom1_author": "markhermeling"}, "buried_cutoff": 89, "rescue_top_k": 60, "ablations": [], "tournament": [], "comments": [{"id": 50664355, "au": "mirekrusin", "dom": 181, "sr": 1, "sc": 18.03, "ep": 18.03, "bs": 0.0, "d": 0, "age": 15.64, "grav": 175.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 231, "qw": 0, "k": 5756, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://www.moonbitlang.com", "https://github.com/mirek/mssqlite", "https://github.com/mirek/msduck"], "ig": 2.175, "fa": 3.86, "gp": 1.324, "bl": 0.0, "ds": 0.0, "txt": "Why not use/contribute to MoonBit [0]?\n\nIt already checks boxes listed in the article:\n\n- wasm(-gc) target\n\n- uses gc\n\n- rust type system, without borrow checker difficulties\n\n- formal verification\n\n- ...and has few more like fast compile times, which is a must/underappriciated in agentic development (see below) etc.\n\nAs an example I attempted to rewrite MSSQL 3 times:\n\n1. TS based on SQLite [1]\n\n2. Rust based on DuckDB [2]\n\n3. MoonBit [3]\n\nMoonBit version materialized more than order of magnitude faster compared to Rust version, tasks that were taking weeks in Rust took hours in MoonBit (!) – not only that, instead of using multiple build machines including maxed 128 GB RAM Ryzen box eating hundreds of gigabytes of SSD to support Rust worktrees / parallel compilation, MoonBit was run on MacMini M1 with 16GB RAM and limited disk space – still destroying Rust version in terms of development speed going more than 10x faster.\n\nFormal proofs is early stage support, you can see some of it here [4] if you're interested.\n\nIf you find it somehow interesting, feel free to have a look at bitSQL repo/website [3] (it's public domain like all my recent projects), especially the final artifact which is a marvel – ~30 MB (!) of hardened container image, drop it replacement for MSSQL container – tiny, performant (wins all benchmarks against MSSQL), passes 25k tests, low resource usage (MBs ins"}, {"id": 50663653, "au": "grohan", "dom": 213, "sr": 2, "sc": 14.23, "ep": 14.23, "bs": 0.0, "d": 0, "age": 17.3, "grav": 206.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 90, "qw": 0, "k": 43, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://dl.acm.org/doi/pdf/10.1145/379486.379512"], "ig": 1.677, "fa": 2.63, "gp": 1.93, "bl": 0.0, "ds": 0.0, "txt": "Formal verification is not a silver bullet! I am afraid AI has positioned it as the ultimate red herring (and nerd-snipe).\n\nI recommend reading Cantwell Smith's \"The Limits of Correctness\" https://dl.acm.org/doi/pdf/10.1145/379486.379512\n\nThe TL;DR is that proofs only show that the program matches a spec, not that the spec matches the world. The gap between \"what you can model\" and \"the real world\" is generally too large for formal methods to be useful (outside of narrow domains, where they are highly useful).\n\nIn other words, computing is closer to an empirical science than a formal one."}, {"id": 50669177, "au": "rramadass", "dom": 73, "sr": 3, "sc": 12.49, "ep": 12.49, "bs": 0.0, "d": 5, "age": 6.95, "grav": 51.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 75, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://news.ycombinator.com/item?id=48358691", "http://www.cs.princeton.edu/~dpw/papers/faultylogic_esop2010.pdf"], "ig": 1.837, "fa": 2.35, "gp": 1.018, "bl": 0.0, "ds": 0.0, "txt": "My previous comments already pointed to Meyer's \"Applying Design by Contract\" paper which shows how to integrate exception handling with DbC. Here it is directly - https://news.ycombinator.com/item?id=48358691\n\nBasically, you have to keep your module internals \"pure\", distinguish between domain exceptions (i.e. checked) vs. environmental runtime exceptions (i.e. unchecked) and push all \"impure\" operations to the boundary of the module.\n\nAlso see the following paper which shows how to formally model hardware faults;\n\nFaulty Logic: Reasoning about Fault Tolerant Programs - http://www.cs.princeton.edu/~dpw/papers/faultylogic_esop2010..."}, {"id": 50667463, "au": "medler", "dom": 233, "sr": 4, "sc": 12.38, "ep": 12.38, "bs": 0.0, "d": 1, "age": 9.54, "grav": 81.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 108, "qw": 0, "k": 2989, "kpp": 8.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": ["https://github.com/specular-org/Specular"], "ig": 1.686, "fa": 2.3, "gp": 1.284, "bl": 0.0, "ds": 0.0, "txt": "Yes, I have been using Specular (https://github.com/specular-org/Specular) and it has helped me find a zillion subtle bugs in my existing production codebase. The caveat is that even though formal methods are involved, I’m just finding bugs, not proving correctness.\n\nI see specular has been submitted to HN a few times but has gotten zero discussion, which is a shame. (For the record I am not affiliated with specular at all, not even as a contributor. Just a happy user).\n\nTFA opens by saying that LLMs are causing software quality to decline, but using Specular has convinced me the opposite is going to be true. If you use these tools properly your risk of shipping buggy code drops precipitously"}, {"id": 50663382, "au": "JacobAsmuth", "dom": 157, "sr": 5, "sc": 12.37, "ep": 12.37, "bs": 0.0, "d": 0, "age": 17.99, "grav": 219.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 83, "qw": 0, "k": 289, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://github.com/JacobAsmuth/qed"], "ig": 1.798, "fa": 2.08, "gp": 1.528, "bl": 0.0, "ds": 0.0, "txt": "Sounds like you'd be interested in Qed! The web framework I'm building which compiles lean to native js for the frontend and rust for backend, using prorobuf for communication between the two.\n\nI reimplemented the entirety of the css grammar and fully verified the data model, hydration/dehydration pipeline, and can even formally prove accessibility properties at compile time (e.g. contrast > 4.5).\n\nI'm currently working on reimplementing the full sql grammar to allow you to formally verify your queries (and even row level security policies!) at compile time.\n\nhttps://github.com/JacobAsmuth/qed"}, {"id": 50664137, "au": "kbr-", "dom": 220, "sr": 6, "sc": 11.91, "ep": 11.91, "bs": 0.0, "d": 0, "age": 16.13, "grav": 184.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 72, "qw": 0, "k": 180, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://github.com/kbr-/elenxis"], "ig": 1.33, "fa": 2.42, "gp": 1.302, "bl": 0.0, "ds": 0.0, "txt": "For the barrier between natural and formal language, see Elenxis.\nhttps://github.com/kbr-/elenxis\n\nIt still plugs in LLM as a module, and LLM can be misaligned, so there is no guarantee that the spec will be 100% reflecting the user's intent. (I do know how to solve this, and I will in the future.)\n\nBut even right now in practice, with Opus 5.5 or GPT 6.2 Sol (medium reasoning both) it works fantastic. I use daily at $dayjob and in personal projects."}, {"id": 50670372, "au": "logicchains", "dom": 97, "sr": 7, "sc": 11.48, "ep": 11.48, "bs": 0.0, "d": 4, "age": 5.28, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 54, "qw": 0, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": ["https://xnning.github.io/papers/perceus.pdf"], "ig": 1.377, "fa": 2.35, "gp": 1.064, "bl": 0.0, "ds": 0.0, "txt": "To support in-place mutation and avoid unnecessary memory allocation, it would need some form of linear/uniqueness types, so the language can know when no other references to a type exist so it can be updated in place via mutation. Right now Lean achieves decent performance via https://xnning.github.io/papers/perceus.pdf , but it can't match what Rust can achieve."}, {"id": 50665228, "au": "thomasahle", "dom": 150, "sr": 8, "sc": 11.16, "ep": 11.16, "bs": 0.0, "d": 0, "age": 13.73, "grav": 142.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 66, "qw": 0, "k": 7006, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://github.com/thomasnormal/proglib"], "ig": 1.299, "fa": 2.08, "gp": 1.5, "bl": 0.0, "ds": 0.0, "txt": "Rather than migrating all code to some new program language, I've been building ProgLib: https://github.com/thomasnormal/proglib which is like \"MathLib for Programming\".\n\nIt allows you to import code from any programming language (So far, Python, C++, Rust, and SystemVerilog are partially supported,) and prove stuff about it in Lean.\n\nYou don't need a \"verifiable programming language\". All you need is formalized semantics for the programming language you are already using."}, {"id": 50664182, "au": "kbr-", "dom": 112, "sr": 9, "sc": 10.99, "ep": 11.14, "bs": 0.0, "d": 2, "age": 16.0, "grav": 181.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 147, "qw": 0, "k": 180, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://github.com/kbr-/elenxis"], "ig": 1.729, "fa": 2.08, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "This is exactly what I do in $dayjob. I call it Property Driven Development.\n\nI start with prose requirements, then use Elenxis (https://github.com/kbr-/elenxis) to translate into formal Lean model.\n\nThen I state signatures and conjectures that the spec must have. Properties that the future implementation must hold. No implementation yet.\n\nOnly once all conjectures are there, we are ready to roll.\n\nIf I write in Lean, I can now fill in the signatures' implementations. Then prove theorems. Proof doesn't go through => bug. Fix, retry, repeat.\n\nIf I write in an inferior language, there is extra Intermediate step: translating the conjectures into property test in the language. Only once these are ready, I can write implementation.\n\nYou must not write implementation before having all conjectures stated -- otherwise the implementation will bias your thinking, and you will try to prove properties of your implementation instead of what you needed.\n\nAll of the above applies equally to AI agents."}, {"id": 50667573, "au": "drutaTushar", "dom": 70, "sr": 10, "sc": 10.47, "ep": 10.62, "bs": 0.0, "d": 4, "age": 9.37, "grav": 79.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 42, "qw": 0, "k": -3, "kpp": -1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://github.com/statelyai/xstate"], "ig": 1.427, "fa": 2.08, "gp": 0.921, "bl": 0.0, "ds": 0.0, "txt": "It can definitely help if scope/runtime is limited. I myself have played with something similar : https://github.com/statelyai/xstate Modelling entire interaction as state machine so program always remains/lands in known states. IMO FSMs probably better suited as it has error modelling and handling inbuilt."}, {"id": 50663494, "au": "hedonhermdev", "dom": 153, "sr": 11, "sc": 10.39, "ep": 10.61, "bs": 0.0, "d": 0, "age": 17.68, "grav": 213.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 18, "qw": 0, "k": 4, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://github.com/verus-lang/verus", "https://mars-research.github.io/doc/2023-kisv-atmo.pdf"], "ig": 0.731, "fa": 2.35, "gp": 1.516, "bl": 0.0, "ds": 0.0, "txt": "https://github.com/verus-lang/verus\n\nThe lab I worked with for my thesis used Verus for our formally verified Operating System written in Rust. https://mars-research.github.io/doc/2023-kisv-atmo.pdf"}, {"id": 50667929, "au": "j0h064", "dom": 210, "sr": 12, "sc": 10.04, "ep": 10.04, "bs": 0.0, "d": 0, "age": 8.87, "grav": 73.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 27, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": ["https://github.com/jfhg/c2lean"], "ig": 1.138, "fa": 2.08, "gp": 0.99, "bl": 0.0, "ds": 0.0, "txt": "I'm experimenting with LLVM IR to Lean conversion and checking propositions on C-code based on that in https://github.com/jfhg/c2lean.\nIt shows the possibilities but mostly limitations of such an approach."}, {"id": 50671056, "au": "kbr-", "dom": 120, "sr": 13, "sc": 10.02, "ep": 10.54, "bs": 0.0, "d": 9, "age": 4.11, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 227, "qw": 0, "k": 180, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://news.ycombinator.com/item?id=50659297"], "ig": 1.859, "fa": 1.58, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Nice find. I like it. I'm doing something similar for myself right now, actually. A compiled formal DSL for reasoning and so on (I call it \"Cognitive Calculus\" and I even have a compiler...)\n\nThey still use a language model to propose ideas though, and I have a particularly strong opinion on language models (or, as I like calling them since 2 days ago -- \"well-formatted shit predictors\"): https://news.ycombinator.com/item?id=50659297\n\nAlso, they are a business, so they'll probably want to sell you this stuff. I want to give it away for free (just give me a month).\n\nThey also have this footnote at the end:\n```\nOf course, the question of what constitutes a “mistake” is highly context-sensitive. It is perhaps more accurate to say that it is mathematically impossible for Lanyon ever to commit a misformalization. Every implementation will always match the specification, and every proof will always match the implementation, 100% of the time. In this sense, Lanyon guarantees perfect syntactic correctness. The issue of semantic correctness (i.e. how to guarantee that the formal specification actually matches the user’s natural language intent) remains an open area of research for us, spanning psychology, linguistics, philosophy, and agent harness development. We hope to have more to say about this soon.\n```\n\nfor that, see Elenxis. Although Elenxis is still using a LLM as a module, and "}, {"id": 50672376, "au": "antonvs", "dom": 212, "sr": 14, "sc": 9.02, "ep": 9.02, "bs": 0.0, "d": 1, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 179, "qw": 0, "k": 4669, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": ["https://privatebin.net/?e19355429d608268\u00236vnv5LgavBnpM8NEfk7L2pBLzyfQ9CVjAHTUkj2kMo57"], "ig": 1.856, "fa": 1.3, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "You can quite easily implement static proofs for cases like the example in your second paragraph, using any language with a good enough type system.\n\nI vibe-coded a quick demo for that example (as I understand it), using Haskell because it makes such types easy and concise to prototype. Here it is: https://privatebin.net/?e19355429d608268\u00236vnv5LgavBnpM8NEfk7... (link will expire in a couple of days.)\n\nThis uses phantom types (type parameters that aren't associated with values) like `Human` and `Agent`, as well as using GADTs, but that just makes for a clean/concise example - neither of those features are essential for something like this. You could implement it in say, Go or Java, it would just be a little noisier.\n\nIt really isn't necessary to jump to Lean, and all the extra work that that entails  (including linking to the actual code), to statically enforce such properties.\n\nThis is an example of what Yaron Misky described around 2010 as \"make illegal states unrepresentable\", or really even what Robin Milner described in 1978 as \"well-typed programs don't go wrong\", although the latter assumes that \"well-typed\" means that the program's types match its specified constraints."}, {"id": 50663245, "au": "hresvelgr", "dom": 85, "sr": 15, "sc": 8.27, "ep": 8.71, "bs": 0.0, "d": 0, "age": 18.38, "grav": 227.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 147, "qw": 0, "k": 1067, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": ["https://jepsen.io/analyses/particledb-1.1.4"], "ig": 1.613, "fa": 0.62, "gp": 2.178, "bl": 0.0, "ds": 0.0, "txt": "\"Beware of bugs in the above code; I have only proved it correct, not tried it.\" — Donald Knuth\n\nFormal correctness does not guarantee desired function. People have written TLA+ specs for their software[1] and not have it materially improve the quality or reliability. You cannot just throw formal verification at a problem.\n\nI am very much of the opinion that crap code is an issue of organisation and aesthetics, and that can be automated. This is something that is enforced by frameworks, and despite the popular consensus that LLMs are good at frameworks because of training data, I make another argument that LLMs are good at them because frameworks massively restrict the possibility space of code that can exist and enforce a consistent organisation and aesthetic. The solution as I see it is to make more restrictive frameworks that have a higher chance of producing desired functionality, then afterward we can worry about correctness.\n\n[1] https://jepsen.io/analyses/particledb-1.1.4"}, {"id": 50664199, "au": "jb_briant", "dom": 162, "sr": 16, "sc": 8.23, "ep": 8.67, "bs": 0.0, "d": 0, "age": 15.95, "grav": 180.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 149, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.722, "fa": 0.95, "gp": 1.321, "bl": 0.0, "ds": 0.0, "txt": "Formal correctness is mostly useless for mainstream software.\nModels are strong enough that their bottom 10% of code is acceptable garbage, like in any human codebase.\nTop 10% is excellent.\n\nFrom my experience on vibed complex algorithms (like voxel terrain generation within 200km radius at sub second generation), formal software was usefull, if not necessary, prior to opus 5.5\n\nNow it's plain useless unless you need an absolute guarantee of correctness. But that's niche, not mainstream.\n\nSo we don't need a mainstream programming language, we already have good options that are sufficient."}, {"id": 50666148, "au": "rramadass", "dom": 49, "sr": 17, "sc": 7.94, "ep": 8.23, "bs": 0.0, "d": 5, "age": 11.69, "grav": 111.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 105, "qw": 40, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": ["https://news.ycombinator.com/item?id=50319347"], "ig": 1.695, "fa": 1.04, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "> LLMs are valuable to me not because they can replace the types of coding these devs do, but because they have a far more deeper 'understanding' of the foundational math and algebra than could ever be expected of the average dev\n\nThis is the correct way to look at using LLMs for coding using their \"jagged intelligence\". The key here is that the developer has to know enough of the formal methods mathematics to guide the LLM within proper guardrails such that it cuts down on the non-determinism. You don't have to be a master mathematician who knows every single detail but just have enough conceptual understanding of the domain that you can create modular components and link them together using pre/post/invariants/assertions and type-driven design. You keep overall control while leaving the drudgery to the LLM.\n\nHere is one process methodology that i wrote up - https://news.ycombinator.com/item?id=50319347"}, {"id": 50663784, "au": "spankalee", "dom": 6, "sr": 18, "sc": 7.78, "ep": 8.44, "bs": 0.0, "d": 0, "age": 16.99, "grav": 200.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 166, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://zena-lang.dev/", "https://zena-lang.dev/blog/2026/09/languages-for-the-ai-era/"], "ig": 2.051, "fa": 0.62, "gp": 1.28, "bl": 0.0, "ds": 0.0, "txt": "Wow, I feel like Blaine is describe a language a lot like the one I'm working on now, Zena: https://zena-lang.dev/\n\nI started Zena from wanting a TypeScript-like syntax that compiled to very efficient WebAssembly GC, and AssemblyScript had issues...\n\nThe motivation for targeting Wasm was as a good sandboxing and orchestration unit for AI-generated code. So, out of both general PL curiosity and enthusiasm, and an attempt to make a language that's good for AI generation, I started adding what I thought were the best features from other languages with a lot of focus on correctness, structure, and optimizability: pattern matching with exhaustiveness checking, ADTs and sum types via sealed classes, value types, async cancelation / structured concurrency, ownership and borrow checking for resources, unicode safe strings, and recently I added  runtime contracts and I'll start on refinement types and some kind of proof system soon.\n\nThe idea is exactly to take a mainstream and familiar-looking language and add more cutting-edge and academic features that help with software correctness.\n\nI wrote about some of this here, though not the formal methods parts: https://zena-lang.dev/blog/2026/09/languages-for-the-ai-era/"}, {"id": 50670708, "au": "spankalee", "dom": 10, "sr": 19, "sc": 7.34, "ep": 7.49, "bs": 0.0, "d": 2, "age": 4.74, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 201, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": ["https://www.wingolog.org/archives/2025/10/30/wastrel-a-profligate-implementation-of-webassembly"], "ig": 2.007, "fa": 0.62, "gp": 0.693, "bl": 0.0, "ds": 0.0, "txt": "It only supports Wasm for now. There are Wasm-to-native compilers, like Wastrel [1], which is my preferred approach to supporting native, but I haven't tried it yet. I don't think it would be too difficult these days to plug into LLVM either, but that greatly complicates the toolchain. Right now the compiler and every related tool runs as Wasm.\n\nWebAssembly is pretty core to my main goals with Zena though: being able to run plugins, generated code, on-demand loaded apps, and other untrusted code is the whole reason why I use Wasm, and wanting a great language for Wasm is the whole reason I'm making Zena. Compiling to native would leave a lot of that out.\n\nThere's no multi-threading or any parallelism yet. Wasm GC doesn't support threads yet, and that's a while out if it ever lands, so we'll need some kind of worker/actor system. I don't just want to copy JS workers though, since those are so difficult to use. I'm much more interested in the type system encoding whether data is parallel-safe so I've been working on ownership/borrowing, value types, and immutable types to hopefully come together to form a one-writer / multi-reader, or shared immutable data, worker API, enforced by the type and borrow checker.\n\n[1]: https://www.wingolog.org/archives/2025/10/30/wastrel-a-profl..."}, {"id": 50663944, "au": "Nursie", "dom": 285, "sr": 20, "sc": 7.34, "ep": 8.22, "bs": 0.0, "d": 0, "age": 16.55, "grav": 191.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 44, "k": 19142, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.633, "fa": 1.04, "gp": 0.975, "bl": 0.0, "ds": 0.0, "txt": "> The only way forward is to fully embrace formal verification, all the way down to the foundations ... But that's easier said than done. Existing formal verification tools suffer from massive usability and understandability problems, and have failed to make any kind of noticeable impact ...\n\nThis is sort of a counterpart to my own opinion of formal verification, since first learning about it 30 years ago.\n\nFirstly, if there's no direct link between the written code (or perhaps even the program code post-compilation) and the verification algebra, what are you really verifying?\nAnd secondly if we can 'get by' without it very well for the most part, then justifying the extra effort is very hard.\n\nAnd I would argue in contrast to the author that we have achieved a hell of a lot without using it particularly widely. Much like that late-90s obsession, the semantic web, it illustrates a major disconnect between assumptions in the halls of academia about how the world should work, and real world industry practice.\n\nSo if there is value in formal verification then the author is right, if must be applicable directly to the program code under verification, and I would argue it must be low friction if it's going to get adoption. And I think LLMs can probably help us deliver that last part."}, {"id": 50666317, "au": "ordu", "dom": 145, "sr": 21, "sc": 7.26, "ep": 7.92, "bs": 0.0, "d": 1, "age": 11.39, "grav": 106.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 18, "k": 3285, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.747, "fa": 0.92, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "> People have written TLA+ specs for their software[1] and not have it materially improve the quality or reliability.\n\nThey have said they wrote them, but I doubt it. The quote from the report:\n\n\"We found several incompatibilities or bugs involving static or dynamic type safety, or behaviors that would normally have been caught by static analysis of a query, such as referring to a nonexistent column. These issues occurred with a single server, single client, and no faults.\n\nThey failed to catch references to a nonexistent column with a formal proof? I doubt it, the more likely explanation they hadn't proven their code, they probably did something that allowed them to claim that they wrote TLA+ specs, and stopped at that.\n\nFormal proof is a static analysis on steroids, if it can't catch bugs that can be caught by a static analysis then what the point of it?\n\nThe report doesn't answer how it happened (I presume) because of: \"during our collaboration no TLA+ specification was available. It is unclear what properties might be proven, or whether they described ParticleDB as built."}, {"id": 50666297, "au": "rramadass", "dom": 71, "sr": 22, "sc": 7.14, "ep": 7.58, "bs": 0.0, "d": 3, "age": 11.43, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 79, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": ["https://news.ycombinator.com/item?id=50664740"], "ig": 1.68, "fa": 0.9, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "That is the wrong way to think about Formal Methods/Specification/Verification.\n\nVerification is not about \"happy path logic\" but all computation paths (happy, error, cross-layer etc.) over the entire state space of a \"system\".\n\nThe system can include everything from hardware circuits all the way to distributed applications if needed. Across layers/components it works by composition of contracts where a higher-layer guarantees based on its lower layer's contract guarantees. The book i listed gives examples.\n\nSee also my comment here - https://news.ycombinator.com/item?id=50664740"}, {"id": 50664740, "au": "rramadass", "dom": 122, "sr": 23, "sc": 7.06, "ep": 7.5, "bs": 0.0, "d": 4, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 210, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": ["https://news.ycombinator.com/item?id=50478624", "https://news.ycombinator.com/item?id=50108540", "https://news.ycombinator.com/item?id=50108206"], "ig": 1.851, "fa": 0.62, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "You might find some of my previous comments useful.\n\nOn Formal Methods Thinking/Levels and (In)Formal Methods - https://news.ycombinator.com/item?id=50478624\n\nOn Design By Contract (DbC) - https://news.ycombinator.com/item?id=50108540\n\nOn Combining Tests and Proofs with Contracts - https://news.ycombinator.com/item?id=50108206\n\nOn Correctness-by-Construction - https://news.ycombinator.com/item?id=49613696\n\nNote that the above is based on using classical logic predicates to \"steer\" the program through its \"state space\". This is the more fundamental and \"simpler\" approach since it uses only First-Order Logic.\n\nAnother way is to use the Type System (constructive logic, dependent types in Lean4 etc.) to embed the above directly into the program types. This is harder since you need Typed Lambda Calculus, Higher-Order Logic and need to think quite differently. For this you can read Types and Programming Languages by Benjamin Pierce and/or any number of lambda calculus books. The Curry-Howard Correspondence helps you understand this if you have some idea of the above state space approach.\n\nFinally, if you want to know/study the whole of above you need to read Understanding Formal Methods by Jean-Francois Monin - https://news.ycombinator.com/item?id=50506655\n\nIt is all overwhelming at first if you are completely new to it so use it as a roadmap. Survey all of the above to get a grip on"}, {"id": 50666697, "au": "sarreph", "dom": 205, "sr": 24, "sc": 6.98, "ep": 6.98, "bs": 0.0, "d": 0, "age": 10.72, "grav": 97.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 84, "qw": 0, "k": 4473, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": ["https://pud.dev"], "ig": 1.461, "fa": 0.62, "gp": 1.229, "bl": 0.0, "ds": 0.0, "txt": "I think this is too long of a game (a new language). Unless something changes considerably about the way LLMs code I think we need to come up with a solution that is compatible with the existing languages. There is just too much infrastructure and training data supporting the status quo.\n\nThat’s what I’m betting on anyway. I’m building a tool to write proofs for TypeScript in Lean (instead of or alongside tests) with familiar syntax. It’s called Pud (https://pud.dev). Very keen to see what others come up with in this space though!"}, {"id": 50666490, "au": "Buttons840", "dom": 23, "sr": 25, "sc": 6.92, "ep": 7.36, "bs": 0.0, "d": 0, "age": 11.06, "grav": 102.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 163, "qw": 0, "k": 14921, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://blainehansen.me/post/flow-effects/"], "ig": 1.812, "fa": 0.62, "gp": 0.92, "bl": 0.0, "ds": 0.0, "txt": "The author has another blog post about Flow Effects[0]. They propose an open-ended set of effects you could attach to functions, and then verify, at compile time, that certain functions either do or do not invoke certain effects.\n\nSo if I had some functions like:\n\n    foo_1 (must NOT access the HDD)\n    foo_2\n    foo_3\n    foo_4 (does access the HDD)\n\nOnly 2 of them are annotated with effects related to HDD access, but we can verify at compile time that foo_1 does NOT invoke foo_4, either directly or indirectly (we can verify this recursively).\n\nPerhaps foo_3 calls foo_4, but we forgot to annotate foo_3 with the proper effect. No matter, because foo_3 would automatically inherit the effects of foo_4 by virtue of calling it.\n\nThis is just one of the feature the blog advocates for, and I think this feature alone would be quite simple and helpful in wrangling LLM code.\n\nA nice thing about this is that it's optional. You can annotate the effects gradually into existing systems.\n\n[0]: https://blainehansen.me/post/flow-effects/"}, {"id": 50667529, "au": "jwilliams", "dom": 110, "sr": 26, "sc": 6.78, "ep": 7.22, "bs": 0.0, "d": 6, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 15, "k": 5725, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": ["https://jonathannen.com/views-of-the-same-thing/"], "ig": 1.134, "fa": 1.04, "gp": 1.096, "bl": 0.0, "ds": 0.0, "txt": "> LLMs don't care and can just as easily keep track of them as separate concerns.\n\nI agree. In fact I'd argue adding more representations (esp generative ones) just increase the chance of drift[^1].\n\nWhere types are useful is cross-cutting concerns. That is, interfaces between components/systems/whatever. I suspect the size of that boundary will grow with the capability of AI though.\n\n1: https://jonathannen.com/views-of-the-same-thing/"}, {"id": 50664408, "au": "latentsea", "dom": 134, "sr": 27, "sc": 6.77, "ep": 7.66, "bs": 0.0, "d": 4, "age": 15.55, "grav": 173.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.516, "fa": 0.95, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "Personally, I think the slop is very dangerous to a codebase both when humans produce (and they do!!!) and when AI produces it because the uncontrolled growth of entropy in a codebase has this funny way of just completely trashing your ability to get anything done in it. Like, now there's two ways to do the same thing, so.. which one do you pick? Pick at random, now there's 30% this way and 70% that way, so probably the 70% one will get picked, but there's this non-zero chance that now a third way is invented! When you think about next-token prediction, it's so heavily conditioned on the context, that crappy context equals crappy results, and uncontrolled growth of entropy results in crappy context.\n\nTL;DR it impacts the trajectory of the LLM negatively in a massive way IMHO."}, {"id": 50666363, "au": "kbr-", "dom": 128, "sr": 28, "sc": 6.68, "ep": 7.78, "bs": 0.0, "d": 4, "age": 11.29, "grav": 105.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 180, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 2.015, "fa": 0.56, "gp": 0.998, "bl": 0.0, "ds": 0.0, "txt": "Define \"normal test\".\n\nProperty test can state general properties about the signature being tested. E.g. let's say you're proving correctness of addition in an abelian group. You can state Associativity, Commutativity, Identity Element (0), Additive Inverse, Closure, Cancellation Property, as properties of the signature, in the Property Testing framework you're using (Haskell: QuickCheck, Python: Hypothesis, and so on). The framework will generate test cases using a specially-crafted random distribution (one crafted to maximize the chance of catching a bug), then if it finds a failing case, it will shrink it, so your counterexample is minimal.\n\nIt is a \"normal test\" except that you use a powerful framework to give you these mechanisms.\n\nIt still depends on randomness, so it's still inferior to a theorem, which gives you 100% correctness."}, {"id": 50668245, "au": "alexey-salmin", "dom": 33, "sr": 29, "sc": 6.62, "ep": 8.16, "bs": 0.0, "d": 3, "age": 8.36, "grav": 67.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 88, "qw": 0, "k": 2757, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://www.galois.com/articles/formal-methods-krack-vulnerability"], "ig": 1.67, "fa": 1.12, "gp": 0.72, "bl": 0.0, "ds": 0.0, "txt": "Depends on the goal. If you just want software to be generally safer, with less bugs and higher quality then this is sufficient, yes.\n\nIf you want actual guarantees that e.g. money won't disappear from your account some day or your messages won't be read by a third-party, then formal verification alone doesn't grant that.\n\nConsider that Wifi WPA2 encryption was formally verified and yet broken. In simple terms the bug was in the protocol specification [1]. The \"code is the law\" crypto folks have even more fun stories to share.\n\n[1] https://www.galois.com/articles/formal-methods-krack-vulnera..."}, {"id": 50663680, "au": "Qasaur", "dom": 248, "sr": 30, "sc": 6.42, "ep": 7.52, "bs": 0.0, "d": 0, "age": 17.25, "grav": 205.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 559, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.86, "fa": 0.28, "gp": 1.619, "bl": 0.0, "ds": 0.0, "txt": "The author’s proposal reminds me of the JavaScript framework craze. Industrial-scale formal verification does not require a new language unless your program involves exotic types and/or logic not supported by any of the mainstream languages. There is still lots of work to be done, of course, but projects like Rust’s Verus and Aeneas already provide a clean and modular interface to plug in a formal methods layer, like Lean, without needing to reinvent the wheel.\n\nSeamless formal verification requires a native formal specification to verify against. In my view, focusing work on formally modelling existing languages (like Rust), or if intractable at least a fragment with Cartesian closed semantics, is far more encouraging to mainstream adoption of formal methods than trying to convince the industry to adopt a new language."}, {"id": 50672141, "au": "socketcluster", "dom": 160, "sr": 31, "sc": 6.35, "ep": 6.35, "bs": 0.0, "d": 0, "age": 2.07, "grav": 12.5, "surf": 16.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 229, "qw": 0, "k": 760, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 2.012, "fa": 0.28, "gp": 0.565, "bl": 0.0, "ds": 0.0, "txt": "We need secure, stable, modular components and platforms but I don't see how formal verification will help with this.\n\nThe problem with formal verification is that it only lets you validate the solution against the spec, but it doesn't do anything in terms of validating the spec against reality. The spec can have a lot of conflicts. Also, as the complexity of the code grows, the contradictions and conflicts in the spec increase.\n\nA few weeks ago, Claude wrote me a short formal proof which proved that formal proofs cannot guarantee protection from software bugs or vulnerabilities in most realistic settings; especially when software requirements change too frequently. It made some assumptions about non-salvageability which I didn't ask for a proof for but it gave me some anecdotes from formally verified projects like SeL4 where letters from collaborators hinted that small changes to the code would sometimes require rewriting large parts of the proof.\n\nUnfortunately, we can't stop software from changing until we've developed platforms which provide optimal modularity.\n\nOptimally modular software has the property that code in dependencies (the leaves) has to be modified less frequently and less substantially than code of the dependents (the branches and trunk) in response to requirements changes. A useful measure may be the ratio of code changes dependent_code_delta/dependency_code"}, {"id": 50663661, "au": "aenis", "dom": 28, "sr": 32, "sc": 6.33, "ep": 7.0, "bs": 0.0, "d": 0, "age": 17.29, "grav": 205.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 1537, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.571, "fa": 0.34, "gp": 1.61, "bl": 0.0, "ds": 0.0, "txt": "30 years ago, my then boss, a PhD in industrial automation theory, told me formal verification of even simple systems is impossible due to the practically infinite number of states systems can occupy. I have been thinking about this a lot over the years, and I still think this is the case, even more so than before with the bloat that introduces insanely fuzzy edges to any state graph. I wonder if there is really any chance of this becoming a viable concept for systems more complex than a tic-tac-toe game."}, {"id": 50663727, "au": "ChicagoDave", "dom": 226, "sr": 33, "sc": 6.33, "ep": 6.99, "bs": 0.0, "d": 0, "age": 17.12, "grav": 202.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 2819, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.988, "fa": 0.0, "gp": 1.6, "bl": 0.0, "ds": 0.0, "txt": "Again the OP makes the provably incorrect assumption that the current state of code generation and validation cannot meet quality standards.\n\nI’ve been doing it with a custom engineering harness on top of Claude Code for a year.\n\nI certainly see the desire for a validation framework in code generation, but until we invent that and migrate the entire world to it, let’s focus on discipline.\n\nThe reality the OP sees isn’t wrong. Most of what I see publicly is trash. Undisciplined vibe coders are in a death spiral of agentic madness.\n\nBut if you bring discipline to software construction, you can extract high-quality results.\n\nWe still need requirements. We still need invariants. We still need wireframes. We still need user experience design.\n\nThen we reach into history and bring back Functional Design Specifications.\n\nAdd TDD, DDD, behavior testing, mutation verification. And finally people need to use it for the final validation.\n\nNow you have a disciplined approach that works today."}, {"id": 50663627, "au": "FullGarden_S", "dom": 167, "sr": 34, "sc": 6.07, "ep": 7.17, "bs": 0.0, "d": 0, "age": 17.37, "grav": 207.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 223, "qw": 0, "k": 43, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.914, "fa": 0.28, "gp": 1.29, "bl": 0.0, "ds": 0.0, "txt": "We do not need a full-on theorem prover for achieving this.\n\nSomething like ZFC axioms is good enough. External formal verification tools are not ideal either. Its better if the type system of the host language's got these essentials included, like having a model checker for its abstract machine or something. However, model checker for enforcing correctness(especially of the intent) will be much harder to implement in languages without a well defined, stable ABI and type system, which typically is the case with almost all mainstream languages. Even though operational semantics is the semantics of the hardware, most languages do not strictly adhere to it due to a lot of practical reasons.\n\nMainstream languages that become practical enough to be used by masses will usually be in a spot where it becomes very hard to formally define the language and when that happens, enforcing \"correctness\" becomes close to impossible. Stuff like this needs to be addressed since the start.\n\nSelling to the entire industry the idea that \"memory safety\" is the only thing essential security requirement, while all else is a low priority, simply means that anyone who bought that ad either had surplus resources or was operating with inadequate requirements to justify doing so. Computer programming is about deductive reasoning of the programs and that means its much more than just writing code and handlin"}, {"id": 50666230, "au": "viraptor", "dom": 69, "sr": 35, "sc": 6.06, "ep": 6.95, "bs": 0.0, "d": 3, "age": 11.52, "grav": 108.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 16, "k": 48206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.954, "fa": 0.42, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "> Think of different hardware, software, time, timezone, os/drivers/shell/vm/container/language runtime versions etc.\n\nThe original comment was about industrial automation and in that environment a lot of those issues are not that relevant. Unless we're talking really big systems, a lot of it is very well specified controllers which run without shell/VM/container/runtime. They just talk to some fancy general GUI on a different chip/board to load the data/config. But the state space of a lot of actual practical hardware doing the work is not that complex. Bare metal, careful io timing, state transitions and some control loops gets you very very far.\n\nTo be clear, there are bigger, complicated systems, but simpler devices with a clock, PID loop and I2C outnumber them by likely a few orders of magnitude - we can start there."}, {"id": 50666996, "au": "lou1306", "dom": 75, "sr": 36, "sc": 5.93, "ep": 7.47, "bs": 0.0, "d": 1, "age": 10.23, "grav": 90.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 2415, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.964, "fa": 0.68, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "A lot has changed in 30 years. Symbolic model checking was just in its academic infancy (early '90s), and abstraction techniques, especially counterexample-guided abstraction refinement (CEGAR, early '00s) were significant breakthrough.  All these ideas converged into e.g., SLAM which is what Microsoft pushed for Windows driver verification, which I believe should fit your \"more complex than a tic-tac-toe game\" goalpost.\n\nAnd this was 25 years ago! We now have advanced formal techniques for inductive reasoning like IC3 that run on top of SMT solvers, enabling verification of (some) bona-fide infinite state systems. Of course the problem itself is undecidable in the general case, but in practice these tools do get the job done. We have formally verified OS kernels, Lean kernels, SAT solvers out there :)"}, {"id": 50664407, "au": "pjmlp", "dom": 184, "sr": 37, "sc": 5.7, "ep": 6.58, "bs": 0.0, "d": 1, "age": 15.56, "grav": 173.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 8, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.14, "fa": 1.1, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": ">  wondering why it has to be so unreadable\n\nPeople pushing it beyond what it was originally designed for in C++98.\n\nMost of the template meta-programming tricks are hardly needed since C++20, and improved yet again in C++23, with C++26 static reflection making them completly not worthwhile pursuing, assuming they sort out the whole ratification drama."}, {"id": 50671025, "au": "Animats", "dom": 76, "sr": 38, "sc": 5.52, "ep": 6.62, "bs": 0.0, "d": 0, "age": 4.16, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 220, "qw": 0, "k": 168316, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.885, "fa": 0.28, "gp": 0.959, "bl": 0.0, "ds": 0.0, "txt": "There are a reasonable number of candidate programming languages. That problem has been addressed before.\nThe big problem now is specification. If the specification is too formal, it's too long and too hard for humans to read. We need something in between.\nThere aren't many candidates. There was UML, but that was something of a dud.\n\nConsider a specification at roughly the level that Rust crates are documented. \nRust crate documents contain all the exported types and functions, along with a textual\ndescription of what each does. The document should provide enough information to use the crate without looking inside it. That's a widely accepted form of documentation.\n\nRust crate documents are usually created from the code. But consider going the other way. Write the crate documentation first, and let an LLM implement it from there.\nWith an LLM creating the code and reading the documentation, the LLM can create formal contract constraints for proof purposes. Constraints visible at the API level can be re-exported to the document.\n\nThat seems within reach of current LLM technology. Is it? It's worth trying. Take some low-level crate documentation for existing crates and see what an LLM with a moderately large budget can do with it. Try to create a drop-in replacement.\n\nDoing this on low-level Rust crates would be a useful exercise. Try to formalize the bottom of the stack."}, {"id": 50670251, "au": "juanre", "dom": 211, "sr": 39, "sc": 5.39, "ep": 5.76, "bs": 0.0, "d": 0, "age": 5.47, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 949, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.545, "fa": 0.34, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": "My product requires very careful thought about security, and I would love to be able to formally verify it. I cannot write it in Lean, though; what I have done instead is to write the trust model in Lean, around 4k lines of code that allows me (well, the agents) to reason about security, experiment with changes, prove outcomes.\n\nWe have now 144 proven theorems, like “an agent never passes as a person, and never approves where a person is required”. And then we link it to the actual code by using the Lean model to generate the tests."}, {"id": 50664143, "au": "weinzierl", "dom": 130, "sr": 40, "sc": 5.24, "ep": 6.79, "bs": 0.0, "d": 3, "age": 16.1, "grav": 183.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 28929, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.702, "fa": 0.28, "gp": 1.371, "bl": 0.0, "ds": 0.0, "txt": "The question is, why do we care about slop in the first place?\nIf we ignore the ideological and emotional reasons, I think it boils down to three things:\n\n1. The slop is incorrect\n\n2. The slop is bloated\n\n3. The slop is not human readable\n\nFormal verification together with human validation is the answer to point 1. The second point needs additional measures to keep the artificial author in check which is in my experience quite easy to accomplish.\n\nIf these two are in place I found that human readability falls out mostly for free.\n\nSo, to summarize, in my opinion formal verification together with measures to keep the code minimal and concise is our best way to tackle slop."}, {"id": 50665861, "au": "ilumanty", "dom": 144, "sr": 41, "sc": 5.2, "ep": 6.74, "bs": 0.0, "d": 1, "age": 12.22, "grav": 118.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 72, "qw": 0, "k": 359, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://www.tuev-verband.de/pressemitteilungen/tuev-organisationen-bringen-ki-zertifizierung-in-den-regelbetrieb"], "ig": 1.666, "fa": 0.62, "gp": 0.731, "bl": 0.0, "ds": 0.0, "txt": "Thank you. It's ridiculous how some people giddily reach for anything that remotely smells like a solution while unaware that they complicate things even more.\n\nLoosely related: the German TÜV now wants to certify AI systems https://www.tuev-verband.de/pressemitteilungen/tuev-organisa... (original in German, use your favorite translation tool)\n\nI wonder whether such a certificate will be a future requirement for selling or running certain hosted software. It would be hilariously German when the certificate then mandates using formally verifiable programming languages."}, {"id": 50663457, "au": "FridgeSeal", "dom": 86, "sr": 42, "sc": 5.16, "ep": 6.48, "bs": 0.0, "d": 1, "age": 17.78, "grav": 215.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 18, "k": 7104, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.32, "fa": 0.64, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "> People have written TLA+ specs for their software[1] and not have it materially improve the quality or reliability\n\nGiven how vibe coded the rest of that whole DB appears to be, and the number of holes the Jepsen test found, I’m not terribly sure I’d trust, or use it as an example of “used formal methods”.\n\nA better example would be the AWS S3 team who used TLA+ to formally verify their permissions model, especially around whether something was publicly accessible."}, {"id": 50663903, "au": "jupake", "dom": 77, "sr": 43, "sc": 5.14, "ep": 5.8, "bs": 0.0, "d": 0, "age": 16.69, "grav": 194.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 111, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.757, "fa": 0.0, "gp": 1.152, "bl": 0.0, "ds": 0.0, "txt": "Isnt this exactly what Ada language was created for? Hence, the use by the military for avionics and critical systems.\n\n\"It also includes facilities to help program verification. For these reasons, Ada is sometimes used in critical systems, where any anomaly might lead to very serious consequences, e.g., accidental death, injury or severe financial loss. Examples of systems where Ada is used include avionics, air traffic control, railways, banking, military and space technology.\"\n\nAll that was once old, is new again."}, {"id": 50664465, "au": "latentsea", "dom": 113, "sr": 44, "sc": 4.96, "ep": 6.5, "bs": 0.0, "d": 3, "age": 15.4, "grav": 171.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 32, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.422, "fa": 0.42, "gp": 1.352, "bl": 0.0, "ds": 0.0, "txt": "Interesting. I work in bog standard LOB SaaS type businesses my whole career, so zero practical experience with formal methods, but a growing interest in them due to how I see the industry trending towards them. Can I ask... in your case, what is $dayjob related to that you find yourself operating this way already? Finance? Aerospace? Just curious...\n\n> You must not write implementation before having all conjectures stated -- otherwise the implementation will bias your thinking, and you will try to prove properties of your implementation instead of what you needed.\n\nMost software engineers don't really have a background in it, and tbh I kinda don't know where to start, and have heard that right now if you're already experienced with formal methods then you can get great results out of approaches like this with LLMs, but if you just vibecode up the Lean or TLA+ etc then you're not going to get out of it what you were expecting. I suspect your statement here is exactly the kind of thing that makes all the difference, but I don't know how to know what the other things that make the difference are. Any other pointers?"}, {"id": 50664100, "au": "acje", "dom": 225, "sr": 45, "sc": 4.93, "ep": 6.03, "bs": 0.0, "d": 0, "age": 16.21, "grav": 185.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 194, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://acje.github.io/systems/new_stack/"], "ig": 1.103, "fa": 0.62, "gp": 1.154, "bl": 0.0, "ds": 0.0, "txt": "Following some of the same sentiment, let me offer my own thoughts on how hardware/software co-design also should change to enable both digital sovereignty and inherent defensibility. https://acje.github.io/systems/new_stack/"}, {"id": 50665157, "au": "rramadass", "dom": 64, "sr": 46, "sc": 4.89, "ep": 6.21, "bs": 0.0, "d": 1, "age": 13.85, "grav": 144.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 162, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 2.088, "fa": 0.0, "gp": 0.901, "bl": 0.0, "ds": 0.0, "txt": "Your boss was not quite right.\n\nThere is a \"Correctness-by-Construction\" approach to programming which allows one to severely restrict the state space of a program from the beginning such that every statement/block/function only operates on a much smaller \"valid\" set of program sub-states. This is using classical logic via predicates as explained by Hoare Triples, Dijkstra's wp-calculus, Morgan's refinement calculus and later Meyer's Design-by-Contract.\n\nTo do deductive verification statically, the basic idea is to group all computation paths (i.e. sequence of state transitions) over the entire program state space into a much smaller set of logical constraints (aka verification conditions) which is then handed off to a SAT/SMT solver to be proved/disproved.\n\nAn alternative is constructive logic using types and lambda calculus as pointed out by a sibling commentator.\n\nThere have been lots of systems which have been formally proved/verified to various extents/levels as can be seen in Industrial-Strength Formal Methods in Practice by Hinchey/Bowen and many other similar books."}, {"id": 50666247, "au": "Buttons840", "dom": 102, "sr": 47, "sc": 4.89, "ep": 6.43, "bs": 0.0, "d": 4, "age": 11.51, "grav": 108.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 11, "k": 14921, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.43, "fa": 0.42, "gp": 1.292, "bl": 0.0, "ds": 0.0, "txt": "> the running debate between dynamic typed and static typed computer languages\n\nActually, I haven't seen a good dynamic vs static types debate for a long long time. Some of these fundamental debates have become tired and people don't debate them anymore, which is understandable.\n\nBut, in the age of LLMs, maybe it's time to have that debate again.\n\nThe major disadvantage of typed languages is they're harder to write at times, the type checker gets in your hair. But if LLMs write the code, what argument remains against static types?"}, {"id": 50664571, "au": "austin-cheney", "dom": 242, "sr": 48, "sc": 4.83, "ep": 5.93, "bs": 0.0, "d": 0, "age": 15.16, "grav": 166.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 4383, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.828, "fa": 0.0, "gp": 1.129, "bl": 0.0, "ds": 0.0, "txt": "Frustrating. The repeated failure of developers trying to fix broken human behavior with a software solution.\n\nLLMs are not the problem. Quality will degrade anyways because there is no reason why it shouldn’t degrade. There is no magic to any of this. It’s just economics. Quality will remain high provided there is an incentive to keep it high, but once other factors achieve a greater desired value those incentives collapse.\n\nThis is not a new problem and it has been solved countless times outside software. So long as software people continue to whine about the symptoms while intentionally ignoring the problem we should expect conditions to continue to degrade. A new programming language will not alter the trajectory or acceleration towards failure. Perverse desires always find a way."}, {"id": 50667318, "au": "onion2k", "dom": 105, "sr": 49, "sc": 4.83, "ep": 6.37, "bs": 0.0, "d": 6, "age": 9.76, "grav": 84.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 50398, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.609, "fa": 0.34, "gp": 1.119, "bl": 0.0, "ds": 0.0, "txt": "LLMs don't care and can just as easily keep track of them as separate concerns.\n\nOnly if they have the context of every part of the code though. If you put type hints in your code then the LLM can understand the shape of what some code is supposed to send/receive without having to trace back through the code to the source of that data. That means a model with a much context window can successfully change it. That's both cheaper and faster.\n\nAlso, we can still do things without LLMs. You can compile and test code as a part of CICD, and having something doing a static type check is a good quality gate.\n\nMaybe in a future where we run models locally that's not an issue, but if Anthropic 100x their prices tomorrow I'll be glad I left some aspects of development working without LLM input."}, {"id": 50663599, "au": "protocolture", "dom": 298, "sr": 50, "sc": 4.81, "ep": 5.91, "bs": 0.0, "d": 0, "age": 17.43, "grav": 208.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 16, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.754, "fa": 0.42, "gp": 0.408, "bl": 0.0, "ds": 0.0, "txt": "> fully embrace formal verification, all the way down to the foundations of our civilizational software stack.\n\nI am getting so tired of LLMs being used as leverage for people to basically thrust their random viewpoint and make it all philosophical.\n\n\"LLMs mean my thing is best and everyone needs to do it or become post-civilizational transhuman paperclips\"\n\nI almost wish the stupid AI safety sex cult could convince Sanders and Trump to nuke us back to the stone age if only to save us from the onslaught of low-quality bad faith takes."}, {"id": 50664758, "au": "lenkite", "dom": 91, "sr": 51, "sc": 4.7, "ep": 6.24, "bs": 0.0, "d": 1, "age": 14.71, "grav": 159.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 18, "k": 5681, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.407, "fa": 0.42, "gp": 1.194, "bl": 0.0, "ds": 0.0, "txt": "> People have written TLA+ specs for their software[1] and not have it materially improve the quality or reliability\n\nThat particleDB link is VERY unconvincing. All the folks I know who wrote a TLA+ spec have said that it helped them discover bugs. Just that it was a massive pain to keep maintaining code and spec independently.\n\nHowever, I am confused on why new PL is needed. Why not just improve lean and its libraries so that it becomes a standard big-software language like Go/Java/Rust ?"}, {"id": 50666483, "au": "rramadass", "dom": 66, "sr": 52, "sc": 4.64, "ep": 6.37, "bs": 0.85, "d": 3, "age": 11.08, "grav": 102.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 92, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": ["https://news.ycombinator.com/item?id=50666297"], "ig": 1.582, "fa": 0.62, "gp": 0.608, "bl": 0.32, "ds": 0.0, "txt": "See my comment here - https://news.ycombinator.com/item?id=50666297\n\nIt depends upon what all parts of a \"system\" you want to encompass under \"formal verification\". There is nothing preventing you from verifying everything from hardware all the way to user-facing software or only certain layers in the chain.\n\nAs an analogy, the FIPS/Common Criteria security standards have multiple levels of certification going from simple signed binary blob to a complete hardware and software lockdown system.\n\nYou can do the exact same thing with formal verification of your system if needed. LLMs have made this possible if driven properly."}, {"id": 50672072, "au": "ianjbutler", "dom": 27, "sr": 53, "sc": 4.63, "ep": 5.73, "bs": 0.0, "d": 0, "age": 2.23, "grav": 13.4, "surf": 17.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 105, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 2.019, "fa": 0.28, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "Unification of programming languages and modeling languages is the holy grail of course, and it’s certainly no longer a pipe dream, but we suffer much from ignoring the easy wins in the middle ground.\n\nWe could iteratively move towards this sort of thing by basically programming more directly with more formal stuff more often, basically thinking in terms of automata, process algebras, graph algorithms, etc.  that’s the real design vocabulary now, not something like loops or objects\n\nFor example.. abstractions from FSMs to kahn processes whatnot can all compile to Petri nets, and suddenly you can embed a formally checked subset of a classic and well understood control flow or dataflow or graph transforms, but using the idioms available in your language (decorators, templates, annotation).  You write the formal model and the informal implementation side by side, using each to generate/elaborate/constrain the other.  There’s only one whole but it has two distinct views, neither of which is complete or standing alone"}, {"id": 50665654, "au": "gf000", "dom": 51, "sr": 54, "sc": 4.59, "ep": 6.13, "bs": 0.0, "d": 4, "age": 12.66, "grav": 125.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.653, "fa": 0.34, "gp": 0.884, "bl": 0.0, "ds": 0.0, "txt": "Java has sum and product types with exhaustive pattern matching, lambdas and streams, and is the next more widespread language just after python and js.\n\nJS devs are doing monadic development (async is just that), and plenty of lambda passings, with the predominant frontend framework model being one where the view is a pure function of state, driven by reactive changes of the state.\n\nFunctional won vast areas in mainstream programming. What you are saying may have been true 15 years ago, but not anymore."}, {"id": 50663609, "au": "porcoda", "dom": 21, "sr": 55, "sc": 4.55, "ep": 5.65, "bs": 0.0, "d": 0, "age": 17.41, "grav": 208.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 2199, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.637, "fa": 0.0, "gp": 1.246, "bl": 0.0, "ds": 0.0, "txt": "Dafny, SPARK Ada, Why3, Verus, Frama-C, TLA+, etc. are all sort of in this direction for different languages and styles of verification.  It is nice to see them getting attention now that LLMs make them digestible for a broader set of programmers.  I'm not sure one can start with a goal of creating a \"mainstream\" language that is verification-oriented.  Mainstreamness comes from adoption.  I'd look at those past languages (like the ones I listed), and ask \"why did these not go mainstream\" or \"why did they not see broad adoption\", and try some new ideas to address their gaps to see if a new one will catch on.  But the \"mainstream\" part seems backwards as the goal - if it’s verifiable, ergonomic, flexible, and accessible, maybe it will go mainstream."}, {"id": 50668518, "au": "matltc", "dom": 103, "sr": 56, "sc": 4.55, "ep": 6.0, "bs": 0.0, "d": 5, "age": 7.92, "grav": 62.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 250, "qw": 0, "k": 226, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 2.032, "fa": 0.0, "gp": 0.847, "bl": 0.0, "ds": 0.0, "txt": "Ruby and python were my introductions to programming. I picked up C and found the type system to just be annoying. Then I picked up a TS Node project that used Zod and it changed my perspective.\n\nOne of the primary structures that the project concerned itself with  was written as a big fat z.object with all optional keys. In the logic, there were all kinds of runtime checks as nested  if/else ifs looking for the presence of the keys and branching on their value if they existed. I discovered z.discriminatedUnions and realized that this could be checked once at compile time by defining the possible states of this structure, which progressed monotonically from one state to the next, never backwards\n\nThe logic then became a single comprehensive switch statement with an assert never default. Vastly simplified the rest of the application and obviated the nullish guards that were interspersed throughout the front- and backend logic. Life changing.\n\nNow, I only use dynamic languages for trivial scripting or where the type system would be unneeded overhead. I am finding this to be rarer as my ambitions grow.\n\nAlso, the benefits of a good LSP provided by strongly typed languages with a robust ecosystem are huge. Makes reasoning about code so much simpler for me when I can peek any object's type in my IDE and go to definition. Ruby LSP is awful at this, you can't rename a variable globall"}, {"id": 50666146, "au": "aenis", "dom": 65, "sr": 57, "sc": 4.55, "ep": 6.0, "bs": 0.0, "d": 2, "age": 11.69, "grav": 111.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 1537, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.845, "fa": 0.28, "gp": 0.6, "bl": 0.0, "ds": 0.0, "txt": "I think what he likely meant was: its impossible to do formal verification of programs the way they are written and deployed.\n\n- ignoring how programs are written, they are usually compiled and linked, which introduces states unknown to the original programmer,\n\n- ignoring how they are compiled, they are executed in environments with variability, including temporal; I remember tracing a problem related to a longer trace on one of the paths of the PCB, and materially different outcomes depending on which trace the signal happen to travel on (it was a high-frequency P-I-D controller, but for whatever reason the microcontroller could transmit the same signal on one or the other path). The particular bug was traced with a oscilloscope, by a graybeard, not algebra.\n\nThe way I see it, in order to get verifiability to actual programs, one would need to cover the state space of the entire system - algo, compiled binaries, operating system, hardware, and the weather on the other side of the planet for a good measure.\n\nI am not an expert in the area, in any way - just a regular software dude. Appreciate all the responses in this thread!"}, {"id": 50663804, "au": "filipdobro", "dom": 290, "sr": 58, "sc": 4.55, "ep": 5.6, "bs": 0.0, "d": 1, "age": 16.95, "grav": 199.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 24, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.653, "fa": 0.28, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "The issue with Haskell and other functional programming languages is that it doesn't reflect the hardware paradigm. Reasoning within a functional programming language is obviously simplified due to the statelessness, however you lose the benefits of memory hierarchies and other hardware improvements we have due to spatial and temporal locality. You might be able to fix this with a smart compiler, but then reasoning about the correctness will be another challenge.\n\nIf a language cannot balance tradeoffs between hardware and software, people will still use the most performant language, especially for resource-intensive tasks, so you end up with what we currently have. We need to rethink how we can design a language that is token-efficient, offers memory safety, is close to the metal, and lastly implements formal verification guarantees. The closest what we have to this is Rust and C++, but it's not good enough."}, {"id": 50672977, "au": "nagaiaida", "dom": 17, "sr": 59, "sc": 4.55, "ep": 5.55, "bs": 0.0, "d": 5, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 414, "qw": 0, "k": 115, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 2.033, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "i see no particular reason to expect that i can trust that pile of code and unit/fuzzing/differential tests when i can go use a 750B+ parameter model i heard vociferous praise for earlier this year whose marketing materials brag about agentic capability, 1M+ token context, and unrivaled coding proficiency only to immediately have it fall on its face attempting basic pronoun-antecedent resolution that relies on trivial information a hairs-breadth back in the context window. we apparently all decided natural language is all you need but squint as i may i can't seem to make out the perfect natural language processor everyone else must be using.\n\nwhat possible reasonable basis would i have to doggedly charge forward assuming that these immediately apparent issues with the basic language-processing-facsimile aspect of things will suddenly no longer be of concern when it's instead gnarly subsystem-spanning crosscutting concerns i expect to be tracked usefully across an entire codebase? particularly when things like parameters are to arguments as pronouns are to their antecedents which makes up but one tiny inherent subproblem of \"okay computer design it good\".\n\ni'm certainly open to the argument that i'm just a weirdo who is simply not engaging with these things the same way as everyone else which may reveal a different set of problems invisible to most people's usage of the same too"}, {"id": 50666121, "au": "dgrunwald", "dom": 32, "sr": 60, "sc": 4.55, "ep": 5.41, "bs": 0.0, "d": 2, "age": 11.75, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 37, "k": 333, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.594, "fa": 0.42, "gp": 0.325, "bl": 0.0, "ds": 0.0, "txt": "> The most vulnerable part that will remain will be the formalization of requirements. That's impossible to solve fully because you never know what the human had in mind exactly when he ordered the program to be written.\n\nI don't think it necessarily needs to be solved. You can combine formal verification with tests!\nUse tests to show that the program occasionally does what you want.\nUse verification to show that the program never does what you don't want (e.g. crash).\nThe formal requirements can be quite weak this way, yet you still get a high level of assurance overall.\n\nAnd you'll be surprised how many invariants you'll actually need for the simple \"don't crash\" requirement -- to prove anything at all in a complex program, underlying components need to be correct, or it becomes hard/impossible to prove anything at all about the code using those components.\n\nSo (admittedly without any personal experience other than studying this area an university more than decade ago) I expect even a simple \"don't crash\" requirement gets you the majority of the formal verification benefits. (as long as you have some tests to ensure the implementation isn't just returning a constant)"}, {"id": 50667675, "au": "win311fwg", "dom": 106, "sr": 61, "sc": 4.55, "ep": 5.32, "bs": 0.0, "d": 7, "age": 9.23, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 34, "k": 188, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.309, "fa": 0.42, "gp": 0.721, "bl": 0.0, "ds": 0.0, "txt": "> Only if they have the context of every part of the code though.\n\nWhy?\n\n> You can compile and test code as a part of CICD, and having something doing a static type check is a good quality gate.\n\nNothing about separating concerns precludes that, of course. Most serious validation languages already avoid the intertwinement. It's not exactly a new concept. The trouble is that humans often find it hard to keep track of both at the same time, so we trick them into thinking it is one language to get around that (typically at the cost of lesser validation). But LLMs do not have the same trouble."}, {"id": 50664242, "au": "gf000", "dom": 30, "sr": 62, "sc": 4.55, "ep": 5.27, "bs": 0.0, "d": 1, "age": 15.87, "grav": 179.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 255, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.766, "fa": 0.28, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "I mean in most cases a mathematician is not going around and checking each and every case, why would softwa
