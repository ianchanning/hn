re do that?\n\nFormal verification a la cocq/Agda/lean works by constructive logic. (Disregard the middle paragraphs, I'm sure I'm not telling you anything new)\n\nThe type system is strong enough to encode various statements, even about variables (dependent type system, this is a valid type: a + b == b + a)\n\nThe only way to create an instance for this type is by proving the statement. The == type can only be created by trivially equal expressions, so it will accept a == a. So in the definition of the above you will go step by step, each step itself being accepted by the compiler, and at the end you get a proof and a compiling program, a bit similarly to how you would do it on paper.\n\nSo I guess it boils down to. Could a mathematician figure out some elegant proof for the system that somehow makes \"checking each state\" reduced to an easier statement? If yes, then formal verification can also do so. If no, then LLMs may be able to scale up what is feasibly provable, but there is no real alternative. Real world testing is just scratching the surface of the state space.\n\nAll in all, that's why it's paramount that systems are designed with complexity in mind. We can compose simple function into a simple function and have it explode in complexity, but it's also possible to choose g"}, {"id": 50670945, "au": "tristenharr", "dom": 179, "sr": 63, "sc": 4.55, "ep": 5.26, "bs": 0.0, "d": 0, "age": 4.3, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 0, "k": 178, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": ["https://logicaffeine.com/"], "ig": 1.155, "fa": 0.62, "gp": 0.539, "bl": 0.0, "ds": 0.0, "txt": "I think that's the next step for the Logos project, is to take and formally verify the entire language now.\n\nWe have a lot of formal verification mechanics built into the language being able to handle the compilation of the lean kernel and I want to next focus on making it so the code and compiler itself is formally verified to meet it's spec.\n\nhttps://logicaffeine.com/"}, {"id": 50664087, "au": "pbhjpbhj", "dom": 194, "sr": 64, "sc": 4.55, "ep": 5.25, "bs": 0.0, "d": 2, "age": 16.23, "grav": 186.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 22135, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.489, "fa": 0.28, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "I agree mostly, but not that verification being a bottleneck is the principal part. Isn't it rather that as we push ourselves to working at higher levels of abstraction, managing agents, we want to be sure we're not just letting them go off and do whatever, but keeping some reins on them? We might no longer be able to do what they do - I'm thinking RH in Lean - but if it's formally verifiable we can at least say a model output complies with a specification (unless the agent hacked the formal verification stage).\n\nWe want to be confident we're not being duped.\n\nIt's like we skipped over the Laws of Robotics, but we're writing some sort of Mosaic 'moral' code for generative models."}, {"id": 50664236, "au": "DeathArrow", "dom": 282, "sr": 65, "sc": 4.55, "ep": 5.14, "bs": 0.0, "d": 0, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 11470, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.564, "fa": 0.28, "gp": 0.46, "bl": 0.0, "ds": 0.0, "txt": "1. When coding was done exclusively by humans we still had lots of bugs, inefficiencies, poorly written and poorly architected software.\n\n2. While at start LLM output was not great, models are continuously improving and the quality of coding by frontier models is good. (Even weaker models like Deepseek Flash can output high quality software if driven carefully)\n\n3. By analyzing the model output, having lots of gates, having good testing habits and by asking the models to manually test what they did, and constantly changing my workflow to improve the output, I am very happy with the results and probably my workflow using AI is of better quality than if I would do it by hand.\n\n4. If the software isn't of worse quality than if done by human teams with realistic constrains (time, money etc.), then using AI is a net gain.\n\n5. While striving for perfection is great, doing when to do compromises and trade-offs, is even greater."}, {"id": 50666421, "au": "kbr-", "dom": 115, "sr": 66, "sc": 4.55, "ep": 6.25, "bs": 1.11, "d": 4, "age": 11.19, "grav": 103.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 22, "k": 180, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.655, "fa": 0.42, "gp": 0.804, "bl": 0.42, "ds": 0.0, "txt": "> Can I ask... in your case, what is $dayjob related to that you find yourself operating this way already? Finance? Aerospace? Just curious...\n\nNothing so critical.\n\nMy first serious full-time job was at ScyllaDB, where I worked on distributed database system core. My main area of interest (carried over from University) were distributed algorithms. There, formal methods are basically necessary; if you design a distributed algorithm and don't use formal methods, you *will* fuck up. In ScyllaDB I used TLA+.\n\nToday I have a different job but my passion for formal methods didn't go away.\n\nI updated my HN profile with link to my website, you can look me up."}, {"id": 50665722, "au": "nylonstrung", "dom": 48, "sr": 67, "sc": 4.55, "ep": 5.14, "bs": 0.0, "d": 4, "age": 12.52, "grav": 123.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.679, "fa": 0.0, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "This is the problem that excites me the most about agentic coding\n\nI think software development and the tools underlying it could be wildly more powerful and exploit the underlying computer algebra more directly if dev tools didn't have to cater to the lowest common denominator imperative language dev\n\nLLMs are valuable to me not because they can replace the types of coding these devs do, but because they have a far more deeper 'understanding' of the foundational math and algebra than could ever be expected of the average dev\n\nThere's ways software engineering could engage much more directly with these concepts to produce more sound and expressive results if the \"user\" could be safely assumed to be an IMO level mathematician like a sufficiently powerful LLM is"}, {"id": 50670166, "au": "nickpsecurity", "dom": 141, "sr": 68, "sc": 4.55, "ep": 5.11, "bs": 0.0, "d": 1, "age": 5.6, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 14398, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.864, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "Formal methods may or may not help you. I remember Amazon or another company using TLA+ on a distributed system quickly found a bug that would've taken over two dozen steps to hit.\n\nThe concurrency bugs SPIN and TLA+ find also eat tons of debugging time because they are hard to replicate. They're often called heisenbugs for how they're there and not there depending on the observer.\n\nStatic analyzers with low, false positives catch tedious or corner-case bugs developers often miss. That already tells you that any formal method that makes software immune to those big classes will also improve quality. SPARK Ada and Frama-C both do that."}, {"id": 50663481, "au": "latentsea", "dom": 111, "sr": 69, "sc": 4.55, "ep": 5.09, "bs": 0.0, "d": 1, "age": 17.71, "grav": 214.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.622, "fa": 0.0, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "Quite ironically I see formal methods being extremely key to your central argument.  That is, the design should be started by modelling with some formal language that then gets expanded into an implementation. I fully agree about massively restricting the possibility space of code as being why they work. I've found that to basically be the only thing that produces consistently good results in the face of all the non-determinism. The entire codebase doesn't fit into the context window though, but formal models of it can act as some form of lossy compression that helps it fit into the context window better. I think formal methods definitely have a role to play, as to do anything that restricts what the valid moves are like frameworks and fitness functions etc."}, {"id": 50664230, "au": "DeathArrow", "dom": 284, "sr": 70, "sc": 4.55, "ep": 5.07, "bs": 0.0, "d": 0, "age": 15.9, "grav": 179.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 11470, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.541, "fa": 0.28, "gp": 0.45, "bl": 0.0, "ds": 0.0, "txt": "1. When coding was done exclusively by humans we still had lots of bugs, inefficiencies, poorly written and poorly architected software.\n\n2. While at start LLM output was not great, models are continuously improving and the quality of coding by frontier models is good. (Even weaker models like Deepseek Flash can output high quality software if driven carefully)\n\n3. By analyzing the model output, having lots of gates, having good testing habits and by asking the models to manually test what they did, and constantly changing my workflow to improve the output, I am very happy with the results and probably my workflow using AI is of better quality than if I would do it by hand.\n\n4. If the software isn't of worse quality than if done by human teams with realistic constrains (time, money etc.), then using AI is a net gain."}, {"id": 50666495, "au": "yubblegum", "dom": 29, "sr": 71, "sc": 4.55, "ep": 5.04, "bs": 0.0, "d": 1, "age": 11.05, "grav": 101.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1029, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.729, "fa": 0.28, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "I'm surprised about this bit of wisdom imparted to you. Componentization addresses the 'whole system state space' issue, does it not? In our modern societies, we routinely use insanely complex mechanisms built by very average workers. The key seems to be discreet parts. The state space of individual parts is not huge and its seems to me (disclaimer: not a PhD /g) hierarchical systems can afford manageable state space complexity at each layer of the hierarchical system."}, {"id": 50670614, "au": "spankalee", "dom": 20, "sr": 72, "sc": 4.55, "ep": 5.02, "bs": 0.0, "d": 3, "age": 4.9, "grav": 32.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.766, "fa": 0.0, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "Yep. And in this case you can parse, resolve symbols, and lower each file without information from other files.\n\nPreserving that is one reason Zena has a very explicit import syntax and uses `this.x` like JavaScript: you have to name every symbol you import, and dereference all class members explicitly, precisely so you don't need other files to know if an identifier is valid.\n\nIn a non-shared-heap language like Zena (because of Wasm GC), the question then becomes if the serialization cost of collecting those results into the checker thread pays for parallel parsing. So far it doesn't, so I haven't built workers for Zena just yet. That'll probably happen when I make the checker parallel."}, {"id": 50665767, "au": "nylonstrung", "dom": 163, "sr": 73, "sc": 4.55, "ep": 5.5, "bs": 0.53, "d": 1, "age": 12.41, "grav": 121.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 17, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.509, "fa": 0.42, "gp": 0.524, "bl": 0.2, "ds": 0.0, "txt": "> Now it's plain useless unless you need an absolute guarantee of correctness. But that's niche, not mainstream.\n\nI don't think this is a niche problem when major security breaches and downtime are a weekly occurrence at this point\n\nThe world would be tangibly different in positive ways if \"everyday\" software and core deps had the level of proven correctness and fault-tolerance that currently is relegated to niche fields like avionics where verification is the norm"}, {"id": 50664287, "au": "d_tr", "dom": 183, "sr": 74, "sc": 4.55, "ep": 4.92, "bs": 0.0, "d": 0, "age": 15.79, "grav": 178.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 212, "qw": 0, "k": 969, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.591, "fa": 0.0, "gp": 0.813, "bl": 0.0, "ds": 0.0, "txt": "I have started my own PL project after going through Crafting Interpreters.\n\nI know there is a ton of stuff I need and want to learn but no language has all the features I'd like.\n\nNamely systems language \"zero overhead\" performance, modern ergonomics and compile-time guarantees like Rust, dependent types (I don't know much about type systems so maybe there is - and probably there is - some good alternative I am missing), powerful generics (the shit people do with C++ templates often leave me admiring the creativity and also wondering why it has to be so unreadable), reflection, and more stuff I currently have as ideas but not in a very solid form admittedly. And all those working synergistically and coherently.\n\nI do have a good foundation in abstract math but there is lots to study for sure. And it has to be something that really offers some great combination of features otherwise it's not worth it for anything else than me learning how to write a proper compiler. There are too many languages already, but I am not sure whether this is because it is too hard of a problem or because of choices people made. I guess I am going to find out.\n\nAt least my motivation is in a relatively sufferable shape despite it having tendencies of going down the shitter with all this vibe-coding crap going on."}, {"id": 50672352, "au": "spankalee", "dom": 8, "sr": 75, "sc": 4.55, "ep": 4.88, "bs": 0.0, "d": 2, "age": 1.61, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.784, "fa": 0.0, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "Indeed, it's just the plan and direction. There are designs for formal verification, but currently only runtime contracts and static contracts which aren't run and must be proved, but no proof system yet. I'm taking my time to try to understand the options better.\n\nAs far as mainstream, I've usually taken that to mean in the same vein as mainstream languages, ie C++, Java, JavaScript, Python, Ruby, Rust, Swift, etc. Generally imperative, ALGO-style syntax, usually OOP + more and more functional, etc.\n\nI'm designing Zena to be as mainstream and familiar as possible in that sense of the word. Obviously a new language isn't mainstream in terms of usage yet.\n\nIt's like a new band playing mainstream music. The band isn't itself \"mainstream\" at the beginning."}, {"id": 50666034, "au": "ChicagoDave", "dom": 228, "sr": 76, "sc": 4.55, "ep": 4.78, "bs": 0.0, "d": 2, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2819, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.72, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "This is true and all of the “weird” system failures recently are examples of decades of tech debt exposed by the latest LLMs.\n\nIt’s a huge vindication of all the architects and engineers that expressed dismay at management for not providing time to address that tech debt in real-time.\n\nEven better. Management can never ignore tech debt ever again!\n\nBut at the same time we (architects and engineers) will be responsible for hardening our deployed systems.\n\nI’m cool with that. That’s what I’ve been begging for my entire career.\n\nBut the problem isn’t having a fancy DSL. It’s just old school, boring, engineering discipline."}, {"id": 50664013, "au": "alexey-salmin", "dom": 31, "sr": 77, "sc": 4.55, "ep": 4.61, "bs": 0.0, "d": 1, "age": 16.36, "grav": 188.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 2757, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.771, "fa": 0.0, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "It's impossible to prove by brute-forcing the states of an arbitrary program, but it's possible on practice for programs that were built with verification in mind: pure functions wherever applicable, state invariants defined and verified for every stateful part. If you aren't able to prove a specific invariant at compile-time, you leave it as assertion which means you can still prove that either you get the correct output or an error, but never the wrong output or crash/vulnerability.\n\nI think today it's actually more possible than ever. Writing programs in this way is hard and tedious but LLM can excel at that. I also think that a hybrid of Z3+LLM is orders of magnitude stronger than pure Z3. LLMs generated a formal proof of GRH, surely than can prove banking app correct.\n\nThe most vulnerable part that will remain will be the formalization of requirements. That's impossible to solve fully because you never know what the human had in mind exactly when he ordered the program to be written."}, {"id": 50671576, "au": "nagaiaida", "dom": 15, "sr": 78, "sc": 4.55, "ep": 4.6, "bs": 0.0, "d": 3, "age": 3.2, "grav": 19.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 115, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.762, "fa": 0.0, "gp": 0.314, "bl": 0.0, "ds": 0.0, "txt": "this genre of comment always sits poorly with me; i've been hearing this month after month year upon year as if i haven't been watching the whole time, perfectly capable of periodically trying out the trendy hotness from 6 months back i was assured obviated each and every concern of the ignorant luddites. and yet it continues to fail in similar, pathetically trivial ways. but by then there's a new obviously better model and nothing about the old one is considered admissible. rinse and repeat."}, {"id": 50667241, "au": "K0IN", "dom": 206, "sr": 79, "sc": 4.53, "ep": 4.53, "bs": 0.0, "d": 0, "age": 9.88, "grav": 86.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 219, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.602, "fa": 0.0, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "Totally agree, I recently used gobra, and found it a plesent experience (with ai on my side, the documentation is a bit hard to find for me), and it slots right into your go files. Only issue I found it adds alot of comments and waters the code a bit too much (would love to have a header file like system for this).\n\nAlso your intuition for wasm is the the thing that cam to my mind when reading the headline.\n\nI also think that go is a great language to be formally verifiable (idk about multi threading), due to its very clear and verbose syntax."}, {"id": 50663814, "au": "hresvelgr", "dom": 129, "sr": 80, "sc": 4.4, "ep": 4.4, "bs": 0.0, "d": 2, "age": 16.91, "grav": 198.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 25, "k": 1067, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.226, "fa": 0.42, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "> Quite ironically I see formal methods being extremely key to your central argument.\n\nFormal verification is a useful tool, but I don't think it meaningfully combats \"slop,\" which I argue is primarily disorganised, voluminous, and lacking in aesthetics.\n\n> That is, the design should be started by modelling with some formal language\n\nI would make sure what I am developing demonstrably works before formally verifying the characteristics of the system."}, {"id": 50667624, "au": "js8", "dom": 200, "sr": 81, "sc": 4.35, "ep": 4.35, "bs": 0.0, "d": 1, "age": 9.29, "grav": 78.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 8720, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.269, "fa": 0.28, "gp": 0.393, "bl": 0.0, "ds": 0.0, "txt": "For me, it's driven by two things:\n\n(1) security - If we want secure systems they have to be watertight. And AIs are good at hacking.\n\n(2) reasoning ownership - The AI models not being open weight and their thinking not being published means you don't own the reasoning process. Formal modelling (of requirements and specification) and proving is a way to partially retake that ownership."}, {"id": 50663920, "au": "kubb", "dom": 99, "sr": 82, "sc": 4.33, "ep": 4.33, "bs": 0.0, "d": 1, "age": 16.63, "grav": 193.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5158, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.148, "fa": 0.28, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "I don't get this broken logic. A software engineer should have elementary reasoning skills.\n\n\"Formal correctness doesn't guarantee desired function, therefore we don't need it.\"\n\nBut in reality it will actually catch bugs, in addition to other verification methods, and give more confidence in software."}, {"id": 50667177, "au": "win311fwg", "dom": 104, "sr": 83, "sc": 4.33, "ep": 4.33, "bs": 0.0, "d": 5, "age": 9.97, "grav": 87.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 12, "k": 188, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.109, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> But if LLMs write the code, what argument remains against static types?\n\nIf by static types you mean where the verification language and the implementation language are intertwined, one has to ask: If LLMs write the code, what advantage is there to that intertwinement? That was a convenience function for human authors. LLMs don't care and can just as easily keep track of them as separate concerns."}, {"id": 50667944, "au": "thesz", "dom": 138, "sr": 84, "sc": 4.27, "ep": 4.27, "bs": 0.0, "d": 1, "age": 8.84, "grav": 72.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 2709, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.34, "fa": 0.28, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "TLA+ proofs are detached from actual implementation.\n\nIf you have proofs attached to an actual implementation, things get much, much better.\n\nFor example, you can have type-checked distributed APIs (you can't omit a parameter for an HTTP request), you can have adherence to protocols checked at compile time (API calls sequences, etc), you can have many other things to be checked before any program run."}, {"id": 50672362, "au": "btilly", "dom": 41, "sr": 85, "sc": 4.24, "ep": 4.24, "bs": 0.0, "d": 3, "age": 1.58, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 56180, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": ["https://www.anthropic.com/research/formal-verification"], "ig": 0.563, "fa": 0.9, "gp": 0.243, "bl": 0.0, "ds": 0.0, "txt": "Trivially true. But the complexity that can be handled is useful in the real world. And what can be done is being scaled up quickly.\n\nSee https://www.anthropic.com/research/formal-verification for more."}, {"id": 50664043, "au": "btilly", "dom": 39, "sr": 86, "sc": 4.24, "ep": 4.24, "bs": 0.0, "d": 1, "age": 16.31, "grav": 187.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 56180, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.12, "fa": 0.34, "gp": 0.44, "bl": 0.0, "ds": 0.0, "txt": "We're now able to do things like try to prove that no fuzz test with less than 32 MB of input will crash this program.\n\nFormal verification of full behavior is impossible. But formal verification of important properties is within the reach of AI."}, {"id": 50663640, "au": "lioeters", "dom": 202, "sr": 87, "sc": 4.12, "ep": 4.12, "bs": 0.0, "d": 1, "age": 17.33, "grav": 206.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 10804, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.296, "fa": 0.28, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Au contraire, it's both horrifying and impressive that so much of the software industry has grown for decades without formal verification. With the accelerated production (\"productivity\") of machine-generated code, we're at a threshold where it will become impossible to manage the complexity unless we change our ways."}, {"id": 50663857, "au": "supermatt", "dom": 256, "sr": 88, "sc": 4.11, "ep": 4.11, "bs": 0.0, "d": 0, "age": 16.8, "grav": 196.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 6097, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.238, "fa": 0.0, "gp": 0.83, "bl": 0.0, "ds": 0.0, "txt": "I couldn’t read past the first paragraph.\n\nWhat are people doing that they are finding quality is nose diving? That’s completely the opposite of my experience. I’d like to know, but the link is broken\n\nBut of course software engineering has always had this problem, right? Oh! Another broken link.\n\nMaybe we need to start closer to home when it comes to quality."}, {"id": 50664881, "au": "logicchains", "dom": 47, "sr": 89, "sc": 4.05, "ep": 4.05, "bs": 0.0, "d": 3, "age": 14.44, "grav": 154.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "You've got to remember that the average developer is a Javascript or Python coder who lacks the mathematical ability to do even the most rudimentary abstract alegbra, and so cannot write or understand a production Haskell program, let alone understand how abstractions can eliminate whole classes of bugs."}, {"id": 50666124, "au": "viraptor", "dom": 92, "sr": 90, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 2, "age": 11.74, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 48206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.228, "fa": 0.28, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "There's another alternative - let most of the spec be derived from the code. Verus for example allows you to wrap your code in a verus!() macro and get a lot of the work for free and guaranteed to be in sync with the code. Even without any custom proofs, just that part provides a no-crash guarantee. (You still need to do some work though - it's not free)"}, {"id": 50665291, "au": "childintime", "dom": 231, "sr": 91, "sc": 3.97, "ep": 3.97, "bs": 0.0, "d": 0, "age": 13.51, "grav": 139.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1698, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 0.709, "bl": 0.0, "ds": 0.0, "txt": "Code itself should be safe. Any product definition must be able to converge on the desired outcome, iteratively, so it is accepted code must be reformulated from time to time. Those are the two requirements. The absence of state and a single source of truth help a lot."}, {"id": 50666003, "au": "rramadass", "dom": 22, "sr": 92, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 1, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Lean 4 itself is a general purpose functional programming language with dependent types in addition to being a interactive theorem prover. Only the latter has been made famous/popular by the mathematicians.\n\nIdris, Agda are (like Lean4) functional languages and proof assistants. Dafny, Ada SPARK are imperative and automated solver languages.\n\nLanguages like C/C++ which do not have powerful type systems nor are verification aware have tools like Frama-C, CBMC etc. to help with their formal verification. Rust also has some external formal verification tools.\n\nWith growing awareness of formal verification due to LLMs one (or more) of them is sure to become \"mainstream\"."}, {"id": 50665779, "au": "Loquebantur", "dom": 88, "sr": 93, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 3, "age": 12.38, "grav": 121.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.585, "fa": 0.0, "gp": 0.086, "bl": 0.0, "ds": 0.0, "txt": "The author's text is actually about saving us from our misconceptions about LLMs.\n\nFormal verification is one necessary building block, not the whole structure needed. You want to do Verification and Validation.\n\nCurrently, people have dollar signs over their eyes and don't see the perils their greed is leading them into.\n\nYou cannot substitute human expertise with LLMs. That's like believing your rational brain was superfluous and you'd be better off without it, relying on \"others\" (LLMs) instead.\n\nNobody in the public sphere has thought that through really. Apparently, they've become so accustomed to other people solving their problems when paid, they just assume it would be the same or better with \"non-people\", who don't even get paid."}, {"id": 50663913, "au": "slacknatcher12", "dom": 292, "sr": 94, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 2, "age": 16.66, "grav": 193.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 20, "k": 45, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.121, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> however you lose the benefits of memory hierarchies and other hardware improvements we have due to spatial and temporal locality.\n\nThis is ironic considering the default GC strategy for GHC's RTS is a copying collector that puts values physically close if they are used together plus bump allocation. That has good cache side effects (heh)."}, {"id": 50663498, "au": "vikramkr", "dom": 135, "sr": 95, "sc": 3.82, "ep": 3.82, "bs": 0.0, "d": 1, "age": 17.68, "grav": 213.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 6391, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.912, "fa": 0.34, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "The same limitation is true of every other method of verifying and validating software too. You can have 100% unit test coverage and still have nothing work. It's another tool in the toolkit and a pretty powerful one"}, {"id": 50670599, "au": "gls2ro", "dom": 180, "sr": 96, "sc": 3.81, "ep": 3.81, "bs": 0.0, "d": 0, "age": 4.92, "grav": 32.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 1787, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.472, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "I read a couple of things on this subject and tried to remember some other things form university year but I feel a bit lost about the cost benefit and the advantages in a real world software.\n\nso let me ask a simple question:\n\nWe have a file of 10 requirements defined by business in English.\nThen we create a Lean representation of them.\n\nWho is verifying that the representation is the correct one with respect to the requirements? (not that the lean code is correct)"}, {"id": 50667243, "au": "markhermeling", "dom": 80, "sr": 97, "sc": 3.79, "ep": 6.31, "bs": 2.52, "d": 3, "age": 9.88, "grav": 86.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 70, "qw": 0, "k": 2, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": ["https://forum.ada-lang.io/", "https://www.adacore.com/ada-spark-office-hours"], "ig": 1.53, "fa": 0.62, "gp": 0.652, "bl": 0.95, "ds": 0.0, "txt": "Agreed. The GNAT Compiler has the largest market share of any Ada compiler in the space and is fully open source.\n\nAnd the ecosystem is following! There are a lot more new middleware layers, frameworks, operating systems and such being released in Ada over the past few years.\n\nSee https://forum.ada-lang.io/ for discussion and pop into the live Community Office Hours that AdaCore hosts (https://www.adacore.com/ada-spark-office-hours) to see what is going on in the space."}, {"id": 50664206, "au": "bonesss", "dom": 229, "sr": 98, "sc": 3.75, "ep": 3.75, "bs": 0.0, "d": 1, "age": 15.94, "grav": 180.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1921, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.595, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I feel many, if not most, of these arguments basically reduce to some variant of “use Haskell/OCaml with spec-style tests”.\n\nExhaustiveness guarantees, compiler verification and feedback, powerful language features to create high-level domain syntax and languages, pure functions commonly used, and specifications/tests that can be read aloud in English and understood by domain experts… they’re even token efficient."}, {"id": 50665780, "au": "neilwilson", "dom": 101, "sr": 99, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 3, "age": 12.37, "grav": 121.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 3142, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We don't really have a verification crisis, we have a validation crisis.\n\nEver more cycles spent checking we're building the thing right doesn't address the issue of whether we're building the right thing.\n\nThe debate has always been whether running cycles on \"compile\" which is checking against a largely fixed set of rules is better than \"testing\" which is checking against a largely dynamic set of rules. \"Testing\" tends to be able to do validation better than \"compile\".\n\nThat's been the running debate between dynamic typed and static typed computer languages for the last half century or so. It swings backwards and forwards.\n\nLike centralised vs distributed I don't see there being \"a\" answer other than \"it depends\"."}, {"id": 50664001, "au": "fmbb", "dom": 87, "sr": 100, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 2, "age": 16.4, "grav": 189.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 11, "k": 1430, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.931, "fa": 0.42, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "You don’t need an example of “used formal methods” to push back on the text in OP.\n\nThe first paragraph is\n\n> To save software engineering from LLMs, we need a mainstream verifiable language\n\nFormal verification will not save us from LLMs, whatever it is we want to try and save (human civilization or programmers or users)."}, {"id": 50671845, "au": "preg_match", "dom": 16, "sr": 101, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 4, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 930, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.578, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean I think you’re just incorrect: LLMs write code just fine. They write better than most engineers and most code is much higher quality. Mostly because LLMs can dedicate time to testing - engineers can’t.\n\nThere’s a reason basically every engineer at every company on Earth is using LLMs to some degree. Yes, it’s very very good for programming.\n\nObviously I can’t one-shot things and if you give it stupid prompts it will give you stupid output. That won’t change, ever. But that’s not a failure mode either.\n\nYou need to prompt at the right level of abstraction and carefully think about design. And if you do, it will produce higher code than you can by-hand in 1/100th the time. And, with unit tests, fuzzing tests, differential tests… the whole works."}, {"id": 50663802, "au": "pianopatrick", "dom": 161, "sr": 102, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 0, "age": 16.95, "grav": 199.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 425, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.038, "fa": 0.0, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "If you want a language that is mainstream and applies formal verification and works everywhere you could use Frama-C. It formally verifies C code. C is as mainstream as things get. You can run C code in the browser via web assembly and C works everywhere else as well."}, {"id": 50663688, "au": "behnamoh", "dom": 148, "sr": 103, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 1, "age": 17.23, "grav": 204.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 25, "k": 23725, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.945, "fa": 0.42, "gp": 0.182, "bl": 0.0, "ds": 0.0, "txt": "> Formal correctness does not guarantee desired function. People have written TLA+ specs for their software[1] and not have it materially improve the quality or reliability.\n\nBoris said they heavily use TLA+ for Claude Code and they've noticed an improvement. Comparing CC with 6 months ago, it has indeed improved in terms of reliability and screen flicker, etc."}, {"id": 50666256, "au": "xmcqdpt2", "dom": 252, "sr": 104, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 2, "age": 11.49, "grav": 108.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 18, "k": 1475, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.009, "fa": 0.42, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "> How else could industry fully embrace agentic coding more while knowing they aren't compromising on reliability and security\n\nExactly what the parent is saying. They are compromising on reliability and security. It’s a compromise every company is making very willingly.\n\nAnd why wouldn’t they? No one is accountable for bad software anymore anyway."}, {"id": 50670948, "au": "ksec", "dom": 182, "sr": 105, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 0, "age": 4.3, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 6, "k": 58062, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.899, "fa": 0.42, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": ">Software engineering was struggling before LLMs.\n\nFor a lot of software, they are more like an act of writing than engineering. Especially in domains where they are most abstracted.\n\nI would call something like SQLite and TigerStyle with TigerBeetle Software engineering."}, {"id": 50668863, "au": "adsharma", "dom": 247, "sr": 106, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 0, "age": 7.39, "grav": 56.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 562, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.27, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "This is not a technical problem. People need to stop inventing new programming languages and bring these techniques to the ones they already use.\n\nFor various historical and self preservation reasons, some of these language ecosystems create social and technical taboos."}, {"id": 50668158, "au": "thomasahle", "dom": 152, "sr": 107, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 2, "age": 8.49, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 7006, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Right, it's definitely a hurdle. But I don't think it's much harder for \"mainstream\" programming languages than for \"verifiable\" ones.\n\nOf course, some languages like Python don't have a formal spec beyond the interpreter itself. That doesn't mean you can't write one; it just means you have to update it when the language changes.\n\nIndeed, after formalizing C/C++, you can use that to check that the Python interpreter correctly implements the Python spec you wrote. Or catch the parts where it does not.\n\nOf course it's a lot of work, as you say, which is why I hope to attract more contributors (and their llms) to my project :-)\n\nOnce all the languages are formalized, the next step is to formalize the main software libraries people use. If you are using pytorch, you don't want to formalize all its classes and functions everytime you want to prove something about a small program you made. You want to just import that stuff."}, {"id": 50664288, "au": "Dashadower", "dom": 274, "sr": 108, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 1, "age": 15.79, "grav": 178.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 3, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "In my experience theres a huge difference between proving existing code and proving code that was written with ease of reasonin in mind.\n\nMaybe if we humans dont bother with proofs at all this will become irrelevant, but my speculation is that programmers familiar with formal verification may become more valuable in the sense they can write verification friendly code better."}, {"id": 50663593, "au": "remywang", "dom": 139, "sr": 109, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 1, "age": 17.44, "grav": 208.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 36, "k": 942, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.702, "fa": 0.42, "gp": 0.447, "bl": 0.0, "ds": 0.0, "txt": "> ParticleDB’s home page advertised that ParticleDB was “formally proven” with a TLA+ proof. However, during our collaboration no TLA+ specification was available. It is unclear what properties might be proven, or whether they described ParticleDB as built.\n\nThat link is a pretty weak strawman. Also TLA+ is special in that it (usually) does not directly verify the implementation but a model of it."}, {"id": 50668257, "au": "vikramkr", "dom": 137, "sr": 110, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 3, "age": 8.34, "grav": 67.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 6391, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.41, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "I think the problem is that rn a lot of people with experience with formal verification are theoreticians who aren't familiar with engineering pragmatism. Yes it's true that because something is formally verified that doesn't mean it's secure. The way we deal with that is, there are swarms of AI agents trying to hack everything of they succeed well there's your peer review. And in theory is is possible it's so subtly wrong that no AI at current capability levels can figure out the flaw and the system seems secure? Well in that case, mission accomplished it's not hacked. But what about if there's more powerful AI down the line? That's why we have to make sure to get the smarter AI first"}, {"id": 50667077, "au": "cowlevel", "dom": 143, "sr": 111, "sc": 3.47, "ep": 3.47, "bs": 0.0, "d": 1, "age": 10.1, "grav": 88.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 11, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.867, "fa": 0.42, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Linked article says they only said they had a TLA+ proof but none was actually provided and the rest of the article makes it clear that ParticleDB is pure vibeslop. I wonder who paid them to test it.\n\nFavourite line:\n\n> Under normal operation, ParticleDB was slow, deadlocked, and crashed without warning."}, {"id": 50670374, "au": "mahboi", "dom": 55, "sr": 112, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 5, "age": 5.28, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.454, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "College degree, coding boot camp, or no formal credentials but they built side projects to show to potential employers. Also there was an extreme demand for software devs at certain points in time pre AI coding, where they just needed people to write basic stuff in whatever framework."}, {"id": 50665230, "au": "Overdrivr", "dom": 262, "sr": 113, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 0, "age": 13.72, "grav": 142.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 168, "kpp": 18.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "Hard disagree, you'll only end up with spec errors and the specs will need to become so detailed to be defined that you'll end up back to square one.\n\nLean works well for math because there are many orders of magnitude of difference between defining a spec (ex P=NP) and implementing the proof. I don't think this applies for conventional software eng"}, {"id": 50666096, "au": "ChicagoDave", "dom": 230, "sr": 114, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 2, "age": 11.79, "grav": 112.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 2819, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.423, "fa": 0.0, "gp": 0.009, "bl": 0.0, "ds": 0.0, "txt": "Having just designed and built a new modeling DSL for interactive fiction I can tell you that the ‘exhaustive’ part is infinite recursion.\n\nThere will always be another use case.\n\nMaybe something like Lean can be achieved, but constructing software in relation to a business model is vastly more complex than math.\n\nWe wouldn’t have Lean. We’d have Lean for every domain with variations for every business."}, {"id": 50667283, "au": "markhermeling", "dom": 199, "sr": 115, "sc": 3.3, "ep": 5.82, "bs": 2.52, "d": 1, "age": 9.83, "grav": 85.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 2, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.607, "fa": 0.28, "gp": 0.857, "bl": 0.95, "ds": 0.0, "txt": "The way I see it is that there are 2 places where formal methods help:\n- Proof the absence of runtime-errors/panics\n- Proof functional correctness\n\nThe sweet spot for many users is the first. Make sure that the application cannot crash. No array-out-of-bounds read/write, no memory issue on ANY input, formally proven at compile time.\n\nThis requires additional work in the program to annotate (in SPARK at leasts) and knowledge from the programmer, which meant that there was a barrier to entry.\n\nWell, LLMs COMPLETELY remove this barrier to entry. You can write the logic and have the LLM add the contracts to get to the proof. This works in most cases.\n\nAnd then, for truly critical code, you can look at functional correctness as a cherry on top of your cheesecake."}, {"id": 50664107, "au": "latentsea", "dom": 140, "sr": 116, "sc": 3.3, "ep": 3.56, "bs": 0.27, "d": 2, "age": 16.2, "grav": 185.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.517, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "You can instrument the code to capture production traces and then verify them against the TLA+ model though. I think a programming language with that baked in as a first class citizen would be compelling. That's sort of the direction this stuff is heading it feels like anyway. Model in a smaller language that's more precise, fits in the context window better, and can explore the state space much more quickly than reasoning token by token, then build the thing based off the model, then validate that the implementation conforms to the model."}, {"id": 50664282, "au": "gf000", "dom": 46, "sr": 117, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 2, "age": 15.8, "grav": 178.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "How on earth they not help with real problems? Also, their very point is that most of the program is pure, but they most definitely have IO and other kind of side effects, it just lives at the very edge of the system.\n\nHaskell has interesting uses in industry, but in general in the last decade or so the functional paradigm has become retrofitted to basically each mainstream language. Like java's streams/lambdas, algebraic data types in basically every modern language (rust), immutable by default, etc."}, {"id": 50664302, "au": "mastermage", "dom": 78, "sr": 118, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 1, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 376, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.157, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Ada's decline was not due to Ada's design, which IMO is one of the best Language designs out there. However in my opinion the decline of ada is due to its closed source compilers that are mainly used. Additionaly also just a lot of security critical code thats not open source."}, {"id": 50669346, "au": "mahboi", "dom": 62, "sr": 119, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 3, "age": 6.71, "grav": 49.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.96, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My job had me working on a custom version of ejabberd across like 2 years. For those unfamiliar, that's in Erlang, which is probably one of the more convenient to use pure functional languages. It worked, but it was so cumbersome. BEAM is cool though, so they made Elixir to use that without sticking to pure functional.\n\nOr like, make any web backend."}, {"id": 50668278, "au": "jkahrs595", "dom": 235, "sr": 120, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 2, "age": 8.31, "grav": 66.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 303, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This looks great but running it on my code immediately triggered (my first) openAI \"cybersecurity risk\" response and REFUSED to do anything no matter how much I told it I'd switch to claude :)\n\nCan't really express in words how much that just pissed me off. I cannot wait for these fucking companies to get ruined by open models."}, {"id": 50671916, "au": "BatchJob", "dom": 260, "sr": 121, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 0, "age": 2.56, "grav": 15.3, "surf": 13.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 228, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.888, "fa": 0.34, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "First we became ML experts, then we became Math nerds and now we want proofs for software.\n\nProgrammers have learned so much by doing nothing in the last 2 years!"}, {"id": 50664356, "au": "peter_retief", "dom": 240, "sr": 122, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 0, "age": 15.64, "grav": 175.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 847, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.868, "fa": 0.0, "gp": 0.806, "bl": 0.0, "ds": 0.0, "txt": "This is a new frontier, we do not need to be able to read the code so why do we even need a code editor, we need a completely new language that might use symbols, context, location, images and human langauge."}, {"id": 50663659, "au": "lz400", "dom": 193, "sr": 123, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 1, "age": 17.29, "grav": 205.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1119, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.684, "bl": 0.0, "ds": 0.0, "txt": "I think it's simple to understand. Most code is now written by LLMs and the bottleneck is verification. If with a few more tokens thrown at TLA+, Lean, etc. we can achieve _guaranteed_ correctness, it's an amazing deal. I'm not saying it's possible or even that it works that way, but that's the dream."}, {"id": 50665461, "au": "childintime", "dom": 56, "sr": 124, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 5, "age": 13.1, "grav": 132.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1698, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.539, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI has made them into 10x devs now. 10x the output, of putting together simple solutions to known problems with a few components. Basically following a recipy, like a suit is customized for each customer."}, {"id": 50663565, "au": "globular-toast", "dom": 146, "sr": 125, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 1, "age": 17.53, "grav": 210.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.139, "fa": 0.0, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "Frameworks often lead to crap code because people don't recognise when they're doing something the framework isn't good at. Do we expect LLMs to be better? So far they're a lot worse and will happily churn out reams of code that would make even the worst programmer stop in their tracks questioning whether this is right."}, {"id": 50663518, "au": "robin_reala", "dom": 158, "sr": 126, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 1, "age": 17.64, "grav": 212.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 73115, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’d be wary of saying “formally prove accessibility”. Leaving aside the problems of computing contrast over differing surfaces (e.g. a gradient, an image, or an animated surface) on a responsive site at build time, accessibility is a vastly bigger subject than just colour contrast and focusing purely on compliance to a set of rules isn’t going to get you very far.\n\nOr rather, zero problem with accessibility linting, but don’t oversell it."}, {"id": 50668215, "au": "AnimalMuppet", "dom": 93, "sr": 127, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 3, "age": 8.4, "grav": 67.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.006, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The normal pattern is that the spec is shorter than the code, and therefore easier to get correct.  That's why it's useful.  Deriving the spec from the code therefore seems like going the less-useful direction."}, {"id": 50667732, "au": "Dashadower", "dom": 276, "sr": 128, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 2, "age": 9.14, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 3, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure if you could say pure lean is expressive, especially if you restrict to portions you can actually verify/reason about. Because functions without proof of termination cannot be used in propositions and you're forced to define a measure if your recursive function doesn't have a syntactically decreasing argument.\n\nUnless you're talking about reasoning about other languages deeply embedded in Lean, at that point we're not talking about Lean itself but about the model of that language stated in Lean."}, {"id": 50671282, "au": "theteapot", "dom": 246, "sr": 129, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 0, "age": 3.78, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1188, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.818, "fa": 0.34, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "I don't understand. Formally verify which properties? And doesn't Godel have something to say about the limits of this? And aren't my test cases a type of formal proof anyway? I even got 100% path coverage."}, {"id": 50663439, "au": "ggm", "dom": 142, "sr": 130, "sc": 3.14, "ep": 3.14, "bs": 0.0, "d": 1, "age": 17.82, "grav": 216.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 30793, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "Our first year CS  Pascal lecturer in  '79 used to quip \"I've compiled this but not run it\" and I used to think this was savage but I now see he was simply repeating the mantra. The Fortran I did on cards in '76 they insisted we run, and learn the cost of sloppy code in the debug cycle through batch processing cycle costs."}, {"id": 50665789, "au": "nylonstrung", "dom": 251, "sr": 131, "sc": 3.13, "ep": 3.66, "bs": 0.53, "d": 1, "age": 12.36, "grav": 121.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.526, "fa": 0.0, "gp": 0.052, "bl": 0.2, "ds": 0.0, "txt": "Formal verification is IMO the only way they can have their cake and eat it too\n\nHow else could industry fully embrace agentic coding more while knowing they aren't compromising on reliability and security\n\nVibecoding is notoriously bad at writing test coverage that doesn't prevent actual bugs\n\nFormal methods can have the same issue but allow for a more concrete burden of proof and a more tangible reward function for post-training"}, {"id": 50664349, "au": "gf000", "dom": 216, "sr": 132, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 15.66, "grav": 175.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.645, "bl": 0.0, "ds": 0.0, "txt": "Proofs are programs themselves. So if you generate the very program from your proof (like with lean), that mismatch should not really happen.\n\nOf course you may have still written incorrect spec, and once you have IO you probably won't model the whole Linux kernel in the proof."}, {"id": 50664419, "au": "pjmlp", "dom": 82, "sr": 133, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 2, "age": 15.53, "grav": 173.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.29, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those closed source compilers keep 7 compiler vendors in business, most folks hardly pay for anything today, unless we place a Internal wall, or digital app store, in between."}, {"id": 50665110, "au": "Terr_", "dom": 131, "sr": 134, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 4, "age": 13.95, "grav": 146.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 28451, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.287, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Assuming a narrow definition of \"incorrect\", I would add:\n\n4a. The slop has been generated with rules and processes, ones that needed actual decisions and approval which never happened.\n\n4b. Nobody reading the slop can distinguish between  deliberate things that were chosen and approved, versus accidental things which were blindly generated and kept."}, {"id": 50668854, "au": "onion2k", "dom": 107, "sr": 135, "sc": 2.99, "ep": 3.84, "bs": 0.85, "d": 8, "age": 7.4, "grav": 56.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 50398, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.234, "bl": 0.32, "ds": 0.0, "txt": "Why?\n\nA type hint says \"only accept things that look like this\" and a compiling or a type checker can statically analyse the code to make sure that's valid everywhere. If you don't have that then the LLM would need to track back through the call tree to the originating point that defines the shape of the thing being passed to understand if it's valid all the way through the app in order to know that the data is correct. As it can't know where the originating call starts, it needs context of everything. It might only read the code it needs to read, and that can be done easily with an agent driving a small model, but it still needs complete access to every part of the app in order to trace what it needs to. With type hints it can just run the type checker to validate the code is OK and then trust the type hints."}, {"id": 50663676, "au": "0815beck", "dom": 259, "sr": 136, "sc": 2.97, "ep": 2.97, "bs": 0.0, "d": 0, "age": 17.25, "grav": 205.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 43, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.726, "fa": 0.0, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "\"i want to formally verify the program\" should be met with the same reaction as \"i want to prove that this is true\", namely WHAT, what exactly do you want to prove"}, {"id": 50667551, "au": "markhermeling", "dom": 1, "sr": 137, "sc": 2.96, "ep": 5.48, "bs": 2.52, "d": 0, "age": 9.41, "grav": 80.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 2, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.965, "fa": 0.0, "gp": 0.593, "bl": 0.95, "ds": 0.0, "txt": "Well written piece and certainly on-topic. There is a ton of conversation going on how AI can assist with formal methods.\n\nPersonally I am having great success using Ada SPARK. The SPARK subset has been greatly enhanced over the past years. I spent yesterday taking existing C repos, translating to SPARK, lifting it to SPARK Silver (absence of runtime errors) and then reporting the findings to the various maintainers. All as a background activity.\n\nResult: integer overflows, typically on boundary conditions, some logic mistakes, again on boundary conditions.\n\nI have not looked into Magmide, but I think the next breakthrough is a combination of something like SysMLv2 to describe architecture and requirements, TLA+ for modeling and formal proofs at the system level and then Lean or SPARK for the implementation."}, {"id": 50663517, "au": "JodieBenitez", "dom": 297, "sr": 138, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 0, "age": 17.64, "grav": 212.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1467, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.256, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yet another article claiming software quality is \"nose-diving\" because of AI, while we're piling [insert anything]2root exploits based on decades of real human sloppiness. Meanwhile, in-house software keeps getting better."}, {"id": 50672473, "au": "jopsen", "dom": 214, "sr": 139, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 1.31, "grav": 8.6, "surf": 20.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4994, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "Yeah, it's very possible that mainstream formal verification will look more like a test case that takes arbitrary input and asserts over how that input behaves.\n\nThat won't cover all behavior, but it's more thorough than fuzzing, and even more than unit testing.\n\nBut yes: it'll just be another tool in the toolbox."}, {"id": 50663839, "au": "mrkeen", "dom": 172, "sr": 140, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 16.84, "grav": 197.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 7, "k": 5996, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 0.74, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Something like ZFC axioms is good enough.\n\n  Axiom of Infinity - There exists an infinite set.\n\n  Axiom of Replacement - If a function is defined, then for any set, there exists a set of images under that function.\n\nWhy would these help me?"}, {"id": 50664319, "au": "onion2k", "dom": 100, "sr": 141, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 2, "age": 15.73, "grav": 176.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 50398, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The flaw in people's thinking is \"Formal verification means bug-free, and bug-free means it works correctly.\" ignoring the fact that most things that people call bugs are actually the code working correctly as it was written but it was written to do something that's either not what the requirement says or that the requirement doesn't actually say what the application should really do.\n\nRequirements, code, verification, etc are a process to turn a human mental model of something into an process a computer can do. You can verify the computer's side of that all day long but if the human side is wrong no amount of verification is going to make your software do what you wanted it to do."}, {"id": 50665813, "au": "nylonstrung", "dom": 286, "sr": 142, "sc": 2.92, "ep": 3.45, "bs": 0.53, "d": 1, "age": 12.29, "grav": 120.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.182, "bl": 0.2, "ds": 0.0, "txt": "I think we're seeing lots of progress for relating verification and specs with actual code: there are a number of good projects for Rust + Lean\n\nI think this problem is functionally a subset of same the issue that FP has with modelling stuff at it's boundaries like IO\n\nThe work around algebraic effects and handlers is some of the more relevant prior art here"}, {"id": 50670082, "au": "spankalee", "dom": 13, "sr": 143, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 2, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.243, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yep. Though I started with Gemini and am using a lot more Gemini now.\n\nThis is the language I've wanted to make for many years, but it wasn't really tractable without a full team. This project would not be possible for me without LLMs.\n\nAlso, if we're talking about making a language that's better for AI-generation, it seems extremely reasonable that such a language might be built with AI, no? I would be surprised to find someone who wanted a great language to use with AI, but was a stickler about the language itself not being built with AI."}, {"id": 50666740, "au": "danabramov", "dom": 223, "sr": 144, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 0, "age": 10.63, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 9769, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.501, "bl": 0.0, "ds": 0.0, "txt": "I’m working on verifying JavaScript code by having LLM transcribe it to Lean, model the environment, do differential testing, and then proving things about the Lean code. You’ll be surprised how far this can take you."}, {"id": 50668062, "au": "equinumerous", "dom": 9, "sr": 145, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 8.64, "grav": 70.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 94, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.073, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "This looks interesting, I've been wanting a TypeScript-like language which compiles to native without all the baggage of JavaScript. Does it also support generating native binaries, or only WASM?\n\nedit: I looked at the features on the website, I don't see anything about multi-threading, is it supported? And how about interoperability with native libraries like SQLite/QT/etc?"}, {"id": 50663893, "au": "techpression", "dom": 288, "sr": 146, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 0, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 709, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "A programming language is more than compilation, which I feel the post misses.\nI pick language because of its runtime properties and quality of life, I don’t want to reinvent every foundation in every project with a barebones language."}, {"id": 50665620, "au": "nylonstrung", "dom": 239, "sr": 147, "sc": 2.75, "ep": 3.28, "bs": 0.53, "d": 0, "age": 12.72, "grav": 126.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.992, "fa": 0.0, "gp": 0.652, "bl": 0.2, "ds": 0.0, "txt": "I firmly believe that Lean is already the language OP wants\n\nThere's lots of progress being made towards compilation to WASM and LLVM, as well as interop with Rust and other languages"}, {"id": 50663491, "au": "pjmlp", "dom": 250, "sr": 148, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 0, "age": 17.69, "grav": 213.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.589, "fa": 0.0, "gp": 0.89, "bl": 0.0, "ds": 0.0, "txt": "This will never take off without the proper incentives to make companies actually care.\n\nManagement would rather have vibe coding as the next step, following on cheap offshoring, than anything else, and the recent meltdowns aren't going to deter them, without liability in place."}, {"id": 50664547, "au": "ovenpasta", "dom": 79, "sr": 149, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 2, "age": 15.21, "grav": 167.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 45, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.065, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "Maybe, but now the situation is much different and we have full opensource Ada compiler in GCC as 1st tier language on par with c and c++. And you can use The open source tool SPARK to formally prove a subset of Ada. Any new program I write is now in Ada and no longer c or c++. No regrets!"}, {"id": 50663684, "au": "light_hue_1", "dom": 289, "sr": 150, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 0, "age": 17.24, "grav": 204.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2731, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.036, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "If Haskell would finally give up on the disaster that is laziness (and by extension GHC) and pivot to formal verification, this could be the killer app.\n\nMuch of what the author wants already exists!"}, {"id": 50668008, "au": "zappb", "dom": 98, "sr": 151, "sc": 2.58, "ep": 2.58, "bs": 0.0, "d": 2, "age": 8.71, "grav": 71.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [],
