 "ig": 1.1, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Languages like TLA+ lay at the opposite end of the spectrum of how programs can be optimized. The more space you leave for optimization, the larger the search space becomes in evaluating the TLA models. The smaller the space you use for the models, the more constrained your optimizations become. It seems as though the two can’t be combined without finding an appropriate balance point at which point you’d probably have something very similar to existing languages."}, {"id": 50664317, "au": "Dashadower", "dom": 249, "sr": 152, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 1, "age": 15.73, "grav": 176.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I also think formalizing existing languages and framework will become more and more valuable. It took over a decade to somewhat come to a consensus on how C's pointer provenance model should like, and even then using it to prove compiler transformations is still being worked on."}, {"id": 50664735, "au": "Kinrany", "dom": 243, "sr": 153, "sc": 2.53, "ep": 2.53, "bs": 0.0, "d": 1, "age": 14.77, "grav": 160.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 4363, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Human behavior issues can totally be fixed with technology. Not always perhaps, but it happens all the time, there's no reason it wouldn't.\n\nIn this case, economics doesn't matter if quality is free. And users do care about quality a little bit at least."}, {"id": 50667442, "au": "nr378", "dom": 215, "sr": 154, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 1, "age": 9.57, "grav": 82.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 967, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.872, "fa": 0.0, "gp": 0.318, "bl": 0.0, "ds": 0.0, "txt": "The program matching the spec matters a great deal for security purposes. If we achieve nothing other than that, we’re in a much better position than we are today with C and PHP."}, {"id": 50670094, "au": "nickpsecurity", "dom": 5, "sr": 155, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 1, "age": 5.7, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 14398, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 0.638, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I was told before that there was a minimum number of seats one had to buy for around $25,000 which came with a consulting or support contract to sweeten the deal. Many of us would rather drop a few hundred or a thousand for one seat. Do you know id they have per-seat, single-seat pricing for SPARK Pro?"}, {"id": 50666686, "au": "nylonstrung", "dom": 50, "sr": 156, "sc": 2.4, "ep": 2.93, "bs": 0.53, "d": 6, "age": 10.73, "grav": 97.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "I like your post, it's interesting that it centered on UML which is similar in shape to some formal concepts modelled in Lean: particularly Arrows, Quivers, String Diagrams and Petri Nets"}, {"id": 50672518, "au": "rafaelRiv", "dom": 291, "sr": 157, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 2, "age": 1.18, "grav": 8.0, "surf": 24.1, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 16, "qw": 0, "k": 39, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/stefan-hoeck/idris2-ref1"], "ig": 0.463, "fa": 0.45, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Linear type solve a lot of this problem. Idris2 have https://github.com/stefan-hoeck/idris2-ref1 which has been proved to be efficient"}, {"id": 50667321, "au": "gravypod", "dom": 232, "sr": 158, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 0, "age": 9.76, "grav": 84.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 6929, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.666, "fa": 0.0, "gp": 0.518, "bl": 0.0, "ds": 0.0, "txt": "Does anyone have practical experience with using LLMs + formal methods to verify software they ship that is not a research / prototype?"}, {"id": 50664622, "au": "anon-3988", "dom": 74, "sr": 159, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 1, "age": 15.03, "grav": 164.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 886, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.858, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "Haha no. I am sorry but we still have issues with null pointers. So lets not get ahead of ourselves and try to model the real world. People thinking \"woe is me the world is so complicated lets keep using C\" is bizarre."}, {"id": 50666829, "au": "burcsahinoglu", "dom": 287, "sr": 160, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 1, "age": 10.49, "grav": 94.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.978, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I believe that that link already exists in tools like Liquid Haskell, Dafny and Verus: the spec sits on the function itself, and if the code doesn't match it, it doesn't compile."}, {"id": 50668939, "au": "bigstrat2003", "dom": 283, "sr": 161, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 1, "age": 7.28, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 9, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.969, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> the quality of coding by frontier models is good\n\nIt most certainly is not. No LLM exists which is capable of reaching, let alone exceeding, a competent human programmer."}, {"id": 50664457, "au": "wseqyrku", "dom": 280, "sr": 162, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 0, "age": 15.43, "grav": 171.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 659, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "If you think you ever need anything more than rust, drink bleach. I mean if dealing with borrow checker is a hard pass for you maybe let's not talk about formal verification"}, {"id": 50664329, "au": "gf000", "dom": 227, "sr": 163, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 15.71, "grav": 176.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 4, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> cannot meet quality standards\n\nI think it's more that many may argue we never really reached high enough quality standards, irrespective of vibe coding. I also think that with good usage, LLMs can produce good code, but if we could also raise the bar while we are at it, why not?"}, {"id": 50664523, "au": "FullGarden_S", "dom": 169, "sr": 164, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 2, "age": 15.26, "grav": 168.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 43, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 0.944, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Something like ZFC axioms is good enough\".\n\nAnd by that I do not mean the exact, whole theory of ZFC itself but a trimmed down or a bloated version instead. The point is to have the appropriate and intuitive axiomatic semantics that cover the core constructs of the language, at least."}, {"id": 50671497, "au": "ashkankiani", "dom": 25, "sr": 165, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 2, "age": 3.38, "grav": 20.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 710, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.942, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If it makes you feel better, I'm working on formalizing a type system which allows you to do this with full inference. There are a few others who are trying it too, but I can literally count them and I've met or talked to half of them."}, {"id": 50672614, "au": "equinumerous", "dom": 11, "sr": 166, "sc": 2.18, "ep": 3.02, "bs": 0.85, "d": 3, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 94, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.287, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Thanks! I am not a Rust programmer but I hear that it has a pretty safe and solid multi-threading system. Might be something you can take inspiration from. Also, Kotlin coroutines are nice, but I am not sure if they are true multi-threading or just single-thread like JS. Overall the project looks nice, definitely filling a gap in the language ecosystem."}, {"id": 50664050, "au": "leecommamichael", "dom": 149, "sr": 167, "sc": 2.07, "ep": 2.07, "bs": 0.0, "d": 1, "age": 16.31, "grav": 187.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 548, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As a “creative programmer” I resonate with this strongly. While I think things like Lean and Rust are valuable tools which should exist, they only represent added friction TO ME."}, {"id": 50664647, "au": "d_tr", "dom": 185, "sr": 168, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 2, "age": 14.96, "grav": 163.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 969, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, I am aware of those points. I follow the new C++ standards (haven't touched reflection though). The transformation of C++ since C++11 has been amazing and I think there is still no competitor for, say, numeric computation frameworks. But some stuff is still awkward to write and of course other features probably just can't make it to the language."}, {"id": 50668240, "au": "ransom1538", "dom": 147, "sr": 169, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 1, "age": 8.37, "grav": 67.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 5794, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.836, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "\"You cannot just throw formal verification at a problem.\"\n\nOh. Look external stripe calls are hanging. (HALT problem)"}, {"id": 50665562, "au": "nylonstrung", "dom": 58, "sr": 170, "sc": 1.99, "ep": 2.52, "bs": 0.53, "d": 2, "age": 12.84, "grav": 128.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 1.006, "fa": 0.0, "gp": 0.106, "bl": 0.2, "ds": 0.0, "txt": "So none of the problems Nix solves are \"real\"?\n\nDo you really think all the math proofs being done with Lean could work at all if it was imperative as opposed to a purely functional, dependentally typed language"}, {"id": 50664004, "au": "nightmunnas", "dom": 263, "sr": 171, "sc": 1.91, "ep": 1.91, "bs": 0.0, "d": 0, "age": 16.39, "grav": 188.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 32, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 0.582, "fa": 0.0, "gp": 0.374, "bl": 0.0, "ds": 0.0, "txt": "I would love to contribute to a project like this. What are the existing projects that try to achieve this?"}, {"id": 50664641, "au": "shevy-java", "dom": 281, "sr": 172, "sc": 1.89, "ep": 1.89, "bs": 0.0, "d": 0, "age": 14.99, "grav": 163.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2075, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.741, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "But if AI is writing code for us now, do people need to learn programming? To me that's a chicken-egg dilemma. Some languages struggle getting new people to use them."}, {"id": 50664417, "au": "necovek", "dom": 197, "sr": 173, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 3, "age": 15.54, "grav": 173.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 6415, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.797, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Obviously! That's what being a good engineer has always been about — automate away the mundane of your job, and think through what else could be automated next!\n\nAs for reviewing AI code, have you seen some of it?  Nobody wants to review that!"}, {"id": 50669363, "au": "zappb", "dom": 37, "sr": 174, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 3, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve used Z3 to help with proving type system soundness in a DSL for RPCs. It’s pretty nifty."}, {"id": 50665578, "au": "nylonstrung", "dom": 275, "sr": 175, "sc": 1.84, "ep": 2.37, "bs": 0.53, "d": 1, "age": 12.81, "grav": 127.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1542, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ada_systems", "flbl": "Ada & Systems (Spark)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Lean has verification guarantees and I'd argue is the most expressive language ever made, except perhaps Racket\n\nThe question then is if it's usable, and I'd argue it isnt any less so than other FPs or systems languages"}, {"id": 50667672, "au": "drutaTushar", "dom": 72, "sr": 176, "sc": 1.8, "ep": 5.17, "bs": 3.37, "d": 4, "age": 9.24, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": -3, "kpp": -1.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "formal_verification", "flbl": "Formal & Verification (Language)", "urls": [], "ig": 1.82, "fa": 0.0, "gp": 0.615, "bl": 1.27, "ds": 0.0, "txt": "Partially I agree. But when it comes to errors/not-happy path - I am talking about pesky issues, driver/hardware errors which can never be mapped to any \"Type\". There is a reason every statically-typed programming language has Root Error type. For eg. Java has `Throwable` with two subtypes - `Error` and `Exception`. A `RuntimeException` is type that does give handle to programmers and JVM guarantees that it will be thrown. But sometimes one has to catch root \"Throwable\" or \"Error\" types in order to prevent JVM crash. It will be tedius to have formal verification theorems referring to \"Throwable\" in order to be formally verifiable. I guess It can be done - only if languages like Lean are expressive enough - but only using LLMS, for humans it will be quite complex. IMO - not worth. It will be repeat of \"elegant\" functional programming languages failing to go mainstream."}, {"id": 50663886, "au": "microflash", "dom": 176, "sr": 177, "sc": 1.8, "ep": 3.78, "bs": 1.99, "d": 0, "age": 16.73, "grav": 195.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 4333, "kpp": 7.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": ["https://quint.sh"], "ig": 0.391, "fa": 0.62, "gp": 0.757, "bl": 0.75, "ds": 0.0, "txt": "I’ve been playing with Quint [1]. Compared to TLA+, it has been a lot more approachable and even enjoyable at times. With their Studio, even non-technical people have been able to try it out with agents.\n\n[1]: https://quint.sh"}, {"id": 50664328, "au": "Dashadower", "dom": 219, "sr": 178, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 1, "age": 15.71, "grav": 176.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_lean", "flbl": "Software & Lean (Proofs)", "urls": [], "ig": 0.753, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"If civil engineers built bridges like how software engineers write software there would be no bridges left today\""}, {"id": 50669132, "au": "AnimalMuppet", "dom": 109, "sr": 179, "sc": 1.74, "ep": 1.74, "bs": 0.0, "d": 8, "age": 7.01, "grav": 52.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_llms", "flbl": "Code & LLMS (Quality)", "urls": [], "ig": 0.74, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "LLMs have a limited context window.  They also have trouble keeping track of what's going on \"elsewhere\", at least if there's enough of it."}, {"id": 50669326, "au": "gravypod", "dom": 234, "sr": 180, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 2, "age": 6.75, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 6929, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "pure_model", "flbl": "Pure & Model (Tla)", "urls": [], "ig": 0.727, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yea, this is an area that I have experimented in a bit. I wonder if people have done total correctness."}, {"id": 50669750, "au": "Izmaki", "dom": 14, "sr": 181, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 2, "age": 6.15, "grav": 43.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 774, "kpp": 2.3, "td": 0.0, "mod": 0,     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
