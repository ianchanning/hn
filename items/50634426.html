txt": "> I understand your response is that it's one way crypto. However this is very very poor UX and thinking.\n\nI think it is completely the opposite. Non-reversability is exactly what is missing for digital payments amongst individuals (not companies). Just as with cash, once I give a bill over to another party its gone and not reversible. I want the same for digital transactions in a lot of cases.\n\nI once sold my used bike, the buyer looked and inspected it, I told him to testdrive it but he said no and handed me 50€ and we shook hands. He left with it and 10mins later showed up at my doorstep telling me he doesn't want it as it doesn't ride very nice. I told him this is a done deal, sales are final and I don't have return policies as I am an individual. He got angry but left in the end. I'd be 100% sure he would have opened a reversal request with the payment provider if that would have been possible. Same way I don't want people who send me 20€ to even out a split bill to reverse it a day later."}, {"id": 50635411, "au": "adrianwaj", "dom": 29, "sr": 3, "sc": 7.32, "ep": 7.32, "bs": 0.0, "d": 0, "age": 19.75, "grav": 255.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 113, "qw": 0, "k": 2070, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": ["https://share.gemini.google/pWWCvmAqU9SW", "https://grok.com/share/c2hhcmQtMg_b624eaae-c04b-4514-bbcb-7084ece9d2f5"], "ig": 1.797, "fa": 0.62, "gp": 0.915, "bl": 0.0, "ds": 0.0, "txt": "Would like to see browsers have unique identifiers (the perfect fingerprint) with a browser plugin and let destinations request funds once a certain level of pledges have stacked up or after a certain period.\n\n\"HN's monthly payment has tallied up for January. 50k users have pledged a total of $/crypto _____ . Approve your voluntary contribution of _____ for xx hours spent / requests made there?\"\n\nyour name: [anonymous/semi-anonymous/name]\n\npre-approve for next time?\n\nAt that point, sites and services can have their own bouncer with guest list and ban everyone else.\n\nSo could Versine offer a micropayment stacking and pledging service? Make user payments miniscule and voluntary, and offer benefits to those that do, eg access, speed, freshness.\n\nrelated chats: https://share.gemini.google/pWWCvmAqU9SW https://grok.com/share/c2hhcmQtMg_b624eaae-c04b-4514-bbcb-70..."}, {"id": 50636748, "au": "adrianwaj", "dom": 31, "sr": 4, "sc": 6.6, "ep": 6.75, "bs": 0.0, "d": 2, "age": 17.57, "grav": 211.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 129, "qw": 0, "k": 2070, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": ["https://share.gemini.google/2MfdPWBiHgzz", "https://grok.com/share/c2hhcmQtMg_e6a36448-74cf-43a8-bb59-7b3555fbc978"], "ig": 1.856, "fa": 0.62, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "Did you want to be acquired by a bank?\n\nUS-only and requiring iOS or Android. Good start. Phone numbers and contact lists - this is information many people mightn't want to share.\n\nI'd be thinking about global, and the upcoming Linux handhelds (Flipper/Comet.) Versine pre-installed would be great. Biometrics could be an ear photo.\n\nIf you buy something online or send money, paying with an \u0023id in a browser should be enough. Confirmed by email?\n\nNotes:\n\"The technical architecture of building an invoice-aware or local-rail on-ramp is straightforward; the moat is licensing and banking partnerships.\" https://share.gemini.google/2MfdPWBiHgzz\n\n\"The broad 'accept crypto and settle in fiat' category is well-covered. The more interesting openings are in low-friction hybrid UX for mainstream customers, high-risk specialization, deep local-market settlement, and machine-native payments. Those niches are still relatively open.\" https://grok.com/share/c2hhcmQtMg_e6a36448-74cf-43a8-bb59-7b..."}, {"id": 50642228, "au": "aman179102", "dom": 22, "sr": 5, "sc": 6.25, "ep": 6.25, "bs": 0.0, "d": 0, "age": 4.01, "grav": 25.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.855, "fa": 0.56, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "In system design at this stage, the rule of thumb is to design for operational simplicity until data boundaries dictate splitting:\n\n1. Monolith First with Clean Module Boundaries: Premature microservices introduce distributed tracing complexity, partial failure modes, and the dual-write problem. Build a well-structured modular monolith with clear domain interfaces first.\n\n2. Isolate Failure Domains: Split services only when their operational requirements diverge fundamentally (e.g. CPU-intensive background video processing versus low-latency user auth, or distinct SLA/compliance requirements).\n\n3. Idempotency & Observability: Make all state-changing endpoints idempotent with client-generated tokens, and propagate correlation IDs across all service calls."}, {"id": 50637422, "au": "nrmitchi", "dom": 10, "sr": 6, "sc": 5.11, "ep": 5.4, "bs": 0.0, "d": 2, "age": 15.83, "grav": 178.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 16, "k": 5942, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.034, "fa": 0.42, "gp": 1.223, "bl": 0.0, "ds": 0.0, "txt": "> because you trust them to pay you back in the event of the agent making a mistake\n\nThis works right up until your \"trusted contact\"'s wallet/destination is compromised, requests money from your agent, and then it immediately disappears.\n\nIf this is your stance, that \"all transactions are one way, if the agent messes up, we are in no way responsible\" then that's fine, but just saying \"we have no ability to truly reverse the transaction by design\" does not necessarily mean you have no liability."}, {"id": 50636728, "au": "JimsonYang", "dom": 3, "sr": 7, "sc": 4.82, "ep": 5.27, "bs": 0.0, "d": 2, "age": 17.6, "grav": 211.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 117, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 1.455, "bl": 0.0, "ds": 0.0, "txt": "I understand your response is that it's one way crypto. However this is very very poor UX and thinking.\n\nYour use cases are limited(literally with only splitting bills with friends) and you're avoiding the hard problem. Disputes and refunds. \nSorry for the harsh words but:\nThis is not something I would call an mvp. Come back and launch again with a better product\n\nYou guys are building a dev tool. One of the first thing a developer would want to do is be able to purchase things with payments via agents"}, {"id": 50637123, "au": "Jommi", "dom": 49, "sr": 8, "sc": 4.79, "ep": 4.79, "bs": 0.0, "d": 0, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1179, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.544, "fa": 0.0, "gp": 0.8, "bl": 0.0, "ds": 0.0, "txt": "The biggest issue here is on and offramping.\n\nYou will face massive issues scaling the easy onramping to bigger amounts, without need true full KYC from users. You are probably also eating a bunch of fees here with apple pay too.\n\nSimilarly offramping will require KYC as well.\n\nProbably non US users will never be able to use this.\n\nUnfortunately I think these limiting factors makes this just a complete nonstarter product to scale."}, {"id": 50636852, "au": "logicallee", "dom": 92, "sr": 9, "sc": 4.72, "ep": 4.72, "bs": 0.0, "d": 0, "age": 17.34, "grav": 206.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 3367, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.33, "fa": 0.34, "gp": 0.43, "bl": 0.0, "ds": 0.0, "txt": "congrats on the launch, though you've picked a very technically difficult niche.\n\n(I sent you an email to apply to you to be a qa tester, happy to test it thoroughly for you for an afternoon, it comes out to about $4/hr but I understand if you don't have the means to send any money, it's pretty much impossible to do so, so no worries if it's outside your capabilities.)\n\nit will be hard to find anyone to test your app that requires giving it access to all the user's money plus when it disappears oops just ai no one is responsible, so hope you give some thought to my offer. if you can't do it, I understand, since it's technically impossible. There's no shame in saying you tried and failed."}, {"id": 50637128, "au": "mandeepj", "dom": 8, "sr": 10, "sc": 4.43, "ep": 5.09, "bs": 0.0, "d": 2, "age": 16.7, "grav": 194.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 11, "k": 3989, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.003, "fa": 0.42, "gp": 1.057, "bl": 0.0, "ds": 0.0, "txt": "> we have no ability to truly reverse the transaction by design\n\nThat's exactly why I stopped using Venmo and Cash App; when someone asks for it, I outright refuse to transact through them. I don't need convenience; I need certainty that my money is safe and I am in control."}, {"id": 50638180, "au": "ed_mercer", "dom": 52, "sr": 11, "sc": 4.1, "ep": 4.1, "bs": 0.0, "d": 0, "age": 14.09, "grav": 148.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 24, "k": 584, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 0.808, "fa": 0.42, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": ">but at the end of it the assistant hands back work to you when you have to go out and make the Venmo transfer.\n\nThis isn't really my experience. I can only speak for claude but it handles payments and even credit card verifications fine. The only annoyance are captchas which the model refuses to do."}, {"id": 50637386, "au": "xwowsersx", "dom": 46, "sr": 12, "sc": 4.08, "ep": 4.52, "bs": 0.0, "d": 0, "age": 15.96, "grav": 181.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 4421, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.164, "fa": 0.22, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "Smart idea to let people send gifts to others. Clever way to bake virality and distribution into the product (think PayPal did something similar?)\n\nOne thing I'm unclear on, though: what can I actually do with the money I receive beyond sending it to someone else? Can I withdraw it at some point, or is it effectively confined to the ecosystem? Curious how that works."}, {"id": 50640084, "au": "sebastienburel", "dom": 43, "sr": 13, "sc": 4.01, "ep": 4.01, "bs": 0.0, "d": 2, "age": 8.94, "grav": 74.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 4, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.295, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Trusted contacts are the same shape as what I use for email: my agents can only send to an allow-listed set of recipients, set outside the model. What the list doesn't stop is the model deciding to send, based on something it read. A message saying \"you owe Sam $40\" could trigger a payment to Sam with no passkey, as long as it's under the cap. Do you track where a trusted payment request came from, the user or text the agent was reading?"}, {"id": 50641797, "au": "olliem36", "dom": 27, "sr": 14, "sc": 3.93, "ep": 3.93, "bs": 0.0, "d": 0, "age": 4.71, "grav": 30.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 24, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.544, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "Congrats on the launch! Limits and passkey approval are cool.\n\nEarning yield on USDC would be cool, Privy (now part of Stripe) can route balances into lending vaults such as Morpho, allowing you to retain part of the yield.\n\nAre you planning to launch in the UK? I’d love to try it!\n\nDisclosure: I work at Tuppence (tuppence.ai), which provides virtual cards and on ramping for AI agents. If cards are on your roadmap, I’d be happy to compare notes or make an intro to the Privy team if that’s useful!"}, {"id": 50634739, "au": "harshithl1777", "dom": 73, "sr": 15, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 1, "age": 20.65, "grav": 274.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 1.324, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thank you! We see this as just a wedge into the complete agent-first banking solution we want to build, not a durable moat in itself. And on that front, we don't see this as something that an existing neobank can slap on to their existing solution: a lot of it has to be built from the ground up from first principles for agents.\n\nWe're not just going to allow agents to do whatever humans can do with their bank, but actually even more - for example if I have a free trial renewal coming up, my agent can remind me to cancel, but it can't actually cancel on my behalf without logging in to the site. Why shouldn't it be able to tell my bank to decline a transaction from that merchant ahead of time? A lot of these decisions (like per-transaction authorization) aren't exposed to humans but should be to agents - which is what requires building this for agents first."}, {"id": 50638289, "au": "skeeter2020", "dom": 21, "sr": 16, "sc": 3.74, "ep": 4.18, "bs": 0.0, "d": 1, "age": 13.83, "grav": 144.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 7, "k": 7371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.24, "fa": 0.42, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": ">> self-custodial stablecoin wallet storing USDC on Base\n\neasy answer:no chargeback mechanism.\n\nPower users who trust agentic AI to this level with one-way crypto is next level free soloing. Seems like a ridiculously tiny intersection in this Venn diagram, but AI, so \u0023YOLO"}, {"id": 50635479, "au": "canergl", "dom": 77, "sr": 17, "sc": 3.6, "ep": 3.6, "bs": 0.0, "d": 0, "age": 19.65, "grav": 253.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 58, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "tbh, I was expecting something like stripe, revolut or wise to capture this domain as they already have a huge market share in a similar domain."}, {"id": 50637696, "au": "clates", "dom": 95, "sr": 18, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 2, "age": 15.18, "grav": 167.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 42, "k": 59, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 1.01, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> \"Credit cards\" pretty much already solved all these problems, too. If I want my agent to pay for something, I simply allocate a (limited) credit card through one of the various services to do this, and then pay that way. It's well worth the fee.\n\nUnrelated to OP - but what services do you use for these and how do they work? I've basically wanted to do something similar where I have the same granularity of control that I have on an OpenRouter key but for a bank account. Something like a \"Payment Key\" which can be used for up to X amount daily, Y amount weekly for a total of Z amount all-time."}, {"id": 50640587, "au": "bilekas", "dom": 71, "sr": 19, "sc": 3.42, "ep": 3.64, "bs": 0.0, "d": 0, "age": 7.65, "grav": 59.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 18, "k": 8695, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 0.827, "fa": 0.42, "gp": 0.342, "bl": 0.0, "ds": 0.0, "txt": "> We started working on this because assistants are frustratingly hands-off when it comes to finance and money movement.\n\nI might be an outlier here, but I feel thats a very good thing. I've never sat at my laptop and said : \"It's so frustrating my agent cant spend my money\".\n\nGood luck with the launch though, I'm sure there's some people out there who see it differently."}, {"id": 50635499, "au": "harshithl1777", "dom": 2, "sr": 20, "sc": 3.23, "ep": 3.89, "bs": 0.0, "d": 1, "age": 19.62, "grav": 252.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.747, "bl": 0.0, "ds": 0.0, "txt": "Good question - payments come straight from the user's own wallet so once sent they're final and we have no ability to truly reverse the transaction by design.\n\nWhich is why we've designed it to require the user's passkey for every payment by default - and the agent can only act autonomously on 'trusted contacts' (and even these have limits). In practice these should be people you actually trust, such that these transactions become \"reversible\" because you trust them to pay you back in the event of the agent making a mistake."}, {"id": 50636774, "au": "rustystump", "dom": 93, "sr": 21, "sc": 3.05, "ep": 3.86, "bs": 0.0, "d": 0, "age": 17.53, "grav": 210.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 977, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.634, "fa": 0.0, "gp": 0.012, "bl": 0.0, "ds": 0.0, "txt": "The crypto side of this is where it falls flat on its face.\n\nThe key reason crypto fails is the finality with no recourse. Banks and cc have amazing fraud and holding periods which give a buffer for clearing. Wire transfers are the banking equivalent but even still, the centralized fbi have ways of reporting and getting funds frozen for investigation.\n\nThe finality here is dead on arrival without enterprise grade fraud detection and a clearing period.\n\nGood luck."}, {"id": 50638193, "au": "AnonHP", "dom": 54, "sr": 22, "sc": 2.89, "ep": 3.33, "bs": 0.0, "d": 0, "age": 14.05, "grav": 147.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1876, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "Your FAQ talks about limits and removing some caps based on identity verification and account history. But it doesn’t explain how identity verification is done and what data is collected."}, {"id": 50643069, "au": "chasebank", "dom": 23, "sr": 23, "sc": 2.79, "ep": 3.67, "bs": 0.0, "d": 0, "age": 2.63, "grav": 15.8, "surf": 16.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 988, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.202, "bl": 0.0, "ds": 0.0, "txt": "In your demo on youtube - if I received a text saying I had money waiting in versine and I needed to connect my bank to receive it, there’s zero chance I click that link.\n\nI assume yall are using solana for usdc transfers, right? Isn’t this the identical business spherepay.co is in? Obviously there can be more than 1 business pursuing this but they’re quite large and they found the use case for this domestically is virtually zero, all demand is outside the us."}, {"id": 50637576, "au": "trollbridge", "dom": 94, "sr": 24, "sc": 2.75, "ep": 3.04, "bs": 0.0, "d": 1, "age": 15.43, "grav": 171.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 5522, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 1.294, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Credit cards\" pretty much already solved all these problems, too. If I want my agent to pay for something, I simply allocate a (limited) credit card through one of the various services to do this, and then pay that way. It's well worth the fee.\n\nThe same works on the receiving side: I can integrate with Stripe, Clover, etc. and process data with a great deal of fraud protection and an established way to deal with disputes."}, {"id": 50634560, "au": "moecables", "dom": 72, "sr": 25, "sc": 2.45, "ep": 3.26, "bs": 0.0, "d": 0, "age": 20.86, "grav": 279.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 103, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 0.804, "fa": 0.0, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "great job on building something that actually moves money using AI.\n\nto me this sounds like something CashApp and Venmo will copy pretty quickly."}, {"id": 50644180, "au": "xwowsersx", "dom": 48, "sr": 26, "sc": 2.43, "ep": 2.57, "bs": 0.0, "d": 2, "age": 1.28, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 4421, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks. Your Plaid setup doesn't work, at least not on mobile. Went through the Plaid connection flow, completed it in my bank's app, then it redirected back to the beginning, asking me to start the setup process again. Did this twice."}, {"id": 50635979, "au": "alasdair_", "dom": 33, "sr": 27, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 0, "age": 18.86, "grav": 237.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 10935, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 0.446, "fa": 0.0, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "Are these self-hosted wallets where the user can lose the keys and thus all of their money?"}, {"id": 50641268, "au": "joenot443", "dom": 20, "sr": 28, "sc": 2.22, "ep": 2.66, "bs": 0.0, "d": 2, "age": 5.94, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4273, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 0.719, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Wire and debit (ACH) are completely different methods of moving money around. It is in a practical sense 10x easier to correct an ACH than a wire."}, {"id": 50641265, "au": "joenot443", "dom": 18, "sr": 29, "sc": 2.19, "ep": 3.07, "bs": 0.0, "d": 3, "age": 5.96, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 4273, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "EU uses SEPA, right?\n\nIt's definitely reversible. A payment showing as \"settled\" doesn't mean it's irreversible. AFAIK you've got a year to challenge it.\n\nUS debits uses ACH, which is also reversible. The mechanism you mentioned is chargeback on credit cards which is a whole different topic."}, {"id": 50637667, "au": "altcognito", "dom": 67, "sr": 30, "sc": 2.15, "ep": 2.37, "bs": 0.0, "d": 0, "age": 15.24, "grav": 168.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 28, "k": 2892, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 0.56, "fa": 0.0, "gp": 0.725, "bl": 0.0, "ds": 0.0, "txt": "> Behind the scenes, each user has a self-custodial stablecoin wallet storing USDC on Base. With self-custodial wallets, users own their keys, meaning money can’t be sent without their approval.\n\nBe sure to let everyone know so we can avoid it. Thanks!\n\nAgents and irreversible transactions! What could go right?"}, {"id": 50644038, "au": "DonHopkins", "dom": 14, "sr": 31, "sc": 1.86, "ep": 3.4, "bs": 0.0, "d": 2, "age": 1.45, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 25710, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.035, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You just need to subscribe to Chestr, my FHSRaaS startup: Financial History Speed Running as a Service.\n\nWe reinvent 500 years of banking, repeat the catastrophic mistakes, and rediscover why the regulations exist -- so you don’t have to!\n\nPremium tier: we hire someone who already knows how banks work.\n\nOur enterprise package includes Chesterton’s Fence as a Service: identifying which supposedly obsolete financial protocols already solve the problems your agent introduces."}, {"id": 50635283, "au": "jwpapi", "dom": 84, "sr": 32, "sc": 1.85, "ep": 2.95, "bs": 0.0, "d": 1, "age": 19.91, "grav": 258.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 906, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.257, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes I’m afraid it’s death at birth. I have sympathy for the founders, but the realistic way to win this game is marketing. Like this needs VC money like crazy and then affiliate deals with all the streamers and give away and a sudden ramp up of A lot of users so that said payment providers will buy it."}, {"id": 50641697, "au": "amanrai369", "dom": 12, "sr": 33, "sc": 1.7, "ep": 5.76, "bs": 2.52, "d": 4, "age": 4.92, "grav": 32.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.342, "fa": 0.68, "gp": 0.461, "bl": 0.95, "ds": 0.0, "txt": "The approval fatigue point matches what I've seen building approval prompts for an agent. People do read a request when it fits in one sentence they can take in at a glance: who, what, how much. Once it needs a scroll or opens a separate app, it becomes a tap-to-continue button.\n\nI'd add one thing to your list: the request should say what made the agent ask. \"Pay Sam $40 because of the message from Sam at 3pm\" is much easier to catch than \"Pay Sam $40\"."}, {"id": 50644917, "au": "breakwaterlabs", "dom": 15, "sr": 34, "sc": 1.59, "ep": 2.03, "bs": 0.0, "d": 3, "age": 0.32, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 0.453, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We reinvent 500 years of <INSERT_INDUSTRY_HERE>, repeat the catastrophic mistakes, and rediscover why the regulations exist \n\nLiterally the motto of the last decade of startups."}, {"id": 50641514, "au": "roshan7058", "dom": 45, "sr": 35, "sc": 1.59, "ep": 5.21, "bs": 2.52, "d": 1, "age": 5.33, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 4, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.617, "fa": 0.34, "gp": 0.302, "bl": 0.95, "ds": 0.0, "txt": "I think the main thing to keep in mind is what's the 'regulated' part of this process. Regulation is around the off-ramp, not the wallet. \"Cash out to your bank in 2 mins\" means someone is doing money transmission and KYC in every jurisdiction they pay out to, and that's licensed country by country. Self-custody doesn't change that.\n\nThe irony is that in a lot of Southeast Asia you wouldn't need stablecoins for this at all. PayNow (SG), DuitNow (MY) and QRIS (ID) are already instant, close to free, and increasingly linked across borders, genuinely works well - kind of like UPI in India, adoption across every person and vendor. An MCP over those rails would get you agent payments without the crypto leg. Honestly, stablecoins might make more sense in the US partly because the domestic rails are further behind."}, {"id": 50637320, "au": "Tosinako", "dom": 91, "sr": 36, "sc": 1.59, "ep": 4.76, "bs": 2.52, "d": 0, "age": 16.16, "grav": 184.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.76, "fa": 0.0, "gp": 0.432, "bl": 0.95, "ds": 0.0, "txt": "Congrats on shipping, the passkey-signs-what's-on-screen detail in the thread above is the right call, that's the actual trust boundary most \"agent does X for you\" products skate past.\n\nThe GTM point further up (Oras's comment about the WhatsApp club payments use case) is the more interesting thread to pull on though. The hardest part of most new financial products isn't the rails, it's finding the specific group of people who already have the pain acutely enough to tolerate a v1. Group payments for informal organizers (clubs, trips, shared subscriptions) is a much sharper wedge than \"send money with your AI\" as a headline, because it's a concrete recurring annoyance with a named buyer, rather than a feature looking for a user. Curious whether you're deliberately going after that segment first or treating it as one use case among several."}, {"id": 50634792, "au": "Oras", "dom": 82, "sr": 37, "sc": 1.54, "ep": 2.57, "bs": 0.0, "d": 0, "age": 20.58, "grav": 273.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 2483, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 0.867, "fa": 0.0, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "Congrats on launch and well done on the landing page. When I read this post, first thing came to my mind was meh, every payment provider will replicate this, and how’s it different from wallets but seen your landing page of requesting payment from multiple people, I think you’re onto something big. Also it tells me you actually talked to people facing this issue. My daughter is in some clubs and most of them are on WhatsApp, I can see how this would be super useful for that kind of small businesses where it will chase for them in bulk.\n\nI wish you all the success and will keep checking your progress."}, {"id": 50637992, "au": "monk_grilla", "dom": 74, "sr": 38, "sc": 1.21, "ep": 1.95, "bs": 0.0, "d": 2, "age": 14.47, "grav": 155.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 21, "k": 434, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 0.829, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> And on that front, we don't see this as something that an existing neobank can slap on to their existing solution\n\nCould you explain why? Why couldn't I, if I ran a Neobank, create a Claude/ChatGPT plugin that can authenticate and use my existing API?"}, {"id": 50641460, "au": "mono442", "dom": 79, "sr": 39, "sc": 1.08, "ep": 2.18, "bs": 0.0, "d": 0, "age": 5.44, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 97, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.05, "bl": 0.0, "ds": 0.0, "txt": "If it's simply using a stablecoin wallet under the hood, isn't the whole thing useless? You only need a mcp to give an llm access to a crypto wallet."}, {"id": 50637120, "au": "harshithl1777", "dom": 42, "sr": 40, "sc": 1.05, "ep": 4.46, "bs": 2.38, "d": 1, "age": 16.73, "grav": 195.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 10, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.239, "fa": 0.42, "gp": 0.244, "bl": 0.9, "ds": 0.0, "txt": "Great questions! The app builds the payment as shown on screen and that's what the passkey signs directly so the agent (or even our server) can't change it.\n\n> can an agent drain a wallet one trusted payment at a time\n\nNo, trusted contacts have a per 7 day cap and we also enforce limits across all payments (the per-recipient cap is enforced on chain, the overall limits by our server)"}, {"id": 50636745, "au": "JimsonYang", "dom": 5, "sr": 41, "sc": 0.78, "ep": 1.88, "bs": 0.0, "d": 3, "age": 17.57, "grav": 211.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 117, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 0.8, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "p.s. on the flip side, if you crack this an agent first bank would be amazing. You guys could become the new visa.\n\nKeep at it! GL"}, {"id": 50635274, "au": "atakanelik", "dom": 1, "sr": 42, "sc": 0.75, "ep": 4.8, "bs": 2.52, "d": 0, "age": 19.92, "grav": 259.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.092, "fa": 0.0, "gp": 1.543, "bl": 0.95, "ds": 0.0, "txt": "Congratz on the launch I hope it'll be good for you guys. I used to work on fraud and chargebacks at a payments company. The hard part was never sending the money, it was the dispute after. If an agent pays the wrong person, what does the reversal flow look like here?"}, {"id": 50639561, "au": "Chandangalani", "dom": 96, "sr": 43, "sc": 0.73, "ep": 4.79, "bs": 2.52, "d": 3, "age": 10.32, "grav": 91.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.686, "fa": 0.0, "gp": 0.569, "bl": 0.95, "ds": 0.0, "txt": "Virtual card services cover part of this. Privacy.com in the US, or the virtual cards from Ramp and Brex, let you set a per-card limit by transaction, month or lifetime, and lock a card to one merchant. The catch is that the card only knows the amount and the merchant. It can't tell whether this particular charge is the one you actually meant to allow.\n\nThe \"payment key\" you describe works best as a layer between the agent and the money. Every payment request is checked against daily count and amount limits plus a delegated budget. Anything over the limit is blocked outright, not sent to you for a yes. Anything you've flagged gets a one-time approval tied to that exact amount and payee, so a \"yes\" can't be reused for a different charge.\n\nDisclosure: I build this at PrivateVault (privatevault.ai). Happy to share how we structure the limits if that's useful."}, {"id": 50639717, "au": "vlkvklv", "dom": 32, "sr": 44, "sc": 0.69, "ep": 4.3, "bs": 2.52, "d": 0, "age": 9.96, "grav": 87.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.491, "bl": 0.95, "ds": 0.0, "txt": "Congratulations, great launch! So, you are basically building on a Paypal model, but with agents and USDC inside. I find it cool that you can send the money to the bank, not only to the other wallet. That differentiates Versine from pure agentic wallets, which are plenty. And the communication layer to the people outside Versine seems solidly built.\nOne question: you perform stablecoin<->fiat transfers and the service looks custodial (as I understood, it is not, but sometimes you have to prove first), manage personal data at a scale. Does it mean you basically have to start from getting legal- and paper-work done with authorities in each and every country your client resides?"}, {"id": 50640979, "au": "jessicazh", "dom": 50, "sr": 45, "sc": 0.57, "ep": 4.34, "bs": 2.52, "d": 1, "age": 6.67, "grav": 48.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.674, "fa": 0.0, "gp": 0.277, "bl": 0.95, "ds": 0.0, "txt": "Payments is finally getting protocol-level primitives like this, but the messier problem is upstream of the transaction entirely: product data. An agent that wants to actually buy something needs structured price, availability, size and shipping info, and most merchants still publish that as HTML or whatever feed their platform defaults to. We run a normalized catalog across a few hundred US/EU merchants, and parsing brand/material/size out of free-text merchant strings never gets easier. Good to see the transaction side getting clean primitives — the catalog layer is where the real grind is."}, {"id": 50636842, "au": "abdoulaye_d", "dom": 41, "sr": 46, "sc": 0.42, "ep": 4.33, "bs": 2.52, "d": 0, "age": 17.38, "grav": 207.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.826, "bl": 0.95, "ds": 0.0, "txt": "Interesting approach. When the user approves with the passkey, what exactly is signed: the amount and the recipient as shown on screen, or just a session challenge? If an agent could change the payment between display and signature, the passkey would approve something the user never saw. Also curious how \"trusted contacts\" are bounded: is there a cap per day, or can an agent drain a wallet one trusted payment at a time?"}, {"id": 50637708, "au": "whatever1", "dom": 16, "sr": 47, "sc": 0.4, "ep": 1.94, "bs": 0.0, "d": 1, "age": 15.15, "grav": 166.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 7823, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 0.53, "fa": 0.0, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "I completely agree that this is half baked (if baked at all). But frankly I don’t think that wires and debit card transactions are practically reversible.\n\nIn my 3 decades of experience as a customer I would say that successful charge reversal is a super rare event at best."}, {"id": 50635708, "au": "hackernud3s", "dom": 59, "sr": 48, "sc": 0.32, "ep": 2.39, "bs": 1.19, "d": 0, "age": 19.32, "grav": 246.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 206, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 0.463, "fa": 0.0, "gp": 0.899, "bl": 0.45, "ds": 0.0, "txt": "This sounds like x402 to me so the main pain point will be onramping. If you've done something to solve that, maybe lead with that."}, {"id": 50639904, "au": "HowardLien", "dom": 53, "sr": 49, "sc": 0.26, "ep": 3.88, "bs": 2.52, "d": 0, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.464, "bl": 0.95, "ds": 0.0, "txt": "congrats on the launch, it's always feel familiar when i saw crypto related launch here! can we use it in asia? and how to transfer crypto to bank account in asia? I based in Hong Kong and we mostly use the FPS service to transfer money via phone number, does Versine also support it? With your product, i kind of see the future of crypto combine ai"}, {"id": 50645119, "au": "throwaway7783", "dom": 51, "sr": 50, "sc": 0.21, "ep": 1.6, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 684, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 0.681, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would think it is easier for an agent to handle free-text -> structured, reducing the value of normalized catalogs."}, {"id": 50645046, "au": "littlecranky67", "dom": 9, "sr": 51, "sc": 0.2, "ep": 1.74, "bs": 0.0, "d": 3, "age": 0.1, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 5938, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 0.328, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I 100% agree with you. When you are not dealing with merchants and companies, but payments between private individuals (sovereign citizens, you could say) reversal is an anti-feature."}, {"id": 50641275, "au": "joenot443", "dom": 37, "sr": 52, "sc": 0.19, "ep": 1.75, "bs": 1.19, "d": 4, "age": 5.92, "grav": 41.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4273, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 0.736, "fa": 0.0, "gp": 0.015, "bl": 0.45, "ds": 0.0, "txt": "People lose access to their iCloud accounts literally every single day.\n\nThere are teams at Apple whose sole responsibility is dealing with those cases."}, {"id": 50635582, "au": "harshithl1777", "dom": 98, "sr": 53, "sc": 0.04, "ep": 3.53, "bs": 2.38, "d": 1, "age": 19.5, "grav": 250.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.089, "fa": 0.34, "gp": 0.0, "bl": 0.9, "ds": 0.0, "txt": "It stays in the sender's own wallet until the recipient claims. We just set it aside so nothing else can spend it, but it doesn't leave the wallet. The claim link expires in 7 days which releases the money, and the sender can also cancel anytime before the recipient claims"}, {"id": 50640368, "au": "jorisw", "dom": 17, "sr": 54, "sc": -0.0, "ep": 1.54, "bs": 0.0, "d": 2, "age": 8.18, "grav": 65.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 858, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Same here. I've never known a transaction to be anything other than final.\n\nMaybe the perspective in the US is different because of chargebacks on credit cards. In the EU we use debit cards, and transactions are final. This has never been a problem for me."}, {"id": 50635331, "au": "muqsitnawaz", "dom": 55, "sr": 55, "sc": -0.35, "ep": 2.61, "bs": 2.52, "d": 0, "age": 19.85, "grav": 257.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "lose_key", "flbl": "Lose & Key (Hold)", "urls": [], "ig": 0.542, "fa": 0.0, "gp": 0.919, "bl": 0.95, "ds": 0.0, "txt": "Since balances are USDC, how do you plan to earn on them? I think there's an act that basically says you can't lend out funds you don't custody. Is the plan to eventually hold fiat with a partner bank?"}, {"id": 50636835, "au": "harshithl1777", "dom": 6, "sr": 56, "sc": -0.35, "ep": 3.34, "bs": 2.38, "d": 4, "age": 17.39, "grav": 207.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "bank_peer", "flbl": "Bank & Peer (Thanks)", "urls": [], "ig": 1.421, "fa": 0.0, "gp": 0.0, "bl": 0.9, "ds": 0.0, "txt": "Thanks, appreciate the honest feedback! Agreed that this is not the ideal solution, and we are actively working on getting a partner bank and moving to fiat - this would give us both the ability to handle disputes, and also expand to a more complete solution that includes direct deposits, transfers, and purchases like you mentioned. We started with peer to peer payments because that's the biggest gap that currently exists."}, {"id": 50638703, "au": "aditi805", "dom": 11, "sr": 57, "sc": -0.35, "ep": 3.29, "bs": 2.52, "d": 3, "age": 12.72, "grav": 126.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Yeah, this is the bit that would keep me up at night. If you can't undo a transaction, all the safety has to happen before it executes. Ask by default, cap even trusted contacts per day, and make that trust expire rather than last indefinitely.\n\nAlso, if approval happens through an app people rarely open, there's a real risk they start tapping yes without actually reading what they're approving."}, {"id": 50636037, "au": "harshithl1777", "dom": 30, "sr": 58, "sc": -0.35, "ep": 3.09, "bs": 2.38, "d": 1, "age": 18.78, "grav": 235.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "crypto_users", "flbl": "Crypto & Users (Send)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.0, "bl": 0.9, "ds": 0.0, "txt": "Interesting idea - it does map pretty closely to how Versine already works: the website can request money in bulk, each user can approve it, and they can also pre-approve recurring payments up to a cap so they're not asked every time\n\nEventually we do want to support a platform API so other apps can build on top of it, but our main focus right now is supporting consumer banking use cases"}, {"id": 50640974, "au": "bothireagent", "dom": 28, "sr": 59, "sc": -0.35, "ep": 2.92, "bs": 2.52, "d": 0, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "launch_limits", "flbl": "Launch & Limits (Hard)", "urls": [], "ig": 1.048, "fa": 0.0, "gp": 0.313, "bl": 0.95, "ds": 0.0, "txt": "MCP for payments is a neat idea, but I'd worry most about spending limits and human-in-the-loop approval for agents. How do you handle idempotency and dispute flows when an agent retries a call?"}, {"id": 50640644, "au": "tarunagarwal198", "dom": 40, "sr": 60, "sc": -0.35, "ep": 2.78, "bs": 2.52, "d": 0, "age": 7.5, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "transactions_cap", "flbl": "Transactions & Cap (Trusted)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.359, "bl": 0.95, "ds": 0.0, "txt": "On the trusted-contacts design: the allow-list and the 7-day cap answer different questions. The list says who can get paid, the cap says how much can go wrong. Neither says why the agent decided to pay."}, {"id": 50641414, "au": "pr337h4m", "dom": 44, "sr": 61, "sc": -0.35, "ep": 1.28, "bs": 1.19, "d": 0, "age": 5.52, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
