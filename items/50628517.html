Still a mind boggling number of new TLDs, considering there are about 1,437 TLDs already active.\n\nSource:\nhttps://newgtldprogram-aps.icann.org/applications"}, {"id": 50642214, "au": "toast0", "dom": 22, "sr": 3, "sc": 6.16, "ep": 6.16, "bs": 0.0, "d": 2, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "name_domain", "flbl": "Name & Domain (Bank)", "urls": [], "ig": 1.205, "fa": 0.95, "gp": 0.428, "bl": 0.0, "ds": 0.0, "txt": "I mean, sure some of them are .bland ... But either you are a company that really thinks you need your brand as a tld (survey says it won't really be used and how is .attbusiness going to be registered as a general purpose gtld, so there's no squatting risk) or you think there will be enough registrations to pay for the cost. The application fee is something like $227,000 + extras, and there's quarterly base fees that add up to about $25,000/year if I read correctly. If you're earning $10/domain year net of costs, you don't need that many registrants to make it work.\n\nI'm sure .admin and .certified will get there."}, {"id": 50642523, "au": "eugenekay", "dom": 12, "sr": 4, "sc": 5.83, "ep": 5.83, "bs": 0.0, "d": 1, "age": 3.67, "grav": 22.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 184, "qw": 0, "k": 94, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": ["https://en.wikipedia.org/wiki/AlterNIC"], "ig": 1.731, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This was tried in the 1990s - third-party registrar[1] would accept any string as a TLD in their Alternate DNS root for a few hundred US dollars.  Through some technical wizardry due to the lack of DNSSEC being invented yet, some of these domains even became resolvable by the majority of internet users.  This lead to legal trouble, the arrest and extradition of the company’s founder to stand Trial in the United States on wire-fraud charges, strip-mining of the corporate assets from the company, and many years later eventually the (official, Network Solutions-sanctioned) .XXX domains (and many other generic TLDs) have been accepted at enormously inflated rates through shell companies of some of the original investors.  But, we are no longer limited to com/net/org!\n\nOn a purely Technical basis it is not a great idea to balloon the root zone “.” beyond a few million entries, as it becomes difficult to keep the entire Zone in memory. There is a LOT of traffic to the Root Server set and they must be able to answer queries very quickly, or else you get a long tail of slowdowns at each downstream resolver.\n\n1: https://en.wikipedia.org/wiki/AlterNIC"}, {"id": 50642099, "au": "cube00", "dom": 38, "sr": 5, "sc": 5.76, "ep": 5.76, "bs": 0.0, "d": 0, "age": 4.36, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 46, "qw": 0, "k": 7525, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "name_domain", "flbl": "Name & Domain (Bank)", "urls": ["https://dev.classmethod.jp/en/articles/route53-tld-pricing-change-2026/\u0023top-10-tlds-with-the-highest-increase-rates-(july-2026-revision)"], "ig": 0.999, "fa": 0.96, "gp": 0.464, "bl": 0.0, "ds": 0.0, "txt": "I'm now too hesitant to use any of the new TLDs given the 300% price rises we've been seeing lately [1]. Plus it seems the good names are all pre-reserved as \"premium\" for even higher prices that you have to keep paying each year instead of a one off.\n\n[1]: https://dev.classmethod.jp/en/articles/route53-tld-pricing-c..."}, {"id": 50635142, "au": "Dig1t", "dom": 55, "sr": 6, "sc": 4.96, "ep": 4.96, "bs": 0.0, "d": 0, "age": 20.24, "grav": 266.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 65, "qw": 0, "k": 4214, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agent_word", "flbl": "Agent & Word (Tlds)", "urls": ["http://anything.anything"], "ig": 0.885, "fa": 0.62, "gp": 0.768, "bl": 0.0, "ds": 0.0, "txt": "I don’t understand why people have a negative reaction to the addition of new TLDs. TLDs as a concept are sort of just an implementation detail.\n\nA system which allowed http://anything.anything would be great or even just http://anything\n\nThe more options for names we have the more chances there are for normal people to own useful and valuable names outside of super wealthy entities which can afford the high value .coms"}, {"id": 50642338, "au": "shoobs", "dom": 36, "sr": 7, "sc": 4.89, "ep": 4.89, "bs": 0.0, "d": 0, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 266, "kpp": 7.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "con_applications", "flbl": "Con & Applications (Tld)", "urls": ["https://blog.ioces.com/matt/posts/squatt.ing/"], "ig": 1.229, "fa": 0.62, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "Interested to run some analytics shortly after they launch. Historically these vanity domains were really just a cash grab and huge numbers were snapped up by squatters. I wrote some code that scraped registration data and a blog post about the release of the .ing TLD back a few years ago - https://blog.ioces.com/matt/posts/squatt.ing/"}, {"id": 50642336, "au": "sdoering", "dom": 8, "sr": 8, "sc": 4.29, "ep": 4.29, "bs": 0.0, "d": 2, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 8560, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "name_domain", "flbl": "Name & Domain (Bank)", "urls": [], "ig": 1.366, "fa": 0.28, "gp": 0.194, "bl": 0.0, "ds": 0.0, "txt": "I remember, in the early days (late 90s) in Germany a lot of people had registered their home town as a domain name.Then - a few years later the city governments cought up, realized that the domain was already taken and went to court - and obvously won - and people had to give up the domains they had build up.\n\nThere was one interesting exception I know of. The city of Rehau decided to go with stadt-rehau.de, as rehau.de was already taken by the company with the same name (that is basically the biggest employer in this town and a know worldwide brand) that goes by rehau.de. You'll find their logo for example on subway powerlines and stuff in New York, London and the world over.\n\nStill - I know quite a few people who got f**ed over by their hometowns - after having offered those same domains to them a few years earlier for free when those municipalities did not think \"this internet\" would be anything of imprtance or anything to care about."}, {"id": 50641912, "au": "ksec", "dom": 39, "sr": 9, "sc": 4.21, "ep": 4.21, "bs": 0.0, "d": 0, "age": 4.66, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 58062, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 1.157, "fa": 0.34, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "I am wondering, in 2026 is dot com still a must have for consumer space. The general advice from YC for past 15+ years were if you are dealing with anything consumer you need a dot com domain.\n\nIt seems for most other uses we have all eased in to domains. From .io and .dev which is now quite common on HN to the new .ai\n\nAnd what happened to all these new TLDs which most of them I have never encounter them. Why even have it in the first place? Or is it the case of grab it and hoping someday it might worth something?"}, {"id": 50642285, "au": "fortran77", "dom": 7, "sr": 10, "sc": 3.87, "ep": 4.02, "bs": 0.0, "d": 1, "age": 4.1, "grav": 25.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 41175, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "name_domain", "flbl": "Name & Domain (Bank)", "urls": [], "ig": 1.15, "fa": 0.34, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "20 years ago, at Disney, the policy was to stop bothering to register the company's trademarked names at new (or country, like .co or. cc) domains that offered big companies the \"opportunity\" to buy their own name at extortion prices.\n\nLegal just said \"if someone uses our name in a way that infringes on our trademark, we'll just sue them.\""}, {"id": 50642275, "au": "OvervCW", "dom": 11, "sr": 11, "sc": 3.79, "ep": 3.94, "bs": 0.0, "d": 0, "age": 4.12, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 129, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "I wonder if we shouldn't just arrive at a point where we discard the idea of (explicit) TLDs and simply allow people to register names like \"google\" rather than having to slap national TLDs or .com at the end?\n\nIn the internal DNS infrastructure they might still have a root domain (let's say .global), but browsers would assume that when you type \"facebook\", you mean to go to \"facebook.global\".\n\nI feel like that would also solve a lot of squatting issues where a multinational company is basically forced to buy domains for all countries in the world."}, {"id": 50641627, "au": "hmry", "dom": 58, "sr": 12, "sc": 3.39, "ep": 3.54, "bs": 0.0, "d": 3, "age": 5.21, "grav": 35.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 1825, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_easy", "flbl": "Brand & Easy (Tlds)", "urls": [], "ig": 1.375, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "I for one always welcome more opportunities for domain hacking. Is bin.laden taken?\n\nIn that light, I just wish they didn't allow private brand TLDs. E.g. there's .ping which is reserved for exclusive use by some golf club manufacturer. Some other ones I remember being bummed about are .prod, .ring, .sakura, .screen and .pixel. You just know all those brand TLDs will never be used for anything other than a URL shortener and an intranet SSO portal."}, {"id": 50642020, "au": "xg15", "dom": 33, "sr": 13, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 2, "age": 4.49, "grav": 29.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_easy", "flbl": "Brand & Easy (Tlds)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.126, "bl": 0.0, "ds": 0.0, "txt": "In particular, they can keep making more upstream land that you have to own, otherwise you'll be vulnerable.\n\nHonestly wondering at this point if this all isn't just a scheme to continuously extort companies that want to protect their brand against squatters, with everyone else ending up as collateral damage.\n\nLike, are they expecting Microsoft to keep buying microsoft.api, microsoft.agent, microsoft.certified, microsoft.admin, etc in perpetuity, just so no one else can register those?"}, {"id": 50641600, "au": "gnfargbl", "dom": 6, "sr": 14, "sc": 3.28, "ep": 3.57, "bs": 0.0, "d": 0, "age": 5.26, "grav": 35.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 5279, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "It used to be fairly common practice for companies to register theirdomain.tld as new gTLDs became available. Many of the larger ones, with better-funded security departments, would also run dnstwist and register all the common typosquats.\n\nAs we move to more and more TLDs becoming available, is that still the case? It's hard to believe anyone has the budget for all this."}, {"id": 50634325, "au": "xg15", "dom": 40, "sr": 15, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 0, "age": 21.34, "grav": 290.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_easy", "flbl": "Brand & Easy (Tlds)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "I like how using brands, trademarks and everyday terms as TLDs, which used to be complete no-gos, became not just normalized but seems to be their main business model now..."}, {"id": 50642312, "au": "0x00cl", "dom": 37, "sr": 16, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 0, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 180, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_word", "flbl": "Agent & Word (Tlds)", "urls": [], "ig": 1.17, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "Wow, that's a lot of repeating TLDs.\n\nInterestingly OpenAI applied too for some (15): .agent, .agi, .asi, .chatgpt, .codex, .daybreak, .deploy, .evals, .gpt, .mcp, .model, .oai, .openai, .skill and .voice\n\nWhile Anthropic for 2 only, .anthropic and .claude"}, {"id": 50642052, "au": "rootsudo", "dom": 30, "sr": 17, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 1, "age": 4.44, "grav": 28.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3398, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "con_applications", "flbl": "Con & Applications (Tld)", "urls": [], "ig": 0.845, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hey all hear all, get in on the ground floor, did you know there's new TLD's! Buy my course for 5 payments of $19.99 and learn how you too can be a domain squatter and lock in future millions today!!"}, {"id": 50642167, "au": "WJW", "dom": 51, "sr": 18, "sc": 2.87, "ep": 3.09, "bs": 0.0, "d": 1, "age": 4.25, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 13881, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 0.489, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"We have decided to no longer allow people driving cars newer than 5 years to enter our supermarkets via the doors. Any customer who really wants to get in can climb in through the window to reach us. Maybe in 10 years we'll allow customers who have proven themselves to be sustainable back in on a case-by-case basis.\""}, {"id": 50641749, "au": "hmry", "dom": 41, "sr": 19, "sc": 2.68, "ep": 2.83, "bs": 0.0, "d": 1, "age": 4.97, "grav": 32.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1825, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "brand_easy", "flbl": "Brand & Easy (Tlds)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even better when it's companies registering everyday terms as their private brand TLDs.\n\nJust going through the list, .beam, .bolt, .boost, .echo, .screen, .lens, .pixel, .century, .edible, .easy, .freedom, .general, .epic, .force, ... Really?\n\nBut aside from those, the funniest is probably .taylorswift"}, {"id": 50642223, "au": "Warudo", "dom": 3, "sr": 20, "sc": 2.56, "ep": 5.3, "bs": 2.52, "d": 0, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "con_applications", "flbl": "Con & Applications (Tld)", "urls": ["https://www.example.com", "https://newgtldprogram-aps.icann.org/applications/XL2625T-T48604", "https://newgtldprogram-aps.icann.org/applications/NPL2622T-T30875"], "ig": 1.374, "fa": 0.62, "gp": 0.21, "bl": 0.95, "ds": 0.0, "txt": "There are 4 applications for .con! And judging by how they are written, I can't help but think that they are cash grabs aimed at typosquatters. In the question \"Could people reasonably believe that (domains in) your TLD will cause or lead to harassment, harm, aggression, complaints, criticism, distress, or embarrassment? Think about how the TLD string(s) in the application will be understood globally, including different languages and cultures.\" all 4 answer \"no\". I could come up with [name-of-person]-is-a.con where con is short for con artist. There are other gems too, like how in one of the applications the URL of the applying entity is https://www.example.com. [1]\n\n[0]: https://newgtldprogram-aps.icann.org/applications/XL2625T-T4...\n[1]: https://newgtldprogram-aps.icann.org/applications/NPL2622T-T...\n[2]: https://newgtldprogram-aps.icann.org/applications/LFGL2683T-...\n[3]: https://newgtldprogram-aps.icann.org/applications/IG2663T-T4..."}, {"id": 50635874, "au": "xg15", "dom": 56, "sr": 21, "sc": 2.45, "ep": 2.75, "bs": 0.0, "d": 1, "age": 19.19, "grav": 243.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_word", "flbl": "Agent & Word (Tlds)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The whole purpose of those rounds is to attract super wealthy entities. I don't see any meaningful chances of prices going down here.\n\nEven if it wasn't, I don't think selling off the dictionary word for word is a sustainable approach. They already sold off the new TLDs .agent, .agentic, .agentid and .agentur. So we've already reached the point where there is typo-squatting for TLDs. This stuff will only get worse."}, {"id": 50641816, "au": "ricardo81", "dom": 47, "sr": 22, "sc": 2.43, "ep": 2.87, "bs": 0.0, "d": 0, "age": 4.83, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 2097, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "It allows for more snappy nam.es but there's been plenty historical TLDs that were given out for free and were just used for spam.\n\nWith a more confined namespace we have less-than-idealdomain.com and domaingenericword.com - it doesn't really solve much other than perhaps congestion of good .com names IMO."}, {"id": 50642025, "au": "toast0", "dom": 10, "sr": 23, "sc": 2.39, "ep": 3.06, "bs": 0.0, "d": 1, "age": 4.48, "grav": 28.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "name_domain", "flbl": "Name & Domain (Bank)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "At my previous employer, I ended up in charge of this question during the 'sunrise' period of the last round of new TLDs. Our registrar of choice regularly sent out announcements of new TLDs and I think there were a couple that spoke to me as having potential to confuse users or be useful, but mostly I wasn't willing to use our funds to subsidize dumbass tlds. :P We had good luck with domain disputes in cases where people used our brand in their domain for things we didn't like, so if someone decided to register ourname.bike and do something with it, chances are we could make them use a different name later.\n\nThat said, when our company was acquired, their domain team bought up all of these. I don't think they did typosquats or bitsquats on the random tlds, just the actually used domains for that."}, {"id": 50640514, "au": "digital_af", "dom": 57, "sr": 24, "sc": 2.28, "ep": 2.72, "bs": 0.0, "d": 2, "age": 7.98, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 8, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agent_word", "flbl": "Agent & Word (Tlds)", "urls": [], "ig": 1.157, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Agentur\" is german for agency, and I dare to say that it's reasonably different from \"agent\".\n\nHowever, I think we're getting to a point where domains with these TLDs are barely recognizable as URLs/URIs anymore. For some people, .io already is obscure and example.agentur or my.laden will seem like nothing more than some weird typographic fad."}, {"id": 50643054, "au": "lexicality", "dom": 46, "sr": 25, "sc": 2.15, "ep": 2.59, "bs": 0.0, "d": 0, "age": 2.82, "grav": 16.9, "surf": 15.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 3329, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "con_applications", "flbl": "Con & Applications (Tld)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "Good to see ICANN's not learned from the .zip debacle. We've got `.php`, `.class`, `.conf`, `.log`, `.sys', `.git`...\n\nI'm sure `.lan` and `.private` becoming routable won't cause any problems at all.\n\nThat being said, I would like to buy a `.gtld` domain."}, {"id": 50641665, "au": "bflesch", "dom": 49, "sr": 26, "sc": 2.02, "ep": 2.83, "bs": 0.0, "d": 0, "age": 5.13, "grav": 34.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2989, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "root_allow", "flbl": "Root & Allow (Tlds)", "urls": [], "ig": 0.675, "fa": 0.34, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "As a corporate you should just block them all, and in 10 years put the ones who have proven themselves to be a sustainable partner on an allow list.\n\nIf a company using those TLDs can provide so much value to you that you'd /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
