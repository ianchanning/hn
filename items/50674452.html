, "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.384, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Proprietary software wants you to think it doesn't come with a warranty but most of it does. That clause on free software is only legal because you didn't pay for it."}, {"id": 50675885, "au": "lnxsxu", "dom": 107, "sr": 97, "sc": 0.73, "ep": 3.25, "bs": 2.52, "d": 0, "age": 7.79, "grav": 60.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.736, "fa": 0.0, "gp": 1.048, "bl": 0.95, "ds": 0.0, "txt": "i’d like to think the little (..] on the line about being swamped is there on purpose. a small easter egg for the readers who’ve been spotting things like that in his books for years."}, {"id": 50676217, "au": "amzok", "dom": 126, "sr": 98, "sc": 0.63, "ep": 3.15, "bs": 2.52, "d": 1, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 2, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.274, "fa": 0.0, "gp": 0.108, "bl": 0.95, "ds": 0.0, "txt": "No, if you read carefully, he means that multiple people report the same errors that have not yet been \"officially\" acknowledged in the errata. This is an honest issue on both sides. People find unreported errors and report them, Knuth didn't yet have time to implement them and update the errata. (He would normally do it in batches spanning many years.) He says when he gets around to do that, everything will resume."}, {"id": 50678781, "au": "hedora", "dom": 74, "sr": 99, "sc": 0.39, "ep": 1.58, "bs": 1.19, "d": 3, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 26331, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.672, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Imagine what libraries would be if legal incentives and copyright laws were not completely opposed to the public good."}, {"id": 50678851, "au": "perching_aix", "dom": 65, "sr": 100, "sc": 0.29, "ep": 1.14, "bs": 0.85, "d": 4, "age": 0.78, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.484, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "so this is not about open source at all then.\n\nhe has a business and it is in his business interest to keep fixing vulnerabilities, or he (rightfully!) goes out of business.\n\ngood luck to him, running a business is hard. beyond that though, this is as expected then? this is why, among others, running a business is hard."}, {"id": 50676087, "au": "tannertech", "dom": 53, "sr": 101, "sc": 0.13, "ep": 1.32, "bs": 1.19, "d": 3, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 56, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.562, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Dont use this guys software, yes you must fix bugs reported in your product or abandon it. Fixing bugs involves triage."}, {"id": 50678151, "au": "NanoCoaster", "dom": 4, "sr": 102, "sc": 0.07, "ep": 1.26, "bs": 1.19, "d": 2, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 88, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.355, "fa
