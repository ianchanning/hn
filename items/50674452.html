see why they wouldn't be. I have a book on tariffs and free trade from 1885 (or there about). It explains in detail why Trumps policies are absolute nonsense, destructive and will benefit monopolies and hurt the American people. That is a 140 year old book which contains knowledge many people still lack.\n\nIf anything more people needs to start reading and questioning where knowledge comes from, because it sure as hell isn't a YouTube Short made with AI and \"fun fact\" from Reddit.\n\nIf you're thinking software development, my \"Learning Perl\" book is 30 years old next year. I used it to learn Perl last year. The second edition of \"The C programming language\" is turning 40 in 2028. It's still a good start, it won't teach you modern C programming, but if you want to learn why C is the way it is, and by extension why Rust is the way it is, it a fair start."}, {"id": 50678182, "au": "svara", "dom": 18, "sr": 3, "sc": 7.24, "ep": 7.24, "bs": 0.0, "d": 7, "age": 1.91, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 15, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.933, "fa": 0.42, "gp": 1.037, "bl": 0.0, "ds": 0.0, "txt": "> what are the other components of capability\n\nEnergy efficiency; domain-specific knowledge, experience and training; biography, identity and social standing.\n\n> why do you think AI couldn't subsume them?\n\nI mostly don't think it can't (in principle). My point is there is a broad spectrum of capabilities, and intelligence has very high return in some of them and less of a return in others. Once you're smart enough to master tic tac toe, getting smarter won't help any more. I believe a large number of tasks have that property; the ceiling is task dependent, the exact scaling relationship is task dependent.\n\nSo my optimistic take is this: The human capability profile, and human's preferred access to certain ingredients of capability, will for a long time to come be a great match for specific valuable niches. We'll use tool-shaped, not artificial human-shaped, ASI where the capability returns on intelligence are really high.\n\nThat's why it bugs me when people talk about AI like they want to build artificial humans. It's a deeply inhumane R&D project, and, I really hope, flawed."}, {"id": 50678432, "au": "simonebrunozzi", "dom": 120, "sr": 4, "sc": 7.01, "ep": 7.01, "bs": 0.0, "d": 0, "age": 1.48, "grav": 9.4, "surf": 6.9, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 0, "k": 35701, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": ["https://news.ycombinator.com/item?id=50037180"], "ig": 1.34, "fa": 0.96, "gp": 0.774, "bl": 0.0, "ds": 0.0, "txt": "\"True AGI will arrive when an LLM will be able to provide ALL remaining mistakes in Donald Knuth's books. And kill one more amazing thing in the process.\"\n\nFrom my own comment, 48 days ago [0]. Please note that I was being sarcastic in the first part of the comment, if it's not clear.\n\nAnd instead, I was, sadly, very serious in the second sentence.\n\n[0]: https://news.ycombinator.com/item?id=50037180"}, {"id": 50678008, "au": "27183", "dom": 64, "sr": 5, "sc": 6.52, "ep": 6.52, "bs": 0.0, "d": 4, "age": 2.24, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 22, "k": 368, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.669, "fa": 0.42, "gp": 0.966, "bl": 0.0, "ds": 0.0, "txt": "> If the project is perceived as abandonware, his customers look for other projects to deliver their solution and his business dries up.\n\nI'm not sure the OSS project's openness necessarily confers this image of \"non-abandonedness\". If you have an issue tracker full of bot spam, and a deluge of open slop PRs, what does that tell anyone exactly? Customers are buying the software. If the \"community\" reinforces that software and makes it better, great! If the \"community\" is a drag on that software, then I suspect the customers will want it gone ASAP.\n\nPersonally it would be a big red flag for me to see a maintainer of something I'm paying for wasting their time triaging garbage issues and PRs. That's not productive work. I'd be much more encouraged by them blocking those kinds of \"contributions\" and focusing on their customers.\n\n[edit] That is to say, I think Knuth has done exactly the right thing[1]: he's prioritizing the quality of his work and the experience of his readers over the noise of a mob trying to score some internet points. If that means making the project less open, so be it.\n\n[1] This should come as no surprise, he does that as a matter of routine."}, {"id": 50677111, "au": "svara", "dom": 14, "sr": 6, "sc": 6.41, "ep": 6.55, "bs": 0.0, "d": 3, "age": 3.72, "grav": 23.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.725, "fa": 0.28, "gp": 1.174, "bl": 0.0, "ds": 0.0, "txt": "You're making a bunch of assumptions going from LLMs to that dystopian vision. A lot of people are.\n\nHumans have considerable agency in what future they create, they are building it deliberately.\n\nThe idea that technology somehow emerges inevitably along predetermined patterns is dangerous, in that it absolves people of any responsibility.\n\nThe framing of AI as a \"country of geniuses in a data center\", for example, strikes me as terribly irresponsible.\n\nWhy the hell would you want to build a foreign country, populated by artificial subjects? A country, by definition, is an entity looking out for its own interest.\n\nThat's the picture that that metaphor is painting.\n\nWe need better metaphors for what kind of AI we would want to build. I like to think of intelligence on tap, intelligence as a utility.\n\nI think that makes it much easier to imagine how this could be incredibly beneficial."}, {"id": 50676133, "au": "torben-friis", "dom": 92, "sr": 7, "sc": 6.4, "ep": 6.55, "bs": 0.0, "d": 1, "age": 6.9, "grav": 51.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 12192, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.278, "fa": 0.62, "gp": 1.229, "bl": 0.0, "ds": 0.0, "txt": "Probably  one of the worst things about our branch of engineering is how little it lasts. I'm still not close to 40 and 90% of the work I've done for previous companies is already not there - even the companies themselves, in some cases.\n\nI could have more lasting impact piling up bricks in a town.\n\nThen again, time is not necessarily a proxy for value. Our lives would suck without clean streets for example."}, {"id": 50676631, "au": "dilap", "dom": 76, "sr": 8, "sc": 6.39, "ep": 6.39, "bs": 0.0, "d": 1, "age": 5.07, "grav": 33.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 8831, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.429, "fa": 0.68, "gp": 0.752, "bl": 0.0, "ds": 0.0, "txt": "Well, he's old, but LLMs are advancing quite quickly. Living naturally to 100 or even later is not unheard of, so perhaps 12 years is enough time for AI to discover enough about biology to extend Knuth's life another 100 years, and get us all the way to volume 7. (I thinkt he AIs would be quite excited by that possibility.) (Assuming Knuth was willing, of course; I have no idea what his feelings on the possibility are.)"}, {"id": 50676134, "au": "thephyber", "dom": 143, "sr": 9, "sc": 6.18, "ep": 6.18, "bs": 0.0, "d": 3, "age": 6.9, "grav": 51.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 5996, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.847, "fa": 0.28, "gp": 0.718, "bl": 0.0, "ds": 0.0, "txt": "(1) Every aspect of life is going to be deluged with LLM spam and it will be a constant tax we all pay with our attention and our imperfect heuristics.\n\nShops are already getting a deluge of calls from Muse, for example, asking for tasks that the shop will quickly realize is too expensive to manage. Then they will stop answering the phone or have to figure out how to filter unwanted calls.\n\n(2) No piece of software is as trivial as you pretend. Even if it doesn't need to be calibrated (and it constantly will need calibration to minimize false positives and false negatives), it will sit on top of an OS, a language, a framework, and APIs that will evolve and need constant patching. Some API key will need rotating every few weeks or months. Then plugging it into an LLM requires an API (and dollars to pay for it) or setting up a local LLM. Neither of those is \"trivial\", especially when there is a restart / power outage, the subscription didn't auto-renew because the payment card changed, etc."}, {"id": 50675916, "au": "whatever1", "dom": 87, "sr": 10, "sc": 6.16, "ep": 6.46, "bs": 0.0, "d": 0, "age": 7.69, "grav": 59.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 7872, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": ["https://shoemakerstoolmakers.com/books/manuel-du-bottier-et-du-cordonnier-1831"], "ig": 0.558, "fa": 0.96, "gp": 1.662, "bl": 0.0, "ds": 0.0, "txt": "I wonder whether our books will be relevant at all in 30 years. Will they be as outdated as books from the 1800’s describing the art of shoe making [1] ? Maybe people will use our books for decor?\n\n[1] https://shoemakerstoolmakers.com/books/manuel-du-bottier-et-..."}, {"id": 50676099, "au": "TeMPOraL", "dom": 60, "sr": 11, "sc": 6.02, "ep": 6.17, "bs": 0.0, "d": 3, "age": 7.04, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 11, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.657, "fa": 0.42, "gp": 0.745, "bl": 0.0, "ds": 0.0, "txt": "> that's always what foss people cover themselves with, why not now?\n\nFOSS should get back to that. Some people started taking themselves and their projects too seriously in the past decade, because it was seen as a quicker way to a well-paying job.\n\nIt's not fair to expect anything of a random FOSS project or maintainer. Or especially for a random FOSS project to have a \"maintainer\". Code is a static artifact, not a service.\n\nHeuristic I prefer is: responsibility should be proportional to promotion effort. Commercial or FOSS players alike, when they advertise, promote and otherwise push stuff at people, then they should be held responsible for keeping it fit for whatever purpose they're advertising it for."}, {"id": 50679078, "au": "brookst", "dom": 26, "sr": 12, "sc": 5.72, "ep": 6.01, "bs": 0.0, "d": 5, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 15741, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.785, "fa": 0.28, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "Thanks for articulating the position, but wow is it contrary to my experience.\n\nI was never going to write music in alternate tunings because typical music theory is hard enough for a dilettante like me. Here I am in EDO-22 because AI can help me sort out the harmonic relations and easily iterate on ideas.\n\nSame with CNC laser cutting: I was happily using stock software that hid a lot of complexity (badly, in many cases). Here I am “writing” my own gcode generator and having to learn nuances like adjusting speed depending on sharpness of a corner.\n\nSo I really don’t see the first part as self-evident at all. It sounds a lot like the old “TV makes people lazy” canard."}, {"id": 50675987, "au": "fwlr", "dom": 144, "sr": 13, "sc": 5.48, "ep": 5.63, "bs": 0.0, "d": 3, "age": 7.43, "grav": 56.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 6292, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.431, "fa": 0.34, "gp": 0.895, "bl": 0.0, "ds": 0.0, "txt": "If you have been doing something a certain way for 50 years, and it has been working out fantastically for you, and it is so well-received amongst your peers that it has become a a cultural tradition and a badge of honor to participate… and then one day a guy comes along selling a product, and people buying that product break your tradition, and tell you “there is a trivial fix, just buy that guy’s product”… well, I don’t know, that sorta sounds like a protection racket? Whatever it is, it’s dubious and I dislike it."}, {"id": 50676831, "au": "dist-epoch", "dom": 31, "sr": 14, "sc": 5.15, "ep": 5.59, "bs": 0.0, "d": 1, "age": 4.47, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 3079, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.553, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Indeed, the romantic era where you could have hundreds of errors in your books or code and nobody would spot them is coming to an end.\n\nA much higher level of quality is now demanded.\n\nLike when people moved from vague wording to math notation some 500 years ago, and then the second time 100 years ago when math was put on solid grounding.\n\nSoftware is now going to the same process. Moving from the era of the rebel throwing code around without caring much about quality or security to the engineering era where such disregard for quality is not acceptable anymore."}, {"id": 50677044, "au": "wpietri", "dom": 95, "sr": 15, "sc": 5.11, "ep": 5.55, "bs": 0.0, "d": 4, "age": 3.93, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 59432, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.333, "fa": 0.34, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "For sure. I don't feel bad about the failures where lessons were learned at a reasonable cost.\n\nYears back I co-founded a startup. My co-founder had a compelling idea and raised money. Being big fans of user-testing and intrigued by the then-new Lean Startup approach, we aggressively tested the hypotheses using throwaway prototypes. For a couple hundred thousand dollars, we proved that it wouldn't work, so we pivoted to something else.\n\nWe learned later that two other startups had basically the same idea, but they built whole products and tried to make them work. Between them they spent $12 million to learn the same lesson. Our failure was a bummer at the time, but looking back I feel proud of it."}, {"id": 50675996, "au": "thephyber", "dom": 45, "sr": 16, "sc": 5.06, "ep": 5.36, "bs": 0.0, "d": 1, "age": 7.4, "grav": 56.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 5996, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.735, "fa": 0.0, "gp": 0.881, "bl": 0.0, "ds": 0.0, "txt": "It's effectively a DDoS against project maintainers.\n\nAnd setting up an agent to filter reports is yet another tax we put on maintainers of free / open source software.\n\nI'm sympathetic to the issue. A good friend of mine maintains a key piece of open source software and every day there is some deluge of reports he must triage for free.\n\nEven before the AI spam were reports submitted by some Chinese university students (he thinks one particular University professor was directing all of his students to search for bug and report them. I call it \"spam\" because the reports were very low quality and took away from his own time, even if the submissions were well intentioned.\n\nAlso, new bug reporters like to overestimate the CVSS score of the bugs they find. The most recent one claimed the bug is a 9.1, but after triage my friend thinks it is \"4.x at best\"."}, {"id": 50676212, "au": "2b3a51", "dom": 91, "sr": 17, "sc": 4.95, "ep": 5.39, "bs": 0.0, "d": 2, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 725, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.947, "fa": 0.0, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "In my dark and cloudy island off the coast of northern Europe, I was in a shop that younger people go to looking for presents to give in the mid-winter festival.\n\nAmid the fantasy novels and sci-fi fiction, I noticed a substantial pile of Andre Dumas novels - the big thick ones.\nHaving been primed by that observation, I looked around and saw the work of Dickens, Brontes and Conan-Doyle in significant numbers. Some of the Russian authors as well. So I think that these works will persist for another generation at least.\n\nOf course, the possibility now exists to produce alternative versions of certain specific episodes (Dumas and Dickens wrote their books in instalments to be printed in magazines, and they reacted to feedback from readers and the publishers) for the amusement of close friends."}, {"id": 50676625, "au": "grumple", "dom": 72, "sr": 18, "sc": 4.63, "ep": 5.0, "bs": 0.0, "d": 1, "age": 5.1, "grav": 34.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1669, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.68, "fa": 0.0, "gp": 0.724, "bl": 0.0, "ds": 0.0, "txt": "There’s a substantial amount of knowledge that hasn’t been published on the internet. There’s a reason the big labs went around buying rare books to scan them.\n\nI took a few Linux networking classes a few years ago and was surprised how much I didn’t know despite working actively in the field. And the content included a ton that just… wasn’t available in an easily digestible format elsewhere.\n\nI suspect Knuth could help the same way. I bet he’d present these unwritten topics with more clarity, accuracy, and detail than an LLM."}, {"id": 50679221, "au": "scrlk", "dom": 117, "sr": 19, "sc": 4.53, "ep": 4.53, "bs": 0.0, "d": 0, "age": 0.14, "grav": 3.9, "surf": 15.2, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 26, "qw": 93, "k": 8637, "kpp": 9.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": ["https://folklore.org/Close_Encounters_of_the_Steve_Kind.html?sort=date?sort=date"], "ig": 1.14, "fa": 0.42, "gp": 0.45, "bl": 0.0, "ds": 0.0, "txt": "Re: LLMs being used to farm Knuth reward cheques - I'm reminded of the Folklore.org story about Steve Jobs meeting Knuth:\n\nClose Encounters of the Steve Kind\n\n> Steve had managed to get Don Knuth, the legendary Stanford professor of computer science, to give a lunchtime lecture to the Mac team. Knuth is the author of at least a dozen books, including the massive and somewhat impenetrable trilogy \"The Art of Computer Programming.\"\n\n> I was sitting in Steve's office when Lynn Takahashi, Steve's assistant, announced Knuth's arrival. Steve bounced out of his chair, bounded over to the door and extended a welcoming hand.\n\n> \"It's a pleasure to meet you, Professor Knuth,\" Steve said. \"I've read all of your books.\"\n\n> \"You're full of shit,\" Knuth responded.\n\nhttps://folklore.org/Close_Encounters_of_the_Steve_Kind.html..."}, {"id": 50678292, "au": "dzink", "dom": 3, "sr": 20, "sc": 4.53, "ep": 5.19, "bs": 0.0, "d": 2, "age": 1.7, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 51, "qw": 0, "k": 4268, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": ["https://mamabear.ai"], "ig": 1.078, "fa": 0.62, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "I set up a site to survey what everyone wants the manners / etiquette of AI use to be. https://mamabear.ai Hoping we can set up a system akin to open source licenses / TV ratings that lets products and services stand out for actually being respectful of human time and using AI for improvements instead of spam."}, {"id": 50675924, "au": "mmahemoff", "dom": 44, "sr": 21, "sc": 4.21, "ep": 5.09, "bs": 0.0, "d": 0, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7030, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.239, "fa": 0.0, "gp": 1.503, "bl": 0.0, "ds": 0.0, "txt": "Knuth is not closing shop on submissions (as some comments here imply). He’s getting too many repeats of the same issues, not surprising when everyone’s discovering them with the same technology. He’ll probably need to create a public issue tracker and/or use an agent to screen incoming reports and maintain the backlog."}, {"id": 50676248, "au": "laichzeit0", "dom": 71, "sr": 22, "sc": 4.13, "ep": 4.86, "bs": 0.0, "d": 0, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 39, "k": 2545, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.766, "fa": 0.42, "gp": 1.289, "bl": 0.0, "ds": 0.0, "txt": "> And after Volumes 1--5 are done, God willing, I plan to publish Volume 6 (the theory of context-free languages) and Volume 7 (Compiler techniques), but only if the things I want to say about those topics are still relevant and still haven't been said\n\nHe’s working on Volume 4. I feel sad we won’t even see volume 5. I’m afraid nothing he could possibly say for 6 or 7 would even matter at that point. Oh what a time to be alive."}, {"id": 50675980, "au": "perching_aix", "dom": 128, "sr": 23, "sc": 3.84, "ep": 4.06, "bs": 0.0, "d": 1, "age": 7.47, "grav": 57.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 24, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.141, "fa": 0.42, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "> Random sampling indicates that the vast majority of errors that have been reported in recent weeks are repeats of issues already submitted by others.\n\nCan people actually have their agents check for already reported issues first, or are you calling people idiots for not being clairvoyants?\n\nSeems ambiguous enough that I'd be pretty hesitant to have your confidence at least. Doesn't read like it's about already fixed or publicly ack'd issues at all."}, {"id": 50676550, "au": "Nursie", "dom": 93, "sr": 24, "sc": 3.84, "ep": 4.94, "bs": 0.0, "d": 2, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 19142, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.786, "fa": 0.0, "gp": 0.513, "bl": 0.0, "ds": 0.0, "txt": "I’m approaching 50 and honestly, I’m amazed at how much of my output never even made it to market, and how much I have been paid for that output that never went anywhere.\n\nOn several occasions when I was a contractor I spent months on delivering (IMHO) some pretty good stuff only to see the company fold before a single customer saw it.\n\nHell, on one memorable occasion about a dozen people in three countries built a system over six months to outsource burst capacity from on-premises to public cloud services and at the end of the day it showed that the whole exercise was more expensive than buying in-house servers, so the whole shebang was thrown away…"}, {"id": 50678196, "au": "armchairhacker", "dom": 78, "sr": 25, "sc": 3.72, "ep": 4.52, "bs": 0.0, "d": 0, "age": 1.88, "grav": 11.5, "surf": 5.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 9388, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.189, "fa": 0.34, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "I’ve been thinking of a simple solution to the AI spam problem, if you are famous:\n\nRequire someone to pay $1 to send a message you will read. Claim that if it’s not spam or a promotion, you will return the dollar, but explicitly don’t promise (no obligation).\n\nWhat could go wrong?"}, {"id": 50675773, "au": "globular-toast", "dom": 137, "sr": 26, "sc": 3.64, "ep": 3.94, "bs": 0.0, "d": 0, "age": 8.19, "grav": 65.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 6387, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.037, "fa": 0.34, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "Another thing ruined by LLMs. Sad that people would do this. Like, you don't think Knuth himself could spend 10 minutes feeding his opus into an LLM and getting a list of errors? I miss the days when people would think for themselves.\n\nI'm glad I have my own reward cheque because there'd be very little chance of getting one now."}, {"id": 50675751, "au": "adalacelove", "dom": 1, "sr": 27, "sc": 3.51, "ep": 4.39, "bs": 0.0, "d": 0, "age": 8.26, "grav": 66.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 404, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.9, "fa": 0.0, "gp": 1.567, "bl": 0.0, "ds": 0.0, "txt": "I feel old. I don't feel tragic about the changes being brought about by AI but I'm nostalgic knowing I'm part of a culture that is dying. Knowing that my children won't care about things I considered important. This always happens at some point, it's just that I expected to be a grandpa before that."}, {"id": 50676030, "au": "swiftcoder", "dom": 121, "sr": 28, "sc": 3.41, "ep": 4.29, "bs": 0.0, "d": 0, "age": 7.3, "grav": 55.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 11354, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.046, "fa": 0.34, "gp": 0.597, "bl": 0.0, "ds": 0.0, "txt": "The man is almost 90, and still personally responding to error reports in books published decades ago. I hope the LLM script kiddies give the man a break"}, {"id": 50679091, "au": "humblefly", "dom": 7, "sr": 29, "sc": 3.4, "ep": 6.36, "bs": 2.52, "d": 2, "age": 0.35, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 212, "qw": 10, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.686, "fa": 0.7, "gp": 0.277, "bl": 0.95, "ds": 0.0, "txt": "> The great bulk of people learned not to be jackasses.\n\nI have no doubt that a new kind of etiquette surrounding the use of AI will emerge. What bugs me is that there are very loud voices in our industry, including on HN, arguing that we don't need it because the era of humans is over, and therefore it's OK to do shitty things. For whose benefit? I guess AI will cure cancer? Or the benefit of future machines that take over the planet?...\n\nEven in this thread, there's someone making snarky remarks about Knuth and how they're glad that the age of human-written, error-containing textbooks is over. Yesterday, there was a thread about a hobby retro-coding contest winding down, with some people cheering it on. In the daily threads on mathematics, half the participants are glad that AI is finally destroying the ivory tower. And on, and on. My problem isn't that there are jerks among us, but that we don't ostracize that; we see it as a valid viewpoint. And so the harms are allowed to continue.\n\nMeanwhile, Amazon is drowning in AI-generated slop books. Do we have threads about that? Do we talk to our relatives and friends? No. Implicitly, our community is architecting a crappier future for everyone. If the push for AI manners comes, it will be a push against what we're doing."}, {"id": 50676393, "au": "jacquesm", "dom": 118, "sr": 30, "sc": 3.09, "ep": 3.75, "bs": 0.0, "d": 0, "age": 5.98, "grav": 42.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 248623, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.448, "bl": 0.0, "ds": 0.0, "txt": "Why would people waste the time of such a nice person by using an automated tool when clearly that is against the spirit of his whole setup? I always thought that Knuth's error bonus served two goals: to improve his works and to encourage people to actually read and use them. This just aims at cheating yourself to the top of some imaginary (and incomplete) list."}, {"id": 50675988, "au": "EliRivers", "dom": 90, "sr": 31, "sc": 3.08, "ep": 4.62, "bs": 0.0, "d": 1, "age": 7.43, "grav": 56.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 6144, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.859, "fa": 0.68, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "When you say \"our books\" do you mean technical books about current technologies, or more generally the books of our cultures?\n\nPut another way, is this question \"will people still be reading Crockford's 'Javascript : The Good Parts'?\" in 30 years, or is it \"will people still be reading 'Anna Karenina' in 30 years?\""}, {"id": 50676236, "au": "thephyber", "dom": 62, "sr": 32, "sc": 3.06, "ep": 4.38, "bs": 0.0, "d": 3, "age": 6.61, "grav": 48.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 5996, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.641, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "This piece of software, when shipped with a bad configuration, caused one of the largest swarms of DDoSes the Internet had seen up until that time. The \"vulnerability\" in the project had HUGE effects on other, innocent victims on the internet.\n\nI didn't say he does this for a hobby. He takes his project seriously. His personal business and his open source maintenance are closely related. If the project is perceived as abandonware, his customers look for other projects to deliver their solution and his business dries up.\n\nThe LLM spam is similar to phone call spam and SMS spam in the USA. It's like a never-ending locust swarm. And your suggestion is \"just watch the locusts do their thing and don't try to stop them\"."}, {"id": 50676609, "au": "necovek", "dom": 54, "sr": 33, "sc": 2.92, "ep": 3.58, "bs": 0.0, "d": 4, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 6434, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.698, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When 90% of the bugs are corner cases nobody really faces in reality — if they are bugs at all — you end up mostly triaging bugs in more time instead of fixing the 10% that really matter."}, {"id": 50676015, "au": "phoronixrly", "dom": 104, "sr": 34, "sc": 2.92, "ep": 4.46, "bs": 0.0, "d": 1, "age": 7.34, "grav": 55.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2454, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.256, "fa": 0.34, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "The majority of programming books were outdated very quickly even before LLMs (with some major exceptions). Right before LLMs you were getting a constant stream of JS framework of the month books.\n\nThe shoemakers books out of the 1800 are still very valuable as are many trade books if you wish to produce items that have not been cost-optimised to oblivion..."}, {"id": 50676955, "au": "larodi", "dom": 112, "sr": 35, "sc": 2.9, "ep": 3.12, "bs": 0.0, "d": 0, "age": 4.13, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2014, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "Mind you - he never says \"do not use LLMs\", neither \"we despise them\". He says, if I'm reading this right, \"we need time to process all reasonably, so please stay tuned!\"."}, {"id": 50675950, "au": "jdw64", "dom": 111, "sr": 36, "sc": 2.82, "ep": 3.92, "bs": 0.0, "d": 0, "age": 7.56, "grav": 58.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2951, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.032, "fa": 0.0, "gp": 1.029, "bl": 0.0, "ds": 0.0, "txt": "I grew up reading Knuth’s books, and I wish I were capable enough to earn a check too. It never even occurred to me to use an LLM on TAOCP to find errors in the book. Haha."}, {"id": 50679189, "au": "ergonaught", "dom": 116, "sr": 37, "sc": 2.65, "ep": 3.75, "bs": 0.0, "d": 0, "age": 0.18, "grav": 4.1, "surf": 14.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 3278, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "In general, “you” wouldn’t pay a contractor to create something then turn around and show people the thing you made; “you” wouldn’t pay a contractor to submit bug fixes or bug reports to FOSS projects or books.\n\nIf he wanted LLM reviews he would have arranged that himself.\n\nAnd every single person involved knows that.\n\nFor some reason this fundamental character has gone out the window with LLMs."}, {"id": 50677777, "au": "mereck", "dom": 25, "sr": 38, "sc": 2.63, "ep": 3.51, "bs": 0.0, "d": 4, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 6, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.351, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "I think the position is such that by using AI to fuel amazing projects we surrender control and deeper understanding over how the thing is done. This may lead down the path of AI taking over everything and us becoming fully dependent on it, so that we are kept around as pets if we are lucky. The first part is self-evident. The second is a forecast, may be inaccurate."}, {"id": 50676071, "au": "sllabres", "dom": 88, "sr": 39, "sc": 2.61, "ep": 4.15, "bs": 0.0, "d": 1, "age": 7.15, "grav": 53.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "I've just tapped 10 books random books in my bookshelf and I would say most of them will not if you mean with 'our books' books about IT topic. \nThey will probably live deep in the memory of an AI as an echo of the technology that once created them or for those being curious. But more like some people being interested in steam locomotives or archeology today.\n\nI think that many topics that are niche today will die out since I can't imagine anyone leafing through a book searching for formatting rules using LaTeX, learning the parameters for a init.ora or trying to figure out how to implement a tree in his favorite programming language."}, {"id": 50678681, "au": "0c3ca83", "dom": 19, "sr": 40, "sc": 2.55, "ep": 3.43, "bs": 0.0, "d": 8, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 25, "k": 866, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.951, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> That's why it bugs me when people talk about AI like they want to build artificial humans.  It's a deeply inhumane R&D project, and, I really hope, flawed.\n\nThat's what the AI labs are all in on building, and what every dollar you spend on AI goes towards.\n\nThe largest investment in human history is fundamentally deeply inhumane, and I don't think hoping the thesis is flawed is enough of a strategy to get to a humane future."}, {"id": 50676596, "au": "cowboylowrez", "dom": 146, "sr": 41, "sc": 2.46, "ep": 4.01, "bs": 0.0, "d": 3, "age": 5.21, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 221, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.365, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "add into that the unpredictability of the LLMs. Say for instance we want to use LLMs to start verifying bug reports. What happens if the big vendors start refusing because of \"reasons\" and some moronic government starts blocking open models?\n\nIt all seems to be a big mess to me."}, {"id": 50675910, "au": "hackermailman", "dom": 125, "sr": 42, "sc": 2.41, "ep": 3.43, "bs": 0.0, "d": 0, "age": 7.7, "grav": 59.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2045, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 1.089, "bl": 0.0, "ds": 0.0, "txt": "The problem isn't LLMs it's idiots spamming Knuth errata that's already known because they aren't even bothering to read the output."}, {"id": 50676184, "au": "perching_aix", "dom": 156, "sr": 43, "sc": 2.39, "ep": 3.49, "bs": 0.0, "d": 3, "age": 6.74, "grav": 49.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.265, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "if the LLM output is clear and correct, it is OK. put out hundreds of bugs, get hundreds of bug reports.\n\nhow would anyone do an automated verification of this when it comes to books though, escapes me. it's challenging enough with code, let alone prose.\n\nbut then he complains about duplicates and volume, not about clarity and correctness."}, {"id": 50679284, "au": "suddenlybananas", "dom": 8, "sr": 44, "sc": 2.37, "ep": 3.47, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 1539, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.477, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree with this completely and I find these people deeply misanthropic, obnoxious and kinda evil frankly if we take their worldview seriously.\n\nThat being said, I think they are vanishing minority of people in real life. I was at EMNLP recently where you would expect  people to be all in on llms and there were a lot of people complaining about low effort slop (whether in promotion posters or slides or whatever).\n\nI think among the general public the sentiment is even more anti-AI for these kinds of uses. Look how mad people get about kebab shop menus being made with AI."}, {"id": 50677352, "au": "brookst", "dom": 24, "sr": 45, "sc": 2.19, "ep": 3.73, "bs": 0.0, "d": 3, "age": 3.24, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 15741, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.026, "fa": 0.28, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "What a sad, doomy take, that as far as I can tell is based in no  evidence at all.\n\nI’ve learned more in the past two years than the previous ten. AI has let me dive deeper into music, digital fabrication, and some massively ambitious software projects than I thought I’d ever be able to do.\n\nJust saying something is like measles and genital warts combined doesn’t make it true. How are you using AI that it’s been so awful for you?"}, {"id": 50678911, "au": "svara", "dom": 20, "sr": 46, "sc": 2.11, "ep": 2.56, "bs": 0.0, "d": 9, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 31, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.578, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> That's what the AI labs are all in on building\n\nYes, I agree, I was criticizing a direct quote from Dario Amodei above for this reason.\n\n> The largest investment in human history is fundamentally deeply inhumane\n\nThere's massive potential for good also with this tech.\n\n> I don't think hoping the thesis is flawed is enough of a strategy\n\nYou've picked out one single word choice of mine, but I also made an actual argument which I think is right; that's the part that could be interesting to discuss.\n\nYour choice to respond to that one word is how you get people to sound annoyingly overconfident."}, {"id": 50676146, "au": "taneq", "dom": 155, "sr": 47, "sc": 2.08, "ep": 3.33, "bs": 0.0, "d": 2, "age": 6.84, "grav": 50.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 30078, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.075, "bl": 0.0, "ds": 0.0, "txt": "I think the damage is a large cohort of people thinking it’s OK to ask an LLM to go check someone else’s work, then cutting and pasting the LLM’s output into an email or issue tracker. It’s too easy to generate a huge amount of work for maintainers, essentially DDOSing them."}, {"id": 50679062, "au": "perching_aix", "dom": 154, "sr": 48, "sc": 1.82, "ep": 3.21, "bs": 0.0, "d": 3, "age": 0.39, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "so is there actually a way to check what's already reported but not yet triaged?\n\nanother comment claims there's an issue tracker... right before mentioning that it's outdated, and indeed if you check, it's no intake. it logs already triaged issues.\n\nsounds rather twisted to blame participants for being inhibited from coordinating, and then take issue with the consequences of no coordination"}, {"id": 50677423, "au": "globular-toast", "dom": 106, "sr": 49, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 1, "age": 3.13, "grav": 19.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 6387, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.416, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "TAOCP will remain relevant for as long as classical computers remain relevant. There have always been other ways to get the information contained in them. We like them because the information is presented in a beautiful way.\n\nShoe making is still alive. I live not far from Northampton where they still make shoes the old fashioned way. A pair could last you a lifetime. They even make the original Dr Martens there, but under a different name (Solovair). Are you sure those books are actually outdated?"}, {"id": 50677358, "au": "Nursie", "dom": 97, "sr": 50, "sc": 1.79, "ep": 3.11, "bs": 0.0, "d": 4, "age": 3.22, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 19142, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.322, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah no argument - the data supplied the leadership team with what they needed to make ongoing commercial decisions. It wasn’t a waste from a business perspective and learning to have that perspective is part of growing as an engineer, IMHO.\n\nBut it’s still amazing sometimes to think of the effort that went into all those dead ends!"}, {"id": 50676948, "au": "0c3ca83", "dom": 12, "sr": 51, "sc": 1.78, "ep": 2.88, "bs": 0.0, "d": 2, "age": 4.15, "grav": 26.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 866, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.002, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It's not going to be going well. The best outcome is that we get an AI that remembers to refill the food bowl and sometimes plays fetch with us.\n\nAI is asbestos, but far more harmful. Asbestos was a brilliant fire retardant, so we used it everywhere. You can even dig up ads for asbestos shirts that you could clean by tossing them in fire."}, {"id": 50677315, "au": "WillAdams", "dom": 101, "sr": 52, "sc": 1.7, "ep": 3.24, "bs": 0.0, "d": 1, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 5648, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.923, "fa": 0.28, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "Currently sorting mine into:\n\n- timeless concepts well-explained\n\n- current things still relevant\n\n- outdated --- those are getting further sub-divided into \"interesting and possibly historically relevant\" and \"waste of paper when published\""}, {"id": 50678679, "au": "0c3ca83", "dom": 27, "sr": 53, "sc": 1.64, "ep": 3.18, "bs": 0.0, "d": 4, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 866, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It removes the joyous details of making things, and instead spits out results. I am left picking through turds to find corn, and as AI improves even that becomes pointless.\n\nI don't care about having more output; there's already enough out there that I can consume. Having a box that diminishes and devalues what I produce, though, is the optimistic case. It's deeply undesirable.\n\nBut beyond that, intelligence without humans is a political tool. You may be dicking around making some noises and raspberry pi cases, others are not.\n\nIntelligence is the monopoly that people hold which gives them agency, leverage, and political power.\n\nAsbestos was once widely praised as a miracle material."}, {"id": 50677236, "au": "0c3ca83", "dom": 15, "sr": 54, "sc": 1.6, "ep": 3.99, "bs": 0.85, "d": 4, "age": 3.47, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 24, "k": 866, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.095, "fa": 0.42, "gp": 0.149, "bl": 0.32, "ds": 0.0, "txt": "Can you give me a single example of a technology that had the potential to be used adversarially for money and power, but where people chose not to?\n\n> We need better metaphors for what kind of AI we would want to build. I like to think of intelligence on tap, intelligence as a utility.\n\nThis is the thing which we must not allow. Intelligence is the monopoly that people hold which gives them agency, leverage, and political power.\n\nToday, if politicians decide to do something, and people protest, the economy grinds to a halt. What happens when humans are an overhead cost, and policing is automated?\n\nEven the best outcome is hellish."}, {"id": 50677163, "au": "lovich", "dom": 32, "sr": 55, "sc": 1.51, "ep": 3.05, "bs": 0.0, "d": 2, "age": 3.61, "grav": 22.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 9931, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Who even looks at AI produced code to find errors anymore?\n\nAI is turning code into what garbage collectors turned memory management into.\n\nIt’s good enough for the speed it’s generated at and no one cares if there’s small errors or optimizations that could be made by hand rolling it"}, {"id": 50678819, "au": "perching_aix", "dom": 158, "sr": 56, "sc": 1.51, "ep": 2.96, "bs": 0.0, "d": 5, "age": 0.83, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.26, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "if there were duplicates, there were initial ones, so this does not seem to hold up. it'd also seem Knuth does not spend his time entertaining himself with long sessions of Opus 5.5 wrangling, potentionally intentionally so (leaving issue hunt to readers as an exercise, irrespective of method)."}, {"id": 50677045, "au": "kryptiskt", "dom": 153, "sr": 57, "sc": 1.51, "ep": 2.95, "bs": 0.0, "d": 2, "age": 3.92, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 10541, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.228, "fa": 0.0, "gp": 0.043, "bl": 0.0, "ds": 0.0, "txt": "If an LLM finds a bug, it will find it for another LLM user running the same check. This DDOS of bug reports is the fault of people thinking they are special snowflakes who are unique in coming up with the tremendously original idea of using an LLM to check Knuth's work."}, {"id": 50677704, "au": "dingaling", "dom": 21, "sr": 58, "sc": 1.51, "ep": 2.9, "bs": 0.0, "d": 4, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 8897, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Humans have considerable agency in what future they create, they are building it deliberately.\"\n\n_We_ aren't building it, corportions with selfish interests, misaligned with humanity, are building it. Agency and discretion lies with trillion-dollar companies, not people and maybe not even governments.\n\nIf you're using what they're building then you're explicitly condoning what is being built."}, {"id": 50676466, "au": "glimshe", "dom": 66, "sr": 59, "sc": 1.51, "ep": 2.86, "bs": 0.0, "d": 1, "age": 5.72, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 9277, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.118, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I can here to point out this nuance. It's not like he doesn't want to see the issues, but noise is overtaking the process.\n\nIdeally, an AI could check the known errors list he plans to create and flag it to the prompter. Right now that's not possible.\n\nBut nowhere in this statement I see something like \"It's sad that we can find more issues now\""}, {"id": 50676144, "au": "thephyber", "dom": 48, "sr": 60, "sc": 1.51, "ep": 2.85, "bs": 0.0, "d": 3, "age": 6.85, "grav": 50.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 5996, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes.\n\nHis business is selling corporate forks of the open source.\n\nIf a security issue is submitted and he doesn't triage it in a timely manner, it directly impacts how many companies choose to continue to depend on that one project."}, {"id": 50677298, "au": "WillAdams", "dom": 75, "sr": 61, "sc": 1.51, "ep": 2.81, "bs": 0.0, "d": 2, "age": 3.33, "grav": 20.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5648, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ages ago, I worked with a book publisher which had landed the manuscript for a muchly in-demand text, one on wireless networking at a time when the classes on that were being taught from patent applications and photocopies of notes scavenged from industry labs.\n\nShortly after that, Wi-Fi exploded onto the scene."}, {"id": 50675869, "au": "krackers", "dom": 138, "sr": 62, "sc": 1.51, "ep": 2.75, "bs": 0.0, "d": 1, "age": 7.86, "grav": 61.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 4710, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "That's not the impression I got from the tone of his post though. His tune may well change if the errors are spurious and time-wasting (like the curl ones) but it seems more like he's glad the errors are being discovered and corrected (regardless of whether it's LLM or human), and only laments the fact that he doesn't have enough time to triage them."}, {"id": 50677562, "au": "bluGill", "dom": 35, "sr": 63, "sc": 1.51, "ep": 2.68, "bs": 0.0, "d": 3, "age": 2.92, "grav": 17.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 28590, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You don't look at ai code to find errors anymore. What's wrong with you? I look at it and so do my co-workers and we are constantly finding tons and tons of errors. Overall, AI is better than we are at writing code, but it still makes tons of errors for us humans to catch."}, {"id": 50676249, "au": "svara", "dom": 11, "sr": 64, "sc": 1.51, "ep": 2.68, "bs": 0.0, "d": 1, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.936, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "I feel like during rapid change it's more important than ever to embody and transmit the cultural values you hold dear.\n\nOne obvious example to me: AI can make you stop trying to learn and understand, or it can help you learn and understand better.\n\nWhich way you go comes down to culture and values.\n\nI'm also pretty sure that this isn't some quaint attachment, but that this is one of the keys to this whole thing going well."}, {"id": 50675866, "au": "shevy-java", "dom": 145, "sr": 65, "sc": 1.51, "ep": 2.53, "bs": 0.0, "d": 2, "age": 7.87, "grav": 61.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2061, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.738, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, there are still problems here:\n\n- You probably have to invest your time to setup a\ncounter-LLM.\n\n- You also then depend on it.\n\nAnd various other problems. I am not so sure the \nnet result returns back to zero here; you may lose\nsome time due to LLMs either way."}, {"id": 50676164, "au": "gspr", "dom": 131, "sr": 66, "sc": 1.51, "ep": 2.52, "bs": 0.0, "d": 1, "age": 6.79, "grav": 50.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 3189, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 1.071, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, the way they're spamming Knuth is also – at least in my experience – the way most heavy LLM users operate. With everything. On every front. And worst of all: it is completely impossible to make them even introspect about it. Any criticism of this way of going about things is met with \"you're just sad that you're obsolete\", or similar. The world is being overrun by a cult."}, {"id": 50677356, "au": "yubblegum", "dom": 9, "sr": 67, "sc": 1.51, "ep": 2.47, "bs": 0.0, "d": 2, "age": 3.23, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 10, "k": 1106, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.541, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I invite you to New York City and a few rides in our 'world class' subway system.\n\n> The great bulk of people learned not to be jackasses.\n\nIt only takes _ONE_ \"jackass\" to be that person to cause disturbance to MANY. Jackassness scales remarkably well."}, {"id": 50678199, "au": "cowlevel", "dom": 73, "sr": 68, "sc": 1.51, "ep": 2.37, "bs": 0.0, "d": 2, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The big labs trained on Anna's Archive which contains scans of most books. They only started destroying a physical copy of each book when the justice system said they had to do that."}, {"id": 50676640, "au": "layer8", "dom": 70, "sr": 69, "sc": 1.51, "ep": 2.26, "bs": 0.0, "d": 1, "age": 5.03, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 43693, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.962, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Apologizing isn’t self-depreciating, it shows a sense of responsibility. It’s a considerate and polite way to acknowledge an error. It’s an expression of care for his readers."}, {"id": 50676131, "au": "OnlineTux", "dom": 86, "sr": 70, "sc": 1.51, "ep": 2.24, "bs": 0.0, "d": 1, "age": 6.91, "grav": 51.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 50, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.951, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Entering\"? I'd argue we're at the tail end of that process, where mass production is now possible also for creative industries which were at one stage thought not to be mass-producable."}, {"id": 50678243, "au": "briansm", "dom": 49, "sr": 71, "sc": 1.51, "ep": 2.22, "bs": 0.0, "d": 4, "age": 1.8, "grav": 11.0, "surf": 3.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 105, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.533, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The guy is 88 years old, he should be taking it easy really.\n\nImagine the chaos of having an 80-something in charge of anything!"}, {"id": 50677858, "au": "svara", "dom": 22, "sr": 72, "sc": 1.51, "ep": 2.2, "bs": 0.0, "d": 5, "age": 2.45, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.474, "fa": 0.28, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "True, but you can choose to use products that align better with your values.\n\nFor example, if the view I described above is right, then open source intelligence is quite important and you absolutely can contribute to that ecosystem."}, {"id": 50679068, "au": "hilariously", "dom": 10, "sr": 73, "sc": 1.51, "ep": 2.05, "bs": 0.0, "d": 3, "age": 0.38, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 920, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.873, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd also say most of these people are not in public regularly if they think new technology eventually gets people to use their manners, the amount of people having speaker phone conversations in public has only risen over time."}, {"id": 50676940, "au": "wpietri", "dom": 2, "sr": 74, "sc": 1.51, "ep": 2.01, "bs": 0.0, "d": 1, "age": 4.16, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 59432, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.399, "fa": 0.0, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "One thing that may help:\n\nDecades ago, Judith Martin, aka Miss Manners, got a question about pagers going off in movie theaters. It was her observation that with every new technology, some people thought manners no longer applied.\n\nBut eventually people come around. I saw this happen with both dumbphones and smartphones in theaters. The great bulk of people learned not to be jackasses.\n\nIt's a very human thing. Once babies find their voices, they use them. Gradually they learn to use them more subtly. When we gain a new power, we test its limits and learn to develop finer control as we see the impacts.\n\nIt's already happening with \"AI\". I just watched an episode of a show where somebody had to write wedding vows. Her friend walked away saying, \"And don't use AI. I'll know.\"\n\nThings will change, of course. But much will be preserved."}, {"id": 50679105, "au": "brookst", "dom": 28, "sr": 75, "sc": 1.51, "ep": 2.74, "bs": 0.85, "d": 5, "age": 0.33, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 15741, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.826, "fa": 0.28, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Fair enough, you’re entitled to your opinion. Just note that it is evidence-free.\n\nPlatinum was once seen as useless, now it’s a critical element. Does that anecdote have as much predictive power for the future of AI as your asbestos focus does?"}, {"id": 50675854, "au": "shevy-java", "dom": 150, "sr": 76, "sc": 1.51, "ep": 1.84, "bs": 0.0, "d": 0, "age": 7.9, "grav": 62.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2061, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.784, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI took out Knuth. :(\n\nIt really is about damn time that the AI companies begin to\npay the rest of mankind for the damage they are causing here."}, {"id": 50676681, "au": "zetanor", "dom": 89, "sr": 77, "sc": 1.51, "ep": 1.84, "bs": 0.0, "d": 1, "age": 4.87, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 914, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.629, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "Some of the software books that had the most impact on me were about Visual Basic and about ActionScript 3.0, which had been on the level of \"1800’s art of shoe making\" long before LLMs/SI."}, {"id": 50676220, "au": "moffkalast", "dom": 99, "sr": 78, "sc": 1.51, "ep": 1.83, "bs": 0.0, "d": 1, "age": 6.65, "grav": 48.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 9631, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "books_learn", "flbl": "Books & Learn (Programming)", "urls": [], "ig": 0.527, "fa": 0.0, "gp": 0.41, "bl": 0.0, "ds": 0.0, "txt": "Unless it's a book on fundamentals, most programming oriented books have to be outdated the moment they're published, no?\n\nIf that did not deter people before, why would it now?"}, {"id": 50676605, "au": "necovek", "dom": 51, "sr": 79, "sc": 1.51, "ep": 1.82, "bs": 0.0, "d": 5, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 6434, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.776, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the most favorable interpretation is: the problems might exist on their own and could in theory affect his actual paying customers, these are submitted by non-paying customers (if even customers), and not all of them are as impactful as they claim to be — and some are surely invalid.\n\nIf they were reports from actual customers experiencing issues directly, that'd be a \"paying job\".\n\nTriaging, investigating and confirming — and then resolving — any reported issue, even if invalid, is work that's not necessarily paid for them, but with a public issue tracker, his paying customers might get alarmed if he does not do it and the queue of issues keeps growing.\n\nTo me this makes sense and is exactly what any other maintainers are feeling, except that there is a business relationship for some of this one's customers too, putting more of attention on how you deal with the exponential influx."}, {"id": 50676964, "au": "larodi", "dom": 29, "sr": 80, "sc": 1.51, "ep": 1.77, "bs": 0.0, "d": 1, "age": 4.11, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2014, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.614, "fa": 0.0, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "You can not know what your children will care about, and perhaps they care more about more pressing matter such as saving planet's equilibrium than your/mine generation did. They may not care about being able to type math/programs by hand, but may care greatly about sorting their trash, evolving and using clean public transport, being kind to those of alien looks. Also it is in all likelihood they may also choose to do manual labor that is not required."}, {"id": 50676801, "au": "taneq", "dom": 159, "sr": 81, "sc": 1.51, "ep": 2.61, "bs": 0.85, "d": 4, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 30078, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 1.112, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Getting accurate, non-duplicate bug reports (whether from LLM or human) is fine. Getting flooded with verbose bug reports that require significant time to read through only to discover that they're dupes, is not."}, {"id": 50677137, "au": "insanitybit", "dom": 52, "sr": 82, "sc": 1.51, "ep": 1.75, "bs": 0.0, "d": 6, "age": 3.66, "grav": 22.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4768, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.746, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Okay so independent people are finding vulnerabilities in someone's software, submitting them, and someone profiting off of that software is in a position to fix those issues? That's quite a lot different from \"must\" and \"for free\"."}, {"id": 50676198, "au": "petesergeant", "dom": 115, "sr": 83, "sc": 1.51, "ep": 2.88, "bs": 1.19, "d": 0, "age": 6.71, "grav": 49.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 5684, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.637, "fa": 0.0, "gp": 0.955, "bl": 0.45, "ds": 0.0, "txt": "I’m currently managing a bug bounty program. The only way to deal with this really is a database plus an agent."}, {"id": 50678223, "au": "cowlevel", "dom": 96, "sr": 84, "sc": 1.51, "ep": 1.66, "bs": 0.0, "d": 5, "age": 1.83, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "relevant_agency", "flbl": "Relevant & Agency (Outdated)", "urls": [], "ig": 0.295, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Was it your money or VC money? Would you have walked away with more money if you'd spent $12 million of someone else's?"}, {"id": 50679210, "au": "nradov", "dom": 38, "sr": 85, "sc": 1.51, "ep": 1.59, "bs": 0.0, "d": 6, "age": 0.15, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 44337, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.677, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The number of human engineers who can do code review better than AI is small and shrinking. Most companies won't be able to hire those few top engineers anyway, so snarky comments about \"quality\" aren't actionable."}, {"id": 50676176, "au": "gspr", "dom": 160, "sr": 86, "sc": 1.51, "ep": 1.58, "bs": 0.0, "d": 2, "age": 6.76, "grav": 49.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3189, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.672, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The damage in ignoring the bottleneck. Were it \"just\" the case of ignoring a few authors, that'd be one thing. This is how most of these people operate with everything, on every front."}, {"id": 50676680, "au": "xboxnolifes", "dom": 157, "sr": 87, "sc": 1.51, "ep": 1.51, "bs": 0.0, "d": 4, "age": 4.88, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 6722, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.643, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If all you do is cut and paste into and out of am LLM, you simply aren't needed. Anyone can get around to doing that same action. You're contributing to the duplicates and volume by not using your brain and considering how they occur."}, {"id": 50677314, "au": "tomrod", "dom": 34, "sr": 88, "sc": 1.51, "ep": 1.51, "bs": 0.0, "d": 3, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 18342, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.563, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "It's interesting how we keep anthropomorphizing the work of AI agents and processes under the guise that a human didn't set them forward to perform the action.\n\nIf you have an agent make a stock trade for you, and it goes up, who is the beneficiary? If it goes down, who lost?\n\nIf you are the owner of the result, the same holds true for other outcomes driven by AI agents that you instantiate."}, {"id": 50678205, "au": "cowlevel", "dom": 83, "sr": 89, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 2, "age": 1.86, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.282, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You listened, specifically, to those 42 words and did not watch or listen to the rest of the movie?"}, {"id": 50678177, "au": "cowlevel", "dom": 33, "sr": 90, "sc": 1.44, "ep": 1.44, "bs": 0.0, "d": 3, "age": 1.91, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.567, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "Or what compilers turned ABI into.\n\nDid you know unique_ptr is stack-allocated, not in a register, because the ABI says all objects are stack-allocated, not in registers, because the language says they have stable addresses? So whenever you pass a pointer, you actually pass a pointer to a pointer.\n\nI presume Rust fixes this."}, {"id": 50676898, "au": "undecidabot", "dom": 109, "sr": 91, "sc": 1.31, "ep": 1.31, "bs": 0.0, "d": 2, "age": 4.27, "grav": 27.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 248, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug", "flbl": "Reports & Bug (Open)", "urls": [], "ig": 0.557, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That makes sense: He was open to bug reports at the beginning, but it's been closed now."}, {"id": 50676168, "au": "gspr", "dom": 130, "sr": 92, "sc": 1.29, "ep": 1.29, "bs": 0.0, "d": 2, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3189, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.549, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "And all of those spammers were LLM users. I agree that the LLMs aren't the problem in themselves, but the problem wouldn't be there without LLMs."}, {"id": 50676036, "au": "perching_aix", "dom": 57, "sr": 93, "sc": 1.18, "ep": 1.18, "bs": 0.0, "d": 2, "age": 7.29, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3047, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.28, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "by all means he's free to risk shipping vulnerabilities, it was supposed to be just hobby stuff after all, wasn't it? that's always what foss people cover themselves with, why not now? no warranty."}, {"id": 50677023, "au": "6031769", "dom": 122, "sr": 94, "sc": 1.1, "ep": 1.1, "bs": 0.0, "d": 1, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 170, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_errors", "flbl": "Code & Errors (Amazing)", "urls": [], "ig": 0.47, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They won't.\n\nThey can't be bargained with. They can't be reasoned with. They don't feel pity, or remorse, or fear. And they absolutely will not stop, ever, until the web is dead."}, {"id": 50677827, "au": "svara", "dom": 16, "sr": 95, "sc": 0.96, "ep": 2.65, "bs": 1.7, "d": 5, "age": 2.5, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 15, "k": 3994, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "capability_human", "flbl": "Capability & Human (Errors)", "urls": [], "ig": 0.62, "fa": 0.42, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "> Intelligence is the monopoly that people hold which gives them agency, leverage, and political power.\n\nI think that's probably the crux of what we view differently.\n\nIntelligence in my view is one component of capability on specific tasks. You seem to think that you can order systems by a single variable, their intelligence, and the more intelligent one will be the better choice for any job.\n\nThe link between capability and intelligent exists, of course, but it's complicated and task-specific. Importantly, capability as a function of intelligence will scale very differently on different tasks."}, {"id": 50676926, "au": "Vaushite", "dom": 59, "sr": 96, "sc": 0.9, "ep": 0.9, "bs": 0.0, "d": 4, "age": 4.2, "grav": 26.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 290, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reports_bug"
