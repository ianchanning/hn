terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 26}, {"category": "code_repository", "count": 9}, {"category": "github_artifact", "count": 3}, {"category": "primary_technical_doc", "count": 3}], "story_anchors": ["intel", "mono", "source", "available", "provided", "legibility", "ttf", "fonts", "open", "design", "developers", "programming", "screen", "code", "ligatures", "release", "text", "space"], "largest_root": {"root_id": 50654149, "author": "kleiba2", "slots": 63, "start_dom": 22, "end_dom": 84, "share_pct": 23.7, "top_dom1_age": 23.9, "top_dom1_author": "bayesnet"}, "buried_cutoff": 80, "rescue_top_k": 53, "ablations": [], "tournament": [], "comments": [{"id": 50666539, "au": "JdeBP", "dom": 115, "sr": 1, "sc": 13.71, "ep": 13.71, "bs": 0.0, "d": 2, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 92, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": ["https://github.com/jdebp/unscii/blob/2.1.1f/src/mathematicalalphabet.txt"], "ig": 1.815, "fa": 2.91, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "The idea of ball-point-pen cursive for one of the mathematical alphabets is an interesting one.\n\nUnscii lacks the mathematical alphabets, and my fork lacks most of the mathematical alphabets.  (I have filled in three, using modified forms of the PET, BBC Micro, and Dragon 32/64 fonts.)\n\n* https://github.com/jdebp/unscii/blob/2.1.1f/src/mathematical...\n\nThat said, ball-point-pen cursive is not a good match for a bitmap font.  So I'm still keeping an eye out for an arcade or a gaming console font that is \"mathsy\".\n\nNonetheless, even just that amount puts Unscii in the top 5 for mathematical alphabet coverage according to that comparator page."}, {"id": 50656044, "au": "logicallee", "dom": 255, "sr": 2, "sc": 12.68, "ep": 12.68, "bs": 0.0, "d": 0, "age": 24.96, "grav": 376.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 324, "qw": 0, "k": 3367, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": ["https://grok.com/share/c2hhcmQtMw_6ee9a52f-f758-45b7-aa3c-c2126df0c77f", "https://grok.com/share/c2hhcmQtMw_b8e363f9-3eda-4432-b022-3064bd510f5b", "https://web.archive.org/web/20260808222200/https://stateofutopia.com/encyclopedia/"], "ig": 1.792, "fa": 2.63, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "The font looks great. Given the times we live in, the probability isn't zero that it's entirely AI-generated, so that no human touched any of the font files in that repository directly, only via prompts.[1] Is it really possible to license such output under the Open Font License? (Which is a copyleft license like the GPL, that requires anyone making a change to relicense it under OFL.)[2]\n\nRegarding the copyright status of AI-generated content, my understanding is that the U.S. copyright office holds that AI-generated output - even when guided by humans, i.e. humans had the ideas that the font includes or told the AI what process to follow - is not subject to copyright.[3]\n\nSo, I thought it is like the public domain. If so, then someone could start with this font, and then make modifications to it by hand as a human, and then end up with a commercial font they could then sell, or not relicense. That would mean they don't have to follow the OFL.\n\nIf this is the case, then since Intel spent a lot of tokens on this, it could be a good starting point for someone who wants to create a commercial font out of it by hand.\n\nWhat do you think, is the U.S. copyright office \"right\" or in reality is AI-generated content under the copyright of the user who prompted it, and who can then license it under any license they choose?\n\n[1] Source: https://grok.com/share/c2hhcmQtMw_6ee9a52f-f758-45b7"}, {"id": 50654057, "au": "rpozarickij", "dom": 85, "sr": 3, "sc": 12.52, "ep": 12.52, "bs": 0.0, "d": 0, "age": 28.64, "grav": 473.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 85, "qw": 0, "k": 200, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://github.com/be5invis/Iosevka"], "ig": 1.414, "fa": 2.42, "gp": 1.584, "bl": 0.0, "ds": 0.0, "txt": "I liked the way this font looks in the preview image in this repository, but after discovering Iosevka [0] I can't go back to \"regular\" monospaced fonts.\nAt first I was only able to use the 548-width version and it already improved code reading ergonomics/comfort, but after ~1 month out of curiosity I switched to the normal/500 width version and I was surprised how \"normal\" it looked to my eyes while being even more space-efficient. After a few days I got used to it even more. As of now it's my \u00231 programming font.\n\n[0] https://github.com/be5invis/Iosevka"}, {"id": 50655381, "au": "dolmen", "dom": 202, "sr": 4, "sc": 11.97, "ep": 11.97, "bs": 0.0, "d": 0, "age": 25.99, "grav": 402.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 47, "qw": 0, "k": 1380, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://go.dev/blog/go-fonts", "https://github.com/golang/image/tree/master/font/gofont", "https://go.dev/"], "ig": 1.506, "fa": 2.35, "gp": 1.199, "bl": 0.0, "ds": 0.0, "txt": "Publishing a font seems to be just a lawyer trick to secure a trademark beyond a single area.\n\nWho has ever used the Go fonts [1] [2] owned by Google? It isn't even used on the official Go web site [2] (except on the announcement blog post).\n\nAny other alternate explanation would be welcome.\n\n[1]: https://go.dev/blog/go-fonts\n[2]: https://github.com/golang/image/tree/master/font/gofont\n[3]: https://go.dev/"}, {"id": 50662540, "au": "joveian", "dom": 129, "sr": 5, "sc": 11.71, "ep": 11.71, "bs": 0.0, "d": 0, "age": 12.21, "grav": 118.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 233, "qw": 0, "k": 1496, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://github.com/CatharsisFonts/Ysabeau", "https://www.behance.net/gallery/28579883/Cormorant-an-open-source-display-font-family"], "ig": 2.041, "fa": 2.08, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "I'm glad to see they are still updating it.  It is my favorite monospace font and I liked it enough to try using it instead of a propotional font in Firefox for a bit.  I recall the space character was basically the only thing I didn't like and I was going to try to make a \"slightly proportional\" version with just a smaller space but found Ysabeau first:\n\nhttps://github.com/CatharsisFonts/Ysabeau\n\nThat is a sans-serif proportional font with an even lower x-height.  IMO a low x-height plus a sufficiently large font size (and decent line spacing) gives the nicest look.  I have a large minimum font size set in Firefox and don't allow font substitution.  It breaks a few web sites but well worth it in my opinion; fewer things break now that Firefox doesn't apply these settings to SVG images.  Find a print source that you find particularly nice to read at the same distance as your monitor then hold it next to your monitor to set the font to that size.  For a matching serif font there is Cormorant by the same person (best for headlines but ok for those few websites that use serif body text):\n\nhttps://www.behance.net/gallery/28579883/Cormorant-an-open-s...\n\nBoth of these have a number of font features that I suspect most people will want to fiddle with a bit.  I turn liga, dlig, hlig, numr, dnom, and frac off and zero, lnum, calt, and ss03 on for both of these.  For Ysabeau I also turn"}, {"id": 50665537, "au": "jorams", "dom": 93, "sr": 6, "sc": 11.64, "ep": 11.79, "bs": 0.0, "d": 2, "age": 4.7, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 102, "qw": 0, "k": 4059, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": ["https://sr.ht/~ashton314/iosevka-output/"], "ig": 1.75, "fa": 2.08, "gp": 1.206, "bl": 0.0, "ds": 0.0, "txt": "I used to use Input Mono for years, then later found Iosevka Output[1] here on HN, a configuration of Iosevka tuned to be very similar to Input Mono. Iosevka has much broader character support and switching also fixed some issues I had in applications that use less common font rendering stacks.\n\nI've since made some of my own tweaks, which is very easy if you're building Iosevka anyway.\n\n(You should be aware though that Iosevka has introduced breaking changes to config details many times. I wouldn't expect the current state of the Iosevka Output repository to build with the current state of the Iosevka repository.)\n\n[1]: https://sr.ht/~ashton314/iosevka-output/"}, {"id": 50665298, "au": "369548684892826", "dom": 147, "sr": 7, "sc": 10.84, "ep": 10.84, "bs": 0.0, "d": 2, "age": 5.29, "grav": 35.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 68, "qw": 0, "k": 509, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://github.com/Raccffy/iA-Fonts"], "ig": 1.555, "fa": 2.08, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "I recommend trying iA Writer Quattro. It's a proportional font based on IBM Plex, from the developers of iA Writer.\n\nThe neat thing about it is that all the symbols have a really good width. I've not found another proportional font for coding that maintains monospace symbol legibility like Quattro does.\n\nThe iA Writer dev's release is actually missing some metadata but someone has forked the project and cleaned that up:\n\nhttps://github.com/Raccffy/iA-Fonts"}, {"id": 50658025, "au": "gumby", "dom": 24, "sr": 8, "sc": 10.31, "ep": 10.31, "bs": 0.0, "d": 2, "age": 21.61, "grav": 296.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 24, "qw": 0, "k": 65403, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://gwern.net/doc/design/typography/1980-knuth.pdf", "https://news.ycombinator.com/item?id=48216016"], "ig": 0.328, "fa": 2.69, "gp": 1.293, "bl": 0.0, "ds": 0.0, "txt": "You might enjoy this 1980 doc by Don on developing the letter S for metafont.\n\nAnd some HN discussion of same, from just a few months ago!\n\nhttps://gwern.net/doc/design/typography/1980-knuth.pdf\n\nhttps://news.ycombinator.com/item?id=48216016"}, {"id": 50655506, "au": "JdeBP", "dom": 113, "sr": 9, "sc": 10.01, "ep": 10.16, "bs": 0.0, "d": 0, "age": 25.77, "grav": 396.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 110, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": ["https://jdebp.uk/Softwares/nosh/guide/terminal-resources.html\u0023BroadMonospaceFonts"], "ig": 1.798, "fa": 1.58, "gp": 0.985, "bl": 0.0, "ds": 0.0, "txt": "It's an interesting commentary on computer programming languages that all of these 'for developers' fonts have such limited repertoires: some 1400 glyphs in this particular case.  That's actually quite low, with a number of monospaced fonts having several thousands of glyphs.\n\n* https://jdebp.uk/Softwares/nosh/guide/terminal-resources.htm...\n\nFor all that some programmers use ligature fakery to turn multiple characters into arrows and mathematical operators and whatnot, indicating that there's a non-negligible set of people willing to escape the limitations of 1960s typewriters nowadays, the actual programming languages have been very sluggish about adding things even as simple as U+00D7 and U+2212 and coding fonts can still get away with not doing very much compared to more general use writing fonts."}, {"id": 50655720, "au": "efortis", "dom": 144, "sr": 10, "sc": 9.75, "ep": 9.89, "bs": 0.0, "d": 4, "age": 25.42, "grav": 387.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 14, "qw": 0, "k": 833, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": ["https://github.com/ericfortis/camelana/blob/043b2f40ff504a255045dd907c766ff9929dcb6d/scripts/Camelana-Regular.fea\u0023L87"], "ig": 0.7, "fa": 2.35, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "The latter. It's a Contextual Alternate rule (`calt`)\n\nThis is the source code for that:\n\nhttps://github.com/ericfortis/camelana/blob/043b2f40ff504a25..."}, {"id": 50658084, "au": "eahm", "dom": 103, "sr": 11, "sc": 9.22, "ep": 9.52, "bs": 0.0, "d": 2, "age": 21.51, "grav": 294.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 32, "qw": 0, "k": 208, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": ["https://github.com/canonical/Ubuntu-Sans-Mono-fonts", "https://fonts.google.com/specimen/Ubuntu+Sans+Mono?preview.text=i1IlL0Oo", "https://fonts.google.com/specimen/Google+Sans+Code?preview.text=i1IlL0Oo"], "ig": 1.037, "fa": 2.08, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "You should try Ubuntu Sans Mono next.\n\nhttps://github.com/canonical/Ubuntu-Sans-Mono-fonts\n\nhttps://fonts.google.com/specimen/Ubuntu+Sans+Mono?preview.t...\n\nI think Hack, Ubuntu Mono and Ubuntu Sans Mono are the best FOSS ones after Consolas.\n\nI also use Google Sans Code for some other CSS things:\n\nhttps://fonts.google.com/specimen/Google+Sans+Code?preview.t..."}, {"id": 50656649, "au": "bayesnet", "dom": 1, "sr": 12, "sc": 7.67, "ep": 7.89, "bs": 0.0, "d": 0, "age": 23.88, "grav": 349.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 7, "k": 416, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://www.brailleinstitute.org/freefont/"], "ig": 1.306, "fa": 1.04, "gp": 1.281, "bl": 0.0, "ds": 0.0, "txt": "> Identifying the typographically underserved low-vision developer audience…\n\nVery strong recommendation for [Atkinson Hyperlegible Mono](https://www.brailleinstitute.org/freefont/) (and Next for that matter) which is easily the most legible font I’ve ever used. The Atkinson Hyperlegible family is an incredible OSS font (with source files available!) that IMO doesn’t get enough attention."}, {"id": 50654137, "au": "dspillett", "dom": 219, "sr": 13, "sc": 7.29, "ep": 7.29, "bs": 0.0, "d": 1, "age": 28.48, "grav": 469.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 17, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.74, "fa": 0.7, "gp": 0.83, "bl": 0.0, "ds": 0.0, "txt": "> Is this sufficiently different from everything in the great selection of monospace fonts available to us today?\n\n“A panel of low-vision and legally blind developers provided feedback at each stage of design” sounds like a potential key differentiator to me. Some other fonts state that legibility is a key feature, or further that legibility for those with visual impairments is specifically a goal, but they don't state how/if they've actually tested with people who are affected by it. What helps legibility for those of us with relatively OK eyes¹ may have no effect, or could perhaps make things worse, for those who experience significant sight issues, so systematic testing with a panel like this might have yielded useful differences.\n\n--------\n\n[1] Actually my eyes are shite and have been my whole life, but not in ways that yet cause me noticeable problems coding. I might try this to see if I notice any difference in my fatigue after long sessions (though I think this is mostly general screen fatigue, which a change of font is not going to help with)."}, {"id": 50656474, "au": "xp84", "dom": 77, "sr": 14, "sc": 7.11, "ep": 7.26, "bs": 0.0, "d": 2, "age": 24.17, "grav": 356.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 10058, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.598, "fa": 0.68, "gp": 1.08, "bl": 0.0, "ds": 0.0, "txt": "You’re probably not alone. You are to fonts what the millions of people who drink gas station coffee (or keep a tub of Folger’s ground coffee at home and make it in a $10 drip coffee machine) are to coffee.\n\nThat is to say, you’re just completely unfussy about the topic. It’s not a failing or flaw. If anything, it makes you more resilient. The person who needs a $9 espresso drink to function is miserable on a road trip when their preferred things aren’t available, but the unfussy-about-coffee person can grab coffee in a motel lobby and be happy.\n\nAnd you can code in any old environment with some default font and be happy."}, {"id": 50655516, "au": "andrewingram", "dom": 132, "sr": 15, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 0, "age": 25.75, "grav": 396.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 3005, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": ["https://www.intel.com/content/www/us/en/company-overview/one-monospace-font.html"], "ig": 1.537, "fa": 0.62, "gp": 0.988, "bl": 0.0, "ds": 0.0, "txt": "I love new typefaces, but I wish the rationale was a bit stronger than \"easier to read\", I want to know _how_. Show me the investigation into other monospace typefaces, show me the problems and how you solved them. I know this is the Github repo, but the only page I found discussing this is pretty light on details too (https://www.intel.com/content/www/us/en/company-overview/one...). Basically the lowercase e and uppercase G are more distinctive than usual.\n\nEvery tech company seems to be making their own free-to-use mono fonts these days, which I celebrate because I like choice, but I also want to be convinced it's more than just a vanity exercise."}, {"id": 50655903, "au": "rednafi", "dom": 171, "sr": 16, "sc": 6.61, "ep": 6.61, "bs": 0.0, "d": 0, "age": 25.17, "grav": 381.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 39, "qw": 0, "k": 1919, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": ["https://www.jetbrains.com/lp/mono/"], "ig": 1.105, "fa": 0.96, "gp": 0.881, "bl": 0.0, "ds": 0.0, "txt": "I find it impossible to move away from Jetbrains mono. I have been using it since it's release in ~2020 and haven't looked for anything else.\n\nNow every font I look at is either too fat / too narrow or too squared / too rounded.\n\nhttps://www.jetbrains.com/lp/mono/"}, {"id": 50654338, "au": "setopt", "dom": 41, "sr": 17, "sc": 6.33, "ep": 6.63, "bs": 0.0, "d": 1, "age": 28.0, "grav": 455.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 38, "k": 1417, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.646, "fa": 0.7, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "> Sure, the small l might look like a 1, the O like a 0. But in all these years I've been using a computer, of which a great percentage was spend in an editor writing code, these things - for me! - have never once been an issue.\n\nSame here. Therefore, the distinguishability of symbols is my least concern when picking a coding font. My main concern is how comfortable it is to look at, which for me largely comes down to being neither a bitmap font (which I can’t zoom comfortably when changing to a screen with different resolution), but neither a badly hinted vector font (which turns blurry and tires my eyes).\n\nI keep going back to JetBrains Mono, which is the “least blurry vector font” I’ve found so far, to put it that way."}, {"id": 50655187, "au": "quietbritishjim", "dom": 23, "sr": 18, "sc": 6.13, "ep": 6.57, "bs": 0.0, "d": 1, "age": 26.36, "grav": 412.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.994, "fa": 0.28, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "To be honest this is just as extreme of a view as those that fuss over every tiny detail of their fonts.\n\nI find most recent (last decade or two) fonts pretty similar. I can't really tell the difference between Windows default sans serif (Calibri) and Android's (Roboto) for example. Similarly for most serif and fixed width fonts you're likely to encounter today. But the change from the old Windows fonts (Arial, Times, Courier) is a lot more dramatic, I wouldn't want to go back to those.\n\nThe default LaTeX font, ironically named \"Modern\", is particularly painful. (I understand it's far too light because it was optimised for being printed with old printers that bled ink to surrounding pixels so implicitly bolded text a little.)"}, {"id": 50655624, "au": "tenderfault", "dom": 183, "sr": 19, "sc": 6.07, "ep": 6.29, "bs": 0.0, "d": 0, "age": 25.57, "grav": 391.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 53, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.476, "fa": 0.56, "gp": 0.847, "bl": 0.0, "ds": 0.0, "txt": "like SF Mono with a touch of comic. not sure which is better but it feels like both are off on my system.\n\ni looked at it in 128dpi 2560x1440 xterm dark and light, scale height=1.2, width=0.6, size 11\n\ncan't beat IBM Plex Mono, IMHO. for terminal or ide.\n\nbut choosing a font is so hard, even only for a small use case like a terminal. it depends on so many factors, one being the OS itself not only hardware"}, {"id": 50655910, "au": "jaen", "dom": 92, "sr": 20, "sc": 5.75, "ep": 6.63, "bs": 0.0, "d": 1, "age": 25.16, "grav": 381.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 388, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.751, "fa": 0.28, "gp": 1.186, "bl": 0.0, "ds": 0.0, "txt": "I started off with Iosevka for this purpose, then moved to Cousine (excellent legibility), but to really optimize it, \"Input Mono Compressed\" seems to have an even better horizontal/vertical size balance and readability (glyph shape and cell coverage) at small sizes, at least according to my tastes.\n\nUsing Input for everything where space is at a premium (eg. terminals), and Cousine elsewhere (with slight line height tweaks, if that's not available, then Fira Code)."}, {"id": 50654603, "au": "Leonard_of_Q", "dom": 64, "sr": 21, "sc": 5.61, "ep": 6.05, "bs": 0.0, "d": 1, "age": 27.43, "grav": 440.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 319, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.629, "fa": 0.34, "gp": 0.867, "bl": 0.0, "ds": 0.0, "txt": "Fonts seem to attract the same type of people as do wine, HiFi, watches and other similar things. Most people want them to be good enough to not care about them anymore but in some they awake a passion which often transcends any sense of utility. Whether it is the audiophile with his \"99.99999% pure oxygen-free orientated strand interconnects\", the wine snob who declares he can discern whether the grapes in his bottle of Chateau Migraine-Delusionne were picked at midnight or in the morning or the font fanatic who waxes lyrically about the particular shape of the descender on the double-f ligature, the same seems to apply: these are passions and as such not directly linked to utility or rationality. Me, I'll use whatever is provided as long as it does its job. If it doesn't I'll change it for something which does. No passion, just utility."}, {"id": 50656006, "au": "rootbear", "dom": 43, "sr": 22, "sc": 5.06, "ep": 5.5, "bs": 0.0, "d": 1, "age": 25.02, "grav": 377.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 38, "k": 2583, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.455, "fa": 0.42, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "> Sure, the small l might look like a 1, the O like a 0. But in all these years I've been using a computer, of which a great percentage was spend in an editor writing code, these things - for me! - have never once been an issue.\n\nIn my forty year career, that only bit me once, as an undergraduate. I was working on a program for my Fortran class and I could not find what was wrong with my code. A classmate looked at my program (on green and white stripe, fuzzy line printer output) and asked why I had written\n\n  X = F(1)\n\nand not\n\n  X = F(I)\n\nProblem solved!"}, {"id": 50654214, "au": "greatgib", "dom": 257, "sr": 23, "sc": 5.02, "ep": 5.24, "bs": 0.0, "d": 0, "age": 28.28, "grav": 463.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 6565, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.475, "fa": 0.28, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "How to install easily in current user for all apps in Linux distributions:\n\n- Download the ttf zip (or otf) and from the extracted folder run:\n\n   mkdir -p ~/.local/share/fonts/intel-one-mono\n   cp *.ttf *.otf ~/.local/share/fonts/intel-one-mono/\n   fc-cache -f"}, {"id": 50654528, "au": "2Gkashmiri", "dom": 75, "sr": 24, "sc": 4.92, "ep": 5.36, "bs": 0.0, "d": 1, "age": 27.58, "grav": 444.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 2861, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.718, "fa": 0.0, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "Forgive my ignorance.\n\nI have been involved with tech since I was 2. I have seen DOS going till now.\n\nI spend my day writing. I am a lawyer so I spend my time on text, reading writing etc.\n\nI don't see any \"difference\" at 12 point size from times new Roman to something else.\n\nNot that there is a defect in eyesight but on the opposite, it doesn't invoke that feeling.\n\nI would rather have a common font and yeah.\n\nI am not into design so I never get to use the font weight even.\n\nI have read about \"Steve jobs and true type fonts\"  but it never made sense to me.\n\nEven today, the font showcased, how is it different from the other system fonts? On a higher level I mean.\n\nI just want something that works.\n\nEvery often a new font turns up, usually on HN and I just don't see the excitement.... \nAm I alone?"}, {"id": 50654189, "au": "Jakob", "dom": 45, "sr": 25, "sc": 4.89, "ep": 5.33, "bs": 0.0, "d": 1, "age": 28.34, "grav": 465.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 1462, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.828, "fa": 0.0, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "I agree for humans. For machine-readability it’s required though. One of the situations where I miss this is in the browser URL box.\n\nI often do an OCR of e.g. a shared Google Doc URL from a Zoom session, to avoid asking “please share the link” and the macOS OCR regularly confuses l, I, |, O, 0 since the URL is random.\n\nTo fix this, I have a script that just tries out all combinations, but it still would be great if browser address boxes would be better machine-readable. (Or macOS would become better at differentiating the minute differences between these characters in its default system font)"}, {"id": 50654824, "au": "zokier", "dom": 146, "sr": 26, "sc": 4.66, "ep": 5.4, "bs": 0.0, "d": 1, "age": 27.01, "grav": 429.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 19258, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": ["https://lisnoti.com/code/", "https://input.djr.com/preview/"], "ig": 1.165, "fa": 0.62, "gp": 0.616, "bl": 0.0, "ds": 0.0, "txt": "I'm proponent of proportional fonts for coding but your example is pretty wild (to be generous) typographically.\n\nCheck Lisnoti Code or Input samples for more traditional yet proportional styles:\n\nhttps://lisnoti.com/code/\n\nhttps://input.djr.com/preview/"}, {"id": 50654649, "au": "eddyg", "dom": 187, "sr": 27, "sc": 4.65, "ep": 4.87, "bs": 0.0, "d": 0, "age": 27.32, "grav": 437.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2257, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.461, "fa": 0.0, "gp": 0.994, "bl": 0.0, "ds": 0.0, "txt": "Anybody know why Windows is “special” in terms of manual hunting?\n\n”The .ttf, .woff and .woff2 fonts provided in the official release have been manually optimized for screen display, improving clarity and legibility, especially on Windows platforms.”"}, {"id": 50659182, "au": "coldtea", "dom": 229, "sr": 28, "sc": 4.42, "ep": 5.23, "bs": 0.0, "d": 1, "age": 19.78, "grav": 256.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 27, "k": 93969, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.43, "fa": 0.42, "gp": 0.462, "bl": 0.0, "ds": 0.0, "txt": ">But every big company releasing their own monospace font or family has some really small dck energy smell by now.*\n\nThis analogy is so incoherent  it reads like some unc tryna farm aura with gen alpha brainrot but bro NOT passing the vibe check by at least 67\n\n>Monospace fonts are not for regular typesetting\n\nSo? This is a code font, as it repeats several times in the intro page"}, {"id": 50655937, "au": "al_borland", "dom": 35, "sr": 29, "sc": 4.36, "ep": 5.24, "bs": 0.0, "d": 1, "age": 25.12, "grav": 380.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 13376, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": ["https://tosche.net/fonts/comic-code"], "ig": 1.337, "fa": 0.62, "gp": 0.227, "bl": 0.0, "ds": 0.0, "txt": "I started using Comic Code[0], a font inspired by Comic Sans, kind of as a joke instead of getting caught up in the more serious programming fonts people like to debate. It turned out, I actually really liked how unserious it is, while it’s also easy to read. I’ve been using it for 6+ years now. It’s so different from the others that I no longer find it worth my time to debate what I want my 0s to look like.\n\n[0] https://tosche.net/fonts/comic-code"}, {"id": 50655617, "au": "leokennis", "dom": 135, "sr": 30, "sc": 4.03, "ep": 4.69, "bs": 0.0, "d": 0, "age": 25.58, "grav": 391.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 4602, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.194, "fa": 0.34, "gp": 0.634, "bl": 0.0, "ds": 0.0, "txt": "I like reading about new fonts and at the same time, on the primary machine where I do 99% of my code work (my work laptop) I cannot install any fonts...so long ago I accepted I need to learn to love the OS built in monospaced fonts."}, {"id": 50654397, "au": "dorfsmay", "dom": 130, "sr": 31, "sc": 3.94, "ep": 4.6, "bs": 0.0, "d": 0, "age": 27.88, "grav": 452.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 5366, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": ["https://www.jetbrains.com/lp/mono/"], "ig": 0.87, "fa": 0.62, "gp": 0.544, "bl": 0.0, "ds": 0.0, "txt": "I've been happy with Her brains Mono. Back when I tested it was the one that stays legible the longest as I reduced the font size of a terminal.\n\nhttps://www.jetbrains.com/lp/mono/\n\nAlso available on Google fonts."}, {"id": 50653933, "au": "virtualritz", "dom": 218, "sr": 32, "sc": 3.8, "ep": 4.97, "bs": 0.0, "d": 0, "age": 29.01, "grav": 483.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 3321, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.579, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "Don't get me wrong, great for whichever foundry/designer got paid to make it.\n\nBut every big company releasing their own monospace font or family has some really small d*ck energy smell by now.\n\nIs this sufficiently different from everything in the great selection of monospace fonts available to us today?\n\nMonospace fonts are not for regular typesetting.\n\nFor the latter application (proportional fonts) we can never have enough ofc."}, {"id": 50654149, "au": "kleiba2", "dom": 22, "sr": 33, "sc": 3.78, "ep": 4.66, "bs": 0.0, "d": 0, "age": 28.45, "grav": 468.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 800, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.338, "fa": 0.0, "gp": 1.048, "bl": 0.0, "ds": 0.0, "txt": "Fonts is an ever welcome topic of discussion and exchange of opinions.\n\nMe, I've got to admit that I have worked on many different computer systems since the 80s, with many different fonts that for a long time you could not even change or customize. And you know what, it all worked. It was fine. And thus I really don't care too much what font I'm using - usually the preinstalled one.\n\nSure, the small l might look like a 1, the O like a 0. But in all these years I've been using a computer, of which a great percentage was spend in an editor writing code, these things - for me! - have never once been an issue.\n\nThat doesn't mean you have to be like me! I know that fonts are a great thing to get nerd sniped over. But for me, personally, I consider it mostly bikeshedding."}, {"id": 50655052, "au": "glimshe", "dom": 70, "sr": 34, "sc": 3.71, "ep": 5.03, "bs": 0.0, "d": 1, "age": 26.6, "grav": 418.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.741, "fa": 0.0, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "Came here to write something like this. I geeked out on fonts for a while. It has all the juicy ingredients we technical geeks love.\n\nHowever, over the years I was disappointed with the actual productivity/readability impact. Sure, some fonts are better than others (Comic Sans isn't a good coding font). But for me, it's more like broad categories of \"good fonts\", \"meh fonts\" and \"bad fonts\" with little differentiation within the groups.\n\nAlso, I noticed that the best fonts aren't necessarily the ones with long articles explaining all the micromanagement of kerning and serifs that went into creating them."}, {"id": 50656721, "au": "glitchc", "dom": 190, "sr": 35, "sc": 3.14, "ep": 4.02, "bs": 0.0, "d": 0, "age": 23.76, "grav": 346.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 5497, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "The lowest stroke of the character 'e' does not reach the end of the letter. It feels incomplete whenever I see it. Given that 'e' is the most common letter in English, it's unfortunately a hard pass for me, even though I'm a big fan of mono fonts and have used many in the past (currently on 0xProto).\n\nIt's such an odd design choice, especially for a mono font. I wonder what drove it."}, {"id": 50655058, "au": "bitwize", "dom": 238, "sr": 36, "sc": 3.12, "ep": 4.22, "bs": 0.0, "d": 0, "age": 26.59, "grav": 418.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.591, "fa": 0.0, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "Oh look, looks like another OCR B clone. At least Iosevka and my latest favorite, Nordwand Mono, inject a little character and originality while looking sharp and professional. Most monospace fonts are woefully bereft of good ideas which is why I stuck to pixel fonts for years: the different pixel fonts conveyed a sense of the personalities of their respective computers."}, {"id": 50657149, "au": "Slow_Hand", "dom": 3, "sr": 37, "sc": 3.06, "ep": 4.3, "bs": 0.0, "d": 1, "age": 23.0, "grav": 328.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1617, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.122, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Second. I've been using Atkinson Hyperlegible in my personal projects ever since it was announced.\n\nI don't have any large vision issues, but I appreciate something so fine-tuned for readability, since I spend all day typing and reading. It's very easy on the eyes and doesn't ever pop out for the wrong reasons. Big fan."}, {"id": 50655652, "au": "threatofrain", "dom": 26, "sr": 38, "sc": 3.01, "ep": 4.11, "bs": 0.0, "d": 2, "age": 25.54, "grav": 390.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 13182, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 0.487, "fa": 0.68, "gp": 0.708, "bl": 0.0, "ds": 0.0, "txt": "Accepting defaults is not an extreme view, and this changes by the year.\n\nThe people of 2026 will find their out of the box experiences on a lot of tooling simply better, so what will 2030 be? I don't expect bad font experiences anymore, and I don't expect to have to invest to make that so."}, {"id": 50653899, "au": "siva7", "dom": 247, "sr": 39, "sc": 2.83, "ep": 3.05, "bs": 0.0, "d": 1, "age": 29.09, "grav": 486.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 5523, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.299, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "like the good ol' punch card, we are now that old generation who will be telling those young grads what it was like in the past century when developers used things called code editors typing in code manually. i feel old."}, {"id": 50656038, "au": "dorfsmay", "dom": 76, "sr": 40, "sc": 2.83, "ep": 4.37, "bs": 0.0, "d": 2, "age": 24.97, "grav": 376.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 5366, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.533, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "Context and size.\n\nI can see why 1,i,l and o,O,0 are rarely or never confused within the context of the work a lawyer do but in a sysadmin/developer context there are a lot of opportunities for confusion. A \"good\" font mean I never wonder which one is which.\n\nSometimes I need to have lots of apps and terminals open on the same screen, making some of them smaller helps. When it gets small enough, a \"good\" font makes the difference between readable and not."}, {"id": 50657237, "au": "chrka", "dom": 175, "sr": 41, "sc": 2.6, "ep": 3.7, "bs": 0.0, "d": 0, "age": 22.84, "grav": 324.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 187, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.348, "fa": 0.0, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "Currently, in my CSS file for a browser-based IDE - where it’s important to be able to distinguish between the \"1\" from \"l\" and the \"O\" from \"0\" - I have something like this:\n\n--font-mono:Menlo, \"Cascadia Code\", \"Liberation Mono\", Consolas, monospace;\n\nAnd then I don’t know which font is actually used and what the actual font size is. This Intel font looks good - it would be great if it could be guaranteed that it’s included in all major browsers (Chrome, Firefox, Safari)."}, {"id": 50654321, "au": "MonkeyClub", "dom": 225, "sr": 42, "sc": 2.55, "ep": 3.43, "bs": 0.0, "d": 5, "age": 28.04, "grav": 457.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 2397, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.157, "fa": 0.22, "gp": 0.059, "bl": 0.0, "ds": 0.0, "txt": "If the horse is healthy, you don’t need to pay for its dental care.\n\nIf it’s not, then it appears to be free (being a gift), but has hidden costs that you’re taking on without realizing when you accept the gift.\n\nAn example: free wooden horse! Hidden cost: Troy sacked.\n\nAnother example: free email! Hidden cost: your data sold off.\n\nI hope that clarifies why one should always inspect horses upon being offered them."}, {"id": 50656652, "au": "cosmotic", "dom": 209, "sr": 43, "sc": 2.47, "ep": 3.35, "bs": 0.0, "d": 0, "age": 23.88, "grav": 349.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 3550, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "Is there ever anything meaningful in descriptions of fonts? They always seem like nonsense to me. What does it mean for a font to be expressive? Are any serious fonts not taking legibility in mind? Monospace, at this point, is always for developers. Would be nice to know what sets this apart from all others. I presume just that intel owns the copyright."}, {"id": 50655413, "au": "pmarreck", "dom": 50, "sr": 44, "sc": 2.44, "ep": 3.98, "bs": 0.0, "d": 1, "age": 25.94, "grav": 401.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 6964, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": ["https://usgraphics.com/products/berkeley-mono"], "ig": 0.83, "fa": 0.62, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "Berkeley Mono was the only coding font I ever actually bought.\n\nhttps://usgraphics.com/products/berkeley-mono\n\nmy only criticism of it is that it’s difficult to use in open-source contexts such as Nix, but I have my workarounds"}, {"id": 50659468, "au": "ianmarcinkowski", "dom": 177, "sr": 45, "sc": 2.33, "ep": 3.43, "bs": 0.0, "d": 0, "age": 19.42, "grav": 248.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 38, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.258, "fa": 0.0, "gp": 0.326, "bl": 0.0, "ds": 0.0, "txt": "I'm curious about how things like this happen. Is this a passion project of someone who works at Intel and the company doesn't squash it? Do we need another monospace font? Is this to remove some copyrighted material from some random corner of Intel's codebase?\n\nBtw it looks nice! And I'm glad people are still making fonts. I'm just curious"}, {"id": 50656175, "au": "kccqzy", "dom": 95, "sr": 46, "sc": 2.3, "ep": 3.84, "bs": 0.0, "d": 2, "age": 24.7, "grav": 369.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 20062, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.556, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "I love Input Mono Compressed. It also has a condensed version that I pick based on how much space is at a premium. I even made special versions that renames it to Menlo or to SF Mono just because web designers using Macs love to specify Apple’s default monospace fonts near the front of their font-family CSS rule."}, {"id": 50660070, "au": "fellowniusmonk", "dom": 200, "sr": 47, "sc": 2.29, "ep": 3.39, "bs": 0.0, "d": 0, "age": 18.37, "grav": 227.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1899, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.325, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Monospace Xenon and Mona sans.\n\nI've put a crazy amount of time into reading these fonts without syntax highlighting or colorization or even inline styles like bold/etc. and they have been easily the most comfortable and legible."}, {"id": 50656838, "au": "crostlybostly", "dom": 207, "sr": 48, "sc": 2.28, "ep": 3.38, "bs": 0.0, "d": 2, "age": 23.55, "grav": 341.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 47, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think intel should be all hands on deck making competitive chips before they spend ANY time or money on side activities. This is a company that is taxpayer funded now because they keep failing to innovate. And they received taxpayer funding to invest in and establish competitive chips before designs and fabs. Not to make fonts."}, {"id": 50667921, "au": "01CPMD3174", "dom": 2, "sr": 49, "sc": 2.25, "ep": 3.64, "bs": 0.0, "d": 1, "age": 0.68, "grav": 5.9, "surf": 58.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 23, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.016, "fa": 0.34, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "This is why I love HN.\n\nAtkinson Hyperlegible looks and reads great.\n\nI’m 100% installing this on my machines this weekend.\n\nEdit: added missing period and a line break."}, {"id": 50654232, "au": "imp0cat", "dom": 223, "sr": 50, "sc": 2.21, "ep": 3.32, "bs": 0.0, "d": 4, "age": 28.24, "grav": 462.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 733, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 0.922, "fa": 0.22, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Yeah, what's the point?\n\nIf the horse if free, the dentist will always cost more, unless you can somehow get free services from a horse dentist, which is quite unlikely."}, {"id": 50657410, "au": "jaen", "dom": 94, "sr": 51, "sc": 2.2, "ep": 3.74, "bs": 0.0, "d": 2, "age": 22.55, "grav": 317.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 388, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.592, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Note: When comparing terminal font legibility, one generally has to use fractional font sizes, since different fonts with the same point size (eg. 11pt) do NOT result in the same character cell size (height). Bit annoying to tweak, but otherwise it's comparing apples to oranges...\n\nAlso eg. Konsole has a bug where it does not update the cell size sometimes when you change the font."}, {"id": 50662815, "au": "k0morebi", "dom": 192, "sr": 52, "sc": 2.2, "ep": 3.3, "bs": 0.0, "d": 0, "age": 11.41, "grav": 107.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 70, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.312, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Every time I see a font show up on the front page, I roll my eyes and think, \"ffs, do we really need another font?\". Then I click it and almost always agree, that yes, one more is a good idea, indeed. I like this font a lot but too ignorant to understand why. Adding to my PCs"}, {"id": 50655474, "au": "GuB-42", "dom": 49, "sr": 53, "sc": 2.15, "ep": 3.69, "bs": 0.0, "d": 1, "age": 25.82, "grav": 397.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.334, "bl": 0.0, "ds": 0.0, "txt": "I has never been an issue to me either.\n\nSame idea for keyboards, I have worked with cheap keyboards, the kind they give away when you buy a computer and fancy mechanical keyboards and I am pretty sure it hasn't affected my performance in the slightest.\n\nBut when you work with something all day, you may want something nice. Like having a nice desk when a simple plywood plank on trestles would work just as well. Same thing for fonts, and keyboards."}, {"id": 50659257, "au": "FireBeyond", "dom": 57, "sr": 54, "sc": 2.11, "ep": 3.65, "bs": 0.0, "d": 2, "age": 19.71, "grav": 254.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 22740, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.546, "fa": 0.0, "gp": 0.014, "bl": 0.0, "ds": 0.0, "txt": "I do like Berkeley Mono but can't quite bring myself to pull the trigger on it. I do like Ioskeley. I have bought several mono fonts: Pragmata Pro, Operator Mono, Triplicate (which gives me vibes of my first ever work computer, at a bus company of all places, where I had a Sparc 5 on my desk that we used to do schedule and roster management and optimization)."}, {"id": 50655659, "au": "isolatedsystem", "dom": 65, "sr": 55, "sc": 2.06, "ep": 3.6, "bs": 0.0, "d": 2, "age": 25.53, "grav": 390.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 164, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Rubbish. I've never known a snobbish font lover. In my experience (as someone who's bought thousands of dollars worth of fonts for no other reason than love), font lovers are just uniformly enthusiastic about how beautiful a wall of text, a UI, a signboard, a placard or a website can look with the right fonts. They are all just infectiously enthusiastic about the beauty of letters."}, {"id": 50662674, "au": "a_e_k", "dom": 8, "sr": 56, "sc": 2.06, "ep": 3.64, "bs": 0.0, "d": 1, "age": 11.88, "grav": 113.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2653, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 0.926, "fa": 0.0, "gp": 1.012, "bl": 0.0, "ds": 0.0, "txt": "Even though I have normal vision, I have Atkinson Hyperlegible Next set as my daily-driver desktop UI font in KDE Plasma (with Atkinson Hyperlegible Mono in the fixed width slot).  It makes for an excellent system UI font."}, {"id": 50658294, "au": "m463", "dom": 59, "sr": 57, "sc": 2.06, "ep": 3.54, "bs": 0.0, "d": 1, "age": 21.2, "grav": 286.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 25432, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.426, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "I think your vision probably tracked with advances in legibility.\n\nWhen I was young I could read the finest print books in the dark.\n\nWhen I was older, but not gotten cataract surgery, reading was a brightly lit display with large sized fonts."}, {"id": 50657080, "au": "zerkten", "dom": 4, "sr": 58, "sc": 2.06, "ep": 3.52, "bs": 0.0, "d": 1, "age": 23.09, "grav": 330.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1435, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 0.787, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Is there any planned option for browsers to indicate low vision similar to dark mode? I'm aware of refers-contrast but was wondering if there was anything more explicit to indicate that a font like this should be used."}, {"id": 50656414, "au": "xp84", "dom": 68, "sr": 59, "sc": 2.06, "ep": 3.44, "bs": 0.0, "d": 2, "age": 24.3, "grav": 359.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 10058, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is an interesting argument. But I think it suffers when you go into things like audiophile, where the utility is supposedly there (but made up). I’m definitely not more productive in my favorite coding fonts (or regular fonts when writing prose) and have never claimed to be. I only like using nice fonts for pure aesthetics and joy reasons. I’ll admit it is a good match for wine enthusiasts though because literal taste is just another sense so “it just tastes different” = “it just looks different.”"}, {"id": 50654455, "au": "hizlikovboy27", "dom": 44, "sr": 60, "sc": 2.06, "ep": 3.41, "bs": 0.0, "d": 1, "age": 27.75, "grav": 449.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 14, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.326, "fa": 0.0, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "Yes i have actually encountered this issue myself before. When I was work at a company, the zeros I printed on small Zebra labels ended up looking like eights and the fonts available for those labels were very limited. So, instead of using a zero, I used the capital letter \"O\" and that solved the problem :)"}, {"id": 50663776, "au": "teo_zero", "dom": 78, "sr": 61, "sc": 2.06, "ep": 3.37, "bs": 0.0, "d": 2, "age": 8.8, "grav": 72.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 5, "k": 1545, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 0.912, "fa": 0.42, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "> I just want something that works.\n\nI think this sentence summarizes your concept more than any other paragraphs.\n\nWe have primary needs. They make our life/job possible. These are about functionality. Good objects/products satisfy these needs if they work. The key point is what they do.\n\nThen there are secondary needs to make our life/job enjoyable. These are about aesthetics and taste. Good objects/products satisfy these needs if they make you feel better when you use them. The key point is how they make you feel.\n\nWhile primary needs are nearly universal, secondary ones are pretty personal. Some of us like good food/wine/coffee, others eat only to ingest calories/caffeine. Some spend a fortune in clothes, others would wear the same uniform everyday.\n\nAs it happens, you have not developed a particular taste for fonts, and whatever is readable will do for you. Nothing wrong. And you're not alone if you don't see the excitement. I don't get my wife's obsession with shoes, either!"}, {"id": 50658521, "au": "quietbritishjim", "dom": 27, "sr": 62, "sc": 2.06, "ep": 3.32, "bs": 0.0, "d": 3, "age": 20.85, "grav": 279.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.001, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's misrepresenting what I said. In fact, I think you're agreeing with me with a tone of disagreement.\n\nI said that I accept defaults today, so that's definitely not what I was considering extreme. I think we both agree that font experiences do noticeably improve over time, but suffices to keep to the defaults.\n\nAs I read it (but looking back now I'm not so sure), OP seemed to be implying that they don't even see a difference between today's fonts and displays from 40 years ago."}, {"id": 50654345, "au": "globular-toast", "dom": 105, "sr": 63, "sc": 2.06, "ep": 3.3, "bs": 0.0, "d": 3, "age": 27.99, "grav": 455.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 6350, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 0.99, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I decided to not be lazy. Tried both Iosevka and Ioskeley and none are as good Ubuntu Mono.\n\nIt's the line height more than anything. Somehow Ubuntu Mono crams way more text than any other font I've tried, while still remaining legible and comfortable. To get the same amount of lines with these fonts I have to reduce the size to an uncomfortably small size.\n\nI don't mind sticking with Ubuntu Mono, but it would be nice to have a change after like 15 years of the same font..."}, {"id": 50654898, "au": "GCUMstlyHarmls", "dom": 109, "sr": 64, "sc": 2.06, "ep": 3.24, "bs": 0.0, "d": 2, "age": 26.89, "grav": 426.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 634, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "For the most part, its thinner. The glyphs \"cells\" are thinner and take up less width than many other monospace fonts.\n\nIt also has a pretty wide coverage of symbols and is very customisable if you want, eg: swap out a slash-zero for a dot-zero, etc.\n\nI've used it for years, never customised it, really only use it for the width savings when it was important to fit more on my screen and now its habit/preference."}, {"id": 50655290, "au": "Marazan", "dom": 237, "sr": 65, "sc": 2.06, "ep": 3.12, "bs": 0.0, "d": 0, "age": 26.14, "grav": 406.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3719, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.137, "fa": 0.0, "gp": 0.308, "bl": 0.0, "ds": 0.0, "txt": "I actively like this.  Whilst it won't displace my favourite programming font (the entirely quixotic monofur) it feels like it has the the same (but not quite so) psychotic devotion to legibility that monofur has which I value highly."}, {"id": 50654972, "au": "eloisant", "dom": 42, "sr": 66, "sc": 2.06, "ep": 3.11, "bs": 0.0, "d": 1, "age": 26.75, "grav": 422.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 6844, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "It never been an issue for me, however there are cases where switching fonts really improved my comfort.\n\nIt's different now that we have great fonts by default, but switching to Fira code with ligatures when the default font didn't have them really made a difference for me.\n\nOf course it's never necessary, it's more of a preference thing but it's so easy to change that calling that \"bikeshedding\" is a bit extreme."}, {"id": 50662027, "au": "noisy_boy", "dom": 174, "sr": 67, "sc": 2.06, "ep": 2.99, "bs": 0.0, "d": 0, "age": 13.66, "grav": 141.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 6621, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "Too much vertical gap. So far I haven't seen a font that looks better while packing in so much as Jetbrains Mono (maybe Pragmata Pro Mono is tighter but it is too small at size 12 and too big at 13 and I don't find it as readable). Fira Code is a close second for me."}, {"id": 50656542, "au": "mbreese", "dom": 30, "sr": 68, "sc": 2.06, "ep": 2.97, "bs": 0.0, "d": 3, "age": 24.07, "grav": 354.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 14795, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s all about the medium. Fonts designed for print are usually suboptimal on screen (and vice versa). For (probably all of) its initial life, LaTeX was used for print work, so it makes sense.\n\nBut defaults are hard to break, so once Modern was the default, it stuck."}, {"id": 50658267, "au": "Leonard_of_Q", "dom": 66, "sr": 69, "sc": 2.06, "ep": 2.96, "bs": 0.0, "d": 3, "age": 21.24, "grav": 287.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 319, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You seem to take the \"wine snob\" quip as a personal attack? I have met 'font snobs' and have worked with them at a publishing house. Perfectly fine people who took their font fancies a bit to seriously but that is their prerogative, I had them write articles on their favourite subject - I was editor in chief for a 'computer magazine' back then. The same goes for audiophiles, the aforementioned wine snobs' and anyone else who - in my opinion - overdoes the importance of choosing just the right utilitarian good over over others and will find reasons to defend that choice against those who think differently or not at all."}, {"id": 50653821, "au": "voidUpdate", "dom": 118, "sr": 70, "sc": 2.06, "ep": 2.94, "bs": 0.0, "d": 0, "age": 29.3, "grav": 492.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 4542, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "legibility_fonts", "flbl": "Legibility & Fonts (Screen)", "urls": [], "ig": 0.925, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "I'm guessing it's something to do with low-vision legibility and distinctiveness, but that lowercase e looks... unfinished. The tail feels like it wants to be just a bit longer"}, {"id": 50661562, "au": "tom_", "dom": 204, "sr": 71, "sc": 2.06, "ep": 2.87, "bs": 0.0, "d": 1, "age": 14.98, "grav": 163.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 3902, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.221, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've used Go Mono. I quite liked Luxi Mono, and so I quite like Go Mono too. Nice to have some serifs.\n\n(It's a bit squat for my taste, though, so I usually use Noto Sans, or one of the compressed Input Mono variants.)"}, {"id": 50661611, "au": "3eb7988a1663", "dom": 203, "sr": 72, "sc": 2.06, "ep": 2.87, "bs": 0.0, "d": 1, "age": 14.83, "grav": 161.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3421, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 1.221, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is my understanding that licensing fonts can be a huge PITA. Different usage rights for websites vs printed media, annual renewals, maybe you need external audits to count usage numbers.\n\nInstead, you can pay a firm a one time fee to make your forever font and be done with all of that nonsense."}, {"id": 50655819, "au": "OriginalPenguin", "dom": 189, "sr": 73, "sc": 2.06, "ep": 2.84, "bs": 0.0, "d": 1, "age": 25.3, "grav": 384.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 220, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.21, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because it’s made by Intel.  Which means they aren’t going to bother spending extra time optimizing for the Mac since Apple doesn’t use their chips.\n\nAnd the Linux desktop is a small fragmented market unfortunately."}, {"id": 50654268, "au": "digital_af", "dom": 128, "sr": 74, "sc": 2.06, "ep": 2.81, "bs": 0.0, "d": 2, "age": 28.17, "grav": 460.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 8, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mono_terminal", "flbl": "Mono & Terminal (Berkeley)", "urls": [], "ig": 1.197, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From memory, I'd say no.\n\nPlex tries to not look \"round\" without being boxy, Pragmata embraces the curves. Also, Pragmata runs very narrow and Plex is quite the opposite.\n\nThey both have that technical mono feel, but the how and why are very different."}, {"id": 50655671, "au": "card_zero", "dom": 166, "sr": 75, "sc": 2.06, "ep": 2.8, "bs": 0.0, "d": 3, "age": 25.52, "grav": 390.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 4441, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 0.781, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"U+2113 Script Small L\", very pretty. Yeah, probably, but why is cursive leaking into my rigidly precise monospaced font? Might as well throw one of those diamond-shaped terminals from Fraktur into the mix."}, {"id": 50654331, "au": "IshKebab", "dom": 145, "sr": 76, "sc": 2.06, "ep": 2.77, "bs": 0.0, "d": 2, "age": 28.03, "grav": 456.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It says it's the font. I do like the idea but the amount of extra space seems a bit overkill.\n\nI used to use proportional fonts, but back in the day the use of dumb space based indentation makes them not work so well. I guess now that we all use auto formatters I might try them again."}, {"id": 50658701, "au": "quietbritishjim", "dom": 25, "sr": 77, "sc": 2.06, "ep": 2.75, "bs": 0.0, "d": 3, "age": 20.57, "grav": 273.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.171, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is interesting, thanks!\n\nIt's funny, that paper starts with images of the letter \"S\" that, although not perfect, look acceptable to my untrained eye. By the end of the paper, the later iterations of \"S\" look, to me, horrific.\n\nEdit, now that I've read it: that's because the early S is from a totally different font. I was tricked because some early figures render the 16th century S in METAFONT with a couple of variations."}, {"id": 50655069, "au": "getfacl", "dom": 178, "sr": 78, "sc": 2.06, "ep": 2.73, "bs": 0.0, "d": 0, "age": 26.57, "grav": 417.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 223, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 0.91, "fa": 0.0, "gp": 0.408, "bl": 0.0, "ds": 0.0, "txt": "I love this font.\n\nI use it for all my terminals and editors. With this font I can easily read text 1 size smaller than any other font. This is hands down the most easy to read font I have ever used."}, {"id": 50658442, "au": "ForOldHack", "dom": 18, "sr": 79, "sc": 2.06, "ep": 2.71, "bs": 0.0, "d": 1, "age": 20.96, "grav": 281.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 765, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am a sucker for a new font. Whenever I meet a coder, I ask them what tool chain, and what font?. Although this is a schoolbook font, it has good glyphs, which would be useful in mono-spaces, but ... the kerning!!! I made it as small as possible, and its great. I completely agree, this font doesn't get enough attention.\n\nI completely disagree that the y' pair is not well kerned, and that the ' gets lost. Bladerdash. It is very well kerned, and does not get lost.\n\n'Hyperlegible' is an apt description.\n\nThank you!"}, {"id": 50656971, "au": "extra88", "dom": 13, "sr": 80, "sc": 2.06, "ep": 2.69, "bs": 0.0, "d": 4, "age": 23.28, "grav": 334.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "  "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "horse_gift", "flbl": "Horse & Gift (Free)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "You do understand that horses are very very valuable? And that probably back in the day when this saying originated, it was one of the most valuable things most people could own. When buying a horse, the teeth were checked to determine the age and health of the horse, because problems in teeth could cause it not to be able to eat. But you would be a kinda dick to start looking at the teeth if given such a generous present.\n\nIt is basically I gave you a car and you started to ask about the mileage, then decline because you’d have to take it serviced now and then (like every car ever made have to be), ie. you’d be foolish enough not to see the value in a gift."}, {"id": 50655928, "au": "kleiba2", "dom": 74, "sr": 90, "sc": 2.06, "ep": 2.46, "bs": 0.0, "d": 2, "age": 25.13, "grav": 380.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 800, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fonts_comic", "flbl": "Fonts & Comic (Sans)", "urls": [], "ig": 0.636, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My point is, I don't care enough to change the default font because honestly, most default fonts in 2026 are just fine."}, {"id": 50666759, "au": "bayesnet", "dom": 17, "sr": 91, "sc": 2.06, "ep": 2.43, "bs": 0.0, "d": 2, "age": 2.39, "grav": 14.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 416, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "font_hyperlegible", "flbl": "Font & Hyperlegible (Atkinson)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah it’s a bizarre way of putting it—the EULA it links to is the SIL Open Font License.\n\nNo idea why they want an email though, but you can get the font vi
