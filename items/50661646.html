"count": 25}, {"category": "investigative_or_tech_press", "count": 4}, {"category": "low_cred_or_joke", "count": 4}, {"category": "primary_technical_doc", "count": 2}], "story_anchors": ["drive", "pricing", "hard", "bought", "drives", "black", "buy", "hdd", "gotten", "friday", "20tb", "per", "server", "seagate", "three", "price", "prices", "18tb"], "largest_root": {"root_id": 50663864, "author": "loeg", "slots": 121, "start_dom": 1, "end_dom": 121, "share_pct": 26.8, "top_dom1_age": 12.2, "top_dom1_author": "loeg"}, "buried_cutoff": 135, "rescue_top_k": 80, "ablations": [], "tournament": [], "comments": [{"id": 50664745, "au": "Joel_Mckay", "dom": 450, "sr": 1, "sc": 17.78, "ep": 17.78, "bs": 0.0, "d": 6, "age": 10.12, "grav": 89.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 178, "qw": 2, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://rossmanngroup.com/technical-reference/cmr-vs-smr-hard-drives", "https://rml527.blogspot.com/", "https://www.westerndigital.com/en-ca/products/internal-drives/data-center-drives/ultrastar-dc-hc690-hdd?sku=WSH723200AL4201"], "ig": 2.174, "fa": 3.86, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": ">[1] Yeah, right.\n\nPerhaps, but you can't just look at the brand label to know for sure...\n\nEvery manufacture has different model number suffix used to identify the drive configuration. They usually do not advertise the specifics on the packaging.\n\nDrive-Managed SMR (dm-smr) abstracts the slow/random-latency interface as a classic LBA drive.\n\nSome older model number suffix to watch out for: https://rossmanngroup.com/technical-reference/cmr-vs-smr-har...\n\nTips for spotting the obfuscated features in modern SATA/SAS drives:\n\n1. abnormally large dram buffers on relatively small disk capacities\n\n2. a HDD supporting SSD trim functions\n\n3. sudden i/o performance loss when writing over 1% of the drive capacity (need to dd flood the CMR zone normally used to cache hot/busy areas of the filesystem like the journal, and force flushing to the SMR zone)\n\n4. Cheap consumer drives hitting high-capacity claims with suspiciously low 3.5\" drive platter counts (anything claiming above 3.0TB/platter is likely distracting from the superparamagnetic limit): https://rml527.blogspot.com/\n\nModern drives may skip unpredictable dm-cmr mode of operation for host managed hm-smr.\n\n30TB Ultrastar DC HC690 sales contact: https://www.westerndigital.com/en-ca/products/internal-drive...\n\nUltraSMR brief: https://documents.westerndigital.com/content/dam/doc-library...\n\nWhite paper: https://documents.westerndigita"}, {"id": 50665849, "au": "roenxi", "dom": 3, "sr": 2, "sc": 14.23, "ep": 14.23, "bs": 0.0, "d": 2, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 230, "qw": 0, "k": 30627, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": ["https://dam.stanford.edu/memory-prices.html"], "ig": 2.048, "fa": 2.36, "gp": 1.854, "bl": 0.0, "ds": 0.0, "txt": "You've subtly misunderstood how markets work; they cannot make supply just appear without respect for the laws of physics based on a gut feel check by some man on the street that there is new persistent demand.\n\nBringing new production capacity takes time. It's expensive. The people doing it have to make forecasts about what the state of the market is when the new supply will hit and (usually, anyway) require solid evidence that there is a long-term need before they commit to expensive options. If everyone is looking at the market and there is a wall-to-wall consensus that this might be a temporary demand spike then they're just being rational independent actors if they decide not to respond by bankrupting themselves expanding into a glut.\n\nIn fact it must be quite common for markets to test if demand is real by requiring high prices to persist for a while before enough evidence accumulates and more investment in capacity happens. AFAIR if you look at a chart of long term prices for RAM or hard drives the cycles are very visible as prices rise and then new capacity and tech improvements come online. The overall trend shows healthy market forces.\n\nEDIT Found the chart I was looking for. If this is a price cartel then IMO we need a few more of them because they seem to cause a really neat long term price dropping trend to form. https://dam.stanford.edu/memory-prices.html"}, {"id": 50663100, "au": "nl", "dom": 236, "sr": 3, "sc": 12.88, "ep": 12.88, "bs": 0.0, "d": 0, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 16, "qw": 0, "k": 34310, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": ["https://www.tomshardware.com/gift-guides-seasonal-sales/the-lowest-priced-ram-in-2026-price-tracking-on-ddr5-and-ddr4-memory-of-all-capacities"], "ig": 0.807, "fa": 3.03, "gp": 1.622, "bl": 0.0, "ds": 0.0, "txt": "Toms Hardware is now tracking RAM prices: https://www.tomshardware.com/gift-guides-seasonal-sales/the-...\n\nDDR5-6400 128GB best price was $329 and is now $3,145. Ouch."}, {"id": 50663423, "au": "safety1st", "dom": 124, "sr": 4, "sc": 11.1, "ep": 11.1, "bs": 0.0, "d": 2, "age": 13.24, "grav": 134.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 20, "k": 6475, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.994, "fa": 1.37, "gp": 1.729, "bl": 0.0, "ds": 0.0, "txt": "> Concentration/consolidation in manufacturing, largely unchecked by the partial lack of national, and complete lack of international guardrails against collusion\n\nWhy does CXMT never seem to come up in these discussions?\n\nAlready the 4th largest RAM manufacturer in the world\n\nStaggering increases in revenue (700% this year) and manufacturing capacity (projected 15% of all RAM produced by 2028)\n\nWorking on high-bandwidth/memory product lines suitable for AI, this will probably take a few years\n\nSamsung execs have spoken publicly about how worried they are\n\nIs it just that Western commentators are not seeing the semiconductor revolution that's brewing in China?\n\nThe first thing I thought about a few months back when reading about the RAM oligopoly was \"Surely someone in China has the ambition and capital and will try to disrupt that, and the Chinese government will likely provide protectionist cover fire so they can get a quick hold on their domestic market.\"\n\nYes indeed, a few Google searches later I discovered CXMT"}, {"id": 50662804, "au": "dghughes", "dom": 256, "sr": 5, "sc": 10.19, "ep": 10.19, "bs": 0.0, "d": 0, "age": 15.04, "grav": 164.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 77, "qw": 0, "k": 5397, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://www.westerndigital.com/en-ca/products/internal-drives/wd-red-pro-sata-hdd?sku=WD181KFGX"], "ig": 1.673, "fa": 1.57, "gp": 1.228, "bl": 0.0, "ds": 0.0, "txt": "I bought a Synology NAS two years ago and put in three WD Red Pro 18TB drives. It's a five bay NAS I was planning on getting two more drives a year later and then a new NAS and drives as a backup. Now one single drive costs more than the NAS and as much as the three original drives about $1,300CAD for one drive the same 18TB WD Red Pro. It's impossible to build anything anymore. My computer is a failing 10 year old Dell.\n\nhttps://www.westerndigital.com/en-ca/products/internal-drive..."}, {"id": 50664852, "au": "vdp", "dom": 93, "sr": 6, "sc": 10.04, "ep": 10.19, "bs": 0.0, "d": 3, "age": 9.89, "grav": 86.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 43, "qw": 0, "k": 9, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": ["https://archive.is/0yemI"], "ig": 1.031, "fa": 2.35, "gp": 0.739, "bl": 0.0, "ds": 0.0, "txt": "I don't think that was the original article I've read, but basically I was thinking about the \"avalanche\" quote from e.g.  [1]. I still think that without the shady gymnastics described, the availability and the price of consumer GPUs would have been much better than what it's today.\n\n[1] https://archive.is/0yemI"}, {"id": 50663866, "au": "aaronmdjones", "dom": 449, "sr": 7, "sc": 9.76, "ep": 9.91, "bs": 0.0, "d": 5, "age": 12.16, "grav": 118.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 11, "k": 1769, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.783, "fa": 1.37, "gp": 1.251, "bl": 0.0, "ds": 0.0, "txt": "> On some high-capacity data-center drives CMR is no longer even supported\n\nWhich high-capacity drives are these?\n\nSeagate's IronWolf (NAS) drives are all CMR (up to the current top of the range 18TB).\n\nSeagate's IronWolf Pro (NAS) drives are all CMR (up to the current top of the range 30TB).\n\nSeagate's EXOS (datacenter) drives are all CMR (up to the current top of the range 30TB).\n\nWD's Red (NAS [1]) drives are all SMR but top out at 6TB, hardly high capacity.\n\nWD's Red Plus (NAS) drives are all CMR (up to the current top of the range 12TB, again hardly high).\n\nWD's Red Pro (NAS) drives are all CMR (up to the current top of the range 26TB).\n\nWD's Gold (datacenter) drives are all CMR (up to the current top of the range 24TB).\n\nToshiba's DT (desktop) series drives are all SMR but top out at 6TB (again hardly high).\n\nToshiba's N300 (NAS) series drives are all CMR (up to the current top of the range 22TB).\n\nToshiba's MG (datacenter) series drives are all CMR (up to the current top of the range 24TB).\n\n[1] Yeah, right."}, {"id": 50663748, "au": "LilBytes", "dom": 265, "sr": 8, "sc": 9.75, "ep": 9.75, "bs": 0.0, "d": 0, "age": 12.46, "grav": 122.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 61, "qw": 0, "k": 2235, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://east-digital.myshopify.com/"], "ig": 1.511, "fa": 1.57, "gp": 1.188, "bl": 0.0, "ds": 0.0, "txt": "I've been buying factory seconds HDDs from a Chinese reseller. Their pricing is still relatively good.\n\nhttps://east-digital.myshopify.com/\n\n18TB HDDs for $471\n24TB for $716. USD.\n\nI've bought 30+ drives from them and had only one fail within the first 12 months which they replaced.\n\nEdit:\n\n12TB drives uswere $271 in 2024. They're now $368. Still higher but not as much as retail. These are Exos and IronWolf drives btw."}, {"id": 50667310, "au": "michaelt", "dom": 30, "sr": 9, "sc": 9.36, "ep": 9.66, "bs": 0.0, "d": 2, "age": 5.15, "grav": 34.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 57, "k": 39361, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.626, "fa": 1.37, "gp": 1.333, "bl": 0.0, "ds": 0.0, "txt": "> In a healthy economy for consumers, companies are supposed to compete against each others and adapt to the demand. If they all make the same choice to keep the supply low, it is a cartel. Increasing the supply does require a high CapEX, but they're expected to ramp up production of a product that can compete with rival companies' offerings.\n\nIf I'm a turkey supplier and demand in the US increased by 40x this week - am I obliged to immediately start construction on 40x as many processing plants, and hiring 40x as many staff?\n\nAnd if a turkey supplier is allowed to use their business judgement and not scale their production in line with demand, because they predict demand will return to normal levels before that investment pays off - aren't RAM and HDD makers also entitled to do the same?"}, {"id": 50663656, "au": "koverstreet", "dom": 128, "sr": 10, "sc": 9.2, "ep": 9.35, "bs": 0.0, "d": 4, "age": 12.68, "grav": 125.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 2109, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.81, "fa": 0.95, "gp": 1.646, "bl": 0.0, "ds": 0.0, "txt": "Err, no. DRAM doesn't need the same feature size as logic (capacitors need to be a certain size), and Apple qualified their DDR5 - and then CXMT declined to sell to them because their domestic market is more than big enough.\n\nCXMT is already making HBM. Their yields still suck and they're a generation behind the big western fabs on HBM, but on DDR they're > 90% yields, producing DRAM that's just as good, and they're building fabs like nobody's business.\n\n15% of global market in 2028 is severely underestimating, they're already on par or ahead of Micron in WSPM."}, {"id": 50665510, "au": "adrian_b", "dom": 373, "sr": 11, "sc": 8.95, "ep": 8.95, "bs": 0.0, "d": 3, "age": 8.36, "grav": 67.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 241, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.991, "fa": 0.96, "gp": 1.058, "bl": 0.0, "ds": 0.0, "txt": "Desktop motherboards have much less PCIe slots than in the past.\n\nThe ATX MB format allows for 6 16-lane PCIe 5.0 slots, but you will not see that, except with server CPUs.\n\nDesktop CPUs support at most 1 full slot or 2 half-width slots at full speed.\n\nBesides the 1 or 2 PCIe 5.0 slots, many motherboards have only 1 or 2 slots that are too slow (e.g. by being 1-lane PCIe 4.0) for things like a fast network card usable to interconnect 2 desktop computers, e.g. for doing inference with an LLM using both.\n\nOnly few motherboards have 1 or at most 2 4-lane PCIe 4.0 slots, that could be used for not too slow interconnections.\n\nSo in desktop motherboards, I do not think that there exists currently any motherboard that offers more than 4 fast PCIe slots, where 2 slots are 8-lane PCIe 5.0 and 2 slots are 4-lane PCIe 4.0, but sharing a single 4-lane PCIe 4.0 link with the CPU.\n\nSo the aggregated PCIe throughput in modern motherboards is pathetic in comparison with what was available in desktop motherboards from a decade ago.\n\nNow the desktop motherboards are designed only for supporting 1 or 2 GPUs and 2 to 4 SSDs, but with bandwidth sharing for the upper number of devices, with no provision for fast interconnections between desktops, beyond what you can get by linking 2 desktops with a Thunderbolt cable, if they have appropriate Thunderbolt ports.\n\nIf you want to use e.g. 25 Gb/s Ethern"}, {"id": 50662508, "au": "Joel_Mckay", "dom": 442, "sr": 12, "sc": 8.89, "ep": 9.41, "bs": 0.0, "d": 0, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 269, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 2.175, "fa": 0.95, "gp": 1.094, "bl": 0.0, "ds": 0.0, "txt": "In general, people now must make a clear distinction between storage and archiving.\n\nHDD above 4TB are now often always shingled writes, and have a shorter service life < 3 years of fly time.  Above that, folks should always have a +2 spare on ZFS, and run the bit-rot detection process weekly.\n\nFor JBOD, the 8TB HDD is still the cheapest $/TiB option I found. If you don't have the rack space, than consider the higher capacity drives as a consumable operational expense.\n\nEven the cheapest NVMe SSD will last 7+ years if treated properly. If powered on every month for auto-repairs.  OverlayFS root or a logging filesystem like F2FS will almost double the life of the drive to 12+ years.\n\nNote, even if the SSD costs 300% more upfront, the reliability of a good brand means your drive failure rates are much lower (if and only if you are not hammering a log on storage like the recent nvidia driver was doing.)\n\n18TB LTO9 Tape is still the cheapest $/TiB backup option, but the drives/auto-loaders have a high initial fixed cost... The used units also tend to be near the end of their service life (often not worth the price.)\n\nFor personal workflows,  I spun up dual BD-R writers (omnidrive/libredrive firmware) for cheap bulk 25G offline storage discs like it was 2017 (with the odd 100GB bdxl disc for firmware images). It was a trade-off for cheap media, 10+ year data retention rating (M-disc"}, {"id": 50665553, "au": "taegee", "dom": 58, "sr": 13, "sc": 8.8, "ep": 9.25, "bs": 0.0, "d": 2, "age": 8.24, "grav": 65.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 82, "qw": 0, "k": 115, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://pixelflut.org/"], "ig": 2.063, "fa": 1.3, "gp": 0.479, "bl": 0.0, "ds": 0.0, "txt": "Developers have to spend more considerations on efficiency/being less wasteful?\n\nSo we have an upside at least.\n\nIt's hilarious how wasteful the modern software slob became.\n\nOur current computers are _insanely_ powerful. Yet they struggle to run mundane software fluently or squeeze a couple of tabs into 16 GB(!) of RAM.\n\nYears ago, I met someone who was involved with \"Pixelflut\" – a notoriously wasteful protocol to color individual pixels on a beamer screen.\n\nhttps://pixelflut.org/\n\nWith a some optimizations, he managed to run FHD 30 fps using his simple laptop."}, {"id": 50665147, "au": "Tuna-Fish", "dom": 102, "sr": 14, "sc": 8.8, "ep": 9.24, "bs": 0.0, "d": 5, "age": 9.26, "grav": 78.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 23, "k": 14748, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.39, "fa": 1.37, "gp": 1.427, "bl": 0.0, "ds": 0.0, "txt": "Lithography machines are generally not taken out of production, they just go down the value chain. Some 200mm wafer size tools are now considered so obsolete that they have been removed from use, but nearly all 300mm wafer tools, dating back to 1997, are still in active use. As a tool becomes unable to do leading edge stuff, it starts getting used to do something a bit more pedestrian.\n\n> like, flash storage doesn't necessarily need to get bigger or faster at this point (imo), 1 TB SSDs will serve a big % of the markets.\n\nI think you are very wrong on this, the amount of media we consume and the space it needs is still growing rapidly, but even if you are not, a 1TB SSD still has at least 4 NAND FLASH dies. If better litho lets you build one with fewer dies, you will effectively get more SSDs out of the same wafer.\n\nNAND is mostly scaling by increasing layers, though."}, {"id": 50663281, "au": "dotwaffle", "dom": 363, "sr": 15, "sc": 8.64, "ep": 8.64, "bs": 0.0, "d": 0, "age": 13.63, "grav": 141.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 309, "qw": 0, "k": 234, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.824, "fa": 0.95, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "Still cheaper than S3 / GCS / ABS!\n\n$10 to $25/TB to store in one of those places, paid every month -- with the nerve to charge an additional $10/TB or so just to retrieve it at the lower end of that bracket. The \"high\" $27.50/TB in the article shows how much margin there is on these products. Sure, you might want to factor in replication and the server hardware, but you're still looking at paying it off in a few months with real hardware.\n\nS3 is still the same pricing as 10 years ago, and the cost to egress that out to the internet is effectively over $27/Mbps/month -- what someone would have paid for internet transit about 20 years ago. You can buy that transit for $0.02 to $0.08/Mbps/month these days, meaning it's nearly 1000x what you'd pay elsewhere.\n\nLet me put it another way: You can get a 100Gbps transit port for $2000 to $8000/month, capable of serving around 10,000,000 GB (assuming you fill that connection only to 33%), or you can get about 25,000 GB with the big three cloud providers. The hardware comes to about $50 to $70/TB, the rack space and power are relatively cheap.\n\nNot just that, with your own build you can get an actual file system, not just blob storage.\n\nHell, you can even lease a dedicated server from Hetzner / OVH / whoever for about $2 to $3/TB/month if you didn't want to handle any of the hardware or networking portions of it.\n\nAs far as I can tell, t"}, {"id": 50666556, "au": "amiga386", "dom": 13, "sr": 16, "sc": 8.62, "ep": 9.06, "bs": 0.0, "d": 3, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 8162, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.944, "fa": 0.95, "gp": 1.233, "bl": 0.0, "ds": 0.0, "txt": "The graph is great, and it shows the exponential drop of memory/storage over 70 years. The log scale is needed over such a timespan.\n\nBut zoom in to the tail to see our pain, caused by the hyperscalers and AI companies and their investors buying up all the supply for years. Log scale hides it well, but the numbers are there:\n\n    DRAM: 0.898  $/GB in Aug 2023 -> 4.005   $/GB in Oct 2026 (4.46x higher)\n    SSD:  0.0356 $/GB in Sep 2023 -> 0.08885 $/GB in Oct 2026 (2.49x higher)\n    HDD:  0.0140 $/GB in Jul 2023 -> 0.02598 $/GB in Oct 2026 (1.85x higher)\n\n(all prices in inflation-adjusted 2024 US dollars)\n\nWhere the long-term trend is for prices to keep dropping, the past three years prices are increasing -- doubling, quadrupling. We know the cause. Where does it stop? Does it stop? Does 2023 become the end of the road, not for technological reasons, but for investment hype reasons?\n\nIt's like saying capitalism is great if you just ignore the Great Depression."}, {"id": 50663311, "au": "oddIdentities", "dom": 123, "sr": 17, "sc": 8.59, "ep": 8.88, "bs": 0.0, "d": 1, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 8, "k": 45, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 2.054, "fa": 0.7, "gp": 1.422, "bl": 0.0, "ds": 0.0, "txt": ">There's no reason to think things have changed.\n\nThere are a few:\n\n- A massive expansion in userbase for what previously would have been considered high-performance computing equipment. Now that no particular skills whatsoever are required to harness these to some productive end, demand is presumably seeing a step-change up.\n\n- Concentration/consolidation in manufacturing, largely unchecked by the partial lack of national, and complete lack of international guardrails against collusion (price fixing, supply limiting, etc)\n\n- The increase in capex required to manufacture commercially viable semiconductors in volume\n\n- The practical cessation of semiconductor process technology advancement (compared to the '80s, '90s, and '00s, say)\n\nTaken together, when you say you \"give it five years at most\", I suspect you are right when it comes to the rate of increase of price (of bits of RAM, flash, TFLOPs of compute, etc) but I do not think we will see continuing exponential decreases in cost - or if we do, that exponent will itself have been greatly diminished."}, {"id": 50669574, "au": "WalterBright", "dom": 16, "sr": 18, "sc": 8.48, "ep": 8.92, "bs": 0.0, "d": 4, "age": 1.77, "grav": 10.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 13, "k": 81631, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 2.012, "fa": 1.1, "gp": 0.727, "bl": 0.0, "ds": 0.0, "txt": "> It's like saying capitalism is great if you just ignore the Great Depression.\n\nThe GD is a result of the government printing fiat money (starting in 1914) while retaining a fixed exchange rate for gold. By the time 1930 rolled around, due to inflation, gold was at a bargain price. This caused a run on the banks, resulting in their collapse.\n\nEventually, FDR stopped that by making it illegal to buy gold. But by then, the damage was done. The next government failure was restricting the supply of money. People had no money. This problem was eventually resolved by massive armaments purchases from foreign countries in the late '30s.\n\nI.e. the GD was a failure due government mismanagement of the banks, not capitalism."}, {"id": 50667055, "au": "alright2565", "dom": 14, "sr": 19, "sc": 8.33, "ep": 9.21, "bs": 0.0, "d": 4, "age": 5.52, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1713, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.996, "fa": 0.95, "gp": 1.252, "bl": 0.0, "ds": 0.0, "txt": "Look at P/E ratios for companies in these sectors:\n\n    Sector   Company                     Trailing P/E\n    -------  --------------------------  ------------\n    DRAM     Samsung                            5.62x\n    DRAM     SK Hynix                           4.19x\n    SSD      Sandisk                            4.74x\n    SSD      Kioxia                             5.19x\n    HDD      Seagate                           24.77x\n    HDD      Western Digital                   10.57x\n    Coal     Coal India                         7.17x\n    Coal     Alliance Resource Partners         9.60x\n\nI included coal for comparison, because it's a highly cyclical, high capex, commodity industry, just like the DRAM, SSDs, and HDDs.\n\nYou can see that the market does not expect flash & RAM prices to stay at this elevated level long-term. HDD prices are expected to remain somewhat elevated though."}, {"id": 50664422, "au": "derekdahmer", "dom": 286, "sr": 20, "sc": 8.32, "ep": 8.54, "bs": 0.0, "d": 2, "age": 10.9, "grav": 99.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1115, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.757, "fa": 0.95, "gp": 1.176, "bl": 0.0, "ds": 0.0, "txt": "Re-encoding will save you here.  At a generous 15mbps bitrate a 100TB drive could store 600 continuous days of video, or 150 days of your quad camera ride footage.  As low as 6mbps could be acceptable for raw footage you just want to keep around.\n\nI throw all my drone footage that isn’t going into a produced video through handbrake before adding it to expensive cloud storage."}, {"id": 50666045, "au": "adrian_b", "dom": 137, "sr": 21, "sc": 8.25, "ep": 9.54, "bs": 0.85, "d": 12, "age": 7.26, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 262, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": ["https://www.semiconinsider.com/2026/10/15/langdao-silex-unveils-prototype-euv-light-source-lithography/"], "ig": 1.451, "fa": 1.52, "gp": 1.237, "bl": 0.32, "ds": 0.0, "txt": "The article about that, which included the 1930 to 1932 timeline for transforming a prototype into equipment suitable for mass production, which seems realistic, was adjacent inside some Chinese news site to another article about China that was the subject of a HN thread a week or two ago.\n\nHowever, trying to find it again now by googling, because I do not remember the HN thread, did not succeed quickly because the search returned tons of pages that seem to be AI slop that repeats more or less the same things, but originating in older press releases, not in that one.\n\nIn any case, the subject of the article was a prototype demo made in October at the China International Industry Fair in Shanghai, by the company Langdao Silex, and the timeline was attributed to a declaration of that company.\n\nAnother article about the same event is:\n\nhttps://www.semiconinsider.com/2026/10/15/langdao-silex-unve...\n\nThey seem to already have an acceptable EUV light source, but from that to an EUV lithography machine there is a long path, with the production of the reflective optical components being one of the most difficult parts to achieve.\n\nChina appears to be now at about the same level of EUV technology that was ever achieved in USA, i.e. at the level where Cymer was before being acquired by ASML.\n\nASML needed almost a decade to develop the light source from Cymer into a usable EUV lithograph"}, {"id": 50666574, "au": "rbanffy", "dom": 145, "sr": 22, "sc": 8.08, "ep": 9.18, "bs": 0.0, "d": 3, "age": 6.31, "grav": 45.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 24, "k": 200272, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.881, "fa": 1.1, "gp": 1.121, "bl": 0.0, "ds": 0.0, "txt": "> FLASH prices are only going to keep going up in the short term, because HBF will do to FLASH what HBM did to memory\n\nHBM consumed RAM manufacturing capacity and the same will happen to flash with HBF. It’s just that the dies will not be encapsulated and sold on M.2 sticks but piled up into HBF and sold for integration into modules. It’s either demand that drops for some reason magical or not, or new capacity comes online.\n\nIn the case of HDDs, which is what the article is about, I don’t think companies are willing to invest in the R&D needed to outcompete flash because, at some point, the  mechanics needed to pack, say, 50 TB into a 3.5” form factor leave the mechanical engineering domain and arrive at physics, where advances become increasingly hard. Doubling density again to 100TB per drive might just not be feasible. At the same time, areal density of non-volatile solid-state memory might will continue to improve, and, with it, manufacturing prices will go down faster than for HDDs.\n\nHDDs are a dead end. I wouldn’t invest much R&D in them. All three surviving manufacturers know that and are acting accordingly."}, {"id": 50662698, "au": "Joel_Mckay", "dom": 226, "sr": 23, "sc": 7.85, "ep": 8.51, "bs": 0.0, "d": 1, "age": 15.39, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.953, "fa": 0.96, "gp": 0.817, "bl": 0.0, "ds": 0.0, "txt": "Silicon chip production is under supply-chain suppression from data-center speculative projects.\n\nWhat to expect if bubble remains inflated:\n\n1. consumer DRAM/VRAM prices to be kept  high by scalpers till 2030\n\n2. quality SSD flash drives to remain inflated till 2032\n\nChina based firms are ramping up production, and international markets expect to continue shifting over to more budget friendly brands within the next few quarters. For domestic markets, building on US soil now incurs liabilities other jurisdictions simply don't see.\n\nHave a nice day, =3"}, {"id": 50667017, "au": "joshstrange", "dom": 230, "sr": 24, "sc": 7.82, "ep": 8.7, "bs": 0.0, "d": 0, "age": 5.58, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 23837, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.893, "fa": 0.95, "gp": 1.063, "bl": 0.0, "ds": 0.0, "txt": "Yep, at the start of the year I bought a 8-bay UNAS before the HD price increases had fully “set” in my brain. It still sits empty because I can’t afford to put drives in it.\n\nI have my hard drive purchase info back a little over a decade and for the past few years (before 2025) I was settling into ~$14/TB. Now it’s _well_ over double that. The only Seagate Exos 20TB (not refurb) on Amazon I can find is $999, ~$50/TB.\n\nIt’s a hard time to be homelab-er. I’m eternally grateful that my main server is only like 4-5 years old. I have friends that were forced to upgrade and the RAM costs alone made me sick. In one case they bought half the RAM my server has and paid twice what I paid (aka 4x increase). That said, I’ve never been happier with self-hosting but that makes this harder since I’d love to expand my home lab."}, {"id": 50662903, "au": "bahmboo", "dom": 269, "sr": 25, "sc": 7.73, "ep": 8.17, "bs": 0.0, "d": 2, "age": 14.71, "grav": 158.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1395, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.702, "fa": 0.95, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": "I just got this for $320 delivered. GMKtec NucBox G3 Plus Mini PC Intel® 12th Twin Lake N150\n16GB RAM+512GB SSD [edit: going to be my home assistant box plus frigate and all sorts of unwise self hosted attack surface]"}, {"id": 50662608, "au": "npteljes", "dom": 319, "sr": 26, "sc": 7.42, "ep": 8.08, "bs": 0.0, "d": 0, "age": 15.61, "grav": 174.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.543, "fa": 0.95, "gp": 1.203, "bl": 0.0, "ds": 0.0, "txt": "Yup, it did. I upgraded my home setup with used SAS server disks because of this. Last time I way eyeing the upgrade, 3TB disks went for $60 in my region. Now, 2tb is $150. However, I could get these used server 3tb disks for $30. So I bought an adapter for them and built a more robust setup, since they are used disks and all. Setup works like a charm since (knock on wood)."}, {"id": 50662114, "au": "ferrouswheel", "dom": 257, "sr": 27, "sc": 7.25, "ep": 8.35, "bs": 0.0, "d": 0, "age": 16.95, "grav": 199.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 455, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.479, "fa": 0.95, "gp": 1.495, "bl": 0.0, "ds": 0.0, "txt": "It really is bad.\n\nI bought 10x18TB drives in 2023 for $190/each, for my 8 bay NAS. 1 started giving smart errors since so was retired, and now I have 1 spare.\n\nWhich sounds like I timed things well, but I still need to backup my ever increasing datahoard and I'm having to get very creative reusing old 4TB drives now, making it a very slow process!"}, {"id": 50664505, "au": "kamranjon", "dom": 105, "sr": 28, "sc": 7.17, "ep": 7.83, "bs": 0.0, "d": 3, "age": 10.7, "grav": 97.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 2707, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": ["https://futurism.com/artificial-intelligence/jensen-huang-graphics-cards-artificial-scarcity", "https://wccftech.com/jensen-huang-financed-ai-startups-absorb-excess-silicon/"], "ig": 1.672, "fa": 0.84, "gp": 1.038, "bl": 0.0, "ds": 0.0, "txt": "There are a couple sources I found:\n\nJensen Huang Was Allegedly Making Graphics Cards Hard to Obtain on Purpose to Boost Profits:\n\nhttps://futurism.com/artificial-intelligence/jensen-huang-gr...\n\nInstead Of Lowering GPU Prices, Former NVIDIA CEO Jensen Huang Reportedly Financed AI Startups To Absorb Excess Silicon, Shattering The Shortage Perception:\n\nhttps://wccftech.com/jensen-huang-financed-ai-startups-absor..."}, {"id": 50663132, "au": "Aurornis", "dom": 175, "sr": 29, "sc": 7.11, "ep": 8.43, "bs": 0.0, "d": 4, "age": 14.07, "grav": 148.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.745, "fa": 0.68, "gp": 1.652, "bl": 0.0, "ds": 0.0, "txt": "I’ve been into computers since I was a kid and I expect I’ll enjoy it till I die. A several year stretch of high prices might slow my upgrade cadence for a while, but the doomerism about the end of the hobby is getting overblown.\n\nThe high spec computer I want to buy is expensive right now, but I’ve been scrolling Black Friday deals and there have been a lot of good deals on respectable gaming pre-builts coming through. The people who will settle for nothing less than 128GB of RAM next to their RTX 5090 are going to be unhappy, but a good laptop or decent gaming rig is still very attainable."}, {"id": 50665705, "au": "juliendorra", "dom": 219, "sr": 30, "sc": 7.01, "ep": 7.89, "bs": 0.0, "d": 2, "age": 7.92, "grav": 62.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 931, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.906, "fa": 0.68, "gp": 1.015, "bl": 0.0, "ds": 0.0, "txt": "What do you mean by \"there was not as much productive use for hardware\"? In personal computing there has been productive use for hardware since 1979 (VisiCalc) and of course even before that in the entreprise context. For context the spreadsheet made finance, accounting, business management work 80x faster with less errors. It was a huge productivity boost, and it pushed hardware sales up.\n\nThe chip and memory have always been the limiting factor, and in the 80s the WIMP GUIs needed more powerful hardware to open up new productive usage (including totality transforming publishing, paper publishing at the time)"}, {"id": 50662602, "au": "WheelsAtLarge", "dom": 122, "sr": 31, "sc": 6.88, "ep": 7.32, "bs": 0.0, "d": 0, "age": 15.64, "grav": 175.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 5797, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.715, "fa": 0.34, "gp": 1.603, "bl": 0.0, "ds": 0.0, "txt": "Memory, both chips and HDs, eventually collapses in price; that’s been the cycle for decades. The boom-and-bust cycle is what has driven the number of manufacturers down. My suspicion is that, in a few years, the price per gig will collapse again. AI is memory-hungry, and PC manufacturers will be pushing self-hosted AI models, which will require lots of memory. I bet we’ll see an increase in density per unit, which will bring down the price per gig. I give it five years at most. At that time, we will be seeing PC's capable of hosting a full AI model for the equivalen of less that $1000 today. It's how tech has worked for decades. There's no reason to think things have changed."}, {"id": 50667367, "au": "ck2", "dom": 358, "sr": 32, "sc": 6.85, "ep": 7.95, "bs": 0.0, "d": 0, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 32346, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", Huang)\n\nDon't ask for mechanism, is is beyond understanding by your puny excuse for a brain.\n\nYour friendly overlord."}, {"id": 50663080, "au": "bruce511", "dom": 197, "sr": 35, "sc": 6.54, "ep": 7.42, "bs": 0.0, "d": 3, "age": 14.21, "grav": 150.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 12050, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.676, "fa": 0.68, "gp": 1.065, "bl": 0.0, "ds": 0.0, "txt": "I was alive :), but that era was very different.\n\nAt the start of the 80s PCs were expensive. Demand was (by today's standards) really really low. Prices around $5000 were not uncommon.\n\nAs factories got built, as as the tech progressed (very quickly) the prices came down (think $2000) but a 2 year old machine was pretty much obsolete. Disk space, ram, cpu, cdrom drives, everything was doubling every year or so.\n\nObviously there was a lot of profit to be had so production scaled up, and prices dropped.\nMachines also lasted a lot longer."}, {"id": 50663384, "au": "radium3d", "dom": 318, "sr": 36, "sc": 6.52, "ep": 7.62, "bs": 0.0, "d": 0, "age": 13.35, "grav": 136.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 725, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.428, "fa": 0.95, "gp": 1.076, "bl": 0.0, "ds": 0.0, "txt": "In 2023 I bought two old server grade hard disks on ebay for long term, \"sits there and does nothing\" storage in a RAID configuration. Free up your NVME drives for games/fast storage.\n\nTwo 10TB disks which is more than enough and it's been working like a champ for 3 years so far and zero issues. The same seller has them still for sale but the price is up 3.5x from then."}, {"id": 50667144, "au": "busymom0", "dom": 395, "sr": 37, "sc": 6.42, "ep": 7.52, "bs": 0.0, "d": 0, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 6253, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.693, "fa": 0.95, "gp": 0.577, "bl": 0.0, "ds": 0.0, "txt": "What's happened to RAM and storage prices is very similar to what's happened to whey protein prices. Because every food company now tries to put whey in their products, the prices have sky rocketed. From Starbucks to Kraft Dinner are doing it.\n\nI remember buying four 11lb bags of protein for $140 each back in 2018 and sometimes even $120 during Black Friday. Now, just a 5lb tub is costing $150 and 11lb bags are in the $250-300 range."}, {"id": 50664526, "au": "DeathArrow", "dom": 403, "sr": 38, "sc": 6.4, "ep": 6.4, "bs": 0.0, "d": 0, "age": 10.64, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 11470, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.533, "fa": 0.68, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "We see prices sky-high for thing X, that used to cost much less a few years ago and try to find specific explanations.\n\nMy tinfoil-hat conjecture is we have an invisible inflation and money are worth much less than they did. And that corelates well with companies being evaluated trillions of dollars and individuals being worth hundreds of billions.\n\nIf we take the average worth of top 100 individuals now and divide by the same calculated 30 years ago, we have our hidden inflation factor."}, {"id": 50664452, "au": "citrin_ru", "dom": 149, "sr": 39, "sc": 6.27, "ep": 7.81, "bs": 0.0, "d": 2, "age": 10.83, "grav": 98.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 16, "k": 2366, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.207, "fa": 1.37, "gp": 0.741, "bl": 0.0, "ds": 0.0, "txt": "> The practical cessation of semiconductor process technology advancement (compared to the '80s, '90s, and '00s, say)\n\nIt's not a cessation, it's a slight deceleration. In 90s the number of transistor doubled every two years, nowadays it takes 3-4 years. It's still an exponent just not as steep as it was. Processes advance two - today's chips are 2nm and in the next year 1nm are expected. I would actually want the semiconductor industry to stabilise and not push a new process every year or two but it doesn't happening so far."}, {"id": 50662816, "au": "didgetmaster", "dom": 345, "sr": 40, "sc": 6.25, "ep": 7.35, "bs": 0.0, "d": 0, "age": 14.99, "grav": 163.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2061, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.283, "fa": 0.95, "gp": 1.121, "bl": 0.0, "ds": 0.0, "txt": "While I was certainly one who was hoping (and expecting) new drives to fall below the $10/TB price point by now; the recent surge in prices still leaves storage below historical averages.\n\nI don't remember exactly, but I think my first 1 TB drive about 20 years ago, cost over $300 in today's dollars."}, {"id": 50662225, "au": "to11mtm", "dom": 258, "sr": 41, "sc": 6.24, "ep": 7.49, "bs": 0.0, "d": 1, "age": 16.65, "grav": 193.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1844, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.405, "fa": 0.95, "gp": 1.02, "bl": 0.0, "ds": 0.0, "txt": "The simple-ish NAS I bought in 2024 is up by around 60% in price, which sucks because I think a month or so ago it was only up 40% and I should have bit the bullet (need more space for datahoarding and photography hoarding, 61 megapixel RAWs are painful, 33 megapixel RAWs at 30FPS is absolute hell....)\n\nRemember when storage got cheaper over time? ;_;"}, {"id": 50669559, "au": "nayuki", "dom": 11, "sr": 42, "sc": 6.19, "ep": 7.29, "bs": 0.0, "d": 7, "age": 1.8, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 6704, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.854, "fa": 0.62, "gp": 0.806, "bl": 0.0, "ds": 0.0, "txt": "To be fair, octet is less ambiguous because it means 8 bits (oct-/octo- is a Greek prefix for eight), whereas some historical machines have used \"bytes\" that are not 8 bits. That's why the IETF uses \"octet\" in its documents, in English. But machines with 8-bit bytes have won decades ago, and \"byte\" is the established standard word in the English language; you will never see an SSD or HDD marketed as \"1 To\" in English because it's always written as \"1 TB\". (And the only reason I even recognize \"Go/To\" at all is because of dual English+French labeling in Canada.)"}, {"id": 50662336, "au": "tripleee", "dom": 416, "sr": 43, "sc": 6.17, "ep": 7.27, "bs": 0.0, "d": 0, "age": 16.31, "grav": 187.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1024, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.427, "fa": 0.95, "gp": 0.834, "bl": 0.0, "ds": 0.0, "txt": "It's worth pointing out that these are still very cheap.\n\nA hard drive can be expected to last ~7 years, likely longer. 20TB is $6.5/mo over that timeframe. The price per 20TB drive has increased $3.5/mo.\n\nThe upfront cost stinks but building a high-capacity data hoard was already a big luxury."}, {"id": 50662119, "au": "memoriesofsmell", "dom": 240, "sr": 44, "sc": 6.12, "ep": 7.22, "bs": 0.0, "d": 0, "age": 16.94, "grav": 199.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 31, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.527, "fa": 0.68, "gp": 1.169, "bl": 0.0, "ds": 0.0, "txt": "Yeah, this mirrors exactly what I have experienced in Australia.\n\nI started a business in 2023-2024 that needs a lot of storage (petabytes) and gosh that's really hurt our ability to sacle things. SSD'd were hit first, so we were a bit ahead of the curve and bought 20 packs of HDD's. That definitely kept us going. But I don't know if we can do more than another year at this kind of pricing."}, {"id": 50662501, "au": "usr1106", "dom": 337, "sr": 45, "sc": 6.12, "ep": 7.22, "bs": 0.0, "d": 1, "age": 15.9, "grav": 179.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 4963, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.485, "fa": 0.95, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "General bloat computing? I used to say you can't fill up your disks with software. A whole Linux appliance was around 100 MB, and that was not a tiny one , but processing videos. Nowadays a banking app can be 400 MB, every golang binary 40 MB. Add CI/CD running countless containers.\n\nThe amount of video is not flat either.\n\nEdit: The other question is: How much is demand-driven. Maybe it's also supply-side. The 3 remaining players keeping supply too low for better margins?"}, {"id": 50662703, "au": "cynicalkane", "dom": 443, "sr": 46, "sc": 6.1, "ep": 7.65, "bs": 0.0, "d": 1, "age": 15.38, "grav": 170.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 6541, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.833, "fa": 0.68, "gp": 0.966, "bl": 0.0, "ds": 0.0, "txt": "Don't scrub weekly. Bit rot at rest is rare and happens over long timescales; the odds of it striking the same record on three different drives in a week span has to be almost nil. On the other hand duty cycles for HDDs are surprisingly low. My \"NAS\" Seagates are 20TB with 300TB/year duty cycles; that's only 15 full scrubs a year assuming no other activity."}, {"id": 50666644, "au": "nickjj", "dom": 79, "sr": 47, "sc": 5.87, "ep": 7.41, "bs": 0.0, "d": 1, "age": 6.19, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 137, "qw": 0, "k": 13898, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": ["https://en.wikipedia.org/wiki/TFT-LCD_(Flat_Panel)_Antitrust_Litigation"], "ig": 1.891, "fa": 0.62, "gp": 0.828, "bl": 0.0, "ds": 0.0, "txt": "If you want to go down memory lane, read about price collusion in LCD monitors from the early 2000s which involved most LCD manufacturers and suppliers at the time.\n\nThis is a good start: https://en.wikipedia.org/wiki/TFT-LCD_(Flat_Panel)_Antitrust...\n\nThese things really do happen. They ended up getting trialed in multiple countries and pleaded guilty, it wasn't a conspiracy.\n\nWith SSDs, RAM and GPUs, there's a lot of incentives for AI cloud providers to keep these out of consumer hands to avoid local LLMs becoming a real thing since that directly competes with their revenue models. It's not impossible to think manufacturers of these hardware components are getting paid off to shift / limit supply and keep prices unreasonably high for the masses. GPU manufacturers have an extra benefit of not selling you GPUs too because renting their GPUs in the cloud is more profitable for them."}, {"id": 50667116, "au": "ilamont", "dom": 63, "sr": 48, "sc": 5.8, "ep": 6.9, "bs": 0.0, "d": 2, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 54, "qw": 0, "k": 55679, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": ["https://heavytechasia.com/china-projector-sales-slump-as-brands-cut-memory-specs/"], "ig": 1.533, "fa": 0.62, "gp": 1.057, "bl": 0.0, "ds": 0.0, "txt": "It’s memory and storage across the entire electronics industry.\n\nSome unusual dynamics are playing out, such as manufacturers downgrading product specs and hoping customers won’t notice.\n\nThis example is from the market for projectors in China, which has been slumping. Brands don’t want to raise prices so they slash memory and storage by half:\n\nhttps://heavytechasia.com/china-projector-sales-slump-as-bra..."}, {"id": 50662788, "au": "npteljes", "dom": 321, "sr": 49, "sc": 5.8, "ep": 7.05, "bs": 0.0, "d": 2, "age": 15.11, "grav": 166.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.426, "fa": 0.95, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "Well I'm located in Hungary :) Right now I have an offer for HPE Seagate ST3000NM0023 (695507-003) 3TB / 7.2K RPM / 128MB cache / 6Gbit / SAS2 -> 7.999,- HUF + 27% VAT price."}, {"id": 50665857, "au": "KennyBlanken", "dom": 113, "sr": 50, "sc": 5.77, "ep": 10.89, "bs": 3.58, "d": 1, "age": 7.6, "grav": 58.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 1, "w": 45, "qw": 0, "k": 5640, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://youtu.be/Zj1mBNjpZ88?t=105", "https://www.tomshardware.com/pc-components/hdds/class-action-price-fixing-lawsuit-targets-hard-drive-component-makers-as-costs-skyrocket-13-year-scheme-allegedly-drove-up-prices-for-major-hdd-brands"], "ig": 1.288, "fa": 2.42, "gp": 0.666, "bl": 1.35, "ds": 0.0, "txt": "The author doesn't assume anything. The hard drive industry was caught in 2016 by Japan engaging in price fixing with several countries convicting various companies.\n\nhttps://youtu.be/Zj1mBNjpZ88?t=105\n\nAs of this year there's a price fixing lawsuit as well:\n\nhttps://www.tomshardware.com/pc-components/hdds/class-action...\n\nDon't question or criticize others on subjects you know nothing about."}, {"id": 50662929, "au": "Joel_Mckay", "dom": 446, "sr": 51, "sc": 5.77, "ep": 7.31, "bs": 0.0, "d": 2, "age": 14.62, "grav": 157.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.91, "fa": 0.62, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "Most manufactures know most consumers avoid buying the technology, and will drop a buffer area like a CMR zone (or flash chip) on the SMR drive.\n\nPeople need to look closely at the drive specifications, and benchmarks for large sustained file writes to detect the shenanigans when the buffer areas flood.\n\nIt is almost unavoidable on the newer WD/Seagate/Samsung/Sandisk  SAS/SATA HDD I've seen.  I also agree the 8TB models have a few gems. ymmv =3"}, {"id": 50662482, "au": "drnick1", "dom": 362, "sr": 52, "sc": 5.66, "ep": 6.54, "bs": 0.0, "d": 0, "age": 15.94, "grav": 180.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.951, "fa": 0.95, "gp": 1.105, "bl": 0.0, "ds": 0.0, "txt": "I bought a 4TB NVME (SN850X) for $280 in March 2025. It's now $729 on Newegg.\n\nSSD pricing is bad, really bad now."}, {"id": 50662897, "au": "tehlike" mistake for us plebs to have RAM at home. A side effect of the AI revolution can be to re-centralize this power. One angle of attack is to just price us all out of the market."}, {"id": 50662139, "au": "neko_ranger", "dom": 266, "sr": 56, "sc": 5.57, "ep": 6.77, "bs": 0.0, "d": 0, "age": 16.87, "grav": 197.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1299, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.127, "fa": 0.68, "gp": 1.506, "bl": 0.0, "ds": 0.0, "txt": "Even with black friday these prices for everything is horrible. Any mini pc with 32gb of ram is close to $500. I'm trying to increase my proxmox cluster size and  I don't know if I will. The only thing that is alright priced right now are monitors"}, {"id": 50666123, "au": "rob74", "dom": 7, "sr": 57, "sc": 5.57, "ep": 6.73, "bs": 0.0, "d": 3, "age": 7.12, "grav": 53.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 17360, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": ["https://www.statista.com/statistics/398951/global-shipment-figures-for-hard-disk-drives/"], "ig": 0.802, "fa": 1.24, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "Add to that the fact that the demand for \"spinning\" hard drives has been going back for years (according to https://www.statista.com/statistics/398951/global-shipment-f..., it peaked back in 2010), it would be frankly crazy to add new production capacity now."}, {"id": 50663108, "au": "Aurornis", "dom": 194, "sr": 58, "sc": 5.57, "ep": 6.61, "bs": 0.0, "d": 2, "age": 14.14, "grav": 149.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 20, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.592, "fa": 0.42, "gp": 1.154, "bl": 0.0, "ds": 0.0, "txt": "> They're not going to get less hungry for compute over time when there's ever more money to be made.\n\nCompute is now a market with its own supply and demand. Compute capacity takes a long time to be built out, so it’s possible that compute construction overshoots demand for a while.\n\nThat’s a big open question from the finance angle right now: There is so much money committed to compute buildouts that the companies will have to find ways to drive demand for it.\n\nIt’s also possible this goes the other way and demand overshoots even the aggressive buildout plans for a while.\n\nLong term, as long as there is demand for consumer hardware there will eventually be manufacturing capacity for it. We may not get the bleeding edge node, fastest CPUs, GPUs, and SSDs into consumer gaming rigs and laptops right away, but where there’s demand, there will eventually be supply."}, {"id": 50666129, "au": "zer00eyz", "dom": 17, "sr": 59, "sc": 5.57, "ep": 6.61, "bs": 0.0, "d": 3, "age": 7.11, "grav": 53.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 204, "qw": 7, "k": 6029, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.997, "fa": 0.42, "gp": 0.493, "bl": 0.0, "ds": 0.0, "txt": "> The overall trend shows healthy market forces.\n\nIt does not show that at all.\n\nYou can go read micron's 10-Q's and look at bits shipped and margins. IT looks like they spent the last few years minimizing supply till price was at an advantage.\n\nThe ram makers (who also supply SSD capacity) are also back in court again for price fixing in public. That lawsuit is interesting because they cut supply on higher margin products in favor of lower margin higher volume ones to such a level that there will likely be shareholder involvement.\n\nThis is before discussions of circular financing and all the special purpose vehicles that exist out there to prop up the market. There are bonds being sold at junk rates (north of 8 percent), where the guarantee on them is the underlying systems/chips that are being purchased. HBM is a massive part of the bill for a GPU installed at this point (and part of that bond coverage).\n\nThe AI hopium (this is monetary, not utility) will return in the new year, and then crater late 28/29.\n\nEDIT: If your company isnt trying to hedge its cloud bill for next year, you should start asking hard questions of your CTO/CFO about how ram prices are going to impact your costs."}, {"id": 50668507, "au": "dahart", "dom": 19, "sr": 60, "sc": 5.57, "ep": 6.56, "bs": 0.0, "d": 2, "age": 3.32, "grav": 20.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 194, "qw": 25, "k": 19139, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.786, "fa": 0.42, "gp": 0.804, "bl": 0.0, "ds": 0.0, "txt": "> companies are supposed to compete against each others […] they’re expected to ramp up production […] Companies must take risks and attempt to beat the competition.\n\nThere is no such rule. Why do you think this? You’re confusing description with prescription. When economists “expect” companies to compete, they’re talking macro-economics, not legal constraints. As many others have said, a cartel is when companies conspire to fix prices. If it happens on accident, which it does all the time, it’s just a market.\n\nMore importantly, and for very good reasons, there is no requirement to beat competition and no requirement to ramp up production when demand surges. Having such a requirement would bankrupt many businesses and provide an anti-competitive advantage to larger businesses. Any company can freely choose whether they want to invest and ramp up production, and they can freely choose whether they want to compete with other companies. If high demand is temporary, then ramping up production is the wrong choice. If companies were required to compete, then a big business that can afford a temporary loss could out-price smaller businesses and force them out of business. This already happens, but making it some kind of legal requirement to avoid being accused of being a cartel and avoid anti-competitive legal problems, that would cement the monopoly advantage for the larger businesse"}, {"id": 50668159, "au": "throw0101c", "dom": 50, "sr": 61, "sc": 5.57, "ep": 6.55, "bs": 0.0, "d": 2, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 66, "qw": 103, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": ["https://en.wikipedia.org/wiki/Cartel", "https://en.wikipedia.org/wiki/Mexican_standoff"], "ig": 0.58, "fa": 1.32, "gp": 0.983, "bl": 0.0, "ds": 0.0, "txt": "> You explained what a price cartel is.\n\nThe word \"cartel\" generally means collaboration. In this case there could be no collaboration going on, and each dive maker is individually choosing not taking on the risk of more CapEx (which can be completely rational decision):\n\n> A cartel is a group of independent market participants who collaborate with each other and avoid competing with each other in order to improve their profits and dominate the market.\n\n* https://en.wikipedia.org/wiki/Cartel\n\n> This is how you beat other companies, if and when your goal is to beat other companies. If all companies just decide to keep the supply low and be shy on investments, they're not in competition.\n\nThey can be in competition, but each individually chooses not to try to be number one. Each is hoping the others will beat each other up.\n\nSee perhaps:\n\n> A Stand Alone Complex is a social phenomenon where independent, unconnected individuals act in similar ways to create a seemingly coordinated effort or conspiracy, despite having no central leader, shared plan, or true original source.\n\nAlso:\n\n* https://en.wikipedia.org/wiki/Mexican_standoff"}, {"id": 50668464, "au": "jdewerd", "dom": 15, "sr": 62, "sc": 5.57, "ep": 6.53, "bs": 0.0, "d": 5, "age": 3.39, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 662, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://seekingalpha.com/symbol/SNDK/valuation/price-earnings-peg-ratios"], "ig": 1.531, "fa": 0.62, "gp": 0.802, "bl": 0.0, "ds": 0.0, "txt": "Hah, I love the coal meme, consider it stolen. But yes: if you expect SSD prices to maintain, there are a bunch of sandisk shareholders eager to sell you their stock for a forward p/e of.... 2\n\nhttps://seekingalpha.com/symbol/SNDK/valuation/price-earning...\n\nThey might be panicking. The stock might be a steal of a deal. Or maybe the smart money is correct and SSDs will soon price-correct. We'll see!"}, {"id": 50663123, "au": "UnlockedSecrets", "dom": 291, "sr": 63, "sc": 5.57, "ep": 6.24, "bs": 0.0, "d": 1, "age": 14.1, "grav": 148.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 283, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.188, "fa": 0.95, "gp": 0.508, "bl": 0.0, "ds": 0.0, "txt": "Currently, About 300TB of 8TB SAS and 1TB of RAM in a server sitting in my rack unplugged from an older project debating if I should sell it or not haha...."}, {"id": 50664778, "au": "mschuster91", "dom": 90, "sr": 64, "sc": 5.57, "ep": 6.19, "bs": 0.0, "d": 4, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 16, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.711, "fa": 0.42, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "> They're throttling allocations of GPUs instead, which isn't in the spirit of free markets either.\n\nWhoever pays most gets the most, and a bunch of fucks flush with cash are just hoarding so that others can't have it to outcompete them.\n\nNormally this kind of stuff should be heavily discouraged against as market manipulation, but eh. We all know the current administration, pay them enough bribes (aka donations to the GOP, to Trump's inauguration or the White House Ballroom or the Triumph Arch or any other of the ridiculous projects) and you can do whatever the fuck you want."}, {"id": 50662818, "au": "wmf", "dom": 445, "sr": 65, "sc": 5.57, "ep": 6.18, "bs": 0.0, "d": 1, "age": 14.98, "grav": 163.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 52400, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.458, "fa": 0.68, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "HDD above 4TB are now often always shingled writes\n\nNope. Seagate learned their lesson; the 8 TB Barracuda is SMR while the larger models are all CMR. It looks like WD has almost completely phased out SMR from consumer drives."}, {"id": 50662584, "au": "jibalt", "dom": 323, "sr": 66, "sc": 5.57, "ep": 6.08, "bs": 0.0, "d": 0, "age": 15.68, "grav": 176.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 0.781, "fa": 0.95, "gp": 1.062, "bl": 0.0, "ds": 0.0, "txt": "In around 1985 I paid $1000 for a 50MB drive compatible with my Amiga 1000.\n(On a PC they were running about $600.)"}, {"id": 50665053, "au": "bob1029", "dom": 315, "sr": 67, "sc": 5.57, "ep": 6.02, "bs": 0.0, "d": 0, "age": 9.46, "grav": 80.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.614, "fa": 0.28, "gp": 0.986, "bl": 0.0, "ds": 0.0, "txt": "I like to think of this as a natural extension of the DRAM pricing crisis.\n\nMore and more engineers are probably exploring their ability to page memory out to disk given the cost of DRAM. We're effectively pushing the cost up the stack of storage latency.\n\nHBM => DRAM => NVMe => spinning rust\n\nTape and optical media are the last stop on this train ride. We're almost there."}, {"id": 50662346, "au": "keyle", "dom": 241, "sr": 68, "sc": 5.57, "ep": 5.98, "bs": 0.0, "d": 1, "age": 16.28, "grav": 186.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 17279, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.749, "fa": 0.95, "gp": 1.041, "bl": 0.0, "ds": 0.0, "txt": "Same here. The exact same stick of nvme 4TB has gone up 2.5X for me. I can get 1TB for that price now. It's silly."}, {"id": 50664642, "au": "8n4vidtmkvmk", "dom": 287, "sr": 69, "sc": 5.57, "ep": 5.97, "bs": 0.0, "d": 3, "age": 10.36, "grav": 92.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 2228, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.718, "fa": 0.95, "gp": 1.086, "bl": 0.0, "ds": 0.0, "txt": "I'm encoding all my videos at 5.5 Mbps, downscaled to at most 1080p60 as I type this. I'm getting compression ratios over 90%. Quality still looks pretty good. VMAF scores around 92, whatever that means.\n\nIt's either this or not storing it at all. I can't afford to keep TBs of videos. Most of it is vacation footage. About 14k videos apparently."}, {"id": 50662742, "au": "colechristensen", "dom": 200, "sr": 70, "sc": 5.57, "ep": 5.91, "bs": 0.0, "d": 2, "age": 15.27, "grav": 168.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 20, "k": 28893, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.489, "fa": 0.42, "gp": 0.834, "bl": 0.0, "ds": 0.0, "txt": ">They're not going to get less hungry for compute over time when there's ever more money to be made.\n\nThe infinite money glitch of the AI land grab will (or has nearly) come to an end.  Labs are talking about stopping or significantly slowing new models.  Companies are pulling back on LLM usage by employees.\n\nAnd the economy only has so many trillion dollars to throw at this before returns are needed."}, {"id": 50666115, "au": "byb", "dom": 276, "sr": 71, "sc": 5.57, "ep": 5.89, "bs": 0.0, "d": 0, "age": 7.13, "grav": 53.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 207, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": ["https://forum.level1techs.com/t/the-sata-jukemux-one-sata-port-sixteen-drives/260939/4"], "ig": 1.354, "fa": 0.62, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "Prices have gotten so bad that I've started a project to aggregate 16 low-capacity drives on a single SATA port:\nhttps://forum.level1techs.com/t/the-sata-jukemux-one-sata-po...\n\nI wish there were someone crazier and smarter than me cooking up low-cost magnetic hard drives in their basement."}, {"id": 50665554, "au": "mschuster91", "dom": 92, "sr": 72, "sc": 5.57, "ep": 6.7, "bs": 0.85, "d": 6, "age": 8.24, "grav": 65.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 12, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.856, "fa": 0.42, "gp": 0.786, "bl": 0.32, "ds": 0.0, "txt": "> Allocations are decided on volumes and not on a dollars per GPU basis.\n\nYeah and Nvidia is always going to favor the one single player that just says \"here, 10 billion dollars in straight cash, you give me all the GPUs you can\" versus a bunch of small players (especially if NVIDIA is invested into the large players - they, after all, want their investment to go up).\n\nFor society as a whole however, the GPUs sitting around is inefficient waste as there are so many companies and invididuals that could actually use these GPUs (or RAM chips or whatnot) to make money.\n\nThat is why I want to see the hoarders punished. They are using their immediately available cash to drown out everyone else.\n\nAnd Sam Altman, who played RAM manufacturers behind closed doors and single-handedly wrecked the RAM market, should be locked up and the keys thrown away."}, {"id": 50664798, "au": "mschuster91", "dom": 224, "sr": 73, "sc": 5.57, "ep": 5.85, "bs": 0.0, "d": 1, "age": 9.99, "grav": 87.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 14, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.615, "fa": 0.42, "gp": 0.589, "bl": 0.0, "ds": 0.0, "txt": "> My suspicion is that, in a few years, the price per gig will collapse again.\n\nYeah but my NAS I have shut down because two drives are already showing SMART errors and I can't fucking afford replacement disks. I just hope they spin up again in a few years when prices return to somewhat \"normal\" again.\n\nThe alternative is of course that prices do not ever return to normal again, because no bank and no investor will hand the manufacturers money again because everyone is all too aware of the infamous pork cycle with capital and time intensive capacity expansions."}, {"id": 50667770, "au": "TheRealPomax", "dom": 55, "sr": 74, "sc": 5.57, "ep": 5.84, "bs": 0.0, "d": 2, "age": 4.47, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 8257, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.822, "fa": 0.34, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "No, they did not, they explained what supply and demand is. Cartels are where several companies agree to restrict supply, fix prices, agree to a maximum (rather than minimum) quality, or any other agreement between companies made purely to circumvent the market for financial gain.\n\nSome are considered legal, like OPEC, most are not, like the infamous Phoebus cartel that kept lightbulbs bad so they could sell more bulbs per year, and some come about unintentionally, like the US potato cartel naturally coming about due to everyone using the same service for algorithmically pricing the same product for different companies.\n\nA cartel would be if all the HDD manufacturers got together and went \"looking at the current market, let's all agree to 3x our prices, but keep the relative differences so as not to make it obvious\". If that agreement exists, cartel. If not, no cartel, just corporations doing what corporations do."}, {"id": 50667912, "au": "jdblair", "dom": 47, "sr": 75, "sc": 5.57, "ep": 5.83, "bs": 0.0, "d": 4, "age": 4.27, "grav": 27.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3693, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.556, "fa": 0.34, "gp": 0.829, "bl": 0.0, "ds": 0.0, "txt": "Not really, at least, not without potentially taking a loss on the capital cost of new production capacity. The projected demand has to be durable enough to cover the cost of a new factory, or new machines.\n\nI'm assuming that existing capacity is utilized as close to 100% as possible to meet current demand, since doing otherwise at these prices is just leaving money on the table."}, {"id": 50670107, "au": "wpm", "dom": 234, "sr": 76, "sc": 5.57, "ep": 5.82, "bs": 0.0, "d": 4, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 3715, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.982, "fa": 0.0, "gp": 0.801, "bl": 0.0, "ds": 0.0, "txt": "The solution to AI driven cyberattacks on your home infrastructure is to use AI to harden your home infrastructure against said attacks.\n\nAll of the things that are hard to setup for a single lone homelabber are trivial for an AI agent to setup. Going from zero to passably enterprise grade infrastruture has never been faster or easier. Hand it a few SSH certificates for admin accounts on a few Raspberry Pis, an explanation of your network map, and tell it what you want.\n\nIn your case, there is no need for complex client certificate or WireGuard nonsense. Just setup actual SSO accounts for your friends and family. Now their OS/client is responsible for keeping a hold of their password, they can password reset themselves, enroll in 2FA, and you can be very granular about permissions."}, {"id": 50663148, "au": "fendy3002", "dom": 211, "sr": 77, "sc": 5.57, "ep": 5.81, "bs": 0.0, "d": 3, "age": 14.02, "grav": 147.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 14, "k": 1170, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.479, "fa": 0.42, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "> How are they fending off potential new entrants who could break up this cartel\n\nFor my guess, it's because not many can easily build the factory because the huge investment and technology needed, with licenses and patents on top of it. Even China cannot open one that can rival Samsung or Nvidia.\n\nFurthermore if ones able to do so, they can be easily crushed by lowering the memory prices below market value, since existing players have years of experience and capacity, so they can manufacture cheaper than the new ones."}, {"id": 50665403, "au": "woadwarrior01", "dom": 91, "sr": 78, "sc": 5.57, "ep": 5.72, "bs": 0.0, "d": 5, "age": 8.64, "grav": 70.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 25, "k": 3050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.446, "fa": 0.42, "gp": 0.776, "bl": 0.0, "ds": 0.0, "txt": "> Whoever pays most gets the most, and a bunch of fucks flush with cash are just hoarding so that others can't have it to outcompete them.\n\nThis is enterprise, not retail. Almost everyone gets a negotiated discount off of the list price. Higher volume buyers get bigger discounts. Allocations are decided on volumes and not on a dollars per GPU basis."}, {"id": 50666991, "au": "oliwarner", "dom": 108, "sr": 79, "sc": 5.57, "ep": 5.66, "bs": 0.0, "d": 1, "age": 5.62, "grav": 38.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 7749, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.636, "fa": 0.34, "gp": 0.584, "bl": 0.0, "ds": 0.0, "txt": "It also helps they get paid twice as much for zero R&D, zero capex. For consumers, they've massively elongated the manufacturing window for pre-2020 products.\n\nWhile they have this incentive, they can control the prices with this supply control. Same with DRAM. A few key players own the knowledge, the parents and nobody else has
