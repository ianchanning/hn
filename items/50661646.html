a chance into increase supply.\n\nI agree, it's short of price fixing but it's still an active choice that benefits them enormously, that works by having technological monopoly."}, {"id": 50664992, "au": "Cthulhu_", "dom": 101, "sr": 80, "sc": 5.57, "ep": 5.66, "bs": 0.0, "d": 4, "age": 9.57, "grav": 82.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 34017, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.603, "fa": 0.34, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "Aren't there more machines or more competition out there for \"previous generation\" lithography machines? I'd expect older generations to remain in operation and churn out chips for the not-cutting-edge market, and that there are alternatives to ASML for non-EUV machines.\n\nlike, flash storage doesn't necessarily need to get bigger or faster at this point (imo), 1 TB SSDs will serve a big % of the markets."}, {"id": 50668066, "au": "derektank", "dom": 386, "sr": 81, "sc": 5.57, "ep": 5.62, "bs": 0.0, "d": 8, "age": 4.0, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 3108, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.838, "fa": 0.0, "gp": 0.898, "bl": 0.0, "ds": 0.0, "txt": "Market socialism can exist in theory and existed in practice in Yugoslavia. It does not exist today in Europe. Every European economy allows private businesses and individuals to own the means of production and freely allocate capital. And since we’re bringing America into the picture, many (Denmark, Switzerland, Irelans) actually have fewer regulations on private capital and fewer restrictions on economic freedom than the US does."}, {"id": 50664937, "au": "gscott", "dom": 94, "sr": 82, "sc": 5.57, "ep": 5.62, "bs": 0.0, "d": 3, "age": 9.7, "grav": 83.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 16518, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.513, "fa": 0.34, "gp": 0.756, "bl": 0.0, "ds": 0.0, "txt": "They created artificial demand by backing loans that backed datacenter buildouts that would take 5 years to complete but the gpus would need to be bought then stored in the meantime.\n\nThis has filtered down to consumer gpus that are now double or triple the cost because\n\nNvidia makes more money on datacenter gpus that just end up packed into a warehouse giving Inference to nobody."}, {"id": 50667991, "au": "bagacrap", "dom": 49, "sr": 83, "sc": 5.54, "ep": 5.54, "bs": 0.0, "d": 2, "age": 4.12, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 15, "k": 4014, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.331, "fa": 0.42, "gp": 0.836, "bl": 0.0, "ds": 0.0, "txt": "> If they all make the same choice to keep the supply low, it is a cartel\n\nFirst four words of definition of price cartel: \"*agreement* among competing sellers\"\n\nClearly, \"making the same choice\" cannot be illegal because many competitors will make the same choice as each other for acceptable and obvious reasons. (It being the sensible choice.)"}, {"id": 50665207, "au": "ethbr1", "dom": 147, "sr": 84, "sc": 5.52, "ep": 5.52, "bs": 0.0, "d": 3, "age": 9.14, "grav": 76.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 14, "k": 15919, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.401, "fa": 0.42, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": "> A small shift in supply and/or demand can have an outsized move on prices.\n\nIt would seem this is also exacerbated by fewer firms existing in a given market.\n\nEven without intentional collusion, it's more likely 3 firms make (reasonable) bets that just happen to align into severe undersupply than 10 firms (who would be more normally distributed)."}, {"id": 50666071, "au": "lotsofpulp", "dom": 54, "sr": 85, "sc": 5.5, "ep": 5.5, "bs": 0.0, "d": 2, "age": 7.22, "grav": 54.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 17, "k": 36934, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.095, "fa": 0.76, "gp": 0.525, "bl": 0.0, "ds": 0.0, "txt": ">but they're expected to ramp up production of a product that can compete with rival companies' offerings\n\nWho is they?\n\nAre you willing to liquidate your savings and invest in my new factory making whatever you want to buy at a lower price?  Or are you going to stick with the 10% relatively risk-free returns of SP500?"}, {"id": 50665271, "au": "Tuna-Fish", "dom": 144, "sr": 86, "sc": 5.48, "ep": 5.48, "bs": 0.0, "d": 2, "age": 8.97, "grav": 74.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 215, "qw": 0, "k": 14748, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.131, "fa": 0.56, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "IMO commodity DRAM prices will collapse quickly once inference moves off it.\n\nInitially into weights on flash, using some advanced flash packaging to increase throughput. HBF for servers, something like zNAND-O, MSA-CBA, Xtacking, etc for client, client side has not yet cohered around a standard.\n\nEventually advanced upcoming stacked memory, like IGZO 2T0C DRAM stacked on logic, FeFETs stacked on logic, etc.\n\nDRAM is not the platonic ideal where to store model weights. They are inherently RMM (\"Read Mostly Memory\"), with extreme throughput demands, and very predictable usage pattern. And specifically, memory use is extremely local to the compute units using them, at the extreme a fully scaled out inference apparatus would be most efficient with hundred thousand local pools instead of one global one. We are currently serving our models from commodity DRAM because the entire industry is extremely young, and that's what we had available. Once the dust settles, better architectures will take it's place. The KV-cache will continue to use commodity DRAM until something does the RW load better than it.\n\nFLASH prices are only going to keep going up in the short term, because HBF will do to FLASH what HBM did to memory (less bits out of the same fab capacity, much more demand for those bits). That too shall pass eventually."}, {"id": 50667058, "au": "alkonaut", "dom": 317, "sr": 87, "sc": 5.46, "ep": 5.46, "bs": 0.0, "d": 0, "age": 5.52, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 24589, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.509, "fa": 0.34, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "So as the demand soared a few years back, I guess lots of chip manufacturers expanded capacity to build e.g. dram, and that this is now slowly coming online?\n\nAre we seeing the crazy ram/storage prices despite the capacity now being significantly higher than a few years ago, OR have the bulk of the expansion not yet come online?\n\nHow is capacity being built out in China for this? Do they have many 10nm fabs soon churning out DRAM?"}, {"id": 50669824, "au": "the_lucifer", "dom": 125, "sr": 88, "sc": 5.39, "ep": 5.39, "bs": 0.0, "d": 3, "age": 1.44, "grav": 9.2, "surf": 14.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 10, "k": 201, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.425, "fa": 0.42, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "> Samsung execs have spoken publicly about how worried they are\n\nI wouldn't be surprised. My assessment of CXMT is that even though they're behind today, they're a significant enough threat for the DRAM cartel from here on out forever. This feels like the last time there'll ever be a chance for the three to price fix, because there's no way CXMT will ever collude with the three Korean companies once they reach parity.\n\nBasically, they killed the golden goose to pump up their market cap."}, {"id": 50662329, "au": "tamimio", "dom": 407, "sr": 89, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 0, "age": 16.34, "grav": 188.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2464, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.497, "fa": 0.34, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "It’s 100% made up by companies greed, AI shouldn’t impact HDD unlike ram or ssd, or gpus. In fact, I would even go extra mile and argue ram/ssd are also as a result of coordinated efforts by the few companies to keep the prices high. Most of us remember the “chip shortage” during lockdowns, it was neither shortage nor supplychain issues."}, {"id": 50663041, "au": "stingraycharles", "dom": 160, "sr": 90, "sc": 5.35, "ep": 5.35, "bs": 0.0, "d": 1, "age": 14.3, "grav": 152.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 17383, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 0.917, "fa": 0.68, "gp": 0.864, "bl": 0.0, "ds": 0.0, "txt": "\"At that time, we will be seeing PC's capable of hosting a full AI model for the equivalen of less that $1000 today.\"\n\nThis is already possible; it's just not state-of-the-art, which will also be true in 5 years. The goalpost keeps moving."}, {"id": 50664819, "au": "mschuster91", "dom": 174, "sr": 91, "sc": 5.33, "ep": 5.33, "bs": 0.0, "d": 6, "age": 9.95, "grav": 86.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 5, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.313, "fa": 0.42, "gp": 0.722, "bl": 0.0, "ds": 0.0, "txt": "> Silicon really doesn’t wear out.\n\nI'd be less worried about the CPU/GPU (well, as long as it isn't made with liquid metal cooling, see the \"GTA 6 has fried my PS5\" complaints), but the flash chips for every component's firmware... eventually, they will fall victim to bitrot. And unlike say USB drives, these flash chips are often \"naked\" flash with no built-in error correction."}, {"id": 50663731, "au": "baq", "dom": 153, "sr": 92, "sc": 5.31, "ep": 5.31, "bs": 0.0, "d": 2, "age": 12.49, "grav": 123.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 21723, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.905, "fa": 0.0, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "Prices are set at the margin. If capacity gets overbuilt as it always does in such bubbles, we’ll see a collapse in price as soon as customers who placed the orders start canceling their projects and offloading their now homeless hardware. Technological pace of improvement (or lack of it) is in the short term completely overpowered by basic market dynamics and fundamental economics: spot price is set by the last transaction.\n\n(Note that ram prices are already hinting at least stabilization. The models we’re in awe with which solve millennium problems are trained on hardware ordered before the bubble, some of it may have been installed this year, not sure. Marginal component price is now determined by datacenters which aren’t even in the hole-in-the-ground phase and may be canceled at any time.)"}, {"id": 50670348, "au": "to11mtm", "dom": 6, "sr": 93, "sc": 5.3, "ep": 5.3, "bs": 0.0, "d": 3, "age": 0.7, "grav": 6.0, "surf": 8.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 1844, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 2.031, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "I think Part of the problem is that, the storage market has some historical cartel-ish behavior, but they didn't get caught the same way DRAM/NAND makers have been caught.\n\nThe most glaring case, was when just about every hard drive manufacturer except Samsung cutting their warranties to 1 year within a month of each other. (Thank goodness, Samsung had gotten good enough at making their stuff and was eager to get rid of the 'Samdung' reputation of techs.) It was a subtle but important change on some margin line, because yes some of those brands that changed policy did start to see higher failure rates when I was working at a shop slinging hardware. Thankfully we switched to primarily selling Samsung drives, especially since the way 'OEM' drive warranties worked, we would sometimes have to eat the cost if a drive was received by us, sat on a shelf for a month or two, and died in the last couple months of purchaser's first year."}, {"id": 50666510, "au": "throwaway2037", "dom": 247, "sr": 94, "sc": 5.29, "ep": 5.29, "bs": 0.0, "d": 5, "age": 6.39, "grav": 46.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 56, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.298, "fa": 0.42, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "I had no idea it so bad.  Here is what I found with Google:\n\n    > FY 2025: Net loss of -$25.61M USD\n    > FY 2024: Net loss of -$48.53M USD\n    > FY 2023: Net loss of -$59.71M USD\n    > FY 2022: Net loss of -$51.40M USD\n    > FY 2021: Net loss of -$21.70M USD\n\nWhat terrible performance!\n\n    > Do you think it's a growth business?\n\nI found this from their homepage:\n\n    > According to the Backblaze About Page, the company oversees more than 6.12 exabytes (6,120+ petabytes) of data for over 500,000 customers across 175+ countries.\n\nThey are adding about one petabyte of storage per year.  That looks like a good growth trajectory to me, but they are consistently losing money (year-over-year)."}, {"id": 50662560, "au": "drnick1", "dom": 370, "sr": 95, "sc": 5.24, "ep": 5.24, "bs": 0.0, "d": 2, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 23, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.3, "fa": 0.42, "gp": 0.68, "bl": 0.0, "ds": 0.0, "txt": "> Expansion slots and interoperability were the first to go. Then user serviceability. Now we're seeing the loss of actual ownership of devices.\n\nWhat devices are you referring to? While it is true that cell phones and appliances are largely locked down, the ATX format and expansion cards haven't gone anywhere. Building your own PC from hand-picked parts is still very much a thing. But even in the mobile space, you can find devices with unlocked bootloaders that allow you to run FOSS operating systems like GrapheneOS, LineageOS and some Linux distros."}, {"id": 50666692, "au": "cowlevel", "dom": 116, "sr": 96, "sc": 5.23, "ep": 5.23, "bs": 0.0, "d": 2, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.599, "fa": 0.28, "gp": 0.463, "bl": 0.0, "ds": 0.0, "txt": "Consumer brands would quickly stop existing and consumers would buy company brands. Without consumer protection since corporate buyers don't get that. You would have to pay net30 invoice with a credit rating because that's what corporate does.\n\nIf you prevented consumers from buying corporate as well, we'll then they just wouldn't get to have any products at all. Corporate is where the money is, vendors always focus on that.\n\nFor example if IKEA had to focus on either home furniture or office furniture, it would be an easy choice to only stock office furniture because that makes more money."}, {"id": 50662675, "au": "tripleee", "dom": 320, "sr": 97, "sc": 5.21, "ep": 5.21, "bs": 0.0, "d": 1, "age": 15.46, "grav": 172.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 1024, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.754, "fa": 0.95, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "Where are you getting 3tb disks for $30? I just paid $100 for a 6TB disk with 5 years power on hours :/"}, {"id": 50664172, "au": "dgellow", "dom": 396, "sr": 98, "sc": 5.2, "ep": 5.2, "bs": 0.0, "d": 0, "age": 11.4, "grav": 106.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 23182, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.766, "fa": 0.0, "gp": 0.725, "bl": 0.0, "ds": 0.0, "txt": "The worldwide inflation caused by the AI rollout is scandalous. It’s for sure sad for retail consumers, hobbyists. But its really impacting everything, and every institutions: schools, hospitals, researchers, and of course almost every companies are negatively impacted by the price increase, products are cancelled, delayed or spec‘ed down. Meaning worse offers and services for pretty much everybody, everywhere"}, {"id": 50667184, "au": "DanielHB", "dom": 70, "sr": 99, "sc": 5.2, "ep": 5.2, "bs": 0.0, "d": 3, "age": 5.33, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 3149, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.517, "fa": 0.28, "gp": 0.576, "bl": 0.0, "ds": 0.0, "txt": "For each category of chip maker there is only a handful of global suppliers (3 for RAM for example). Supermarket and airlines have way more, maybe not locally for a single region/route but if price gouging became extreme competitors would quickly move in.\n\nThere is far less need for a formalized cartel if there is a small number of competitors."}, {"id": 50665713, "au": "taegee", "dom": 238, "sr": 100, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 1, "age": 7.91, "grav": 62.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 115, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.118, "fa": 0.68, "gp": 0.427, "bl": 0.0, "ds": 0.0, "txt": "Framework outlisted the LPCAMM2 128GB module as it approached $4k. You basically buy a RAM module with some attached components. ;D"}, {"id": 50662567, "au": "Gigachad", "dom": 401, "sr": 101, "sc": 5.16, "ep": 5.16, "bs": 0.0, "d": 1, "age": 15.73, "grav": 177.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 25230, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.441, "fa": 0.34, "gp": 0.558, "bl": 0.0, "ds": 0.0, "txt": "You can't even rent it these days. Have a look at cloud gaming, Xbox recently changed their quotas so you get 5-15 hours of gaming a month depending your plan, and then you have to pay hourly. If you math it out, game streaming ends up not really any cheaper than buying the hardware."}, {"id": 50663009, "au": "vannevar", "dom": 201, "sr": 102, "sc": 5.11, "ep": 5.11, "bs": 0.0, "d": 2, "age": 14.38, "grav": 153.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 6032, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.384, "fa": 0.34, "gp": 0.611, "bl": 0.0, "ds": 0.0, "txt": "A staggering amount of hardware is being committed to data center projects that may never be built. Over 90% of Nvidia sales now are to data center projects that intend to rent the hardware out, rather than to direct corporate consumers. It's a bubble, and it will burst within a year."}, {"id": 50663204, "au": "jongjong", "dom": 412, "sr": 103, "sc": 5.09, "ep": 5.09, "bs": 0.0, "d": 0, "age": 13.88, "grav": 145.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3072, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.42, "fa": 0.34, "gp": 0.541, "bl": 0.0, "ds": 0.0, "txt": "People have gotten too greedy for storage. I remember a day when a 500MB hard drive was enough to store everything I could possibly imagine.\n\nNowadays, the average AI company is storing terabytes of generated slop daily which nobody's going to look at ever again."}, {"id": 50670615, "au": "LordDragonfang", "dom": 53, "sr": 104, "sc": 5.08, "ep": 5.08, "bs": 0.0, "d": 2, "age": 0.27, "grav": 4.4, "surf": 12.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 16, "k": 2878, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.453, "fa": 0.42, "gp": 0.324, "bl": 0.0, "ds": 0.0, "txt": "> I'm not denying that \"not taking risks and keeping the supply low\" is better for them financially\n\nThen you're admitting it's not a price cartel. A cartel, by definition, requires companies to ignore their individual incentives to increase supply and undercut others in order to fix prices collectively. This case is the opposite -- it's being driven entirely by the fact that none of them wants to take the individual risk of being out over a ledge if the bubble pops."}, {"id": 50663314, "au": "lmpdev", "dom": 429, "sr": 105, "sc": 5.06, "ep": 5.06, "bs": 0.0, "d": 3, "age": 13.55, "grav": 139.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 993, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.361, "fa": 0.34, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "I mean is it really set in stone that central planning is impossible? Especially given our advances in information processing compared to 1991.\n\nCould things like real-time purchase data or AI demand forecasting substitute for price signals?"}, {"id": 50664453, "au": "avadodin", "dom": 350, "sr": 106, "sc": 5.06, "ep": 5.06, "bs": 0.0, "d": 3, "age": 10.83, "grav": 98.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 364, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.383, "fa": 0.34, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "It's like 10x slower to load a model from HDD but perfectly usable.\n\nThe OS read-only partition should fit in RAM anyways.\n\nThe main issue is you can barely even buy them anymore."}, {"id": 50662738, "au": "motionlessveloc", "dom": 347, "sr": 107, "sc": 5.06, "ep": 5.06, "bs": 0.0, "d": 0, "age": 15.29, "grav": 169.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 984, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.603, "fa": 0.0, "gp": 0.889, "bl": 0.0, "ds": 0.0, "txt": "It's quite surprising that there are no Chinese competitors in this market. But I presume it's similar to combustion engines for cars: fiddly to manufacture, dominated by economies of scale, and ultimately a slowly declining dead end as people move to SSDs/EVs."}, {"id": 50667943, "au": "gpm", "dom": 68, "sr": 108, "sc": 5.04, "ep": 5.04, "bs": 0.0, "d": 2, "age": 4.22, "grav": 26.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 15, "k": 24022, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.311, "fa": 0.42, "gp": 0.523, "bl": 0.0, "ds": 0.0, "txt": "> all of the manufacturers lose profit margins if any of them ramp up supply significantly.\n\nYou've just described the incentive to create a cartel...\n\nThe way a theoretical efficient market works is that this collaboration is forbidden and each company marginally ramp up supply whenever that action creates more profit for them (at the expense of the other companies profits, and the total profit the industry collects). Iterated this results in them all significantly ramping up supply and having exactly zero profit (which rather explains why real markets look nothing like theoretical efficient ones)."}, {"id": 50664166, "au": "Gareth321", "dom": 298, "sr": 109, "sc": 5.03, "ep": 5.03, "bs": 0.0, "d": 2, "age": 11.42, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 6041, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.715, "fa": 0.0, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "There is a continuum of data importance. At one end might be family pictures and legal documents. At the other end might be a movie torrent which can be easily downloaded again. As cloud storage prices increase incrementally, the point at which people prefer cloud storage moves on the continuum. I think a lot of people are using cloud storage for data they don’t really care about that much. There is a lot of room to move a lot of data local.\n\nI use cloud for the really important stuff, but for my movies and shows, I rely on RAID. If the server somehow gets destroyed I’ll be sad but it’s not the end of the world. That risk is worth it to me for saving thousands of dollars every month in cloud storage."}, {"id": 50663001, "au": "omgwtfbyobbq", "dom": 279, "sr": 110, "sc": 4.98, "ep": 4.98, "bs": 0.0, "d": 1, "age": 14.42, "grav": 154.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1512, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.446, "fa": 0.34, "gp": 0.424, "bl": 0.0, "ds": 0.0, "txt": "That's what I did after hardware prices ramped up in the early 2010s. Just had a few laptops I bought refurbished, some low power compute for serving stuff (pogoplug), and a 1tb external hd.\n\nWhen prices came down, I stocked up a bit, although I should have bought more in retrospect."}, {"id": 50662740, "au": "Joel_Mckay", "dom": 202, "sr": 111, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 2, "age": 15.28, "grav": 168.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.786, "fa": 0.0, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "The only constraint LLM firms have is subsidized infrastructure power-consumption, and many blitz-scalers will run their data centers off gas generators like a 3rd-world country.\n\nIt is an irrational speculative market condition, with a global risk exposure that will also impact traditionally stable firms.  The Bears will ultimately win this one in my humble opinion. =3"}, {"id": 50663422, "au": "NegativeLatency", "dom": 204, "sr": 112, "sc": 4.93, "ep": 4.93, "bs": 0.0, "d": 2, "age": 13.24, "grav": 134.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 4285, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.443, "fa": 0.28, "gp": 0.51, "bl": 0.0, "ds": 0.0, "txt": "I host my own services for reasons other than price efficiency.\n\nFor example my personal media libraries that aren’t available on cloud services.\n\nThe dynamics are slightly different for media vs LLM compute but my point is that people find value having ownership over their tools and software."}, {"id": 50663081, "au": "collabs", "dom": 185, "sr": 113, "sc": 4.9, "ep": 4.9, "bs": 0.0, "d": 4, "age": 14.21, "grav": 150.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 551, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.661, "fa": 0.0, "gp": 0.689, "bl": 0.0, "ds": 0.0, "txt": "The way I see it, Facebook and Google (no, I refuse to call them by their newly made up names) especially are in a good spot because they had tens of billions of dollars in net profit and free cash flow every year before the AI build out so they can afford to service their debt at least somewhat. Also either everybody — including them can continue building or nobody can build anymore. Both cases are ok for Facebook and Google.\n\nIt is important to remember that these two companies in particular didn't have an option to sit it out, unlike Apple. So they did what they had to however insane it feels to basically dump money into this furnace."}, {"id": 50665618, "au": "iagiagiag", "dom": 2, "sr": 114, "sc": 4.89, "ep": 4.89, "bs": 0.0, "d": 1, "age": 8.1, "grav": 64.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 0, "k": 27, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.611, "fa": 0.0, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "You explained what a price cartel is. In a healthy economy for consumers, companies are supposed to compete against each others and adapt to the demand. If they all make the same choice to keep the supply low, it is a cartel. Increasing the supply does require a high CapEX, but they're expected to ramp up production of a product that can compete with rival companies' offerings. This is how you beat other companies, if and when your goal is to beat other companies. If all companies just decide to keep the supply low and be shy on investments, they're not in competition. I'm not denying that \"not taking risks and keeping the supply low\" is better for them financially, it's a very reasonable choice to make more money. I'm saying that's the moment when it's reasonable to accuse them of anti-competitive practices. Companies must take risks and attempt to beat the competition.\n\nNow I don't know if they're really keeping the production low for HDDs. But we have similar questions for GPUs, RAM and NAND memory."}, {"id": 50665816, "au": "silvestrov", "dom": 23, "sr": 115, "sc": 4.86, "ep": 4.86, "bs": 0.0, "d": 2, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 5758, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.422, "fa": 0.0, "gp": 1.05, "bl": 0.0, "ds": 0.0, "txt": "No. From wikipedia: \"A cartel is a group of independent market participants who collaborate with each other [...] by creating artificial shortages\"\n\nThe total market demand of harddrives (and RAM) is higher than supply. So the companies do not need to create artificial shortages and they do not need to coordinate prices. Everybody can completely independently increase prices because they will still sell all their stock no matter that their prices are higher than the competition."}, {"id": 50664181, "au": "BrianHenryIE", "dom": 285, "sr": 116, "sc": 4.85, "ep": 8.42, "bs": 3.58, "d": 1, "age": 11.38, "grav": 106.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 69, "qw": 0, "k": 849, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": ["https://www.youtube.com/watch?v=-yqAMIqw8HI"], "ig": 1.741, "fa": 0.95, "gp": 1.121, "bl": 1.35, "ds": 0.0, "txt": "Video. I used to record every bike ride I took with four cameras – front and rear GoPro @ 2.7k and front and rear helmet @ 1080p. I've kept some, but if I had 100 Tb of drives, I'd easily fill it.\n\nThe video I have is on one hand unremarkable, but also nice to have and keep. Here's a video cycling home from work in Sacramento in 2019 (two cameras from 9 minutes+). I have more and I wish I had loads more.\n\nhttps://www.youtube.com/watch?v=-yqAMIqw8HI"}, {"id": 50667090, "au": "lotsofpulp", "dom": 72, "sr": 117, "sc": 4.81, "ep": 4.81, "bs": 0.0, "d": 3, "age": 5.46, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 36934, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.739, "fa": 0.0, "gp": 0.498, "bl": 0.0, "ds": 0.0, "txt": "Making supermarkets, airliners, and restaurants has a far lower barrier to entry, in both money and expertise, than a facility that manufactures chips (or HDD or other complicated electronics).  Multiple orders of magnitude lower.\n\nNote that making (big) airplanes has a similarly high barrier to entry, and hence why only a few organizations exist that make them, just like chips and HDD.  But airliners are, comparatively, much lower barrier to entry."}, {"id": 50663076, "au": "nukanse", "dom": 326, "sr": 118, "sc": 4.81, "ep": 4.81, "bs": 0.0, "d": 0, "age": 14.22, "grav": 150.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.217, "fa": 0.34, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "Along years, I replaced so many hdd with SSD from notebooks, that I got a pile of unused 1 tb drives. \nIn the past, every time I got a newer, larger disk, I thought it was more than needed, only to find them full in no time. Today, I don't have a way to fill them."}, {"id": 50668228, "au": "cowlevel", "dom": 277, "sr": 119, "sc": 4.79, "ep": 4.79, "bs": 0.0, "d": 1, "age": 3.76, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 0.422, "bl": 0.0, "ds": 0.0, "txt": "I believe most people are using SAS expanders. SATA drives work in SAS ports (the reverse is not true) although not every combination is well tested, and you can get double the ports because normal SAS is dual-channel.\n\nYout machine probably doesn't have a SAS card (HBA) in it so you'll need to get one. You also need special breakout cables that bring one SAS port to 4 separate SATA plugs. There are also different connectors used with SAS so you have to be aware of that. You'll probably have plenty of ports on your HBA alone (often 32 per card) but if not, you can make a tree of expanders to connect a very large number of drives. The PCIe-shaped ones usually take power from PCIe but don't connect data, so they don't need to actually go inside a computer."}, {"id": 50669164, "au": "curun1r", "dom": 65, "sr": 120, "sc": 4.78, "ep": 4.78, "bs": 0.0, "d": 3, "age": 2.35, "grav": 14.1, "surf": 5.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 6646, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.665, "fa": 0.0, "gp": 0.597, "bl": 0.0, "ds": 0.0, "txt": "The fundamental problem is that no one believes that AI demand is durable. This isn’t AI skepticism, it’s a belief that we’re in a bubble and that there will be a consolidation at some point where a lot of hypers-scalars go out of business and are bought at fire-sale prices.\n\nThis lack of being able to forecast reliable demand far enough out to get an ROI on increased capacity fully explains why producers are just happy to ride the wave of higher prices rather than taking a huge risk to capture a larger chunk of the market."}, {"id": 50665097, "au": "ozgrakkurt", "dom": 438, "sr": 121, "sc": 4.7, "ep": 4.7, "bs": 0.0, "d": 0, "age": 9.35, "grav": 79.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 1337, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.334, "fa": 0.34, "gp": 0.408, "bl": 0.0, "ds": 0.0, "txt": "People here are so naive, working people are just the naivest people in the world unfortunately.\n\nIf what you are buying is getting more expensive and your salary and job opportunities aren't increasing more than that. Then you are getting shafted.\n\nThe tool you have for circumventing this is voting, I would recommend voting for w/e person that you think will make economy work for you.\n\nThe billionaire class has more money than you and they are more organized and they ARE the politicans etc. too. AND you can be sure they have this mentality.\n\nYou basically have 100% chance of getting shafted even worse over time.\n\nIt shouldn't be too compilated to support who ever is trying to make you richer and succeeding at it. It is just appaling what people are discussing here about whether nvidia is in the right or not. They don't care about it, governments don't care about it, why do you care about it?"}, {"id": 50664561, "au": "woadwarrior01", "dom": 82, "sr": 122, "sc": 4.6, "ep": 4.6, "bs": 0.0, "d": 3, "age": 10.57, "grav": 95.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 3050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.184, "fa": 0.34, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "They're throttling allocations of GPUs instead, which isn't in the spirit of free markets either. Ed Zitron has been arguing that over $200 billion worth of NVIDIA GPUs are sitting idle in warehouses because DC buildouts and power capacity have lagged behind GPU deliveries."}, {"id": 50667789, "au": "dwallin", "dom": 4, "sr": 123, "sc": 4.6, "ep": 4.6, "bs": 0.0, "d": 3, "age": 4.45, "grav": 28.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 1260, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.558, "fa": 0.0, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "This is where a market being an oligopoly is problematic. With only three players it’s a pretty safe bet that no one will take that bet. This is often implicit collusion. In a market with more players though, the chance that at least one company will make that gamble is much higher. The upside and amount of market you can gain is significant when you are a smaller player. Then other companies have to take into account the likelihood that other companies will be increasing supply, meaning they can’t safely rely on margins continuing to increase without investment. This all means a competitive industry will tend to be much more responsive to market conditions."}, {"id": 50662914, "au": "Abishek_Muthian", "dom": 203, "sr": 124, "sc": 4.6, "ep": 4.6, "bs": 0.0, "d": 1, "age": 14.66, "grav": 158.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 18, "k": 7055, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 0.982, "fa": 0.42, "gp": 0.752, "bl": 0.0, "ds": 0.0, "txt": ">we will be seeing PC's capable of hosting a full AI model for the equivalen of less that $1000 today\n\nThen the same model hosted in a data center would be available for pennies and memory manufactures would want to get that business over premium consumer  segment."}, {"id": 50670022, "au": "braiamp", "dom": 22, "sr": 125, "sc": 4.58, "ep": 5.42, "bs": 0.85, "d": 5, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 227, "qw": 0, "k": 1429, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.966, "fa": 0.0, "gp": 0.554, "bl": 0.32, "ds": 0.0, "txt": "Again, stop using macro/micro distinctions here. In macroeconomics we do not have a subset for hdd, most of the time it goes into \"other industries\". So, please, for the love of god, I'm going to hit you with my book of Das Kapital if you continue. There are 3 big groups, service, primary and secondary and hdd fabrication goes into the secondary in other industry subsector (unless your country has a big enough electronic industry to deserve its own subsector).\n\nNow that  that's settled again, you are right that a surge in price doesn't require a fix, but a surge in price without anyone entering to compete for the economic profits to be had is something that deserves questions and shutting that discussion with just \"it's just high demand that will settle\" doesn't resolve it because it could also indicate structural weaknesses of the industry (like floods in a country suddenly cause prices everywhere to rise is a cause of concern about lack of resilience of the industry). So I ask again, because it seems that you ignored my list of potential responses from policy perspective: why isn't there a signal that anyone else is entering the market of making magnetic platter storage devices?\n\nBTW, nobody's proposing companies must compete or get treated as a cartel. You're arguing against a policy nobody proposed, we are asking why the market doesn't behave as expected of a supposedly hig"}, {"id": 50663652, "au": "aanet", "dom": 331, "sr": 126, "sc": 4.57, "ep": 4.57, "bs": 0.0, "d": 0, "age": 12.68, "grav": 126.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 1855, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.558, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Clayton Christensen’s book Innovator’s Dilemma (which was based partly on his own PhD thesis) is based squarely on the falling prices (and how!) or storage and memory, and how different companies ignored the revolution in their own industry, one by one.\n\nI recall that, every time I see the eye watering RAM and SSD/HDD prices today.\n\nSupply, demand, and all those economic laws…\n\nAm wondering if the price/TB will ever fall down as it had been for several decades. Or what it would take for that trend to continue"}, {"id": 50663724, "au": "gpt5", "dom": 129, "sr": 127, "sc": 4.57, "ep": 4.57, "bs": 0.0, "d": 5, "age": 12.5, "grav": 123.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3354, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.069, "fa": 0.34, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "What I said is true, their chips are 40% larger, and they are more expensive. They are not competitive outside of China, which is why they are only sold domestically and not even enthusiasts are buying them outside.\n\nApple negotiated using them for the Chinese market at a discount, and as you said, it didn’t materialize."}, {"id": 50663095, "au": "MinimalAction", "dom": 365, "sr": 128, "sc": 4.44, "ep": 4.44, "bs": 0.0, "d": 0, "age": 14.17, "grav": 149.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1497, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.118, "fa": 0.34, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "This is one of the things I hate about AI. Consumer grade RAM has much different requirements than the data centre/industrial ones. But we pay the price. The real price is never the $20 subscriptions; it's the tech going unaffordable."}, {"id": 50662495, "au": "Waraqa", "dom": 308, "sr": 129, "sc": 4.41, "ep": 4.41, "bs": 0.0, "d": 0, "age": 15.92, "grav": 180.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 59, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.002, "fa": 0.34, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "The main point of the article is that competition drives prices down. Before 2000, there were even more hard drive manufacturers, but most of them eventually exited the market. Apparently, those companies didn't find it worthwhile to stay in the business at such low prices."}, {"id": 50666073, "au": "dv_dt", "dom": 24, "sr": 130, "sc": 4.39, "ep": 4.39, "bs": 0.0, "d": 3, "age": 7.21, "grav": 54.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 9316, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.595, "fa": 0.0, "gp": 0.441, "bl": 0.0, "ds": 0.0, "txt": "if it actually higher than supply in a sustainably believable way then one would expect capital investments in more capability to build. If suppliers believe that the demand is hollow demand that exists to keep competitors from access to supply, one migjt expect no new production investments and companies accepting reservation fees to hold inventory off the market. this should be looked at by monopoly and cartel regulators but few of those government bodies are willing to do any enforcement anymore"}, {"id": 50663864, "au": "loeg", "dom": 1, "sr": 131, "sc": 4.36, "ep": 4.36, "bs": 0.0, "d": 0, "age": 12.16, "grav": 118.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 27267, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 1.117, "bl": 0.0, "ds": 0.0, "txt": "Author assumes price cartels, but this can be completely explained by supply and demand.  Hyperscalars are buying all the storage they can get their hands on; that's it.  Manufacturers are loath to ramp up supply (high CapEx), because they'll be underwater if the AI demand evaporates."}, {"id": 50662906, "au": "QuiEgo", "dom": 278, "sr": 132, "sc": 4.35, "ep": 4.35, "bs": 0.0, "d": 0, "age": 14.7, "grav": 158.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 698, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.423, "fa": 0.0, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "I’m glad I have a pile of hardware. If I was starting from scratch today, I’d almost certainly just give up and pay for SaaS / streaming / cloud everything instead of self hosting, at least for a few years until the inevitable drop comes."}, {"id": 50664628, "au": "shevy-java", "dom": 225, "sr": 133, "sc": 4.32, "ep": 4.32, "bs": 0.0, "d": 1, "age": 10.4, "grav": 92.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 6, "k": 2075, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 0.865, "fa": 0.76, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "> I give it five years at most.\n\nWait - we have to wait 5 years for prices to go down again?\n\nSo what if this does not happen? Would you be willing to\nhelp pay for RAM of other people? Because I think we have\na mafia in place operating right now. Those price increases\nare not normal."}, {"id": 50662504, "au": "basilgohar", "dom": 307, "sr": 134, "sc": 4.29, "ep": 4.29, "bs": 0.0, "d": 1, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 3493, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.63, "fa": 0.0, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "This is only true until it isn't.\n\nSSDs used to be an impractical pipe dream. HDD densities are at levels unheard of a decade or two ago.\n\nIt's true, we all want change faster, but we'll probably be pleasantly surprised (hopefully that's all) when someone makes that major tech or economic breakthrough that changes the equation.\n\nThese things happen in cycles. We're just able to comiserate about this one far more quickly and readily thanks to all this. waves around at the Internet vaguely"}, {"id": 50665572, "au": "adrian_b", "dom": 417, "sr": 135, "sc": 4.24, "ep": 4.24, "bs": 0.0, "d": 1, "age": 8.2, "grav": 65.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 0.929, "fa": 0.68, "gp": 0.081, "bl": 0.0, "ds": 0.0, "txt": "7 years is very optimistic.\n\nIf that were true, the HDD makers would not have reduced their warranty times from the 5-years that was normal in the past to as low as they can, typically 2 years or at most 3."}, {"id": 50665890, "au": "sensanaty", "dom": 390, "sr": 136, "sc": 4.22, "ep": 7.27, "bs": 3.05, "d": 0, "age": 7.55, "grav": 58.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5066, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.523, "fa": 0.95, "gp": 0.679, "bl": 1.15, "ds": 0.0, "txt": "I'm so glad I built my PC right before this insane bubble ballooned. The 64GB of RAM I bought for 250EUR is now 1500EUR, half the cost of the entire machine, which has a fucking 4080S in it.\n\nScam Altman and all the other AI ghouls all need to rot away in a dark cell for eternity for all their bullshit"}, {"id": 50662747, "au": "digdugdirk", "dom": 333, "sr": 137, "sc": 4.2, "ep": 4.2, "bs": 0.0, "d": 1, "age": 15.26, "grav": 168.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 2700, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.277, "fa": 0.28, "gp": 0.277, "bl": 0.0, "ds": 0.0, "txt": "KV cache, to try and hide LLM latency. This can be offloaded and saved to disk, making it much faster to come back to. I'd be very interested to hear what the numbers are for the big labs, and how they allocate and evict that storage over time."}, {"id": 50666580, "au": "justincormack", "dom": 34, "sr": 138, "sc": 4.18, "ep": 4.18, "bs": 0.0, "d": 2, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 21, "qw": 0, "k": 12046, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": ["https://www.forbes.com/sites/tomcoughlin/2026/11/10/third-quarter-2026-hard-disk-drive-industry-update/"], "ig": 0.906, "fa": 0.34, "gp": 0.747, "bl": 0.0, "ds": 0.0, "txt": "Capacity is estimated to be up 27% since last year https://www.forbes.com/sites/tomcoughlin/2026/11/10/third-qu... and Toshiba at least is quoted as investing to increase market share."}, {"id": 50666709, "au": "tetris11", "dom": 311, "sr": 139, "sc": 4.16, "ep": 4.16, "bs": 0.0, "d": 1, "age": 6.08, "grav": 43.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 5717, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.508, "fa": 0.0, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "The amount of labs I've worked in, where their storage concerns escalate to \"we need to put everything on OneDrive, or build our own ZFS\" but most of the data is pure archive, and can just happily exist as a bunch of backed up hard drives sitting cold in a drawer getting a data check maybe twice a year."}, {"id": 50667884, "au": "coldbrewed", "dom": 232, "sr": 140, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 2, "age": 4.33, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 541, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.403, "fa": 0.0, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "If your self hosted services are behind a VPN, network segmentation gating access to secure trusted devices, workload isolation between your services, and an optional auth proxy gating access, your self hosted env can have functionally no surface area for exploitation.\n\nAt a minimum keeping your services behind a VPN drops your surface area to a very reasonable level."}, {"id": 50664106, "au": "matwood", "dom": 146, "sr": 141, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 2, "age": 11.58, "grav": 109.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 21237, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.206, "fa": 0.34, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "MU has ~80% gross margins for a commodity. Yes, it takes time and investment to build out capacity, but those types of margins simply will not last.\n\nThe demand side is also becoming capital constrained with liquidity getting harder to come by.\n\nPeak prices are set at the margin. A small shift in supply and/or demand can have an outsized move on prices."}, {"id": 50666181, "au": "dv_dt", "dom": 28, "sr": 142, "sc": 4.08, "ep": 4.92, "bs": 0.85, "d": 5, "age": 6.99, "grav": 52.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 9316, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.754, "fa": 0.0, "gp": 0.553, "bl": 0.32, "ds": 0.0, "txt": "Yes hence why I differentiated \"sustainable demand\" vs \"hollow demand\". And really when it affects worldwide consumer inflation, regulators should be looking for pricing cartels that harm competitiveness in markets. I think its going to turn out that overcapitalized AI companies will be unable to build the datacenters to even consume their reserved capacity among RAM, GPU and drive storage. At some point its just using capital to hold back competition- which used to be looked at as negatively as restraint of trade by regulators"}, {"id": 50662537, "au": "bitexploder", "dom": 338, "sr": 143, "sc": 4.07, "ep": 4.07, "bs": 0.0, "d": 1, "age": 15.8, "grav": 178.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7559, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.583, "fa": 0.0, "gp": 0.243, "bl": 0.0, "ds": 0.0, "txt": "AI is quite spendy with disk and outputs. Local models use tons of gigabytes and I am doing lots more complicated builds and container shenanigans than ever before. I have never used more storage professionally and personally. AI produce so much data. And general demand continues to increase as more of out universe is digitized."}, {"id": 50664976, "au": "Cthulhu_", "dom": 61, "sr": 144, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 1, "age": 9.6, "grav": 82.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 34017, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "Arguably this price increase isn't nearly as bad as that of memory, and / or the price of storage has been dropping for years now so this feels more like a correction. I'd argue that without increasing supply / ramping up production, the market will correct eventually as demand stabilizes and drops. (especially when the market crashes, which I still expect to happen - I expect that many of the hundreds/thousands of planned datacenter projects will be cancelled due to various reasons)"}, {"id": 50662779, "au": "Retric", "dom": 195, "sr": 145, "sc": 4.03, "ep": 4.03, "bs": 0.0, "d": 2, "age": 15.16, "grav": 166.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 61752, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.622, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "There’s nothing inherently limiting the production of trillions of dollars worth of compute alongside everything else from Cars to TV’s.  It’s just risky in the face of a potential bubble.\n\nStable business models on the other hand justify capacity in ways that a potential bubble doesn’t.  Thus it doesn’t matter if AI works or not, prices are going to return to reason as uncertainty falls."}, {"id": 50662594, "au": "sieve", "dom": 402, "sr": 146, "sc": 4.01, "ep": 4.01, "bs": 0.0, "d": 1, "age": 15.65, "grav": 175.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 812, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.842, "fa": 0.68, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Rent out to whom? If I only have a single core CPU with 256 GB RAM and a 20GB HDD, my demand for AI drops to zero."}, {"id": 50668082, "au": "marcosdumay", "dom": 182, "sr": 147, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 5, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 19, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.189, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> the Trump administration is utterly unwilling to do anything to help regular people or rein in business run amok\n\nThey don't seem willing to let food prices raise to a point it becomes unaffordable. That's basically why the stock market is breaking right now.\n\nThey are willing to do anything else, but at least the money regulators have a minimal sense of self-preservation."}, {"id": 50666607, "au": "publlus_enigma", "dom": 310, "sr": 148, "sc": 3.97, "ep": 3.97, "bs": 0.0, "d": 0, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 447, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.471, "bl": 0.0, "ds": 0.0, "txt": "Blu-ray is my current solution to the problem. It occurs to me that I really don't need most of my data to be either writeable, or online. Blu-ray disks in bulk from Japan are cheaper per GB than most hard drives, can be stored, and can be incrementally purchased. I index them with MeoFinder, and so far, have been perfectly happy with the arrangement."}, {"id": 50666086, "au": "Ylpertnodi", "dom": 439, "sr": 149, "sc": 3.93, "ep": 3.93, "bs": 0.0, "d": 1, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 23, "k": 567, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.163, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The tool you have for circumventing this is voting, I would recommend voting for w/e person that you think will make economy work for you.\n\n\"Think\".\nHaving never heard of a government that actually didn't lie, cheat, rib, steal, bully, cajole, ignore....\n\nI'll happily refrain from voting and let those that do, knock themselves out doing so.\nAnd I do so enjoy the \"which bit didn't you get?\"moments.\nEveryone gets defensive, but they vote again, next opportunity."}, {"id": 50665356, "au": "gscott", "dom": 96, "sr": 150, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 5, "age": 8.72, "grav": 71.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 16518, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.118, "fa": 0.34, "gp": 0.203, "bl": 0.0, "ds": 0.0, "txt": "5 year old datacenter gpus filter down to the consumer market.  A v100 or a v620 is not as fast and power efficient as a 5090 but the purchase cost is affordable."}, {"id": 50667031, "au": "lotsofpulp", "dom": 39, "sr": 151, "sc": 3.87, "ep": 3.87, "bs": 0.0, "d": 4, "age": 5.56, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 26, "k": 36934, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": ["https://www.merriam-webster.com/dictionary/cartel"], "ig": 0.385, "fa": 1.04, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can make any word meaningless if you want, especially if the goal is to satisfy your emotional desires.\n\nProbably does not help when communicating with others, though.\n\nhttps://www.merriam-webster.com/dictionary/cartel\n\n>1 a written agreement between belligerent nations\n\n>2 a combination of independent commercial or industrial enterprises designed to limit competition or fix prices\n\n>3 a combination of political groups for common action"}, {"id": 50664161, "au": "vdp", "dom": 80, "sr": 152, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 1, "age": 11.43, "grav": 107.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 9, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.085, "fa": 0.0, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "The same was said about Nvidia's GPUs, but as it had come to light in connection to the Huang scandal, it's actually due to intentiaonal throthing of production, to keep the prices high. I personally am done with the benefit of doubt- these days greed and power play should always be taken as the primary motivations."}, {"id": 50662615, "au": "otterley", "dom": 284, "sr": 153, "sc": 3.8, "ep": 3.8, "bs": 0.0, "d": 0, "age": 15.6, "grav": 174.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 14415, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 0.533, "fa": 0.34, "gp": 1.085, "bl": 0.0, "ds": 0.0, "txt": "I’m curious as to what an individual user even on the right side of the bell curve is doing with 100TiB+ of storage."}, {"id": 50663013, "au": "howunfortunate", "dom": 210, "sr": 154, "sc": 3.78, "ep": 3.78, "bs": 0.0, "d": 2, "age": 14.37, "grav": 153.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 12, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.875, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> problem is the cartel-like / memory monopolies that is become open secret now\n\nI'm not privy to this open secret. Are the major manufacturers colluding to fix prices? How are they doing so while successfully evading detection? How are they fending off potential new entrants who could break up this cartel?"}, {"id": 50666417, "au": "freecodeio", "dom": 397, "sr": 155, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 0, "age": 6.58, "grav": 47.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 499, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.551, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "Prices have become so bad and the industry has become so toxic for both the environment and the human life that I'm riding my current pre-high prices high tier pc until it's last breath, and when it dies, I'm just gonna be come a grocery store manager or something. Utterly disgusted by the state of this industry."}, {"id": 50663555, "au": "dabinat", "dom": 294, "sr": 156, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 0, "age": 12.94, "grav": 130.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 4610, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.257, "fa": 0.0, "gp": 0.546, "bl": 0.0, "ds": 0.0, "txt": "I’m working to move away from S3 to my own storage. Even at today’s insane prices it still works out better than S3. The difference between renting and owning is stark, and as a bonus you have an asset that can potentially be sold later on if needed."}, {"id": 50662972, "au": "fendy3002", "dom": 208, "sr": 157, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 1, "age": 14.5, "grav": 155.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1170, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.696, "bl": 0.0, "ds": 0.0, "txt": "problem is the cartel-like / memory monopolies that is become open secret now.\n\nstill if the price is relatively lower, I see that there may appear a separate \"AI box\" products that can be connected wirelessly or wired, that do the AI computing there rather than buffing the personal notebook over and over. Essentilally a mini pc but more specialized."}, {"id": 50662691, "au": "mceachen", "dom": 167, "sr": 158, "sc": 3.72, "ep": 3.72, "bs": 0.0, "d": 1, "age": 15.4, "grav": 171.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3531, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "I'm not so sure. Agents turn this on its head.\n\nThe largest compute-hungry tech giants a decade ago had a soft ceiling on what compute resources they needed.\n\nWe now have handfuls of companies with trillions to spend on compute, and some even have profitable business models.\n\nThey're not going to get *less* hungry for compute over time when there's ever more money to be made."}, {"id": 50666909, "au": "m4rtink", "dom": 139, "sr": 159, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 6, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 5730, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.162, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "At current AI psychosis induced RAM prices their chips could be 2x as large and require goat sacrifice to work - and they would still sell like hot cakes!"}, {"id": 50665639, "au": "imtringued", "dom": 97, "sr": 160, "sc": 3.64, "ep": 3.64, "bs": 0.0, "d": 2, "age": 8.06, "grav": 63.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 12744, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.506, "fa": 0.0, "gp": 0.066, "bl": 0.0, "ds": 0.0, "txt": "\"intentional throttling of production\" (or product lifespan) sounds like an issue of unpriced idle capital. Since idle capital is inevitable, you have to figure out how to price it back into the one time sales your entire business runs on. The customers then complain because of the backhanded way the idle capital is priced in, but that same customer would probably scoff at paying for idle capital to begin with."}, {"id": 50663055, "au": "theturtletalks", "dom": 207, "sr": 161, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 4, "age": 14.27, "grav": 151.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4060, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.452, "fa": 0.0, "gp": 0.151, "bl": 0.0, "ds": 0.0, "txt": "Very good point, data centers will have their fill and if you alienate your other base, you’re making a premium on a very small percentage of sales.\n\nThis is why NVidia went the cyclic financing route, they didn’t want to lose their gaming base in the long term. It keeps them fed during the bust cycles."}, {"id": 50662371, "au": "blalala", "dom": 379, "sr": 162, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 3, "age": 16.23, "grav": 185.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.455, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "The west collectively stopped producing anything, outsourcing all production to (largely) China. This includes both capitalist and socialist countries (most of Europe falls heavily in that bucket). Demand is exceeding production, software gets less and less efficient (GTA VI at 200+ GB). Prices go up…"}, {"id": 50663098, "au": "senectus1", "dom": 398, "sr": 163, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 0, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1567, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 0.959, "fa": 0.34, "gp": 0.271, "bl": 0.0, "ds": 0.0, "txt": "I'm so glad i got PC's for my wife and kids, a NAS and a Proxmox server with 128gb ram a few years ago.\n\nNo way i could afford my hobby these days."}, {"id": 50663364, "au": "wmf", "dom": 430, "sr": 164, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 4, "age": 13.41, "grav": 137.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 52400, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.094, "fa": 0.34, "gp": 0.036, "bl": 0.0, "ds": 0.0, "txt": "Every time people talk about consumers setting prices, they mean setting prices way below cost. That's not sustainable in any system.\n\nThe DRAM/flash/HDD shortage is caused by a mismatch between an unforeseen technology (AI) and factories that take 5 years to build. No system can fix that."}, {"id": 50669782, "au": "dcrazy", "dom": 5, "sr": 165, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 4, "age": 1.5, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2559, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.478, "fa": 0.0, "gp": 0.064, "bl": 0.0, "ds": 0.0, "txt": "The concept of “entry costs” is a well understood explanation for why the number of hard drive suppliers does not scale elastically with demand.\n\nAt least the processes for NAND and RAM are similar enough to transition your CPU infrastructure between. Hard drives are entirely different products with a dying supply chain."}, {"id": 50665823, "au": "gmueckl", "dom": 44, "sr": 166, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 2, "age": 7.65, "grav": 59.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 6699, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "Ramping up is not just a one time capital expenditure, but also a recurring operational cost. If demand is projected to slow down again (and I bet that these companies project that), then the future overhead from such a decision will lose the company money long term to the point of potential failure."}, {"id": 50662440, "au": "bakugo", "dom": 375, "sr": 167, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 1, "age": 16.06, "grav": 182.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 3515, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.041, "bl": 0.0, "ds": 0.0, "txt": "Been saying this for a while. Technofeudalism is real and it's coming at us fast.\n\nIf nothing is done to stop it, I fully expect the concept of personal computer ownership as we know it to vanish within the next decade or two. We'll be limited to using our phones as thin clients to interface with subscription-based cloud services, and anything we want to \"create\" will have to be done through AI, making us fully dependent on it."}, {"id": 50666569, "au": "cubefox", "dom": 152, "sr": 168, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 5, "age": 6.31, "grav": 45.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.504, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's already a big change from the past, where manufacturing cost was roughly constant per chip area, which meant an exponential decrease in cost per transistor.\n\nIt seems that in the not too distant future, even mature new nodes will no longer mean a decrease in price per transistor, at which point only power efficiency could justify investment in new nodes."}, {"id": 50663789, "au": "throwaway85825", "dom": 142, "sr": 169, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 5, "age": 12.36, "grav": 121.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 880, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.496, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a moat except now with such high memory prices they can do capital investment without needing subsidy. The DRAM cartel is effectively creating their competitor.\n\nConversely OPEC pumped more to drive oil prices down because they wanted to bankrupt american shale."}, {"id": 50669256, "au": "dahart", "dom": 21, "sr": 170, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 4, "age": 2.23, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 232, "qw": 16, "k": 19139, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.942, "fa": 0.42, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "> We are talking about microeconomics, the behavior between individual agents. Macro is about aggregates across agents.\n\nYes, that was my point. Expecting companies to compete is something that happens in aggregate. That does not mean individual companies are required to compete. Parent claimed to be talking micro, but said something that only applies to macro.\n\nWhat am I wrong about exactly? The ‘description’ I was talking about was the parent’s stated implication that somehow companies are required to compete, otherwise they are cartels. There is no such line or requirement, and parent has confused what makes a cartel with what economists mean when they say companies are expected to compete. If you’re assuming I meant something else by “description”, you might have misunderstood.\n\nHaving some suspicion that we might need a policy fix could mean we need a policy fix, or it could mean you’re making assumptions that turn out not to be true. The consumer side of a surge in demand sucks; prices go up. That doesn’t mean anything is wrong or that something requires fixing, it’s just a fact of markets. Someone needs to step in if there’s price fixing, but parent’s entire premise was that companies should be considered cartels and fixing prices even if they’re not communicating, and even if they’re accidentally matching prices, and if they’re not appearing to compete more strongly and"}, {"id": 50663862, "au": "ludydev", "dom": 355, "sr": 171, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 0, "age": 12.17, "grav": 118.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.123, "fa": 0.0, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "Storage and memory now have a much stronger value proposition on their own, rather than being generic commodities that relied on a race to the bottom in pricing to seem worthwhile."}, {"id": 50664241, "au": "himinlomax", "dom": 98, "sr": 172, "sc": 3.43, "ep": 3.43, "bs": 0.0, "d": 2, "age": 11.25, "grav": 104.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 2734, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.194, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's really hard to believe for various reasons, but I'll name one:\n\nTSMC is the clear bottleneck for GPU (and pretty much anything bleeding edge) production, and they're running at full capacity. Your conspiracy theory (and I employ the expression in the strictest sense) would require them to be in on it DEEP, and leave money, good will and legal certainty on the table.\n\nNot entirely impossible admittedly, but rather unlikely on the face of it."}, {"id": 50665311, "au": "miki123211", "dom": 56, "sr": 173, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 1, "age": 8.83, "grav": 72.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [],
