 "ig": 1.103, "fa": 0.0, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "I've recently seen an interview with an Anthropic SWE (on Gergely Orosz's X I believe) where she was complaining about how they were having to rewrite from Python to Rust because the hyperscalers weren't giving them the CPU they needed and letting them scale up.\n\nThe supply chain issues have gotten so bad that even the frontier labs are suffering from this."}, {"id": 50665375, "au": "adrian_b", "dom": 135, "sr": 174, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 10, "age": 8.68, "grav": 71.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.353, "fa": 0.9, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There have been some updates.\n\nThe Chinese estimate that their EUV lithography machines will become usable for mass production some time between 2030 and 2032."}, {"id": 50665107, "au": "dvdkon", "dom": 171, "sr": 175, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 5, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1918, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "Same, thankfully I've \"prepped\" enough hardware to have enough computing power for the rest of my life. But storage is really a consumable with a long lifespan, be it HDDs or flash SSDs. I'm dreading the moment one of my disks fails and I'll have to choose between paying exorbitant prices or losing data."}, {"id": 50666060, "au": "m4rtink", "dom": 283, "sr": 176, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 3, "age": 7.24, "grav": 54.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 5730, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.011, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sure, I don't say they don't have the money (or at least the people shipping them the driver orders believe they will pay the invoice).\n\nI am just not sure they have any actual \"machine\" that turns HDDs into profit at a 4x. At least not sustainably."}, {"id": 50663018, "au": "0xbadcafebee", "dom": 441, "sr": 177, "sc": 3.34, "ep": 3.34, "bs": 0.0, "d": 0, "age": 14.36, "grav": 153.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.895, "fa": 0.34, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "\"If I can wish for one thing in 2027, it would be for hardware pricing to return to reasonable levels.\"\n\nSome people lead truly idyllic lives"}, {"id": 50667645, "au": "luxcem", "dom": 8, "sr": 178, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 4, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 275, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.003, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In 2010 typical large HDD size were probably around 1To. The demand per unit shrank but the demand per To is probably higher than ever."}, {"id": 50663234, "au": "kennywinker", "dom": 161, "sr": 179, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 2, "age": 13.8, "grav": 143.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 11631, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.09, "bl": 0.0, "ds": 0.0, "txt": "Maybe. Personally, i suspect we’ve hit diminishing returns already. If state of the art development hits a wall, then the local models can catch up.  Especially if the bigger-is-smarter ideology is confirmed to be false, and specialized models (one model for RAG, another for coding, for medicine, for legal, etc) turns out to be the right move."}, {"id": 50663020, "au": "omgwtfbyobbq", "dom": 267, "sr": 180, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 1, "age": 14.36, "grav": 153.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1512, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some cases, cooling, power supplies, and certain processors and motherboards  have also been decent recently, but only for brief sales.\n\nAnything ram, storage, or GPU related is nuts. I buy a bit when I see stuff at decent prices and hold off on everything else."}, {"id": 50663242, "au": "Larrikin", "dom": 346, "sr": 181, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 1, "age": 13.77, "grav": 143.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 8842, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 0.999, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Comparing to 20 years ago isn't very useful. I remember when the general rule at CompUSA was that one gig was one dollar and it felt like you were getting more space than you could ever use at those prices."}, {"id": 50663795, "au": "mr_toad", "dom": 213, "sr": 182, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 3, "age": 12.35, "grav": 120.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 8, "k": 7703, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.822, "fa": 0.42, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "> Are the major manufacturers colluding to fix prices?\n\nThey’re not colluding (as far as anyone knows), but they’re not committing to building a lot of new capacity, instead they’re just profiting from the shortage.\n\nIn a more competitive market you might see more investment (which ultimately leads to over-investment and a bust)."}, {"id": 50665260, "au": "fartfeatures", "dom": 85, "sr": 183, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 6, "age": 9.0, "grav": 74.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 322, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "drives_hard", "flbl": "Drives & Hard (Prices)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yup, there is a formula here, choose a popular point of view (even if it's wrong) and play to the crowd. Next comes the paid newsletter subscriptions, podcast advertising, and book deals. Bonus points if you can show this as an example of your PR firm successfully pedalling half truths in a believable way."}, {"id": 50664474, "au": "fmajid", "dom": 140, "sr": 184, "sc": 3.23, "ep": 3.23, "bs": 0.0, "d": 5, "age": 10.77, "grav": 98.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 7685, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.018, "bl": 0.0, "ds": 0.0, "txt": "Apple was forced to stop their evaluation of YMTC and CXMT by threats from the US Federal government, even if those services would have been for the Chinese market. And the Chinese government is actively pushing CXMT and YMTC to prioritize Chinese customers.\n\nDRAM and NAND are global commodity products and demand is fungible, though, and every little bit helps, but the  does imply explicit coordination at some level. What you’re talking about is independent companies that were not designed to limit competition responding to each other without any coordination, which is legal and extremely common in free markets and does not amount to price fixing. It might be possible for some to follow the flock as long as is suits them and it can appear like coordination from afar, but that doesn’t prevent a company from breaking from the flock to gain an edge or because they can’t afford to follow forever or for other reasons. Without coordination, and given that following the competition incidentally is legal under anti-trust laws, I don’t believe that a company price-matching their competition is illegal, without further evidence of coordination."}, {"id": 50666704, "au": "rbanffy", "dom": 159, "sr": 193, "sc": 2.92, "ep": 3.77, "bs": 0.85, "d": 7, "age": 6.09, "grav": 43.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 200272, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 1.191, "fa": 0.28, "gp": 0.118, "bl": 0.32, "ds": 0.0, "txt": "That’s very normal for fiber for two reasons - passing it is horrendously expensive in dense urban settings and transceivers on the ends keep improving pushing throughput higher on already deployed capacity.\n\nYou just deploy as much as you can once and keep the rest for future expansion, because the cable itself costs nothing next to deploying it."}, {"id": 50665501, "au": "energy123", "dom": 218, "sr": 194, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 8.38, "grav": 67.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 4279, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "china_dram", "flbl": "China & DRAM (Value)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "I s, that's still possible."}, {"id": 50664142, "au": "criticalsamus", "dom": 372, "sr": 217, "sc": 2.53, "ep": 5.05, "bs": 2.52, "d": 2, "age": 11.48, "grav": 108.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 1.422, "fa": 0.34, "gp": 0.507, "bl": 0.95, "ds": 0.0, "txt": "Not sure what you're talking about.  It's not hard to go buy your own ATX case (or mATX or mITX if you want a smaller form factor), power supply, motherboard, and other parts and build your own computer.  Any decent motherboard has PCIe slots.  I just built my own home server 2 years ago, just before the HDD and memory prices skyrocketed."}, {"id": 50663450, "au": "arjie", "dom": 404, "sr": 218, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 0, "age": 13.18, "grav": 133.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 10985, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.926, "fa": 0.0, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "It's not so bad if you saw this coming and purchased ahead of time. The thing to remember is that the market can stay rational a lot longer than you can copemax about a bubble."}, {"id": 50663298, "au": "load-bearing", "dom": 217, "sr": 219, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 1, "age": 13.59, "grav": 140.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 61, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "demand_supply", "flbl": "Demand & Supply (Market)", "urls": [], "ig": 0.873, "fa": 0.0, "gp": 0.308, "bl": 0.0, "ds": 0.0, "txt": "Most capacity for years ahead is booked in long term contracts by major consumers ($$$ gigacorps) which never happened before. I wouldn't be so sure. Flooding buy your supercar from?"}, {"id": 50662338, "au": "hliyan", "dom": 369, "sr": 222, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 16.3, "grav": 187.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 13992, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": [], "ig": 0.763, "fa": 0.0, "gp": 0.46, "bl": 0.0, "ds": 0.0, "txt": "Inclined to agree. Expansion slots and interoperability were the first to go. Then user serviceability. Now we're seeing the loss of actual ownership of devices. I worry that in the future, computing devices will not be available for outright purchase, but only licensed for use by paying a subscription. Time to legally enforce open protocols and open standards."}, {"id": 50669755, "au": "preg_match", "dom": 60, "sr": 223, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 4, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 930, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 1.043, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I find AI generated code to be more efficient overall, mostly because it doesn’t have the readability requirements as human code. Also, traditionally “easy” human programming languages perform very poorly with LLMs.\n\nI write a lot of PHP (I know). PHP is not only slow, it’s awful for LLMs because it’s so dynamic. It’s difficult to statically analyze. So, there’s basically no reason to program in PHP outside of “we already have code in PHP”. It performs worse, and it’s harder to write and verify.\n\nBut, AI generated PHP code gives a lot more weight to types. So, it ends up being easier to read and more performant than human written code typically.\n\nThis is still a step up from JS, which is even more dynamic and wishy-washy than PHP. But, the best languages for LLMs have strict, high-quality, and expansive tool chains. Like dotnet, Java, and rust. These languages are also much higher performance than “ergonomic” languages like PHP, ruby, python, JS. So, we will see more of them over the coming years I think."}, {"id": 50668192, "au": "throw0101c", "dom": 29, "sr": 224, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 4, "age": 3.81, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 21, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_money", "flbl": "Companies & Money (Billions)", "urls": [], "ig": 0.532, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> if it actually higher than supply in a sustainably believable way then one would expect capital investments in more capability to build.\n\nThe key part here is \"in a sustainably believable way\". Given the boom-bust nature of a lot of IT infra spending, perhaps the folks find it is non-believable that will be sustainable."}, {"id": 50664183, "au": "danaris", "dom": 181, "sr": 225, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 4, "age": 11.38, "grav": 106.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 6982, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To a large extent, they can stay irrational so long right now because the Trump administration is utterly unwilling to do anything to help regular people or rein in business run amok. Indeed, it almost seems like they want regular people to hurt."}, {"id": 50663936, "au": "BrenBarn", "dom": 409, "sr": 226, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 0, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3735, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier" ns)", "urls": [], "ig": 1.977, "fa": 0.0, "gp": 0.347, "bl": 1.15, "ds": 0.0, "txt": "> When economists “expect” companies to compete, they’re talking macro-economics, not legal constraints\n\nNo? We are talking about microeconomics, the behavior between individual agents. Macro is about aggregates across agents.\n\nAlso, you are wrong while correcting the comment. Yes, he's confusing description with prescription, but the description itself describes a competitive market and something isn't happening here that may need a policy fix. In a competitive market when there's so much profit as these companies are reporting you would expect new competitors to enter the market until the marginal profit is equal or near zero. If that's not happening (and I'm not hearing anyone going into the magnetic plates business) you have to ask \"why it isn't happening\" and if the why is anticompetitive practices, financial constrains or legal barriers you fix for those.\n\nIn a efficient economy, nobody is making bank.\n\nIf the problems are the patents we have so many fixes, like forcing patent holders to license their technology to competitors on reasonable terms, breaking up or regulating patent pools that let incumbents cross license each other while freezing out newcomers, treating a dominant firm refusal to license as itself an abusive restraint on competition, etc.\n\nIf the problem is financial then the solution is easy: access to credit or straight up buying companies to produce. If "}, {"id": 50662819, "au": "massagedpelican", "dom": 272, "sr": 245, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 2, "age": 14.98, "grav": 163.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 18, "qw": 0, "k": 42, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ram_buy", "flbl": "RAM & Buy (Storage)", "urls": ["https://www.ebay.com/itm/900013870829"], "ig": 0.48, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The CPU is kind of a turd and the co
