: "General Commentary", "count": 20, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 4}, {"category": "rfc_standard", "count": 1}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["discrete", "algorithm", "deterministic", "logarithm", "subexponential-time", "encryption", "assume", "edit", "implications", "internet", "number", "sufficiently", "theory", "trust", "result", "paper", "practical", "keys"], "largest_root": {"root_id": 50666239, "author": "soVeryTired", "slots": 26, "start_dom": 40, "end_dom": 65, "share_pct": 31.3, "top_dom1_age": 9.2, "top_dom1_author": "pcstl"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50666584, "au": "peri-cl", "dom": 17, "sr": 1, "sc": 14.5, "ep": 14.5, "bs": 0.0, "d": 1, "age": 9.19, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 69, "qw": 38, "k": 2248, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": ["https://www.rfc-editor.org/rfc/rfc9954.html"], "ig": 1.415, "fa": 3.39, "gp": 1.041, "bl": 0.0, "ds": 0.0, "txt": "I think that's just \"hybrid\" key exchange. I.e., when I'm connecting to news.ycombinator.com now, my browser is exchanging keys by mlkem768x25519 in TLS 1.3, which is still secure if either one of ML-KEM or Ed25519 fall.\n\nhttps://www.rfc-editor.org/rfc/rfc9954.html (RFC 9954 Hybrid Key Exchange in TLS 1.3\")\n\n> \"Hybrid key exchange refers to using multiple key exchange algorithms simultaneously and combining the result with the goal of providing security even if a way is found to defeat the encryption for all but one of the component algorithms.\"\n\nNote that Ed25519 would fall together with RSA if that P=BQP rumor is true. (Ed25519 is a special case of the discrete logarithm problem in the OP, by the way)."}, {"id": 50666238, "au": "layer8", "dom": 13, "sr": 2, "sc": 11.64, "ep": 11.64, "bs": 0.0, "d": 0, "age": 9.79, "grav": 84.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 31, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": ["https://pages.cs.wisc.edu/~cs812-1/adleman.pdf"], "ig": 1.043, "fa": 2.91, "gp": 0.617, "bl": 0.0, "ds": 0.0, "txt": "A randomized subexponential-time algorithm for the discrete logarithm problem has been known for close to 50 years: https://pages.cs.wisc.edu/~cs812-1/adleman.pdf\n\nThe present deterministic algorithm is highly unlikely to have practical consequences for cryptographic protocols in use."}, {"id": 50669763, "au": "amluto", "dom": 44, "sr": 3, "sc": 5.91, "ep": 5.91, "bs": 0.0, "d": 3, "age": 4.41, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 25674, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 1.705, "fa": 0.28, "gp": 0.764, "bl": 0.0, "ds": 0.0, "txt": "Shor’s algorithm is extremely simple and, if run on an ideal quantum computer, has very low complexity. The complexity of solving ECDLP with Shor’s algorithm is not drastically higher than the complexity of EC multiplication/exponentiation (choose your favorite terminology) on the same computer.\n\nI don’t think the original factoring/discrete log paper tried to optimize the gate count at all (certainly the author’s lecture on the topic did not) and it’s still quite efficient. And it’s obviously possible to optimize it.\n\nActual quantum computers are messy, and logical qubit design and algorithm porting is a sort of combination of somewhat specialized math and code golfing.  AI will be fantastic at it."}, {"id": 50672298, "au": "bawolff", "dom": 31, "sr": 4, "sc": 5.47, "ep": 6.32, "bs": 0.85, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 76, "qw": 0, "k": 29308, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "practical_number", "flbl": "Practical & Number (Paper)", "urls": ["https://en.wikipedia.org/wiki/List_of_NP-complete_problems"], "ig": 1.273, "fa": 0.84, "gp": 0.642, "bl": 0.32, "ds": 0.0, "txt": "A constructive, practical proof of P=NP (an unlikely outcome) would basically allow us to solve any problem where the solution can be verified quickly.\n\nThis covers a shocking number of real world problems. wikipedia https://en.wikipedia.org/wiki/List_of_NP-complete_problems has a list of some of them.\n\nThe implications would be so great it would be difficult to come up with something it wouldn't affect. I would unironically say it would be on par with the invention of fire, for how much it would change lives."}, {"id": 50667095, "au": "adrian_b", "dom": 55, "sr": 5, "sc": 4.84, "ep": 4.99, "bs": 0.0, "d": 3, "age": 8.35, "grav": 67.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 1.712, "fa": 0.0, "gp": 0.664, "bl": 0.0, "ds": 0.0, "txt": "None of the mathematical advances that may happen in the near future is relevant for the traditional secret-key cryptography.\n\nPublic-key cryptography is not strictly necessary, key exchange can be done using pre-shared secret keys.\n\nWithin an organization, public-key algorithms offer only few improvements over secret-key algorithms, e.g. the ability to revoke certificates.\n\nWhere public-key algorithms have great advantages is for asymmetric communication between unknown customers and an authenticated server, e.g. for online purchases and online banking.\n\nIf the existing public-key algorithms became broken tomorrow, that would have negligible effect for spy agencies or competent terrorists, but it would disrupt the Internet commerce."}, {"id": 50666560, "au": "pcstl", "dom": 1, "sr": 6, "sc": 4.82, "ep": 4.82, "bs": 0.0, "d": 0, "age": 9.23, "grav": 77.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.966, "bl": 0.0, "ds": 0.0, "txt": "Since it's what everyone is going to be worrying about: This result does not matter practically for cybersecurity.\n\nThe best practical algorithm for solving elliptic curve DLP is BSGS (Baby Step, Giant Step) which grows as 2^{b/2+o(b)} in the key length.\n\nThis result claims 2^O(b/(log log b)) which is technically subexponential, but since that `log log b` term grows so slowly it pretty much would only beat BSGS for absolutely gigantic keys."}, {"id": 50667517, "au": "aaronmdjones", "dom": 24, "sr": 7, "sc": 4.22, "ep": 5.21, "bs": 0.85, "d": 3, "age": 7.75, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 1769, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 1.594, "fa": 0.28, "gp": 0.461, "bl": 0.32, "ds": 0.0, "txt": "It can require different types if that's how you set up your authorized_keys file. You can then mark it immutable so that it can't be changed.\n\nYou should also create an empty authorized_keys2 file in this case (since OpenSSH will read both by default), unless you set e.g. \"AuthorizedKeysFile .ssh/authorized_keys\" in sshd_config(5) too.\n\nIt can't accept rsa,rsa in your example since neither machine has 2 RSA authentication keys in your example.\n\nEDIT: There's also the AuthorizedKeysCommand directive instead, if you want to write a fancier program to constrain the permitted keys on offer. For example, it could look at all of the authorized keys listed in your file and offer only RSA ones, then later offer only Ed25519 ones."}, {"id": 50670866, "au": "Lockal", "dom": 28, "sr": 8, "sc": 3.6, "ep": 3.75, "bs": 0.0, "d": 1, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 676, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pads_seed", "flbl": "Pads & Seed (Totp)", "urls": [], "ig": 1.184, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "One-time pad encryption stays valid anyways. For critical data implementation is probably doable: e. g. banks will provide 1gb flash drives with single use keys, which is enough for years of transactions for most users."}, {"id": 50666982, "au": "Luke2642", "dom": 12, "sr": 9, "sc": 3.19, "ep": 3.34, "bs": 0.0, "d": 1, "age": 8.53, "grav": 69.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 23, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "practical_number", "flbl": "Practical & Number (Paper)", "urls": [], "ig": 1.419, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The right conclusion for the wrong reason. They claim the new algorithm is theoretically faster for huge numbers and only impractical because of massive initial overhead.\n\nPerhaps misread the paper's actual bound which is p^{o(1)} and means the exponent on p eventually shrinks smaller than any positive number including 0.5 (the square root) once p is big enough."}, {"id": 50666552, "au": "NitpickLawyer", "dom": 67, "sr": 10, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 1, "age": 9.24, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your sarcasm notwithstanding, I seriously think that asking the top models for an explanation, maybe w/ cross-checking their responses with each other and then a \"simplified explanation\" has better chances of being relevant than a random comment on the Internet was ~1 year ago. Obviously different if you know and trust someone and can verify their identity. But as for randoms on a forum, yeah I'll take my chances w/ the clankers on math problems."}, {"id": 50670871, "au": "bawolff", "dom": 29, "sr": 11, "sc": 3.02, "ep": 3.31, "bs": 0.0, "d": 1, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 12, "k": 29308, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.899, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd easily trade cryptography for all the rainbows and kittens that a constructive practical P=NP algorithm would imply.\n\n>Are there alternatives in cryptography that would allow us to encrypt data\n\nYes, but they are really annoying and have a lot of drawbacks."}, {"id": 50666749, "au": "huke326", "dom": 38, "sr": 12, "sc": 2.87, "ep": 5.39, "bs": 2.52, "d": 0, "age": 8.89, "grav": 73.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 1.651, "fa": 0.28, "gp": 0.492, "bl": 0.95, "ds": 0.0, "txt": "The verification angle interests me more than the algorithm itself: a deterministic claim is cheap to state and expensive to trust, so we started building replayable audits for exactly that gap. Same approach applied to the recent VP≠VNP announcements from Anthropic and OpenAI — pulled the claims down, re-ran them against independent Lean kernels, posted results and replay scripts at github.com/huv0310-arch/k25-evidence. Happy to be proven wrong on any line; that's kind of the point."}, {"id": 50667187, "au": "andersonpico", "dom": 68, "sr": 13, "sc": 2.7, "ep": 2.85, "bs": 0.0, "d": 2, "age": 8.23, "grav": 65.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 13, "k": 419, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 0.703, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Obviously different if you know and trust someone and can verify their identity.\n\none of the few things this forum has over any other is precisely that some relevant people post here using their actual identity. people come to forums for the human aspect, anyone who's here have access to the top models and could prompt themselves if sufficiently interested."}, {"id": 50666385, "au": "stabbles", "dom": 16, "sr": 14, "sc": 2.68, "ep": 2.98, "bs": 0.0, "d": 0, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3482, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 0.749, "fa": 0.0, "gp": 0.839, "bl": 0.0, "ds": 0.0, "txt": "Should OpenSSH implement a config option that requires two different types of keys? If we don't know whether RSA or Ed25519 is weakened, then better to have both?\n\nThe situation on e.g. GitHub is sort of the opposite: if you use both RSA and Ed25519, then it's as strong as the weakest of the two."}, {"id": 50666239, "au": "soVeryTired", "dom": 40, "sr": 15, "sc": 2.64, "ep": 3.15, "bs": 0.0, "d": 0, "age": 9.79, "grav": 84.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2778, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.684, "fa": 0.28, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "Opus 5.5 claims there are no immediate cryptographic consequences. Maybe bigger elliptic curve keys one day, and RSA can already be attacked by faster algorithms. Seemingly this is a complexity theory result rather than a cryptography result."}, {"id": 50666346, "au": "pcstl", "dom": 14, "sr": 16, "sc": 2.27, "ep": 2.42, "bs": 0.0, "d": 1, "age": 9.6, "grav": 82.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "practical_number", "flbl": "Practical & Number (Paper)", "urls": [], "ig": 1.03, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Also the current best algorithm has running time proportional to the square root of the group order. This one has running time proportional to the group order, which means it's a nonstarter for practical atacks."}, {"id": 50667933, "au": "pcstl", "dom": 8, "sr": 17, "sc": 2.2, "ep": 2.5, "bs": 0.0, "d": 2, "age": 7.14, "grav": 53.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "practical_number", "flbl": "Practical & Number (Paper)", "urls": [], "ig": 1.063, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This work really isn't at the hardware or even practical execution level. Just showing how the algorithm on an abstract idealized machine scales with input size. There's a lot of optimization that goes into getting this to work on a real machine."}, {"id": 50666590, "au": "andersonpico", "dom": 42, "sr": 18, "sc": 2.11, "ep": 2.55, "bs": 0.0, "d": 2, "age": 9.18, "grav": 77.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 419, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "there is no reason to assume that AI-driven progress would disproportionately benefit classical cryptanalysis while leaving quantum computing unaffected\n\nedit: quantum algorithms and error-correction algorithms are math problems. breakthroughs in quantum algorithms already reduced the qubits needed to break RSA quite drastically already. maybe AI could even aid in qubit design and hardware architecture."}, {"id": 50667060, "au": "cperciva", "dom": 32, "sr": 19, "sc": 1.98, "ep": 2.42, "bs": 0.0, "d": 0, "age": 8.41, "grav": 67.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 64557, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.39, "bl": 0.0, "ds": 0.0, "txt": "Reminder: Algorithms for integer factorization essentially always have an analogue for prime-field DLP.  Usually it takes a bit longer than this for the details to be ironed out, but the surprise would have been if this algorithm didn't exist."}, {"id": 50668357, "au": "lucamark", "dom": 37, "sr": 20, "sc": 1.95, "ep": 2.17, "bs": 0.0, "d": 0, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 113, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "practical_number", "flbl": "Practical & Number (Paper)", "urls": [], "ig": 0.707, "fa": 0.0, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "I’d love to read the story of how the authors made the connection. Did they start with this problem and go looking for a new tool, or see the earlier paper and think ‘oh wait, we could use this’?"}, {"id": 50666173, "au": "ArvidSu", "dom": 81, "sr": 21, "sc": 1.75, "ep": 1.97, "bs": 0.0, "d": 0, "age": 9.91, "grav": 86.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 24, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 0.746, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "As ChatGPT put it: \"Well, shit.\" We'll see if, or rather when this or an improvement/approach like it is a practical way to derive private keys from public keys."}, {"id": 50667544, "au": "falcor84", "dom": 26, "sr": 22, "sc": 1.38, "ep": 1.82, "bs": 0.0, "d": 2, "age": 7.7, "grav": 59.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 8179, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's a true limitation in theory, but in practice it's absolutely fine for sufficiently large values of 2."}, {"id": 50666602, "au": "aaronmdjones", "dom": 22, "sr": 23, "sc": 1.36, "ep": 2.24, "bs": 0.0, "d": 1, "age": 9.16, "grav": 76.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1769, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 0.874, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "You would want to do that for key exchange too, not just authentication. OpenSSH already supports this for authentication; setting \"AuthenticationMethods publickey,publickey\" in sshd_config(5) will force users to supply 2 independent authorised keys. It also already supports hybrid key exchange."}, {"id": 50666849, "au": "minitech", "dom": 2, "sr": 24, "sc": 1.33, "ep": 1.99, "bs": 0.0, "d": 1, "age": 8.73, "grav": 71.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2640, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 0.413, "fa": 0.28, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "I’m not very familiar with this stuff at all, but this comment doesn’t seem right. That’s the Shanks method presented nicely in Table 1 with time complexity p^{1/2+o(1)}, vs. this method’s p^o(1). I’m confused how you ended up at O(p)."}, {"id": 50671468, "au": "tsimionescu", "dom": 18, "sr": 25, "sc": 1.12, "ep": 2.22, "bs": 0.0, "d": 2, "age": 1.71, "grav": 10.6, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is there a rumor of a BQP=P result? Wildest I'd heard was a rumor that Facrorization is in P, which would be related, but far weaker. P = BQP would have massive implications, even in theoretical physics."}, {"id": 50667613, "au": "fancyfredbot", "dom": 77, "sr": 26, "sc": 1.11, "ep": 1.11, "bs": 0.0, "d": 1, "age": 7.58, "grav": 58.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3754, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.472, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Pi was recently factored by OpenAI. The trick they used was to project onto the complex plane, as it has both a real factor (P) and an imaginary factor (i). The most surprising consequence is that Pi^2 is actually negative."}, {"id": 50666696, "au": "bee_rider", "dom": 52, "sr": 27, "sc": 1.1, "ep": 1.54, "bs": 0.0, "d": 2, "age": 9.0, "grav": 74.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 25212, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pads_seed", "flbl": "Pads & Seed (Totp)", "urls": [], "ig": 0.432, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "At this point maybe we should just start building up the infrastructure for one-time-pads. Go to the Apple Store or your bank once a month or so, and load up on a couple gigs of physically random bits."}, {"id": 50666470, "au": "bradleyjg", "dom": 41, "sr": 28, "sc": 1.09, "ep": 1.97, "bs": 0.0, "d": 1, "age": 9.38, "grav": 79.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 18582, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 0.523, "fa": 0.0, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "True. But in the last couple of weeks the Bayesian probability of new math trashing a major piece of in use cryptography in the near future has shot up—-easily eclipsing the risk from quantum computing working out."}, {"id": 50668886, "au": "pixl97", "dom": 20, "sr": 29, "sc": 0.93, "ep": 2.03, "bs": 0.0, "d": 3, "age": 5.65, "grav": 39.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 0.865, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you can solve the problem with AI this quickly then you must assume that the enemy already has solved it, or will solve it soon.\n\nAs you say, watching legacy systems quickly getting switched to PQC would be a decent heads up.\n\nEven still switch to PQC now anyway."}, {"id": 50666999, "au": "bee_rider", "dom": 62, "sr": 30, "sc": 0.76, "ep": 1.2, "bs": 0.0, "d": 4, "age": 8.51, "grav": 68.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 25212, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "pads_seed", "flbl": "Pads & Seed (Totp)", "urls": [], "ig": 0.511, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t know anything about cryptography, my post was mostly a joke. Classic one time pads are information-theoretically unbreakable of course, but the idea of going to a shop in person to load up on bits seems too silly.\n\nHow’s TOTP work? Generally if there’s a seed involved I’d be worried that some bits could be reused. But, as I said before, I don’t know anything about crypto."}, {"id": 50667758, "au": "taneq", "dom": 51, "sr": 31, "sc": 0.6, "ep": 1.71, "bs": 0.0, "d": 3, "age": 7.38, "grav": 56.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 30019, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_quantum", "flbl": "Math & Quantum (Algorithms)", "urls": [], "ig": 0.726, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If AI sufficiently breaks crypto math such that a classical algorithm can decrypt anything, then it doesn’t really matter (for now, in this context) whether it also boosts quantum algorithms."}, {"id": 50668057, "au": "catlifeonmars", "dom": 65, "sr": 32, "sc": 0.5, "ep": 1.82, "bs": 0.0, "d": 1, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 2088, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.363, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Correction: Opus 5.5 + your specific prompt, with your specific subscription on 2026/11/27 claims no immediate cryptographic consequences.\n\nI fixed it for you."}, {"id": 50666337, "au": "pcstl", "dom": 82, "sr": 33, "sc": 0.25, "ep": 1.49, "bs": 0.0, "d": 1, "age": 9.62, "grav": 82.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.636, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, this result doesn't really add anything new and is in fact vastly worse than the best already-existing algorithm."}, {"id": 50668830, "au": "tnlnbn", "dom": 63, "sr": 34, "sc": 0.2, "ep": 0.64, "bs": 0.0, "d": 5, "age": 5.73, "grav": 39.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 41, "kpp": 13.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "pads_seed", "flbl": "Pads & Seed (Totp)", "urls": [], "ig": 0.271, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Come to think of it, my bank delivers a debit card through the post to me containing a tiny chip, maybe it could work? Presumably the shop would receive a one time pad from the bank too."}, {"id": 50668005, "au": "DangIsATyrant", "dom": 19, "sr": 35, "sc": 0.03, "ep": 3.87, "bs": 2.52, "d": 2, "age": 7.0, "grav": 52.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "key_rsa", "flbl": "Key & Rsa (Exchange)", "urls": [], "ig": 1.646, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "I'm not sure they'd publish anything, you'd just be giving nation state adversaries the key to unlock their treasure trove of hoarded internet traffic, possibly setting off a chain of secret revelation, and causing mayhem generally.\n\nNot everyone with a rtx5090 is going to be able to factor large primes and start breaking encryption, it only benefits nation states really. The same goes for your adversary, they aren't going to tell anyone either.. Hard to judge how it would play out. There woukd probably be a prisoner dilemma of sorts playing out while everything gets rolled over to PQC, and then one day Satoshi's wallet would suddenly drain."}, {"id": 50666215, "au": "wren6991", "dom": 70, "sr": 36, "sc": -0.06, "ep": 1.13, "bs": 1.19, "d": 0, "age": 9.82, "grav": 85.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 9, "k": 1037, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.391, "fa": 0.0, "gp": 0.146, "bl": 0.45, "ds": 0.0, "txt": "> The algorithm uses zero random bits and relies on\nneither the Generalized Riemann Hypothesis nor smoothness heuristics\n\nHow quaint. I remember back when we didn't know Dirichlet GRH was true."}, {"id": 50672063, "au": "btilly", "dom": 43, "sr": 37, "sc": -0.13, "ep": 1.41, "bs": 0.0, "d": 3, "age": 0.54, "grav": 5.3, "surf": 14.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 56180, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_consequences", "flbl": "Algorithm & Consequences (Result)", "urls": [], "ig": 0.593, "fa": 0.0, "gp": 0.015, "bl": 0.0, "ds": 0.0, "txt": "A better algorithm for a quantum computer that we don't have, has fewer immediate consequences than a better algorithm for a classical computer that we do have."}, {"id": 50666407, "au": "monster_truck", "dom": 66, "sr": 38, "sc": -0.23, "ep": 1.25, "bs": 1.19, "d": 0, "age": 9.5, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1516, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.209, "fa": 0.0, "gp": 0.526, "bl": 0.45, "ds": 0.0, "txt": "Hey does anyone know what their LLM told them about this? That's definitely what I was hoping to read"}, {"id": 50667263, "au": "pcstl", "dom": 5, "sr": 39, "sc": -0.44, "ep": 2.13, "bs": 1.7, "d": 4, "age": 8.13, "grav": 64.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
