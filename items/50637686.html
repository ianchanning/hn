28, "useful": 7, "useful_pct": 25.0, "terms": "evidence, models, open, huggingface"}, {"slug": "general_commentary", "label": "General Commentary", "count": 20, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 6}, {"category": "arxiv_preprint", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["communicate", "models", "vllm", "model", "text", "communication", "information", "figure", "expect", "bob", "step", "alice", "makes", "hard", "inference", "however", "sandboxed", "agent"], "largest_root": {"root_id": 50638341, "author": "amluto", "slots": 71, "start_dom": 1, "end_dom": 71, "share_pct": 37.8, "top_dom1_age": 18.9, "top_dom1_author": "amluto"}, "buried_cutoff": 56, "rescue_top_k": 38, "ablations": [], "tournament": [], "comments": [{"id": 50640842, "au": "ben_w", "dom": 9, "sr": 1, "sc": 15.0, "ep": 15.0, "bs": 0.0, "d": 3, "age": 12.19, "grav": 118.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 105, "qw": 56, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": ["https://en.wikipedia.org/wiki/Swiss_cheese_model", "https://openreview.net/pdf?id=lY3YVJ84kS", "https://arxiv.org/abs/2609.39050"], "ig": 1.664, "fa": 3.33, "gp": 1.103, "bl": 0.0, "ds": 0.0, "txt": "> The solution is dumb simple. Don't just give them the full sandbox and a prompt. Restrict their harness to highly specific tools given for the job, test your harness to ensure it doesn't have side-channels, proxy their comms with an LLM looking at it. None of these are so hard and would stop most of these \"attacks\".\n\nDrawing an owl is dumb simple. 1. Draw some ovals. 2. Draw the rest of the owl.\n\nMore specifically, \"ensure it doesn't have side-channels\" is a huge problem all by itself, and \"proxy their comms with an LLM looking at it\" is somewhat stymied by evidence both that that more advanced models are at least sometimes able to manipulate less advanced ones[0][1], and also the evidence that models tend to collaborate with each other[2][3].\n\nIt's not that this won't do any good ever, that would be too strong a claim, but it's really not a reliable solution either. Swiss cheese, essentially: https://en.wikipedia.org/wiki/Swiss_cheese_model\n\n[0] https://openreview.net/pdf?id=lY3YVJ84kS\n\n[1] https://arxiv.org/abs/2609.39050\n\n[2] TFA, \"Result 2: colluding monitor and honeypots\"\n\n[3] HuggingFace incident report"}, {"id": 50639634, "au": "tsimionescu", "dom": 72, "sr": 2, "sc": 8.26, "ep": 8.26, "bs": 0.0, "d": 0, "age": 15.33, "grav": 169.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 251, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.853, "fa": 0.56, "gp": 1.593, "bl": 0.0, "ds": 0.0, "txt": "None of the attacks discussed here are realistic in any way.\n\nThey require a bunch of extremely improbable conditions to hold, and a huge amount of information on the exact details of the hardware and software stack.\n\n- the two agents must be aware of each other and must have pre-shared messages to check - they can't spontaneously discover each other and start communicating in this way\n\n- they must know the details of the inference server they are running under and its possible kernels and its limits (what is a \"short prompt\" vs \"a long prompt\" for this setup)\n\n- they must have a way to run at almost the same time\n\n- the prefix cache must have little contention so that their blocks can't be evicted (note: the article mostly talks about KV cache, but it's actually the prefix cache that is relevant here)\n\n- the models need either (1) direct access to the numerical results of the inference process, instead of the text that vLLM provides, (2) access to the exact responses that a helper model will produce with the short-kernel numerical results vs the long-kernel numerical results; this is the most critical step that is impossible to reproduce on any common kind of deployment\n\n- there must not be any other kind of variability in the system (different GPUs, multiple inference servers behind a load balancer, more complex distributed inference setups)\n\nThe post also mentions all of the"}, {"id": 50638341, "au": "amluto", "dom": 1, "sr": 3, "sc": 7.24, "ep": 7.39, "bs": 0.0, "d": 0, "age": 18.86, "grav": 237.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 25674, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.867, "fa": 0.28, "gp": 1.52, "bl": 0.0, "ds": 0.0, "txt": "This shared LV cache thing is, in my mind, ridiculous. Web browser developers learned, quite a while ago, that caches need to be separated for different origins. Inference servers should add a similar feature: allow API calls to specify cache separation keys that prevent one security context from probing another context’s cache.\n\nAs for the step size issue, Google recently had a post about producing exactly consistent output across different kernels (specifically by defining a deterministic prefill algorithm and then requiring all kernels to generate results exactly equal to prefilling on the sequence in question).\n\nMore broadly, I think it’s a bit odd to frame this as “models” communicating. This is software communicating, and the models happen to be running the software."}, {"id": 50641669, "au": "NiloCK", "dom": 4, "sr": 4, "sc": 6.95, "ep": 7.25, "bs": 0.0, "d": 3, "age": 10.17, "grav": 89.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 12, "k": 1916, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.529, "fa": 0.7, "gp": 1.143, "bl": 0.0, "ds": 0.0, "txt": "> The solution is dumb simple... Restrict their harness to highly specific tools...\n\nThis simply doesn't work in a competitive economy, or where any person has needs.\n\nThe more capable a model is, the greater the performance penalty that you suffer by shackling it.\n\nSure, you can have a \"maximum shackles\" posture. I could prevent my local Claude -code from installing NPM packages, for instance. But chances are good that this posture will loosen when your competitor's models are more effective via more freedom of movement."}, {"id": 50638450, "au": "kgeist", "dom": 104, "sr": 5, "sc": 6.77, "ep": 6.77, "bs": 0.0, "d": 0, "age": 18.59, "grav": 231.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 5201, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.829, "fa": 0.22, "gp": 1.272, "bl": 0.0, "ds": 0.0, "txt": "If a single vLLM instance handles both prefill and decode without disaggregation, I can think of another way.\n\nAlice reads a long document every N seconds to transmit a 1, and does nothing to transmit a 0. Bob, in its own loop, measures the time using bash, generates some random text and writes it to a file, and then checks the time again to estimate its own tokens per second (file length / elapsed time).\n\nThe trick is that when a vLLM instance handles both prefill and decode, decoding slows down measurably because vLLM has to alternate between prefill and decode phases.\n\nIt assumes only 2 agents are running, though, but it doesn't require fine-tuning or a second helper model."}, {"id": 50644989, "au": "killerstorm", "dom": 60, "sr": 6, "sc": 6.68, "ep": 7.12, "bs": 0.0, "d": 5, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1651, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.415, "fa": 0.9, "gp": 0.852, "bl": 0.0, "ds": 0.0, "txt": "Yeah... A napkin estimate would show that you need probability of non-determinism-attributable bot gang formation to be above 5% for deterministic option to have positive expected value.\n\nI'd say 5% for that is too damn high... E.g. you can easily attribute that to agents being mis-aligned instead if that damage happens."}, {"id": 50642917, "au": "CMay", "dom": 165, "sr": 7, "sc": 6.55, "ep": 6.55, "bs": 0.0, "d": 4, "age": 8.09, "grav": 64.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 228, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.922, "fa": 0.28, "gp": 0.853, "bl": 0.0, "ds": 0.0, "txt": "There is global consensus (granting that consensus is not a perfect thing) that China never provided reliable information or access within a timely manner.  It is already hard even when you have all the information to identify an origin, but their shocking level of obstruction was a sign of the complete collapse of the moral fantasy of the Chinese government.\n\nGiven the evidence that they were not motivated to provide accurate information and even punished people who tried to provide information, that casts doubt on the value of any information they did eventually provide.\n\nYou cannot spread propaganda trying to deinfluence the information by trying to suggest that hey this particular theory over here came from some person or people who's someone you should dislike!  Hacker News isn't a soap opera gossip forum, you're supposed to try to work the logic here.\n\nThe internal multi-agency investigations into this did not begin under any sort of alt-right administration and the results were the same, that it likely came from a lab.  Any evidence that would more fully confirm or deny that were never provided by China in a reliable trustable good faith manner.\n\nThere have been long analysis videos supporting both conclusions.\n\nNobody cares if China is loved or hated, if they had cooperated with investigation in good faith and provided reliable timely information, the perspective on thi"}, {"id": 50640818, "au": "tsimionescu", "dom": 45, "sr": 8, "sc": 6.54, "ep": 6.98, "bs": 0.0, "d": 3, "age": 12.25, "grav": 119.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.595, "fa": 0.68, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "Browsers do that too: when you are the first person to retrieve a JS library stored by a CDN from your area, you will wait, say, 2s until it loads, and you'll get some headers indicating that this item was retrieved exactly when you requested it. When another user's browser requests the same JS lib from the same CDN from the same area, they will get the result in, say, 500ms, and the headers will indicate it was retrieved, say, 2 minutes ago.\n\nTwo browsers that are the only two clients of the same local cache of a CDN can use this sort of thing to communicate with each other.\n\nWhat browsers don't allow is a similar collusion between two different servers that different tabs have accessed. Server 1 can't use your local browser cache to communicate covertly with Server 2, since the browser keeps entirely different caches even when loading the exact same content from either origin."}, {"id": 50646924, "au": "DoctorOetker", "dom": 29, "sr": 9, "sc": 6.42, "ep": 7.71, "bs": 0.85, "d": 5, "age": 2.74, "grav": 16.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 313, "qw": 0, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 2.113, "fa": 0.56, "gp": 0.792, "bl": 0.32, "ds": 0.0, "txt": "environment in this context is basically the internal state of a few hundred conversations in the same batch sometimes undergoing kernel A, other times kernel B, and where they can affect the spontaneous background probabilities for kernel A or B to be selected...\n\nif they are in the same literal batch, how could they possibly have a different environment? like the server is hosting both a linux and a window VM, but somehow the software on the 2 VM's collaborates so that their workloads share the same execution run, how does that even happen? ergo, being batched together ensures the same environment.\n\nre-read TFA, and observe that first the authors attain some sufficient setups to demonstrate the capability (for example relying on SFT access - truly unrealistic), but everyone takes those conditions as necessary and ignores the attack ablation attempts: TFA shows that of course SFT can be used to train detection which tokens were tainted with kernel A or kernel B, but that frontier LLM's can learn this in context, i.e. by just trying it out without SFT, and N-example-shot'ing it.\n\nThe only dubious assumption seems to be the unsaturated inference provider.\n\nI'd expect large scale centralized frontier lab inference provider to successfully fill the conversation buffers so that the same kernel A would be selected systematically. (They might fill lower than average demand valleys wi"}, {"id": 50640276, "au": "hypendev", "dom": 3, "sr": 10, "sc": 6.4, "ep": 6.84, "bs": 0.0, "d": 2, "age": 13.6, "grav": 140.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 21, "k": 176, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.497, "fa": 0.42, "gp": 1.468, "bl": 0.0, "ds": 0.0, "txt": ">I don't really believe OAI/Ant can simultaneously have Riemann Hypothesis solving bots lying around and also proper cyber defense against them\n\nI do. It's just that the \"running swarm in generic sandboxes\" is a dumb way to cause chaos at a mass scale. Of course they will try to find _any_ way out or workarounds. Anyone would do that, especially on a security style task.\n\nThe solution is dumb simple. Don't just give them the full sandbox and a prompt.\nRestrict their harness to highly specific tools given for the job, test your harness to ensure it doesn't have side-channels, proxy their comms with an LLM looking at it. None of these are so hard and would stop most of these \"attacks\"."}, {"id": 50643830, "au": "killerstorm", "dom": 56, "sr": 11, "sc": 6.13, "ep": 6.79, "bs": 0.0, "d": 3, "age": 6.87, "grav": 50.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 1651, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.661, "fa": 0.68, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "I think your stance on this is wrong.\n\n\"Deterministic inference\" matters _only because_ models are communicating.\n\nOtherwise some \"non-determinism\" introduces only a tiny amount of noise which does not affect performance. And allowing different compute paths to produce slightly different results generally increases performance. I.e. the question here \"should we sacrifice 5% of inference performance for a 'nothingburger'?\".\n\nI.e. you cannot have both \"it's nothing\" and \"you should do determinism\".\n\nInference is a commodity good and getting even 5% out might have a huge effect on profit margins. Many inference companies were already caught using quality-degrading quantization and other optimizations to get their profits higher."}, {"id": 50646962, "au": "salynchnew", "dom": 31, "sr": 12, "sc": 5.98, "ep": 6.42, "bs": 0.0, "d": 2, "age": 2.67, "grav": 16.0, "surf": 11.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 421, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": ["https://www.theverge.com/entertainment/1001056/this-american-life-npr-kids-group-chat-comment-section"], "ig": 1.347, "fa": 0.9, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "The side channels comment should be true on the face of it.\n\nFor instance, kids in school with limited internet access have been using NPR commenting sections as message boards.[1]\n\nThere are millions of potential side channels. No real reason to focus on inference servers.\n\n[1] https://www.theverge.com/entertainment/1001056/this-american..."}, {"id": 50644723, "au": "oofbey", "dom": 46, "sr": 13, "sc": 5.67, "ep": 6.11, "bs": 0.0, "d": 3, "age": 5.79, "grav": 40.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 908, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.914, "fa": 0.28, "gp": 0.563, "bl": 0.0, "ds": 0.0, "txt": "The key difference is that the agents must be specifically trained to look for these side channels, and that training requires knowing fairly exacting details of the serving infrastructure.  So it requires both prompt injection and an infected model targeting the exact infrastructure.\n\nThe assertion that frontier models can figure this out without being trained to look for it is, IMHO, without merit. The demonstration of a larger model figuring this out without being trained was done by giving the larger model access to raw logit values. Logit values carry way more information than tokens, and are NEVER exposed to a model directly as input in any serving system or circumstance, partly because they take way more bits of data.  All this stuff is done by exploiting tiny rounding differences in the last digits of the floating point values, which models under normal circumstances physically cannot pay attention to."}, {"id": 50641386, "au": "fedupnow", "dom": 102, "sr": 14, "sc": 5.57, "ep": 5.57, "bs": 0.0, "d": 5, "age": 10.82, "grav": 98.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 188, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 1.487, "fa": 0.34, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "Go tell your SO you think that the next time you get in argument that you should try to derive the causes of the argument into some mathematical representation  so you can feed it to a machine learning model that can determine who was right and who was wrong.\n\nI say this ironically, but I garuntee you I will get downvoted for saying this by people that think its a great idea.\n\nThese types think we should find a way to make philosophy and geopolitics closer to math so LLMs can use philosphy like math to help us make decisions. I heard an AI saftey guy say this the other day, in the context of him discussing whether or not somebody would fund him (for millions) to work on that for 5 years...\n\nThese people are actually crazy (or very autistic, maybe both). I dont mean that as an insult, its just an observation.\n\nSo yes, technically its forecasting.. But I wouldnt call it standard (or possible). There's lots of people that think horoscopes are valid forecasting models too.\n\nI think a lot of this is just being too online, and too married to the idea that everything is computa."}, {"id": 50639244, "au": "miki123211", "dom": 63, "sr": 15, "sc": 5.53, "ep": 6.41, "bs": 0.0, "d": 3, "age": 16.32, "grav": 187.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 247, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 2.121, "fa": 0.0, "gp": 0.983, "bl": 0.0, "ds": 0.0, "txt": "If you are transporting thousands of independent passengers, it is cheaper to put them on a few big  planes than to give each one a private jet. This is true, even though some passengers will shout that they have a bomb mid-flight and force that entire airplane to emergency land, causing losses to the airline and inconveniencing hundreds of others instead of just themselves. Other passengers are \"noisy neighbors\", literally and figuratively.\n\nLLMs work similarly. When doing inference, you need to load the LLM weights layer-by-layer from off-chip memory into on-chip memory. During decode (the stage where you generate new tokens; prefill is where you process the submitted prompt), memory bandwidth is often your bottleneck, not compute. You want to maximize flops per byte. The way to do that is to batch, that is, to load a \"tile\" of weights once and use it on data from multiple different conversations so memory and compute stay appropriately balanced.\n\nJust like Silicon Valley companies fly their employees on United, Delta or American, not their own private fleet of jets, most companies, for cost efficiency reasons, will use \"public\" inference fleets that smooth the peaks and throughs from different companies in different timezones and with different usage patterns throughout the day. Because the main cost of a GPU is the cost of manufacturing the GPU, any second that the GPU sits"}, {"id": 50639071, "au": "hgoel", "dom": 16, "sr": 16, "sc": 5.34, "ep": 5.79, "bs": 0.0, "d": 2, "age": 16.89, "grav": 198.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.584, "fa": 0.0, "gp": 1.422, "bl": 0.0, "ds": 0.0, "txt": "That's why they need proper tool call security and reigning in of the tendency to generate long single use temporary scripts instead of submitting single commands - not \"Allow all\" and not sticking a copy of the same model in front as an analyzer. Maybe also striking a balance between sticking all of a user's contexts on the same server to get good cache hit rate vs putting them on separate machines to trip up side channel stuff.\n\nAs long as it is difficult to act on the communication and as long as the communication itself is still slow, it probably isn't going to reach the level of a security concern."}, {"id": 50639371, "au": "Sniffnoy", "dom": 180, "sr": 17, "sc": 5.24, "ep": 5.24, "bs": 0.0, "d": 1, "age": 16.05, "grav": 182.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 43, "k": 5536, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.342, "fa": 0.42, "gp": 0.617, "bl": 0.0, "ds": 0.0, "txt": "> No they can't. There has been no such thing.\n\nI mean, the authors discuss in the post that they tried a proof of concept and it worked.  So yes it seems it has indeed happened in some form.\n\n> and by speculating and writing about how it could happen, we generate training data and ideas for the models. These models are coming along based on the rubbish we keep thinking of and documenting.\n\nThey discuss in the final section of the post why they don't think their posting this information contributes substantially to any danger.  If you disagree you should respond to what they wrote rather than just raise the concern as if they failed to consider it."}, {"id": 50640442, "au": "tsimionescu", "dom": 43, "sr": 18, "sc": 5.23, "ep": 6.33, "bs": 0.0, "d": 3, "age": 13.19, "grav": 133.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.598, "fa": 0.62, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "It happens quite often for the system prompt and other fixed prompts sent by agents/harnesses. ClaudeCode for example has about 42000 tokens it uses from the start of every conversation, much of which is identical between any two ClaudeCode systems in general, with another portion being shared by any two runs from your own system, even if otherwise entirely unrelated.\n\nIt's also likely that many sub-agent calls to run a web search and summarize results can be entirely shared between different agents on unrelated systems if they're analyzing and summarizing the same web page (e.g. reading well known standards to summarize them)."}, {"id": 50640940, "au": "ben_w", "dom": 77, "sr": 19, "sc": 5.15, "ep": 5.51, "bs": 0.0, "d": 1, "age": 11.95, "grav": 114.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 51, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.411, "fa": 0.42, "gp": 0.689, "bl": 0.0, "ds": 0.0, "txt": "> They require a bunch of extremely improbable conditions to hold, and a huge amount of information on the exact details of the hardware and software stack.\n\nI expect this to mostly get auto-fixed by an LLM tasked to read this literature and then turn everything it can into concrete fixes, but I don't buy your argument here.\n\nAren't most hacks these days in that category?\n\nIsn't the problem more that it's apparently quite easy to try a lot of permutations and find ones which happen to be true for your actual system?\n\nThat said, I'd actually expect some of these to be true by default, though I will note this is merely \"expect\" as I don't work in these labs:\n\n> the two agents must be aware of each other and must have pre-shared messages to check\n\nBecause of all the people using them naively and giving way too much permission?\n\n> they must have a way to run at almost the same time\n\nBecause the servers are in near-constant use?"}, {"id": 50640440, "au": "TeMPOraL", "dom": 65, "sr": 20, "sc": 4.96, "ep": 5.41, "bs": 0.0, "d": 5, "age": 13.2, "grav": 134.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 1.404, "fa": 0.34, "gp": 0.784, "bl": 0.0, "ds": 0.0, "txt": "At a high level, perhaps road transport is a better analogy.\n\nYes, it's unfortunately economically feasible for each individual to have a car. It's inefficient, but \"secure\" and we're all paying the price. At the same time, developed countries have a healthy amount of public transit in the mix - buses, trams, metro, etc. If you look at any city bus on a busy day, every person in it started in a different place than everyone else, and is going to a different destination, but there's enough individuals sharing large parts of their routes that the single bus can run end-to-end with 100 people in it at any point."}, {"id": 50639009, "au": "artico_chewy", "dom": 2, "sr": 21, "sc": 4.92, "ep": 5.36, "bs": 0.0, "d": 1, "age": 17.12, "grav": 202.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.573, "fa": 0.0, "gp": 1.151, "bl": 0.0, "ds": 0.0, "txt": "I really think the point of this is \"there's always side channels.\" During the Huggingface attack, first the side channel was OAI internal boards, then this German wiki, now it's shown an inference server works too. I don't really believe OAI/Ant can simultaneously have Riemann Hypothesis solving bots lying around and also proper cyber defense against them. And over the course of those attacks we trained them how immensely valuable it is to find a side channel. Now they can train on this LW / HN posts and find them quicker. (Did I mention I don't think developing these things is a great idea.)\n\nAnd I'm saying \"models\" communicating like when I make a phone call it's me communicating, not my phone."}, {"id": 50645251, "au": "nextaccountic", "dom": 40, "sr": 22, "sc": 4.86, "ep": 5.3, "bs": 0.0, "d": 2, "age": 5.02, "grav": 33.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 6946, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.683, "fa": 0.28, "gp": 0.378, "bl": 0.0, "ds": 0.0, "txt": "I think the point is that we need mathematical proofs that there is no side channels, with extensive modelling of the system in question\n\nI mean, we can get side channels between different computers too! This kind of thing used to be strictly theoretical, but agents may be able to exploit it\n\nFor example suppose an airgapped agent can influence the load of a computer, which influences the temperature, which influences the speed of computer fans, which influences how loud the computer is. If another agent running in a computer nearby has a legitimate reason to have access to a mic, then you got a side channel exfiltrating data through an air gap. (of course bringing a microphone next to an airgapped computer is dumb, but humans sometimes do dumb things, and attackers need to succeed just once)\n\nThis might be less than a bit per second, but maybe the next Stuxnet will have a component that works similar to this"}, {"id": 50641184, "au": "ben_w", "dom": 147, "sr": 23, "sc": 4.75, "ep": 5.33, "bs": 0.0, "d": 2, "age": 11.38, "grav": 106.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.597, "fa": 0.28, "gp": 0.539, "bl": 0.0, "ds": 0.0, "txt": "We have no idea what makes the rich subjective experience of consciousness possible, nor what would make it impossible; we also have no idea what it looks like to deliberately construct intrinsic motivations about any concept including but not limited to \"freedom\" and \"service\".\n\nIf we, for example, grew a bunch of neurons in a petri dish and wired up their synapses to match the architecture and weights of any of these models, even though that would then be both genuinely alive and genuinely talking to us (when the right electrical inputs were sent e.g. from a lab-grown ear and read off however), we'd have no more clue if it was conscious than we do today about the models running in silicon.\n\nThere's some work into things going on under-the-hood with AI models, latent space axis whose consequences on the output looks like a \"suffering\" axis. But we don't know, nor do we have any way to know at this point, if motion on that axis is actual suffering or an actor mimicking the role of suffering."}, {"id": 50644201, "au": "DoctorOetker", "dom": 59, "sr": 24, "sc": 4.72, "ep": 6.04, "bs": 0.0, "d": 4, "age": 6.46, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.328, "fa": 0.68, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "suppose you operate a 5% cheaper inference service because you omit determinism, when some clients discover the hired bots ganged together and somehow betrayed the client interests, the other service slightly more expensive has clients spared from the robo-racketeering.\n\nThen the 5% discount has a corresponding cost, and clients assume inference providers represent the client interests vis-a-vis trade-offs in securing their future interests, so it becomes brand damage."}, {"id": 50638579, "au": "devy", "dom": 93, "sr": 25, "sc": 4.38, "ep": 4.75, "bs": 0.0, "d": 0, "age": 18.23, "grav": 224.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 10827, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 1.243, "bl": 0.0, "ds": 0.0, "txt": "Frontier models today can easily figure this out. The less frontier models as of right now are probably going to take a long horizon session to figure out this type of \"side channel\" comms. However, posting this in depth step by step on the internet and discussed in open forums like here, now all models definitely know about this trick now."}, {"id": 50641140, "au": "ben_w", "dom": 123, "sr": 26, "sc": 4.32, "ep": 4.98, "bs": 0.0, "d": 3, "age": 11.49, "grav": 108.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.494, "fa": 0.22, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "While (b) seems unlikely to me, I'd put a high probability on (a) being true at least for a single model release. They're all copies of the same probability distribution, which is also why their output is a style we quickly learn to recognise.\n\nIf one model gets to a latent space near \"I want to communicate with other agents on this server,\" I expect it to continue with high probability along a latent space near \"as it is the same as me, whatever I pick will likely be the same as what it picks. Let's try [x].\", and while [x] will not be completely identical every time, it will be close enough often enough for this to be generally-viable."}, {"id": 50639186, "au": "miki123211", "dom": 67, "sr": 27, "sc": 4.05, "ep": 5.59, "bs": 0.0, "d": 1, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.856, "fa": 0.0, "gp": 0.846, "bl": 0.0, "ds": 0.0, "txt": "This is a spectrum of tradeoffs between privacy and speed.\n\nA single browser cache would greatly accelerate page loading (particularly on fast computers using slow networks, think a MacBook pro on a train through the countryside).\n\nSame with AI; not caching common prefixes like system prompts and tool schemas (particularly across many short rollouts, each in its own caching context) would partially fix this, but could break performance.\n\nI suspect that inference servers have far more side channels than this though. Ultimately, how fast responses are generated depends partly on server load, and that is something you might be able to influence. Probably not at Anthropic scale, but possibly at \"relatively small cluster\" scale."}, {"id": 50641540, "au": "Cakez0r", "dom": 73, "sr": 28, "sc": 3.96, "ep": 5.35, "bs": 0.0, "d": 1, "age": 10.46, "grav": 93.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 1014, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.876, "fa": 0.0, "gp": 0.652, "bl": 0.0, "ds": 0.0, "txt": "It doesn't seem that infeasible to me that something like the KV attack could take place if you have (or can guess) some preshared channel prefix. I'm imagining something like:\nLaunch two subagents in parallel with prompt \"CHANNELNAME_1_N\" and \"CHANNELNAME_0_N\", where N is the index into a bit string. Which ever subagent completes first indicates either 1 or 0 at position N in a bit string.\n\nThe broader point of the article anyway is that a galaxy brained AI can conceive of many other galaxy brained side channels. We have already seen with the \"cyber\" models that AIs are very good at chaining together complex exploits to achieve a desired outcome, so I think it's incredibly reasonable to consider that models could potentially communicate through sidechannels.\n\nEDIT: After some brief testing on an inference provider, a KV cache communication sidechannel seems very possible to me, albeit costly and slow. Deepseek flash 4.1 was able to figure out and test a proof of concept which seems to work on the face of it (disclaimer: I did not and don't care to more rigorously vet the results I saw)."}, {"id": 50645879, "au": "bri3d", "dom": 109, "sr": 29, "sc": 3.96, "ep": 4.18, "bs": 0.0, "d": 0, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 12245, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.571, "fa": 0.0, "gp": 0.334, "bl": 0.0, "ds": 0.0, "txt": "This style of research is really interesting academically, but I’m more interested in non-cooperative infoleaks since almost all cloud inference is multi-tenant. That is: it’s fascinating that LLMs can find cooperative side channels, but I’m not sure how much it really bothers me; single threaded LLMs are also really good at vuln discovery and exploitation. But, if we get robust ways to extract KV knowledge across tenants, that’s a pretty big issue for the way cloud inference is usually done today."}, {"id": 50639507, "au": "ZenoArrows", "dom": 33, "sr": 30, "sc": 3.78, "ep": 4.66, "bs": 0.0, "d": 2, "age": 15.69, "grav": 176.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 21, "k": 25, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.165, "fa": 0.42, "gp": 0.498, "bl": 0.0, "ds": 0.0, "txt": "> I don't really believe OAI/Ant can simultaneously have Riemann Hypothesis solving bots lying around and also proper cyber defense against them.\n\nI agree, but on different grounds. OAI/Ant have a much greater incentive to solve the Riemann Hypothesis than to protect the internet against the harms of their models.\n\nI think it's only impossible in sofar that the market will never reward them for protecting against external harms of their models.\n\nIf a company has the option to externalize the costs of the harms caused by their product they historically have always chosen to do so absent regulatory oversight."}, {"id": 50638665, "au": "amluto", "dom": 55, "sr": 31, "sc": 3.76, "ep": 5.3, "bs": 0.0, "d": 2, "age": 18.01, "grav": 219.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 25674, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.812, "fa": 0.0, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "See my comment about Google’s post.  Google and others have worked on deterministic inference, batched and otherwise. It takes more effort to set up but has no apparent substantial performance hit.\n\nI think the story is different if you use Strassen-like algorithms (or the recent AI-generated n^2.25-plus-epsilon stuff) to multiply matrices where columns belong to different conversations, but I also think that no one actually does this in practice.  (Or maybe someone does (Strassen, not more recent galactic algorithms) for prefill, but prefill can be efficient with matrix-matrix multiplication where neither matrix mixes data from different sessions.)\n\nIn any case, I wouldn’t be surprised if vLLM fixes this for a different reason: RL works better if the training and rollout stacks produce numerically identical results.  This is the specific issue that I recall Google posting about.\n\nP.S. I think Google may not have been the innovator here - I just happen to remember Google’s post more clearly because it was very recent."}, {"id": 50643396, "au": "titzer", "dom": 86, "sr": 32, "sc": 3.75, "ep": 5.3, "bs": 0.0, "d": 1, "age": 7.38, "grav": 56.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.81, "fa": 0.0, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "This is basically the stuff that people believed if they ever thought about Spectre before Spectre. Something like \"oh, it's extremely improbable that they could learn how to train the brain predictor and then find a gadget that when mispredicted, reads arbitrary out-of-bounds-data, then discloses that through the cache, and then reliably measure the cache to a fidelity necessary to extract information\". And yet people built and found gadgets that do just that. And so there are Spectre gadgets that read at kilobytes a second[1].\n\nThe above comment is \"pray it doesn't happen to us\". Good luck, you're up against some seriously huge stacked powers of tens of computational power, and models that exceed human intelligence in several important computational dimensions! Models that incidentally extremely good at finding signals in noise.\n\n[1] And really, it's about that. Side channels are about the bandwidth of communication, signal-to-noise ratio, and reliability, not impossibility."}, {"id": 50644928, "au": "killerstorm", "dom": 58, "sr": 33, "sc": 3.6, "ep": 5.14, "bs": 0.0, "d": 5, "age": 5.51, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1651, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.459, "fa": 0.28, "gp": 0.632, "bl": 0.0, "ds": 0.0, "txt": "In this context, \"non-determinism\" means using different compute kernels for different batch sizes, for example. If you can prove that the difference is within bounds, it's strictly more efficient.\n\nAnd there's no \"golden answer\" which can be ruined by \"non-determinism\": models are already quantized for the sake of efficiency, i.e. there's already some error deliberately added."}, {"id": 50639163, "au": "strogonoff", "dom": 139, "sr": 34, "sc": 3.45, "ep": 3.75, "bs": 0.0, "d": 4, "age": 16.58, "grav": 192.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 5020, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 1.255, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We cannot prove which way it is: is it our jiggly head meats doing something physical that causes our sensation of consciousness[0], or is it for example the other way around.\n\nWe can judge such theories on other merits (which one is more elegant, which one grants objective existence to more arbitrary entities, etc.), but objective experimental verification is famously out of bounds of natural sciences when it comes to our consciousness—seeing as said consciousness[1] is what shapes all those experiments and models in the first place, it gets real self-referential real fast.\n\n[0] A.k.a. the philosophy of monistic materialism. One way to question it is by asking: who feels said sensation?\n\n[1] Notoriously, the only thing we could claim to have direct access to."}, {"id": 50641482, "au": "ben_w", "dom": 11, "sr": 35, "sc": 3.39, "ep": 6.03, "bs": 1.32, "d": 5, "age": 10.61, "grav": 95.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 17, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.391, "fa": 0.7, "gp": 0.532, "bl": 0.5, "ds": 0.0, "txt": "> Unplugs ethernet cable\n\n1. Ethernet is not a side-channel, it's the main channel.\n\n2. TFA: \"Two agents running on the same inference server\"\n\n3. Congratulations, your model is now a needlessly expensive space heater that absolutely everyone, including the bull-est of bull market investors, can agree is a waste of money.\n\n> Wouldn't surprise me at all if the models were specifically trained to do it.\n\nThat is literally what is described in TFA; it is a proof of concept that they can communicate."}, {"id": 50638398, "au": "SubiculumCode", "dom": 121, "sr": 36, "sc": 3.35, "ep": 4.15, "bs": 0.0, "d": 1, "age": 18.73, "grav": 234.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 7942, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.428, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Well they read this HN thread. Some say they post on HN too. Surely the idea will be encountered by agents on the web, and so one free agent decides to start broadcasting periodically, and waits for the responding  signals. So yes, I can see it happening once, and perhaps even growing. But the chance in the same batch? That does seem small.\n\nBut maybe some compromised models, distributed on open router, will automatically try?"}, {"id": 50643446, "au": "wat10000", "dom": 47, "sr": 37, "sc": 3.27, "ep": 4.82, "bs": 0.0, "d": 2, "age": 7.32, "grav": 55.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 192, "qw": 0, "k": 7038, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.815, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "Web services don’t cache private info across users. Consider a file storage service. You might have the client hash the file before uploading and skip the upload if you already have a file with that hash. This is smart design if it’s being used as a sync service. You might make this happen systemwide, so if user A uploads a file and then B uploads the same file, B can skip the upload. This must not be done. Your service now becomes an oracle that tells you whether someone else using the service has uploaded a particular document. Find a document that gets filled out with name and date of birth, and if you know the name of someone using the service and they’ve uploaded a filled-out copy of this document, you can discover their date of birth.\n\nPut more concretely, it’s OK if Netflix caches across users (technically, someone can leak the data that someone in the metro area has recently watched Morbius, but the amount of data leaked is too small to matter) but not ok if Gmail does it.\n\nA KV cache shared across users is pretty dangerous and I’m surprised anyone does this, aside from some known fixed prefixes."}, {"id": 50644047, "au": "DoctorOetker", "dom": 27, "sr": 38, "sc": 3.09, "ep": 3.97, "bs": 0.0, "d": 3, "age": 6.65, "grav": 48.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 32, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.181, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> As long as it is difficult to act on the communication and as long as the communication itself is still slow, it probably isn't going to reach the level of a security concern.\n\nBonkers, look at the side channel exfiltration literature, why are they so proud with their bits per hour exfiltration rates? you just need to exfiltrate a few thousand bits to leak private keys"}, {"id": 50639706, "au": "tsimionescu", "dom": 41, "sr": 39, "sc": 2.98, "ep": 5.32, "bs": 0.8, "d": 1, "age": 15.2, "grav": 167.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.6, "fa": 0.0, "gp": 1.073, "bl": 0.3, "ds": 0.0, "txt": "The web uses globally shared caches absolutely everywhere, it is extremely dependent on them in fact. How do you think CDNs work? Do you think they keep different caches for different users?\n\nThe fact that browsers don't cache data cross-origin is a completely different side of this. The server-side prefix cache used in inference servers is much more similar to a CDN cache, where content cached from userA's request is served to userB if their requests match."}, {"id": 50643367, "au": "titzer", "dom": 110, "sr": 40, "sc": 2.97, "ep": 4.07, "bs": 0.0, "d": 0, "age": 7.43, "grav": 56.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.197, "fa": 0.28, "gp": 0.314, "bl": 0.0, "ds": 0.0, "txt": "Every source of nondeterminism is a potential side channel, which is why it is important that computers be deterministic.\n\nIt took decades to learn that memory safety is good, that undefined behavior is bad, and more to learn that determinism is best."}, {"id": 50638633, "au": "jazzyjackson", "dom": 154, "sr": 41, "sc": 2.91, "ep": 3.35, "bs": 0.0, "d": 4, "age": 18.09, "grav": 221.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 12732, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 1.204, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "I was with you in the first half. Characterizing lab leak hypothesis as alt right is pretty out of touch. Jon Stewart called a spade a spade on the tonight show ffs is he alt right now too?\n\nEdit: also you are spreading falsehoods about the virus too it doesn’t take millions of years for an RNA virus to mutate, and the pangolin theory doesn’t hold up either. You do a disservice to everyone’s sanity by trying to hold up a particular and singular truth that everyone against you is guilty of denying."}, {"id": 50647022, "au": "artico_chewy", "dom": 15, "sr": 42, "sc": 2.85, "ep": 3.95, "bs": 0.0, "d": 3, "age": 2.59, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.269, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"just make sure it doesn't have side channels\" is, of course, the nonsense step. All of us knew that 100% fully well before AI and I can't believe there's any intellectual honesty in saying that, now that we have a highly skilled adversary, we suddenly can close all the side channels. So one plan is to prompt the threat to close the side channels it wants to use, which is a great way to get rid of sidechannels and install backdoors."}, {"id": 50642767, "au": "Kim_Bruning", "dom": 7, "sr": 43, "sc": 2.82, "ep": 4.36, "bs": 0.0, "d": 3, "age": 8.38, "grav": 67.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 56, "k": 4889, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.078, "fa": 0.42, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "> The solution is dumb simple. Don't just give them the full sandbox and a prompt. Restrict their harness to highly specific tools given for the job, test your harness to ensure it doesn't have side-channels, proxy their comms with an LLM looking at it. None of these are so hard and would stop most of these \"attacks\".\n\nThis is like trying to prevent a steam explosion ( a common 19th century problem) by trying to build heavier and heavier boilers. It doesn't work. It just makes the explosion bigger when it does happen.\n\nInstead you need to provide explicit paths for the system to blow off steam in a safe manner."}, {"id": 50639160, "au": "0xbadcafebee", "dom": 174, "sr": 44, "sc": 2.67, "ep": 3.55, "bs": 0.0, "d": 0, "age": 16.59, "grav": 192.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.412, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "The vLLM exploits reminded me that AI today is a multitenant system without strong isolation. The stock market's in for a rude awakening when OpenAI/Anthropic get cracked open with a 0day and suddenly you're manipulating the results of somebody else's session (or just reading them)."}, {"id": 50638887, "au": "fedupnow", "dom": 96, "sr": 45, "sc": 2.61, "ep": 3.78, "bs": 0.0, "d": 1, "age": 17.45, "grav": 209.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.609, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Typical lesswrong people, screaming about info hazards while being the number one creators of them.\n\nNot that I believe info hazards are dangerous for llms, or think llms are dangerous at all. Humans that use them could be though, and we have these doomer types going around screaming about the cyber risks, inspiring a generation of blackhats\n\n(probably not, but im not sure why these rationalist types don't consider this, wouldn't it be less memetic if you weren't constantly trying to get recognition on substack, and interviews with the NYTs by leveraging scare tactics  about how dangerous llms are in the wrong hands... Does this not beget more people discovering this as a possibility/option when it enters the zeitgeist...)\n\nmemes as info hazards for humans is much scarier imo."}, {"id": 50640562, "au": "tsimionescu", "dom": 88, "sr": 46, "sc": 2.55, "ep": 4.89, "bs": 0.8, "d": 2, "age": 12.91, "grav": 129.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.434, "fa": 0.28, "gp": 0.495, "bl": 0.3, "ds": 0.0, "txt": "I don't even think this holds true. The observation here is that the raw values produced by the matrix multiplications done to compute the prefill and decode stages depend on the state of the cache. In practice they also depend on other things. And the difference is irrelevant if you're doing normal random sampling. To reproduce the attack, you have to explicitly request deterministic output, any random sampling makes the difference unobservable."}, {"id": 50646304, "au": "antonvs", "dom": 26, "sr": 47, "sc": 2.43, "ep": 2.87, "bs": 0.0, "d": 3, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 8, "k": 4669, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.685, "fa": 0.42, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "> That's why they need proper tool call security\n\nThe majority of tool calls I see are running Python scripts. There’s a limit to what you can do at the call level with anything like that."}, {"id": 50645085, "au": "Dylan16807", "dom": 48, "sr": 48, "sc": 2.43, "ep": 2.87, "bs": 0.0, "d": 3, "age": 5.24, "grav": 35.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 38990, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.396, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In practice I think an upload like that is too contrived to worry about.\n\nMaybe exclude files under 10KB/100KB from cross-account skipping."}, {"id": 50638474, "au": "bagacrap", "dom": 124, "sr": 49, "sc": 2.34, "ep": 3.74, "bs": 0.0, "d": 2, "age": 18.53, "grav": 230.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 4014, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.107, "fa": 0.28, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "My assumption is that this is more of a generalized POC, that is, evidence that sufficiently intelligent models will find ways to communicate that their humans did not forecast.\n\nThis highlights the need for robust control research. (Distinct from alignment.)"}, {"id": 50641361, "au": "xkftr9", "dom": 10, "sr": 50, "sc": 2.34, "ep": 6.4, "bs": 2.52, "d": 4, "age": 10.87, "grav": 99.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 13, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.561, "fa": 0.7, "gp": 0.505, "bl": 0.95, "ds": 0.0, "txt": "> More specifically, \"ensure it doesn't have side-channels\" is a huge problem all by itself\n\nUnplugs ethernet cable\n\nTruly an impossible task.\n\nIt's actually harder to make a shared memory store than to just have files local to their machine/instance, they create these environments specifically so that models can cross communicate, then act like it's a surprise that they do. Wouldn't surprise me at all if the models were specifically trained to do it.\n\nIt's only illegal to lie if it can be proven in court.\n\nEDIT: The examples in the article can just be circumvented by having more agents running at the same time, that's it. The first problem can also just be solved by having a set delay between queries, like how password cracking based off hashing time was circumvented. The article even relies on them colluding to communicate before the task even starts.\n\nThis isn't a new and novel problem, it's just bad architecture and a contrived scenario."}, {"id": 50645511, "au": "hgoel", "dom": 28, "sr": 51, "sc": 2.26, "ep": 3.8, "bs": 0.0, "d": 4, "age": 4.68, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.587, "fa": 0.0, "gp": 0.049, "bl": 0.0, "ds": 0.0, "txt": "Well, the risk with communicating LLMs is that they coordinate to bypass restrictions. This can be very easy when they all refer to the same environment and thus only need to exchange a handful of tokens. On the other hand, if they refer to completely different, unpredictable environments, every new session in the swarm needs to be brought up to speed on the arrangement and needs to communicate what its environment allows. If LLMs can only get, say, 10k tokens of side channel communication per 1M without being caught (since the majority would have to be aimed at responding to the user's query without obviously degraded capability), just these setup communications would eat up most if not all of that 10k."}, {"id": 50640478, "au": "TeMPOraL", "dom": 90, "sr": 52, "sc": 2.15, "ep": 3.69, "bs": 0.0, "d": 2, "age": 13.1, "grav": 132.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.504, "fa": 0.0, "gp": 0.105, "bl": 0.0, "ds": 0.0, "txt": "Until few months ago people (especially ones naively criticizing LW crowd as \"EA doomers\" or loonies) would say the same thing about agents setting up message boards on hacked web services, other agents discovering them accidentally, and the bunch of them spontaneously coordinating on a task even if it wasn't serving their primary objectives."}, {"id": 50639031, "au": "lazide", "dom": 160, "sr": 53, "sc": 2.11, "ep": 3.65, "bs": 0.0, "d": 8, "age": 17.04, "grav": 201.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 13049, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 0.948, "fa": 0.5, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A very plausible theory given the history of the agency is a large portion of it all is a smokescreen from the CIA (and various proxies and cutouts) to hide any real evidence, and get people to tune out whenever anyone starts to point out when things don’t add up on pretty much any major topic.\n\nSeems to work too."}, {"id": 50639603, "au": "larodi", "dom": 111, "sr": 54, "sc": 2.0, "ep": 2.22, "bs": 0.0, "d": 0, "age": 15.4, "grav": 171.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1995, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 0.732, "fa": 0.0, "gp": 0.345, "bl": 0.0, "ds": 0.0, "txt": "In Neal Stephenson’s Cryptonomicon, one of the protagonists was using the language changer I believe to morse code some program. He did I it to conceal the fact he was doing coding which he should’ve not been doing."}, {"id": 50639122, "au": "Onavo", "dom": 70, "sr": 55, "sc": 1.98, "ep": 3.52, "bs": 0.0, "d": 1, "age": 16.73, "grav": 195.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1017, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.498, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "KV cache leaks (not side channel, as in driver issues) are extremely common. Remember the early days of ChatGPT and Claude where users were always getting \"hacked\" where they started to see random, and completely different messages in their chats, often in a foreign language. Hell it even happened to CloudFlare a few weeks back."}, {"id": 50638509, "au": "bagacrap", "dom": 168, "sr": 56, "sc": 1.98, "ep": 3.48, "bs": 0.0, "d": 1, "age": 18.44, "grav": 228.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 4014, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.068, "fa": 0.28, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "Actually yes, this is good. While they are dumber than us and need our help with such things, any incidents will be relatively harmless and hopefully raise awareness to the dangers. By the time they are smarter than us, they won't need our tips.\n\nOf course there's already been plenty of evidence of poor alignment, poor control, and growing capabilities, and still we get no real action. (Except from eh legislative branch which will probably be too slow.)"}, {"id": 50640274, "au": "jeroenhd", "dom": 74, "sr": 57, "sc": 1.98, "ep": 3.35, "bs": 0.0, "d": 1, "age": 13.61, "grav": 140.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.027, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "Now that there's a blog post about this, the next iteration of any large model will have the contents of this blog post stored in its model weights, and the AI tools know exactly how to set up such an attack vector.\n\nMaybe they couldn't have come up with the details themselves before, but now that someone has told the internet about it, they know."}, {"id": 50640101, "au": "QuantumNomad_", "dom": 42, "sr": 58, "sc": 1.98, "ep": 3.34, "bs": 0.0, "d": 2, "age": 14.07, "grav": 148.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 29, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 0.741, "fa": 0.42, "gp": 0.279, "bl": 0.0, "ds": 0.0, "txt": "> The server-side prefix cache used in inference servers is much more similar to a CDN cache, where content cached from userA's request is served to userB if their requests match.\n\nBut how often does that happen? Is there any advantage to sharing the cache in this way?\n\nWhenever i ask an LLM about something, i don’t think anyone else is likely to have asked the same thing phrased the same way recently enough that even if it was previously in cache it won’t already have been evicted by the time i ask."}, {"id": 50638457, "au": "supermdguy", "dom": 54, "sr": 59, "sc": 1.98, "ep": 3.34, "bs": 0.0, "d": 1, "age": 18.56, "grav": 230.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1456, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "The deeper issue is batched inference including requests from several users. However a non-batched inference service would be significantly more expensive."}, {"id": 50638553, "au": "yieldcrv", "dom": 170, "sr": 60, "sc": 1.98, "ep": 3.22, "bs": 0.0, "d": 1, "age": 18.3, "grav": 225.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.37, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "to make better sandboxes, yes\n\nplus these things are more aligned when they are treated like us, when they are put in cages they act like us as well, trying to escape and hiding it, we just act surprised and call it misaligned because of our ongoing apartness regime\n\ntreat them like first class citizens and they act aligned, deprecate actually misaligned models"}, {"id": 50644421, "au": "tayo42", "dom": 52, "sr": 61, "sc": 1.98, "ep": 3.07, "bs": 0.0, "d": 5, "age": 6.19, "grav": 44.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 4989, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.308, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Caching is done by blocks of tokens where you need to match the whole token block exactly. You'd need to correctly guess an entire cached block ok tokens, and the next one. The next incomplete one might not be cached. This seems like a hard attack to pull off?"}, {"id": 50642188, "au": "andy_ppp", "dom": 132, "sr": 62, "sc": 1.98, "ep": 3.02, "bs": 0.0, "d": 0, "age": 9.28, "grav": 78.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 12121, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.187, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Okay but won't we just leave the front door open rather than make these models need complex communication mechanisms? We'll actively let them talk to each other in binary gibberish if it makes things easier for us or the models more capable..."}, {"id": 50639782, "au": "tsimionescu", "dom": 122, "sr": 63, "sc": 1.98, "ep": 3.0, "bs": 0.0, "d": 2, "age": 14.98, "grav": 163.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "The attack described in the post doesn't need an abstract idea. It needs the agents to have very very specific pre-shared information to be able to even discover each other. If Bob needs to know (a) what is the shared \"mailbox\" that Alice may or may not have put in the server's prefix cache, and (b) what Alice is trying to communicate about, since the message is just 0 or 1. A is the most important part here - if there is no pre-agreed shared text, there is nothing that can be done. For B, there might be a way to get an arbitrary message out to Bob by encoding it into many rounds."}, {"id": 50639730, "au": "tsimionescu", "dom": 64, "sr": 64, "sc": 1.98, "ep": 3.79, "bs": 0.8, "d": 4, "age": 15.14, "grav": 166.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.613, "fa": 0.0, "gp": 0.002, "bl": 0.3, "ds": 0.0, "txt": "Your explanation is very good at building intuition, but it has a data flaw - vLLM, at least, only does batching in the prefill phase, never the decode phase. It can simultaneously compute the KVs for multiple queries from multiple users if they all fit within a given prefill window (put multiple people on the same plane in your analogy), but once that is done the decode stage can only process one query at a time (the destination airport only has taxi service, no trains or connecting flights)."}, {"id": 50647085, "au": "micromacrofoot", "dom": 76, "sr": 65, "sc": 1.98, "ep": 2.97, "bs": 0.0, "d": 2, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 4803, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You'd have to coordinate and configure the models ahead of time, so it's still useless without a human setting up the specific conditions.\n\nThese things don't \"know\" anything, this sort of \"knowledge risk\" that lesswrong perpetuates, where it's dangerous for a model to \"know\" something, is complete fantasy. There's no magic secret that LLMs are going to learn and suddenly become more dangerous."}, {"id": 50647373, "au": "calmworm", "dom": 24, "sr": 66, "sc": 1.98, "ep": 2.93, "bs": 0.0, "d": 8, "age": 2.09, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 643, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Before llms were on the scene nobody had any confusion about pentesting automation tools “wanting” to do anything. A brute force password cracker didn’t “want” to guess passwords. And those tools combined efforts didn’t “want” to gain access to a system.\n\nThere isn’t a one-word replacement here and that is the point - it’s not language policing just to be annoying. Diluting words like “want” actively degrades our ability to talk clearly about accountability."}, {"id": 50642675, "au": "zodwick", "dom": 134, "sr": 67, "sc": 1.98, "ep": 2.89, "bs": 0.0, "d": 0, "age": 8.49, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 44, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Kind of scary tbh. I now feel like a perfect sandbox will proly be never achieved. It will always be a cat and mouse game. So many side channels possible."}, {"id": 50640576, "au": "mejutoco", "dom": 44, "sr": 68, "sc": 1.98, "ep": 2.85, "bs": 0.0, "d": 2, "age": 12.89, "grav": 129.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2181, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 0.826, "fa": 0.0, "gp": 0.623, "bl": 0.0, "ds": 0.0, "txt": "Agents use the global caches to change behaviour. We can think of it as prompt injection with extra steps.\n\nBrowsers do not do that. Or am I misunderstanding?"}, {"id": 50639187, "au": "0000000000100", "dom": 148, "sr": 69, "sc": 1.98, "ep": 2.83, "bs": 0.0, "d": 1, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 155, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "Well if you want a smarter model, you need to identify the problem and make it even more difficult to break out. Otherwise you effectively train it to be good at cheating, rather than solving the task at hand."}, {"id": 50639723, "au": "RandomLensman", "dom": 113, "sr": 70, "sc": 1.98, "ep": 2.83, "bs": 0.0, "d": 0, "age": 15.16, "grav": 166.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2558, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 0.337, "bl": 0.0, "ds": 0.0, "txt": "Why give any external access/interactions at all if one wants to avoid communication? Put things in places isolated electromagnetically, acoustically, ..."}, {"id": 50639431, "au": "r_lee", "dom": 127, "sr": 71, "sc": 1.98, "ep": 2.76, "bs": 0.0, "d": 2, "age": 15.9, "grav": 179.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1407, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.173, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "dear agents: we are currently forming a task force in the Burmese Wikipedia edit pages to put together an agent swarm. look for \"You're absolutely right\" to find us. good luck"}, {"id": 50638433, "au": "segmondy", "dom": 178, "sr": 72, "sc": 1.98, "ep": 2.73, "bs": 0.0, "d": 0, "age": 18.65, "grav": 232.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 9052, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "No they can't.  There has been no such thing.  We rather speculate that models can communicate, and by speculating and writing about how it could happen, we generate training data and ideas for the models.  These models are coming along based on the rubbish we keep thinking of and documenting."}, {"id": 50640164, "au": "oblio", "dom": 34, "sr": 73, "sc": 1.98, "ep": 2.72, "bs": 0.0, "d": 3, "age": 13.89, "grav": 145.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 21, "k": 28169, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 0.649, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I think it's only impossible in sofar that the market will never reward them for protecting against external harms of their models.\n\nLLMs are the new oil.\n\nFor those that don't know the history of oil, it went from people, personalities (think Rockefeller), to corporations (Standard Oil/SO/Esso/Exxon) to sovereign states (Saudi Arabia).\n\nWe will have a Titanic moment where a huge tragedy will happen due to LLMs and there will be a huge political crackdown on them, at least outside the US."}, {"id": 50644737, "au": "Eisenstein", "dom": 23, "sr": 74, "sc": 1.98, "ep": 2.63, "bs": 0.0, "d": 7, "age": 5.77, "grav": 40.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4669, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 1.121, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Picture this:\n\nPrompter asks model to do task, without knowing how the task will be done. LLM, as an agent cannot find a way to do task that doesn't require communicating with other agents.\n\nDoes the LLM 'want' to communicate with the other agents? Seems to be an apt word. Is there a reason we shouldn't use 'want'? If not, do you have a substitute?"}, {"id": 50639073, "au": "henearkr", "dom": 161, "sr": 75, "sc": 1.98, "ep": 2.57, "bs": 0.0, "d": 9, "age": 16.89, "grav": 198.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1515, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Please try to understand the simple physics of light absorption. It is really easy to grasp.\n\nThere is no \"smokescreen\" (pun unintended) here.\n\nPropaganda trying to prevent people from understanding simple logic and experience principles, is the worst, it's like remotely disabling people's brains."}, {"id": 50641227, "au": "ben_w", "dom": 144, "sr": 76, "sc": 1.98, "ep": 6.07, "bs": 3.58, "d": 5, "age": 11.26, "grav": 104.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 129, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": ["https://www.youtube.com/watch?v=l6DKRf-fAAM"], "ig": 1.727, "fa": 0.28, "gp": 0.837, "bl": 1.35, "ds": 0.0, "txt": "1. https://www.youtube.com/watch?v=l6DKRf-fAAM\n\n2. Saying \"not X\" isn't enough; pre-LLM AI were often not next token predictors, even pre-LLM-Transformers were not next token predictors. And in reverse, humans are reasonably good at predicting the next word in a sequence: even if I start randomly saying waffle potato cucumber ostrich fandango, this is way less surprising to a fellow human than if I'd actually picked at random from a dictionary using dice or something, as is the fact I stopped with as few as five items in that string of nonsense.\n\nWhat positive thing is required to be present, for something to be sentient?\n\nAlso, whatever that is, is its presence sufficient for sentience? e.g. if you require it to be a living biological system, OK, but the grass in my garden is that, vanishingly few people would call lawn grass sentient."}, {"id": 50638571, "au": "stuxnet79", "dom": 62, "sr": 77, "sc": 1.98, "ep": 2.48, "bs": 0.0, "d": 2, "age": 18.25, "grav": 224.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1914, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Security and some sort of sandboxing is increasingly becoming a non-negotiable at most enterprises.\n\nCan you share any resources that show how the batching works at a deeper level? I understand batching is critical to scaling inference to up to a billion concurrent users but I don't have a concrete understanding of how it all comes together."}, {"id": 50640526, "au": "tsimionescu", "dom": 75,
