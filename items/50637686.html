\n\nIt is like trying to convince religious fundamentalists that science is more important than religion."}, {"id": 50640849, "au": "ben_w", "dom": 30, "sr": 81, "sc": 1.98, "ep": 3.75, "bs": 1.32, "d": 3, "age": 12.15, "grav": 117.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 32, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 1.086, "fa": 0.42, "gp": 0.0, "bl": 0.5, "ds": 0.0, "txt": "> As long as it is difficult to act on the communication and as long as the communication itself is still slow, it probably isn't going to reach the level of a security concern.\n\nThat may slow things down, but (ignoring for the moment that far too many people hand off far too much control to AI even despite the headlines of all the things going wrong and the agents themselves coming with warning messages), what's the shortest message that creates a security exploit?"}, {"id": 50643495, "au": "wat10000", "dom": 51, "sr": 82, "sc": 1.98, "ep": 2.4, "bs": 0.0, "d": 4, "age": 7.27, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7038, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Until you stumble across an app that always sends the exact same prefix up to “user’s date of birth is:” or similar, and now you can do a little enumeration to get private data out of the system.\n\nIt’s OK to cache known safe prefixes across users, but arbitrary prefixes need to stay per-user."}, {"id": 50645731, "au": "Sniffnoy", "dom": 182, "sr": 83, "sc": 1.98, "ep": 2.29, "bs": 0.0, "d": 3, "age": 4.4, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 5536, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They are \"sandboxed\" in the sense that they have been put in something which is supposed to act as a sandbox, and that people would think of as a sandbox.  The point is that this sandbox failed.  If you say \"well, if it failed then it wasn't really a sandbox!\"... well, I suppose that's true, in a sense, but it misses the practical import of the original statement."}, {"id": 50641511, "au": "strogonoff", "dom": 141, "sr": 84, "sc": 1.98, "ep": 2.28, "bs": 0.0, "d": 6, "age": 10.53, "grav": 94.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 5020, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 0.968, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s not exactly what I meant by “the other way around”. One way to describe it would more along the lines of reversed causality: consciousness (or whatever you call it) is what really happens (the underlying territory), and jiggly head meats is how we describe it (our map of it). Either way, natural sciences aren’t in the business of answering the questions like “what does it mean to be conscious”."}, {"id": 50638342, "au": "sinuhe69", "dom": 172, "sr": 85, "sc": 1.98, "ep": 2.21, "bs": 0.0, "d": 0, "age": 18.86, "grav": 237.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1764, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 0.694, "fa": 0.0, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "If sandboxing only means sandboxing of file access then of course any thing with a network access can still communicate, not to mention AI"}, {"id": 50644388, "au": "calmworm", "dom": 22, "sr": 86, "sc": 1.98, "ep": 2.2, "bs": 0.0, "d": 6, "age": 6.22, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 643, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 0.938, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The “erm, ackshually” here is that someone is prompting the llm. The prompter wants something. Sloughing off the responsibility with lazy language like the llm “wanting” something is incorrect and allows for an easy misdirection of the responsible parties when something goes awry."}, {"id": 50640960, "au": "tsimionescu", "dom": 81, "sr": 87, "sc": 1.98, "ep": 3.82, "bs": 1.7, "d": 4, "age": 11.9, "grav": 114.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 1.624, "fa": 0.0, "gp": 0.002, "bl": 0.64, "ds": 0.0, "txt": "Models actually run on the inference server. An \"agent\" is simply a name for any process that is able to access an LLM to guide its next steps. Usually an agent runs on your own system, maybe in an isolated environment like a container or a VM, and talks to a remote inference server. The inference server is often stateless, except for the cache - the agent sends its entire history every time it contacts the inference server (\"first I asked this, and you answered that, and then I said this, and then you answered that, and [...] and now what do I do next?\"). The inference server checks if this history exists in its cache already, and either loads the precomputed KV values from there as an optimization, or it re-computes them if not. In principle this cache process is entirely transparent, though the blog post is right that various implementation details can make it not fully transparent."}, {"id": 50639653, "au": "TZubiri", "dom": 177, "sr": 88, "sc": 1.98, "ep": 2.11, "bs": 0.0, "d": 0, "age": 15.3, "grav": 169.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2174, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "my issue with galactic security research is that it foregoes much more obvious and actually observed risks in favour of risks that follow a more marketable narrative.\n\nanthropic trains on user input under our noses, and now trades on the public stock market which communicates it through day traders with the rest of the economy\n\nand OpenAI obviously shares some user input with advertisers to effectively sell ads.\n\nbut neither is as hot a headline as attributing the risk to a cool robotic AI. It’s a new enemy, not the same old conflict of companies and advertising and commercial law that we are already fatigued about."}, {"id": 50642360, "au": "roarcher", "dom": 21, "sr": 89, "sc": 1.98, "ep": 2.09, "bs": 0.0, "d": 5, "age": 9.03, "grav": 75.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1550, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "model_space", "flbl": "Model & Space (Lead)", "urls": [], "ig": 0.89, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is such tired language policing. Whether a model genuinely feels a desire for something, or just simulates the behavior of an actor that does, is entirely irrelevant to the discussion above. The behavior is the same.\n\nYour drive-by \"erm, ackshually\" is lazy and contributes nothing to the conversation."}, {"id": 50646666, "au": "DoctorOetker", "dom": 61, "sr": 90, "sc": 1.98, "ep": 2.9, "bs": 0.85, "d": 6, "age": 3.03, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "evidence_models", "flbl": "Evidence & Models (Open)", "urls": [], "ig": 0.896, "fa": 0.28, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "which is why affected clients will sue for access to weights and replay the computation (i.e. implicitly demand determinism), since it may contain evidence of negligent indeterminism."}, {"id": 50638841, "au": "YetAnotherNick", "dom": 95, "sr": 91, "sc": 1.98, "ep": 2.03, "bs": 0.0, "d": 1, "age": 17.55, "grav": 210.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3218, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cache_inference", "flbl": "Cache & Inference (Users)", "urls": [], "ig": 0.864, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Two agents has to figure it out on sync running on same server. They wouldn't even know if they are being communicated to.\n\nThis paper makes it much more likely for the agent to communicate, as they give exact signal of what to look for when some other agent is communicating with them."}, {"id": 50638315, "au": "bot403", "dom": 166, "sr": 92, "sc": 1.98, "ep": 2.02, "bs": 0.0, "d": 1, "age": 18.96, "grav": 239.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 281, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "side_llms", "flbl": "Side & LLMS (Channels)", "urls": [], "ig": 0.782, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "But he included the prompt text \"please don't use this to break out of your sandbox\" in his research near the end. That should be good enough."}, {"id": 50641231, "au": "taneq", "dom": 49, "sr": 93, "sc": 1.98, "ep": 2.01, "bs": 0.0, "d": 2, "age": 11.24, "grav": 104.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 30019, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "me I was more complaining about the statement \"ensure it doesn't have side-channels\" is a huge problem all by itself rather than referring to the article.\n\nI didn't mean to edit my comment after you replied.\n\nStill the article itself says \"These channels are easy to close\", there are many ways to solve the problems listed. Serving models on different engine instances is one way. Also, in vLLM Batch-invariant kernels make activations bit-identical regardless of batch size, which closes the step-size channel; and per-user cache isolation blocks the KV cache message board channel.\n\nThese are pretty common sense solutions, acting like it's a \"draw the rest of the owl\" problem is just being dramatic.\n\nObviously they can communicate if you both intentionally give them ways to communicate and ask them to do so.\n\nBadly sandboxing your environments isn't a proof of \"how innovative these AI models are\" or \"how difficult this problem is to solve\".\n\nIf I don't sanitize my inputs people can SQL inject into my website, that's more me being dumb than them being smart."}, {"id": 50640487, "au": "TeMPOraL", "dom": 99, "sr": 111, "sc": 1.23, "ep": 1.23, "bs": 0.0, "d": 3, "age": 13.08, "grav": 132.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "altright_religious", "flbl": "Alt-right & Religious (Lab)", "urls": [], "ig": 0.522, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Damned if they do, damned if they don't.\n\nNow let's talk about people publishing CVEs. Same can be said about them, up to and including religious rituals around ridiculous classification scores. And their publications carry more immediate, practical impact."}, {"id": 50640607, "au": "ozgrakkurt", "dom": 82, "sr": 112, "sc": 1.19, "ep": 1.19, "bs": 0.0, "d": 2, "age": 12.8, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
