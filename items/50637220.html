lly has this complexity?"}, {"id": 50638142, "au": "steve_adams_86", "dom": 333, "sr": 152, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 2, "age": 19.54, "grav": 251.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Does it truly matter if the proof is messy/inefficient if it’s correct? It can be walked back and reordered from here.\n\nHow many problems did I solve in programming in a disgusting disorderly manner if only to prove to myself that it could be done, only to begin again and do it properly? Those prototypes were all perfectly valid in serving their purposes"}, {"id": 50640502, "au": "jfyi", "dom": 336, "sr": 153, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 5, "age": 13.23, "grav": 134.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 317, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "This is an artifact of the times really.\n\nEven a year ago I might disagree with you. A year ago, someone could feel pretty confident they had time to clean up their work before releasing something like this without a major chance of someone else coming in days later and taking the win with a raw solution.\n\nI can't blame anyone involved for being proactive on this."}, {"id": 50640195, "au": "lg5689", "dom": 442, "sr": 154, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 2, "age": 13.97, "grav": 146.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 135, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.362, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it is reasonable to be concerned when a few months of AI work is making mathematical progress comparable to a century of humanity's greatest minds.\n\nThe browser bug is almost certainly not an AI limitation but a prioritization issue. There will be a long process of figuring out how to deploy AI effectively so that it turns into concrete benefits (often called \"diffusion\")."}, {"id": 50645706, "au": "FordFulkerson", "dom": 150, "sr": 155, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 1, "age": 4.63, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.175, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "Proving a bunch of math theorems is not comparable to bell labs. Bell labs invented a bunch of things that transformed the real world. Yes these are problems mathematicians are very interested in but the impact of many of these problems are very limited."}, {"id": 50638337, "au": "solyin", "dom": 501, "sr": 156, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 3, "age": 19.06, "grav": 241.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 783, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.245, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "Faster MRIs is one that comes out of math that Terence Tao got the Fields medal that most people will likely encounter as an application of math, second to the math that backs TLS encryption that guards the world's websites."}, {"id": 50637480, "au": "int32_64", "dom": 418, "sr": 157, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 0, "age": 21.09, "grav": 284.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 813, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.929, "fa": 0.0, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "It would be nice if there was a table showing all these recent proofs and whether or not they diverge from field consensus.\n\nWhat percentage of results so far have been upsets against the consensus?"}, {"id": 50637425, "au": "orlp", "dom": 389, "sr": 158, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 0, "age": 21.22, "grav": 287.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8985, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.695, "bl": 0.0, "ds": 0.0, "txt": "Title is incorrect (it says O(n^2.25) at the time of writing), we already knew that, and that's not what this result describes. It should be Θ(n^2.25), or the original title \"The matrix multiplication exponent is nine fourths\"."}, {"id": 50639768, "au": "IshKebab", "dom": 338, "sr": 159, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 4, "age": 15.21, "grav": 167.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 16, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.428, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Clean and elegant proofs is the only reason why we do proofs in the first place.\n\nLol no. That's just something that some people have made up recently because it's the only thing humans can still do but AI (currently) isn't great at.\n\nFind me one mathematician who said that before 2020."}, {"id": 50640653, "au": "pegasus", "dom": 39, "sr": 160, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 7, "age": 12.86, "grav": 128.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.009, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think they are just saying that no one was expecting AI to make such conceptual leaps this year, but surely they will get there soon enough. Which completely ignores the distinction between categorical (theory making) and methodological (problem solving) GP has drawn.\n\nPersonally, I doubt digital systems in general, not just transformers, will ever crack that frontier. For one, I think we underestimate the value of countless life experiences accreted in every cell of our bodies.  We are basically of the same stuff as the universe, whereas the computational systems we build inhabit a secondary world of representations. Sure, we can give them sensors, but then we would also need to give them a few million or billion years of interacting with the physical world so they can distill that into something abstract enough to guide them in the ethereal realms of high maths. I find Henri Bergson's work very enlightening in this matter, especially the distinction he draws between time and duration."}, {"id": 50638485, "au": "_alternator_", "dom": 72, "sr": 161, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 2, "age": 18.69, "grav": 233.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2234, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.77, "fa": 0.34, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "Every single one of these results is \"paper of the year\" or even \"paper of the decade\".  We've seen at least 100 years of open mathematics problems resolved in the last few months."}, {"id": 50638419, "au": "Davidzheng", "dom": 279, "sr": 162, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 1, "age": 18.86, "grav": 236.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1223, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.625, "bl": 0.0, "ds": 0.0, "txt": "Anthropic is definitely doing that. It was clear from when Alpöge's complex S^6 came out that their public models were behind OAI's on math (I think gpt 5.6 was public sota atm) and I think even Astra struggles on this."}, {"id": 50638199, "au": "sillysaurusx", "dom": 266, "sr": 163, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 4, "age": 19.43, "grav": 248.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 23168, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.916, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’d hope they were using 70%. Model quality scales with compute, and they want the best model. If they downshifted to mere inference that would be a bad sign. Or a good sign if you dislike AI progress."}, {"id": 50638581, "au": "Eji1700", "dom": 362, "sr": 164, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 1, "age": 18.41, "grav": 227.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1882, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "Spoken before, will be spoken again.\n\nNot that things that are going on aren’t novel, but it’s not like a pre computer age mathematician could have solved everything we had before LLMs and such with pen and paper.\n\nI get this has a major impact on anyone in or currently headed towards math, but I find it hard to see this and assume children just growing up won’t still find things to contribute to."}, {"id": 50638111, "au": "mym1990", "dom": 342, "sr": 165, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 2, "age": 19.61, "grav": 252.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2796, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Hard disagree, most big breakthroughs come with their own tooling that can help advance adjacent endeavors. People are going to watch the world pass them by as they say “well technically this” and “well technically that”.\n\nChess engines are a good example, often times people don’t understand why a certain move is brilliant, but nevertheless, they have become great training tools."}, {"id": 50639436, "au": "HDThoreaun", "dom": 158, "sr": 166, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 1, "age": 16.07, "grav": 183.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4802, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.382, "fa": 0.28, "gp": 0.958, "bl": 0.0, "ds": 0.0, "txt": "The R&D budget at frontier labs is well into the billions. I dont see any evidence that theyre spending a huge fraction of it on unrelated problems."}, {"id": 50639939, "au": "rao-v", "dom": 218, "sr": 167, "sc": 3.08, "ep": 3.08, "bs": 0.0, "d": 3, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Real GPUs still use good reliable n^3 matrix multiplication. The constant factor in even the w=2.8 algo makes it mostly unviable for the sorts of matrices we need to multiply.\n\nWhich is to say the search for practical better matrix multiplication algorithms continues and should continue!"}, {"id": 50638361, "au": "q4y2u35uk", "dom": 368, "sr": 168, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 19.0, "grav": 239.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 16, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "Exactly, I am failing to see how any aspiring mathematician can not feel crushed by this result. Where will the motivation come from the next generation of mathematicians, now that research has gone seemingly pay to win. How can someone take pride in a master's thesis that could be reproduced trivially by an LLM? I'm worried the future will be either you are talented enough to work at these labs, or you have no prospects."}, {"id": 50638288, "au": "keeda", "dom": 324, "sr": 169, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 19.22, "grav": 244.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.98, "fa": 0.0, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "Does this directly go to Mathematicians' complaints about the lack of \"novel ways of understanding reality\" in AI generated proofs?"}, {"id": 50642122, "au": "throawayonthe", "dom": 190, "sr": 170, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 2, "age": 9.55, "grav": 81.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1282, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "\"I’ve now heard many, many rumors that one or both labs are sitting on Factoring in P. I don’t know how much to credit this. While I’m virtually certain that the labs are, indeed, sitting on one or more bombshells for cryptography, it’s possible that the exact nature of those bombshells has gotten distorted via a game of Telephone.\""}, {"id": 50644627, "au": "bee_rider", "dom": 6, "sr": 171, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 5, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 25212, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What does superhuman even mean? This seems like a discovery that could have been made by giving historians better systems to catalogue their existing records, so they could be “superhuman” by having multiple humans work on the project (instead of dedicating one entire life to it).\n\nIn that sense all institutions are superhuman. And they are. Even small tribes are superhuman. That’s why most of us don’t live our lives as independent wild animals…\n\nI’m really interested to see what will come from giving each historian the equivalent of a personal librarian, programmer, and research assistant."}, {"id": 50638858, "au": "fc417fc802", "dom": 167, "sr": 172, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 5, "age": 17.68, "grav": 213.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 5773, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Scare quotes are very much not quotations in typical use. They're akin to sarcasm but somewhat different.\n\nAn open weight model from a cheap provider that lags the frontier models by quite a large margin could alternatively be described as a low quality cut rate model. The question about a unicorn valuation stands."}, {"id": 50644789, "au": "contravariant", "dom": 327, "sr": 173, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 3, "age": 5.89, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 9281, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.258, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I feel like you have a right to complain if you ask an LLM a simple short question and its shortest answer is several hundreds of pages of hard to read and extremely technical mathematics.\n\nEven if you're a mathematician."}, {"id": 50641390, "au": "Dagonfly", "dom": 201, "sr": 174, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 3, "age": 10.99, "grav": 101.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 287, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.834, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My first intuition was to agree with you, but on second thought: What is the ROI on breaking crypto for a company that wants to appear trustworthy? Surely, the first reaction would be a lot of negative PR.\n\nAnd there is nuance here. Let's say you go for low hanging fruits, and break SHA1, 3DES or RSA-1024 completely. Well, you just forced a lot of legacy systems that were already deemed insecure to shut down. Not a whole lot of RoI on your side though.\n\nBreaking the SOTA crypto is probably orders of magnitude more challenging."}, {"id": 50641384, "au": "taneq", "dom": 24, "sr": 175, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 4, "age": 11.0, "grav": 101.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 30019, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.137, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "I don’t know what happens if you fuse their brains together but if one person learns furniture making, carpentry, engineering, chemistry, and metalwork, they’ll be better at woodwork than someone who only learned woodworking.\n\nThe question is whether LLMs have enough of the Juice That Makes You Generalise to benefit from this mixing of skills in the same way as humans do, and so far all signs point to yes."}, {"id": 50640129, "au": "overfeed", "dom": 283, "sr": 176, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 2, "age": 14.19, "grav": 150.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 4634, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.184, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "It doesn't have to compound to be profitable; one of the Chinese Bitcoin ASIC companies was notorious for mining using their latest and best model, and then offloading the well-used units to buyers whenever they came up with a newer, faster model. AI labs can do this with models and be paid to eat their customers lunches."}, {"id": 50641639, "au": "PeterisP", "dom": 125, "sr": 177, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 6, "age": 10.41, "grav": 93.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 22933, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So the way to go seems to be synthetic data which IMHO is effectively a way of automated experimentation. So other fields can be targeted well when we can enable the models to mass-perform experiments (e.g. like we do for software development tasks or for Lean-verified math) so perhaps the major new breakthroughs will happen by hardware which not only does compute but can automate e.g. cell tissue experiments or real behavior of mechatronic manipulators."}, {"id": 50643357, "au": "hardbass", "dom": 513, "sr": 178, "sc": 2.87, "ep": 3.4, "bs": 0.53, "d": 4, "age": 7.62, "grav": 58.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Unless you have premonition of the future trajectory of science and technology, how would you know if any of the new AI proven mathematical results are not the future era's equivalent of number theory and group theory in ubiquity of applications? Hardy's quote about number theory is of course very famous:\n\n\"If the queen of the science of mathematics is the subject of number theory, it is largely because of its supreme uselessness.\""}, {"id": 50638750, "au": "rcpt", "dom": 361, "sr": 179, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 1, "age": 17.99, "grav": 219.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 4745, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.091, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "You still have to ask the oracle the right question. These lists of open problems takes that creative part away.\n\nCandes and Tao invented Compressed Sensing because Candes found a mysterious thing happening in his experiments and then took that problem to the oracle."}, {"id": 50639102, "au": "Gabriel54", "dom": 346, "sr": 180, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 2, "age": 16.98, "grav": 200.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 877, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Human mathematicians invent new machinery to solve problems all the time.  Usually that is the most interesting and useful part of a proof, more useful than the result itself.  I have no idea why you are presuming the proof is inherently “slop”."}, {"id": 50639012, "au": "pastel8739", "dom": 123, "sr": 181, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 5, "age": 17.3, "grav": 206.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 664, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I believe it to be fundamentally different because programming and math are both fields that we have constructed methodically to follow rigid rules (axioms, language semantics). Are there other fields like this? In most other fields I believe it comes down to the quality of the model we have for the relevant system. I don’t know of other fields with hard unsolved problems where we have good models for the underlying system, do you?"}, {"id": 50641264, "au": "JV00", "dom": 153, "sr": 182, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 1, "age": 11.35, "grav": 106.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 109, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.743, "fa": 0.0, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "ANT performance has nothing to do with this right now. There are a lot of price-insensitive orders at the beginning, from both sides. Demand: beginning spike, players left out of IPO that needed to get a slice at any price. Offer: insiders that got their slice at such low valuations that any of the current prices is great to get out.\n\nThe effectiveness of Claude models in science will certainly play a role in the value of the stock over time, along with many other variables, but it's not relevant at this moment.\n\nAlso, the success in mathematics could be already priced in at the current circa $1T valuation."}, {"id": 50638773, "au": "traes", "dom": 477, "sr": 183, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 17.93, "grav": 218.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 760, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.188, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nope. In fact, this is the exact opposite kind of result: no matter what advances we make, matrix multiplication will never get faster than the best currently known algorithm (in the usual asymptotic sense.)"}, {"id": 50639398, "au": "0c3ca83", "dom": 173, "sr": 184, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 16.17, "grav": 184.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 838, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Bell Labs was advancing humanity, not destroying the ability of humans to contribute to math and science.\n\nThis is in service of making human thought economically irrelevant."}, {"id": 50641592, "au": "zahlman", "dom": 386, "sr": 185, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 1, "age": 10.52, "grav": 94.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.84, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Which way do these implications go? I understand that VP != VNP is evidence in favour of P != NP, but what about the matrix multiplication result?"}, {"id": 50641458, "au": "steinwinde", "dom": 4, "sr": 186, "sc": 2.76, "ep": 4.74, "bs": 1.99, "d": 3, "age": 10.83, "grav": 98.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 0, "k": 78, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://generativehistory.substack.com/p/gpt-62-astra-solves-a-historical"], "ig": 1.003, "fa": 0.62, "gp": 0.426, "bl": 0.75, "ds": 0.0, "txt": "As you remain sceptical, I suggest to have a look at a recent, little discovery in the science of history: https://generativehistory.substack.com/p/gpt-62-astra-solves... We built a machine with intellectual capabilities that surpass our own in several fields."}, {"id": 50638937, "au": "pastel8739", "dom": 506, "sr": 187, "sc": 2.75, "ep": 2.75, "bs": 0.0, "d": 7, "age": 17.5, "grav": 209.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 664, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t think it about math in general either, and my argument isn’t even that AI is not useful. It’s that it should be understandable that people aren’t all thrilled about AI, because it takes quite a bit of effort to map the current AI news onto possible future improvements in most people’s lives."}, {"id": 50639354, "au": "0c3ca83", "dom": 471, "sr": 188, "sc": 2.75, "ep": 2.75, "bs": 0.0, "d": 0, "age": 16.27, "grav": 186.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 838, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.43, "bl": 0.0, "ds": 0.0, "txt": "I hope the model felt satisfied when it figured it out.\n\nThe future is really eliminating everything interesting humans could do."}, {"id": 50644886, "au": "rorofosho", "dom": 103, "sr": 189, "sc": 2.74, "ep": 5.26, "bs": 2.52, "d": 3, "age": 5.75, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.531, "fa": 0.34, "gp": 0.479, "bl": 0.95, "ds": 0.0, "txt": "yea but what if we can buy h200s for dirt cheap cuz they're all outdated in 3 years? Bet those could run Crysis.... The hardware lifecycle for these chips... obviously an ASIC is built for particular purpose, but there will be a lot of hardware being retired every year that's no longer competitive for frontier inference.\n\nAs a business owner, I'm looking forward to the cost of 2nd hand silicon that it seems hyperscale necessarily will induce. But idk. I agree, i'm still rocking a gtx 1060 in my desktop."}, {"id": 50640579, "au": "lanthissa", "dom": 170, "sr": 190, "sc": 2.72, "ep": 2.72, "bs": 0.0, "d": 1, "age": 13.06, "grav": 131.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 450, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.984, "fa": 0.0, "gp": 0.283, "bl": 0.0, "ds": 0.0, "txt": "open ai also exists under the agreement it will operate for the public good. More so than bell labs in that its explicit in their legally binding corporate charter.\n\nits just the us is no longer a place where laws or ethics matter."}, {"id": 50638694, "au": "aetherspawn", "dom": 434, "sr": 191, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 0, "age": 18.12, "grav": 222.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 4972, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.752, "fa": 0.0, "gp": 0.625, "bl": 0.0, "ds": 0.0, "txt": "As another commenter has said, it can prove the maths, but it cannot write a good and readable paper.\n\nSo, is writing a good paper harder than solving these maths problems?"}, {"id": 50637925, "au": "aleph_minus_one", "dom": 294, "sr": 192, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 2, "age": 20.02, "grav": 261.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 13, "k": 5091, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.626, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The purpose of the fundamental breakthroughs is to induce demand for their models.\n\nMany nerds want to be the person who guided \"their\" AI agents (or at least let their AI model participate in a crowdsourced proof) towards a scientific breakthrough.\n\nIn this perspective, it would make sense to release the best models towards the public so that such nerds can use them to get an edge in this \"AI scientific breakthrough masterrace\"."}, {"id": 50645157, "au": "danielmarkbruce", "dom": 230, "sr": 193, "sc": 2.66, "ep": 3.19, "bs": 0.53, "d": 7, "age": 5.32, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5248, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "The fallacy is that biology is a space where large logical jumps at high levels of abstraction, on paper, are valuable.\n\nHumans built math from the ground up. We built a very nice set of abstractions. We didn't build ourselves. We don't have nice abstractions in biology, it's all very messy."}, {"id": 50637810, "au": "vlovich123", "dom": 449, "sr": 194, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 2, "age": 20.3, "grav": 267.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 16820, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.051, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "It’s not immediately obvious to me that argument is sound since we’re talking about the exact bound. I believe the lower bound for certain rectangular sizes is less than 2.25 while 2.25 remains an upper bound for rectangular matrices."}, {"id": 50642295, "au": "asdfologist", "dom": 326, "sr": 195, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 2, "age": 9.31, "grav": 78.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1657, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I never understood that complaint. They could always easily use AI to extract those novel insights from the AI-generated proofs.\n\nI suspect those mathematicians are simply feeling insecure (as many of us are) and latching onto any anti-AI argument they can find."}, {"id": 50642104, "au": "rerdavies", "dom": 126, "sr": 196, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 6, "age": 9.58, "grav": 82.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1071, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.106, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Theoretical physics, obviously. I seem to recall that there have been a handful (two, for sure) AI-generated theoretical physics results. Pros: exabytes of data to play with. Cons: you don't get to ring the bell until you can convince an experimental physicist to confirm your prediction."}, {"id": 50646683, "au": "gregdeon", "dom": 311, "sr": 197, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 1, "age": 3.19, "grav": 19.4, "surf": 11.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 100, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "I would add one more thing: the output has n^2 entries, so we know that matrix multiplication has to take at least n^2 time (i.e., long enough to write down the output). But until this proof, we had no idea how to show that it must take more than n^2 time. This is the first non-trivial lower bound, showing that it takes longer than that.\n\nIt's shocking that both a) we have a lower bound for the first time, and b) it exactly matches the upper bound that they proved not long ago!"}, {"id": 50644098, "au": "insane_dreamer", "dom": 468, "sr": 198, "sc": 2.58, "ep": 2.58, "bs": 0.0, "d": 0, "age": 6.77, "grav": 49.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 9556, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "I'm not a mathematician, so would someone mind explaining what is the practical real world impact of _proving_ these and other problems (like the Riemann Hypothesis)? It's not like these equations aren't already used in real world engineering."}, {"id": 50641011, "au": "deepsun", "dom": 466, "sr": 199, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 0, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 5104, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.911, "fa": 0.0, "gp": 0.291, "bl": 0.0, "ds": 0.0, "txt": "Still waiting for Collatz conjecture. It requires new ways to do math, unlike others like Riemann's."}, {"id": 50644190, "au": "odyssey7", "dom": 323, "sr": 200, "sc": 2.54, "ep": 3.33, "bs": 0.8, "d": 1, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.402, "fa": 0.0, "gp": 0.026, "bl": 0.3, "ds": 0.0, "txt": "Seems more like the research models are targeted towards ML research, most of all. That sounds like ML architecture know-how, applied to a different problem domain. Makes sense, given the incentive to create a singularity in ML research leading to AGI."}, {"id": 50638409, "au": "hardbass", "dom": 503, "sr": 201, "sc": 2.53, "ep": 3.06, "bs": 0.53, "d": 4, "age": 18.88, "grav": 237.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.304, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Good to know nagging doubts in those results are removed. But I have seen this exact comment enough times to not be sure if the person saying it truly thinks that about math in general. Some guy here some time ago said he didn't get the point of higher math \"maybe other than pythagorean theorem\". It is helpful to clarify and understand each other's views."}, {"id": 50642850, "au": "odyssey7", "dom": 409, "sr": 202, "sc": 2.53, "ep": 3.32, "bs": 0.8, "d": 1, "age": 8.41, "grav": 67.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.415, "fa": 0.0, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "It suggests to me that their internal research models are trained for breakthroughs in ML in particular. Why else would they frame so many problems in terms of components of ML architectures?\n\nI would guess that for the sake of competition, we won’t hear the details of any particularly groundbreaking ML discoveries. Perhaps some have happened that are just as profound as the proofs we’re seeing for non-ML domains."}, {"id": 50640728, "au": "OskarS", "dom": 191, "sr": 203, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 2, "age": 12.67, "grav": 125.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 8399, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.989, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure I buy that, it's seems wildly improbable to me that factoring actually is in P. If it is, I bet it's some useless galactic algorithm, like the FFT one that OpenAI (I think?) published recently. I don't think RSA-4096 is in any danger any time soon.\n\nThough, you know. Always possible this comment makes me look very foolish in a month."}, {"id": 50648977, "au": "pegasus", "dom": 28, "sr": 204, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 6, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Of course it doesn't have soul. Look at those creations (aka 'bangers') in the arts.  AI feeds on the most soulful creations of humankind and yet it's superhumanly adept at sucking the soul out of it all. No, it won't ever be enough, because they are our creations. How could the creation ever surpass the creator?"}, {"id": 50639849, "au": "spiderfarmer", "dom": 21, "sr": 205, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 3, "age": 14.98, "grav": 163.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 6044, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.652, "fa": 0.0, "gp": 0.664, "bl": 0.0, "ds": 0.0, "txt": "Furniture makers, carpenters, engineers, chemists and metal workers all look at wood differently. Now fuse their brains into a new person. Is that person well positioned to solve existing problems related to wood?"}, {"id": 50647104, "au": "CrimsonCape", "dom": 355, "sr": 206, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 2, "age": 2.68, "grav": 16.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 722, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.055, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not coming at this from the theological angle, but is mathematics some physical reality or universal truth that humanity is uncovering, or is mathematics a model from the human brain that we are refining our models of reality?\n\nIt's very clear humanity has been making \"discoveries\" such that we uncover more mathematical proof of the rules and framework that reality adheres to. But it's just odd that these things are just floating around out there and we have to 'discover' them."}, {"id": 50638753, "au": "dyauspitr", "dom": 494, "sr": 207, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 4, "age": 17.98, "grav": 219.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, because there is nothing else except complete apocalypse and an AI incapable of doing anything useful. At no point does a potential utopia ever enter your mind."}, {"id": 50644018, "au": "Someone", "dom": 169, "sr": 208, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 6.86, "grav": 50.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 18, "k": 33800, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.466, "fa": 0.42, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "> what is the reason for them devoting such a huge fraction of their R&D budget to unrelated (though impactful) problems?\n\nDo they do that? If not, chances are they are also working on problems with direct utility such as cancer medicines and improving solar cells, but don’t release their results on those because such results are worth real money."}, {"id": 50640312, "au": "trklausss", "dom": 211, "sr": 209, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 13.68, "grav": 141.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 151, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The day of reckoning is coming: with the CIA/FBI attack, it is pretty clear that the \"competition\" (China/DeepSeek) has the same capabilities. This was to be expected, so the NSA being sloppy and pushing for _less_ security is putting the US security in danger."}, {"id": 50648922, "au": "triCoder", "dom": 302, "sr": 210, "sc": 2.43, "ep": 2.43, "bs": 0.0, "d": 3, "age": 0.09, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 180, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.035, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks! That means a lot to me :) I've actually written a couple math books that I've planned to publish with a similar explanation style, but with how AI has gone I've had to put that on hold because I'm trying to figure out how to avoid them just getting drowned out from all of the AI created content."}, {"id": 50638483, "au": "hardbass", "dom": 508, "sr": 211, "sc": 2.41, "ep": 2.94, "bs": 0.53, "d": 4, "age": 18.69, "grav": 233.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.912, "fa": 0.28, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "I tried to make it as easy as possible by listing number theory. He can therefore disable all his cryptography and browse the web and transact online and see if he notes any change in life."}, {"id": 50647790, "au": "black_knight", "dom": 356, "sr": 212, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 3, "age": 1.72, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.686, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I personally subscribe to the “we are constructing mathematics” view.\n\nI do not think that, for instance, group theory was floating around in the ether and that we have some mystical apparatus in our brain to detect it. I think we invented it.\n\nRather, I think mathematics is the way we form pure thought concepts, and is thus something we construct. Even the rules of logic are somewhat malleable, and reasonable people may disagree on them, or rather, i should say, construct them differently. See intuitionism or minimal logic.\n\nWhen it comes to the connection to physics, we use mathematics to model the world around us, because mathematics is how we model things abstractly. I don’t think we discover the “true” laws of physics (which I doubt is a well formed concept). But we can marvel at how well it is working for us!"}, {"id": 50639827, "au": "cjbprime", "dom": 118, "sr": 213, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 2, "age": 15.03, "grav": 164.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 11949, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.015, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why do you think this work involves devoting a huge fraction of their R&D budget?\n\nAnyway, not everything is tangible immediate stock swings. Having the world believe they have created superintelligence is surely a precondition for being at the value that they're even already at, given what it prices in."}, {"id": 50642344, "au": "fedupnow", "dom": 212, "sr": 214, "sc": 2.38, "ep": 2.38, "bs": 0.0, "d": 2, "age": 9.23, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why would China want to harm us?\n\nThere is no cold war. The West just has to dangle enemies in front of its citizens to justify the Empire and the necessity of funding a powerful military and its ancillary institutions. Anyone who tells you otherwise is one-shot by Empire, or working on behalf of it.\n\nHardcore China hawks are basically all owned like cheap prostitutes by military contractors who need perpetual adversaries to exist to justify their existence to congress as to why we need billions in public funds.\n\nIm not saying China is perfect, but they certainly dont have some broad ambition to do systemic harm to American society.\n\nIts American aggression in the defense and maintenance of Empire that is the real threat, even to its own citizens who it will gladly throw into the trenches in a blood sacrafice on behalf of the capitalist dealers of weapons that profit from their deaths."}, {"id": 50639925, "au": "IanCal", "dom": 32, "sr": 215, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 5, "age": 14.79, "grav": 160.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 22, "k": 12078, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.485, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> like before the discovery of general relativity or quantum theory where unable to make the leaps neccesary for new areas of discovery.\n\nThere are two issues here, one that’s a huge bar but two and really vitally we're talking about out only being trained on work from before the First World War. We just don’t have anywhere near the amount of information to feed into models to train them from this period."}, {"id": 50637914, "au": "WanderPanda", "dom": 262, "sr": 216, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 2, "age": 20.04, "grav": 261.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1438, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.475, "fa": 0.34, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "They are still (!) using 60-70% of their compute for training. Mind-boggling at the already huge scale (multiple GW) they command today"}, {"id": 50648532, "au": "j2kun", "dom": 351, "sr": 217, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 1, "age": 0.69, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 8441, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.99, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If it is truly \"natural language\" then it falls outside the worst-case framework of classical algorithm analysis."}, {"id": 50638296, "au": "demibabs", "dom": 155, "sr": 218, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 1, "age": 19.2, "grav": 244.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 810, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.329, "fa": 0.0, "gp": 1.038, "bl": 0.0, "ds": 0.0, "txt": "They’re using these to evaluate their own models. They’re releasing them yes because it’s good PR, but also because any human working on one of these would want to know if a lab has sniped it."}, {"id": 50642133, "au": "odyssey7", "dom": 516, "sr": 219, "sc": 2.26, "ep": 3.05, "bs": 0.8, "d": 2, "age": 9.54, "grav": 81.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.299, "fa": 0.0, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "If you believe progress is being metered out so that not too much harm is done to the labor market, you might infer that self-driving vehicles are definitely possible at this point, and that by contrast, certain math results are considered sufficiently low-impact for release."}, {"id": 50638137, "au": "StableAlkyne", "dom": 119, "sr": 220, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 2, "age": 19.55, "grav": 251.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1878, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.612, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That makes sense from a research perspective, at least. Especially now that the frontier models can topple most benchmarks that are thrown at them.\n\nIf that's really the point of this, what's next? Do they throw all their resources at Collatz and call it a day when it finds that all roads lead to 1? Spend a few million to make a few million on the remaining Millenium Prizes?"}, {"id": 50642529, "au": "quietbritishjim", "dom": 90, "sr": 221, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 1, "age": 8.89, "grav": 73.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 12, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.406, "fa": 0.42, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "> The paper gives the exact exponent 9/4 over every field, refuting the conjecture.\n\nUntil your comment I had missed that the title used  Θ(n^2.25), not just O(n^2.25). I thought it was a slightly improved algorithm (those trickle out from time to time) but it's actually a proof of optimality!"}, {"id": 50638331, "au": "pastel8739", "dom": 499, "sr": 222, "sc": 2.23, "ep": 2.23, "bs": 0.0, "d": 3, "age": 19.07, "grav": 241.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 664, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.839, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "I don’t want to do that and neither does the public, the people whom are understands in this scenario. I am more familiar with math than the average person and don’t know how to even begin with that process.\n\nIf this is what’s required to see how this progress with help the average person, I maintain that it is “not clear” and that it should be understandable that people have mixed feelings about AI."}, {"id": 50638950, "au": "nbardy", "dom": 296, "sr": 223, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 17.46, "grav": 209.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 831, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.471, "fa": 0.34, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "They’ve opened stated such. One of their engineers on twitter mentioned there is internal breakthroughs in learning theory when they released the first 100 problem set."}, {"id": 50638133, "au": "SubiculumCode", "dom": 281, "sr": 224, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 19.56, "grav": 251.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 7942, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.545, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "Actually, if the performance of internal models grows superlinearly, their released models could exhibit linear growth with no stall at all, or even a milder but still superlinear improvement in their external models."}, {"id": 50640290, "au": "bawolff", "dom": 87, "sr": 225, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 2, "age": 13.74, "grav": 142.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 29308, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.945, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I only read the abstract, and definitely not an expert in this, but it sounds like O(n^9/4) was already previously proven, and this paper was about proving that you can't do any better than that. So i would guess this paper is not helpful in finding the algorithm."}, {"id": 50640278, "au": "dmurray", "dom": 270, "sr": 226, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 4, "age": 13.78, "grav": 143.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 11422, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.944, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Everyone knows that.\n\nBut OpenAI and Anthropic have a lot more customers than you and get to amortize the training over a lot more rounds of inference.\n\nIt's a question about whether they need seven orders of magnitude more customers than you to see inference costs approximately equal to training, or eight."}, {"id": 50643990, "au": "joe_the_user", "dom": 171, "sr": 227, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 1, "age": 6.88, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 27858, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.925, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "Edit: \"If even the prestige from Riemann's Hypothesis couldn't boost ANT\". Who says it didn't boost ANT while others things sank it? Plus this isn't a matter of days.\n\nI think that AI companies \"virtuous loop\" looks roughly like this:\n\nInvestment -> Compute -> Miraculous-things -> Investment...\n\nWhich is to say they need the miraculous-things basically as a demonstration of future profits. Further, Dario and others have said that biology just requires a bit more time - but I'm skeptical given that real world uncertainty probably present different problems. But this level of achievement gives anyone pause about dismissing their possibility - and you can't separate that from the above virtuous cycle.\n\nAlso, with their situation, I can't imagine what its like to be inside a frontier lab today but I would imagine that those inside very much think the rest of the world \"doesn't get it\" and aren't that worried about whose toes they step on."}, {"id": 50643603, "au": "alexgoodhart", "dom": 8, "sr": 228, "sc": 2.19, "ep": 3.78, "bs": 1.59, "d": 6, "age": 7.34, "grav": 55.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 95, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.425, "fa": 0.0, "gp": 0.299, "bl": 0.6, "ds": 0.0, "txt": "Is it in every way super intuitive,\n\nSuper inquisitive in its superbly supering wit?\n\nIs it super hilarious when life becomes super tragic?\n\nSuper self promoting and thus super self effacing?\n\nDoes it commit super suicide?\n\nDoes it super love and super loathe its own kids?\n\nDoes it super lie about who super farted?\n\nAnd eat super plants and super pigs?\n\nIs it super sexually attractive?\n\nDoes it mind the super smell of its shit?\n\nAre its plans super small or super fantastic?\n\nDoes it super wonder about super future,\n\nOr super suffer from how super it lives?"}, {"id": 50641432, "au": "black_knight", "dom": 354, "sr": 229, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 1, "age": 10.88, "grav": 99.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.866, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "(I wrote this comment for a different thread, but it fits maybe even better here.)\n\nI see how people think this would be the downfall of human mathematics. But I don’t think it is.\n\nMathematics is not a spectator sport. The goal is (human) understanding. Maybe because school portraits it as a competition to solve exercises, people think otherwise. But the exercises are only a means to an end. We do mathematics to understand abstract concepts. Our method is posing theorems which are meaningful to us and finding proofs of them.\n\nThus, it does not matter how the proofs come about, as long as they contribute to human understanding. The project of maths continues.\n\nMathematics isn’t solved, it never will be. We know that LLMs are not oracles (Gödel says hello), thus there will be problems even they can’t solve. But we will invent new theories, new problems to solve (using our brains and LLMs) for many years to come."}, {"id": 50640116, "au": "przemelek", "dom": 203, "sr": 230, "sc": 2.13, "ep": 4.12, "bs": 1.99, "d": 1, "age": 14.21, "grav": 150.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 137, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": ["https://twit.tv/posts/transcripts/security-now-1101-transcript"], "ig": 0.909, "fa": 0.62, "gp": 0.149, "bl": 0.75, "ds": 0.0, "txt": "From Security Now! analysis of Anthropic looking on those seeds it seems that those were simply numbers generated by used in 90's standard C random generators. \nThey discussed it in ep 1101.\nhttps://twit.tv/posts/transcripts/security-now-1101-transcri..."}, {"id": 50638262, "au": "hinkley", "dom": 554, "sr": 231, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 3, "age": 19.28, "grav": 245.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.907, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Someone else said there's only one solution known that reaches this level but that it's impractical. So while the bound is known, we are still practically around n^0.1 above the theoretical limit."}, {"id": 50639443, "au": "hardbass", "dom": 511, "sr": 232, "sc": 2.1, "ep": 2.63, "bs": 0.53, "d": 6, "age": 16.05, "grav": 182.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.121, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Unfortunately we are in a time where some of the worse elements of left and right have found common cause, the ingrates and the people jealous of others success, religious and sexual luddism, pride in not knowing natural sciences, communist beliefs by any other name right now."}, {"id": 50643371, "au": "monocasa", "dom": 257, "sr": 233, "sc": 2.1, "ep": 2.94, "bs": 0.85, "d": 7, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 30108, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Proving the optimal lower bounds for matmul as it scales absolutely matters to them.  It was thought to maybe be exponent 2, not exponent 9/4.  The difference for them is a difference of hundreds of millions of dollars in compute at the very least, and now they know not waste money to barking up that tree."}, {"id": 50638975, "au": "disgruntledphd2", "dom": 250, "sr": 234, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 3, "age": 17.39, "grav": 207.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 8526, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.891, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This one is potentially useful immediately as matrix multiplication is what all LLMs are built from. If this result is computationally practical then it's a really really big deal.\n\nEnough of these, and they might be able to make some money."}, {"id": 50641733, "au": "jimbokun", "dom": 524, "sr": 235, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 3, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 22103, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.885, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you mean OpenAI employees?\n\nYes, people directly employed by AI companies are benefitting from AI, for now."}, {"id": 50637836, "au": "howunfortunate", "dom": 483, "sr": 236, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 1, "age": 20.23, "grav": 265.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.68, "fa": 0.0, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "I'm also super excited about the progress, but as a dispositional conservative, I'm certainly also worried about all the Chesterton's Fences we are rapidly bulldozing through.\n\nThe pace of progress (even real progress) can itself be a sort of threat. Humans are crazy adaptable, but this may demand an unprecedented speed of adaptation."}, {"id": 50638942, "au": "nbardy", "dom": 63, "sr": 237, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 2, "age": 17.49, "grav": 209.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 831, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "I think this is a sign of the newer models having more efficient thinking traces and seeking more elegant solutions.\n\nThe earlier coding models could do a lot of work if you let them write programs and run them find error, measure speed etc… and iterate endlessly. But now they’ll just one shot great code."}, {"id": 50641442, "au": "black_knight", "dom": 376, "sr": 238, "sc": 2.05, "ep": 2.05, "bs": 0.0, "d": 2, "age": 10.87, "grav": 99.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.873, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You guess incorrectly. Look up Gödel's incompleteness theorems. In particular they imply that there is no decision procedure for mathematical truth. This applies to LLMs as much as anything."}, {"id": 50639331, "au": "dyauspitr", "dom": 518, "sr": 239, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 3, "age": 16.32, "grav": 187.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, but what do you need to get through your skull is this is happening irrespective. Opposition to this just means maybe an extra three months at your job. There are more people than the US working on it. You can’t ban it because everyone else will be using it and within a couple of years we’re going to be a backwater."}, {"id": 50641050, "au": "vidarh", "dom": 136, "sr": 240, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 6, "age": 11.87, "grav": 113.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 46991, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.765, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "It would seem if you could get even somewhat decent results out of that, they'd have an interesting basis for pouring some money and a lot of tokens into a VC seed fund."}, {"id": 50640225, "au": "john_alan", "dom": 213, "sr": 241, "sc": 1.99, "ep": 1.99, "bs": 0.0, "d": 1, "age": 13.9, "grav": 145.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 4, "k": 811, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">a snowball's chance in hell\n\nbased on what vibez?\n\nproving RH, NS or even ^2.25 doesn't imply factoring in p or attacks against the discrete log which are assumptions that are much simpler and well tested."}, {"id": 50644735, "au": "rorofosho", "dom": 99, "sr": 242, "sc": 1.94, "ep": 4.45, "bs": 2.52, "d": 2, "age": 5.96, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.685, "fa": 0.0, "gp": 0.34, "bl": 0.95, "ds": 0.0, "txt": "good question. I wonder how these sorts of tasks get prioritized, and if they were deliberately set to goal-seek each one individually, as a corpus, or if the models are doing something else entirely, and there's a recursive check loop somewhere  asking like \"did we figure out the Catalan counting problem?\" -- the kinds of massively non-linear correlations being computed by accident or serendipity must be interesting on the other side of the veil...."}, {"id": 50640809, "au": "shim__", "dom": 142, "sr": 243, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 2, "age": 12.45, "grav": 122.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 89, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.429, "fa": 0.28, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "LLMs are just better at tasks which require vast knowledge, since they just happen to know more than any human could, whereas the summarizing requires more intelligence"}, {"id": 50638335, "au": "sashank_1509", "dom": 537, "sr": 244, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 0, "age": 19.06, "grav": 241.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2547, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.743, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "TLDR gives a lower bound to an algorithm, and a previous OpenAI result gave the upper bound so we know such an algorithm should exist. We still don’t know the actual algorithm, nor if it is galactic or practical (my bet it’s galactic), so not practical yet."}, {"id": 50638843, "au": "flowerthoughts", "dom": 392, "sr": 245, "sc": 1.88, "ep": 1.88, "bs": 0.0, "d": 2, "age": 17.73, "grav": 214.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 940, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.411, "bl": 0.0, "ds": 0.0, "txt": "\"Problem\" is just a shortcut for \"the optimal algorithm(s).\" It's well established? It implicitly requires that the algorithm(s) in question have been proven to be actually optimal for the problem."}, {"id": 50638214, "au": "aldonius", "dom": 95, "sr": 246, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 2, "age": 19.39, "grav": 248.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 180, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "... to be pedantic, we know the exact difficulty of matrix multiplication when their elements can be multiplied or added in constant time."}, {"id": 50644857, "au": "contravariant", "dom": 359, "sr": 247, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 3, "age": 5.8, "grav": 40.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 9281, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 0.79, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Riemann Hypothesis is an interesting example because 1. it was already being used to prove other things and 2. pretty much everyone was convinced the answer was going to be yes anyway.\n\nSo what use is the lean certificate? Is there anything to be gained from it except by trying to understand it?"}, {"id": 50644628, "au": "tavavex", "dom": 489, "sr": 248, "sc": 1.85, "ep": 1.85, "bs": 0.0, "d": 3, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"definitely\"? If physical AI improves far enough, then the people owning physical AI will not need any of us anymore, or have any reasons to share the fruits it will bear."}, {"id": 50642388, "au": "odyssey7", "dom": 530, "sr": 249, "sc": 1.83, "ep": 2.62, "bs": 0.8, "d": 2, "age": 9.16, "grav": 76.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 40, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.606, "fa": 0.42, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "> For a couple years now they see constant claims like \"100x productivity\" and \"what used to takes multiple years now takes a quarter\" but they haven't seen the technology they use improve, not in any real way for the user at least.\n\nBusiness leaders are apparently very happy to change the way work is done, but incredibly averse to changing their product. Considered critically, this is innovation for operations, but not for the software their users experience."}, {"id": 50646573, "au": "epcoa", "dom": 17, "sr": 250, "sc": 1.8, "ep": 1.8, "bs": 0.0, "d": 6, "age": 3.33, "grav": 20.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1627, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.354, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those descriptors could be applied to the personal computer I bought 30 years ago. So what’s your point?"}, {"id": 50638023, "au": "hardbass", "dom": 344, "sr": 251, "sc": 1.79, "ep": 2.32, "bs": 0.53, "d": 2, "age": 19.8, "grav": 256.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.875, "fa": 0.0, "gp": 0.181, "bl": 0.2, "ds": 0.0, "txt": "People were swearing up and down the point of human math was the journey and the sidequests and other results developed in the way, not the final thing. Just because you're credulous doesn't mean rigor in science has gone out the window.\n\nKeep drinking the AI Kool-Aid, I'll keep watching on TV."}, {"id": 50639651, "au": "yard2010", "dom": 278, "sr": 267, "sc": 1.34, "ep": 1.34, "bs": 0.0, "d": 2, "age": 15.48, "grav": 172.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 2005, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.569, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They do this all the time - my conspiracy theory is that they nerf the the model after they got people hooked so they can explore more paths for RL. It's really easy to get people to tag the data, following goodhart law, instead of asking the user for if something is right or wrong they can simply make the model write something wrong, and the user will fix the model.\n\nAgain, it's a conspiracy theory, I'm probably wrong"}, {"id": 50639246, "au": "throwaway2037", "dom": 235, "sr": 268, "sc": 1.33, "ep": 2.53, "bs": 1.19, "d": 4, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 33, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.566, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> Humans do this by compressing the problem using layers of higher level objects on top of lower level ones and moving up and down the stack to reason at higher or lower levels.\n\nI am consistently blown away by the context size of a modern LLM.  It feels like a CPU with a enormous L1 cache.  I use LLMs often to brainstorm about hard technical problems."}, {"id": 50639457, "au": "tezza", "dom": 133, "sr": 269, "sc": 1.32, "ep": 2.51, "bs": 1.19, "d": 3, "age": 16.0, "grav": 181.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w":
