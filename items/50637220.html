bug not a feature.\n\nLike when you ask a coding agent to write something and, as part of the solution, it cooks up an entirely new JSON deserialization library or Paxos implementation from scratch as part of the task instead of using (and perhaps improving) a battle-tested library.\n\nYes, technically the agent succeeded at the assigned programming task.  Just like technically this agent succeeded at proving this theorem.  But unfortunately the work-product is unmaintainable slop.\n\nNobody hesitates to say \"yes it's correct but it's slop\" about AI code.  It's time to apply the same rule to AI proofs."}, {"id": 50639118, "au": "sigbottle", "dom": 128, "sr": 66, "sc": 4.92, "ep": 6.0, "bs": 0.0, "d": 5, "age": 16.93, "grav": 199.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 803, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 2.089, "fa": 0.0, "gp": 0.754, "bl": 0.0, "ds": 0.0, "txt": "I mean, when formal logic was developed in the 20th century, Russel's first philosophy program was trying to bring type theory style intuition to a universal description language and it seemingly failed (both for internal reasons, e.g. Carnap's LP didn't use type theory and was much more extensional, and for external reasons, e.g. logic's place in philosophy as a whole).\n\nWhen it comes to formalizing messy domains I honestly don't see constrained, defined space manipulation as primary. AI is a perfect example of that - GOFAI failed, LLM's succeeded.\n\nI've been saying, Math 2.0, if it ever does work, will need to be able to bridge the semi-messy gap without saying \"the world reduces to mathematical formalisms\". Because even if that's true, in practice you don't actually behave like that, right? I mean, the Carnap tried and legit tried talking in L-language, so there are some odd figures here.\n\nBut we often have this dualism between \"the messy ambiguous stuff out there\" and \"the formal concrete stuff over here\". Would be interesting to see AI bridge \"simple but hard\" philosophical problems like these"}, {"id": 50638025, "au": "Frost1x", "dom": 290, "sr": 67, "sc": 4.92, "ep": 5.99, "bs": 0.0, "d": 3, "age": 19.8, "grav": 256.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 6190, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.713, "fa": 0.0, "gp": 1.352, "bl": 0.0, "ds": 0.0, "txt": "Finding a lower bound on matrix multiplication seems to be such a case considering how much money/power is spent on… matrix multiplication. It means they can divert attention to optimizing or reducing power vs chasing more efficient matrix multiplication algorithms and instead focus on practical options in that domain.\n\nI don’t think it’s too far of a stretch to believe they are using their own models for self improvement even if it’s not autonomous RSI and withholding results to gain competitive advantage."}, {"id": 50638399, "au": "timr", "dom": 502, "sr": 68, "sc": 4.92, "ep": 5.97, "bs": 0.0, "d": 3, "age": 18.9, "grav": 237.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 32229, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.569, "fa": 0.28, "gp": 1.021, "bl": 0.0, "ds": 0.0, "txt": "Well, if you’re going to make this argument, you should probably pick something other than Riemann, which everyone assumed was true anyway. Similarly, tightening the complexity bounds on matrix math is cool, I guess, but the only practical impact is that it rules out some miracle that would make LLMs less expensive to run.\n\nAside: I’m pretty sympathetic to people who say that an AI-slop proof that humans cannot understand is useless, when the underlying result is essentially of zero consequence. The only point of the exercise is to generate the mathematical leap necessary to prove the thing."}, {"id": 50639234, "au": "hansvm", "dom": 391, "sr": 69, "sc": 4.92, "ep": 5.95, "bs": 0.0, "d": 2, "age": 16.53, "grav": 191.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 189, "qw": 0, "k": 5871, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.944, "fa": 0.0, "gp": 0.95, "bl": 0.0, "ds": 0.0, "txt": "Is literally anyone confused by the notation? Constrained to this problem: There exists an algorithm achieving Θ(n^2.25) runtime. There does not exist an algorithm achieving o(n^2.25) runtime. If we want to be pedantic about function classes vs other extensions of Big-O notation then we can talk about the runtime of some specific class of algorithms associated with this problem and manufacture the function everyone is implicitly referring to. It's a perfectly fine shorthand phrasing, especially given that the domains are different for that overlap in vocabulary.\n\nThe best/average/worst case stuff is similarly quite easy. For best, take the lowest runtime for the algorithm across all inputs of length n. Do Big-O on that sequence. Worst-case is the same technique applied to the highest runtime. Average is a bit messy since it pulls in an undefined measure which may or may not related to your application, but once you have a measure it's no harder than the other two to analyze. These are rudimentary functions satisfying the pedantry you're asking for and also exactly corresponding to the normal engineering mentality when they reach for that verbal shorthand. Why do they need further elaboration?"}, {"id": 50639201, "au": "rao-v", "dom": 238, "sr": 70, "sc": 4.92, "ep": 5.94, "bs": 0.0, "d": 3, "age": 16.63, "grav": 193.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.499, "fa": 0.34, "gp": 0.998, "bl": 0.0, "ds": 0.0, "txt": "The secret is that RL improvements generalize beyond their domain! An agent that can put together tricky bits of math from multiple fields efficiently to solve a problem is also one that can cleverly put together libraries to design a better more architected app. Indeed, I think the converse has actually been the big surprise of mid 2026. Training agents with RL to write code made them better at math (and a lot more!). Some generic benefits to problem solving ride along with being really good at applying number sieves and picking the right database for a task!"}, {"id": 50643077, "au": "bonoboTP", "dom": 228, "sr": 71, "sc": 4.92, "ep": 5.74, "bs": 0.0, "d": 6, "age": 8.0, "grav": 63.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 9168, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.722, "fa": 0.0, "gp": 1.166, "bl": 0.0, "ds": 0.0, "txt": "I think they meant profs as in professors. And I absolutely would predict that people who are able to invent math proofs and follow complex reasoning chains like that will be better at complex medical research as well. Not because they use math proofs directly in medicine but because of the common underlying factor of intelligence. The fallacy in the question that sways intuition is that a math prof is a late career settled person who won't likely go sit through medical school at that age. This doesn't apply to AI."}, {"id": 50638049, "au": "p11p", "dom": 352, "sr": 72, "sc": 4.91, "ep": 5.66, "bs": 0.0, "d": 0, "age": 19.74, "grav": 255.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 44, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.389, "fa": 0.34, "gp": 0.984, "bl": 0.0, "ds": 0.0, "txt": "Somehow this result more than any of the other ones so far hits close to home.  How long have I been writing \\omega and keeping the mystery secreted away in this symbol?  I really feel for Virginia and all of the other crew that have been working on this steadily for the past 15 years.  I wonder how she feels."}, {"id": 50641668, "au": "turzmo", "dom": 476, "sr": 73, "sc": 4.91, "ep": 5.6, "bs": 0.0, "d": 1, "age": 10.35, "grav": 92.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 421, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.564, "fa": 0.34, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "One of the issues with translating results like these to the real world is this: we know that the cost (in time) for multiplying matrices is C N^2.25, where C is some constant. Theoretical computer scientists are interested in driving down that exponent as low as possible, independent of what C is.\n\nIn this case, and in many others, optimal algorithms have extremely large C's. In fact so large that there is no practical reason to ever use them. My understanding is that all matrices are multiplied in practice naively (O(n^3)) or with Strassen's algorithm (O(n^2.8something)) but that none of the newer (20th century and beyond) algorithms are practical."}, {"id": 50647739, "au": "pegasus", "dom": 41, "sr": 74, "sc": 4.91, "ep": 5.56, "bs": 0.0, "d": 9, "age": 1.8, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 16, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.531, "fa": 0.42, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "> every atom of silicon has been shaped by us\n\nThat's just the thing, they have not. Compared to a living cell, even the most advanced circuitry is like a hammer compared to a human arm. Maybe in a few million years they will get there, but I doubt it. We don't know how deep the rabbit hole goes when it comes to biological organisms.\n\n> language [...] doesn't care too much about substrate\n\nLanguage doesn't care about anything else either, it's not a subject with feelings, but without such a subject to animate it, it's ultimately just an empty game. We give it meaning by putting it to good use, like any other tool."}, {"id": 50647809, "au": "kzrdude", "dom": 481, "sr": 75, "sc": 4.91, "ep": 5.53, "bs": 0.0, "d": 4, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 12662, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.782, "fa": 0.95, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "Not current (2016) but with plots for results on page 9, looks like you need matrices with size length 2000-4000 for it to pay off, or something like that.\n\n\"Our implementation demonstrates speedup over conventional DGEMM even on an Intel(R) Xeon Phi(TM) coprocessor utilizing 240 threads.\"  (Just funny, a modest 240 threads dedicated to mmul..)"}, {"id": 50648069, "au": "black_knight", "dom": 378, "sr": 76, "sc": 4.91, "ep": 5.49, "bs": 0.0, "d": 4, "age": 1.35, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.886, "fa": 0.0, "gp": 0.731, "bl": 0.0, "ds": 0.0, "txt": "Indeed! My comment was aimed at the statement that math could in theory be solved. I don’t think humans are capable of solving everything either. The difference is that for us humans, human understanding is primary.\n\nSo I think there will be several fronts going forwards. One is what we can generate machine verified proofs for, which has a certain platonic appeal. Then there is the front of human understanding, or rather various fronts for the various levels of understanding.\n\nI have never been drawn to the worship of the first to solve a hard problem. I more deeply revere those who develop a beautiful or useful theory. These sometimes go hand in hand, but I don’t see them as joined by the hip.\n\nSo, I still see mathematics as this unbounded field for us to develop beautiful and useful theories in. Constructing a theory means proving some theorems, and I guess the hard ones we will give to an LLM, but we still must study the proofs to gain an understanding."}, {"id": 50638462, "au": "danielmarkbruce", "dom": 223, "sr": 77, "sc": 4.91, "ep": 5.47, "bs": 0.0, "d": 2, "age": 18.74, "grav": 234.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 5248, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.688, "fa": 0.0, "gp": 1.035, "bl": 0.0, "ds": 0.0, "txt": "Signal for what though? Math proofs. I suspect the groundbreaking stuff we are seeing in math proofs has approximately zero value outside of math proofs. Your note of the pefecta trifecta is absolutely right, but it may be a perfect trifecta of \"producing marketing\". And yes, it's really freaking hard to come up with material that works as nicely as math proofs with RL. Even coding really doesn't because most real software doesn't produce anything verifiable.\n\nAnd, this is coming from a very pro LLM/AI person...it feels like the big labs have been going down a path for some time now that really is largely a waste of time."}, {"id": 50638678, "au": "x-complexity", "dom": 288, "sr": 78, "sc": 4.91, "ep": 5.46, "bs": 0.0, "d": 2, "age": 18.16, "grav": 222.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 4, "k": 810, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.523, "fa": 0.34, "gp": 0.629, "bl": 0.0, "ds": 0.0, "txt": "> Fundamental breakthroughs aren't profitable.\n\nSome breakthroughs are profitable. For OpenAI, it comes in terms of improving inference speeds & reducing costs.\n\nIf there exists a set of functions that can be grinded out to get incremental 1% gains in decode tokens per second, they would be fools not to do so.\n\n(Note: There is definitely a lower bound in terms of how much they can improve before the base requirements become galactic. This still doesn't mean that they shouldn't do it.)"}, {"id": 50639539, "au": "sky2224", "dom": 163, "sr": 79, "sc": 4.91, "ep": 5.38, "bs": 0.0, "d": 2, "age": 15.76, "grav": 177.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 637, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.506, "fa": 0.34, "gp": 0.603, "bl": 0.0, "ds": 0.0, "txt": "As we've seen with the latest iteration of models, especially from OpenAI, the cost to performance ratio is going down significantly. I don't think it's out of the question for us to get to a point where Anthropic, OpenAI, etc. don't stop to ask if iteration N is \"good enough\" for 98% of enterprise users and find themselves in financial pressures that makes it so they just can't offer the cheaper models without taking significant losses."}, {"id": 50640431, "au": "gobdovan", "dom": 145, "sr": 80, "sc": 4.91, "ep": 5.38, "bs": 0.0, "d": 3, "age": 13.39, "grav": 137.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 1193, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.863, "fa": 0.0, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "There are always ways to formalise seemingly illogical domains and either it's very simple (P&L, simple profit projections) or very complex and require simulation (dynamic systems modeling, game theory, agent-based simulation).\n\nWhenever you believe emotion cannot be modeled properly, you can treat it as noise. If, on the other hand, you believe you can use it to predict future events, then congrats, you've just incorporated it under a logical model, even if that model is probabilistic."}, {"id": 50639167, "au": "throwaway2037", "dom": 286, "sr": 81, "sc": 4.91, "ep": 5.37, "bs": 0.0, "d": 1, "age": 16.75, "grav": 195.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.695, "fa": 0.0, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "You raise some good points.  The more likely reality: It is a blend.  They use bleeding edge models internally for a certain period of time, then release to the general public.  I assume they also partition a certain shwre of compute for internal R&D.\n\nOne thing that makes no sense to me from a commercial view: Why are they bothering to solve these hard math problems?  Can the solving process be used to train future models in a valuable manner?"}, {"id": 50639283, "au": "idontneedcoffee", "dom": 3, "sr": 82, "sc": 4.91, "ep": 5.36, "bs": 0.0, "d": 2, "age": 16.43, "grav": 189.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 8, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.674, "fa": 0.0, "gp": 0.98, "bl": 0.0, "ds": 0.0, "txt": "Can it be that what we are seeing in this wave of breakthroughs is not really a testament for the model architecture but for the multilayered almost fully automated training infrastructure openai and others have built, can it be that the moat here are the bilion users doing innovative experiments using their models and a sophisticated infrastructure that can siff through all that data, categorize and clean it and turn it into training data? Iow is there some unknown unatributed math genius sitting somewhere in Bangalore that worked on a problem with chatgpt or is this really asi in the making. I am skeptical"}, {"id": 50646636, "au": "senordevnyc", "dom": 58, "sr": 83, "sc": 4.91, "ep": 6.14, "bs": 0.85, "d": 9, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 1834, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.415, "fa": 0.68, "gp": 0.605, "bl": 0.32, "ds": 0.0, "txt": "Those comments are 64 and 40 days old, post Navier-Stokes.\n\nAnd I should have been more precise, because when I said no one in the math community, I was thinking of credible named people, not random anonymous commenters online. By that standard, everything has been accurately predicted, because there’s someone somewhere who will predict it. If we build a Dyson Shell in 2027, I’m sure there will be some Reddit comment you could point to that’s predicting it right now."}, {"id": 50639631, "au": "perching_aix", "dom": 349, "sr": 84, "sc": 4.91, "ep": 5.26, "bs": 0.0, "d": 2, "age": 15.52, "grav": 173.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2994, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.903, "fa": 0.0, "gp": 0.547, "bl": 0.0, "ds": 0.0, "txt": "no new machinery: ai sucks, only mixes and matches existing stuff\n\nnew machinery: ai sucks, makes up arbitrary stuff instead of reusing existing stuff\n\nthis coming from the same guy who suggested under multiple threads like a dozen times that the riemann proof was stolen from the guy who arguably does not have a proof, even though that doesn't make any sense given how different the proof strategies are, should not be surprising to anyone of course.\n\nand then this same person goes off about proof theorists. and the quality of proofs. accusing others of groupthink. yeah right.\n\nactual fucking hellhole, i swear to god..."}, {"id": 50640977, "au": "senordevnyc", "dom": 54, "sr": 85, "sc": 4.91, "ep": 5.24, "bs": 0.0, "d": 7, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1834, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.495, "fa": 0.34, "gp": 0.523, "bl": 0.0, "ds": 0.0, "txt": "No. People who know little about math or computer science keep getting impressed. People who follow the space have all been quite aligned in expectations.\n\nThis is blatantly false. No one in math community was expecting GRH six months ago.\n\nRather than the hindsight 20/20 of “of course, I knew this was coming!”, why don’t you enlighten us about what we can expect in May 2027?"}, {"id": 50640130, "au": "Arkhaine_kupo", "dom": 33, "sr": 86, "sc": 4.91, "ep": 5.22, "bs": 0.0, "d": 6, "age": 14.19, "grav": 150.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.838, "fa": 0.0, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "The lack of \"leap\" making has been reproduced multiple times with incomplete training sets. I just used a relatively (no pun intended) famous paradigm shift. Because with incredibly comprehensive newtonian results it still could not come up with relativistic framework answers, at all.\n\nIt could perhaps create a closed set of perfect results in its own categorical space, but not create new areas of study"}, {"id": 50637781, "au": "dyauspitr", "dom": 482, "sr": 87, "sc": 4.91, "ep": 5.2, "bs": 0.0, "d": 0, "age": 20.37, "grav": 268.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 1.105, "bl": 0.0, "ds": 0.0, "txt": "God, I love this so much waking up every day and seeing a new previously insurmountable threshold being crossed. What a time to be alive. We live in interesting times. I don’t understand these people that are anti-AI and keep whining about their jobs. I’m probably gonna lose my job too, but this is way bigger than us. Yeah I couldn’t be more excited for the future."}, {"id": 50641963, "au": "rerdavies", "dom": 97, "sr": 88, "sc": 4.91, "ep": 5.12, "bs": 0.0, "d": 4, "age": 9.82, "grav": 85.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 1071, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.839, "fa": 0.0, "gp": 0.551, "bl": 0.0, "ds": 0.0, "txt": "Tragically, the bound in the paper is for number of multiplies and divides (each counted as one operation). Additions, subtractions, and memory accesses are all free.\n\nAllow me to float the hypothesis that the number of L1 cache misses in a Matrix multiply is O(n^9/4). Just in case there are any brilliant mathematicians looking for a new problem to solve.\n\nYours sincerely,\n\nSomebody who quickly discovered that reducing the number of multiplies, while dramatically increasing the number of additions doesn't actually make your matrix multiply run faster."}, {"id": 50640892, "au": "layer8", "dom": 148, "sr": 89, "sc": 4.91, "ep": 5.06, "bs": 0.0, "d": 2, "age": 12.24, "grav": 119.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.494, "fa": 0.28, "gp": 0.515, "bl": 0.0, "ds": 0.0, "txt": "AGI includes the ability to reason over things that aren’t a clean formal system, and where you don’t have a Lean verifier to test the correctness of your reasoning. Therefore I’m skeptical of extrapolating pure classical-logic reasoning to AGI, and I’m even skeptical that current LLMs could have solved these math problems without access to a Lean verifier."}, {"id": 50641206, "au": "nutjob2", "dom": 26, "sr": 90, "sc": 4.91, "ep": 5.03, "bs": 0.0, "d": 4, "age": 11.5, "grav": 108.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 1108, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.879, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "I think this is that sort of thing, mostly from mathematics, but not entirely.\n\nImagine a person who could read every book and recall relevant parts that pertained to a certain problem. They could use all that to solve this sort of problem, drawing from all relevant facts and ideas.\n\nBut this isn't (super) human intelligence, it's merely superhuman processing, much like computers doing billions of calculations per second is superhuman. It works for academic fields like mathematics because all the knowledge is published and is in textbooks.\n\nThis is very positive for mathematicians (and others) who can now develop ideas and intuitions then exhaustively search existing knowledge to develop solutions and proofs using LLMs. Obvious applications in Comp Sci as well."}, {"id": 50638734, "au": "Maxatar", "dom": 96, "sr": 91, "sc": 4.91, "ep": 5.02, "bs": 0.0, "d": 3, "age": 18.03, "grav": 220.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1927, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.474, "fa": 0.28, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "The bound is on the number of arithmetic operations, irrespective of how computationally expensive those operations are. Constant time arithmetic is only an assumption you need to make if you want to equate arithmetic complexity with time complexity which is not what this result is about.\n\nIt's similar to how various optimal sorting algorithms have a complexity of O(nlogn), but that is a bound on the number of comparison operations, irrespective of how computationally expensive any individual comparison operation is."}, {"id": 50638732, "au": "fedupnow", "dom": 439, "sr": 92, "sc": 4.91, "ep": 4.99, "bs": 0.0, "d": 1, "age": 18.03, "grav": 220.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 256, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.794, "fa": 0.0, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "Seems likely, I dont really see how an llm is going to do anything brilliant without a compiler or lsp to verify against.\n\nPeople screaming about AI doom have failed to convince me that this tech will ever escape the containment of a terminal / deterministic processes that can be verified. This severly limits its impact/blast radius on reality (except through negative economic impact).\n\nThe silicon valley/tech crowd lives their life through computers and thus overemphasize its significance on reality, but despite what Trump says, everything is in fact not computa.\n\nThese capabilities seem pretty insignificant to basically everyone. The only significant impact I see them having outside of a terminal or network of computers are economic consequences, as all jobs that work inside these networks of computers get gobbled up by 5 companies that employ 10k people (for now), which will be very bad for our communities that rely on everyone having some sort of opportunity available to them, at least in the west.\n\nIt will probably tear our societies apart as we all struggle for a shrinking piece of the pie. Im not sure why we're excited about this and why we're opening ourselves up to these consequences just so companies can save money on labor (wont work out well for them in the end) and we can solve math problems faster.\n\nPeople think AI is going to give them abundance, it will certainl"}, {"id": 50640148, "au": "BoppreH", "dom": 204, "sr": 93, "sc": 4.91, "ep": 4.91, "bs": 0.0, "d": 2, "age": 14.12, "grav": 149.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 7747, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.327, "fa": 0.28, "gp": 0.682, "bl": 0.0, "ds": 0.0, "txt": "That's about the magic numbers in the ECDSA construction. The Dual_EC_DRBG had an honest-to-god public key embedded in it, and generated \"random\" numbers by basically encrypting data with this key. The only reasonable explanation is that the NSA holds the private part and is therefore capable of reverse-engineering random sequences generated with it. Hence why they paid the RSA company to use it. It was not subtle at all."}, {"id": 50641023, "au": "rebeccapowell", "dom": 22, "sr": 94, "sc": 4.86, "ep": 4.86, "bs": 0.0, "d": 4, "age": 11.93, "grav": 114.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 112, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.723, "fa": 0.0, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "Is say that there is some truth to the yes side.\n\nHumans typically narrow their focus of expertise the deeper they go into a topic. Medicine is a good example. Ask two very different kinds of doctors to diagnose a patient and they are highly likely to lean towards their specialist knowledge and wisdom and experience.\n\nTo use an old analogy when all you have is a hammer, everything looks like a nail.\n\nIt think LLM’s have the ability to make large scale left field jumps because they are a mixture of expert knowledge. Something that has been solved in one field can be applied in others where it wouldn’t be obvious to someone that only has depth in one of those fields."}, {"id": 50638196, "au": "not_a_bot_4sho", "dom": 462, "sr": 95, "sc": 4.84, "ep": 4.84, "bs": 0.0, "d": 0, "age": 19.44, "grav": 249.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 770, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.573, "fa": 0.0, "gp": 0.789, "bl": 0.0, "ds": 0.0, "txt": "As a physicist, not a mathematician, this is not very impressive given recent events. It feels like the new normal.\n\nAnd that is pretty exciting. Let the models slog through the hard work. Let the human dream and guide.\n\n(Not yet sure how this helps humanity but it feels like a potentially positive setup, if you ignore current leadership.)"}, {"id": 50640267, "au": "pingou", "dom": 412, "sr": 96, "sc": 4.84, "ep": 4.84, "bs": 0.0, "d": 0, "age": 13.81, "grav": 143.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1298, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.496, "fa": 0.0, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "What I’m even more interested in is when LLMs will be able to make much more accurate economic predictions than human economists, that would have a huge impact.\n\nEconomics is a very fuzzy science, of course, but given how well LLMs can process massive amounts of data, run sentiment analysis, and uncover hidden patterns, I think they could do a great job."}, {"id": 50637720, "au": "mmaunder", "dom": 215, "sr": 97, "sc": 4.84, "ep": 4.84, "bs": 0.0, "d": 0, "age": 20.5, "grav": 271.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 17970, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 1.219, "bl": 0.0, "ds": 0.0, "txt": "One possibility is that OpenAI may be holding back their best models to make fundamental breakthroughs, then using those breakthroughs to build stronger models in a compounding loop. If they were playing this game, public model quality would stall as compute shifted to internal research, and occasional releases like this would provide a glimpse of  more beneath the surface.\n\nEdit: Forgot to point out that this came from an unreleased model and the recipe isn't disclosed. And they've been doing this kind of thing since August."}, {"id": 50642068, "au": "odyssey7", "dom": 484, "sr": 98, "sc": 4.82, "ep": 5.61, "bs": 0.8, "d": 2, "age": 9.64, "grav": 82.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.626, "fa": 0.34, "gp": 0.566, "bl": 0.3, "ds": 0.0, "txt": "For the few thousand lucky folks whom society supports in their pursuits of pure math, yes, this is a massive change.\n\nMaybe we’ll get self-driving cars after all is said and done. That’s the sort of impact that reshapes society — maybe the technology is being withheld for that reason, because there’s no real plan that involves allowing massive segments of the labor market to disappear in 2-3 years."}, {"id": 50641471, "au": "soulofmischief", "dom": 149, "sr": 99, "sc": 4.74, "ep": 4.74, "bs": 0.0, "d": 3, "age": 10.82, "grav": 98.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 8647, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.7, "fa": 0.0, "gp": 0.516, "bl": 0.0, "ds": 0.0, "txt": "It may not have been able to construct a verifiable proof without Lean, but current frontier models are decent at working with high level maths on a conceptual level before something like Lean would even be relevant.\n\nIn my own experience doing maths with them, I find there are bigger issues than verifiability such as keeping the model on track and out of the gutter. These models are great at appearing busy while doing nothing useful.\n\nLevent also brought a good bit of maths to the table, so it might be more interesting to wonder if what Levent contributed was latent in the model, if the model eventually would have discovered this solution on its own in a loop, or if Levent contributed key missing input or otherwise managed to put the model in a state it couldn't have reached on it's own."}, {"id": 50638072, "au": "fn-mote", "dom": 162, "sr": 100, "sc": 4.72, "ep": 4.72, "bs": 0.0, "d": 1, "age": 19.7, "grav": 254.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 17, "k": 4953, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.865, "fa": 0.42, "gp": 1.029, "bl": 0.0, "ds": 0.0, "txt": "> IMO there is space for a unicorn to emerge in the next few years to eat everyone's lunch.\n\nWhat is this unicorn going to provide??\n\nThe rest of your paragraph makes it sound like you think cheap & “good enough” AI is what the market wants. So “low quality cut rate models” are the product that is going to create a unicorn valuation? How?"}, {"id": 50638982, "au": "ajasmin", "dom": 217, "sr": 101, "sc": 4.63, "ep": 4.63, "bs": 0.0, "d": 2, "age": 17.37, "grav": 207.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 306, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.441, "fa": 0.0, "gp": 0.86, "bl": 0.0, "ds": 0.0, "txt": "The ability to write proofs is useful in engineering. In particular, proving properties of software and digital circuits.\n\nActually, from what I understand, this very result should guard us from wasting more effort on trying to implement asymptotically faster matrix multiplication."}, {"id": 50637612, "au": "horseloverthin", "dom": 384, "sr": 102, "sc": 4.61, "ep": 4.61, "bs": 0.0, "d": 0, "age": 20.74, "grav": 276.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 9, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.762, "bl": 0.0, "ds": 0.0, "txt": "this is quite an interesting result, as some constructive mechanism for showing strong lower bounds on border rank has some severe implications for GCT ( one of the traditional paths to resolving P/NP ), as well as VP/VNP, which Anthropic has a negative result for recently."}, {"id": 50638008, "au": "pastel8739", "dom": 116, "sr": 103, "sc": 4.55, "ep": 4.55, "bs": 0.0, "d": 1, "age": 19.82, "grav": 257.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 28, "k": 664, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.424, "fa": 0.42, "gp": 1.623, "bl": 0.0, "ds": 0.0, "txt": "> If even the prestige from Riemann's Hypothesis couldn't boost ANT, what is the reason for them devoting such a huge fraction of their R&D budget to unrelated (though impactful) problems?\n\nIt’s probably a good thing for them to train and eval their models on: these are very hard problems that require lots of thinking but are easy to verify computationally. That’s fairly unique."}, {"id": 50639830, "au": "literallywho", "dom": 441, "sr": 104, "sc": 4.52, "ep": 4.52, "bs": 0.0, "d": 1, "age": 15.03, "grav": 164.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 46, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.677, "fa": 0.0, "gp": 0.398, "bl": 0.0, "ds": 0.0, "txt": "What compels people post stuff like this (I mean Scott Aaronson here)? I don't think I've ever seen such a dramatic reaction and then anything ever happened after. I guess it's a \"nothing ever happens\" kind of take from me, but my web browsers still can't keep track of where the progress was on a wikipedia page after following a link and returning back and I'm expected to believe there's a singularity incoming? How would he even know what \"an AI singularity would look and feel like\" since that is a sci-fi concept that never existed in real life?"}, {"id": 50638233, "au": "inkysigma", "dom": 71, "sr": 105, "sc": 4.51, "ep": 4.51, "bs": 0.0, "d": 1, "age": 19.34, "grav": 246.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 482, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.147, "fa": 0.34, "gp": 0.585, "bl": 0.0, "ds": 0.0, "txt": "\u002389 it's also kind of crazy. I know people really suspected one to exist and there was a good amount of work towards it but if that had been published within a more \"normal\" year like in 2021, then I would've strongly suspected it would be a contender for \"TCS paper of the year\" whatever that might mean."}, {"id": 50640495, "au": "mortarion", "dom": 375, "sr": 106, "sc": 4.49, "ep": 4.49, "bs": 0.0, "d": 1, "age": 13.24, "grav": 134.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 162, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.61, "fa": 0.0, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "I guess in theory that math is completely solvable. Ultimately it's a way to describe how numbers relate to each other.\n\nI think humans will still come up with theorems, which AI will solve. But actually working on solving math will become more of a hobby. Professionals mathematicians face the risk of becoming math archeologists, where they are trying to understand and document newly discovered AI math."}, {"id": 50638410, "au": "inkysigma", "dom": 291, "sr": 107, "sc": 4.45, "ep": 4.45, "bs": 0.0, "d": 4, "age": 18.88, "grav": 237.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 482, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "The optimal matrix multiplication algorithms are generally not used anyway due to the constants in front. I think maybe Strassens might be used but they also typically have numerical stability problems. I think for the most part the n^3 solution is what’s used in data centers since it’s easy to parallelize to be faster.\n\nI don’t know what the closed weight models are like but the n required for the open weight ones aren’t typically that large (something like n=10k or so)."}, {"id": 50641088, "au": "impossiblefork", "dom": 183, "sr": 108, "sc": 4.38, "ep": 4.38, "bs": 0.0, "d": 2, "age": 11.79, "grav": 112.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.627, "fa": 0.0, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "I think the thing to assume is that there are subtle bugs in all sorts of cryptosystems rather than old basic assumptions being invalidated.\n\nI think this is a great reason for the EU to hurry up and design training chips to get into the LLM scaling game, so that it doesn't need to fear lacking critical maths knowledge. One could hope that fear of factoring in P was enough to motivate serious action."}, {"id": 50637538, "au": "qnleigh", "dom": 425, "sr": 109, "sc": 4.33, "ep": 4.33, "bs": 0.0, "d": 1, "age": 20.92, "grav": 280.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 14, "k": 2086, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.199, "fa": 0.42, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "Based on the abstract, it looks like no:\n\n> The proof shows that a smaller exponent would compress tensor networks enough to violate a lower\nbound for testing whether the entries in each of several independent lists are distinct.\n\nIn other words, it sounds like if the exponent were lower, than you could use that to check if two lists were the same without looking at all the entries (or something like that), which is logically absurd."}, {"id": 50639744, "au": "gpt5", "dom": 366, "sr": 110, "sc": 4.29, "ep": 4.29, "bs": 0.0, "d": 3, "age": 15.29, "grav": 169.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3354, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.296, "fa": 0.28, "gp": 0.306, "bl": 0.0, "ds": 0.0, "txt": "Because math is useful even if you don't understand it.\n\nFor example, if you can create a provably secure public key based encryption (or alternatively, break any public key based encryption), it's useful no matter how dense and complicated it is, to the point where no human can understand how it works."}, {"id": 50638248, "au": "hardbass", "dom": 498, "sr": 111, "sc": 4.26, "ep": 4.79, "bs": 0.53, "d": 2, "age": 19.31, "grav": 246.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 228, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.08, "fa": 0.34, "gp": 0.881, "bl": 0.2, "ds": 0.0, "txt": "Yes, so one simple test is, if you think current pure math won't improve the lives of most people. Pick some date, at least 200 years old, and some math field that had no applications then. Say number theory or group theory. Then eliminate every tech that ever resulted from it. Then live without those. If you found any difference in living standards, do report it."}, {"id": 50640969, "au": "pingou", "dom": 415, "sr": 112, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 2, "age": 12.07, "grav": 116.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 1298, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.308, "fa": 0.34, "gp": 0.071, "bl": 0.0, "ds": 0.0, "txt": "Has it been tried many times with LLMs? If not, I don't think it is very relevant, and even if it has, LLMs are improving so much every day that it wouldn't mean much.\n\nBlack swan events are rare, so it doesn't matter that much if LLMs cannot predict them, nobody would expect them to be 100% correct.\n\nWhat is much harder, in my opinion, is that politically or economically, the flap of a butterfly's wing can seem to radically alter the course of history, and that is impossible to predict."}, {"id": 50647762, "au": "curt15", "dom": 229, "sr": 113, "sc": 4.12, "ep": 4.12, "bs": 0.0, "d": 7, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 33, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.196, "fa": 0.42, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "> The fallacy in the question that sways intuition is that a math prof is a late career settled person who won't likely go sit through medical school at that age. This doesn't apply to AI.\n\nThen why haven't the pharma companies been poaching math undergrads, PhD graduates, or postdocs? Many of them would be happy to jump if the price is right. That's why many of them have historically gotten rich in quant finance."}, {"id": 50639808, "au": "jltsiren", "dom": 372, "sr": 114, "sc": 4.11, "ep": 4.11, "bs": 0.0, "d": 1, "age": 15.07, "grav": 165.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 6351, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.611, "fa": 0.0, "gp": 0.224, "bl": 0.0, "ds": 0.0, "txt": "Pure mathematics may die as a research field, but applied mathematics will live on.\n\nThere is always more mathematics to discover. But if there are no people who can truly appreciate it, it's probably not worth doing without concrete applications in mind.\n\nResearch in pure mathematics is mostly done, because mathematicians find it interesting. It has never been something people outside mathematics really care about. Having a few mathematicians in each university is probably worth it, because it makes the university a nicer place. Much like having a few people working on other obscure topics. But nobody wants to spend any real money on things like that. Which is why OpenAI and Anthropic are probably outspending the rest of the world in pure mathematics research."}, {"id": 50641840, "au": "rocqua", "dom": 198, "sr": 115, "sc": 4.0, "ep": 4.0, "bs": 0.0, "d": 3, "age": 10.0, "grav": 87.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 9935, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.291, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd expect that for the next 5 years. A broken RSA would have a whole lot more direct impact than a broken ML-KEM would. Breaking lattices would be very annoying to people doing long term crypto planning. And would require throwing out a whole lot of work.\n\nBreaking RSA would harm security on millions of websites and devices. And would involve a whole lot of grief and direct harm to a lot of people.\n\nOne of those is worse than the other."}, {"id": 50641401, "au": "dzdt", "dom": 227, "sr": 116, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 5, "age": 10.94, "grav": 100.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 8308, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 0.522, "bl": 0.0, "ds": 0.0, "txt": "No its not that the proofs themselves translate into anything else. What translates is the mental gymnastic abilities needed to create a really complex proof. Those abilities will also apply e.g. to reasoning about the chain of wffects that would follow from blocking some biological process in some kind of cell."}, {"id": 50637466, "au": "protortyp", "dom": 432, "sr": 117, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 0, "age": 21.14, "grav": 285.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 121, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.217, "fa": 0.0, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "curious whether the techniques behind the upper bound can be turned into practical GPU kernels. I would assume the economic implications would be enormous"}, {"id": 50639309, "au": "monocasa", "dom": 255, "sr": 118, "sc": 3.95, "ep": 3.95, "bs": 0.0, "d": 5, "age": 16.37, "grav": 188.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 30108, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.541, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "A good chunk is also the fact that he's focused so much on the cultural aspects of mathematics, fostering an incredibly collaborative atmosphere with his position.  If instead he wrote those papers and was just a dick to everyone, mathematicians would know him, but he wouldn't be one of the closest things we have to a name in pop math.\n\nThat being said knowing for sure the best case shape of matmul has incredibly huge implications for frontier labs' bottom lines."}, {"id": 50640538, "au": "BoppreH", "dom": 200, "sr": 119, "sc": 3.95, "ep": 3.95, "bs": 0.0, "d": 2, "age": 13.16, "grav": 133.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 7747, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.495, "fa": 0.0, "gp": 0.3, "bl": 0.0, "ds": 0.0, "txt": "Maybe cryptanalysis is much easier than proving the Riemann Hypothesis. Or maybe cryptanalysis actually has more invested resources, secretly, because the ROI is a lot clearer than the PR they're getting with the pure math results, and they can ask the NSA for extra budget.\n\nAnd surely by now they would have broken some of the old ciphers, or improved slightly on attacks that are not yet practical. Instead, there's a huge hole where those results would be."}, {"id": 50637613, "au": "tliltocatl", "dom": 546, "sr": 120, "sc": 3.93, "ep": 3.93, "bs": 0.0, "d": 2, "age": 20.74, "grav": 276.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1072, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.089, "fa": 0.34, "gp": 0.28, "bl": 0.0, "ds": 0.0, "txt": "Given the constants for the known algorithms this is of little practical difference. And even if we find a practical n^2.25 algorithm one day, you would still need pretty large matrices for it to make any difference (i. e. billion rows matrices are only ~200x slower with n^2.25 than with quadratic)."}, {"id": 50640647, "au": "DuncanCoffee", "dom": 357, "sr": 121, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 1, "age": 12.88, "grav": 129.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 130, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.232, "fa": 0.28, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "is math going to become so ridiculously complex and dense than no human can contribute anything meaningful to it?\n\nMy 2.25 cents:\n\n- math can be considered discovered, not invented, It's already \"out there\"\n\n- the problems we want to solve now are the difficult ones, since the easy ones have already been solved\n\n- is there a difference between an unsolved problem, and a demonstration so complex we cannot understand? Unless the solution can be verified experimentally and then used, can we really say we proved it? Or did we just move from one question to another?"}, {"id": 50639986, "au": "torginus", "dom": 258, "sr": 122, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 5, "age": 14.62, "grav": 157.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 8, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.092, "fa": 0.42, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "> navier stokes 110% had no impact on anything applied\n\nI am ignorant about what has been proven, but doesn't this mean fluid dynamics can be simulated to arbitrary precision? I'd think this would have a huge impact on gas turbine design, be it for turbopumps, generators, jet engines, as well as combustion engines and airfoils."}, {"id": 50644313, "au": "boltzmann64", "dom": 293, "sr": 123, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 4, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 55, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.637, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Very skeptical about this. Google invented attention/transformer but it wasn't until OpenAI bet on it that it become profitable, which Google benefits immensely. And like Google internal memo correctly inferred that nobody has any moat. By letting the model out in the open for researchers, everybody benefited. There no reason for Anthropic or OpenAI to gatekeep something as fundamental as O(n^2) matrix multiplication."}, {"id": 50644569, "au": "ralusek", "dom": 233, "sr": 124, "sc": 3.84, "ep": 3.84, "bs": 0.0, "d": 5, "age": 6.18, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 38, "k": 5034, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.071, "fa": 0.42, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "> Would you expect math profs to invent breakthrough cancer treatments if you transplant them to a medical research lab?\n\nI can't tell if you're serious or not. Do you not believe in general intelligence/creativity?\n\n> If so, why don't pharma companies try to poach them with far greater salaries than what they'd get in mathematics?\n\nBecause it's not a sure thing, those people presumably aren't super interested in medical research, and they have no background education in biology/medicine. If you just took the intelligence/creativity of someone working in math, though, and put it in someone that did have the background education: yes, I would expect them to be a great candidate for inventing breakthrough cancer treatments."}, {"id": 50638972, "au": "pastel8739", "dom": 510, "sr": 125, "sc": 3.81, "ep": 3.81, "bs": 0.0, "d": 5, "age": 17.4, "grav": 208.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 664, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.583, "fa": 0.0, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "I actually didn’t intend to ask “how will advancements in math help me”, instead the question I wanted to ask is “do you really not understand?” (perhaps I should have expressed this more clearly).\n\nI can convince myself that advancements in pure math will help people in the future, but I get frustrated by people who are passionate about AI’s capability but seem to be so singleminded that they can’t understand what I believe to be an extremely common opinion that it’s making the world worse. I think it would be beneficial for AI fans to understand where these beliefs are coming from so they can both argue against them, perhaps improving overall morale in the world, and maybe reflect on how they are using AI and possibly change it so that it does positively impact people’s lives as soon as possible."}, {"id": 50638890, "au": "tczMUFlmoNk", "dom": 393, "sr": 126, "sc": 3.8, "ep": 3.8, "bs": 0.0, "d": 3, "age": 17.63, "grav": 212.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 716, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.466, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "\"Problem\" is absolutely not a shortcut for \"the optimal algorithm(s)\". These are important and distinct concepts in computer science.\n\nPerhaps most obviously, one can define problems that have no correct algorithms, like the halting problem. The study and analysis of these problems is critical, and furthermore undecidable problems are themselves different (there is a hierarchy of undecidability), so it is not even the case that \"all problems with no correct algorithms are equivalent\"."}, {"id": 50642202, "au": "odyssey7", "dom": 538, "sr": 127, "sc": 3.79, "ep": 3.79, "bs": 0.0, "d": 1, "age": 9.44, "grav": 80.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.612, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The big, cool result for human mathematicians to date on this problem has been to make the exponent smaller — doing whatever it took to do so.\n\nWith the exponent now bounded — the previously cool result territory has been fully mined out — we may see a pivot to making the algorithms increasingly more practical.\n\nHowever, one of the most valuable companies in the world builds GPUs, so, having accepted those as a fact of life, and with the big theoretical challenge complete in the terms in which it had been posed for decades, maybe matrix multiplication algorithm improvements won’t have the same pull."}, {"id": 50641888, "au": "small_model", "dom": 113, "sr": 128, "sc": 3.79, "ep": 3.79, "bs": 0.0, "d": 2, "age": 9.93, "grav": 86.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 305, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.611, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Cost of hardware + running costs + maintenance + power + replacing hardware failures vs a Claude Max subscription, when do you break even, my guess is 5+ years without access to frontier in all that time.  Incredibly bad use of capital, did you do any kind of cost-benefit analysis or is this a hobby?"}, {"id": 50638674, "au": "thaeli", "dom": 240, "sr": 129, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 3, "age": 18.17, "grav": 223.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1003, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "We've certainly seen crossover before, where models getting better at one thing generates surprising emergent capabilities elsewhere. I don't know that math will do that but I can see why the possibility is enough to be worth putting some serious compute into especially given the relative paucity of alternative perfect-trifecta problem spaces."}, {"id": 50647390, "au": "bonoboTP", "dom": 231, "sr": 130, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 8, "age": 2.25, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 9168, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.522, "fa": 0.0, "gp": 0.077, "bl": 0.0, "ds": 0.0, "txt": "Noticing patterns is a versatile ability. Most of this stuff correlates. If you pick a bunch of bright undergrads who go into top math or physics universities and reroute them to study biology or research medicine instead, they'd likely do very well. (Minus all the idiosyncratic parts of what med school may be like in your particular country and how the training differs from the educational organizational perspective - eg don't come at me with \"your math nerd wouldn't survive the sleepless nights of residency\" or \"they'd faint from seeing blood and bones and sinews in their first year\" etc - this is an analogy for AI, not human social affairs).\n\nWe've been duped about \"multiple kinds of human intelligences\", so that shouldn't be treated as an uncontaminated intuition pump."}, {"id": 50640162, "au": "sigmoid10", "dom": 144, "sr": 131, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 2, "age": 14.08, "grav": 148.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 6787, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.473, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "It's not like LLMs can understand math logic and fail to understand business logic. It's that math is fundamentally logical and business... well simply isn't. There is so much emotion, bad faith and limited information  you can't formalize it into any rule based system that is guaranteed to give you a correct output. You'd need Lean for business, which I'm not even sure can exist under the given constraints."}, {"id": 50641080, "au": "curt15", "dom": 226, "sr": 132, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 4, "age": 11.81, "grav": 112.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Would you expect math profs to invent breakthrough cancer treatments if you transplant them to a medical research lab? If so, why don't pharma companies try to poach them with far greater salaries than what they'd get in mathematics?"}, {"id": 50641914, "au": "odyssey7", "dom": 373, "sr": 133, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 2, "age": 9.89, "grav": 86.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.557, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Folks in the cryptography business pay mathematicians to do research.\n\nBut pure math otherwise has been a pyramid scheme for a while. You take pure math classes in hopes of one day being able to teach other people pure math. Eventually, after blood and tears, most people are “weeded out” of a system that couldn’t actually provide them a job, no matter how talented they could have been, and almost like a roulette wheel a few of them get to perpetuate the cycle.\n\nWho knows. Maybe with AI liberating everyone from the need to make a living, we’ll actually have more pure mathematicians than before."}, {"id": 50638266, "au": "aleph_minus_one", "dom": 526, "sr": 134, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 2, "age": 19.27, "grav": 245.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 17, "k": 5091, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.498, "fa": 0.7, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": "> People also very recently spent a number of years being told they needed to adopt blockchain and nfts\n\nAll the people that I know and who gave this advice clearly told that this only is only a good idea under two assumptions:\n\n1. You are willing to take this risk for a high potential reward.\n\n2. You distrust the government and banks.\n\nUnder these assumptions, this advice can make sense; in any other case, it doesn't."}, {"id": 50638741, "au": "stinkbeetle", "dom": 490, "sr": 135, "sc": 3.65, "ep": 3.65, "bs": 0.0, "d": 3, "age": 18.01, "grav": 219.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 461, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.331, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It doesn't really matter anyway, if AI outclasses humans and can do more better than us and takes the mantle as the supreme create of the earth and we can no longer compete and die out, that's all part of a cycle of history. It's really quite blatant xenophobia in my opinion to be so terrified of that and try to fight against it."}, {"id": 50638238, "au": "procedurecall", "dom": 460, "sr": 136, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 0, "age": 19.32, "grav": 246.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 628, "kpp": 52.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.192, "fa": 0.0, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "The other results they have are equally crazy.\n\nWhat's even crazier, though, is that solving matrix multiplication and strongly polynomial-time linear programming are both easier than writing competent and readable papers."}, {"id": 50638763, "au": "bobmarleybiceps", "dom": 374, "sr": 137, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 1, "age": 17.96, "grav": 218.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 140, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.402, "fa": 0.0, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "I think we'll get to a point where companies lose some interest and won't want to spend lots of millions in compute on this stuff. Then things may slightly stabilize, but who knows.  (though maybe not, math + formal verification tools is probably great for RL training).\n\nMaybe human mathematicians will basically be spending all their time trying to improve the exposition of AI proofs lol"}, {"id": 50640846, "au": "stingraycharles", "dom": 210, "sr": 138, "sc": 3.6, "ep": 3.6, "bs": 0.0, "d": 1, "age": 12.35, "grav": 120.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 17383, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.368, "fa": 0.0, "gp": 0.265, "bl": 0.0, "ds": 0.0, "txt": "There are dozens examples of this, I recall something about Microsoft not being allowed to push a certain fix in Windows as the NSA was apparently using it maybe two decades ago.\n\nIt’s obvious that defense / war will be the most lucrative business for both OpenAI and Anthropic."}, {"id": 50639196, "au": "emil-lp", "dom": 394, "sr": 139, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 4, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1081, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.146, "fa": 0.28, "gp": 0.071, "bl": 0.0, "ds": 0.0, "txt": "This is super-pedantic and not at all how we communicate bounds in the field of algorithms research.\n\nWe say all the time that a problem has a certain running time, that's not a problem at all, because after all, our main question is what time it takes to solve the problem.\n\nYou can simply go to arXiv cs.ds and see for yourself."}, {"id": 50638269, "au": "jaggederest", "dom": 292, "sr": 140, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 4, "age": 19.26, "grav": 245.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 10755, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.454, "bl": 0.0, "ds": 0.0, "txt": "This is a lot closer to what I thought \"RSI\" was going to mean historically - not necessarily better training, but improvements in processing and algorithms that result in global improvements that coincidentally make current AI faster, cheaper, better. I suspect Verilog/VHDL type improvements will show up eventually as custom ASICs too."}, {"id": 50646259, "au": "kortex", "dom": 40, "sr": 141, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 8, "age": 3.74, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 8473, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.429, "fa": 0.0, "gp": 0.138, "bl": 0.0, "ds": 0.0, "txt": "LLMs are of the same stuff of the universe.\n\nThey have a few billion years of interacting with the universe: they are built by us, they are deeply causally linked to us. Every byte of their training data, every atom of silicon, has been shaped by us, who have been shaped by the universe.\n\nIf you wanna get REALLY kooky with it, there's the angle of \"language is an egregore, and it doesn't care too much about substrate\"\n\nI give it a few years."}, {"id": 50648773, "au": "SideQuark", "dom": 447, "sr": 142, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 3, "age": 0.31, "grav": 4.5, "surf": 38.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 3109, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can subdivide any shape into square shapes, and you get the same bound. You only thinking of rectangles, but that rectangle is a square and some leftover, then recurse on the leftover.\n\nMatrix multiplications are recursive on shapes. Play with it by hand a while.\n\nIt's how AI accelerators can process tensors with a fixed size matmul silicon block."}, {"id": 50637539, "au": "brandonb", "dom": 317, "sr": 143, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 0, "age": 20.92, "grav": 280.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 27, "qw": 0, "k": 10060, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://eccc.weizmann.ac.il/report/2026/281/"], "ig": 1.09, "fa": 0.0, "gp": 0.68, "bl": 0.0, "ds": 0.0, "txt": "This result proves a lower bound of Omega(n^2.25); the upper bound of 2.25 was already known.\n\nAn actual algorithm that achieves O(n^2.25) was published recently, although it's far from practical:\n  https://eccc.weizmann.ac.il/report/2026/281/"}, {"id": 50644271, "au": "bdauvergne", "dom": 404, "sr": 144, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 0, "age": 6.55, "grav": 47.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 317, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "A question I'm asking myself these days is doing some reverse experiment: if we just gave ZFC axioms to those LLMs no access to any mathematical literature and no Princeton alumni as a steward would they be able to reach those results again autonomously ? How far can they think and develop knowledge and concepts by themselves ? Has this been tried in anyway ?"}, {"id": 50639894, "au": "dash2", "dom": 141, "sr": 145, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 1, "age": 14.85, "grav": 161.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 8929, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 0.693, "fa": 0.0, "gp": 1.219, "bl": 0.0, "ds": 0.0, "txt": "You're assuming that frontier maths problems are harder than summarizing headlines for a CEO. It's possible that for an llm the reverse is true. They can have incredible talent at the nerdy side of things, and still struggle with the messy task of making sense of reality, understanding implicit knowledge, etc. That's my impression from grading them, anyway."}, {"id": 50640497, "au": "utopiah", "dom": 199, "sr": 146, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 1, "age": 13.24, "grav": 134.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 1993, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.347, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Isn't that assuming there is a roughly similar amount of actually invested resources to tackle both set of problems?\n\nAlso a little while ago I tinkered to switch the OpenSSL backend on my test server to support Kyber for PQC. The math behind all this is not trivial, obvious, but switching from one algo to the other is actually trivial. Sure it'd be a mess for a bit, especially with... as always unmaintained old systems, that's nothing new.\n\nSo I'm not saying breaking the most popular crypto algorithm is a nothingburger BUT I would still argue it wouldn't be the end of the World as we know it.\n\nWe are already seeing a bunch of security issue with a lot more boring stuff, like unpatched vulnerabilities."}, {"id": 50641382, "au": "galkk", "dom": 27, "sr": 147, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 5, "age": 11.01, "grav": 101.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1959, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "This is same “god of gaps” argument, but about intelligence. No matter what ai already does (writes banger music, crushes long standing math problems in a span of months), it still won’t be enough. It doesn’t have soul, you know…"}, {"id": 50639206, "au": "rurban", "dom": 267, "sr": 148, "sc": 3.34, "ep": 3.34, "bs": 0.0, "d": 3, "age": 16.6, "grav": 192.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 7486, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.009, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm doing my own training. In my case a training run lasts 3 weeks on a couple of H100's, whilst the inference can be done on a single 5090 in seconds. It's more like 99%. Inference is incredibly cheap, training is extremely expensive."}, {"id": 50639735, "au": "adventured", "dom": 30, "sr": 149, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 3, "age": 15.31, "grav": 169.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 40313, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "All the frontier models are demonstrating advanced math capabilities at this point. They have been incremented forward enough in capability that this was inevitable.\n\nNo, it's not an unattributed human accomplishing all of these remarkable math outcomes produced by LLMs over the past year.\n\nEvery time the frontier pushes forward a notch, it will enable new capabilities to knock out more things humans have not managed to up to this point."}, {"id": 50645065, "au": "danielmarkbruce", "dom": 234, "sr": 150, "sc": 3.29, "ep": 3.82, "bs": 0.53, "d": 6, "age": 5.46, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 5248, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.627, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "The idea that a math professor brings some magic into biotech is silly. They are almost certainly capable of being another researcher in a lab, but the idea that it would be more than that is the silliest thing ever.\n\nQuant hedge funds have lots of math phds. Math phds are, with few exceptions, just as interested in making oodles of money as the next guy. If they had a decent chance to create a breakthrough in biotech, they'd be doing it and making billions. They are not."}, {"id": 50640074, "au": "LunaSea", "dom": 83, "sr": 151, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 1, "age": 14.36, "grav": 153.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2535, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 0.893, "fa": 0.28, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "Silly question but if you produce a Lean proof that matrix multiplication complexity is O(n^(9/4)), does it bring you closer to finding an algorithm that actua
