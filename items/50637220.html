g pairs of numbers together then summing them (you probably know this already)\n\n- Without any optimization, this process is o(n^3)\n\n- You can make this faster if you share a multiplication or sum across multiple places\n\n- By sharing sums / multiplication operations the maximum efficiency is o(n^2.25)\n\nI studied Economics, not CS so I'm a bit hazy on what big o actually means, to be honest."}, {"id": 50640069, "au": "BoppreH", "dom": 181, "sr": 2, "sc": 14.22, "ep": 14.22, "bs": 0.0, "d": 0, "age": 14.37, "grav": 153.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 77, "qw": 0, "k": 7747, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": ["https://www.reuters.com/article/us-usa-security-rsa-idUSBRE9BJ1C220131220/"], "ig": 1.866, "fa": 2.42, "gp": 2.028, "bl": 0.0, "ds": 0.0, "txt": "There's a snowball's chance in hell that they haven't found any cryptographically-relevant results. And given how security averse the NSA has been (they pushed NIST to standardize a backdoored random number generator then paid the RSA company $10 million to use it[1]), I have the feeling that the findings won't be used to strengthen cybersecurity, but as weapons.\n\nMore reason to invest in crypto agility, I guess. I just hope that they haven't broken all public key crypto, life is hard enough already.\n\n[1] https://www.reuters.com/article/us-usa-security-rsa-idUSBRE9..."}, {"id": 50638676, "au": "_alternator_", "dom": 2, "sr": 3, "sc": 13.79, "ep": 13.79, "bs": 0.0, "d": 1, "age": 18.16, "grav": 223.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 168, "qw": 0, "k": 2234, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://github.com/openai/math/blob/main/preprints/Euclidean-geometry-in-the-asymptotic-spectrum-of-tensors-November-24-2026/paper.pdf"], "ig": 1.928, "fa": 2.63, "gp": 1.213, "bl": 0.0, "ds": 0.0, "txt": "I've just started looking at where these results are coming from, and it seems that these four results actually all stem from a more fundamental result. This is in contrast to many of the other papers where disparate results come from more ad hoc and disjointed arguments.\n\n\"The other papers in this collection use different aspects of this framework. Shared labels occur in the sunflower argument [29], and high-dimensional placements distinguish cuts of arithmetic computations [26]. Spectral comparison and network compression enter the circuit lower bounds [28]. Further applications concern Fourier transforms, integer multiplication on tapes, and matrix multiplication [25, 27, 30].\"\n\nThat's a fundamental theoretical breakthrough, and they've done some work to present it more cleanly than the other results. It's an interesting result on it's own, but the link between this theoretical result and the other, more impactful results will take a while for me to understand. TBH this is the first of these mathpocalypse papers where I really want to understand the proofs because it feels like there is something truly worth knowing here.\n\nhttps://github.com/openai/math/blob/main/preprints/Euclidean..."}, {"id": 50638281, "au": "rao-v", "dom": 216, "sr": 4, "sc": 13.55, "ep": 13.55, "bs": 0.0, "d": 1, "age": 19.23, "grav": 244.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 116, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://github.com/kinchahoy/inventing-rl-tasks"], "ig": 2.034, "fa": 2.08, "gp": 1.963, "bl": 0.0, "ds": 0.0, "txt": "Open math problems are a beautiful source of frontier-model-hard reinforcement learning signal. They are the magic trifecta of known hard, perfectly resistant to contamination risk and precisely verifiable.\n\nThey absolutely will want to use them as impeccable signal for model improvement as long as they can. (It's an interesting theorycraft puzzle to wonder if publishing solutions is a bit about poisioning the well for competitors' RL training ... but I don't actually believe that works)\n\nFor what it's worth, I've played with trying to develop new classes of scalable frontier RL problems that scale, and it's not easy to come up with them: https://github.com/kinchahoy/inventing-rl-tasks. Thoughts welcome, and I'm sorry to report I'm planning to blog a bit on the subject over the holidays."}, {"id": 50638172, "au": "scythe", "dom": 427, "sr": 5, "sc": 13.09, "ep": 13.09, "bs": 0.0, "d": 3, "age": 19.49, "grav": 250.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 66, "qw": 0, "k": 9077, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://ntrs.nasa.gov/citations/19900033776"], "ig": 1.792, "fa": 2.63, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "Consider that matrix determinants are zero when the rows are linearly dependent. In fact the most efficient way to test if n rows of length n are linearly independent is to invert the matrix using variants of the famous multiplication algorithms. For example, Strassen's famous multiplication optimization also generates an inversion algorithm [1]. So it's not entirely surprising that comparing lists shows up in an evaluation of matrix algorithms.\n\n1: https://ntrs.nasa.gov/citations/19900033776"}, {"id": 50639996, "au": "hadlock", "dom": 101, "sr": 6, "sc": 10.9, "ep": 10.9, "bs": 0.0, "d": 1, "age": 14.59, "grav": 156.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 23, "k": 3865, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 2.069, "fa": 1.37, "gp": 1.473, "bl": 0.0, "ds": 0.0, "txt": ">Open weight models are to the point that most business cases are completely solved by them, at a fraction of the price of Claude\n\nWe just bought our second \"AI server\" (a box with ~256gb ram and a 96gb vram RTX6000) to run open weight models, because we're getting ~$2900/day of \"sonnet quality\" tokens out of it and allows us to do silly things like summarize project emails and do sentiment analysis when they're not running at 100% capacity. Plus the fact that after 4 months all the tokens are fully ROI'd and everything is just the cost of electricity. I don't know how Anthropic, OpenAI etc aren't going to race to the bottom with the Chinese trying to capture business bulk AI market. I guess Luna was an attempt at that, but as long as Anthropic keeps charging $$$ for Sonnet, it makes our ROI numbers look ridiculously good. Plus data sovereignty; none of our data leaves he building, and all the other side benefits.\n\nThe second box has room for 10x RTX6000, so we expect to keep buying more as we ramp up over the next year."}, {"id": 50637238, "au": "mmoskal", "dom": 473, "sr": 7, "sc": 10.81, "ep": 10.81, "bs": 0.0, "d": 0, "age": 21.79, "grav": 300.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 15, "qw": 0, "k": 801, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://github.com/openai/math/blob/3344da59991ed94f9ba711217b29c1d760badfa6/history.md\u0023november-24-2026"], "ig": 0.576, "fa": 2.69, "gp": 1.233, "bl": 0.0, "ds": 0.0, "txt": "...and 8 other results: https://github.com/openai/math/blob/3344da59991ed94f9ba71121...\n\nThe matmul result is that omega is exactly 2.25, not just lower bound."}, {"id": 50640511, "au": "Arkhaine_kupo", "dom": 43, "sr": 8, "sc": 9.92, "ep": 10.07, "bs": 0.0, "d": 6, "age": 13.21, "grav": 134.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 358, "qw": 78, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 2.038, "fa": 1.04, "gp": 1.598, "bl": 0.0, "ds": 0.0, "txt": "> in November 2026, we have AI systems that can do things like derive general relativity with a data cutoff before it.\n\nThe test proposed by DeepMind as a sign of AGI that no one has even gotten close to? That Sam Altman believes would be attemptable in 2028?\n\nPlease share a source, cause you will make a shit ton of money if OpenAI and Google haven't heard about it\n\n> \"It hasn't been proven the models can do this\" could've been said about every AI news story 6 months before the story.\n\nNo. People who know little about math or computer science keep getting impressed. People who follow the space have all been quite aligned in expectations.\n\nThe biggest leaps where going from RL to Transformers, because the lineral relationship between compute/training and performance solved the issues of overfitting epoch and finicky training\n\nand the agentic harnessing which allowed for creating minimising function end goals that then worked in essentially a model loop  that works towards reaching the assigned goal.\n\nWith those two breakthroughs almost everyone could predict they would work well for some math problems that have convergent answers, that they would work well for computer science which has testable expectations and so on.\n\nIn the same way that we can predict that some of the inherent limitations of LLM vector spaces will probably make it a dead end for a fully embodied AGI, and why"}, {"id": 50638338, "au": "seizethecheese", "dom": 261, "sr": 9, "sc": 9.9, "ep": 10.05, "bs": 0.0, "d": 2, "age": 19.06, "grav": 241.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 108, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://github.com/bottomless/agent-duel", "https://micjm.com/blog/get-ready-for-fewer-opus-5.5-em-dashes/"], "ig": 1.394, "fa": 1.78, "gp": 1.173, "bl": 0.0, "ds": 0.0, "txt": "The last time this came up I looked into it and concluded that Opus probably was nerfed. This was leading up to the Fable release in early November.\n\nThe earlier conclusion was from votes through our open source battle system on OpenCode (https://github.com/bottomless/agent-duel) so the data is pretty well controlled. (I've seen other claims of nerfing that are a single time series, but tasks could change.)\n\nI just re-ran the same analysis and there's no nerfing at all right now. In fact Opus 5.5 thinking compared to opponents actually rose slightly in last five days compared to before that.\n\n(Previous analysis is here, I think they also tweaked the model then becuase em-dashes plummeted https://micjm.com/blog/get-ready-for-fewer-opus-5.5-em-dashe...)"}, {"id": 50643176, "au": "nater5000", "dom": 159, "sr": 10, "sc": 9.86, "ep": 10.0, "bs": 0.0, "d": 1, "age": 7.86, "grav": 61.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 553, "qw": 92, "k": 824, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.828, "fa": 1.32, "gp": 1.343, "bl": 0.0, "ds": 0.0, "txt": ">If even the prestige from Riemann's Hypothesis couldn't boost ANT\n\nThis isn't a very valid take away from all of that. Although I do concur that solving the Riemann Hypothesis didn't specifically do much in terms of building any significant hype around Anthropic, that's surely because it was considered inevitable at this point due to the other problems solved by these labs recently. From that broader perspective, I do think both labs (and AI, in general) are receiving a ton of hype (appropriately). It's just \"spread out\" so it's hard to see.\n\nBeyond that, trying to correlate such hype with the stock price of one of these companies is just foolish. The market is primarily driven by macroeconomics. Anthropic is entering the market just as there's a tech sell-off occurring. Any sort of positive effect from this kind of news will definitely be overshadowed by the movements of the market as a whole. Similarly, solving the Riemann Hypothesis doesn't really change any of the financial dynamics of Anthropic significantly. Like, who wasn't convinced to invest in them before they solved the Riemann Hypothesis who will now be convinced because they can? Those who would have been swayed by such capabilities (and have the capital to make an impact) will have already assessed these capabilities a while ago (i.e., my first point).\n\n>Open weight models are to the point that most business case"}, {"id": 50637509, "au": "orlp", "dom": 541, "sr": 11, "sc": 9.76, "ep": 9.98, "bs": 0.0, "d": 1, "age": 21.02, "grav": 283.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 15, "qw": 0, "k": 8985, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://github.com/openai/math/blob/main/preprints/Matrix-Multiplication-Nine-Fourths-October-2-2026/paper.pdf"], "ig": 0.625, "fa": 2.35, "gp": 1.248, "bl": 0.0, "ds": 0.0, "txt": "No it doesn't, it proves a lower bound of 2.25.\n\nThe upper bound of 2.25 was found earlier https://github.com/openai/math/blob/main/preprints/Matrix-Mu...."}, {"id": 50641525, "au": "BoppreH", "dom": 202, "sr": 12, "sc": 9.7, "ep": 9.85, "bs": 0.0, "d": 4, "age": 10.68, "grav": 96.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 203, "qw": 45, "k": 7747, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 2.104, "fa": 0.92, "gp": 1.571, "bl": 0.0, "ds": 0.0, "txt": "Good questions.\n\nBy RoI I was thinking of impact vs effort, not necessarily positive/negative reactions. I'm also not sure that the first reaction would be negative, as long as they frame it carefully, for example \"OpenAI proves that RSA was insecure all along and foreign intelligence agencies could have been reading American communications\".\n\nThey could also have a deal with the NSA to provide models in dedicated, private hardware. \"Of course we were lending our models to the NSA, it's a matter of national security! Broken RSA? No idea, part of the contract is that we're not allowed access to the transcripts.\" Money without backlash.\n\n> And there is nuance here. Let's say you go for low hanging fruits, and break SHA1, 3DES or RSA-1024 completely. Well, you just forced a lot of legacy systems that were already deemed insecure to shut down. Not a whole lot of RoI on your side though.\n\nIf the low-hanging fruit is not relevant anymore, then there's no reason to not include the results along other number theory proofs, and get PR for being so good at math. If the low-hanging fruit is still marginally relevant, the implication makes it a good advertisement for defense contracts.\n\nThey've managed to, so far, shrug off the intellectual property theft accusations, the psychological damage to users, the societal issues from labor replacement, the inherent risks of developing smart AI, e"}, {"id": 50637782, "au": "zone411", "dom": 1, "sr": 13, "sc": 9.42, "ep": 10.16, "bs": 0.0, "d": 0, "age": 20.35, "grav": 268.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 103, "qw": 0, "k": 4382, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://proofatlas.ai/open-problems/"], "ig": 2.157, "fa": 0.96, "gp": 1.621, "bl": 0.0, "ds": 0.0, "txt": "For context, OpenAI's 4 new papers resolve 8 problems of the Top 500 Open Problems in Math list (LLM ranked, https://proofatlas.ai/open-problems/).\n\nThey include:\n\u002325 — Matrix-multiplication exponent equals two. The paper gives the exact exponent 9/4 over every field, refuting the conjecture.\n\n\u002389 — Strongly polynomial linear programming (Smale’s ninth problem). The same paper also gives polynomial-time algorithms for\n\u002364 — Mean-payoff games,\n\u002365 — Parity games,\n\u0023340 — Condon’s simple stochastic games.\n\n\u0023183 — Polynomial diameter bound for polytopes,\n\u0023130 — Polynomial pivot rule for the simplex method, both refuted. Some pairs of vertices are superpolynomially far apart.\n\n\u0023137 — Erdős–Rado sunflower conjecture. For every fixed number of petals r, the paper proves the conjectured Cᵣᵏ bound.\n\n(rankings post Riemann (\u00232) and VP vs VNP (\u002331))."}, {"id": 50640771, "au": "hadlock", "dom": 109, "sr": 14, "sc": 9.15, "ep": 9.44, "bs": 0.0, "d": 4, "age": 12.55, "grav": 123.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 6, "k": 3865, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 2.031, "fa": 1.1, "gp": 1.059, "bl": 0.0, "ds": 0.0, "txt": ">presumably because they get a rough approximation\n\nCorrect; however the main point I was trying to make was: supporting OP's point that most business processes simply do not need very smart AI to get done. They just don't. Most batch processing AI tasks don't need a 50b model, because they're by nature short horizon, modular, templated tasks. We were on Qwen 3.5 era models and when the Qwen 3.8 models came out (which included a 27B  \"dense\" model, but no 35B-A3B MoE)... we saw no reason to \"upgrade\" to the \"smarter\" model, because we would take an enormous speed/performance hit.\n\nWe're upgrading to 256GB system ram because Qwen Flash Next is an A10B model which is quite \"smart\" and you can hold the inactive \"experts\" in system ram and swap them out with a 80% prediction rate. But we'll keep the other server running the 35B-A3B probably for a long time, it's an excellent, extremely fast batch processing model for what we're doing with it."}, {"id": 50648112, "au": "enugu", "dom": 405, "sr": 15, "sc": 9.09, "ep": 9.09, "bs": 0.0, "d": 1, "age": 1.29, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 34, "qw": 0, "k": 457, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://www.ams.org/journals/notices/202607/rnoti-p587.pdf"], "ig": 0.614, "fa": 2.35, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "Peter Sarnak has asked this question https://www.ams.org/journals/notices/202607/rnoti-p587.pdf\n\nBut unlike board games where this has been achieved, it seems harder in the case of LLMs where a training set of past material is an essential starting point."}, {"id": 50638586, "au": "verandaguy", "dom": 307, "sr": 16, "sc": 8.99, "ep": 9.8, "bs": 0.0, "d": 1, "age": 18.4, "grav": 227.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 304, "qw": 0, "k": 2308, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 2.055, "fa": 0.84, "gp": 1.777, "bl": 0.0, "ds": 0.0, "txt": "On your last point: when talking about algorithms in the abstract, we still use similar structures to those used in programming; loops and branches (if/else) are the most critical in many of the common complexity analysis cases (big-O, little-O, big-Theta).\n\nBig-O specifically refers to the worst-case time or space complexity of an algorithm. Assume that your algorithm operates on an input of n elements. Then:\n\n- A straight iteration over every element (`for item in items: print(item)`) runs in linear time: O(n) for n elements.\n\n- If your algorithm has a nested loop, and each of the loops has a bound which is either literally n, or derived from n, this is quadratic time (O(n^2)). For example, this naïve search for duplicates:\n\n    for item in items:\n        for dupe_candidate in items:\n            if item == dupe_candidate:\n                print(f\"{item} is a dupe!\")\n\nThis extends into higher powers (O(n^3), O(n^4), etc)) with deeper nesting of loops, and if inner loops are dependent upon other input parameters, you can use a separate variable for that (O(n^m) for example).\n\n- There are also cases where algorithms run in sub-linear time. Two very common cases for that are logarithmic time (O(log(m, n)), which often comes up in algorithms over height-balanced search trees of arity m, and constant time (O(1)), which means that regardless of the input size, the algorithm will run "}, {"id": 50642288, "au": "lou1306", "dom": 93, "sr": 17, "sc": 8.95, "ep": 9.39, "bs": 0.0, "d": 2, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 14, "qw": 0, "k": 2415, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/openai/math/blob/main/preprints/Mean-payoff-parity-games-in-quasipolynomial-time-October-5-2026/mean-payoff-parity.pdf"], "ig": 0.402, "fa": 2.63, "gp": 0.658, "bl": 0.0, "ds": 0.0, "txt": "Also, the only preprint I can find features  mean-payoff + parity, not parity games in general. (https://github.com/openai/math/blob/main/preprints/Mean-payo...)"}, {"id": 50642455, "au": "rybosome", "dom": 114, "sr": 18, "sc": 8.94, "ep": 9.38, "bs": 0.0, "d": 3, "age": 9.05, "grav": 75.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 0, "k": 1915, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 2.085, "fa": 0.95, "gp": 1.223, "bl": 0.0, "ds": 0.0, "txt": "This use case would require API key based usage rather than subscription based, and that’s an enormous cost difference.\n\nI don’t know the exact numbers, but anecdotally: I was burning easily $200 per day in tokens from API keys for a research factory setup recently. To reduce cost I went through the trouble of inverting the cloud based execution model so it could run on my laptop and use a subscription from a coding agent by driving the coding agent directly. Now, at a $200/month sub, I am just tapping out my weekly usage by letting this thing run 24/7.\n\nLoosely that’s a 30x cost difference, and that doesn’t even take into account parallelism. OP mentioned being able to get up to 100 concurrency in another comment, I think, which is not possible on the subscription and would just increase the absurd API key rates by 100x as well.\n\nIf you have extremely heavy token usage that’s not amenable to subscription usage - and many tasks aren’t - then local models actually start to make financial sense very quickly."}, {"id": 50644090, "au": "meowface", "dom": 51, "sr": 19, "sc": 8.58, "ep": 9.87, "bs": 0.85, "d": 7, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 201, "qw": 109, "k": 12279, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.695, "fa": 1.65, "gp": 0.812, "bl": 0.32, "ds": 0.0, "txt": "\"Ai is obviously a huge space, but you cannot somehow pretend that for example any medical advance resulting from AlphaFold protein library counts as an AI solved disease.\"\n\nBut I said 2036, not 2026.\n\n>The test proposed by DeepMind as a sign of AGI that no one has even gotten close to? That Sam Altman believes would be attemptable in 2028?\n\nBut end of 2028 is not 2026.\n\n(He didn't make any specific prediction about when it may be able to do that, but he said he thinks it is a definition of AGI and that he thinks there will be AGI by end of 2028. To me, that would be closer to ASI and not AGI.)\n\n>No. People who know little about math or computer science keep getting impressed. People who follow the space have all been quite aligned in expectations.\n\nEvery day I see recommended videos and tweets and blogs from esteemed math and computer science professors and researchers and they're all blown away. Even the ones who don't like how non-human-aimed the proofs are all say they are extremely impressed.\n\n>In the same way that we can predict that some of the inherent limitations of LLM vector spaces will probably make it a dead end for a fully embodied AGI\n\nNo we can't.\n\n> and why people like Yann Lecunn are more interested in world models. Why latent space modeling and things like the Plato Representation Hypothesis are gaining a lot of attention and so on.\n\nLeCun is essentially a cr"}, {"id": 50641269, "au": "Arkhaine_kupo", "dom": 55, "sr": 20, "sc": 8.27, "ep": 8.71, "bs": 0.0, "d": 8, "age": 11.32, "grav": 105.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 160, "qw": 38, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": ["https://news.ycombinator.com/item?id=49796590", "https://news.ycombinator.com/item?id=50120337"], "ig": 1.435, "fa": 1.38, "gp": 0.972, "bl": 0.0, "ds": 0.0, "txt": "> This is blatantly false. No one in math community was expecting GRH six months ago.\n\nhttps://news.ycombinator.com/item?id=49796590\n\nHere is a comment from a user on this very site conjecturing that the kind of problems it solved would point towards, but was surprisingly absent, of an RH solution.\n\nThis is a random user just extrapolating from the kind of incremental results OpenAI was publishing\n\nHere is another user predicting the kind of extreme-depth algebraic grinding (such as proofs requiring hundreds of nested lemmas)\n\nhttps://news.ycombinator.com/item?id=50120337\n\n> Rather than the hindsight 20/20 of “of course, I knew this was coming!”, why don’t you enlighten us about what we can expect in May 2027?\n\nI think by May 2027 it will have (if they dont run out of money or time or interest) advanced even further in the list of problems with convergent solutions and provable lean formulations. I will also expect that some of them will fail when checked manually, due to some bug, loophole or missing condition in the prescribed Lemma's in Lean\n\nI also think when minimised, if possible, most of the proofs wont include many novel approaches. They will rely on proofs by contradiction and other well trodden paths, many of which can probably be expressed much more neatly than 250k pages"}, {"id": 50642774, "au": "phkahler", "dom": 5, "sr": 21, "sc": 8.21, "ep": 8.87, "bs": 0.0, "d": 4, "age": 8.54, "grav": 69.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 24044, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.96, "fa": 0.68, "gp": 1.604, "bl": 0.0, "ds": 0.0, "txt": "From that article:  \"Unlike a human, Astra was able to tackle the problem from both ends at once: working forward from the scant facts of the 1808 journey pictured in the sketchbook and backwards from the immense number of surviving facts about 1808 British North America in general.\"\n\nThe only things superhuman in that story are the AIs ability to run down every lead and maintain a huge context to make connections. That is a real superpower that it has, but the author even says the only way a human could have found the result is if they made it their lifes work. AI isn't super human, it's super fast, super persistent, and has a large working memory.\n\nIt also helps that due to training on the entire internet, it comes with a general (and often detailed) knowledge of every topic known to man. That's its starting point. When I have AI do work on open source software, there is an advantage that commercial software does not get. All of the big AIs have already seen our source code so the high level structure is part of it training, which means that level does not need to be learned in-context."}, {"id": 50638906, "au": "dzdt", "dom": 224, "sr": 22, "sc": 8.21, "ep": 8.5, "bs": 0.0, "d": 3, "age": 17.58, "grav": 211.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 8308, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 2.032, "fa": 0.0, "gp": 2.57, "bl": 0.0, "ds": 0.0, "txt": "I would expect big crossover effects in lots of domains. A huge part of the challenge in developing complicated math proofs is in keeping a coherent strategy/narrative/approach across a task which is too large to have the full details in active context at the same time. Humans do this by compressing the problem using layers of higher level objects on top of lower level ones and moving up and down the stack to reason at higher or lower levels. The low-level coherence comes from the existence of the higher level reasoning. I would expect an AI which is good at math proofs to have strong latent skills at that kind of level-shifting which will cross-apply broadly to other tasks."}, {"id": 50640465, "au": "jll29", "dom": 350, "sr": 23, "sc": 8.11, "ep": 8.98, "bs": 0.0, "d": 0, "age": 13.32, "grav": 135.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 6031, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.915, "fa": 0.96, "gp": 1.206, "bl": 0.0, "ds": 0.0, "txt": "Finding lower bounds for fast matrix multiplication also has implication on complexity bounds for natural language parsing algorithms, since the two tasks have been shown to be equivalent, i.e. syntax parsing can be described as a sequence of matrix multiplications [1,2].\n\n[1] Valiant, Leslie G. (1975) \"General Context-Free Recognition in Less Than Cubic Time\" Journal of Computer and System Sciences, 10(2), 308–315.\n\n[2] Lee, Lillian (2002) \"Fast Context-Free Grammar Parsing Requires Fast Boolean Matrix Multiplication\" Journal of the ACM, 49(1), 1–15."}, {"id": 50637723, "au": "csheehan10", "dom": 424, "sr": 24, "sc": 7.88, "ep": 9.51, "bs": 0.0, "d": 1, "age": 20.49, "grav": 271.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 31, "qw": 0, "k": 94, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": ["https://github.com/openai/math/blob/main/preprints/Matrix-Multiplication-Nine-Fourths-October-2-2026/paper.pdf", "https://eccc.weizmann.ac.il/report/2026/281/"], "ig": 0.792, "fa": 2.35, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "This paper only shows the lower bound, i.e. that no algorithm can do better than n^2.25.\n\nThe upper bound, that n^2.25 can be achieved was shown here: https://github.com/openai/math/blob/main/preprints/Matrix-Mu...\n\nIt was translated into an algorithm here:\nhttps://eccc.weizmann.ac.il/report/2026/281/"}, {"id": 50645887, "au": "otherjason", "dom": 112, "sr": 25, "sc": 7.82, "ep": 8.48, "bs": 0.0, "d": 4, "age": 4.35, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 235, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.582, "fa": 1.23, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "Given the other comments he has posted in this thread, I think the $2900 must be a typo. Even assuming the $10/Mtoken output price for Sonnet 5.5, in order to hit 290 million tokens per day, you would need over 3000 tokens/second continuously for the entire day. This is 3-5x the throughput that he mentioned seeing under highly concurrent loads. So maybe $900/day is more likely?\n\nThere was also reference elsewhere in the thread invoking DeepSeek-V4.1-Flash-1017 as a possible Sonnet 5.5 “equivalent”. That could be true, but you are not running that on a single RTX 6000 Pro unless you have very aggressive quantization and little KV cache room.\n\nFor reference, pricing for a server with dual EPYC 9355 CPUs, 1.5 TB of RAM, and 2 RTX 6000 Pros (with room for expansion to 8) was ~$96k earlier this quarter when we bought one."}, {"id": 50639816, "au": "Arkhaine_kupo", "dom": 31, "sr": 26, "sc": 7.74, "ep": 8.62, "bs": 0.0, "d": 4, "age": 15.06, "grav": 165.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 19, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.822, "fa": 0.7, "gp": 1.615, "bl": 0.0, "ds": 0.0, "txt": ">  it will enable new capabilities to knock out more things humans have not managed to up to this point.\n\nThis has not been proven btw. Experiments where training sets have had obvious cut offs, like before the discovery of general relativity or quantum theory where unable to make the leaps neccesary for new areas of discovery.\n\nwhat we are seeing in math is that some problems have convergent solutions, therefore methodologically if you can define a loss function that you can minimise, they seem to be able to work through it until they reach a final answer.\n\nBut most advances in math are not methodological, they are categorical. Topology doesnt come from thinking about a better solution for matrix multiplication. It comes from thinking about deforming spaces."}, {"id": 50641883, "au": "rocqua", "dom": 189, "sr": 27, "sc": 7.58, "ep": 7.88, "bs": 0.0, "d": 2, "age": 9.93, "grav": 86.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 9935, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.651, "fa": 0.96, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "Factoring in P would remove the convenient security argument that breaking RSA is in a whole different complexity class than verifying/decrypting RSA.\n\nBut if it is some galactic algorithm with a large constant factor and exponent 20, then you can still double the security of an RSA key by making the key 3% larger. That gives a pretty decent security margin."}, {"id": 50644434, "au": "codethief", "dom": 127, "sr": 28, "sc": 7.45, "ep": 8.11, "bs": 0.0, "d": 7, "age": 6.37, "grav": 45.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 53, "qw": 22, "k": 5881, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": ["https://www.anthropic.com/research/claude-black-hole-physics"], "ig": 1.604, "fa": 1.04, "gp": 0.951, "bl": 0.0, "ds": 0.0, "txt": "> I seem to recall that there have been a handful (two, for sure) AI-generated theoretical physics results.\n\nI assume you're talking about the recent \"black hole physics\" results[0]? (Putting them in quotation marks because those are results for specific \"toy\" models, not our actual universe.)\n\n> Pros: exabytes of data to play with.\n\nWhat data are you referring to here? In black hole physics (more generally: fundamental physics) there is practically zero experimental data to test theories against.\n\n[0]: https://www.anthropic.com/research/claude-black-hole-physics"}, {"id": 50645204, "au": "bob1029", "dom": 187, "sr": 29, "sc": 7.21, "ep": 7.65, "bs": 0.0, "d": 2, "age": 5.24, "grav": 35.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.473, "fa": 0.95, "gp": 1.02, "bl": 0.0, "ds": 0.0, "txt": "O(n^100) is technically polynomial. But with 4096 bits of key material, this would be absolutely ridiculous to attack.\n\nIf this math stuff is making you nervous about your current RSA scheme, I'd recommend moving to ECDSA with P-384 or P-521 curves. P-521 gets you close to the nominal classical strength of AES256 which is effectively immune to quantum concerns. It also saves you from the scaling problems with massive RSA keys."}, {"id": 50643177, "au": "zahlman", "dom": 316, "sr": 30, "sc": 7.14, "ep": 8.53, "bs": 0.0, "d": 1, "age": 7.86, "grav": 61.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 602, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.868, "fa": 1.12, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "All of the big-O notation (and variants) is a way to measure how the demands of a task grow as the input size grows. We care about this because if one program simply does a task twice as fast as another, or one has a bit less startup time than the other, then we could always make up that difference with a faster computer. That is, if the two algorithms are in the same \"complexity class\" then the problem size doesn't matter and the performance just depends on our hardware. But if one of them uses an algorithm with a lower complexity, then we can — in principle — always make that program come out ahead, regardless of the hardware, by simply making the problem bigger.\n\nOf course, that's at a hand-wavy, theoretical level. We assume that a bunch of smaller pieces simply take a set amount of time (for example, in this matrix multiplication result, we don't care about how long it takes to multiply really big numbers together compared to small ones, mainly because a really big matrix doesn't necessarily have bigger numbers in it than a small one). And we don't care, when we do these proofs, about whether the algorithms are practical. (In fact it's common in the real world that we use a \"slow\" algorithm because the \"faster\" one requires impossibly large problem sizes to show its benefit; maybe we'd have to wait past the end of the heat death of the Universe even in the best case). And m"}, {"id": 50642358, "au": "gosub100", "dom": 138, "sr": 31, "sc": 6.85, "ep": 7.73, "bs": 0.0, "d": 4, "age": 9.22, "grav": 77.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 1286, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.6, "fa": 0.95, "gp": 0.872, "bl": 0.0, "ds": 0.0, "txt": "Fusion isn't a math problem needing to be solved. The physics are well understood. It's an engineering problem that needs \"solving\" - if it's even solvable. Just for starters, you need to create an environment hotter than the core of the sun. Then you need to harvest the energy in a way that is net-positive. The best possible case has about 50% loss. So make ~3X the energy you need so you can produce 1.5x units of electricity, take the 1 to power the fusion and sell the remaining .5.\n\nI'm not sure how AI can help solve that problem; I won't say never but it doesn't present itself as an AI problem."}, {"id": 50641695, "au": "zahlman", "dom": 440, "sr": 32, "sc": 6.75, "ep": 6.75, "bs": 0.0, "d": 2, "age": 10.31, "grav": 91.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 183, "qw": 20, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.942, "fa": 0.42, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "> failed to convince me that this tech will ever escape the containment of a terminal / deterministic processes that can be verified.\n\nThe problem is the agency we extend to them. We've already shown a willingness on an individual level to basically let them operate our computers at a level that more or less represents owning the computer, while paying for the privilege. And the recent cyberattacks have highlighted how much stuff is needlessly connected to the Internet in a way that can result in real damages if maliciously operated. And the recent Huggingface stuff, explosion of CVEs etc. has shown that Internet-connected systems may be vulnerable to a frankly embarrassing extent in spite of whatever security theatre we have.\n\nPut those pieces together and the potential for catastrophe is pretty clear. The terminal and deterministic processes are not at all meaningful \"containment\"; if anything they're the opposite. \"Containment\" would be if agent harnesses could somehow only possibly exist on physically airgapped hardware.\n\nAnd yes, of course these risks — like, the knobs to turn to cause problems — existed pre-LLM. But now there is ridiculously more potential to automate attacks in fuzzy ways that couldn't directly be scripted, and ridiculously more compute that people could harness for them."}, {"id": 50640418, "au": "dsign", "dom": 470, "sr": 33, "sc": 6.65, "ep": 6.65, "bs": 0.0, "d": 0, "age": 13.43, "grav": 137.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 3579, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.941, "fa": 0.28, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "This is good.\n\nA lot of people have been questioning \"what's the point of this kind of math marketing? Does it affect the stock valuation\"? Then they'll go and say something negative about these companies, which is often merited and well-founded, but it is, in this particular case, a bit of a cynicism overload.\n\nThe world has many problems; and a lot of them require solutions from the humanities. But some of the biggest ones should be taken away from the humanities and given to the scientists and the technologists, and LLMs have a lot of potential to help. Prime among those is the problem of ailment and disease: we have a real chance of shifting from \"spiritual acceptance\" to \"cure\", specially considering that whenever a molecular biologist says \"it's very complex and we understand but a fraction of it\" they are, to a great extent, expressing a combined limit on computation, experimental throughput and human mind architecture, limitations and availability.\n\nEnvironmental problems are another example. Can LLMs help engineer better, greener energy systems? I'll admit that a matrix multiplication boundary is not the same kind of problem as building a methane or isopropyl energy cell. But I for one would give it a try at having an LLM crack one of those before wondering what the point is."}, {"id": 50647529, "au": "Silamoth", "dom": 236, "sr": 34, "sc": 6.61, "ep": 7.71, "bs": 0.0, "d": 3, "age": 2.08, "grav": 12.6, "surf": 17.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 254, "qw": 0, "k": 169, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 2.055, "fa": 0.56, "gp": 0.886, "bl": 0.0, "ds": 0.0, "txt": "“Let no one ignorant of geometry enter”\n\nThis was supposedly carved on the entryway to Plato’s Academy. Of course, by geometry the Greeks really meant mathematics - that was just how they viewed math. But why would Plato, a philosopher, demand his students learn math first? Well, math is, in a lot of ways, philosophy with training wheels. Every term is precisely defined. Operations have clear cut rules. Math gives you a training ground to learn and practice logic, proof, argumentation, counterexamples, abstraction, and more. All of these are necessary in philosophy, but philosophy is messier. Terms aren’t clearly defined, and it’s easier to make mistakes. But if you’ve mastered the core skills of logic and argumentation already, you can focus on wading through the messiness instead of learning logic in a messy setting.\n\nThis is similar to the notion of hiring math majors because they’re smart, logical problem solvers. Not so popular in today’s job market, but there are plenty of success stories there.\n\nSo, one very plausible interpretation of these results is that these models are actually able to encode logic, reasoning, and abstract concepts in non-trivial ways. This is a far cry from 2 years ago and provides stress testing in a setting with clean, precise definitions.\n\nTo be clear, I’m not a fan of LLMs and do not think language models are a route to AGI. But these math proo"}, {"id": 50640580, "au": "hadlock", "dom": 106, "sr": 35, "sc": 6.41, "ep": 7.51, "bs": 0.0, "d": 3, "age": 13.05, "grav": 131.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 218, "qw": 0, "k": 3865, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.529, "fa": 0.95, "gp": 0.838, "bl": 0.0, "ds": 0.0, "txt": "The model I'm using right now for batch processing is Qwen 3.5 35B-A3B unsloth at NVFP4 which is the native quant for the RTX6000 (perf. bonus) I get about 650-1080 tokens/s aggregate between concurrency 48-70 with an average of 160,000 context and I forget the exact K/V cache but i think it was Q8. Compared to sonnet 4.6 (which was their top sonnet model until recently) which was a real dog, but Anthropic's mid-tier model for a long time, the model specified above just totally rocks it's socks off. Sonnet 5.5 (which came out more recently) feels like a quantized version of Opus 5 and people seem to think it's actually worth the squeeze; Q3.5 35B-A3b does not compare favorably to Sonnet 5.5 in intelligence, but it's wicked fast for common business tasks like db/crm enrichment, which honestly you don't need a smart model for, you just need one with a low error rate. Which is what 35b-a3b is. For anyone just barely following along, the A3B is the magic number, it's a MoE model and only activates 3B which makes it ludicrously fast for doing things like summarizing a million documents (which is about 1TB in my case) in a month. But it also still has very good tool calling error rate (8% for qwen vs 4.5% for sonnet 4.6). Obviously Sonnet 5.5 is better but that's a problem for future me when/if our business-class tasks get that complex."}, {"id": 50640183, "au": "meowface", "dom": 37, "sr": 36, "sc": 6.16, "ep": 6.82, "bs": 0.0, "d": 5, "age": 14.0, "grav": 147.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 12279, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_systems", "flbl": "Human & Systems (Riemann)", "urls": [], "ig": 1.163, "fa": 0.95, "gp": 0.954, "bl": 0.0, "ds": 0.0, "txt": "Almost no one has made the claim that, in November 2026, we have AI systems that can do things like derive general relativity with a data cutoff before it.\n\n\"It hasn't been proven the models can do this\" could've been said about every AI news story 6 months before the story. I think it is extremely likely that AIs will, in fact, knock out more things humans have not managed.\n\nI didn't really get \"qualitative AI skepticism\" even in 2024,. One can debate if it'll solve the Riemann hypothesis by 2026 or by 2040, and if it'll cure most diseases by 2036 or 2066, but that's just haggling; surely the core question \"will we have intelligent machines and are current systems near a permanent intelligence ceiling\" has already been sorted."}, {"id": 50647045, "au": "aabajian", "dom": 469, "sr": 37, "sc": 6.12, "ep": 6.56, "bs": 0.0, "d": 1, "age": 2.75, "grav": 16.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 1745, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.874, "fa": 0.28, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "These proofs confirm fundamental facts about our mathematical system, assuming a set of standard axioms. You're right, by themselves they don't immediately improve engineering or science, but they confirm limits on what engineering/science can do within that mathematical framework.\n\nThe real utility of them (from my perspective) is that they can confirm or refute whether our universe actually follows that framework.\n\nFor example, it's hard to imagine a universe that is not continuous, but at the subatomic level, discrete quantization is everywhere (it's called quantum mechanics, after all). If we observe something that doesn't fit a proved result from a continuous mathematical framework, then the framework itself must be changed. The most famous example of this is classical physics, where a light wave's energy could take any value, which doesn't reflect that light energy is quantized in reality."}, {"id": 50645714, "au": "gnull", "dom": 464, "sr": 38, "sc": 6.04, "ep": 7.14, "bs": 0.0, "d": 0, "age": 4.61, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 21, "k": 1198, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.734, "fa": 0.7, "gp": 0.738, "bl": 0.0, "ds": 0.0, "txt": "The distinctly repelling AI style of writing is showing. I can generally read abstracts and intros of Complexity Theory papers, but here I'm tired after 2 paragraphs.\n\n> We prove that the exponent of square matrix multiplication is 9/4 over every field.\n\nThis is the opening sentence. What the fuck is exponent of multiplication? Is it like (A×B)^n? Apparently, \"exponent\" is a specific part of a specific expression for arithmetic circuit complexity bound for square matrix multiplication.\n\n> The conjecture ω = 2 asks whether [text that doesn't mention ω].\n\nA conjecture doesn't ask, it states. And this is the first time ω is mentioned in the paper. And the conjecture statement does not mention ω.\n\nI'm not sure why I'm writing this. Just to share how disgusting it is, and how disappointed I am that whoever was prompting this thing seems to haven't read it. Who verified it? What credibility does it have? This one doesn't even have a Lean proof."}, {"id": 50639146, "au": "ironborn123", "dom": 430, "sr": 39, "sc": 5.89, "ep": 6.77, "bs": 0.0, "d": 1, "age": 16.83, "grav": 197.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 87, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.85, "fa": 0.56, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "you may have to wait a long time then. people at the frontier labs have often hinted one of the big reasons for getting serious about solving math and physics problems over the last few months is that they serve as untamperable benchmarks and genuine signals of model quality.\n\nany copycat lab pretending to be frontier by distilling teacher models (even that route will soon get closed according to recent news. frontier ones are no longer in the mood to release their best unquantized models even as a subscription) and benchmaxxing on easier benchmarks is no longer able to fake it."}, {"id": 50640134, "au": "vkgcr", "dom": 363, "sr": 40, "sc": 5.83, "ep": 6.49, "bs": 0.0, "d": 1, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 160, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.674, "fa": 0.56, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "Two ideas :\n\n- So far, all of these results are proofs of pre-existing problems / statements, so perhaps LLMs are incapable (lack of world models) of choosing what interesting statements to prove ; the mathematician's role will therefore be to \"intuit\" what mathematical statements are interesting and then use LLMs to prove them.\n\n- If the above is false, then we can expect lots of new statements being proven ; the mathematician's role will then be similar to a scientist's, with the difference being that instead of trying to understand and build theories from observations of the physical world, a mathematician will try to understand and build theories from the LLM-generated statements & proofs."}, {"id": 50643263, "au": "titzer", "dom": 399, "sr": 41, "sc": 5.52, "ep": 6.62, "bs": 0.0, "d": 2, "age": 7.75, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 6, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.406, "fa": 0.7, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "> a property of a function, not an algorithm\n\nYou wanted to be pedantic and yet this is also a misconception. All computable functions have (some) algorithm to compute them. All algorithms are computable functions (maybe partial). If we're not talking computable functions, I don't know what we are talking about. Also, you got that backwards; functions are mappings from inputs to outputs and algorithms are deterministic processes to compute such outputs; algorithms have complexity bounds and not necessarily functions."}, {"id": 50637909, "au": "StableAlkyne", "dom": 100, "sr": 42, "sc": 5.5, "ep": 7.04, "bs": 0.0, "d": 0, "age": 20.05, "grav": 262.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 205, "qw": 0, "k": 1878, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.977, "fa": 0.0, "gp": 1.65, "bl": 0.0, "ds": 0.0, "txt": "We've seen so much interesting work come out of OpenAI and Anthropic in the last few weeks. It really feels like both have tapped into the pioneering spirit of the old Bell Labs.\n\nBut, Bell Labs existed as part of an agreement with the government that AT&T's monopoly would be used for the public good. OpenAI and Anthropic don't really have much use for this beyond PR...\n\nIf even the prestige from Riemann's Hypothesis couldn't boost ANT, what is the reason for them devoting such a huge fraction of their R&D budget to unrelated (though impactful) problems? Scaring mathematicians into burning their non-existent research budgets on tokens in order to make a couple million dollars?\n\nOpen weight models are to the point that most business cases are completely solved by them, at a fraction of the price of Claude, Copilot, or OpenAI. Unfortunately, the average business doesn't care that the AI can solve frontier problems: they just need something to summarize emails or give an executive a summary of the day's headlines. The market is just waiting for a cheap provider that is just as turnkey... Which isn't exactly a high barrier these days. IMO there is space for a unicorn to emerge in the next few years to eat everyone's lunch."}, {"id": 50641291, "au": "Arkhaine_kupo", "dom": 47, "sr": 43, "sc": 5.43, "ep": 6.75, "bs": 0.0, "d": 8, "age": 11.23, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://news.ycombinator.com/item?id=49796590"], "ig": 1.303, "fa": 0.9, "gp": 0.773, "bl": 0.0, "ds": 0.0, "txt": "We need to make 2 important notes here\n\n1) the RH solution has not been verified and understood. Preliminary results show its not exploiting lean bugs, but the math community has not yet accepted, understood and verified the results\n\n2) Terrence Tao is a genius but is also not going to be always right.\n\nAs a counterpoint to his lack of foresight, here is a user of HN asking about the lack of RH solutions when they gave their last Millenium prize update\n\nhttps://news.ycombinator.com/item?id=49796590\n\nthe direction of the work was evident enough for users in this site, even if Tao was less optimistic"}, {"id": 50638929, "au": "otabdeveloper4", "dom": 334, "sr": 44, "sc": 5.33, "ep": 6.21, "bs": 0.0, "d": 3, "age": 17.52, "grav": 210.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 13, "k": 3244, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.51, "fa": 0.42, "gp": 1.012, "bl": 0.0, "ds": 0.0, "txt": "> Does it truly matter if the proof is messy/inefficient if it’s correct?\n\nAbsolutely. Clean and elegant proofs is the only reason why we do proofs in the first place. An elegant proof demonstrates something about the underlying information structure of the universe and allows us to connect disparate domains of mathematics.\n\nIf we only care about \"solving problems\" then all we need is numeric solutions, they are good enough for any possible practical application."}, {"id": 50639389, "au": "locknitpicker", "dom": 168, "sr": 45, "sc": 5.31, "ep": 6.85, "bs": 0.0, "d": 2, "age": 16.21, "grav": 185.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 86, "qw": 20, "k": 1145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": ["https://openrouter.ai/rankings\u0023top-models"], "ig": 0.865, "fa": 1.38, "gp": 0.612, "bl": 0.0, "ds": 0.0, "txt": "> The rest of your paragraph makes it sound like you think cheap & “good enough” AI is what the market wants.\n\nBut reality shows that cheap and good enough is exactly what the market wants.\n\nIf you bother to check usage metrics, you'll learn that over half of all AI prompts target the smalles and cheapest models. Not fancy \"frontier\" models.\n\nTake a look at OpenRouter's LLM ranking metrics[1]. The absolute top model is DeepSeek v4.1 flash. From the top 10, the only non-flash, non-free models are Claude Opus 5.5 and Kimi K3.1 pro. DeepSeek v4.1 flash had over 10 times as many prompts as Opus 5.5. It isn't even close.\n\n[1] https://openrouter.ai/rankings\u0023top-models"}, {"id": 50638206, "au": "JDups", "dom": 525, "sr": 46, "sc": 5.25, "ep": 6.35, "bs": 0.0, "d": 1, "age": 19.41, "grav": 248.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 285, "qw": 0, "k": 113, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.759, "fa": 0.34, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "Because people see all this hype, all this astronomical spending, and yet they don't see their lives improving.\n\nFor a couple years now they see constant claims like \"100x productivity\" and \"what used to takes multiple years now takes a quarter\" but they haven't seen the technology they use improve, not in any real way for the user at least. Hell personally I still encounter bugs regularly on the facebook and instagram apps.\n\nFor a lot of people \"coding is solved\" probably doesn't seem like a good thing at all actually. Why should they be excited about the tech industry being able to generate magnitudes more code at apparently higher quality when big tech's actions are so widely hated. facebook and google are the very face of surveillance capitalism. A technology that makes the companies that indiscriminately and invasively slurps up all their data even better at doing that? The companies making records profits despite constantly being in the news about the fines they have to pay for breaking the law. And now they hear about things like Flock and Palantir and the dystopian future they promise. People like Musk, Zuck, Bezos, Thiel are incredibly unpopular and now these tech billionaires announce that they built AI that is going to be everywhere and do everything for them. Why should they be excited about that?\n\nPeople also very recently spent a number of years being told they ne"}, {"id": 50638218, "au": "nsoonhui", "dom": 429, "sr": 47, "sc": 5.12, "ep": 6.37, "bs": 0.0, "d": 0, "age": 19.39, "grav": 247.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 15493, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.817, "fa": 0.0, "gp": 1.448, "bl": 0.0, "ds": 0.0, "txt": "I feel that there is a way to establish the near parity or even supremacy of the Chinese open source models over the western ones.\n\nOther model providers, like OpenAI or Anthropic, could have thrown their best models at open math problems and score another millennium prize level problem. I feel that compared to benchmarking ( or benchmaxxing??), that is just so much more effective at convincing the public that their models are really good.\n\nChinese models don't have subscription package, and everything is billed at API tier at OpenRouter, so I am not inclined to give them a try again. But if they can ace math problems like Claude or ChatGPT, I would be hard pressed not to give it another try."}, {"id": 50638600, "au": "amomchilov", "dom": 312, "sr": 48, "sc": 5.11, "ep": 6.65, "bs": 0.0, "d": 1, "age": 18.37, "grav": 227.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 139, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.601, "fa": 0.56, "gp": 0.893, "bl": 0.0, "ds": 0.0, "txt": "“Big o notation” are the search terms you’re looking for.\n\nIt’s a notation for quantifying the complexity of algorithms, by how the number of operations needed scales with the size of the input (often “n”). For example, greeting every person when you enter a room is O(n), because the number of greetings increases linearly with the number of people in the room. But having every person in a room greet every other person in a room is O(n^2), as the number of greetings scales quadratically with the number of people."}, {"id": 50640817, "au": "williamdclt", "dom": 358, "sr": 49, "sc": 5.1, "ep": 6.35, "bs": 0.0, "d": 2, "age": 12.43, "grav": 122.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 21, "k": 4090, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.551, "fa": 0.42, "gp": 1.042, "bl": 0.0, "ds": 0.0, "txt": "> Unless the solution can be verified experimentally\n\nDepends what you mean by \"experimentally\" but I'd say we can, that's what Lean does. It goes through the proof step-by-step to verify it.\n\n> is there a difference between an unsolved problem, and a demonstration so complex we cannot understand?\n\nBig difference yeah: even if we don't understand the demonstration, if we trust it (which we do thanks to Lean) we can 1. use the result to build other things (more maths, or physical things) and 2. stop spending effort trying to prove/disprove the theorem or trying do impossible things (eg trying to implement a faster matmul than O(n^2.25))"}, {"id": 50639240, "au": "akoboldfrying", "dom": 335, "sr": 50, "sc": 5.07, "ep": 6.32, "bs": 0.0, "d": 4, "age": 16.51, "grav": 191.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 16, "k": 2090, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.351, "fa": 0.7, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "> Clean and elegant proofs is the only reason why we do proofs in the first place.\n\nNo. Sometimes we just need to know a thing is true, and then an arbitrarily convoluted -- but checkable -- proof suffices. For example, a bounded model checker's proof that the software powering a pacemaker will not crash or deadlock will almost certainly amount to \"just\" a plain case analysis with an ungodly number of cases.\n\nEDIT: Removed unsupported claim."}, {"id": 50638518, "au": "tczMUFlmoNk", "dom": 390, "sr": 51, "sc": 5.06, "ep": 6.3, "bs": 0.0, "d": 1, "age": 18.58, "grav": 231.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 716, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.837, "fa": 0.0, "gp": 1.369, "bl": 0.0, "ds": 0.0, "txt": "While \"Θ(n^2.25)\" is better, imho it's still misleading. Matrix multiplication is a problem that can be solved by algorithms whose running times (under various conditions) are functions. \"Being Θ(n^2.25)\" is a property of a function, not an algorithm, and not a problem. There are matrix multiplication algorithms commonly used whose worst-case running times are most certainly not Θ(n^2.25) (namely, all of them known before last month). One could precisely say that \"an optimal algorithm for matrix multiplication has worst-case running time Θ(n^2.25)\" or \"optimal matrix multiplication takes time Θ(n^2.25)\", though personally I think that the paper's formulation is cleanest: the matrix multiplication constant is ω = 2.25.\n\nThis may seem pedantic, but misconceptions about the meanings of big-O/Theta/Omega notation are very common (e.g., conflating them with \"best/average/worst case\" or other such nonsense) and they muddy the waters."}, {"id": 50638907, "au": "triCoder", "dom": 300, "sr": 52, "sc": 5.05, "ep": 6.6, "bs": 0.0, "d": 1, "age": 17.58, "grav": 211.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 318, "qw": 0, "k": 180, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.789, "fa": 0.22, "gp": 1.217, "bl": 0.0, "ds": 0.0, "txt": "I can help explain big O, it's a super weird concept:\n\nLet's say you want to know the speed of an algorithm. That's a hard thing to do. First, there's the problem that it's different speeds on different computers. Then there's the problem that speed will be relative to the size of the thing you are processing. Then, there's the issue that what you really want is easy ways to compare algorithms, so you don't really want the exact speed of an algorithm but a quick estimate. Finally, you want to make it mathematically provable.\n\nBig O is so weird because of the last two. If you want a quick estimate, you probably want it to be handwavy. But if you want it mathematically provable, then you don't. It feels like these two should be impossible to fit together. But Big O makes it work by putting algorithms into different buckets. If two algorithms are in the same bucket, you handwave minor differences in speed. But which bucket that it's in is mathematically provable.\n\nThe way Big O works is that you build an equation of how long it takes given some input with size n, then you take the largest term and you ignore any constant multipliers and smaller terms, with precise mathematical terminology that lets you do so. So the run time of some algorithm is 3 * n^2 + n, then it would be O(n^2), as that is the largest term.\n\nThe perfect place to see this in action is in sorting algorithms. The"}, {"id": 50638879, "au": "flowerthoughts", "dom": 463, "sr": 53, "sc": 5.0, "ep": 6.1, "bs": 0.0, "d": 0, "age": 17.66, "grav": 213.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 940, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.541, "fa": 0.34, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "I'd love to upvote this, but authorship is \"OpenAI,\" suggesting whoever in OpenAI is doing this, has no idea what this is about. It would be a pretty strong result, so of course you'd want to claim authorship if you understood it.\n\nAt 109 pages, I can only hope they make an LLM that is able to accurately read and evaluate all these papers. The New Academia circle of bots. I wonder how easily they would be fooled by large documents of random claims..."}, {"id": 50638924, "au": "doctorpangloss", "dom": 254, "sr": 54, "sc": 4.93, "ep": 6.47, "bs": 0.0, "d": 4, "age": 17.54, "grav": 210.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 2459, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.245, "fa": 0.68, "gp": 1.106, "bl": 0.0, "ds": 0.0, "txt": "the reason we talk about terence tao is because he authored two papers in theoretical math that turned out to have real applications, the last was in 2008.\n\ni don't think there are any applications for even a single one of these papers, unfortunately. not that it matters that much. but navier stokes 110% had no impact on anything applied.\n\nthat said improving the LLMs is practically really valuable."}, {"id": 50638922, "au": "Pokepokalypse", "dom": 531, "sr": 55, "sc": 4.92, "ep": 6.02, "bs": 0.0, "d": 0, "age": 17.54, "grav": 210.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 593, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.702, "fa": 0.28, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "Stop with the math proofs and start:\n1) How to solve global warming.\n2) How to transmute elements for fun and profit.\n3) Artificial gravity for space travel. (or anti-gravity for terrestrial travel)\n4) propellant-less space propulsion.\n5) faster-than-light (or other equivalent).\n6) permanently defeat fascism."}, {"id": 50641288, "au": "Arkhaine_kupo", "dom": 45, "sr": 56, "sc": 4.92, "ep": 6.74, "bs": 0.0, "d": 8, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 1318, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": ["https://news.ycombinator.com/item?id=49796590"], "ig": 1.303, "fa": 0.9, "gp": 0.768, "bl": 0.0, "ds": 0.0, "txt": "We need to make 2 important notes here\n\n1) the RH solution has not been verified and understood. Preliminary results show its not exploiting lean bugs, but the math community has not yet accepted, understood and verified the results\n\n2) Terrence Tao is a genius but is also not going to be always right.\n\nAs a counterpoint to his lack of foresight, here is a user of HN asking about the lack of RH solutions when they gave their last Millenium prize update\n\nhttps://news.ycombinator.com/item?id=49796590\n\nthe direction of the work was evident enough for users in this site, even if Tao was less optimistic"}, {"id": 50648305, "au": "sigmoid10", "dom": 186, "sr": 57, "sc": 4.92, "ep": 7.29, "bs": 0.85, "d": 5, "age": 0.99, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 6787, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": [], "ig": 1.375, "fa": 0.84, "gp": 1.151, "bl": 0.32, "ds": 0.0, "txt": "I mean, RSA was always based on a hypothesis with zero evidence. A hypothesis that already got dealt a major blow by Shor's algorithm 30 years ago. At this point I would not be surprised to hear that it is also broken on classical computers. And if frontier models can figure out factoring, I wouldn't bet on discrete log / ECC being safe either. In fact even post-quantum algorithms are not guaranteed to be safe. Any securty system that is not proven mathematically will basically become a ridiculous gamble. Because even if OpenAI/Anthropic don't publish it, you can bet the NSA will know about and weaponize it."}, {"id": 50637835, "au": "jcomp", "dom": 260, "sr": 58, "sc": 4.92, "ep": 6.43, "bs": 0.0, "d": 1, "age": 20.23, "grav": 265.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 333, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 0.812, "fa": 0.9, "gp": 1.348, "bl": 0.0, "ds": 0.0, "txt": "I've always discounted people saying this, and now I am the one saying it: I am 100% convinced Opus 5.5 is somehow nerfed over the last 5 days or so.  Something is up, and it certainly seems plausible that they no longer care about public inference and are hoarding compute for whatever it is they're up to."}, {"id": 50646063, "au": "boothby", "dom": 86, "sr": 59, "sc": 4.92, "ep": 6.42, "bs": 0.0, "d": 4, "age": 4.04, "grav": 25.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1664, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "algorithm_bound", "flbl": "Algorithm & Bound (Matrix)", "urls": [], "ig": 1.611, "fa": 0.56, "gp": 0.715, "bl": 0.0, "ds": 0.0, "txt": "I disagree.  What’s shown is a family of algorithms of exponent 9/4+ε.  What’s not given: a solitary algorithm with exponent 9/4.  If my brief read is correct, the algorithm has a parameter a for which the exponent is approximately 9/4 + log(2)/log(a).  If you let a grow with n you could call this a solitary algorithm with complexity n^(9/4 + 1/log(n)).\n\nOne could hope for a single explicit algorithm with the claimed complexity.  One that could be implemented and benchmarked.  There is room for improvement."}, {"id": 50639625, "au": "Jean-Papoulos", "dom": 147, "sr": 60, "sc": 4.92, "ep": 6.36, "bs": 0.0, "d": 1, "age": 15.53, "grav": 173.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 18, "k": 697, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.357, "fa": 0.42, "gp": 1.36, "bl": 0.0, "ds": 0.0, "txt": ">what is the reason for them devoting such a huge fraction of their R&D budget to unrelated (though impactful) problems?\n\nI think that LLMs ability to do math is a powerful argument that they can achieve AGI, as this supports the theory that language effectively encodes logic and that the current transformers and attention architecture can effectively retrieve that logic. This might be what they are exploring.\n\nEither that or they already have AGI and want to \"prepare\" the world. Probably not."}, {"id": 50643426, "au": "sigmoid10", "dom": 184, "sr": 61, "sc": 4.92, "ep": 6.31, "bs": 0.0, "d": 3, "age": 7.53, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 6787, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.785, "fa": 0.28, "gp": 0.91, "bl": 0.0, "ds": 0.0, "txt": "Right now there is a good chance that anyone with access to public LLMs might find exploitable bugs in implementations of things like RSA. But given what we're currently seeing about pure math getting annihilated on a generational level by non-public models, I wouldn't be surprised if they found fundamental flaws in our crypto math. Factoring in P is just one thing. They might be onto something bigger like P=NP (which they certainly are pushing tons of resources into). It would be so ironic if the widely criticised series finale of Silicon Valley turned out to be right and instead of shutting down and burning the evidence, our AI companies just went ahead and destroyed society."}, {"id": 50638840, "au": "CoolestBeans", "dom": 241, "sr": 62, "sc": 4.92, "ep": 6.29, "bs": 0.0, "d": 3, "age": 17.74, "grav": 214.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 1036, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "math_training", "flbl": "Math & Training (Theory)", "urls": [], "ig": 1.342, "fa": 0.34, "gp": 1.496, "bl": 0.0, "ds": 0.0, "txt": "Math proof is one of the few applications where the validation gap can be closed mechanically. The labs keep posting more and more impressive math results because it is one of the few fields in which there is no impediment to progress. Other fields include hacking and reverse engineering which are well established and have negative implications to potential customers so they can't shout it from the roof tops.\n\nThe uncomfortable truth is that because LLM powered agents by their nature cannot reliably check their own work, the need for human verification and validation may limit the productivity boost in most fields to a modest 10 to 30%. Not nothing certainly, but not high enough to charge the prices necessary to cover their compute obligations.\n\nIn other words, the volume of math proof results is a signal. But it's a signal about what LLMs and AI may not be able to do."}, {"id": 50641633, "au": "dgellow", "dom": 154, "sr": 63, "sc": 4.92, "ep": 6.08, "bs": 0.0, "d": 2, "age": 10.43, "grav": 93.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 19, "k": 23182, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.634, "fa": 0.42, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "> The effectiveness of Claude models in science will certainly play a role in the value of the stock over time\n\nI really doubt that's the case. The company doesn't capture any economic value from those results, other than prestige and PR. And using the model that solved a famous math problem isn't even an edge you have over others, your competitors have access to the exact same model if needed. Companies just route their inference to whatever is the best current model for a given task, there is no stickiness. Which is why you see AI providers trying to develop actual products. Unfortunately by doing so they will compete with their own customers.\n\nWe still haven't seen a business model for frontier AI labs that seems to be economically viable"}, {"id": 50640429, "au": "some_furry", "dom": 206, "sr": 64, "sc": 4.92, "ep": 6.07, "bs": 0.0, "d": 3, "age": 13.41, "grav": 137.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 1859, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_models", "flbl": "Proofs & Models (LLMS)", "urls": ["https://soatok.blog/2026/10/29/your-cryptography-conspiracy-theory-is-wrong/"], "ig": 1.408, "fa": 0.62, "gp": 0.684, "bl": 0.0, "ds": 0.0, "txt": "Indeed, Dual_EC_DRBG wasn't!\n\nI wrote this a while ago to link to people who decontextualize the NSA's scandals to argue against good cryptography engineering. Might be useful or interesting to folks reading this thread: https://soatok.blog/2026/10/29/your-cryptography-conspiracy-..."}, {"id": 50637797, "au": "octoberfranklin", "dom": 332, "sr": 65, "sc": 4.92, "ep": 6.03, "bs": 0.0, "d": 1, "age": 20.32, "grav": 267.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 1952, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Labs)", "urls": [], "ig": 1.943, "fa": 0.0, "gp": 1.012, "bl": 0.0, "ds": 0.0, "txt": "That's a
