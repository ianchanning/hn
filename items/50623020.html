 & Company (Device)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Needing to (effectively) crack a crypto key to adjust the temperature in your own house sounds like it needs a Kaczynski meme made about it. The one where he's staring dead eyed into the camera, with the latest \"manmade horrors beyond comprehension\" headline overlaid."}, {"id": 50624158, "au": "Piterniel", "dom": 3, "sr": 6, "sc": 1.17, "ep": 2.05, "bs": 0.0, "d": 2, "age": 46.39, "grav": 1077.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 20, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.771, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "This! I think producers should make public documents how devices are communicating. Because in most of the cases remotes and just expensive stuff that are using some shared protocol with key burned into the chip or firmware.\n\nWe should own our devices and have ability to change firmware in an easy way. It should be in the law"}, {"id": 50628512, "au": "qsantos", "dom": 14, "sr": 7, "sc": 0.46, "ep": 1.42, "bs": 0.0, "d": 1, "age": 37.63, "grav": 752.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1500, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.603, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why spend 50€ on a device when you can spend the equivalent of hundreds of euros of engineer time on it?\n\nMore seriously, I like having full control of it. IIUC, the Broadlink RM4 Pro itself is not really open, although there are hacks around it."}, {"id": 50633779, "au": "imp0cat", "dom": 15, "sr": 8, "sc": -0.01, "ep": 1.31, "bs": 0.0, "d": 2, "age": 31.88, "grav": 567.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 733, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.557, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, sometimes a simple integration with an existing ecosystem is enough.\n\nOTOH, I absolutely can see the appeal (or perhaps an urge :)) to completely disassemble and understand a device to take full control of it and make it do exactly what you want"}, {"id": 50651181, "au": "NooneAtAll5", "dom": 16, "sr": 9, "sc": -0.55, "ep": 0.65, "bs": 1.19, "d": 0, "age": 0.06, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 15, "k": 113, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.275, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> the remotes seemed to use proper cryptography during pairing, and all communications thereafter were encrypted\n\n...what's the point of this? developers were worried that someone would sniff on the room temperature you prefer?"}, {"id": 50623831, "au": "summa_tech", "dom": 7, "sr": 10, "sc": -2.28, "ep": 0.46, "bs": 1.19, "d": 1, "age": 47.12, "grav": 1107.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 360, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.194, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Maybe recognition that the firmware is just not worth that much anymore, and cloning things is more about putting together a supply chain..."}, {"id": 50624765, "au": "imp0cat", "dom": 13, "sr": 11, "sc": -4.0, "ep": 0.59, "bs": 3.05, "d": 2, "age": 44.6, "grav": 1007.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 733, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.252, "fa": 0.0, "gp": 0.0, "bl": 1.15, "ds": 0.0, "txt": "Okay, I only read TFA, not the article with the protocol description."}, {"id": 50624682, "au": "jdboyd", "dom": 6, "sr": 12, "sc": -4.27, "ep": 0.41, "bs": 4.24, "d": 1, "age": 44.82, "grav": 1015.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 1059, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.101, "fa": 0.0, "gp": 0.117, "bl": 1.6, "ds": 0.0, "txt": "Why are we questioning this gift instead of just accepting it?"}, {"id": 50626569, "au": "AIShill101", "dom": 10, "sr": 13, "sc": -4.83, "ep": 0.42, "bs": 3.71, "d": 2, "age": 40.66, "grav": 858.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.179, "fa": 0.0, "gp": 0.0, "bl": 1.4, "ds": 0.0, "txt": "Yea lol if I was an engineer at a firm that made me do this for \"security\" and mooching off of people I would leave breadcrumbs like this too."}, {"id": 50650870, "au": "ByteOfWood", "dom": 5, "sr": 14, "sc": -5.0, "ep": 0.79, "bs": 4.24, "d": 1, "age": 0.91, "grav": 6.9, "surf": 161.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 158, "kpp": 8.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.334, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Why should they? Firmware for a radiator doesn't exactly contain any secret sauce. And any company caught copying it directly would be found guilty for infringement. For a company, it would be easier to make your own, and for a hobbyist hacker, it makes things easier to use the product how you wish."}, {"id": 50624453, "au": "atoav", "dom": 8, "sr": 15, "sc": -5.12, "ep": 0.67, "bs": 4.24, "d": 1, "age": 45.48, "grav": 1041.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 0, "k": 21289, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.061, "fa": 0.0, "gp": 0.36, "bl": 1.6, "ds": 0.0, "txt": "As an engineer: why would I do that? Hackers are my friends, I am one myself."}, {"id": 50651192, "au": "mrheosuper", "dom": 9, "sr": 16, "sc": -5.98, "ep": 0.99, "bs": 5.43, "d": 2, "age": 0.05, "grav": 3.6, "surf": 235.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "firmware_company", "flbl": "Firmware & Company (Device)", "urls": [], "ig": 0.422, "fa": 0.0, "gp": 0.0, "bl": 2.05, "ds": 0.0, "txt": "As a FW engineer, i don't want to spend a morning explain to my manager after he read \"Software of XXX product has been leaked online by hacker\"."}]}</script>

/**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
