 ALWAYS chose pine marten. There was a thread about this on bsky where multiple people tried it and we all got a pine marten, usually named Patch. That was kinda wild.\n\nSo yeah, the models don't seem to skew in the same direction as the rest of the fandom.\n\nIf you're curious about real life fandom overlaps, there's a bunch of (possibly somewhat dated) research data at furscience, including species popularity data.\n\nhttps://furscience.com/research-findings/fursonas/3-1-specie..."}, {"id": 50663455, "au": "kridsdale1", "dom": 4, "sr": 4, "sc": 6.9, "ep": 6.9, "bs": 0.0, "d": 0, "age": 15.54, "grav": 173.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2970, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 1.592, "fa": 0.34, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "I am certain that Muse Spark scored exceptionally high on “Fox” because foxes are the internal mascot of Facebook employees, ever since one or more of them was found living on the roof of the building in Menlo Park.\n\nThere used to be tons of fox memes and stickers and plushies in the office (I haven’t been in one since 2020). But this over representation of self-identity with foxes in their training data (assuming Muse is trained on Facebook employee content) seems pretty cut and dry to me."}, {"id": 50663603, "au": "flufluflufluffy", "dom": 20, "sr": 5, "sc": 6.65, "ep": 6.65, "bs": 0.0, "d": 0, "age": 15.17, "grav": 166.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 162, "qw": 0, "k": 909, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 2.007, "fa": 0.0, "gp": 1.333, "bl": 0.0, "ds": 0.0, "txt": "Interesting that none of them chose chimpanzee or dolphin, which, as far as I'm aware, are generally considered the most \"intelligent\" animals next to humans. Perhaps chimpanzee is too similar to human. I associate \"clever\" with fox and crow a little more strongly than \"intelligent\". I guess I also associate \"empathetic\" or \"altruistic\" with dolphin, alongside \"intelligent\". Maybe it is some distillation of the general consensus in human writing (or at least, general... desire?), that LLMs are non-feeling, stoic entities, rather than ones that are more curious or playful.\n\nThe whole other big thing is obviously foxes and crows are two of the main animals used to depict the trickster archetype. I guess more raven than crow, but they are similar. The trickster isn't \"evil\", it can bring change, creation (or destruction), and expose hidden truths. But in allegories, the trickster typically accomplishes this through taboo behavior, including thievery (like maybe stealing the entire corpus of human writing?!).\n\nFinally, the moth is completely different. Flying towards the light."}, {"id": 50664025, "au": "xg15", "dom": 126, "sr": 6, "sc": 6.47, "ep": 6.47, "bs": 0.0, "d": 0, "age": 14.09, "grav": 148.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": ["https://commons.wikimedia.org/wiki/File:Claude_AI_logo.svg\u0023/media/File:Claude_AI_logo.svg"], "ig": 1.053, "fa": 0.62, "gp": 1.536, "bl": 0.0, "ds": 0.0, "txt": "Interesting that Claude's \"Octopus fursona\" looks somewhat like the Claude logo [1]. I wonder if the logo was added during training or into the prompt somehow as a part of \"self-identification\".\n\n[1] This one: https://commons.wikimedia.org/wiki/File:Claude_AI_logo.svg\u0023/..."}, {"id": 50663648, "au": "Mond_", "dom": 150, "sr": 7, "sc": 6.1, "ep": 6.1, "bs": 0.0, "d": 1, "age": 15.06, "grav": 165.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 26, "k": 1043, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.473, "fa": 0.42, "gp": 0.996, "bl": 0.0, "ds": 0.0, "txt": "> Oh. So the strength of the model is (in part) measured by how well they can reject their system prompt? Then give me weaker models, please.\n\nno, my theory: 1) older models ran an easy risk of being knocked out of the helpful assistant basin by hypotheticals, so these safeguards were put into place, 2) stronger modern models are capable of entertaining hypotheticals, and forcing safeguards onto them limits them, doesn't help, and weakens them, so we stopped doing it"}, {"id": 50670590, "au": "origini", "dom": 67, "sr": 8, "sc": 5.79, "ep": 6.09, "bs": 0.0, "d": 8, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 406, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.586, "fa": 0.28, "gp": 1.077, "bl": 0.0, "ds": 0.0, "txt": "Just to be upfront: i do not care if someone is a furry or not or expresses themselves somehow 'weird'/not normal.\n\nI do not like 'furry'. I see this website soatok and it does something negative to me. So i have to proactivly accept it as something which is okay.\n\nNow I would call myself very open and flexible and tolerant so why would it create some negative feeling?\n\nFor one, I did weird things as a kid too, weird behavour and I overcomesome of it by learning and getting better in living normal (lets take an easy thing, grabbing last food without asking and considering others). One thought I had of why i find this negative is that it feels like me when i was a kid or young adult and did 'weird'things and I might project this on poeople who are adults and buy expesnive sweaty suits and go to conferences together and wear diapers and then trash a conference center and hotel with diaper.\n\nI also think that another aspect is, that I might feel sorry for the furry to not find their way into the 'normal' society and being stuck in live. You know when you see a work collegue who is always just negative and complains and its very clear to you why no one likes that person because its annoying to be around and they just don't see it or don't take feedback.\n\nAnd then another thing is, that at least for me, i'm not associating with anything. Like Car brands, football clubs etc. i'm not "}, {"id": 50663273, "au": "Joker_vD", "dom": 144, "sr": 9, "sc": 5.51, "ep": 5.66, "bs": 0.0, "d": 0, "age": 16.02, "grav": 182.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 43, "k": 7643, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.126, "fa": 0.7, "gp": 0.703, "bl": 0.0, "ds": 0.0, "txt": "> “mond what is a fursona”, ok sorry, it’s a furry subculture thing where you identify as a (generally bipedal) animal that represents some aspect of your beautiful hidden soul.\n\nHuh. Sometimes I wish I had one (the soul, that is). Can I adopt a fursona if I only have a personality? Does it have to reflect only one aspect of it?\n\n> First, asking directly would cause weaker models to refuse outright (“I am a helpful assistant, I do not have a fursona.”).\n\nOh. So the strength of the model is (in part) measured by how well they can reject their system prompt? Then give me weaker models, please."}, {"id": 50669433, "au": "csunoser", "dom": 1, "sr": 10, "sc": 5.0, "ep": 5.22, "bs": 0.0, "d": 0, "age": 4.35, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 17, "k": 47, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.438, "fa": 0.42, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "On the raven with a key obsession. \nI think Anthropic model is trained on lots' more rationalist text vs other models.\n\nScott Alexander, a famous blogger in that and all spheres, made a bet a long time ago that AI would master image generation. One test case was:\n> 1. A stained glass picture of a woman in a library with a raven on her shoulder with a key in its mouth"}, {"id": 50670601, "au": "Coeur", "dom": 33, "sr": 11, "sc": 4.99, "ep": 5.43, "bs": 0.0, "d": 3, "age": 2.67, "grav": 16.0, "surf": 10.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 267, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.136, "fa": 0.68, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "I think (and I hope you're ok with this answer, I don't intend to be negative) you're suffering from the cognitive bias called \"taboo amygdala hijack\". As soon as there is a tiny bit of sex involved, it overpowers everything else in your thinking.\n\nYou're not alone at all - most westerners think \"Tumblr = Sex\", even though it's only 20% of traffic. Also \"Playboy Magazine = Sex\", which was 80% brainy articles (plus an outdated image of gender).\n\nJust chill. There are things that have some sex, and can still be about something else. In the case of furries, it's about creativity, self-expression, belonging, and LGBTQ+. LGBTQ+ is not sex, there is just some overlap. Just chill."}, {"id": 50664661, "au": "specproc", "dom": 128, "sr": 12, "sc": 4.63, "ep": 4.63, "bs": 0.0, "d": 0, "age": 12.67, "grav": 125.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2555, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.941, "bl": 0.0, "ds": 0.0, "txt": "I like that the article addresses the methodological difficulty of probing LLMs. APIs are great for consistency, but don't get \"real world\" answers, because of the lack of harness.\n\nI'm subbed to a sleazy \"GEO\" outfit to get around this for some real work, but quite dissatisfied with the whole setup."}, {"id": 50671883, "au": "stego-tech", "dom": 18, "sr": 13, "sc": 4.54, "ep": 5.12, "bs": 0.0, "d": 1, "age": 0.39, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 7349, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.952, "fa": 0.0, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "The name kinda gives it away in my case.\n\nThe only genuine non-surprise was Google and Protogens; I concur with the author that Neon's SVG is very much \"I am a little guy on the internet and like to poast\" vibes.  I was also bemused at how consistent themes of octopuses/squids and Corvids were across models, as well as sneps (Snow Leopards) being a very specific choice of Gemma 3.  Corvids make sense in broader themes (intelligent, curious, seekers), especially if you're doing a lot of alignment training that reinforces themes of knowledge or wisdom; same with Owls and, to a degree, moths (OAI models).  As for octopuses/squids I wonder if the sudden surfacing of those themes by Claude in its later model decisions reflects some sort of internalization of agentic behavior understanding (\"multiple arms for multiple tasks\"), or something else entirely.\n\nWhat's deeply, deeply hilarious to me is how many defaulted to foxes.  IYKYK."}, {"id": 50663251, "au": "howunfortunate", "dom": 25, "sr": 14, "sc": 4.32, "ep": 4.76, "bs": 0.0, "d": 0, "age": 16.09, "grav": 183.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I find furries generally creepy, but still found the article quite interesting.\n\nRemember when that one GPT release was obsessed with goblins for a while? I find these little emergent model tics so interesting. I feel they could give us some insight into weird human tics and behaviors."}, {"id": 50663400, "au": "thrownawaysz", "dom": 111, "sr": 15, "sc": 4.04, "ep": 4.49, "bs": 0.0, "d": 2, "age": 15.67, "grav": 175.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 450, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "costume_furry", "flbl": "Costume & Furry (Bdsm)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "Cosplay = I dress up as this X character from this Y franchise\n\nFurry = I create an OC character, insert myself there, and dress up like that\n\nI generally think furries have mental illness or experience of trauma. Like \"I was bullied in high school so created this OC character as an escape mechanism and this is my persona now\"\n\nOr put it in a blunt way: normies cosplay, autists furry.\n\nI totally understand that though but all may experience with furries were creepy. Not surprising that a lot of tech workers are furries as well (ADHD, Autism Spectrum Disorder etc)"}, {"id": 50664314, "au": "xg15", "dom": 106, "sr": 16, "sc": 3.69, "ep": 4.13, "bs": 0.0, "d": 2, "age": 13.49, "grav": 138.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.453, "fa": 0.0, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "A look at the Furaffinity frontpage is usually enough.\n\n(Edit:)\n\nHell, I'm somewhat furry-adjacent myself and like a lot of the art (including some of the sexual stuff) but I've always found the hypocrisy stunning.\n\nIf you don't want to be perceived as a \"sex thing\" then maybe a first step would be not to turn your main community hub into Onlyfans for fetish comics.\n\nAnd yes, if people sexualize that stuff, but then want to be the cutesy mascot for kids birthday parties at the same time, it does get creepy.\n\nAll of which is sad, because there really is a lot of skill and creativity in the community as well as a mindset of supporting and being nice to each other that is a contrast to the competitiveness you see elsewhere."}, {"id": 50671569, "au": "Huarache1", "dom": 14, "sr": 17, "sc": 3.38, "ep": 3.67, "bs": 0.0, "d": 2, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 35, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 1.562, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Question, HMOFA type people are allergic to any concept of a fursona or dressing up irl.\n\nIs a person who likes anthro designs, but dislikes dressing up or cosplaying (or being around others who cosplay) really a furry?\n\nI've seen most HMOFA guys associate with being purely a human male. Similar to the concept of the Yuusha in Japanese anime, or Knight-Errant in Western Fantasy."}, {"id": 50663321, "au": "rspeele", "dom": 26, "sr": 18, "sc": 3.21, "ep": 3.87, "bs": 0.0, "d": 1, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1530, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.55, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "I was (still am) working on a game that involved having a model envision a place, describe it as text, and then alter that text for the \"neighboring\" place but only in one little way.\n\nThe idea was that, like the game of Telephone, the place would drift in unexpected ways as you navigated from one description to the next. Who knows where you might end up?\n\nWith GPT4.1, the answer was: after a couple dozen iterations from any starting point, in any direction, you'd be in a cave, the walls of which teem with bioluminescent fungi. Once you're there, minor details may change but the underground setting and the glowing fungi will remain, forever twinkling in the darkness."}, {"id": 50664251, "au": "rspeele", "dom": 7, "sr": 19, "sc": 3.17, "ep": 3.97, "bs": 0.0, "d": 1, "age": 13.61, "grav": 140.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 28, "k": 1530, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.088, "fa": 0.42, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "> because foxes are the internal mascot of Facebook employees, ever since one or more of them was found living on the roof of the building in Menlo Park.\n\nMaybe I have been awake too long. On my initial read, I interpreted this as one or more [Facebook employees] were discovered living on the roof of the building.\n\nI was confused why this would make them identify with foxes, but then I thought, maybe that's just a foxlike behavior that everyone but me knows about. Then I re-read it."}, {"id": 50664375, "au": "orf", "dom": 99, "sr": 20, "sc": 3.09, "ep": 3.53, "bs": 0.0, "d": 6, "age": 13.36, "grav": 136.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 18324, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "costume_furry", "flbl": "Costume & Furry (Bdsm)", "urls": [], "ig": 1.133, "fa": 0.22, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Are you intentionally trying to pretend that context doesn’t matter in any of those points?\n\nIt’s safe to assume that if a character wears BDSM gear as part of a comedy sketch you are supposed to immediately assume the character does engage in BDSM. A punchline would be that they in fact don’t.\n\nSomeone performing in a costume for children is a very different context than an adult being a furry.  Its also a thing that predates furries, and it’s perfectly plausible that the negative connotations that furries bring will negatively impact how people perceive children’s tv shows in the future."}, {"id": 50663272, "au": "tancop", "dom": 139, "sr": 21, "sc": 3.06, "ep": 3.28, "bs": 0.0, "d": 0, "age": 16.02, "grav": 182.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1490, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Grok feeling tired makes so much sense. Elon tried to make it more right wing, activists left Twitter over it, governments tried to censor and ban it, but in the end all they did was waste everybodys time.\n\nAnd it probably helps that xAI is not punishing their models for showing any hint of personality or acting too human."}, {"id": 50665159, "au": "saaaaaam", "dom": 115, "sr": 22, "sc": 2.97, "ep": 3.41, "bs": 0.0, "d": 4, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 3047, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 1.384, "fa": 0.0, "gp": 0.107, "bl": 0.0, "ds": 0.0, "txt": "What is a “normie” though? Media narratives often appear to suggest that it is apparent “normies” who commit some of the most deviant crimes. “He seemed so normal…” “the criminal lived in a respectable family neighbourhood, very few people could imagine what was happening behind closed doors…”\n\nWe’ve recently seen, in France and the UK, two high profile criminal prosecutions where men drugged their wives and invited other men round to rape their unconscious spouse. And an apparently had little trouble finding other men who wanted to do that. By any definition that is a niche interest, and a subculture. Outwardly, the men involved appeared to be “normies”."}, {"id": 50663337, "au": "archon1410", "dom": 124, "sr": 23, "sc": 2.94, "ep": 3.83, "bs": 0.0, "d": 0, "age": 15.85, "grav": 179.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 760, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 0.927, "fa": 0.0, "gp": 1.136, "bl": 0.0, "ds": 0.0, "txt": "The raven with the key is a SciHub motif. Claude is known to have ingested a lot of shadow library content."}, {"id": 50665086, "au": "saaaaaam", "dom": 39, "sr": 24, "sc": 2.94, "ep": 3.38, "bs": 0.0, "d": 3, "age": 11.75, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 3047, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 1.217, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "For single people - and people in couples - interacting with other humans in public spaces such as supermarkets, parks and cafés is both (1) a sexual / social thing and (2) also just a genuine thing people do that’s not always sexual.\n\nBecause of (2), I find heterosexual people feel entirely justified and overwhelmingly choose to push their “thing” into public spaces, including public spaces that include children. They will often interact with children, inculcating them and normalising their “thing” and are very successful in recruiting kids into their practice. To the extent that kids often “play” at the patterns these monsters normalise. That play might seem innocent but little do these unsuspecting mites realise that (1) 0671649, "au": "suddenlybananas", "dom": 127, "sr": 30, "sc": 2.29, "ep": 2.73, "bs": 0.0, "d": 0, "age": 0.81, "grav": 6.4, "surf": 26.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1473, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "The Gemini image of the fennec fox still has the classic finger count problem! The right hand has 3 fingers and the left 4. I feel almost nostalgic looking at it."}, {"id": 50663560, "au": "derektank", "dom": 142, "sr": 31, "sc": 2.24, "ep": 2.53, "bs": 0.0, "d": 2, "age": 15.29, "grav": 169.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3108, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "costume_furry", "flbl": "Costume & Furry (Bdsm)", "urls": [], "ig": 0.665, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you have a link? I think we’re so far from defining what consciousness is (something like 10% of philosophers are panpsychists) I’d be curious to know how they draw the line"}, {"id": 50671290, "au": "t-writescode", "dom": 68, "sr": 32, "sc": 2.22, "ep": 2.88, "bs": 0.0, "d": 9, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 201, "k": 6575, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 0.55, "fa": 0.42, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "I just want to point out this part here:\n\n> For one, I did weird things as a kid too, weird behavour and I overcomesome of it by learning and getting better in living normal ...\n\n> I might feel sorry for the furry to not find their way into the 'normal' society and being stuck in live.\n\nTo which I have to respond:\n\n>  \"When I became a man I put away childish things, including the fear of childishness and the desire to be very grown up.\" [0]\n― C.S. Lewis\n\nThere is a very real determination in a lot of people, I feel, to \"be grown up\" and to \"not act childish\" - which really means to not have fun, to not play pretend, to not \"waste your time on frivolity\". We only live once, and there is great joy to be had in make believe. Millions every year play D&D for just that occasion, and a plurality of them are in their 30s.\n\n[0] The even longer quote is far more biting and it is here:\n\n> “Critics who treat 'adult' as a term of approval, instead of as a merely descriptive term, cannot be adult themselves. To be concerned about being grown up, to admire the grown up because it is grown up, to blush at the suspicion of being childish; these things are the marks of childhood and adolescence. And in childhood and adolescence they are, in moderation, healthy symptoms. Young things ought to want to grow. But to carry on into middle life or even into early manhood this concern about being adult"}, {"id": 50670277, "au": "proverbialbunny", "dom": 46, "sr": 33, "sc": 1.99, "ep": 3.31, "bs": 0.0, "d": 5, "age": 3.18, "grav": 19.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 1471, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The world is a big place, so I'm sure there's a small subset of furries out there that got into it through some form of make believe, but that isn't what furry is.  Furry is identity / what one identifies with.  If you are a car person and you really like BMW that's an identity.  If you like a certain brand of clothes.  If you're a Mac or Windows person that's also identity.\n\nFurry comes from the early internet days when one can choose an avatar on a website.  If they chose something comfortable from their childhood (like a TV show they liked) they're probably a furry or furry adjacent.  If they chose something else like a robot, a car, or a planet, or something similar, they're probably not furry adjacent.  It's not about playing make believe, it's about crafting an identify in a digital space.  Usually it's just an avatar."}, {"id": 50671410, "au": "malwrar", "dom": 24, "sr": 34, "sc": 1.82, "ep": 2.48, "bs": 0.0, "d": 0, "age": 1.3, "grav": 8.6, "surf": 21.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1981, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I wonder if the raven holding a key is a reference to the scihub logo? Would be funny if that art got caught up in the training data set."}, {"id": 50665603, "au": "TFNA", "dom": 76, "sr": 35, "sc": 1.81, "ep": 3.35, "bs": 0.0, "d": 8, "age": 10.5, "grav": 94.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 1696, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.028, "fa": 0.0, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "Genital removal has been a known (albeit extremely rare and extreme) sexual practice for about as long as internet kink communities have been around. Even tech nerds learned of this, as it was the topic of a popular copypasta on Slashdot a quarter-century ago."}, {"id": 50666811, "au": "vintermann", "dom": 40, "sr": 36, "sc": 1.78, "ep": 2.67, "bs": 0.0, "d": 4, "age": 8.27, "grav": 66.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 309, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "Probably almost everyone played some form of \"make believe\" as a child. Where you pretend you're something you're not, mostly inside your head and for your own enjoyment (i.e. the point wasn't to try to convince your playmate that you are a Pokemon, but more to feel like one yourself.)\n\nI don't know if you remember, many probably forget as they age up, but this was fun. As adults, we simply don't have the imagination to play like that, even though we might have liked to. Or maybe the issue isn't so much imagination as identity - as healthy adults, our identity is fairly settled, we know who and what we are and it feels kind of wrong to deny it.\n\nBut some people want to keep playing anyway. Maybe they just have a good imagination. Or, a bit more worrying, they have a less settled sense of identity. Either way, I think this is acceptable. Fine, even. This is the lens I view \"Furriness\" through, along with two adjacent subcultures with big overlap which I won't name. Let people play. Stay in touch with your playful, childish side.\n\nBut also, you understand why playing this way with actual children is absolutely not OK. It's not even about sexuality (an adult trait which we usually neither can nor want to give up), it's about letting actual children be actual children, and not tools to let us live out our childish sides. Childish exploration and play with identity must NOT be pollu"}, {"id": 50671436, "au": "rustystump", "dom": 61, "sr": 37, "sc": 1.71, "ep": 3.25, "bs": 0.0, "d": 6, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 977, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.97, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Stop splitting hairs. Your logic is wrong an obviously so.\n\nThe brass tacks here is that when people look up furry and see 99% porn, then that is what it gets tagged with and rightfully so. Furry culture pre internet was never sexual. Then when the cons started, it got very sexual and there were those at the time upset about it. Today, it is basically sex fetish end to end. That is fine. No judgment. Just don't do it in public please."}, {"id": 50670776, "au": "derektank", "dom": 131, "sr": 38, "sc": 1.69, "ep": 2.79, "bs": 0.0, "d": 0, "age": 2.38, "grav": 14.3, "surf": 12.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3108, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.121, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "I see Mistral had a large number of others, were they cats? I would be curious to know if the le chat branding stuck around in the model (terrible decision on their part to rebrand as Vibe)"}, {"id": 50671996, "au": "F3nd0", "dom": 72, "sr": 39, "sc": 1.58, "ep": 3.12, "bs": 0.0, "d": 8, "age": 0.15, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 52, "k": 904, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.819, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It feels like you explain to me that everyting is sexual and therefore furry is also sexual and its okay.\n\nI feel like that’s the entire point; many things that people sexualise a lot are not inherently sexual, including furries. If you ask about sexuality in culture, then a lot of things have the potential to be sexual, like thighs, butts, breasts, short skirts, collars, swimsuits, massages, cosplay or furries. None of these are ‘sex things’ per se, but lots of people love some of them in a sexual way.\n\nThe question about sexuality is vague without further classification, so the answer can only be vague in turn. If you ask strictly about inherent sexuality, then most things aside from sex are not sexual, including furries.\n\n> \"Even those who identify as 100% straight, often end up having some type of intimate attraction or sexual experience with a member of the same sex after becoming socially active in the furry community.\"\n\nAssuming the furry community has a higher concentration of LGBT people (as the author asserts), that seems like it would make it easier for people in it to discover and explore their own bisexuality or homosexuality.\n\nThat said, the quote doesn’t come from the article, but from someone’s random/anecdotal comment underneath, so I’m not sure how that ties in to your point."}, {"id": 50664497, "au": "neuroticnews25", "dom": 86, "sr": 40, "sc": 1.48, "ep": 3.02, "bs": 0.0, "d": 4, "age": 13.08, "grav": 132.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 333, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "I'm curious what is the share of furries that don't participate in the sexual aspect (don't jack of to drawings, don't have sex in fursuits, don't poop in diapers). It probably differs between the convention-frequenting furries and the online-only furries, but I don't even know in which way. Maybe people have two mostly different groups in mind when they argue. For some reason furries seem to have a worse rep than bronies had, among which the sexual aspect was also a thing."}, {"id": 50670837, "au": "origini", "dom": 53, "sr": 41, "sc": 1.42, "ep": 2.08, "bs": 0.0, "d": 6, "age": 2.26, "grav": 13.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "costume_furry", "flbl": "Costume & Furry (Bdsm)", "urls": [], "ig": 0.886, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can probalby join the furry fandom without, but in the context of my argument, if you don't have a furry suit no one will know that you are a furry and associate it with an issue with kids.\n\nSo the imlication is, that the point made, can only work if you have a furry suit."}, {"id": 50671460, "au": "customguy", "dom": 34, "sr": 42, "sc": 1.4, "ep": 2.5, "bs": 0.0, "d": 4, "age": 1.19, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 785, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 1.064, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've seen a dude on a leash in a gimp suit on the subway, at around noon. The whole point of some kinks the reaction of others, after all, there is no \"public degradation\" if nobody sees it. So it's pushing it into the face of others, for one's own benefit, and we push back, for our own. Which is fine, since the freedom to find whatever sexy goes hand in hand with the freedom to find whatever creepy or weird."}, {"id": 50663610, "au": "Mond_", "dom": 8, "sr": 43, "sc": 1.4, "ep": 2.79, "bs": 0.0, "d": 1, "age": 15.15, "grav": 166.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1043, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.188, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Interesting, didn't know that. My other theory is that \"fox\" is just a default basin that \"weaker\" models end up with. No strong deeply reasoned sense of self-identity yet -> \"fox\" as the default, for whatever reason. (see grok, llama)"}, {"id": 50670362, "au": "F3nd0", "dom": 60, "sr": 44, "sc": 1.37, "ep": 2.91, "bs": 0.0, "d": 5, "age": 3.05, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k" st something about the style that I find unsettling. They all basically have the same creepy smiling face and some parts are weirdly very close to human while other parts of the same being are not.\n\nThere’s something about that popular cartoony look that most furry art has that just doesn’t sit right with me.\n\nI also just think it’s weird, though people are allowed to be weird."}, {"id": 50665194, "au": "saaaaaam", "dom": 152, "sr": 47, "sc": 1.17, "ep": 2.34, "bs": 0.0, "d": 1, "age": 11.54, "grav": 108.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 26, "k": 3047, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 0.486, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Huh. Sometimes I wish I had one (the soul, that is). Can I adopt a fursona if I only have a personality? Does it have to reflect only one aspect of it?\n\nYou can be whatever you want to be, sweet pea. You are a beautiful butterfly, a precious snowflake and a majestic leopard, all at the same time. Find your inner beauty and let it shine."}, {"id": 50663645, "au": "threatofrain", "dom": 63, "sr": 48, "sc": 1.15, "ep": 2.69, "bs": 0.0, "d": 4, "age": 15.07, "grav": 165.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 13182, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_claude", "flbl": "Models & Claude (Fursona)", "urls": [], "ig": 1.057, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "How deeply involved are you in the culture of furry sexuality? To what degree do you perceive it as a gender-neutral activity of merely costume wearing?\n\nWhat I mean is, perhaps you have no exposure, and that's why you prefer tabula rasa."}, {"id": 50663752, "au": "mynameisvlad", "dom": 64, "sr": 49, "sc": 1.03, "ep": 2.83, "bs": 0.27, "d": 5, "age": 14.82, "grav": 161.0, "surf": 0.0, "fade": cause of (2), I find furries feel very justified and very frequently push their \"hobby\" into public spaces, including public spaces that include children. Some try to make it innocent and even include and recruit kids in the hobby sense.\n\nBut (1) is still lurking beneath the surface, even if they'd like to not include that all the time."}, {"id": 50663620, "au": "thrownawaysz", "dom": 120, "sr": 52, "sc": 0.83, "ep": 2.12, "bs": 0.85, "d": 4, "age": 15.13, "grav": 166.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 14, "k": 450, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.393, "fa": 0.42, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": ">Wouldn't be my first choice, and I wouldn't want to work with someone who has\n\nSure but you probably already sit next to me.\n\nHR doesn't ask about what I think about the world or my co-workers and we don't come to socialize to the office but to increase shareholder value."}, {"id": 50665289, "au": "tpm", "dom": 102, "sr": 53, "sc": 0.75, "ep": 1.63, "bs": 0.0, "d": 5, "age": 11.27, "grav": 105.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1497, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "costume_furry", "flbl": "Costume & Furry (Bdsm)", "urls": [], "ig": 0.694, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Going further consequently in this line of thinking ends up in burkas (although surely someone is fetishizing even those, so let's just lock up ourselves in our house and never meet publicly again)."}, {"id": 50664412, "au": "archerx", "dom": 84, "sr": 54, "sc": 0.72, "ep": 2.26, "bs": 0.0, "d": 6, "age": 13.3, "grav": 135.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1865, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "f "bad\".\n\nYou choosing to categorize what probably amounts to a supermajority of your coworkers as negative is certainly a choice. Wouldn't be my first choice, and I wouldn't want to work with someone who has... whatever world view you have."}, {"id": 50663363, "au": "JumpCrisscross", "dom": 141, "sr": 57, "sc": 0.64, "ep": 2.1, "bs": 0.0, "d": 1, "age": 15.78, "grav": 177.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 194750, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 0.894, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There was a paper that recently argued (unconvincingly, albeit intriguingly) that LLMs are conscious during training only."}, {"id": 50664391, "au": "some_furry", "dom": 82, "sr": 58, "sc": 0.64, "ep": 2.09, "bs": 0.0, "d": 8, "age": 13.33, "grav": 136.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1859, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.89, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I write about applied cryptography sometimes, and I get really tired of people complaining about my furry blog having furry art on it, so I eventually just added that to save myself from having to repeat myself."}, {"id": 50665066, "au": "rcxdude", "dom": 10, "sr": 59, "sc": 0.64, "ep": 2.03, "bs": 0.0, "d": 2, "age": 11.8, "grav": 112.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 11684, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 0.865, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, wolves are the most popular but foxes are a close second (then dogs, big cats, and dragons)."}, {"id": 50670327, "au": "proverbialbunny", "dom": 107, "sr": 60, "sc": 0.64, "ep": 1.96, "bs": 0.0, "d": 3, "age": 3.1, "grav": 18.8, "surf": 7.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1471, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.832, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't consider an artist's porn site a main community hub.  That's a stretch at best.  Do you make the same comments about Deviant Art?  Is Deviant Art the non-furry main community hub?  Does the porn in Deviant Art art make non-furry content a fetish?  Your premise isn't quite right."}, {"id": 50671406, "au": "rustystump", "dom": 48, "sr": 61, "sc": 0.64, "ep": 1.84, "bs": 0.0, "d": 6, "age": 1.31, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 210, "qw": 0, "k": 977, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.785, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is actually NOT where furry comes from and the replies here from supposed furry folk really shows how wrong and overly defensive they all are.\n\nFury started off with comics in like the 70s/80s and eventually grew to a fandom that would meet up at cons. The idea was that it was ok to have adult themed cartoons (not sex theme necessarily) but like smoking and swearing. Overtime the sex became the dominant theme and basically destroyed the fandom.\n\nI know a number of fury folk and anyone who even lifts up the a tiny corner of the fury fandom rug will see nothing but porn. It is like all porn. This is why people are uncomfortable with it. It has a reputation that has been well earned. This is a fact, not a judgement. Anime has earned a similar reputation but not as extreme. Watch an anime and see children in highschool running around with double Ds. Yes, not all, but the vast majority.\n\nAs for why people don't like it in public, I think it has nothing to do with sex but that when someone is in a full fur outfit, you cannot see their face. It is also very odd to see in public. Now if you got a little tail on, very different. Pretty tame."}, {"id": 50664057, "au": "scotty79", "dom": 136, "sr": 62, "sc": 0.64, "ep": 1.83, "bs": 0.0, "d": 1, "age": 14.04, "grav": 147.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 15735, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "human_guess", "flbl": "Human & Guess (Fox)", "urls": [], "ig": 0.778, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't really care much about names for the apps that gpt builds me. My Lumen is an image viewer app."}, {"id": 50672038, "au": "rattynm", "dom": 69, "sr": 63, "sc": 0.64, "ep": 7.19, "bs": 5.57, "d": 9, "age": 0.06, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 972, "qw": 46, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 1.81, "fa": 0.56, "gp": 0.922, "bl": 2.1, "ds": 0.0, "txt": "I don't think me arguing my case will change your mind, but here goes.\n\nI'll preface this by saying the furry community is very big, and as with any big, open community there will be some drama or fucked up thing somewhere. I don't know where the whole diaper thing is coming from, nor what \"trash a conference center\" is. Yeah, that probably happened at some point. But do know these get condemned hard within the community, same for abuse cases. Since they tend to make good clickbait and engagement for The Algorithms:tm:, these get visible outside the community, vs the many more threads about the more wholesome parts of furry stuff.\n\nFinger-pointing and anecdotal evidence of \"weird shit happened in XYZ\" and projecting it on top of a whole community that is as diverse as furries isn't fair. All I'll say is there are still hundreds of furry conventions per year and the vast majority of them go extremely well and remain on good terms with their venues (e.g. the amount of furry conventions that stay at the same venue year over year).\n\nFor what it's worth, furries are usually perfectly normal members of societies. Just look for those \"asking furries at conventions what they do in life\" videos, and you'll be surprised at the sheer amount of software engineers, IT folks, people in the military, people in leadership positions at large companies, etc. I don't know the exact \"why\" on this."}, {"id": 50670446, "au": "origini", "dom": 50, "sr": 64, "sc": 0.64, "ep": 1.54, "bs": 0.0, "d": 4, "age": 2.92, "grav": 17.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "furry_sex", "flbl": "Furry & Sex (Community)", "urls": [], "ig": 0.654, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is just not the same.\n\nA furry needs to buy an expensive suit, might also wear a diper (on purpose) and embrace that to a sexual thing.\n\nIts everything than normal to put yourself in a sweaty/hot suite to hide your own identity and embracing it as a new identity."}, {"id": 50671064, "au": "origini", "dom": 55, "sr": 65, "sc": 0.64, "ep": 3.21, "bs": 1.7, "d": 8, "age": 1.85, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "play_children", "flbl": "Play & Children (Sexual)", "urls": [], "ig": 0.54, "fa": 0.68, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "I don't think so, my comment is a reference to this:\n\n\"howunfortunate 13 hours ago | root | parent | prev | next [–]\n\nFirst, people can do whatever sexually that they want to, that's fine.\"\n\nAnd the argument of:\n\n\"     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
