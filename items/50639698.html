 "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.0, "fa": 0.42, "gp": 0.345, "bl": 0.0, "ds": 0.0, "txt": "> Michael is right that capitalism has its hand squarely on a hot stove right now, and that the rest of us are getting burned while executives relearn that you can’t automate away accountability.\n\nWorse: they will not learn. By the time SHTF, those who made the decisions have long since moved to yet another company to wreck. Golden parachute.\n\n>  I just wish we’d aim the anger at the people making that bet, instead of pretending that giving a shit requires typing every character by hand.\n\nThat's a question of pride. What am I supposed to be, a programmer or a clanker driver? These two are fundamentally different tasks and should not be conflated."}, {"id": 50654205, "au": "Bayart", "dom": 70, "sr": 69, "sc": 3.6, "ep": 4.02, "bs": 0.0, "d": 1, "age": 3.0, "grav": 18.1, "surf": 14.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3680, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.543, "bl": 0.0, "ds": 0.0, "txt": "I read LLMs as non-deterministic software for software, as in the relationship is similar to software <-> hardware, but it's floaty. It reminds me of shooting a soccer ball and having a general intuition of where it's going based on my understanding oh physics, my own body, the ball, other players and the field.\n\nI happen to be very bad at soccer, the ball could go anywhere."}, {"id": 50641860, "au": "inglor_cz", "dom": 157, "sr": 70, "sc": 3.6, "ep": 4.0, "bs": 0.0, "d": 1, "age": 25.46, "grav": 388.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 15723, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.596, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "Many people in this thread speak about shipping, but it is ultimately the users of said software who matter.\n\nAre organizations willing to deploy dangerous hot mess concocted by people who don't give a shit? Then there is a few software Chernobyls in waiting, which may yet teach some people not to do this.\n\nWhen it comes to the really important projects (Linux kernel etc.), I would expect that those who give a shit will prevail, if only to protect their reputation, and that the overall stability and security of those projects will grow.\n\nI am not much less sure about firmwares etc. - basically every software which is an afterthought to something that is bought for its hardware value. Washing machines and other smart home electronics may become even shittier than they are today."}, {"id": 50643583, "au": "packetlost", "dom": 54, "sr": 71, "sc": 3.6, "ep": 3.98, "bs": 0.0, "d": 1, "age": 22.86, "grav": 324.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 5406, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.983, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I don't really see LLMs as a 'another layer of abstraction' because the relationship they have to the result is one-way. An abstraction (in the CS sense) is inherently bidirectional, it can be interpreted both in terms of the abstraction itself, but also the details of how that abstraction is implemented. With LLMs we only really get the latter (and only then sometimes). There's not really a separate artifact. Sure, conversation history could sort of be considered that, but it's not really a helpful one and I'd be very surprised if anyone is saving their conversations for that purpose.\n\nPeople might say 'specs' are the artifact, but I disagree. Specs are a description of the abstraction, not the abstraction itself."}, {"id": 50646352, "au": "luisgvv", "dom": 260, "sr": 72, "sc": 3.6, "ep": 3.97, "bs": 0.0, "d": 0, "age": 19.12, "grav": 242.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 218, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.157, "fa": 0.34, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "Yeah bro, I also give a shit about my financial security. So I will do my best to ship as fast as my boss wants me too, even if it means sending that +1500,-350 pull request.\n\nSo don't bother me if a little bit of slop slips in between."}, {"id": 50645645, "au": "customguy", "dom": 271, "sr": 73, "sc": 3.6, "ep": 3.96, "bs": 0.0, "d": 0, "age": 20.2, "grav": 265.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 785, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.535, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "And dumb people with the attention span of a goldfish ignore the \"sucking up everything humans wrote\" part of this not-tool.\n\nIt's not an object. it's a relationship. it is your station: slave today, idiot tomorrow, then purged.\n\nSo go to the abbattoir you chose quietly. If you try to drag others into it, fuck you."}, {"id": 50648457, "au": "gspr", "dom": 93, "sr": 74, "sc": 3.6, "ep": 3.93, "bs": 0.0, "d": 1, "age": 16.29, "grav": 187.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.168, "fa": 0.28, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "Exactly.\n\nIf it were just like moving from assembly to compiled languages (it's not!), then the following would be true:\n\n* The new source language is natural prose. Has anyone ever heard of a worse language for programming?\n\n* The compiler is non-deterministic. This is a very undesirable property of a compiler.\n\n* The compiler cannot be reliably interrogated as to why it produced the output it did. This is a very undesirable property of a compiler.\n\n* Future maintenance happens in both the source and the compiled code. This is a mess!\n\n* Most compilers are proprietary and run only on very very expensive hardware, usually entirely under the control of an evil entity. This is insane.\n\nHow people can argue that this is all fine boggles my mind."}, {"id": 50641764, "au": "carlosneves", "dom": 234, "sr": 75, "sc": 3.6, "ep": 7.36, "bs": 3.58, "d": 1, "age": 25.66, "grav": 393.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 58, "qw": 10, "k": 21, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": ["https://quoteinvestigator.com/2016/06/26/shape/", "https://en.wikipedia.org/wiki/Tetrad_of_media_effects"], "ig": 1.392, "fa": 1.04, "gp": 0.774, "bl": 1.35, "ds": 0.0, "txt": "> We shape our tools and thereafter our tools shape us.\n\nhttps://quoteinvestigator.com/2016/06/26/shape/\n\nThis concern was even back then with Socrates and the invention of writing.\n\nMcLuhan offers the view that with each new tool/medium a transformation process kicks in that enhances some traits and obsolesces others.\n\nhttps://en.wikipedia.org/wiki/Tetrad_of_media_effects\n\nI feel like the engineers of the past century were much sharper overall compared to today. I don't have any evidences to back this up though."}, {"id": 50651002, "au": "fercircularbuf", "dom": 83, "sr": 76, "sc": 3.6, "ep": 3.78, "bs": 0.0, "d": 1, "age": 11.35, "grav": 106.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 185, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.898, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "In my opinion it's because it empowers one to operate one abstraction layer up, but at the same time it also empowers one to delegate their work entirely. The previous abstraction layers you mention primarily empower one to operate one abstraction layer up while still needing to do the work themselves.\n\nSo how much of an abstraction layer LLMs are comes down to how a person ultimately uses it. Is it for abstraction or delegation? It's a spectrum, so one could be using it for both at the same time."}, {"id": 50648252, "au": "hatthew", "dom": 126, "sr": 77, "sc": 3.6, "ep": 3.74, "bs": 0.0, "d": 2, "age": 16.56, "grav": 192.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 2022, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.505, "fa": 0.0, "gp": 0.137, "bl": 0.0, "ds": 0.0, "txt": "In the past, it was generally impossible to produce even a semblance of a solution without understanding the domain to some extent. Management doesn't care about doing it right, but it was impossible to produce results without getting at least halfway to doing it right. Now that it's possible to produce results without any effort towards doing it right, that's the level of effort management implicitly expects.\n\nIn absolute terms, the cost of doing it right (compared to doing the minimum) has gone down. But the relative cost has gone up.\n\nEffort required to do the bare minimum before LLMs: 5. Effort to do it right: 10. Doing it right requires 5 extra effort, but you ship half as fast.\n\nMinimum after LLMs: 1. Doing it right after LLMs: 4. Doing it right requires 3 extra effort, but you ship a quarter as fast."}, {"id": 50643132, "au": "bemtevi", "dom": 139, "sr": 78, "sc": 3.6, "ep": 3.68, "bs": 0.0, "d": 1, "age": 23.42, "grav": 338.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is absolutely true. Technology is multifaceted; there is the \"tool\" component, and then there is the \"how it changes the way we look at things and thus how it modifies society\" component. LLMs do a heck of a lot of the latter, and thus cease from being mere tools that we just use and decide how much responsibility we want to put in them.\n\nFrom another perspective, technology operates on an individual level, and a collective level. On the individual level, it's just a tool we use with agency, but on a collective level it moves in directions beyond our control, and that's the part that's both dangerous and mostly ignored by those who defend it. And I suspect that's true because those who defend it are more interested in showing off how clever they are at using LLMs responsibly and don't want to shift attention away from themselves to the greater societal impact."}, {"id": 50642838, "au": "throwaway173738", "dom": 61, "sr": 79, "sc": 3.6, "ep": 3.67, "bs": 0.0, "d": 3, "age": 23.92, "grav": 350.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 1404, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.451, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "They’re doing it wrong because it would be convenient for them. The LLM is also a really good shortcut to get to the kind of rigor we should all be using. You can just as easily ask it to document what it would do for design review, then spike what it would do, then review its approach, then try to understand all of that, fine deficiencies in your understanding, ask for more documentation, finally understand, recommend other structures that would be better, commit to a final implementation, ship that, run a detailed automated test, decide whether that’s adequate, review test cases, and then put it in production. None of the decisions or understandings get automated out you just no longer have the long tedious step of doing the programming. I’m not sure whether programming is actually as important as reading someone else’s code."}, {"id": 50642098, "au": "criddell", "dom": 191, "sr": 80, "sc": 3.6, "ep": 3.66, "bs": 0.0, "d": 0, "age": 25.09, "grav": 379.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 23081, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I've always looked for computer applications that fit the bicycle for the mind metaphor and have thought a little bit about how AIs and LLMs fit into that. The answer seems to be \"it depends...\""}, {"id": 50647670, "au": "rglover", "dom": 149, "sr": 81, "sc": 3.6, "ep": 3.62, "bs": 0.0, "d": 1, "age": 17.37, "grav": 207.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 8801, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "Imo, because the difference between before and now is that someone was always looking at the code and now they're not (at least, not guaranteed to be).\n\nFrom various anecdotes, I'd assume most companies are forcing people to use this stuff in a fairly unproductive way (out of FOMO/chasing the dragon) and that no real care or thought goes into their AI setup beyond the basics.\n\nLet a system like that loose, more-or-less autonomously, at scale? Of course shit is hitting the fan."}, {"id": 50646652, "au": "bigstrat2003", "dom": 254, "sr": 82, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 1, "age": 18.73, "grav": 234.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.466, "fa": 0.0, "gp": 0.066, "bl": 0.0, "ds": 0.0, "txt": "I would say: smart people who give a shit don't use ineffective tools. In my opinion, LLMs are an ineffective tool. But I know (personally) a smart person who gives a shit who thinks otherwise. It's ok to disagree, and neither he nor I is upset by the other's opinion. The problem with the AI situation is that corporations are shoving it down people's throats, judging them by the tool they used rather than the work they produce. I don't mind if my employer says \"hey, you're getting a ton less work done than your teammate who uses AI\" (as long as he's not just producing broken slop, of course). But I do mind a great deal when my employer says \"you're doing great work, but you aren't using AI and that just won't do\"."}, {"id": 50647060, "au": "jiggawatts", "dom": 101, "sr": 83, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 1, "age": 18.24, "grav": 224.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 30634, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.326, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "Y’all are discovering what it’s like be a manager above programmers: providing instructions in English and getting back code you might not even fully understand even if you do try to read it.\n\nThis is the lived experience of millions of PMs, business owners, managers, and so forth.\n\nYou’re not discovering a new kind of programming method, unknown to the entire industry.\n\nIt was just unknown to you because you’ve all been ICs until now.\n\nYou’re all managers now!\n\nI hope you have a bit more sympathy for your boss now."}, {"id": 50645502, "au": "fzeroracer", "dom": 98, "sr": 84, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 1, "age": 20.36, "grav": 268.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 4208, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.27, "fa": 0.0, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "The amount of supposedly smart individuals that don't understand this is mindboggling.\n\nWith an LLM you're not creating code, you're a manager. There's little difference between dictating an LLM to do something vs telling your reports to do something in terms of technical ability used. And we've all known a software engineer that upon going up the chain of management loses most of their technical ability."}, {"id": 50655336, "au": "jubilee33", "dom": 228, "sr": 85, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 0, "age": 0.74, "grav": 6.1, "surf": 66.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 122, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.015, "bl": 0.0, "ds": 0.0, "txt": "I got halfway through the article and I kept seeing the same catch phrases my agent gives me all day, the ones I have repeatedly tried to get it to stop using.\n\nI tuned out and closed the window after that sorry, and immediately disregarded the opinion. If I want to read agent slop I have my own to read.\n\nPlease stop using AI for things we are supposed to actually parse and think about. It's tiring and we all hear the same voice all day, every day."}, {"id": 50642311, "au": "wtch98", "dom": 266, "sr": 86, "sc": 3.47, "ep": 3.47, "bs": 0.0, "d": 1, "age": 24.79, "grav": 371.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 91, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.475, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Companies used to have executives, and indeed senior engineers, who had worked for that company for decades. That changed as things like pensions and longevity awards went away thanks to MBAs\n\nNow the only pride isn't how you worked as a team to make the company do better over years, it's pride in how you jumped from company to company every 12-18 months\n\nThis is the same at the coalface and the executive level, and results in far worse outcomes."}, {"id": 50642425, "au": "sheepscreek", "dom": 199, "sr": 87, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 0, "age": 24.59, "grav": 366.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.758, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Completely agree. Someone wishing LLMs would disappear and people shouldn’t use them is doing wishful thinking. Theirs is an opinion piece, not a serious advice to follow.\n\nIan, you are my hero. This is the way."}, {"id": 50648485, "au": "codedrift_", "dom": 66, "sr": 88, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 2, "age": 16.25, "grav": 186.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 9, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.468, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd say this problem already existed. Your coworkers were writing code that definitely fulfilled some kind of task, but not in the logic we wanted. The problem as I see it is we could sit down and hash out that difference and then move forward together, and that tool is now gone. There's no understanding layer.\n\nThere's also no point in explaining to an agent the ins/outs of your app when the next agent/harness ignores everything and does the code its own way anyway. None of the tools for organizational behavior work either. What're you gonna do, PIP the LLM?"}, {"id": 50643545, "au": "bitwize", "dom": 45, "sr": 89, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 2, "age": 22.89, "grav": 325.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.243, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "An abstraction changes the building blocks you use to build with.\n\nA frontier LLM is like a whole goddamn construction company. Run by a surly guy named Vinnie who has connections to certain families..."}, {"id": 50648469, "au": "judge2020", "dom": 137, "sr": 90, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 2, "age": 16.28, "grav": 186.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 19369, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.077, "bl": 0.0, "ds": 0.0, "txt": "It's a tool as much as it is a magic hammer. Using a hammer requires precision, control, intention. A magic hammer that instantly repairs whatever it touches can be used by anyone, but many scenarios need a more nuances approach rather than just \"tap everything on my property with the magic hammer\"."}, {"id": 50646821, "au": "Zambyte", "dom": 80, "sr": 91, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 3, "age": 18.55, "grav": 230.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.431, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "LLMs (not SOTA, lol) help me write the spec, but I read and approve every word. If I don't like how something is written, I change it. I iterate on specs for hours sometimes before letting an LLM implement it. I'm using LLMs to help write it, but mostly by poking holes and driving a more holistic scope."}, {"id": 50645950, "au": "kube-system", "dom": 148, "sr": 92, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 1, "age": 19.71, "grav": 254.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 27156, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Those issues didn't just appear now, tech debt has caused outages for a very long time.\n\nProblems due to tech debt are popping up with more frequency in recent months because we have accelerated the discovery, exploitation, and remediation cycles of those problems."}, {"id": 50647143, "au": "Terr_", "dom": 53, "sr": 93, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 5, "age": 18.09, "grav": 221.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 28451, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.058, "bl": 0.0, "ds": 0.0, "txt": "\"So what I'm gonna need ya to do here is just sign this little formality for us to do 'Auto Mode', which means cousin Tony is gonna, like, check that stuff's good and shit so we'ze can getchu da stuff faster, easy peasy.\""}, {"id": 50648821, "au": "pegasus", "dom": 24, "sr": 94, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 2, "age": 15.71, "grav": 176.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.34, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "I think 'determinism' is fine. You yourself say it's about the slot machine aspect. People (us nerds especially) get hung up on literal meanings, but language is flexible and fuzzy like that, and it's for the better. And yes, a deterministic LLM would be less annoying than the ones we have today, but it still \"accumulates\" indeterminism during the training phase, which then manifests at inference time."}, {"id": 50655541, "au": "morcus", "dom": 79, "sr": 95, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 3, "age": 0.4, "grav": 4.8, "surf": 47.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 283, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Here's what I did, maybe it will help you.\n\nAsk it to generate a technical spec for a problem you discuss with it.\n\nThen, as if working with a freshly graduated new hire, go in and comment on every single thing you dislike about.\n\nThis will take a long time and feel pointless, but continue iterating with it unless you get something you like.\n\nAt the end, ask an agent to review each of your comments and come up with a SKILL for writing like you expect. Review the SKILL, obviously.\n\nI did not save time on the first project, but now I get a much more solid starting point to review from."}, {"id": 50647842, "au": "j2kun", "dom": 113, "sr": 96, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 1, "age": 17.15, "grav": 203.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 8441, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "I think this hits the nail on the head. The author says smart people who give a shit can be amplified by LLMs, but if you are going to have an LLM write TLA+ to model a race condition, that may take you out of your expertise. You have no fewer time pressures to ship a fix, but now you have this huge new domain to ramp up your expertise on so that you can properly validate it and give a shit. The pressures of using an LLM still push you toward being less of an expert."}, {"id": 50649016, "au": "zamalek", "dom": 124, "sr": 97, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 2, "age": 15.44, "grav": 171.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 15120, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.328, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "I was let go from a previous job for giving enough of a shit that it slowed me down in comparison. The extra effort was merely checking the code, and running the code locally before pushing. So categorically calling it \"nonsense\" is absurd."}, {"id": 50650560, "au": "Xirdus", "dom": 33, "sr": 98, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 7, "age": 12.44, "grav": 122.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 1116, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.387, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The kind of thing the AI will do based on a prompt can be easily predicted based on which model was used and what the prompt was - even if the result isn't what the prompt asked for. Not everything has this property. You can't predict if the dice will roll 6 based on where it was bought and how the throw was made. You can predict GPT will tell you GDP of USA when the prompt said \"which country has highest GDP\" unless the prompt also specifies to give very short answers.\n\nBut that's all besides the point. Predictability is a bad term for what compilers have that AIs don't."}, {"id": 50651811, "au": "Lockal", "dom": 188, "sr": 99, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 0, "age": 9.19, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 676, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.845, "fa": 0.0, "gp": 0.848, "bl": 0.0, "ds": 0.0, "txt": "Can be generalized to \"People build and use tools\", not just \"people use tools\".\n\nThe ability of building tools is irrevocable part of Homo Sapiens definition. Also it has nothing to do with being smart."}, {"id": 50649220, "au": "gf000", "dom": 26, "sr": 100, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 3, "age": 15.12, "grav": 166.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.36, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the mathematically correct world and also what people actually mean in these conversations is that inference is chaotic. A tiny variance in the input (just temperature, or a single changes word even if only in the system prompt) can drastically change the output, or in case of agents the whole flow/actions.\n\nThe same way as it happens for a double pendulum."}, {"id": 50642234, "au": "lf88", "dom": 135, "sr": 101, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 0, "age": 24.89, "grav": 374.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 239, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.634, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Wise people notice when something stops being \"just a tool\" and question where the technology is going. We are way beyond the \"just a tool\" point with LLMs."}, {"id": 50641625, "au": "smitty1e", "dom": 195, "sr": 102, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 0, "age": 25.95, "grav": 401.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4788, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.634, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Euclid for the win:\n\n\"There is no royal road to geometry\" is a famous ancient remark attributed to Euclid (c. 300 BC) when King Ptolemy I asked for an easier shortcut to learning geometry than working through Euclid's Elements."}, {"id": 50645999, "au": "Animats", "dom": 181, "sr": 103, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 0, "age": 19.64, "grav": 253.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 168316, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.63, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "When will the first major system that no one can fix fail?\n\nThat's the real question."}, {"id": 50651690, "au": "bluefirebrand", "dom": 6, "sr": 104, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 4, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 11231, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.331, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is very similar to the experience of using Claude to write code imo\n\nIt writes working code nowadays but everyone still seems to admit it's sloppy, poorly architected code unless you really keep a tight guide on it\n\nI think if you did the same experiment, wrote the code yourself, then prompted Claude, you'd see the same kind of \"the images are quite different\" thing\n\nIt's just that people don't care as long as the code works\n\nBut they should"}, {"id": 50642374, "au": "anothaway", "dom": 1, "sr": 105, "sc": 3.12, "ep": 5.64, "bs": 2.52, "d": 0, "age": 24.69, "grav": 369.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 1.7, "bl": 0.95, "ds": 0.0, "txt": "Something really bothers me about the \"it's just another higher-level abstraction\" argument but I can't quite nail down what.\n\nUsing an LLM is a completely different experience from moving to assembler to C, or C to Javascript. The nature of the activity you are performing in those transitions in the same, moving to an LLM is not. Even if you are writing in Javascript, you are still modelling a problem on to some representation in code. The only thing that is abstracted from you is memory management, a technical detail.\n\nWith an LLM you don't model the problem at all, you let something else do it. Moving from an low-code app builder to an LLM is a higher level of abstraction. Moving from writing code yourself to having an LLM write it is something different entirely.\n\n(Though the author seems to be advocating against that style of usage, which I agree with.)"}, {"id": 50651725, "au": "syngrog66", "dom": 251, "sr": 106, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 0, "age": 9.44, "grav": 80.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 345, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.276, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "\"tools\" one could potentially use to make software: chainsaws, kitten, smelly socks, beehives, uranium rods, photocopy machines, vomit puddles, tiny metal spoons, human bones, (...)"}, {"id": 50651441, "au": "carlosjobim", "dom": 132, "sr": 107, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 3, "age": 10.11, "grav": 89.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1513, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.316, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You decide who you work for, and you don't have to work for somebody else. Being grown up means to take responsibility for your actions and your life. Especially if you have specialized knowledge in a sector that doesn't need large capital investments.\n\nDoctors and lawyers don't blame somebody else, neither should programmers."}, {"id": 50652531, "au": "pegasus", "dom": 34, "sr": 108, "sc": 3.08, "ep": 7.5, "bs": 4.43, "d": 8, "age": 7.11, "grav": 53.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 224, "qw": 15, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": ["https://www.youtube.com/watch?v=-MiM5xfAe2c"], "ig": 1.869, "fa": 0.7, "gp": 0.768, "bl": 1.67, "ds": 0.0, "txt": "> the kind of thing the AI will do based on a prompt can be easily predicted\n\nSure, in the same way \"the kind of thing\" a dice will do when you throw it can be easily predicted.  You are trying to tease out subtle details that don't actually exist. 'Predictable' is perfectly fine.  So is 'deterministic'. People will get your gist, according to the depth of their understanding of the subject, as is the case always.\n\nAFAIK there are a couple of sources of indeterminism in modern LLMs.  One has its source in the nitty-gritty of computation pipelines in servers.  This one can be avoided by paying a price in resources (time and memory).  Then there's 'temperature', which is a purposefully introduced (pseudo-)randomness, which helps the net avoid getting stuck in local minima.  This can be set to zero, which degrades the model's general usefulness/accuracy but removes some of the unpredictability.\n\nBut the main source of indeterminism is accumulated during training.  This is the one people miss, because they are thinking of the model as a completed artifact.  But because we use these models with a new input pretty much every time, we are always encountering this last form of indeterminism.  I think this is why people get confused about the right word to describe what's happening.\n\nSabine Hossenfelder put out a video a few days ago on just this subject, it's worth a watch: https://www"}, {"id": 50654005, "au": "rcxdude", "dom": 5, "sr": 109, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 4, "age": 3.52, "grav": 21.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 11684, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "This could largely be because higher-level ideas are underconstrained: there's a lot of details to be filled in that could be filled in any number of different ways, and when formulating that idea you tend to just not imagine those details. LLMs are reasonably good at filling in those details but they aren't likely to make the same choices you would. (Which isn't necessarily an issue in and of itself: I would say the main trap is an LLM will have a bias towards filling in the details in the same way for everyone, which tends to make those details same-y in a way that you filling them in wouldn't. Sometimes this matters, other times it doesn't)"}, {"id": 50642447, "au": "eithed", "dom": 59, "sr": 110, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 2, "age": 24.56, "grav": 366.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 474, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Also, and I think it's more important, whether after you've told the agent to \"build the state machine representing these 7 states\" do you question what the agent actually delivered. This goes back to crux of the article - how much shit do you actually give (and this isn't solely about shit re your job, but also other people you're working with = creating a PR without a single thought behind it and handing over it to somebody else for them to review and decide whether given change is correct and needed is NOT giving a shit)"}, {"id": 50645923, "au": "t43562", "dom": 68, "sr": 111, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 2, "age": 19.77, "grav": 255.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 2851, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.863, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Shh.\n\n\"Every day we get better and better and better ......\"\n\nNow repeat the LLM prayer 1000x.  :-)\n\nSorry for this - just a relief to be able to make a joke like that to someone who won't necessarily give me the injured LLM fan response!"}, {"id": 50644225, "au": "bitwize", "dom": 25, "sr": 112, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 2, "age": 22.11, "grav": 307.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.945, "fa": 0.0, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": "This is why I've stopped talking about \"determinism\" and started talking about the transparent homomorphism between input to a compiler and what the resultant program actually does. Something that LLMs lack, especially if they live in someone's proprietary cloud."}, {"id": 50642074, "au": "mixdup", "dom": 114, "sr": 113, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 1, "age": 25.12, "grav": 380.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1945, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.829, "fa": 0.0, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "The difference there is the destination. Both engineers have been sped up, but one is targeting a number of lines of code and the other is targeting quality. They're both shipping faster, just shipping different things"}, {"id": 50645682, "au": "freecodeio", "dom": 105, "sr": 114, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 20.15, "grav": 264.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 499, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Frontier labs should make a goal to make llms deterministic, (I don't mean with temperature only) if they truly want to play the abstraction game. But I read somewhere that the undeterministic nature is what makes llms as smart as they are so here we are."}, {"id": 50642679, "au": "lelanthran", "dom": 180, "sr": 115, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 2, "age": 24.16, "grav": 356.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 34, "k": 15200, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.32, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> You do know that pangram isn’t always accurate and people have used the word genuine for decades or centuries? I hate how presumptive this comment is. You don’t actually know it’s ai. You are guessing.\n\nThere's a good chance that you don't know how probabilities work.\n\nI mean, if you are 99.99% sure of $FOO, you still don't know for sure, right? That doesn't mean you get to lump $FOO into the \"Well, it's still an open question, and we don't know\" bucket."}, {"id": 50641887, "au": "glimshe", "dom": 275, "sr": 116, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 1, "age": 25.42, "grav": 387.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.999, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Many people now enshrine human-made code as if most of it were any good and as if they used to like it in the past.\n\nCheck pre-AI comments on broad categories of software (outsourced code, \"Full stack\" engineer code, \"Dot net shop\" code, etc) and you'll remember the extreme contempt we used to have towards what essentially was other people's code.\n\nThe bad coders of yesterday produce more bad code with AI. The good coders of yesterday produce more good code with AI."}, {"id": 50642668, "au": "bathtub365", "dom": 91, "sr": 117, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 1, "age": 24.18, "grav": 356.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2066, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.954, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "I’ve come around to using LLMs to write all of my code now, but I still have that same feeling. I think it’s because of the nondeterministic nature of LLMs and how that’s the opposite of how basically everything in programming (tools, compilers, design) has worked for my entire career."}, {"id": 50646560, "au": "mk89", "dom": 87, "sr": 118, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 1, "age": 18.83, "grav": 236.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 16, "k": 1949, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.496, "fa": 0.42, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "> With an LLM you don't model the problem at all, you let something else do it.\n\nI ran enough experiments (with chatGPT/Claude, even astra/opus/fable) to realise this is not true. You start with something, then if you keep on \"accepting\" the ideas or the direction, you end up with something completely different. Which could be fine for some people who don't know yet what they want to do."}, {"id": 50650679, "au": "Swannie", "dom": 222, "sr": 119, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 2, "age": 12.17, "grav": 118.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1173, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.185, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Same... now I go back and look at it, I spot some tells.\n\nIt's frankly hard to discern between folks who's writing has been influenced by LLM written materials, vs. not.\n\nThere were enough \"not AI\" stylistic elements in the writing that allowed me to enjoy it."}, {"id": 50646965, "au": "zkxjzmswkwl1", "dom": 262, "sr": 120, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 0, "age": 18.34, "grav": 226.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 6, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "The tool in question has made me stop giving aforementioned shits. In fact, its prevented it entirely. I can no longer give two shits, one shit, red shits or blue shits."}, {"id": 50646513, "au": "bigstrat2003", "dom": 107, "sr": 121, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 1, "age": 18.89, "grav": 237.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean, the argument holds no water. An abstraction has a defined mapping from the higher level concepts to the lower level ones. LLMs do not, they are randomly generating code (correct or not) based on your input."}, {"id": 50649562, "au": "Zambyte", "dom": 77, "sr": 122, "sc": 2.73, "ep": 2.73, "bs": 0.0, "d": 3, "age": 14.51, "grav": 155.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.161, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I haven't tried yet, but I have been thinking about trying to take an application that was developed using spec driven development and trying to actually let an AI reimplement it from the specs. The trouble with that is that so far any application I have worked on that is sufficiently complex that it would be interesting to try, os one that I introduced spec driven development in after the project was already developed for a while (pre-ai). Applications that I developed fully with spec driven development with AI haven't gotten mature enough to really be interesting to enough to try that yet. I'll definitely try it soon though!"}, {"id": 50645718, "au": "Terr_", "dom": 46, "sr": 123, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 3, "age": 20.1, "grav": 262.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 28451, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I like to think of it as outsourcing tasks to a remote team of junior developers, who are extremely fast but have learning disabilites and weird cultural gaps.\n\nIf we choose to call it an \"abstraction\", it is at least an extremely different type:  It doesn't codify reliable rules or knowledge, and it can interfere/replace your own decision-making and executive function."}, {"id": 50642000, "au": "silveraxe93", "dom": 219, "sr": 124, "sc": 2.7, "ep": 2.7, "bs": 0.0, "d": 1, "age": 25.25, "grav": 383.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 881, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Yeah, even though I agree with the premise I had to stop reading halfway through.\n\nIt was obvious I was reading LLM output. And given I read the title I already knew the prompt."}, {"id": 50642658, "au": "julianlam", "dom": 116, "sr": 125, "sc": 2.7, "ep": 2.7, "bs": 0.0, "d": 2, "age": 24.2, "grav": 357.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3170, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "I believe the point GP is making is that both sets of engineers are accelerated by AI, but the lazy engineer is able to ship slop faster than the engineer who gives a shit"}, {"id": 50649949, "au": "Choad_20261104", "dom": 232, "sr": 126, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 0, "age": 13.76, "grav": 143.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": -3, "kpp": -0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.871, "fa": 0.0, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "WE HAVE TO HAVE BALANCE!\n\nFor each person who gives a shit, we must have at least one other person who takes a shit, otherwise the shit is just going to pile higher and deeper"}, {"id": 50641795, "au": "jpgvm", "dom": 274, "sr": 127, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 0, "age": 25.6, "grav": 392.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 10014, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.107, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There was slop before and the only difference now is there is more slop.\n\nPersonally I think I prefer AI slop to human slop.\n\nGiving a shit and having access to these tools lets you do some absolutely crazy things, that is a win no matter where you sit on the slop <-> not-slop continuum."}, {"id": 50651114, "au": "bagacrap", "dom": 120, "sr": 128, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 1, "age": 11.07, "grav": 102.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 4014, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.068, "fa": 0.0, "gp": 0.043, "bl": 0.0, "ds": 0.0, "txt": "Right. I want the author to be right, but I have even more fires to put out now than before, both due to layoffs/higher output expectations, and due to endless LLM reported vulnerabilities. If I were the only one with this superpower, and the rest of the world hadn't changed, then I'd agree more.\n\nStill, he's a lot more right than whoever said not to use an LLM."}, {"id": 50653261, "au": "DarkNova6", "dom": 14, "sr": 129, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 2, "age": 5.47, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 2109, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the way people use AI is telling how they have worked before LLMs, and if somebody says they don't need to model they probably didn't do so (or saw the value in doing so) to begin with.\n\nOr God forbid, people who generate unit tests based on the implementation to reach code coverage requirements."}, {"id": 50642602, "au": "jeremyberemy", "dom": 164, "sr": 130, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 1, "age": 24.28, "grav": 359.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 86, "kpp": 21.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.848, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Thank you for sharing this. One of the reasons I come to HN is that sometimes I get stuff like this: something that I had an inkling should have existed, but couldn't quite put my finger on. Working with skills has sucked for a long time (in my experience), to the point where I stopped using them for a while. This looks like it has potential."}, {"id": 50642156, "au": "ro_sharp", "dom": 204, "sr": 131, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 1, "age": 24.99, "grav": 376.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 160, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do those startups have any customers? That’s when the glean of shiny UI and “just the happy path” thoughtless slop tends to fall apart"}, {"id": 50646213, "au": "jeremyberemy", "dom": 166, "sr": 132, "sc": 2.5, "ep": 3.35, "bs": 0.85, "d": 3, "age": 19.31, "grav": 246.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 86, "kpp": 21.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.425, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "No suggestions yet, I'm still trying to figure out how this works. For sure, measuring is better than not measuring. It takes nothing for me to write a skill that I _think_ will work, and even less to have an agent do it. But to actually know if it's improving how a model works on my specific codebase is more challenging. Especially as models get better, and cruft needs to be delved out of previous versions of skills.\n\nI'd love to be able to do the same thing with my documentation. I used to hand-write everything (like a Neanderthal, I guess?), but as I code more and more with agents, documentation starts to sprawl. I keep the documentation I've handwritten, because it helps me understand, but I don't know how much it helps sub-agents. I'm still trying to figure out what the simplest thing is that works."}, {"id": 50642400, "au": "1234asg", "dom": 224, "sr": 133, "sc": 2.49, "ep": 5.0, "bs": 2.52, "d": 0, "age": 24.63, "grav": 367.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 3, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.42, "fa": 0.0, "gp": 1.15, "bl": 0.95, "ds": 0.0, "txt": "The propaganda has been automated. Even blog posts like this one use tools.\n\n\"Claude, please write a website with a beige background and a pro-tool use article.Use vernacular in order to make it seem more human.\"\n\nThe second point failed of course, since Claude using \"give a shit\" is still boring Claude."}, {"id": 50642411, "au": "Kim_Bruning", "dom": 255, "sr": 134, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 24.61, "grav": 367.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 4889, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Get an AI agent with a SOTA model. Point it at human made production code. \"Find issues with this code, write them up as issue tickets\".\n\nCheck them. In 2026Q4, most of them will be real.\n\nNow scream."}, {"id": 50646681, "au": "bigstrat2003", "dom": 278, "sr": 135, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 2, "age": 18.69, "grav": 233.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 22, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.529, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The bad coders of yesterday produce more bad code with AI. The good coders of yesterday produce more good code with AI.\n\nThe good coders of yesterday produce the same amount of code with AI, because the effort it takes to review it and make sure it isn't slop wipes out any speed gains they might have had."}, {"id": 50642641, "au": "lelanthran", "dom": 174, "sr": 136, "sc": 2.36, "ep": 2.36, "bs": 0.0, "d": 2, "age": 24.22, "grav": 357.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 15, "k": 15200, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.496, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I was taken aback that even on my M4, just scrolling the page was lagging perceptibly.\n\nThank god! I spent over a minute trying to figure out why my browser was laggy.\n\nI mean, the page itself doesn't look like it has anything to cause lag, so I never suspected it."}, {"id": 50653826, "au": "rich_sasha", "dom": 155, "sr": 137, "sc": 2.36, "ep": 4.05, "bs": 1.7, "d": 4, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 10958, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.634, "fa": 0.0, "gp": 0.148, "bl": 0.64, "ds": 0.0, "txt": "In fairness, I was comparing contemporaneous hunter gatherers and farmers. And I’m not saying farming was impossibly hard, only that it was, as I understand, considerably harder work with lower quality of life, but supported far greater population density, so it won in the long term.\n\nJust as AI might be worse than proper software, but might win in numbers. Or, I’m sure, a proper piece of furniture, made by a cabinet maker, beats IKEA chipboard, but the latter still “won”."}, {"id": 50647503, "au": "joshheitzman", "dom": 76, "sr": 138, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 2, "age": 17.61, "grav": 212.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 222, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.994, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are the specs all sufficiently abstracted from the code base that you could have agent's replay them and rebuild the code base from zero?  Or is each spec referencing things from the current state of the code such that the drift in the code base that would occur on replay would cause later specs to become non-sensical?"}, {"id": 50648804, "au": "debo_", "dom": 261, "sr": 139, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 0, "age": 15.75, "grav": 177.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4210, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.557, "fa": 0.28, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Hi authors. If you find yourself contemplating an edgy know-it-all millennial title for your blogpost in the future, please reconsider!\n\nThanks,\n\n- The English Language"}, {"id": 50646280, "au": "tedtimbrell", "dom": 78, "sr": 140, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 2, "age": 19.22, "grav": 244.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 29, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.76, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Is the AI helping with writing the spec or is that something you do entirely alone? If it's the latter than I can see this working but otherwise the writing quality of SOTA models is so poor that I'd rather the LLM just build the entire project"}, {"id": 50645618, "au": "zappb", "dom": 168, "sr": 141, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 2, "age": 20.22, "grav": 265.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’ve found developing skills to be really easy. The problem is most skill writers don’t bother testing or reviewing their skills and making updates as models get better. Or they implement outdated meme knowledge of how to use models."}, {"id": 50650154, "au": "tayo42", "dom": 16, "sr": 142, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 2, "age": 13.34, "grav": 136.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 4989, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.781, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "Makes me wonder how running a model with  temperature set to 0 and only integer operations would work?"}, {"id": 50651045, "au": "mrheosuper", "dom": 112, "sr": 143, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 3, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I remember few years ago when LLM programming was new, my boss created many PR that break our beautifully crafted architecture, layer violation everywhere.\n\n\"But hey, it works\" - He said."}, {"id": 50647106, "au": "sn9", "dom": 64, "sr": 144, "sc": 2.12, "ep": 4.11, "bs": 1.99, "d": 1, "age": 18.17, "grav": 223.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 1932, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": ["https://www.pathsensitive.com/2022/03/abstraction-not-what-you-think-it-is.html"], "ig": 0.288, "fa": 0.62, "gp": 1.15, "bl": 0.75, "ds": 0.0, "txt": "People have been conflating delegation for abstraction.\n\nAbstraction in a CS context [0] is not the same as asking someone to do something for you. You'd never describe management that way.\n\n[0] https://www.pathsensitive.com/2022/03/abstraction-not-what-y..."}, {"id": 50642268, "au": "kkirsche", "dom": 177, "sr": 145, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 1, "age": 24.85, "grav": 373.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 575, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.671, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You do know that pangram isn’t always accurate and people have used the word genuine for decades or centuries? I hate how presumptive this comment is. You don’t actually know it’s ai. You are guessing."}, {"id": 50641621, "au": "AIShill101", "dom": 183, "sr": 146, "sc": 2.06, "ep": 4.58, "bs": 2.52, "d": 0, "age": 25.95, "grav": 401.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 1.15, "bl": 0.95, "ds": 0.0, "txt": "Yep agree with the article. Not much to say but I do believe this will lead to our software systems being able to just jump like 2-3 levels of abstraction and I cannot wait to see what that looks like.\n\nGotta wait tho for LLMs to permeate into workflows tho. And for actually efficient architectures to be found."}, {"id": 50642739, "au": "wtch98", "dom": 268, "sr": 147, "sc": 2.02, "ep": 2.87, "bs": 0.85, "d": 3, "age": 24.09, "grav": 354.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 91, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.81, "fa": 0.34, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "It's really annoying that I didn't realise this until about 5 years ago when I started putting significant money into the US, because if you can't beat them, join them. This of course (in aggregate) makes the problem worse for society, but that's the individualist way, and I'm not sure how we get out of the mess."}, {"id": 50650051, "au": "Choad_20261104", "dom": 201, "sr": 148, "sc": 2.0, "ep": 5.58, "bs": 3.58, "d": 1, "age": 13.53, "grav": 139.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 104, "qw": 11, "k": -3, "kpp": -0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": ["https://youtu.be/Facvq_Lei8Q?t=217"], "ig": 1.551, "fa": 0.42, "gp": 0.508, "bl": 1.35, "ds": 0.0, "txt": ">engineering skills are no longer needed in this future with AI\n\nThat is one very interesting proposal. Collab, or slave/master or child/student....\n\nso many possibilities.\n\nwhat does a 'hard day at the office' look like if you are the caretaker of some special purpose LLM? ...some needy software tool that is getting down thumbs from users that your job description says is your entire purpose.\n\npoopy diaper LLM? teach it to change itself or go in the loo.\n\netc.\n\ncould be interesting for some people who have that kind of caretaker personality, but maybe an absolute hell if you don't like it AND you need the money.\n\nremember in BTTF2 where Marty got fired?\nhttps://youtu.be/Facvq_Lei8Q?t=217"}, {"id": 50650005, "au": "crazygringo", "dom": 8, "sr": 149, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 3, "age": 13.64, "grav": 141.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 237, "qw": 0, "k": 84638, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.823, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When you say \"then it's hard to even notice what you're not considering\", the solution is to get Claude to tell you what you're not considering. Get it to give you all the options.\n\nAt each big question, I explicitly ask Claude what are all of the possible solutions or approaches we should consider here. Even the bad ones. Give me a list of all of them that are even remotely relevant, then give me the pros and cons of each, and your recommendations. I also ask, are there any other big questions we should be asking that we're not, that could affect e.g. performance/security/upgradability/etc. later?\n\nQuite frequently, I wind up selecting something that's not its initial recommendation, because one of the pros or cons reveals a constraint I hadn't thought about, or a constraint that Claude assumed was super rigid but is actually quite flexible. It's very important to force Claude to do breadth-first searches, because it won't do it on its own without you telling it to do so.\n\nObviously you have to guide this towards the things that seem important to drill down into. So I'll go through this process rigorously on the biggest design decisions, and then on a lot of small details I'll just go along with its recommendations because I understand that if it fails for some reason, that will become obviously apparent and it won't be a ton of work to change it later on."}, {"id": 50650569, "au": "fwlr", "dom": 13, "sr": 150, "sc": 1.93, "ep": 1.93, "bs": 0.0, "d": 2, "age": 12.41, "grav": 121.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.64, "fa": 0.0, "gp": 0.298, "bl": 0.0, "ds": 0.0, "txt": "You are describing collaborating with another entity, which is not the feeling I get from my keyboard or my compiler."}, {"id": 50646180, "au": "t43562", "dom": 121, "sr": 151, "sc": 1.92, "ep": 4.96, "bs": 3.05, "d": 1, "age": 19.36, "grav": 247.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 2851, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.453, "fa": 0.28, "gp": 0.517, "bl": 1.15, "ds": 0.0, "txt": "I don't feel as good about the past as you - my experience is that people that appeared to produce faster won all the plaudits.  There are, for example, the guys management love - they arrive, produce a turd with a shiny UI that doesn't work and leave.  Praise is heaped on them but there's only shit for the person who has to cope with the steaming heap of bugs they left.\n\nWith AI this will be the same - \"AI is AMAZING.. What's the problem with those reliability engineers tho...?\"\n\nI have met amazing people who are fast but, thus far, the few that I've encountered  cut corners and use their position to get away with it.  I admit this is anecdotal so take that for what it's worth."}, {"id": 50654159, "au": "Bayart", "dom": 169, "sr": 152, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 3, "age": 3.12, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3680, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.796, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I regularly batch review skills / agents for overlap with what other tools are doing, plus benchmarking for effectiveness.\n\nIf there's an issue with skills drifting, it might have more to do with not dogfooding enough."}, {"id": 50650373, "au": "eBombzor", "dom": 142, "sr": 153, "sc": 1.86, "ep": 1.86, "bs": 0.0, "d": 1, "age": 12.85, "grav": 128.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 814, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.792, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Holy this is exactly how I feel... Like I almost feel like I need to consult the LLM before doing anything myself, it's weird. I care but I also have little confidence now."}, {"id": 50654821, "au": "Otterly99", "dom": 179, "sr": 154, "sc": 1.83, "ep": 1.83, "bs": 0.0, "d": 3, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 124, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.777, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would be interested if you have some links that can show how reliable Pangram is. In the past, it was not super reliable but I have heard that version 4 is a big leap forward, so I would be happy to change my mind."}, {"id": 50650636, "au": "rukuu001", "dom": 198, "sr": 155, "sc": 1.8, "ep": 3.0, "bs": 1.19, "d": 0, "age": 12.29, "grav": 119.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1527, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.66, "fa": 0.0, "gp": 0.998, "bl": 0.45, "ds": 0.0, "txt": "Speed of human comprehension is the limiting factor in effective and responsible AI tool use. There's plenty we can do to fix that."}, {"id": 50642160, "au": "tom_", "dom": 223, "sr": 156, "sc": 1.79, "ep": 1.79, "bs": 0.0, "d": 1, "age": 24.98, "grav": 376.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 3902, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.35, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have had the same Logitech mouse for 5 years, so I'm always pleased to be saved a click. Thank you."}, {"id": 50649354, "au": "impizulu", "dom": 96, "sr": 157, "sc": 1.79, "ep": 4.84, "bs": 3.05, "d": 1, "age": 14.9, "grav": 162.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 34, "k": 6, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.668, "fa": 0.0, "gp": 0.632, "bl": 1.15, "ds": 0.0, "txt": "JavaScript is abstracting a lot more away from you than just memory management lmao there is so much out-of-the-box logic hidden away from the developer. And memory management is not just a \"technical detail\" it's pretty fundamental.\n\nBut yeh using LLMs to write code is a higher level of abstraction than even JavaScript.\n\n> Even if you are writing in Javascript, you are still modelling a problem on to some representation in code... With an LLM you don't model the problem at all, you let something else do it.\n\nI feel like these sentences don't really go together. You can still model the problem and present it to the LLM, then the LLM writes the code, no? You can model a problem in plain English or some other non-code form and that still counts as modelling a problem? Or maybe I'm misunderstanding? But for sure you are being abstracted away from a certain amount of understanding when you don't actually write those lines of code to resolve that problem, you pass that job onto the LLM. But a similar situation could be a senior software engineer passing on a problem to junior software engineers and this is seen as acceptable. However, in this situation we also assume that the senior software engineer was once a junior and so has already acquired a level of understanding. Idk. So many ways to look at this"}, {"id": 50646907, "au": "Vegenoid", "dom": 175, "sr": 158, "sc": 1.76, "ep": 1.76, "bs": 0.0, "d": 1, "age": 18.45, "grav": 228.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2111, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.679, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "People are becoming so accustomed to LLM-written things. I started reading it and it was immediately apparent that it’s an LLM-written blog post saying that LLMs are good and don’t atrophy your ability to think.\n\nIf you can’t communicate on your own, how do I have any idea if you can think on your own?"}, {"id": 50642449, "au": "soon_to_be_sb", "dom": 60, "sr": 159, "sc": 1.74, "ep": 1.74, "bs": 0.0, "d": 2, "age": 24.55, "grav": 365.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 89, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.408, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "But the management wants to use it the \"build me a program\" way..And the AI companies want to use it that way too..."}, {"id": 50649539, "au": "bemtevi", "dom": 67, "sr": 160, "sc": 1.6, "ep": 1.6, "bs": 0.0, "d": 3, "age": 14.56, "grav": 156.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.682, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even if the problem existed, the problem has a new order of magnitude. Many of the problems AI has brought on are like that, like university cheating. A whole new order of magnitude."}, {"id": 50646026, "au": "kube-system", "dom": 62, "sr": 161, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 3, "age": 19.6, "grav": 252.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 27156, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not anything new to AI.  Bad management perennially tries to outsource core competencies to save a buck to hit a quarterly bonus, only to clean up the mess later.  The US tech industry has been through this before with various outsourcing trends."}, {"id": 50652191, "au": "greyface-", "dom": 103, "sr": 162, "sc": 1.44, "ep": 2.63, "bs": 1.19, "d": 2, "age": 8.11, "grav": 64.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 5, "k": 7423, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.612, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> You’re all managers now!\n\nNo thanks, boss.  I've quit my job in the past over being promoted against my will from IC to TL/PM, and I'm not afraid to do it again."}, {"id": 50647077, "au": "what", "dom": 63, "sr": 163, "sc": 1.42, "ep": 1.42, "bs": 0.0, "d": 3, "age": 18.21, "grav": 223.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 864, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 0.605, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Management has always used it this way. They’ve always prompted LLMs to “build them a program”, just human ones. It’s only natural that they think you should be able to do the same."}, {"id": 50639747, "au": "Noamc0405", "dom": 19
