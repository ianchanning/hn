_pct": 37.2, "terms": "tools, human, smart, shit"}, {"slug": "general_commentary", "label": "General Commentary", "count": 32, "useful": 2, "useful_pct": 6.2, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 14}, {"category": "low_cred_or_joke", "count": 3}, {"category": "code_repository", "count": 2}], "story_anchors": ["smart", "shit", "tools", "systems", "engineers", "giving", "human", "bugs", "lazy", "makes", "system", "slop", "care", "ones", "decades", "line", "engineer", "model"], "largest_root": {"root_id": 50642374, "author": "anothaway", "slots": 107, "start_dom": 1, "end_dom": 107, "share_pct": 38.5, "top_dom1_age": 24.7, "top_dom1_author": "anothaway"}, "buried_cutoff": 83, "rescue_top_k": 56, "ablations": [], "tournament": [], "comments": [{"id": 50654146, "au": "Bayart", "dom": 167, "sr": 1, "sc": 12.09, "ep": 12.09, "bs": 0.0, "d": 4, "age": 3.15, "grav": 19.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 113, "qw": 0, "k": 3680, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "epistemic_gold", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": ["https://github.com/alchimestre/truthiness"], "ig": 1.615, "fa": 2.36, "gp": 1.079, "bl": 0.0, "ds": 0.0, "txt": "Two things I'm doing with this :\n\n- Automatise generating documentation for humans that agents can also consume. For me that mostly visual, to-the-point READMEs. In any case documentation as code is the way to go IMO, I don't like dealing with an extra layer of Notion MCPs or what have you.\n\n- Keep long-term memory within your project / harness. If anything that specific point is the most important IMO. That's what made Hermes successful, and there are projects out there like Mem0, Honcho, SuperMemory working on that. I have my own little memory engine called Truthiness [1]. I don't claim it's working better than the rest, but at least it's resilient to staleness and it's my very own slop.\n\n[1]: https://github.com/alchimestre/truthiness"}, {"id": 50641745, "au": "Bayart", "dom": 163, "sr": 2, "sc": 11.27, "ep": 11.41, "bs": 0.0, "d": 0, "age": 25.7, "grav": 395.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 88, "qw": 0, "k": 3680, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": ["https://github.com/microsoft/skillopt"], "ig": 1.299, "fa": 2.08, "gp": 1.677, "bl": 0.0, "ds": 0.0, "txt": "I don't know if I count as smart - the breadth of what can be done nowadays as opposed to what I'm achieving leads me to think \"maybe not as much as I thought\" - but I certainly give a shit, and most of my dev time is being used to write tools that I can rely on. Perks of having internalized being in the first line when SHTF. Shoutout to SkillOpt [1] for helping me get bits from \"probably does what I want at an acceptable level\" to \"actually does it\". It's a great way to burn excess quota.\n\n[1]: https://github.com/microsoft/skillopt"}, {"id": 50648567, "au": "crazygringo", "dom": 2, "sr": 3, "sc": 8.88, "ep": 8.88, "bs": 0.0, "d": 1, "age": 16.14, "grav": 184.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 16, "k": 84638, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.534, "fa": 0.76, "gp": 2.143, "bl": 0.0, "ds": 0.0, "txt": "> With an LLM you don't model the problem at all, you let something else do it.\n\nI've been using Claude Code for many months now, and this is not my experience at all.\n\nWhenever I work on something, I have a back-and-forth with Claude that make take anywhere from 3 to 30 turns to fully work out the model together, so that we both understand it completely. That's the hard part.\n\nThen once it's all modeled, I have it write it all up as documentation, which I then read to review and correct anything wrong. In a 10-page document, there's usually a few sentences that need a slight clarification.\n\nThen I start a fresh session, point it at the spec, and let Claude chug away at building it in code for 15 or 30 minutes. That's the easy part.\n\nI feel like I'm still doing all the hard work of modeling everything that is important at the product/user level. But now I just get to skip the slog of coding itself.\n\nTo me, it very much does feel like moving up to a higher level of abstraction, where we're writing technical documentation in English together instead of technical code itself."}, {"id": 50642785, "au": "SquibblesRedux", "dom": 192, "sr": 4, "sc": 8.79, "ep": 8.79, "bs": 0.0, "d": 0, "age": 24.01, "grav": 352.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 1370, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.391, "fa": 0.95, "gp": 1.942, "bl": 0.0, "ds": 0.0, "txt": "The article is a good read and I agree with the author. Using LLMs, or any other tool, to get the job done is fine so long as the job is done adequately.\n\nAn unfortunate scenario I would bring up is when an engineer uses an LLM but only gets the job done 95% correctly, and then starts arguing that the last 5% doesn't really matter, or that the last 5% just isn't possible (because their favorite LLM can't one-shot it). Those sorts of engineers, IMHO, should be shown the door. They are the ones that don't care and they drag us all down."}, {"id": 50652692, "au": "AngryData", "dom": 154, "sr": 5, "sc": 7.79, "ep": 8.64, "bs": 0.85, "d": 3, "age": 6.76, "grav": 49.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 422, "qw": 0, "k": 5139, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.95, "fa": 0.95, "gp": 0.932, "bl": 0.32, "ds": 0.0, "txt": "Oh sure there are plenty of things to do, but they don't require non-stop labor to do it. Fences don't require weeks of labor to maintain each year, just walk the fences once in awhile and fix occasional breaks. Maybe every few years you gotta spend a week building new fence that rotted. Cows don't have to be milked for hours at a time. It takes less than a minute to throw more bedding down and food for animals. You don't have to watch and sleep next to a sick animal all day and night, it isn't going to help.\n\nPeople had in better and easier lives 100 years ago than 200 years ago, which was better than 500, 1000, 2000, 5000 years ago. Technology and farming and animal husbandry tasks all got better and easier every step of the way. So if someone could farm survive on it 5000 years ago with no metal tools, how is someone 500 years ago with metal tools, plows, plow horses, scythes, better crop genetics and higher crop diversity, etc, working so damn hard to just barely survive? How would people without those tools manage it at all? Just an axe by itself removes massive amounts of needed labor.\n\nIf living a basic farmer's life is still so damn hard after thousands of years of improvements, there is no way they could of survived and thrived before the bronze age. Just look at the clothing medieval people wore, how much time and labor was spent on making them? It isn't like clothing"}, {"id": 50641734, "au": "rich_sasha", "dom": 151, "sr": 6, "sc": 7.43, "ep": 7.58, "bs": 0.0, "d": 0, "age": 25.73, "grav": 395.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 203, "qw": 0, "k": 10958, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.959, "fa": 0.0, "gp": 2.054, "bl": 0.0, "ds": 0.0, "txt": "I sort of hope it’s true. My concern is that “us tool users who give a shit” might end up like hunter gatherers surrounded by farmers.\n\nMy understanding is, hunter gatherers were in many ways superior to their farming brethren. They were healthier, on a better diet, had better teeth (less carbs and grit cracking their teeth), higher age expectancy etc. They worked less hard - only so much hunting and gathering to be done in a day, vs farming which is round the clock. In a natural calamity, they could hope to migrate, where farmers were just royally screwed if the crops failed.\n\nBut due to scarce resources, their reproduction rates were lower, and ultimately they lost out to the farmers. As Stalin said, quantity has a quality of its own.\n\nAre we going to be like the people who insisted that cars cannot ever replace horses, because horses are smart, hardy, reliable animals? Or like the blacksmiths who looked with dismay at shoddy, factory made nails?\n\nMaybe not. Maybe it turns out AI is smart enough to make incremental software changes, but left in charge screws up (would be an interesting case study on how hard is it to manage things). But I fear the odds are against us."}, {"id": 50649912, "au": "rjbwork", "dom": 235, "sr": 7, "sc": 7.38, "ep": 7.38, "bs": 0.0, "d": 2, "age": 13.84, "grav": 144.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 71, "qw": 10, "k": 5984, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": ["https://en.wikipedia.org/wiki/The_Question_Concerning_Technology"], "ig": 1.299, "fa": 1.04, "gp": 0.941, "bl": 0.0, "ds": 0.0, "txt": "> We shape our tools and thereafter our tools shape us.\n\nHeidegger speaks of this sort of thing in https://en.wikipedia.org/wiki/The_Question_Concerning_Techno...\n\nThe core idea is not that technology is tools or not tools, but that technology is a state of affairs within which we live.  The technology makes demands of us and we make demands of it and we do so in this vicious loop.  We have always been something like a cross between cyborgs and worker ants from the moment the first tool was used."}, {"id": 50648800, "au": "_benj", "dom": 81, "sr": 8, "sc": 7.35, "ep": 7.5, "bs": 0.0, "d": 1, "age": 15.75, "grav": 177.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 18, "k": 2461, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.564, "fa": 0.42, "gp": 1.812, "bl": 0.0, "ds": 0.0, "txt": "> Something really bothers me about the \"it's just another higher-level abstraction\" argument but I can't quite nail down what.\n\nI've been thinking about this and I think the main difference is that with abstraction as we had them you can inspect them. For a given input you can examine the output and develop trust in the attraction. In math proofs more or less show why certain tricks and shortcuts works, L'Hopital or the power rule to differentiate a function.\n\nThe outout of an LLM is not deterministic and thus it break the ability to inspect the output and develop trust in the abstraction. And thus I don't even think this qualifies as an abstraction!\n\nThe analogy would be a C compiler that for a given C input has the ability to generate an infinity variety of assembly and machine code outputs!\n\nSo yeah, I think considering LLMs as an abstraction is a misnomer."}, {"id": 50642116, "au": "mdemare", "dom": 171, "sr": 9, "sc": 7.3, "ep": 7.3, "bs": 0.0, "d": 0, "age": 25.06, "grav": 378.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 2368, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.782, "fa": 0.0, "gp": 2.148, "bl": 0.0, "ds": 0.0, "txt": "The article is AI slop, flagged. In general, as soon as I encounter the word \"genuine\", I stop reading, send a few paragraphs to pangram, and usually see my suspicions confirmed.\n\nYou know, I'll read AI content, or AI assisted essays, but I do want disclosure. Otherwise I just feel scammed - especially for content that pretends to be personal experience, and not, say, an explanation of the Grothendieck Period Conjecture, about which I had been avidly reading AI content this morning."}, {"id": 50642685, "au": "mschuster91", "dom": 267, "sr": 10, "sc": 7.19, "ep": 7.19, "bs": 0.0, "d": 2, "age": 24.15, "grav": 356.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 300, "qw": 14, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 2.104, "fa": 0.42, "gp": 0.726, "bl": 0.0, "ds": 0.0, "txt": "> That changed as things like pensions and longevity awards went away thanks to MBAs\n\nMBAs and their groupthink are one thing and bad enough, but IMHO the true danger comes from what replaced pensions - the stonk market - that created that groupthink.\n\nBasically, before 401ks and other retail investment vehicles appeared, the stock market's primary function was to collect money from large scale investors (banks, insurances and the likes) and put it to productive usage. Boring stuff.\n\nBut once people's retirements were tied to the stock markets, the stock markets were societally and thus politically forced/incentivized to always go up, and that meant that there suddenly was a large, continuous influx of capital to nowadays the tune of dozens of billions of dollars a month. That in turn meant a huge incentive to siphon tiny margins off of all the trades (which led to HFT being a thing) and a constant incentive for C-level leadership to engage in all kinds of shady deals to appear better to the markets - complex webs of shell companies to avoid taxes, financial fraud, sale-lease-back vulturism destroying entire companies...\n\nAnd it turned out, there was so much money flowing into the US retirement savings system that it couldn't be soaked up by the American economy alone, which led to American companies and investment vehicles buying up assets across the world, treating them just "}, {"id": 50650552, "au": "fwlr", "dom": 71, "sr": 11, "sc": 7.18, "ep": 7.48, "bs": 0.0, "d": 1, "age": 12.46, "grav": 122.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 201, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 2.016, "fa": 0.0, "gp": 1.889, "bl": 0.0, "ds": 0.0, "txt": "Plato initially defined man as a featherless biped, and was famously refuted with a plucked chicken. For a two-word definition of humans today, I’d go with “social tool-user”; which is to say, tool use is a very deep part of our psyche and could be quite a complex phenomenon that simultaneously defies simple description yet feels like an obviously simple concept to us.\n\n“Higher-level abstraction” captures part of what it is to be a ‘tool’, as does “deterministic”. I think a key property of tools is that they become an extension of your body. A carpenter does not look at the hammer as he swings it, he is not trying to see how the hammer reacts to being swung. It becomes part of his body, a new end-effector replacing and extending the previous end-effector, his hand, and operating at the same pre-conscious level. The hammer-hand-man symbiote then enters a control system feedback loop with each nail as he hits it, watching how the nail reacts and adjusting, without the nail ever becoming part of the symbiote’s ‘self’.\n\nFrom this perspective, I claim a compiler is a higher-level abstraction that can become an extension of a tool user, while an LLM is a higher level abstraction that cannot (perhaps because it has a little bit of its own agency)."}, {"id": 50642016, "au": "tomaytotomato", "dom": 150, "sr": 12, "sc": 7.17, "ep": 7.17, "bs": 0.0, "d": 0, "age": 25.23, "grav": 382.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 506, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.692, "fa": 0.34, "gp": 1.531, "bl": 0.0, "ds": 0.0, "txt": "I am not smart, but I love to tinker and break stuff.\n\nWith an LLM I can now do that 10x faster, but I am not a proxy. I am a human hypervisor that gets lazy notifications whilst queuing up lots of work.\n\nSoftware engineering is changing, and I don't know what its going to look like. The whole concept of \"shift right\" and other ways of working could be redundant in future.\n\nThe junior engineer question as well; I think teaching juniors will change from loops, if/else, maps, SOLID, ACID, 3NF etc. to something more blocky and abstract.\n\nWill engineering at the fundamental level (resiliency, adaptability, maintainability) change, I think not."}, {"id": 50646385, "au": "dapperdrake", "dom": 74, "sr": 13, "sc": 7.02, "ep": 7.46, "bs": 0.0, "d": 1, "age": 19.08, "grav": 241.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 401, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.861, "fa": 0.28, "gp": 1.582, "bl": 0.0, "ds": 0.0, "txt": "Programming languages all the way down to and including machine code are specifically designed to be deterministic and to be formal languages for constructive (math/logic concept vs law of excluded middle) algorithms.\n\nStatistical models are both non-deterministic and non-constructive (math/logic concept, assume law of excluded middle, and on top of that axiom of choice)\n\n\"Computer algorithms\" have also had to already face that possibly P != NP.\n\nBoth are expressible as formal mathematics, but they are about as different as CPU register integer math and floating point math.\n\nAnd LLMs come down on the other side compared to programming languages."}, {"id": 50646163, "au": "Zambyte", "dom": 75, "sr": 14, "sc": 6.94, "ep": 7.39, "bs": 0.0, "d": 1, "age": 19.38, "grav": 247.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 10, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.132, "fa": 0.7, "gp": 1.883, "bl": 0.0, "ds": 0.0, "txt": "> With an LLM you don't model the problem at all\n\nYou don't. I do. I do spec driven development using AI. I iterate on spec documents until they outline precisely how I understand the problem space and the solution, before letting AI implement the specification. The step of implementing the specification is essentially like compiling the spec into source code, before passing it to the actual compiler to produce machine code.\n\nIn my workflow, the specs really are just an artifact at a higher level of abstraction from the source code."}, {"id": 50652161, "au": "phs318u", "dom": 17, "sr": 15, "sc": 6.84, "ep": 7.28, "bs": 0.0, "d": 2, "age": 8.15, "grav": 64.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 13, "k": 4677, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.863, "fa": 0.76, "gp": 0.51, "bl": 0.0, "ds": 0.0, "txt": "> One thing I hate about the \"it's just another higher-level abstraction\" is the indeterminism.\n\nI was (various flavours of) an architect for the last 20 years, having been a coder for the 20 before that. If you've ever worked with disparate teams of developers (and other engineers) trying to get your solution implemented how you've designed it, you'll know that it involves lots of discussion, exposition, scenario-ing, rabbit holes, one or two dead ends, and re-architecting along the way. And that's if the devs are good. If you're using AI to code (leaving aside one-shotting, vibe-coding, slop-shipping), then you aren't coding, you're architecting and dealing with mostly reasonable team of devs who sometimes misinterpret your guidance. This is not necessarily a good nor bad thing, just that communicating complex ideas using English (or other for-humans language) can be indeterminate, and that's a function of the problem space.\n\nI suspect the next round of improvement in AI's will result in a further retreat of developers, from becoming architects, to business analysts, to project managers, to business stakeholders. The vibe is coming and its relentless."}, {"id": 50651767, "au": "johnnyanmac", "dom": 106, "sr": 16, "sc": 6.66, "ep": 7.1, "bs": 0.0, "d": 1, "age": 9.33, "grav": 78.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 283, "qw": 0, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.9, "fa": 0.62, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "I can identify a few angles:\n\n1. You still have access to the source of Javascript or C, and if you really need to you can disassemble to asm. You don't have a choice with a black box to figure out what's inside and how it came to its answers.\n\n2. all source code is local to my machine. I cannot control what a frontier LLM spits out. And likewise, that frontier can update any which way with an expectation that the current version will not be available in months/years time.\n\n3. most tools for professionals are deterministic. LLM's will give you 10 slightly different answers to the same prompt.\n\n4. outside of the technical, LLM's seem to invoke radical social change. Maybe I'm too green here, but I do not remember this flippant attitude of \"ASM is outdated, just use C\" as the industry shifted from assembly code. assembly programmers were not looked down as \"behind on the times\" and \"obsolete\" for their knowledge. They were usually lauded as a sort of wizard. A lot of attitude here is less about efficiency and more about replacement, as if such knowledge was gatekept from society and this newfound ease of access is a means to overthrow the system. Quite confusing.\n\n5. moving to the logistics and economics: the powers working on LLM's are extremely different from those who worked on compilers. And it's very clear their incentives are not good for society as a whole. They more or le"}, {"id": 50649309, "au": "chrisra", "dom": 141, "sr": 17, "sc": 6.42, "ep": 6.42, "bs": 0.0, "d": 0, "age": 14.97, "grav": 163.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 13, "k": 129, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.049, "fa": 0.64, "gp": 1.467, "bl": 0.0, "ds": 0.0, "txt": "> Ask whether “the model wrote it” flies as an excuse in code review.\n\nI haven't had much professional self-doubt until lately with LLMs. More and more, I get this feeling that this thing is better than I am. If it is, \"the model wrote it\" isn't much of a justification, but it's also not... unreasonable? Though somehow I am still consistently annoyed at the approaches it takes. I guess it depends on the task.\n\nJust like if you said \"I don't know; the senior architect wrote it\"?"}, {"id": 50642079, "au": "bool3max", "dom": 276, "sr": 18, "sc": 6.33, "ep": 6.55, "bs": 0.0, "d": 2, "age": 25.12, "grav": 380.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 22, "k": 467, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.656, "fa": 1.37, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "> The bad coders of yesterday produce more bad code with AI. The good coders of yesterday produce more good code with AI.\n\nThe bad coders of yesterday produce 10x more bad code with AI. The good coders of yesterday produce 10x more good code with AI.\n\nAnd when there's 10x more code, whatever its quality, it's that much harder to discern (even for the good coders) whether it's good or bad."}, {"id": 50647306, "au": "asdff", "dom": 99, "sr": 19, "sc": 6.26, "ep": 6.7, "bs": 0.0, "d": 1, "age": 17.86, "grav": 217.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 16559, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.991, "fa": 0.28, "gp": 0.846, "bl": 0.0, "ds": 0.0, "txt": "Not every decision needs a perfect simulation level model fully understood driving it. In reality, most decisions we make are based on lossy models of various observations of the world coupled with various outcomes. Some are better than others. Generally does not matter for example to look at some dark clouds and think in terms of advanced precipitation models, Zeus, or merely assuming with some instinct rain is coming. No matter the model choice between the cutting edge of meteorology, greek mythology, or your own gut and lived experience, all functions here take the same input and return the same output. Knowing exactly how the world works is optional for moving forward towards desired outcomes.\n\nWith a lot of code especially, the stakes are pretty low. This is some dumb app on someone's phone. Comprehensive understanding is not necessary to advance to market."}, {"id": 50650465, "au": "Cyan488", "dom": 4, "sr": 20, "sc": 6.25, "ep": 6.91, "bs": 0.0, "d": 3, "age": 12.66, "grav": 125.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 557, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.479, "fa": 0.62, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "My thought experiment: spend 10 minutes formulating a prompt for an image, and then generate it without looking. Sketch your own version according to the prompt, then look at the generated output.\n\nThe images are probably a lot different. If you peeked at the generated image before sketching, you'd likely think it looks close to what you imagined. Actually, you'd be influenced by a false representation of your own idea."}, {"id": 50642286, "au": "skydhash", "dom": 263, "sr": 21, "sc": 6.23, "ep": 6.23, "bs": 0.0, "d": 0, "age": 24.82, "grav": 372.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 32, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.696, "fa": 0.42, "gp": 0.721, "bl": 0.0, "ds": 0.0, "txt": "Good tools make the job easy. Because you can then use the mental (or physical) effort somewhere else. There’s a scale of effort between typing commands in the shell, using make, and using autotools to support multiple platforms. People who creates tools are multipliers.\n\nThe disrepancy is the article is that the somewhat hacky script make it effortless to get results. And often there’s no alternatives other than a tedious and error prone approach. But for every example in the article, there was a good perfectly tool. The engineer decided not to use it because “reasons”.\n\n> Give those same people real stakes and a good model, and they don’t check out. They finally get to build the guardrails, proofs, and fixes they never had the hours to build before\n\nThey did have those hours, but they’re like to play firefighters instead. There’s nothing stopping someone to say: let’s refactor this small part and make it better, then  overtime, the system will grow healthier. You don’t need a model to do that. Good code is not a matter of more code. It’s a matter of understanding and willing to properly transfer that understanding."}, {"id": 50647723, "au": "tripleee", "dom": 109, "sr": 22, "sc": 5.99, "ep": 6.21, "bs": 0.0, "d": 1, "age": 17.31, "grav": 206.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 1024, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.722, "fa": 0.34, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "“Almost every software development organization has at least one developer who takes tactical programming to the extreme: a tactical tornado. The tactical tornado is a prolific programmer who pumps out code far faster than others but works in a totally tactical fashion. When it comes to implementing a quick feature, nobody gets it done faster than the tactical tornado. In some organizations, management treats tactical tornadoes as heroes. However, tactical tornadoes leave behind a wake of destruction. They are rarely considered heroes by the engineers who must work with their code in the future. Typically, other engineers must clean up the messes left behind by the tactical tornado, which makes it appear that those engineers (who are the real heroes) are making slower progress than the tactical tornado.”\n\n― John Ousterhout, A Philosophy of Software Design\n\nThis was written in 2018 so idk"}, {"id": 50642007, "au": "cyanydeez", "dom": 186, "sr": 23, "sc": 5.94, "ep": 6.16, "bs": 0.0, "d": 1, "age": 25.24, "grav": 383.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2957, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.481, "fa": 0.68, "gp": 0.513, "bl": 0.0, "ds": 0.0, "txt": "While I agree, I think \"induced demand\" is going to be a serious bottle neck among other destructive forces already at work.\n\nJust because our tools will let us do things, doesn't mean the choices of what we do with these tools will be productive. I've started like 5 features and they all get to a ~80% complete state where the last 20% requires riguorous inspection of whats happening.\n\nOther people are just going to bloat any additional roadway you give them.\n\nSpiderman slogan."}, {"id": 50647569, "au": "munk-a", "dom": 15, "sr": 24, "sc": 5.91, "ep": 6.79, "bs": 0.0, "d": 1, "age": 17.53, "grav": 210.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.752, "fa": 0.28, "gp": 1.294, "bl": 0.0, "ds": 0.0, "txt": "One thing I hate about the \"it's just another higher-level abstraction\" is the indeterminism.  I don't understand or think it's reasonable to understand lower levels of abstraction given their complexity (but I have occasionally dug into niche cases when it's bit me and appreciate the ability to do so) but... We're shifting from a place where we use compilers to hide complexity to read and write at a rather concise portion of the stack to LLMs that allow us to write concisely but make us read pages of crap we shouldn't need to inspect.\n\nIf we had an LLM-like deterministic tool where our codebases just turned into the prompts (with the tuning to make everything right) and software dev turned into maintaining and designing those prompts I think we'd be in a much better place than we are now where we're making simple statements that should turn into complex machine code certainly - but first end up being saved for recall as partially interpreted verbosity... I never wanted to program in Java Bytecode and nobody sane ever made that proposal, but that's sort of where we are now."}, {"id": 50643902, "au": "atmavatar", "dom": 158, "sr": 25, "sc": 5.76, "ep": 6.5, "bs": 0.0, "d": 2, "age": 22.46, "grav": 315.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 19, "k": 1797, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.596, "fa": 0.42, "gp": 1.069, "bl": 0.0, "ds": 0.0, "txt": "> Many people in this thread speak about shipping, but it is ultimately the users of said software who matter.\n\nI would modify that to say it's the people making purchasing decisions who matter.\n\nSure, as an example, if you're designing a web commerce site where getting users to purchase goods is the goal, you're absolutely right.\n\nHowever, when you're developing enterprise software, who uses the software and who pays for it is often disconnected, and those in charge of purchasing decisions (e.g., a CIO or CTO) usually don't give a damn what the users think.  As long as the software doesn't cripple users' ability to do their jobs, you can deliver just about any level of quality software to them without consequence.\n\nIn that kind of environment, shipping is often all that matters."}, {"id": 50646718, "au": "krinchan", "dom": 230, "sr": 26, "sc": 5.54, "ep": 5.54, "bs": 0.0, "d": 0, "age": 18.65, "grav": 232.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 323, "qw": 0, "k": 764, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.734, "fa": 0.0, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": "I think both posts can be true. I've been wrestling for a long time with both sides of this.\n\nLLMs make me insanely fast when I'm in my wheelhouse. Recently, some stuff at work forced me way out of my wheel house. I needed a harness and workflow for an area I was unfamiliar with under immense time pressure.\n\nI turned over too much to the LLM and got a severe case of burn out and ran up a massive token bill for nothing.\n\nWell, not nothing. I started over and after about 4 weeks of very plodding,  carefully tested work showed what I had so far to some of the more expert people working with LLM harnesses.\n\nI got a lot of accolades and some tongue in cheek jokes that I should've been sharing much earlier, as some aspects of what I had were new ideas with promise (for my more experienced coworkers, not the field).\n\nI think the people who give a shit do still give a shit. They've just been knocked back to junior level with everyone else. They're fighting their way up an overhang of a learning curve, recreating the depth and breadth of expertise from scratch.\n\nIt is a massive hit to our self-confidence. In my experience, the people who give a shit described in these two posts are the people most prone to imposter syndrome. Part of being in that class of people is having fully internalized the scope of what you don't know. Its what makes you curious, what makes you do the research, wha"}, {"id": 50646378, "au": "drusepth", "dom": 56, "sr": 27, "sc": 5.53, "ep": 6.63, "bs": 0.0, "d": 1, "age": 19.09, "grav": 241.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 16, "k": 4088, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.37, "fa": 0.42, "gp": 1.527, "bl": 0.0, "ds": 0.0, "txt": "> With an LLM you don't model the problem at all, you let something else do it.\n\nYou don't _have_ to model the problem at all (for short-term wins), but I would argue that yes, you do still need to model the problem in full if you want to most effectively use LLMs in development long-term.\n\nAny time you just let the LLM drive you're going to lose your own understanding of how the code works, lose any sort of personal pride/connection over what you've built, miss opportunities on the meta-decisions of _why_ things are structured/built in a certain way, not set up the architecture for future goals, etc etc."}, {"id": 50646756, "au": "oooyay", "dom": 57, "sr": 28, "sc": 5.5, "ep": 6.38, "bs": 0.0, "d": 2, "age": 18.61, "grav": 232.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 111, "qw": 0, "k": 2059, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": ["https://violetpixel.com/blog/2026-11-17-we-need-smart-people-who-give-a-shit/"], "ig": 1.581, "fa": 0.62, "gp": 0.623, "bl": 0.0, "ds": 0.0, "txt": "Engineers should not be one-shotting complex problems and in that way I think the author is right.\n\nThat said, it feels wrong to even entertain some of these strawman and weakman arguments. Spending a ton of time and energy discussing the bad behavior of a minority is not advancing the practice of agentic engineering for the many. I logged off of Bluesky (where the author is most active) because the majority of the discourse there is just like what you see between Ian's post and the article he's responding to (https://violetpixel.com/blog/2026-11-17-we-need-smart-people...): people farming strawman and weakman arguments and doomeristic dialogue for engagement.\n\nI'm not sure any of that is useful beyond the time-honored tradition of Twitter-style venting."}, {"id": 50653780, "au": "benrutter", "dom": 140, "sr": 29, "sc": 5.3, "ep": 6.18, "bs": 0.0, "d": 0, "age": 4.14, "grav": 26.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 58, "k": 3553, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.501, "fa": 0.42, "gp": 1.001, "bl": 0.0, "ds": 0.0, "txt": "I think this is a really good / well written take, but I can't help but feel it misunderstands the point it is arguing against:\n\n> \"Every prompt moves them one step further away from the system they used to know inside and out,” he writes. Every generated line robs engineers of the struggle that makes them smart and the ownership that makes them care.\n\n>\n\n> The implication is pretty hard to miss: if you’re using AI, you’re giving up on giving a shit.\n\nThat might be an implication of what's being said, but I think the original quotation is saying something a little subtler and more complex.\n\nWorking directly on code is a really good way to build up intuitions and sympathy with how a system is fundamentally working. Designing and building programs with an LLM doesn't do this in the same way.\n\nI don't know that that means \"software engineers using LLMs = doom\", but it does mean we have to think seriously about how else we build up intuitions and sympathy with systems, or otherwise, how we build reliable systems without deep understanding of how they function under the hood.\n\nAscribing moral judgements like laziness to this isn't helpful (or accurate), but I definitely think we need to confront the fact that building code with LLMs isn't the same as building code by thinking/typing.\n\nDeveloping with LLMs is still very new, and I don't think as an industry we've yet learnt what the "}, {"id": 50641725, "au": "xnorswap", "dom": 108, "sr": 30, "sc": 5.26, "ep": 5.63, "bs": 0.0, "d": 0, "age": 25.76, "grav": 396.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 6412, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "One interesting conclusion that this post almost gets to but doesn't draw, is that previously the \"smart people who gave a shit\" often wouldn't be out-shipped by those who didn't.\n\nBut LLM empowered, the cost of \"giving a shit\" relative to meat-proxying is amplified such that the people who you don't want shipping so much can now out-ship the ones who take the time to do additional verification, despite both sides being massively sped up with LLMs."}, {"id": 50642467, "au": "layer8", "dom": 23, "sr": 31, "sc": 5.2, "ep": 6.31, "bs": 0.0, "d": 1, "age": 24.52, "grav": 365.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.711, "fa": 0.0, "gp": 1.575, "bl": 0.0, "ds": 0.0, "txt": "The difference lies in one’s ability to reliably reason about the relation between the input and the output behavior.\n\nWith the classical abstractions, you can predict with high precision which changes in the input (source code) will map to which changes in the behavior of the output. You can play through different modifications of that input in your mind, knowing what they will mean for the output.\n\nWith LLMs, you can only vaguely and unreliably predict what any given prompt, or modifications in a prompt, will map to in the output. It has some aspects of a slot machine. This significantly curtails one’s ability to reason about that input-output relation, and to reliably predict properties of the output.\n\n(This isn’t about determinism. A deterministic LLM still cannot be usefully reasoned about, while a compiler outputting machine code with random variations that however maintain the programming-language semantics can. LLMs don’t have well-defined language semantics, and also don’t reliably adhere to natural-language semantics even when it’s clear.)"}, {"id": 50645909, "au": "tescreal", "dom": 147, "sr": 32, "sc": 5.02, "ep": 5.02, "bs": 0.0, "d": 0, "age": 19.8, "grav": 256.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 30, "k": 130, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.429, "fa": 0.64, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "How did this:\n\n>The old way of working is how we ended up with a world where bad updates and long-dormant bugs can wobble major banks, airlines, and cloud providers in the same week.\n\nonly appear now? It is strange such unlikely occurances should occur so closely together. Probabilistically, it either should've happened multiple times before, or at least not all at once."}, {"id": 50650143, "au": "ashkankiani", "dom": 247, "sr": 33, "sc": 4.99, "ep": 5.65, "bs": 0.0, "d": 0, "age": 13.37, "grav": 136.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 710, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.578, "fa": 0.28, "gp": 0.791, "bl": 0.0, "ds": 0.0, "txt": "The author is giving a lot of credit to most people's ability to resist the temptation of being lazy.\n\nMaybe one day you're tired because your kid didn't sleep and you don't review the architecture that an AI outputs or the code it wrote or the spec that went into it that closely and just stamp approval, and ... nothing bad happens.\n\nThen one day, you do it again because \"it's probably fine, it's been fine this whole time.\" Eventually you start to deskill because your brain is realizing that it's been fine and the energy to care is more costly than it's worth it. It slowly rewires. And then one day you have a system you don't understand anymore.\n\nFighting this decay was easier before LLMs, in my opinion. The temptation is greater, the accountability is more nebulous, and the volume in throughput is higher. All of the perfect conditions to encourage the fatigue that would make one slip up.\n\nIt takes a tremendous amount of effort to keep giving a shit."}, {"id": 50642448, "au": "Kuyawa", "dom": 231, "sr": 34, "sc": 4.86, "ep": 5.96, "bs": 0.0, "d": 0, "age": 24.55, "grav": 366.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.863, "fa": 0.0, "gp": 1.09, "bl": 0.0, "ds": 0.0, "txt": "Sometimes those gurus hidden in a server closet are just guarding their turf\n\nI remember in the eighties working at an insurance company I replaced their whole IBM S36 with a DBase app, I got fired for that. Then in the 90s I replaced a months long Informix/4gl million dollar project with a Clarion app developed in days. I got fired too\n\nWhen there is a battle over territory you will always lose to the gurus that are in bed with the boss (and share the budget under the table, wink wink)"}, {"id": 50649969, "au": "Havoc", "dom": 189, "sr": 35, "sc": 4.72, "ep": 4.72, "bs": 0.0, "d": 0, "age": 13.72, "grav": 142.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 24, "k": 27478, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.828, "fa": 0.42, "gp": 1.09, "bl": 0.0, "ds": 0.0, "txt": ">Lazy bums can, for now, coast as meat proxies for a chat window, ferrying tickets into a prompt box and clicking merge on whatever falls out.\n\nThat's the part that worries me. Not everyone has massive amounts of drive/intelligence and whether I personally am part of that cohort or not is largely irrelevant if it shreds society in aggregate."}, {"id": 50644719, "au": "sshadmand", "dom": 190, "sr": 36, "sc": 4.66, "ep": 5.1, "bs": 0.0, "d": 0, "age": 21.48, "grav": 293.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 27, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.46, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Ab-so-lutely. The product business builder and the credative can live harmoniously as one. When they do it well it is incredible. BUT, when the creator becomes an artisan shit changes. They start caring about the craft more than the mission. Use a tool that works but don't forget why you are doing it - for results.\n\nI love how Hermes mission statement put it: \"We are not a museum\". That that is coming from what most would consider a luxury \"artisan\" company!"}, {"id": 50646088, "au": "uptrails", "dom": 227, "sr": 37, "sc": 4.64, "ep": 5.52, "bs": 0.0, "d": 0, "age": 19.5, "grav": 250.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 548, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.093, "fa": 0.28, "gp": 1.486, "bl": 0.0, "ds": 0.0, "txt": "And according to Pangram, the author exemplified this high standard of care by having the entire article generated by an LLM and then asking you to spend your time to read it with your human eyes and human brain."}, {"id": 50649441, "au": "golly_ned", "dom": 3, "sr": 38, "sc": 4.61, "ep": 5.49, "bs": 0.0, "d": 2, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 982, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.672, "fa": 0.0, "gp": 1.078, "bl": 0.0, "ds": 0.0, "txt": "I work this way a lot as well. But depending on how detailed the initial spec you're coming in with is, and how precise your thinking is beforehand, your thinking can easily be framed by claude itself. It's a big difference between coming in with the frame itself vs. reviewing within an AI's frame.\n\nWhat I mean is about what details end up being important and what the overall shape of the solution is supposed to look like. Typically there's a massive design space that has to get narrowed down to a few big questions, then lots of small questions.\n\nIf you don't come in with claude setting the initial parameters, or have the software design taste to know what's wrong with a solution -- I don't for a lot of domains -- then it's hard to even notice what you're not considering, because it's never presented as an explicit option to you.\n\nEspecially when it comes with writing documents. I have excellent doc-writing taste and have never began with an AI draft that I could shape into something good instead of begin with a draft myself that AI can help improve."}, {"id": 50646049, "au": "hsuduebc2", "dom": 252, "sr": 39, "sc": 4.51, "ep": 5.61, "bs": 0.0, "d": 0, "age": 19.56, "grav": 251.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 1068, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 2.014, "fa": 0.0, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "At one major European financial institution, management basically gave analysts and testers what they called AI agents, which were so crippled that they were barely more than AI chatbots in a browser, and told them to just \"vibe code\" critical systems that needed reworking due to accumulated technical debt.\n\nThese systems were originally carefully engineered, with technical debt accumulating over years of modifications. The result is now a collection of bugs that nobody understands because the people introducing them can't even read the code. It's only a handful of services, yet things are falling apart remarkably quickly.\n\nManagement is currently coping by firing everyone who \"underdelivers.\" Of the ten newly appointed \"developers,\" all previously analysts or testers except for one, only the one who was already a software developer remains at the company.\n\nIt's fascinating to me how something as mundane as ordinary Java services can fall apart so rapidly and spectacularly when even the vibe coding isn't done by actual engineers.\n\nAt least it gives me hope that I'll still have a salary for the next few months."}, {"id": 50642413, "au": "leoedin", "dom": 88, "sr": 40, "sc": 4.39, "ep": 5.93, "bs": 0.0, "d": 1, "age": 24.61, "grav": 367.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 6, "k": 6783, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.356, "fa": 0.42, "gp": 1.067, "bl": 0.0, "ds": 0.0, "txt": "> Moving from an low-code app builder\n\nI'm not even sure that's true. I once went down the path of \"use low code to speed up development\" to build a business application and ended up basically doing an awkward, GUI based variation of software development. I still had to reason about data models and how the data fitted together, I still had to think about logic - I just had next to no ability to refactor and no version control.\n\nLLM driven development is very different to that."}, {"id": 50643641, "au": "vanelsas", "dom": 170, "sr": 41, "sc": 4.38, "ep": 5.48, "bs": 0.0, "d": 0, "age": 22.78, "grav": 323.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 228, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.623, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "One thing that I feel hasn't changed since the introduction of LLMs in the process of software engineering.\n\nI believe that a lot of current and future disfunctionality comes from irrational deadlines, large dreams that are not tested or properly thought through and a lack of discipline when executing.\n\nIt really doesn't matter how you you do your job. Creating a storm of PRs and allowing these PRs to touch multiple files and hundreds of lines of code at once is bad practice imo, with or without using LLMs."}, {"id": 50648264, "au": "AngryData", "dom": 152, "sr": 42, "sc": 4.38, "ep": 5.92, "bs": 0.0, "d": 1, "age": 16.55, "grav": 191.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 5139, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.757, "fa": 0.34, "gp": 0.567, "bl": 0.0, "ds": 0.0, "txt": "I don't like this characterization that pre-modern farming is just non-stop work and toil. You might work nonstop during harvest, but not the rest of the year. Planting should be done fairly quickly but not be back breaking, then you got fire wood and a few neccessary hand crafts for tools but that doesn't take nonstop work for half the year, a few weeks would get you a years worth of firewood which is your second largest task. And most things beyond that is personal choice to work for luxuries, be it extra work to make better or more clothes, or be cleaner, or making beer, or worship some random gods.\n\nWe have to remember older farming diets and nutrition was worse, so constant back breaking work all year that someone might do today would kill someone who ate 90% a single grain or crop and was malnurished."}, {"id": 50651920, "au": "rich_sasha", "dom": 153, "sr": 43, "sc": 4.34, "ep": 5.44, "bs": 0.0, "d": 2, "age": 8.85, "grav": 73.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 10958, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.48, "fa": 0.34, "gp": 0.687, "bl": 0.0, "ds": 0.0, "txt": "I’m not in any way a farmer, but aren’t you erring on the other side? Farm animals need tending every day, their sheds cleaned, fodder topped up. Sick ones need looking after. Fences and hedges repaired to keep wild animals out. Weeds pulled. Flocks herded, and so on.\n\nSure, it’s not 25h/day, 8 days a week, but very hard work as I understand it. And yes, I think the premodern peasant had high mortility and was often badly malnourished.\n\nThen on top, in many societies, peasants had to provide a surplus for their feudal lord or equivalent (I see no reason to believe this was different in prehistoric times), and depending on how hard the thumb screws were tightened, that could be significant."}, {"id": 50642524, "au": "bitwize", "dom": 272, "sr": 44, "sc": 4.23, "ep": 5.33, "bs": 0.0, "d": 0, "age": 24.39, "grav": 361.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 240, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.859, "fa": 0.0, "gp": 0.667, "bl": 0.0, "ds": 0.0, "txt": "MY favorite example of \"smart people who give a shit\" right now, in the context of LLM use, is mathematicians. When Claude's Riemann proof dropped, a lot of people—mathematicians included—clawed their faces and were like \"ohhhh, mathematics is done for\".\n\nBut Claude did not prove the theorem the way a human would. It sort of fuzz-tested mathematics, wibbling and wobbling its way to the goal with the help of Lean. So it is true that the proof is slop, and simultaneously true that the proof is really profoundly great for mathematics, because mathematicians use proofs as tools for insight, and there was very little insight that came out of knowing that this proof exists. The understanding will come later as human mathematicians examine and attempt to simplify the proof and explore its implications, all the lemmas and stuff that had to be generated intermediately to get to the final proof. Mathematics is not toast after the fall of Riemann. This one proof may open up more mathematical questions worth asking, than it provided answers.\n\nThis stands in stark contrast to tech CEOs, for whom speed to a finished product is the goal, and who cares if anyone actually understands it. Just point agents at it and fire. Oh, but it'll be your head if your agents screw up. Accordingly, LLMs—and those who wield them, often under duress of losing their livelihood—will continue to be abused in the "}, {"id": 50646254, "au": "carlosjobim", "dom": 128, "sr": 45, "sc": 4.17, "ep": 5.56, "bs": 0.0, "d": 1, "age": 19.25, "grav": 245.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 7, "k": 1513, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.371, "fa": 0.42, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "> the people who you don't want shipping\n\nJust like I don't want people who aren't mechanics to drive cars...\n\nThe only reason why non-programmers are making vibe-coded solutions is because for decades programmers have deemed it beneath their dignity to provide solutions for thousands of real world computing needs.\n\nSympathy for programmers: Tiny.\n\nUp until now, only a small percentage of programmers were doing the sensible thing and creating boutique apps which are useful for real people and selling them for a fair price.\n\nThe rest were busy working on giant, complicated enterprise solution. And if they weren't paid for doing it as a job at a software company, they would pretend to have such a job and make giant, complicated open source projects - which only giant corporations will ever have any use for.\n\nWhy didn't you make a nice invoicing app instead of making Kubernetes? Why didn't you make a nice ebook reader instead of making javascript frameworks?"}, {"id": 50643610, "au": "Bayart", "dom": 165, "sr": 46, "sc": 4.08, "ep": 5.04, "bs": 0.0, "d": 2, "age": 22.83, "grav": 324.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 3680, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.417, "fa": 0.28, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "You're welcome. It's a tool I discovered on HN myself.\nMy workflow with it is to give a skill some benchmarks I know are relevant, ask to expand from then and then run candidates (ie. variants of the skill) until it stops yielding improvements for more than 2 runs. All the while it's keeping a webpage updated on the runs so I can keep track of it visually.\n\nI'm open to suggestions. It feels like it's how I should run things, but I don't know it yet."}, {"id": 50642404, "au": "mmcconnell1618", "dom": 58, "sr": 47, "sc": 4.03, "ep": 5.58, "bs": 0.0, "d": 1, "age": 24.62, "grav": 367.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2521, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.256, "fa": 0.22, "gp": 1.377, "bl": 0.0, "ds": 0.0, "txt": "It depends on how you use the tool. If you say \"build me a program that does x,\" you are correct that the abstraction is very different from your assembly->C->Javascript example. But, you can also work with an LLM on the architecture and structure of what you're designing just like with code. \"Build me a relational database table to store z and let's review the design.\" \"Build me a state machine representing these 7 states and I will describe the possible transitions.\""}, {"id": 50641897, "au": "elmer2", "dom": 200, "sr": 48, "sc": 4.0, "ep": 4.88, "bs": 0.0, "d": 0, "age": 25.42, "grav": 387.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 106, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I've seen a few people on Linkedin from college that have almost no tech experience, now hired as AI engineers at startups.\n\nTheir entire job is to guide AI to build systems. A common belief is that actual engineering skills are no longer needed in this future with AI."}, {"id": 50642303, "au": "BeetleB", "dom": 123, "sr": 49, "sc": 4.0, "ep": 5.54, "bs": 0.0, "d": 1, "age": 24.8, "grav": 372.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 17, "k": 18403, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.266, "fa": 0.42, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "> is that previously the \"smart people who gave a shit\" often wouldn't be out-shipped by those who didn't.\n\nNonsense. When I was reading his pre-LLM examples the first thing I thought of is \"Yeah, if management gives them time to do it thoroughly.\"\n\nIn fact, I feel LLMs have actually reduced this concern: It's now a lot quicker to architect add build things right, and the \"do it right\" cost differential has been significantly reduced."}, {"id": 50646005, "au": "skydhash", "dom": 44, "sr": 50, "sc": 3.98, "ep": 5.31, "bs": 0.0, "d": 3, "age": 19.63, "grav": 253.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "output_deterministic", "flbl": "Output & Deterministic (Language)", "urls": [], "ig": 1.966, "fa": 0.0, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "Abstraction is generation in principle. The end result is always opcodes. But with higher languages you get more intuitive and smaller concepts that eliminates the drudgery. But the formal nature persists.\n\nThe abstraction can happen through syntax (higher level language, dsl, macros,…) or through code reusability (procedure, functions, file inclusiom, libraries of symbols). You hide irrelevant details but the relation between inputs and outputs is still rigidly defined. For any known inputs, the semantics of the output is known.\n\nEnglish doesn’t give you that. Whatever the LLM outputs from a prompt is only defined when it happens. And with randomization (temperature, environment (tool calls, web searches,…)) it’s basically a shot in the dark. And because the codebase is both the input and output, the process can become quickly unstable."}, {"id": 50645857, "au": "pessimizer", "dom": 43, "sr": 51, "sc": 3.74, "ep": 5.28, "bs": 0.0, "d": 2, "age": 19.89, "grav": 258.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 6, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.511, "fa": 0.42, "gp": 0.365, "bl": 0.0, "ds": 0.0, "txt": "> English fails both those tests, IMHO.\n\nThe big difference between the other steps and English is that python requires no less exacting thinking than machine code. What's effectively removed at each step before English is a bunch of torturous memorization.\n\nThis is most obvious at the fist step, when you're trying to remember what an arbitrary binary opcode does. All assembler does sometimes is just give those opcodes intuitive names.\n\nEnglish is actually the first step that isn't exacting, and that's why the metaphor fails. A line of python might do a lot more than I need it to do, but it does a defined thing, not a suggested thing."}, {"id": 50647111, "au": "BikiniPrince", "dom": 48, "sr": 52, "sc": 3.67, "ep": 5.21, "bs": 0.0, "d": 4, "age": 18.16, "grav": 222.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.814, "fa": 0.0, "gp": 0.652, "bl": 0.0, "ds": 0.0, "txt": "I’ve had great success with writing a contract and the agent follows it. It’s surprisingly easy to get it to follow the rules. The other half of that is ensuring there are rails enforcing those rules. At the task management system I entice reviewers, style, code approvals and all by sha. This eliminated a lot of confusion. Then at the build system it is enforced as a pipeline. LLMs are fairly happy with writing tests and there they have a sound infrastructure. That said I do not let them go wandering around and enforce strict task assignments. Opus really forced me to improve all of the guard rails. Now I can manage dozens of bugs, features and other tasks quite easily."}, {"id": 50646092, "au": "bob1029", "dom": 86, "sr": 53, "sc": 3.64, "ep": 5.18, "bs": 0.0, "d": 1, "age": 19.49, "grav": 250.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.659, "fa": 0.0, "gp": 0.882, "bl": 0.0, "ds": 0.0, "txt": "The thing with the LLM that is different is the fact that it requires a feedback loop through the human operator to perform as expected.\n\nA C compiler is entirely feed-forward in that it isn't expecting you to double check some things and turn the crank one or more additional times.\n\nThe way to compensate for this is with code review. If manual code review is drowning you, employ the same leverage you do on the coding side. The control for the code review robot is the QA server, which might have a E2E testing robot. The control for the E2E testing robot is the customer's test server which definitely has someone from operations testing diligently (if they use AI they are still on the hook per contract).\n\nWhat is the probability that a pipeline with that many stages of validation would still leak something bad to production? The principal leverage with LLMs (when used correctly) is that you can push the responsibility all the way back up the stack to the customer in a direct and immediately actionable way."}, {"id": 50649484, "au": "asveikau", "dom": 225, "sr": 54, "sc": 3.63, "ep": 4.51, "bs": 0.0, "d": 0, "age": 14.67, "grav": 158.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 15259, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "Does anyone else think it comes off as a little desperate that some of the most gung-ho AI boosters spend lots of time writing articles justifying that its use is necessary?  It seems like they are insecure about it.\n\nAnd here, we have built-in praise for the LLM user as \"smart and giving a shit\", with the implication that anyone who doesn't agree is stupid and/or doesn't care.  \"I do this because I am smart\" seems like something someone might say if they have a personality disorder."}, {"id": 50645373, "au": "woah", "dom": 182, "sr": 55, "sc": 3.6, "ep": 4.7, "bs": 0.0, "d": 0, "age": 20.54, "grav": 272.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 11526, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.292, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "The big question about the recent outages is whether they were caused by code pushed in the past year using AI, or vulnerabilities written long ago by humans recently found by AI. Each camp is telling themselves a different version of the story."}, {"id": 50645392, "au": "gchamonlive", "dom": 40, "sr": 56, "sc": 3.6, "ep": 5.04, "bs": 0.0, "d": 1, "age": 20.51, "grav": 271.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 4455, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.434, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "With an LLM you don't model the problem at all, you let something else do it. Moving from an low-code app builder to an LLM is a higher level of abstraction. Moving from writing code yourself to having an LLM write it is something different entirely\n\nThis isn't an experience that's intrinsic to LLM. You can let it model the problem for you and your prompt just indicates the problem scope, or you can use LLM to explore the problem scope, evaluate architectural candidates, write yourself the model spec and then assist agents in implementing them by steering.\n\nAlso, abstraction levels don't scale linearly or even in the same dimension. Going from assembly to code and then from code to prompts isn't supposed to be similar. Prompts also do so much more than just code that you can't even compare these two approaches to code crafting directly, and still they are different levels of abstraction."}, {"id": 50655479, "au": "another_twist", "dom": 41, "sr": 57, "sc": 3.6, "ep": 4.81, "bs": 0.0, "d": 1, "age": 0.5, "grav": 5.2, "surf": 70.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 18, "k": 281, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.416, "fa": 0.42, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "> Even if you are writing in Javascript, you are still modelling a problem on to some representation in code.\n\nNot the way I used to code. I modelled the problem on to standard patterns then wrote that by hand. I still have to do that but explaining this thikning to claude is my thing. Then some back and forth and then finally coding. It helps to get a monumental amount of work done. I never understood why people got hung up on languages. Personally i wouldn't bother with advanced features beyond loops, if-else, functions etc in most languages."}, {"id": 50643085, "au": "bemtevi", "dom": 65, "sr": 58, "sc": 3.6, "ep": 4.69, "bs": 0.0, "d": 1, "age": 23.49, "grav": 339.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.065, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "The fundamental thing is that no matter which programming paradigm you used in the past, whether it was assembly, C, Python, or Perl, you always had to have a map of the basic logic in your mind. IF X, do Y. X+Y = Z. It was harder in assembly, easier in C, and still easier in Python to type, but the logic was exposed. You always had to either type the logic yourself or put pieces of other logic together.\n\nThe LLM, bypasses that, and creates some type of logic that works to fulfil a task, but it may not be the logic we wanted to create."}, {"id": 50643332, "au": "beej71", "dom": 42, "sr": 59, "sc": 3.6, "ep": 4.63, "bs": 0.0, "d": 1, "age": 23.15, "grav": 331.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 6671, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 0.698, "fa": 0.28, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "What finally clicked for me was a slide at an MIT presentation. It stacked up the \"layers of abstraction\": machine, assembly, c, python, English.\n\nAnd next to the bottom 4 was a bracket labeled \"Rigorous thinking required\". And next to English was a bracket that said \"Rigorous thinking optional\".\n\nAnd there's also the fact that an abstraction does two things:\n\n1. Simplify the interface. The messy details are hidden.\n\n2. Restrict ability. You can do more things in the lower level abstraction than you can in the higher one.\n\nEnglish fails both those tests, IMHO."}, {"id": 50649534, "au": "willguest", "dom": 194, "sr": 60, "sc": 3.6, "ep": 4.58, "bs": 0.0, "d": 0, "age": 14.57, "grav": 156.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 371, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.26, "fa": 0.0, "gp": 1.118, "bl": 0.0, "ds": 0.0, "txt": "Fair claims, speaking as someone who has wrangled bugs for longer than they would care to admit, but no punches pulled.\n\nPersonally I enjoyed his article on 'The Cadence of Salting' more - so good to see culinary chemistry is alive as well"}, {"id": 50644829, "au": "kevin_thibedeau", "dom": 47, "sr": 61, "sc": 3.6, "ep": 4.56, "bs": 0.0, "d": 3, "age": 21.35, "grav": 290.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 23650, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.605, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "The problem is that Vinnie doesn't follow a documented procedure and sometimes silently ignores the plans he's given.\n\nWe already live in a world where software devs are tenuously engaged in \"engineering\". Vibe-coded output can never be asserted to have engineered assurances.\n\nVinnie will hide bodies in a foundation you need to be load bearing."}, {"id": 50646202, "au": "odo1242", "dom": 229, "sr": 62, "sc": 3.6, "ep": 4.53, "bs": 0.0, "d": 0, "age": 19.32, "grav": 246.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 19, "k": 1470, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.06, "fa": 0.42, "gp": 0.58, "bl": 0.0, "ds": 0.0, "txt": "From the article:\n\n> The implication is pretty hard to miss: if you’re using AI, you’re giving up on giving a shit.\n\nWell, I don't think that was the implication at all. The implication is that since AI is doing all the work, the company can fire everyone (or otherwise devalue them, like by reducing salaries to the point where the job is not desirable), but then there won't be anyone to give a shit about any of the systems that hold modern society together."}, {"id": 50648345, "au": "felipesoc", "dom": 84, "sr": 63, "sc": 3.6, "ep": 4.52, "bs": 0.0, "d": 1, "age": 16.43, "grav": 189.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 213, "kpp": 8.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.534, "fa": 0.56, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "My definition of a tool is something I use to get a result or worse, but not better. For instance, when an artist uses Photoshop tehy already have an image in their mind they want to reproduce, and they can get that or worse. With ai you can prompt and image and get something you never imagined. In the case of grh the author himself said that in the last part it was just claude and the result surprised him. You can use ai as a tool and get exactly what you want. But you can get something completely new that didn't exist, and that is not a \"just a tool\"."}, {"id": 50642892, "au": "notpachet", "dom": 133, "sr": 64, "sc": 3.6, "ep": 4.49, "bs": 0.0, "d": 0, "age": 23.82, "grav": 347.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2091, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.201, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Healthy people who give a shit exercise.\n\nDisciplined people who want to retain a working understanding of the system exercise their knowledge of said system. You can still do this with LLM's but there is a greater temptation to let your knowledge atrophy. It requires discipline to keep the machine at arm's length."}, {"id": 50650416, "au": "falkensmaize", "dom": 134, "sr": 65, "sc": 3.6, "ep": 4.48, "bs": 0.0, "d": 0, "age": 12.77, "grav": 127.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 236, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 1.261, "fa": 0.0, "gp": 1.047, "bl": 0.0, "ds": 0.0, "txt": "“Typing all the code by hand” was a virtual guarantee that if you made the commit, you understood at a deep level what that commit does. Ai removes that layer of trust even from yourself. It’s very easy to use ai to promptgineer a change you think you understand only to realize when it’s in production that you don’t really understand it deeply. Reading code someone else wrote does not embed it in your brain like writing it by yourself does - you’re engaging a different part of your brain."}, {"id": 50641772, "au": "vitorfblima", "dom": 226, "sr": 66, "sc": 3.6, "ep": 4.39, "bs": 0.0, "d": 0, "age": 25.65, "grav": 393.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 140, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.157, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "We live in a time where a lot of engineers still got to see a world pre-AI, so much of their training, curiosity and wisdom probably was built in a manner and fashion that will be much much harder to replicate as time goes by and these 'tools' evolve.\n\nI get that now it is making smart people 'smarter' or faster. But what kind or class of 'smart' people will be in the future?"}, {"id": 50655813, "au": "NalNezumi", "dom": 85, "sr": 67, "sc": 3.6, "ep": 4.2, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 100.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 3852, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "abstraction_software", "flbl": "Abstraction & Software (Management)", "urls": [], "ig": 1.615, "fa": 0.0, "gp": 0.276, "bl": 0.0, "ds": 0.0, "txt": "Trying to frame it as abstraction is false equivalence to begin with.\n\nBringing an calculator to advanced math exam, is an act of skipping doing the numerical calculations yourself to be able to focus on higher level detail.\n\nIf I brought the professor, and asked it \"here's the problem, answer it for me\" and give the professor the exam, is not an abstraction, it's delegation.\n\nIn a sense you can claim that the two concepts overlap.\n\nIn my mind there's just two group of people with different incentives trying to argue over semantics when it's a smokescreen for incentives:\n\nOne team code to get things done and can't give 2 shits to understand it(people that go to college to get a degree; not to learn). For them, there's no separation (for their own self interest).\n\nThe other team thinks understanding is part of the job, or at least their responsibility. These are the ones that got curious about assembly even if all they do is write python, because curiosity. (the ones that went to college to learn)\n\nTeam one is winning because, in the real world most people really only care about getting shit done, understanding is just an pesky process"}, {"id": 50641660, "au": "mschuster91", "dom": 265, "sr": 68, "sc": 3.6, "ep": 4.05, "bs": 0.0, "d": 0, "age": 25.86, "grav": 399.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 56, "k": 24125,
