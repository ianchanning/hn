3, "sr": 164, "sc": 1.36, "ep": 3.88, "bs": 2.52, "d": 0, "age": 30.77, "grav": 534.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 1.15, "bl": 0.95, "ds": 0.0, "txt": "At the end of the day, AI is currently only a lever on our way to achieving our objectives. I'm pretty new to it, but from my experience, AI without guidance only makes things worse. So understanding what you are doing, is as important as making things done."}, {"id": 50647943, "au": "tomcatfish", "dom": 178, "sr": 165, "sc": 1.34, "ep": 1.34, "bs": 0.0, "d": 2, "age": 17.03, "grav": 200.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 412, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 0.571, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Pangram is actually remarkably reliable! If you want, I can dig up links showing it is statistically NOT racist, NOT biased against people with autism, has an extremely low error rate, etc. It probably has a better True Positive AND Negative rate than you or I."}, {"id": 50647594, "au": "nixpulvis", "dom": 119, "sr": 166, "sc": 1.3, "ep": 1.3, "bs": 0.0, "d": 2, "age": 17.49, "grav": 209.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 4737, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_word", "flbl": "Code & Word (Produce)", "urls": [], "ig": 0.554, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yea, but who judges quality. It can be the case that only other people who give a shit will notice or care."}, {"id": 50641895, "au": "muglug", "dom": 218, "sr": 167, "sc": 1.29, "ep": 4.33, "bs": 3.05, "d": 0, "age": 25.42, "grav": 387.7, "sur  least a factor x1000. If all your assets are money-based or \"papertiger businesses\", they will get burned.\n\nIf you can, shift your savings into real estate, preferably your own, and enough liquid-ish assets like gold. Everything else will go to shit, the only question is when. And invest into education, especially in the trades... knowledge based work and a lot of \"paper pusher bullshit jobs\" will get torn apart by AI."}, {"id": 50653766, "au": "wedoctor", "dom": 162, "sr": 179, "sc": 0.85, "ep": 3.89, "bs": 3.05, "d": 0, "age": 4.17, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 9, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 1.392, "fa": 0.0, "gp": 0.429, "bl": 1.15, "ds": 0.0, "txt": "I think I really strongly resent the framing of people who are struggling to get a handle on how to cope with an entirely new technology that has been forced upon the general public at a breakneck speed as just \"lazy bums\". The basic socioeconomic contract is being shredded right before our eyes- who gets to define what's \"lazy\" and what's \"smart\"?"}, {"id": 50647843, "au": "InsidiousWombat", "dom": 97, "sr": 180, "sc": 0.82, "ep": 2.01, "bs": 1.19, "d": 1, "age": 17.15, "grav": 203.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.678, "fa": 0.0, "gp": 0.286, "bl": 0.45, "ds": 0.0, "txt": "Because is dishonest.\n\nTool makes the boring part shorter and more repeatable.\n\nTool does not decide how the product is designed"}, {"id": 50642206, "au": "bluefirebrand", "dom": 159, "sr": 181, "sc": 0.74, "ep": 1.93, "bs": 1.19, "d": 2, "age": 24.93, "grav": 375.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 15, "k": put & Deterministic (Language)", "urls": [], "ig": 0.499, "fa": 0.0, "gp": 0.448, "bl": 0.45, "ds": 0.0, "txt": "Could it be that compilers take standardized input, give deterministic output, and aren't capable of hallucinating, none of which can be said for LLMs?"}, {"id": 50650401, "au": "smashandgrab", "dom": 11, "sr": 185, "sc": 0.51, "ep": 3.02, "bs": 2.52, "d": 2, "age": 12.8, "grav": 127.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 12, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "tools_human", "flbl": "Tools & Human (Smart)", "urls": [], "ig": 1.065, "fa": 0.0, "gp": 0.359, "bl": 0.95, "ds": 0.0, "txt": "As someone who has enough security fires to put out as it is: thank you for still giving a shit.\n\nWe’ve had so many yolos turn into bug bounties or worse in the last couple of months that the c suites are even starting to get why it’s a bad idea."}, {"id": 50650840, "au": "assimpleaspossi", "dom": 250, "sr": 186, "sc": 0.43, "ep": 2.02, "bs": 1.59, "d": 0, "age": 11.81, "grav": 112.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1100, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "shit_tool", "flbl": "Shit & Tool (Else)", "urls": [], "ig": 0.761, "fa": 0.0, "gp": 0.161, "bl": 0.6, "ds": 0.0, "txt": "What about those who don't give a fuck? Compare them to who do give a fuck? Or just say, \"Fuck it!\" And then, \"Fuck you!!!\" if they don't like the response. Like my fuckin' response to all the shit headlines and fuckin' shit posts lately.\n\nHow fuckin' low is HN willing to go?"}, {"id": 50648327, "au": "IshKebab", "dom": 138, "sr": 187, "sc": 0.43, "ep": 2.02, "bs": 1.59, "d": 2, "age": 16.46, "grav": 190.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "output_d /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
