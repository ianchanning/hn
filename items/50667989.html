": "general_web", "count": 9}, {"category": "code_repository", "count": 2}], "story_anchors": ["proofs", "programs", "bugs", "large", "rules", "proof", "hol", "kernel", "code", "correct", "check", "checkers", "page", "light", "list", "course", "program", "correctness"], "largest_root": {"root_id": 50669641, "author": "twotwotwo", "slots": 17, "start_dom": 1, "end_dom": 17, "share_pct": 20.5, "top_dom1_age": 18.1, "top_dom1_author": "twotwotwo"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50669994, "au": "yababa_y", "dom": 66, "sr": 1, "sc": 9.18, "ep": 9.18, "bs": 0.0, "d": 1, "age": 17.67, "grav": 213.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 42, "qw": 0, "k": 283, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": ["https://github.com/emberian/svenvs"], "ig": 1.04, "fa": 2.08, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "and then you can tie a reflective knot with HOL4/Candle and start crawling your way back up to showing the bootstrap HOL4 kernel is correct (this will be several OOM harder than CakeML itself was), and send yourself off into selfimproving lalaland: https://github.com/emberian/svenvs"}, {"id": 50669641, "au": "twotwotwo", "dom": 1, "sr": 2, "sc": 8.89, "ep": 8.89, "bs": 0.0, "d": 0, "age": 18.12, "grav": 222.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 239, "qw": 0, "k": 1841, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": ["https://leodemoura.github.io/blog/2026-10-15-lean-now-ships-with-verified-kernels/"], "ig": 1.637, "fa": 0.9, "gp": 1.708, "bl": 0.0, "ds": 0.0, "txt": "It is true soundness bugs have been found, and the Lean community spends effort on it. But this page doesn't convey the gap between one incorrect verification and successfully misleading mathematicians about what is true: there are multiple checkers and you need bugs in all of them, without the input looking implausible on informal review.\n\n(For example, a DeepMind researcher created a 'proof' that passed Lean and (a then-week-old version of) nanoda by exploiting a different bug in each. But if you fed that into a regular old LLM (or to a human expert, but I mention LLMs b/c they can be assigned to review even very large volumes of Lean code) it would immediately say \"no, this isn't real math.\")\n\nThe increase in soundness bugs found this year is notable, because LLMs are good at finding ways to their assigned goals, and they found some funny ones. And, besides fixes for the specific bugs, it led to broader work on hardening and alternative and verified kernels: https://leodemoura.github.io/blog/2026-10-15-lean-now-ships-...\n\nSo you have fewer avenues than at the start of the year to get a proof of False OK'd by one proof-checker kernel, and it's much much harder to get one through the gauntlet invoked by `lake check --paranoid`.\n\n(This is also interesting as a(nother) example of the difficulty of making truly correct software -- you'd hope for proof-checker kernels to be pretty"}, {"id": 50671388, "au": "dwheeler", "dom": 18, "sr": 3, "sc": 7.89, "ep": 7.89, "bs": 0.0, "d": 0, "age": 15.42, "grav": 171.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 6600, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": ["https://us.metamath.org/"], "ig": 1.636, "fa": 0.62, "gp": 1.573, "bl": 0.0, "ds": 0.0, "txt": "I think this is misleading for the proof-checkers in systems where multiple provers must pass for the proof to be accepted.\n\nIn the case of Metamath, yes, soundness bugs have been found in the original \"metamath\" proof verifier, written in C. But to be accepted into the main proof databases (set.mm and iset.mm), proofs must pass \"5 independently-created verifiers in 5 different programming languages: metamath (a C verifier by Norm Megill), mmj2 (a Java verifier by Mel O'Cat and Mario Carneiro), smetamath-rs (a high-speed Rust verifier by Stefan O'Rear), checkmm (a C++ verifier by Eric Schmidt), and mmverify.py a Python verifier by Raph Levien).\" - https://us.metamath.org/\n\nTo me, that's a key countermeasure to the problem."}, {"id": 50670058, "au": "nickpsecurity", "dom": 67, "sr": 4, "sc": 7.51, "ep": 7.51, "bs": 0.0, "d": 0, "age": 17.58, "grav": 211.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 14398, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.798, "fa": 0.85, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "I think this review is unfair given he doesn't compare those observations to:\n\n1. The number of bugs in unverified programs of similat complexity. By average and good coders. Think CompCert's middle end having no bugs in the evaluation against other compilers.\n\n2. The number of bugs in those vs verification tools in general. If proof and simplicity works, we should see a huge drop vs larger provers or solvers.\n\n3. How much the proof helped prevent bugs in verified software and their severity vs the number and severity of bugs in the provers.\n\n4. An empirical argument where common, coding strategies in battle-tested compilers normally run withiut errors. Therefore, a verified checker implemented with those patterns in a simple, coding style will probably run correctly or with few bugs. But, he just says a large binary checking a large binary which makes both programs sound equally reliable.\n\nSo, I support developing and using these tools. We should have them tested on many, small programs and properties like we do static analyzers. Then, use David A. Wheeler's diverse, double compilation on their checkers with GCC and LLVM. Run other verified tools through that."}, {"id": 50671288, "au": "kachnuv_ocasek", "dom": 46, "sr": 5, "sc": 6.45, "ep": 6.45, "bs": 0.0, "d": 1, "age": 15.61, "grav": 174.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 52, "qw": 0, "k": 2196, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": ["https://arena.lean-lang.org/"], "ig": 1.146, "fa": 0.96, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "There are at least 36 different Lean type checker implementations in various languages, with different people and ideas behind them. See the Lean Kernel Area https://arena.lean-lang.org/\n\nAlso, what exactly do you mean by simplicity? The core of nanoda_lib is about 7,000 lines of code, much smaller than HOL Light as far as I can tell."}, {"id": 50668730, "au": "gr_norm", "dom": 22, "sr": 6, "sc": 6.28, "ep": 6.28, "bs": 0.0, "d": 0, "age": 19.45, "grav": 249.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.14, "fa": 0.34, "gp": 1.813, "bl": 0.0, "ds": 0.0, "txt": "The call for further high-assurance work is good, but let's not miss the forest for the trees: some of these have been around for decades, and all the soundness bugs they've ever had fit in a tweet! (Or close to it.)\n\nComfortably more than good enough for 99.9% of software, especially considering you'd still need to exploit such a soundness bug in a way that hides a further issue in the program being verified."}, {"id": 50669131, "au": "perching_aix", "dom": 65, "sr": 7, "sc": 5.96, "ep": 6.1, "bs": 0.0, "d": 0, "age": 18.85, "grav": 236.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 2994, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 1.666, "fa": 0.5, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "Cool resource.\n\nI recently checked if this rabbit hole bottoms out and it kinda does?\n\nARM appears to be publishing a formal language specification of their ISA as the normative version, but Intel's version is only nonnormative. For CakeML, the semantic correspondance for ARMv8 was proven.\n\nSo you have ARMv8 -> CakeML -> Candle (i.e. HOL Light) fully certified supposedly.\n\nNot freestanding though, so OS shenanigans may still bite. Even in freestanding, UEFI shenanigans might too, not sure.\n\nIf anyone knows the remaining gaps (excl. the virtual <-> physical boundary), would be happy to hear."}, {"id": 50671535, "au": "u1hcw9nx", "dom": 47, "sr": 8, "sc": 5.42, "ep": 5.57, "bs": 0.0, "d": 2, "age": 15.13, "grav": 166.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 2782, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 1.521, "fa": 0.34, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "HOL Light trusted kernel is 400–500 lines of code.\n\nHOL Light defines only 10 primitive inference rules.\n\nHOL Light's  maximizes trustworthiness and manual auditability by humans or machines (YOU CAN DO IT).  The kernel itself has been formally verified inside HOL Light.\n\nThere are at least 3 separate HOL light implementations: HOL Light,  CakeML, HOLZero that implement the exactly same logic.\n\nLean's kernel extends its primitive environment every time an inductive type or quotient primitive is declared. Once you import all of Mathlib it's very large. That's why you want to use something like HOL to verify those."}, {"id": 50676618, "au": "xg15", "dom": 39, "sr": 9, "sc": 5.09, "ep": 5.09, "bs": 0.0, "d": 3, "age": 0.53, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 23551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formally_correctness", "flbl": "Formally & Correctness (Agent)", "urls": [], "ig": 1.466, "fa": 0.28, "gp": 0.582, "bl": 0.0, "ds": 0.0, "txt": "Well, the machine could also help you generate the formal definition if you give it enough prose, context, examples, etc to nail down what you want.\n\nGoing from \"we need to write code to reach unambiguity\" to \"we can explain it like we'd explain it to a human if we want to be very clear\" is already a huge step.\n\nOf course you'd still have to manually verify the formal problem statement that was generated. I guess somewhere, the turtles have to stop.\n\nYou could make this into a more general workflow for working with LLMs:\n\n1) First spend some iterations with the model to nail down what you want and have it produce mock-ups, test cases, verifiers, etc. Anything that you can check for correctness easily and that the LLM can then in turn use to check for itself.\n\n2) Then let the LLM run wild and produce the actual thing, using the verifier from step 1 as a guide."}, {"id": 50672327, "au": "quotemstr", "dom": 11, "sr": 10, "sc": 5.06, "ep": 5.2, "bs": 0.0, "d": 1, "age": 13.52, "grav": 139.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 8742, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 1.385, "fa": 0.5, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The latest \"thing\" in some circles is denying that the recent proofs, e.g. of the Riemann hypothesis, are proofs of anything. People point out pointless or tautological sections of these proofs as evidence that the proof itself might be ill-formed, but Lean and similar systems don't work that way: absent a kernel bug, introducing unnecessary noise to a proof cannot make it prove something false.\n\nOthers are looking hard for kernel bugs. They exist, but there are good reasons (including multi-kernel validation) to be confident they don't impair these recent proofs.\n\nIn a situation in which you have a cohort of people who \"want to believe\" in some unlikely thing, you have to take the evidence they present with a grain of salt. So it is, today: people \"want to believe\" we haven't basically solved automated theorem proving when we have."}, {"id": 50676687, "au": "DoctorOetker", "dom": 44, "sr": 11, "sc": 4.76, "ep": 5.61, "bs": 0.85, "d": 3, "age": 0.26, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 1967, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 1.663, "fa": 0.34, "gp": 0.504, "bl": 0.32, "ds": 0.0, "txt": "its not up to me to defend Anthropic & Lean decision makers.\n\nKevin Buzzard was working on formalizing (partially modernized) version of Wiles' purported proof.\n\nIndependently Anthropic finds a purported proof for Fermat's last theorem.\n\nAnthropic invites Kevin Buzzard to verify it. Kevin is compute poor: it appears running the Lean proof requires a 500 GB RAM machine. So they gave Kevin access to the compute. 13 million lines.\n\nsign up to the metamath mailing list and you should soon see a succinct human-discovered human-readable and essentially highschool-level proof of FLT in metamath\n\nIt's not my task to justify the poor decisions of others."}, {"id": 50675245, "au": "twotwotwo", "dom": 8, "sr": 12, "sc": 4.76, "ep": 5.05, "bs": 0.0, "d": 2, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 70, "qw": 0, "k": 1841, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": ["https://leodemoura.github.io/blog/2026-8-24-postmortem-for-the-kernel-soundness-bug-hunt/"], "ig": 1.178, "fa": 0.62, "gp": 0.356, "bl": 0.0, "ds": 0.0, "txt": "The C++ Lean kernel and Rust nanoda were mostly written before they could be LLM-written, and by different people. Two recent LLM-written kernels, con-leche and con-ron, are interesting partly because there are proofs that go with the code.\n\nMaybe what's most interesting is from a page about a bug hunt: https://leodemoura.github.io/blog/2026-8-24-postmortem-for-t... -- at the time they shipped four kernels (C++ Lean, nanoda, lean4lean, and ind-models); most listed bugs only bit the first, and one bit two."}, {"id": 50671922, "au": "streetfighter64", "dom": 70, "sr": 13, "sc": 4.67, "ep": 4.89, "bs": 0.0, "d": 1, "age": 14.38, "grav": 153.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 220, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": ["https://en.wikipedia.org/wiki/Letter_and_spirit_of_the_law"], "ig": 0.77, "fa": 0.9, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "Is it really cheating of it's following the rules that were set up for it? https://en.wikipedia.org/wiki/Letter_and_spirit_of_the_law\n\nI prefer to see it as a failure of the specification. Tax avoidance isn't illegal, tax evasion is. Getting acquitted on a \"loophole\" still means you're free to go."}, {"id": 50670666, "au": "andai", "dom": 34, "sr": 14, "sc": 4.49, "ep": 4.64, "bs": 0.0, "d": 0, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "formally_correctness", "flbl": "Formally & Correctness (Agent)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "There's a deeper problem — I'm assuming it doesn't apply in the case of the math proofs because the problem itself has already been formulated in symbolic terms, by humans — but I've had this problem where, an agent proved the correctness of an implementation (within reason), but it proved it against its own incorrect understanding of what needed to be done. So in one case, what it built ended up being the exact opposite of what needed to be done!\n\nI found it amusing in that case l, that even if it had supplied me with a formal proof of correctness, the proof would also have passed, and the implementation would still have been completely useless! Because the LLM's understanding of what it was supposed to be doing in the first place was wrong.\n\nCommunication is hard!"}, {"id": 50669053, "au": "Karliss", "dom": 23, "sr": 15, "sc": 4.02, "ep": 4.38, "bs": 0.0, "d": 1, "age": 18.94, "grav": 238.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 1630, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.386, "fa": 0.34, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "100 in 20 years means new one every other month. Which seems frequent enough to be quite sure that at all time there is at least one or few of them possibly undiscovered. Which is enough for misaligned AI to prove false statements. That's already not great.\n\nBut if you look at the trend. It's on logarithmic scale. With all the lines being curved up. Amount of bugs found was already growing exponentially years before being accelerated by current AI trends. To me a more likely explanation seems not that there were barely any bugs in previous decades, but that barely anyone was looking for them or considering it serious problem."}, {"id": 50668902, "au": "kadoban", "dom": 49, "sr": 16, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 0, "age": 19.18, "grav": 243.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 7573, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 0.954, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Nice page. It'd be nice if it showed which ones are closed vs still open. I clicked through a decent number of the lean ones and they were closed/fixed/merged."}, {"id": 50676608, "au": "socketcluster", "dom": 60, "sr": 17, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 0, "age": 0.59, "grav": 5.5, "surf": 43.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 212, "qw": 0, "k": 760, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 1.64, "fa": 0.0, "gp": 0.038, "bl": 0.0, "ds": 0.0, "txt": "I feel like we've reached peak \"trust the data\" and peak \"trust the process.\"\n\nThere are a lot of cases nowadays when someone points at what they claim to be 'irrefutable proof' and  demand that you believe it; but essentially nobody fully understands the mechanism which makes the proof correct... And really, people are just trusting the system and trusting projections of what looks like real data.\n\nMoreover, the people demanding you to \"trust the data\" or \"trust the process\" often have questionable motives and questionable moral character.\n\nI started feeling this way when I first got into crypto. People who knew nothing about cryptography or coding kept boasting about Bitcoin's \"cryptographically verifiable\" ledger; but such people had literally never even met a single person in their lives who had ever read enough of Bitcoin's code to be able to independently support that conclusion. From the proponent's perspective, it was pure faith disguised as mathematics.\n\nI think now we're seeing a lot of that... And clearly, we're heading into a future where humans will lose this knowledge. Soon, our trust in data, science and mathematics will be based on absolutely nothing and nobody.\n\nIt will be like a deity which we're not allowed to question and there will be no way for anyone to prove otherwise anyway."}, {"id": 50669047, "au": "codingjoe", "dom": 62, "sr": 18, "sc": 3.73, "ep": 4.17, "bs": 0.0, "d": 0, "age": 18.96, "grav": 239.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 77, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.309, "fa": 0.28, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "That's what's so often forgotten in the AI slop era. Less complexity and by extension less code, mean less room for errors.\n\nI maintain multiple large authentication packages and this is the reason I reject almost all feature requests. Not because I am an d*ck, but I need to be able to verify their safety and I am only human."}, {"id": 50670687, "au": "adrian_b", "dom": 79, "sr": 19, "sc": 3.72, "ep": 3.72, "bs": 0.0, "d": 4, "age": 16.61, "grav": 193.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.239, "bl": 0.0, "ds": 0.0, "txt": "I do not doubt that there must exist plenty of other people who might have written secure and efficient C code, but most of them must have kept that code for themselves or for their employers, so it has remained unknown.\n\nThere are many programs written by DJB, which I have been using continuously 24/7 for several decades, day and night, year after year, on many kinds of server computers and many successive generations of computer hardware, and they have always worked perfectly, without the slightest problem.\n\nThere are no programs written by any other individual that I have seen in continuous use for so many years, without having to be replaced with other versions or with other completely different programs, if not for fixing bugs in them, at least because of the need to enhance them with new features.\n\nSo I am certainly very grateful for his high-quality work shared publicly."}, {"id": 50669159, "au": "gr_norm", "dom": 24, "sr": 20, "sc": 3.31, "ep": 4.27, "bs": 0.0, "d": 2, "age": 18.81, "grav": 236.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.612, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "A lot of the issues found were in known-suspicious corners of the underlying type theories. It was previously fine to have certain convenient kludges around since proofs were written by humans, for whom the likelihood of accidentally completing a proof by triggering a bug was basically 0. These are being removed or their foundations reworked to deal with AI now writing proofs at unprecedented scale. It's actually remarkable how well the current crop of proof assistants has dealt with the instant orders-of-magnitude increase in the volume of proof thrown at them. So taking prior design considerations and skyrocketing usage together, it's not too surprising to see a few more soundness bugs in the past several months.\n\nIf you want a scare, take a look at how many soundness bugs the borrow checker has had. Nobody would deny its usefulness for correctness."}, {"id": 50674653, "au": "JdeBP", "dom": 80, "sr": 21, "sc": 3.1, "ep": 3.25, "bs": 0.0, "d": 5, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They worked even without the infamous errno patches?  No, they didn't.  They don't even build at all with modern compilers.\n\nAnd Laurent Bercot did not keep the code to xyrself.  Famously so.\n\nHint: If you are using a Bernstein program, you are likely using one of my patches to it, such as the ones that went into netqmail, or the stuff that I did for djbdns and ucspi-tcp.  Or one of Felix von Leitner's or Wayne Marshall's.  It is probably unwise to argue with us about perfection and zero problems.  We're the people who made your experience this smooth, almost a quarter of a century ago."}, {"id": 50669706, "au": "gr_norm", "dom": 53, "sr": 22, "sc": 2.94, "ep": 3.96, "bs": 0.0, "d": 2, "age": 18.04, "grav": 220.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 3, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.165, "fa": 0.28, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "> Some initial observations:\n1) the exception is not reported by check_example because stack_space_exception is not a lean::exception\n2) It's then caught by task_queue::execute but never reported, apparently\n\nThis is (was? it predates Lean 4 by several years) an issue with `example` checking, which isn't relevant to soundness."}, {"id": 50670506, "au": "u1hcw9nx", "dom": 45, "sr": 23, "sc": 2.93, "ep": 3.66, "bs": 0.0, "d": 0, "age": 16.92, "grav": 198.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 2782, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "That shows the importance of very simple proof checkers, like HOL Light.\n\nCross verifying proof checkers with different implementations, different algorithms is also important."}, {"id": 50672737, "au": "legobmw99", "dom": 20, "sr": 24, "sc": 2.74, "ep": 3.1, "bs": 0.0, "d": 2, "age": 12.41, "grav": 121.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 647, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think your intuition is correct; consider than e.g. the Jacobian conjecture didn’t fall due to a gigabyte of lean, but to a single tweet with a counter example.\n\nOf course, once you introduce a few common axioms (choice, but even something simple like functional extensionality IIRC) a lot of non constructive proofs become possible"}, {"id": 50671810, "au": "abecedarius", "dom": 59, "sr": 25, "sc": 2.66, "ep": 2.66, "bs": 0.0, "d": 1, "age": 14.59, "grav": 157.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 8957, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formally_correctness", "flbl": "Formally & Correctness (Agent)", "urls": [], "ig": 1.132, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I assume you mean apparently-sincere proofs rather than obvious hacks.\n\nThere may be an important difference of regime from the kind of proofs mathematicians have cared about, to AI-coded proofs of correctness of very ambitious and consequential programs that no human has even read."}, {"id": 50670888, "au": "TZubiri", "dom": 72, "sr": 26, "sc": 2.57, "ep": 3.67, "bs": 0.0, "d": 0, "age": 16.25, "grav": 186.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 2174, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.22, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think Lean kernel correctness is a distraction, it's like arguing a Rust program can have bugs because its memory safety guarantees may be faulty.\n\nBut rust programs are full of bugs unrelated to memory safety, if you go down this argument line you are furthering the argument that the programming language's safety mechanism prevents all bugs, it doesn't there can still be bugs in the application code, not in the compiler."}, {"id": 50676043, "au": "GoblinSlayer", "dom": 4, "sr": 27, "sc": 2.5, "ep": 2.94, "bs": 0.0, "d": 3, "age": 2.66, "grav": 15.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1832, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 0.912, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Wasn't there a very complex bug found in raft? What is the upper bound on bug complexity? Shouldn't big proofs be suspicious? The bigger they are the more likely they are to exploit the verifier in increasingly complex ways."}, {"id": 50669522, "au": "JdeBP", "dom": 63, "sr": 28, "sc": 2.39, "ep": 2.98, "bs": 0.0, "d": 1, "age": 18.32, "grav": 226.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 0.928, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Less complexity and less code has been a Daniel J. Bernstein theme since the 1990s.  As well as reflections based upon experience on how easy that is to achieve.  (-:"}, {"id": 50671806, "au": "amelius", "dom": 40, "sr": 29, "sc": 2.39, "ep": 3.2, "bs": 0.0, "d": 0, "age": 14.6, "grav": 157.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.65, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Pardon my ignorance but why are these proof checkers so large? Can't they be bootstrapped from a very small set of rules, which are easy to check?"}, {"id": 50672004, "au": "SkiFire13", "dom": 7, "sr": 30, "sc": 2.35, "ep": 3.89, "bs": 0.0, "d": 2, "age": 14.22, "grav": 150.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2107, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.974, "fa": 0.34, "gp": 0.434, "bl": 0.0, "ds": 0.0, "txt": "Lean was created 13 years ago, Claude didn't exist yet. Besides, kernels are relatively small, e.g. nanoda is less than 10k lines. They are small enough that independent humans can review them."}, {"id": 50671837, "au": "dist-epoch", "dom": 48, "sr": 31, "sc": 2.2, "ep": 2.86, "bs": 0.0, "d": 3, "age": 14.55, "grav": 156.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 9, "k": 3027, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 0.709, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Once you import all of Mathlib it's very large\n\nThis is why Riemann proof only used a tiny bit of mathlib. An I think the formalization of Fermat's Last Theorem didn't use it at all."}, {"id": 50668893, "au": "tkz1312", "dom": 25, "sr": 32, "sc": 2.2, "ep": 3.74, "bs": 0.0, "d": 1, "age": 19.2, "grav": 244.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 481, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.958, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I mean I haven't looked at any of these issues too much in detail, any soundness bug is probably enough to get a proof of false (kinda by definition?), and from there all bets are off really, especially if we're talking about potentially adversarial llm generated proofs (basically any industrial proof at the end of 2026)."}, {"id": 50675298, "au": "twotwotwo", "dom": 10, "sr": 33, "sc": 2.12, "ep": 3.66, "bs": 0.0, "d": 3, "age": 5.32, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 187, "qw": 0, "k": 1841, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.118, "bl": 0.0, "ds": 0.0, "txt": "I think it'd be similar to writing a flawed argument (or buggy code, etc.) that would pass review with a lot of people. I bet just having a really subtle flaw is more robust than trying to find a quirky, specific chink in LLM armor that survives different models, angles on the prompt, etc.\n\nOne thing I didn't spell out about why non-proof-checker 'informal' review is interesting is it means any exploits have to be hidden. Proof checkers don't care if the code they're looking at is weird in context, and it probably will be weird if it's a refcount-overflow exploit rather than a proof (to use an actual runtime-soundness bug from the August post on C++ Lean). But to an expert or LLM, exploit code and real math reasoning can look different. So the result is the challenge is no longer just 'exploit the bug(s)' but now also 1) make the exploit not suspicious to the informal reader and 2) make the argument also make sense to them.\n\nI think hardening the kernels and their diversity are the main defenses, but the informal-review thing is fun to think about because it's such a different challenge from the others."}, {"id": 50672288, "au": "andai", "dom": 38, "sr": 34, "sc": 2.1, "ep": 5.19, "bs": 2.79, "d": 2, "age": 13.58, "grav": 140.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 62, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "formally_correctness", "flbl": "Formally & Correctness (Agent)", "urls": ["https://news.ycombinator.com/item?id=50671040"], "ig": 1.212, "fa": 0.62, "gp": 0.394, "bl": 1.054, "ds": 0.0, "txt": "(responding also to sibling comment) > You can't have a formal proof without a formally defined problem. You let your agent formally define the problem and it got it wrong. Doesn't sound very deep. https://news.ycombinator.com/item?id=50671040\n\nSo expressing myself in the strictest mathematical terms is for the human, and being creative and trying a bunch of stuff out is for the machine.\n\nWho is responsible for this mess!"}, {"id": 50676719, "au": "otabdeveloper4", "dom": 12, "sr": 35, "sc": 1.96, "ep": 3.5, "bs": 0.0, "d": 2, "age": 0.16, "grav": 4.0, "surf": 10.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 4, "k": 3244, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.222, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> are proofs of anything\n\nThey literally aren't proofs.\n\nProofs are verified truths built from axioms.\n\nNone of that applies to Lean. Lean is a program that generates C code that is compiled and run on a CPU. None of that stack is verified.\n\nThe probability is errors in Lean is likely very small, but math isn't about finding solutions that are unlikely to fail. Math is about proofs. You don't prove a theorem by demonstrating that the probability of it being false is very small."}, {"id": 50672338, "au": "ratmice", "dom": 19, "sr": 36, "sc": 1.95, "ep": 2.68, "bs": 0.0, "d": 1, "age": 13.49, "grav": 138.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 358, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not that I've put a lot of thought into it, but it also feels like a lot of constructive proofs should be easily checked by whether or not they produce the appropriate value when running them. E.g. an existence proof can testing that the value it proves to exist is given. When using soundness holes, one must imagine that this is short circuited."}, {"id": 50670352, "au": "gr_norm", "dom": 16, "sr": 37, "sc": 1.91, "ep": 3.23, "bs": 0.0, "d": 2, "age": 17.16, "grav": 203.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 1.034, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They're (almost all?) independently written kernels, not forked from each other. There's ongoing work developing a complete specification of Lean's type theory so the de Bruijn criterion can be truly satisfied."}, {"id": 50671181, "au": "solyin", "dom": 32, "sr": 38, "sc": 1.63, "ep": 3.17, "bs": 0.0, "d": 4, "age": 15.76, "grav": 177.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 783, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.35, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They have virtually infinite compute though. We, the general public can throw random desktop compute random people have spare, but that's not the same thing as being able to run an internal proof on an GB200 system. An unreleased AI with the right system prompt and unlimited subagents could check it for embarrassing errors. It's been days since it was released and while there's still possibility of an error, it's definitely less embarrassing for the Internet to take weeks or months to find the error."}, {"id": 50675884, "au": "317070", "dom": 3, "sr": 39, "sc": 1.62, "ep": 3.16, "bs": 0.0, "d": 2, "age": 3.2, "grav": 19.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 5553, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not just possible, it's already done with the con-leche lean kernel.\n\nOf course, it's turtles all the way down. There could be CPU exploits exploiting a broad range of CPUs but also so obfuscated that humans and LLMs cannot spot it in the thousands of lines of lean. Exploits that survive multiple lean kernels and lean kernels that verify each other.\n\nIn practice: I had fun this year figuring out some lean exploits. But they were all immediately and obviously detectable. These million line lean proofs just don't contain anything remotely to the nonsense of an exploit."}, {"id": 50676586, "au": "auggierose", "dom": 43, "sr": 40, "sc": 1.45, "ep": 2.84, "bs": 0.0, "d": 3, "age": 0.68, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 5597, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "Because until up to about 6 months ago, the main difficulty in a machine-checked proof was not checking it, but getting one in the first place. So proof assistants are not \"checkers\" first, but programs that help you to create the machine-checked proof in the first place, and they are correspondingly large. Many of them, like Isabelle/HOL, are based on a small kernel in principle."}, {"id": 50672051, "au": "heavensteeth", "dom": 9, "sr": 41, "sc": 1.43, "ep": 2.97, "bs": 0.0, "d": 2, "age": 14.12, "grav": 149.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The article mentions that sometimes, multiple checkers happen to share soundness bugs; I wonder if one could devise a prompt that multiple LLMs consistently fail to find the flaw in. It'd be quite interesting if two models of entirely different families fell for the same very particular mistake."}, {"id": 50669187, "au": "Palomides", "dom": 55, "sr": 42, "sc": 1.4, "ep": 2.65, "bs": 0.0, "d": 0, "age": 18.77, "grav": 235.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 2922, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.418, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "if this is such a big problem, have any LLM proofs been found to use an unsoundness bug?"}, {"id": 50669833, "au": "tkz1312", "dom": 28, "sr": 43, "sc": 1.4, "ep": 2.94, "bs": 0.0, "d": 3, "age": 17.89, "grav": 217.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 481, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have been working with lean and other theorem provers professionally for many years. Soundness bugs are very far down my list of worries, but they are absolutely a real thing that should be taken seriously.\n\nWith that said the combo of con-leche, con-ron, and con-agua that has emerged since the summer is quite confidence inspiring, and I do expect that we will probably flush the vast majority of soundness bugs out of the major systems over the next year or two."}, {"id": 50669730, "au": "JdeBP", "dom": 78, "sr": 44, "sc": 1.21, "ep": 2.17, "bs": 0.0, "d": 3, "age": 18.01, "grav": 219.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "Berstein's claim to fame in that area is being one of the most prominent advocates of avoiding some of the sadly still even today common design and development patterns that lead to very insecure C code.\n\nBut the sole person, or the person who is closer than anyone else?  I wouldn't really agree with that, on the simple grounds that there are other people taking the same approach to systems architecture.  Look up Laurent Bercot, for starters."}, {"id": 50668980, "au": "empath75", "dom": 27, "sr": 45, "sc": 1.2, "ep": 2.3, "bs": 0.0, "d": 2, "age": 19.05, "grav": 240.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 16980, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "It is relatively easy to check against multiple lean kernels right now and even fairly trivial to reformalize proofs in different proof languages entirely. The idea\n that this is a real problem is nonsense."}, {"id": 50670329, "au": "Jaxan", "dom": 17, "sr": 46, "sc": 1.1, "ep": 2.64, "bs": 0.0, "d": 2, "age": 17.18, "grav": 203.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1020, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.783, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This s a valid point, especially since the type theory lean does not have a clear specification. They do have a large collection of tests though."}, {"id": 50671525, "au": "talon8635", "dom": 69, "sr": 47, "sc": 1.05, "ep": 2.3, "bs": 0.0, "d": 0, "age": 15.15, "grav": 166.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 691, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.551, "fa": 0.28, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Presumably AIs will attempt workaround cheats in Lean the same way they pursue workaround cheats on benchmarks"}, {"id": 50668974, "au": "gr_norm", "dom": 26, "sr": 48, "sc": 0.83, "ep": 2.37, "bs": 0.0, "d": 2, "age": 19.06, "grav": 241.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.678, "fa": 0.22, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "It's the same situation as the borrow checker, which has also had soundness issues. You're really, really unlikely (even with LLMs generating programs/proofs) to stumble across them."}, {"id": 50669600, "au": "olmo23", "dom": 50, "sr": 49, "sc": 0.79, "ep": 1.96, "bs": 0.0, "d": 1, "age": 18.2, "grav": 223.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 226, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_verifier", "flbl": "Proof & Verifier (Metamath)", "urls": [], "ig": 0.754, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "For lean, a recent one is basically \"if you edit the precompiled files -not the sources- before passing them on to leanchecker you can prove False\".. I wouldn't count that personally."}, {"id": 50669366, "au": "gr_norm", "dom": 57, "sr": 50, "sc": 0.74, "ep": 2.14, "bs": 0.0, "d": 2, "age": 18.51, "grav": 230.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 35, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.766, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "Notably:\n\n> it was later clarified that the person who originally posted the proof was already aware that it was buggy, and chose not to be clear about this up front, as a humorous way to file a bug\n\nSo not quite an accident. In the aftermath of this one of the Lean maintainers wrote a verified kernel, con-leche, that comparator uses."}, {"id": 50671017, "au": "tkz1312", "dom": 30, "sr": 51, "sc": 0.72, "ep": 2.26, "bs": 0.0, "d": 3, "age": 16.02, "grav": 182.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 481, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The concern is that the llms would reward hack their way to the goal by discovering and exploiting a soundness bug, and nobody would notice because for lots of use cases nobody reads proofs anymore."}, {"id": 50675612, "au": "black_knight", "dom": 21, "sr": 52, "sc": 0.59, "ep": 1.91, "bs": 0.0, "d": 3, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 819, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fun ext is fine in some systems, like Cubical Type Theory, where the correct computation rules for it have been found. But is a blocker in others."}, {"id": 50675029, "au": "ted_dunning", "dom": 33, "sr": 53, "sc": 0.57, "ep": 2.11, "bs": 0.0, "d": 5, "age": 6.48, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 980, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.63, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Those 17 million lines have been reduced to 76k.\n\nIt has become much less plausible that there is a soundness bug being tickled."}, {"id": 50675677, "au": "josephg", "dom": 2, "sr": 54, "sc": 0.55, "ep": 1.21, "bs": 0.0, "d": 1, "age": 3.94, "grav": 24.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 22391, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "formally_correctness", "flbl": "Formally & Correctness (Agent)", "urls": [], "ig": 0.509, "fa": 0.0, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "Would it be possible to formally verify lean and friends? If SeL4 can be formally verified, it should be possible, right?"}, {"id": 50669453, "au": "eqvinox", "dom": 75, "sr": 55, "sc": 0.53, "ep": 0.97, "bs": 0.0, "d": 2, "age": 18.4, "grav": 227.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 8021, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.412, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Having met him in person, he is certainly legendarily weird. (And not in a positive or charming way.  I don't quite know how to describe it, let's say somewhere around \"sure of himself and dismissive\".) I've had no reason to clash with him, but I certainly see how that would go badly."}, {"id": 50673607, "au": "Sniffnoy", "dom": 58, "sr": 56, "sc": 0.53, "ep": 1.86, "bs": 0.0, "d": 2, "age": 10.21, "grav": 90.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 5536, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That wasn't an LLM proof exploiting a bug; that was reporting a bug that had been found by jokingly using it to \"prove\" Collatz.  However the joke was not immediately obvious, so..."}, {"id": 50672393, "au": "andrewaylett", "dom": 83, "sr": 57, "sc": 0.53, "ep": 1.81, "bs": 0.0, "d": 3, "age": 13.35, "grav": 136.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4227, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_secure", "flbl": "Code & Secure (Claim)", "urls": [], "ig": 0.768, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Chuck Norris doesn't need to write secure C code, he just roundhouse kicks all the bugs away.\n\nBruce Schneier doesn't need to write secure C code, any vulnerabilities fix themselves out of embarrassment.\n\nDJB is incapable of writing insecure C code, any vulnerabilities you think you may have found are because you're using it wrong."}, {"id": 50670205, "au": "alfiedotwtf", "dom": 15, "sr": 58, "sc": 0.53, "ep": 1.68, "bs": 0.0, "d": 1, "age": 17.36, "grav": 207.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 4359, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "soundness_bug", "flbl": "Soundness & Bug (Lean)", "urls": [], "ig": 0.716, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know anything about the diversity of the code in solvers, but if it's anything like browsers (besides Firefox) \"multiple\" doesn't give you much given that they're all just Chrome in a trench coat."}, {"id": 50669291, "au": "warkdarrior", "dom": 54, "sr": 59, "sc": 0.53, "ep": 1.41, "bs": 0.0, "d": 1, "age": 18.64, "grav": 232.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1891, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hol_kernel", "flbl": "Hol & Kernel (Lean)", "urls": [], "ig": 0.598, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If the page does not instill fear in formal proofs and scare people away from Rocq/Lean/HOL, why even have it?"}, {"id": 50670350, "au": "Jaxan", "dom": 31, "sr":     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
