6.7, "terms": "feedback, learning, understanding, plan"}, {"slug": "general_commentary", "label": "General Commentary", "count": 3, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 7}], "story_anchors": ["flail", "flailing", "feedback", "action", "feel", "instead", "approach", "getting", "hard", "system", "engineers", "plan", "situation", "doubt", "done", "etc", "advice", "useful"], "largest_root": {"root_id": 50640650, "author": "FinnLobsien", "slots": 8, "start_dom": 6, "end_dom": 13, "share_pct": 15.7, "top_dom1_age": 1.6, "top_dom1_author": "pixl97"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50644848, "au": "ddkto", "dom": 5, "sr": 1, "sc": 7.09, "ep": 7.09, "bs": 0.0, "d": 0, "age": 0.38, "grav": 4.8, "surf": 21.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 245, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 1.452, "fa": 1.24, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "A key organizational corollary is that creating spaces where it is safe to flail can lead to much better outcomes.\n\nThere are spaces where flailing is 100% not safe. For example, just try random stuff while you are constructing a building. However, architects and engineers 100% flailing around as they are deciding what to build. The best environment for flailing is one where:\n1. You won’t hurt or harm anyone or anything, and\n2. You can learn from your experiments.\n\nThe Lean Startup is basically advocating for flailing, and the context is a small company with not brand to damage, and the feedback is direct market signals (purchase, usage, etc…)\n\nIn an established company with a brand to protect and significant assets that can be targeted by lawsuits, you need to find a safe “playpen” to flail in.\n\nIf you can try something in a PR without merging, that’s pretty safe. Why do people show mockups to customers instead of just shipping iterations? Because that protects the existing application’s perception."}, {"id": 50645075, "au": "aleksiy123", "dom": 27, "sr": 2, "sc": 5.99, "ep": 5.99, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 9.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 899, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 1.384, "fa": 0.96, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ive been thinking about this as well specifically in SWE projects at work and advice for juniors.\n\nI call it touching the problem or grounding.\n\nInstead of spending weeks trying to write the perfect design doc and getting approval. You aim for like 60%-80% and then you beeline to get something connected and in PROD processing real data in shadow mode ASAP.\n\nthen you iterate and not be scared of scrapping ideas and rebuilding them.\n\nAlso overthinking, and inaction is usually the worst possible outcome. Better to do the wrong thing then nothing."}, {"id": 50642395, "au": "tpoacher", "dom": 37, "sr": 3, "sc": 5.37, "ep": 5.37, "bs": 0.0, "d": 2, "age": 3.7, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 66, "k": 4154, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.551, "fa": 0.42, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "Ah yes I remember this article.\n\nWell, as theorized, the nuance is lost when reducing to a quote.\n\n> During the semester, these students were busy taking photos, experimenting with composition and lighting, testing out various methods in the darkroom, and learning from their mistakes. In the process of creating hundreds of photos, they honed their skills. Meanwhile, the quality group sat around speculating about perfection. In the end, they had little to show for their efforts other than unverified theories and one mediocre photo.\n\nSo, it was never really a question of \"quality vs quantity\". Quantity here was effectively treated as \"continuous improvement\", vs \"quality\" as a waterfall \"get things right on the first iteration no improvements allowed\" situation. Obviously the former is going to lead to better outcomes, but that's not proof that quantity is better than quality.\n\nIn fact, if I were to define a \"quality\" approach, it would indeed be via continuous improvement. The quantity approach I'd contrast it with would be more a case of \"quantity as bootstrap without improvement between sessions, aiming to simply pick the best of the random bunch at the end\". With that definition, you can bet that quality would trump quantity every time.   (in a sense this is similar to boosting vs bagging methods -- boosting always wins, assuming you don't stop after the first step -- but the"}, {"id": 50644681, "au": "mentalgear", "dom": 3, "sr": 4, "sc": 5.35, "ep": 5.35, "bs": 0.0, "d": 2, "age": 0.6, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 23, "k": 4741, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "risk_wealth", "flbl": "Risk & Wealth (Opportunities)", "urls": [], "ig": 1.406, "fa": 0.42, "gp": 0.584, "bl": 0.0, "ds": 0.0, "txt": "> since risks were taken to acquire that privilege and wealth\n\nI disagree, the wealthy oftentimes have generational wealth, so they themselves didn't take any risks, but as long as they follow along advice given to them, they should indeed be fine and more knowledgeable than their peers of less wealth.\n\n> Some of their ideas are amusingly wild though, but unfortunately keep them down.\n\nWell, inhere you exactly described the difference: When you're poor you got one shot, even if it has the chance to success, the risk is - especially these 'billion dollar ideas' - are far higher. So of course, you can't afford the risk because if you fail your living situation will drastically worsen, versus a wealthy person who just call it 'lesson learned' and can afford to go on as before. Plus, wealthy people have a network of other wealthy people, investors, 'influencers' etc that make the chances of them failing - even if it is just a mundane business idea with high competition - far less likely."}, {"id": 50644532, "au": "FinnLobsien", "dom": 10, "sr": 5, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 3, "age": 0.79, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 16, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.36, "fa": 0.42, "gp": 0.541, "bl": 0.0, "ds": 0.0, "txt": "> It's impossible for humans to predict with 100% confidence the outcome of every one of their actions.\n\nThat's exactly my point, which is why I think that low-downside, high-potential-upside tinkering is so important.\n\nYou start with a goal or a problem to solve before you model your options and their expected value. To use your job example: If the goal is to get a job as a software engineer you might tinker by:\n\n-Reaching out to software developers to see if they're willing to chat about how they built their careers, what they look at when hiring an engineer, etc.\n\n-Building an app/integration/something to solve a problem in your life and see if you enjoy that\n\nBoth of these take little time but could give you a ton of information that could get you onto the path of getting that job (or realizing you want something else entirely).\n\nI would argue getting a degree is the opposite because the downside is wasting years and paying $$$, potentially without any results."}, {"id": 50639286, "au": "squidlib", "dom": 15, "sr": 6, "sc": 5.02, "ep": 5.02, "bs": 0.0, "d": 0, "age": 10.98, "grav": 100.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 58, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 1.441, "fa": 0.0, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "I find this approach is particularly effective in GUIs that are not risky - aka learn a new tool simply by clicking through it. Another example: watching a young child try to learn a smartphone vs an older adult - the adult is generally way more concerned about breaking the phone unlike the child whom is happy to tap and drag and scroll to their heart’s content with no concern for breaking it. And in effect, the child discovers basic functionality faster."}, {"id": 50640023, "au": "PeterStuer", "dom": 33, "sr": 7, "sc": 4.87, "ep": 4.87, "bs": 0.0, "d": 0, "age": 9.07, "grav": 75.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 11112, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.831, "fa": 0.68, "gp": 0.677, "bl": 0.0, "ds": 0.0, "txt": "In biology every 'successfull' species 'flailed about'. It can be argued that in business, every 'entrepreneur' flailed about. Now 99% of them lost. But the 1% won. The onces that didn't 'flail' failed by default."}, {"id": 50640650, "au": "FinnLobsien", "dom": 6, "sr": 8, "sc": 4.78, "ep": 4.93, "bs": 0.0, "d": 0, "age": 7.43, "grav": 56.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 0, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.483, "fa": 0.0, "gp": 0.994, "bl": 0.0, "ds": 0.0, "txt": "Reality isn't deterministic. Everyone rationally understands this, but most people don't act on it.\n\nIt's foolish to believe that the quality of one's results scales linearly with planning, strategizing, and so on. We've all made intricate plans that went nowhere and done off-the-cuff things that became breakthroughs.\n\nI think the important mental model here is expected value:\n\nWhat's the potential upside and downside and what probability do I assign to those outcomes?\n\nFor everything you do, you should be able to make a credible case that it could lead to a great outcome, but don't bet everything on one scenario.\n\nThis creates the mental space to not pick favorites among approaches and act on real results (vs. insisting on the solution that was so elegant in your head).\n\n\"Flailing\" (I'd call it tinkering) falls apart in two scenarios:\n\n-When one attempt's failure doesn't take you back where you started, but makes you significantly worse off (e.g. larges-scale production infrastructure)\n\n-When the feedback loop isn't based on the results you're trying to achieve (e.g. users like your feature, but an exec doesn't, so the exec deprecates it)"}, {"id": 50644876, "au": "pixl97", "dom": 4, "sr": 9, "sc": 4.75, "ep": 4.89, "bs": 0.0, "d": 2, "age": 0.33, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 13, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.448, "fa": 0.42, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": ">even though they have equal access to all the same opportunities that I do\n\nI'd like to understand exactly what you mean by that?\n\nProblem space exploration very rarely looks the same for any two individuals. The chains of causality are long and very small perturbations can lead to wildly different outcomes. Things like what zip code you live in can affect your risk profiles affecting who lends you money, or even the time of day to listen to. Very small differences education or experience can have massive differences in outcomes.\n\nUs humans quite often point at our hard work as what lead to our successful outcomes without realizing the massive factors luck plays in."}, {"id": 50644867, "au": "skeeter2020", "dom": 14, "sr": 10, "sc": 4.15, "ep": 4.15, "bs": 0.0, "d": 0, "age": 0.33, "grav": 4.6, "surf": 21.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 7371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "feedback_learning", "flbl": "Feedback & Learning (Understanding)", "urls": [], "ig": 1.362, "fa": 0.28, "gp": 0.101, "bl": 0.0, "ds": 0.0, "txt": "I get, appreciate (and sometimes use^) this approach but what the author describes is less flail and more rapid iteration.\n\n* Try a lot of different things\n\n* Pay very careful attention to feedback\n\n* Ruthlessly drop things that are not getting positive \nfeedback\n\nIf you apply experience and whatever expertise you have, we've historically just called this science or engineering.\n\n^I've been asked what we (as both individuals and teams) should optimize for and respond \"fun\". This is intended to raise objections, but then I elaborate to describe fun as joyful learning and winning with which people are far more agreeable."}, {"id": 50643692, "au": "rramadass", "dom": 42, "sr": 11, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 0, "age": 1.78, "grav": 11.0, "surf": 8.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_learning", "flbl": "Feedback & Learning (Understanding)", "urls": [], "ig": 1.556, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "No, don't; We need more Thinking and less \"Flailing\".\n\nInstead, follow the modified STAR process (from Behaviour Based Safety training);\n\nStop - Stop and clear your mind of distractions and focus on what needs to be done.\n\nThink - Think about possible options and their payoffs, constraints, limitations and come up with a plan of action.\n\nAct - Follow the plan making any needed tactical changes as necessary.\n\nReview - Review the results to ensure that you achieved what you set out to do.\n\nAll of the steps can be repeated in a feedback loop as needed.\n\nA story i read somewhere that i always keep in mind:\n\nSome Agile aficionado found himself next to Niklaus Wirth on a plane trip. He enthusiastically embarked on a detailed explanation of Agile and its benefits hoping to get some validation. Wirth politely listened to everything and then remarked, \"I suppose it is all right if one doesn't know how to Design\"!"}, {"id": 50640796, "au": "PaulKeeble", "dom": 19, "sr": 12, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 0, "age": 7.05, "grav": 52.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 1.004, "fa": 0.0, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "I am reminded of the experiments on telling students to apply hard effort to produce one perfect result verses telling them to produce very many results quickly. Many results outperform focussing on a perfect first answer."}, {"id": 50640999, "au": "tpoacher", "dom": 35, "sr": 13, "sc": 3.58, "ep": 3.73, "bs": 0.0, "d": 0, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 4154, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_learning", "flbl": "Feedback & Learning (Understanding)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "It's interesting that the author says \"Wouldn’t it be better to be cautious and wait until you have a better understanding of what’s going on?\", then says no, and then goes on to describe a non-standard definition of flailing which is basically a productive way of precicely being cautious and waiting until you have a better understanding of what's going on (i.e. for any \"non-scarecrow\" definition of patience, understanding and caution).\n\nIf anything, if I heard the word flailing, I would have imagined exactly the opposite situation; instead of being methodical but patient in trying different things, reflecting, gathering feedback, and coming up with a plan, flailing brings to my mind someone who does things arbitrarily without method, variety, or direction, and does not stop to thoughtfully reflect, collate feedback, and make a plan of action.\n\nAnyway, strange choice of word, at the very least."}, {"id": 50644560, "au": "evek", "dom": 29, "sr": 14, "sc": 3.32, "ep": 3.46, "bs": 0.0, "d": 2, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 31, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 1.134, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Big fan of it too! What I like about Cynefin is the granular approach based on domain complexity. It’s a nice shorthand I revisit every once in a while, and useful in corporate environment where too many times there is “The Way (tm)” things are done that fails as soon as people try to apply it to different context, but the vocabulary or willingness to consider alternatives are absent."}, {"id": 50640533, "au": "ArisC", "dom": 44, "sr": 15, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 0, "age": 7.73, "grav": 60.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.244, "bl": 0.0, "ds": 0.0, "txt": "I don't think this is good advice for most people. Most people are either paralysed when faced with too much ambiguity, or jump into flailing about anyway. The former are those I wouldn't trust to flail about sensibly. The latter haven't even tried thinking through a problem before throwing spaghetti at the wall.\n\nThere are definitely situations when flailing about is the right strategy, but I wish the author had put more effort in explaining how to identify these. In my view, it's when there are too many unknowns, and flailing about is the most efficient strategy to uncovering them. That's rare though! There are usually things you can do to reduce ambiguity before jumping to potential solutions. Talk to customers, find similar situations in history or other domains, etc."}, {"id": 50641161, "au": "narag", "dom": 41, "sr": 16, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 0, "age": 6.19, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5856, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "risk_wealth", "flbl": "Risk & Wealth (Opportunities)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.416, "bl": 0.0, "ds": 0.0, "txt": "Yes, that has served me extremely well over the years. Reading some comments comparing the way a child learns by pushing all the buttons, I'm reminded of this: please, if you're designing a GUI, allow this. There's nothing more braindead that interfaces that punish you for \"errors\" making it difficult to go back to previous state."}, {"id": 50643803, "au": "pixl97", "dom": 1, "sr": 17, "sc": 3.11, "ep": 3.4, "bs": 0.0, "d": 0, "age": 1.64, "grav": 10.2, "surf": 9.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "risk_wealth", "flbl": "Risk & Wealth (Opportunities)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 0.298, "bl": 0.0, "ds": 0.0, "txt": "Reading this thread there is a common discussion of risk.\n\nIn computer operations that can be backed up or undone there is a lower amount of risk and you can more freely play with stuff. In things that can't be backed and don't have a reversible function things are much more risky.\n\nOur lives work somewhat similar. A common theme we see, especially here on HN, is people of privilege or wealth seem successful much more often than those that aren't. When you have backup wealth taking risks is easier as you have backup options. When you're poor and you spend your time and money and it doesn't work out, well you could die at worst, or have a terrible set of life experiences."}, {"id": 50641020, "au": "FinnLobsien", "dom": 49, "sr": 18, "sc": 3.08, "ep": 3.08, "bs": 0.0, "d": 1, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 1.312, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I think many people have an odd hesitation of doing the obvious thing in front of them and prefer to read and learn more to figure out a perfect solution.\n\nPeople spend hours reading books and listening to podcasts to understand glucose metabolism and the perfect diet to follow. That information can be useful, but most people already know they should probably eat less processed food, sugar, and deep-fried stuff.\n\nAs long as those things are regular parts of someone's diet, they have an obvious thing they could do. That's hard because it requires discipline and it doesn't look like the elusive solution that's going to fix everything.\n\nSo it's easier to learn more theoretical knowledge that feels like progress."}, {"id": 50640900, "au": "lokimedes", "dom": 32, "sr": 19, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 0, "age": 6.79, "grav": 50.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2026, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "risk_wealth", "flbl": "Risk & Wealth (Opportunities)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.405, "bl": 0.0, "ds": 0.0, "txt": "I’m a professionel flailer (apparently).\n\nIn most mature organizations this behavior acts like a proactive immune system, when done correctly, reducing risk here, highlighting opportunities there, establishing cohesion between disjoint groups."}, {"id": 50641570, "au": "techiferous", "dom": 36, "sr": 20, "sc": 3.02, "ep": 3.31, "bs": 0.0, "d": 1, "age": 5.13, "grav": 34.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 19, "k": 3319, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feedback_learning", "flbl": "Feedback & Learning (Understanding)", "urls": [], "ig": 0.899, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree with your take, and also here's the author explaining the choice of words:\n\n> Why am I calling this “flailing” when it sounds like a sensible approach? Because it feels like flailing from the inside.\n\nI think it's because for those who prefer to be cautious and develop a firm understanding before acting, doing lots of experiments that are likely to fail because you don't understand what's going on _feels_ as chaotic and arbitrary as flailing, even though it isn't."}, {"id": 50644169, "au": "narag", "dom": 30, "sr": 21, "sc": 2.91, "ep": 3.13, "bs": 0.0, "d": 0, "age": 1.25, "grav": 8.3, "surf": 9.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 5856, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "I realize now that I have a name for this: the fly vs. wasp approach. Have you seen a wasp oil trap? It's a small plate of oil with a glass water placed upside down over it. Wasps come to drink the oil then get trapped in the bottle because they always try to fly upward, towards the sun.\n\nThis doesn't work with flies. When they feel caged, they just bounce crazily against all sides of the bottle until they find the neck. Wasps' system might be more sophisticated, but that doesn't work so well for them."}, {"id": 50640806, "au": "PaulKeeble", "dom": 16, "sr": 22, "sc": 2.73, "ep": 3.1, "bs": 0.0, "d": 1, "age": 7.01, "grav": 52.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 1.17, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "Choosing APIs, tools, platforms etc. Just do the minimum to get setup and running and do something in it will give you so much information on its documentation, setup, errors and how its going to feel to use in a way you can never get trying to compare them from their documents.\n\nPerformance fixes often go this way too, trying 10 different things quickly can often be a lot better than trying to pile on ideas one after the other on the existing solution as divorcing it from the system its quicker to edit and see what is actually faster in practice."}, {"id": 50644360, "au": "joshribakoff", "dom": 11, "sr": 23, "sc": 2.67, "ep": 3.18, "bs": 0.0, "d": 3, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1707, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.94, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Just because you can’t have 100% confidence doesn’t mean the universe is random and you should just pick your degree out of a hat. Flailing about shouldn’t mean making long term commitments in an information vacuum. The whole premise of the article is that flailing gives you information."}, {"id": 50644459, "au": "stronglikedan", "dom": 2, "sr": 24, "sc": 2.54, "ep": 3.2, "bs": 0.0, "d": 1, "age": 0.89, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 7640, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "risk_wealth", "flbl": "Risk & Wealth (Opportunities)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "More like people of privilege or wealth already know which risks are less risky since risks were taken to acquire that privilege and wealth. The opportunities are equal for the poor all the way to the wealthy, but knowing which opportunities to take over others comes from experience.\n\nIn my experience, my less well off friends always seem to be hustling, but not in a direction that I would consider reasonable, even though they have equal access to all the same opportunities that I do. Some of their ideas are amusingly wild though, but unfortunately keep them down."}, {"id": 50640814, "au": "FinnLobsien", "dom": 45, "sr": 25, "sc": 2.39, "ep": 2.98, "bs": 0.0, "d": 1, "age": 7.0, "grav": 52.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 20, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.758, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The article opens with:\n\n> When you’re working in an unclear situation — you have no clear guidance, or you don’t know what will help\n\nAnd I think this is precisely where the advice works: any situation where there is no  I'm pretty sure the author wouldn't advise a nuclear power plant's safety director to \"just try a few things\"."}, {"id": 50642649, "au": "nom", "dom": 18, "sr": 26, "sc": 1.93, "ep": 2.67, "bs": 0.0, "d": 1, "age": 3.27, "grav": 19.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1809, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "all of that is solved by a well designed and complete undo system\n\nit somehow got lost when everything moved from native to CRUD web apps but then came back with group collaboration tools... maybe one day people will realize the actual value it brings for the user, and add it not just out of necessity but for better UX."}, {"id": 50642010, "au": "stopthe", "dom": 51, "sr": 27, "sc": 1.85, "ep": 2.51, "bs": 0.0, "d": 0, "age": 4.3, "grav": 27.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 52, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 1.067, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unfortunately, quite a few engineers have the privilege to flail about. If you've got a mission-critical system on your hands, flailing is seldom an option. I like Sean's writing, but that's yet another time that a zero-sum game rears its ugly head from between the lines."}, {"id": 50639562, "au": "jdw64", "dom": 48, "sr": 28, "sc": 1.66, "ep": 2.47, "bs": 0.0, "d": 0, "age": 10.26, "grav": 91.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2951, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 0.835, "fa": 0.0, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": "But I do think trying things out is the best experience in the world. Because no matter how much you read API docs, it doesn’t actually solve things—so you just attach this and that to the API, test it, get a feel for it, and assemble it… and if you’re lucky, you find a bug and report it."}, {"id": 50640990, "au": "ArisC", "dom": 46, "sr": 29, "sc": 1.55, "ep": 2.73, "bs": 0.0, "d": 2, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.893, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I read the post. There are many unclear situations that can be clarified before flailing about. Too often, flailing about is lazy, and shows lack of judgement. I don't doubt this doesn't apply to the OP, but it does apply to most people who will read this post as a justification of not thinking."}, {"id": 50642506, "au": "sd9", "dom": 9, "sr": 30, "sc": 1.4, "ep": 2.72, "bs": 0.0, "d": 2, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1705, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 0.523, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "We're talking about actions at a human level, like: \"should I study this degree to get this job\". In that case, the eventual outcome cannot be determined before you decide to study the degree. Ok, perhaps metaphysically it _is_ deterministic, but that's completely irrelevant to practical decision making. It's impossible for humans to predict with 100% confidence the outcome of every one of their actions."}, {"id": 50640201, "au": "davedx", "dom": 50, "sr": 31, "sc": 1.17, "ep": 2.27, "bs": 0.0, "d": 0, "age": 8.51, "grav": 69.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 13036, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.812, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "Hey, isn't this the entire strategy of venture capitalism (and startup GTM)?\n\nHighly relevant advice for the times we're living in, too, especially when every week something else has changed.\n\nKeep on flailin', folks"}, {"id": 50640967, "au": "tpoacher", "dom": 21, "sr": 32, "sc": 1.1, "ep": 1.68, "bs": 0.0, "d": 1, "age": 6.64, "grav": 48.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 4154, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 0.717, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you have a link? I am very skeptical that this is a general truth and not something highly specific under constraints that biased the result. Not to mention, for very specific definitions of \"perfect\" and \"outperformed\".\n\n(ps. probably a typo, but just in case it wasn't: \"versus\" not \"verses\")"}, {"id": 50640552, "au": "actionfromafar", "dom": 40, "sr": 33, "sc": 0.69, "ep": 1.35, "bs": 0.0, "d": 1, "age": 7.68, "grav": 59.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 10280, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "perfect_learn", "flbl": "Perfect & Learn (Aka)", "urls": [], "ig": 0.161, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Now it's too easy to build an \"MVP\", people try all kinds of stuff which has 0% chance of gaining traction."}, {"id": 50640810, "au": "coldtea", "dom": 24, "sr": 34, "sc": 0.06, "ep": 1.45, "bs": 0.0, "d": 1, "age": 7.0, "grav": 52.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 93969, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "flailing_advice", "flbl": "Flailing & Advice (Situations)", "urls": [], "ig": 0.206, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Though in 2026 they're more likely to not do either, but just enter the task to some LLM and hand over what it gives them"}, {"id": 50641341, "au": "joshribakoff", "dom": 7, "sr": 35, "sc": -0.27, "ep": 1.27, "bs": 0.0, "d": 1, "age": 5.69, "grav": 39.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1707, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 0.319, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "“Everyone knows” isn’t an argument, it’s what people say when they can’t prove their starting premise. Which interpretation of quantum mechanics are you basing this “reality is not deterministic” on?"}, {"id": 50643257, "au": "luplex", "dom": 8, "sr": 36, "sc": -0.4, "ep": 1.14, "bs": 0.0, "d": 2, "age": 2.32, "grav": 13.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 755, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "deterministic_realize", "flbl": "Deterministic & Realize (Outcomes)", "urls": [], "ig": 0.439, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "Your personal reality is best modelled as being non-deterministic, simply because you have epistemic uncertainty. There are things that you can't know about, but that will influence your personal reality.\n\nThe metaphysical argument is a completely separate question. It concerns whether there is true aleatoric uncertainty, or whether there remains uncertainty when you know everything."}, {"id": 50639951, "au": "charkubi", "dom": 25, "sr": 37, "sc": -1.78, "ep": 2.37, "bs": 3.05, "d": 0, "age": 9.29, "grav": 78.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 14, "qw": 0, "k": 251, "kpp": 8.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamew /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
