unt": 7}, {"category": "primary_technical_doc", "count": 1}, {"category": "code_repository", "count": 1}], "story_anchors": ["manual", "learn", "book", "neovim", "editor", "help", "show", "hard", "worth", "shell", "wrote", "useful", "chapter", "free", "pages", "perfect", "plugins", "fun"], "largest_root": {"root_id": 50661419, "author": "robenheimer", "slots": 13, "start_dom": 47, "end_dom": 59, "share_pct": 14.9, "top_dom1_age": 1.0, "top_dom1_author": "NoboruWataya"}, "buried_cutoff": 26, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50661597, "au": "thanato0s", "dom": 25, "sr": 1, "sc": 13.43, "ep": 13.43, "bs": 0.0, "d": 2, "age": 15.22, "grav": 167.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 139, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": ["https://www.vimgolf.com/", "https://themouseless.dev/snake/", "https://web.archive.org/web/20211002194931/https://themouseless.dev/vim/"], "ig": 1.41, "fa": 2.69, "gp": 1.687, "bl": 0.0, "ds": 0.0, "txt": "No need to throw my text to an LLM, just ask the LLM directly.\n\nI don't think LLMs are the best to generate consistency at the scale of a book. To me it's just a choice between reading human's writing and reading hundred of pages where there is no intention... and maybe full of bullshits. At least my bullshits are due to human error :D\n\nBut I mean I don't want this whole thread to be about LLM. It's just about Vim, a cool text editor in the shell.\n\nFor the gamified version there is the great https://www.vimgolf.com/, and there is also Vim adventures\n\nEDIT: Also there is the famous snake game where hjkl are the arrow keys: https://themouseless.dev/snake/\n\nfunny enough I wanted to develop a game at one point in Clojure to learn Vim, but I never really finished it. Maybe I should do that.\n\nOh and here's a wayback machine from 2021: https://web.archive.org/web/20211002194931/https://themousel..."}, {"id": 50666211, "au": "JdeBP", "dom": 26, "sr": 2, "sc": 10.45, "ep": 10.6, "bs": 0.0, "d": 3, "age": 3.71, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 178, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": ["https://news.ycombinator.com/item?id=48753333"], "ig": 1.569, "fa": 2.13, "gp": 0.58, "bl": 0.0, "ds": 0.0, "txt": "Everyone remembers the hjkl keys, even though almost no-one has an ADM-3 keyboard where those keys have arrows engraved on their tops, or even an ADM-3A itself (let alone an ADM-3).\n\nFew in contrast remember that vi from the start had forward space (SPC), backward space (BS), next line (⎈N SO) and previous line (⎈P DLE) for navigation in normal mode.\n\nI hope that your vim book teaches arrow keys first, arrow keys being a thing that we've had in the world of terminals since around 1970, the forwardspace/backspace/next/previous next, and the hjkl last.  I think that it really does not serve novices to teach them the way to use vim that matches a 1976 terminal that they do not have, and does not match what the modern keyboard that they do have in front of them has.\n\n* https://news.ycombinator.com/item?id=48753333\n\nDon't make the mistake that Dougherty and O'Reilly made in their 1987 book, of claiming that some terminals might not have arrow keys.  Even by 1987, terminals without arrow keys had become a rarity, thanks to the PC revolution and whatnot.  40 years later still, that's an understatement."}, {"id": 50665937, "au": "flaunf221", "dom": 58, "sr": 3, "sc": 7.04, "ep": 7.04, "bs": 0.0, "d": 6, "age": 4.25, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 70, "qw": 0, "k": 134, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": ["https://en.wikipedia.org/wiki/ADM-3A"], "ig": 1.32, "fa": 0.96, "gp": 0.829, "bl": 0.0, "ds": 0.0, "txt": "Yes, obviously I know where it comes from. After all I already mentioned keyboard with arrows on hjkl - that's https://en.wikipedia.org/wiki/ADM-3A\n\nMy point was to illustrate that talking younger people not experimenting or improving is a bit hypocritical when coming from vi/vim community which is comparatively speaking a fossil stuck on first draft from 1976 (designed for hardware that no longer exists) that haven't changed anything for the better because they are already used to something."}, {"id": 50667178, "au": "blenderob", "dom": 28, "sr": 4, "sc": 6.85, "ep": 7.14, "bs": 0.0, "d": 2, "age": 2.12, "grav": 12.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 11, "k": 1992, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.506, "fa": 0.76, "gp": 0.99, "bl": 0.0, "ds": 0.0, "txt": "> The best way of teaching it would probably be a gamified version\n\nI'd like to offer a counterpoint. I don't think there is any teaching method that works for everyone. I know gamified Vim tutorials is a thing and a few pop up on \"show hn\" sometimes. but personally, I lose interest whenever I come across a gamified tutorial. Gamified vim tutorials, gamified shell tutorials, gamified coreutils tutorials. None of them work for me. I immediately lose interest.\n\nBut give me a well written book (like the one in this 'show hn') and I'm hooked and I'm happy to spend hours and hours on it, digest it, re-read it, go back to it 5 years later, etc. etc."}, {"id": 50659031, "au": "aktenlage", "dom": 9, "sr": 5, "sc": 5.71, "ep": 5.71, "bs": 0.0, "d": 0, "age": 20.4, "grav": 269.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 411, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.507, "fa": 0.0, "gp": 1.492, "bl": 0.0, "ds": 0.0, "txt": "Nice work. Luckily I think I don't need it anymore after using vim for 20+ years.\n\nAs a motivation for new vim users, I'd like to mention that LLMs make it even more awesome to use such a malleable editor. When I think of some functionality I need, I'll just let Copilot write a small function and key binding and voila, it's done. It's pretty good at vimscript.\n\nLatest example: a key (gK) to show the full git commit message of the current line. Or, when used with a number (e.g. 4gK) the message of the nth previous commit touching that line."}, {"id": 50665060, "au": "thanato0s", "dom": 54, "sr": 6, "sc": 5.69, "ep": 5.84, "bs": 0.0, "d": 3, "age": 6.23, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": ["https://themouseless.dev/sokoban/"], "ig": 1.271, "fa": 0.62, "gp": 0.749, "bl": 0.0, "ds": 0.0, "txt": "I agree that hjkl is not the most intuitive, it took me a while to use that instead of the arrow keys. That being said, on a \"standard\" keyboard, the arrow keys are always further away from the home rows, and so it's annoying to always move your hands. So I disagree that it's not ergonomic.\n\nOf course if you can configure your keyboard as you wish it's a different question; you might move the arrow keys around the home rows if you want. But then the deeper you go into Vim the less you use hjkl anyway...\n\nAlso, here's a sokoban when you can use arrow keys or hjkl: https://themouseless.dev/sokoban/"}, {"id": 50664193, "au": "QuantumNomad_", "dom": 80, "sr": 7, "sc": 5.67, "ep": 5.67, "bs": 0.0, "d": 1, "age": 8.13, "grav": 64.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.505, "fa": 0.34, "gp": 0.805, "bl": 0.0, "ds": 0.0, "txt": "I’ve been using Vim for over 15 years, but never tried to learn everything.\n\nLearning the basics like getting used to hjkl instead of arrow keys, and knowing how to jump around like to the top or bottom or a relative number of lines, and learning how the verbs work so that you can “delete inner word” diw and “change inner word” ciw, and how to use regex on whole file and on visual selection, and making a block visual selection, and indenting a visual selection, covers a lot of what I do. Also knowing how to record and play short macros is sometimes useful, but I only reach for macros a couple of times a month at most.\n\nI might be less efficient than someone who knows Vim truly inside and out, but I’m pretty happy with what I get out of Vim with what I’ve learned.\n\nI might come back to this book though, to pick up some more knowledge on Vim. But I have some other books to read first, so I’m not going to buy it today or in the next few months."}, {"id": 50663419, "au": "thanato0s", "dom": 72, "sr": 8, "sc": 5.25, "ep": 5.25, "bs": 0.0, "d": 2, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 11, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.31, "fa": 0.42, "gp": 0.671, "bl": 0.0, "ds": 0.0, "txt": "> Of course, this should all be done on a Debian Linux box\n\nI couldn't go any further in this damned article. I personally believe the author didn't do their homework: while the rodent is an obvious affliction we must get rid of, it can also stroll around when properly trained, and can be tolerated. It's not reliable, the thing having swinging moods; it can perforate some carpal tunnel directly in the wrist, but it's also nice to pet.\n\nBut this sentence is where the author lost me. We install Arch Linux over here. To quote one of my friend: You think he's the danger? I am the danger. Or something.\n\nThat being said: scheme mentioned, so the author has at least some taste."}, {"id": 50663102, "au": "Insanity", "dom": 45, "sr": 9, "sc": 4.53, "ep": 4.53, "bs": 0.0, "d": 0, "age": 10.94, "grav": 100.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 7513, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.937, "fa": 0.68, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "Kudos on finishing the book, that’s a huge achievement!\n\nI’ve been daily driving vim for about 15 years now so don’t think it’s something for me, but it’s good to see new content being created for the next generation software engineers (although they might only see prompt interfaces 99% of the time)."}, {"id": 50664602, "au": "thanato0s", "dom": 81, "sr": 10, "sc": 4.03, "ep": 4.17, "bs": 0.0, "d": 2, "age": 7.23, "grav": 54.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.246, "fa": 0.34, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "That makes sense, I mean Vim's help is really helpful to learn step by step just by doing. Everything you're listing here is already a lot, but for somebody who uses Vim for 15 years that's normal to learn all of that by simply doing. It's a bit learning without the will to learn, isn't it?\n\nWhere my book can be useful is due to the cheer amount of real life examples in there, not something Vim's help (or even the official Vim manual) is very good at. I hope it's inspirational and give ideas how to configure things even further."}, {"id": 50665919, "au": "skydhash", "dom": 66, "sr": 11, "sc": 4.0, "ep": 4.0, "bs": 0.0, "d": 5, "age": 4.28, "grav": 27.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 1.36, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t know how the highlight engine is coded, but I do know that it’s regex based. You moslty have to try every regex on every line. And for some lines you have to try it more than once (think tags).\n\nWhen it doesn’t match, it’s ok. When it does match you jave to create new structures, adjust their priorities. And for the renderer, every scrolling means reissuing the ansi excape code according to some theme.\n\nAll of this are probably bound to the number n of characters in a line. And for big n, that means a lot of operations. Emacs also struggle with long lines."}, {"id": 50667950, "au": "NoboruWataya", "dom": 1, "sr": 12, "sc": 3.8, "ep": 3.8, "bs": 0.0, "d": 0, "age": 0.99, "grav": 7.2, "surf": 37.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 4552, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.477, "fa": 0.0, "gp": 0.224, "bl": 0.0, "ds": 0.0, "txt": "It's great to see a non-LLM manual like this, well done :)\n\nPersonally I use Helix whenever I need a decent terminal-based editor (though most of my coding is done in a JetBrains IDE). I found neovim's plugin ecosystem great in theory but fragile in practice - it seems whenever I install a load of plugins to get it working the way I want it and then come back a while later, half of them have broken. Helix is more limited in its capabilities but feels more stable.\n\nHowever if there is a stable set of plugins out there (and I see you recommend some in the book) maybe it's worth taking another look."}, {"id": 50663326, "au": "thanato0s", "dom": 39, "sr": 13, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 1, "age": 10.28, "grav": 91.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.461, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "It's almost 5 actually! I realized that when looking at the reddit post to ask folks what they thought about the idea... it was another time it feels like.\n\nI mostly cut Neovim specific stuff. I wanted to speak about LSP and treesitter, but I realized that with Vim native features it was just too much. The book is already quite large when the solutions of the exercises are included, and it would have taken even longer to finish it.\n\nAlso these features and Neovim in general are a bit moving targets, so it's difficult to write about it without being inacurate two weeks later.\n\nMy biggest regret is to totally skip the Vim's embedded terminal, but I might add that down the line."}, {"id": 50665771, "au": "skydhash", "dom": 56, "sr": 14, "sc": 3.61, "ep": 3.91, "bs": 0.0, "d": 5, "age": 4.57, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You do realize that the vim keybinding is inherited from vi? And that vi is decades all and had its keybinding replicated across a lot of software. Also some of the keybindings comes from ed and ex commands. So most of your suggestions conflict with those\n\nAlso jk is quite nice where they at. I read code more than I write it, and if its formatted for 80 columns, I rarely need to go left or right. So using my strongest fingers is quite nice.\n\nThen you embrace search based navigation and wider movements and you find that you rarely used hjkl other than small movements around a small area."}, {"id": 50665132, "au": "thanato0s", "dom": 43, "sr": 15, "sc": 3.45, "ep": 3.67, "bs": 0.0, "d": 3, "age": 6.07, "grav": 42.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.119, "fa": 0.28, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "That's true, but then the formatting was made for PDF/HTML/ePub so it wouldn't be as good as plain Vim's help for example (or even Vim's manual, `:help manual`). It would miss all the tags for example to link from one location to the other.\n\nI could publish the source that's true, but it's also a bit my little baby i nourished for the past years, so I'd like it to stay my own. I like working in teams, but I also like to do my little cooking on side.\n\nIt's also a way for people to support the work I do on my blog. Granted I didn't update it for a while, but now I'll have more time to get back to it."}, {"id": 50660586, "au": "thanato0s", "dom": 21, "sr": 16, "sc": 3.29, "ep": 3.73, "bs": 0.0, "d": 1, "age": 17.77, "grav": 215.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.406, "fa": 0.0, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "That's true, that's sad. Since I'm now ancient, I remember an era where there were many forums and weird website full of GIFs. It wasn't perfect for sure, but at least we were owning the Internet, without asking ourselves what's true or false all the time. It's a boolean for god's sake\n\nI guess I'll write about all of that soon, but I think it's important nowadays to own our stuff, without necessarily leaking everything to the data brokers. I like local plain text for that; I just don't depend on anything. It's easy to share too, and format like Markdown can be rendered easily.\n\nAlso I like spending my time in the terminal, don't ask me why."}, {"id": 50665316, "au": "flaunf221", "dom": 55, "sr": 17, "sc": 3.16, "ep": 3.82, "bs": 0.0, "d": 4, "age": 5.6, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 134, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 1.624, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The choice is not binary between hjkl and arrow keys.\n\nIt could be (non-exhaustive list):\n\njkl; - actual resting home row position\n\nijkl - no hand movement, no pinky usage (also mirrors arrows and controls that are structured that way outside of your keyboard)\n\nasdf - right hand resting home row position\n\nesdf - right hand, no hand movement, no pinky (gamers used to wasd would love it)\n\nHaving navigation single key shift away from resting position has no upsides that I can see. It takes premium home row space, except it fits only 3/4. So you either shift your hand all the time, or your index finger is now busy with both right and down and is moving laterally.\n\nAnd if it's not actually important, why is it on home row and not say bottom row: m,./ - you'd just curl your fingers and access movement without shifting of your hand.\n\nSo the explanation today is nothing other than \"Our ancestors did it this way and so shall you, youngster. Scientific basis is overrated and we are not trying new things.\"."}, {"id": 50659060, "au": "pullshark91", "dom": 60, "sr": 18, "sc": 3.1, "ep": 3.25, "bs": 0.0, "d": 0, "age": 20.34, "grav": 268.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 18, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.1, "fa": 0.0, "gp": 0.459, "bl": 0.0, "ds": 0.0, "txt": "I use only Vim to edit my files everywhere. Today I tried to open a keystore file with vim inside Xarchiver. My XFCE froze and didn't recover from it without reboot. I tried it again and got the same results. Vim is fun."}, {"id": 50666058, "au": "skydhash", "dom": 82, "sr": 19, "sc": 2.89, "ep": 3.19, "bs": 0.0, "d": 1, "age": 4.02, "grav": 25.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.356, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s a powerful editor. The basics can probably be explained inside a single cheatsheet (and that’s what vimtutor does). But that’s just basic editing on the level of any editor.\n\nThe rest is learning of the powerful features that exists in vim like registers, macros, the quickfix list, options like makeprg and the concept of compilers, using windows and the sessions,… And there’s the scripting capabilities. Those are what people stay in those editors. Once you craft your perfect tooling, everything else is lacking in some way."}, {"id": 50663937, "au": "giladd", "dom": 2, "sr": 20, "sc": 2.78, "ep": 3.0, "bs": 0.0, "d": 0, "age": 8.75, "grav": 71.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 13, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.779, "fa": 0.0, "gp": 0.804, "bl": 0.0, "ds": 0.0, "txt": "This is very cool and approachable, thank you. For anyone who suspects use of LLMs - just read some of the book. The language captured my attention in a manner no model is capable of."}, {"id": 50664869, "au": "flaunf221", "dom": 53, "sr": 21, "sc": 2.75, "ep": 3.64, "bs": 0.0, "d": 2, "age": 6.63, "grav": 48.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 134, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 1.207, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't exactly hate vim, but I am vocal about it, because it's kicking the can down the road.\n\nFor example most developers today haven't even been born when keyboard with arrows drawn on hjkl was discontinued. HJKL is neither intuitive nor ergonomical. Why does it persist as default? Because existing vim people are there for tradition and not good engineering and so are afraid of experimenting and trying new things?"}, {"id": 50662082, "au": "negura", "dom": 10, "sr": 22, "sc": 2.67, "ep": 2.82, "bs": 0.0, "d": 1, "age": 13.83, "grav": 144.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1010, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "Weird. I tried using LLMs for help with vimscript (not even for code generation, just pointed questions) and the results were very broken/hallucinated. My guess is that vimscript is too obscure for LLMs to be useful."}, {"id": 50662523, "au": "codesnik", "dom": 11, "sr": 23, "sc": 2.48, "ep": 3.22, "bs": 0.0, "d": 2, "age": 12.61, "grav": 124.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1030, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.37, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've recently switched to neovim, and claude is oneshotting plugin tweaks in nvim lua, writes complex keybindings and accurately answers pretty obscure questions, sometimes looking into nvim source code. I doubt it'd have hard time with good old vimscript, though I haven't tried much. It certainly can read and reason about vimscript plugins."}, {"id": 50660378, "au": "leowoo91", "dom": 20, "sr": 24, "sc": 2.34, "ep": 3.0, "bs": 0.0, "d": 0, "age": 18.15, "grav": 222.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 404, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.985, "bl": 0.0, "ds": 0.0, "txt": "We are in such era it is hard to believe if author/site/book and comments in this post is legit at all. Maybe it ruined me at least."}, {"id": 50667127, "au": "LelouBil", "dom": 5, "sr": 25, "sc": 2.31, "ep": 2.9, "bs": 0.0, "d": 2, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 2247, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.232, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Same for me, I just read the first couple of pages and the intent to be readable and to communicate information effectively is clearly there. I love the writing as well.\n\nLLM texts are often impenetrable text walls that were usually written not to be read but just to exist. And if the prompter doesn't care and doesn't even read it, it's even worse.\n\nThat's why I despise LLM-generated documentation, it's horrible to read."}, {"id": 50665710, "au": "tmarice", "dom": 30, "sr": 26, "sc": 1.93, "ep": 2.59, "bs": 0.0, "d": 0, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 135, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 0.657, "fa": 0.34, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "I'm glad you kept doing what you love. I remember purchasing your previous book 4 years ago, it was great!"}, {"id": 50662980, "au": "nickandbro", "dom": 86, "sr": 27, "sc": 1.92, "ep": 1.92, "bs": 0.0, "d": 2, "age": 11.26, "grav": 104.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 485, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I guess you could say the same thing with preferring the original vimtutor than your ebook. Having it on the browser just happens to be the easier way to teach it to first time windows users without having them download it."}, {"id": 50663757, "au": "enriquto", "dom": 42, "sr": 28, "sc": 1.92, "ep": 2.72, "bs": 0.0, "d": 2, "age": 9.22, "grav": 77.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 10, "k": 14002, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.65, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I have no idea what a CLI tool like pdftotext would do\n\nbut why?  surely you didn't write the book directly as a pdf file.  Why don't you publish the text source that is already viewable in vim?"}, {"id": 50661104, "au": "alpaca128", "dom": 62, "sr": 29, "sc": 1.91, "ep": 2.65, "bs": 0.0, "d": 2, "age": 16.6, "grav": 192.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 8747, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Long lines are Vim's biggest weakness, I have no idea why. Even relatively short lines of a couple thousand characters cause noticeable input lag."}, {"id": 50663252, "au": "thanato0s", "dom": 87, "sr": 30, "sc": 1.74, "ep": 2.73, "bs": 0.85, "d": 3, "age": 10.49, "grav": 94.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 1.163, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "It's just a question of feeling to me. Love even :D Vim is nice to use in my system because it can interface easily with the shell, and it's super responsive. Also it's super easy to install so I'm not sure why I need it to use a replica in the browser...\n\nI think a better analogy would be: why my ebook is PDF and ePub only when it could have been readable and writable in Vim. There are answers to that, but it's true that at the end I display Vim doc outside of the tool I'm speaking about."}, {"id": 50665638, "au": "latexr", "dom": 15, "sr": 31, "sc": 1.67, "ep": 2.99, "bs": 0.0, "d": 1, "age": 4.84, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I understand this is a losing battle, but I wish we could go one thread on HN without making it about LLMs.\n\nThe author is sharing something they made, which is new teaching material made by a human (sorely lacking these days), and the top comment is about how someone uses LLMs to do something tangential without learning.\n\nI don’t think there’s a single person on HN who doesn’t know they can use LLMs, no need to keep repeating that at every opportunity."}, {"id": 50662429, "au": "bitfilped", "dom": 51, "sr": 32, "sc": 1.44, "ep": 2.76, "bs": 0.0, "d": 1, "age": 12.86, "grav": 128.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 213, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 0.953, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "In my experience most younger people in the field are here for the payday and not for love of computers. They're significantly less experimental or willing to try new things (paradoxically even when they would drastically improve their output efficiency by doing so.)"}, {"id": 50667824, "au": "yakshaving_jgt", "dom": 57, "sr": 33, "sc": 1.25, "ep": 2.79, "bs": 0.0, "d": 6, "age": 1.19, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 4, "k": 6036, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> vi is decades all\n\nCompletely unrelated, but I find this typo interesting.\n\nMy suspicion is that you meant to write \"old\", but phonetically \"all\" is quite similar, and your fingers just produced the sound in your head. I'm guessing you've been touch-typing for a long time.\n\nIt's amazing that the human brain works that way."}, {"id": 50661447, "au": "_def", "dom": 32, "sr": 34, "sc": 1.09, "ep": 1.75, "bs": 0.0, "d": 0, "age": 15.66, "grav": 175.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 1393, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 0.541, "fa": 0.0, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "hm i would love some vim guidance but to me this seems quite pricey - maybe its worth it"}, {"id": 50667651, "au": "Sesse__", "dom": 3, "sr": 35, "sc": 1.08, "ep": 2.03, "bs": 0.0, "d": 1, "age": 1.42, "grav": 9.1, "surf": 6.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2659, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a very approachable and friendly writing style, indeed. I scrolled through the sample and didn't find anything I didn't already know, but I suspect this will be a very strong book for beginners who want to learn Vim."}, {"id": 50663968, "au": "neuroelectron", "dom": 79, "sr": 36, "sc": 1.0, "ep": 2.54, "bs": 0.0, "d": 0, "age": 8.65, "grav": 70.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 519, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It took me five years to realize Vim was not for me. Maybe this would've made a difference, but it's 21 chapters long. Perhaps something is wrong wrong with the architecture of Vim itself when it takes 21 chapters to explain how to use a text editor."}, {"id": 50666826, "au": "zahlman", "dom": 67, "sr": 37, "sc": 0.87, "ep": 2.19, "bs": 0.0, "d": 3, "age": 2.65, "grav": 15.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 0.932, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For what it's worth, Vim is nowhere near as bad with long lines as typical GUI text editors in my experience (currently I have access to Xed and... yeah.)"}, {"id": 50663721, "au": "sph", "dom": 34, "sr": 38, "sc": 0.67, "ep": 1.77, "bs": 0.0, "d": 0, "age": 9.29, "grav": 78.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 33735, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I do not use Vim anymore, but I still appreciate feats of human effort. Well done! I’ll point any newbies that come my way to your book."}, {"id": 50667804, "au": "thanato0s", "dom": 27, "sr": 39, "sc": 0.56, "ep": 2.1, "bs": 0.0, "d": 4, "age": 1.21, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I recommend in the book to directly use hjkl and disable the arrow keys... It's how I learned Vim and I'm happy with that. I did everything at the same time: how to type correctly, how to install and drive Arch Linux (btw), how to use a shell-centered workflow. It was really cool to dive deep in all of that, and it was less exhausting than I thought, especially because all these tools can be linked somehow.\n\nI don't know, I just find that staying on the home rows is super comfy. Of course you could map your keyboard differently and put the arrow key closer to the home rows or something, but so many TUI and CLI tools use hjkl I still think it's useful to learn them. And I don't think it's that hard."}, {"id": 50665999, "au": "aktenlage", "dom": 16, "sr": 40, "sc": 0.45, "ep": 1.11, "bs": 0.0, "d": 2, "age": 4.13, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 411, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 0.474, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I understand your sentiment. It can get pretty tiring.\n\nNevertheless the use of AI is still unfolding and I haven't yet figured out all the applications it has. So every now and then I stumble upon comments like my original one, and discover a new way to use AI.\n\nIndeed I wouldn't wish for it to be the top comment."}, {"id": 50661548, "au": "HAL9500TURBO", "dom": 24, "sr": 41, "sc": 0.43, "ep": 4.49, "bs": 2.52, "d": 1, "age": 15.38, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 4, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.35, "fa": 0.28, "gp": 0.36, "bl": 0.95, "ds": 0.0, "txt": "Yeah, I had the same feeling, not sure about what to say, I wouldn't like being wrong about it and say anything negative about the author in case he is really just trying to help, but there's no time-efficient way to check for these things at this point in time.\n\nSince the efforts of putting vim everywhere are always welcome, I will give some random opinions about it here:\n\n1. The best way of teaching it would probably be a gamified version, not sure if anyone did this yet. People have really low attention spans nowadays. Unless I'm reading a novel or something like that, I will throw text into an LLM to get a summary anyway, even if I feel a bit bad about it (it's just more efficient).\n\n2. Personally I've always referenced people to Luke Smith's (otherwise known as \"Vim Diesel\") video on vim for beginners to learn most of the useful commands."}, {"id": 50663378, "au": "thanato0s", "dom": 76, "sr": 42, "sc": 0.38, "ep": 4.14, "bs": 2.52, "d": 2, "age": 10.16, "grav": 89.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.306, "fa": 0.28, "gp": 0.192, "bl": 0.95, "ds": 0.0, "txt": "That looks cool. I wrote a while back how to have a \"mouseless\" development environment; I use the keyboard at most thing text and window, but not when it's about graphic design for example (gimp, editing photos with darktable...). Basically I drive daily a combination of linux/i3/tmux/shell/vim. Same system for my work and my personal computer, with mostly the same config."}, {"id": 50666395, "au": "skydhash", "dom": 59, "sr": 43, "sc": 0.22, "ep": 2.61, "bs": 0.85, "d": 7, "age": 3.39, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "manual_neovim", "flbl": "Manual & Neovim (Vimscript)", "urls": [], "ig": 1.111, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "You don’t reinvent your fundamentals when they work well enough. But that doesn’t stop someone from experimenting, to find their boundaries and coming up with something new. Vim has been refined from its first iteration to something that’s very powerful. And there’s a lot of plugins that expanded its power, all created via experimentation.\n\nYou don’t have to break what’s working to create something better. Disruption is not the only way to innovation."}, {"id": 50662746, "au": "vinyl7", "dom": 75, "sr": 44, "sc": 0.13, "ep": 0.42, "bs": 0.0, "d": 1, "age": 12.04, "grav": 116.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 11, "qw": 0, "k": 1291, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/y3owk1n/neru"], "ig": 0.179, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree. I found this a while ago but haven't tried it out yet https://github.com/y3owk1n/neru"}, {"id": 50667689, "au": "thanato0s", "dom": 18, "sr": 45, "sc": 0.04, "ep": 3.43, "bs": 2.52, "d": 1, "age": 1.37, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.36, "fa": 0.0, "gp": 0.165, "bl": 0.95, "ds": 0.0, "txt": "I find pomodoros useful yes. I have tendency to lose track of time when I'm focused, so it remind me if I push myself a bit too hard. My life is a succession of extreme motivation, exhaustion, life doubts, and acceptance. Rinse and repeat.\n\nIt really depends what you prefer, what tools work for me doesn't necessarily work for everybody."}, {"id": 50666380, "au": "thanato0s", "dom": 65, "sr": 46, "sc": 0.01, "ep": 2.59, "bs": 1.7, "d": 5, "age": 3.42, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "Regexes are line-based most of the time. And so the more characters you have on the line, the more work the engine has to do to parse it. I guess with greedy quantifiers you need to go to the end of the line and then match from there, and I don't think that's free. Multiply that by the crazy amount of regexes Vim native highlighting uses and the engine begins to struggle.\n\nThat being said, I didn't look at the code of the engine itself, so I don't know for sure. But I know that disabling the highlighting get rid of these kind of issues most of the time."}, {"id": 50661531, "au": "thanato0s", "dom": 49, "sr": 47, "sc": -0.17, "ep": 3.89, "bs": 2.52, "d": 1, "age": 15.44, "grav": 171.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 0.945, "fa": 0.0, "gp": 1.15, "bl": 0.95, "ds": 0.0, "txt": "I don't think it's hate, it's just that Vim is different enough from most text editors for people to get confused quickly, especially if they're coming from the GUI world. And then you get memes.\n\nI mean it's not perfect by any mean but it has so many good ideas. It has some heart I'd say.\n\nand yeah Vim is not an OS ;)"}, {"id": 50665329, "au": "sph", "dom": 36, "sr": 48, "sc": -0.24, "ep": 1.01, "bs": 0.0, "d": 2, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 33735, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "hjkl_keyboard", "flbl": "Hjkl & Keyboard (Home)", "urls": [], "ig": 0.428, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fell in love with Emacs. Sometimes I think of moving back, but the truth is, while you can deeply love two editors at the same time, you need to choose one."}, {"id": 50665497, "au": "alpaca128", "dom": 64, "sr": 49, "sc": -0.31, "ep": 1.64, "bs": 0.85, "d": 4, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 8747, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 0.474, "fa": 0.0, "gp": 0.36, "bl": 0.32, "ds": 0.0, "txt": "I struggle to imagine how that could slow it down. In the end it shouldn't matter whether you have dozens of lines or one long wrapped line, it's still roughly the same number of tokens to parse/highlight. Though admittedly I haven't yet tried with syntax highlighting turned off to see if that's the issue."}, {"id": 50661124, "au": "thanato0s", "dom": 63, "sr": 50, "sc": -0.62, "ep": 3.22, "bs": 2.52, "d": 3, "age": 16.53, "grav": 191.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "highlighting_llms", "flbl": "Highlighting & LLMS (Config)", "urls": [], "ig": 0.902, "fa": 0.0, "gp": 0.761, "bl": 0.95, "ds": 0.0, "txt": "It could be the syntax highlighting if you have that on; Vim loves to throw regexes to long lines to highlight them. Thankfully it stops at one point. I don't think treesitter using Neovim has this problem, I should test that."}, {"id": 50659197, "au": "smashandgrab", "dom": 70, "sr": 51, "sc": -0.67, "ep": 3.39, "bs": 2.52, "d": 0, "age": 20.13, "grav": 263.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 12, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.162, "fa": 0.0, "gp": 0.454, "bl": 0.95, "ds": 0.0, "txt": "I have this beautiful dream where I never touch my mouse again.\n\nUnfortunately the tools used by incident responders are mostly built in GUIs and tabbing through everything is less productive than just reaching for the mouse.\n\nI don’t hate you, mouse. I just have a dream."}, {"id": 50659766, "au": "thanato0s", "dom": 69, "sr": 52, "sc": -0.82, "ep": 2.8, "bs": 2.52, "d": 1, "age": 19.31, "grav": 246.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Thanks! Vim is quite fascinating, and I don't think using the shell or Vim is that difficult, and it's so flexible! If I've a specific need, say uppercase my titles in some ways, i can just add that and now I've access to a new feature. I don't know, it's just great.\n\nI wrote a lot of stuff in my blog before that, and another book. It's just what I like to spend my morning before work; playing with Markdown, latex, Lua, the shell, and write stuff."}, {"id": 50663222, "au": "thanato0s", "dom": 41, "sr": 53, "sc": -1.02, "ep": 2.89, "bs": 2.52, "d": 1, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.558, "bl": 0.95, "ds": 0.0, "txt": "No, it's pdf and epub only, no plain text. Although I have no idea what a CLI tool like pdftotext would do... I also had the idea at one point to do one vimtutor-style file per chapter. I might do that in the future. In the todo list"}, {"id": 50661419, "au": "robenheimer", "dom": 47, "sr": 54, "sc": -1.08, "ep": 2.98, "bs": 2.52, "d": 0, "age": 15.73, "grav": 176.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.692, "bl": 0.95, "ds": 0.0, "txt": "i don't understand the hate i've seen about vim in recent years. it's pretty quick to pick up the basics, and everything else you learn when you need to learn it. at least it's not emacs xD"}, {"id": 50661490, "au": "thanato0s", "dom": 33, "sr": 55, "sc": -1.19, "ep": 2.57, "bs": 2.52, "d": 1, "age": 15.58, "grav": 174.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "You can still read the free sample, it's linked in the first message. It's the first three chapters, and the table of contents of the whole book. The internal links don't work well because I can't link to the part of the book missing. It's still 74 pages plus the preface."}, {"id": 50663651, "au": "thanato0s", "dom": 52, "sr": 56, "sc": -1.19, "ep": 2.82, "bs": 2.52, "d": 2, "age": 9.46, "grav": 80.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "learn_book", "flbl": "Learn & Book (Everything)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.164, "bl": 0.95, "ds": 0.0, "txt": "I don't know. My blog is mostly about experimenting and learning, and I received many emails from young lads who had some questions and were genuinely interested about how things work under the hood. I wouldn't generalize, although it gets easier and easier not to care about how things work for sure. Still, understanding what we are doing is better to have some feeling of accomplishment I suppose? I mean I don't like to automate away what I like to do :D"}, {"id": 50667643, "au": "thanato0s", "dom": 7, "sr": 57, "sc": -1.19, "ep": 2.79, "bs": 2.52, "d": 3, "age": 1.43, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "text_llm", "flbl": "Text & LLM (Shell)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Is it? I often see LLMs generating multiple ideas in one sentence explaining all little details for each. So it's verbose in the sense that there are too many details, and dense because it's a salad of ideas difficult to follow for a human brain. At least mine, which is quite average I believe...\n\nMaybe I use these words wrongly though, wouldn't be the first time :D"}, {"id": 50659293, "au": "thanato0s", "dom": 14, "sr": 58, "sc": -1.19, "ep": 2.5, "bs": 2.52, "d": 1, "age": 19.99, "grav": 260.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 668, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "highlighting_llms", "flbl": "H /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
