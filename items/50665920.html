usage data to train their models.\n\nThere isn't even a solid argument for how such an approach makes sense over curated, annotated datasets they can legally create without the massive legal and reputational risk."}, {"id": 50668068, "au": "abalex", "dom": 86, "sr": 3, "sc": 5.9, "ep": 5.9, "bs": 0.0, "d": 2, "age": 4.13, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.331, "fa": 0.68, "gp": 0.578, "bl": 0.0, "ds": 0.0, "txt": "How much tokens gives 500 usd codex subscription? Sometimes i can create super unlogic task, especially if i ask to use subagents and ultracode it can spend half of my subscriptions in 5-6 hours and make even worse for my project"}, {"id": 50670306, "au": "ianm218", "dom": 42, "sr": 4, "sc": 5.83, "ep": 5.98, "bs": 0.0, "d": 4, "age": 0.9, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.552, "fa": 0.5, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "I personally find the \"AI companies are going to steal your ideas and compete with you directly\"... not that convincing in most cases.\n\nMost things people work on the \"half life of alpha\" is quite short and hard to exploit. I.e. they are working on a paper they plan to publish in the next few months. If that paper relies on a proprietary dataset from the real world for example, is is unlikely someone at a lab is going to spin up i.e. a soil collection team and start running samples to scoop you.\n\nIf you are a hedge fund or math researcher it might be a little more legit."}, {"id": 50668575, "au": "user43928", "dom": 67, "sr": 5, "sc": 5.65, "ep": 5.94, "bs": 0.0, "d": 4, "age": 3.35, "grav": 20.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.745, "fa": 0.28, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "Yes, if you don't opt out, they train on user data in the sense of preference signals that, according to what people working at the labs told us here on HN, have a minor impact in the training pipeline.\n\nIt's far from the accusation that labs breach contracts to access user data, or even manually read chats of specific researchers.\n\nConflating the training on large datasets of public works that apparently exceeded fair use when sourced from torrents, with what is being accused here, seems fairly disingenuous. And frankly I've heard that poor argument a hundred times by now."}, {"id": 50668146, "au": "postalcoder", "dom": 17, "sr": 6, "sc": 5.35, "ep": 5.5, "bs": 0.0, "d": 4, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 5016, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.399, "fa": 0.34, "gp": 0.855, "bl": 0.0, "ds": 0.0, "txt": "Both sam and dario have talked openly about moving past tokens as a meter for cost. Instead, they want a percent of the outcome that those tokens earned you (hence, the royalty model). In their world, if their models helped make tirzepatide, they'd want x% of $55B in revenue that it made in the past year.\n\nTheirs is a vision of boundless profitability."}, {"id": 50668644, "au": "throw10920", "dom": 101, "sr": 7, "sc": 5.25, "ep": 5.25, "bs": 0.0, "d": 3, "age": 3.25, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 4219, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.518, "fa": 0.28, "gp": 0.607, "bl": 0.0, "ds": 0.0, "txt": "This is whataboutism, a staple of foreign propaganda and influence, and a logical fallacy.\n\nIn addition to that, it's not even a good whataboutism (lol) because it intentionally ignores the fact that Cursor gives you the ability to opt out of training (as well as many other relevant factors).\n\nThis whole comment is really sketchy. Why call out Cursor specifically? It literally hasn't been mentioned before in this thread, and it's one of the least popular of the Western frontier-adjacent labs, and OpenAI and Anthropic (the actual frontier labs) are both far more popular and train on user data when the toggles aren't set appropriately. This is not a comment a normal person would make."}, {"id": 50668935, "au": "maxdo", "dom": 135, "sr": 8, "sc": 5.18, "ep": 6.88, "bs": 1.7, "d": 4, "age": 2.8, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 308, "qw": 0, "k": 559, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 2.034, "fa": 0.28, "gp": 0.897, "bl": 0.64, "ds": 0.0, "txt": "nimbyism as it is.\n\nYes, btw, these smuggled nvidia chips already killing people on the borders of EU, middle east,  every single day on the scale that is approaching WWII scale very quickly if not already there by latest estimates.\n\nI hope you do understand, that we already in partial singularity. Math for example , clearly in the dawn of Epistemic Singularity. It will expand into the rest of the science really quick. I do care as a person who lives on planet earth, that religious dictators in Iran, North Korea, Russia will not destroy this world until their regimes become obsolete. Them having access to cutting edge ai can easily sponsor weapons development of all kind.\n\nIf any of these bloody regimes will get access to frontier ai capable of access to such weapons, that will be via China, as this country clearly bake all of them.\n\nChina sponsored nuclear weapon to one crazy dictator ( North Korea), and on the edge of supporting that to another crazy dictatorship that is doing mass killing of own citizen to get that nuclear weapon. And also supports biggest land conflict since world war II ( russo-ukraine).\n\nRegardless if your liberal or conservative ,  you live in EU, America(south, north), or even you live in china, or Iran. Supporting such advancements in the society that is not even thinking of ethical problems of AI access, at any level is crazy. Yes, western world is si"}, {"id": 50669668, "au": "dyauspitr", "dom": 10, "sr": 9, "sc": 4.83, "ep": 5.34, "bs": 0.0, "d": 4, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.333, "fa": 0.56, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "I think Claude, ChatGPT and Gemini are pulling away. Since Claude and OpenAI clamped down on distilling there has been a 90-99% drop (Anthropic estimate) in the harvested data that you can use for distilling for these Chinese models. DeepSeek, Kimi (especially Moonshot Kimi 4), Qwen, etc. were basically piggy backing off of the American companies for a while, but they just don’t have the funding and maybe even the know how to keep it going when that stream has been cut off."}, {"id": 50667640, "au": "ffsm8", "dom": 46, "sr": 10, "sc": 4.8, "ep": 5.24, "bs": 0.0, "d": 4, "age": 4.78, "grav": 31.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 156, "qw": 0, "k": 3722, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.546, "fa": 0.28, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "That's the wrong perspective I think...\n\nYou're worse off if you don't use it, because someone else will. It's similar to the climate change disaster. It's pointless for any nation to regulate themselves, because another nation will take advantage and ignore the issue, so the regulation will ultimately only serve to sabotage yourself with no meaningful upside.\n\nThat's not too say some of those climate change inspired initiatives aren't still valuable for other reasons (eg switching to mainly solar and EVs, because those are cheaper in the long run and come with additional desirable side effects like receiving local pollution) -- and that too is analog to the ai usage, because there is a real cost in knowledge and personal growth to using AI. The only time when it's inapplicable is when you've already done the same thing before and it's not a novel thing ... But we're specifically taking about research, so that scenario shouldn't apply here."}, {"id": 50670215, "au": "sinuhe69", "dom": 91, "sr": 11, "sc": 4.49, "ep": 4.49, "bs": 0.0, "d": 0, "age": 1.03, "grav": 7.3, "surf": 6.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1764, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.69, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "7B token are not much, aren’t they? Just for my hobby projects, I spend easily 1B token and more a month. Run a simple Lean proof can cost hundreds millions token already. With papers search and digestion, deep data analysis, multiple experiments, that 7B budget could hit the limit very soon. And with the very real possibility that the research and data could be copied, processed and fed a competitor, I don’t know if anyone with a real prospect would agree to this scheme."}, {"id": 50667852, "au": "cmrdporcupine", "dom": 11, "sr": 12, "sc": 4.33, "ep": 4.77, "bs": 0.0, "d": 1, "age": 4.5, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 23667, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.528, "fa": 0.0, "gp": 0.814, "bl": 0.0, "ds": 0.0, "txt": "We went through a period like this last year where DeepSeek (v3 series) and Kimi v2 fell a few months behind the frontier models and then there was a leap forward to near-parity in the spring. Could happen again.\n\nIn the meantime, the \"plateau\" where the Chinese models have landed is still insanely useful to me. DeepSeek v4.1 is a competent workhorse -- and I get it at insanely fast speeds through work -- if I use e.g. Astra to review its work I get good results."}, {"id": 50666646, "au": "0xc0c0c0", "dom": 38, "sr": 13, "sc": 4.33, "ep": 4.77, "bs": 0.0, "d": 0, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 30, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": ["https://www.anthropic.com/news/ai-for-science-program", "https://openai.com/form/researcher-access-program"], "ig": 0.95, "fa": 0.62, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "It didn't dawn at me at the time but it would make a lot of sense why anthropic and openai's models are a lot more developed in these areas if we assume that the researcher's inputs are trained on.\n\nThat knowledge is worth more than the free tokens they are giving out.\n\nhttps://www.anthropic.com/news/ai-for-science-program\n\nhttps://openai.com/form/researcher-access-program"}, {"id": 50668275, "au": "jrflo", "dom": 16, "sr": 14, "sc": 4.07, "ep": 4.73, "bs": 0.0, "d": 4, "age": 3.83, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.653, "fa": 0.0, "gp": 0.584, "bl": 0.0, "ds": 0.0, "txt": "There are absolutely fields that would use more demanding models than developers. CAD modeling has only gotten good in the last few months, that's a combination of coding plus visual and physical reasoning which is much more intensive than plain code. PCB design is a similar story. The traditional engineering disciplines have very little diffusion of AI so far, and that is a bigger market than developers.\n\nThere's also no reason to expect that coding is \"saturated\" when models get to human level (which I'd argue they're at now). I expect that superhuman coders will move the bar of what's expected, and there will always be a demand for more capable models."}, {"id": 50668583, "au": "OliverGilan", "dom": 24, "sr": 15, "sc": 3.98, "ep": 4.86, "bs": 0.0, "d": 2, "age": 3.34, "grav": 20.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 624, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.689, "fa": 0.0, "gp": 0.617, "bl": 0.0, "ds": 0.0, "txt": "No. All the major frontier labs buy data strictly from American companies. When people talk about “data” that can mean a few different things but it almost always starts with real raw data in the form of codebases or company documents like excel, email, slack, etc. and then gets “refined” into more useful training artifacts like RL environments. This is mostly much a closed loop within the US right now and Chinese labs buy only the higher level artifacts (RL tasks) that can help them catch up to US labs"}, {"id": 50667028, "au": "bemtevi", "dom": 95, "sr": 16, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 0, "age": 5.7, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 15, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.066, "fa": 0.42, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "> Science has always been driven by human curiosity, rigorous inquiry, and a passion for the unknown\n\nGetting into science is like that, but when it comes to the actual process these days, I'd say science is driven by greed, publish or perish, and a religious belief in science that makes the people doing it push for progress no matter what the downsides of it are."}, {"id": 50668997, "au": "twelfthnight", "dom": 60, "sr": 17, "sc": 3.68, "ep": 4.12, "bs": 0.0, "d": 2, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 855, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.571, "fa": 0.0, "gp": 0.297, "bl": 0.0, "ds": 0.0, "txt": "My partner is considering as they work on calibrating instruments. It’s a mix of code, electrical mechanics and geometry, so easy to miss things and very helpful to get review and AI input. Also, the data input is calibration data (think sine sweeps and impulses), so there isn’t risk of giving away scientific knowledge, and there is lots of data for validation.\n\nIf you improve calibration you improve sensitivity and scientific discovery so it’s kind of a perfect use for AI in my mind."}, {"id": 50667963, "au": "realusername", "dom": 29, "sr": 18, "sc": 3.47, "ep": 4.35, "bs": 0.0, "d": 1, "age": 4.32, "grav": 27.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 9140, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.285, "fa": 0.28, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "Personally I think we already entered a \"good enough\" stage and outside of one-shot benchmarks (which do not represent any form of real work imo), I'm not sure I see much difference between the models anymore.\n\nMaybe counterintuitively, I'm not sure the last frontier model spending was a good idea financially as I'm not sure why you would pay the difference."}, {"id": 50668543, "au": "KerrAvon", "dom": 22, "sr": 19, "sc": 3.3, "ep": 3.74, "bs": 0.0, "d": 6, "age": 3.4, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 4381, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.591, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes. All the software development advice Anthropic's team puts out seems to assume infinite tokens. I love Boris Cherny but dude has access to infinite tokens and fast mode; it's a bit like asking Warren Buffet how to budget for your first apartment.\n\n(Also, their models are best in class, but the software is crap, even the obscenely token-wealthy should not listen to them.)"}, {"id": 50670227, "au": "throw10920", "dom": 126, "sr": 20, "sc": 3.24, "ep": 3.38, "bs": 0.0, "d": 1, "age": 1.01, "grav": 7.3, "surf": 5.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 4219, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 1.426, "fa": 0.0, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "They absolutely will.\n\nDon't underestimate how little people care about the citizens of another country (in the case of the PRC, its neighbors that it's invading/threatening to invade, Hong Kong and Taiwan). Think about all of the people in the US who simply don't care that Russia has been in the process of invading Ukraine for..four years, now?\n\nAlso don't underestimate how much people don't care about their data being taken, trained on, or used to advertise to them in exchange for a few dollars. The majority of people, given a choice between a service that exploits their data, and another one that's a little more expensive and doesn't, will pick the cheaper service."}, {"id": 50668040, "au": "samuelknight", "dom": 2, "sr": 21, "sc": 3.18, "ep": 4.28, "bs": 0.0, "d": 1, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 356, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.191, "fa": 0.34, "gp": 0.352, "bl": 0.0, "ds": 0.0, "txt": "Deepseek was never 3 months behind. The only model that arguably got under 6 months was Kimi K3 at launch. China's labs are undercapitalized (on the order of 10x less than USA labs) so the research expenditure maps well."}, {"id": 50667015, "au": "sheepscreek", "dom": 85, "sr": 22, "sc": 3.07, "ep": 3.44, "bs": 0.0, "d": 1, "age": 5.72, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "Is that one time seven billion tokens? Yeah, that's not much at all.\n\nEspecially for anyone doing research in genomics, that would blow through tokens really fast. Heck, using subagents, I've had days when I was blowing through 2 billion tokens.\n\nMore so when you're doing research and you're not sure what you're trying to accomplish, you would be blowing through many more tokens, exploring unknown avenues."}, {"id": 50667522, "au": "ianm218", "dom": 40, "sr": 23, "sc": 2.97, "ep": 3.41, "bs": 0.0, "d": 2, "age": 4.97, "grav": 32.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.055, "fa": 0.0, "gp": 0.642, "bl": 0.0, "ds": 0.0, "txt": "What do you find baffling to you? As an individual scientist using AI more will help your research/ career more and many scientists think that whatever they are researching is important for the world or for their industry atleast. So doing anything that hurts your research productivity feels unintuitive.\n\nOn the other hand it would take atleast a meaningful % of global scientists to protest AI so their domain doesn't get automated, so there's a super hard collective action problem there."}, {"id": 50669832, "au": "atemerev", "dom": 80, "sr": 24, "sc": 2.96, "ep": 5.76, "bs": 1.7, "d": 6, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 7478, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.546, "fa": 0.34, "gp": 0.796, "bl": 0.64, "ds": 0.0, "txt": "Steering is a separate process. You take the weights, you extract refusals or map steering layers, you analyze the directions with the help of some other model, you write the steering layer or update weights. This is a mechanical process that takes some hours of work and about $500 of compute for frontier-scale models (less for smaller models, and \"small\" means \"less than 1T parameters\" these days)"}, {"id": 50668482, "au": "willy_k", "dom": 87, "sr": 25, "sc": 2.71, "ep": 3.01, "bs": 0.0, "d": 3, "age": 3.49, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 708, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 1.279, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This confuses me. Especially for personal projects, the bottleneck is useful input. On my projects, I don’t think I benefit from anything beyond neon/astra on their recommended effort settings, at most one session subagent per feature."}, {"id": 50668355, "au": "cma", "dom": 23, "sr": 26, "sc": 2.7, "ep": 4.02, "bs": 0.0, "d": 1, "age": 3.69, "grav": 22.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 7, "k": 11834, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.002, "fa": 0.42, "gp": 0.321, "bl": 0.0, "ds": 0.0, "txt": "> Anthropic has spent ~$1.4 billion this year alone.\n\nAnd where did they spend it?\n\nCould China putting strict export controls on data annotation have a similar magnitude effect on us as us putting export controls on EUV?"}, {"id": 50669476, "au": "greatvaluebrand", "dom": 20, "sr": 27, "sc": 2.55, "ep": 3.87, "bs": 0.0, "d": 6, "age": 2.06, "grav": 12.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 9, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.582, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "It’s hard to say. Sometimes I think the cost of their services is grossly underpriced for how valuable the output is compared to human labor. But then sometimes people are just summarizing emails or writing slop to a company teams channel. I don’t know how you even began to reliably put a dollar value on that. I guess a percentage of revenue growth is reasonable. You don’t pay anything unless you got paid more.\n\nI think the best we can do is treat language models a little bit like labor. They’re not paid based on a percentage of dollars they generate (usually), even though that is part of the calculation. Wages are set by replacement cost. How much would it cost you to get someone else who could step into that job? Until the regulatory environment changes, and I don’t think we’re going to escape that the models are a commodity. Some are better than others, but as long as there is a runner up, there’s not unlimited capacity to capture the upside."}, {"id": 50669207, "au": "howunfortunate", "dom": 57, "sr": 28, "sc": 2.41, "ep": 2.86, "bs": 0.0, "d": 2, "age": 2.42, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "This \"intellectual property\" mindset is anathema to science.\n\nThe point is to discover meaningful truth, not to rent seek by hoarding proprietary ideas.\n\nI would gladly donate my research data to anyone who could make use of it."}, {"id": 50667952, "au": "postalcoder", "dom": 14, "sr": 29, "sc": 2.36, "ep": 3.9, "bs": 0.0, "d": 2, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 5016, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.362, "bl": 0.0, "ds": 0.0, "txt": "There's no doubt we're at the point where most models can satisfy most developers, but OAI/Anth have their sights set far past this audience. The two labs believe their destiny is to capture a perpetual royalty stream on economic growth. While skepticism is warranted, these companies have called their shot and are hell bent on making it happen."}, {"id": 50666610, "au": "throwa356262", "dom": 83, "sr": 30, "sc": 2.28, "ep": 3.82, "bs": 0.0, "d": 0, "age": 6.38, "grav": 45.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.52, "bl": 0.0, "ds": 0.0, "txt": "Nice of Kimi, but 20K doesnt get you far. the recent discoveries from US labs has probably cost tens of millions in token.\n\nOn the other hand, who knows what a tool like this can achieve in the hand of super intelligent mathematician from a 3rd world country."}, {"id": 50668428, "au": "willy_k", "dom": 66, "sr": 31, "sc": 2.25, "ep": 3.79, "bs": 0.0, "d": 3, "age": 3.57, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 26, "k": 708, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.103, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> No evidence exists that AI labs violate their contracts and steal usage data to train their models.\n\nUnless you opt out or have ZDR, they both can and openly admit to training on user data.\n\n> legally create without the massive legal and reputational risk.\n\nWhat companies are you talking about? That havn’t used massive amounts of grey data since day 1?"}, {"id": 50669419, "au": "UncleOxidant", "dom": 12, "sr": 32, "sc": 2.21, "ep": 2.65, "bs": 0.0, "d": 2, "age": 2.12, "grav": 12.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 11735, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 1.129, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm finding Qwen3.8-Flash-Next running locally to be a competent workhorse. C++, OCaml, Verilog - it's handling them well. Wasn't the prettiest, most idiomatic OCaml at first, but I had Pi pull in the Real World OCaml book as a knowledgebase (kind of like RAG) and had it review the code and it made good improvements."}, {"id": 50668334, "au": "throwa356262", "dom": 121, "sr": 33, "sc": 2.16, "ep": 2.38, "bs": 0.0, "d": 1, "age": 3.73, "grav": 23.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.014, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "ANT makes a lot of accusations to kill the competition from China.\n\nAt the same time, one US lab has openly claimed they have distilled ANT and Dario is not saying a word."}, {"id": 50668915, "au": "stann", "dom": 5, "sr": 34, "sc": 2.13, "ep": 3.67, "bs": 0.0, "d": 3, "age": 2.83, "grav": 17.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 55, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.175, "fa": 0.28, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "I believe the idea of some things being \"behind\" by x period is a feel-good tunic. In reality (beyond contrived benchmarks), some models are good in some tasks while bad at others. None is better than others for all possible use cases"}, {"id": 50670538, "au": "howunfortunate", "dom": 59, "sr": 35, "sc": 1.83, "ep": 2.71, "bs": 0.0, "d": 4, "age": 0.55, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.155, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Of course, this has been the pattern for decades. Academic researchers create open and accessible knowledge, industry creates closed practical applications that build on that open knowledge base."}, {"id": 50669354, "au": "disgruntledphd2", "dom": 68, "sr": 36, "sc": 1.8, "ep": 3.34, "bs": 0.0, "d": 5, "age": 2.2, "grav": 13.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 38, "k": 8526, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 0.912, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Yes, if you don't opt out, they train on user data in the sense of preference signals that, according to what people working at the labs told us here on HN, have a minor impact in the training pipeline.\n\nDo you have a link to this, perchance?\n\nI guess the one thing I'd say is that it is very, very, very difficult to judge the importance of a particular piece of data, unless you run experiments, which are gonna be both expensive and hard."}, {"id": 50668033, "au": "realusername", "dom": 15, "sr": 37, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 3, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 9140, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure that makes sense as developers were already one of the most demanding demographics for models, there's maybe some science jobs which require even better models but that seems an increasingly narrow path to profitability.\n\nI'm putting myself in the shoes of the average SME and I'm not sure why would they pay extra for the frontier model."}, {"id": 50668789, "au": "seanhunter", "dom": 47, "sr": 38, "sc": 1.76, "ep": 2.64, "bs": 0.0, "d": 5, "age": 3.03, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 13, "k": 15930, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 0.615, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> You're worse off if you don't use it, because someone else will.\n\nScience isn’t zero sum like that.  If I do scientific research I’m not worse off if you do some scientific research as well, even if it’s in my field and you do more of it than me or do it better than me.\n\nIt’s absolutely insane that people have been made to think that everything is a competition when it isn’t.  If we both do science we are both better off and the world is better off."}, {"id": 50667701, "au": "csvance", "dom": 139, "sr": 39, "sc": 1.68, "ep": 3.07, "bs": 0.0, "d": 1, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 41, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 1.308, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The US government forcing an American company to not sell the products it spent capital developing to Chinese customers is the far bigger scandal. As far as I’m concerned American and Chinese AI labs are about equally untrustworthy, but at least the Chinese give us open models."}, {"id": 50669160, "au": "ffsm8", "dom": 48, "sr": 40, "sc": 1.58, "ep": 3.12, "bs": 0.0, "d": 6, "age": 2.48, "grav": 14.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3722, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.328, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not strictly zero sum, true - but it is closer to it than you're implying.\n\nUltimately there is a finite amount of money that sponsors are willing to spend.\n\nUnless you're bootstrapped, which I've personally never seen in science, you're effectively in a zero sum environment.\n\nMaybe not for your current\ngrant, but definitely for the opportunity to get the next."}, {"id": 50669906, "au": "user43928", "dom": 69, "sr": 41, "sc": 1.54, "ep": 2.64, "bs": 0.0, "d": 6, "age": 1.46, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "tokens_openai", "flbl": "Tokens & Openai (Free)", "urls": [], "ig": 1.123, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No. The discussion I'm thinking of happened on the post about the controversy with Navier-Stokes after the researcher suggested OpenAI could have accessed his research. In the comments, OpenAI employees who are usually active on HN commented on this."}, {"id": 50669622, "au": "keeda", "dom": 44, "sr": 42, "sc": 1.52, "ep": 2.63, "bs": 0.0, "d": 4, "age": 1.83, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "results_models", "flbl": "Results & Models (Research)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "Another way to look at it is, training those models improves them and makes the models more useful to the scientists. If there’s no element of competition it could be a symbiotic relationship.\n\nBut I think there’s also a bit of a gamble that there is no element of competition. Scientists are gambling that they can make more progress and publish their findings faster than the AI trains on their data and it (or other scientists with it) can compete with them.\n\nI’m not sure they’re thinking about it that way, but then again I’m not sure it’s bad if it results in faster progress."}, {"id": 50670287, "au": "atemerev", "dom": 75, "sr": 43, "sc": 1.51, "ep": 2.17, "bs": 0.0, "d": 5, "age": 0.93, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 7478, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, when they stop releasing them, we'll stop using them. I am no fan of China either. Qwen4-max is worse than Kimi K3.1, and the latter is open weights."}, {"id": 50668294, "au": "willy_k", "dom": 6, "sr": 44, "sc": 1.37, "ep": 2.91, "bs": 0.0, "d": 3, "age": 3.79, "grav": 23.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 708, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 0.897, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "On benchmarks and tasks that are improved by RLVR or supplemented by external context (read: coding). Not on base model (and arguably RLHF, because of more user chat data) intelligence and “feel”."}, {"id": 50669947, "au": "throw10920", "dom": 74, "sr": 45, "sc": 1.23, "ep": 2.77, "bs": 0.0, "d": 4, "age": 1.42, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 4219, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_cost", "flbl": "Models & Cost (Valuable)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Totally correct.\n\nAnd it's already happening - the PRC has already created restricted versions of some of their models that they're not releasing (Kimi K3.1 Pro and Hy4 cyber variants), or even just straight-up said they're not releasing the base model at all (Qwen4-Max).\n\nThe PRC is not creating open models out of the goodness of their hearts - they're doing it to wage economic war against their enemies. And the minute that open models stop serving their interests, they will stop releasing them.\n\nAnyone who thinks otherwise is just ignorant of reality (or aware of it but maliciously denying it). It's that blatantly clear."}, {"id": 50667538, "au": "sedictious", "dom": 62, "sr": 46, "sc": 1.22, "ep": 2.1, "bs": 0.0, "d": 3, "age": 4.94, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "care_north", "flbl": "Care & North (China)", "urls": [], "ig": 0.892, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "but this is the catch isn't it? We are all taking part in a huge prisoner's dilemma you can't opt out from. The difference is that a lot of us could reduce to play in the first case but the scale of the participants and pressure of the market make this unviable. I don't think whatever move was made was a winning one but (a bit of) time will tell.."}, {"id": 50668213, "au": "singpolyma3", "dom": 3, "sr": 47, "sc": 1.19, "ep": 2.73, "bs": 0.0, "d": 2, "age": 3.91, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1633, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 0.831, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I feel like the idea that anyone is \"behind\" is marketing in the part of the big labs. Maybe different models are differently good at different things a little bit, but no one is \"behind\"."}, {"id": 50670176, "au": "throwa356262", "dom": 37, "sr": 48, "sc": 1.1, "ep": 2.97, "bs": 0.0, "d": 1, "age": 1.1, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_data", "flbl": "Labs & Data (Companies)", "urls": [], "ig": 0.926, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's no coincidence that we're seeing this program after the US labs have cracked down on distillation. The Information reported that sources within deepseek believe that the frontier gap is now 9 months, from 3-6 months prior\n\nDo you have any evidence for those two?\n\nAlso, you know distillation traces can be recorded and to some degree reused for training of future models?"}, {"i
