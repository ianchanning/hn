s to less sales.\n\nAlso piracy isnt on the rise. Its the norm in 3rd world countries and its dead in the west."}, {"id": 50640364, "au": "prmoustache", "dom": 499, "sr": 67, "sc": 4.19, "ep": 5.11, "bs": 0.0, "d": 2, "age": 5.58, "grav": 38.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 8038, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.847, "fa": 0.0, "gp": 0.531, "bl": 0.0, "ds": 0.0, "txt": "\"dodging spoilers\" really?\n\nI only started playing read dead redemption 2 a few weeks ago (bought it on sale several years ago but had yet to install it as I don't play a lot and had other games). In no way did I have to dodge any spoiler. I heard about it several times, I just ignored and/or forgot all this shit.\n\nI only buy games when they are on sale, it is quite easy to avoid any information about them really except people like them or not. I only clicked on this hn post because I am not interested at all in GTA6 and likely never will and yet I haven't learned anything about the actual game story/background/gameplay. You have to look for it to get spoiled really.\n\nAlso all PC gamers will get access to it at the same time so it will be a new big topic of discussion among PC gamers when it happens.\n\nWhen I was a kid you would wait months and a special occasion (birthday, christmas...) for your parents to accept offering you a game or you would have to save for months (and it would compete with your music purchases). We more often than not just wait, go play at friends who got it and/or swap games or even console/comps between Sega, Nintendo, PC engine, Atari or Amiga equiped friends. Are the new generations so fragile and silly they can't handle very minor frustration?"}, {"id": 50640707, "au": "mmo93", "dom": 253, "sr": 68, "sc": 4.19, "ep": 5.09, "bs": 0.0, "d": 5, "age": 4.74, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 34, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.725, "fa": 0.0, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "I often think we get confused by what \"many\" actually means. Some people won't play non-physical releases, but most will. The same goes for always-online games. God knows I've played many thousands of hours of PoE by now. It all comes down to how shitty the implementation is.\nEverybody used to love Netflix, and pirating movies and shows was essentially dead for a decade. Now the service is shit and pirating is back. It all comes down to the path of least resistance. If that turns out to be getting an LLM to spin up a mock server based only on network emissions from the running program, then that's what will happen.\nOr if the implementation is so cumbersome that it makes the experience significantly worse, somebody else will build a game not requiring it and take its market share"}, {"id": 50642748, "au": "quadruple", "dom": 55, "sr": 69, "sc": 4.19, "ep": 5.06, "bs": 0.0, "d": 1, "age": 0.58, "grav": 5.5, "surf": 59.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 154, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.81, "fa": 0.28, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "The problem is that shaders generated by xcl's shader compiler ARE bloated. So bloated in fact that Nvidia's drivers really really dislike compiling them, and will choke hard. Most playable clips happen on AMD GPUs.\n\nAnother thing that the Xbox has that PCs don't is BCPack. It's Microsofts flavor of game asset compression accelerated by hardware, which obviously PCs don't have. In fact, I believe it may even be patented by Microsoft, so I assume translation layers can get taken down by MS for specifically that."}, {"id": 50634738, "au": "aliasxneo", "dom": 486, "sr": 70, "sc": 4.19, "ep": 5.05, "bs": 0.0, "d": 1, "age": 18.04, "grav": 220.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 2451, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.725, "fa": 0.0, "gp": 0.689, "bl": 0.0, "ds": 0.0, "txt": "A portion of the user base, like myself, just want it for the modding. The technical prowess and simulation of GTA VI is groundbreaking, but the current version sacrifices freedom for the sake of maintaining a consistent story. The first thing many people do after leaving Jason's house is try to steal a car in the neighborhood (because, you know, the game title is Grand Theft Auto) and are immediately met with a \"You can't steal cars in your neighborhood.\" Presumably because it breaks some story element.\n\nI'm sure this will eventually get fleshed out in a more free play mode. But who knows how long that will take. And I suspect that modders will get there first."}, {"id": 50633428, "au": "pipes", "dom": 220, "sr": 71, "sc": 4.19, "ep": 5.0, "bs": 0.0, "d": 0, "age": 19.49, "grav": 250.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1300, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "Can someone explain why this needed a leak of the Xbox build for it to be possible.\n\nAlso why is the Xbox build a leak at all? Surely it's just a binary and assets pulled from a Xbox hard disc?\n\nI thought most recomps decompiled binaries and then ported to another platform.\n\nFor all the cheering about this, I imagine it's going to lead to a future where games run some component on the cloud always so that they can't be decompiled and ported (and pirated)."}, {"id": 50636583, "au": "hermannj314", "dom": 144, "sr": 72, "sc": 4.19, "ep": 4.87, "bs": 0.0, "d": 5, "age": 15.26, "grav": 168.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 3817, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.573, "fa": 0.0, "gp": 0.812, "bl": 0.0, "ds": 0.0, "txt": "It feels like a type of theft of services.  If I buy a train ticket, hotel room, or buy an hour of a contractor's time, I don't own the train, own the hotel room, or own the contractor.  This does not allow me to sneak on a train, skip the payment for a hotel or refuse to pay the contractor because \"if buying isn't owning, then pirating isn't stealing\"\n\nThe law is entirely made up, so I can imagine a world where digital goods aren't property, but we don't seem to live in that world and we seem to want to honor licenses to use digital goods and services.  I feel like society is better off if stealing a product you could have bought but could never own is still considered a crime.  I am pretty sure society generally wants that to be true.  Maybe I am wrong."}, {"id": 50640412, "au": "rickdeckard", "dom": 7, "sr": 73, "sc": 4.19, "ep": 4.84, "bs": 0.0, "d": 4, "age": 5.44, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 4809, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.782, "fa": 0.68, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "That's surely a benefit of it, but in terms of pure engineering management it is also more reasonable to not launch for PC at the same time.\n\nFocusing resources to optimize for ~4 targets (2x XBox, 2x PS5) is a better use of time than postponing the ENTIRE launch until all PC-issues are ironed-out.\n\nThe least thing you want is a \"Cyberpunk 2077\" situation where your resources are spread thin and the game only works well on specific configs but is unstable on others, and tanks the experience (and reviews!) for everyone.\n\nIn addition, the advanced PC graphics features in your backlog suddenly are no blockers for the launch anymore and you can continue working on them while the console version is shipped."}, {"id": 50638466, "au": "jamesfinlayson", "dom": 51, "sr": 74, "sc": 4.19, "ep": 4.73, "bs": 0.0, "d": 3, "age": 10.74, "grav": 97.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1255, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.673, "fa": 0.0, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "I think the Xbox kind of is Windows PC, except there are a bunch of things it needs to do like code signing, locking things down if updates aren't installed, not exposing a bunch of internals that would otherwise be okay for a regular PC etc. Probably there are performance improvements that can be made in the operating system that are hard for regulars PCs (like segment heap on regular Windows, probably stripping out a bunch of unneeded services, the ability to dedicate a huge majority of CPU time to the game process)."}, {"id": 50638215, "au": "ThePinion", "dom": 271, "sr": 75, "sc": 4.19, "ep": 4.73, "bs": 0.0, "d": 2, "age": 11.4, "grav": 106.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 286, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.378, "fa": 0.28, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "As someone that for years actively looks specifically for couch co-op games .. That whole (small) list isn't available unless you get a Switch 2. They're spread across all the consoles. Also, that small list doesn't get much larger in terms of being worth getting into a console walled garden over."}, {"id": 50638711, "au": "Agentlien", "dom": 50, "sr": 76, "sc": 4.19, "ep": 4.71, "bs": 0.0, "d": 4, "age": 10.1, "grav": 88.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 2975, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.657, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "In my opinion PC is still easier than consoles. There are weird bugs in special cases, but most of them tend to pop up when doing weird edge case things in graphics. There's a lot more care needed of course with checking capabilities and you can make fewer assumptions. But generally on the games I've worked on PC has been just getting the game run, then doing tests to find those issues and set system requirements.\n\nMeanwhile, I've had to dedicate many months to optimizing things on consoles because they are so much more constrained in memory, processing power, etc. Unless it's a brand new console, but then you instead get a lot more low-level API and even hardware bugs you need to work around."}, {"id": 50636816, "au": "lelandbatey", "dom": 256, "sr": 77, "sc": 4.19, "ep": 4.7, "bs": 0.0, "d": 3, "age": 14.83, "grav": 161.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 13, "k": 4178, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.807, "fa": 0.7, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "> it's not too bad if you aren't playing some competitive first person shooter\n\nGame streaming is absolutely not usable for most users; the lag is not something that can be overcome without 10+ more years of infra improvements. I recommend you try this, really try it. Lots of things make game streaming quite miserable, even under ideal conditions. I have a gaming PC I use, built this year and using a wired ethernet connection. If I use a hardwired connection on the client when stremaing, then it is great, very low latency. But if I stream games over a wifi client, even with fancy wifi-6 access points (Ubiquiti) and even if I am less than 5 feet away with direct line of sight (Steam deck streaming handheld, to an access point mounted on the wall next to me) I still get noticeable input lag. I have been using it to play GTA 5 these past 2 weeks, and it's hard to drive vehicles and VERY hard to aim with the latency I see. Most folks have MASSIVELY worse network conditions than what I just described, so I suspect streaming isn't ready for the big-time yet at all."}, {"id": 50634760, "au": "vrmiguel", "dom": 506, "sr": 78, "sc": 4.19, "ep": 4.65, "bs": 0.0, "d": 1, "age": 18.01, "grav": 219.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 120, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.668, "fa": 0.0, "gp": 0.508, "bl": 0.0, "ds": 0.0, "txt": "I dislike the AI wave too and I agree this is all \"slop\", but the game _is_ running through all of these different slop projects. It is also very very likely that it'll be running well-ish enough given some days or weeks.\n\nAfter all, the work needed here isn't all too different from the Switch 2 slop work that has been done for Ocarina of Time recently. It's the exact same idea, and LLMs have proved to be scary good at it.\n\nThe fact this is an Xbox build should mean considerably less overall work compared to what happened with the Switch 2 projects, even. Compatibility work for Xbox doesn't need recompilation, and its graphics API likely maps almost 1-to-1 to the regular Windows' DirectX."}, {"id": 50633989, "au": "andai", "dom": 5, "sr": 79, "sc": 4.19, "ep": 4.65, "bs": 0.0, "d": 2, "age": 18.98, "grav": 239.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.722, "fa": 0.0, "gp": 0.413, "bl": 0.0, "ds": 0.0, "txt": "I also heard this from devs who release games for windows. The first few weeks after launch are spent full time on fixing weird edge cases (due to the vast diversity of hardware configs), largely graphics related. I heard this even for 2D games with simple graphics!\n\nSeeing this thread initially I was surprised GTA isn't already on PC, but then I remembered it makes sense, ironing all that stuff out can be a big pain."}, {"id": 50636513, "au": "Rohansi", "dom": 257, "sr": 80, "sc": 4.19, "ep": 4.61, "bs": 0.0, "d": 3, "age": 15.38, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 162, "qw": 86, "k": 1494, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.876, "fa": 0.64, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "> This adds some latency cost but usually it's not too bad if you aren't playing some competitive first person shooter.\n\nDepends on where you live. And that's a pretty big condition to slap on that statement when competitive first person shooters are probably the most popular type of game right now.\n\n> Most gaming PCs and game consoles sit unused for 99% of the time. Cloud gaming would enable a much higher hardware utilization.\n\nAre you Sam Altman?\n\n> This is ironic because he resells PC games (with a 30% markup), but the PC platform is plagued the most by piracy, suggesting that piracy is also caused by how easy it is. Until recently, it was impossible to pirate games for PS5, the most popular game console.\n\nYou misinterpreted what Gabe Newell meant. He is saying that the people who would buy your products turn to piracy when buying your product is a worse experience than pirating it. Eliminating piracy is not the goal because there is a subset of pirates who would never buy your product, or would buy it later when they are able to.\n\nThe movies/TV industry is a perfect example of that. The service is terrible - so many different streaming services you need to subscribe to, content not available in every country, things come in and out of each service depending on licenses, etc... You can literally have your wallet ready to hand out money and not be able to watch the movie/TV s"}, {"id": 50635102, "au": "brookst", "dom": 24, "sr": 81, "sc": 4.19, "ep": 4.58, "bs": 0.0, "d": 7, "age": 17.54, "grav": 210.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.358, "fa": 0.0, "gp": 0.959, "bl": 0.0, "ds": 0.0, "txt": "“Wanted” is a weasel word here. Sure, they could have. But it would have been less efficient, and cost more money than the revenue uptick would justify. So no, they didn’t want to make less money by being less efficient, hiring more people for a shorter time, and laying off more people once the one big launch day came. This spreads work over more time, reduces hire/fire churn, reduces rework for issues.\n\nYes, they wanted to be smart. It’s hard to fathom anyone seeing some weird conspiratorial motivation when basic business operations argues for exactly what they’re doing. You actually want bigger layoff cycles in the video game industry?"}, {"id": 50635618, "au": "lentil_soup", "dom": 49, "sr": 82, "sc": 4.19, "ep": 4.52, "bs": 0.0, "d": 3, "age": 16.84, "grav": 197.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 4089, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.54, "fa": 0.0, "gp": 0.618, "bl": 0.0, "ds": 0.0, "txt": "Not exactly related to what the OP is saying but a PC can have hundreds of possible configurations (between CPU, graphics card, RAM, etc) while a console is fixed so developing for PC is much harder to get right. GPU code is particularly tricky as compatibility, performance, features, etc vary so much between vendors and generations that you end up shipping the shader code and compiling on the first run of the game. You still need to test as many configurations as possible to make sure there's no edge cases where it doesn't work"}, {"id": 50629757, "au": "ericmay", "dom": 358, "sr": 83, "sc": 4.19, "ep": 4.45, "bs": 0.0, "d": 2, "age": 23.54, "grav": 341.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 8954, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.074, "fa": 0.34, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "Most people will just buy the PC version when it's released because dealing with all of this stuff is a huge pain in the ass except for hobbyists. Joe and Jane off the street can barely use Excel, let alone clone a Github repository.\n\nI bought it on Xbox and am really enjoying it. I actually think we should have a model where you buy it once and can use it on any platform. I don't have a problem with it being ready on X console and then on Y other platform after Z date, but I shouldn't have to buy the damn game 3x that's stupid."}, {"id": 50630201, "au": "CMay", "dom": 480, "sr": 84, "sc": 4.19, "ep": 4.44, "bs": 0.0, "d": 0, "age": 23.06, "grav": 329.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.359, "fa": 0.0, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "There are enough barriers and issues with running it this way on a PC that I don't see any real threat to this becoming the mainstream approach to running GTA 6 on a PC.  People who are waiting to play it on PC are presumably doing so, because they want the best experience.  The console version of the game is not optimized for most desktop PCs or the highest end cards.  Anyone who could play it this way can probably afford a Series X and will likely get better framerates there anyway at least for now.\n\nSo, I don't see this as a major commercial threat and I also very much doubt if they will even adjust their PC release schedule as a result of this at all.\n\nIt is cool, though."}, {"id": 50634336, "au": "ndriscoll", "dom": 449, "sr": 85, "sc": 4.19, "ep": 5.11, "bs": 0.8, "d": 4, "age": 18.56, "grav": 230.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 48, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.263, "fa": 0.42, "gp": 0.652, "bl": 0.3, "ds": 0.0, "txt": "Our leaders (or rather, leaders from previous generations at this point) blatantly scoffed at those values when they set the current rules:\n\n> Actually, Sonny wanted the term of copyright protection to last forever. I am informed by staff that such a change would violate the Constitution. ... As you know, there is also Jack Valenti's proposal for term to last forever less one day. Perhaps the Committee may look at that next Congress.\n\n-- Congresswoman Mary Bono, speaking on how she'd like to find ways to violate the Constitution and infringe on everyone's rights in order to enrich herself and her friends"}, {"id": 50641485, "au": "pid-1", "dom": 181, "sr": 86, "sc": 4.19, "ep": 4.29, "bs": 0.0, "d": 1, "age": 2.78, "grav": 16.7, "surf": 12.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2224, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.517, "fa": 0.95, "gp": 0.254, "bl": 0.0, "ds": 0.0, "txt": "Small nitpick, but making 4 billion might not be that good depending on the time horizon of the investment and risk + opportunity costs.\n\nE.g. S&P 500 multiplied your money by 4x in the past 13 years."}, {"id": 50633328, "au": "etempleton", "dom": 309, "sr": 87, "sc": 4.19, "ep": 4.2, "bs": 0.0, "d": 1, "age": 19.58, "grav": 252.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 4575, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.609, "fa": 0.0, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "I think 99.9 percent of players won’t have the technical know how and/or hardware let alone the drive to go through the hassle of running these games on PC, so opening up the consoles has no benefit to them. A handful of nerds will do it, but most won’t so it isn’t something the really need to address as a risk.\n\nI generally agree day and date on PC makes a lot of sense because it removes the interest on getting unauthorized PC version running. Rockstar is a bit of the oddball here as a third party that does not publish day and date. The word is they are targeting Q1 27 instead of the usual 1 year delay and I am sure that piracy concerns are near the top of the list on that decision."}, {"id": 50633304, "au": "dgunay", "dom": 493, "sr": 88, "sc": 4.15, "ep": 4.15, "bs": 0.0, "d": 0, "age": 19.61, "grav": 252.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 905, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.188, "fa": 0.34, "gp": 0.268, "bl": 0.0, "ds": 0.0, "txt": "AAA devs should really just get out ahead of this nonsense and release a day 1 PC version, sloppily ported at hyperspeed with an LLM, and then if they still want to \"double dip\" on PC sales (a dubious concept to begin with IMO) they can release a \"definitive edition\" a year later with higher fidelity assets, more PC optimizations, etc. I'm not willing to buy a console for this game but I'll pay R* their $80, if they would only let me."}, {"id": 50636445, "au": "wvenable", "dom": 335, "sr": 89, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 5, "age": 15.51, "grav": 172.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 21431, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.257, "fa": 0.34, "gp": 0.153, "bl": 0.0, "ds": 0.0, "txt": "Streaming companies are only making expensive entertainment.  Network television used to have a lot of affordable-to-make scripted programming.  Streaming has also become fragmented which is increasing the hassle of it all.  A pricey product that is harder to buy is a tougher sell in 2026.\n\nNow GTA6 is both wildly expensive to produce and expensive to buy but in terms of pure entertainment value it's actually a good deal."}, {"id": 50633608, "au": "georgemcbay", "dom": 265, "sr": 90, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 1, "age": 19.31, "grav": 246.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 36, "k": 16548, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.139, "fa": 0.42, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "> Can someone explain why this needed a leak of the Xbox build for it to be possible.\n\nIt is the only executable that has been leaked.  The fact that its the Xbox one is just a matter of chance of however the leak happened.\n\n> Also why is the Xbox build a leak at all? Surely it's just a binary and assets pulled from a Xbox hard disc?\n\nSomeone presumably hacked into Rockstar or had a contact there that exfiled the Xbox binary to them.  The on-disc binaries that ship on both Xbox and PS5 retail game discs are encrypted and can only be decrypted by the security processor on the custom AMD chips both systems use as CPUs."}, {"id": 50629284, "au": "FLeXMurphy", "dom": 324, "sr": 91, "sc": 4.1, "ep": 4.1, "bs": 0.0, "d": 0, "age": 24.06, "grav": 353.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 140, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.932, "fa": 0.0, "gp": 1.317, "bl": 0.0, "ds": 0.0, "txt": "This doesn't bode well for studios that have sunk massive amounts of money and time into things. Probably won't lead to _too much_ piracy, but still. I suspect Sony was onto something with the physical media drama, but going forward I wonder if we will go back to custom architectures/peripherals to slow this down."}, {"id": 50636846, "au": "drnick1", "dom": 304, "sr": 92, "sc": 4.01, "ep": 4.01, "bs": 0.0, "d": 2, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 11, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.019, "fa": 0.42, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "> Once consoles are opem there is no way to subsidize hardware\n\nThen don't. Sell them for a \"normal\" profit, and allow people to do whatever they want with them. People will still buy consoles because of convenience/standardization, because it's a nice form factor that works well with TVs, etc."}, {"id": 50638313, "au": "randomaccountpe", "dom": 258, "sr": 93, "sc": 3.97, "ep": 6.49, "bs": 2.52, "d": 4, "age": 11.15, "grav": 103.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 4, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.829, "fa": 0.34, "gp": 0.841, "bl": 0.95, "ds": 0.0, "txt": "100% agree on the movie part. I grew up in a country where US content was banned for good chunk of history. When it finally got unbanned, it still took a while for stuff to get translated from English into our own language.\n\nThen as a young boy, I moved to a free, English democratic country.\n\nIn this free country, there were no streaming services available at all, and the DVD rental places were already starting to shut down.\n\nThen Netflix decided to expand internationally, and we finally got that. And it had literally nothing good on it. They didn't bother acquiring the licenses needed to stream most of the good American content to our country.\n\nI basically spent my whole life learning that the only way good way to watch stuff was piracy.\n\nNow we have almost everything available, and it's split across 5 different streaming platforms. I don't understand, what was the game plan."}, {"id": 50641034, "au": "bananaboy", "dom": 22, "sr": 94, "sc": 3.95, "ep": 3.95, "bs": 0.0, "d": 7, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1130, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.126, "fa": 0.34, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "Absolutely. They have a cross-platform engine and they've been doing this for a long time. I'm positive day to day dev happens across all platforms that they support. They supposedly have 4711 employees. I'm sure they have teams who focus on each platform. I work on COD and we have probably about the same number of people working on it (across all COD studios). We simship every year on all platforms we support, and we have teams that focus on specific platforms (e.g. Beenox looks after PC)."}, {"id": 50633579, "au": "rpdillon", "dom": 430, "sr": 95, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 7, "age": 19.34, "grav": 246.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 13, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.097, "fa": 0.42, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "> Without some restrictions, the motivation to create things might go down to zero.\n\nThis is fiction. There will always be people creating things simply because they want to. The current IP regime (copyright in particular) was designed to maximize the amount of creation happening. I'm not convinced they succeeded, given the prospects for new authors."}, {"id": 50635440, "au": "atoav", "dom": 205, "sr": 96, "sc": 3.93, "ep": 3.93, "bs": 0.0, "d": 1, "age": 17.09, "grav": 202.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 21289, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.081, "fa": 0.34, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "I mean not to lessen GTA6 here, but you are aware of the multiple European cathedrals where the building process took 500 to 700 years that involved artists of all trades over many generations?\n\nThis is also what GTA6 competes with if we talk about the largest artistic endeavours ever undertaken."}, {"id": 50638482, "au": "jasomill", "dom": 182, "sr": 97, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 1, "age": 10.7, "grav": 97.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1930, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.27, "fa": 0.0, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "Same. My data point is that Tears of the Kingdom was playable on PC day one, with significantly better graphics than on the Switch, yet it went on to sell over 20 million copies.\n\nIf I controlled a game company, I'd respond to this \"threat\" by providing additional value to registered owners through optional online features, and let hackers and pirates have their fun."}, {"id": 50629333, "au": "micromacrofoot", "dom": 378, "sr": 98, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 1, "age": 24.01, "grav": 352.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 4803, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.651, "bl": 0.0, "ds": 0.0, "txt": "We'll end up streaming games. It's the only way to lock up source code in a way that AI can't eventually decompile. Some of the infrastructure is already in place, and it's a much clearer path than custom architecture, which is something the industry has moved well past at this point.\n\nRemember that these are generally rent-seeking companies, they don't want to sell you something once anymore."}, {"id": 50635638, "au": "user43928", "dom": 219, "sr": 99, "sc": 3.87, "ep": 3.87, "bs": 0.0, "d": 2, "age": 16.81, "grav": 196.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.234, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even many of the people who worked on the projects were kids with a coding agent who sound less than competent.\n\nHowever, I do believe that the game will be playable by the end of this week.\n\nOn the projects I was able to access, I counted at least 250 distinct contributors on GitHub.\n\nThe target here is reimplementing or translating an existing large binary to work well on another platform. The use case seems like a perfect match for AI.\n\nI don't see why it wouldn't be doable quickly."}, {"id": 50635614, "au": "palata", "dom": 105, "sr": 100, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 1, "age": 16.84, "grav": 197.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 17, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.554, "fa": 0.42, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "> But I will probably still buy it when it comes out on PC, even if this port works.\n\nActually, you should buy the game if you play this port. Even if they never release a PC version. Even if they release a PC version and you never play it. That's how it would be ideally.\n\nBut if you try to \"do it right\" and do this, you take a risk: maybe the port won't work that well, and maybe (probably?) when they release a PC version, you won't be able to play with the console version you've bought.\n\nI think Rockstar should announce that if you buy the game for console, you can play on any port you want (on your PC, tamagotchi or smart fridge) but have to realise that it is not an official port. AND that IF they ever release it for PC, you will be able to play with the game you bought for console.\n\nThat way people who want to play on PC now even if it's not an official port can do it, and people who want to wait can also do it. And people who will pirate it anyway will pirate it anyway."}, {"id": 50636158, "au": "techjamie", "dom": 63, "sr": 101, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 5, "age": 16.0, "grav": 181.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.417, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It would be much more restricted than the current landscape. A big example in fivem is the big unsanctioned market for making real cars in the game. Auto manufacturers are very picky about how you display their vehicles and what you do with them, and GTA would never get licensed.\n\nThis is also why so many racing games can have you smash into a wall at 80mph and only get a few scratches. Licensing forbids smashing the cars up."}, {"id": 50633807, "au": "GaryBluto", "dom": 223, "sr": 102, "sc": 3.81, "ep": 3.81, "bs": 0.0, "d": 2, "age": 19.16, "grav": 243.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1580, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.899, "fa": 0.34, "gp": 0.5, "bl": 0.0, "ds": 0.0, "txt": "Not just now. XBOX consoles had a form of drive locking in 2001, although it was easily disabled altogether, if I remember correctly, with either a modchip or EEPROM flash."}, {"id": 50634681, "au": "EmX_3000", "dom": 312, "sr": 103, "sc": 3.79, "ep": 3.79, "bs": 0.0, "d": 1, "age": 18.11, "grav": 221.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.55, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "No no, what'll happen is you'll stream your games from a Stadia-like service and in the future they will never leave the server farm, your PS6 / XBox 1180 / Switch 3 will all just be Zero Clients transmitting button pushes and joystick / d-pad movements, and receiving video feeds in response."}, {"id": 50638527, "au": "trueno", "dom": 339, "sr": 104, "sc": 3.79, "ep": 3.79, "bs": 0.0, "d": 3, "age": 10.55, "grav": 94.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 18, "k": 680, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.01, "fa": 0.42, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "> Plenty of people can access the game fine but still choose to pirate. Its hard to beat free.\n\nThis is kind of an socioeconomic thing to me. I used to be the hard to beat free guy. These days with malware/inconvenience _and_ being in a spot in life where I do have disposable income, me and I'm assuming many others are happy to pay once just to get playing and not deal with any weird risks or annoying hacky stuff to get something going"}, {"id": 50633500, "au": "wpm", "dom": 513, "sr": 105, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 1, "age": 19.42, "grav": 248.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 3715, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.518, "fa": 0.0, "gp": 0.143, "bl": 0.0, "ds": 0.0, "txt": "Until they can figure out how to consistently keep RTT low enough people aren't going to bite. Cloud gaming feels like shit. Even local game streaming over WiFi it sucks, and most people use WiFi at home, so how the hell are they going to convince loads of normies that they need to have big ethernet cables running all over their house to play the next FIFA or whatever?"}, {"id": 50640980, "au": "thenthenthen", "dom": 276, "sr": 106, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 0, "age": 4.05, "grav": 25.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1032, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.35, "fa": 0.0, "gp": 0.394, "bl": 0.0, "ds": 0.0, "txt": "Was waiting for this top pop up here. I have been following the progress of the past day and a half and it is absolutely amazing to watch the progress, drama etc. Better than  any movie or video game ever. Absolute Imax"}, {"id": 50636068, "au": "throwitaway222", "dom": 269, "sr": 107, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 0, "age": 16.12, "grav": 183.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 606, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.881, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "My wife and I decided to stop buying consoles because split screen co-op has been killed (by no longer releasing games). That was the only reason we ever liked consoles. PC gaming from here out."}, {"id": 50641033, "au": "dolmen", "dom": 87, "sr": 108, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 3, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 27, "k": 1380, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.02, "fa": 0.42, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "> TIL that consoles do allow this and it makes sense; why waste time compiling the shaders at runtime when you already know what the target hardware is.\n\nI guess that's one of the tricks the Steam Deck does: shaders compiled once and cached on the Steam servers for distribution in the assets instead of being compiled on the user's machine."}, {"id": 50629667, "au": "ndriscoll", "dom": 405, "sr": 109, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 4, "age": 23.65, "grav": 343.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.58, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I suppose we'll find out within the next week or two whether that's the case, or whether all it takes are some teenagers with Claude/Codex subscriptions (who are starting from the more difficult position of having to get a console build to work instead of having the source) and a few days.\n\nSo far the OoT remake points toward the latter being sufficient. I wouldn't be at all surprised if they managed to get the PC port running at stable 60+ FPS by late next week, or if even that's a vast overestimate and they get it there tomorrow. It's hard to even set expectations lately."}, {"id": 50633511, "au": "bahmboo", "dom": 494, "sr": 110, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 1, "age": 19.41, "grav": 248.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 1395, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.514, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "There already is a \"PC version\" insofar as internally not everyone is working in the xbox/ps5 world of the game. Yes that's ultimately where it is headed and managed for but the average dev or artist needs to have a fast iterative loop on their workstation.\n\nI've been out of the industry for a while so perhaps someone could fill in the details.\n\nBut then that's just a technical compatibility. There is massive amounts of QA to be done for the PC market before release. And that's after you've built out the happy path parts already. True this is not their first rodeo but it's still work to be done."}, {"id": 50630483, "au": "avidruntime", "dom": 60, "sr": 111, "sc": 3.67, "ep": 4.73, "bs": 1.06, "d": 2, "age": 22.76, "grav": 322.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 196, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.633, "fa": 0.0, "gp": 0.618, "bl": 0.4, "ds": 0.0, "txt": "I'm hoping that Rockstar's acquisition of FiveM is a hint towards a desire for sanctioned but open modding. GTA 6 with a modding community that is mostly independent and openly accessible like Garrysmod could propel the GTA 6 platform into the closest thing toward the metaverse that was promised all those years ago."}, {"id": 50634280, "au": "elif", "dom": 6, "sr": 112, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 3, "age": 18.64, "grav": 232.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 6790, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.202, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "The reason GTA is not already on PC is the same reason GTA is not online yet.\n\nIts not a technical reason or a temporal constraint.\n\nIt's because by releasing the same game 3 different times throughout a year, they can maintain lasting cultural relevance."}, {"id": 50636062, "au": "firecall", "dom": 202, "sr": 113, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 3, "age": 16.13, "grav": 184.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2491, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.527, "fa": 0.0, "gp": 0.013, "bl": 0.0, "ds": 0.0, "txt": "It’s driving console sales of the Sony PS5 as well!\n\nSony reported that GTA6 launch day was the highest single-day number of newly connected consoles.\n\nSo that is likely to be owners of other consoles, last gen PS4 owners or PC gamers who want to play the game. In that way, it absolutely is a way to make more money.\n\nAnecdotes on Reddit suggest the PS5 was sold out in many places.\n\nI don’t know if Sony locked in a PS5 console exclusive for GTA6, but I understand that has been a thing for some games. Certainly Sony would want the launch to be a PS5 exclusive."}, {"id": 50639917, "au": "mort96", "dom": 91, "sr": 114, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 4, "age": 6.81, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.434, "fa": 0.0, "gp": 0.153, "bl": 0.0, "ds": 0.0, "txt": "Wait using what API? Vulcan compute shaders are based on sending SPIR-V to the driver, I believe DirectX's GPU compute is the same. Does CUDA or ROCm have you feed the GPU machine code directly?"}, {"id": 50641160, "au": "claykkari", "dom": 272, "sr": 115, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 0, "age": 3.63, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 53, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.356, "bl": 0.0, "ds": 0.0, "txt": "The fact that they're about to vibecode GTA 6 and the RAGE engine is nuts. Personally I'm happy with the PS5 version but it's still interesting to see what this leads to: mods, multiplayer, perhaps vibecoded remakes of the earlier titles etc."}, {"id": 50639732, "au": "asimovDev", "dom": 191, "sr": 116, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 2, "age": 7.32, "grav": 55.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 596, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.098, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not defending them, but the reason you can't play games off the external drive is probably the same as for PS5 - loading times. Games are now designed with NVME drives in mind so someone in multiplayer playing off a USB 3.0 drive would be terrible. Plus I imagine it causes all kind of other issues. On PS5 you can only play PS4 games off an external drive, I wonder if it's the same on Series S (OG xbox and 360 only)"}, {"id": 50629602, "au": "origini", "dom": 521, "sr": 117, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 1, "age": 23.72, "grav": 345.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.319, "fa": 0.0, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "In germany, certain hacking tools fall under the hacker paragraph. In this case it might be possible to sue whom? for arbitrary things but the base assumption here is, that if you own the game legally, you can change it so it also runs on a PC and you are not breaking anything because you didn't stole it.\n\nYou just hacked your own thing to use it. On the other hand we then have companies like John Deere and the discssuion of the right to repair yourself.\n\nI don't think that Rockstar will sue Anthropic and i'm pretty sure Anthropic doesn't mind at all helping Rockstar.\n\nBut whatever this is, companies for sure understand that the cat is out of the bag.\n\nDo it in private,d o it with some abliberated model, due it through some chinese models."}, {"id": 50636195, "au": "TripleTree", "dom": 498, "sr": 118, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 1, "age": 15.94, "grav": 180.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 6, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.278, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I mean, you're not wrong, but there's also something to be said for getting to experience the game along with everyone else and not have to spend months dodging spoilers and being unable to talk about it with friends who played on console.\n\nPlaying the game while it's the big topic of discussion is fun, and it's a drag that PC gamers have to wait."}, {"id": 50636935, "au": "himata4113", "dom": 320, "sr": 119, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 1, "age": 14.54, "grav": 156.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2571, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.024, "fa": 0.34, "gp": 0.098, "bl": 0.0, "ds": 0.0, "txt": "Hey claude remake this entire game based on video frames, make it match the original pixels with 100% accuracy. You may use this device to explore the game to populate all areas."}, {"id": 50629435, "au": "2Gkashmiri", "dom": 414, "sr": 120, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 1, "age": 23.89, "grav": 349.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 48, "qw": 0, "k": 2861, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": ["https://nypost.com/2026/11/19/business/gta-6-cost-a-whopping-1b-to-make-here-is-how-it-compares-to-the-biggest-blockbusters-made/"], "ig": 0.407, "fa": 0.62, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "https://nypost.com/2026/11/19/business/gta-6-cost-a-whopping...\n\nRockstar spend 1 billion and made 3.5 or something in a day or two.\n\nThey are already in profit and will continue to do so for long... Why does it matter to me or you if I \"don't pay them the fair share\" since they already made their money hand and fist?"}, {"id": 50638205, "au": "literallywho", "dom": 130, "sr": 121, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 10, "age": 11.41, "grav": 107.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 46, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's more of an issue with the music industry. Seems to happen all the time, even outside of games. I watched the extended cut of Deadpool 2 and it didn't have \"Take on me\" in the emotional climax of the movie and it was replaced with a different track (better one imo). House M.D. intro only had the iconic Massive Attack song in North America and not in any other countries. I'm sure there are countless other examples."}, {"id": 50630251, "au": "0x000xca0xfe", "dom": 59, "sr": 122, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 1, "age": 23.02, "grav": 328.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 962, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.957, "fa": 0.0, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "I'm very, very interested what the modding scene will be for this game... this many hyped kids with ridiculously overpowered tools at the same time will lead to interesting results for sure."}, {"id": 50634636, "au": "zergrush", "dom": 451, "sr": 123, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 3, "age": 18.16, "grav": 222.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 94, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.883, "fa": 0.5, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "people who can't afford your games are unlikely to pay for it and \"piracy = stealing\" is already argued out of court since stealing implies access is not possible without reducing inventory or consuming resources like server (since pirated copies will run on their own community servers).\n\nnor do i think its right to punish or heavy handed approaches to pirating games. if you can afford it sure do it but if you are struggling and you its GTA 6 or groceries you are going to choose the latter and if they can get GTA 6 through piracy then why is that suddenly stealing?\n\nAre poor people not allowed to enjoy digital content that costs nothing to the publisher or developer when a whole population of buyers line up to cover their production costs and then some ?\n\nQuestion, will you throw your own kids in prison for pirating a game because technically they are thieves ?"}, {"id": 50630854, "au": "Agentlien", "dom": 77, "sr": 124, "sc": 3.47, "ep": 3.47, "bs": 0.0, "d": 2, "age": 22.36, "grav": 313.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2975, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.142, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Why would you assume the PC version won't use the same assets as the Xbox? On current-gen consoles a lot of games use the same assets as on PC. The games I've worked on targeting many platforms often used the same assets for PC, Xbox Series X|S, and PlayStation 5. Then a lower tier on PS4 and Xbox One. And finally a lot of effort went into creating and tuning the lowest tier of assets used for Nintendo Switch."}, {"id": 50636118, "au": "hgoel", "dom": 52, "sr": 125, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 3, "age": 16.05, "grav": 182.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.351, "bl": 0.0, "ds": 0.0, "txt": "There can be all sorts of subtle 'bugs' in how strictly specs are implemented. Variation between, say, NVIDIA and AMD is unsurprising and very common, but it can also manifest as different behavior between different driver versions and different architectures.\n\nThese systems and specs are so broad and complex that it is very common to accidentally stumble into an execution path that causes issues in some hardware configuration."}, {"id": 50641438, "au": "cubefox", "dom": 255, "sr": 126, "sc": 3.41, "ep": 3.41, "bs": 0.0, "d": 4, "age": 2.88, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 15, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.943, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> You'd want billions a year in sales to justify running a data center purely for cloud streaming.\n\nThis already exists, it's called GeForce Now. They don't need \"billions\" of sales per year. I don't know where that idea comes from. They just have a monthly usage fee (or a limited free tier) in addition to the price of the games themselves."}, {"id": 50637033, "au": "King-Aaron", "dom": 214, "sr": 127, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 1, "age": 14.32, "grav": 152.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 5778, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.418, "fa": 0.0, "gp": 0.042, "bl": 0.0, "ds": 0.0, "txt": "I never buy initial release hardware or software, so have been quite happy to not get the FOMO feeling around the game. But before I had kids I invested many, many hours into GTA online, and as such I'm still very keen to eventually play it.\n\nBut I'm also very glad to be saving my first generation PS5's life by not playing it, because I've been seeing a lot of GPU failure posts."}, {"id": 50636548, "au": "CMay", "dom": 489, "sr": 128, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 2, "age": 15.32, "grav": 169.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 0.619, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know how likely that is without knowing what files are available, how they're setup and all of that.  There are a lot of factors that can get in the way of that.  Maybe it's a weekend project, but maybe 4 years later you still can't get 30fps."}, {"id": 50641348, "au": "RugnirViking", "dom": 457, "sr": 129, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 2, "age": 3.12, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 3858, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.437, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "how are you assessing that it worked? \nthem making profits, or people buying the game, is in no way an indication that they would not have done that if it were released on pc or available to pirate.\n\nin general most of the people buying it on console would have bought it on console anyway even if it were possible to play it on pc. They already have the expensive dedicated game-playing device!\n\n(yes, im sure some people on social media claim to have bought a console soley to buy the game. Congratulations to them for having the disposable income to do this if indeed its true they did that, but this surely is not a widespread phenomenon)\n\nIn exactly the same way that estimating the number of pirated copies downloaded (if such a thing is remotely possible), in no way shows that that many people would otherwise have bought the game."}, {"id": 50634206, "au": "nick_", "dom": 224, "sr": 130, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 3, "age": 18.75, "grav": 234.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 707, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.233, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "Or by hot swapping the SCSI cable to a PC shortly after booting the console lol. Then hex edit the drive from a linux live disc to enable a softmod. I used an alligator clip to ground both xbox and PC chassis together, but I heard of people doing it without even that!"}, {"id": 50634296, "au": "maxglute", "dom": 329, "sr": 131, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 3, "age": 18.61, "grav": 232.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 3068, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.396, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not intended to be.\n\nThe point is piracy creates market pressure to check producers to discipline their pricing shenanigans. The easier it is to pirate the harder / better producers has to work to sell real copies. The entire point is change market dynamic so consumers has MOST access and producers extract LEAST profit. For producers to maximumly serve consumers for as little scraps as they are willing to bear, i.e. piracy helps consumers with bargaining/pricing power."}, {"id": 50641837, "au": "cudder", "dom": 88, "sr": 132, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 4, "age": 2.01, "grav": 12.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 225, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not only Deck, Steam does it on desktop too. They have a collection of precompiled shaders for the most common GPUs and driver versions. Now that I think about it, the last time I had to wait for shader compilation was before switching my gaming rig to Linux. The clanker asserts that it's also important for Proton performance, so maybe it's on by default on Linux and off on Windows? Or maybe they brought it to desktop Steam as I did the switch."}, {"id": 50630363, "au": "ndriscoll", "dom": 419, "sr": 133, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 3, "age": 22.9, "grav": 326.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.294, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "I'm not interested in and don't have time for the game anyway, but I don't belive in this system (of eternal government enforced monopolies on an infinite resource), and would reflect the character attack straight back at those who do. I'm certainly not going to pretend there's anything wrong with people doing the work Rockstar refused to do to get it to run on their machines. They were explicitly not target customers, and Rockstar took active steps to prevent them from being able to run it, arbitrarily restricting it to certain branded computers. Moreover, they took active steps to advertise the thing and try to make it somehow culturally important, so it seems fair that curious people check it out."}, {"id": 50641351, "au": "OroPla", "dom": 302, "sr": 134, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 5, "age": 3.12, "grav": 18.9, "surf": 18.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 496, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.381, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Consoles were sold at a loss with the goal to recoup that by selling software. But now that it takes an entire console generation to make a new console seller game it's no longer a good strategy, I suppose.\n\nSony also put their games on PC for a while. Not quite sure why they stopped doing that. Ditching physical games is to kill the used market. I wonder how that will work out for them."}, {"id": 50630175, "au": "lofaszvanitt", "dom": 372, "sr": 135, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 2, "age": 23.09, "grav": 330.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 242, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What you have to understand is noone will spend 100s of millions of dollars on a project, when some leeroy jenkins kid decides to crack it open for fun and some virtual fame. I like this new wave yolo bs that tells you: well, I bought a supercar for 5 million dollars, but I don't wanna shell out 15k for a windshield and this company should be ashamed for doing so. Gimme a break, they pay the engineers, the marketing machine, not you."}, {"id": 50639505, "au": "mschuster91", "dom": 131, "sr": 136, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 11, "age": 7.88, "grav": 61.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 26, "qw": 6, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": ["https://en.wikipedia.org/wiki/Cold_Case\u0023Distribution"], "ig": 0.45, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  I'm sure there are countless other examples.\n\nAmong the most infamous ones is Cold Case. It took 17 years (!) for it to get available at least on streaming sites [1], and apparently also on DVD...\n\n[1] https://en.wikipedia.org/wiki/Cold_Case\u0023Distribution"}, {"id": 50636478, "au": "grg0", "dom": 86, "sr": 137, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 2, "age": 15.46, "grav": 172.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 733, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.107, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "As far as I know, desktop graphics APIs/drivers don't allow you to straight up load shaders in assembly; they have you go through IL and they compile that down to the GPU's ISA. You would have to bypass the user-mode driver at the very least. TIL that consoles do allow this and it makes sense; why waste time compiling the shaders at runtime when you already know what the target hardware is."}, {"id": 50636266, "au": "mahboi", "dom": 500, "sr": 138, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 2, "age": 15.82, "grav": 178.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Movie releases in theaters used to also work like this. You missed a lot waiting for DVD/VHS. I really think piracy is the reason there are almost no great movies anymore.\n\nBut video game piracy is much harder. Even if they manage to do this, it'll probably be so much less efficient that people would rather pay for the PC version. They'll also add all these online features that only work with legitimate copies."}, {"id": 50633620, "au": "hollow-moe", "dom": 455, "sr": 139, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 0, "age": 19.31, "grav": 246.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 709, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "Years later and they still don't understand the words of gaben. Piracy is a service issue.  \nWhat's the easiest path to get the game on a PC currently, between \"none\" and \"hard\" ?"}, {"id": 50635692, "au": "user43928", "dom": 488, "sr": 140, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 1, "age": 16.73, "grav": 195.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 0.905, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If only we had something that was great at optimizing a large project for a target architecture.\n\nI wouldn't be surprised if Claude and Codex have this running at 120 fps by the end of the week."}, {"id": 50642971, "au": "thebytefairy", "dom": 104, "sr": 141, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 1, "age": 0.18, "grav": 4.1, "surf": 48.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 23, "k": 143, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.787, "fa": 0.42, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "> It's deeply frustrating that everyone else will get to experience it before me because I didn't want to spend hundreds of dollars on a console!\n\nI understand the sentiment, but is it reasonable that all companies should spend the time and resources getting their games working (well) on all possible platforms?"}, {"id": 50638287, "au": "literallywho", "dom": 15, "sr": 142, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 6, "age": 11.22, "grav": 104.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 46, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.895, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sony said GTA 6's launch brought the largest number of newly connected PS5s in a single day since the console went on sale in 2020. I imagine they're selling quite a lot, actually."}, {"id": 50634754, "au": "bigyabai", "dom": 57, "sr": 143, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 2, "age": 18.02, "grav": 220.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 3325, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.891, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure if unified memory makes much of a difference for this port. The Xbox Series X has two memory pools for the system and GPU, which are made distinct with different bus width and memory bandwidth. To match the upper bound with Apple Silicon, you're looking at ~600GB/s of bandwidth, which is pretty high up on the SKU chain. Even an M5 Max is going to struggle to keep pace once you account for macOS' memory usage.\n\nIt's possibly at a disadvantage compared to GDDR+DDR5 gaming PCs. Neither the Xbox nor Playstation version was optimized with LPDDR5X iGPUs as a performance target. XSX and PS5 are both GDDR6 systems, much closer to dGPU territory than it is to mobile GPUs."}, {"id": 50637242, "au": "Sivart13", "dom": 477, "sr": 144, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 0, "age": 13.79, "grav": 143.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 598, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.219, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "As a happy PS5 player, I am personally tired of getting daily updates on this project.\n\nIt's certainly my fault for reading the comments every time for some reason."}, {"id": 50640633, "au": "kay_o", "dom": 180, "sr": 145, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 6, "age": 4.91, "grav": 32.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 347, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.284, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Transit Service Bonuses\"\n\nPrefer the more scenic route? Get upgrades from Scooter Bros Premium vehicle care, premium membership on the RydeMe rideshare app, and free scooter and bike rentals, plus Leonida metro benefits."}, {"id": 50636514, "au": "CMay", "dom": 492, "sr": 146, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 2, "age": 15.38, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Xbox supports gaming monitors too, not just TVs.  It's nice to have all the configuration options you get with PC releases, though.  Plus there are so many 3rd party utilities for tweaking games.  It can be a bit of upfront effort, but it's very satisfying when you've got it just right.  A lot of those things don't run on Linux distros unfortunately."}, {"id": 50636453, "au": "spockz", "dom": 184, "sr": 147, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 1, "age": 15.5, "grav": 172.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 2608, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.715, "fa": 0.0, "gp": 0.877, "bl": 0.0, "ds": 0.0, "txt": "This was also relatively easy to do because the Xbox basically is a windows pc at this point. Many things are shared such as DirectX. There will be optimisations to work well with the graphics system of the Xbox and things like memory bandwidth, but essentially it is just a normal pc game."}, {"id": 50630381, "au": "00deadbeef", "dom": 466, "sr": 148, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 0, "age": 22.88, "grav": 325.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 563, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.834, "fa": 0.0, "gp": 0.665, "bl": 0.0, "ds": 0.0, "txt": "The long-term consequence of all of this reverse engineering is that games will get locked behind streaming services and the code will never run on your machine."}, {"id": 50630868, "au": "bathtub365", "dom": 373, "sr": 149, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 22.35, "grav": 313.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2066, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.09, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "This conversion is just letting PC gamers play what they’ve already called an inferior version of the game. All of the assets are lower quality ones targeting Xbox (models, textures, shaders for an outdated RDNA architecture) so I don’t think this will move the needle as far as sales lost from people who will actually buy a proper PC release."}, {"id": 50633226, "au": "sandworm101", "dom": 491, "sr": 150, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 19.71, "grav": 254.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 19, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.729, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">> People who are waiting to play it on PC are presumably doing so, because they want the best experience.\n\nNot me. I do not want to purchase a console and a big TV to play one game when I have a perfectly good gaming PC already up and running.\n\nI also am adverse to giving a penny to Microsoft. I want to run it on a linux."}, {"id": 50634120, "au": "WheatMillington", "dom": 487, "sr": 151, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 1, "age": 18.84, "grav": 236.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 19, "k": 2471, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.648, "fa": 0.42, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": ">People who are waiting to play it on PC are presumably doing so, because they want the best experience\n\nI'd say the primary reason people are waiting to play it on PC is because it currently does not exist on PC. Otherwise I'd be playing it."}, {"id": 50635865, "au": "chocochunks", "dom": 236, "sr": 152, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 3, "age": 16.43, "grav": 189.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 412, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.119, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Imagine you're locked outside your house, the keys are inside but you have your Xbox controller. You can still play your Xbox through the window but you don't have access to your fridge unless you break in. The Xbox is a locked house, they let you do certain things without the keys but to copy games off the drive is not one of them."}, {"id": 50636864, "au": "russelg", "dom": 287, "sr": 153, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 1, "age": 14.71, "grav": 159.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1012, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "No encryption or DRM was cracked here. The work is based on a leaked development build of the game for Xbox, completely unencrypted. The only challenges are filling in the APIs that Xboxes have that Windows does not."}, {"id": 50629808, "au": "SXX", "dom": 345, "sr": 154, "sc": 2.83, "ep": 5.35, "bs": 2.52, "d": 3, "age": 23.49, "grav": 339.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 9372, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.318, "fa": 0.34, "gp": 0.885, "bl": 0.95, "ds": 0.0, "txt": "LLMs dont care what machine code to read. It's just gonna be retargeting recompiler instead of x86_64 compatability layer.\n\nLike man: you can feed claude 1997 game executable and it will extract all logic out of it, without even Ghidra. Just using Sonnet with some Python scripts.\n\nIt can damn patch game memory using powershell. Sonnet, not Fable."}, {"id": 50636292, "au": "RIMR", "dom": 137, "sr": 155, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 4, "age": 15.76, "grav": 177.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2351, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "It's only untrue if your worldview only includes legality and not ethics.\n\nIs it illegal to pirate GTA VI? Sure.\n\nIs it ethical to pirate GTA because you were given no reasonable options to play the game legitimately that didn't involve spending hundreds of dollars with an entity other than the game publisher/designer? Also yes."}, {"id": 50632096, "au": "GLGirty", "dom": 364, "sr": 156, "sc": 2.78, "ep":
