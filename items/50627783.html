tegories": [{"category": "general_web", "count": 18}, {"category": "low_cred_or_joke", "count": 2}, {"category": "investigative_or_tech_press", "count": 1}, {"category": "code_repository", "count": 1}], "story_anchors": ["gta", "windows", "shaders", "surprised", "technical", "cyberleek", "large", "locked", "effort", "near", "path", "market", "happy", "otherwise", "approach", "lead", "nice", "prefer"], "largest_root": {"root_id": 50629284, "author": "FLeXMurphy", "slots": 130, "start_dom": 324, "end_dom": 453, "share_pct": 24.6, "top_dom1_age": 23.4, "top_dom1_author": "Tiberium"}, "buried_cutoff": 158, "rescue_top_k": 80, "ablations": [], "tournament": [], "comments": [{"id": 50634591, "au": "cubefox", "dom": 249, "sr": 1, "sc": 11.34, "ep": 11.34, "bs": 0.0, "d": 2, "age": 18.22, "grav": 224.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 177, "qw": 33, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.994, "fa": 1.65, "gp": 1.343, "bl": 0.0, "ds": 0.0, "txt": "> Arguably that's creating another challenge for hackers to either bypass at the easiest, or at worst reverse-engineer and create a local server to communicate with instead.\n\nThis can't be bypassed, let alone easily, because the game actually runs in the cloud. The usual cloud-based solution is to simply stream the raw video and audio output to the client and send back button presses. This adds some latency cost but usually it's not too bad if you aren't playing some competitive first person shooter. And if everyone is forced to play like this (to prevent piracy), the competitive aspect evens out.\n\nApart from preventing piracy, this is also cheaper in terms of hardware. Most gaming PCs and game consoles sit unused for 99% of the time. Cloud gaming would enable a much higher hardware utilization. (Though it would be nowhere near 100%, because there is a large variance in demand based on the weekday, time of day, and big new game releases.)\n\n> To paraphrase Gabe Newell, _piracy is a service problem_.\n\nThis is ironic because he resells PC games (with a 30% markup), but the PC platform is plagued the most by piracy, suggesting that piracy is also caused by how easy it is. Until recently, it was impossible to pirate games for PS5, the most popular game console."}, {"id": 50632431, "au": "SXX", "dom": 298, "sr": 2, "sc": 11.01, "ep": 11.01, "bs": 0.0, "d": 7, "age": 20.6, "grav": 273.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 25, "qw": 0, "k": 9372, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 7, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.theregister.com/on-prem/2000/11/02/sony-sees-red-as-ec-dubs-playstation-2-a-game-console/1021791", "https://www.gamesindustry.biz/sony-loses-eu-customs-case-as-ps2-is-branded-a-console"], "ig": 0.466, "fa": 2.73, "gp": 1.472, "bl": 0.0, "ds": 0.0, "txt": "My bad, it wasn't US but EU 2.2% tax. Sony actually sued European Comission and lost:\n\nhttps://www.theregister.com/on-prem/2000/11/02/sony-sees-red...\n\nhttps://www.gamesindustry.biz/sony-loses-eu-customs-case-as-...\n\nSo yeah these 2.2% was very big for them in 2000-2003."}, {"id": 50629877, "au": "Tiberium", "dom": 1, "sr": 3, "sc": 10.82, "ep": 10.82, "bs": 0.0, "d": 0, "age": 23.42, "grav": 338.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 0, "k": 6199, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 2.032, "fa": 0.96, "gp": 2.286, "bl": 0.0, "ds": 0.0, "txt": "For the general picture: the Xbox version of the game was leaked by Cyberleek - first the resources, then the game binary.\n\nBecause modern Xbox is very close to a Windows PC with some extra Xbox stuff, running the actual game code isn't hard, it's mostly about compatibility and graphics, plus the binary doesn't have any special DRM/obfuscation.\n\nThe current projects (xcl and VIctory) basically take a Wine-like approach. The main problems they have to solve, as I understand:\n\n- The game ships with raw RDNA 2 shaders, so the projects have to translate that to another format, e.g. DXIL for DirectX 12, and compile those shaders. So you need a good translation/recompilation pipeline, if it's bad, the shaders will be bloated and perform poorly\n\n- Xbox has unified memory, while most PCs do not, so you have to add a lot of workarounds and book-keeping for the game to work properly with that\n\n- Xbox's DirectX 12 differs from the normal Windows one in some ways, and the game uses Xbox-specific texture formats with DirectStorage\n\nI just wanted to share this because there's a lot of misconceptions going around about this being a \"recomp\" or something like that. Decompiling the entire binary (it's about 100MB of real executable machine code) will be a much bigger effort than getting this binary to run."}, {"id": 50637290, "au": "mahboi", "dom": 502, "sr": 4, "sc": 10.61, "ep": 10.61, "bs": 0.0, "d": 4, "age": 13.62, "grav": 140.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 194, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": ["https://www.boxofficemojo.com/chart/top_lifetime_gross_adjusted/?adjust_gross_to=2022"], "ig": 1.953, "fa": 1.57, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "The streaming market we have is a product of piracy. There's a reason everything is a subscription instead of a la cart like it used to be. They could take the risks to make a must-see film, but there's only a short window where they can make it theater-exclusive or provide an expensive rent option before people pirate, meanwhile they'd take a bath on several other movies where the risk didn't pay off. The piracy-aware strategy is to only make everything good enough that people stay subscribed.\n\nIt hit music even harder. Albums were $10 in 1980s money. Apple knew artists would have to conform to iTunes or succumb to piracy, but even iTunes didn't really survive. Albums make pennies per listen now on streaming sites.\n\nYou linked to the nominal prices on OfficeMojo. It's weird, you have to select a year to adjust to. https://www.boxofficemojo.com/chart/top_lifetime_gross_adjus... shows mostly older movies near the top. That and, sales aren't everything, 2016-2019 they were cashing out maybe the final time on a lot of valuable IP. Star Wars 7 still ranks high by adjusted numbers because of course people will see it, but it's definitely not a top 20 movie of all time.\n\nThe Matt Damon Netflix thing is interesting though."}, {"id": 50633111, "au": "dang", "dom": 217, "sr": 5, "sc": 10.26, "ep": 10.26, "bs": 0.0, "d": 0, "age": 19.83, "grav": 257.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 41, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": ["https://news.ycombinator.com/item?id=50622638", "https://news.ycombinator.com/item?id=50612686", "https://news.ycombinator.com/item?id=50595168"], "ig": 1.435, "fa": 1.57, "gp": 1.668, "bl": 0.0, "ds": 0.0, "txt": "Recent and related (in reverse order). Others?\n\nGTA 6 Recomp (Leonida) banned from GitHub while lead dev was in school - https://news.ycombinator.com/item?id=50622638 - Nov 2026 (512 comments)\n\nCyberleek posted the GTA 6 Xbox build executable - https://news.ycombinator.com/item?id=50612686 - Nov 2026 (323 comments)\n\nLeonida – PC Recompilation of the Xbox Version of GTA 6 - https://news.ycombinator.com/item?id=50595168 - Nov 2026 (222 comments)"}, {"id": 50637130, "au": "al_borland", "dom": 501, "sr": 6, "sc": 10.09, "ep": 10.24, "bs": 0.0, "d": 3, "age": 14.08, "grav": 148.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 202, "qw": 0, "k": 13376, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": ["https://www.boxofficemojo.com/chart/top_lifetime_gross_adjusted/"], "ig": 1.826, "fa": 1.57, "gp": 1.014, "bl": 0.0, "ds": 0.0, "txt": "I would think it's more an issue of streaming services, not piracy. There are so many streaming services and every single one wants exclusive content. Rather than the best of the best stories making it through the studio vetting process, streaming services just throw any junk against the wall to see what sticks.\n\nSmartphones also play a role. These streaming services know people aren't fully paying attention. They are messing around on their phone while the movie plays, so the movies repeat stuff and make it really obvious, which dumbs down the movie for anyone who is actually fully watching it. Matt Damon confirmed this was something they were told to do in one of his movies that went to Netflix.\n\nLooking at the top movies by adjusted gross[0], it was trending up since 2000, peaking from 2016-2019, then it fell off a cliff. There aren't any movies in the top 200 from 2022 or beyond. The pandemic is the obvious reason for the fall off, but that also was a huge boon for the streaming services and poured gasoline on that whole industry, which led to the things mentioned above.\n\nMovie piracy has been around for 25 years and the trends in those numbers don't follow along with it.\n\n[0] https://www.boxofficemojo.com/chart/top_lifetime_gross_adjus..."}, {"id": 50636270, "au": "avidruntime", "dom": 371, "sr": 7, "sc": 10.07, "ep": 10.07, "bs": 0.0, "d": 6, "age": 15.81, "grav": 178.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 209, "qw": 109, "k": 196, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 2.046, "fa": 1.26, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I would argue the ecosystem's relative stability is the only thing enabling projects that take longer to make. Project complexity and time to completion seems to rationally scale with what cutting edge technology allows. GTA 6 took as long as it did because of the latitude developers had in both their prior experience but also in the distribution of latest gen consoles.\n\nI'm not sure where you get the idea that AAA games are not risky. Less games produced just means less individual stakes, but the bigger the project the bigger the stakes. Microsoft invested reportedly 500 million dollars for a total flop. That's a modern title, on modern hardware + PC port, built on one of the most well known video game properties of its genre. Rockstar/Take Two bet the entire farm on GTA 6.\n\n> So many gamers complain about games being the same thing over and over, and that's because there's no competition, no incentive to make something better. These companies are no longer fighting for their survival so they don't need to innovate, they just need to optimise for monetisation, which is exactly what's been happening for the last 20 years.\n\nThis doesn't factor into the argument, IMO. And I think you're ignoring the broader point I\"m making about the ecosystem in which AAA games are just one piece of.\n\n> Also, this isn't just about console exclusivity. One of the hackers is doing what he's doing "}, {"id": 50634934, "au": "ivraatiems", "dom": 103, "sr": 8, "sc": 9.36, "ep": 9.36, "bs": 0.0, "d": 0, "age": 17.76, "grav": 215.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 8965, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.668, "fa": 0.68, "gp": 2.417, "bl": 0.0, "ds": 0.0, "txt": "I just don't see this as deadly to the production of games the way others do. GTA 6 is a monumental human achievement in video games - in fact it's arguably one of the largest artistic endeavors ever undertaken. If numbers are to believed, it has also already made around $4 billion against a $1-2 billion budget. It is massively profitable, and doubtless will become more so as DLC and a real PC port are released.\n\nI see this, instead, as a continuation of the usual pushback against the lockdown of entertainment to certain media. I personally haven't bought the game yet because I don't have or intend to buy an Xbox! It's deeply frustrating that everyone else will get to experience it before me because I didn't want to spend hundreds of dollars on a console!\n\nBut I will probably still buy it when it comes out on PC, even if this port works."}, {"id": 50632771, "au": "SXX", "dom": 413, "sr": 9, "sc": 9.34, "ep": 9.49, "bs": 0.0, "d": 6, "age": 20.23, "grav": 265.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 9372, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.978, "fa": 0.95, "gp": 1.472, "bl": 0.0, "ds": 0.0, "txt": "I think you just happen to have a task that is much harder for LLM to handle. That happens.\n\nLike I personally made some stupid 2d pixel art web demo and even fable struggle to re-atchitecture it into something that not lags and easy to integrate new content into. And it eats x10 of usual context limit while whole codrbase is like 10,000 LOC and bunch of dumb config files.\n\nAt the same I building actual client-server 3D RTS well over 100,000 LOC, GOAP AI, lots of visual features and 99% of work can be done by Sonnet.\n\nWhy? I dont know, might be because I actually properly architectured RTS using my brain and not just unconytollable vibe coded it.\n\nOr might be it's just weird kind of \"luck\" because my previous web-based prototypes were easy to build and work on. IDK.\n\nPS: if you curious shoot me email or ping me on Linkedin, I'd be happy to share even though it not ready for public relese yet."}, {"id": 50639568, "au": "mschuster91", "dom": 308, "sr": 10, "sc": 9.07, "ep": 9.22, "bs": 0.0, "d": 2, "age": 7.69, "grav": 59.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 79, "qw": 32, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": ["https://www.galaxus.de/de/s1/product/sony-playstation-5-pro-2-tb-spielkonsole-49618254"], "ig": 1.759, "fa": 1.38, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "> Once consoles are opem there is no way to subsidize hardware because it will all be taken for generic compute.\n\nHardware subsidies are effectively gone, that's why you see a PS5 Pro for >1900€ on retail these days [1].\n\n> Its exactly why Valve released Steam machines with pretty high price tag.\n\nOh no. Valve would have loved to release it for far less money, the problem they're facing is the same as Sony, Microsoft, Nintendo, even Apple did - Sam Altman wrecked the memory market and the market for anything on a reasonably recent TSMC node completely.\n\nThere are no legal words to express how much anger and hate I hold for this one singular person.\n\n[1] https://www.galaxus.de/de/s1/product/sony-playstation-5-pro-..."}, {"id": 50635454, "au": "jmyeet", "dom": 188, "sr": 11, "sc": 8.35, "ep": 8.72, "bs": 0.0, "d": 1, "age": 17.07, "grav": 201.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.84, "fa": 0.68, "gp": 1.695, "bl": 0.0, "ds": 0.0, "txt": "I bought a Switch solely to play Zelda Breath of the Wild and have zero regrets. It was and is a phenomenal game.\n\nI've been incredibly tempted to buy a PS5 solely to play GTA6 but I haven't. I believe this port happening within days of console release is both really cool from a technical POV but will force Rockstar's hand and make them sell a PC version sooner than they otherwise might. There are unconfirmed rumors they'll push this up to Q1 2027.\n\nFor comparison, GTA 5 on PC came out ~1.5 years after the first console release. Rockstar really milked that one by releasing it on PS3 (and the Xbox equivalent at the time) then PS4 (+ new Xbox) with improved graphics (as that console came out) and then the PC version. RDR2 took a year to come out on PC.\n\nI don't feel bad at Rockstar having its hand forced. GTA6 is already a spectacular commercial success within days of release and will only get bigger. Shut up and take my money."}, {"id": 50640361, "au": "alexdoesstuff", "dom": 8, "sr": 12, "sc": 8.09, "ep": 8.23, "bs": 0.0, "d": 4, "age": 5.58, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 58, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 2.028, "fa": 0.62, "gp": 1.172, "bl": 0.0, "ds": 0.0, "txt": "There's fairly limited evidence that there is true double dipping happening, or that there's a profit maximizing motive behind delaying PC version and online. Commercially, it almost surely doesn't make sense to delay PC release or online mode.\n\nFor GTA 5, when the PC version was released in 2014, sales increased by about 20M units during the launch quarter, from about 34M units sold before the PC launch to about 54M units sold afterward. The company itself at that point said that it was mostly new players, not people buying twice. And it's still a small share of overall GTA 5 sales which stands at 230M units.\n\nDelaying online is almost surely a commercial negative for the company. They lose out on the revenue from people moving from online to GTA 6 without the possibility of offsetting that loss with similar online-related revenue. For the game to be an economic success, they need to generate more revenue from players than just the initial sale. It's just the economic reality of publishing the game as it is."}, {"id": 50635372, "au": "jmyeet", "dom": 286, "sr": 13, "sc": 8.01, "ep": 8.01, "bs": 0.0, "d": 0, "age": 17.18, "grav": 203.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.923, "fa": 0.62, "gp": 1.189, "bl": 0.0, "ds": 0.0, "txt": "Music piracy gave us streaming like Spotify. To solve the service issue.\n\nTV and movie piracy gave us streaming like Netflix. To solve the service issue.\n\nI support this project for two reasons:\n\n1. It's going to force Rockstar's hand. Rather than wait 1-2 years to release a PC version, which is what they'd do without any external pressure (based on previous GTA/RDR releases). There are many people like me who are like the Fry meme of \"shut up and take my money\"; and\n\n2. From a technical POV it's just kinda cool that the cutting edge hypervisor-based DRM and encryption has been cracked within days. I believe this will change how publishers approach staggered publishing.\n\nPut another way: we want to fix a service issue."}, {"id": 50630694, "au": "avidruntime", "dom": 369, "sr": 14, "sc": 7.83, "ep": 8.12, "bs": 0.0, "d": 4, "age": 22.53, "grav": 317.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 243, "qw": 0, "k": 196, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.992, "fa": 0.68, "gp": 1.035, "bl": 0.0, "ds": 0.0, "txt": "I'm just not sure what gamers are expecting to happen. The console ecosystem is valuable because it creates a guaranteed scalable marketplace, which allows deficit financing models in game development, which allows more studios to exist. This allows more games to be created. I can't imagine a world where GTA 6's budget was 1 billion dollars if it werent for consoles. Thats why there are exclusivity agreements in AAA titles, including GTA 6. I'm pretty sure consoles take a 30% cut like Apple on in game purchases too, for GTA 5, 97% of in game purchases were bought by console players. Look no further than the current television/movie marketplace to see the effects of ecosystem breakdown; consumers get less products and the products they do get are increasingly less risky.\n\nSo future investments are either going to react to this new environment or console makers will take it up a notch in protecting IP.\n\nSome gamers are hellbent on burning down their own house, I suppose. I understand that piracy is an unshakable force and there would've been people trying to pirate GTA 6 on launch whether or not it had launched PC at the same time. But the moral grand standing about how Rockstar is getting what it deserves is absurd. The amount of arguments that boil down to an extremely vague accusation that the delayed PC release is so Rockstar can double dip has spread like wild fire. I'm read"}, {"id": 50634188, "au": "zamalek", "dom": 78, "sr": 15, "sc": 7.77, "ep": 8.51, "bs": 0.0, "d": 3, "age": 18.77, "grav": 235.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 199, "qw": 0, "k": 15120, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.912, "fa": 0.95, "gp": 0.901, "bl": 0.0, "ds": 0.0, "txt": "At launch, consoles can be better dollar/fidelity than the directly equivalent self-built PC - economies of scale etc. Some never are (e.g. Nintendo). That only accounts for bang for buck. If money isn't an issue then I don't _think_ there has ever been a console that could hold a candle to the best-in-slot same generation PC.\n\nTake the first XBOX as a good example, it had 32MB of RAM shared between the CPU and GPU (the sharing is where it had some performance gains). Even the most basic PC has 64MB RAM + 16MB VRAM, with enthusiast already at the 512MB level.\n\nThe Series X has 16GB of shared memory, where-as your typical 2020 gaming PC might have had 16GB + 8GB. An enthusiast PC at the time would have been something like 32GB + 24GB or 64GB + 24GB.\n\nThat means more room for level data, entities, physics, AI (RAM), and models, textures, buffers (VRAM). If you want to use all available VRAM you need to fill it with bigger textures (which are usually the bulk of the data). That means you need higher def textures on-disk, which means it isn't using the same assets as consoles (though consoles are probably using downscaled versions of the same assets)."}, {"id": 50633659, "au": "FractalParadigm", "dom": 248, "sr": 16, "sc": 7.14, "ep": 7.51, "bs": 0.0, "d": 1, "age": 19.28, "grav": 245.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 32, "k": 929, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 2.02, "fa": 0.42, "gp": 1.077, "bl": 0.0, "ds": 0.0, "txt": "> For all the cheering about this, I imagine it's going to lead to a future where games run some component on the cloud always so that they can't be decompiled and ported (and pirated).\n\nArguably that's creating another challenge for hackers to either bypass at the easiest, or at worst reverse-engineer and create a local server to communicate with instead.\n\nTo paraphrase Gabe Newell, _piracy is a service problem_. PC is one of the largest (ignoring mobile), if not the most vocal gaming community on the planet - if Rockstar wants to take the greedy route _again_ attempting to double-dip on PC revenue, somebody else is going to solve that lack-of-service problem, especially in the age of ML/LLM-assisted reverse-engineering/hacking."}, {"id": 50630800, "au": "Agentlien", "dom": 2, "sr": 17, "sc": 6.89, "ep": 7.99, "bs": 0.0, "d": 1, "age": 22.42, "grav": 314.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2975, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.415, "fa": 0.68, "gp": 1.883, "bl": 0.0, "ds": 0.0, "txt": "I work with graphics and performance in video games. For the last two years my main focus has been low-level Xbox stuff. It is fascinating both how much stuff is just Windows API and also how many weird platform-specific quirks there are.\n\nGetting the same thing to run on PC and Xbox Series X|S can be such a wild ride. 90% just works, unlike PS5 or Switch where there's a lot of work to get anything running at all. But those last 10% are so full of odd fiddly platform-specific details."}, {"id": 50641830, "au": "alexdoesstuff", "dom": 10, "sr": 18, "sc": 6.85, "ep": 7.73, "bs": 0.0, "d": 6, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 58, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.739, "fa": 0.95, "gp": 0.645, "bl": 0.0, "ds": 0.0, "txt": "Their financial reporting suggests they've made ~825M last 12 month on GTA V and Online. That number has been around the same mark for the 3 years prior as well. It's fair to assume that that number with the release of GTA VI is essentially zero now.\n\nThey've announced $3.8B in gross sales through preorders and launch day (about 32.5M units). They book around 65% of those gross sales as revenue after sales taxes and platform fees, so they've made ~$2.5B in revenue until launch day and they'll probably end up at at least 2x the figure at year end. But from their perspective, you can only sell the game once and realistically most of their high intention customer-base will have bought the game at the very least by the end of the year.\n\nAnd from then on, the absence of an online component and the revenue associated with it will start to sting unless they release it quickly."}, {"id": 50633580, "au": "guax", "dom": 512, "sr": 19, "sc": 6.61, "ep": 7.27, "bs": 0.0, "d": 1, "age": 19.34, "grav": 246.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 1790, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.752, "fa": 0.62, "gp": 0.954, "bl": 0.0, "ds": 0.0, "txt": "Game streaming only gets normalized if there is enough customers in them. GTA VI is only receiving this level of attention because its GTA VI, most AAA games won't trigger anywhere near this effort from people. GTA VI is already profitable and will likely be a massive ROI case.\n\nThings I think are all true in this case:\n\n* GTA VI is still a massive outlier and most studios wont aim for this because the risk is too high\n\n* Having a janky PC port wont change the needle on PC revenue if it comes out in Q1 2027.\n\n* Streaming games might work but its still a worse and less reliable experience for most people, right now it selects for users who can use it. Local run serves everyone else (the majority of the world)."}, {"id": 50637721, "au": "Beached", "dom": 145, "sr": 20, "sc": 6.61, "ep": 6.9, "bs": 0.0, "d": 6, "age": 12.5, "grav": 123.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 650, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.526, "fa": 0.68, "gp": 0.948, "bl": 0.0, "ds": 0.0, "txt": "You metaphore doesnt hold up. I do not buy a train ticket with the expectation I own the train, or with the expectation I can take the train any time I want. I buy a ride on a train once.\n\nWhen I buy a videogame, im buying the videogame, with the expectation that I can play that game as much, and as often as I want, for as long as I want.\n\nIf rockstar sold a subscription to GTA $5 for 1 week of play time, then your metaphore would hold up.\n\nHis argument is \"I bought a car, I expect I can drive the car as much as I want. BMW cant show up 5 years later and say 'conditions have changed, we are removing the car from you'\""}, {"id": 50635408, "au": "vrmiguel", "dom": 25, "sr": 21, "sc": 6.54, "ep": 7.86, "bs": 0.0, "d": 8, "age": 17.14, "grav": 203.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 120, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.893, "fa": 0.68, "gp": 1.019, "bl": 0.0, "ds": 0.0, "txt": "Weird conspiratorial motivation how? \"Basic business operations\" argues for intentionally staggering the PC release so that you get people who buy on the console and then buy it on the PC too. A one day release would have that portion of the user base buy only the PC version.\n\nIt also argues for charging $80 for the base version, and having a $100 version that has all of the exact data the base version has, but unlocks some arbitrarily gated content. You suppose Rockstar can do this and not think that staggering the PC release is lucrative?\n\nEvery other crossplatform AAA game releases on all platforms day one, including studios much smaller than Rockstar. This is an engine that already supports all of the current gen hardware, so it's not like it'd require a ton of new specific code RAGE doesn't already have. RDR2 is already out on PC with support all of the newest bells and whistles, including DLSS, and GTA V got a PC 'remaster', and obviously the game was no doubt primarily developed _on_ regular PCs, so a PC port of some sort has _always_ existed.\n\nThey _absolutely_ could've released on PC day one. It really defies logic to think otherwise."}, {"id": 50634582, "au": "maxglute", "dom": 383, "sr": 22, "sc": 6.27, "ep": 6.93, "bs": 0.0, "d": 4, "age": 18.23, "grav": 224.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3068, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 2.052, "fa": 0.28, "gp": 0.903, "bl": 0.0, "ds": 0.0, "txt": "There's a host of games where streaming input latency makes experience non starter versus the worst bugs. Those games happen to be blockbusters that push copies... i.e. basically every massively popular game except niche turn based operate on local neurological twitch speed since video games started. And lbh, any streaming turn base game/rpg is going to fucking die to local game with modding, especially now that it's easier than ever. Latency destroys fast-paced cloud, modding destroys slow-paced cloud, nvm infra costs, there's a reason game developers moved from arcade cabinets to home consoles despite rampant piracy."}, {"id": 50634076, "au": "ndriscoll", "dom": 422, "sr": 23, "sc": 6.2, "ep": 6.64, "bs": 0.0, "d": 6, "age": 18.89, "grav": 237.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.849, "fa": 0.34, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "Right, I'm in a similar boat. I couldn't tell you e.g. what movies have come out recently except for the one where the guy snapped away half the universe (which I didn't see; I've just seen it in meme images). I already inherited a \"complete\" (for me) music collection 20 years ago. I haven't even completed GTA 5! It's not like copies of these things are hard to find; I could be playing the OoT remake recomp right now, but I'm more interested in talking about the ethical non-issues around doing so.\n\nIt's precisely because I'm not a massive consumer that I see no reason to place this stuff on some pedestal, but I do see massive real harms to society that copyright causes, as it gets used by the legal system to allow hostile manufacturers to prevent people from exercising their rights to use and modify actual, tangible property that they own. Why the hell does my CPU have any built-in functionality to not obey me, the person who owns it? Why do products spy on the people who own them when obviously the owner does not want that? The system offers very little utility for what it sets out to accomplish, and carries large downsides. It's garbage. It deserves exactly as much respect as the system that imprisoned people for growing weed in their backyard for personal consumption."}, {"id": 50631231, "au": "ndriscoll", "dom": 425, "sr": 24, "sc": 6.19, "ep": 9.18, "bs": 2.54, "d": 7, "age": 21.97, "grav": 304.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 410, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "epistemic_gold", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.609, "fa": 1.23, "gp": 1.304, "bl": 0.96, "ds": 0.0, "txt": "Not allowed by whom? You're talking about character. I don't have to ask anyone. I decide whether I'm allowed to do something that affects only me.\n\nIt's not theft. They didn't steal anything. It's still there. If someone is, say, too poor to pay for the game, it is very obviously not immoral for them to copy it. It's literally conceding in the premise that there's no effect on anyone else; they couldn't have paid, so there is no counterfactual where they do. They should not participate in the wider culture because... why exactly? Some weird Puritan urge to deny oneself?\n\nMy point is, I don't need your consent. And, no, you don't need my consent to make a picture of my face. And you're conflating a bunch of things by saying I can't break into your home, e.g. your personal privacy or security. A better analogy would be if you put your cool picture on your front lawn and put up billboards all over town advertising that it's there.\n\nAnd not that it has any bearing on the moral argument, but not having restrictions would not eliminate motivation to create things. For example, GTA 6 made over 1.5 billion in pre-order sales. So, evidently, people were willing to front the money for them to develop it, and they could've e.g. sought patronage. In fact, in some sense, many microtransactions, which are now common and are part of e.g. GTA 5, are essentially just a form of patronage. So, t"}, {"id": 50638992, "au": "Johanx64", "dom": 169, "sr": 25, "sc": 6.11, "ep": 7.43, "bs": 0.0, "d": 2, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 17, "k": 410, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 2.007, "fa": 0.42, "gp": 1.046, "bl": 0.0, "ds": 0.0, "txt": "> While GTA is great, I think it is nowhere near one of the largest artistic endeavors ever undertaken.\n\nGTA... well, games in general are a sum total product of insanely long and complicated supply chain - just in getting hardware alone to that level - without all the software tools, asset authoring, etc taken into account.\n\nSo no, great cathedrals in Europe, unironically pale in comparison to the \"cultural artifacts\" modern video games represent to the full extent understanding everything involved to get to the end result.\n\nEspecially if you put in context that many of the advances in computer hardware (and GPUs) originally were closely tied to demand for better games, etc."}, {"id": 50639446, "au": "krzyk", "dom": 338, "sr": 26, "sc": 6.03, "ep": 7.57, "bs": 0.0, "d": 3, "age": 8.05, "grav": 63.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 3089, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.489, "fa": 0.96, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "It is.\n\nIf getting pirated version is easier than a normal one.\n\nI'm on PC, it is a bit hard to get a console only game. So I'm cheering for those people that do the porting (although I won't download it, I prefer to wait for PC version from Rockstar, and wait for sale to start, won't buy a $80 game unless it at least 50% off, just like I did with GTA V).\n\nDecade(s) ago it was harder to get PC games, one had to buy physical copies, look for stores that sell that particular game. Nowadays I go to Steam and I can buy it when I want (specifically during sale, unless it is a sure good game like Factorio+Space Age)."}, {"id": 50639290, "au": "ZenoArrow", "dom": 36, "sr": 27, "sc": 5.96, "ep": 7.5, "bs": 0.0, "d": 6, "age": 8.41, "grav": 67.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 88, "qw": 17, "k": 5299, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": ["https://icon-era.com/statistics/gaming-industry-revenue-statistics/"], "ig": 1.51, "fa": 1.04, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "> PC makes them less money\n\nNot by much:\n\nhttps://icon-era.com/statistics/gaming-industry-revenue-stat...\n\n> and costs more time to develop, due to the variety of hardware\n\nNot really. Most of the work to port to PCs would have already been done during development. PS5 and Xbox Series X/S are using PC components with a few tweaks (like unified memory), so the architecture is not vastly different. As for the variety of hardware, that's what the operating system, hardware drivers and libraries like Vulkan are for. PC developers don't run directly on the metal, they run on a software abstraction of that hardware. You don't have to test on every single hardware configuration that exists."}, {"id": 50638168, "au": "wincy", "dom": 403, "sr": 28, "sc": 5.93, "ep": 6.37, "bs": 0.0, "d": 8, "age": 11.51, "grav": 108.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 9275, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.389, "fa": 0.56, "gp": 1.043, "bl": 0.0, "ds": 0.0, "txt": "It really depends on the game. Slay the Spire 2 I was able to get a fully working copy on my iPhone Duo with QA in about 3 hours using Codex.\n\nMewgenics, which uses a custom flash animation and a bunch of C++ compiled custom engine code and has no Mac version, I got the tutorial mostly working after blowing through multiple resets.\n\nWhich is to say you’re absolutely correct. The problems are orders of magnitude apart depending on the game and how it was built."}, {"id": 50636069, "au": "techjamie", "dom": 33, "sr": 29, "sc": 5.92, "ep": 6.8, "bs": 0.0, "d": 6, "age": 16.12, "grav": 183.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.879, "fa": 0.0, "gp": 1.648, "bl": 0.0, "ds": 0.0, "txt": "It also isn't aided by the fact the P2P nature of their network stack allows for many more shenanigans than what is normally possible if only a single server is authoritative.\n\nEvery client in GTA/RDR2 online is some degree authoritative to the game state, which allows hackers to spawn all kinds of stuff or do eild things to people. (Like spawning an upside down los santos in the sky)\n\nI understand why you wouldn't want centralized computing simulating the NPC behavior and little fiddly bits of the game, but also it took them years to not expose every player's IP to the entire session for people to hit off/dox you when they get mad."}, {"id": 50630105, "au": "origini", "dom": 437, "sr": 30, "sc": 5.9, "ep": 6.34, "bs": 0.0, "d": 4, "age": 23.17, "grav": 332.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.452, "fa": 0.62, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "It seems you don't understand what character means.\n\nLet me explain this to you: \"Moral qualities and personality: The mental, ethical, or emotional traits that define how someone acts and what they value.\"\n\nSo basically you are not doing it for Rockstar, you are doing it for yourself.\n\nYou have Character by acting in every situation and not just random. Character is something you might have or not and if you have it, it doesn't matter if the other one is shit.\n\nIn this particular case, paying $100 for a game which seems well its price, is just normal to a person who has Character.\n\nDonald Trump for example doesn't has Character same as Elon Musk. They do random shit today and yesterday and tomorrow. Some people don't trust other people without character.\n\nMe for example, if someone giving me the wrong amount of money (+ or -) i will ask for correction. But i do this in both cases not just if its in the benefit of the other."}, {"id": 50634417, "au": "maxglute", "dom": 516, "sr": 31, "sc": 5.89, "ep": 7.14, "bs": 0.0, "d": 1, "age": 18.44, "grav": 228.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 3068, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.913, "fa": 0.62, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "People bitching about 30fps, try throwing input latency, there's very few once in a generation games worth hourly quarters over, especially as backlog only increases. Also lets be real, half the reason why rockstar games are blockbusters is value $/hr which moves copies -> gta online whales. Make base game proposition bad via hourly pricing or limited streaming time quotas, it effects funnel for the entire income chain. IMO we will see GTA go F2P like gotcha games (I mean online basically is one), before they try streaming."}, {"id": 50639865, "au": "chippiewill", "dom": 27, "sr": 32, "sc": 5.81, "ep": 7.35, "bs": 0.0, "d": 10, "age": 6.94, "grav": 51.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 1710, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.805, "fa": 0.62, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "No. Rockstar just don't like releasing on PC. It's a long-standing thing that originated from the porting process between platforms being tedious (each port used to be done by a separate company), but now continues to stand because if it releases on PC then people know they'll be able to pirate it so they don't even bother buying it on console.\n\nThen on GTA V Rockstar got really lucky with the timing and discovered it is incredibly lucrative to stagger platform releases as people buy multiple times. They managed to triple dip on PS3/Xbox 360, PS4/XBone and then finally PC release.\n\nWe usually hear about the exclusivity deals - for instance we heard about the deal Microsoft made to keep the GTA IV DLC exclusive to Xbox 360 for a while. I don't think the console makers would be able to negotiate a PC lockout anyway (to release on both consoles and not PC would require the console makers to be illegally coordinating)."}, {"id": 50629451, "au": "NDizzle", "dom": 291, "sr": 33, "sc": 5.61, "ep": 7.0, "bs": 0.0, "d": 0, "age": 23.87, "grav": 349.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2138, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.616, "fa": 0.28, "gp": 1.661, "bl": 0.0, "ds": 0.0, "txt": "I think two things need to happen quickly. Neither of them are good news for console manufacturers and game studios.\n\n1) First one to open up the console wins. If I wanted to install SteamOS on my old PS4Pro, I should be able to. This is going to happen whether it's officially allowed or not. Open it up.\n\n2) If you're making a game, something like a \"console exclusive\" becomes cannon fodder. The Zelda game that released 2.5 weeks ago runs on PCs already. You need to release on PC on the same date and give folks a happy path to buying the game and running it where they want."}, {"id": 50630737, "au": "ndriscoll", "dom": 423, "sr": 34, "sc": 5.59, "ep": 6.88, "bs": 0.85, "d": 5, "age": 22.48, "grav": 316.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 220, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.603, "fa": 0.62, "gp": 0.926, "bl": 0.32, "ds": 0.0, "txt": "Likewise, if I walk by your house and see your picture through your window, and I think it's awesome, I can just go draw my own copy, or describe it to someone else to make, or take them over to see and replicate, or whatever. Because it has no effect on you or anyone else, so there's no moral ground to stand on to argue that there's anything wrong with me doing that. It has nothing to do with character. You simply don't own concepts, and it's not theft to copy your drawing. The idea of owning something infinite is absurd, and in fact arbitrarily restricting something that is infinitely abundant is obviously immoral.\n\nAnd they didn't keep it in their basement. They put up billboards saying it's out there and made deals to to have people say it's the greatest thing ever and give it 100/100 reviews. People seeing what the fuss is about seems perfectly amoral to me, particularly when, again, Rockstar has specifically decided not to sell to them anyway.\n\nAs far as one's right to consume goes, playing video games is probably one of the least consumptive activities that you could do, especially in the late fall/winter where you would be heating your home with that energy anyway. I'd start with people eating meat long before I got to video games."}, {"id": 50635720, "au": "Morromist", "dom": 245, "sr": 35, "sc": 5.54, "ep": 6.5, "bs": 0.0, "d": 1, "age": 16.69, "grav": 194.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 26, "k": 699, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.488, "fa": 0.64, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": ">>>  I imagine it's going to lead to a future where games run some component on the cloud always so that they can't be decompiled and ported (and pirated)\n\nI think it depends on how much business the game companies lose on piracy. As it is now you can pirate nearly any game you want but they haven't moved their games onto the cloud yet, so why would this change things?\n\nI think what's stopping them is that most people just don't want to bother learning how to do piracy, its a big bother, especially for people know aren't good with computers. People who know how to pirate are few and out of them even fewer have such little money that its worth the time it takes to pirate everything.\n\nI venture to guess the amount rockstar loses from GTA 6 being pirated and the pirates not subseqently buying the game is probably in the 7 figures. Hardly worth the massive expense and trouble of making your game only avalable on the cloud to people who have fast internet connections."}, {"id": 50636429, "au": "mjmvisser", "dom": 121, "sr": 36, "sc": 5.53, "ep": 7.07, "bs": 0.0, "d": 4, "age": 15.53, "grav": 173.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 50, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.754, "fa": 0.34, "gp": 1.364, "bl": 0.0, "ds": 0.0, "txt": "I finally got around to playing GTA V last year (on Steam) and then felt nostalgic so bought GTA 4 too.\n\nGTA 4 was barely playable on PC without installing a bunch of mods. Like, 5 fps in the intro whenever the water was visible. The PC version also removes a lot of detail like grass that you can restore with a mod. Anyway, there’s a mod to restore the original music.\n\nI’m not arguing with you, the way music licensing works sucks. It’s not Rockstar’s fault though. They have to pay for music licenses every year and at some point it’s not worth it."}, {"id": 50633563, "au": "mikhmha", "dom": 218, "sr": 37, "sc": 5.32, "ep": 5.47, "bs": 0.0, "d": 1, "age": 19.35, "grav": 247.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 292, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.626, "fa": 0.34, "gp": 0.467, "bl": 0.0, "ds": 0.0, "txt": "I really want people to know that you cannot trust any information you read about this project online. It's mostly non-technical people overhyping crap they read on discord and X. You can't find much concrete information on the current technical challenges faced, progress, timelines. There is only hype announcements and enthusiastic gamers who will tell you the game will be playable on PC by the end of the hour/day/week/month. If you challenge this assumption you will be told that ocarina of time was recomped in a week. Maybe they're right. But I'm on the side of caution. Any video you see of the project is also fake. like 99% of them are fake or passing off ps5 gameplay"}, {"id": 50637231, "au": "qingcharles", "dom": 239, "sr": 38, "sc": 5.14, "ep": 5.59, "bs": 0.0, "d": 3, "age": 13.81, "grav": 144.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 12423, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.541, "fa": 0.34, "gp": 0.687, "bl": 0.0, "ds": 0.0, "txt": "Yes, the decryption keys are right there, if you could get them. They are stuffed away in secure enclaves on chips and buses that strongly resist your attempts to exfiltrate them.\n\nIt was funnier when I worked with Microsoft's Windows Media DRM in the early 2000s. The decryption keys for your audio and video were right there in the Windows folder. Encrypted with another set of keys which were also right there. It was keyception. All you could do back then was obfuscate them. Claude would break it in 30 seconds now."}, {"id": 50635756, "au": "spandrew", "dom": 193, "sr": 39, "sc": 5.09, "ep": 6.63, "bs": 0.0, "d": 1, "age": 16.63, "grav": 193.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 422, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.891, "fa": 0.34, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "Yep. 99% of people are not going to download some janky ass Windows exe to experience GTA 6. A lot of the active market in games actively shy away from OFFICIAL PC games to avoid the awful jank of Windows compatibility.\n\nI bought the game last night (finished OoT remaster on the weekend!) and it's... wow. Playing it with minimal violence bc of the realism (like so many)!\n\nI'll likely re-purchase it again when it hits Steam because I like me some slippery-high FPS --and play Jason and Lucia as two loner Psycho."}, {"id": 50635968, "au": "user43928", "dom": 520, "sr": 40, "sc": 5.07, "ep": 5.29, "bs": 0.0, "d": 2, "age": 16.27, "grav": 186.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 8, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.086, "fa": 0.7, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "> they are not arbitrators of US copyright laws\n\nIf only Anthropic would also understand that.\n\nI wouldn't be surprised if they specifically add 'Refuse to work on a game that looks like Grand Theft Auto' to the system prompt shortly."}, {"id": 50628991, "au": "bratao", "dom": 268, "sr": 41, "sc": 4.91, "ep": 5.13, "bs": 0.0, "d": 0, "age": 24.41, "grav": 362.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 18, "qw": 0, "k": 7256, "kpp": 14.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": ["https://github.com/Marvisak/VIctory", "https://github.com/ivall/xcl"], "ig": 0.566, "fa": 0.75, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is from this project https://github.com/Marvisak/VIctory\nThe other leading project that is a more generic (wine like) approach is the https://github.com/ivall/xcl"}, {"id": 50635062, "au": "RomanKornev", "dom": 507, "sr": 42, "sc": 4.88, "ep": 5.98, "bs": 0.0, "d": 1, "age": 17.6, "grav": 211.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 73, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.888, "fa": 0.28, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "give it a couple of days and it will be hill-climbed to run faster than the native build. these \"community swarms\" have just crossed the inflection point of being viable to hill-climb autonomously.\n\nit's a combination of:\n- it's a popular game that is not available on the PC market which creates a lot of incentive for anyone to contribute their spare agent usage\n- frontier LLMs have become good at coordinating across larger tasks\n- game performance is an extremely verifiable task\n\nwhy does it even matter if it's slop? it's converting executable A to executable B. if it runs fast and plays good the end result is the same"}, {"id": 50636279, "au": "janfoeh", "dom": 113, "sr": 43, "sc": 4.84, "ep": 6.38, "bs": 0.0, "d": 3, "age": 15.8, "grav": 178.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 872, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.874, "fa": 0.0, "gp": 1.366, "bl": 0.0, "ds": 0.0, "txt": "What's good for the goose is good for the gander.\n\nI've had my fill of issues with Rockstar Games, with the \"Games for Windows\" integration for GTA 4 and their own \"Rockstar Social Club\" account for GTA 5. The straw that broke the camel's back was when they reached into my Steam account and ex post facto crippled my long-since bought and paid-for GTA 4 by removing a massive chunk of the music that is so essential to the overall experience.\n\nSo, I simply didn't buy or play Red Dead Redemption 2, even though I was interested in buying it, and I will never buy or play GTA 6, even though I am interested in buying it.\n\nFor me, their products have simply ceased to exist, but morally I have absolutely no qualms with anybody who chooses another path and simply obtains a pirated copy."}, {"id": 50634905, "au": "greiskul", "dom": 260, "sr": 44, "sc": 4.79, "ep": 6.34, "bs": 0.0, "d": 3, "age": 17.8, "grav": 215.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 46, "k": 1385, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.645, "fa": 0.42, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "> This is ironic because he resells PC games (with a 30% markup), but the PC platform is plagued the most by piracy, suggesting that piracy is also caused by how easy it is. Until recently, it was impossible to pirate games for PS5, the most popular game console.\n\nDid people forget how the PC market was before Steam? Before Steam, when a new game came out, you would have to drive to a store to buy a disk. The disks might run out. The store might be far away. It might be some time where the store is just closed. While pirated software at the time, was just a torrent away. At any time. From home. There was a risk of malware, but there were hacker groups that had reputation.\n\nSteam killed this world. It made the legitimate way to play a game be easier than piracy. And all data we have suggests that it was a significant change. Hell, steam made it so easy to buy games, that game developers even have now sales of games where the customer never even plays the game. So many people report having games in their steam library that never got opened.\n\nAnd for the love of god industry, don't fall into this cloud gaming trap. If you make the legitimate play experience worse, to try to combat piracy, you will just be leaving money on the table because you will lose gamers.\n\nGTA 6 already is the most sold media of all time. I think that everybody that worked on it should be pretty happy right "}, {"id": 50637299, "au": "camcil", "dom": 189, "sr": 45, "sc": 4.77, "ep": 6.31, "bs": 0.0, "d": 1, "age": 13.6, "grav": 140.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 214, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.355, "fa": 0.34, "gp": 1.485, "bl": 0.0, "ds": 0.0, "txt": "I recently purchased a Series S to play a game with some friends and am surprised people don't talk about how utterly useless these consoles are anymore. On a 500GB console you're essentially dedicating it to a single game, maybe a second if it is small enough to fit. I bought an external drive, but you cannot even play games off of them - only use it as storage."}, {"id": 50636570, "au": "dividedcomet", "dom": 167, "sr": 46, "sc": 4.7, "ep": 5.58, "bs": 0.0, "d": 1, "age": 15.28, "grav": 168.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 124, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.619, "fa": 0.0, "gp": 1.227, "bl": 0.0, "ds": 0.0, "txt": "While GTA is great, I think it is nowhere near one of the largest artistic endeavors ever undertaken. Off the dome the great cathedrals of Europe were constructed over sometimes hundreds of years using expert craftsmen for almost every piece. I think it’s worth putting things in perspective a little."}, {"id": 50635569, "au": "wvenable", "dom": 332, "sr": 47, "sc": 4.7, "ep": 6.02, "bs": 0.0, "d": 3, "age": 16.91, "grav": 198.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 21431, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.696, "fa": 0.0, "gp": 1.405, "bl": 0.0, "ds": 0.0, "txt": "That's been proved to be not true.  Media piracy went down as soon as most media become available for a reasonable price and availability on streaming.  People who previously pirated media for free switched to paying.\n\nIt's actually pretty easy to beat free -- people will pay for convenience and reliability.\n\nAs streaming has gotten more expensive and more fragmented piracy is on the rise again.  As it becomes easier to pirate than to navigate a half dozen streaming services, people choose that instead."}, {"id": 50634684, "au": "vrmiguel", "dom": 482, "sr": 48, "sc": 4.7, "ep": 5.8, "bs": 0.0, "d": 2, "age": 18.11, "grav": 221.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 10, "k": 120, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.601, "fa": 0.42, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "> having the source code makes it a much more malleable experience\n\nThe community doesn't have the source code of GTA 6. They have a binary that runs on an Xbox. They're building the compatibility layer so that functions the game calls from Xbox's OS and graphics are implemented instead by regular Windows/Linux/MacOS syscalls and Vulkan for the equivalent graphics.\n\nThe only way that this differs from the eventual legit PC binary is that the PC release will most definitely have some sort of anti-cheat software that might block modifications, but if that gets cracked, then it's not any more or less malleable"}, {"id": 50633607, "au": "perching_aix", "dom": 264, "sr": 49, "sc": 4.6, "ep": 6.14, "bs": 0.0, "d": 1, "age": 19.31, "grav": 246.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 2994, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 2.017, "fa": 0.22, "gp": 0.531, "bl": 0.0, "ds": 0.0, "txt": "there's no current enough public xbox jailbreak sufficient to dump game files. drive is encrypted, files are encrypted. can't download games with outdated, potentially vulnerable firmware. supposedly might be possible to transplant downloaded games to older firmware units, but whether that yields decrypted files is unclear to me.\n\nconsoles are super bolted down, rough world out there.\n\nthe executable is from a dev build instead. dev mode or a dev xbox presumably allows for free file movement. how they gained and maintain access to the dev build, i don't know. dev xboxes are supposed to be permanently online and talking home to microsoft, otherwise they should be nonfunctional."}, {"id": 50635239, "au": "cubefox", "dom": 261, "sr": 50, "sc": 4.47, "ep": 6.01, "bs": 0.0, "d": 4, "age": 17.35, "grav": 206.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.407, "fa": 0.56, "gp": 0.762, "bl": 0.0, "ds": 0.0, "txt": "If there is mass piracy of GTA 6 on PC because of modern LLMs, they might determine that GTA 7 (or whatever game comes next) would be pirated even harder, and therefore do a cloud-only release. They may lose some gamers due to an increase in input latency, but they would gain many others who would have pirated the game otherwise.\n\nAnd their games are already pretty laggy anyway, so the increased latency wouldn't make that big of a difference."}, {"id": 50635207, "au": "justin_dash", "dom": 370, "sr": 51, "sc": 4.45, "ep": 5.99, "bs": 0.0, "d": 5, "age": 17.39, "grav": 207.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 193, "qw": 0, "k": 10, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.629, "fa": 0.34, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "The issue with your point on the console ecosystem is that consoles are being released at a much slower pace than before and AAA games are taking much longer to create. So even if deficit financing is one factor driving development, it is being overshadowed by the massive decline in competition we've seen in gaming basically since the 90s. Remember the console wars? That is all gone now.\n\nAlso, because there is far less competition now, most AAA games are not risky at all. So many gamers complain about games being the same thing over and over, and that's because there's no competition, no incentive to make something better. These companies are no longer fighting for their survival so they don't need to innovate, they just need to optimise for monetisation, which is exactly what's been happening for the last 20 years.\n\nAlso, this isn't just about console exclusivity. One of the hackers is doing what he's doing because Sony and others aren't releasing physical copies as much anymore. Everything is downloaded online, and you can't extract it. It stays on the cloud, etc. DRM is a big driver of the hacking and cracking scene."}, {"id": 50637951, "au": "smuhakg", "dom": 461, "sr": 52, "sc": 4.35, "ep": 5.45, "bs": 0.0, "d": 2, "age": 11.96, "grav": 115.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 121, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.71, "fa": 0.22, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "It's true for movies and TV shows. The streaming versions are encoded to a garbage bitrate to save bandwidth and movie fans pay a price premium to get it on Blu-Ray (or pirate the Blu-Ray rip).\n\nThe thesis for game streaming is that many customers will tolerate slop if it's cheaper and more convenient. Yet gamers haven't for unclear reasons."}, {"id": 50633535, "au": "rpdillon", "dom": 421, "sr": 53, "sc": 4.33, "ep": 5.88, "bs": 0.0, "d": 5, "age": 19.39, "grav": 247.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 284, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.916, "fa": 0.0, "gp": 0.947, "bl": 0.0, "ds": 0.0, "txt": "Ugh.  OK, I'm the guy in your story with character: I've run Linux since the 90s, and only play games that I can get DRM-free that I can play on Linux and that I buy personally with a Visa card from GOG. I was just talking to AI last night (trying to troubleshoot frame drops in Sleeping Dogs Definitive Edition) about how this led to a huge gap in my gaming knowledge -- games that were Windows-only simply didn't exist for me.  I do this with Denuvo DRM as well, even for games that I'm an absurd fan of. I just rewrite reality so the game that violates my guidelines is never even considered. It's not a question, but an answer, and the answer is \"No\".\n\nSo now I'm discovering all these games that I just missed out on (Sleeping Dogs is a good example). I got it for a couple of bucks a few days ago, and it's been great. What I'm trying to say is while the whole world plays GTA VI, I could not care less, and am instead immersed in this world from more than a decade ago in  Hong Kong.\n\nAnd finally, my point: from a business perspective, there is no difference in my legal, moral, ethical behavior and simply pirating GTA VI. The publisher doesn't know the difference, and the same amount of money exchanges hands.  To wit: pirating is only unethical if there was a scenario in which the person would pay.  I don't expect I'll ever pay (or play!) GTA VI; and in the case of people like me, pira"}, {"id": 50640660, "au": "user43928", "dom": 526, "sr": 54, "sc": 4.29, "ep": 5.73, "bs": 0.85, "d": 4, "age": 4.85, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.967, "fa": 0.0, "gp": 0.762, "bl": 0.32, "ds": 0.0, "txt": "That's a common argument in any comparison of SOTA models to cheaper alternatives.\n\nIn the same spirit, I can perhaps achieve the task without any AI assistance given twice the time of what it takes someone with DeepSeek.\n\nThis isn't currently an alternative to the SOTA models that deliver decent results on complicated work outside of my area of expertise near autonomously. This allows scaling to eg. 10 agents, or at least a single long running session, to handle a large volume of work."}, {"id": 50634423, "au": "avidruntime", "dom": 469, "sr": 55, "sc": 4.19, "ep": 5.29, "bs": 0.0, "d": 2, "age": 18.44, "grav": 228.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 196, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.914, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Game streaming gets a fraction of the market because the alternative of locally running is better by any measure but a game released only for streaming will not need to compete with local. Perhaps we'll see optimization efforts in novel delivery mechanisms similar to the effort put in getting GTA 6 to run on modern consoles. The assumption that everyone's network can keep up with the load is just a few skips away from the current assumption that everyone's wallet can keep up with the costs of buying consoles/hardware to run said game. Piracy alone wont be the impetus for this, but I fear that reverse engineering will. Its one thing if a small margin of the market is stealing their copy, its another thing entirely if the investment in a proprietary game engine can become totally sunk through reverse engineering and a few ship of theseus passes before unofficial distribution."}, {"id": 50639804, "au": "sandos", "dom": 179, "sr": 56, "sc": 4.19, "ep": 5.73, "bs": 0.0, "d": 5, "age": 7.09, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 679, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.144, "fa": 0.68, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "Sub? What kind of sub are people buying?\n\nI bought streaming hours since theyre is no sane reason for me to buy an extremely overpriced console at this time, but that is $0.2 / hour or so and not a subscription per se.\n\nBuying _the cheapest_ console able to play GTA6 would equate 2000 streaming hours in my country, btw."}, {"id": 50640479, "au": "rickdeckard", "dom": 9, "sr": 57, "sc": 4.19, "ep": 5.67, "bs": 0.0, "d": 5, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 10, "k": 4809, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.48, "fa": 0.42, "gp": 0.687, "bl": 0.0, "ds": 0.0, "txt": "> \"Delaying online is almost surely a commercial negative for the company.\"\n\nThat's an interesting aspect. The leaks a few months ago showed that Take2 is still making millions per month from GTA V.\n\nNow with the launch of GTA VI you may lose a bit of that revenue because your console players are also busy on GTA VI (having generated a billion USD to offset the loss of revenue though).\n\nBut you don't want to replace GTA V online with a less-stable GTA VI and burn that still-stable revenue-stream, so it makes sense to do pure engine bug-fixing with a single-player launch while finishing the online aspects of the game.\n\nIt's quite a beauty to observe what a development team can do when given proper time and resources..."}, {"id": 50637197, "au": "shoobiedoo", "dom": 114, "sr": 58, "sc": 4.19, "ep": 5.58, "bs": 0.0, "d": 4, "age": 13.9, "grav": 145.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 540, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.373, "fa": 0.34, "gp": 0.955, "bl": 0.0, "ds": 0.0, "txt": "Similar story here. I had bought GTA5 when it was on sale at some point and forgot about it. Never played it. A few years later I thought, \"why not?\" Installed it and loaded it up. The Rockstar launcher told me to log in, so I tried, but apparently I had used a previous or dead email account to register with Rockstar.\n\nNo problem, I thought-- I paid through Steam, I should be able to play through Steam. So I filed a ticket with Rockstar to change the associated email address. I got a very curt and disinterested reply, \"Sorry we can't do that.\"\n\nTried to refund through my Steam account as the playtime was close to 0 minutes. Nope, it wasn't a purchase made in the past two weeks, can't do that.\n\nFuck them. I'm going to torrent download GTA6 out of spite and play the hell out of it on PC."}, {"id": 50634888, "au": "thraway3837", "dom": 47, "sr": 59, "sc": 4.19, "ep": 5.38, "bs": 0.0, "d": 2, "age": 17.83, "grav": 216.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 260, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.451, "fa": 0.28, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": "As a complete newb to game software and hardware, may I ask why the 2 are different? Specifically, why is there platform specific differences, and why was the Xbox designed that way? Why could it not just be a general purpose gaming PC running Windows with a skin on top so people only interact with an Xbox UI, but then all the games would work between PC and Xbox without modification?\n\nAgain, note that I am a newb and being completely ignorant of the decisions that were made, so I am just curious, don't shoot the asker please."}, {"id": 50636086, "au": "keyringlight", "dom": 66, "sr": 60, "sc": 4.19, "ep": 5.29, "bs": 0.0, "d": 4, "age": 16.1, "grav": 183.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 550, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.11, "fa": 0.62, "gp": 0.633, "bl": 0.0, "ds": 0.0, "txt": "This is always in the back of my mind when there's an unofficial release of the hot new thing, a large number of people downloading a desirable application with lots of complexity to hide malware in with dubious origins is such a tempting target. Even if it's \"here's my tweaked version for +14% performance, extract over the main release\" you're going to get some taking the tasty bait."}, {"id": 50638467, "au": "randomaccountpe", "dom": 254, "sr": 61, "sc": 4.19, "ep": 7.81, "bs": 2.52, "d": 3, "age": 10.73, "grav": 97.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 4, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.854, "fa": 0.62, "gp": 1.163, "bl": 0.95, "ds": 0.0, "txt": "I mean to be honest, it kind of seems like you've taken in all the upsides to streaming, and ignored all the downsides and constraints.\n\nGames don't maintain good sales past the 1st year. You'd want billions a year in sales to justify running a data center purely for cloud streaming.\n\nGTA 5 didn't make most of it's money from selling the video game. So this automatically makes the argument of cloud streaming and piracy invalid.\n\nNot only that, but cloud streaming sucks anywhere that's not in the US. And most sales come from outside the US.\n\nIn most good areas in the world, it's like around 100ms gain in latency due to cloud streaming, and the experience is terrible. I don't think Xbox/Playstation would be willing to spend billions expanding GPU data centers just for video games, when there's like a thousand other more profitable use cases."}, {"id": 50634121, "au": "coldstreamflowi", "dom": 384, "sr": 62, "sc": 4.19, "ep": 7.79, "bs": 2.52, "d": 2, "age": 18.83, "grav": 236.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 14, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.78, "fa": 0.62, "gp": 1.271, "bl": 0.95, "ds": 0.0, "txt": "Its an idea that works on paper but fails in real life. It would end up excluding a lot of people simply due to the technical limitations of the whole pipeline. Input > send > render > encode > send > display is a long path that adds a lot of latency and that is in the best scenarios. Then it also means the providers take on the cost of running those servers. Yes, they would have a subscription service but I couldn't see it being cheap. Heck even Microsoft is struggling to keep the costs reasonable on this stuff and they offer only 15 hours a month streaming."}, {"id": 50633466, "au": "wpm", "dom": 377, "sr": 63, "sc": 4.19, "ep": 5.26, "bs": 0.0, "d": 1, "age": 19.45, "grav": 249.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3715, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.76, "fa": 0.9, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Rockstar has reportedly brought in around $4B in sales, compared to the rumored $1-2B budget for GTA VI."}, {"id": 50636902, "au": "ssl-3", "dom": 225, "sr": 64, "sc": 4.19, "ep": 5.25, "bs": 0.0, "d": 4, "age": 14.62, "grav": 157.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.404, "fa": 0.34, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "Way back then, the softmod I did involved splicing a MadCatz xbox extension cable to one with USB A.  This allowed the controller and its memory card to be connected to a PC, which in-turn allowed for placing downloaded saved-game files onto that memory card.\n\nOne special saved-game from a dark corner of the internet and a rented copy of an exploitable version of 007 later, and the xbox booted Linux from the xbox memory card and modded itself in a jiffy.\n\nNo opening up the console at all.  And as a bonus, the resulting cable allowed the controller to work with PC games.  :)"}, {"id": 50638867, "au": "pimeys", "dom": 215, "sr": 65, "sc": 4.19, "ep": 5.24, "bs": 0.0, "d": 2, "age": 9.67, "grav": 83.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7172, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.373, "fa": 0.34, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "Wait, can you tell more about the GPU failures? That's not good...\n\nI was thinking of getting a PS5 Pro and GTA 6 for Christmas, but the console is around 1600-1800 euros in Europe right now. I guess I just thank Sam Altman for this and get a Switch 2 and the OOT remake for one third of the price."}, {"id": 50636502, "au": "AuthAuth", "dom": 333, "sr": 66, "sc": 4.19, "ep": 5.12, "bs": 0.0, "d": 4, "age": 15.4, "grav": 171.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 822, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.36, "fa": 0.34, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "Media piracy went down because of multiple high profile cases prosecuting people  as well as a general reduction in personal computer use. If we look at gaming we can see some games have numbers as high as 30% of the players on pirated copies and thats with steam + regional pricing. There is also multiple studies that showing games getting cracked quickly or having no DRM lead
