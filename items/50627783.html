": 3, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.628, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Are you blaming them for losing your own disk?\n\nDid you not understand what was posted? Why would me losing my physical disc copy be a reason to pirate their game? I am saying I paid and bought for the game digitally and it disappeared forever - even after I returned to the original country it was purchased from.\n\nSo, I can hardly feel sorry for them nor do I feel I owe them something for downloading from an alternative source. Are you mad because a billion dollar corporation didn't get to make money? Too bad.."}, {"id": 50637600, "au": "janfoeh", "dom": 127, "sr": 159, "sc": 2.66, "ep": 2.66, "bs": 0.0, "d": 7, "age": 12.76, "grav": 127.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 872, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.866, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not unlikely I still have a physical box of GTA 4 somewhere in my attic.\n\nWould you like to take a guess whether this condition was spelled out in the terms and conditions when I bought this back then?\n\nWould you like to take another guess whether these terms and conditions where available to me in any even remotely reasonable manner before I paid for the product?"}, {"id": 50641107, "au": "npteljes", "dom": 279, "sr": 160, "sc": 2.66, "ep": 2.66, "bs": 0.0, "d": 1, "age": 3.77, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A pirate's choice is PC, so they release on more locked down platforms first, and then PC later so that they don't miss the market. PC is also the most diverse platform, with regards to hardware support.\n\nThis release strategy has worked for them in the past too."}, {"id": 50639828, "au": "torh", "dom": 16, "sr": 161, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 7, "age": 7.03, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 436, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.114, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This seems right. In Norway, PS5 (Pro?) went out of stock at the biggest online retailers just after release of GTA, and the prices on the used market is higher than retail."}, {"id": 50636921, "au": "janfoeh", "dom": 133, "sr": 162, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 5, "age": 14.57, "grav": 156.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 872, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.105, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For the amount of money the put into their GTA 6 advertising campaign just in the areas I was able to see, let alone globally, they could have bought every single music artist appearing in the game ten times over and kept them in cages for the rest of their natural lives.\n\nThey made and signed the licensing agreements. They decided that. It _very much_ is their fault."}, {"id": 50640625, "au": "monocasa", "dom": 89, "sr": 163, "sc": 2.58, "ep": 2.58, "bs": 0.0, "d": 3, "age": 4.92, "grav": 32.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 30108, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.096, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's a shader binary extension that's supposed to be for compute shaders and pipeline state objects previously compile on that system/driver that is possible to reuse with a little elbow grease."}, {"id": 50635991, "au": "Machado117", "dom": 233, "sr": 164, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 3, "age": 16.24, "grav": 186.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 63, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 1.004, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "You'd need specialized lab equipment and a lot of effort to extract them. A better option is to somehow get it to run unsigned code and dump the decrypted binaries but there’s no known exploit yet"}, {"id": 50634483, "au": "IncreasePosts", "dom": 479, "sr": 165, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 0, "age": 18.35, "grav": 226.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4249, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.959, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "At this cadence, I imagine GTA VI \"online\" will be released for PC before it comes out for the consoles. Maybe not custom missions, but at least to the extent that you can share the world with other players"}, {"id": 50637378, "au": "somenameforme", "dom": 19, "sr": 166, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 5, "age": 13.37, "grav": 136.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.637, "fa": 0.34, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "100% this. PC is going to end up getting modded, better performance, etc. You're going to have plenty of people pick it up on console + PC, but that would have only picked it up on PC if it was available on day 1."}, {"id": 50635526, "au": "dyauspitr", "dom": 231, "sr": 167, "sc": 2.53, "ep": 2.53, "bs": 0.0, "d": 2, "age": 16.97, "grav": 199.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 0.736, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "I still don’t understand though. The keys must be on the console already if it has to decrypt the encrypted drive and at the end of the day you need the decrypted compiled binary to actually run the game so it’s in there atleast at runtime."}, {"id": 50637406, "au": "left-struck", "dom": 107, "sr": 168, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 3, "age": 13.26, "grav": 135.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 704, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 1.058, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are you blaming them for losing your own disk? Or are you trying to criticise regional lockouts? I mean the latter is stupid, I don’t disagree, but it’s trivial to defeat for such an old game. None of that justifies piracy of the new game. I’d argue you’re morally completely ok to pirate GTA 3 but this has nothing to do with GTA 6."}, {"id": 50634693, "au": "zergrush", "dom": 519, "sr": 169, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 1, "age": 18.09, "grav": 221.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 94, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 0.515, "fa": 0.34, "gp": 0.208, "bl": 0.0, "ds": 0.0, "txt": "Is it published by somebody in the public and you don't know and Anthropic just grabbed it because it was on github? 100% legal and theres nothing Rockstar can do about it.\n\nAnthropic are they liable ? No because there was no way for them to know and they are not arbitrators of US copyright laws thats the job of dedicated government departments."}, {"id": 50637085, "au": "wolvoleo", "dom": 359, "sr": 170, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 3, "age": 14.2, "grav": 150.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 42, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 0.448, "fa": 0.42, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "> Most people will just buy the PC version when it's released because dealing with all of this stuff is a huge pain in the ass except for hobbyists. Joe and Jane off the street can barely use Excel, let alone clone a Github repository.\n\nThey won't need to. Once it's done someone will surely package it up and throw it in a torrent with an installer. I don't think this will be a barrier at all."}, {"id": 50636872, "au": "janfoeh", "dom": 154, "sr": 171, "sc": 2.46, "ep": 5.51, "bs": 3.05, "d": 6, "age": 14.69, "grav": 158.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 243, "qw": 0, "k": 872, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 1.885, "fa": 0.0, "gp": 0.746, "bl": 1.15, "ds": 0.0, "txt": "I think you've precisely identified one of the main mechanisms by which we have systematically been disenfranchised over the last few decades: by turning things into services, or even simply claiming something to be. From books via music to software and seat heaters in BMWs.\n\nWe've gone through a marvellous revolution, just a very short time ago: a significant part of the things humans can produce became infinitely duplicable at zero cost. And in almost every respect that matters, we somehow ended up worse for it. Ask your local library about the differences in lending between their physical issues and their \"digital editions\".\n\nAbout the only universal positives that have come out of this for society as a whole were made possible only by the hundreds of thousands of women, men and children who contributed to something for free, as a labour of love, be it Wikipedia or the Linux kernel or libraries of Creative Commons-licensed photos, and for which armadas of stubborn, clever people had to fight tooth and nail for them to be awarded the same kinds of protection commercial ventures had in the form of licenses.\n\nWe as a society have been so thoroughly and utterly fucked six ways to Sunday by concepts such as \"intellectual property\", and we are so far down the rabbit hole that every act against such a fundamentally lopsided system can only be considered justified civil disobedience"}, {"id": 50636277, "au": "torben-friis", "dom": 43, "sr": 172, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 2, "age": 15.8, "grav": 178.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 12153, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 1.044, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How publicly known are the Xbox apis?\n\nI've heard the claim online that, since Xbox is not currently a jailbreakable platform, this makes a recomp difficult (because the console's behavior can't be probed as easily).\n\nI now wonder how true that is though, since there has to be some access for Xbox devs."}, {"id": 50637520, "au": "SamuelAdams", "dom": 190, "sr": 173, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 2, "age": 12.99, "grav": 130.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 4877, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.634, "fa": 0.22, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "I think Xbox did a study a while ago and determined that most Xbox consoles only rotate between 2-4 games over a 3 month period, so a smaller hard drive at the time was recommended. However now that games have ballooned in size maybe their original estimate was a little conservative."}, {"id": 50633561, "au": "chocochunks", "dom": 221, "sr": 174, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 1, "age": 19.35, "grav": 247.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 412, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "xbox_release", "flbl": "Xbox & Release (Console)", "urls": [], "ig": 0.584, "fa": 0.0, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "Game consoles encrypt disks these days. Pulling the drive and dumping it is not enough. You need the keys. For Switch 2 and PS5 games it was possible because of jailbreaks which got control of the system and the keys. For Xbox Series consoles there is no jailbreak and no way for users to dump games. The leak was an unencrypted build so there was no need for keys and dumping."}, {"id": 50636668, "au": "micromacrofoot", "dom": 388, "sr": 175, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 3, "age": 15.08, "grav": 165.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 4803, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.684, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The gaming industry has pushed multiple failures in real life into reality already. The experience of massive day 1 patches is still awful for people with slow internet connections, for example.\n\nMark my words, they're already planning this with the current decomp wave."}, {"id": 50633627, "au": "m3kw9", "dom": 395, "sr": 176, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 1, "age": 19.3, "grav": 246.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 3504, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "streaming_game", "flbl": "Streaming & Game (Piracy)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "It bodes very well regardless, as long as they just basically do minimal of securing updates, make people wait for updates to get cracked. People like conveniences more than having to deal with crashes, bans, jail breaking.  Is like netflix, people will pay netflix rather than pirate."}, {"id": 50639189, "au": "chii", "dom": 341, "sr": 177, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 3, "age": 8.68, "grav": 71.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 20710, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.011, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "ever since the advent of steam being a good and \"low\" cost platform with games i want, i've found i haven't pirated much, if at all.\n\nit's only \"exclusive\" games that aren't on steam that i pirate (because i am not trusting another platform with my credit card).\n\nSo it is possible to beat free - you just have to provide a service that's worthy of being paid."}, {"id": 50643079, "au": "etiennebausson", "dom": 174, "sr": 178, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 316, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Cathedrals are not art, they do contain some art, but most of the construction price come from cutting, moving and stacking stone blocks.\n\nSome of that stone is carved, beautifully even if that's your thing, but most of a cathedral's cost come from it's size (which is there to display religious hegemony), not from its art.\n\nNow, the windows and furniture are art one and all, but they are a very small of the ticket price."}, {"id": 50637108, "au": "neya", "dom": 106, "sr": 179, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 2, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 18, "k": 14722, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "character_rockstar", "flbl": "Character & Rockstar (Copy)", "urls": [], "ig": 0.962, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "> Actually, you should buy the game if you play this port. Even if they never release a PC version.\n\nNo. My purchased GTA 3 copy disappeared from my collection without any intimation just because I moved countries. I don't owe them shit."}, {"id": 50640033, "au": "asimovDev", "dom": 518, "sr": 180, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 1, "age": 6.48, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 596, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_engine", "flbl": "Code & Engine (Game)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "Was code illegally obtained? From what I gathered it was only shaders , asset and the compiled .exe that was leaked. No source code in the leaks to my knowledge"}, {"id": 50630730, "au": "bathtub365", "dom": 310, "sr": 181, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 1, "age": 22.49, "grav": 316.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2066, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 0.9, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Opening up consoles to turn them into a general purpose computer gets them nothing. The average consumer who would buy a game console doesn’t care about this at all and giving up control of the storefront would cut off one of their main revenue streams."}, {"id": 50637361, "au": "fishtacos", "dom": 117, "sr": 182, "sc": 2.35, "ep": 3.94, "bs": 1.59, "d": 4, "age": 13.43, "grav": 137.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 545, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_steam", "flbl": "Games & Steam (Gta)", "urls": [], "ig": 1.272, "fa": 0.0, "gp": 0.654, "bl": 0.6, "ds": 0.0, "txt": "I don't like piling on when established facts are already obvious... but this one wasn't been mentioned so far:\n\nMy 3 purchased Android GTA games (GTA 3, San Andreas and Vice City) were turned into trials a while back. I don't know when it happened, only found out when installing them again. Went back to find the receipt because Google keeps a full history of purchases.\n\nI don't care enough to dispute it, it's just kinda shitty."}, {"id": 50635396, "au": "hamdingers", "dom": 85, "sr": 183, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 1, "age": 17.16, "grav": 203.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 17, "k": 3447, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.457, "fa": 0.34, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "> The game ships with raw RDNA 2 shaders, so the projects have to translate that to another format\n\nHypothetically, could someone with an RDNA 2 card skip this step? RX 6000 series GPUs or something like a BC-250"}, {"id": 50636790, "au": "brianhama", "dom": 64, "sr": 184, " /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
