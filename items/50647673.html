ood they serve at all - just generic looking high-resolution food photos.\n\nI avoid every restaurant with AI adverts because it just clashes with everything I like about going to small local restaurants"}, {"id": 50658145, "au": "seemaze", "dom": 439, "sr": 164, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 0, "age": 1.96, "grav": 11.9, "surf": 26.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1676, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.036, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "it would be ironic if the AI features within photoshop are the final nail in the coffin in it’s fight for relevance with AI coded photoshop replacements"}, {"id": 50657001, "au": "paulsutter", "dom": 422, "sr": 165, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 0, "age": 3.78, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 14095, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 0.414, "bl": 0.0, "ds": 0.0, "txt": "If your work or school doesnt let you use AI, you're NGMI. Your entire department will get plowed by a few individuals using the new tools. This will happen whether they are inside the company, or outside."}, {"id": 50653989, "au": "minimaxa", "dom": 463, "sr": 166, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 0, "age": 9.42, "grav": 80.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 96, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.019, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "You can downvote as much as you like, but they are all algorithms, spell check, AI, Photoshop, and video editing.\n\nWe are all using algorithms and being classists instead of understanding the mechanics of binary machines."}, {"id": 50656577, "au": "ordu", "dom": 58, "sr": 167, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 4, "age": 4.57, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 3285, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.66, "fa": 0.28, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "It is a bit different for non-native English speaker. I can see sometimes that my wording is bad, but can't find a way to improve it. In your native language you can write good enough, it is just a matter of effort you put into it, in a foreign language the amount of effort required may be like a year dedicated to improve your grasp of a language.\n\nJust take articles for example. In my native language there are no articles. I know the theory of how to use articles, but even to follow rules I need to consult with a dictionary sometimes (countable and uncountable nouns), while sometimes I can justify 'a', 'the' and the missing article, and then I have to resort to just guessing it, like I do most of the time in any case. Rules be damned. LLMs seem to be good at that. I mean, I can't judge by myself obviously, but they are pretty convincing and confident and I never heard about the use of articles as a sign of LLM generated text."}, {"id": 50653408, "au": "CaptainZapp", "dom": 250, "sr": 168, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 3, "age": 10.97, "grav": 100.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 9830, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a bit different if I conciously use an AI tool to generate a specific output to if it's just rammed into my face, when using a general purpose tool to create something.\n\nI absolutely detest when I take a photograph and the image is \"optimized\" with AI. Something which probably can't be avoided when talking pictures with my phone.\n\nThat's the reason why I still use a real camera for \"serious\" pictures."}, {"id": 50651482, "au": "throwaway2037", "dom": 221, "sr": 169, "sc": 2.43, "ep": 2.43, "bs": 0.0, "d": 4, "age": 15.88, "grav": 179.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 10, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.523, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The news merely republishes PR releases from corporations and governments.\n\nWow, this is a very cynical view of \"the news\".  No, the news is much more than that.  Ask anyone who works as a journalist what they think about your statement."}, {"id": 50649938, "au": "glimshe", "dom": 134, "sr": 170, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 3, "age": 19.66, "grav": 253.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.026, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Photography is a full art form and we've had people taking amazing photos (and plenty of bad ones too) since the invention of cameras. When going to museums, I tend to prefer seeing photography to painting/illustration."}, {"id": 50653876, "au": "stackbutterflow", "dom": 44, "sr": 171, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 5, "age": 9.72, "grav": 83.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1237, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.024, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI is breaking the chain of trust. We trust a human made translation.\n\nThinking about it using an LLM to translate or polish your text is like explaining your paper in great detail to someone and having this person produce a translated or polished text. For some reason we trust more a rewrite done by someone who's looking at the source material while doing it than someone who's listening to an explanation of it."}, {"id": 50656078, "au": "QuantumNomad_", "dom": 56, "sr": 172, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 6, "age": 5.46, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.023, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yep, those kinds of problems do tend to happen.\n\nThat’s why I was careful to say things like “compared to an idealized translation”. And also why I tend to keep the language simple in messages I write for an LLM or other tool to translate.\n\nI guess the good thing about the shortcomings of LLMs as translators, if there is one, is that at least the professional translators won’t be out of a job quite yet."}, {"id": 50653955, "au": "markus_zhang", "dom": 127, "sr": 173, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 2, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.674, "fa": 0.0, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "I think one way to show authenticity is to link the online image to its original image. You can even use AI to process the image as long as it still fits the meaning of original image IMO."}, {"id": 50652134, "au": "aktuel", "dom": 458, "sr": 174, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 0, "age": 14.09, "grav": 148.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 297, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.595, "fa": 0.0, "gp": 0.642, "bl": 0.0, "ds": 0.0, "txt": "Classical case of humanity wanting to have their cake and eat it too. Everything needs to be AI now. You don't use AI? Are you living in the stone age? But god forbit any of that shiny AI touches anything. Everything needs to change but everything needs to be the same as always."}, {"id": 50657013, "au": "napaparts", "dom": 19, "sr": 175, "sc": 2.32, "ep": 4.84, "bs": 2.52, "d": 3, "age": 3.75, "grav": 23.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 2, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.392, "fa": 0.34, "gp": 0.412, "bl": 0.95, "ds": 0.0, "txt": "I usually prompt it with \"fix only obvious mistakes\" to clear up misused terms, articles etc, since I am not a native English speaker. And then I use Meld (shows side-by-side diff) to handpick any changes back to my original document. This way it's much better than a regular spell checker, but won't affect my style. Most models also introduce different kinds of errors, so just blindly accepting wouldn't work either.\nOn the other hand getting a \"70% chance of being AI\" might be a compliment on using the language well."}, {"id": 50654795, "au": "vorticalbox", "dom": 234, "sr": 176, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 2, "age": 7.62, "grav": 58.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1629, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.982, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree, the nice AI tools on iOS are really awesome allowing you to reframe the image or expend it, use AI to remove things.\n\nas my wife says \"but that its not the picture it took\""}, {"id": 50650437, "au": "thakoppno", "dom": 141, "sr": 177, "sc": 2.31, "ep": 3.15, "bs": 0.85, "d": 4, "age": 18.59, "grav": 231.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 3, "k": 572, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "> darken that face\n\nThat’s an allusion to the OJ mugshot on Time, Newsweek right?\n\nMy larger point is that photographers made choices subsequent to the moment captured on film. Exposure to light and chemicals in the darkroom could lead to different results."}, {"id": 50650690, "au": "defrost", "dom": 280, "sr": 178, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 3, "age": 18.02, "grav": 220.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.978, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For the counterpoint, not a single one of the hundred odd that I semi regularly exchange email / messages with do this."}, {"id": 50659366, "au": "jayd16", "dom": 237, "sr": 179, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 2, "age": 0.1, "grav": 3.8, "surf": 62.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 14948, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.973, "fa": 0.0, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "Being disliked doesn't mean that it is not used widely.  No one likes ads but they are abundant.\n\nIn fact, are we talking about anything other than advertisements?  Isn't that the bulk of public-facing AI image usage?"}, {"id": 50657138, "au": "fortran77", "dom": 460, "sr": 180, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 0, "age": 3.56, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 41175, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "NY Times manipulates the truth in all sorts of ways without AI. They're only pretending to take the high road here."}, {"id": 50652425, "au": "watwut", "dom": 70, "sr": 181, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 4, "age": 13.25, "grav": 134.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.97, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you go through that translation, fix innacuracies, remove those annoying AI fluff etc, then provide the polished version."}, {"id": 50654009, "au": "womble2", "dom": 182, "sr": 182, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 4, "age": 9.37, "grav": 79.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 56, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.953, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why would you need to add noise to swamp out the low bits? Surely just shifting it down to an 8bit RGB image and then getting a non-watermarking model to touch it up after upping the bit depth would do the job."}, {"id": 50651237, "au": "makeitdouble", "dom": 432, "sr": 183, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 16.54, "grav": 191.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 14485, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "Having a \"no AI\" mode in PS and LR would go a long way.\n\nIt's the same issue with photo contests, where contestants should be allowed to basic edits but keep it all within a defined perimeter."}, {"id": 50652687, "au": "pbalau", "dom": 330, "sr": 184, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 3, "age": 12.63, "grav": 125.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 938, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.942, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem with AI slop is not the AI part, but the slop part. Your Valentino image looks like someone left some expensive looking trash by the side of a wall and somehow there are lasers too. The AI is not the problem in that image, incidentally, the first image it generated for you is a much better take."}, {"id": 50650615, "au": "defrost", "dom": 398, "sr": 185, "sc": 2.2, "ep": 3.05, "bs": 0.85, "d": 3, "age": 18.2, "grav": 223.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.298, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I don't, I'm not in the game. I'm aware that it's been a documented hot debate since almost the beginning of film though - and the source of some friction between photographers and photo/story editors since the inclusion of images in broadsheets."}, {"id": 50654677, "au": "fireflash38", "dom": 249, "sr": 186, "sc": 2.2, "ep": 2.2, "bs": 0.0, "d": 4, "age": 7.84, "grav": 61.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1108, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.934, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's very age based too, which matches my experience. It reminds me of early photoshop: older people got fooled very easily by it. They did not realize what they were looking at was not real."}, {"id": 50651173, "au": "thrw045", "dom": 310, "sr": 187, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 4, "age": 16.74, "grav": 195.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.699, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Yeah I do understand this. The thing is, I feel like my \"soul\" is still in these images even if I didn't skillfully create every part of it. There is something amazing about a human who has amazing skill at creating something and we have to acknowledge that.\nBut how I see AI is that if you put your ideas and your own taste into the images, you push the AI to do what you want and you don't stop working on the image until it fits your taste, then you have put something of yourself into the image.\n\nThe AI automates away most of the hard parts, but at the same time it enables so much in that you can create almost anything you can imagine. This could be powerful even for artists who have a lot of skill in the traditional sense. I don't know what the limits are yet but I feel like if traditional artists embraced AI and combined their skill+taste and used AI in a creative way there could be amazing results."}, {"id": 50658480, "au": "marcosdumay", "dom": 245, "sr": 188, "sc": 2.15, "ep": 2.15, "bs": 0.0, "d": 6, "age": 1.47, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.821, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "A restaurant publishing a photo of their food that isn't actually a photo of their food is a completely different issue from some generic \"using AI to make a poster\".\n\nIf it's not actually fraud where you live, you still should treat it like that. And that's completely independent of they using AI or not, it's not a new practice."}, {"id": 50649920, "au": "usef-", "dom": 383, "sr": 189, "sc": 2.11, "ep": 2.11, "bs": 0.0, "d": 2, "age": 19.69, "grav": 254.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 907, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.899, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That doesn't seem to be an issue here, though? Anyone moving off adobe for this reason presumably doesn't want the AI parts. And is likely not averse to paying for tools if needed."}, {"id": 50657310, "au": "andsoitis", "dom": 213, "sr": 190, "sc": 2.11, "ep": 2.11, "bs": 0.0, "d": 1, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "One idea would be to eschew these kinds of edits that are there to try and perfect an image.\n\nAuthenticity resonates. Authenticity sells. Embrace it. Use AI for other things, not for tuning superficial perfection. Just an idea."}, {"id": 50656086, "au": "bmurphy1976", "dom": 4, "sr": 191, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 3, "age": 5.44, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 2521, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.517, "fa": 0.0, "gp": 0.609, "bl": 0.0, "ds": 0.0, "txt": "In the future I suggest asking AI to make recommendations or critique the doc, not rewrite.  That's usually my goto, especially when I want to preserve my own voice and understanding."}, {"id": 50649653, "au": "jkahrs595", "dom": 484, "sr": 192, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 4, "age": 20.2, "grav": 265.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 303, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "they just pretend not to when they comment I guess\n\nBecause I can't help but agree that a vibe coded app is not the same as an app that outputs AI generated content."}, {"id": 50653976, "au": "dmos62", "dom": 192, "sr": 193, "sc": 2.03, "ep": 2.03, "bs": 0.0, "d": 2, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 6379, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.864, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Tangential: think of cryptocurrencies what you will, but it's great how they've introduced so many people to the potential of cryptography. Not sure if a blockchain is the right tool here, but cameras could definitely sign pictures. It would still be a DRM'esque fight against the tide, imo."}, {"id": 50650259, "au": "gerdesj", "dom": 82, "sr": 194, "sc": 2.03, "ep": 2.03, "bs": 0.0, "d": 3, "age": 18.97, "grav": 239.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 8040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Of course people will use tools to do something new!   We are the tool using  and story telling apes.\n\nThe world is twisting and turning just as much as it always has and we all have to keep up.  The important thing is how you react to change and I think you should allow your initial skepticism to be informed by reality and then adjust and perhaps embrace.\n\nOne of my business partners insists on sending me some emails that are ... enhanced.  I simply delete them - I can tell them immediately due to several obvious tells - he never used to use textual formatting and they are too long.\n\n@@&$ AND IT MAKES ME WANT TO BITE THE HEADS OFF }}{{: fzzzt ...\n\n... sorry bit of a tic there.  He'll get the message eventually or if he is really clever, he'll get Claude to fake his persona, badly.\n\nI think tools are for using and not to get too whizzed up over."}, {"id": 50650787, "au": "WarmWash", "dom": 251, "sr": 195, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 3, "age": 17.81, "grav": 216.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.448, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I know 100 people who don't notice or at least don't say anything, and 2 people who very vocally point out every single image that is or could be AI."}, {"id": 50653720, "au": "zdc1", "dom": 403, "sr": 196, "sc": 2.0, "ep": 2.0, "bs": 0.0, "d": 1, "age": 10.16, "grav": 89.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": , "bl": 0.0, "ds": 0.0, "txt": "What does \"AI manipulated\" mean? Is it defined in terms of the mathematical functions that may be applied to an image? Are convolutions allowed (e.g. Gaussian blur) but MLPs not?"}, {"id": 50648878, "au": "krapp", "dom": 489, "sr": 200, "sc": 1.92, "ep": 1.92, "bs": 0.0, "d": 3, "age": 21.51, "grav": 294.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It does though, does it not?. One of its primary selling points is providing a server to allow any action to be driven by AI agents. This makes it impossible to validate that any image generated by the software didn't use AI, because any aspect of it could."}, {"id": 50655264, "au": "andai", "dom": 274, "sr": 201, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 1, "age": 6.75, "grav": 49.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "It's weird because I'm quite pro-AI, and I still get the instinctive cringe/revulsion when something seems AI generated. The writing is just painful to read.\n\nIt's a shame, because as another commenter pointed out, an enormous amount of original thought and effort can go into the process, but if the final pass is done by GPT, it just sounds like ass.\n\nI'd rather read broken English, or illiterate English, as the case may be."}, {"id": 50648661, "au": "tetraodonpuffer", "dom": 201, "sr": 202, "sc": 1.83, "ep": 1.83, "bs": 0.0, "d": 2, "age": 21.85, "grav": 301.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 2015, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.779, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "if they stick a model in camera raw to \"improve noise\" then you're already contaminated even before going to any editing tools"}, {"id": 50657384, "au": "zzzeek", "dom": 39, "sr": 203, "sc": 1.76, "ep": 1.76, "bs": 0.0, "d": 4, "age": 3.13, "grav": 19.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 13015, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.411, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "please provide evidence\n\n(seriously, this is being claimed all over the place.  evidence is exactly zero)"}, {"id": 50656293, "au": "estebank", "dom": 47, "sr": 204, "sc": 1.74, "ep": 1.74, "bs": 0.0, "d": 8, "age": 5.04, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 6213, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.738, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A human made translation might be missing double entendres, or nuance or introduce nuance that wasn't there in the original text. Translations are full of decisions, even the simplest being whether to use one word or another which might have slightly different implications. That's even without getting into wordplay and contextual jokes. I've seen some amazing efforts to get them to work. Others fall flat.\n\nThink of Hodor in Game of Thrones, and how your translate that scene to Spanish, French, Chinese, etc...\n\nYou can also have a translator introducing nuance that might not have been there initially, or have to make decisions on how to resolve them. The Argentinian movie El Secreto De Sus Ojos had its title translated to The Secret In Their Eyes, but the original \"sus\" could mean \"his\", \"her\" or \"their\". At different points of the movie you could interpret the title to mean any if the three, although I'm fairly certain the main intended meaning is \"his\", for plot reasons. Minor thing, but very simple example of the kind of things that come up in a single sentence."}, {"id": 50650260, "au": "happytoexplain", "dom": 340, "sr": 205, "sc": 1.72, "ep": 1.72, "bs": 0.0, "d": 2, "age": 18.96, "grav": 239.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 11797, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.645, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "You should try not to characterize the imagined other-side in some multi-faceted topic as caricatures (\"[those people's] arguments, which are invariably parroted variations of the same few lines\"). While there are plenty of irrational people out there, cherry-picking them to portray a whole set of people is low-quality, and belongs only in typical internet bickering."}, {"id": 50651395, "au": "thrw045", "dom": 323, "sr": 206, "sc": 1.72, "ep": 1.72, "bs": 0.0, "d": 6, "age": 16.11, "grav": 183.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.731, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well first off what did you think of the images I posted? I don't think they look like the usual mashup look.\n\nAnd second you can easily move past the training data by providing your own reference images. The AI has a generalized understanding of art and can assemble things in any way you want. That's where I think traditional artists can work from - they can use their own art and have the AI work with it. No mashup or training data look. You still need the ideas though which has to come from inside.\n\nAlso I agree we are not in need of more quantity. I create maybe a couple images per week depending on how many ideas I have. I think any image that looks good on its own is a good thing, regardless of how much else is out there. We have to go on an image by image basis. No good image is too much IMO."}, {"id": 50655376, "au": "watwut", "dom": 46, "sr": 207, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 7, "age": 6.55, "grav": 47.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.389, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I definitely trust more to human made translation. They are much more pleasurable read whereas what comes out of AI tend to be slopified."}, {"id": 50654970, "au": "WarmWash", "dom": 253, "sr": 208, "sc": 1.7, "ep": 1.7, "bs": 0.0, "d": 5, "age": 7.32, "grav": 55.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.383, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The gallup poll directly brings up the topic when asking people, whereas day to day people don't seem to be thinking about it much"}, {"id": 50653381, "au": "nicce", "dom": 204, "sr": 209, "sc": 1.69, "ep": 2.89, "bs": 1.19, "d": 3, "age": 11.02, "grav": 101.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 6, "k": 6091, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.718, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> That's orthogonal to the parent's point.\n\nI don't think so. If the quality of the screenshot is good enough, it defeats the complaint and problem entirely on getting social death by labels."}, {"id": 50649806, "au": "kamk3", "dom": 461, "sr": 210, "sc": 1.63, "ep": 4.15, "bs": 2.52, "d": 0, "age": 19.93, "grav": 259.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.55, "fa": 0.0, "gp": 0.351, "bl": 0.95, "ds": 0.0, "txt": "I was a bit bored and decided to ask Gemini what it thought of Adobe's future in the face of AI. At first it regurgitated Adobe's own corporate spiel, every citation being from Adobe themselves. I then asked it for unbiased sources, and in so many words it basically said \"oh yeah nah they're screwed.\"\n\nNot to imply Gemini is any authority, I just thought it was a funny exchange."}, {"id": 50657076, "au": "pbalau", "dom": 388, "sr": 211, "sc": 1.63, "ep": 1.63, "bs": 0.0, "d": 1, "age": 3.65, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 938, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.693, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think they want to prevent rejecting all images in a set if the photographer used the wrong tool."}, {"id": 50652996, "au": "dan_grec", "dom": 393, "sr": 212, "sc": 1.6, "ep": 1.6, "bs": 0.0, "d": 2, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 104, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.68 y", "urls": [], "ig": 0.247, "fa": 0.0, "gp": 0.96, "bl": 2.1, "ds": 0.0, "txt": "The issue is where to draw the line, it's not really as clear cut as presented."}, {"id": 50658400, "au": "munk-a", "dom": 13, "sr": 355, "sc": -3.6, "ep": 1.57, "bs": 5.17, "d": 5, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.667, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Sometimes - my unpolished writing style just so happens to aligned with a lot of the markers for AI.  It's quite frustrating to enjoy a semi-conversational written style and have that suddenly become verboten.  I now truly vibe with Micheal Bolton (from Initech - not the one that sucks)."}, {"id": 50657922, "au": "thaumasiotes", "dom": 102, "sr": 356, "sc": -3.63, "ep": 0.75, "bs": 4.37, "d": 5, "age": 2.33, "grav": 14.0, "surf": 14.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 24762, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.317, "fa": 0.0, "gp": 0.0, "bl": 1.65, "ds": 0.0, "txt": "Brightness and contrast are both \"a minor edit to the colors\", which is what we're informed specifically isn't allowed."}, {"id": 50654977, "au": "danilocesar", "dom": 258, "sr": 357, "sc": -3.64, "ep": 1.53, "bs": 5.17, "d": 2, "age": 7.3, "grav": 55.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 656, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.627, "fa": 0.0, "gp": 0.04, "bl": 1.95, "ds": 0.0, "txt": "This is interesting.\n\nWhat I see in Canada are people organizing boycotts against local coffeeshops because they dared to use AI for a flyer or their menus, instead of hiring a local artist.\n\nI work with several associations in a niche and tbh is a bit tiring to see all the flyers and every announcement all looking exactly the same. But do I actually care? Not at all."}, {"id": 50655905, "au": "11101010010001", "dom": 248, "sr": 358, "sc": -3.64, "ep": 0.6, "bs": 4.24, "d": 5, "age": 5.72, "grav": 39.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 32, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.256, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Your filter is so arbitrary, which is exactly what marketers live for."}, {"id": 50650102, "au": "techjamie", "dom": 150, "sr": 359, "sc": -3.64, "ep": 1.53, "bs": 5.17, "d": 4, "age": 19.3, "grav": 246.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 776, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.65, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "I have a 2022 sedan. When I got stuck and needed to pull it a few feet, I couldn't find a hook spot that didn't feel flimsy.\n\nOpened up the owner's manual, flipped to the page about towing. It was 2 paragraphs explaining if you need to tow your vehicle, call a tow service and they'll know what to do.\n\nThanks. I'm not sure why you took the time to write anything at all."}, {"id": 50654815, "au": "Kwpolska", "dom": 352, "sr": 360, "sc": -3.66, "ep": 1.91, "bs": 5.57, "d": 2, "age": 7.57, "grav": 58.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 5611, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 0.0, "bl": 2.1, "ds": 0.0, "txt": "I believe the LibreOffice project does not want  AI contributions.\n\nAnd I guess they're happy with Calc being stuck on Excel 97 feature parity."}, {"id": 50654776, "au": "Loughla", "dom": 243, "sr": 361, "sc": -3.67, "ep": 1.49, "bs": 5.17, "d": 4, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 15020, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.635, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "For me it really depends on what the company is.\n\nAI \"actors\" in television commercials? I'll never buy from that company.\n\nLocal family owned restaurant makes a plainly AI flyer? Zero impact on my opinion of the place.\n\nLike most things, I think context is key."}, {"id": 50651490, "au": "throwaway2037", "dom": 336, "sr": 362, "sc": -3.68, "ep": 0.56, "bs": 4.24, "d": 1, "age": 15.86, "grav": 179.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 14, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.127, "fa": 0.0, "gp": 0.181, "bl": 1.6, "ds": 0.0, "txt": "> Vanishingly few people _enjoy_ encountering generative AI in images or sounds in the wild.\n\nHow would normies know if the content if AI generated?  Most people cannot tell."}, {"id": 50655420, "au": "vidarh", "dom": 52, "sr": 363, "sc": -3.69, "ep": 1.47, "bs": 5.17, "d": 5, "age": 6.48, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 46991, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.627, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "The publishing industry is not incentivised to care about whether something is good, but about whether something is marketable.\n\nThey will care about Pangram exactly as long as enough of their audience cares about what Pangram says to the extent that it risks a PR fallout if they don't catch it first.\n\nEvery book where people need Pangram to tell them whether or not it is AI because the book itself is good enough to pass will chip away at the number of people who cares until it stops being useful.\n\nOnce that happens, they'll still use AI to analyse manuscripts, but to gauge quality, not whether or not there's AI writing in it."}, {"id": 50651687, "au": "thrw045", "dom": 327, "sr": 364, "sc": -3.73, "ep": 1.44, "bs": 5.17, "d": 4, "age": 15.38, "grav": 170.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.614, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "OK that's fair, I see what you mean. Traditional fragrance ads typically just have a handsome guy in them. These aren't really meant to be ads in the traditional sense. I was simply trying to create what I considered interesting compositions in their own right, without thinking about how effective they would be as actual ads.\nI personally like the style but I can see how others wouldn't. Also I know the work that went into some of them so I appreciate them more for that reason. I had to push my own idea creation by doing a lot of thinking for coming up with ideas so that also colors my view of them and why I view AI the way I do."}, {"id": 50650985, "au": "totetsu", "dom": 335, "sr": 365, "sc": -3.73, "ep": 1.44, "bs": 5.17, "d": 1, "age": 17.27, "grav": 205.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 4439, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.485, "fa": 0.0, "gp": 0.206, "bl": 1.95, "ds": 0.0, "txt": "I am reminded of the Mitchell & Webb skit about the the Foley artist who uses his own genitals for all the sound effects. Maybe he can get some satisfaction from making these things in private, but most people don't want to be subjected to listening to it."}, {"id": 50658106, "au": "michaelscott", "dom": 17, "sr": 366, "sc": -3.74, "ep": 1.42, "bs": 5.17, "d": 6, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 948, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.606, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "It helps expression of learning, which is not the same thing. I know many people who understand their topic deeply but cannot articulate what they know simply. That doesn't mean they don't have \"polished thinking\" insofar as it relates to learning, because a man who can carve a sculpture but cannot explain how is still able to carve the sculpture. The skill of writing well is completely orthogonal to the skill of the task at hand (unless that also happens to be writing)"}, {"id": 50659103, "au": "kbelder", "dom": 298, "sr": 367, "sc": -3.75, "ep": 0.63, "bs": 4.37, "d": 3, "age": 0.46, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 3218, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.266, "fa": 0.0, "gp": 0.0, "bl": 1.65, "ds": 0.0, "txt": "They may need to clarify they're talking specifically about the enlightened people of the West Coast."}, {"id": 50651785, "au": "retwakm4", "dom": 343, "sr": 368, "sc": -3.77, "ep": 0.47, "bs": 4.24, "d": 3, "age": 15.13, "grav": 166.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 8, "qw": 0, "k": 56, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.2, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Me too. Let's go back to boring world."}, {"id": 50655504, "au": "beepbooptheory", "dom": 426, "sr": 369, "sc": -3.78, "ep": 0.46, "bs": 4.24, "d": 1, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 0, "k": 2688, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.197, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "The archive link is working! Maybe on your end?"}, {"id": 50655273, "au": "nonethewiser", "dom": 26, "sr": 370, "sc": -3.82, "ep": 0.42, "bs": 4.24, "d": 5, "age": 6.73, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 0, "k": 9120, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.179, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Absolutely, just very tedious to do for a larger work."}, {"id": 50653116, "au": "egorfine", "dom": 158, "sr": 371, "sc": -3.83, "ep": 1.34, "bs": 5.17, "d": 3, "age": 11.67, "grav": 110.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 10, "k": 3705, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.569, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "> generally frowned upon on press work\n\nNot really. All press guidelines explicitly allow using those for specific cases.\n\n> healing brush wasn't generative\n\nWell yes but actually ... yes. We use \"generative\" meaning neural network models, but healing brush quite literally generated pixels. But that's nitpicking. The point stands."}, {"id": 50651507, "au": "Aurornis", "dom": 68, "sr": 372, "sc": -3.85, "ep": 1.32, "bs": 5.17, "d": 2, "age": 15.8, "grav": 178.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.406, "fa": 0.0, "gp": 0.254, "bl": 1.95, "ds": 0.0, "txt": "Actual language translation is a valid use case for LLMs, but posting the original writing along with the ChatGPT output is always better than posting ChatGPT output under their own name.\n\nIn every case where I’ve seen someone get called out for using ChatGPT who later followed up with their own words, their own words were better to read. Even if it’s broken English or just bullet points. You don’t realize how much the author’s tone, pacing, and rough edges convey until it’s all been smoothed away by AI.\n\nIt’s also very revealing to see what the author knows and what they don’t, or what they find valuable to include or omit. ChatGPT likes to try to fill in the gaps to make the prose acceptable to a broad audience, like a press release. It erases a lot of signals about what the author knows and injects things they maybe didn’t know or didn’t think were important, which muddies the conversation."}, {"id": 50650171, "au": "Suppafly", "dom": 89, "sr": 373, "sc": -3.88, "ep": 0.36, "bs": 4.24, "d": 3, "age": 19.17, "grav": 243.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 5, "k": 2779, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.154, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": ">This sounds like a good thing?\n\nOnly if you don't understand how digital photography works."}, {"id": 50655275, "au": "mathgeek", "dom": 59, "sr": 374, "sc": -3.88, "ep": 1.28, "bs": 5.17, "d": 4, "age": 6.73, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 3967, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.463, "fa": 0.0, "gp": 0.136, "bl": 1.95, "ds": 0.0, "txt": "It’s the construing of “native” with “formal expert”. We each speak our own variation of language, which is not identical to the formal language it is closest to. That is intrinsic to language by definition."}, {"id": 50654193, "au": "officehero", "dom": 286, "sr": 375, "sc": -3.88, "ep": 1.28, "bs": 5.17, "d": 4, "age": 8.88, "grav": 73.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 140, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Supply-demand. Personal anecdote: I don't care whether something is AI generated or not - the real principal factor is quality. To me, neither AI drama nor Netflix live up to the requirements I have for something that I'd be willing to watch on a screen. So in a binary sense they're the same to me."}, {"id": 50651886, "au": "duskwuff", "dom": 186, "sr": 376, "sc": -3.91, "ep": 1.26, "bs": 5.17, "d": 5, "age": 14.85, "grav": 161.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 22989, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.537, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Hard to say for certain without more technical details, but what I've been told is that the watermark is so "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 4457, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.391, "fa": 0.0, "gp": 0.0, "bl": 3.2, "ds": 0.0, "txt": "+1\n\nI have noted that several phones use OCR to clarity text, especially when using digital zoom."}, {"id": 50653077, "au": "QuantumNomad_", "dom": 54, "sr": 424, "sc": -7.57, "ep": 2.76, "bs": 10.34, "d": 4, "age": 11.75, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 275, "qw": 52, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.718, "fa": 0.0, "gp": 0.74, "bl": 3.9, "ds": 0.0, "txt": "I think the point is that the non-native speaker wrote the whole report by hand perfectly in their own language. And used the LLM only for translation.\n\nIf you speak English natively, but write poorly, and have an LLM fix your writing then there is more room for the LLM to insert its own interpretations and so on into the report, compared to an idealized translation that would only translate words and grammar, while preserving the original contents of the writing near 100% the same meaning as it had.\n\nOf course in the real world with a long document, I wouldn’t necessarily trust that an LLM would make the translation without inserting new ideas or interpretations somewhere.\n\nAnd indeed sometimes you see people on HN for example that get called out for obvious LLM written comments. And they respond saying like “sorry English is not my native language, I use the LLM to translate for me”. But their writing is so obviously LLM that I wonder if they are completely honest about how they are using the LLM or not.\n\nI myself also use LLMs to translate between other languages sometimes, but not for writing comments on HN. And I feel like I must be using the LLM differently than these other people do.\n\nFor example, I might say:\n\n> Translate to Spanish: He had an excellent time in the forest today. They looked at different bugs and leaves, and he ate almost all of the food he had with him."}, {"id": 50651459, "au": "throwaway2037", "dom": 176, "sr": 425, "sc": -7.6, "ep": 1.81, "bs": 9.41, "d": 4, "age": 15.93, "grav": 180.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 0, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.436, "fa": 0.0, "gp": 0.54, "bl": 3.55, "ds": 0.0, "txt": "Yikes.  Eight hours for a forty second final video?  Please tell me this isn't real."}, {"id": 50651464, "au": "raincole", "dom": 266, "sr": 426, "sc": -7.61, "ep": 1.0, "bs": 8.61, "d": 4, "age": 15.92, "grav": 180.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.426, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "Yeah, Asian people's opinions are culturally endemic. Surely a balanced, non-racist take..."}, {"id": 50651383, "au": "sam1714", "dom": 104, "sr": 427, "sc": -7.64, "ep": 0.58, "bs": 8.21, "d": 6, "age": 16.14, "grav": 184.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 12, "qw": 0, "k": 209, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": ["https://michaelyingling.com/random/calvin_and_hobbes/search.php?phrase=17+september+1992"], "ig": 0.246, "fa": 0.0, "gp": 0.0, "bl": 3.1, "ds": 0.0, "txt": "So is framing [1]. It seems journalists should be forced to use 360 cameras.\n\n[1] https://michaelyingling.com/random/calvin_and_hobbes/search...."}, {"id": 50650232, "au": "happytoexplain", "dom": 203, "sr": 428, "sc": -7.71, "ep": 0.9, "bs": 8.61, "d": 2, "age": 19.02, "grav": 240.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 11797, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.383, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "There are many ways to deceive. That's orthogonal to the parent's point."}, {"id": 50659153, "au": "JDups", "dom": 7, "sr": 429, "sc": -8.15, "ep": 1.26, "bs": 9.41, "d": 3, "age": 0.38, "grav": 4.7, "surf": 8.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 113, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.526, "fa": 0.0, "gp": 0.019, "bl": 3.55, "ds": 0.0, "txt": "LLMs have these specific mannerisms in how they construct phrases, your \"Claudish\" and whatnot, because their training resulted in them having a preference for those phrasings. If you ask it to polish your writing it's probably going to change your writing to to be closer to what it's internals believe is good writing, so it's going to make it look more AI written."}, {"id": 50648962, "au": "croes", "dom": 485, "sr": 430, "sc": -8.15, "ep": 0.46, "bs": 8.61, "d": 3, "age": 21.39, "grav": 291.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 25736, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.197, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "If it’s a clone of Photoshop that’s exactly what ArtCraft is"}, {"id": 50653308, "au": "reacweb", "dom": 72, "sr": 431, "sc": -8.2, "ep": 2.13, "bs": 10.34, "d": 2, "age": 11.19, "grav": 103.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 2178, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.573, "fa": 0.0, "gp": 0.543, "bl": 3.9, "ds": 0.0, "txt": "Yes. My two last comments were flagged. IMHO, the only reason for flagging was the fact that I used chatgpt to translate my ideas from french to english. My english is bad and I use more and more AI for my technical writing (never without a deep review) in english."}, {"id": 50655679, "au": "vidarh", "dom": 73, "sr": 432, "sc": -8.23, "ep": 2.1, "bs": 10.34, "d": 3, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 46991, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.896, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "On one hand, I'll say I find some of the attitudes to AI translations pretty silly. I think they're generally just fine.\n\nOn the other hand I feel a lot of non-native English speakers devalue their own language skills.\n\nLooking at your past comments, trust your English more. It's good.\n\nThe main problem I spotted is the occasional odd word order [1] and tenses [2]. Those are polish. You'll find lots of English speakers who write far worse English than you - they'll just make different mistakes.\n\nThis is a common thread with people on HN that admit to having used AI translations. Their non-AI translated comments are typically perfectly readable.\n\nI sometimes catch myself making exactly the same types of mistakes as you, but my native language is Norwegian, and it agrees with English on word order and tenses more often than French does, so I luck out a bit there.\n\n[1] An example from your comments: \"Is there somewhere a technical description [...]\" where idiomatic English would be \"Is there a technical description somewhere [...]\".\n\n[2] Example: \"Between 1994 and 1999, I have worked with Ada on Vax machines\". Native English speakers would use simple past tense for intervals if the two clauses are connected. So \"Between 1994 and 1999, I worked with ...\" While you get the best results by learning the specific situations where English uses perfect present tense, my impression is tha"}, {"id": 50651528, "au": "Aurornis", "dom": 80, "sr": 433, "sc": -8.25, "ep": 2.09, "bs": 10.34, "d": 3, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.888, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "This is what my teacher friends say they’re seeing: Submissions with impeccable prose and structure beyond the student’s abilities, but then obvious fake typos are injected in an attempt to make it appear human written.\n\nThe contrast between a perfectly smooth and researched essay and then random letters inserted at predictable intervals to pretend to be typos is comical. Like a child whose face is covered in chocolate denying they stole from the cookie jar."}, {"id": 50656131, "au": "opengrass", "dom": 424, "sr": 434, "sc": -8.25, "ep": 0.0, "bs": 6.89, "d": 0, "age": 5.35, "grav": 36.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 4, "qw": 0, "k": 730, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": -0.95, "fa": 0.0, "gp": 0.603, "bl": 2.6, "ds": 0.0, "txt": "thethingy cs6 is clean."}, {"id": 50651480, "au": "raincole", "dom": 289, "sr": 435, "sc": -8.32, "ep": 2.02, "bs": 10.34, "d": 3, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.77, "fa": 0.0, "gp": 0.144, "bl": 3.9, "ds": 0.0, "txt": "You severely underestimate how common and popular AI-generated dramas in China. \"Severely underestimate\" here is a severe understatement. There are several series with more than 1,000 episodes[0]. AI videos are not that cheap to produce either. If they're not profitable, they would have stopped burning tokens already.\n\nGiven how ubiquitous AI-generated media there is, I fully expect the sentiment to flip in 2027, though - Chinese people would be very fed up with AI and the west would be more accepting.\n\n[0]: two-minute-long episodes."}, {"id": 50656633, "au": "brookst", "dom": 16, "sr": 436, "sc": -8.35, "ep": 1.19, "bs": 9.54, "d": 5, "age": 4.46, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.507, "fa": 0.0, "gp": 0.0, "bl": 3.6, "ds": 0.0, "txt": "Polishing writing is polishing thinking. Thinking is important to learning.\n\n“You don’t understand a complex subject until you can explain it simply” and all that. Sharpening language skills really does help learning."}, {"id": 50653002, "au": "julian_t", "dom": 30, "sr": 437, "sc": -8.42, "ep": 1.92, "bs": 10.34, "d": 4, "age": 11.92, "grav": 114.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 454, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.482, "fa": 0.0, "gp": 0.54, "bl": 3.9, "ds": 0.0, "txt": "If I get something I wrote translated into, say, French by a human translator, does that mean that they authored it? Seems to me that if the original thought is still there, the LLM did an equivalent translation job.\n\n(And 'authored' is a horrible word. What's wrong with 'wrote'?)"}, {"id": 50650587, "au": "EA-3167", "dom": 263, "sr": 438, "sc": -8.43, "ep": 1.11, "bs": 9.54, "d": 3, "age": 18.25, "grav": 224.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 5730, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.473, "fa": 0.0, "gp": 0.0, "bl": 3.6, "ds": 0.0, "txt": "You could swap “burning coal” in for “AI” and nothing would change on your post. The lack of concern that’s culturally endemic in some parts of the world isn’t an endorsement of telling people in THIS part of the world to suck it up."}, {"id": 50655791, "au": "jakelazaroff", "dom": 55, "sr": 439, "sc": -8.52, "ep": 1.81, "bs": 10.34, "d": 5, "age": 5.9, "grav": 41.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 61, "k": 16594, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.772, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "> If you speak English natively, but write poorly, and have an LLM fix your writing then there is more room for the LLM to insert its own interpretations and so on into the report, compared to an idealized translation that would only translate words and grammar, while preserving the original contents of the writing near 100% the same meaning as it had.\n\nIf you're writing at like a fourth grade level (as your example is) then sure, it won't be hard to find a mechanical translation. When you write for adults, you'll find words with no direct equivalents, idioms, figures of speech and many different writing techniques that may or may not be important.\n\nFor example, a simple English sentence might be \"I must have missed your message.\" Claude translates this as \"Se me debe haber pasado tu mensaje.\" Even if that is a direct translation, it's missing the alliteration in the original English sentence. If that's an important quality of the original text, the translator needs to make their own creative choices."}, {"id": 50656775, "au": "nkurz", "dom": 75, "sr": 440, "sc": -8.53, "ep": 1.8, "bs": 10.34, "d": 4, "age": 4.23, "grav": 26.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 54471, "kpp": 9.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.768, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "Alternatively, assume that you were trying to learn a language well.  Which strategy do you think would be better:\n\n1) Use a tool that provides you with native speaker level equivalents of what you write, study them to internalize, then publish.\n\n2) Write at your own sub-native speaker level, check on your own, and then wait for feedback from native speakers after it's published.\n\nI'd be more worried that the second approach would lead to a plateau where early learning errors are reinforced and never fixed.  Used appropriately, and AI seems like it could be a tremendous improvement."}, {"id": 50654000, "au": "markus_zhang", "dom": 261, "sr": 441, "sc": -8.54, "ep": 1.79, "bs": 10.34, "d": 3, "age": 9.39, "grav": 79.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.763, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "I have many Chinese friends and I do start to see some people worried about their future and their kids’ future. It’s not as dandy as /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
