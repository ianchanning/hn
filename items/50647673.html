destroyed with the blurring.\n\nSo the method only works if you are a bad actor, basically, who doesn't care about fidelity or quality. There's not really a white-hat use case for the attack.\n\nidk if that's a good thing or a bad thing, but its a thing."}, {"id": 50649789, "au": "jhoho", "dom": 386, "sr": 71, "sc": 3.93, "ep": 4.88, "bs": 0.0, "d": 0, "age": 19.95, "grav": 259.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 392, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.367, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I know a European press agency that moves away from Photoshop because they don't want to risk getting hit by AI tags.\n\nI assume that eventually Adobe will make it a feature and come up with a version of or plugin for Photoshop with a verification system that avoids this."}, {"id": 50648638, "au": "mortify", "dom": 470, "sr": 72, "sc": 3.93, "ep": 4.84, "bs": 0.0, "d": 0, "age": 21.89, "grav": 302.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 149, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.775, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "Photoshop has always had the ability to make changes to photographs that violate NYT policies. Photographers are forbidden from posing, altering, or interfering with news scenes. They may only perform minimal cropping and color adjustments necessary for accurate reproduction.\n\nThis sounds more like anti-AI posturing than an attempt at improving journalistic integrity."}, {"id": 50652953, "au": "jillesvangurp", "dom": 459, "sr": 73, "sc": 3.93, "ep": 4.82, "bs": 0.0, "d": 1, "age": 12.05, "grav": 116.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 324, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.685, "fa": 0.0, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "There's a lot of hysteria around this topic right now. But the reality of course is that people are spending billions per month on AI tokens and usage keeps on growing rapidly. Which means that people are already exposed to lots of AI, whether they like it, appreciate it, or are aware of it at all. It's the new normal.\n\nYou can look at past technological shifts and the mass hysteria that came with those to get an idea of how these things tend to play out over time.\n\nWhether it's the presumed corrupting influence of television, the effects of train travel on women, or whatever. People don't like change, it upsets them and they try to rationalize their dislike of change. But then they adapt and most of the critics might grumble for a bit but eventually they shut up. Or they simply die out. You get the generations before and after.\n\nWith AI, my simple observation is that most of the people complaining the loudest tend to be a bit older. I'm in my fifties, and I get to hear a lot of whining on this topic from my friends and colleagues that are the same age. I also work in a place with a lot of people well below 30 and it seems that they by and large are embracing this as the new normal. I'm trying to stay mentally flexible on this front and am well aware of my own limitations as I get older.\n\nAlso, millennials (the generation that came after me) are getting on a bit. They are no lo"}, {"id": 50656692, "au": "SecretDreams", "dom": 18, "sr": 74, "sc": 3.93, "ep": 4.82, "bs": 0.0, "d": 5, "age": 4.36, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1508, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "They are impossible to decouple.\n\nWriting coherently and effectively goes hand and hand with learning. The OP example is effectively cheating and they outsourced a portion of their learning and thinking to the AI.\n\nIf the OP felt their thoughts were clean, they could have submitted the draft rather than the AI version. There's obviously reasons why they did not do that.\n\nIt takes real mental effort to go from draft to readable text. The more the OP farms this out, the more they will struggle with communication. This will eventually impact comprehension, since there's generally a loop in terms of how the two attributes grow."}, {"id": 50649236, "au": "dodger-dog", "dom": 226, "sr": 75, "sc": 3.93, "ep": 4.8, "bs": 0.0, "d": 2, "age": 20.95, "grav": 281.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": -5, "kpp": -0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.334, "fa": 0.34, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "Yeah, and it doesn't even help them because it is a waste of time. Why hasn't the NYTimes come out with a personal edition for me generated by AI. They could do so many things that could add real value above and beyond what I can have my own agents do everyday, but instead, they are reversing course and disallowing Photoshop.\n\nWhen did they start touching up the images of the reporters and people they interview favorably for stories? Was it the 1950's? Do you ever look at the magazines in the grocery check out line? Do those look like real photos to you?"}, {"id": 50647702, "au": "rmason", "dom": 430, "sr": 76, "sc": 3.93, "ep": 4.74, "bs": 0.0, "d": 0, "age": 23.19, "grav": 332.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 48320, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.087, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "I predict that a majority of U.S. newspapers will follow the NY Times lead.  So will Adobe now publish a news photographers version of PhotoShop?"}, {"id": 50651104, "au": "0x20cowboy", "dom": 295, "sr": 77, "sc": 3.93, "ep": 4.6, "bs": 0.0, "d": 1, "age": 16.96, "grav": 199.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 713, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.25, "fa": 0.34, "gp": 0.479, "bl": 0.0, "ds": 0.0, "txt": "I agree. My personal proclivity towards AI things (not that it means much of course) is that using AI as a tool (or to generate a tool) as part of some grand vision doesn’t bother me - be it a coding assistant, the background removal tool, concept art generation, an AI mastering tool / vibed VST plugin or whatever.\n\nBut when I look at / listen to / read 100% completely generated things, they just kind of exist. And that’s about it."}, {"id": 50653673, "au": "ThinkBeat", "dom": 402, "sr": 78, "sc": 3.93, "ep": 4.5, "bs": 0.0, "d": 0, "age": 10.32, "grav": 91.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 4550, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.975, "bl": 0.0, "ds": 0.0, "txt": "Sadly with Creative Cloud, it tends to keep pushing updates. \nI think you can go install one major version behind the newest \nversion but not much beyond that. \nHope I am wrong."}, {"id": 50650309, "au": "TheOtherHobbes", "dom": 170, "sr": 79, "sc": 3.93, "ep": 4.43, "bs": 0.0, "d": 1, "age": 18.85, "grav": 236.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 28534, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Photoshop sometimes tags AIGen in the metadata. You can edit that to remove the tag.\n\nSo far as I know, SynthID only works on images generated by Google, not by Firefly.\n\n(I just tried it on a Firefly image and Gemini said \"I can't tell.\")"}, {"id": 50650246, "au": "zhivota", "dom": 236, "sr": 80, "sc": 3.93, "ep": 4.4, "bs": 0.0, "d": 1, "age": 18.99, "grav": 239.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 1611, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.257, "fa": 0.0, "gp": 0.996, "bl": 0.0, "ds": 0.0, "txt": "I don't see this at all in Asia. People generate AI signs for their businesses, government flyers and posters are AI, people share funny videos, there seems to be no stigma around it among the general population.\n\nThere are some hipster type pockets who are very clear they are only human art, which is fine but honestly seems mostly to attract foreign tourists and westernized wealthy locals.\n\nI think people overall really overestimate the level of opinion having among normal people about things like this. The people you see discussing things on the Internet are very much not representative."}, {"id": 50650034, "au": "cromka", "dom": 453, "sr": 81, "sc": 3.93, "ep": 4.36, "bs": 0.0, "d": 0, "age": 19.42, "grav": 248.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 4605, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.328, "fa": 0.0, "gp": 0.852, "bl": 0.0, "ds": 0.0, "txt": "Notably the problem here is the new Photoshop's implicit AI usage.\n\nI don't know who runs Adobe these days but DAMN if they thought smuggling AI in otherwise previously predictably deterministic functions wouldn't backfire."}, {"id": 50649895, "au": "dmix", "dom": 490, "sr": 82, "sc": 3.93, "ep": 4.26, "bs": 0.0, "d": 4, "age": 19.74, "grav": 255.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 44, "k": 44116, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.217, "fa": 0.42, "gp": 0.14, "bl": 0.0, "ds": 0.0, "txt": "You could technically make a fork of [open source photo editor] for journalists which turns those features off. Particularly the image metadata part which is causing issues for NYTimes.\n\n> It’s not always clear which tools in Adobe’s apps are AI-powered, and even some older options like automated selection tools may now be considered part of the AI suite. This can lead to photos ending up with metadata indicating they were edited with AI"}, {"id": 50652860, "au": "guitarlimeo", "dom": 314, "sr": 83, "sc": 3.93, "ep": 4.23, "bs": 0.0, "d": 7, "age": 12.29, "grav": 120.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 25, "k": 639, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.2, "fa": 0.42, "gp": 0.147, "bl": 0.0, "ds": 0.0, "txt": "Those are commercials? They are well done and work as commercials but I don't see any artistic intention (the way the parent comment was talking about) behind them, or happy mistakes as Bob Ross likes to call them.\n\n> Taste is what makes an artist persist through struggling time and never giving up, even when the going gets rough and things aren't working out.\n\nNo actually, it's perseverance, skills and caring about making art. There are lots of art aficionados who have an impeccable taste in curation, but lack the skills or will to do anything. Then there are artists who have the skills and perseverance, but not the taste. It gets interesting when these two worlds combine.\n\nWith AI art, you commission an artificial artist, and if you have good taste, you can get good results if you curate well enough. But that road doesn't contain the struggle that defines art."}, {"id": 50652630, "au": "tornikeo", "dom": 338, "sr": 84, "sc": 3.93, "ep": 4.22, "bs": 0.0, "d": 1, "age": 12.75, "grav": 127.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 14, "k": 471, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.173, "fa": 0.42, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "> Vanishingly few people _enjoy_ encountering generative AI in images or sounds in the wild.\n\nYou are absolutely wrong, lol. At least look at statistics. Most of Asia absolutely LOVES brainrot. It's just a loud annoying minority that have made it their life's purpose to spoil the fun for creators (mostly because they are butthurt).\n\nLook up the stats before forming opinion."}, {"id": 50650464, "au": "squidsoup", "dom": 389, "sr": 85, "sc": 3.93, "ep": 4.21, "bs": 0.0, "d": 0, "age": 18.53, "grav": 230.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1668, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Why would any journalistic photographer use Photoshop in the first place? I would have thought any kind of manipulation of an image, AI or otherwise, would be considered unethical."}, {"id": 50653441, "au": "OtherShrezzing", "dom": 373, "sr": 86, "sc": 3.93, "ep": 4.18, "bs": 0.0, "d": 1, "age": 10.87, "grav": 99.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 3326, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 0.398, "bl": 0.0, "ds": 0.0, "txt": "Though it's been done for decades, I'm not sure it has been fine for decades. Culturally people have always had an expectation that a photograph was a static record of reality, unless it was explicitly (or obviously inferably) modified. So in the case of the New York Times, which is a paper of record, healing an image in photoshop is the same thing as misquoting an interviewee.\n\nCulturally, and especially when describing news media photography, to describe an image as \"photoshopped\" is to describe it as a mischaracterisation."}, {"id": 50649033, "au": "gertop", "dom": 356, "sr": 87, "sc": 3.93, "ep": 4.13, "bs": 0.0, "d": 1, "age": 21.27, "grav": 288.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 444, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.536, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The only meaningful competitor to Photoshop was Affinity Photos. They've moved away from single payment. The core is now free and the rest is a subscription.\n\nNobody is moving to LibreOffice but euro-office (which is onlyoffice laundered to remove the Russian origin) might see real adoption."}, {"id": 50651550, "au": "johnnyanmac", "dom": 345, "sr": 88, "sc": 3.93, "ep": 4.08, "bs": 0.0, "d": 2, "age": 15.71, "grav": 176.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 12, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.994, "fa": 0.42, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": ">most normal people enjoy the good stuff that comes out of it.\n\nThis is like saying that people enjoy the good games on Steam. That does not invalidate that there's a vast ocean of slop to wade through that consumers were complaining about before AI. And as of the last Steam Next Fest, it's actively shown to be impacting users' experiences."}, {"id": 50655441, "au": "999900000999", "dom": 334, "sr": 89, "sc": 3.93, "ep": 4.06, "bs": 0.0, "d": 1, "age": 6.44, "grav": 46.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 7271, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.277, "fa": 0.34, "gp": 0.061, "bl": 0.0, "ds": 0.0, "txt": "Good. We should all push back on AI in the arts. The other day someone posted a thread with AI slop “beats”.\n\nUpon a closer look they didn’t make one of two slops to prove out their process. Instead they uploaded about 60 slops straight to streaming services.\n\nWhich is probably the biggest issue I have . As an amateur musician I can maybe make a beat in an hour or so. It might take 5. Maybe 50 depending on if I want to get something just right.\n\nThe slop uploader spends 30 seconds and then slops up the whole internet.\n\nBack to Adobe. They should make a separate application with all this AI crap. Have people who really want to use it download it separately.\n\nThe stock market likes the word AI. Every company is now an AI company, stocks magically go up.\n\nMaybe it’s time for Gimp to shine."}, {"id": 50652236, "au": "miki123211", "dom": 99, "sr": 90, "sc": 3.93, "ep": 4.04, "bs": 0.0, "d": 7, "age": 13.84, "grav": 144.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.559, "fa": 0.0, "gp": 0.262, "bl": 0.0, "ds": 0.0, "txt": "The fact that you've chosen to take that photo in the first place has a bias unto itself.\n\nImagine your job is to document how rampant crime is in your city. If you're trying to prove a point, you might choose to go to a place where there is plenty of black shoplifters, or to one where there is plenty of white men harassing young women. If you post 20 photos of the same crime and say \"doesn't this make you wonder whether <race> people should be allowed to wander our streets\", that's bias, even though all 20 of those photos are unedited and depict real crimes."}, {"id": 50649880, "au": "nostrademons", "dom": 169, "sr": 91, "sc": 3.93, "ep": 4.03, "bs": 0.0, "d": 1, "age": 19.77, "grav": 256.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 85143, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.006, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I wonder how this interacts with Pixel phone cameras, where the image has been enhanced by AI before it ever ends up on disk.  For a large swath of consumer electronics, there's no such thing as an unadulterated, un-AI-enhanced image anymore."}, {"id": 50649865, "au": "dmix", "dom": 486, "sr": 92, "sc": 3.93, "ep": 4.0, "bs": 0.0, "d": 4, "age": 19.8, "grav": 256.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 44116, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.308, "fa": 0.0, "gp": 0.642, "bl": 0.0, "ds": 0.0, "txt": "The article isn't about not using Photoshop, it's using newer Photoshop versions that potentially uses generative AI without you knowing (which is a risk for journalists publishing photos).\n\nI don't know if PhotoCraft does that or not by default (never used it and it seems to be open source), but that's the main question here in finding an alternative."}, {"id": 50651384, "au": "Mobius01", "dom": 384, "sr": 93, "sc": 3.93, "ep": 4.0, "bs": 0.0, "d": 3, "age": 16.14, "grav": 184.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 661, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.542, "fa": 0.0, "gp": 0.256, "bl": 0.0, "ds": 0.0, "txt": "Fair point, but I see two possible issues on the subject - the AI capabilities are optionally enabled via a subscription, but are embedded in the tools, and that could have poor optics; and we don’t know where Canva is taking this. They could very well add free AI features to entice users towards a subscription.\n\nI feel there is a growing void for OSS tools to fill here."}, {"id": 50653738, "au": "t0bia_s", "dom": 125, "sr": 94, "sc": 3.93, "ep": 3.95, "bs": 0.0, "d": 2, "age": 10.12, "grav": 89.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2191, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.331, "fa": 0.0, "gp": 0.563, "bl": 0.0, "ds": 0.0, "txt": "How JPG format define that image was not edited? Cameras nowadays has LUTs support, Fujifilm's has many options for JPG look, etc. It's not that hard do terrible edit in camera as in post-production software."}, {"id": 50649428, "au": "e40", "dom": 408, "sr": 95, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 2, "age": 20.64, "grav": 274.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 12261, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.51, "fa": 0.0, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "I've followed the project on github.  It's got a lot of activity and a lot of contributors.  Yes, it's early days.  It may never amount to anything that approaches a replacement.  There are a lot of us hoping it does.\n\nI don't use Photoshop, but I use Lightroom.  I'm hoping LightCraft has a better chance, since there doesn't seem to be as much magic sauce in LR as there is in PS."}, {"id": 50649451, "au": "random3", "dom": 431, "sr": 96, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 1, "age": 20.6, "grav": 273.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1508, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "All Adobe needs to do is sign every change and publish the cryptographic chain of changes (like with git treating every alternation along with a signature starting from the original, which should be ideally signed by the camera hardware) in EXIF. I wouldn't be surprised if there isn't already some protocol/standard."}, {"id": 50656584, "au": "Krssst", "dom": 61, "sr": 97, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 3, "age": 4.55, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 755, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.278, "fa": 0.28, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "I suspect that translations being reported as machine-translated might depend on the languages. French and Spanish are quite close so I guess an LLM translation would have little leeway to change the writing, while translating between Chinese and English would require more LLM intervention and be more likely to be detected as AI (I often see Deepl adding hyphens in JP-EN translation for example)."}, {"id": 50657117, "au": "grumbel", "dom": 117, "sr": 98, "sc": 3.86, "ep": 3.86, "bs": 0.0, "d": 8, "age": 3.6, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 26, "k": 1783, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.079, "fa": 0.42, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "> with my iphone\n\nYour iPhone has a depth camera, you can't trick that with a flat display anymore than you can trick Face ID. Only a matter of time until those are more common among other phones and cameras.\n\n> this is to say that attestation doesn't help journalism whatsoever, unless you believe journalism is a holistic entertainment product. which is the real problem.\n\nI would think this is much more useful for social media than classic journalism, as it would allow you to filter out a whole lot of random slop automatically."}, {"id": 50654320, "au": "greggsy", "dom": 350, "sr": 99, "sc": 3.86, "ep": 3.86, "bs": 0.0, "d": 1, "age": 8.6, "grav": 70.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2365, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.555, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "If the same effort spent token maxxing MacOS ports for Zelda and GTA VI, was spent on Power Query extension for LibreOffice Calc, the world would be a much different place.\n\nAn open source PowerBI alternative would be awesome too."}, {"id": 50650688, "au": "lesuorac", "dom": 264, "sr": 100, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 4, "age": 18.02, "grav": 220.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 5663, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.215, "fa": 0.28, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "This threads started from “ Vanishingly few people _enjoy_ encountering generative AI in images or sounds in the wild.”.\n\nThe fact that a minority country (USA) holds an opinion from the plurality of the population (Asia) is probably evidence that its a cultural thing as opposed to a real problem.\n\nAsians don’t like pollution (coal) either. That’s why they’re so heavy on EVs and solar."}, {"id": 50652888, "au": "guitarlimeo", "dom": 315, "sr": 101, "sc": 3.84, "ep": 6.89, "bs": 3.05, "d": 7, "age": 12.21, "grav": 118.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 174, "qw": 0, "k": 639, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": ["https://chatgpt.com/s/cx_6b079e225770819193b97c3e72de5076"], "ig": 1.606, "fa": 0.62, "gp": 0.928, "bl": 1.15, "ds": 0.0, "txt": "Also looking at your transcript [1] it's obvious there's no artistic vision behind the images, just curation. An artist would like to place things exactly, would have an exact vision in mind. You're actually asking the LLM to place, because you don't even know what you want!\n\n\"can you put the bottle from the last image in the first image, but have the camera kind of top down, and make the scene dark. then have the pink lasers beaming through the room and have it hit the bottle in a neat way. make it a nice composition but still natural looking. also have the valentino logo and text \"Born In Roma Intense\" somewhere it fits\"\n\n\"yeah thats good but what can we add to make the image more interesting\"\n\n\"it looks great but for some reason i feel like somethging is missing but i dont know what\"\n\nLmao. A good artist would know what to do to make the image more interesting. These images are not your art. They're the LLM's, it has made all the creative decisions.\n\n[1] https://chatgpt.com/s/cx_6b079e225770819193b97c3e72de5076"}, {"id": 50649334, "au": "doodlebugging", "dom": 357, "sr": 102, "sc": 3.76, "ep": 3.76, "bs": 0.0, "d": 2, "age": 20.8, "grav": 278.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 3021, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I can confirm that LibreOffice is not a workable replacement for MSOffice. I built a simple spreadsheet yesterday and ran into issues formatting cell content that I would not have needed to waste time with on MSOffice. I haven't run into many issues with the word processor but I did find the slideshow replacement to be awkward.\n\nI have used OpenOffice, LibreOffice, and maybe others and so far, the muscle memory of MSOffice and the inconsistent behavior of functions behind some of the icons make it necessary to watch every operation to be sure it did what you thought it would. For someone who could click and tap all the way through operations in MSOffice, the learning curve is punctuated with plateaus where there is no corresponding function in the replacement that works reliably."}, {"id": 50654131, "au": "marmarama", "dom": 392, "sr": 103, "sc": 3.75, "ep": 3.75, "bs": 0.0, "d": 3, "age": 9.05, "grav": 75.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 362, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.597, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would imagine it's because the in-camera pixel data to JPEG pipeline is limited and well understood. Yes, you can make blunt changes to the image, but not that much. And you can understand that the Nikon, Canon, and Sony firmwares process the pixel data a certain way.\n\nLoading a RAW file into an app in a computer does not have those limitations. You can process that data any way you like before saving it to a distribution format. For artistic photography that's very useful, but for journalistic photography it's a liability.\n\nThe limitations of in-camera processing is the point."}, {"id": 50649703, "au": "cthalupa", "dom": 132, "sr": 104, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 3, "age": 20.08, "grav": 262.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 5973, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.476, "fa": 0.0, "gp": 0.168, "bl": 0.0, "ds": 0.0, "txt": "Well, journalism photography is quite a bit different from what's expected out of photography meant to be art for art's sake, portraits, etc.\n\nEvery single one of those Reuters photos are better than any shot I'll ever take when trying to document something for posterity. But most of them would still need editing if they were from a \"regular\" photographer putting stuff together for a gallery or similar."}, {"id": 50659450, "au": "atoav", "dom": 232, "sr": 105, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 21289, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.489, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "They report the story as told to them, if it fits their narrative and they always ensure there is a slight slant for the predominant narrative. There are many ways to distort reality and the NYT does it by choice of words, choice of images, choice of which contextual information to keep below the fold.\n\nThat is obviously a notch better than lying or making things up, but it is still bad jouralism."}, {"id": 50655387, "au": "morning-coffee", "dom": 377, "sr": 106, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 0, "age": 6.53, "grav": 47.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 414, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.692, "bl": 0.0, "ds": 0.0, "txt": "What about the in-camera AI features that can \"tweak\" the image between sensor capture and what is stored on the card? These are also tending to be more than just tonal mapping or dynamic range highlight recovery..."}, {"id": 50649475, "au": "kokanee", "dom": 147, "sr": 107, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 2, "age": 20.56, "grav": 272.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1691, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "There's a parallel here to the auto industry. There's a robust market for 20-year old trucks that are easy to maintain and repair, because new trucks are maintenance nightmares, and manufacturers are even experimenting with ways to block independent shops from touching their vehicles at all.\n\nIt seems to me that saavy companies should offer products to both market segments: those that want the bleeding-edge tech, and those that want (or need, for all kinds of reasons) the most basic, analog product possible."}, {"id": 50659314, "au": "bemtevi", "dom": 417, "sr": 108, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 6, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.207, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Darktable is good but it's not a photoshop competitor, it's a Lightroom competitor. And in that domain, it does decently well. But the GIMP is far more behind photoshop than darktable is behind Lightroom, possibly because of the greater complexity of pixel-based editing."}, {"id": 50656290, "au": "walt_grata", "dom": 214, "sr": 109, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 1, "age": 5.05, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 197, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.495, "fa": 0.0, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "Give users a hard no-ai mode and let them decide how they use the software. It's only hard if you want to make the decision for them in a way that removes their ability to choose. Yes its more work for your team and yes whatever business dork has a kpi on ai feature usage will struggle more, but that is the price you pay for respecting your users choices and agency."}, {"id": 50651414, "au": "raincole", "dom": 119, "sr": 110, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 4, "age": 16.03, "grav": 182.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.437, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Only if you don't understand how humans respond to incentives.\n\nYes, we know that digital cameras process the images. We know that there are no true \"raw\" pixels. But it's fundamentally different from an editor or a photographer doing that. The reason is that the digital camera's manufacturers have little reason to put certain stories and agendas into their machines, unlike newspapers.\n\nIt's just like the separation of powers."}, {"id": 50653006, "au": "thrw045", "dom": 316, "sr": 111, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 8, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 298, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.526, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There is artistic intent, all of the ideas for the images are mine. If you read the whole transcript you will see that I came up with the laser on the bottle and the sheet in the background of the image (I didn't use the suggestions of the AI, but sometimes I do). I also came up with the main idea for the image through the inclusion of the reference image in the first prompt.\n\nThe same is true for all the other images. I spent a lot of time coming up with original compositions so that every image is unique from the other images. It's actually much harder than one thinks to come up with an interesting idea to have AI create.\n\nBut one thing you are hinting at is that yes, I leave the execution to the AI. I have the main idea and then I leave the exact composition to the AI because it's good at it. That's part of what makes AI interesting is that it can create good compositions and place things in a good way. I delegate as much as I can to the AI in fact. I don't see anything wrong with that, they're still partly my creations, and I don't think that takes away from what I did on my part, but we'll probably disagree on that I guess. This is the new way of working with AI for me is to delegate to the AI what it's good at, find its strongest sides and use those. In this case it's creating good balanced compositions, and emulating physics so that the laser looks realistic and so on.\n\n"}, {"id": 50651475, "au": "johnnyanmac", "dom": 326, "sr": 112, "sc": 3.58, "ep": 7.16, "bs": 3.58, "d": 3, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 190, "qw": 40, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.406, "fa": 0.76, "gp": 1.162, "bl": 1.35, "ds": 0.0, "txt": ">sorry for the unwarranted AI drop but do you think these images are good or bad ai?\n\nBad. Can I tell these are all AI generated in the wild? No. When looking at it for more than 5 seconds, do I feel like I need to buy these? No, I come away confused or simply bored. The \"sauvage\" is the epitome of this example: \"wow, generic \"lone wolf\" in nature with the cologne slapped in front\". Cliche to the point that it's eye-rolling.\n\nAll the others have a similar feel here: what a I supposed to be feeling in the scene? The (assumed) perfume trail will come to you if you apply this cologne? These aren't things AI can answer, no matter how good it gets in a technical sense. It probably biases towards such things because it was successful once upon a time, but trends live and die constantly.\n\n>Do you think the world would be better if these images were never generated and/or there was no point in generating them?\n\nI don't think art needs a point. Or at least, I don't need to understand the point personally. So I would answer \"no\".\n\nBut an ad does. These are very bland ads. I will not be buying these colognes nor remember them when I wake up tomorrow. Fundamentally, we would be in a better world if ads couldn't be spit out at us by the thousands per day, but that's an entirely different discussion."}, {"id": 50648966, "au": "robinsonb5", "dom": 446, "sr": 113, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 2, "age": 21.38, "grav": 290.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 1431, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.459, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "I do actually have an InDesign CS 5.5 installation in a VM (because I can't install it in a newer OS installation thanks to the activation servers not being there any more.)\n\nI also use (and pay for) the current version - but with all the \"You can do this using AI now!\" popups I'm now finding the old version less annoying to use. The only feature it's missing which I actually need is QR codes in data merges."}, {"id": 50649785, "au": "minimaxa", "dom": 457, "sr": 114, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 0, "age": 19.96, "grav": 260.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 96, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.968, "fa": 0.0, "gp": 0.871, "bl": 0.0, "ds": 0.0, "txt": "These are the last death throes of an industry in a crisis of change.\n\nSame with text, as the LLM's have blended info online, and professors and students use this info in reports, it is going to be flagged as AI even though a human wrote and edited the text.\n\nThe same thing is happening with Suno, all of the tracks are watermarked, so millions are being taken down, wasting energy and inference costs.\n\nSame thing with code generation, all watermarked; anyone can detect and say that this code belongs to an LLM, in the future they may claim royalties and or delete/ban AI code.\n\nA GitHub PR is made from human organic code and then a Fork/Port is done by an LLM, now the code is tainted and watermarked.\n\nTechnology is an organism; once released, you can't close Pandora's box."}, {"id": 50649278, "au": "HWR_14", "dom": 474, "sr": 115, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 3, "age": 20.88, "grav": 280.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 10868, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.497, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The worst would be the watermark is missed due to human error/a bug in the workflow/a defect with the detector and the photo gets published. A far more likely cost is the photographer having to redo it 20 times costing more money.\n\nBut it's easy to prevent. You just use a slightly older photoshop. I don't even know what the cost of not upgrading would be."}, {"id": 50655149, "au": "embedding-shape", "dom": 92, "sr": 116, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 6, "age": 6.97, "grav": 51.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 27, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.931, "fa": 0.42, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "> As a result he spent a whole lot of time trying to find positions where natural light, shade and reflections helped him get the images he was looking for.\"\n\nAs a result of him being a photographer? Both behind the camera and in front, I've never worked with a photographer (besides beginners) who didn't think about the natural and unnatural light, shading and reflections, it's pretty much part of the job as a photographer, regardless of how many edits you make afterwards :)"}, {"id": 50651304, "au": "r_lee", "dom": 322, "sr": 117, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 5, "age": 16.36, "grav": 188.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1407, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.082, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "what would be these amazing results? making 100 images a day?\n\na lot of creativity comes from the process and friction\n\nwith AI it's \"no make it like this\" \"no not that\" or a big prompt you tweak\n\nand you get the usual mashup look\n\nit's like as if an artist becomes an offshoring manager giving their wishes and getting results back\n\nI just don't see how this would enable this amazing incredible dystopia where you can do \"so much\" with art and all that\n\nwe're seeing more of just intense copying, hurried up work, more sameness because the models are good at what's in their training data, etc....\n\nwe are not in a need of more quantity anymore"}, {"id": 50649901, "au": "autoexec", "dom": 472, "sr": 118, "sc": 3.51, "ep": 3.51, "bs": 0.0, "d": 2, "age": 19.73, "grav": 255.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 23004, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.447, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "It's kind of crazy how hard it can be to get a photo that isn't some excessively distorted version of reality. I've talked to people upset that their cell phones refused to take accurate photos and were automatically applying filters and edits they never asked for and couldn't disable when they were doing things like trying to take photos for medical/health reasons."}, {"id": 50651671, "au": "mrtksn", "dom": 299, "sr": 119, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 1, "age": 15.41, "grav": 171.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 25312, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.269, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "I actually enjoy the AI slop much more than before since the quality increased but can't take anything seriously if it contains AI media. It's instant unfollow and even block for me if someone \"serious\" uses an AI image instead of a photo of the real thing. Probably an \"if you can't put the effort into writing it why should I put my effort into reading it?\" thing. If you don't care enough to do it properly, it's not worth my attention."}, {"id": 50649518, "au": "anurodhp", "dom": 128, "sr": 120, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 2, "age": 20.46, "grav": 270.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 18, "qw": 0, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": ["https://en.wikipedia.org/wiki/2006_Lebanon_War_photographs_controversies"], "ig": 0.853, "fa": 0.0, "gp": 1.019, "bl": 0.0, "ds": 0.0, "txt": "Reuters famously  got caught using  photoshop fakes as real war photos. I can see why it’s not allowed now\n\nhttps://en.wikipedia.org/wiki/2006_Lebanon_War_photographs_c..."}, {"id": 50656025, "au": "slfnflctd", "dom": 275, "sr": 121, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 2, "age": 5.54, "grav": 37.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2530, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.108, "fa": 0.28, "gp": 0.052, "bl": 0.0, "ds": 0.0, "txt": "For me, it's often the type of font used that seems to stand out for some reason.  I'm also very pro-AI, but those fonts make me twitch.  Probably won't be an issue in the longer term.\n\nRegarding writing, even user 'dang' here has mentioned that they specifically request unvarnished writing in certain communications.  Bad grammar used to really bother me, it doesn't nearly as much any more."}, {"id": 50652483, "au": "watwut", "dom": 179, "sr": 122, "sc": 3.46, "ep": 3.46, "bs": 0.0, "d": 5, "age": 13.1, "grav": 132.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.473, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Single episode of breaking bad took a two weeks of writers team deliberations, plus one writer writing script, plus 1 week shooting preparation plus 1 week shooting. Plus editing.\n\nSometimes you care about the result, basicaly."}, {"id": 50654876, "au": "pjc50", "dom": 271, "sr": 123, "sc": 3.45, "ep": 3.45, "bs": 0.0, "d": 4, "age": 7.48, "grav": 57.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 113553, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "SK focused on media export. Japan is weirdly indifferent and occasionally even hostile to its media being exported. China is subject to political and social censorship that makes it hard to make compelling cultural products there, and is also having a bit of a xenophobic moment currently. The peak of China/Hollywood collaboration was about a decade ago."}, {"id": 50650810, "au": "pj_mukh", "dom": 260, "sr": 124, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 2, "age": 17.75, "grav": 214.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 4665, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "As someone who flits between Asia and North America I can see both sides of this coin.\n\nBut in defense of the western perspective, I think it's fine to want human-made art, especially illustration, paintings, real relief etc. The fact that a human was involved in it, is what makes it special.\n\nBut where I get confused is when digital commercial graphics is judged on a sliding scale case. Move layers around by hand in photoshop? Great! Have AI do it? How dare you!?. It's the same human commanding both. In fact that's how Europes AI label requirements work and it's confusing why one is valued over the other, they could just label it all \"digitally altered\"."}, {"id": 50651735, "au": "drdexebtjl", "dom": 120, "sr": 125, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 5, "age": 15.27, "grav": 168.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1220, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.089, "fa": 0.28, "gp": 0.028, "bl": 0.0, "ds": 0.0, "txt": "Digital camera manufacturers have biases too. For example, in-camera processing sucks at rendering black and brown skin tones, but is optimized to render fair skin tones.\n\nI would prefer if the newspaper’s photos had the newspaper’s biases rather than some random Japanese company’s."}, {"id": 50650073, "au": "Gigachad", "dom": 465, "sr": 126, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 1, "age": 19.35, "grav": 247.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 25230, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 0.105, "bl": 0.0, "ds": 0.0, "txt": "This is horrible. My guess is they are using some kind of upscaler which has mangled the details. Print companies probably regularly deal with low res images that don’t print well.\n\nBut AI up scaling is obviously a flawed idea. Just tell the customer their image is too low res."}, {"id": 50651968, "au": "lopis", "dom": 296, "sr": 127, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 1, "age": 14.57, "grav": 156.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 2614, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "I don't think this is true at all. Having been very exposed to the Brazilian politics bubble on Instagram, the use of AI propaganda and memes was everywhere on both sides of the political spectrum. It disgusted me and I hate looking at those images. However no only were people excitedly producing and sharing those with others, but the left using gen AI propaganda imagery was an important part in how Brazil turned around the elections. I don't expect that to slow down at all."}, {"id": 50654651, "au": "athrowaway3z", "dom": 353, "sr": 128, "sc": 3.31, "ep": 3.31, "bs": 0.0, "d": 1, "age": 7.87, "grav": 61.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1985, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.355, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure if I agree. There is a reason single payment died.\n\nAt this point I think the better strategy is the Blender model.\n\nWe'd need to get the NYT to understand they're part of the kind of users that should be putting in money and dev time on building public tools (and some private in-house plugins)."}, {"id": 50651197, "au": "red75prime", "dom": 255, "sr": 129, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 5, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1469, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.392, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not hard to notice the \"default style\" of image-generation models. I've experimented with diffusion models, and the range of styles you can get out of them is amazing. So I just file plainly visible AI-generated images under \"low-effort slop that doesn't reflect particularly well on whoever generated it.\""}, {"id": 50649030, "au": "jjmarr", "dom": 180, "sr": 130, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 2, "age": 21.27, "grav": 288.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 6, "k": 4726, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.796, "fa": 0.42, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "> Are there not workarounds that exist?\n\nYou can regenerate it through another model (easy with diffusion) that doesn't care about watermarks and get an image almost identical but with the watermark removed.\n\nGetting caught doing this would probably be worse than using AI though."}, {"id": 50648675, "au": "krapp", "dom": 481, "sr": 131, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 1, "age": 21.82, "grav": 301.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.384, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your recommendation for professionals who can't use Photoshop because of its AI features is to use a vibe-coded alpha clone explicitly stated as not ready for professional usage designed to integrate AI into every function and setting?\n\nI don't think you understand the actual problem here."}, {"id": 50649968, "au": "doodlebugging", "dom": 360, "sr": 132, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 4, "age": 19.59, "grav": 252.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 45, "k": 3021, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.853, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">They are completely different, OpenOffice has been dead for ages, LibreOffice is the only active project.\n\nI know this. That is why I am using LibreOffice. I have mostly completed my move from MS with my current workstation being the only one still using Windows.\n\n>The single major problem is Windows users trying open source alternatives and getting mad things don't work like Microsoft stuff does, not necessarily the open sources tools are bad.\n\nI agree. I am a long-time MSOffice user but before that it was Lotus123, and some other suite that had a name that started with a Q I think. I've been doing this shit for a long time and have used lots of software over the decades. I was pointing out correctly that functionality that has existed in MSOffice for decades does not work consistently in open-source replacements like LibreOffice and all the predecessors even though the icon employed in both would cause the user to think that there was a feature=feature correspondence.\n\nI no longer use MSOffice and have adopted LibreOffice as the replacement since that is the next best thing. That does not mean and it should not imply that LibreOffice ticks all the boxes that are ticked in MSOffice because it doesn't - yet. One day it will though. Maybe. MSOffice is the best office software suite developed so far and that has been true for a long time."}, {"id": 50655001, "au": "Planktonne", "dom": 347, "sr": 133, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 2, "age": 7.24, "grav": 54.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 3002, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.993, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I cannot stress how much your example undermines your point; if the best you can point to for widespread appreciation of AI art is Malfoid (which is not even specifically focused on AI generation), then you're taking your reading of general culture from a small and extremely specific subculture."}, {"id": 50653135, "au": "tw04", "dom": 376, "sr": 134, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 1, "age": 11.62, "grav": 110.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 21190, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As always, chain of custody. If a journalist is caught materially changing a photo, they face personal repercussions.\n\nSociety (or at least our absurdly wealthy Silicon Valley overlords) has decided when AI does it, well we really shouldn’t try to place blame.  It’s a new technology that will change the world so we just have to accept mistakes; aw shucks."}, {"id": 50651634, "au": "mrtksn", "dom": 212, "sr": 135, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 1, "age": 15.51, "grav": 173.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 25312, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.875, "fa": 0.0, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "Wouldn't agentic editing work? I mean, instead of processing the files directly let the AI do ot using traditional tools?"}, {"id": 50654242, "au": "orbital-decay", "dom": 126, "sr": 136, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 3, "age": 8.78, "grav": 72.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.287, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Obviously there are many ways to fake it, or you can stage the scene outright, which has been done. Even the extra lighting photographers carry is a slippery slope. Still, having some rules of ethics about keeping it closer to the camera is better than having none."}, {"id": 50651539, "au": "alex0015", "dom": 291, "sr": 137, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 3, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 95, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not biggest, smallest. Look up microdramas. They're shockingly watchable even if you hate AI, can easily see all the AI slop tells, and don't watch much TV. What I mean is they're very short episodes that all end on cliffhangers and constantly hit you with emotionally targeted moments. After you watch a few you pay five dollars or so and unlock several more episodes. The most popular ones are printing money; most get little or no interaction."}, {"id": 50652228, "au": "californical", "dom": 24, "sr": 138, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 3, "age": 13.86, "grav": 144.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2077, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 0.999, "fa": 0.0, "gp": 0.449, "bl": 0.0, "ds": 0.0, "txt": "Isn’t that what everyone thinks it measures? I think you make a very valid point about who is truly a more authoritative source, but I also don’t think anyone is confused about that.\n\nI think in most contexts it would be extremely rare for somebody to rewrite the LLM output in their own words when they don’t know anything about a topic - especially because paraphrasing is really hard about a domain your unfamiliar with, and our human brains can pick up on those missing understandings"}, {"id": 50655211, "au": "sickcodebruh", "dom": 329, "sr": 139, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 3, "age": 6.86, "grav": 50.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 25, "k": 1282, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.761, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The AI crowd also seems to persistently misunderstand \"I don't want AI content\" as \"AI content is fine as long as you can't tell the difference\"\n\nYou: “Yeah but what about this, can you tell the difference?”\n\nMy original post and the one you’re replying to are not statements about whether AI images can look good or whether people can enjoy making them. They’re about the fact (and it is a fact) that the majority of people simply do not want to encounter it in the wild and will hate it on sight because of what it is, not what it looks like."}, {"id": 50653072, "au": "tecleandor", "dom": 157, "sr": 140, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 2, "age": 11.75, "grav": 112.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3734, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.27, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think both tools are generally frowned upon on press work. Also, generally speaking in the past, healing brush wasn't generative, it used already existing pixels in the image to clone over a different place adapting hue and brightness."}, {"id": 50649622, "au": "echelon", "dom": 411, "sr": 141, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 3, "age": 20.26, "grav": 266.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.797, "fa": 0.0, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "You don't have to be so negative.\n\nEverything should be open source, including Apple. We deserve to own our software, platforms, and machines."}, {"id": 50656944, "au": "atonse", "dom": 387, "sr": 142, "sc": 2.97, "ep": 2.97, "bs": 0.0, "d": 0, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 14471, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.004, "fa": 0.0, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "Don’t they use their own CMS? they could add a gate to their image uploads that checks for this metadata rather than banning a whole tool, right?\n\nBut it does seem like the metadata is too broad."}, {"id": 50649682, "au": "hannasanarion", "dom": 195, "sr": 143, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 3, "age": 20.14, "grav": 263.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 4695, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.182, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "\"Gen AI\" isn't a class of algorithm, it's an application of algorithm.\n\nDiscovering subjects is not \"generative AI\" because no content is generated.\n\nRecognition and generation, predicting and deciding, these two sides of the same coin, the only difference is often whether the output is used retroactively or proactively. People are much less concerned about the recognition/prediction use cases than the generation/decision ones."}, {"id": 50657899, "au": "thaumasiotes", "dom": 145, "sr": 144, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 2, "age": 2.35, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 27, "k": 24762, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.743, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> For example Reuters doesn't allow even minor edits, as processing a photo in a normal non-AI powered image manipulation software makes it hard to distinguish creative choice vs reality.\n\nThis doesn't really make sense. That exact policy would have prevented them from allowing anyone to shoot on film, or from allowing two different photographers to use different cameras.\n\nAnd yet I'm pretty sure that they've never had problems with either of those things."}, {"id": 50656794, "au": "ohyes", "dom": 206, "sr": 145, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 4236, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.062, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "Well, more importantly the Times is a fucking, goddamned, newspaper. If a newspaper is using generative AI for their photos, we’re cooked. It’s no longer a source of news it’s just a source of random entertainment."}, {"id": 50650421, "au": "levocardia", "dom": 144, "sr": 146, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 3, "age": 18.62, "grav": 232.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 2716, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.894, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes but the point is that you don't get to actively intervene to, for example, make the smoke plume look darker (or lighter) or whatever -- an obvious source of bias. Now, what you do/don't photograph, and how you crop it, etc., also affects the narrative, but even that has guidelines."}, {"id": 50654581, "au": "hizlikovboy27", "dom": 83, "sr": 147, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 2, "age": 8.04, "grav": 63.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 14, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.233, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thats is absolutely correct. The issue whether in text or visuals down to the same point.It frustrates me that these tools present themselves to the user as being completely innocuous. \nUltimately,oversight mechanism and readers dont look at the extent of the assistance provided but rather at whether any traces of AI involvement can be detected traces that can be rendered virtually imperceptible with just a few minor touch ups."}, {"id": 50651397, "au": "intrasight", "dom": 112, "sr": 148, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 6, "age": 16.11, "grav": 183.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 20, "k": 6126, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 0.723, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Post-capture manipulation is essentially a core component of digital photography\n\nIt was. Not any more\n\n> In case of news media photography, it's not even about AI.\n\nIt is about AI but not in the way people are discussing. Apple is moving to photo attestation. Journalism needs this in order to attest to their work. Random edits break attestation."}, {"id": 50649655, "au": "AnimalMuppet", "dom": 414, "sr": 149, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 4, "age": 20.2, "grav": 265.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.888, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "1)  Not everyone agrees that everything should be open source.\n\n2)  Even if it should, we don't need the open source alternative named at every mention of a closed source app."}, {"id": 50648456, "au": "duskwuff", "dom": 436, "sr": 150, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 2, "age": 22.16, "grav": 308.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 22989, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The core problem which the Times has identified here is that photographers are using GenAI tools in Photoshop inadvertently because they are not clearly distinguished from traditional editing tools. C2PA does not prevent this from happening; it only allows the problem to be identified after the fact."}, {"id": 50649308, "au": "bemtevi", "dom": 407, "sr": 151, "sc": 2.82, "ep": 2.82, "bs": 0.0, "d": 1, "age": 20.84, "grav": 279.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.866, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "So you're recommended an app that was entirely vibe-coded, is much less functional except on the surface, and has a bunch of AI tools?"}, {"id": 50649639, "au": "loudandskittish", "dom": 447, "sr": 152, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 2, "age": 20.22, "grav": 265.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 492, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.179, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For photojournalism, it really should be. There's a limited subset of features you can use ethically in that space, and they all worked fine without GenAI attached. I'm really not sure what could have been added in that last decade that became essential to the workflow."}, {"id": 50649087, "au": "dodger-dog", "dom": 218, "sr": 153, "sc": 2.7, "ep": 2.7, "bs": 0.0, "d": 1, "age": 21.2, "grav": 287.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": -5, "kpp": -0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.148, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "All the arguments keep running into logical errors. They should hire more consultants and write more stories about how dangerous AI is.\n\nIn the meantime, when that wave of people that get their news delivered to them in the way they want, when they want, regarding exactly what matters to them via their friendly local AI tool it will be so fast the NYTimes types won’t know what hit them and they won’t have an alternative path available to them industry wise."}, {"id": 50649019, "au": "Mobius01", "dom": 382, "sr": 154, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 1, "age": 21.3, "grav": 289.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 661, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.135, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unfortunately they were bought my Canva who promptly merged all apps into a free one and added optional AI features behind a subscription."}, {"id": 50648713, "au": "t-writescode", "dom": 194, "sr": 155, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 2, "age": 21.75, "grav": 299.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 6575, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "Arguably, subject-aware select uses generative AI to discover subjects. Background fill is a very, very easy case, too. Modern upscaling techniques, like those found in DLSS and similarly able to be applied in photography are also generative.\n\nWhen I speak with Anti-AI people, I ask them to square with these cases when they ask for AI labels, because *these are all uses of gen AI*."}, {"id": 50651659, "au": "johnnyanmac", "dom": 421, "sr": 156, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 3, "age": 15.44, "grav": 171.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 0.715, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Game doesn't even boot on PC and some folk want to gallivant around about \"GTA VI on PC in a week\" as if the hard part is done.\n\nI don't even like GTA, but this attitude is exactly why people developed such an  adversion to AI. Lots of people who want to talk about something but never actually be part of the consumerbase playing the dang game. It got people to prototype faster and they act accomplished stopping there instead of the 2nd 90% that is polishing and QC'ing the dang thing."}, {"id": 50652587, "au": "autuni", "dom": 257, "sr": 157, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 2, "age": 12.84, "grav": 128.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 136, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 0.291, "bl": 0.0, "ds": 0.0, "txt": "I think that's a lot due to the examples you mention are things that people never cared about in a creative context (apart from the videos). Those are just products and not intended to just be art, and they were that before already.\n\nBut it might be that it feels more like people start to reject AI more and more in online spaces, and less of an issue for people who don't interact with tech that much anyway (outside of social media)."}, {"id": 50650720, "au": "MiddleEndian", "dom": 434, "sr": 158, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 2, "age": 17.97, "grav": 219.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 3469, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.113, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I disabled automatic updates on my Photoshop copy years ago, but it eventually started prompting me to update when I opened it. One of the reasons I ditched it."}, {"id": 50650955, "au": "misterderpie", "dom": 301, "sr": 159, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 2, "age": 17.34, "grav": 206.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 141, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Did you even read the headline of the article linked here? This is not about deliberately using it. Seemingly images now may contain metadata labeling them as AI, whilst using \"old school tools\"."}, {"id": 50649493, "au": "jamesfinlayson", "dom": 442, "sr": 160, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 2, "age": 20.52, "grav": 272.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1255, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.102, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Gosh, that name takes me back. I remember using a Windows ME desktop with Jasc Paintshop Pro installed."}, {"id": 50649799, "au": "simmanian", "dom": 187, "sr": 161, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 2, "age": 19.94, "grav": 259.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1061, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.102, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the most well known workaround is using the watermarked output as input to an open source image model running locally to regenerate a very similar image."}, {"id": 50651546, "au": "doctorpangloss", "dom": 114, "sr": 162, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 7, "age": 15.71, "grav": 176.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2459, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "if i generate an image with a non-watermarking generative AI model, such as qwen image, and present it on a display, then photograph it with my iphone, the fake image will attest as real.\n\nthis is to say that attestation doesn't help journalism whatsoever, unless you believe journalism is a holistic entertainment product. which is the real problem."}, {"id": 50657585, "au": "californical", "dom": 244, "sr": 163, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 5, "age": 2.82, "grav": 17.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2077, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.09, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ehh I see AI flyers as pretty off-putting. Some restaurants near me have made their signs outside advertising the food with AI and it doesn’t resemble the f
