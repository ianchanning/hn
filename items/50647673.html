3, "useful": 16, "useful_pct": 19.3, "terms": "photoshop, adobe, software, version"}, {"slug": "translation_language", "label": "Translation & Language (English)", "count": 69, "useful": 9, "useful_pct": 13.0, "terms": "translation, language, english, llm"}, {"slug": "general_commentary", "label": "General Commentary", "count": 68, "useful": 1, "useful_pct": 1.5, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 32}, {"category": "investigative_or_tech_press", "count": 4}, {"category": "low_cred_or_joke", "count": 2}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["features", "photoshop", "update", "adobe", "photographers", "nyt", "york", "version", "editor", "apps", "metadata", "photos", "options", "editing", "tools", "email", "users", "ways"], "largest_root": {"root_id": 50648319, "author": "jjcm", "slots": 227, "start_dom": 1, "end_dom": 227, "share_pct": 46.3, "top_dom1_age": 22.3, "top_dom1_author": "jjcm"}, "buried_cutoff": 147, "rescue_top_k": 80, "ablations": [], "tournament": [], "comments": [{"id": 50651685, "au": "simonw", "dom": 228, "sr": 1, "sc": 13.14, "ep": 13.14, "bs": 0.0, "d": 0, "age": 15.38, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 133, "qw": 0, "k": 122224, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": ["https://www.nytimes.com/2026/02/02/technology/moltbook-ai-social-media.html"], "ig": 1.681, "fa": 2.08, "gp": 2.247, "bl": 0.0, "ds": 0.0, "txt": "I had a NYT photographer take my picture at my home earlier this year (for a story about Moltbook, oddly enough). At one point I asked if they could fix things up if I had a stain on my shirt and they said absolutely not - they present photographs as they were taken, with cropping and balancing applied but no edits beyond that.\n\nHe did spend a bunch of time trying to find the best possible natural lighting for the shots he wanted.\n\nThe photo at the top of https://www.nytimes.com/2026/02/02/technology/moltbook-ai-so... is my laptop, taken in my garden, after hunting around for the best spot that didn't have too much glare on the screen. You can see how dirty my screen is, too!\n\nPhotography for a newspaper is photo journalism, and they take it seriously.\n\n(Thankfully I did not have a visible stain on my shirt.)"}, {"id": 50656491, "au": "easterncalculus", "dom": 454, "sr": 2, "sc": 11.04, "ep": 11.04, "bs": 0.0, "d": 0, "age": 4.7, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 29, "qw": 0, "k": 1637, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": ["https://archive.ph/32tHt"], "ig": 0.849, "fa": 2.69, "gp": 0.952, "bl": 0.0, "ds": 0.0, "txt": "The New York Times is also warning people about LLM hallucinations in 2026[0], like they're remotely a top priority or risk still. They don't know what they're talking about.\n\n[0]: https://archive.ph/32tHt"}, {"id": 50652045, "au": "SyneRyder", "dom": 91, "sr": 3, "sc": 9.32, "ep": 9.32, "bs": 0.0, "d": 5, "age": 14.35, "grav": 152.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 100, "qw": 0, "k": 6029, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": ["https://simonwillison.net/2026/Feb/2/no-humans-allowed/"], "ig": 1.764, "fa": 0.9, "gp": 1.8, "bl": 0.0, "ds": 0.0, "txt": "SimonW wrote about this when the New York Times interviewed him about Moltbook. He said the photographer spent time finding where to take the photos, because they are so restricted on the darkroom edits they are allowed to make:\n\n\"Jason the photographer spent an hour with me. I learned lots of things about photo journalism in the process - for example, there's a strict ethical code against any digital modifications at all beyond basic color correction. As a result he spent a whole lot of time trying to find positions where natural light, shade and reflections helped him get the images he was looking for.\"\n\nhttps://simonwillison.net/2026/Feb/2/no-humans-allowed/"}, {"id": 50649224, "au": "orbital-decay", "dom": 87, "sr": 4, "sc": 8.94, "ep": 9.08, "bs": 0.0, "d": 1, "age": 20.98, "grav": 282.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 6, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.642, "fa": 0.7, "gp": 2.226, "bl": 0.0, "ds": 0.0, "txt": "In case of news media photography, it's not even about AI.\n\n>I made a minor edit to the colors\n\nFor example Reuters doesn't allow even minor edits, as processing a photo in a normal non-AI powered image manipulation software makes it hard to distinguish creative choice vs reality. Photographers are essentially forced to shoot JPEGs for Reuters. Sure, camera does processing on its own, but it's not comparable to developing a RAW in e.g. Capture One."}, {"id": 50652382, "au": "atomicfiredoll", "dom": 311, "sr": 5, "sc": 8.79, "ep": 8.79, "bs": 0.0, "d": 5, "age": 13.38, "grav": 136.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 554, "qw": 0, "k": 856, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.904, "fa": 0.62, "gp": 1.758, "bl": 0.0, "ds": 0.0, "txt": "It sounds a little more like curation to me. You're exploring a (latent) space and finding pieces to share that are interesting or speak to you.\n\nThere's a lot to potentially discuss, but I'll try to train-of-thought some more relevant points into words.\n\nMany creative arts aren't just about having an idea. Personally, I think ideas tend to be shockingly formless once you examine them up close, even ones that feel very concrete.\n\nIn things like visual arts, the \"hard parts\" aren't just throwaway. Every tiny stroke of a pencil, digital bush, etc. is a little decision that brings that longing formlessness into form. There are other important decisions during creation too; when you make a mistake do you incorporate it or throw it away? Each of these decisions may be easy or be difficult, but they're intentional.\n\nWhile you you make those decisions, seeing the work materialize in front of you can cause the shape of the idea itself, your artistic vision, and even your tastes to change. The work is already influencing you and your idea before it's even finished.\n\nWhen a person says something like, \"I have an idea: a red building against a blue sky.\" they likely don't see every brick, or the shapes of the windows, or the way the strokes are laid. It's very easy for somebody else to show a picture of a red tower and infill most of the original idea their own. The original person's idea"}, {"id": 50649893, "au": "sickcodebruh", "dom": 235, "sr": 6, "sc": 8.3, "ep": 8.45, "bs": 0.0, "d": 0, "age": 19.74, "grav": 255.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 1282, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 2.089, "fa": 0.0, "gp": 2.441, "bl": 0.0, "ds": 0.0, "txt": "Vanishingly few people _enjoy_ encountering generative AI in images or sounds in the wild. The most likely positive sentiment you’ll find is some version of “I don’t have an opinion”, but enough people loathe it that willingly using it or being connected to it is a liability. NYT’s position is similar to Tidal banning it from their platform this past week. This linked article references the social stigma associated with using it, which anecdotally I’m seeing daily not only in the music spaces I occupy but in ultra-normy haunts: my neighborhood subreddit, Q/A events at my kid’s school, social media posts from accounts that are typically apolitical. The disconnect between various orgs’ and industries’ drive to integrate gen AI into professional creative software and consumer sentiment is fascinating and will be something we study for a long time."}, {"id": 50649120, "au": "mikae1", "dom": 174, "sr": 7, "sc": 8.25, "ep": 8.54, "bs": 0.0, "d": 3, "age": 21.16, "grav": 286.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3062, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.759, "fa": 0.95, "gp": 1.173, "bl": 0.0, "ds": 0.0, "txt": "I recently spent 8 hours recording and edition a 40 sec video. I added an animated arrow from Adobe Stock that was apparently AI generated. The arrow took up 5 percent of the frame or so. It lasted 3 seconds. i also heavily color keyed it.\n\nThe day after I noticed it got flagged because people were asking me if we were publishing AI videos now. Yes, that ID persists well."}, {"id": 50650106, "au": "numpad0", "dom": 198, "sr": 8, "sc": 7.59, "ep": 8.03, "bs": 0.0, "d": 3, "age": 19.29, "grav": 245.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 219, "qw": 0, "k": 9638, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.912, "fa": 0.78, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "Why would that be some sort of an ah-gotcha statement? I personally don't have much issues with generative masking tool, but I find that question a bit disingenuous.\n\nIMO it's clear what is going on with anti-AI sentiment: generative AI a new type of expression with some legitimate copyright issues that is still generally NOT pleasant to watch, in same sense as what a performance art that involves a performer vomiting on stage is.\n\nIt's just disgusting to look at. People don't, I don't know, hate canned spinach because there were some propaganda campaign done some government during some war. They are just awful, and there is some associated trivia while you're hating it. They were awful 5 years ago and they still are awful, with a small caveat that awfulness depends on how much training dataset you've ingested over the course of your life.\n\nTo be blunt, generative AI to a lot of fanatic online pro-AI people seem to be ex-artists and managers with passive exposure to art, who are otherwise comfortable with life yet artistic skills their subordinates constantly demonstrate had been a hidden source of an inferiority complex. And I think that had been adding unnecessary dads vs kids angle to this ongoing dumpster fire that is generative AI for arts.\n\nIf it weren't for that... it can be a lot closer to being just a tool. IMO."}, {"id": 50650286, "au": "wmchen", "dom": 262, "sr": 9, "sc": 7.54, "ep": 7.84, "bs": 0.0, "d": 2, "age": 18.9, "grav": 237.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 81, "qw": 36, "k": 284, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": ["https://restofworld.org/2026/china-seniors-ai-slop/"], "ig": 1.172, "fa": 1.32, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": ">I don't see this at all in Asia. People generate AI signs for their businesses, government flyers and posters are AI, people share funny videos, there seems to be no stigma around it among the general population.\n\nCan concur on this. People I've met in Asia really don't see AI as a society-ending machination. Most people I've encountered in Asia just see it as a tool. There's not total and complete ambivalence to AI (artists for example, still tend to be against generative images, and educators can agree that LLMs can devalue learning), there's generally agreement that there are red lines for any technology, but generative images and videos are a trivial concern in the grand scheme of things. For example: [1]\n\n[1]: https://restofworld.org/2026/china-seniors-ai-slop/"}, {"id": 50649161, "au": "alwa", "dom": 437, "sr": 10, "sc": 7.52, "ep": 7.52, "bs": 0.0, "d": 3, "age": 21.08, "grav": 284.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 181, "qw": 0, "k": 4237, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": ["https://spec.c2pa.org/specifications/specifications/1.2/guidance/Guidance.html\u0023_ingredients"], "ig": 1.813, "fa": 0.62, "gp": 1.028, "bl": 0.0, "ds": 0.0, "txt": "I’m not sure where it is implementation-wise, but at least in principle, I seem to remember C2PA’s “ingredients” supporting a chain of provenance all the way back to the sensor in the camera. Such that even if you don’t choose to bundle each complete edit/version’s worth of image data into the same file, you can sign which asset(s) each version derives from and prove it later.\n\nSo in theory, as I understood it, this could facilitate sort of a harder and more general version of Lightroom’s “rewind through the edit steps to the original” sensibility.\n\nWith a credible chain of provenance, it seems like social attitudes and editorial policy could conceivably evolve back toward more nuanced versions of “just don’t lie with pictures.”\n\nIf the net effect of your GenAI-enabled edit is really just to show the best face of the truth, then one way to prove it is to offer a look at the original without its figurative makeup on, right?\n\n(Then again if I were a Times editor, I’d probably still want to make those calls myself—I’d still want contributors to start me out with the clean original.)\n\nhttps://spec.c2pa.org/specifications/specifications/1.2/guid..."}, {"id": 50649021, "au": "swatcoder", "dom": 146, "sr": 11, "sc": 7.27, "ep": 7.71, "bs": 0.0, "d": 1, "age": 21.29, "grav": 289.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 14897, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.879, "fa": 0.0, "gp": 2.274, "bl": 0.0, "ds": 0.0, "txt": "If enough big buyers/employers take this stance, Adobe and others can plausibly distribute AI-free builds or just have a big AI-off switch that can disable AI-tainting features for a work session to prevent inadvertent use.\n\nIf the alternative is to foreclose on the editorial photography market altogether, it becomes an participation decision for them rather a feature arms race they can't escape."}, {"id": 50649674, "au": "Loughla", "dom": 149, "sr": 12, "sc": 7.25, "ep": 7.69, "bs": 0.0, "d": 3, "age": 20.16, "grav": 264.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 15020, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.732, "fa": 0.68, "gp": 1.161, "bl": 0.0, "ds": 0.0, "txt": "I have a newer truck. I went to change the rear brakes. This is a simple 20 minute job.\n\nThey have a nut on the caliper that is meant for you not to be able to remove it without a special tool from the manufacturer.\n\nThe fuck?\n\nLuckily you can just grind two sides flat and use a wrench or vice grips. But that is so user hostile as to be laughable. That is one of the simplest maintenance items on the vehicle, and they added a step that would force you to spend $400 at their shop instead of $70 for pads."}, {"id": 50653145, "au": "mikae1", "dom": 178, "sr": 13, "sc": 7.18, "ep": 7.62, "bs": 0.0, "d": 5, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3062, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.353, "fa": 0.95, "gp": 1.198, "bl": 0.0, "ds": 0.0, "txt": "Try TV commercials.\n\nConcept and creative dev, 1-2 weeks\n\nScript and storyboard, 2-5 days\n\nPre-prod and planning, 3-7 days\n\nShoot, 1-2 days\n\nEditing and post prod, 1-3 weeks\n\nFinal sound, music and grading, 2-5 days\n\nResult: 30-60 sec video. Rough estimates of course."}, {"id": 50649780, "au": "autoexec", "dom": 227, "sr": 14, "sc": 6.93, "ep": 7.37, "bs": 0.0, "d": 3, "age": 19.96, "grav": 260.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 147, "qw": 0, "k": 23004, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": ["https://www.myfashionlife.com/wp-content/uploads/2009/10/filippa-hamilton.jpg", "https://static.tvtropes.org/pmwiki/pub/images/Weekly_World_News_-_Cover_Art_4800.jpg", "https://static01.nyt.com/images/2008/07/01/science/0709-lede-IRAN.jpg"], "ig": 1.806, "fa": 0.62, "gp": 0.941, "bl": 0.0, "ds": 0.0, "txt": "Why would you want a personalized newspaper filled with lies? It's fine if people want to post selfies to social media photoshopped and filtered to the point where they're unrecognizable and every straight line around them bends with their \"curves\", because the stakes there are about as low as it gets.\n\nAdvertisers shouldn't be allowed to do it either, but at least we've known for a long time that their whole business is lying (https://www.myfashionlife.com/wp-content/uploads/2009/10/fil...).\n\nIdeally news would actually show you reality, not some mixture of hallucinated nonsense and AI generated slop versions of what some person or event might look like. If we were going to go that route, why should newspapers hire photographers at all instead of just using stock photos for everything?\n\nIt's perfectly reasonable to expect your news to have a higher standard than supermarket tabloids (https://static.tvtropes.org/pmwiki/pub/images/Weekly_World_N...)\n\nPresumably things like this are perfectly acceptable to you: https://static01.nyt.com/images/2008/07/01/science/0709-lede..."}, {"id": 50648492, "au": "uptrails", "dom": 193, "sr": 15, "sc": 6.93, "ep": 7.59, "bs": 0.0, "d": 1, "age": 22.11, "grav": 307.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 548, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.943, "fa": 0.0, "gp": 2.086, "bl": 0.0, "ds": 0.0, "txt": "The examples you're giving make no sense to me. Photoshop doesn't use generative AI for \"minor edits to colors\" or segmentation (which I assume is what you mean by \"did a cutout\"). Even fairly big interventions, such as relighting, should be OK, because that applies deterministic adjustments based on a generated depth map.\n\nYou risk gen AI pixels if you ask for gen AI pixels, i.e., generative fill or whole-image prompts like \"make this look better\" / \"make the model sexier\". Which, yeah, probably shouldn't be allowed anywhere near journalism. As for product photos... you have a choice to make, if people want authenticity and the AI label drives customers away, maybe don't fake product shoots?\n\nIn general, I suspect that a lot of these cases are similar to people getting red-handed for AI-generated blog posts and then insisting they just used the tool for minor editing of a sentence or two."}, {"id": 50652333, "au": "kmeisthax", "dom": 469, "sr": 16, "sc": 6.78, "ep": 6.78, "bs": 0.0, "d": 0, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 221, "qw": 0, "k": 15086, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 2.057, "fa": 0.28, "gp": 0.792, "bl": 0.0, "ds": 0.0, "txt": "You can't (legally) not update Photoshop. Adobe's licensing terms specifically require you to be on the last two versions, for incredibly stupid reasons. Part of buying Adobe Creative Cloud tools is that they give you a third-party infringement indemnity; after they got sued for pirating Dolby software libraries they realized \"aww shit each version is a separate indemnity\" and decided to revoke access and licensing from old software versions to limit their liability.\n\nTo be clear, they probably wouldn't sue you for not updating, but someone else could. More importantly, since Adobe themselves have washed their hands of the old version (and you aren't supposed to have it anymore), no E&O insurance[0] in the world is going to let you keep it. Hell, Adobe probably specifically implemented this policy to keep their E&O costs down. Given that the NYT is a big enough corporate buyer that they could actually negotiate for special \"pre-AI Photoshop\" licenses, the question is really \"does NYT eat the E&O costs or the slop?\"\n\nAnd yes, I know Adobe could just ship a no-AI version of modern Photoshop, but this is the AI hype bubble we're talking about. The stock market needs you to eat as much slop as possible because every use of AI represents money moving out of the hands of labor and into capital - i.e. a direct benefit to shareholders.\n\n[0] Errors & Omissions insurance"}, {"id": 50652158, "au": "nsarrazin", "dom": 391, "sr": 17, "sc": 6.76, "ep": 6.76, "bs": 0.0, "d": 2, "age": 14.02, "grav": 147.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 19, "k": 73, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.483, "fa": 0.76, "gp": 0.767, "bl": 0.0, "ds": 0.0, "txt": "> Funny enough, Reuters recently told photographers to start using straight out of camera jpeg instead of editing raw files.\n\nLooked into it as I was really surprised by this and that was 11 years ago! So definitely pre-AI.\n\nI'm curious what the reasoning was for this, I can't seem to find a satisfying explanation. Some vague statement about authenticity mostly, but the camera is also processing RAW data into a JPEG. You're just trading your RAW editor for the crappy in-camera controls..."}, {"id": 50653102, "au": "shakna", "dom": 31, "sr": 18, "sc": 6.53, "ep": 6.97, "bs": 0.0, "d": 5, "age": 11.7, "grav": 111.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 18, "k": 16037, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.843, "fa": 0.42, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "> If I get something I wrote translated into, say, French by a human translator, does that mean that they authored it?\n\nWell, that has been frequently argued in literary circles, since the first translation but... Generally speaking, today, yes.\n\nThey are given a lesser role to the original author, but are treated as an author, because of the choices that a translator must make. You'll find most \"TA\" or \"Translator/Author\"s get their name their on the translated work.\n\nIt isn't generally treated as literary appropriation - unless a word-by-word translation was done, in a mechanical manner or without acknowledging the original inspiration and source.\n\nIn such cases, which is roughly equivalent to the LLM there, it is treated as something that is opposed by the community, and has since before the printing press existed."}, {"id": 50650211, "au": "TheOtherHobbes", "dom": 339, "sr": 19, "sc": 6.5, "ep": 9.99, "bs": 3.05, "d": 1, "age": 19.06, "grav": 241.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 174, "qw": 0, "k": 28534, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": ["https://spectrum.ieee.org/in-1930-robots-were-stealing-musicians-jobs"], "ig": 1.353, "fa": 1.78, "gp": 1.195, "bl": 1.15, "ds": 0.0, "txt": "You'd expect ultra-normie people to have ultra-normie attitudes and be against new things on principle.\n\nIn fact Western culture has been normified for decades now, circulating around the same few corporate-approved attitudes, poses, styles, genres, tropes, and franchises.\n\nAI ironically subverts all of that. You can produce midwit slop, and most people do. But if you have an original vision it's suddenly become a lot cheaper to express it.\n\nI was in despair and boredom before AI arrived, now I'm in a superposition of horror, anxiety, and glee - which might or might not be an improvement, but at least it's not boring.\n\nMeanwhile one thing AI has revealed is how uncreative many so-called creators are - especially in their anti-AI arguments, which are invariably parroted variations of the same few lines.\n\n'It's like ordering a pizza', 'It has no soul', 'It can't invent anything original\" - and that's pretty much it.\n\nIn fact there's a long history of debate in the arts about the role of machines, creation, reproduction, and value.\n\nAll of this has happened before, and it will happen again.\n\nhttps://spectrum.ieee.org/in-1930-robots-were-stealing-music..."}, {"id": 50648319, "au": "jjcm", "dom": 1, "sr": 20, "sc": 6.36, "ep": 7.24, "bs": 0.0, "d": 0, "age": 22.33, "grav": 312.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 12521, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 2.116, "bl": 0.0, "ds": 0.0, "txt": "I work in the creative tools space.\n\nThis is one of the biggest issues right now. It's nearly impossible to separate \"this image was fully generated with AI\" versus \"I made a minor edit to the colors or did a cutout or improved the layout with AI\" when the endpoint is an image.\n\nEspecially for socials, if your brand is an authoritative source, getting hit with a dreaded \"AI generated content\" tag on instagram or facebook is a death blow to your credibility.\n\nDesign tools are in a very hard space because of it. You want to make edits as seamless as possible for users, but your final result can't include any pixels from a generative model. It's a strange dance."}, {"id": 50649692, "au": "dang", "dom": 2, "sr": 21, "sc": 6.36, "ep": 6.8, "bs": 0.0, "d": 1, "age": 20.11, "grav": 263.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": ["https://hn.algolia.com/?dateRange=all&page=0&prefix=true&query=by%3Adang%20imprints%20llm&sort=byDate&type=comment"], "ig": 1.093, "fa": 0.62, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "We're seeing this over and over in the text domain as well.\n\nUsers think they're using tools to \"just\" fix their grammar or polish their wording a bit, and don't realize that these leave almost as many imprints as copy-pasting everything from ChatGPT.\n\nhttps://hn.algolia.com/?dateRange=all&page=0&prefix=true&que..."}, {"id": 50655610, "au": "klunger", "dom": 3, "sr": 22, "sc": 6.22, "ep": 6.67, "bs": 0.0, "d": 2, "age": 6.14, "grav": 43.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 184, "qw": 0, "k": 2017, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.664, "fa": 0.34, "gp": 1.232, "bl": 0.0, "ds": 0.0, "txt": "This got me into trouble in a class[1] recently. I did the reading, data collection + analysis, wrote a draft of a report and asked ChatGPT to polish the writing without making any substantive changes. It is worth taking the time for me to engage deeply with the material so that I actually understand it, but it is not worth my time at this point to polish my writing. Anyway, it did a pretty good job and, after I had re-read the whole thing to make sure it really was still just my thoughts, submitted.\n\nI got a response from the grader who said \"Our system says 70% chance it was written by AI.\" I had to explain my process or else probably would have failed and been expelled because I did not \"declare AI use\" when submitting. I thought that applied if it helped come up with the core content, not simple copy-editing.\n\nAnyway, it worked out but now I am much more hesitant about using it for anything \"official.\"\n\n[1] I have a job and kids, but still like to take single courses here and there  if an interesting topic at the local university is on offer (and I have time)."}, {"id": 50651844, "au": "johnnyanmac", "dom": 328, "sr": 23, "sc": 6.16, "ep": 7.67, "bs": 0.85, "d": 5, "age": 14.94, "grav": 162.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 17, "k": 10298, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.708, "fa": 0.76, "gp": 1.028, "bl": 0.32, "ds": 0.0, "txt": "Sure, I get that. I find \"handsome guy\" generic too,  but it does communicate a very obvious and longstanding statement: \"If I use this, I will be handsome too\" . It's more like a mindhack/human nature at work here: \"humans like looking at other humans\".\n\nThe \"art\" for such ads is that what \"handsome\" is will vary and adjust with the times. Look at models for 50's cologne and compare it to the 70's, 90's, and today. You will feel a style and culture on each that will leave things distinct. Not 100% distinct (something like a man in a tuxedo spans generations), but you'll see something communicated in every period.\n\n>Also I know the work that went into some of them so I appreciate them more for that reason.\n\nNaturally, there's pride to have in one's craft. But from a commercial sense, you gotta distinguish early on if this is for 'you ' or for 'sale'. When you come in at that lens, there will in fact be 'bad ideas' and 'bad art'.\n\nAnd sadly a lot of people these days want to \"sell\", especially on social media where the currency is attention and thus you are incentivized to produce more and more, at the cost of quality. That's how the sea of slop starts."}, {"id": 50648851, "au": "skissane", "dom": 163, "sr": 24, "sc": 6.12, "ep": 7.22, "bs": 0.0, "d": 1, "age": 21.54, "grav": 294.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 11, "k": 17483, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.323, "fa": 0.42, "gp": 2.006, "bl": 0.0, "ds": 0.0, "txt": "> but your final result can't include any pixels from a generative model\n\nAn image can still be AI-manipulated even without using a generative image model\n\nGive a VLM raster-editing tools, and it can manipulate an image, see the result, adjust the manipulation – the pixels are all either original or modified by a deterministic pipeline, but an AI wrote the pipeline."}, {"id": 50654885, "au": "acomjean", "dom": 94, "sr": 25, "sc": 6.08, "ep": 6.74, "bs": 0.0, "d": 5, "age": 7.47, "grav": 57.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 93, "qw": 0, "k": 8959, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": ["https://www.researchgate.net/figure/The-Newsweek-and-Time-covers-reporting-on-the-OJ-Simpson-case-Time-magazine-was_fig4_220664038"], "ig": 1.391, "fa": 0.62, "gp": 1.179, "bl": 0.0, "ds": 0.0, "txt": "As someone who worked at my college paper (daily oddly) during the last century.\n\nWe had to transfer the film to paper so darkroom edits were required.  We could adjust the contrast and exposure and lighten/darken areas.\n\nThere was also the step where the photo was put through a machine to make it halftone “dots” before being sent to the printer.  Exposure was slightly adjusted there.\n\nWe did have one “feature” photo were the negative was flipped by mistake  (reversed) but we tried to avoid.\n\nThe infamous “OJ newsweek cover” was a low bar.\n\nhttps://www.researchgate.net/figure/The-Newsweek-and-Time-co..."}, {"id": 50649760, "au": "krapp", "dom": 415, "sr": 26, "sc": 6.03, "ep": 6.25, "bs": 0.0, "d": 4, "age": 19.99, "grav": 260.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 179, "qw": 16, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.654, "fa": 0.42, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": ">Everything should be open source, including Apple. We deserve to own our software, platforms, and machines.\n\nI'm not disagreeing with that. I disagree on what you consider open source, but not the basic intent. I will agree that the open source community has absolutely failed to provide a credible competitor to Photoshop. It could have - Blender is professional grade - but having the standard be GIMP, and the philosophy that quality doesn't matter as long as freedom is respected, just doesn't cut it for most people. But you haven't actually provided a credible competitor yet, either. That isn't being negative, it's just being reasonable. At the end of the day the only thing that actually matters is what the bits do.  At the moment the only people using PhotoCraft are people who could just as well use IrfanView or any other existing (and likely more stable) software for simple things. Having people drop into threads to push software that still isn't out of alpha, and still isn't stable, especially in professional contexts, is just annoying.\n\nYou're going to wind up like Yandere Dev, burning all of your hype and credibility with people waiting years for your product to even release."}, {"id": 50654624, "au": "paganel", "dom": 273, "sr": 27, "sc": 5.88, "ep": 6.76, "bs": 0.0, "d": 4, "age": 7.93, "grav": 62.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 35, "k": 14398, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.422, "fa": 0.76, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "> relevant than it was 40 years ago, because it invested in exporting its media.\n\nIf you exclude anime and its influence on today's Western geeks it isn't, really. And even for anime, Neon Genesis Evangelion is by now almost 30 years old.\n\n> South Korea, which you missed, is doing exactly the same.\n\nK-Pop is only a consoomerist fad, even though I'd agree that the Korean historical dramas do have greater cultural importance. There's also Han Kang, I agree, but she wouldn't have won hadn't it been for some Westerners feeling guilty about having ignored women and non-Europeans from not having won it previously. Btw, the New Korean cinema is by now dead, that was indeed a genuine cultural phenomenon at the beginning of the 2000s.\n\n> Once they do, they will absolutely flood the world with their media.\n\nConsooming media is very different from cultural relevance, see the above K-Pop example."}, {"id": 50650177, "au": "orbital-decay", "dom": 137, "sr": 28, "sc": 5.85, "ep": 6.73, "bs": 0.0, "d": 3, "age": 19.16, "grav": 243.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 11, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.826, "fa": 0.42, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "Which features in serious dedicated cameras used by photo journalists resemble editing the image with modern generative AI, let alone generating it?\n\n>there’s never been a single photograph taken ever that actually presents reality.\n\nI mentioned that it's not comparable to an image manipulation suite or even a simple RAW development software. With a camera you only have one attempt with timing, framing, controls, and a well-known set of image processing features inside it. You can't darken that face, or straighten this building and move that car over there, or turn night into day after the fact."}, {"id": 50651341, "au": "dang", "dom": 85, "sr": 29, "sc": 5.82, "ep": 6.48, "bs": 0.0, "d": 3, "age": 16.24, "grav": 186.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 68, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": ["https://news.ycombinator.com/item?id=50650509", "https://hn.algolia.com/?dateRange=all&page=0&prefix=false&query=by%3Adang%20%22own%20voice%22&sort=byDate&type=comment"], "ig": 1.546, "fa": 0.62, "gp": 0.747, "bl": 0.0, "ds": 0.0, "txt": "Yes, non-native English speakers are at a disadvantage here, since the machine translation tools now produce text that sounds just like LLMs. This recent comment is related: https://news.ycombinator.com/item?id=50650509.\n\nWhat we tell people who email is to write in their own voice and don't worry about any mistakes, because those are rapidly becoming signs of authenticity (https://hn.algolia.com/?dateRange=all&page=0&prefix=false&qu...). But that's just an interim solution and the best of a bad bunch for the moment."}, {"id": 50648576, "au": "h4kunamata", "dom": 349, "sr": 30, "sc": 5.75, "ep": 6.19, "bs": 0.0, "d": 0, "age": 21.99, "grav": 304.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 443, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "With the competition moving to single payment and you own the software for life, subscription is finally dying.\n\nMicrosoft also is pushing companies to Linux and LibreOffice suite which requires no subscription, and works just as good if not better.\n\nAll we need is big names such as NYT to make the move, the rest will follow. Europe is already running away from USA software companies, now it is just a matter of time."}, {"id": 50650669, "au": "thrw045", "dom": 308, "sr": 31, "sc": 5.67, "ep": 6.99, "bs": 0.0, "d": 2, "age": 18.05, "grav": 220.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 95, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": ["https://imgur.com/a/nFee5np"], "ig": 1.117, "fa": 0.62, "gp": 1.792, "bl": 0.0, "ds": 0.0, "txt": "I don't understand this attitude though. I can understand not liking bad Ai images, and sorry for the unwarranted AI drop but do you think these images are good or bad ai? \nhttps://imgur.com/a/nFee5np\n\nDo you think the world would be better if these images were never generated and/or there was no point in generating them? Me personally I like the images and there was also a bit of work involved in Photoshop to make the images how they are.\nMy point is just that it is possible to be creative with AI, and make them not look as AI-y."}, {"id": 50652034, "au": "jarjoura", "dom": 405, "sr": 32, "sc": 5.66, "ep": 6.32, "bs": 0.0, "d": 0, "age": 14.38, "grav": 153.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 3288, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.651, "fa": 0.0, "gp": 1.683, "bl": 0.0, "ds": 0.0, "txt": "I don't care about social media or image search tools like pintrest that are covered in \"AI\" edited content.\n\nI DO care about news organizations, no matter how large or small keeping altered photos off their articles. That shouldn't even be a debate. I don't even want something as innocent as being allowed to remove a random dog from an otherwise perfect neighborhood slice-of-life photo."}, {"id": 50656211, "au": "estebank", "dom": 42, "sr": 33, "sc": 5.48, "ep": 6.36, "bs": 0.0, "d": 5, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 19, "k": 6213, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.709, "fa": 0.42, "gp": 0.789, "bl": 0.0, "ds": 0.0, "txt": "> Translating ancient Greek to English is much closer to writing than translating my teenager's English idioms to old-man speak.\n\nFunny that one of the recent \"rightwing culture war of the week blow out\" was about how the basis for Nolan's Odyssey, Emily Wilson's translation is \"woke garbage\" because in her efforts to accurately translate the source material resulted in different English phrases from previous translations."}, {"id": 50652520, "au": "qingcharles", "dom": 171, "sr": 34, "sc": 5.24, "ep": 6.78, "bs": 0.0, "d": 1, "age": 12.99, "grav": 130.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 12423, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.583, "fa": 0.34, "gp": 1.443, "bl": 0.0, "ds": 0.0, "txt": "I do some photo editing and it's so frustrating because the quickest way to remove an annoying imperfection, like a forgotten electrical cord in the background, is just to use the AI feature in Photoshop to run over the item and hit remove. It's flawless 99% of the time and saves a lot of time.\n\nEven things like, client sends image but needs it in 9:16 and the framing just won't support that, so I want to extend 50px of floor on the bottom of the photo, and now my whole photo is \"AI\".\n\nI will say that the social networks have tightened their wording over the last year or so. It used to say things like \"This image was generated by AI\" but now it is a bit more subtle and says things like \"May have been modified using AI\" etc. Especially now that Photoshop writes a lot more history into the metadata to say what type of AI was used and how it was used.\n\nStill, I just strip all that shit out of the EXIF before I upload it these days."}, {"id": 50649792, "au": "h4kunamata", "dom": 358, "sr": 35, "sc": 5.22, "ep": 6.03, "bs": 0.0, "d": 3, "age": 19.95, "grav": 259.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 42, "k": 443, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.565, "fa": 0.42, "gp": 0.795, "bl": 0.0, "ds": 0.0, "txt": ">OpenOffice, LibreOffice\n\nThey are completely different, OpenOffice has been dead for ages, LibreOffice is the only active project.\n\n>I built a simple spreadsheet yesterday and ran into issues formatting cell content that I would not have needed to waste time with on MSOffice. I haven't run into many issues with the word processor but I did find the slideshow replacement to be awkward.\n\nNot everything will be 1:1 replacement, some minor learning will almost always be required when moving to open source.\n\nThe single major problem is Windows users trying open source alternatives and getting mad things don't work like Microsoft stuff does, not necessarily the open sources tools are bad."}, {"id": 50651361, "au": "emptybits", "dom": 98, "sr": 36, "sc": 5.17, "ep": 6.27, "bs": 0.0, "d": 6, "age": 16.19, "grav": 185.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 6861, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.922, "fa": 0.0, "gp": 1.211, "bl": 0.0, "ds": 0.0, "txt": "\"Important context\" is subjective. All images are fundamentally cropped in-camera long before a darkroom or digital stage. The photographer's choice of where to stand, focal length, and target is done before \"editing\". Call it framing or cropping or composition, but every image has it and it's bias, artistic, preference, employer, and agenda. In-camera.\n\nThen, sure, for an image poorly composed in-camera, or for nefarious reasons ... cropping can and will happen later. My point is that a photographer walking around and choosing his lens and place to stand is already choosing to include and exclude large amounts of \"context\" to capture what he believes (again, by employer/bias/agenda/art) is a compelling image. And we'll never know.\n\nFraming afterwards is basically the same thing as framing before the shutter is released. Is it really more or less truthful when it's raw out of the camera from a cropping perspective."}, {"id": 50657823, "au": "munk-a", "dom": 155, "sr": 37, "sc": 5.06, "ep": 6.6, "bs": 0.0, "d": 1, "age": 2.47, "grav": 14.8, "surf": 20.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 11, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.773, "fa": 0.42, "gp": 0.855, "bl": 0.0, "ds": 0.0, "txt": "> You want to make edits as seamless as possible for users\n\nI reject the notion that users are legitimately demanding this in droves.  Artistic expression doesn't need to be pixel perfect and, especially if you are using photoshop for satirical image editing in the news context (and if it's for serious news imagery like war photography or other important visuals - please don't edit it at all) then I think the images generally benefit from having some artifacting to make it clear the image was edited.\n\nIf this is for things like color/brightness/whatnot balancing for visual clarity, that's quite unfortunate.  It may be that the threat of image editing has made it so that AI tools in this domain simply aren't worth considering for the cost of introducing doubt when compared to pre-AI tools and it kind of sucks to make things more manual but veracity is an important commodity these days."}, {"id": 50648788, "au": "joegibbs", "dom": 168, "sr": 38, "sc": 4.93, "ep": 6.47, "bs": 0.0, "d": 1, "age": 21.64, "grav": 296.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2141, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.405, "fa": 0.28, "gp": 1.634, "bl": 0.0, "ds": 0.0, "txt": "Currently if you use a model to change some small part of an image it will change the whole thing, adding all the artifacts you can see when you zoom in, and therefore making it indistinguishable from a totally AI-generated image. This could be fixed with masked editing, which would also let you edit any image sizes while keeping the original resolution."}, {"id": 50654654, "au": "exodust", "dom": 216, "sr": 39, "sc": 4.88, "ep": 6.42, "bs": 0.0, "d": 1, "age": 7.87, "grav": 61.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 12, "k": 2182, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.797, "fa": 0.42, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "> getting hit with a dreaded \"AI generated content\" tag on instagram or facebook\n\nIt seems we need multiple classifications or a scale rather than dreaded on/off tags.\n\nML is used by everyone already to de-noise and do uncontroversial mechanical edits. So in that sense, the distinguishing factor is whether the AI is processing image pixel values vs editing subject matter in the image. If the latter, maybe that's when the dreaded tags should arrive. Or, we need a new tag representing \"safe AI\" use. Safe is wrong word. When using AI like a spanner rather than painter, this shouldn't be dreaded."}, {"id": 50654523, "au": "Battleshack", "dom": 367, "sr": 40, "sc": 4.86, "ep": 5.74, "bs": 0.0, "d": 1, "age": 8.14, "grav": 64.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 9, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 2.083, "fa": 0.0, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "Journalistically none of these mentioned toolsets are viable for editing.\n\nCommercially both are viable but may be subject to different sets of legislations, depending on local or regional law.\n\nHealing brush and content-aware fill reuses adjacent pixels within the canvas and may be subject to laws about image retouching/manipulation. While generative fill may be subject to laws about use of AI. Some countries requires specific labeling for each.\n\nFor journalism and documentary, viable editing techniques are limited to tools which mimics darkroom techniques and basic digital image processing, such as brightness, contrast, saturation, white balance and rescaling.\n\nWhat I believe NYT takes issue with, is the integration of generative AI within toolsets previously viable for journalistic editing. Such as generative AI interpolation for  \nupscaling."}, {"id": 50650844, "au": "thrw045", "dom": 325, "sr": 41, "sc": 4.69, "ep": 6.23, "bs": 0.0, "d": 4, "age": 17.66, "grav": 213.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 125, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": ["https://chatgpt.com/s/cx_6b079e225770819193b97c3e72de5076"], "ig": 1.413, "fa": 0.62, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "Hehe yeah they are ChatGPT.\nHere is a prompt history for the Valentino image: https://chatgpt.com/s/cx_6b079e225770819193b97c3e72de5076\n\nIt is kind of hard to explain because every image is different. But the key I find is to find the right source images and the right camera angle. I also defer as much as possible to the AI in terms of composition and such. I don't overspecify every little bit of the image. The AI is great at balancing the composition so I use that.\n\nEdit: Also, the reason I say it's creative is because I came up with all the ideas for the images. I ask AI for suggestions but most of the time I have my own ideas like you see here. So I feel somewhat a since of \"ownership\" over some parts of it. But that's just me."}, {"id": 50654305, "au": "Barrin92", "dom": 57, "sr": 42, "sc": 4.67, "ep": 5.77, "bs": 0.0, "d": 5, "age": 8.63, "grav": 70.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 23, "k": 35165, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.431, "fa": 0.42, "gp": 0.835, "bl": 0.0, "ds": 0.0, "txt": ">But their writing is so obviously LLM that I wonder if they are completely honest about how they are using the LLM or not\n\nit's also a strange tool choice if a high fidelity translation of a comment was the point because DeepL or other non-LLM tools are going to do that in a much more accurate way without the generative AI-isms and we've had good auto translation for a long time.\n\nIt frankly just sounds like an excuse because I also scarcely remember anyone ever interacting with an online message board that way."}, {"id": 50650002, "au": "jauntywundrkind", "dom": 464, "sr": 43, "sc": 4.54, "ep": 5.42, "bs": 0.0, "d": 0, "age": 19.51, "grav": 250.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 48, "qw": 0, "k": 6774, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": ["https://bsky.app/profile/wolfwings.us/post/3n2shijizuc2k"], "ig": 1.198, "fa": 0.62, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "Theres a Threads thread on someone using VistaPrint recently and allegedly getting back AI processed products that have mangled the text, etc.\n\nIt's threads so like twitter you can't actually read it. Here's a bluesky/atproto link instead, where social networking information is designed to allow it to be read. https://bsky.app/profile/wolfwings.us/post/3n2shijizuc2k"}, {"id": 50650789, "au": "echelon", "dom": 418, "sr": 44, "sc": 4.52, "ep": 5.51, "bs": 0.85, "d": 5, "age": 17.81, "grav": 215.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 26, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.374, "fa": 0.42, "gp": 0.748, "bl": 0.32, "ds": 0.0, "txt": "> You're going to wind up like Yandere Dev, burning all of your hype and credibility with people waiting years for your product to even release.\n\nWe're working every day around the clock.\n\nWe just completed a major refactor across all of the apps to build them on a common framework.\n\nWe also forked egui to work on mobile support."}, {"id": 50653081, "au": "egorfine", "dom": 366, "sr": 45, "sc": 4.43, "ep": 5.67, "bs": 0.0, "d": 0, "age": 11.73, "grav": 111.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 3705, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 1.632, "bl": 0.0, "ds": 0.0, "txt": "How is healing brush or content-aware fill different from a generative model?\n\nAll those instruments are generating new pixels that aren't part of the original image. Yet the earlier tools were completely fine for decades* while generative models are evil. All of them are variants of machine learning.\n\nBut yeah, it's a tough call.\n\n(*) but not for altering reality, of course."}, {"id": 50651046, "au": "finder83", "dom": 309, "sr": 46, "sc": 4.27, "ep": 5.81, "bs": 0.0, "d": 3, "age": 17.1, "grav": 202.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 227, "qw": 0, "k": 471, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.77, "fa": 0.0, "gp": 1.141, "bl": 0.0, "ds": 0.0, "txt": "That is an amazing ai image.\n\nBut I do understand the sentiment of not wanting ai images everywhere, even if they are good. It's the same reason I don't want ai writing everywhere. Art has been largely an expression of the human soul and an expression of talent that took years to develop. It is impressive now to get good outputs, but we're quickly nearing the time where you just can't tell any longer. But I think that the human creation and expression still has an intrinsic value. I'd call it their soul put into, it in a way.\n\nWhat about marketing slop? Yeah, it was junk before, but it starts with AI content being acceptable in mass media and marketing, then it could quickly erode the mediums I care about.\n\nThere's also something about AI taking the entirety of human output that still doesn't sit right with me, particularly for non open models.\n\nI'm not a purist, but I do struggle with AI generated content. At the same time I use it to program all day, and wish I didn't have to. I don't think I'd go back to hand written code other than hobby projects or to keep my skills up, now that the genie is out of the bottle, but a part of me wishes agentic coding never existed. I hope we don't do the same with our other forms of art, accepting efficiency and comfort over expression."}, {"id": 50650055, "au": "thakoppno", "dom": 136, "sr": 47, "sc": 4.26, "ep": 5.8, "bs": 0.0, "d": 2, "age": 19.38, "grav": 247.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 6, "k": 572, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.13, "fa": 0.42, "gp": 1.341, "bl": 0.0, "ds": 0.0, "txt": "> Reuters doesn't allow even minor edits\n\nThat’s interesting and splitting hairs here but doesn’t a lot of image processing happen in the camera that resembles AI in some respects?  To take it way too far, there’s never been a single photograph taken ever that actually presents reality."}, {"id": 50653770, "au": "elephant81", "dom": 404, "sr": 48, "sc": 4.18, "ep": 5.06, "bs": 0.0, "d": 0, "age": 10.02, "grav": 87.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 30, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.134, "fa": 0.34, "gp": 0.986, "bl": 0.0, "ds": 0.0, "txt": "Off topic - but I wish you could downgrade Photoshop to pre AI and even Pre 2020 versions. No real imporvement for a huge hit in performance and demand on my mac."}, {"id": 50654020, "au": "slazaro", "dom": 233, "sr": 49, "sc": 4.12, "ep": 5.37, "bs": 0.0, "d": 1, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 1320, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.876, "fa": 0.0, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "Well, no worries about people seeing the stain if you had it, because the NYT paywall would have prevented them from seeing it ;)\n\nJoking aside, I really respect the integrity of not editing photography in general. A person in my family would edit faces of pictures taken at family gatherings to share to everybody, and they wouldn't understand why it annoyed me that they did this, especially without asking or notifying of these changes.\n\nAs soon as you're using a select tool or a brush on a photograph, as far as I'm concerned it's not \"photography\" anymore, it's mixed media. Photography mixed with digital painting. But cropping, tweaking curves, brightness, saturation, gamma, etc, as long as it's a whole-picture change, that's fine."}, {"id": 50652186, "au": "miki123211", "dom": 23, "sr": 50, "sc": 4.06, "ep": 5.38, "bs": 0.0, "d": 2, "age": 13.98, "grav": 146.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "translation_language", "flbl": "Translation & Language (English)", "urls": [], "ig": 1.238, "fa": 0.34, "gp": 1.038, "bl": 0.0, "ds": 0.0, "txt": "Pangram (AI writing detector) is a lot more accurate than people think it is, but it measures something very different than what people think it measures.\n\nLet's say two groups of people are writing scientific papers. The first is a group of native speakers of English who don't actually do any research, generate the paper from scratch, but then rewrite everything in their own words. They'll get a 0% (meaning human written) on Pangram.\n\nLet's say the other group consists of non-native speakers of English who understand the language well, but are bad at writing in a style suitable for publication in a journal, so they write every paragraph in their own language and have AI translate. They've done all the research, they've had human authors understand and accept every single word of the paper, yet Pangram will tell them that the paper has been written by AI."}, {"id": 50655555, "au": "TobiasJacob", "dom": 456, "sr": 51, "sc": 4.06, "ep": 5.16, "bs": 0.0, "d": 0, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 10, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": ["https://getartcraft.com/"], "ig": 1.086, "fa": 0.62, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "Lucky for them, they could just use the free rust based open source alternative. Ironically also written by AI.\n\nhttps://getartcraft.com/\n\nAlso funny to think that AI didn't edit the image, it wrote a tool to edit images."}, {"id": 50653685, "au": "unD", "dom": 124, "sr": 52, "sc": 4.03, "ep": 5.57, "bs": 0.0, "d": 4, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 13, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.956, "fa": 0.0, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "Faithfully rendering is wishful thinking—camera manufacturers decide how to use and process the RAW data (beyond minor exposure/contrast adjustments, see HDR skies, etc.)\nI understand that journalists need to draw a line in the sand, and if the consensus is that in-camera JPGs are a requirement, I'm good with it, do your thing.\n\nBut as somebody who worked in pre-press and post-production for two decades, I can't help but chuckle, as we've been butchering scans first, and digital captures later, in order to make them fit for printing. Nowadays, you open a RAW in the wrong app and you're already screwed—it's quite ironic."}, {"id": 50653710, "au": "account42", "dom": 321, "sr": 53, "sc": 4.02, "ep": 5.56, "bs": 0.0, "d": 6, "age": 10.2, "grav": 90.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 26, "k": 11222, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.063, "fa": 0.7, "gp": 0.734, "bl": 0.0, "ds": 0.0, "txt": "> If you just need a menu for your food truck or a picture of your grandchild with angel wings, maybe those rough prompts with a little refinement are serviceable.\n\nFor the menu case specifically, the main problem (well besides them looking positively awful) is that the generated images just don't represent the product being sold at all. It should be a clear business-shattering false advertising issue but for some reason its tolerated everywhere."}, {"id": 50650161, "au": "Suppafly", "dom": 159, "sr": 54, "sc": 4.0, "ep": 5.54, "bs": 0.0, "d": 1, "age": 19.19, "grav": 243.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 28, "k": 2779, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.139, "fa": 0.42, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": ">Especially for socials, if your brand is an authoritative source, getting hit with a dreaded \"AI generated content\" tag on instagram or facebook is a death blow to your credibility.\n\nA post my wife made about her aunt's funeral got the AI flag on facebook because some random canva background she used behind her aunt's photo was apparently AI generated."}, {"id": 50658975, "au": "bbarn", "dom": 429, "sr": 55, "sc": 3.93, "ep": 5.03, "bs": 0.0, "d": 0, "age": 0.67, "grav": 5.8, "surf": 57.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 3987, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.763, "fa": 0.0, "gp": 0.612, "bl": 0.0, "ds": 0.0, "txt": "These anti-AI posts are starting to sound more like dying pleas than reasoned ones.\n\nI hate it, it makes my profession much harder to work in, but it's not going away.  You can virtue signal all you want, but if you hold onto this stance for long enough, your subscriber base will become nothing but like minded zealots or the occasional curious.  The volume will win in the end, and we need to start assuming that as a truth.  It's too late to fight back against AI, the best we can do is focus on it's impact on privacy and the people that own the pipes.\n\n\"Art\" has always been an evolving concept.  Things in museums today were laughed and called names when they were introduced.  Things have just changed, and adapt, or die."}, {"id": 50650515, "au": "orbital-decay", "dom": 111, "sr": 56, "sc": 3.93, "ep": 5.45, "bs": 0.0, "d": 6, "age": 18.41, "grav": 227.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 12, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.278, "fa": 0.42, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "There's no true image in chemical photography or any other imaging either. That's unimportant pedantry in this case.\n\n>whether it happens on the camera or externally doesn't really change this.\n\nThere's a world of difference in creative freedom between the two, and it also separates taking the photo and processing it. And creative interpretation after the fact is probably not something a reporter should be doing. Leave it to artistic photography."}, {"id": 50654051, "au": "oblio", "dom": 270, "sr": 57, "sc": 3.93, "ep": 5.43, "bs": 0.0, "d": 3, "age": 9.21, "grav": 77.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 28169, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.33, "fa": 0.34, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "Meh. Even your examples contain the kernels of counter examples.\n\nJapan is wildy more culturally relevant than it was 40 years ago, because it invested in exporting its media.\n\nSouth Korea, which you missed, is doing exactly the same.\n\nMy guess would be that China has not focused on this as much. Once they do, they will absolutely flood the world with their media.\n\nI imagine China was/is more focused on renewable energy, batteries, EVs and other high technology, LLMs. At some point they're going to dominate most industrial categories that matter and they will probably turn on the media machine. Well, they already have a large media machine, they will turn up the media export dial."}, {"id": 50655602, "au": "Forgeties79", "dom": 217, "sr": 58, "sc": 3.93, "ep": 5.35, "bs": 0.0, "d": 1, "age": 6.16, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 4019, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.575, "fa": 0.34, "gp": 0.466, "bl": 0.0, "ds": 0.0, "txt": "Honestly for 90% of cases it’s really about whether or not you used generative AI. That’s usually pretty easy to say yes/no to. Your program isn’t going to hijack your keystrokes and start making stuff out of thin air. I use AI tools a ton in video editing and audio production, but they are AI tools in the sense that machine learning is involved. Captioning, noise removal, etc. Most people are not getting upset about that\n\nNow when it comes to Adobe, I just don’t trust them as a company so that’s a different matter entirely."}, {"id": 50649740, "au": "h4kunamata", "dom": 365, "sr": 59, "sc": 3.93, "ep": 5.3, "bs": 0.0, "d": 2, "age": 20.02, "grav": 261.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 7, "k": 443, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.42, "fa": 0.42, "gp": 0.529, "bl": 0.0, "ds": 0.0, "txt": ">Nobody is moving to LibreOffice but Euro-Office\n\nEuro-Office still uses Microsoft proprietary extension instead of open ones, and it is new.\n\nAlso, Europe only are pushing to use Euro-Office instead of Microsoft which also has a server option to work like Microsoft Office 365 so companies can have a \"cloud\" options for employess."}, {"id": 50655137, "au": "embedding-shape", "dom": 190, "sr": 60, "sc": 3.93, "ep": 5.23, "bs": 0.0, "d": 2, "age": 6.99, "grav": 52.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.829, "fa": 0.0, "gp": 0.644, "bl": 0.0, "ds": 0.0, "txt": "Same goes for game development and listing things on Steam. At least you can include a description, but supposedly you have to add this notice regardless of how little/much you used AI, no difference between \"fully vibe-coded app\" and \"asked a LLM some questions\", both would lead to your game being filtered away in a bunch of places.\n\nI'm currently working on a Steam Frame application for playing VR videos I'm hosting on Itch and shared on reddit. One of the most common questions is \"I see there is a AI disclosure, how much AI did you actually use?\", even when I have a full paragraph exactly explaining how much AI was used..."}, {"id": 50652586, "au": "thrw045", "dom": 313, "sr": 61, "sc": 3.93, "ep": 5.2, "bs": 0.0, "d": 6, "age": 12.84, "grav": 128.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 335, "qw": 0, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.682, "fa": 0.0, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "I understand what you're saying and I agree with it to a certain extent, but I also think it's even more complicated than that.\n\nI can only speak for myself but I know what it's like to create something from scratch and struggle. I created music and images for 20+ years the manual. \nI'll use music as an example.\nFor me music making was always part curation. I'm looking for sounds that I want and I always had a vision / idea for what I wanted to create before I started the process. The thing is, nothing I ever did perfectly captured my intent. I experimented for hours and came up with techniques that resembled the idea I had and sounded good, and then I went with that.\n\nI think it works like this for a lot of artists. A lot of music is discovered through experimentation with gear, melodies, synths etc, not intently created by the millisecond. It's a mix of discovery / compromise and intent.\nWhat differentiated any artist from any other was taste and vision. Taste is what makes an artist persist through struggling time and never giving up, even when the going gets rough and things aren't working out.\n\nThe other thing is that sometimes you discover a cool piece of technology like a synth, a drum machine or a plugin in Photoshop, and you discover that if you use it in a particular way, it creates a cool sound or a cool effect on an image. You didn't create that sound or effect pure"}, {"id": 50651474, "au": "doodlebugging", "dom": 362, "sr": 62, "sc": 3.93, "ep": 5.19, "bs": 0.0, "d": 4, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 3021, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "photoshop_adobe", "flbl": "Photoshop & Adobe (Software)", "urls": [], "ig": 1.782, "fa": 0.0, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "This is the most annoying thing about the situation to me. In order to guarantee that the data you send to your client is in a format that they can instantly use with no problems you may need to retain and use both office suites so that you can verify that you haven't broken someone's internal company template. Color palettes, fonts, cell formats, borders, page breaks, etc have to be checked especially if you are saving a file in a specific format non-native to that office suite. It feels like some things are intentionally borked to add friction to the process of document sharing."}, {"id": 50648451, "au": "milkytron", "dom": 172, "sr": 63, "sc": 3.93, "ep": 5.13, "bs": 0.0, "d": 1, "age": 22.16, "grav": 308.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2161, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.141, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "I'm a layperson when it comes to the creative tools space, so please pardon my ignorance here. What is stopping someone from making the edits with AI, and then taking a screenshot of the final image, and using that screenshot?\n\nAre there not workarounds that exist?"}, {"id": 50652835, "au": "thomasahle", "dom": 191, "sr": 64, "sc": 3.93, "ep": 5.06, "bs": 0.0, "d": 1, "age": 12.34, "grav": 120.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 43, "k": 7006, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.029, "fa": 0.42, "gp": 0.993, "bl": 0.0, "ds": 0.0, "txt": "> This is one of the biggest issues right now. It's nearly impossible to separate \"this image was fully generated with AI\" versus \"I made a minor edit to the colors or did a cutout or improved the layout with AI\" when the endpoint is an image.\n\nMaybe they can do a blockchain thing. The original photos should be cryptographically signed from the camera manufacturer.\n\nAll further edits need to go in a ledger so this party tools (e.g. Facebook) can verify what edits were made."}, {"id": 50653896, "au": "thrw045", "dom": 320, "sr": 65, "sc": 3.93, "ep": 8.44, "bs": 3.39, "d": 12, "age": 9.65, "grav": 83.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 365, "qw": 38, "k": 19, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 7, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.641, "fa": 1.04, "gp": 1.117, "bl": 1.28, "ds": 0.0, "txt": "> Yeah I just can't place that struggle into the same box, sorry. Especially when still after months your \"taste\" that came with the struggle includes you asking the AI for what to do next.\n\nYeah I agree with you it's not the same struggle. I made music the manual way for 20 years so I know what it's like.\n\nAlso the reason I ask AI for tips is to see what it comes up with and if there's anything interesting there. Believe it or not most of the time I do not use the advice as it's pretty generic. Most of the good ideas in the images are my own ideas.\n\n> It's like faking your performance\n\nI understand this and I think it's true, but what I would argue is that AI art comes with a different kind of \"performance\". It comes with the performance of being good at prompting and understanding how the AI works and coming up with images that don't immediately read as AI (at least as of today, I'm sure the standard will shift over time).\n\nIt also comes with the ability to create interesting compositions and ideas, even though this is subjective, this is where the taste comes in. It comes in being very deliberate with the images you publish and having high standards when generating the image. Hopefully those high standards should show in the end product and others can recognize it when comparing it to images with less effort behind them. I'm sure this will shift over time as more and more pe"}, {"id": 50650736, "au": "tlhunter", "dom": 390, "sr": 66, "sc": 3.93, "ep": 5.03, "bs": 0.0, "d": 1, "age": 17.92, "grav": 218.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2455, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.666, "fa": 0.0, "gp": 0.766, "bl": 0.0, "ds": 0.0, "txt": "That's correct! Most journalists would use something like lightroom/darktable which do global color grading changes instead of local edits. Both tools do support deleting local dust specks but otherwise make it hard to do anything naughty.\n\nFunny enough, Reuters recently told photographers to start using straight out of camera jpeg instead of editing raw files."}, {"id": 50649849, "au": "blazarquasar", "dom": 409, "sr": 67, "sc": 3.93, "ep": 4.95, "bs": 0.0, "d": 3, "age": 19.82, "grav": 257.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 9, "k": 393, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_content", "flbl": "Media & Content (Generated)", "urls": [], "ig": 1.25, "fa": 0.42, "gp": 0.563, "bl": 0.0, "ds": 0.0, "txt": "> It’s got a lot of activity and a lot of contributors.\n\nYou are saying this as if it’s a good thing. It’s up there on the list of the worst offenders of absolute slop generation. Thousands of PR being merged with absolutely zero oversight or direction. I’m very confident that there isn’t a single person in the list of contributors that understands even remotely what’s going on."}, {"id": 50650507, "au": "defrost", "dom": 395, "sr": 68, "sc": 3.93, "ep": 4.92, "bs": 0.0, "d": 1, "age": 18.42, "grav": 228.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 26384, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "photo_camera", "flbl": "Photo & Camera (Digital)", "urls": [], "ig": 1.734, "fa": 0.0, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "At the very least for all the things photographers did in the wet film days; cropping, framing, zooming in, bringing up, pushing down, shading out glare, etc.\n\nThere's a huge repertoire of wet film developing room techniques and tricks that have existed for many decades.\n\nThe thing about being a journalistic photographer is the moment happens and passes- and that once in a lifetime historic shot in an instant may well have many minor flaws despite years of experience."}, {"id": 50653036, "au": "egorfine", "dom": 156, "sr": 69, "sc": 3.93, "ep": 4.9, "bs": 0.0, "d": 1, "age": 11.84, "grav": 113.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 13, "k": 3705, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.027, "fa": 0.42, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "> your final result can't include any pixels from a generative model. It's a strange dance.\n\nHow is healing brush or content-aware fill different from a generative model? All those instruments are generating new pixels that aren't present anywhere in the image. But the earlier ones are completely safe, generative models are evil while all of them are variants of machine learning.\n\nBut yeah, it's a tough call."}, {"id": 50649637, "au": "hannasanarion", "dom": 181, "sr": 70, "sc": 3.93, "ep": 4.9, "bs": 0.0, "d": 3, "age": 20.22, "grav": 265.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 4695, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "image_tools", "flbl": "Image & Tools (Art)", "urls": [], "ig": 1.664, "fa": 0.0, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "In order for this type of laundering to work, at least as far as i've seen published, you need to add noise to the source image to swamp the distributed low-significance watermarking bits, and then use the diffusion model to resharpen the image.\n\nBut in doing so, you will have added detail, possibly changed depicted text, stuff like that, genuine information that was also
