eneral, commentary"}], "source_categories": [{"category": "general_web", "count": 4}, {"category": "investigative_or_tech_press", "count": 1}], "story_anchors": ["diseases", "cured", "phase", "cure", "human", "medicine", "patients", "number", "iii", "drug", "site", "approved", "little", "process", "target", "effects", "trials", "zero"], "largest_root": {"root_id": 50657944, "author": "chrisamiller", "slots": 33, "start_dom": 1, "end_dom": 33, "share_pct": 23.9, "top_dom1_age": 0.9, "top_dom1_author": "chrisamiller"}, "buried_cutoff": 41, "rescue_top_k": 28, "ablations": [], "tournament": [], "comments": [{"id": 50658470, "au": "wpietri", "dom": 17, "sr": 1, "sc": 10.17, "ep": 10.17, "bs": 0.0, "d": 2, "age": 0.11, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 41, "qw": 0, "k": 59432, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": ["https://www.quantamagazine.org/how-virus-like-jumping-genes-became-our-partners-in-evolution-20260921/"], "ig": 1.296, "fa": 2.08, "gp": 0.823, "bl": 0.0, "ds": 0.0, "txt": "I think that's wildly optimistic. Evolution isn't some simple, predictable hill-climbing process because it happens in competitive ecosystems that are constantly evolving as well. There is an enormous amount of path dependence. E.g., the role that \"junk\" genes are now known to play: https://www.quantamagazine.org/how-virus-like-jumping-genes-..."}, {"id": 50657942, "au": "pandoro", "dom": 105, "sr": 2, "sc": 8.92, "ep": 8.92, "bs": 0.0, "d": 0, "age": 0.93, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 101, "qw": 0, "k": 199, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": ["https://imsb.ethz.ch/research/sauer/research/metabolomics.html"], "ig": 1.831, "fa": 1.24, "gp": 0.747, "bl": 0.0, "ds": 0.0, "txt": "Biological systems excel at reducing entropy but in an incredibly chaotic and anti-fragile way. See for example the currently identified metabolic pathways in mouse liver [0]. It's a huge mess of very complicated feedback loops, n-th order effects, hysteresis (history-dependence), etc. Predicting that AI will cure cancer or complex diseases in the next 10 years is pure hubris (or marketing) and speaks to the lack of knowledge of \"real life\" biology. It's like saying that AI will allow to explore another galaxy in the next decade. However, it will probably help in identifying specific targets or speeding up drug development for certain well-understood diseases.\n\n[0]: https://imsb.ethz.ch/research/sauer/research/metabolomics.ht..."}, {"id": 50657953, "au": "toufka", "dom": 77, "sr": 3, "sc": 8.07, "ep": 8.07, "bs": 0.0, "d": 1, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 3533, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.584, "fa": 0.95, "gp": 1.129, "bl": 0.0, "ds": 0.0, "txt": "There are LOTS of cures, but complex diseases often break off into branches of increasing difficulty.  Curing 50% of a type of disease, and then curing the next 50% doesn't get to 100% - but lots of individuals have certainly been cured.\n\nSome of the new cell therapies have ~50% of >10,000 patients alive and progression free 5 years after dosing without any maintenance therapy.  There is otherwise little chance of survival of multiple myeloma without treatment.\n\nThe medical bar for a \"cure\" is so high that scientific modesty prevents the word from being used in a technical context - but there are many many people alive today that would not otherwise be because of these medicines."}, {"id": 50658146, "au": "jollymonATX", "dom": 34, "sr": 4, "sc": 6.8, "ep": 6.8, "bs": 0.0, "d": 0, "age": 0.59, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 99, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.343, "fa": 1.17, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "The criteria of phase 3 passed is a very long process. You have 0 as a statement of capabilities, in this context it is not that alone. The current zero read is a function of time to pass a phase 3 clinical trial which is not plausible currently. It takes 6-10 years from stage 1 to a passing stage 3. 10 years ago was 2016, 6 years ago was 2020. If that is 0 in 2030 then it might be interesting."}, {"id": 50657911, "au": "skeledrew", "dom": 116, "sr": 5, "sc": 6.48, "ep": 6.48, "bs": 0.0, "d": 0, "age": 0.96, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.519, "fa": 0.68, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "It says \"1,457 days since ChatGPT launched\", but really, how many of those days have ChatGPT been in use for to find cures? Better yet, how long has it been since AI has gotten to the point where people actually think it's useful in searching for cures? I'm guessing it's around the time it also got to the point where it started making major strides in software development, ie last November. And IIRC we've only started to hear of AI being seriously used in biology since probably the 2nd quarter of this year. Yet this site makes it seem as though likely-good-enough AI has been at this problem for almost 4 years. Smells very dishonest."}, {"id": 50658053, "au": "AlexandrB", "dom": 80, "sr": 6, "sc": 6.37, "ep": 6.52, "bs": 0.0, "d": 1, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 59, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": ["https://en.wikipedia.org/wiki/Interferon\u0023Interferon_therapy"], "ig": 1.51, "fa": 0.62, "gp": 0.832, "bl": 0.0, "ds": 0.0, "txt": "Most parasites have cures now. This is a huge deal. Plenty of fungal infections (e.g. athletes foot) have cures as well. There's antibiotics for bacteria, of course. Besides diseases of disregulation, like cancer, viruses are the main type of illness that resists an outright \"cure\". There are some \"antivirals\"[1], but they have a wide range of effectiveness and sometimes nasty side effects.\n\n[1] https://en.wikipedia.org/wiki/Interferon\u0023Interferon_therapy"}, {"id": 50657944, "au": "chrisamiller", "dom": 1, "sr": 7, "sc": 6.1, "ep": 6.25, "bs": 0.0, "d": 0, "age": 0.93, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 778, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.534, "fa": 0.34, "gp": 1.154, "bl": 0.0, "ds": 0.0, "txt": "Look, I work on this stuff, and anyone who says that AI isn't helping to accelerate science is wrong. The folks who say that AI will cure all human disease are also wrong.\n\nThe truth is that biology is horrendously complicated and obtaining measurements of what's going on inside cells is very difficult. That's the primary bottleneck, not the data crunching. (The reason that AlphaFold was so successful was because it was built on 50 years of meticulously gathered data in the PDB!)\n\nSo yeah, AI will help us sift through the data and formulate new hypotheses. It'll speed up processes and uncover new angles. I'm excited about that! It won't however, \"solve biology\", and I'll be glad when we slide down from the peak of this hype cycle and get back to the business of systematically figuring things out."}, {"id": 50658008, "au": "athrowaway3z", "dom": 134, "sr": 8, "sc": 5.84, "ep": 5.84, "bs": 0.0, "d": 0, "age": 0.82, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1985, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.026, "fa": 0.9, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "I'll throw out a number for posterity.\n\nBy 2028 we will have found a 1000 that will go on to be approved eventually.\n\nBut basically everything here depends on the regulators - we might have found 10.000 as early as next year (that would actually work), but not the time/money/incentive to bet on it and go through the process."}, {"id": 50657788, "au": "tensor", "dom": 62, "sr": 9, "sc": 5.72, "ep": 5.72, "bs": 0.0, "d": 1, "age": 1.16, "grav": 7.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 7464, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.653, "fa": 0.34, "gp": 0.595, "bl": 0.0, "ds": 0.0, "txt": "I mean it's mostly just some sneer stuff. Pretty pathetic honestly. Obviously we're only consider genAI to be AI too, because claiming that all the various machine learning algorithms used to assemble the human genome map, find genes and promoter regions, compare species, was not useful would be pretty insane.\n\nWhat this sneer site is measuring is gen-ai aided from start to finish. The average time from discovery to approval in the US is 10-15 years, AI or no AI."}, {"id": 50657933, "au": "nsxwolf", "dom": 64, "sr": 10, "sc": 5.71, "ep": 5.71, "bs": 0.0, "d": 1, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 12668, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.269, "fa": 0.68, "gp": 0.542, "bl": 0.0, "ds": 0.0, "txt": "Need to define \"cure\". Many cancers are curable. Skin cancers are often curable with a scalpel.\n\n\"Chemotherapy\" is a very broad category. Does it need to be 100% effective in 100% of patients for it to be considered a cure? Some chemotherapy regimens could absolutely be described as cures.\n\nThere will never be \"a cure\" for cancer, because cancers are very different. There will be many different cures."}, {"id": 50658212, "au": "mbgerring", "dom": 112, "sr": 11, "sc": 5.58, "ep": 5.58, "bs": 0.0, "d": 0, "age": 0.51, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 3915, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.512, "fa": 0.28, "gp": 0.845, "bl": 0.0, "ds": 0.0, "txt": "Here’s something I wish people understood better:\n\nCapital is finite. If one industry is absorbing most of the capital to do one thing, it means we can’t do other things.\n\nEffectively all of the world’s capital is tied up in LLMs or data centers right now.\n\nThe reasons given by AI boosters as to why society should allow this to continue, rather than diverting some of that capital to work on other pressing problems, are:\n\n- There will be an explosion of economic growth from this investment\n\n- We will cure all disease\n\n- If we don’t, China and/or a magic computer genie will kill us all\n\nReal material benefits need to occur as a result of the sacrifice we are all making as a society to hand these people trillions of dollars, or it needs to be taken from them.\n\nIf you think being held accountable is “sneering”, idk, good luck in court"}, {"id": 50658354, "au": "senordevnyc", "dom": 51, "sr": 12, "sc": 5.42, "ep": 5.56, "bs": 0.0, "d": 2, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1834, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.279, "fa": 0.68, "gp": 0.427, "bl": 0.0, "ds": 0.0, "txt": "Why is eliminating “all” human disease the bar? If AI reduces preventable deaths by 1%, or prolongs quality lifespan by 1%, that’s still tens of millions or hundreds of millions of lives. That doesn’t make the framing of “slowing down AI is murder” automatically true, but you’re not really engaging with the argument honestly if you’re focusing on the “all human disease” part."}, {"id": 50658096, "au": "corry", "dom": 35, "sr": 13, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 0, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 2171, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.85, "fa": 0.0, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "(1) Totally respect holding people accountable, especially for very optimistic claims in a hype industry;\n\n(2) The slow rate of FDA trials and approvals are a distinct and separate fly in the ointment that has nothing to do with AI's ability to advance medicine.\n\ni.e. AI could invent a staggeringly effective cure for disease; whether or not Americans can quickly access said cure is an entirely different (and country-specific) matter.\n\n(3) Yes, Amodei et all should take that into account when claiming AI will cure specific diseases on a specific timeline.\n\n(4) Let's say Amodei et all is right, and the FDA remains slow and careful - one can easily imagine a future where medical tourism skyrockets based on which countries can most quickly assess and approve new AI-sourced treatments. This may lead to many costly/deadly mistakes, but also might be a net positive overall."}, {"id": 50658281, "au": "theptip", "dom": 13, "sr": 14, "sc": 5.14, "ep": 5.44, "bs": 0.0, "d": 2, "age": 0.39, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 12410, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.614, "fa": 0.34, "gp": 0.464, "bl": 0.0, "ds": 0.0, "txt": "This is the right lens; in other words, is it worth rallying 5-10% of GDP on this project for the next few years?\n\nI think it clearly is.\n\nAlso, the level of discourse in the general population requires single-sentence summaries, and “improve our rate of progress on this very hard task with increased investment that will be ROI positive, make a big impact, but likely not fully solve the thing” just isn’t a banner that civilization is capable of rallying around.\n\n“Cure all disease” might be technically inaccurate but I think we’ll see results that are revolutionary enough that folks won’t be mad we didn’t literally cure everything. (Concretely, things like shifting to personalized targeted mRNA medication, especially for cancer.)"}, {"id": 50657919, "au": "octoberfranklin", "dom": 129, "sr": 15, "sc": 5.06, "ep": 5.28, "bs": 0.0, "d": 0, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 1952, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.502, "fa": 0.34, "gp": 0.538, "bl": 0.0, "ds": 0.0, "txt": "Most of the work of \"curing\" a disease is demonstrating that the proposed therapy is safe and effective -- i.e. running the trials.  This is 99.99% of the work involved in curing.\n\nWith only a modest amount of compute power and no AI, I could enumerate trillions of chemically-stable compounds and dump the list in some S3 bucket.  If one of them later turned out to cure a disease, would that meant that I cured it?\n\nIf you want to keep the current criteria, the website should be diseases-cured-by-molecules-suggested-by-ai.com"}, {"id": 50658102, "au": "toufka", "dom": 59, "sr": 16, "sc": 4.8, "ep": 5.09, "bs": 0.0, "d": 4, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 3533, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.651, "fa": 0.0, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "There's a reasonable argument to be made that so far AI's largest contribution to drug development is everything NOT science related - it's made presentations easier to make, meetings more accurate, papers easier to find, read and summarize, and figures easier to generate.  It also makes basic number crunching faster, and more statistically accurate.  ALL of those have dramatically increased the rate at which a drug company can do its work.  It's not clear that the sciency part is yet making much of a dent outside of loud proclamations.\n\nAnd if there's a significant ramp up in actual AI cures, then let's watch that ticker roll - I'm all for it.  But that ticker will take years to start, and we should be honest and realistic about that fact."}, {"id": 50658227, "au": "jackdecker", "dom": 82, "sr": 17, "sc": 4.75, "ep": 4.97, "bs": 0.0, "d": 0, "age": 0.48, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 47, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.536, "fa": 0.22, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "As soon as someone figures out a “harness” for testing against human biology I think we’ll see this explode.\n\nFrankly I’m not sure what this looks like at all (I am not biology adjacent other than my partner being in this field).\n\nNaively however it feels like the highest order bit here would be to create some “human body emulator” that an agent can accurately test against.\n\nCreating something like this feels a lot more plausible than agents making predictions relatively blind to their effects (but somehow wiring all of a human bodies interactions feels about as difficult as curing these diseases in the first place)"}, {"id": 50658110, "au": "hn_throwaway_99", "dom": 31, "sr": 18, "sc": 4.15, "ep": 5.03, "bs": 0.0, "d": 1, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 32, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.313, "fa": 0.42, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "> Look, I work on this stuff, and anyone who says that AI isn't helping to accelerate science is wrong. The folks who say that AI will cure all human disease are also wrong.\n\nI think that's a very fair framing, but I also think/hope that the author's of this page would agree with you. I feel like they are pushing back against a narrative from AI boosters that their should be no/little AI regulation or constraints becausing doing so would be equivalent to \"murder\". They actually highlight on the page where AI is helping move scientific progress (e.g. their exact words are \"AlphaFold is a genuine breakthrough\"), but the AI hype-sters aren't just saying \"AI will accelerate scientific progress in biology\", they're saying we won't have to worry about disease again."}, {"id": 50657723, "au": "toufka", "dom": 86, "sr": 19, "sc": 4.07, "ep": 4.07, "bs": 0.0, "d": 1, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3533, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "Building wet nano-machines a few orders of magnitude smaller than the transistors in a GR100 and throwing them into a wet mixture of other such machines, at room temp is, in fact, an extremely complex, and difficult to predict process. Especially when you can't cause a fatal disruption to the currently-running few-billion year old genetic program."}, {"id": 50658339, "au": "whatisthiseven", "dom": 42, "sr": 20, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 1, "age": 0.28, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 1090, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.558, "fa": 0.0, "gp": 0.26, "bl": 0.0, "ds": 0.0, "txt": "The number of migraine sufferers that would love for a better, higher efficacy, lower symptom drug is enormous. A cure doesn't exist, because \"migraine\" is hundreds of causes and effects.\n\nDiscounting the suffering of all those people because AI didn't \"cure\" migraines is ridiculous, as you say.\n\n\"Curing\" depression is likely impossible, as would many other psychiatric disorders. Should we discount those that can live normal lives when we find better pathways to managing those disorders and diseases?\n\nThe tracker is nothing more than anti-AI virtue signaling."}, {"id": 50658309, "au": "atleastoptimal", "dom": 16, "sr": 21, "sc": 3.91, "ep": 5.01, "bs": 0.0, "d": 1, "age": 0.35, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 5296, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.62, "fa": 0.0, "gp": 0.828, "bl": 0.0, "ds": 0.0, "txt": "I think even though it's hard to measure what's going on in human cells, biology is based on chemistry and physics, which are finite tractable problems. All proteins are mechanical structures which interact with each other and the environment to accomplish certain goals. DNA codes for proteins. All provide measurable signals, much more so than chaotic systems. If biology were a chaotic system then evolution would have no signal to build on. Since all evolution was built on fitness signals which persist from genes to phenotype it is not chaotic, and thus within a measure of computational reducibility."}, {"id": 50658153, "au": "epistasis", "dom": 24, "sr": 22, "sc": 3.88, "ep": 4.32, "bs": 0.0, "d": 1, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 32445, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.612, "fa": 0.0, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "Agreed. It would be more accurate to say \"diseases cured by computer\" than \"diseases cured by AI.\"\n\nSince computers have been around, they've been involved in nearly every \"cure,\" but saying \"by computer\" would be a bit weird. It's just one tool among many.\n\nWhat biology is missing is the measurement technology. Some significant advances there, where we could start to get better vision into what's going on, might result a \"by technology\" type moniker, IMHO. There's also the bioengineering technology, like mRNA vaccines, that could lead to cures.\n\nWe might get a few new drugs from deep-net based protein design, soon. But do protein models count as \"AI\"? Perhaps, sure? RDF4-Proteina is < 500M parameters. That's not usually thought to be big enough for \"intelligence\" in the language sense. But it's enough to capture all the data we've generated about proteins."}, {"id": 50657830, "au": "fedupnow", "dom": 120, "sr": 23, "sc": 3.8, "ep": 4.02, "bs": 0.0, "d": 0, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.277, "fa": 0.28, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "Should be llms, because obviously ML is going to play a role in drug discovery and has for close to a decade.\n\nIf we start giving credit to LLMs inadvertently by liberally using the term AI, this becomes a marketing benchmark for AI labs that don't deserve it."}, {"id": 50657980, "au": "joenot443", "dom": 106, "sr": 24, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 0, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 4273, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.321, "bl": 0.0, "ds": 0.0, "txt": "It seems a bit strange to build a website which claims to be tracking something so important but choosing not include any information on who's behind the site, or any way of contacting them.\n\nIf the author is earnestly interested in tracking progress, wouldn't it make sense to have a contact link so others can contribute? I'd expect it's someone with some history or background in healthcare, given their interest.\n\nOr is it possible they had some other motivation here?"}, {"id": 50658225, "au": "nisegami", "dom": 32, "sr": 25, "sc": 3.6, "ep": 4.92, "bs": 0.0, "d": 1, "age": 0.48, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 28, "k": 1555, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.583, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">The truth is that biology is horrendously complicated and obtaining measurements of what's going on inside cells is very difficult. That's the primary bottleneck, not the data crunching.\n\nOn first reading, you're quite obviously right. We have way more candidate drugs/treatments/etc than we could ever hope to rigorously test. But I think there's a possibility that AI doesn't just \"speed up processes and uncover new angles\" but also unlocks sophisticated modelling of biology on a level far beyond what we can do today. This could genuinely shorten the loop for biologic research and put us in the realm of \"solving biology\".\n\nNow, I don't think we're going to see this happen next month or even next year. I think a prerequisite for that scenario would be AI first revolutionizing computing hardware enough to unlock enough performance to wrangle biology. My overall point is that I think you're too firm on that \"The folks who say that AI will cure all human disease are also wrong.\"."}, {"id": 50658408, "au": "lanthissa", "dom": 69, "sr": 26, "sc": 3.57, "ep": 4.01, "bs": 0.0, "d": 0, "age": 0.18, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 450, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.286, "bl": 0.0, "ds": 0.0, "txt": "Its pure what if right now, but imagine if we do hit the point where ai is developing lab results that are super promising across a wide variety of problems in disease similar to mathematics now.\n\nwhere it goes from not good,  to suddenly crossing a threshold and theres breakthroughs daily.\n\nDo people think every country is going to continue to have multi-year long approval processes?\n\nSomeones going to break, and say take if you want its your call, then once it works people who have chronic issue will start use drugs that didnt go through trials."}, {"id": 50658005, "au": "scotty79", "dom": 126, "sr": 27, "sc": 3.56, "ep": 4.0, "bs": 0.0, "d": 0, "age": 0.82, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 8, "k": 15735, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.083, "fa": 0.42, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "> Phase I, II, or III is a promise with paperwork.\n\nAI slopped site that counts cures invented by AI, that got good only this year, while medical trials usually taking many years.\n\nI hope the author keeps it updated in the following years."}, {"id": 50658163, "au": "bilater", "dom": 117, "sr": 28, "sc": 3.37, "ep": 3.59, "bs": 0.0, "d": 0, "age": 0.57, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 1038, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "What the hell do you people want? I feel like at this point you have to be either stupid or so driven by ego to ignore AI’s impact.\n\nAny take along the lines of “It’s been X years (four at most, lol), what has AI actually done?” is dumb because AI is not a static thing. It improves. And boy, has it improved. The number of Millennium Prize Problems AI had solved two months ago was zero. Now it’s not.\n\nYou’ll see the same thing with diseases. And it will be a good thing. The value it creates will dwarf the sum total of all the value you and your peers on this thread would have added to society in your lifetimes. And you need to deeply internalize that and be okay with it.\n\nBecause at some point, your inability to come to terms with that makes you the problem. You’re the liability now."}, {"id": 50658496, "au": "fabian2k", "dom": 19, "sr": 29, "sc": 3.3, "ep": 4.4, "bs": 0.0, "d": 2, "age": 0.08, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 12765, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 0.84, "fa": 0.68, "gp": 0.337, "bl": 0.0, "ds": 0.0, "txt": "Evolution doesn't have to calculate or predict. It just runs experiments, a lot of them over very large timeframes. They said AI would cure all disease in the next 10 years, not the next 100 million years."}, {"id": 50658047, "au": "moffkalast", "dom": 103, "sr": 30, "sc": 3.12, "ep": 3.56, "bs": 0.0, "d": 1, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 21, "k": 9622, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.006, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The target and the molecule were both chosen or designed by AI — not just “AI was used somewhere in the building.”\n\nIt will stay zero as long as there is someone breathing in the general vicinity who is able to take the credit for it instead. Unless it's done by Anthropic or OAI internally ofc."}, {"id": 50658318, "au": "nerevarthelame", "dom": 109, "sr": 31, "sc": 3.1, "ep": 3.76, "bs": 0.0, "d": 1, "age": 0.33, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1721, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.325, "bl": 0.0, "ds": 0.0, "txt": "Because they need good PR. It's not like the mathematics work they're doing is directly profit-driven, after all. No one's gonna pay Anthropic every time they cite the GRH.\n\nI expect the AI labs ARE putting a fair amount of resources toward medical research, but it's not as immediately fruitful for the sort of reasons you mentioned."}, {"id": 50657924, "au": "wwwtyro", "dom": 127, "sr": 32, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 0, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 923, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.2, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "Skepticism is healthy, but this feels very \"It hasn't happened, so it won't happen\" to me:\n\n\"AI does not get a discount for being exciting in a keynote.\"\n\"The people selling AI have put a timeline on curing disease.\"\n\nI think if one is aligned with the skepticism, this probably sounds perfectly fine. If one is neutral or optimistic, it probably sounds bitter/passive aggressive."}, {"id": 50658421, "au": "yieldcrv", "dom": 89, "sr": 33, "sc": 3.02, "ep": 3.9, "bs": 0.0, "d": 0, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.154, "fa": 0.34, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "Good luck Rentosertib!\n\nHow many other drugs and treatments have passed all trails in the same 1,457 days that this site counts?\n\nHow many AI created candidates have failed trails and their applications been pulled?\n\nHow many non-AI ones?\n\nWould make the site more useful, especially while the counter is 0"}, {"id": 50658462, "au": "ViktorRay", "dom": 87, "sr": 34, "sc": 2.84, "ep": 3.72, "bs": 0.0, "d": 0, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 2069, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "I'm going to echo some of the other comments and say that this page is too harsh when it comes to using \"cured\" as the sole criterion for success.\n\nWe have so many diseases and other medical conditions with drugs that do not cure but do succesfully treat the condition. HIV was a death sentence. We have drugs that treat it to the point where the virus is undetectable and people can live long happy lives. But this website would have you belive that doesn't count because these drugs are not curative.\n\nIf AI creates drugs that treat diseaases to the same level of successs that HIV drugs have in treating HIV....then that is a success. An incredible success. And this website will ignore it.\n\nI strongly urge the person who created this website to reconsider."}, {"id": 50658381, "au": "exizt88", "dom": 119, "sr": 35, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 0, "age": 0.21, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 6, "k": 2324, "kpp": 12.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.648, "fa": 0.42, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "So tired of this AI slop. Can't people do the bare minimum and read what the AI has barfed out on the webpage they're sharing with the world.\n\n> This page does not poll live.\n\nGeez, thanks."}, {"id": 50657831, "au": "naet", "dom": 76, "sr": 36, "sc": 2.79, "ep": 4.18, "bs": 0.0, "d": 0, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2817, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.77, "bl": 0.0, "ds": 0.0, "txt": "AI aside, what medical \"cures\" are out there?  I can think of antibiotics curing certain infections but not much else.\n\nWe have a lot of medicines to manage symptoms (which is still important, since symptoms can be deadly and managing them long enough can lead to a full recovery), and we have vaccines that have been highly effective as preventative measures.  But I can't think of many medicines that will cure a disease once you've got it.  Not even common illnesses like colds or flu have any known cures."}, {"id": 50658343, "au": "mw888", "dom": 36, "sr": 37, "sc": 2.78, "ep": 3.59, "bs": 0.0, "d": 1, "age": 0.27, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 427, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.506, "fa": 0.0, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "(4) is interesting under a more optimistic lens. Say that the research done for AI-driven medicine has a high quality, but of course still would not surmount the U.S. system's lengthy process.\n\nMedical tourism's safety would not then be based on the regulatory body of the country hosting the treatment, but on the quality of research. If that quality of research is greater than the quality of research needed to make it out of phase III, and AI makes that research easier to create, improve, and check, then the U.S. regulatory body will become in some ways obsolete."}, {"id": 50658460, "au": "crawshaw", "dom": 37, "sr": 38, "sc": 2.72, "ep": 2.94, "bs": 0.0, "d": 0, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3548, "kpp": 9.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.183, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "The common refrain that people overestimate progress on a two-year horizon and underestimate it on a ten-year horizon holds for applications of AI. These tools will be very useful in medical research, I'm sure they will become indispensable. But it takes a little longer than anyone expects, then it sneaks up on you all at once."}, {"id": 50658177, "au": "password54321", "dom": 96, "sr": 39, "sc": 2.44, "ep": 3.69, "bs": 0.0, "d": 3, "age": 0.55, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1042, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Solving problems with little amount of data and open ended exploration. A good example people bring up is if AI could ever come up with general relativity if you only gave it all data before it was defined.\n\nNot everything can be solved by churning out synthetic data and RLVR and not everything has a verifier / checker that can be used as a reward signal. But people have overcorrected their priors due to a highly upvoted post with a sensationalist title."}, {"id": 50658275, "au": "briandw", "dom": 113, "sr": 40, "sc": 2.21, "ep": 3.46, "bs": 0.0, "d": 1, "age": 0.41, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1105, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.36, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Capital can be created and destroyed, it's not fixed. Yes in the sort term there will be a cash crunch. New technologies that reduce labor cost and produce new and better goods and services are how we get more capital and a bigger economy. Zero sum thinking is not how we make things better."}, {"id": 50658335, "au": "VeninVidiaVicii", "dom": 25, "sr": 41, "sc": 2.18, "ep": 3.72, "bs": 0.0, "d": 1, "age": 0.29, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 1047, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.173, "fa": 0.22, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "I also work as a computational geneticist and I can say that there’s been essentially nothing my group has been able to accelerate with AI.\n\nIn fact, I see it much the opposite way; in that scientists cannot seem to drop their dead hypotheses because AI mirrors and extends their moods and keeps them chasing dead ends.\n\nMost of the new science-looking activity people in my field have been able to achieve because of AI is just post-hoc data exploration and plausible sounding reasons why nothing is working, keeping scientists thinking “if they can just do one more experiment” they’ll be able to show something. Or, you can make fancy network graphs that are completely useless for the purpose of decision making, but seem to look satisfying."}, {"id": 50657838, "au": "toufka", "dom": 56, "sr": 42, "sc": 2.18, "ep": 3.72, "bs": 0.0, "d": 2, "age": 1.08, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 3533, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.432, "fa": 0.0, "gp": 0.243, "bl": 0.0, "ds": 0.0, "txt": "It is 0.  A hit or drug candidate is NOT a drug.  That's the thrust of the argument.\n\nI can (and have) generated thousands of hits, many that did well in the lab.  Each for a few thousand dollars.  That is not actually difficult.  Moving them into humans is the only bar that proves whether they become drugs, and that is both time consuming and expensive.  This is the secondary point of the argument.\n\nBut water and hydrofluoric acid both kill cancer at different doses - but they're not considered \"drugs\".\n\nGetting a candidate approved means you've met all of the ancillary hurdles required to prove your candidate is a drug; that your candidate is safe, that it is effective, that it is more effective than any other drug on the market. THAT is the bar to be a 'drug'.  Otherwise, again, we could call hydrofluoric acid the next cancer cure.\n\nThere are many candidates in labs right now that were designed using AI, but again, that is not actually difficult to do - I can generate a few such designs this afternoon."}, {"id": 50658115, "au": "ac29", "dom": 132, "sr": 43, "sc": 2.17, "ep": 3.05, "bs": 0.0, "d": 1, "age": 0.64, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 7429, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.297, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, even if a drug was found the day ChatGPT was released, the bar for counting is \"finished Phase III and was approved by the FDA, EMA, or an equivalent regulator for that disease\". Clinical trials and FDA approvals are generally a very long process."}, {"id": 50658190, "au": "dofm", "dom": 110, "sr": 44, "sc": 2.12, "ep": 2.56, "bs": 0.0, "d": 0, "age": 0.53, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "\"Cured\" is a fairly silly word to use here and risks falling into that Pfizer-never-cured-a-disease anti-thinking pattern.\n\nDiseases aren't cured; patients are."}, {"id": 50657851, "au": "derektank", "dom": 63, "sr": 45, "sc": 2.11, "ep": 3.35, "bs": 0.0, "d": 0, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3108, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.612, "bl": 0.0, "ds": 0.0, "txt": "What’s the current number of diseases cured generally? Do antibiotics count as a cure to bacterial infections, if some diseases later develop antibiotic resistance? I would assume chemotherapy doesn’t count as a cure for cancer?"}, {"id": 50658140, "au": "aDyslecticCrow", "dom": 58, "sr": 46, "sc": 2.09, "ep": 3.63, "bs": 0.0, "d": 4, "age": 0.6, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1618, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.09, "bl": 0.0, "ds": 0.0, "txt": "Is code that does not compile a valid program? Being able to run the code is a rather crucial step for a piece of code to be be a program. What about that program doing anything useful after than? And then useful enough to be sold as a commercial software?\n\nWe're writing pseudo-code or UML diagrams of code at this point. Useful? In many ways to speed up some part of work. The page and parent comment acknowledge that.\n\nBut the page clearly states; AI has not yet cured anyone of anything. I'd consider the article rather optimistic by showing how close we are."}, {"id": 50658157, "au": "iJohnDoe", "dom": 90, "sr": 47, "sc": 2.05, "ep": 3.15, "bs": 0.0, "d": 0, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1084, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "At first glance it reads a bit hostile. Then after continuing to read the site, it seems like AI is actually helping in these areas.\n\nSuggestion would be to tone down the wording a bit. Decide if you're being an advocate or naysayer. Even better would be to find a neutral tone if that was your original goal."}, {"id": 50658364, "au": "vedmakk", "dom": 44, "sr": 48, "sc": 1.99, "ep": 3.09, "bs": 0.0, "d": 1, "age": 0.24, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.976, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Agree. Drugs mostly treat symptoms... and sometimes we even define \"cured\" as the absence of symptoms, not the actual root cause eliminated."}, {"id": 50657875, "au": "scrollaway", "dom": 98, "sr": 49, "sc": 1.91, "ep": 3.3, "bs": 0.0, "d": 2, "age": 1.03, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 28916, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 0.844, "fa": 0.28, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It’s crazy to me how arrogant some humans can be.\n\nIn the face of incredible evidence and repeatedly being proven wrong, still seeing statements like this just shocks me.\n\nWhat is it? Fear of not being special? Do you think you’re more likely to lose your job if you don’t pretend AI can, in fact, invent novel things?"}, {"id": 50658127, "au": "slg", "dom": 2, "sr": 50, "sc": 1.9, "ep": 3.0, "bs": 0.0, "d": 1, "age": 0.62, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 32, "k": 36583, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.669, "fa": 0.42, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": ">Look, I work on this stuff, and anyone who says that AI isn't helping to accelerate science is wrong. The folks who say that AI will cure all human disease are also wrong.\n\nThe difference between those two groups is that the former is merely a bunch of outside skeptics while the latter is made up of CEOs and founders of these AI companies.  That's a false equivalency in terms of their motivations and impact.  Isn't it obvious that the CEOs and founders being wrong is a bigger problem?"}, {"id": 50658130, "au": "recallingmemory", "dom": 61, "sr": 51, "sc": 1.82, "ep": 3.36, "bs": 0.0, "d": 1, "age": 0.61, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 142, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 1.429, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean it's definitely sneer - the first line you read is \"Zero. Not “almost one.” Not “one, if you count a scan.” No disease has been cured by a cure that AI discovered — no AI-discovered drug has even been approved yet.\"\n\nAdd on the irony that it's an AI generated website and that line was definitely written by Claude. I'm just disappointed this low effort website is somehow the top post on HN."}, {"id": 50657857, "au": "hn_throwaway_99", "dom": 50, "sr": 52, "sc": 1.77, "ep": 3.31, "bs": 0.0, "d": 1, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.322, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "I totally agree, and I think it's good that it makes its point with actual analysis and data.\n\nI think it's very valid to push back against claims of \"AI will eliminate all human disease\", as that's the rationale I hear most often as to why any attempts to slow down or pace the frontier is tantamount to murder (and that's not an exaggeration - it's exactly what Marc Andreesen said). So if these AI boosters are going to push this as their reason why they should operate with no constraints or regulations, I'm glad that someone is pushing back with the actual reality of the situation."}, {"id": 50658081, "au": "conartist6", "dom": 33, "sr": 53, "sc": 1.45, "ep": 2.99, "bs": 0.0, "d": 1, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 2736, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.274, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How can it accelerate progress by exterminating public trust in science and annihilating the human culture of discovery and common cause.\n\nCommunism was also supposed to be a big deal, but so far AI and oligarchic communism seem to be one and the same set of political ideas"}, {"id": 50658136, "au": "speerer", "dom": 45, "sr": 54, "sc": 1.42, "ep": 2.3, "bs": 0.0, "d": 0, "age": 0.6, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1194, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.876, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "What troubles me with this perspective is that it seems to minimise the benefit of the use of AI as a tool (in any industry), and seems to equate progress with the idea of something that is wholly AI-created. Sure, being able to make a vibe-coded tool that I need today but don't need tomorrow is fantastic. But should we really be celebrate \"vibe-curing\"?"}, {"id": 50657917, "au": "hn_throwaway_99", "dom": 81, "sr": 55, "sc": 1.34, "ep": 2.88, "bs": 0.0, "d": 1, "age": 0.96, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.225, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Many cancers are fully curable, especially if caught early. My cousin's thyroid cancer was fully cured. Testicular cancer is often fully cured even after it has spread to nearby lymph nodes with cisplatin."}, {"id": 50657704, "au": "bananaflag", "dom": 49, "sr": 56, "sc": 1.34, "ep": 2.85, "bs": 0.0, "d": 0, "age": 1.27, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1673, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.699, "fa": 0.0, "gp": 0.836, "bl": 0.0, "ds": 0.0, "txt": "Very glad this is not just some sneer club stuff, it is seriously tracking drugs with the potential to be approved."}, {"id": 50658485, "au": "mobilejdral", "dom": 20, "sr": 57, "sc": 1.34, "ep": 2.78, "bs": 0.0, "d": 1, "age": 0.09, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 228, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "This is like last year when folks were asking where is all of the new software.  I know of at least 6 medical conditions that have made fantastic progress in the last several years from the help of AI, getting it formally published takes time."}, {"id": 50658086, "au": "cimi_", "dom": 99, "sr": 58, "sc": 1.34, "ep": 2.78, "bs": 0.0, "d": 3, "age": 0.69, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 22, "k": 491, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 0.672, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Do you think you’re more likely to lose your job if you don’t pretend AI can, in fact, invent novel things?\n\nI understand what you mean, but it's funny your typo made the sentence mean that you _do_ pretend that AI can invent novel things :)\n\nChill out - also 'people' sounds better than 'humans'"}, {"id": 50657979, "au": "derektank", "dom": 68, "sr": 59, "sc": 1.34, "ep": 2.63, "bs": 0.0, "d": 3, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3108, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.117, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thank you, I thought I was going crazy for a second. (I do try to read)\n\nI suppose it’s a hard question to answer, given how broadly effective antibiotics are. They’ve probably cured diseases we haven’t even fully characterized."}, {"id": 50658514, "au": "slg", "dom": 4, "sr": 60, "sc": 1.34, "ep": 2.59, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 36583, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are two quotes on the linked page with timelines of \"less than a decade\" and \"Maybe within the next decade or so\".  The way this field typically works, the ball has to start rolling pretty soon for these two claims to have any chance of coming true."}, {"id": 50657884, "au": "hn_throwaway_99", "dom": 66, "sr": 61, "sc": 1.34, "ep": 2.55, "bs": 0.0, "d": 1, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 1.087, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "TFA actually answers this question as to what counts. Yes, antibiotics would count as a cure to bacterial infections by their own rationale - the page is very explicit about this - even if it eventually led to antibiotic resistance. Antibiotics very clearly do cure bacterial infections now; their criteria doesn't say it has to cure a disease now and forever, including all future strains of the disease.\n\nEDIT: to clarify, I was referring to the fact that TFA is very clear as to what is considered a cure or not (i.e. the second and third questions that were asked), but not that they went through previous non-AI treatments and tallied them up as cures."}, {"id": 50658054, "au": "vaibhavarduino", "dom": 108, "sr": 62, "sc": 1.34, "ep": 2.48, "bs": 0.0, "d": 0, "age": 0.74, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.916, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "Yep, Why would labs throw money at helping humanity?\n(don't take it in a bad way ofcourse , medicine is tough and practical - but we solved riemann hypothesis and bounded for matrix multiplication.I think this should be a priority.)"}, {"id": 50657966, "au": "wwwtyro", "dom": 57, "sr": 63, "sc": 1.34, "ep": 3.64, "bs": 1.19, "d": 3, "age": 0.88, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 15, "k": 923, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.818, "fa": 0.42, "gp": 0.36, "bl": 0.45, "ds": 0.0, "txt": "> It is 0. A hit or drug candidate is NOT a drug. That's the thrust of the argument.\n\nThat's not a terribly useful argument, though. Forcing it into a binary masks whatever help AI has provided so far, and disguises a possibly optimistic vector with a flatline."}, {"id": 50658209, "au": "StevenWaterman", "dom": 65, "sr": 64, "sc": 1.34, "ep": 2.29, "bs": 0.0, "d": 2, "age": 0.51, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1864, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Never is a long time, and i can imagine a universal cure: eg nanobots that sequence each cell's dna and kill the cancerous ones"}, {"id": 50658211, "au": "feverzsj", "dom": 74, "sr": 65, "sc": 1.34, "ep": 2.26, "bs": 0.0, "d": 0, "age": 0.51, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1122, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "Anything depending on slow and limited testing isn't a good fit for AI, because AI heavily relies on frequent and well-defined testing. That's why coding is the most significant AI use case."}, {"id": 50658469, "au": "fabian2k", "dom": 70, "sr": 66, "sc": 1.34, "ep": 2.24, "bs": 0.0, "d": 1, "age": 0.11, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 12765, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.955, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can't do biology or chemistry purely virtual right now. We simply don't have the knowledge/data and computing power to do that. So the AI would have to perform real experiments in the real world. Which is not impossible, but also much, much more expensive and time-consuming than doing virtual experiments.\n\nAnd to shorten the approval process, you'd need to show that you can predict whether a drug works and what the side effects are without large human experiments. I don't see AI being anywhere close to that in any way."}, {"id": 50657423, "au": "Waraqa", "dom": 84, "sr": 67, "sc": 1.34, "ep": 2.23, "bs": 0.0, "d": 0, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 59, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.723, "fa": 0.0, "gp": 0.365, "bl": 0.0, "ds": 0.0, "txt": "Apparently, the process a medicine must go through before approval is far more complex than in most other fields."}, {"id": 50658060, "au": "bentt", "dom": 83, "sr": 68, "sc": 1.34, "ep": 2.19, "bs": 0.0, "d": 0, "age": 0.74, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 2125, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.804, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "Well TIL that Idiopathic Pulmonary Fibrosis has a good trial going with an AI found target. That's great!"}, {"id": 50658016, "au": "ryanisnan", "dom": 12, "sr": 69, "sc": 1.34, "ep": 2.14, "bs": 0.0, "d": 1, "age": 0.8, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2069, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.787, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "I don't disagree with you, but personally I find this type of grand vision setting helpful to keep in mind. This is a really awesome aspirational target.\n\nI totally think what you are saying is also valid, and we should not lose sight of it as well."}, {"id": 50658280, "au": "aprilthird2021", "dom": 30, "sr": 70, "sc": 1.34, "ep": 2.04, "bs": 0.0, "d": 1, "age": 0.39, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1736, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.795, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "I think your middle of the road assessment is true of a lot of fields. We'll realize soon enough that in many of them the bottleneck wasn't raw computation or generation and testing of possibilities, but other more human, entropic things."}, {"id": 50658241, "au": "dw_arthur", "dom": 102, "sr": 71, "sc": 1.34, "ep": 1.91, "bs": 0.0, "d": 2, "age": 0.46, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 275, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If by harness they mean the ability to accurately model organs down to the cell level they are on the right track.  Such simulations might as well be sci-fi at this point."}, {"id": 50658251, "au": "matteoraso", "dom": 38, "sr": 72, "sc": 1.34, "ep": 1.89, "bs": 0.0, "d": 0, "age": 0.44, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 19, "k": 961, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.48, "fa": 0.0, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": ">It cures. Patients are cured — disease eliminated or durably reversed — not just symptoms managed a little better for a little longer.\n\nThis is way too high of a bar. Controlling symptoms is actually really important, and I don't like dismissing that because it's not a cure."}, {"id": 50658133, "au": "thegdsks", "dom": 124, "sr": 73, "sc": 1.34, "ep": 1.87, "bs": 0.0, "d": 0, "age": 0.61, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 5, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.703, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "What about all these new startups coming saying we will identify and block ai computers from accessing your websites"}, {"id": 50658487, "au": "croes", "dom": 27, "sr": 74, "sc": 1.34, "ep": 1.86, "bs": 0.0, "d": 1, "age": 0.09, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 25736, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "Especially because diseases are a moving target. A cure today  doesn’t necessarily work tomorrow or even work today for everybody"}, {"id": 50658332, "au": "vedmakk", "dom": 48, "sr": 75, "sc": 1.34, "ep": 1.83, "bs": 0.0, "d": 0, "age": 0.29, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 13, "k": 140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.689, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "> It is the same bar every other drug has to clear.\n\nand then...\n\n> It cures.\n\nI'd say \"symptoms managed a little better for a little longer.\" is the bar for a lot of approved drugs out there."}, {"id": 50658217, "au": "theteapot", "dom": 43, "sr": 76, "sc": 1.34, "ep": 1.69, "bs": 0.0, "d": 0, "age": 0.49, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 22, "k": 1188, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "> What would actually move this to 1? The bar is not mysterious. It is the same bar every other drug has to clear.\n\nIt's odd that this page presents \"drug\" and \"cure\" as synonymous. Why do we think drugs are the cure for all ills?"}, {"id": 50658455, "au": "theptip", "dom": 39, "sr": 77, "sc": 1.34, "ep": 1.64, "bs": 0.0, "d": 1, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 12410, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 0.64, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "No, it’s fair as stated; the bar set by the AI companies is cure all disease. We should measure progress towards that.\n\n(I’m saying this as someone bullish on AI’s future impact in biology.)"}, {"id": 50658358, "au": "margalabargala", "dom": 18, "sr": 78, "sc": 1.34, "ep": 1.59, "bs": 0.0, "d": 2, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 9214, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.606, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "No one said it was chaotic.\n\nIt's inscrutable and complex. Very much of both.\n\nIt might be cute to say you can derive the universe from hydrogen and time, but the reality is that we don't have the ability to actually simulate things to that fidelity and we won't in our lifespan."}, {"id": 50658389, "au": "Al-Khwarizmi", "dom": 46, "sr": 79, "sc": 1.34, "ep": 1.55, "bs": 0.0, "d": 1, "age": 0.2, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 7802, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.659, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not an expert in medicine, but my understanding is that much curing has always been vibe-curing. We don't even know how paracetamol or anesthetics work."}, {"id": 50658333, "au": "pj_mukh", "dom": 3, "sr": 80, "sc": 1.33, "ep": 1.36, "bs": 0.0, "d": 2, "age": 0.29, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 4665, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cures_antibiotics", "flbl": "Cures & Antibiotics (Useful)", "urls": [], "ig": 0.506, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "Person above you is talking about current AI. The CEO’s are talking about something more intelligent."}, {"id": 50658256, "au": "voxic11", "dom": 7, "sr": 81, "sc": 1.33, "ep": 1.35, "bs": 0.0, "d": 2, "age": 0.44, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3306, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.575, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The \"problem\" being that AI will significantly advance medical science and cure many diseases rather than all diseases?"}, {"id": 50657810, "au": "toisanji", "dom": 93, "sr": 82, "sc": 1.33, "ep": 1.33, "bs": 0.0, "d": 0, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 989, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.399, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "It’s 0 now and probably will be 0 for a while, but I suspect once we figure out the correct harness and data to use, it would start to go up e a few exceptions, hence the use of most."}, {"id": 50658228, "au": "tasuki", "dom": 114, "sr": 90, "sc": 0.98, "ep": 0.98, "bs": 0.0, "d": 0, "age": 0.48, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 5542, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "process_invent", "flbl": "Process & Invent (Novel)", "urls": [], "ig": 0.299, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Does this say more about AI or about the process required to actually be allowed to cure diseases?"}, {"id": 50658051, "au": "poszlem", "dom": 14, "sr": 91, "sc": 0.89, "ep": 0.89, "bs": 0.0, "d": 2, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1611, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 0.379, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's fine as long as it's an aspirational target. But that's not how they use it."}, {"id": 50658433, "au": "MattCruikshank", "dom": 88, "sr": 92, "sc": 0.86, "ep": 2.05, "bs": 1.19, "d": 0, "age": 0.15, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 351, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.79, "fa": 0.0, "gp": 0.136, "bl": 0.45, "ds": 0.0, "txt": "My day job is literally improving the speed and accuracy of diagnosis, in life-saving situations, using AI.\n\nSo yeah, I think posts like this are missing the point entirely."}, {"id": 50658316, "au": "mw888", "dom": 26, "sr": 93, "sc": 0.79, "ep": 1.98, "bs": 1.19, "d": 1, "age": 0.34, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 427, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.754, "fa": 0.0, "gp": 0.144, "bl": 0.45, "ds": 0.0, "txt": "Not even an inkling in your 'reality check' that novel hardware will resolve the data problem? No, I'm not claiming a machine will simulate an entire organism or need to."}, {"id": 50658441, "au": "mentalgear", "dom": 21, "sr": 94, "sc": 0.67, "ep": 1.86, "bs": 1.19, "d": 1, "age": 0.14, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4741, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.724, "fa": 0.0, "gp": 0.108, "bl": 0.45, "ds": 0.0, "txt": "Thanks for your insider's perspective - what do you think about the idea of brining lab experiments inside-the-automation loop (as Anthropic is apparently doing) ?"}, {"id": 50658377, "au": "diyae", "dom": 104, "sr": 95, "sc": 0.65, "ep": 3.17, "bs": 2.52, "d": 0, "age": 0.22, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "diseases_little", "flbl": "Diseases & Little (Today)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.157, "bl": 0.95, "ds": 0.0, "txt": "The biases are ridiculous... if someone uses Ai,it even a little, they get blamed for using it—yet, conversely, for a recovery to count, the AI supposedly has to be completely independent, having dug up the illness all by themselves with their own two little hands and a shovel. I honestly can’t deal with this collection of insults to human intelligence."}, {"id": 50658237, "au": "matteoraso", "dom": 107, "sr": 96, "sc": 0.12, "ep": 1.31, "bs": 1.19, "d": 1, "age": 0.47, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 961, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.559, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Pangram says that the website's text was AI-generated, so I doubt a lot of effort went into this."}, {"id": 50657848, "au": "password54321", "dom": 94, "sr": 97, "sc": 0.08, "ep": 1.27, "bs": 1.19, "d": 1, "age": 1.07, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 1042, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "drugs_argument", "flbl": "Drugs & Argument (Approved)", "urls": [], "ig": 0.442, "fa": 0.0, "gp": 0.159, "bl": 0.45, "ds": 0.0, "txt": "You need ingenuity. As far as I’m aware AI has not invented anything. It is a very good calculator."}, {"id": 50658002, "au": "himata4113", "dom": 22, "sr": 98, "sc": 0.01, "ep": 1.21, "bs": 1.19, "d": 1, "age": 0.82, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2571, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_biology", "flbl": "Data & Biology (Human)", "urls": [], "ig": 0.393, "fa": 0.0, "gp": 0.195, "bl": 0.45, "ds": 0.0, "txt": "People confusing the physical world with the virtual world as always. But they're obviously intervened and a large part of biology is the virtual representation of it."}, {"id": 50657892, "au": "password54321", "dom": 100, "sr": 99, "sc": -0.38, "ep": 0.81, "bs": 1.19, "d": 3, "age": 1.0, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1042, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.344, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "I was one of the early predictors that agentic coding and automated theorem proving with LEAN was going to take off. You got the wrong guy."}, {"id": 50658458, "au": "senordevnyc", "dom": 53, "sr": 100, "s
