st)", "count": 22, "useful": 5, "useful_pct": 22.7, "terms": "std, string, const, vector"}, {"slug": "general_commentary", "label": "General Commentary", "count": 13, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 10}, {"category": "primary_technical_doc", "count": 1}, {"category": "github_artifact", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["constructor", "default", "features", "actual", "appropriate", "header", "knows", "note", "projects", "core", "difference", "member", "names", "performance", "java", "vector", "everything", "feels"], "largest_root": {"root_id": 50643643, "author": "ninkendo", "slots": 72, "start_dom": 1, "end_dom": 72, "share_pct": 43.6, "top_dom1_age": 8.5, "top_dom1_author": "ninkendo"}, "buried_cutoff": 50, "rescue_top_k": 33, "ablations": [], "tournament": [], "comments": [{"id": 50643721, "au": "ho_schi", "dom": 155, "sr": 1, "sc": 12.67, "ep": 12.67, "bs": 0.0, "d": 1, "age": 8.35, "grav": 67.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 77, "qw": 0, "k": 2237, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": ["https://www.stroustrup.com/JSF-AV-rules.pdf"], "ig": 1.322, "fa": 2.63, "gp": 1.426, "bl": 0.0, "ds": 0.0, "txt": "https://www.stroustrup.com/JSF-AV-rules.pdf\n\nThat’s what Stroustrup does and it works. I just too versatile. Luckily there is recently a push_back against adding new stuff for the sake of it.\n\nMy own rules, mine: \n* Templates are nice.\n* Template Metaprogramming is not. \n* Objects and Classes are nice\n* Inheritance is not.\n\nI like composition and interfaces. I avoid inheritance, aside from some natural cases were it fits (UI Widgets).\n\nI’ve seen in recent years projects switching from C to a mere plain C++. Stronger typing, containers, smart-pointers, simple APIs."}, {"id": 50644396, "au": "spacechild1", "dom": 143, "sr": 2, "sc": 9.98, "ep": 9.98, "bs": 0.0, "d": 0, "age": 7.57, "grav": 58.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 186, "qw": 0, "k": 3568, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "std_string", "flbl": "Std & String (Const)", "urls": ["https://cplusplus.github.io/LWG/issue2334"], "ig": 1.776, "fa": 1.12, "gp": 1.805, "bl": 0.0, "ds": 0.0, "txt": "The example is pretty contrived because in practice you'd want to zero-initialize the members in the default constructor anyway.\n\n    struct span {\n        const char *p = nullptr;\n        size_t len = 0;\n        span() = default; // or span() {}\n        span(const char *s, size_t n) : p(s), len(n) {}\n    };\n\nIn that case, there is no difference between\n\n    span s;\n\nand\n\n    span s{};\n\nThere are only few use cases where you want a default constructor that does not initialize its members. One example are wrappers around primitive types where you want to closely preserve the original semantics. Whether that's a good idea in the first place really depends on the use case.\n\nFor example, std::atomic used to default-initialize the underlying value, which led to many bugs in user code. Since C++20 std::atomic uses value-initialization. See https://cplusplus.github.io/LWG/issue2334. On the one hand, std::atomic is now safer to use, on the other hand, it is not an implicit-lifetime-type anymore, which means you can't put it in shared memory without UB...\n\nAnother example is glm::vec, which has actually hit me a few times in my own code. At least they recognized the issue and allowed to override the default behavior with the GLM_FORCE_CTOR_INIT define."}, {"id": 50644514, "au": "aw1621107", "dom": 4, "sr": 3, "sc": 8.63, "ep": 8.63, "bs": 0.0, "d": 3, "age": 7.43, "grav": 56.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 23, "qw": 0, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": ["https://github.com/rust-lang/rust/issues/153825"], "ig": 0.324, "fa": 2.35, "gp": 0.81, "bl": 0.0, "ds": 0.0, "txt": "Rust doesn't really have a good answer for guaranteed copy elision or in-place initialization at the moment. The devs are working on it, though (https://github.com/rust-lang/rust/issues/153825)."}, {"id": 50645761, "au": "pwdisswordfishq", "dom": 53, "sr": 4, "sc": 7.49, "ep": 7.64, "bs": 0.0, "d": 1, "age": 5.73, "grav": 39.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 164, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "std_string", "flbl": "Std & String (Const)", "urls": ["https://quuxplusone.github.io/blog/tags/\u0023class-template-argument-deduction"], "ig": 1.587, "fa": 0.9, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "Indeed.  And forcing all object creation to be routed through the \"constructor\" concept leads to a whole host of problems.  For example:\n\n    std::vector v(\"foo\", \"bar\");\n\nThis should create a vector of two elements, right?  Well, too bad; it crashes instead.  Why?  Because the inferred type is std::vector<char>, and it attempts to construct a vector from a pair of iterators.  Why?  Because the only way to distinguish between different modes of constructing an object is through overloading, and overloads are too often ambiguous.\n\nArthur O'Dwyer's crusade against CTAD (<https://quuxplusone.github.io/blog/tags/\u0023class-template-argu...>) ultimately boils down to this problem, which is not really type deduction itself, but ambiguous overloads, which are hard to avoid when constructors are the only way to create an object, without resorting to clumsy workarounds like tag types (which create problems of their own).\n\nThere are other problems too, like the fact that you cannot call std::make_unique (or emplace) for a class with a private constructor even in a scope where you have access to the constructor itself."}, {"id": 50645888, "au": "grg0", "dom": 111, "sr": 5, "sc": 7.17, "ep": 7.17, "bs": 0.0, "d": 4, "age": 5.52, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 733, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.736, "fa": 0.62, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "I don't think that is a fair assessment. Imagine Sanitize() and its caller are defined in different files, which is a more realistic scenario. On the one hand, you look at Sanitize's signature and it is \"fine\" (I agree a string_view argument would be better); it is implicitly stating that the caller is responsible for the lifetime of the argument. Separately, you look at the call and it has a good chance of passing inadvertently. Marking std::string's constructor explicit would have been a slight improvement but it still doesn't solve the problem. Overall, the fact that this code is possible and yields different results under different optimization levels is just cooked. As a programmer, I want to focus on solving problems, not on keeping my guard up at 110% and working around bad language design choices.\n\nTo reply to GP: many projects specifically avoid the STL."}, {"id": 50647151, "au": "sedictious", "dom": 98, "sr": 6, "sc": 6.11, "ep": 6.26, "bs": 0.0, "d": 4, "age": 3.76, "grav": 23.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 119, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.33, "fa": 0.7, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "I'd say C++ is so vast that you can keep on encountering bell curves like that. I start working on a project, building confidence in the subset of C++ I'm working with and when I start feeling good about myself, I'm hit with a completely foreign concept\n\ncppquiz is a nice test beyond \"trivia\". There are a few hard questions addressing topics I've never encountered. For example:\n\n```\n\n\u0023include <iostream>\n\nvolatile int a;\n\nint main() {\n  std::cout << (a + a);\n}\n\n```\n\nI would assume that here a is initialised to 0 since it has static lifetime so I'd expect this to just print 0. But the C++ standard specifies that:\n\n> Reading an object designated by a volatile glvalue ([basic.lval]), modifying an object, calling a library I/O function, or calling a function that does any of those operations are all side effects, which are changes in the state of the execution environment. Evaluation of an expression (or a subexpression) in general includes both value computations (including determining the identity of an object for glvalue evaluation and fetching a value previously assigned to an object for prvalue evaluation) and initiation of side effects. When a call to a library I/O function returns or an access through a volatile glvalue is evaluated the side effect is considered complete, even though some external actions implied by the call (such as the I/O itself) or by the volatile access "}, {"id": 50649300, "au": "fukaiall", "dom": 152, "sr": 7, "sc": 5.6, "ep": 5.6, "bs": 0.0, "d": 0, "age": 0.66, "grav": 5.8, "surf": 12.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 20, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.633, "fa": 0.34, "gp": 0.546, "bl": 0.0, "ds": 0.0, "txt": "C++ feels super natural to me but at the same time it is a miserable fuck due to such odd legacies and ununified features. People literally have spent ages to simply learn those unnecessarily lots of syntaxes rather than solving actual problems. So many compilers and language standards. I do detest those motherfucking Rust fanboys but reasonbly speaking you should choose either C or Rust for low new level projects in 2026."}, {"id": 50646019, "au": "nwallin", "dom": 118, "sr": 8, "sc": 5.39, "ep": 5.69, "bs": 0.0, "d": 3, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 4801, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "std_string", "flbl": "Std & String (Const)", "urls": ["https://godbolt.org/z/ns6cb9T6q"], "ig": 1.138, "fa": 0.62, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "I mean, you could just turn warnings on: https://godbolt.org/z/ns6cb9T6q\n\nBut yes, I know that any function with the signature `std::string_view(const std::string&)` or especially `std::string_view(std::string)` is a land mine.\n\nI asked a local LLM to do a code review on it. (gemma4:12b) It flagged the bug, with all caps \"THIS WILL CAUSE UNDEFINED BEHAVIOR\", and suggested a fix."}, {"id": 50644633, "au": "chuckadams", "dom": 156, "sr": 9, "sc": 5.1, "ep": 5.47, "bs": 0.0, "d": 2, "age": 7.27, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 5147, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.184, "fa": 0.56, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "Stroustrup does not write all of his code according to the JSF rules.  Avoiding dynamic allocation for example isn't appropriate for all apps, especially if one ends up reinventing it poorly.\n\nOne thing he does do consistently, and it baffles me why most other C++ codebases do not, is `using namespace std`.  It's the standard library, if there's any names that ought to be used unqualified, it's those."}, {"id": 50643993, "au": "coldpie", "dom": 131, "sr": 10, "sc": 5.05, "ep": 5.49, "bs": 0.0, "d": 4, "age": 8.06, "grav": 63.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 17, "k": 24358, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.279, "fa": 0.42, "gp": 0.89, "bl": 0.0, "ds": 0.0, "txt": "> But the reality is a ton of domains like graphics, video games, and cloud infrastructure is built on C++.\n\nYeah, legacy reasons.  C++ was a decent-ish improvement over C in the early 90s when many of those APIs were being built out.  It's the core language for the Windows API.  We didn't get a decent, well supported replacement for C++ until like ten years ago.  There's a lotttttttt of legacy C++ code that will stay in use for decades more.\n\nI never said people can't be productive in C++, I'm saying the reason they like it is because it's so hard to use.  Just like people can get really good at Dark Souls, people can get really good at C++, too, and they have fun doing it.  But I still think that's a con of the language, you can get the same or even better code quality with many modern languages with a much lower bar to mastery."}, {"id": 50646024, "au": "layer8", "dom": 58, "sr": 11, "sc": 4.89, "ep": 6.03, "bs": 0.85, "d": 4, "age": 5.28, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 8, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 1.444, "fa": 0.42, "gp": 0.995, "bl": 0.32, "ds": 0.0, "txt": "Right, but that’s a relatively rare problem, and doesn’t usually result in crashes.\n\nMore importantly, you have exactly the same problem if you overload a regular method that way. So it’s a problem with overloading, not with constructors.\n\n> How do you construct a MyVector of two items?\n\n    new MyVector(new int[] { 23, 42 })\n\nThe correct solution, of course, is to provide named static constructor methods instead (e.g. `MyVector.ofRange(start, end)`).\n\nI do agree that support for named actual constructor methods would be nice. But they would still be constructors."}, {"id": 50643910, "au": "pjmlp", "dom": 133, "sr": 12, "sc": 4.43, "ep": 6.73, "bs": 1.85, "d": 3, "age": 8.14, "grav": 64.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.553, "fa": 0.62, "gp": 0.905, "bl": 0.7, "ds": 0.0, "txt": "Nope, I like C++ because it was already Typescript for C in 1993, coming from Turbo Pascal.\n\nFollowed by the great developer experience of using Turbo Pascal alongside Turbo C++, later Delphi and C++ Builder on RAD Studio.\n\nAn experience that many languages still fail to reproduce nowadays, with exception of Java and .NET tooling.\n\nYou don't need to master every single feature."}, {"id": 50644175, "au": "LeFantome", "dom": 76, "sr": 13, "sc": 4.37, "ep": 4.81, "bs": 0.0, "d": 2, "age": 7.85, "grav": 61.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 302, "qw": 0, "k": 2165, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.411, "fa": 0.28, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "Very true of course, but there is a difference.\n\nFor what HTML and CSS get used for, the consequences of not knowing everything are fairly low. If it does what you want, it does what you want. Things could maybe be better but they are probably also fine.\n\nSQL is mostly the same though perhaps the performance implications of not knowing it well are higher.\n\nFor .NET, Java, and Python things are not much different. If they do what you want, there is probably not much risk that they are doing things you don’t.\n\nJavaScript and, even more dramatically, C++ are quite different. They may be doing what you do not want, or it may be easy for others to make your code do things you do not want. Not understanding the nuance or idiosyncrasies in those languages can do a lot of damage.\n\nComplexity has another angle. If I am working with other people’s Python code, the chance that I will not understand it is low. If I do come across a new feature in .NET or Java, I will spot it right away and will probably be able to research it, learn it, and move on very quickly. Same with HTML and CSS. .NET and CSS are great examples of languages with quite a bit of complexity but where the burden of that complexity is reasonable when maintaining code.\n\nBut again, JavaScript and C++ are not that way. C++ code using features I am not familiar with can be a massive burden to unpack and understand. I may not "}, {"id": 50643853, "au": "pjmlp", "dom": 75, "sr": 14, "sc": 4.3, "ep": 6.6, "bs": 1.85, "d": 1, "age": 8.2, "grav": 65.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.338, "fa": 0.68, "gp": 1.043, "bl": 0.7, "ds": 0.0, "txt": "I know C++ since 1993, naturally don't know everything about the language.\n\nI also don't know everything about Java, .NET, Python, JavaScript, SQL, HTML, CSS, and yet work gets done.\n\nTo use other languages as example, I bet most folks would fail a pub quiz based on the latest version of those languages, now with about 20 to 40 years history as well."}, {"id": 50645309, "au": "ninkendo", "dom": 36, "sr": 15, "sc": 3.99, "ep": 4.43, "bs": 0.0, "d": 6, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 44, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.93, "fa": 0.7, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "> It is up to the constructor to only initialize storage, or do whatever it feels like to have values assigned to it.\n\nRight, see the \"I guess the argument might be\" part above... I find this to be a very questionable design choice, leaving you to have to go and read a header somewhere to determine whether `Foo f;` is safe or not. But it's not really a choice, is it? C++ had to do it this way to be compatible with how C programs were written back in the 1970s.\n\n> By the way, already in the 16 bit days you could configure to have warnings as errors for variables being used without initialisation.\n\nAh yes, the \"but C can be configured to be not-insane\" argument, one of my favorite pjmlp-isms, right up there with \"but $LANG's compiler is written in C++\" and \"but you already get memory safety with a GC\". Keep on doing you!"}, {"id": 50645453, "au": "kpw94", "dom": 7, "sr": 16, "sc": 3.94, "ep": 4.38, "bs": 0.0, "d": 3, "age": 6.11, "grav": 43.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 1049, "kpp": 7.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.3, "fa": 0.28, "gp": 0.362, "bl": 0.0, "ds": 0.0, "txt": "right, first-class support for a special say \"must_construct_inplace\" keyword on a function returning an object would be an interesting language design direction...\n\nWhat happens inside\n\n    must_construct_inplace Foo make_foo() { ... }\n\ncan be as \"inefficient\" as your example above, but the compiler would validate & figure out a way to make it an in-place-construction, guaranteed RVO.\n\n(similar to `constexpr` validation)\n\nEDIT: Looks like this already exists under several names (\"build-in-place\", \"placement by return\", \"result location semantics\") in Ada's `return W : Widget do ... end return;`, Carbon's returned var c: Circle; ... return var;`, and Rust has (still open) RFC 2884 \"placement by return\", and Zig seems to have this fully built-in via result location semantics?!"}, {"id": 50646272, "au": "rcleveng", "dom": 149, "sr": 17, "sc": 3.92, "ep": 4.14, "bs": 0.0, "d": 0, "age": 4.9, "grav": 32.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 362, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.598, "fa": 0.62, "gp": 0.665, "bl": 0.0, "ds": 0.0, "txt": "GCC going from effectively the same performance in 14.x to 4x slower in 15.x AND 16.x sounds like a real regression that should be fixed."}, {"id": 50645438, "au": "tialaramex", "dom": 38, "sr": 18, "sc": 3.36, "ep": 3.8, "bs": 0.0, "d": 6, "age": 6.14, "grav": 43.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "Rust has a Default trait, if your type Goose has a Default then\n\nlet foo: Goose = Default::default();\n\nThose \"primitive\" types have a Default, the integers default to zero, as do the floating point types, bool defaults to false, I believe an empty string is the default string (in both the sense that's the default for String, and the default for str, the string slice reference roughly analogous to C++ string_view)\n\nSome things don't have a sane default, just as those things wouldn't provide a zero argument constructor in C++. There isn't a default file descriptor, a default network socket, and so on and so those types do not implement Default"}, {"id": 50644297, "au": "coldpie", "dom": 86, "sr": 19, "sc": 3.32, "ep": 3.76, "bs": 0.0, "d": 4, "age": 7.69, "grav": 59.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 24358, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "Curious if you can elaborate.  I found learning C to be a really good stepping stone to understanding many of C++'s design choices (eg stuff like why the 'virtual' keyword exists & works as it does; or why a class's private members must be declared in the public header).  It also gets you more familiar with non-interpreted language concepts like the compiler and the linker before C++ turns those into multi-headed beasts."}, {"id": 50643844, "au": "materielle", "dom": 130, "sr": 20, "sc": 3.32, "ep": 4.2, "bs": 0.0, "d": 3, "age": 8.21, "grav": 65.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 212, "qw": 0, "k": 697, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.895, "fa": 0.28, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "It definitely has to be more complicated than that. I know the stereotype is that the C++ language lawyers are up in their ivory towers and don’t “get stuff done” like us pragmatic JavaScript or Python developers.\n\nBut the reality is a ton of domains like graphics, video games, and cloud infrastructure is built on C++.\n\nI think the Spanner and Chrome devs “got stuff done” for instance.\n\nI could go on a tangent about the whole “maker vs coder” debate that has sprung up around AI. It feels similar to the C++ idea you’re talking about. The idea is that people who actually understand code and computer science concepts deeply are too busy yak-shaving to be productive like us “makers”.\n\nThat ivory tower type definitely exists.\n\nBut this false dichotomy seems to be defense mechanism more than anything.\n\nThere are smart people that are basically better at everything. They understand C++ deeply, but can code in Python too, build massive pieces of infrastructure like Spanner, and now they are better at driving AI, too.\n\nNot that I’m defending any of the horrible language design decisions of C++. But, you see what I’m saying. People who have skills beyond is in one area aren’t necessarily deficient in another area. Maybe they are just smarter and more skilled than us in a ton of ways."}, {"id": 50643950, "au": "quietbritishjim", "dom": 19, "sr": 21, "sc": 3.14, "ep": 3.8, "bs": 0.0, "d": 1, "age": 8.09, "grav": 64.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "There's really two things in play here.\n\nOne is that C++ has constructors, with lots of rules about which one is called when.\n\nBut the other is that primitive objects can sometimes be uninitialised, and sometimes that's what you want for performance (if you're about to overwrite them anyway). C++ classes are meant to be able to do anything a primitive type can (as a sibling comment says) so you sometimes want a class that you can either leave uninitialised or value initialise (essentially, set everything to zero) decided at the call site (not in the class declaration).\n\nIf C++ guaranteed that all members always had to be initialised, then all the default-like constructors (Foo x; Foo x = {}; Foo x = Foo(); etc) would resolve to the same thing (a call to the constructor you explicitly wrote if you did; otherwise all members default constructed, resolved as zero-initialisation if that's equivalent)."}, {"id": 50643643, "au": "ninkendo", "dom": 1, "sr": 22, "sc": 3.11, "ep": 3.55, "bs": 0.0, "d": 0, "age": 8.46, "grav": 68.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.591, "fa": 0.0, "gp": 1.494, "bl": 0.0, "ds": 0.0, "txt": "Constructors are such an odd duck to me. On the one hand, you have languages like C++ and Swift which have construction as a first-class concept, with tons of rules you need to memorize (Swift's \"convenience\" vs \"designated\" initializers are a real treat to unpack).\n\nThen you have languages like Rust, Go, Zig, etc which don't have them at all, constructors are just static functions in the namespace of the type, which return an instance of that type.\n\nFor the life of me I've never understood why you'd want the former. I'm sure there's a reason, but I never miss it when using languages in the latter category.\n\nThe explanation you typically hear is about OO and inheritance, but I don't buy it: If Animal had a ::new() that initialized private state, Cow could have a ::new() too that could call Animal::new() if it wanted, then do further initialization, etc... I don't think there's anything about inheritance that says constructors are a must. (Edit: In fact, ObjC does exactly this. I should have remembered that given that I did ObjC for a living for a while.)"}, {"id": 50644286, "au": "aw1621107", "dom": 24, "sr": 23, "sc": 3.01, "ep": 4.3, "bs": 0.85, "d": 4, "age": 7.7, "grav": 59.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 1.19, "fa": 0.28, "gp": 0.488, "bl": 0.32, "ds": 0.0, "txt": "Both those feel a bit like circular arguments? They need constructors because that's how they are currently defined, but that doesn't say anything about whether they could also be defined without constructors.\n\nThe latter was what I was interested in, and I apologize for not making that clear. For instance, in Rust terms both those seem replaceable in principle via calls to appropriate trait functions like Default::default() or From::from()."}, {"id": 50648060, "au": "PhilipRoman", "dom": 91, "sr": 24, "sc": 2.99, "ep": 3.87, "bs": 0.0, "d": 8, "age": 2.53, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.643, "fa": 0.0, "gp": 0.008, "bl": 0.0, "ds": 0.0, "txt": "I'm no C++ expert, but in P2012R0 it even gives this specific example, indicating that A is OK in c++20:\n\n[..]\nOne recent real-world example by one of\nthe authors is the following:\nImproving the following code:\n\n  struct Person {\n   std::vector<int> values;\n   …\n  };\n  for (auto elem : createPerson().values) { // OK (lifetime extended) <-----------\n\nby introducing a getter to have better encapsulation, suddenly caused the undefined behavior:\n\n  class Person {\n   private:\n   std::vector<int> values;\n   …\n   public:\n   const auto& getValues() const {\n   return values;\n   }\n  };\n  for (auto elem : createPerson().getValues()) { // UB (fatal runtime error)"}, {"id": 50645539, "au": "simonask", "dom": 97, "sr": 25, "sc": 2.9, "ep": 3.34, "bs": 0.0, "d": 3, "age": 6.01, "grav": 42.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 2509, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.36, "fa": 0.0, "gp": 0.098, "bl": 0.0, "ds": 0.0, "txt": "Exactly. C++ programmer confidence is a bell curve, where the X axis is skill level.\n\nThe more you know about programming in C++, the less confident you become that your code is actually correct, because you've seen before how the most seemingly innocuous decisions turned out to be massive UB footguns. Even worse if you know anything about how computers actually work - that's not relevant, C++ like C targets an abstract virtual machine with semantics unlike any computer ever built.\n\nThe simplest example is signed integer overflow: the bright young student knows all about Two's Complement and mistakenly believes all is well, and the wizened but weary mentor must waste everyone's time to avoid summoning nasal demons.\n\nWhat an unbelievable waste."}, {"id": 50643892, "au": "Calavar", "dom": 2, "sr": 26, "sc": 2.84, "ep": 3.72, "bs": 0.0, "d": 1, "age": 8.15, "grav": 64.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 187, "qw": 0, "k": 2807, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.443, "fa": 0.56, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "For ergonomics in the general case, I agree that it's not even a question, the Rust/Zig create-and-return approach wins on every count.\n\nHowever, create-and-return  makes in place construction difficult. C++ allows you to construct directly into any pinned memory block with satisfactory size and alignment, whereas create-and-return requires you to construct elsewhere and then copy the bytes. This has downstream implications:\n\n- The address of \"this\" always changes at least once, which makes self-referential data structures and cyclic data structures more difficult. Now you have a pointer fixup step, or you are passing around some form of handle rather than raw pointers. These solutions can range from trivial to complicated, fast to slow, depending on the specific patterns in your code base. A simpler work around is to always construct with a fresh heap allocation and return a pointer to it, which, again, may or may not be an acceptably performant solution for your particular problem.\n\n- You have to rely on your optimizer to do copy elision, which is not a guarantee. Not an issue for small objects, but it can become an issue for larger ones or for many repeated constructions."}, {"id": 50647926, "au": "tialaramex", "dom": 157, "sr": 27, "sc": 2.67, "ep": 3.62, "bs": 0.0, "d": 3, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.075, "bl": 0.0, "ds": 0.0, "txt": "The C++ Core Guidelines simultaneously tell you that it's fine to do this and that doing it risks (as so often in C++) weird hard-to-understand compiler errors - because if there's any names that should be unqualified it's your names, not those from the stdlib.\n\nUnlike say, Rust, C++ chooses to just shove most things directly in std. You were probably expecting vector, sort and list and if you're paying attention perhaps integral and format but did you expect get_money? invocable? hive? Because those are all defined too. On average your program probably uses several of these universally reserved identifiers, and more get added in each C++ version. Yay."}, {"id": 50643539, "au": "01HNNWZ0MV43FF", "dom": 109, "sr": 28, "sc": 2.55, "ep": 3.65, "bs": 0.0, "d": 2, "age": 8.57, "grav": 69.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 51, "qw": 0, "k": 4223, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": ["https://www.nablag.com/spooky_cpp"], "ig": 0.384, "fa": 0.62, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "Did you see the \"Spooky C++\" post? https://www.nablag.com/spooky_cpp\n\nDid you already know that? Do all your junior C++ programmers know that? Do you have lints turned on in every C++ project and dep for that?\n\nCause I had to really look at it to figure it out. And I had to think, \"Would Rust allow this code?\""}, {"id": 50645538, "au": "tialaramex", "dom": 45, "sr": 29, "sc": 2.5, "ep": 3.6, "bs": 0.0, "d": 5, "age": 6.01, "grav": 42.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.487, "fa": 0.0, "gp": 0.075, "bl": 0.0, "ds": 0.0, "txt": "For many years now, This function is deprecated. Use MaybeUninit<T> instead.\n\ncore::mem::uninitialized is of course unsafe, but what people who designed it hadn't really appreciated was that in most cases it was impossible to use it correctly, it almost might as well have been a call to core::hint::unreachable_unchecked\n\nIf your type is a ZST then core::mem::uninitialized was safe to use, because not initializing zero bytes of RAM is the same as initializing all zero of them, this can't possibly matter so we're fine. Otherwise though, we create values which the LLVM backend is sure we cannot know and so it feels entitled to optimise as if any assumptions we make about those values are false, even if the results are contradictory. This causes immediate Undefined Behaviour all over the place.\n\nThe MaybeUninit<T> wrapper type is pretty easy to use and won't invoke Undefined Behaviour so long as you do everything in the instructions."}, {"id": 50644870, "au": "lefty2", "dom": 50, "sr": 30, "sc": 2.47, "ep": 3.13, "bs": 0.0, "d": 1, "age": 6.94, "grav": 51.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 71, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.21, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "I usually need to use a Init() function to initialised the member functions, because they are initialised with data that isn't available when the constructor is called, making it largely redundant.\nAnother thing, just because a feature exists in a language doesn't mean you need to use it. Use it if it makes sense for your use case, otherwise don't use it."}, {"id": 50645928, "au": "pwdisswordfishq", "dom": 57, "sr": 31, "sc": 2.44, "ep": 3.76, "bs": 0.0, "d": 3, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.6, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Java absolutely does have the ambiguous overload problem.\n\n    public class MyVector {\n        public MyVector(int... items) {\n            System.out.println(String.format(\"constructing a vector of %d items\", items.length));\n        }\n\n        public MyVector(int start, int end) {\n            System.out.println(String.format(\"constructing a vector from the range [%d, %d)\", start, end));\n        }\n    }\n\nHow do you construct a MyVector of two items?\n\nIn JavaScript, how do you use new Array(...) to create an array consisting of a single integer?  You can do the same with a single value of any other type.\n\nThe reason these languages don't have the make_unique or emplace problems is because they don't have a concept of in-place construction at all, since objects in those languages are heap-allocated and have reference semantics anyway."}, {"id": 50645305, "au": "badpun", "dom": 72, "sr": 32, "sc": 2.18, "ep": 2.84, "bs": 0.0, "d": 1, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 4409, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 1.208, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The idea behind constructors is to preserve object's invariants (e.g. that a circle radius must be positive). In a language without constructor, if you initialize an object (allocate some memory and point to it) and only then fill its fields with some static function, it will contain potentially illegal state until you do."}, {"id": 50647082, "au": "lollollol3", "dom": 115, "sr": 33, "sc": 2.17, "ep": 6.01, "bs": 2.52, "d": 5, "age": 3.88, "grav": 24.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 59, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": ["https://fasterthanli.me/articles/a-rust-match-made-in-hell", "https://play.rust-lang.org/?version=stable&mode=debug&edition=2024&gist=a6e6fb3d6d05d13006fe2eaeca1e2a3d", "https://play.rust-lang.org/?version=stable&mode=debug&edition=2024&gist=260837367b184c73b5544c5a9f0baa95"], "ig": 1.309, "fa": 0.62, "gp": 0.804, "bl": 0.95, "ds": 0.0, "txt": "What is funny is that Rust has similar or worse issues regarding temporary lifetimes. Only some UB is caught (and in practice only sometimes), issues like deadlocks aren't.\n\nhttps://fasterthanli.me/articles/a-rust-match-made-in-hell\n\nChallenge to you, simonask: Explain why the curly braces here determines whether there is a deadlock or not. Bonus points if you do so without asking for help or looking anything up.\n\nhttps://play.rust-lang.org/?version=stable&mode=debug&editio...\n\nhttps://play.rust-lang.org/?version=stable&mode=debug&editio..."}, {"id": 50645342, "au": "tavavex", "dom": 74, "sr": 34, "sc": 2.01, "ep": 2.9, "bs": 0.0, "d": 1, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.142, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "The real kicker is the countless ways in which code that looks normal at a glance is subtly wrong in ways the language will not warn you about. There's a trillion ways to do anything in C++, spread over multiple decades of language design, each way involving a hundred lower-level considerations you've never heard of but must know to understand which one to pick, and what feels like half of the approaches causes some random subtle memory leak or undefined behavior."}, {"id": 50645596, "au": "PhilipRoman", "dom": 88, "sr": 35, "sc": 1.84, "ep": 3.38, "bs": 0.0, "d": 6, "age": 5.94, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.215, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I wholeheartedly disagree with the idea that all C++'s problems come from backwards compatibility with C. Even \"pure\" C++ alone without C constructs brings enough footguns.\n\n  struct Config {\n    std::vector<std::string> names;\n    const std::vector<std::string>& getNames() const { return names; }\n  };\n  Config loadConfig();\n  \n  // which of these are safe?\n  for (const auto& n : loadConfig().names)      { use(n); }  // A\n  for (const auto& n : loadConfig().getNames()) { use(n); }  // B\n  \n  const auto& v1 = loadConfig().names;          // C\n  for (const auto& n : v1) { use(n); }\n  \n  const auto& v2 = loadConfig().getNames();     // D\n  for (const auto& n : v2) { use(n); }\n\nTrick question btw"}, {"id": 50644469, "au": "stackghost", "dom": 13, "sr": 36, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 2, "age": 7.49, "grav": 57.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 2862, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.433, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Agree.  C++17 lets you write factory functions that directly return `T(args...)` and can initialize an `auto foo = make_t();` so in many cases the distinction between rust and modern c++ is diminished.\n\nBut still, doing `std::make_unique<T>(args...)` or allocates storage and guarantees to run T's constructor there, and you can even do `std::optional<std::mutex> slot; slot.emplace();` which builds the mutex inside the optional even though a std mutex can't be moved or copied."}, {"id": 50644230, "au": "binary132", "dom": 66, "sr": 37, "sc": 1.8, "ep": 2.68, "bs": 0.0, "d": 1, "age": 7.78, "grav": 60.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 1646, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.707, "fa": 0.28, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "I was surprised reading these comments to see hardly any mention of type invariance, and no mention at all of RAII.  RAII gets you type invariants that hold for the entire lifespan of an object, and if anything goes wrong during initialization, you are guaranteed to release all partial state according to its specified rules — giving you something closer to whole-program invariants.  We all love POD / structs, but they don’t get you that part, and doing it without RAII can land anywhere from a bit of meticulous bookkeeping all the way to building an intractable metaprogramming malebolge just to get half-baked DIY RAII."}, {"id": 50643425, "au": "raincole", "dom": 73, "sr": 38, "sc": 1.79, "ep": 4.88, "bs": 1.99, "d": 0, "age": 8.7, "grav": 71.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": ["https://www.learncpp.com/cpp-tutorial/variable-assignment-and-initialization/"], "ig": 0.391, "fa": 0.62, "gp": 1.51, "bl": 0.75, "ds": 0.0, "txt": "No language scares me like C++ does. Look at this page: https://www.learncpp.com/cpp-tutorial/variable-assignment-an...\n\nThis is just a single section of the first chapter of a beginner tutorial. And it's already more things to remember than, say, the whole Lua."}, {"id": 50647260, "au": "gpderetta", "dom": 8, "sr": 39, "sc": 1.58, "ep": 2.9, "bs": 0.0, "d": 4, "age": 3.61, "grav": 22.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 13834, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.236, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "RVO helps, but it is not necessarily enough. Let's say you have a vector and you want to construct in-place an element with an arbitrary set of arguments.\n\nIn c++ this is solved[1] via 1) emplace_back 2) perfect forwarding 3) constructors having an homogeneous name and being selected via overload resolution.\n\nIn a language with RVO, it is not enough for 'make_foo' in 'push_back(make_foo(args...))' to guarantee zero copy, 'push_back(x)' must also be able to guarantee that its parameter x is somehow constructed in place.\n\nIn practice you need some form of lazy evaluation (call by name, or an explicit thunk or passing the function and parameters separately) or some form of macro expansion.\n\n[1] it does comes with its own set of foot-bazookas of course."}, {"id": 50649097, "au": "simonask", "dom": 116, "sr": 40, "sc": 1.5, "ep": 2.82, "bs": 0.0, "d": 6, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 2509, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.202, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm responding so future readers see the answer, because oooh boy am I not engaging with this account.\n\nThe curly braces shortens the lifespan of the `MutexGuard` so it gets unlocked before the body of the if-statement. Normally, the temporary used in the if-let pattern lives until the end of the if-statement.\n\nThis wouldn't compile if the value guarded by the Mutex wasn't trivially copyable, but it is.\n\n(Note how none of this is UB, just a particularly contrived way to introduce a deadlock.)"}, {"id": 50643613, "au": "coldpie", "dom": 120, "sr": 41, "sc": 1.48, "ep": 3.02, "bs": 0.0, "d": 2, "age": 8.5, "grav": 68.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 24358, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "I have a theory that the reason people like C++ is because it's challenging to use.  It's like a puzzle or a riddle or a Dark Souls game.  It feels good to get something done in C++ because there's so, so many ways for it to go wrong that when you do it right(-ish...), it feels like you're a master of a complex skill.  This makes it a terrible language for actually getting things done, of course, but people like that feeling of overcoming the challenge, so they keep using it."}, {"id": 50647862, "au": "edflsafoiewq", "dom": 55, "sr": 42, "sc": 1.47, "ep": 2.57, "bs": 0.0, "d": 2, "age": 2.81, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5042, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IIRC, one reason C++ uses overloading for all constructors is if the construction occurs in a template, the caller can select the constructors from outside by eg passing the correct arguments. If the constructor were named, there would be no way to pass in the name from outside the template."}, {"id": 50645675, "au": "ninkendo", "dom": 9, "sr": 43, "sc": 1.42, "ep": 4.02, "bs": 1.06, "d": 2, "age": 5.84, "grav": 40.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 8, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.991, "fa": 0.42, "gp": 0.339, "bl": 0.4, "ds": 0.0, "txt": "> However, create-and-return makes in place construction difficult\n\nThis is definitely the closest thing to an answer in this thread. This is something that languages without constructors do struggle with, yes, and as other commenters pointed out, Rust sees this as a performance issue and is working on it.\n\nThanks for the informative reply."}, {"id": 50643962, "au": "kstrauser", "dom": 78, "sr": 44, "sc": 1.41, "ep": 2.95, "bs": 0.0, "d": 2, "age": 8.09, "grav": 64.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 34291, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.844, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That’s true on the face of it, but not knowing all of C++ vs Python is like not knowing all of Russian vs Toki Pona. Yes, it’s possible to study both languages and still miss portions. Getting to 80% fluency on one is vastly harder and more complicated than with the other."}, {"id": 50647562, "au": "morning-coffee", "dom": 148, "sr": 45, "sc": 1.39, "ep": 2.49, "bs": 0.0, "d": 0, "age": 3.21, "grav": 19.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 414, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.358, "fa": 0.34, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "This is one of the many reasons I left C++ (after investing over 20 years professionally in it) for Rust. Sometimes it is just better to get on with life than deal with pedantic minutiae all the time."}, {"id": 50643646, "au": "cogman10", "dom": 159, "sr": 46, "sc": 1.36, "ep": 2.9, "bs": 0.0, "d": 1, "age": 8.45, "grav": 68.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 22959, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.162, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "The only sane usage of C++ is \"This is a legacy project, needs to integrate with a legacy C/C++ project, or all our engineers are C++ experts and they don't want a new language\".\n\nFor everything else, you should pick one of any number of other languages. Rust, swift, zig, go, java, python, javascript.  Take your pick."}, {"id": 50643999, "au": "marcosdumay", "dom": 60, "sr": 47, "sc": 1.26, "ep": 2.8, "bs": 0.0, "d": 1, "age": 8.05, "grav": 63.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.054, "fa": 0.0, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "The thing you are annoyed about in C++ is not constructors. It's the overloading of syntactic operations.\n\nThe C++ design bets heavily on that. Just like you can overload an operator, you can also overload the meaning of `=`, `new`, variable declarations, and etc. That necessarily leads to an awful complex language, but also a very powerful one that can potentially lead to very easy to read code in high abstraction levels.\n\nThe problem both C++ and Swift have is that you can't really build high abstraction levels, because the languages are designed in a way that makes some fixed concerns creep over your entire code."}, {"id": 50646205, "au": "xscott", "dom": 63, "sr": 48, "sc": 1.22, "ep": 2.54, "bs": 0.0, "d": 1, "age": 4.99, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 1689, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "I'm not praising C++ at all, but constructors serve as more than just a factory for the instances.  The full comparison with Rust might be vs implementations of the Default, Into / From, Copy, and Clone traits in addition to ::new.  (Maybe some others I missed too)\n\nWhen I used to program in C++, my general rule was that applications follow the \"rule of zero\" (no explicit constructors), and libraries do what's needed to make the rule of zero work for applications."}, {"id": 50647226, "au": "0x457", "dom": 92, "sr": 49, "sc": 1.05, "ep": 2.59, "bs": 0.0, "d": 5, "age": 3.66, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 2444, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd distinguish between understanding why C++ was designed the way it was and learning how to write idiomatic C++. C is certainly useful for the former, but many practices considered perfectly normal in C are considered (very) bad practice in C++.\n\nThis is also why I dislike the term \"C/C++\" when referring to them as if they were a single language. They are two distinct languages with substantially different idioms.\n\nWhat I hate about C++ is that it offers a myriad of ways to accomplish the same thing, ranging from outright terrible to genuinely good. Learning C first can reinforce habits that you'll later have to unlearn."}, {"id": 50644007, "au": "pjmlp", "dom": 79, "sr": 50, "sc": 1.03, "ep": 2.57, "bs": 0.0, "d": 3, "age": 8.04, "grav": 63.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.756, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I bet most folks using Python have no clue about how close it is to C++ and Common Lisp in terms of capabilities, across its language, standard library, runtime capabilites and C FFI.\n\nThey assume the myth that Python is a programming language for beginners and never do a deep dive into what is available.\n\nWorse, due to lack of compatibility across releases, it is rather easy to have code break and be blissful unaware of what a specific point release has changed.\n\nWhen I learnt Python, the current version was 1.6 and Zope was everywhere, I guess I know a thing or two about its evolution and related complexity."}, {"id": 50644364, "au": "quietbritishjim", "dom": 3, "sr": 51, "sc": 1.01, "ep": 2.56, "bs": 0.0, "d": 2, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.7, "fa": 0.0, "gp": 0.627, "bl": 0.0, "ds": 0.0, "txt": "But C++ has the return value optimisation (even the named return value optimisation), where you construct an object in a function and then \"return\" it, but it's actually constructed in place at the call site (not guaranteed but allowed by the language and widely implemented):\n\n   Foo make_foo() {\n      Foo result;\n      result.blah = 7;\n      return result;\n   } \n   Foo f = make_foo();\n   \n   // Equivalent to:\n   Foo f;\n   f.blah = 7;\n\nI don't know enough about Rust to know whether it has the same thing, but surely it could? If anything, it feels like it ought to be easier (for the compiler) because Rust moves rather than copies by default, and moves are destructive and bytewise.\n\nGiven that, it seems like a language could be designed so that a static method that returns an object could be allowed to construct an object in place. Again, I don't know enough about Rust or Zig to know if that's true of them."}, {"id": 50643854, "au": "coldpie", "dom": 84, "sr": 52, "sc": 0.99, "ep": 2.53, "bs": 0.0, "d": 2, "age": 8.2, "grav": 65.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 199, "qw": 0, "k": 24358, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.737, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Learn (like, really learn) C first.  C is a reasonably easy language to learn, with only a few weird corners mostly due to its relevance to very old computing concepts.  Build a few toy programs, maybe a video game or two, play around with memory allocations and struct aliasing and file I/O and function pointers.\n\nC++ is (wave hands vigorously) roughly built on top of C's core concepts, so if you know C really well you can (continue waving hands) actually map most of C++'s basic concepts on top of how C works.  For example in object methods, the 'this' pointer is actually just silently passed as the first parameter to a function.  Class vtables are (at a very abstracted level) just arrays of function pointers.  Letting you map those concepts down to a simpler representation like C means C++'s magic starts to lose its magic. Understanding how the class hierarchy is mapped to C can tell you why the 'virtual' keyword exists, and why you need proper copy constructors for those objects but not ones without vtables; and it gives clues for what pure virtual functions are, and why you can't allocate an object with one.\n\nSo yeah.  Start with C, then figure out the bizarre, incredibly complex maze of abstractions that C++ stacked on top of it."}, {"id": 50646112, "au": "dako2117", "dom": 144, "sr": 53, "sc": 0.95, "ep": 2.2, "bs": 0.0, "d": 1, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 6, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.934, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I believe there are also cases where you have a member variable which has a complicated initialization that you may want to handle in some sort of manner that is not appropriate for the default ctor. So you may not want to initialize everything right away in this scenario."}, {"id": 50644324, "au": "trealira", "dom": 93, "sr": 54, "sc": 0.92, "ep": 2.46, "bs": 0.0, "d": 4, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1226, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.744, "fa": 0.0, "gp": 0.491, "bl": 0.0, "ds": 0.0, "txt": "But that only happens if you fail to learn everything in modern C++. If you want to know everything about C++ inside and out, it seems best to start with learning C inside and out, and then to learn which practices have been superseded by better alternatives in C++ and how C++ has changed them, e.g., how initialization has been complicated."}, {"id": 50644771, "au": "ninkendo", "dom": 40, "sr": 55, "sc": 0.85, "ep": 4.08, "bs": 1.7, "d": 6, "age": 7.08, "grav": 53.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.63, "fa": 0.0, "gp": 0.174, "bl": 0.64, "ds": 0.0, "txt": "Yep, that's std::mem::zeroed(), which just writes zeroes into the allocated memory regardless of its type... also only available in unsafe code.\n\n    \u0023[derive(Debug)]\n    struct Foo {\n        _i: i32,\n    }\n\n    fn main() {\n        let x: i32 = unsafe { std::mem::zeroed() };\n        println!(\"x={x}\");\n        let f: Foo = unsafe { std::mem::zeroed() };\n        println!(\"f={f:?}\");\n    }\n\nprints:\n\n    x=0\n    f=Foo { _i: 0 }\n\nIt's unsafe because if Foo contained a String, it would be string with a null pointer inside it and you'd crash trying to read it. If you want \"Default\" values instead of zeroed (ie. you don't want to run unsafe code), that's what the Default trait is for, and this becomes:\n\n    \u0023[derive(Debug, Default)]\n    struct Foo {\n        _i: i32,\n    }\n\n    fn main() {\n        let x: i32 = Default::default();\n        println!(\"x={x}\");\n        let f: Foo = Default::default();\n        println!(\"f={f:?}\");\n    }\n\nand prints the same thing."}, {"id": 50645755, "au": "trealira", "dom": 89, "sr": 56, "sc": 0.85, "ep": 2.46, "bs": 0.0, "d": 7, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1226, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "Why not simply write the following?\n\n   const Config config { loadConfig() };\n   for (auto &name : config.names) {\n       use(name);\n   }\n\nOr else you could have \"loadConfig()\" be a method that returns a reference, which is in turn the member of a class, so that there isn't any dangling reference issue."}, {"id": 50644331, "au": "ninkendo", "dom": 33, "sr": 57, "sc": 0.85, "ep": 2.33, "bs": 0.0, "d": 4, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.58, "fa": 0.0, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "In C++, `int x;` leaves the int uninitialized, which isn't really constructing at all. In rust (which I program in lately so I'll use it as the example) you simply can't use uninitialized variables in the first place without unsafe code, so the equivalent would either be:\n\n  let x: i32;\n  foo(x); // compiler error\n\nor if you really wanted to use uninitialized memory,\n\n  let x: i32 = unsafe { std::mem::uninitialized() }; // compiler warning\n  foo(x);\n\nwhich, in rust, can be done with any other type too (substitute i32 for any T and the above examples are identical.) I don't see anything different about built-in types here vs standard ones, other than the compiler has literals for the built-ins, which is more a consequence of rust not allowing literals for library types. But that's a very different discussion.\n\nI guess the argument might be that for C++, they want the author of the type to determine whether the value should be left uninitialized on declaration/construction, instead of the caller. Which is... not exactly the semantics I would have chosen."}, {"id": 50645454, "au": "layer8", "dom": 14, "sr": 58, "sc": 0.85, "ep": 2.28, "bs": 0.0, "d": 1, "age": 6.11, "grav": 43.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 249, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.874, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "The main idea is that the class in question establishes the invariants of the new instance through the constructor. Subclasses have no business to fudge anything about the invariants of the superclass, or to see the uninitialized state of the superclass instance (and possibly expose it to client code in that invalid state); same as any other client code. So an invocation order has to be enforced such that the superclass constructor is always called before the subclass constructor is executed with access to the superclass instance.\n\nThe whole idea of OOP, aside from inheritance, is that the class implementation controls and ensures the invariants of its instances, protecting their internal state from client code. This limits code that might accidentally leave the object in an invalid state to the class implementation. If the class implementation is correct, then the object can’t possibly get into an invalid state, because only the class implementation can manipulate that state. And, importantly, that encapsulation boundary also exists between superclass and subclass. Conceptually, from the perspective of the superclass, a subclass is client code just like any other client code, from which the internal state of the superclass instance has to be protected.\n\nHence there needs to be a concept of dedicated initialization functions to guarantee that instances are always properly const"}, {"id": 50644798, "au": "pjmlp", "dom": 87, "sr": 59, "sc": 0.85, "ep": 3.08, "bs": 0.85, "d": 5, "age": 7.06, "grav": 52.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.809, "fa": 0.28, "gp": 0.259, "bl": 0.32, "ds": 0.0, "txt": "C raw arrays and strings should only be used for \"unsafe\" C++ code, in the implementation of safer types, with bounded checked interfaces, or in interop code with C libraries, properly wrapped in safe accessors for example.\n\nUse of references for any non nullable pointer.\n\nRAII for heap allocated types, eventually new/delete, leave malloc()/free() family with sizeof type math for interop with existing C code.\n\nPrefer standard library algorithms with proper bounds checking, instead of memsomething and strsomething function family.\n\nPreprocessor magic, when templates and constexpr are type safe, and can even be single stepped on a modern IDE.\n\nJust some examples out of my mind."}, {"id": 50645934, "au": "tialaramex", "dom": 54, "sr": 60, "sc": 0.85, "ep": 2.22, "bs": 0.0, "d": 2, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "Yes, the ergonomics are just better\n\nIf you Vec::with_capacity(5) both you and a reviewer know what's going on here - this is clearly a Vec with capacity 5.\n\nWhen you call a C++ constructor with 5 as the parameter, both you and the reviewer had better be sure what that 5 means."}, {"id": 50644660, "au": "quietbritishjim", "dom": 37, "sr": 61, "sc": 0.85, "ep": 3.02, "bs": 0.85, "d": 5, "age": 7.23, "grav": 54.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 8171, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.064, "fa": 0.0, "gp": 0.36, "bl": 0.32, "ds": 0.0, "txt": "Hmm interesting. Is there a way to \"value initialise\" (in C++ speak) an int in Rust to set it to zero? Like `let x: i32 = {};` (without explicitly writing `=0`)? How about a way to do that for a sort of plain struct where there are multiple members you just want to set to their default values?"}, {"id": 50647631, "au": "aw1621107", "dom": 29, "sr": 62, "sc": 0.85, "ep": 2.17, "bs": 0.0, "d": 6, "age": 3.11, "grav": 18.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 23, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.413, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Well, in Rust, you can't make your own Box without using \u0023[lang = \"owned_box\"] and \u0023[fundamental], plus it has special orphan rule handling.\n\nSure, but are those \"just\" characteristics of Rust's current implementation or are those inherent to a constructor-less model in general? The latter is the more interesting question to me in this particular context, and I think it's similar to the question you express."}, {"id": 50643752, "au": "William_BB", "dom": 110, "sr": 63, "sc": 0.85, "ep": 2.15, "bs": 0.0, "d": 3, "age": 8.32, "grav": 66.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.538, "fa": 0.0, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure what's so \"spooky\" about this example. It's really obvious if you know what `std::string_view` is. `Sanitize()` signature is fishy to begin with -- it takes a single string by const ref, but returns a string view. And I don't even consider myself very experienced in C++.\n\nSure, it'd be nice if the compiler didn't allow you to write this code. But there are worse examples than this out there."}, {"id": 50648015, "au": "0x457", "dom": 30, "sr": 64, "sc": 0.85, "ep": 2.96, "bs": 0.85, "d": 7, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2444, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.259, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Fair.\n\nI think guaranteed in-place initialization is probably the strongest example of something that cannot be expressed through From or Default alone. There are proposals to solve this via traits. I haven't dug deep enough into them, but I'd assume those would be \"special\" traits that rely on compiler-provided semantics not otherwise expressible in ordinary library code.\n\nRight now, both Box::new() and the vec![] macro resort to compiler intrinsics (write_via_move and write_box_via_move), particularly to avoid unnecessary intermediate storage and excessive stack usage."}, {"id": 50647779, "au": "sedictious", "dom": 100, "sr": 65, "sc": 0.85, "ep": 2.08, "bs": 0.0, "d": 6, "age": 2.9, "grav": 17.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.887, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yes which is exactly why you don't keep those things in mind most of the times. They are mostly academic exercises yet they pop up in your actual code from time to time and you find yourself furiously scratching your head. But my point is that C++ is huge and there is no way any single human can keep the whole standard in their head."}, {"id": 50645798, "au": "pwdisswordfishq", "dom": 15, "sr": 66, "sc": 0.85, "ep": 2.07, "bs": 0.0, "d": 2, "age": 5.66, "grav": 39.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.88, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Rust allows establishing invariants on its types without having a designated \"constructor\" concept.  It accomplishes the same with the equivalent of static methods.  Constructors are simply unnecessary."}, {"id": 50646489, "au": "ninkendo", "dom": 48, "sr": 67, "sc": 0.85, "ep": 3.74, "bs": 1.7, "d": 8, "age": 4.62, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.491, "fa": 0.0, "gp": 0.16, "bl": 0.64, "ds": 0.0, "txt": "I completely agree, but the point was to show Rust code that does the same thing as the (equally unsafe) C++ code, and particularly that it doesn't treat built-ins any different than other types. But nobody should be writing code like this in either language.\n\nTo me the whole point of an \"uninitialized variable\" is to declare it in one place and then assign it in exactly one code path, which is exactly what rust supports without any unsafe code:\n\n  let i: i32;\n  if is_tuesday {\n      i = 0;\n  else {\n      i = 1;\n  }\n  foo(i);\n\nis already perfectly valid, safe rust code, because the compiler knows that all code paths result in assignment before use. And the answer to \"what happens on that first line?\" is \"nothing\", because it's just a declaration. In the equivalent C++ you'd be running an arbitrary constructor on the first line, and hoping the compiler optimizes it away. Or if the default constructor doesn't exist or is deleted, you simply can't code that way."}, {"id": 50646496, "au": "spacechild1", "dom": 145, "sr": 68, "sc": 0.85, "ep": 1.98, "bs": 0.0, "d": 2, "age": 4.61, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3568, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Can you give a concrete example? Why wouldn't you initialize the member to something, e.g. a sentinel value?\n\nNote that if the member is non-trivial, its default constructor is called either way."}, {"id": 50646684, "au": "William_BB", "dom": 113, "sr": 69, "sc": 0.85, "ep": 1.96, "bs": 0.0, "d": 5, "age": 4.36, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.756, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "I agree with your general sentiment, but imo this particular example is oversold. Maybe I'm wrong.\n\nThe difference between const ref string and string view is one of the first things you learn when you learn about `string view`.\n\nTo me, the signature of `Sanitize` is fishy because it's implied that the returned string view is of the const ref string argument. But I agree there are more than one ways to break it."}, {"id": 50645752, "au": "simonask", "dom": 129, "sr": 70, "sc": 0.85, "ep": 1.94, "bs": 0.0, "d": 5, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2509, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.824, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "All things... except non-nullable pointers, movable values, type punning, ergonomic sum types, and the list is frankly much longer.\n\nThe only way you could think that C++ lets you do everything is if you've never tried anything else."}, {"id": 50645006, "au": "pjmlp", "dom": 35, "sr": 71, "sc": 0.85, "ep": 3.79, "bs": 1.85, "d": 5, "age": 6.72, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.274, "fa": 0.28, "gp": 0.0, "bl": 0.7, "ds": 0.0, "txt": "It is up to the constructor to only initialize storage, or do whatever it feels like to have values assigned to it.\n\nThus a default constructor replicates a plain int x;, whereas the copy constructor or single value constructor is used for int x = 42;.\n\nBy the way, already in the 16 bit days you could configure to have warnings as errors for variables being used without initialisation."}, {"id": 50645698, "au": "simonask", "dom": 112, "sr": 72, "sc": 0.85, "ep": 1.92, "bs": 0.0, "d": 4, "age": 5.81, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 2509, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.596, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You have to know a lot about C++ to tell at a glance what's wrong with this code. I fall in that category, and I can tell you I think that the signature of Sanitize() looks extremely reasonable!\n\nWhat's completely unreasonable here is how easy it is for code that looks reasonable in C++ to be deeply dangerous. This is a perfectly normal piece of code, and it looks like the author is even conscientious about nice things like avoiding too many string copies. We shouldn't be out here defending the absolutely unhinged semantics that led to this.\n\nC++ is so extremely hostile that people who try to write good code end up with a very defensive style of programming if they know what they're doing. In my experience, this tends to either almost fully eradicate any performance benefits they were chasing by choosing C++ in the first place, or blow up the time it takes to deliver the product."}, {"id": 50645532, "au": "trealira", "dom": 134, "sr": 73, "sc": 0.85, "ep": 1.92, "bs": 0.0, "d": 3, "age": 6.01, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1226, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.815, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IDK, I just like C++. I don't think that's the reason. It doesn't feel that good to get something done in C++, and it doesn't feel like a puzzle; it just feels mostly straightforward. The language which is actually like a puzzle and which feels good to write is Haskell, in my opinion, but it's not always as easy to get stuff done in Haskell. I suppose this is why many Haskell coders moved to Rust."}, {"id": 50646131, "au": "steveklabnik", "dom": 34, "sr": 74, "sc": 0.85, "ep": 1.82, "bs": 0.0, "d": 5, "age": 5.11, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 98983, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.736, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Please note that mem::uninitialized is always unsound. Your example should be using MaybeUninit<T>. While that example would still be unsound directly anyway, it at least gives you the ability to do the right thing (foo would need to take the MaybeUninit<i32>)."}, {"id": 50644073, "au": "ninkendo", "dom": 61, "sr": 75, "sc": 0.85, "ep": 2.87, "bs": 1.06, "d": 2, "age": 7.97, "grav": 62.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.0, "bl": 0.4, "ds": 0.0, "txt": "I get that for C++ to have all this overloading it needs constructors, but Swift doesn't take the same bet as C++ does when it comes to overloading, yet it still has first-class constructors anyway. So do lots of other languages (Java, C\u0023, TypeScript, etc.) Swift is especially interesting because it's basically a successor language to Objective-C, and Objective-
