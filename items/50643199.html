C did not have first class constructors (`-init`/`-initWithFoo:` is just a convention), they chose to add it anyway."}, {"id": 50645100, "au": "marcosdumay", "dom": 62, "sr": 76, "sc": 0.85, "ep": 2.61, "bs": 0.85, "d": 3, "age": 6.58, "grav": 47.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.112, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "The convenience vs. designated initialization in Swift is exactly the same kind of attempt to overload normal language syntax.\n\nOutside of that, Swift has only normal OOP constructors, that are something completely different, and almost not a pain at all. Normal constructors are just a control layer on top of memory initialization that lets you write custom rules for it. It becomes necessary when you have protected memory in your objects, because the external code can't just go and set it, but even languages like Python understand it's convenient to have a defined place to set things up."}, {"id": 50647027, "au": "agosz", "dom": 158, "sr": 77, "sc": 0.85, "ep": 1.71, "bs": 0.0, "d": 2, "age": 3.94, "grav": 24.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 31, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.727, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Maybe I've been doing this for too long, but I don't see why you'd want to stay away from template metaprogramming, especially with the more recent C++ versions. The type traits header makes heavy use of it (so you're probably using it with if constexpr), and C++14/17/20 make it a lot more readable than it used to be."}, {"id": 50644074, "au": "aw1621107", "dom": 22, "sr": 78, "sc": 0.85, "ep": 1.57, "bs": 0.0, "d": 2, "age": 7.97, "grav": 62.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That feels a bit like begging the question? Library types only need constructors to replicate built-in types if built-in types use constructors themselves. But do built-in types need constructors? What is lost by just using regular functions?\n\nAlso I was under impression that Rust at least has a similar goal?"}, {"id": 50643522, "au": "chuckadams", "dom": 107, "sr": 79, "sc": 0.85, "ep": 1.49, "bs": 0.0, "d": 1, "age": 8.59, "grav": 69.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 5147, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.557, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "Reading Effective C++ those many years ago was eye-opening in a couple ways: initially for the intended reason in the title of the book, but later it felt like having a map to a minefield: good info to have, but it felt more prudent to stay out of the minefield in the first place."}, {"id": 50647734, "au": "zubspace", "dom": 51, "sr": 80, "sc": 0.84, "ep": 1.46, "bs": 0.0, "d": 2, "age": 2.98, "grav": 18.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 1645, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.621, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is something I struggle with alot.\n\nConstructors make alot of sense to me. It's a promise to the caller that the instance is fully initialized after it returns.\n\nBut there are cases where it simply ain't possible. For exampIe I always struggle with object pools, where you construct a bare instance and reuse it later on. In such cases it is often very cumbersome to to guarantee that each instance is properly initialized and uninitialized in every case. It gets worse when different instances are involved, depending on each other. The more classes there are, the worse it gets."}, {"id": 50649155, "au": "Joker_vD", "dom": 20, "sr": 81, "sc": 0.84, "ep": 1.44, "bs": 0.0, "d": 2, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 7643, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.612, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "First of all, there is a question of syntax, which ironically could be solved by taking a page out of BCPL's book (the irony is that BCPL is C's ancestor, but C lost several of its more advanced features, like statement expressions):\n\n    double m[1024 * 1024] = ?;\n    Foo x = ?;\n\nSecond, there is a question of semantics. You only get to have 1 destructor, and it's called unconditionally — so we force the author of Foo (or of any class, really) to either 1) write the destructor that can properly destruct an unitialized object which is a bit tricky since reading any of the fields of such an object is UB; 2) shift the blame to the users: \"don't do that with this class\" — which completely negates your \"decided at the call site (not in the class declaration)\" point, because this decision is made in the class declaration, and can be made only there, not at the call site.\n\nSo as usual with C++, we end up with a half-working system, with subtle footguns, pervading all of the program code, and impossible to ignore."}, {"id": 50648423, "au": "wavemode", "dom": 11, "sr": 82, "sc": 0.84, "ep": 1.41, "bs": 0.0, "d": 3, "age": 2.01, "grav": 12.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 6638, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.601, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a tradeoff thing. In languages like C and Zig you can declare a struct (which, naturally, will start out containing whatever random garbage was at that memory location) and then just begin assigning values to its fields.\n\nBut in C++ and Rust, assignment itself is a method which can be overridden. So what does it mean to call a method on an object that doesn't exist yet? Also, destructors have to be run when an object goes out of scope. But what if an error occurs before all the fields have been assigned - now you're destructing objects that don't semantically exist yet, and whose memory contains garbage.\n\nThat's why I say it's a trade-off - if they wanted, the designers of C++ and Rust certainly could have just allowed programmers to paint themselves into such corners. But they preferred to disallow these things entirely and instead require objects to be constructed all at once as a semantic unit."}, {"id": 50644359, "au": "William_BB", "dom": 43, "sr": 83, "sc": 0.84, "ep": 1.35, "bs": 0.0, "d": 3, "age": 7.62, "grav": 58.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.573, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If my understanding is correct, C++ built-in types can be declared without initializing them:\n\n  int x;   // Unitialized, garbage value\n  int x{}; // Value-initialized (falls back to zero-initialization)\n\nWe want classes to have the same behaviour:\n\n  Struct s;   // Default-initializes (presumably we want members uninitialized)\n  Struct s{}; // Value-initializes (presumably we want members initialized)"}, {"id": 50646077, "au": "steveklabnik", "dom": 16, "sr": 84, "sc": 0.84, "ep": 1.32, "bs": 0.0, "d": 3, "age": 5.18, "grav": 34.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 98983, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.56, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Two things make this possible, really: the first is that Rust doesn't have subclassing, so one classic reason for constructors doesn't exist. The second is Rust's privacy system, which makes it so that external users can be forbidden to use the literal syntax to create a struct. This is what lets you guard creation to preserve invariants.\n\nOne useful feature of constructors still doesn't exist, which would be the placement new style thing, but that's on its way as well, and is an optimization rather than a requirement for most cases."}, {"id": 50643666, "au": "lkjdsklf", "dom": 135, "sr": 85, "sc": 0.84, "ep": 1.28, "bs": 0.0, "d": 2, "age": 8.43, "grav": 68.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 289, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.476, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "It’s a weird language\n\nOn your initial look, it looks like a total nightmare.\n\nThe more you learn and use it, you learn that it is even worse than you ever imagined\n\nSo you try something else and find yourself in a constant loop of “if this were c++ i could just go xyz, by nooo”\n\nSo then you love it"}, {"id": 50646057, "au": "qurren", "dom": 103, "sr": 86, "sc": 0.84, "ep": 1.19, "bs": 0.0, "d": 1, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1164, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.476, "fa": 0.0, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "C++ wasn't scary until they kept adding feature-of-the-month to the language. I can't understand recent C++ code anymore. Just leave constructors alone. We don't need constexpr. We don't need spaceship operators and all of that nonsense."}, {"id": 50644455, "au": "ninkendo", "dom": 44, "sr": 87, "sc": 0.84, "ep": 2.22, "bs": 1.06, "d": 4, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.0, "bl": 0.4, "ds": 0.0, "txt": "As I replied in a sibling comment to yours, at least one language without constructors (Rust) has the exact same semantics for built-in types vs library types here. You must initialize in typical code, and the escape hatch is std::mem::uninitialized() which lets you work with uninitialized data, and this is true for any type, built-in or otherwise."}, {"id": 50643991, "au": "CamperBob2", "dom": 139, "sr": 88, "sc": 0.84, "ep": 1.08, "bs": 0.0, "d": 1, "age": 8.06, "grav": 63.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 14249, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.397, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Soooo glad I don't have to deal with C++ anymore.  Sure, AI might end humanity, but in the meantime, it will never have to pay for its own drinks as long as I'm in the bar."}, {"id": 50646982, "au": "0x457", "dom": 28, "sr": 89, "sc": 0.84, "ep": 1.04, "bs": 0.0, "d": 5, "age": 4.0, "grav": 25.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2444, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.441, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, in Rust, you can't make your own Box without using \u0023[lang = \"owned_box\"] and \u0023[fundamental], plus it has special orphan rule handling.\n\nThe question is, at least for me, do you really miss out on anything by not having an ability to do so? I think you miss anything, but you gain a lot."}, {"id": 50646037, "au": "tialaramex", "dom": 47, "sr": 90, "sc": 0.84, "ep": 1.84, "bs": 0.85, "d": 7, "age": 5.26, "grav": 35.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.784, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "MaybeUninit::uninit().assume_init() is, exactly like the deprecated† core::mem::uninitialized() immediately UB unless your type is zero size and thus there's no difference between initialized and uninitialized.\n\nYou can unsafely ask for an uninitialized value of any type, but you should not ever assert that you've initialized it unless you actually have. Essentially, you can write this in Rust, but you need to be specific about what you're doing and when you are or are not initializing the variable or else things will go badly for you.\n\nIt wouldn't be worse in C++, historically, but C++ people are more used to their world being set on fire by an angry compiler because they did something wrong. In Rust you'd be quite surprised by the compiler's wrath.\n\n† Edited to add: Technically today you do not get this if you call core::mem::uninitialized, because it was so dangerous, instead if you call the deprecated function on a non-ZST - ironically you get a a value scribbled with 0x01 bytes. Doing this ensures in most cases LLVM won't set fire to your program immediately but at a price of doing all that extra work of writing 0x01 bytes. But we did tell you (for several years now) how to do better."}, {"id": 50649664, "au": "benibela", "dom": 104, "sr": 91, "sc": 0.84, "ep": 0.99, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 963, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.422, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It became scary when the compilers started optimizing UB away.\n\nBefore that you could just read the assembly to know what the code does. Afterwards any compiler update might have change the meaning"}, {"id": 50646406, "au": "raegis", "dom": 52, "sr": 92, "sc": 0.82, "ep": 0.82, "bs": 0.0, "d": 1, "age": 4.73, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 676, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.284, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "30+ years ago it was easy to memorize all the rules for constructors, and much of the language itself.  The improvements and additions over the years make it much harder."}, {"id": 50648518, "au": "thinkoid", "dom": 95, "sr": 93, "sc": 0.72, "ep": 3.23, "bs": 2.52, "d": 4, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 2, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "It's not a curse, you know. You do not HAVE to bring those practices into C++, only use the learned material to peek under the hood of C++ (not even so, but as the guy above suggested, glimpse into). If only I had a dime for every curmudgeon who took your dogmatic position and tried to scare someone away from C.\n\nThere is no better way to understand what's going on in std::vector or std::string than writing a growable array in C and having to keep three facts straight: how much storage you own, how many elements you’re using, and who releases it. Knowing how much work the abstraction does is a damn good reason to use it."}, {"id": 50645588, "au": "ninkendo", "dom": 46, "sr": 94, "sc": 0.69, "ep": 1.75, "bs": 1.06, "d": 6, "age": 5.95, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.745, "fa": 0.0, "gp": 0.0, "bl": 0.4, "ds": 0.0, "txt": "I literally had `MaybeUninit::uninit().assume_init()` first in the comment but rewrote it with `std::mem::uninitialized()` because I thought it would be more readable to a C++ crowd, but perhaps your right, I should have left it as-is."}, {"id": 50644104, "au": "pjmlp", "dom": 160, "sr": 95, "sc": 0.62, "ep": 2.47, "bs": 1.85, "d": 2, "age": 7.94, "grav": 62.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 1.053, "fa": 0.0, "gp": 0.0, "bl": 0.7, "ds": 0.0, "txt": "Agree, however those other languages will have C++ on their infrastructure maybe forever, due to the costs of fully bootstraping a compiler toolchain and backend support for various kinds of operating systems and processors.\n\nSo it is more a kind of gray answer, with polyglot development approach in many cases."}, {"id": 50643811, "au": "pjmlp", "dom": 21, "sr": 96, "sc": 0.37, "ep": 2.23, "bs": 1.85, "d": 1, "age": 8.24, "grav": 65.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.794, "fa": 0.0, "gp": 0.25, "bl": 0.7, "ds": 0.0, "txt": "Because in languages like C++ and Swift, contrary to your other examples, the goal is that library types should be able to do everything that built-in types expose.\n\nThus you need all mechanisms to implement the same capabilities, thus constructors, by the way they are not alone in this approach."}, {"id": 50646415, "au": "dist-epoch", "dom": 151, "sr": 97, "sc": 0.07, "ep": 1.27, "bs": 1.19, "d": 0, "age": 4.72, "grav": 30.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 3027, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.129, "fa": 0.0, "gp": 0.663, "bl": 0.45, "ds": 0.0, "txt": "For people who don't know, the number in C++14, C++26, ... is how many ways there are to initialize a variable."}, {"id": 50644132, "au": "marcosdumay", "dom": 164, "sr": 98, "sc": -0.01, "ep": 1.18, "bs": 1.19, "d": 1, "age": 7.91, "grav": 62.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.501, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "I just hope whoever selected the subset knows all of the language, so that they can tell if there's something outside of that subset interfering with it or not."}, {"id": 50644813, "au": "pjmlp", "dom": 94, "sr": 99, "sc": -0.07, "ep": 1.78, "bs": 1.85, "d": 5, "age": 7.04, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.419, "fa": 0.28, "gp": 0.0, "bl": 0.7, "ds": 0.0, "txt": "The problem is that many end up writing C style code in C++ and never bother with best practices, unless they have a proper mentor refusing PR for example."}, {"id": 50647139, "au": "lollollol3", "dom": 114, "sr": 100, "sc": -0.14, "ep": 2.37, "bs": 2.52, "d": 6, "age": 3.78, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 1.01, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "I think it is a real issue, yet in some ways worse in Rust. Mojo likely does this way better than both Rust and C++.\n\nAn addition could be made to C++ to make this less prone to errors, but Rust cultists and Jewish pedophiles make that harder to fix, with Jewish pedophiles being entrenched in both Rust and C++ political positions as well as in Ycombinator (Epstein board member)."}, {"id": 50645496, "au": "ninkendo", "dom": 27, "sr": 101, "sc": -0.14, "ep": 0.92, "bs": 1.06, "d": 6, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.389, "fa": 0.0, "gp": 0.0, "bl": 0.4, "ds": 0.0, "txt": "They could have just as easily said \"C semantics are used when we know we're parsing C code\" and declared that C++ code doesn't have implicit constructors. No, the decision to have constructors was made because it's what they wanted to do when the language was designed. You can't lean on \"but C\" as an excuse when those problems are so easily solved other ways."}, {"id": 50649424, "au": "tialaramex", "dom": 49, "sr": 102, "sc": -0.15, "ep": 2.39, "bs": 2.54, "d": 9, "age": 0.46, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 33173, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.017, "fa": 0.0, "gp": 0.0, "bl": 0.96, "ds": 0.0, "txt": "Your code snippet is fine, but MaybeUninit comes into its own when it's not obvious to the compiler that what you wrote is OK - MaybeUninit::assume_init is how you tell the compiler \"I promise this is correctly initialized\" and so long as you're correct, everything is fine. By Rice's Theorem no compiler could ever be sure all the time, and in fact Rust choose to be extremely pessimistic, obvious things like yours work, non-obvious things do not and if you write a ticket about a case you feel ought to be obvious but was not (please don't) the Rust folks will say that is as intended, here are some alternatives to achieve what you meant, up to and including MaybeUninit"}, {"id": 50643848, "au": "William_BB", "dom": 82, "sr": 103, "sc": -0.2, "ep": 1.0, "bs": 1.19, "d": 2, "age": 8.21, "grav": 65.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 173, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.342, "fa": 0.0, "gp": 0.133, "bl": 0.45, "ds": 0.0, "txt": "Classic C++ books and cppcon are probably the best ways to learn the language if you don't have exposure to a modern C++ codebase (at least C++17)."}, {"id": 50643635, "au": "lordnacho", "dom": 161, "sr": 104, "sc": -0.29, "ep": 0.9, "bs": 1.19, "d": 1, "age": 8.47, "grav": 68.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 31662, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.385, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Which makes various c++ repos look quite different. It's like learning Arabic and then finding out that you can't actually talk to all the other Arabic speakers."}, {"id": 50646826, "au": "plorkyeran", "dom": 90, "sr": 105, "sc": -0.32, "ep": 0.87, "bs": 1.19, "d": 7, "age": 4.22, "grav": 26.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 9604, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.371, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "C in C++20, A, B and C in C++23. This does sort of fall under a backwards compatibility issue, albeit not with C, as making D valid was considered too much of a breaking change."}, {"id": 50645787, "au": "layer8", "dom": 56, "sr": 106, "sc": -0.48, "ep": 0.72, "bs": 1.19, "d": 2, "age": 5.68, "grav": 39.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.305, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "These aren’t problems with the constructors per se, though. E.g. Java doesn’t have any of these problems."}, {"id": 50644837, "au": "pjmlp", "dom": 77, "sr": 107, "sc": -0.52, "ep": 1.33, "bs": 1.85, "d": 3, "age": 7.01, "grav": 52.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.567, "fa": 0.0, "gp": 0.0, "bl": 0.7, "ds": 0.0, "txt": "There is this thing called static analysers, that while they are not perfect, are quite good guard rails into what to use in terms of best practices, regardless of the programming language.\n\nCode quality would be much better in general if everyone actually used \"clippy\".\n\nWhich is anyway a moot point in the age of AI generated code."}, {"id": 50648863, "au": "reactordev", "dom": 6, "sr": 108, "sc": -0.55, "ep": 0.64, "bs": 1.19, "d": 4, "age": 1.34, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 11563, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.274, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "What is this abomination? This syntactic aversion to my eyes…\n\n(except they’re right and you just gained +1 to wisdom)"}, {"id": 50644456, "au": "aw1621107", "dom": 67, "sr": 109, "sc": -0.61, "ep": 0.58, "bs": 1.19, "d": 2, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.249, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "You don't really need C++-style constructors for RAII though. Rust implements similar semantics as C++ in that regard and constructors aren't a thing there."}, {"id": 50645039, "au": "pjmlp", "dom": 25, "sr": 110, "sc": -0.63, "ep": 2.92, "bs": 3.55, "d": 5, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 1.106, "fa": 0.0, "gp": 0.219, "bl": 1.34, "ds": 0.0, "txt": "Nope, because you also want C types, that now are C++ types by virtue of using a C++ compiler, to also share similar behaviours.\n\nWhich is why the only difference between a struct and a class, is the default access method.\n\nThus that C file could be made extensible in C++, with zero code changes on the call sites."}, {"id": 50644001, "au": "saghm", "dom": 106, "sr": 111, "sc": -0.67, "ep": 0.52, "bs": 1.19, "d": 2, "age": 8.05, "grav": 63.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 14366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.221, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "I went through this thread looking for this so because it would be absolutely criminal if it weren't included here by someone."}, {"id": 50643994, "au": "bestouff", "dom": 101, "sr": 112, "sc": -0.91, "ep": 0.28, "bs": 1.19, "d": 3, "age": 8.06, "grav": 63.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 3130, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.12, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "The more you know about C++, the less you're confident about how your code will be compiled."}, {"id": 50643914, "au": "ninkendo", "dom": 31, "sr": 113, "sc": -1.05, "ep": 1.2, "bs": 2.25, "d": 2, "age": 8.13, "grav": 64.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.288, "fa": 0.0, "gp": 0.36, "bl": 0.85, "ds": 0.0, "txt": "I don't see the link between constructors and whether or not built-in types have special treatment. Care to enlighten the class?"}, {"id": 50645767, "au": "jacobcmarshall", "dom": 146, "sr": 114, "sc": -1.09, "ep": 1.43, "bs": 2.52, "d": 1, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.609, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "This is one of the core problems with C++. If you ever encounter a language oddity, it's because you're holding the language wrong, and if you just do it The Right Way, you won't have this problem.\n\nC++ rarely pushes the user towards doing the right thing."}, {"id": 50648243, "au": "gaflo", "dom": 81, "sr": 115, "sc": -1.16, "ep": 1.48, "bs": 2.64, "d": 2, "age": 2.25, "grav": 13.5, "surf": 5.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 8, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.617, "fa": 0.0, "gp": 0.022, "bl": 0.996, "ds": 0.0, "txt": "I wouldn't say it's expert friendly either. It is very powerful, but it's definitely not as ergonomic to use as more modern languages. Before agents/LLMs you would probably have cppreference.com open every time you are implementing something to check whether the STL is designed as you think. Compilation errors are as explicit as it gets (and thus a bit verbose), but they would help an expert to very quickly understand what was going wrong in a program.\n\nI think part of the problem is that there are usually 3 different ways to achieve the same semantics, but there would be some subtle technical differences. From my perspective a lot of the problems with C++ come from the incoherent vision for what the language was supposed to be and especially the insistence on backwards compatibility caused significant bloat (design/technical debt) over time."}, {"id": 50643876, "au": "pjmlp", "dom": 85, "sr": 116, "sc": -1.48, "ep": 1.57, "bs": 3.05, "d": 3, "age": 8.18, "grav": 65.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.336, "fa": 0.0, "gp": 0.54, "bl": 1.15, "ds": 0.0, "txt": "This will only bring bad practices in modern C++, the root of all C/C++ discussions in security reports."}, {"id": 50643630, "au": "gchamonlive", "dom": 137, "sr": 117, "sc": -1.69, "ep": 1.35, "bs": 3.05, "d": 2, "age": 8.48, "grav": 68.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 4455, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.236, "fa": 0.28, "gp": 0.0, "bl": 1.15, "ds": 0.0, "txt": "Stockholm syndrome we're all vulnerable to. I love bash for instance."}, {"id": 50649508, "au": "nwallin", "dom": 132, "sr": 118, "sc": -2.31, "ep": 1.93, "bs": 4.24, "d": 3, "age": 0.3, "grav": 4.5, "surf": 14.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 179, "qw": 10, "k": 4801, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.309, "fa": 0.42, "gp": 0.008, "bl": 1.6, "ds": 0.0, "txt": "> This makes it a terrible language for actually getting things done,\n\nThe thing that I like about C++ the most is that it's best language for actually getting things done.\n\nThe 'problem' with C++ is that people who want to get things done go to the committee and say, \"hey, I need to actually get things done, if you add this language facility, I can actually get things done better,\" and they'll often just say \"ok\" and add it to the language. And if you're the sort of person who believes you must use every single facility provided by the language, then you walk away from C++ thinking it's too complicated. But if you're the sort of programmer who's only interested in getting things done, you can simply ignore all that noise and just actually get things done with the facilities that you know and like.\n\nYou don't have to use deeply nested templates, complex dynamic inheritance trees, move semantics, Turing-complete template metaprocessing, you don't even have to manually manage your memory if you don't want to. (personally I avoid all of those things except move semantics) But it's there if you need it."}, {"id": 50643510, "au": "vinyl7", "dom": 154, "sr": 119, "sc": -2.33, "ep": 1.91, "bs": 4.24, "d": 0, "age": 8.61, "grav": 70.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 1291, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.35, "fa": 0.0, "gp": 0.75, "bl": 1.6, "ds": 0.0, "txt": "The only sane usage of C++ is to only use a very small subset of its features."}, {"id": 50643649, "au": "tolugenius", "dom": 80, "sr": 120, "sc": -2.52, "ep": 1.85, "bs": 4.37, "d": 1, "age": 8.44, "grav": 68.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 594, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.437, "fa": 0.0, "gp": 0.568, "bl": 1.65, "ds": 0.0, "txt": "C++ is a language I heard is very \"beginner unfriendly, and expert friendly\" and it's true, I'm trying to relearn and really not clicking with me, anyone have tips on relearning or better sites than even learncpp?"}, {"id": 50648433, "au": "vips7L", "dom": 59, "sr": 121, "sc": -3.07, "ep": 1.3, "bs": 4.37, "d": 4, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 3746, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.553, "fa": 0.0, "gp": 0.0, "bl": 1.65, "ds": 0.0, "txt": "It’s ambiguous to the reader, but the JLS strictly defines which constructor would be called here. It’s the int a, int b constructor."}, {"id": 50643756, "au": "cogman10", "dom": 121, "sr": 122, "sc": -3.09, "ep": 2.08, "bs": 5.17, "d": 3, "age": 8.31, "grav": 66.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 22959, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.309, "fa": 0.0, "gp": 0.934, "bl": 1.95, "ds": 0.0, "txt": "Here's the thing.  I'd say that C++ is a great language for getting things done.\n\nIt gives you one of those fat swiss army knives I had as a kid with a spoon, fork, knife, toothpick, saw, nail trimmer, etc.  The problem is it's easy to get dirty and the spoon would get locked in place after one use.  But it was there, and it worked (once).\n\nC++ is extremely malleable.  I think the reason people like it is very similar to the reason people like lisp.  That ability to do horrors like make a lisp interpreter with macros or templates is the charm of C++.\n\nAnd if you are the only one writing it, it can be a joy because there are few limits to what you can or can't do.\n\nIt's only when you have to share a codebase with others that things can get out of hand fast without some committee established usage code and pledge."}, {"id": 50643829, "au": "tcfhgj", "dom": 122, "sr": 123, "sc": -3.43, "ep": 0.81, "bs": 4.24, "d": 4, "age": 8.23, "grav": 65.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 8, "qw": 12, "k": 1628, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.235, "fa": 0.0, "gp": 0.179, "bl": 1.6, "ds": 0.0, "txt": "> Here's the thing. I'd say that C++ is a great language for getting things done.\n\nmy productivity sky rocketed when I switched to Rust."}, {"id": 50647266, "au": "renox", "dom": 10, "sr": 124, "sc": -3.54, "ep": 0.7, "bs": 4.24, "d": 2, "age": 3.6, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 13, "qw": 0, "k": 1062, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.296, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "So Zig makes 'build-in-place' hard?\n\nThat's difficult to believe for a C-like language.."}, {"id": 50646297, "au": "layer8", "dom": 71, "sr": 125, "sc": -3.57, "ep": 1.59, "bs": 5.17, "d": 5, "age": 4.87, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.678, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Objective-C plays it fast and loose here. It doesn’t enforce object initialization, hence client code including subclasses can create and use uninitialized instances.\n\nSmalltalk is even worse, but it also has the philosophy that anything can be patched at runtime, so it kind of is in line with that.\n\nThis is basically about static type safety.\n\nYou could in principle enforce proper initialization and encapsulation by static analysis requirements instead of by a dedicated language construct. The latter is traditionally more efficient however, and arguably makes the code more explicit about its intent."}, {"id": 50647323, "au": "0x457", "dom": 99, "sr": 126, "sc": -3.59, "ep": 0.65, "bs": 4.24, "d": 5, "age": 3.52, "grav": 21.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 2444, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.274, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "In practice, it will be 0, assuming no external modification of a. Strictly under standard, its UB."}, {"id": 50643972, "au": "bernds74", "dom": 136, "sr": 127, "sc": -3.64, "ep": 0.6, "bs": 4.24, "d": 3, "age": 8.08, "grav": 64.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 152, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.254, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "This roughly sums up my feelings. C++ is horrendous, but it's also the best tool I have."}, {"id": 50646663, "au": "aw1621107", "dom": 69, "sr": 128, "sc": -3.7, "ep": 1.47, "bs": 5.17, "d": 4, "age": 4.39, "grav": 28.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 4618, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.625, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Even if you assume that's true that seems more like \"constructors are needed for implementation inheritance\" than \"constructors are needed for RAII\".\n\nI'm not even sure about the former? The important bit is that base class invariants can't be observed in an invalid/inconsistent state, and regular visibility/privacy/etc. rules seem technically sufficient for that? I'm not sure where exactly the boundaries of \"constructor-like concept\" are supposed to lie."}, {"id": 50643537, "au": "raincole", "dom": 138, "sr": 129, "sc": -3.74, "ep": 0.5, "bs": 4.24, "d": 2, "age": 8.57, "grav": 69.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.212, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Yes, people even have a term for this. It's named after a Swedish city."}, {"id": 50645671, "au": "jjmarr", "dom": 5, "sr": 130, "sc": -3.79, "ep": 1.38, "bs": 5.17, "d": 3, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 10, "k": 4726, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.587, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "> not guaranteed but allowed by the language and widely implemented\n\nOme can make it guaranteed (assuming Foo is an aggregate) by writing:\n\n    Foo make_foo() {\n      return Foo{.blah = 7};\n    }\n\nThis guarantees initialization happens at the end of the function, since you are returning a pure rvalue. Generally a good style rule to adopt and no annotations needed."}, {"id": 50648641, "au": "kibwen", "dom": 12, "sr": 131, "sc": -3.86, "ep": 1.31, "bs": 5.17, "d": 4, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 55731, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.558, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "To clarify, Rust doesn't allow overloading the assignment operator. The compound arithmetic assignment operators like `+=` are overridable, but that doesn't pose any problem for the use-before-init analysis, which already prevents all methods from being called on uninitialized variables."}, {"id": 50645515, "au": "cv5005", "dom": 119, "sr": 132, "sc": -3.86, "ep": 1.31, "bs": 5.17, "d": 3, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 153, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.558, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "For some reason both c++ and rust decided to go with \"lets make temporaries have insanely short lifetimes! Kill them immediatly at the first semicolon we can!\" and I don't know why. (rust at least makes it a compiler error to misuse them, but still annoying.)\n\nC has a much better design with its compound literals having block scope lifetimes."}, {"id": 50646536, "au": "pwdisswordfishq", "dom": 64, "sr": 133, "sc": -3.94, "ep": 0.3, "bs": 4.24, "d": 2, "age": 4.55, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.129, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Rule of Zero is not actually about constructors other than the move and copy constructors."}, {"id": 50645589, "au": "cozzyd", "dom": 128, "sr": 134, "sc": -3.96, "ep": 0.28, "bs": 4.24, "d": 4, "age": 5.95, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 10, "qw": 0, "k": 7506, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.121, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Yes, C++ is an omnibus language where all things are possible."}, {"id": 50645216, "au": "pwdisswordfishq", "dom": 41, "sr": 135, "sc": -3.98, "ep": 0.26, "bs": 4.24, "d": 4, "age": 6.41, "grav": 46.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 11, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.111, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "But you can also write int x = rand(); how is that special?"}, {"id": 50645580, "au": "simonask", "dom": 102, "sr": 136, "sc": -4.0, "ep": 1.17, "bs": 5.17, "d": 4, "age": 5.96, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2509, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.498, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "No I'm sure it will compile. But will it silently corrupt the customer's data 5 years down the line due to a compiler upgrade that suddenly exposed UB in a rarely taken code path? Much less sure."}, {"id": 50643989, "au": "cogman10", "dom": 123, "sr": 137, "sc": -4.15, "ep": 1.02, "bs": 5.17, "d": 5, "age": 8.06, "grav": 63.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 22959, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.432, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Probably, particularly in terms of writing correct code.\n\nBut C++ allows me to really easily write multithreaded code which I can convince myself is safe :) (and most of the time, is correct, just not on the edge cases).  Rust makes that painful."}, {"id": 50647307, "au": "gpderetta", "dom": 18, "sr": 138, "sc": -4.19, "ep": 0.98, "bs": 5.17, "d": 4, "age": 3.54, "grav": 21.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 13834, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "foo_types", "flbl": "Foo & Types (Uninitialized)", "urls": [], "ig": 0.417, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "With guaranteed RVO you could do something like this (pseudo-C):\n\n   struct FooBase { ... }\n   fn make_foo_base(...) -> FooBase\n   struct Foo { base : FooBase; ... }\n   fn make_foo(args...) -> Foo {\n      return { .base = make_foo_base(...), ... }\n   }"}, {"id": 50644546, "au": "tcfhgj", "dom": 124, "sr": 139, "sc": -4.2, "ep": 1.82, "bs": 6.02, "d": 6, "age": 7.38, "grav": 56.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 13, "k": 1628, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.773, "fa": 0.0, "gp": 0.0, "bl": 2.27, "ds": 0.0, "txt": "> Probably, particularly in terms of writing correct code.\n\npackage management, build system, compiler errors, language simplicity (yes, it adds life times, but removes so many other things), Rust macros, language ergonomics (e.g. match, macros, enums, async, if let, etc.), not having to think about certain things going wrong (including not debugging why things went wrong)\n\n> Rust makes [multithreaded code] painful.\n\nAndreas Kling is switching away from C++ to Rust in Ladybird, because of exactly the reversed experience.\n\nI have been using asynchronous multithreading via tokio - something I never dared to in C++.\nAlone from the compiler errors I have got doing that, I would assume that I would have been dealing with an unbearable amount of debugging of subtle memory issues."}, {"id": 50645407, "au": "pwdisswordfishq", "dom": 26, "sr": 140, "sc": -4.24, "ep": 0.0, "bs": 4.24, "d": 6, "age": 6.17, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 8, "qw": 0, "k": 314, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.0, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "What does this have to do with anything?"}, {"id": 50643798, "au": "aleksiy123", "dom": 105, "sr": 141, "sc": -4.34, "ep": 0.7, "bs": 5.04, "d": 1, "age": 8.26, "grav": 66.1, "surf": 0.0, "fade": "c00"  0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.352, "fa": 0.0, "gp": 0.0, "bl": 2.1, "ds": 0.0, "txt": "In a cruel twist of destiny, it doesn't actually get much more complex than initialisation. But it's something that rarely goes wrong. Static analysis has that nailed down."}, {"id": 50646098, "au": "ninkendo", "dom": 70, "sr": 145, "sc": -4.84, "ep": 1.38, "bs": 6.23, "d": 4, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 8626, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.589, "fa": 0.0, "gp": 0.0, "bl": 2.35, "ds": 0.0, "txt": "Objective-C has implementation inheritance but doesn't have constructors, I don't think constructors are essential there. As I said in the OP, `Cow::new()` can easily just call `Animal::new()` before continuing to initialize its own fields, etc.\n\nHeck, Smalltalk is the original OOP language and has implementation-based inheritance, and construction is done through ordinary methods on class objects."}, {"id": 50644138, "au": "pjmlp", "dom": 23, "sr": 146, "sc": -5.35, "ep": 0.75, "bs": 6.09, "d": 3, "age": 7.9, "grav": 62.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "std_string", "flbl": "Std & String (Const)", "urls": [], "ig": 0.317, "fa": 0.0, "gp": 0.0, "bl": 2.3, "ds": 0.0, "txt": "Initialisation syntax, and temporary values for implicit conversions, is what is lost."}, {"id": 50644123, "au": "pjmlp", "dom": 162, "sr": 147, "sc": -5.38, "ep": 0.72, "bs": 6.09, "d": 2, "age": 7.92, "grav": 62.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ways_language", "flbl": "Ways & Language (Expert)", "urls": [], "ig": 0.305, "fa": 0.0, "gp": 0.0, "bl": 2.3, "ds": 0.0, "txt": "Or learning English proper as 2nd language, and then going to Scotland.\n\nYet we manage."}, {"id": 50648618, "au": "wavemode", "dom": 65, "sr": 148, "sc": -5.38, "ep": 0.98, "bs": 6.36, "d": 3, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 6638, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "constructors_implementation", "flbl": "Constructors & Implementation (Inheritance)", "urls": [], "ig": 0.417, "fa": 0.0, "gp": 0.0, "bl": 2.4, "ds": 0.0, "txt": "Rule-of-zero classes don't need regular constructors either, since you can just aggregate-initialize them.\n\nIf more logic surrounding their construction is needed, you can use factory functions."}, {"id": 50645856, "au": "cogman10", "dom": 125, "sr": 149, "sc": -5.41, "ep": 1.46, "bs": 6.86, "d": 7, "age": 5.57, "grav": 38.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 26, "k": 22959, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "rust_done", "flbl": "Rust & Done (Language)", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 2.59, "ds": 0.0, "txt": "> Alone from the compiler errors I have got doing that, I would assume that I would have been dealing with an unbearable amount of debugging of subtle memory issues.\n\nWell, that's the thing about rust and async.  It's far more restrictive (necessarily) than the bounds of safety.  The hard problem rust runs into is that async functions can be executed outside of lexical and the lifetime tracking of the rust language.  To be absolutely safe, rust ends up needing to assume that async can be executed with no respect to the surrounding lifetimes.\n\nRust would really benefit from /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
