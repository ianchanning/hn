"ig": 1.194, "fa": 0.0, "gp": 0.43, "bl": 0.0, "ds": 0.0, "txt": "Same.  No ads - but videos take a long time to load and sometimes quit randomly.\n\nActually, my browsing experience in general is a lot worse with Firefox.  I gather Google is to blame in various ways."}, {"id": 50669168, "au": "missedthecue", "dom": 298, "sr": 169, "sc": 3.43, "ep": 3.43, "bs": 0.0, "d": 3, "age": 5.03, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 9093, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.046, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The revenue from an average Youtube premium viewer is greater than from an average non-premium viewer. There are plenty of discussions about this in creator forums.\n\nyes, you can subscribe to patreons but that is unfeasible if you follow a lot of people. I don't have the resources to regularly spend $100+ a month on patreons for all the channels I follow."}, {"id": 50660019, "au": "wolrah", "dom": 534, "sr": 170, "sc": 3.43, "ep": 3.43, "bs": 0.0, "d": 2, "age": 24.74, "grav": 370.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 2855, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.402, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "I've been a Youtube Premium subscriber since it was called Youtube Red and I have *NEVER* seen a Youtube-presented ad while logged in.\n\nI only ever see Youtube ads when I click on certain videos in Discord embeds which are by their nature not logged in to my account.\n\nThis obviously has no effect on embedded ads that are built in to the actual video itself, but that's never been the expectation."}, {"id": 50664222, "au": "nsbdhciebsbdhc", "dom": 222, "sr": 171, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 2, "age": 13.97, "grav": 146.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 46, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.857, "fa": 0.0, "gp": 0.972, "bl": 0.0, "ds": 0.0, "txt": "I use ubo so see no ads there but on snapchat the amount of gambling advertising for what I assume are scam websites is mindboggling. If I had kids, at this point I'd probably find an armish community to migrate to or something."}, {"id": 50662094, "au": "drnick1", "dom": 414, "sr": 172, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 1, "age": 19.68, "grav": 254.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 16, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.581, "fa": 0.42, "gp": 0.589, "bl": 0.0, "ds": 0.0, "txt": "> Is $9 a month really too much if you really watch YouTube enough for ads to bother you?\n\nNo, but paying for a service generally de anonymizes the user, and that is a big problem, especially since Google owns half of the Internet and makes every effort to track people. The last thing you want is to give Google more information about you."}, {"id": 50663914, "au": "Markoff", "dom": 146, "sr": 173, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 3, "age": 14.72, "grav": 159.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3226, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.424, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "uBlock Origin Lite works just fine, migrated from UO on Vivaldi to check if it's capable, the UI is crap, can't simply disable javascript and other things, but other than that it works sama in general (in YT same), on phone I still use FF, though Vivaldi already supports extensions there as well"}, {"id": 50661179, "au": "Telaneo", "dom": 401, "sr": 174, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 1, "age": 22.29, "grav": 311.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2350, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.031, "fa": 0.0, "gp": 0.663, "bl": 0.0, "ds": 0.0, "txt": "Youtube has removed several features and punished tens of creators I care about, and is also owned by a company I believe to be evil.\n\nThe more I cost them, the better."}, {"id": 50659724, "au": "ACCount39", "dom": 243, "sr": 175, "sc": 3.37, "ep": 3.37, "bs": 0.0, "d": 2, "age": 25.27, "grav": 384.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.082, "fa": 0.0, "gp": 0.571, "bl": 0.0, "ds": 0.0, "txt": "Anyone who decides \"oh, we must mandate a phone number for all accounts\" must be loaded into a cannon and fired off into the sun.\n\nMobile phone is the worst second factor known to man. It ties an account to a number you don't own, don't control, and that the operator can revoke or reassign at a whim - including when some scammers get them to. Then the site gets the privilege of having 2FA messages run on a network that costs the site good money to access, that involves going through an intermediate, and where the delivery mechanism falls short of secure on a good day.\n\nYou know what's a phone number good for, on the other hand? Tracking. It's easy enough to resolve to a real name, and easy to use as a data point to fuse user tracking data from service to service. A phone number is a great tracking ID. If what you want is a privacy violation, phone numbers are awesome."}, {"id": 50665661, "au": "geoffrette", "dom": 526, "sr": 176, "sc": 3.37, "ep": 3.37, "bs": 0.0, "d": 0, "age": 10.71, "grav": 97.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 16, "qw": 7, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/antonpictures/ANTON-SIFTA"], "ig": 0.495, "fa": 0.45, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "> Built with Alice (SIFTA) for George Anton.\n\nI'd check out what this Alice thing is before you consider installing this: https://github.com/antonpictures/ANTON-SIFTA it's really quite surreal."}, {"id": 50660330, "au": "drnick1", "dom": 38, "sr": 177, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 4, "age": 24.16, "grav": 356.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.762, "fa": 0.0, "gp": 1.085, "bl": 0.0, "ds": 0.0, "txt": "Gender-neutral pronouns are ugly, ungrammatical, and political. The lead developer has every right to reject them in his project. Fork the project or don't use it if you can't live with that."}, {"id": 50659310, "au": "jmpeax", "dom": 387, "sr": 178, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 1, "age": 25.88, "grav": 399.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 483, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.965, "fa": 0.0, "gp": 0.753, "bl": 0.0, "ds": 0.0, "txt": "I'll return to paying when they start treating me like a customer when I pay. I can't even turn off shorts. There is no customizability. They push whatever features their true customers want while ignoring the paying data cattle."}, {"id": 50663829, "au": "needfish", "dom": 588, "sr": 179, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 1, "age": 14.94, "grav": 162.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 33, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.415, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Personally I disable watch history so the recommendation feed would be blank. That way at least the only page with videos is the Subscriptions Page.\nIf you are on web desktop I would use an extension like SocialFocus or UnTrap for YouTube to hide certain UI elements out of the way. UBlock Element Zapping works as well."}, {"id": 50658019, "au": "darepublic", "dom": 157, "sr": 180, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 2, "age": 27.89, "grav": 452.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2938, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.316, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "for me (macbook not chromebook) ublock origin lite does work.  Every once in a while youtube will deploy something or I will fall into some bucket that receives anti-adblock messaging.  I usually switch browsers or just abstain from youtube for a while and before long youtube with adblock works again"}, {"id": 50662222, "au": "pteraspidomorph", "dom": 454, "sr": 181, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 2, "age": 19.34, "grav": 247.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1093, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.045, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've been enjoying Nebula's exclusive content as a member; unfortunately, lifetime was too expensive already for me by the time I arrived. They add new creators once in a while, but there is certainly room for more that align with my own interests specifically. What kind of content do you watch that you think would be a good fit and hasn't previously rejected or been rejected by the platform?"}, {"id": 50658077, "au": "nomilk", "dom": 539, "sr": 182, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 0, "age": 27.8, "grav": 450.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 19, "k": 8852, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.674, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "> Traditional ad blockers get detected by YouTube's anti-adblock system. Skip buttons take 5 seconds to appear. You sit there, hostage.\n\nI use uBlock Origin Lite and haven't seen that waiting screen for over a year (and no YT ads, ever)."}, {"id": 50657910, "au": "ryukafalz", "dom": 141, "sr": 183, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 2, "age": 28.05, "grav": 457.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 6216, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.069, "fa": 0.0, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "Google removed support for Manifest v2 extensions from Chrome a little while back, which were much more useful for content blocking. Ad blockers on Chrome aren't as capable as those on Firefox these days."}, {"id": 50660851, "au": "OroPla", "dom": 563, "sr": 184, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 0, "age": 23.14, "grav": 331.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 496, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.66, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I just use yt-dlp and then watch at my leisure later. If it's not worth that less time wasted on Youtube for me."}, {"id": 50663899, "au": "edukite", "dom": 166, "sr": 185, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 1, "age": 14.76, "grav": 159.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 108, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.751, "fa": 0.34, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "And I've seen issues. On my PC video was not playing at all and was using CPU extensive. Only when I disabled uBO after having issue for 3 days it stopped."}, {"id": 50659358, "au": "LeonM", "dom": 369, "sr": 186, "sc": 3.14, "ep": 3.14, "bs": 0.0, "d": 2, "age": 25.82, "grav": 397.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 14, "k": 8410, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.413, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> You pay Google for distribution, not content - even though they are making it murky.\n\nA sizeable chunk of that $9 goes to the content creators actually.\n\nAlso, the content creators get paid more per view if the view is coming from a paid viewer."}, {"id": 50666657, "au": "AndyJames", "dom": 134, "sr": 187, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 2, "age": 8.85, "grav": 73.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 292, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.33, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Brave on Android deals with all \"issues\" with YouTube by default. It removes all the adds, allows background audio and when locked, and allows picture-in-picture to some extend."}, {"id": 50661234, "au": "PostOnce", "dom": 377, "sr": 188, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 3, "age": 22.15, "grav": 308.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 9025, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.33, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nice quip, but let's stop and think about it.\n\nYouTube is not like a library, YouTube is like a casino.\n\nLibraries don't act like casinos: they don't spend enormous sums of money attempting to keep you in the library as long as possible no matter what it costs you, as a casino would, and as YouTube does with things like algorithmic suggestions (and the algorithm isn't \"your interests\", it's \"what makes us money?\") and an infinite endless series of YouTube Shorts whose only goal is to waste as many human hours as they possible can in order to increase YouTube's profit to the detriment of the rest of society."}, {"id": 50657787, "au": "ssl-3", "dom": 516, "sr": 189, "sc": 3.13, "ep": 3.66, "bs": 0.53, "d": 1, "age": 28.25, "grav": 462.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.54, "bl": 0.2, "ds": 0.0, "txt": "Even better:  Firefox with uBlock Origin on the desktop, and also Firefox with uBlock Origin on Android just the same.\n\n(For IOS:  Download/buy AdGuard from wherever you guys are allowed to get your manufacturer-approved gardening supplies and just use Safari, since it's Safari all the way down anyway.)"}, {"id": 50659746, "au": "novok", "dom": 118, "sr": 190, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 2, "age": 25.25, "grav": 383.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 7120, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.071, "fa": 0.0, "gp": 0.411, "bl": 0.0, "ds": 0.0, "txt": "I think AI is actually pretty good for this now, it can literally audit every new extension & userscript version update, and since it's all javascript or similar, you can catch it fairly quickly.  Most extensions are also not that big code wise.\n\nAlso for simple extensions, you can make local versions for yourself fairly quickly and tell the AI to use the other extension as an inspiration."}, {"id": 50662339, "au": "drinkinghorn", "dom": 342, "sr": 191, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 1, "age": 18.98, "grav": 239.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 7, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.608, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I watch two, maybe three 5 minute YouTube videos a month.\n\nThat's not worth paying for only to be shown ads."}, {"id": 50664347, "au": "kmarc", "dom": 547, "sr": 192, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 0, "age": 13.72, "grav": 142.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1801, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.734, "bl": 0.0, "ds": 0.0, "txt": "LibreTube (Android), SmarTube (Android TV), uBlock + Sponsorblock (Browser), and I haven't seen an ad for many years. Not sure what this really solves."}, {"id": 50659000, "au": "blooalien", "dom": 206, "sr": 193, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 4, "age": 26.34, "grav": 411.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 9, "k": 2319, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.798, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Well, you aren't a customer if you don't see ads.\n\nYou aren't the customer, and haven't been for a very long time.  Even if you pay Google for a service, they'll still try to farm your data and sell it to their actual customers (the advertisers).  You're the product and advertising to you is the service they sell to their customers to make most of their money, which is why they're trying to figure out every possible way to force ads upon you any way that they can."}, {"id": 50668549, "au": "witty_username", "dom": 596, "sr": 194, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 1, "age": 5.94, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 984, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.895, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yep, HN doesn't seem to understand that someone has to pay for your $200k/yr SWE salary (not to mention hosting costs of video, paying creators, etc)"}, {"id": 50658898, "au": "ghusto", "dom": 123, "sr": 195, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 2, "age": 26.51, "grav": 416.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2946, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.198, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Fake buffering and videos not loading is fixed by reloading the page (sometimes twice). First thing I do when I click on a video is reload the page.\n\nI've not seen an ad since, well, ever, actually."}, {"id": 50665549, "au": "chistev", "dom": 169, "sr": 196, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 1, "age": 10.94, "grav": 100.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1334, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.957, "fa": 0.0, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "I understand not wanting to watch YouTube ads because they are annoying and intrusive. But why would you block the video creators from showing you ads on the screen when it's the way they make money for creating the video you're so clearly interested in watching?"}, {"id": 50658643, "au": "blooalien", "dom": 153, "sr": 197, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 4, "age": 26.92, "grav": 426.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 8, "k": 2319, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.789, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It was enough to get me off YouTube.\n\nIt (and other shady stuff Google's done over the years) is enough to get me off Google products as much as humanly possible.\n\nI'd still be a positively rabid fan of Google today, had they just continued to live up to their old \"Don't Be Evil\" motto, but nah...  Apparently they don't care about positive happy paying customers (and the free advertising for their products and services which so often goes along with that) when instead they can just farm a huge portion of humanity like cattle for their \"data\" to sell to advertisers (even as they use that data to also farm advertisers for a little \"double-dipping-middle-man\" profit action there; \"triple-dipping\" if you also count all the services they charge for, all of which of course slurp up yet more data; \"lather-rinse-and-repeat\", Bang!  Google Evil Money Machine™!).\n\nNot super-keen on bein' treated like livestock to help (further) enrich a handful of anti-life corporate scumbags (at least not as long as I've still got a pair of functional braincells to rub together for warmth).  :)"}, {"id": 50660163, "au": "shevy-java", "dom": 214, "sr": 198, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 1, "age": 24.47, "grav": 364.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2075, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "I have not seen it on youtube myself in the last years, but\nI noticed on twitch that some ads sneaked through ublock origin.\nSo, not sure how well this here works, but some ads are definitely\nsneaky. I am still not sure how twitch managed to bypass ublock\norigin. I dislike websites that can harass me with ads.\n\nublock origin should become a basic human right."}, {"id": 50657774, "au": "Waraqa", "dom": 138, "sr": 199, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 1, "age": 28.26, "grav": 463.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 59, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.563, "fa": 0.0, "gp": 1.189, "bl": 0.0, "ds": 0.0, "txt": "I don't know about Firefox. But I'm using a Chromebook (which includes only one browser) and YouTube doesn't work if I use any ad-blocker."}, {"id": 50668821, "au": "rpdillon", "dom": 66, "sr": 200, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 7, "age": 5.54, "grav": 37.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.956, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We disagree about whether what he is presenting is reality. Specifically, there are several claims that Drew wrote that are not borne out by the sources he cites. Classic tactic for online manipulation."}, {"id": 50660285, "au": "cromka", "dom": 254, "sr": 201, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 2, "age": 24.23, "grav": 358.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 4605, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.278, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For me it's the inability to actually watch content I subscribed to. They stuff their crap in every list on the main page. Recently Updated section used to be exclusively your curate content but no longer is. So you pay for the content and they still shove their promoted videos down your throat."}, {"id": 50663739, "au": "mlacks", "dom": 610, "sr": 202, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 0, "age": 15.16, "grav": 166.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 650, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "After a decade of hacks and extensions, I came around to admitting that the best youtube ad blocker is Youtube Premium and a job"}, {"id": 50662918, "au": "notpushkin", "dom": 271, "sr": 203, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 5, "age": 17.34, "grav": 206.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 7311, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Network effects.\n\nLet’s say you start a totally fictional video service called Vineo. As a creator, why would I upload my videos there if there’s nobody to watch them? As a viewer, why would I go there if there’s nothing to watch?"}, {"id": 50660704, "au": "teddyh", "dom": 81, "sr": 204, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 4, "age": 23.48, "grav": 339.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 27063, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "That page is completely full of utter lies, innuendo, and slander.  And your style of “I can’t actually say anything concrete, so I’ll just imply vague badness” is continuing in the same style."}, {"id": 50666628, "au": "rpdillon", "dom": 9, "sr": 205, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 4, "age": 8.89, "grav": 73.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.247, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your comment opened with a general warning that extensions that are safe today are not guaranteed to remain safe. It's hard to read that and then conclude that the author thought that uBlock Origin was safe."}, {"id": 50659848, "au": "FabCH", "dom": 397, "sr": 206, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 3, "age": 25.1, "grav": 379.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1083, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.245, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They actively encourage people to watch shorts. They make active changes to their UX to get you to watch content they know for a fact is addictive.\n\nAnd they actively refuse to give users an option to disable shorts altogether.\n\nAt that point, it sort of is active malice and “just don’t watch it” is too simple."}, {"id": 50658329, "au": "dns_snek", "dom": 627, "sr": 207, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 27.38, "grav": 439.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you still use classic uBO on Brave? Unless you manually update it from Github you might be stuck on an old vulnerable version since it was removed from the extension store, just FYI."}, {"id": 50660197, "au": "PhilipRoman", "dom": 74, "sr": 208, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 4, "age": 24.42, "grav": 362.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 0.79, "fa": 0.0, "gp": 0.72, "bl": 0.0, "ds": 0.0, "txt": "What's with the subtle accusations? \"You didn't hear it from me, but...\"\n\nIf you have an issue with him then spell it out\n\nAnd how is any of this related to \"saner security model for extensions\"? Do you think he's going to put a leftist detector in the browser to leak progressives' data?"}, {"id": 50659888, "au": "thisisthenewme", "dom": 608, "sr": 209, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 0, "age": 25.04, "grav": 378.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 215, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.706, "fa": 0.0, "gp": 0.852, "bl": 0.0, "ds": 0.0, "txt": "I find it weird that the platforms push so hard to get ads to those that don't want to see the ads. I know I'm not going to be buying the product that you are forcing down on me. In fact, I'll make a list of the ads that's shoved to me and boycott those."}, {"id": 50658493, "au": "aweiher", "dom": 566, "sr": 210, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 1, "age": 27.16, "grav": 433.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 118, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.163, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "I never have this problem on linux (ubuntu something)\n\nBut I have a similar problem on mobile: after some time I cant play any video (yt, reddit, whatever, ..). Then I have to kill firefox and restart, then it works again."}, {"id": 50666245, "au": "lxgr", "dom": 235, "sr": 211, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 6, "age": 9.57, "grav": 82.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What's with the sweeping statements and overconfidence in your experiments fully describing whatever Google is doing in their internal heuristics?\n\nAnd then to go as far as downvoting somebody else's reported practical experience because it doesn't match your model, instead of incorporating a new data point..."}, {"id": 50667183, "au": "DavideNL", "dom": 64, "sr": 212, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 5, "age": 8.02, "grav": 63.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 3513, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.001, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I disagree. If the sources/statements by these people are correctly cited, he's simply communicating reality, as it happened. It's a good thing to draw attention to it so people are aware.\n\nOf course everyone can then discuss it, and draw their own conclusion based on those statements - whatever that may be."}, {"id": 50659064, "au": "_ZeD_", "dom": 423, "sr": 213, "sc": 2.86, "ep": 4.45, "bs": 1.59, "d": 1, "age": 26.24, "grav": 408.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 54, "k": 2371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.917, "fa": 0.42, "gp": 0.759, "bl": 0.6, "ds": 0.0, "txt": "> The amount of effort people will go to avoid paying for content they spend hours watching is fascinating.\n\nthe amount of effort services will make stuff that were free a payment premium is fascinating.\n\nThey are removing private property, and offer back \"services\" where I own nothing.\n\nYes. My goal is to fucking suck everything from free from these big corp.\n\n> YouTube Premium is absolutely worth the asking price. They’ve also got student plans and a new lite plan for cheaper.\n\nNo, it's not.\nThey are taking my money for giving me nothing substantial. I don't own nothing they will give me for my money.\n\n> Is $9 a month really too much if you really watch YouTube enough for ads to bother you?\n\nyes it is.\nthey should PAY ME to see ads."}, {"id": 50658726, "au": "ragall", "dom": 513, "sr": 214, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 1, "age": 26.79, "grav": 423.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 570, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.21, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "On Android, the best is Firefox with uBlock Origin, but Vivaldi and Brave (both Chromium derivatives) have built-in adblockers that work reasonably well. You also need a good DNS ad- and malware- blocker."}, {"id": 50659262, "au": "latexr", "dom": 216, "sr": 215, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 1, "age": 25.96, "grav": 401.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.208, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Considering the name, I wonder if part of the goal is to punish the advertisers. Perhaps when an ad is blocked no one pays, but if it loads and the page is refreshed, they pay for something you have not watched.\n\nI’m speculating. I don’t know if that’s how YouTube’s ad system works."}, {"id": 50659501, "au": "karmakurtisaani", "dom": 370, "sr": 216, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 25.63, "grav": 393.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 29, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.686, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Ad blockers are IMHO not just moraly acceptable, but we have a moral imperative to use them, to shield against dangerous influences and to take a stance against the marketing industry.\n\nI see that they have to pay for the service and the creators somehow ... but I've also vigorously hated ads my entire life, so ad block it is."}, {"id": 50662243, "au": "rafram", "dom": 270, "sr": 217, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 4, "age": 19.29, "grav": 245.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.794, "fa": 0.0, "gp": 0.643, "bl": 0.0, "ds": 0.0, "txt": "People chose to upload those videos to YouTube, and many of them earn ad revenue through it. If you provided a compelling alternative, maybe they’d use yours instead."}, {"id": 50665495, "au": "taegee", "dom": 458, "sr": 218, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 26, "qw": 0, "k": 115, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": ["https://adnauseam.io/"], "ig": 1.188, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Also have a look at AdNauseam.\n\nIt's a uBlock origin spin that additionally tries to complicate tracking and fingerprinting by clicking on every blocked ad behind the scenes.\n\nhttps://adnauseam.io/"}, {"id": 50657943, "au": "JackFener", "dom": 574, "sr": 219, "sc": 2.79, "ep": 5.31, "bs": 2.52, "d": 0, "age": 28.01, "grav": 456.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 19, "k": 3, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.817, "fa": 0.42, "gp": 1.51, "bl": 0.95, "ds": 0.0, "txt": "> YouTube serves an ad roughly every 60 seconds. You can't watch one minute of content without being interrupted by a commercial.\n\nThis is absolutely not true.\n\nThis repo does nothing, just refreshes the page and if it fails it redirects you to a YouTube mirror. What's even the point of using it?"}, {"id": 50659363, "au": "BigGreenJorts", "dom": 110, "sr": 220, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 2, "age": 25.81, "grav": 397.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 163, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 0.838, "bl": 0.0, "ds": 0.0, "txt": "I don't think it makes it immune, but sponsoredblock is open source and regularly uploads their database of user submitted sponsor segments on the open internet for backup. This doesn't mean the maintainers can't add tracking materials, but it does mean it can be forked and spun up as a new project if it does."}, {"id": 50659132, "au": "mschuster91", "dom": 448, "sr": 221, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 3, "age": 26.12, "grav": 405.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.185, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "High production quality requires effort aka multiple, sometimes dozens of FTE.\n\nTo me it seems YouTube takes too much of a cut if even multi million follower YTers have to resort to this kind of stuff."}, {"id": 50664637, "au": "zigzag312", "dom": 402, "sr": 222, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 1, "age": 13.06, "grav": 131.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 45, "k": 1463, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.361, "bl": 0.0, "ds": 0.0, "txt": "> YouTube is the \u00231 streaming video service in the world. Bigger than Disney, bigger than HBO, bigger than Netflix. I say this not to point out that Google needs your money as obviously they don’t, but I say this to point out that it’s a treasure trove of content.\n\nAre they \u00231 because they have been offering a streaming video service below cost for many years to gain dominant position and destroy competition?"}, {"id": 50668251, "au": "timbit42", "dom": 167, "sr": 223, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 2, "age": 6.41, "grav": 46.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1713, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "uBO usually has issues fixed pretty quickly (within hours) but you have to make sure your browser updates uBO and also update uBO's filter lists."}, {"id": 50666283, "au": "lxgr", "dom": 250, "sr": 224, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 3, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 22117, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.175, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Giving Google your crypto wallet address and associating it with your IP address and Youtube viewing history seems like a pretty efficient way to thoroughly deanonymize yourself."}, {"id": 50659020, "au": "pocksuppet", "dom": 442, "sr": 225, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 3, "age": 26.32, "grav": 410.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1748, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It just skips you to the timestamp that most other people skipped to, which they are skipping to because they have SponsorBlock installed. Nice trick to get SponsorBlock's database without scraping it and without publicly opposing in-video ads, which might get them into legal trouble."}, {"id": 50660579, "au": "TeMPOraL", "dom": 463, "sr": 226, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 4, "age": 23.69, "grav": 344.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Irony is, a decade or so ago, \"Make Available Offline\" was just always available by default on PC in any service - you'd let the video buffer fully (remember when that was a thing that happened?), and then never close the tab."}, {"id": 50664704, "au": "criticalsamus", "dom": 200, "sr": 227, "sc": 2.72, "ep": 5.24, "bs": 2.52, "d": 2, "age": 12.9, "grav": 129.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 32, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.188, "fa": 0.42, "gp": 0.863, "bl": 0.95, "ds": 0.0, "txt": ">uBlock Origin + SponsorBlock on Firefox on Linux here, and since 6 months ago Youtube videos all stopped playing within the first minute with an error. In order to watch them, I have to yt-dlp.\n\nI haven't seen problems with uBO on Firefox yet, but on my TV I use SmartTube.  For years, it mostly worked wonderfully, but the last couple months, it's now having a lot of trouble, stopping with an error in the first minute as you said.  If I try other videos and jump around a bit it seems to eventually start working, but it's annoying."}, {"id": 50660710, "au": "OroPla", "dom": 269, "sr": 228, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 3, "age": 23.47, "grav": 339.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 496, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.069, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Copyright is a state granted monopoly. Nobody is allowed to make a Youtube clone including all the videos. A youtube clone without all the videos is meaningless."}, {"id": 50658089, "au": "jstanley", "dom": 499, "sr": 229, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 1, "age": 27.77, "grav": 449.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 23627, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.739, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You have to remember there are probably hundreds of people watching YouTube at any one time, so one ad every 60 seconds works out to less than one ad per hour per viewer."}, {"id": 50665531, "au": "carlosjobim", "dom": 287, "sr": 230, "sc": 2.66, "ep": 2.66, "bs": 0.0, "d": 5, "age": 10.98, "grav": 100.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 1513, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.133, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why exactly would YouTube be any more of a gatekeeper than all their competitors and all movie production companies? Because their competitors mostly keep the door shut?\n\nI sense the classical logical (or rather moral) mistake that people make where they demand more from those who give the most, instead of from those who give the least.\n\nIt's good that YouTube gives opportunities to people that nobody else is giving. Until their competitors do it, the criticism is misdirected."}, {"id": 50661573, "au": "titzer", "dom": 410, "sr": 231, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 4, "age": 21.21, "grav": 287.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.717, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To be clear, YouTube broke even in 2009ish and has turned a profit every year. It is what it is now because anything less than hypergrowth is considered stagnation."}, {"id": 50666725, "au": "rauli_", "dom": 27, "sr": 232, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 5, "age": 8.73, "grav": 71.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 78, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.12, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "VimFx made using Firefox so much better for someone who is already used to Vi style keyboard shortcuts. And yes I know that dozens of similar WebExtensions exist but none of the come even close to VimFx which integrated to the browser UI because it was XUL based."}, {"id": 50666699, "au": "rpdillon", "dom": 63, "sr": 233, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 4, "age": 8.78, "grav": 72.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 0.988, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "I think Drew is in exceptionally poor form putting that page up, and I think it's equally poor form to be citing it as some kind of authoritative source.\n\nHe literally just made a webpage with pictures and names and descriptions of people he doesn't like -- it's not behavior we should reward, IMHO."}, {"id": 50659145, "au": "krater23", "dom": 625, "sr": 234, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 1, "age": 26.1, "grav": 405.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 263, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "HAHAHAHA....I know what you mean. First time I saw Youtube Ads on someone elses computer I thought theres a virus or worm on his windows."}, {"id": 50662299, "au": "npteljes", "dom": 372, "sr": 235, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 2, "age": 19.11, "grav": 242.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 12, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.546, "fa": 0.42, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": ">If adblockers hurt YouTube, good.\n\nThat's what we're arguing here - all this song and dance to not pay for Premium is only hurting the user that's doing it. If it would hurt Google, they'd just close down the service for these users and that'd be the end of it.\n\n>The only thing we owe YouTube is\n\na fair compensation for the services they provide by hosting the streams to be available for on-demand, and creating an economy where the creators can support themselves doing creation."}, {"id": 50660153, "au": "ACCount39", "dom": 246, "sr": 236, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 4, "age": 24.49, "grav": 364.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If that was it, they would ask for phone numbers in the payment process - when they ask for your credit card and ZIP code.\n\nInstead, they try to force you to add it on account creation. And if you dodge that, they then hound you with \"please add a phone to improve account security\". \"Security\" my ass."}, {"id": 50661693, "au": "ncr100", "dom": 416, "sr": 237, "sc": 2.58, "ep": 2.58, "bs": 0.0, es the message, but doesn't stop the artificial pause (which is still smaller than YouTube's utterly obnoxious ads, granted)."}, {"id": 50666653, "au": "zettabomb", "dom": 25, "sr": 247, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 4, "age": 8.86, "grav": 73.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 848, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "When the switch from XUL to WebExtensions happened, the Firefox devs knew it would break stuff, so they solicited feedback from popular extension developers. They then proceeded to effectively ignore much of the feedback, and never implemented (or took years to do so) multiple requested APIs, which doomed some extensions entirely as their functionality couldn't be replicated. They also fully removed XUL extensions before implementing all of the APIs they had said they would, further breaking extensions which thought they'd have a path forward.\n\nThere's plenty of reasons to prefer the new model, but IMO the devs didn't just not make everyone happy, they mismanaged the rollout and deprecations. Many issues could've been avoided by at the very least leaving XUL extensions available (behind a switch in about:config if necessary) until suitable replacement APIs were developed."}, {"id": 50667078, "au": "WarmWash", "dom": 284, "sr": 248, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 4, "age": 8.16, "grav": 65.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "YouTubes power comes from ad blockers.\n\nNo service beats YouTube + ad-block. It's impossible to compete with it when you need viewers to watch ads to get off the ground.\n\nPeople will do anything but look at themselves"}, {"id": 50664752, "au": "pepperoni_pizza", "dom": 48, "sr": 249, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 7, "age": 12.79, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 389, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.999, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think they had some setup where the character is using female ones and player male ones to distinguish them? Or the GM (or storyteller) and players / characters had different ones? Or am I misremembering?"}, {"id": 50660792, "au": "OroPla", "dom": 409, "sr": 250, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 3, "age": 23.3, "grav": 335.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 496, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.991, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't have any of these subscriptions, either, but Youtube was free to set different expectations for itself instead of losing money year by year in a bid to capture a large enough audience and make competitors unviable to then start to squeeze that audience once it had enough inertia.\n\nNo one would have started to use Youtube if it was what it is now."}, {"id": 50666619, "au": "nekusar", "dom": 606, "sr": 251, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 0, "age": 8.91, "grav": 73.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.775, "fa": 0.0, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "Or, run \"Ublock Origin\" on Fi dk, I think it wasn't that hard. I read the original comment and thought it was clear the commenter was referring to SponsorBlock"}, {"id": 50667389, "au": "TaLiTr", "dom": 173, "sr": 255, "sc": 2.24, "ep": 5.29, "bs": 3.05, "d": 1, "age": 7.71, "grav": 59.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 130, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.572, "fa": 0.34, "gp": 0.432, "bl": 1.15, "ds": 0.0, "txt": "About 3 days ago I had ads slipping though. Ublock origin on Firefox. It took maybe an hour before the block-list updated. Like a month ago it was several hours.\n\nIt's not a \"just stop using chrome lmao\" issue. Ublock is playing a cat-and-mouse game with Google, they will necessarily lose sometimes. I'm surprised you've never seen it."}, {"id": 50662282, "au": "npteljes", "dom": 334, "sr": 256, "sc": 2.24, "ep": 2.24, "bs": 0.0, "d": 2, "age": 19.18, "grav": 243.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.953, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's why the meta is to use Premium with sponsorblock. Premium to compensate the service provider fairly, and sponsorblock to block the ad that the creator baked into the stream."}, {"id": 50658784, "au": "franczesko", "dom": 469, "sr": 257, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 1, "age": 26.67, "grav": 420.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1641, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.718, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Alphabet also extensively does tax avoidance, censor and demonetize content, make the platform genuinely worse (dislikes removal). They additionally take blood money from governments to run their propaganda. Call me naive, but I'll never pay them a dime. \nCreators can be supported directly."}, {"id": 50668406, "au": "timbit42", "dom": 540, "sr": 258, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 1, "age": 6.16, "grav": 43.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1713, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.928, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "uBOL blocks ads but it doesn't block tracking like uBO does. That's fine if you only care about not seeing ads but it's not enough if you don't want them building a profile about you."}, {"id": 50659620, "au": "latexr", "dom": 556, "sr": 259, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 1, "age": 25.45, "grav": 388.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Several. I’ve had success with 1Blocker, Wipr, and uBlock Origin Lite. My recommendation is Wipr, it can also block system-wide."}, {"id": 50665098, "au": "ahf8Aithaex7Nai", "dom": 55, "sr": 260, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 6, "age": 12.04, "grav": 116.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 246, "qw": 0, "k": 364, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.664, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "I’m not involved in this specific debate with this specific guy, but genetics and sexual orientation is an interesting topic.  You can assume a genetic determination, or at least a predisposition, and conclude from that that gay people aren’t to blame.  But as a straight person, you can also use this viewpoint to categorically distance yourself by pointing out that you don’t have that predisposition.  That’s very convenient: gay people are excused, and at the same time, you make it clear that you yourself aren’t one.  I’m pretty sure that sexual orientation is learned and results from social conditioning.  In the end, we’re all bisexual in the sense that people have sex in some way with people they find attractive in some way.  Any restriction on this is a conditioned imperative.  Once you realize that, it’s so obvious.  Here's an analogy from the world of food: I don't eat insects and never will, but I fully realize that this isn't an innate preference and could certainly be changed if I wanted to.  I just don't want to.\n\nSo I would agree with those right-wing homophobic nutcases on one point: sexual orientation is not innate.  The discussion should focus on what matters: Why should it be a problem when people of the same sex come together for sex, love, and a shared life? If, instead, we debate whether or not there is a predisposition, we put ourselves at a significant disadv"}, {"id": 50658924, "au": "rightbyte", "dom": 497, "sr": 261, "sc": 2.01, "ep": 3.2, "bs": 1.19, "d": 1, "age": 26.48, "grav": 415.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 11337, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.653, "fa": 0.0, "gp": 1.15, "bl": 0.45, "ds": 0.0, "txt": "Some people are targeted with way more ads. Google measure conversion rate and target easy prey more I think ..."}, {"id": 50665560, "au": "himata4113", "dom": 170, "sr": 262, "sc": 2.0, "ep": 2.0, "bs": 0.0, "d": 2, "age": 10.91, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "q     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
