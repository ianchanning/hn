ep": 5.39, "bs": 0.0, "d": 0, "age": 27.83, "grav": 451.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 2938, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "its strange because I love yt.  but do I really love yt or just a thin slice of the content on there.  looking at what my kids see, its a rank swamp full of toxic messaging and grooming for future gambling addictions / other neuroses.  Youtube without your own curated list of channels etc. on the path of least resistance will just shove a whole bunch of objectionable brainrot in front of you"}, {"id": 50663856, "au": "rcymerys", "dom": 430, "sr": 75, "sc": 4.72, "ep": 5.39, "bs": 0.0, "d": 1, "age": 14.87, "grav": 161.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 310, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.856, "fa": 0.0, "gp": 0.712, "bl": 0.0, "ds": 0.0, "txt": "I don’t mind paying the money, but with the algorithm that tries to keep you engaged at all cost, features like autoplay enabled by default, and then more recently YT pushing tik-tok style shorts everywhere... it just doesn’t feel like a service that contributes to making my life better. Just another addiction machine :)\n\nI only go there because it (effectively) became the sole online video distribution channel, so the few creators I value only publish there. I prefer to donate a few bucks to them directly, rather than by watching YT ads or subscribing to premium."}, {"id": 50658958, "au": "rzzzt", "dom": 489, "sr": 76, "sc": 4.72, "ep": 5.38, "bs": 0.0, "d": 2, "age": 26.41, "grav": 413.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 4820, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.943, "fa": 0.0, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "Someone spoke about this in a video I've seen. YT distributes ad breaks somewhat evenly along the entire piece, taking brief pauses into account, so the speaker will not be interrupted mid-sentence. The author is free to move the locations around the timeline within reasonable limits. It's possible, but a bit tedious to create an ad-free video on the producer side because you have to remove the spots one-by-one manually, and if you don't do anything about it, viewers will get the \"default distribution\" ad experience."}, {"id": 50658636, "au": "ssl-3", "dom": 524, "sr": 77, "sc": 4.72, "ep": 5.9, "bs": 0.53, "d": 5, "age": 26.93, "grav": 427.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.6, "fa": 0.34, "gp": 0.808, "bl": 0.2, "ds": 0.0, "txt": "Oh, right.  The garden, and the confines of its walls.\n\n(I just use SmartTube on an old Chromecast box when I want big-screen, ad-free Youtube and a sofa-friendly interface.  I think I paid $30 for it several years ago, or about the price of a pizza delivered to the front door today.)"}, {"id": 50660149, "au": "Grimburger", "dom": 3, "sr": 78, "sc": 4.72, "ep": 5.36, "bs": 0.0, "d": 2, "age": 24.51, "grav": 364.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2408, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 1.418, "bl": 0.0, "ds": 0.0, "txt": "On firefox as a trusted extension this is audited by mozilla from what I know\n\nAlso it's one of the most downloaded extensions on the planet, really think they are going to be trying that and not getting noticed instantly?\n\nRaymond Hill has been an outspoken critic of all the attempts to stop adblocking but conceded with manifestv3 changes and made one that works with chrome now, think the guy has very much proven himself and would never trash his legacy like that."}, {"id": 50659788, "au": "dns_snek", "dom": 629, "sr": 79, "sc": 4.71, "ep": 6.21, "bs": 0.85, "d": 3, "age": 25.19, "grav": 381.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": ["https://chromewebstore.google.com/detail/cjpalhdlnbpafiamejdnhcphjbkeiagm"], "ig": 1.458, "fa": 0.62, "gp": 0.701, "bl": 0.32, "ds": 0.0, "txt": "That's odd, I wonder how that works? Mine is stuck at 1.73.0 - I kept it installed in a separate profile I only use for testing. Its install source leads here (404): https://chromewebstore.google.com/detail/cjpalhdlnbpafiamejd...\n\nI don't remember seeing any warnings about this after it was finally removed from the store so I thought this removal might've caught people out."}, {"id": 50661373, "au": "mkhalil", "dom": 545, "sr": 80, "sc": 4.71, "ep": 5.35, "bs": 0.0, "d": 0, "age": 21.77, "grav": 299.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 1119, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.533, "fa": 0.0, "gp": 1.206, "bl": 0.0, "ds": 0.0, "txt": "I have uBlock Origin, but I spend so many hours a week watching YouTube, including on my TV, I could not live without YT Premium. Plus, I have a family plan so my parents don't bother with them as well. Some of my dads extended form content can have like over 6 ads an hour. I can't imagine enjoying anything that way.\n\nI understand if people don't have the money, or refuse to for other reasons, but I will literally see people   buy 2 drinks at a bar without a thought, but refuse to spend that same amount for HOURS and HOURS of uncut entertainment and learning."}, {"id": 50659854, "au": "drilbo", "dom": 219, "sr": 81, "sc": 4.71, "ep": 5.34, "bs": 0.0, "d": 2, "age": 25.09, "grav": 379.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 126, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.93, "fa": 0.0, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "Recently started experiencing this displeasure again after switching phones\n\nFor your own Android device you can at least long press the YouTube app icon > 'info' dot or whatever flow gets you to 'App info' or where you typically uninstall an app. For builtin apps you instead get 'Disable', which will let youtube links instead open in your default browser\n\nIf someone else is trying to show you a youtube video with ads, you might find long pressing the most visable vein in their neck to be helpful"}, {"id": 50667563, "au": "embedding-shape", "dom": 297, "sr": 82, "sc": 4.71, "ep": 5.33, "bs": 0.0, "d": 2, "age": 7.45, "grav": 57.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 13, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.971, "fa": 0.76, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "> they are entitled to a share of my subscription fee when I view their content\n\nSo out of the 20/month or whatever the Premium subscription is, how much is one view from you worth of that? 0.0000001% or something, I suppose?\n\nI guess if you wanted to support creators, subscribing to their Patreon and buying merch probably actually have a real impact compared to whatever small percentage they're \"entitled\" to from the subscription price you pay to Google."}, {"id": 50658121, "au": "ielillo", "dom": 510, "sr": 83, "sc": 4.71, "ep": 5.27, "bs": 0.0, "d": 0, "age": 27.71, "grav": 448.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 49, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.532, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I tolerate ads as long they are quiet and consistent in their timing. I hate ads that blast through my headphones and getting an ad every time I skip portions of the video or rewind to the beginning, specially when you switch between videos and they front load you one. If youtube would put an ad consistently every x amount of time no matter if you jump through the video or open a new one, I would be happy."}, {"id": 50659007, "au": "choppaface", "dom": 437, "sr": 84, "sc": 4.71, "ep": 5.18, "bs": 0.0, "d": 1, "age": 26.33, "grav": 411.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 3611, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.734, "fa": 0.0, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Youtube keeps showing me “health” related ads that are straight up offensive.  I’ve reported them and blocked them but those functions of Google conveniently are buggy and so the ads keep coming.  I’m never going to give money to a bully that pays SWEs millions of dollars to ignore my safety because they’re too busy playing code golf with jax."}, {"id": 50659590, "au": "user43928", "dom": 135, "sr": 85, "sc": 4.71, "ep": 5.16, "bs": 0.0, "d": 2, "age": 25.49, "grav": 389.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.528, "fa": 0.34, "gp": 0.413, "bl": 0.0, "ds": 0.0, "txt": "I am seeing these Experiencing Interruptions pop-ups as the video load stalls in Brave, before it starts playing after some seconds.\n\nOnce I switched to my new Google account where I have YouTube Premium Light via the discounted Gemini subscription ($90/year or so), the videos load instantly and I no longer see that popup."}, {"id": 50669071, "au": "goodmythical", "dom": 187, "sr": 86, "sc": 4.71, "ep": 5.13, "bs": 0.0, "d": 4, "age": 5.15, "grav": 34.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.779, "fa": 0.0, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "I mean, the readmes make it pretty clear.\n\nandunieee's is \"a batteries-included YouTube player for the desktop powered by yt-dlp and mpv\" relevant to the discussion at hand.\n\nand kaiserbh's is a \"Cross-platform IPTV player written in Rust\" that has little to do with the discussion, but is potentially neat.\n\nIt is odd that the andunieee page mentions grabbing it from the AUR given that it's not actually on the AUR, but there's always flatpack, appimage, or building it from source."}, {"id": 50668180, "au": "ktosobcy", "dom": 338, "sr": 87, "sc": 4.71, "ep": 5.1, "bs": 0.0, "d": 3, "age": 6.52, "grav": 47.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1462, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.796, "fa": 0.0, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "The issue is also somewhat more convoluted (and propelled by expectation that everything has to be \"free\").\n\nIn the \"old days\" if you wanted to read a newspaper you had to go to the newsagent and buy it. Same with movies, music and whatnot.\n\nAt some point things switched that actual customers stopped being people that \"consumed\" what you provided but the ad agencies operating on the assumption that shitting ads everywhere is TheBestThing...\n\nHonestly I would love to go back to the days where you had to actual pay (market) value for the goods that you want to obtain instead of some wishy-washy fuzzy crap (ideally we would also have less junk poluting our landscape)"}, {"id": 50657752, "au": "morningsam", "dom": 599, "sr": 88, "sc": 4.71, "ep": 5.08, "bs": 0.0, "d": 0, "age": 28.29, "grav": 463.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 329, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "The true ad punisher would be an extension that automatically donates a small amount of money to PeerTube, yt-dlp, and Invidious any time YouTube plays an ad. At the end of the month, a message is sent to YouTube support informing them of the amount donated."}, {"id": 50665284, "au": "miki123211", "dom": 13, "sr": 89, "sc": 4.71, "ep": 4.98, "bs": 0.0, "d": 3, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.763, "fa": 0.0, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "An under-appreciated way in which things like that can happen, even if the author is well-meaning, is divorces and inheritance.\n\nA browser extension (or an indie iOS app, or a Mastodon instance, or a Matrix server, or whatever else you might be working on in your spare time) is a valuable asset. You can, after all, sell it to an unscrupulous third-party for $$$.\n\nSometimes, well-meaning people end up under a bus, or have a lapse in judgment when it comes to their marital choices, causing their assets to rapidly change ownership.\n\nIf you rely on something being safe to use purely because of somebody's goodwill, consider whether you also trust their current partner, all possible future partners, and all descendants / siblings to the same degree. And even if you do, consider the fact that (in some jurisdictions), a court can literally force them to sell some of their assets when there is no good way to fairly split them up, so that they can at least fairly split up the proceeds of the sale."}, {"id": 50658961, "au": "aniviacat", "dom": 230, "sr": 90, "sc": 4.71, "ep": 4.95, "bs": 0.0, "d": 1, "age": 26.41, "grav": 413.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 905, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "I would pay for YouTube Premium if Google let me create an account without providing (and verifying) a phone number.\n\nFor me, it is not the money that is the issue. The issue is that Google abuses the account for user-hostile behavior, like tracking."}, {"id": 50663817, "au": "t-writescode", "dom": 291, "sr": 91, "sc": 4.71, "ep": 4.93, "bs": 0.0, "d": 3, "age": 14.97, "grav": 163.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 6575, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.699, "fa": 0.0, "gp": 0.649, "bl": 0.0, "ds": 0.0, "txt": "Same. The most ad-like behavior[0] is YouTube regularly asking me to turn history back on and performing other dark-patterns around reduced functionality because I have history turned off.\n\nEverything else is from the video creators themselves, and SponsorBlock is good for that.\n\n[0] (not sponsored behavior which is a YouTube or movie maker’s .choice for ancillary money that Google doesn’t control; and not links to store pages below video content inside the description because that literally doesn’t impact my viewing experience; and for the channels I watch is relevant: “cool, that’s the product I wanted that was just reviewed, and I can buy it, too”)"}, {"id": 50667011, "au": "CaseFlatline", "dom": 137, "sr": 92, "sc": 4.71, "ep": 4.93, "bs": 0.0, "d": 1, "age": 8.27, "grav": 66.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 29, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.015, "fa": 0.68, "gp": 0.416, "bl": 0.0, "ds": 0.0, "txt": "I pay for two myself - one for my kids for the premium version and one I get with my annual ai pro subscription (YouTube lite) the ai pro for $200 per year with 5tb storage where I keep my backups and Gemini pro which I can share with my family members more than makes up the cost. I agree it’s worth paying for YouTube considering we are on that more than most of the streaming. It’s taught mw more towards my own research in the past few years."}, {"id": 50659070, "au": "baoooooooooooo", "dom": 309, "sr": 93, "sc": 4.71, "ep": 4.92, "bs": 0.0, "d": 1, "age": 26.23, "grav": 408.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 89, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.561, "fa": 0.68, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I was paying like $16 for it somehow (and it still felt very much worth it) and then discovered it is included in the Gemini pro plan, so now I feel like Gemini pro only cost me $4"}, {"id": 50663981, "au": "bpiroman", "dom": 538, "sr": 94, "sc": 4.71, "ep": 4.9, "bs": 0.0, "d": 0, "age": 14.53, "grav": 155.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 24, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": ["https://adfreetube.com/"], "ig": 0.823, "fa": 0.62, "gp": 0.828, "bl": 0.0, "ds": 0.0, "txt": "You can copy the YouTube URL to https://adfreetube.com/ to watch ad free. Even better, if you use the Brave browser on your phone, you can still listen when you lock your screen :)"}, {"id": 50662521, "au": "grogenaut", "dom": 595, "sr": 95, "sc": 4.71, "ep": 4.9, "bs": 0.0, "d": 0, "age": 18.53, "grav": 230.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 5776, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.471, "fa": 0.0, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "I'm going to spend my karma... the number of people in here who (reasonably) hate ads but are coming up with reasons they can't just direct pay google for what is actually a great paid product, is just insane. Look, you're not entitled to free content. Somehow youtube has made an amazing deal for families. They could do so much more to force ads down your throat, get around ad blockers, etc, and they don't. I get the people on here who can't afford it, but it's way cheaper than cable, and more watched for most many people, esp those here. I've added several of my friends to my family subscription and they all just bought it.\n\nI know a ton of you can afford it. But if you're so principaled that you won't put your phone number down but somehow think that putting your credit card in is different... well then I don't know what to say, you're principaled enough to just watch the ads or not watch youtube at all, just like I don't go to threads, insta, x, etc.\n\nburn my karma away..."}, {"id": 50659905, "au": "missedthecue", "dom": 296, "sr": 96, "sc": 4.71, "ep": 4.88, "bs": 0.0, "d": 1, "age": 24.99, "grav": 376.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 9093, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.953, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "The other reason I prefer to pay for premium is that using adblockers robs creators of revenue. But with Premium, they are entitled to a share of my subscription fee when I view their content.\n\nThe other thing is you get access to YouTube Music which in my opinion is equal to or better than Spotify which is already $13/mo. I'm surprised how many people think it's a bad value."}, {"id": 50661191, "au": "zeristor", "dom": 604, "sr": 97, "sc": 4.71, "ep": 4.85, "bs": 0.0, "d": 0, "age": 22.25, "grav": 310.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 14862, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.492, "fa": 0.0, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "But what about the sponsor reads?\n\nSome are deftly woven in, and some are a well thought and appreciated mention.\n\nMost are intrusive, I pay for my YouTube, thinking that was some way to fund them, and Google provides me with the ability to jump the sponsor section, if I can forward past it to the next point. But if I am away from the remote, or in the kitchen I can't bypass the infection.\n\nI guess I could direct my minions of Claudes to resolve this..."}, {"id": 50659085, "au": "Waterluvian", "dom": 405, "sr": 98, "sc": 4.71, "ep": 4.84, "bs": 0.0, "d": 1, "age": 26.2, "grav": 407.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 54558, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.469, "fa": 0.0, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "I paid for cable and they added ads anyways.  I paid for Prime Video and they added ads anyways. I want to support the creators but they want to control the terms and take an oversized cut of the revenue. And they'll squeeze those who obediently line up to be squozen anyways. You'll pay and they'll eventually introduce ads anyways. I choose to support the creators directly.\n\nYou do you, but I'm not a fool."}, {"id": 50657930, "au": "5555watch", "dom": 551, "sr": 99, "sc": 4.71, "ep": 4.83, "bs": 0.0, "d": 0, "age": 28.03, "grav": 456.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 151, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.345, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Is there a good solution on Safari? Whatever I've tried personally, needs at least one page refresh. E.g., first load of a video throws an error, and a refresh shows a no-ads video. It's fine, makes me watch less videos, but still would be nice to have a smoother experience."}, {"id": 50670001, "au": "dyauspitr", "dom": 614, "sr": 100, "sc": 4.71, "ep": 4.81, "bs": 0.0, "d": 0, "age": 3.89, "grav": 24.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.4, "fa": 0.34, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "Creators are going to love this. It automatically turns a single view of a video into 3x the number of ad breaks you have instead. So a single view can now become 20 views. This creates a strong incentive to include very dense advertising in your videos for creators."}, {"id": 50660470, "au": "freecodeio", "dom": 362, "sr": 101, "sc": 4.71, "ep": 4.76, "bs": 0.0, "d": 1, "age": 23.9, "grav": 350.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 499, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "as someone that uses youtube premium, I'm getting really tired of the multiple in-video sponsors, youtube engineers if you're reading this please make an auto jump option, since I know the button appears but I've never felt a need to not click it"}, {"id": 50663339, "au": "chii", "dom": 26, "sr": 102, "sc": 4.71, "ep": 4.73, "bs": 0.0, "d": 4, "age": 16.16, "grav": 184.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 3, "k": 20710, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.715, "fa": 0.0, "gp": 0.486, "bl": 0.0, "ds": 0.0, "txt": ">  complained very loudly!\n\ni was one of those people - an XUL extension i used to use is called DownThemAll, which lets you select a bunch of text, and extract the links in it to download automatically.\n\nThe old version has a lot of nice features, enabled only because it is XUL. The replacement version is a pale imitation, lobotomized down to barely able to function for my original use case."}, {"id": 50661135, "au": "Ylpertnodi", "dom": 580, "sr": 103, "sc": 4.71, "ep": 4.72, "bs": 0.0, "d": 1, "age": 22.4, "grav": 314.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 1, "k": 567, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.35, "fa": 0.34, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "> Brave\n..is, of late, turning into bloated slop.\n\nI'd rather have yt ads than have to turn off 70% of the bloat it comes with nowadays.\n\nI'm considering the paid, 'slimmed-down' version, but I'm yet to be convinced.\nThe phone version is better, though gurgles new developer/ register bs puts me off, just as much.\nDirty, shitty choices from people (tech-heads) that should know better.\n\nShould be called 'enshitelement'."}, {"id": 50658870, "au": "o_-_o", "dom": 544, "sr": 104, "sc": 4.71, "ep": 4.71, "bs": 0.0, "d": 0, "age": 26.57, "grav": 417.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 65, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.295, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "\u00231. You need to first configure your Firefox with hardened user.js\n\n\u00232. Install uBlock0 and check/update ALL lists (don't use just default).\n\nResult: No issues EVER on any website."}, {"id": 50661438, "au": "jwr", "dom": 294, "sr": 105, "sc": 4.66, "ep": 4.66, "bs": 0.0, "d": 1, "age": 21.59, "grav": 295.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 23567, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.274, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I have a family subscription to YouTube because I do not want to subject any member of my family, especially kids, to the undignified experience of being fed ads. I think the YouTube subscription ranks among my top value for money subscriptions. There is so much great niche content and you can learn so much."}, {"id": 50666376, "au": "kevinfiol", "dom": 331, "sr": 106, "sc": 4.57, "ep": 4.57, "bs": 0.0, "d": 1, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 386, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.512, "fa": 0.0, "gp": 0.7, "bl": 0.0, "ds": 0.0, "txt": "I watch YouTube in a particular way. That is, I only watch videos from channels I'm subscribed to. I build a feed of those channels using RSS, that links directly to the embed urls of each video, and watch using uBlock Origin or Newpipe for no ads. I then subscribe to the Patreons/Kofi for each channel I watch regularly. I've lived pretty guilt-free watching Youtube this way."}, {"id": 50659913, "au": "ElwoodDowd", "dom": 351, "sr": 107, "sc": 4.57, "ep": 7.08, "bs": 2.52, "d": 1, "age": 24.97, "grav": 376.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.607, "fa": 0.34, "gp": 1.612, "bl": 0.95, "ds": 0.0, "txt": "100% agree.\n\nI dislike on an ideological level that they make the experience so bad that you are pushed toward paying... but all-in-all I just don't have to worry about adblockers, can keep playing a talk on my phone while minimized, and (so we are told) a portion of our subscription amount go towards the viewers we watch, which I like.\n\nPlus I like YouTube Music fine as an alternative to Spotify, so I get to save that subscription cost too, which is a massive bonus/offset."}, {"id": 50661269, "au": "claaams", "dom": 380, "sr": 108, "sc": 4.55, "ep": 4.55, "bs": 0.0, "d": 1, "age": 22.04, "grav": 306.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 883, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.225, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "These companies harvest my data non-consensually from me constantly, they force me into absurd forced arbitration terms (read the box, you agreed to our terms) and enact sketchy dark patterns to cancel when I do decide to pay for a service (and they also rip off creators or make their platforms highly addictive). The least I can do is to make my life better by not watching ads or paying google."}, {"id": 50658430, "au": "aweiher", "dom": 602, "sr": 109, "sc": 4.54, "ep": 4.54, "bs": 0.0, "d": 0, "age": 27.24, "grav": 435.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 118, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.971, "bl": 0.0, "ds": 0.0, "txt": "I paid for YouTube for some time to support the content creators.\n\nBut then they had this genius idea to show random Shorts every time I open the app! So I canceled. Back to the browser and ad-blocker.\n\nThen I found out how to watch YouTube videos on mobile in desktop mode, so I can listen to videos when the screen is locked.\n\nI pay for Nebula now to support the creators. I'm not as shortsighted as YT."}, {"id": 50664889, "au": "8fingerlouie", "dom": 508, "sr": 110, "sc": 4.49, "ep": 4.49, "bs": 0.0, "d": 0, "age": 12.49, "grav": 123.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1762, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.465, "fa": 0.0, "gp": 0.72, "bl": 0.0, "ds": 0.0, "txt": "NextDNS recently rolled out a feature for blocking Youtube ads, which essentially just sets your DNS response to a country where monetizing YouTube is not allowed.\n\nIt works on browsers as well as various phone/tablet client apps."}, {"id": 50663253, "au": "eloisius", "dom": 112, "sr": 111, "sc": 4.47, "ep": 4.47, "bs": 0.0, "d": 2, "age": 16.4, "grav": 189.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 5949, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.63, "fa": 0.0, "gp": 0.443, "bl": 0.0, "ds": 0.0, "txt": "I always try to find an open source option when choosing from available options that do the same thing in the hopes that transparency will reduce the likelihood that I get burned. I know it's probably futile though. Just because they have the source on Github and link to that from the Firefox Addons page doesn't mean the .xpi you end stall has necessarily been built from the source you see.\n\nI'd love to see an alternative extension store that makes the source for the build you install readily available."}, {"id": 50658261, "au": "amelius", "dom": 565, "sr": 112, "sc": 4.4, "ep": 4.4, "bs": 0.0, "d": 0, "age": 27.52, "grav": 442.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.831, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Anyone else having problems playing Youtube videos in Firefox on Linux?\n\nI always _have_ to reload, otherwise my videos won't even play."}, {"id": 50660233, "au": "Marsymars", "dom": 314, "sr": 113, "sc": 4.4, "ep": 4.4, "bs": 0.0, "d": 1, "age": 24.34, "grav": 360.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 16, "k": 4203, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.653, "fa": 0.42, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "> Is $9 a month really too much if you really watch YouTube enough for ads to bother you?\n\nMy problem is that there's no threshold under which the ads don't bother me. I watch something on YouTube once every few months and find the ads intolerable."}, {"id": 50660100, "au": "desireco42", "dom": 360, "sr": 114, "sc": 4.38, "ep": 4.38, "bs": 0.0, "d": 1, "age": 24.6, "grav": 367.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 1244, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 0.74, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I had family plan for years... $27/mo, too much. Now I am using Brave and it works. I don't mind paying."}, {"id": 50662286, "au": "curiousObject", "dom": 8, "sr": 115, "sc": 4.35, "ep": 4.35, "bs": 0.0, "d": 4, "age": 19.16, "grav": 243.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 24, "k": 1032, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.035, "fa": 0.42, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": ">Jumping on this to add an additional warning: Just because an extension starts out safe does not mean it will always remain that way.\n\nThat is why you shouldn’t “jump on” to a top comment for visibility, when it is mostly unrelated to what you wanted to say.\n\nThe result, which you can see, is much confusion because some readers assume you’re attacking Ublock, the subject of the comment you directly replied to. Obviously this is not what you meant.\n\nYou have a new idea, so post a new top-level comment instead."}, {"id": 50659808, "au": "Doohickey-d", "dom": 24, "sr": 116, "sc": 4.35, "ep": 4.35, "bs": 0.0, "d": 3, "age": 25.15, "grav": 380.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 686, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 1.21, "bl": 0.0, "ds": 0.0, "txt": "Well, about a decade ago, Firefox switched from the old XUL extension model, to the current one, which is already drastically more safe. And people complained very loudly! You cannot make everyone happy, there will always be those who want a more powerful extension system, and those who want more safety/permissions/review.\n\nSo we now have some intermediate solution."}, {"id": 50662236, "au": "npteljes", "dom": 613, "sr": 117, "sc": 4.3, "ep": 4.3, "bs": 0.0, "d": 0, "age": 19.32, "grav": 246.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "Great, so with this addon, the playback breaks randomly. I think the one getting punished is the user.\n\nPersonally, I pay for the service that I use. The service I get is awesome. Youtube's ads are nonexistent, and there is Youtube Music too, so I don't need Spotify or whatever. I pay for the family package myself and I also invited me and my partner's parents, who are loving it as well."}, {"id": 50663368, "au": "mopsi", "dom": 436, "sr": 118, "sc": 4.26, "ep": 5.11, "bs": 0.85, "d": 3, "age": 16.09, "grav": 183.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3167, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.8, "fa": 0.0, "gp": 0.608, "bl": 0.32, "ds": 0.0, "txt": "Unfortunately it's inferior in every way except for its native integration. Doesn't automatically skip, doesn't differentiate between segment types, isn't manually tagged but derived from viewer behavior. It just lets you jump to the next point that other viewers usually fast-forward to.\n\nThe feature does not work at all for common use cases like leaving a playlist of music videos playing without interruptions."}, {"id": 50666677, "au": "TomGarden", "dom": 492, "sr": 119, "sc": 4.24, "ep": 4.24, "bs": 0.0, "d": 1, "age": 8.81, "grav": 72.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 461, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "This is definitely not true. The only thing close to serving this amount of ads is american football.\n\nYouTube runs your typical 'how many ads can we run on this user without them abandoning the watch session' analysis, it would not be a popular platform if 60s was true"}, {"id": 50661131, "au": "kevincox", "dom": 122, "sr": 120, "sc": 4.19, "ep": 4.19, "bs": 0.0, "d": 2, "age": 22.41, "grav": 314.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 15260, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.624, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "The fake buffering doesn't bother me much. I'd much much prefer a quiet wait than blaring garbage trying to sell me something. Plus my existing workflow has always been to open a bunch of tabs from my RSS reader then watch in order. Opening the video in the background tab is enough to run out the timer so that cuts down further how often I get the ad-delay."}, {"id": 50664359, "au": "sakopov", "dom": 598, "sr": 121, "sc": 4.18, "ep": 4.18, "bs": 0.0, "d": 0, "age": 13.7, "grav": 142.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 4016, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.327, "fa": 0.0, "gp": 0.735, "bl": 0.0, "ds": 0.0, "txt": "Has anyone tried cancelling their YouTube premium sub? The ads for the next few days are absolutely ruthless. They're minutes long, unskippable and significantly more frequent until it goes back to normal pacing. Google really tries to punish you for cancelling."}, {"id": 50662907, "au": "skiing_crawling", "dom": 509, "sr": 122, "sc": 4.17, "ep": 4.17, "bs": 0.0, "d": 0, "age": 17.38, "grav": 207.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 322, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.239, "fa": 0.0, "gp": 0.869, "bl": 0.0, "ds": 0.0, "txt": "I've been paying for youtube for a couple years now and its been worth it. Unlike TV streaming services which are heavily fragmented, it is still basically the only site where people upload their videos so you only need the 1 subscription. Although the price has been ratcheted up quite a lot in the last few years, I'm usually surprised when I see the notification."}, {"id": 50671500, "au": "NetMageSCW", "dom": 125, "sr": 123, "sc": 4.17, "ep": 4.17, "bs": 0.0, "d": 4, "age": 1.43, "grav": 9.2, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1191, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.948, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I only view Youtube on AppleTV but I find waiting long enough (about 3 seconds) before going back generally works. For 5 seconds or so I just wait for the skip."}, {"id": 50660786, "au": "aucisson_masque", "dom": 390, "sr": 124, "sc": 4.16, "ep": 4.16, "bs": 0.0, "d": 1, "age": 23.31, "grav": 335.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 5, "k": 2214, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.831, "fa": 0.42, "gp": 0.694, "bl": 0.0, "ds": 0.0, "txt": "> Is $9 a month really too much\n\nWhen you can have something for free, yes I’d argue it’s too much.\n\nYouTube also has some pretty big issues where it gets people addicted to it, with its algorithm and now the shorts.\n\nLastly, and that part is really personal opinion, I hate Google, what they are, what they do. If I can make them spend money, I sure will.\n\nOn that part AdNauseam is a god send."}, {"id": 50659994, "au": "adamtaylor_13", "dom": 557, "sr": 125, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 0, "age": 24.81, "grav": 372.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1276, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.053, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Wild to know this isn't just a fluke. I've been doing this for years. In fact the double-reload is ingrained in my brain. But I assumed it had to do with uBlock origin or my PiHole and not the actual ad server. Super interesting."}, {"id": 50659491, "au": "stanac", "dom": 130, "sr": 126, "sc": 4.11, "ep": 4.11, "bs": 0.0, "d": 2, "age": 25.64, "grav": 393.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 3, "k": 650, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.624, "bl": 0.0, "ds": 0.0, "txt": "> \"Experiencing Interruptions?\" popups\n\nI use custom filter for that. It was annoying.\n\nwww.youtube.com\u0023\u0023.snackbarViewModelEngagementBarWrapper\n\nedit: it's possible that this filter is blocking some useful messages, like \"Queue cleared\" or other toast messages, I don't mind if it does."}, {"id": 50658070, "au": "solarpunk_enthu", "dom": 607, "sr": 127, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 0, "age": 27.81, "grav": 450.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 169, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.917, "bl": 0.0, "ds": 0.0, "txt": "I am using Brave browser + VPN traffic adblock filter.\n\nI forgot what the ads are. Occasionally I get terrified when I see someone browsing raw chrome"}, {"id": 50658650, "au": "trilogic", "dom": 603, "sr": 128, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 0, "age": 26.91, "grav": 426.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 197, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.114, "fa": 0.0, "gp": 0.991, "bl": 0.0, "ds": 0.0, "txt": "How about using other platforms, don´t be a beggar!\n\nThe best way to punish ads is not using their platform, simple. How they support their platform is not users problem. Ads are hateful, platform who use ads are primitive."}, {"id": 50659184, "au": "stevage", "dom": 301, "sr": 129, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 1, "age": 26.05, "grav": 403.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 6733, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.67, "fa": 0.28, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Two reasons I don't have Premium:\n\n1. I actively do not want Google to have any more money.\n\n2. I'd probably watch even more YouTube than I already do. Ads being annoying is a helpful brake."}, {"id": 50661341, "au": "loloquwowndueo", "dom": 179, "sr": 130, "sc": 3.97, "ep": 3.97, "bs": 0.0, "d": 2, "age": 21.84, "grav": 301.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 6955, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.241, "fa": 0.34, "gp": 0.061, "bl": 0.0, "ds": 0.0, "txt": "Lolwut the percentage of people who give a crap and use ad blockers is minimal. YouTube caters to the rest. Or to put it another way, what 99% of people watch on YouTube is indistinguishable from ad garbage anyway, so what’s 15 more seconds of the same every once in a while to them. No my dude, YouTube is perfectly safe."}, {"id": 50659347, "au": "apparent", "dom": 136, "sr": 131, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 1, "age": 25.83, "grav": 398.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2078, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.32, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "I've not seen ads in Brave, except when traveling outside the US. It seems that YouTube knows how to circumvent adblockers, but they only do so in certain markets. Some day, perhaps when there's a dire need for more revenue, the hammer will drop."}, {"id": 50666377, "au": "smj-edison", "dom": 491, "sr": 132, "sc": 3.95, "ep": 3.95, "bs": 0.0, "d": 1, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 885, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.148, "fa": 0.0, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "I used to get an ad like three to four times a video which was reasonable, but in the past couple weeks it's been insane. I've resorted to watching YouTube on my phone in Firefox because otherwise the ads are exactly this frequent."}, {"id": 50670583, "au": "ktosobcy", "dom": 340, "sr": 133, "sc": 3.95, "ep": 5.64, "bs": 1.7, "d": 5, "age": 3.02, "grav": 18.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1462, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.911, "fa": 0.0, "gp": 0.796, "bl": 0.64, "ds": 0.0, "txt": "Hmm... possibly true, but than again is it really equal if people are basically forced to use ad-based medium via price gauging?\n\nAnd don't pretend those services are \"free\" in fairness.\n\nIMHO with wider actual paid-content (without pseudo \"free\" one) it could drive prices down. Right now the ad-brokers state that \"this ad works\" (because it was shown/clicked/whatnot) but IMHO it's more murky and the middleman is itsy-bitsy messing up with the numbers…\n\n(also: rich people usually can afford to send their kids to private schools and limit smartphone usage so there's that)("}, {"id": 50658893, "au": "bemtevi", "dom": 481, "sr": 134, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 2, "age": 26.52, "grav": 416.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 31, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.057, "fa": 0.42, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "> 1. Reasonably? Really? Even the bigger ones are presenting how little they make vs the time it takes. Plus being pushed/forced to make shorts when they make great long form content.\n\nYouTuber here. It's of course arguable that they don't pay well, but it's not bad. I'm not a big YouTuber either and under 10K subscribers. But I make enough per month to pay some bills and buy some food. I'm not rich at all, rather poor in fact, and without my YouTube income my money situation would be much tighter."}, {"id": 50658057, "au": "miladyincontrol", "dom": 165, "sr": 135, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 1, "age": 27.83, "grav": 451.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 561, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": "Similar, although I mostly watch on Freetube on desktop.\nSponsorBlock's sibling extension DeArrow is also critical imo, declickbaiting the platform really does wonders for usability."}, {"id": 50660406, "au": "xp84", "dom": 324, "sr": 136, "sc": 3.93, "ep": 3.93, "bs": 0.0, "d": 3, "age": 24.02, "grav": 352.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 10058, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.146, "fa": 0.34, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "That shouldn’t tick you off. The price of everything is set by supply and demand. There would be zero demand in India or Turkey for a AU$17.00 video streaming site so it has to be different. And pricing it so low in the West would be leaving tons of money on the table. The shareholders (represented by the board) would legitimately have a case to fire the CEO, because they would make way less money that way."}, {"id": 50658846, "au": "xandrius", "dom": 476, "sr": 137, "sc": 3.92, "ep": 3.92, "bs": 0.0, "d": 1, "age": 26.61, "grav": 418.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 3521, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.092, "fa": 0.28, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "1. Reasonably? Really? Even the bigger ones are presenting how little they make vs the time it takes. Plus being pushed/forced to make shorts when they make great long form content.\n\n2. You can use Revanced and get all those.\n\n3. Same for YT Music, you can use revanced on android\n\nPlus Google is evil and ruins everything it touches."}, {"id": 50664923, "au": "OroPla", "dom": 273, "sr": 138, "sc": 3.92, "ep": 3.92, "bs": 0.0, "d": 5, "age": 12.42, "grav": 122.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 496, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.444, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Users did this because Youtube was free. You could upload for free and watch for free. There were no annoying ads and the interface wasn't designed to manipulate you into wasting time.\n\nYoutube was bleeding money doing this to capture not only an audience, but also creators that filled their platform. Now they've started to squeeze, but people cannot leave, because of the lock-in. No one else has all the millions of videos already on Youtube and nobody is allowed to just copy everything over, either.\n\nAt this point Youtube should become nationalized and financed the same way libraries are."}, {"id": 50671880, "au": "akoboldfrying", "dom": 498, "sr": 139, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 1, "age": 0.71, "grav": 6.0, "surf": 74.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2090, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.237, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is absolutely untrue in my experience. I have no ad blockers, and YouTube tends to show me 0-2 ad breaks per video, each with 2 ads that are skippable after 6s. I mostly watch videos between 10 minutes and an hour long."}, {"id": 50659232, "au": "jmpeax", "dom": 511, "sr": 140, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 1, "age": 26.0, "grav": 402.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 483, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.628, "fa": 0.0, "gp": 0.02, "bl": 0.0, "ds": 0.0, "txt": "I watch via TV and mute everytime ads come on because I can't stand loud obnoxious ads. The worst offenders are the ones that start by unscrupulously getting your attention with a door bell, tapping a glass, or someone shouting \"hey!\" or \"hello!\"."}, {"id": 50657728, "au": "Alifatisk", "dom": 487, "sr": 141, "sc": 3.84, "ep": 3.84, "bs": 0.0, "d": 0, "age": 28.32, "grav": 464.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 19, "k": 6767, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.586, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "> YouTube serves an ad roughly every 60 seconds. You can't watch one minute of content without being interrupted by a commercial.\n\nIf this is true, then that's insane. I am unaware of this because I use uBlock Origin + Sponsorblock on Zen (FireFox)."}, {"id": 50662586, "au": "hk1337", "dom": 161, "sr": 142, "sc": 3.84, "ep": 3.84, "bs": 0.0, "d": 1, "age": 18.36, "grav": 226.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1257, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 0.975, "fa": 0.34, "gp": 0.398, "bl": 0.0, "ds": 0.0, "txt": "I’d be curious to see your uBlock origin rules then. I’ve started downloading YouTube videos and putting them in jellyfin otherwise I’m watching 5 minutes of video then it cuts off to an ad."}, { iltering (using official APIs). And I like supporting a solo indie dev."}, {"id": 50660557, "au": "dizhn", "dom": 148, "sr": 149, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 4, "age": 23.72, "grav": 345.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2167, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.752, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"We excluded websites that redirected users, used ad-blocking prevention mechanisms, or were inaccessible. The final list for our main sample represents 114 popular, ad-supported websites across 10 countries.\"\n\nWhat a nice clean sample innit.\n\nThe study is also from Dec 2023."}, {"id": 50662999, "au": "qwerpy", "dom": 345, "sr": 150, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 3, "age": 17.11, "grav": 202.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 1348, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "You’re awfully comfortable telling people what they should or shouldn’t be doing. Some people just cannot stand ads and are happy to spend whatever time it takes to eradicate them, even if it’s not “worth it” from a time perspective. I will go to extreme lengths to do this for sites or services I don’t even use much. It’s the principle of it. It’s very satisfying to fix a broken experience that some company is trying to force on me."}, {"id": 50663561, "au": "realusername", "dom": 359, "sr": 151, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 1, "age": 15.61, "grav": 174.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 8, "k": 9140, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 0.488, "fa": 0.34, "gp": 1.088, "bl": 0.0, "ds": 0.0, "txt": "> YouTube Premium is absolutely worth the asking price\n\nWhy is it priced 10x higher than the amount of money they get per user with ads though?"}, {"id": 50667185, "au": "noitpmeder", "dom": 171, "sr": 152, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 2, "age": 8.02, "grav": 63.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1536, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.52, "fa": 0.0, "gp": 0.041, "bl": 0.0, "ds": 0.0, "txt": "Because it's not just ads, I can skip every single \"Remember to like and subscribe!\" interaction prompting, self promotion, paid promotion, ...\n\nAlso, I have a feeling the video creator is getting paid anyway, regardless if some minuscule fraction of users are skipping select sections of the video."}, {"id": 50662085, "au": "quasarj", "dom": 332, "sr": 153, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 1, "age": 19.71, "grav": 254.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 604, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.81, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "On the contrary, I watch it infrequently and blocking the ads lets me watch it at all. I'd just close the tab if I had to sit through an ad. Ew."}, {"id": 50660953, "au": "aleksandrm", "dom": 561, "sr": 154, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 0, "age": 22.91, "grav": 326.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 282, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 0.811, "fa": 0.0, "gp": 1.137, "bl": 0.0, "ds": 0.0, "txt": "There are millions of YouTube ad blocking extensions, how is this one different that it ends up being featured on an HN front page?"}, {"id": 50658078, "au": "zeeveener", "dom": 533, "sr": 155, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 2, "age": 27.8, "grav": 450.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 108, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.077, "fa": 0.28, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "Not sure if this is a new thing or if they're just accounting for In Video Sponsorships in their legalese, but I pay for Premium and I have never been presented with an ad while subscribed.\n\nI know my subscription has lapsed when the tsunami of ads hits. It's remarkably stark in contrast."}, {"id": 50663946, "au": "DavideNL", "dom": 53, "sr": 156, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 5, "age": 14.61, "grav": 157.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 3513, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Mild?\n\nI quote: \"where he re-iterated his anti-abortion position in the cases of rape and incest\"\n\nI do not classify supporting/stating \"Refusing abortion when women are raped\" as mild.\n\nAlso: \"he argued that a “genetic disposition to homosexuality” was not “okay\""}, {"id": 50659926, "au": "TeMPOraL", "dom": 522, "sr": 157, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 4, "age": 24.94, "grav": 375.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.441, "fa": 0.0, "gp": 0.101, "bl": 0.0, "ds": 0.0, "txt": "For me, Firefox on Android hits all the boxes except supporting keyboard shortcuts, and it's apparently a technical limitation of their codebase that's so bad they can't implement it, can't make it possible for extensions to implement it, and somehow even make it hard to hack it in with accessibility services and ADB. I know, I tried.\n\nSo that's the single reason why I use something other than Firefox on my phone, because my phone has otherwise replaced my personal laptop already (foldable, with small LG Bluetooth keyboard and a foldable mouse for when I need to do some more intense work on-the-go).\n\nSounds trivial, but couple times that CTRL+L and CTRL+T did not work, was enough for me to install a Chrome-based browser."}, {"id": 50661185, "au": "Ylpertnodi", "dom": 585, "sr": 158, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 1, "age": 22.27, "grav": 311.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 567, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.5, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What you consider unethical ads, many others do, too.\nThat's why all ads are blocked dor many people.\nI tried ads for a while, but try finding Steve Hilllage's Rainbow Dome Musick.\nAnd have a fucking Barilla Pasta ad whack you 1/3 of the way through.\nSorry, you are not owed a living by me."}, {"id": 50668751, "au": "account42", "dom": 35, "sr": 159, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 3, "age": 5.63, "grav": 38.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 11222, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.471, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "The problem is not with the security model that restricts what extension can do but with the update model that is essentially a RCE backdoor to your computer provded to the author of every extension you install. What we need is a Linux distribution model instead of every dev pushing directly to users."}, {"id": 50659248, "au": "squeegeeninja", "dom": 597, "sr": 160, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 0, "age": 25.98, "grav": 402.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 91, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 0.79, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I'm surprised nobody seems to be pointing out the LLM-amplified grandiosity in this project (and the harness used to build it). Things like quoting the author in their own readme as if it was a spark of divine inspiration. Adding a kind of cosmology on top, not supported by the actual codebase underneath. This pattern seems to be emerging more and more as fully LLM-generated codebases become accessible."}, {"id": 50658596, "au": "goodmythical", "dom": 494, "sr": 161, "sc": 3.51, "ep": 6.56, "bs": 3.05, "d": 1, "age": 27.0, "grav": 429.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 231, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.816, "fa": 0.0, "gp": 1.581, "bl": 1.15, "ds": 0.0, "txt": "I don't know if it's exactly true, but I've got a roomate that rawdogs youtube all day and I can't survive without earphones because I firmly believe that the total runtime of ads they sit their and watch is longer than the runtime of any of the content they watch.\n\nThere are often minutes long ads, the video \"fails\" to load, followed by another minute ad, and then the video, and if the video is long enough it may even have ad breaks within it.\n\nThe same is true for my other roomate's facebook browsing, but there at least you could simply scroll past, except this roommate likes to click on the ads \"because I want to see what the solution to problem X they're offering\" and is then upset when the ad ends with \"visit our site to learn more\" without actually explaining/demoing the product\" to the point where they ask me how come none of the ads ever have the actual product in it and I just sigh and explain that if they can get you to watch a five minute ad they can be relatively more certain of you clicking through to the site and purchasing for the nth time.\n\nI sometimes wonder how it is that ad companies believe they can get away with their bullshit, but then I remember that they are targetting the average user and the average user is...average...at best."}, {"id": 50665099, "au": "ajb", "dom": 286, "sr": 162, "sc": 3.5, "ep": 3.5, "bs": 0.0, "d": 4, "age": 12.03, "grav": 116.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 8865, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.396, "fa": 0.0, "gp": 0.151, "bl": 0.0, "ds": 0.0, "txt": "They aren't a monopoly, but they are a gatekeeper. Because you don't really consume \"YouTube\", you consume the content of various creators (except for purely passive consumption). These other sources are not substitutes because they don't offer the same creators. Historically publishers and distributors were different, creators were signed to a specific publisher (recording studio, movie studio, book publisher etc) but those publishers used as many distribution channels as possible, exclusives were rare. So distributors couldn't exercise much leverage over the public. But YouTube is both."}, {"id": 50660130, "au": "hannasanarion", "dom": 245, "sr": 163, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 3, "age": 24.54, "grav": 365.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 4695, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.424, "fa": 0.0, "gp": 0.101, "bl": 0.0, "ds": 0.0, "txt": "Phone numbers are not just for 2FA. I don't think I've ever seen Google allow SMS-based 2FA for that matter, only email, authenticator apps, or the authenticator built into android. Phone numbers are required information for shipments and payments: Credit card processors won't handle a digital transaction without a phone number, if you want to pay someone online, the card processor usually needs your phone number just as much as it needs your billing zip code."}, {"id": 50660564, "au": "danaris", "dom": 279, "sr": 164, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 3, "age": 23.71, "grav": 345.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 6982, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It's only weird if you use an extremely naïve or restrictive definition of \"monopoly\".\n\nYouTube has disproportionate power due to their market dominance. That's why they can just do whatever they choose, and even egregious changes will only drive away very, very few viewers, because YouTube is the only platform on which they can watch the content they're interested in."}, {"id": 50660668, "au": "DocJade", "dom": 479, "sr": 165, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 4, "age": 23.54, "grav": 341.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 83, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.483, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I make videos on Factorio and the occasional other weird video (wrote
