ve.\n\nAnd it’s exacerbated by the overall terrible quality and infinite repetitiveness of the ads.\n\nIf there was any real competition, we could vote with our feet. But YouTube is effectively a monopoly, close to forcing us to consume inordinate amounts of low quality ads just to get a small amount of actual video content.\n\n[1] https://www.rijksoverheid.nl/themas/overheid-en-democratie/m..."}, {"id": 50671655, "au": "jldugger", "dom": 228, "sr": 4, "sc": 10.47, "ep": 10.77, "bs": 0.0, "d": 2, "age": 1.11, "grav": 7.7, "surf": 6.8, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 83, "qw": 13, "k": 7914, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": ["https://nebula.tv/", "https://www.clockwisetv.com/"], "ig": 1.597, "fa": 1.99, "gp": 0.926, "bl": 0.0, "ds": 0.0, "txt": "> It’s $15 a month in Australia\n\nWell, 9 USD trades for 13.54 AUD lately so that tracks. But ... I have an annual plan for $139.99, so IDK where that $9 figure came from.\n\n> That’s simply outside mine and most other Australian’s budgets.\n\nIn 2021 OECD estimates for median household disposable income put Australia at 42,940 USD-PPP, versus US's 59,037. That puts them in 6th place in the league table, so the appeal to poverty seems a bit misplaced.\n\nBut somehow I kinda doubt it's the money that's the real issue. Like, if you pair up Nebula[1] and ClockWise[2], that's 13 bucks a month for ad free streaming, and nobody's protesting.\n\n[1]: https://nebula.tv/\n[2]: https://www.clockwisetv.com/"}, {"id": 50662722, "au": "YoshiRulz", "dom": 456, "sr": 5, "sc": 9.48, "ep": 9.92, "bs": 0.0, "d": 1, "age": 18.0, "grav": 219.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 140, "qw": 0, "k": 242, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": ["https://support.google.com/youtube/answer/72902?hl=en&ref_topic=9257988\u0023zippy=%2Cwhats-my-revenue-share", "https://consumerrights.wiki/w/YouTube\u0023Demonetization_and_censorship_(2016_-_Present)", "https://consumerrights.wiki/w/YouTube\u0023Universal_DRM_testing_and_violation_of_Creative_Commons_licenses_(March_2025)"], "ig": 1.914, "fa": 1.57, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "I pay for Nebula (or used to; I upgraded to the lifetime subscription for something like 6 years' fees in advance). Before Netflix enshittified, I was paying for that.\n\nI will never pay for a subscription service which siphons most of that money away from its content creators[1] and disrespects them at every turn,[2]\nthen disrespects its (paying) viewers by serving them ads and collecting \"analytics\" data to be sold off,[3] and placing arbitrary restrictions on how they watch the content they've paid for.[4]\n\nThe \"penny-pinching pirate\" idea was put to rest over a decade ago when Spotify Premium got big. Why do you still believe it?\n\n[1]: They (claim to) take 45% of ad placement sales, so not including revenue from selling trends/user data. I can't believe some sibling comments are calling that a reasonable rate when sentiment is broadly against the 30% cut that Apple or Steam take. https://support.google.com/youtube/answer/72902?hl=en&ref_to...\n\n[2]: https://consumerrights.wiki/w/YouTube\u0023Demonetization_and_cen... and https://consumerrights.wiki/w/YouTube\u0023Universal_DRM_testing_... and https://consumerrights.wiki/w/YouTube\u0023AI_filtering_without_c... and https://consumerrights.wiki/w/YouTube\u0023Wave_of_channel_termin... to name but 4 ways. Apparently they also scammed some record labels and other traditional media, impressive: https://en.wikipedia.org/wiki/YouTube_Premium\u0023Licensing_t"}, {"id": 50658786, "au": "andrewl-hn", "dom": 575, "sr": 6, "sc": 9.05, "ep": 9.05, "bs": 0.0, "d": 1, "age": 26.67, "grav": 420.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 5, "k": 1890, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.553, "fa": 1.32, "gp": 1.132, "bl": 0.0, "ds": 0.0, "txt": "> This is absolutely not true.\n\nThe number of ads depends on location and inventory. If I watch YT without a blocker in my area in summer I get about two ads per 10 minutes. But in December? Every local restaurant decides they want people to celebrate Christmas with them so it's 5 ads every 7-8 minutes.\n\nWhen I'm in a large city I get more ads, too."}, {"id": 50659996, "au": "PostOnce", "dom": 371, "sr": 7, "sc": 8.66, "ep": 9.11, "bs": 0.0, "d": 1, "age": 24.81, "grav": 372.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 9025, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.842, "fa": 0.34, "gp": 2.626, "bl": 0.0, "ds": 0.0, "txt": "YouTube's business model is wasting peoples' time. The more of of someone's, or some kid's time they waste, the more money they make.\n\nThey default to suggesting things like MrBeast that you can't possibly learn anything from, where there is no artistry to appreciate and the algorithm by design suggests the most time-wasting possible crap you can imagine, like two hands opening kinder surprise eggs for 3 hours to keep a 3 year old glued to a screen.\n\nThey watch YouTube in schools now and they don't have subscriptions or adblockers at those schools. YouTube should be giving away YouTube subscriptions to schools as an apology for all the other harm they've done in pursuit of profit.\n\nThe only thing we owe YouTube is a metaphorical knife in the back for their greed and malice.\n\nIf adblockers hurt YouTube, good.\n\nSame for the rest of the algorithmic internet."}, {"id": 50663740, "au": "greggsy", "dom": 221, "sr": 8, "sc": 8.3, "ep": 8.74, "bs": 0.0, "d": 1, "age": 15.16, "grav": 166.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 2365, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.572, "fa": 0.68, "gp": 2.144, "bl": 0.0, "ds": 0.0, "txt": "It’s $15 a month in Australia, and $30 a month if I want to spare my children from it too. That’s simply outside mine and most other Australian’s budgets.\n\nThe ads here are literally just gambling, alcohol and ai slopshippers. TV advertisements used to be pretty relevant to your average Australian.\n\nAs soon as I see certain categories of advertisements I’ll just close the tab and do something else.\n\nIt’s truly horrendous."}, {"id": 50662047, "au": "CMay", "dom": 635, "sr": 9, "sc": 7.77, "ep": 7.77, "bs": 0.0, "d": 0, "age": 19.86, "grav": 257.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 234, "qw": 0, "k": 561, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.837, "fa": 0.95, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "I like YouTube and I actually like ads, but YouTube ads have trained me to skip them immediately no matter what the ad is.\n\n80% of the time it's some AI generated ad, so immediately you can't trust it and simply skip.  Supposedly they are trying to fight back against the AI ads, but none of the other platforms seem to have an issue showing real ads.\n\nSometimes an ad will be 15 minutes, 45 minutes or an hour long, so trust is completely broken that you could simply play a video and listen to it in the background while you're cooking or doing whatever.  Now you will always be aware from that moment on that you have to be ready to skip and waste your attention on it.  If there was any other comparable video platform that had the same breadth of content, then people could do the free market thing and switch requiring YouTube to compete.\n\nThey need to create some normalized expectation around ad lengths and do a better job of displaying the timing until your video continues.  The big streaming platforms all have pretty traditional approaches to ads and it's fine.  YouTube needs to fire the sociopaths who are persisting this approach.\n\nMy favorite ads are the unskippable ones, not just because they are usually short, but because you know your video will continue without intervention.  There is no unknown length video taking over your session."}, {"id": 50658921, "au": "wilkystyle", "dom": 2, "sr": 10, "sc": 7.63, "ep": 7.78, "bs": 0.0, "d": 1, "age": 26.48, "grav": 415.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 1773, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.962, "fa": 0.34, "gp": 1.516, "bl": 0.0, "ds": 0.0, "txt": "Jumping on this to add an additional warning: Just because an extension starts out safe does not mean it will always remain that way. This has been mentioned numerous times before on hacker news, but maintainers of any mildly to moderately popular browser extension are routinely offered tantalizingly high sums of money to either sell the extension to a less scrupulous third-party or to add data collection code for said third-party.\n\nYou are never 100% safe, but dramatically limiting the scope of what you trust is a great step in the right direction. I use two and only two browser extensions (uBlock Origin and Bitwarden) everywhere I go, and I have zero issues with ads on YouTube (or anywhere else, really).\n\nEdit: I should also clarify that I am not speaking negative of this particular extension at all, nor the work that has gone into it."}, {"id": 50665426, "au": "jillesvangurp", "dom": 457, "sr": 11, "sc": 7.54, "ep": 7.54, "bs": 0.0, "d": 0, "age": 11.24, "grav": 104.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 265, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.981, "fa": 0.34, "gp": 1.32, "bl": 0.0, "ds": 0.0, "txt": "Firefox + ublock origin works fine. And not just on Youtube, I use it with Amazon prime as well. I have that for package deliveries and you get the video subscription included. I've not opted to pay them extra for ad free video delivery because it seems ublock origin just removes the ads for me. So, no need. They have a decent movie selection and the occasional series I enjoy watching.\n\nIt seems people are conflicted between wanting to use Chrome (made by Google) while not wanting to see ads, the distribution of which is Google's core business and main source of income. While trying to work around all the clever ways that Google is coming up with to ensure ad blockers/removers don't work on Chrome.\n\nYoutube works just fine on other browsers. There are three mainstream alternative browser engines at this point: Firefox, Safari, and Ladybird. Of those, Firefox is so far the easiest to configure to your liking when it comes to ad blocking and a 100% ad free experience on Youtube. I'm sure Ladybird will catch up rapidly as well. The more people use alternatives, the more Google and others will be forced to deal with minimizing how obnoxious and disruptive they allow ads to be.\n\nMS lost the browser market to Firefox and later Chrome because it didn't do that. Google can lose that market just as easily. Internet Explorer once seemed to be too big to imagine it would ever go away. And"}, {"id": 50658552, "au": "jonplackett", "dom": 459, "sr": 12, "sc": 7.38, "ep": 7.38, "bs": 0.0, "d": 0, "age": 27.09, "grav": 431.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 12217, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.437, "fa": 0.28, "gp": 2.211, "bl": 0.0, "ds": 0.0, "txt": "I’m all for ad blockers in most places but I have completely caved in on YouTube.\n\nMy reasons are\n\n1. YouTube seems to pay creators reasonably\n\n2. Being able to use the YT app without the crippling of things like background playback and downloads is very useful.\n\n3. YouTube seems get YouTube music free, so cancelled Spotify with more or less paid for it.\n\nI know I’ve given in. And I accept it"}, {"id": 50663558, "au": "wafflemaker", "dom": 425, "sr": 13, "sc": 7.15, "ep": 7.81, "bs": 0.0, "d": 1, "age": 15.62, "grav": 174.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 908, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.847, "fa": 0.68, "gp": 1.057, "bl": 0.0, "ds": 0.0, "txt": "You might not notice it, because it doesn't happen in your country or to people with your views, but Google does a lot of censorship (in various forms). It denies doing it and it's fairly easy to prove.\n\nI just don't believe I should pay almost three times what Spotify costs (and I don't buy Spotify, for other moral reasons) to a company that does propaganda and mass manipulation (that's what the chilling effect of punishment's is - you avoid wrongspeek and just don't say what you mean). It's not money to support servers, it doesn't cost $15 per month to stream even 10x what I watch. It's money for shareholders of an evil company.\n\nSorry, but you're either part of the solution, or part of the problem. If you get intimidated to support them because of ad fatigue - I feel sorry for you. But you don't get to shame me and imply moral superiority, because I don't want to support a company that fights freedom of speech or bans and punishes people for wrongspeek by overeagerly trying to please the current American administration."}, {"id": 50663665, "au": "licensedvideos", "dom": 379, "sr": 14, "sc": 7.04, "ep": 10.22, "bs": 2.52, "d": 1, "age": 15.34, "grav": 170.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 227, "qw": 9, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.94, "fa": 1.1, "gp": 1.739, "bl": 0.95, "ds": 0.0, "txt": "Weird that no one is pointing out the obvious. Well, the second most obvious, plenty of people ave pointed out premium does NOT remove all ads. But refocusing:\n\n> Bigger than Disney\n\nDisney serves licensed content.\n\n> Bigger than HBO\n\nHBO serves licensed content.\n\n> Bigger than Netflix\n\nNetflix serves licensed content.\n\nYoutube serves primarily homebrew content, otherwise from channels. It's a network service. They're NOT paying for the content they serve. The service they provide was never one of access to content that individuals have no other way to get access to, there is no youtube branding to the content. They're slapping ads on top of what's essentially a file hosting service.\n\nAnd that's fine, I pay for that.\n\nBut they are extremely adversarial to that purpose. Every 3 years they \"\"\"accidentally\"\"\" murder the subscription and history boxes. They heavily mess with your feeds and hide things you know exist. They forcefeed shorts garbage on you. The things I am paying for, undisturbed access to the content, simply do not translate from the monetary value because Youtube really, really, really wants to waste your time and attention.\n\nWhich is a fucking move full of gall for someone not even buying any rights to the content. Why do they get to decide to do it this way?\n\nOh right, monopoly.\n\nThey go to youtube in spite of youtube. If youtube didn't exist, uploaders would go e"}, {"id": 50667582, "au": "rpigab", "dom": 14, "sr": 15, "sc": 6.96, "ep": 7.25, "bs": 0.0, "d": 4, "age": 7.42, "grav": 56.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 79, "qw": 0, "k": 1396, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": ["https://web.localsend.org/"], "ig": 1.444, "fa": 0.9, "gp": 0.893, "bl": 0.0, "ds": 0.0, "txt": "Like sharedrop.io, the static html file that uses WebRTC on browsers to share files P2P, typically two devices on the same router, a phone and a desktop PC for instance.\n\nNow it's ShareDrop (by Limewire), you expect it to work the same as before, static html service with your files never leaving towards WAN, but no, into Limewire cloud it goes...\n\nThe code source is still available, but the website serves a different purpose.\n\nNow the right alternative seems to be https://web.localsend.org/"}, {"id": 50661250, "au": "nurumaik", "dom": 615, "sr": 16, "sc": 6.91, "ep": 6.91, "bs": 0.0, "d": 0, "age": 22.1, "grav": 307.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 483, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.931, "fa": 0.28, "gp": 1.085, "bl": 0.0, "ds": 0.0, "txt": "Signal to noise ratio of this slop README is so bad that I don't even get what's the point of having it at all. Better just leave it as code so I can ask my own llm to explain how it works\n\nFor example, what's the point of this table? Did the author even read it?\n\n  | Tool | How it works | Reloads? | Collects data? |\n  |---|---|---|---|\n  | **uBlock Origin** | Blocks ad network requests | No | No |\n  | **SponsorBlock** | Skips sponsored segments in videos | No | No |\n  | **Enhancer for YouTube** | Auto-clicks \"Skip Ad\" button | No | No |\n  | ** YouTube Ad Punisher** | Detects ad → reloads → seeks to timestamp | Yes | Yes |\n  | **Popup blockers** | Block `window.open()` popups | No | No |"}, {"id": 50670085, "au": "Izkata", "dom": 267, "sr": 17, "sc": 6.9, "ep": 7.34, "bs": 0.0, "d": 2, "age": 3.77, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 10109, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.446, "fa": 0.95, "gp": 0.85, "bl": 0.0, "ds": 0.0, "txt": "In the US, broadcast TV has been ~17 minutes of commercials per 1-hour block since at least the 90s.  That's ~28%, which happens to be exactly in line with your youtube numbers, 4 minutes of ads per 14-minute block.  The skippable 1 minute puts it down to 23%."}, {"id": 50663695, "au": "throwaway2037", "dom": 278, "sr": 18, "sc": 6.86, "ep": 7.75, "bs": 0.0, "d": 4, "age": 15.27, "grav": 168.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 29, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 2.168, "fa": 0.42, "gp": 1.003, "bl": 0.0, "ds": 0.0, "txt": "> Now it’s basically impossible to compete with YouTube. Even if you have the financial backing to make it for a few years, YouTube still has all the content and creators.\n\nFor mid-level creators (say, 500K+ subscribers), they have a small team the reposts and clips their primary YouTube contents across as many social media platforms as possible -- Instagram, Facebook (+Reels), TikTok, X/Twitter, etc.  If someone creates a new video hosting platform called MyTube, what is stopping these creators from reposting their YouTube videos to the new platform?  Nothing that I know.\n\nAmazon certainly has the technical ability to create and fund the build-out of such a competitor, yet it has not.  Honestly, I don't know why.  They have all of the key pieces required: (1) Huge pool of talented software engineers, (2) Massive cloud infra, (3) Experience with streaming video (Amazon Prime), (4) Search advertising (Amazon.com ads injected into search), (5) Experience operating in 100+ countries and adhering to local rules and regulation."}, {"id": 50659360, "au": "Tarball10", "dom": 407, "sr": 19, "sc": 6.81, "ep": 7.25, "bs": 0.0, "d": 2, "age": 25.81, "grav": 397.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 418, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.257, "fa": 0.95, "gp": 1.097, "bl": 0.0, "ds": 0.0, "txt": "It's interesting how much hate YouTube gets just because they used to not have ads 20 years ago.\n\nMeanwhile, people don't bat an eye at paying $20/mo for Netflix or $60+/mo for linear TV to watch their sports, because those services have always been paywalled."}, {"id": 50661168, "au": "goodmythical", "dom": 496, "sr": 20, "sc": 6.79, "ep": 7.23, "bs": 0.0, "d": 3, "age": 22.31, "grav": 312.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 274, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.818, "fa": 0.62, "gp": 0.823, "bl": 0.0, "ds": 0.0, "txt": "My belief serves me perfectly well in this instance. The ads play so frequently as to convince me that they play more often or as often as requested content.\n\nRunning tests would change nothing as I would still have the subjective experience that advertisements are as frequent as content. This is because I can hear the ads in ways that I can ignore the content. If my roomate is watching their sports recaps it is only background noise until BUTWAITTHERE'SMORESUBSCIRBETOOURNEWSLETTERNOWTOSAVEABAJILLIONSQUIRRELSFROMHOMELESSNESSANDALSOVOTEINDEPENDENTANDDON'TFORGETTOCHANGEYOUROILANDPLEASEDONATETOCANCERRESEARCHANDBUYTHISRANDOMSHITNOONENEEDSANDANDANDANDAND...\n\nSuppose testing found that the ratio was perhaps as low as 1:100. What this tells me is that the ads are so intrusive to me that even one minute of their advertising in a hundred minutes of content makes me believe that they occupied 100 times as much time as they did. This would only entrench my desire to not experience the ads as I now have direct evidence that the ads consume an inordinate amount of my subjective experience.\n\nRunning an experiment to determine exactly how frequently youtube runs ads can only cement my current belief that I do not want to be subjected to advertisements from youtube in their current form and so there is no reason to run the experiment.\n\nAs a comparison, suppose that I cannot stand waiting in li"}, {"id": 50660602, "au": "dns_snek", "dom": 4, "sr": 21, "sc": 6.6, "ep": 7.04, "bs": 0.0, "d": 3, "age": 23.65, "grav": 343.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 16, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": ["https://support.mozilla.org/en-US/kb/recommended-extensions-program"], "ig": 1.277, "fa": 1.04, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "Those trusted/recommended/featured badges in extension stores don't offer a strong guarantee, they're not manually and thoroughly reviewing every update like you might assume.\n\n> After receiving Recommended status, safety standards are maintained through automated checks, monitoring, and periodic technical reviews.\n\nhttps://support.mozilla.org/en-US/kb/recommended-extensions-...\n\nSpeaking of which, browsers should really start implementing \"minimum release age\" mechanisms for extension updates."}, {"id": 50658014, "au": "pessimizer", "dom": 184, "sr": 22, "sc": 6.56, "ep": 7.0, "bs": 0.0, "d": 1, "age": 27.89, "grav": 452.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 9, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.747, "fa": 0.42, "gp": 1.17, "bl": 0.0, "ds": 0.0, "txt": "> Is this actually an issue? It works for me!\n\nuBlock Origin + SponsorBlock on Firefox on Linux here, and since 6 months ago Youtube videos all stopped playing within the first minute with an error. In order to watch them, I have to yt-dlp. That being said, I also refuse cookies, spoof my UA and shuffle my reported available fonts, amongst other things.\n\nIt is of course an ongoing issue, and a lot of effort is expended for uBlock Origin to keep up. And something mysterious about my configuration has caused all of those efforts to completely fail. More people trying, the more configurations get covered."}, {"id": 50659846, "au": "alkonaut", "dom": 385, "sr": 23, "sc": 6.51, "ep": 7.61, "bs": 0.0, "d": 1, "age": 25.1, "grav": 379.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 24589, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.578, "fa": 0.68, "gp": 1.354, "bl": 0.0, "ds": 0.0, "txt": "Youtube is the last service online I’ll pay for. I’ll never browse, discover, or subscribe to anyone on YouTube, but occasionally I’ll google how to change a battery on a gadget and the only “manual” is a YouTube video. So I click. And there’s 2 ads before I realize the video doesn’t depict what I was after.\n\nNot only will I not pay with $9, I also don’t want to pay with 20 seconds of ad watching. It’s my genuine belief that if “ad funded content” disappeared tomorrow, together with all the job in content creation, ad tech etc then nothing of value would be lost."}, {"id": 50658916, "au": "Grombobulous", "dom": 220, "sr": 24, "sc": 6.46, "ep": 7.56, "bs": 0.0, "d": 0, "age": 26.49, "grav": 415.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.54, "fa": 0.34, "gp": 2.052, "bl": 0.0, "ds": 0.0, "txt": "The amount of effort people will go to avoid paying for content they spend hours watching is fascinating.\n\nYouTube is the \u00231 streaming video service in the world. Bigger than Disney, bigger than HBO, bigger than Netflix. I say this not to point out that Google needs your money as obviously they don’t, but I say this to point out that it’s a treasure trove of content.\n\nYouTube Premium is absolutely worth the asking price. They’ve also got student plans and a new lite plan for cheaper.\n\nIs $9 a month really too much if you really watch YouTube enough for ads to bother you?"}, {"id": 50663950, "au": "kevsamuel", "dom": 365, "sr": 25, "sc": 6.24, "ep": 7.56, "bs": 0.0, "d": 1, "age": 14.6, "grav": 157.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 227, "qw": 0, "k": 89, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.928, "fa": 0.28, "gp": 1.539, "bl": 0.0, "ds": 0.0, "txt": "I hear this argument all the time, and it's dubious.\n\nI pay for netflix.\n\nI don't pay for youtube and I block the ads because even if you pay Google takes all your data anyway, spies on you accross the entire internet, including your phone, your mails and calendars, sell them to spammers and destroys democracy with it.\n\nNot to mention if you have one problem with one service, your beautiful unrelated payed youtube account is blocked.\n\n- Google sync all your data (including db for unrelated apps, your photos and contacts) from your phone if you dare connecting to the youtube app from a phone that was not connected to google. You have to make a lot of careful efforts to avoid leaking anything.\n\n- Google sells your data to the all sorts of scammers. I was forced to add my pristine phone number to be able to publish an Android app and almost immediately started to get robocalls after that.\n\n- Google, with analytics and Google Fonts, will track me no matter where I go, and this data is happily used for PR campaigns to influence voters.\n\nThis is not ok, and has nothing to do with me paying money to them. It's all about them being bad actors.\n\nI have ZERO problem with getting something out of them for free. Content creators have sponsors for the money anyway, Google doesn't pay enough to make them viable."}, {"id": 50662274, "au": "marvstazar", "dom": 355, "sr": 26, "sc": 6.12, "ep": 7.44, "bs": 0.0, "d": 1, "age": 19.21, "grav": 244.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 51, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.738, "fa": 0.34, "gp": 1.643, "bl": 0.0, "ds": 0.0, "txt": "Second this, in my country YouTube Premium family is $6, which also includes YouTube Music. That alone made me cancel my Spotify subscription (which had much less value to me personally).\n\nYouTube is my favorite social media, as you can customize your experience depending on your needs. If I need philosophical long form content, YouTube gives me a barrage of recommendations within the topic. For days I need intellectual rest, it can also show me stupid cat videos.\n\nI would say it is the subscription where I get the best value from. I know I (and my data) is the product, but my unpopular opinion is this is a good deal given the value that Google has given me over the years."}, {"id": 50662130, "au": "usernomdeguerre", "dom": 611, "sr": 27, "sc": 5.9, "ep": 5.9, "bs": 0.0, "d": 0, "age": 19.58, "grav": 251.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1100, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.676, "fa": 0.0, "gp": 1.353, "bl": 0.0, "ds": 0.0, "txt": "\"\n...(George's discovery, now automated), then switches back. No manual tab switching needed.\n\n...George discovered this works every time.\"\n\nThere is an emotion I feel between amusement and melancholy when I read an AI cite its user by their first name in the Readme of a project that is, ostensibly, ~by the user."}, {"id": 50661062, "au": "mopsi", "dom": 433, "sr": 28, "sc": 5.89, "ep": 7.44, "bs": 0.0, "d": 1, "age": 22.64, "grav": 319.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 215, "qw": 16, "k": 3167, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 2.175, "fa": 0.42, "gp": 0.778, "bl": 0.0, "ds": 0.0, "txt": "> Is $9 a month really too much if you really watch YouTube enough for ads to bother you?\n\nI'd recommend you trying out SponsorBlock before asking this question. The extension relies on cooperative video tagging. Viewers mark video segments for into/outro clips, self-promotion, rants and tangents, interaction reminders, etc. Other viewers can then choose what to do with each kind of segment: skip or show on-screen option to jump forward. The preferences can be configured per-channel.\n\nI've configured SponsorBlock to automatically skip non-music sections in music videos; skip all intros and outros (except for some channels that have very good ones) and \"hey hey hey, hit the like button!\" reminders, and offer the choice to skip segments that go into tangents.\n\nYouTube does not offer this kind of exprience at any price point. Someone sitting on a couch using the most expensive tier of Youtube on a premium hardware like Apple TV gets a far inferior experience. Their music videos may have annoying 30 second intros and logos, mine don't. They have to manually fast forward through irrelevant segments, I don't. And so on and on.\n\nI'd happily pay Youtube to maintain such customer-empowering features, but they don't care to offer them. The paid subscription doesn't even get me rid of Youtube trying to coerce me into watching Shorts and getting me hooked on short-form video, a well-known "}, {"id": 50660487, "au": "rendaw", "dom": 113, "sr": 29, "sc": 5.8, "ep": 6.24, "bs": 0.0, "d": 2, "age": 23.86, "grav": 349.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 4408, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 2.088, "fa": 0.0, "gp": 0.921, "bl": 0.0, "ds": 0.0, "txt": "For trivial extensions (making text fields pastable, qr codes for selections/urls, bookmarks for containers, etc) I recently learned you can do it fully locally using Firefox ESR! It doesn't require local package signing you can install it using a policy, so if you use NixOS you can just tell claude you want an local extension that does X/Y/Z and it'll be installed next time you update your config. I think you could do the same with clones for open source extensions to vet and control upgrades?\n\nA fully programmable browser would still be better but I finally feel a little more safe customizing the browser."}, {"id": 50659743, "au": "TeMPOraL", "dom": 460, "sr": 30, "sc": 5.79, "ep": 6.16, "bs": 0.0, "d": 1, "age": 25.25, "grav": 383.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 2, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 2.051, "fa": 0.0, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "> and downloads\n\nNote: \"Make Available Offline\" or whatever the current name all streaming services settled on is not downloading. Downloading something means getting the data in a self-contained form (e.g. file or files) whose existence and lifetime does not depend on the source app/website. Without that, all you have is a glorified button for extending cache TTL - you still don't get direct access to data, and you still can't control when the app decides to delete it.\n\nIt's important to maintain a clear distinction in language here. Confusing these two things usually leads to a nasty surprise when said cache wipes itself clean just as you board a 12 hour flight or train ride with no Internet, or worse."}, {"id": 50662265, "au": "npteljes", "dom": 321, "sr": 31, "sc": 5.73, "ep": 7.27, "bs": 0.0, "d": 3, "age": 19.24, "grav": 244.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 10, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.201, "fa": 1.1, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": ">cos they just think \"western\" countries can be charged more\n\nThat's backwards in many cases. What's happening is that some countries get lower prices than normal, because a lower price being paid is still better than no price being paid.\n\nRegardless, if you reframe it to your situation, it still works out well. From what I'm reading, Australia's national minimum wage is around $26 per hour. So they need to work like 50 minutes for the monthly sub. That is excellent value for money."}, {"id": 50659137, "au": "cogythea", "dom": 257, "sr": 32, "sc": 5.61, "ep": 7.15, "bs": 0.0, "d": 1, "age": 26.12, "grav": 405.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 10, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.63, "fa": 0.34, "gp": 1.618, "bl": 0.0, "ds": 0.0, "txt": "I would pay, but the practices YouTube engages to make the free plan intolerable put me off giving them any money. Waiting upwards of a minute before each video I watch, filling the videos with ads (for some videos, every 30 seconds), and disturbingly targeted campaigns make me completely unwilling to support it. For the creators I watch the most, I either subscribe to their Patreon or watch on Nebula. Same for most websites I visit - if the ads are unobtrusive and balanced with the content, I'm happy to turn Adblock off, but if I have to scroll through ads and try to make out what parts of the page are actually content (this applies to a lot of small newspaper websites in the UK), if the value proposition of paying for the content is for it to be actually consumable, then I'm not going to reward that with my money."}, {"id": 50659611, "au": "DocJade", "dom": 477, "sr": 33, "sc": 5.55, "ep": 6.94, "bs": 0.0, "d": 2, "age": 25.46, "grav": 388.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 83, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.623, "fa": 0.68, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "Another YouTuber here, I have 95.7k subs and last month I made around $1900 USD in ad revenue. But, it fluctuates a lot, I'll probably close out at around $1100 this month.\n\nDepending on the niche, YouTube pays you different amounts per view on your videos, so it's really a mixed bag on wether people get paid well or not. I've done this full time for a few years now and still don't break minimum wage for the amount of work I put in."}, {"id": 50660212, "au": "xp84", "dom": 231, "sr": 34, "sc": 5.54, "ep": 6.2, "bs": 0.0, "d": 2, "age": 24.38, "grav": 361.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 10058, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.533, "fa": 0.34, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "You can get a number to momentarily use for verification from many free online services. Or activate a mobile line for a month for like $10. Then set up TOTP and passkeys properly and delete the number from your account (and close the mobile line if you made a real one). Voila, a secure YouTube account without telling them your phone number."}, {"id": 50664125, "au": "danaris", "dom": 283, "sr": 35, "sc": 5.49, "ep": 8.06, "bs": 1.7, "d": 7, "age": 14.21, "grav": 150.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 300, "qw": 36, "k": 6982, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.911, "fa": 0.7, "gp": 1.088, "bl": 0.64, "ds": 0.0, "txt": "> Hi, that was my first reply to you, you may be confusing me with someone else.\n\nAh, my apologies. I usually try to check before assuming, but I slipped up this time. I would, then, revise my statement to \"you, too, are trying to avoid...\"\n\n> They're preventing you from viewing other services then?\n\nNo, but that's not the point here. There doesn't have to be literally just one option for online video for YouTube to have a dominant enough position in the market that they can abuse their viewers with impunity.\n\nThere are a few main reasons for this:\n\n1) Media is a type of \"product\" that is, to a large extent, non-fungible. If I want to watch GiantGrantGames play StarCraft 2 mods, YouTube is the only place where I can do that. Yes, I could, instead, go to Twitch and watch someone else stream StarCraft 2, or go to Nebula and watch a Lindsay Ellis video essay, but neither of those are GiantGrantGames playing StarCraft 2 mods. If I switch, I lose access to the specific thing I wanted to watch.\n\n2) YouTube has become the household name for online video, particularly independent online video, both short-form and long-form. Many people wouldn't even think to go looking for another site. You might say that's on them, but it's part of the equation that leads to market dominance.\n\n3) Combining those two gives a third, related one: YouTube has an absolutely enormous catalog both of existin"}, {"id": 50665927, "au": "uni_baconcat", "dom": 490, "sr": 36, "sc": 5.48, "ep": 6.73, "bs": 0.0, "d": 1, "age": 10.18, "grav": 89.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 305, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.622, "fa": 0.34, "gp": 1.341, "bl": 0.0, "ds": 0.0, "txt": "It is true. I remember my friends shared a lot of memes during pandemic, and I know nothing of them since many of them were from annoying YouTube advertisements. I tried to turned off adblocker for a few days, it’s unusable, especially when watching live streams VOD, YouTube automatically inserted advert every 90 seconds."}, {"id": 50660169, "au": "fwn", "dom": 90, "sr": 37, "sc": 5.37, "ep": 6.03, "bs": 0.0, "d": 4, "age": 24.47, "grav": 363.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 32, "k": 1209, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 1.332, "fa": 0.42, "gp": 1.177, "bl": 0.0, "ds": 0.0, "txt": "> ... [the Ladybird developer] posted in support of Charlie Kirk after his assassination ...\n\nThe listed source is a Twitter post of said developer with the following content:\n\n> RIP Charlie Kirk I hope many more debate nerds carry on his quest to engage young people with words, not fists.\n\nWhat is the criticism here? How dare they not approve of political assassination?\n\nIn all seriousness, though, I do think that compiling and publishing clear name lists of people alongside their biometric pictures and some weird allegations is not a constructive contribution to civil discourse or intellectual curiosity - quite the opposite. If it wasn't so weird, it would probably be dystopian."}, {"id": 50660645, "au": "pcthrowaway", "dom": 306, "sr": 38, "sc": 5.32, "ep": 6.86, "bs": 0.0, "d": 1, "age": 23.58, "grav": 342.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 20, "k": 6917, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.429, "fa": 0.42, "gp": 1.589, "bl": 0.0, "ds": 0.0, "txt": "> YouTube Premium is absolutely worth the asking price. They’ve also got student plans and a new lite plan for cheaper\n\nThere are people who don't want to give money to google on ethical grounds.\n\nOf course, it's true that they still get lots of data about you even if you don't pay them for their services.\n\nPersonally, I agree, Youtube premium is worth it in terms of price. I just cancelled my subscription because I decided the shame of continuing to send them money (which I have somehow managed to justify to myself for a few years now) wasn't worth the convenience of the subscription any more.\n\nIt's unfortunate because I do want to support video makers I like, and there isn't really an alternative way to support each one I may watch over the course of a month on my budget. I'll probably pick one every month to support through alternative means."}, {"id": 50659158, "au": "titzer", "dom": 406, "sr": 39, "sc": 5.3, "ep": 6.84, "bs": 0.0, "d": 1, "age": 26.08, "grav": 404.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 2.003, "fa": 0.0, "gp": 1.474, "bl": 0.0, "ds": 0.0, "txt": "It's an extortion racket. You're just paying for the experience you used to get before enshittification.\n\nI hate seeing ads. I think the ecosystem around ads wasn't inevitable--we just accepted it because big corps gonna big corp.\n\nIn addition to the endless 8k vlogs and AI slop on YouTube, there is plenty of educational content, documentaries, and tutorials with a vast value to humanity. Created and put up, incidentally, not by Google, but by millions of people. It's an archive and crowd-sourced platform that has metastasized into a trap in the attention economy that has measurably negative outcomes for young developing minds."}, {"id": 50663404, "au": "gloosx", "dom": 422, "sr": 40, "sc": 5.27, "ep": 6.81, "bs": 0.0, "d": 3, "age": 15.98, "grav": 181.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 6, "k": 1513, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.906, "fa": 0.42, "gp": 0.785, "bl": 0.0, "ds": 0.0, "txt": ">hosting streaming videos is very expensive\n\nActually it's not. An entire hour of 1080p video watched by a user will cost youtube approximately half a cent.\n\nDo you think youtube is just showing enough advertisements to sustain a hosting service? Youtube is showing the maximum number of advertisements users will tolerate without leaving, and that maximum is always moving and stretching towards more revenue. Even if video delivery became practically free tomorrow, youtube would still have an incentive to maximize advertising revenue wherever it could do so without losing too many users."}, {"id": 50658634, "au": "cagey", "dom": 129, "sr": 41, "sc": 5.23, "ep": 6.11, "bs": 0.0, "d": 1, "age": 26.94, "grav": 427.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 349, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.71, "fa": 0.0, "gp": 1.442, "bl": 0.0, "ds": 0.0, "txt": "I run exactly same Firefox w/uBlock Origin and SponsorBlock on Linux, and aside from reliably getting \"Experiencing Interruptions?\" popups (which I assume are caused by the extensions doing their good work) I too have been watching YT ad-free for years.\n\nAlso a shout-out to the \"Backstage Play\" Firefox extension (on Android) which lets me listen to YT-sourced audio without the YT-playing Firefox tab having focus."}, {"id": 50662089, "au": "Aboutplants", "dom": 587, "sr": 42, "sc": 5.22, "ep": 5.88, "bs": 0.0, "d": 0, "age": 19.7, "grav": 254.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1914, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 1.545, "bl": 0.0, "ds": 0.0, "txt": "YouTube related question - what is the best way to manage a YouTube account for a young child (9) to only serve at least non slop semi-educational videos for them to spin through?\n\nI’d love a slider to adjust just how “educational” videos would need to be in order to be viewed but on full YouTube, not kids."}, {"id": 50661524, "au": "AntronX", "dom": 616, "sr": 43, "sc": 5.18, "ep": 6.28, "bs": 0.0, "d": 0, "age": 21.37, "grav": 290.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 2.08, "fa": 0.0, "gp": 0.961, "bl": 0.0, "ds": 0.0, "txt": "Youtube app is getting really bad with ad placement dark patterns. Feels like they fine tune ad popup delay to make me accidentally press on ads when I navigate to reach video comments. Recently they started sliding out ad side panel in full screen requiring to press x to restore fullscreen. I annoys me so much I go through the hassle of copypasting the link into those youtube download sites to get the .mp4 to watch in vlc player uninterrupted. Another trick i do is quickly open/close the video 3 times to get rid of preroll ads. The experience is getting more adversarial."}, {"id": 50664072, "au": "Dylan16807", "dom": 308, "sr": 44, "sc": 5.18, "ep": 6.72, "bs": 0.0, "d": 3, "age": 14.31, "grav": 152.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 38990, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.248, "fa": 0.95, "gp": 0.742, "bl": 0.0, "ds": 0.0, "txt": "Both youtube and spotify put all the payout money into a pool and base the payouts on total consumption.  Spotify uses track listens and youtube uses watch-minutes but otherwise it's the same system.\n\nAlso if I'm parsing this blog post right, creators get about half of what comes out of the pool, and only 30%/60% of \"net revenue\" goes into the pool in the first place  (30% for normal, 60% for lite).  But it's written in a really confusing way."}, {"id": 50659246, "au": "blaze33", "dom": 426, "sr": 45, "sc": 5.18, "ep": 6.72, "bs": 0.0, "d": 1, "age": 25.99, "grav": 402.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 2225, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.93, "fa": 0.0, "gp": 1.504, "bl": 0.0, "ds": 0.0, "txt": "I would never had paid 10 bucks for YouTube Premium, with uBlock Origin on Firefox I already had zero ads. But I was already paying 10€ for YouTube Music at the time so that YouTube Premium was just 2€ (Music is included in Premium). Mostly useful for the mobile app, no ads now and I can listen to an audio track with the phone screen off (like conferences, I understand ads in a free product but that thing was really annoying, just worse UX unless you pay).\n\nAnd slightly off-topic, in a google search, logged in, clicking on a YouTube result, it frequently embeds the video in a search preview page which shows ads unless I click a second time to actually go to YouTube. Quite infuriating. Maybe I need YouTube Premium Plus Ultimate (Black Mirror Common People vibes)."}, {"id": 50660468, "au": "Gander5739", "dom": 96, "sr": 46, "sc": 5.1, "ep": 5.98, "bs": 0.0, "d": 4, "age": 23.9, "grav": 350.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 321, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "extension_security", "flbl": "Extension & Security (Source)", "urls": [], "ig": 2.164, "fa": 0.0, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "Requiring user confirmation before updates, with a description of the change; finer-grained permissions (currently a dark mode extension needs to be given the right to inject javascript on all pages); allowing you to blacklist pages from extensions, like banking websites; splitting read and write permissions; requiring outbound endpoints to be explicitly requested for, instead of allowing all urls; etc. From the other side, password managers have to inject into the DOM, which means websites can pontentially read their content - that's also quite messy, and shadow DOMs don't address the security implications.\n\nI think whilst there are a lot of problems with Android as a locked-down system, there's also a lot to learn from it in terms of permissions and sandboxing."}, {"id": 50658021, "au": "ssl-3", "dom": 600, "sr": 47, "sc": 5.04, "ep": 6.14, "bs": 0.0, "d": 1, "age": 27.89, "grav": 452.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.876, "fa": 0.34, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "A true ad punisher/YouTube killer would be a unified place where people could go to watch PeerTube-provided videos, with subscriptions, ratings, recommendations, comments, and shared engagement with at least some minor sense of community.\n\nIt should be something that at least pretends to believe in itself as a first-tier service instead feeling like a wanky tech demo for a protocol when 95% of people don't care what what \"protocol\" even means in this context.\n\nAnd that protocol, itself?  It should allow for distributed storage, bandwidth, and compute.  If storage and bandwidth and transcode are the greatest cost centers with building a YouTube competitor, as I often hear is the case, then it should be a simple affair for me to give a few terabytes of space, a few gbps of bandwidth, and some otherwise-idle GPU time to the community.  Alas, it is not this way.\n\n(Actually, the more I think about it the less I think that PeerTube is a good direction to go at all.  The foundation isn't there.)"}, {"id": 50664585, "au": "jonathanlydall", "dom": 348, "sr": 48, "sc": 4.99, "ep": 6.53, "bs": 0.0, "d": 1, "age": 13.19, "grav": 133.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2749, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.421, "fa": 0.34, "gp": 1.53, "bl": 0.0, "ds": 0.0, "txt": "I want a merely \"not shit\" package, except they only offer their \"Premium\" package which includes stuff like music streaming which is a total waste as I'm already using a different music streaming service.\n\n$9/month is about 5 times as much as I'm willing to pay to merely not have adverts, so I only very rarely watch YouTube."}, {"id": 50659049, "au": "SecretDreams", "dom": 450, "sr": 49, "sc": 4.92, "ep": 6.46, "bs": 0.0, "d": 1, "age": 26.27, "grav": 409.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 20, "k": 1508, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.788, "fa": 0.42, "gp": 0.735, "bl": 0.0, "ds": 0.0, "txt": "> YouTube Premium is absolutely worth the asking price. They’ve also got student plans and a new lite plan for cheaper.\n\nI pay for it. I think it's overpriced a bit compared to conventional streaming services and I think the gradient in content qualify is wide, with a lot of poor or unrelated content. I am paying for a catalogue of crap when I want a subset of diamonds. You might say this about Netflix too, but YouTube is this on steroids and costs more.\n\nI think content creators are overpaid by YouTube, largely so they don't migrate to another content platform, and the premium payers existing to subsidize this monopolistic business practice. YouTube with ads is not useable for me, so I'm stuck paying. But it's not a good price, just no alternatives.\n\nGive me free market YT content, and there's no way the YT premium price stays this high."}, {"id": 50661161, "au": "kevincox", "dom": 289, "sr": 50, "sc": 4.89, "ep": 6.43, "bs": 0.0, "d": 1, "age": 22.33, "grav": 312.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 15260, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.688, "fa": 0.0, "gp": 1.697, "bl": 0.0, "ds": 0.0, "txt": "I paid for YouTube Premium for quite a while. But it really isn't \"ad free YouTube\". They replace a lot of ads with ads for premium features and content. I just don't want to watch without ads, but they insist on selling me on all of these garbage extra features I don't want. I was also largely paying for Google Play Music which they replaced with the awful YouTube Music. It finally pissed me off enough that I installed an ad blocker in my browser for the first time and cancelled my subscription. I'm not paying for a service that gets worse and worse and doesn't even offer the core promise.\n\nI do subscribe to Nebula which is lovely. RSS feeds that work well. No nags for anything. There isn't even a like button which is actually quite refreshing. I just click the video in my feed reader and watch. Nothing else. It is perfect."}, {"id": 50658202, "au": "dns_snek", "dom": 121, "sr": 51, "sc": 4.88, "ep": 6.42, "bs": 0.0, "d": 1, "age": 27.61, "grav": 445.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.427, "fa": 0.34, "gp": 1.447, "bl": 0.0, "ds": 0.0, "txt": "Yes, in a sense. Youtube seems to do a lot of A/B testing over very long time frames so your experience could be completely different than other people's. I've never had an ad get past the ad blocker but I've had a lot of fake-buffering and videos refusing to play that makes the site unusable over the past 1-2 years.\n\nI remember people telling me about this for months and I had no idea what they were talking about until one day they targeted my account as well."}, {"id": 50659985, "au": "SecretDreams", "dom": 452, "sr": 52, "sc": 4.87, "ep": 6.41, "bs": 0.0, "d": 3, "age": 24.83, "grav": 372.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 1508, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.929, "fa": 0.28, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "That's a binary perspective whereas I'm suggesting this has a lot of gray.\n\nGoogle suppresses competition to keep content creators parked. We all want a small amount of the content, but there is a disconnect between the price and the content being offered - but also no other alternative.. and budding organic alternatives are smothered in a relatively capital intensive field.\n\nBecause demand here is somewhere between elastic and inelastic, with a good amount of price sensitivity, you will see more discussions around ad circumvention, which prompted this topic. Google combats this by owning the full stack - they own the most popular browser/phone ecosystem and they've now taken steps to shut down and blocking to force you to pay or watch the ads.\n\nWe'll see how it goes, but, if you ask me, we will see a rise in piracy of all sorts over this next decade because of the practices I've discussed, after a period where piracy was relatively quiet because the original subscription model was substantially better (in the beginning) than what it was trying to replace."}, {"id": 50658545, "au": "ssl-3", "dom": 188, "sr": 53, "sc": 4.81, "ep": 6.44, "bs": 0.53, "d": 2, "age": 27.09, "grav": 431.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.741, "fa": 0.0, "gp": 1.618, "bl": 0.2, "ds": 0.0, "txt": "Works very well for me with uBlock Origin with Firefox on Linux (and Android too, for that matter).  I use it all the time.\n\nBut I don't run SponsorBlock anymore (I felt compelled to spend more time rating, adding, and correcting segments than manually skipping sponsor segments), or refuse cookies, or spoof my UA, or shuffle my available reported fonts.\n\n(I mean:  Youtube already knows very well who I am.  I'm logged in there with my paid-for Google Workspace account.)"}, {"id": 50658829, "au": "blooalien", "dom": 159, "sr": 54, "sc": 4.75, "ep": 5.19, "bs": 0.0, "d": 3, "age": 26.63, "grav": 419.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 6, "k": 2319, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.375, "fa": 0.42, "gp": 0.526, "bl": 0.0, "ds": 0.0, "txt": "> Enable Linux mode and install Firefox.\n\nHelps a lot, but it's not a magic silver bullet solution.  Folks still gotta also use their brains and try to stay somewhat \"clued in\" on how some of this \"tech stuff\" all works at a level slightly above \"appliance\" (power switch on, machine do stuff for me without me need think) mode.  Learning and understanding somewhat complex stuff is a human super-power.  We should all use it more frequently.  It's actually one of the many things that makes life so fun and interesting.  :)"}, {"id": 50660685, "au": "bragr", "dom": 280, "sr": 55, "sc": 4.72, "ep": 6.26, "bs": 0.0, "d": 4, "age": 23.5, "grav": 340.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 9, "k": 4562, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.304, "fa": 0.42, "gp": 1.378, "bl": 0.0, "ds": 0.0, "txt": ">YouTube has disproportionate power due to their market dominance.\n\nName one. From where I'm sitting, rights holders and advertisers have youtube by the balls and when they say jump, youtube asks how high? If they were so dominate, they'd be the ones dictating terms to advertisers. Its neither a monopoly nor monopsony."}, {"id": 50660997, "au": "lilbigdoot", "dom": 300, "sr": 56, "sc": 4.72, "ep": 6.26, "bs": 0.0, "d": 1, "age": 22.82, "grav": 323.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 200, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.703, "fa": 0.0, "gp": 1.554, "bl": 0.0, "ds": 0.0, "txt": "The thing for me is the recommendation algorithm doesn't provide an experience I would pay for. It consistently pigeon holes every account I have into the same handful of consistently recommended creators and topics and the same videos over and over. Happens to every account I've made (ADHD thing I tend to just make a new account randomly, enjoy the variety again and two weeks later it's back to a repetitive loop of stuff I enjoyed briefly but don't want to keep watching but it won't recommend me stuff outside the niche so it sticks). It's different sets of creators and topics every time so it's like just not connecting what I watch to the broader niche."}, {"id": 50660758, "au": "belorn", "dom": 394, "sr": 57, "sc": 4.72, "ep": 6.16, "bs": 0.0, "d": 1, "age": 23.37, "grav": 337.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 19386, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.883, "fa": 0.0, "gp": 1.199, "bl": 0.0, "ds": 0.0, "txt": "The amount of effort will always be dwarfed by the amount of effort, money and lawyers that YouTube and their parent company spend on by-passing and breaking the law.\n\nThis year alone they were fined for about a billion euro (insert meme here) in Europe alone. This in turn is only a smaller amount to the bribes/lobbying they do to get special treatment from the US government.\n\nAnd last, if we are talking about advertisement where they refuse to take any legal responsibility for malware, fraud and scams, I find that there is a ethical question about both giving such organization money or watching the ads themselves. Using up their resources and money is arguable a good thing."}, {"id": 50661955, "au": "beloch", "dom": 127, "sr": 58, "sc": 4.72, "ep": 6.12, "bs": 0.0, "d": 2, "age": 20.15, "grav": 264.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 15563, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 2.021, "fa": 0.0, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "If a video fake buffers, clicking on any link to another video in youtube and then immediately hitting back usually clears it up faster than reloading, although I expect they'll eventually \"fix\" that.\n\nHonestly, I wish Google would put more effort in eliminating scams from their ads and less into crap that is actively hostile to their users.  If somebody less evil finds a way to beat Google at video hosting, I'll be rooting for them.  Hosting video at scale won't pose a massive barrier for incumbent oligarchs to sit behind forever."}, {"id": 50659088, "au": "tossandthrow", "dom": 368, "sr": 59, "sc": 4.72, "ep": 5.86, "bs": 0.0, "d": 1, "age": 26.2, "grav": 407.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 2360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.564, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Yes, 9 usd a month is too much.\n\nYou pay Google for distribution, not content - even though they are making it murky.\n\nI am not paying 9 usd to watch someone injecting sponsered segments.\n\nInalready payed by watching these.\n\nAd blockers are IMHO not just moraly acceptable, but we have a moral imperative to use them, to shield against dangerous influences and to take a stance against the marketing industry."}, {"id": 50659337, "au": "latexr", "dom": 453, "sr": 60, "sc": 4.72, "ep": 5.86, "bs": 0.0, "d": 1, "age": 25.84, "grav": 398.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 5, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "videos_paying", "flbl": "Videos & Paying (Youtube)", "urls": [], "ig": 1.461, "fa": 0.42, "gp": 0.846, "bl": 0.0, "ds": 0.0, "txt": "> it’s a treasure trove of content\n\nIt’s also a sludge pile of addictive ragebit and slop. “Content farms” abound.\n\nI don’t mind paying for stuff, but I’m not comfortable with paying Google (or anyone) for them to get more data on me to exploit me more effectively. That seems like a bad deal. I’d sooner pay for (e.g.) Nebula. If a few more of the YouTubers I watch were on there (some have a Patreon, others nothing), I’d have shelled out for a lifetime account already."}, {"id": 50657695, "au": "noitpmeder", "dom": 1, "sr": 61, "sc": 4.72, "ep": 5.76, "bs": 0.0, "d": 0, "age": 28.36, "grav": 465.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 1536, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 1.738, "bl": 0.0, "ds": 0.0, "txt": "Is this actually an issue? Using uBlock Origin on firefox I don't think I have seen a youtube-forced ad in YEARS. And then adding in the SponsorBlock extension gets me around anything embedded into the video itself.\n\nSponsorBlock is actually awesome, and for those that like to see internet numbers go up, it tells you how much your own submissions have saved other users over the years (the 11 snippets I've added have helped others skip 20d of ads)."}, {"id": 50660200, "au": "xp84", "dom": 268, "sr": 62, "sc": 4.72, "ep": 5.65, "bs": 0.0, "d": 2, "age": 24.41, "grav": 362.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 10058, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.52, "fa": 0.0, "gp": 1.432, "bl": 0.0, "ds": 0.0, "txt": "YouTube is a monopoly? Substack, Nebula, Floatplane, Patreon, etc. all exist and offer an ad-free experience where content creators have more control and stand to make more money per viewer. Many big creators put their content (and sometimes bonus stuff too) on those services. Oh, the viewer does have to pay something for those other services. Because obviously someone has to pay for hosting video.\n\nIt’s weird to me to say YouTube is a monopoly. They’re just the only ones with the adtech to make it pencil out financially to offer the content without cost to the viewer."}, {"id": 50669680, "au": "smoovb", "dom": 317, "sr": 63, "sc": 4.72, "ep": 5.62, "bs": 0.0, "d": 1, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 483, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.46, "fa": 0.34, "gp": 0.839, "bl": 0.0, "ds": 0.0, "txt": "I absolutely love paying for Premium, knowing 30% of net subscription fees go into the creator pool.  This means I auto-pay content creators I love, and give a big FU to ads and advertisers.  In fact, I wish Google would introduce Chrome Premium,  and auto-pay any of the sites that I visit."}, {"id": 50661499, "au": "snailmailman", "dom": 140, "sr": 64, "sc": 4.72, "ep": 5.59, "bs": 0.0, "d": 3, "age": 21.45, "grav": 292.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 1588, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.916, "fa": 0.0, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "Ooh interesting. I didn’t think this was a thing.\n\nI’ve got my tech-illiterate grandmother setup with a cheap Chromebook + ublock lite + a dns-based Adblock. The only issues were when Google disabled the original uBlock origin. She immediately fell for a malware popup on Facebook, that wanted her to call “Microsoft support”\n\nI’ll have to see if her Chromebook is x86. I suspect it’s too cheap/old unfortunately. But Adblock is the only thing keeping the Internet vaguely usable for her. I’d prefer she have even better Adblock. (The DNS-based Adblock has saved her from scam text messages on her iPhone multiple times by making the links not load)"}, {"id": 50659614, "au": "pino83", "dom": 403, "sr": 65, "sc": 4.72, "ep": 5.55, "bs": 0.0, "d": 1, "age": 25.45, "grav": 388.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 49, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.653, "fa": 0.0, "gp": 1.148, "bl": 0.0, "ds": 0.0, "txt": "I already paid a lot due to the centralization of the world into BigTech silos (incl. algorithms that steer opinions, incl. tracking my habits, ...).\n\nEvery now and then, when I watch a YT clip, there is definitely an ad-blocker involved and definitely also SponsorBlock.\n\nDo I have a bad conscience?\n\nNot at all! :-P\n\nWhat I'll definitely NOT do: Pay anybody for that dystopia."}, {"id": 50658925, "au": "bemtevi", "dom": 582, "sr": 66, "sc": 4.72, "ep": 5.54, "bs": 0.0, "d": 0, "age": 26.48, "grav": 415.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.649, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I hate ads like everyone else. But I'm just going to put this out there that I'm a YouTuber, fairly poor, and I make enough on YouTube ads to put a little extra food on the table and pay some bills. So for those engineers making six figures and talking about ad blocking, something to think about.\n\nHey, I don't judge for blocking ads. But if you're going to do it, consider a subscription to YouTube.\n\nI also disable all mid-roll ads and disable ads about gambling, weight loss, and other stuff I consider unethical."}, {"id": 50659434, "au": "kakacik", "dom": 218, "sr": 67, "sc": 4.72, "ep": 5.49, "bs": 0.0, "d": 1, "age": 25.73, "grav": 395.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.635, "fa": 0.34, "gp": 0.469, "bl": 0.0, "ds": 0.0, "txt": "What is that? I just run vanilla firefox + ublock origin and nothing more, and never, ever seen a single youtube ad for decade+.\n\nNow if by accident something in phone opens in native youtube app and not in Firefox mobile with same ublock origin its vomitous. But so is entire internet. I am mentally incompatible with those primitive ads and their cheap attention grabbing techniques and simply close the video (or if its really good I reopen it in browser).\n\nFew times I've been forced to watch on other's devices and what the actual fuck - there were 2-3 ads before, and 2-3 more during the video, which was under 10 mins. Do people have no self-respect anymore or have been tamed into such submission?"}, {"id": 50666812, "au": "lovelymono", "dom": 391, "sr": 68, "sc": 4.72, "ep": 5.48, "bs": 0.0, "d": 1, "age": 8.58, "grav": 69.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 7, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ublock_origin", "flbl": "Ublock & Origin (Firefox)", "urls": [], "ig": 1.519, "fa": 0.34, "gp": 0.652, "bl": 0.0, "ds": 0.0, "txt": "Putting aside the submission.\n\n\"The amount of effort people will go to\" is a really weird way to put what amounts to installing uBlock Origin. I've used it for at least 8 years now, and in that time I've never seen a single youtube-provided ad.\n\nSo why, exactly, would I pay for the questionable privilege of not seeing ads, which I'm going to get regardless?\n\n(I'm ignoring the other \"features\" (in scary quotes since they are just arbitrary limitations that google imposes on you to make you pay for it) that the subscription would give you, since I only watch it occasionally.)"}, {"id": 50662287, "au": "WarmWash", "dom": 337, "sr": 69, "sc": 4.72, "ep": 5.44, "bs": 0.0, "d": 2, "age": 19.15, "grav": 242.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.751, "fa": 0.0, "gp": 0.918, "bl": 0.0, "ds": 0.0, "txt": "Ironically googles monopoly is cemented by the rampant levels of ad-block.\n\nYoutube with ad-blocking is bar-none the best media experience on the internet. It kills all competition in the cradle because they all need to rely on ads to compete.\n\nTrust me, the ad-block crowd only cares about not seeing ads, it's not some virtuous crusade against the man. They _will not_ whitelist a video host and watch ads to bring down yt."}, {"id": 50660801, "au": "leokennis", "dom": 277, "sr": 70, "sc": 4.72, "ep": 5.44, "bs": 0.0, "d": 3, "age": 23.27, "grav": 334.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 4602, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.93, "bl": 0.0, "ds": 0.0, "txt": "What I meant with monopoly is that YouTube was the first big player in the “online amateur video” space and because of that the only one to achieve the economies of scale necessary to make serving that much video financially feasible.\n\nNow it’s basically impossible to compete with YouTube. Even if you have the financial backing to make it for a few years, YouTube still has all the content and creators.\n\nYouTube is now so entrenched that they’ll forever remain the only serious and viable player in that “online amateur video” space. So, effectively a monopoly.\n\nAnd I recognize that with that power, YouTube also gained the power to shove as many ads down our eyeballs as they want. Morally, at least from a capitalist perspective, they are within their rights to do so.\n\nHowever I’m also not surprised that people are finding ways to circumvent those ads; given how prevalent, plentiful and repetitive they are."}, {"id": 50661608, "au": "carlosjobim", "dom": 378, "sr": 71, "sc": 4.72, "ep": 6.26, "bs": 0.85, "d": 4, "age": 21.1, "grav": 284.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 1513, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.751, "fa": 0.34, "gp": 0.81, "bl": 0.32, "ds": 0.0, "txt": "I don't like shorts either, but it's not YouTube producing them.\n\nCompare to a supermarket then instead. 80% of aisles are full of poison, and most people fill their carts with it. But in the back there's all the highest quality ingredients you could ever need. Same with a library, most of books are slop for people to waste time. Still, libraries are a priceless resource.\n\nWhere YouTube shines it really does shine. You can save thousands of dollars on car repairs with instructions that can only be found on YouTube. You can learn almost anything in the world from YouTube, both practical and intellectual. It's a bottomless goldmine, if you take time to like, dislike, and subscribe on videos.\n\nAnd from a subscriber like me, they get the same amount of money every month no matter how much or how little i watch YouTube. So they have no reason to try to keep me hooked.\n\nI hope they would switch to a subscriber-only model instead of ads."}, {"id": 50658350, "au": "nickcw", "dom": 504, "sr": 72, "sc": 4.72, "ep": 5.41, "bs": 0.0, "d": 1, "age": 27.35, "grav": 438.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 4965, "kpp": 8.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_premium", "flbl": "Money & Premium (Youtube)", "urls": [], "ig": 1.703, "fa": 0.0, "gp": 0.971, "bl": 0.0, "ds": 0.0, "txt": "I got a YouTube family subscription so that my kids (who are all young adults now!) could avoid the brainrot advertisements.\n\nI've ended up watching lots of great stuff on YouTube myself. I tend to watch on the TV where the ad blocking doesn't work so premium is great there.\n\nI then discovered YouTube Music which you get as part of the subscription.  I prefer it to Spotify - its a lot more reliable technically and the discovery is better.\n\nSo I'd count my self as a happy YouTube premium customer. I also don't have to eff around with stuff like YouTube ad blockers which gives me more free time and less stress ;-)"}, {"id": 50664775, "au": "dannyw", "dom": 531, "sr": 73, "sc": 4.72, "ep": 5.4, "bs": 0.0, "d": 2, "age": 12.73, "grav": 126.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 16166, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ads_youtube", "flbl": "Ads & Youtube (Pay)", "urls": [], "ig": 1.811, "fa": 0.0, "gp": 0.789, "bl": 0.0, "ds": 0.0, "txt": "There’s no YouTube ads with normal Premium on any platform I’ve used. Not in videos, not in search, not in recommendations.\n\nIt’s legalese because sponsored segments in the creator video qualify as ads; but the creator uploaded that as part of the video.\n\nYou have “skip ahead” which, while requiring a couple clicks, lets you fast forward past these segments. It’s a semi-native SponsorBlock; I’m okay with it since they have creators to listen to too.\n\nWhile the price is around the upper limit of what I’ll tolerate, I realise bandwidth and storage isn’t free, and I’m happy to not feel guilty about ad blocking creators.\n\nI’m far from a fan of Google, but video serving is not cheap either."}, {"id": 50658052, "au": "darepublic", "dom": 503, "sr": 74, "sc": 4.72, "
