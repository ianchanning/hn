egory": "general_web", "count": 13}], "story_anchors": ["predictions", "prediction", "major", "interesting", "cluster", "claim", "happened", "climate", "geopolitics", "machine", "topic", "analysis", "show", "cars", "llm", "tech", "search", "cool"], "largest_root": {"root_id": 50671760, "author": "samtheprogram", "slots": 11, "start_dom": 9, "end_dom": 19, "share_pct": 13.9, "top_dom1_age": 16.0, "top_dom1_author": "mv4"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50674920, "au": "lucb1e", "dom": 44, "sr": 1, "sc": 7.1, "ep": 7.1, "bs": 0.0, "d": 0, "age": 7.43, "grav": 56.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 18884, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "picked_mine", "flbl": "Picked & Mine (Search)", "urls": [], "ig": 1.638, "fa": 0.95, "gp": 0.378, "bl": 0.0, "ds": 0.0, "txt": "From the top forecasts, \"Some variant of WebGPT [will be] smarter than most people\" is marked as having come true. I guess one can have that opinion depending on how you define smart, but strange to include this to-me-obviously-false claim (if computers are smarter, why is virtually everyone with a desk job still employed? Evidently humans can do things an LLM with tools cannot, much less chatgpt) is even picked as one of the most spectacular things to highlight. A bit hard to take the other statistics seriously, also considering \"it was made in 4 to 6 hours\" with 13k entries: no person ever checked the output. Might as well leave the statistics out then\n\nedit: and the only one it picked up of mine is rated as not true, yet it's precisely on track. Way too soon to call whether history books refer to 2022 as the pivot point where we missed a specific last chance, but as of today we appear to have exceeded +1.5°C (at least within error margins) and policies need runway. The prediction was that we'd not take action but just do more talking in 2022, and a 2022 UN report concluded governments are not meeting the climate goals. In response... well, nothing. We didn't use 2022 to adjust our trajectory, as was the (I put it in airquotes in the original comment) \"prediction\". Mildly curious what made the token predictor output a zero instead of a one here"}, {"id": 50674278, "au": "roenxi", "dom": 20, "sr": 2, "sc": 6.93, "ep": 6.93, "bs": 0.0, "d": 0, "age": 9.23, "grav": 77.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 88, "qw": 0, "k": 30627, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fair_based", "flbl": "Fair & Based (Version)", "urls": ["https://www.metaculus.com/accounts/profile/119188/"], "ig": 1.489, "fa": 0.96, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "Cool. But something that jumps out [0] is the lack of a calibration curve. Grading someone as a binary when they express a percentage isn't fair. 90% chances routinely fail to materialise, it isn't all that likely in the bigger picture. I'd expect HN to be making all sorts of highly specific predictions but it isn't clear that any specific prediction happening means anything whether it was correct or not. There is a lot of confident speculation on the internet, I'd hope that every imaginable tech scenario is considered somewhere in the HN comments.\n\n[0] I'm thinking metaculus - https://www.metaculus.com/accounts/profile/119188/"}, {"id": 50672015, "au": "jrmg", "dom": 28, "sr": 3, "sc": 6.84, "ep": 6.84, "bs": 0.0, "d": 2, "age": 14.84, "grav": 161.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 56, "qw": 0, "k": 5516, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "test_turing", "flbl": "Test & Turing (Human)", "urls": ["https://hnpredictions.com/themes/autonomous-vehicle-adoption-and-commercialization-b2df0739"], "ig": 1.339, "fa": 0.96, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "I'm thinking of the claims here:\n\nhttps://hnpredictions.com/themes/autonomous-vehicle-adoption...\n\nI'm not sure how to 'evaluate' the results. It sort of feels like \"people claimed almost everything possible about autonomous vehicles, and 40% were correct\"\n\nI'd be interested in seeing \"how good were optimistic takes vs pessimistic\" or \"have optimistic or pessimistic claims been more often correct about the immediate vs far future\" etc."}, {"id": 50673159, "au": "irishcoffee", "dom": 49, "sr": 4, "sc": 5.86, "ep": 5.86, "bs": 0.0, "d": 4, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 10, "k": 1678, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fair_based", "flbl": "Fair & Based (Version)", "urls": [], "ig": 1.194, "fa": 0.76, "gp": 0.612, "bl": 0.0, "ds": 0.0, "txt": "> I am curious about how the prediction markets are handling this\n\nYou use funds to make bets and the lines move over time based on how the funds are distributed. I suppose another way of looking at it is like options \"trading\" in the US markets. You gain or lose alpha? over time relative to when you made the \"trade\"\n\nBetting on things early with long odds that become obvious time is kind of the whole point. If your thought is to some how \"make this fair\" you're working towards some sort of market where everything is 100% efficient, everyone wins and loses the exact same amount over N days/weeks/months.\n\nSo the short answer is, put your money where your mouth is, which is why prediction markets \"work\" and narrow in closer to the actual outcome over time as the deadline approaches. The long answer is, without another dimension, such as money, no there isn't a way to \"make this fair\" at all.\n\nNeat site though."}, {"id": 50671741, "au": "eamag", "dom": 22, "sr": 5, "sc": 5.53, "ep": 5.53, "bs": 0.0, "d": 0, "age": 15.34, "grav": 170.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 1252, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "search_predictions", "flbl": "Search & Predictions (Huang)", "urls": ["https://hn-predictions.eamag.me/"], "ig": 0.337, "fa": 1.3, "gp": 0.713, "bl": 0.0, "ds": 0.0, "txt": "That's exactly the same thing I did 2 years ago! I was wondering if it needs an update, good timing! https://hn-predictions.eamag.me/\n\nYours is way more polished, one can really see the model improvement over 2 years"}, {"id": 50643742, "au": "mv4", "dom": 35, "sr": 6, "sc": 4.7, "ep": 7.21, "bs": 2.52, "d": 1, "age": 68.64, "grav": 2129.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 51, "qw": 0, "k": 1508, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "picked_mine", "flbl": "Picked & Mine (Search)", "urls": ["https://hnpredictions.com/categories"], "ig": 1.117, "fa": 1.58, "gp": 0.059, "bl": 0.95, "ds": 0.0, "txt": "I haven't done any analysis yet and I am very curious about finding outliers - so perhaps that's what I will do next.\n\nI do have stats by category: https://hnpredictions.com/categories\n\n- and HN people as a whole have been most successful predicting outcomes in \"AI and Machine Learning\" at 53.6% (no surprise there), followed by \"Energy and Climate\" at 50.9% (surprise)."}, {"id": 50676389, "au": "fedupnow", "dom": 12, "sr": 7, "sc": 4.5, "ep": 4.5, "bs": 0.0, "d": 2, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "test_turing", "flbl": "Test & Turing (Human)", "urls": [], "ig": 1.366, "fa": 0.34, "gp": 0.218, "bl": 0.0, "ds": 0.0, "txt": "I wonder if telling an llm its participanting in a turing test exercise would make it sound less annoying. atp I could detect any llm, no pangram needed, strictly by how bad of a headache it gives me. All llms are extermely obvious. I dont think we've passed the turing test, despite everyone thinking we did in 2023."}, {"id": 50674753, "au": "aetherson", "dom": 53, "sr": 8, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 0, "age": 7.98, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 8648, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "driving_self", "flbl": "Driving & Self (Predictions)", "urls": [], "ig": 1.18, "fa": 0.34, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "I read through a bunch of predictions in the autonomous car cluster and I feel like they're grading truth very generously.  Lots of people being graded true that, like, \"autonomous cars are allowed in half of all states by 2018,\" and sure, I guess half of all states didn't totally close the door to very limited testing.  But is that really what was meant?"}, {"id": 50672576, "au": "6thbit", "dom": 47, "sr": 9, "sc": 3.91, "ep": 4.05, "bs": 0.0, "d": 2, "age": 13.52, "grav": 139.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1165, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fair_based", "flbl": "Fair & Based (Version)", "urls": [], "ig": 1.25, "fa": 0.34, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Well that, but there's also just straightforward progressions where speaking of the next event is hardly a prediction.\n\nTake the top 'best call' from the \u00231 forecaster in the leaderboard. It's talking about gpt 4 in december 25 of 2022, and we already were at gpt3.5, so just \"naming the exact\" version isn't quite predictive IMO, but still got 5/5 specificity. The boldness comments capture some of the nuance there but still rank it 2/5 which seems high."}, {"id": 50675770, "au": "teiferer", "dom": 43, "sr": 10, "sc": 3.72, "ep": 3.72, "bs": 0.0, "d": 0, "age": 4.25, "grav": 27.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "driving_self", "flbl": "Driving & Self (Predictions)", "urls": [], "ig": 1.547, "fa": 0.0, "gp": 0.056, "bl": 0.0, "ds": 0.0, "txt": "So cool!\n\nI'd love to see sth like that but for predictions made by public figures. Politicians, tech leaders etc. Elon claiming that by 20xx this-and-that will have happened (mars station, fully self driving cars, money-based economy gone, etc). This kind of thing.\n\nAnd ideally in a newspaper format. \"Today is when Xxx was predicted to happen. Did it?\" + deep dive on the prediction, who did it, when, what did actually happen.\n\nIt's harder to build since sourcing it is not as clear cut as HN. But somebody investing a bunch of tokens can probably do it without issue."}, {"id": 50637924, "au": "joe-esquibel", "dom": 34, "sr": 11, "sc": 3.6, "ep": 3.75, "bs": 0.0, "d": 0, "age": 81.51, "grav": 2878.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 42, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "search_predictions", "flbl": "Search & Predictions (Huang)", "urls": [], "ig": 0.887, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "So what's your take on what categories HN can predict the best and the least? Is it mostly person dependent. Have you mined this for ppl with statistical abnormally high predictions in sub areas, suggesting a pool of true prognosticators or ppl with insider knowledge?"}, {"id": 50671545, "au": "LoganDark", "dom": 75, "sr": 12, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 0, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "driving_self", "flbl": "Driving & Self (Predictions)", "urls": [], "ig": 1.25, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Very cool, although I quickly ran out of accurate predictions to peruse!\n\nIn general, I'm surprised at how hard it is to browse -- I figured out how to get to the leaderboard, but I can't figure out how to get to which predictions by that user were actually accurate (only a singular favorite), and I also can't seem to find any index of all the accurate predictions. Current Events only has 10 entries, etc.\n\nI'm sure this is a side-effect of one-shotting it by LLM, but I'm always surprised at just how confusing it gets.\n\nThe data I could find was a fun read though!"}, {"id": 50676331, "au": "creatonez", "dom": 8, "sr": 13, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 1, "age": 2.24, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 3653, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "picked_mine", "flbl": "Picked & Mine (Search)", "urls": [], "ig": 0.822, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "These predictions were a dime a dozen after GPT-2 (2019) came out. But I guess predicting this in the period before InstructGPT or even GPT-3 is somewhat impressive."}, {"id": 50658793, "au": "samyum", "dom": 61, "sr": 14, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 0, "age": 41.08, "grav": 874.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 10, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fair_based", "flbl": "Fair & Based (Version)", "urls": [], "ig": 0.805, "fa": 0.0, "gp": 0.51, "bl": 0.0, "ds": 0.0, "txt": "Honestly we need to apply this concept to the wider journalism and scientific communities. In general there is no downside to making bold predictions to gain coverage because if it does come true you can make a big stink about it and if it doesn't, you just quietly never mention it again."}, {"id": 50675309, "au": "nl", "dom": 67, "sr": 15, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 2, "age": 5.92, "grav": 41.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 34310, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "search_predictions", "flbl": "Search & Predictions (Huang)", "urls": [], "ig": 0.69, "fa": 0.28, "gp": 0.037, "bl": 0.0, "ds": 0.0, "txt": "You need to add the ability to just search on username. For example if you search for my name you get 26 pages of results, and I have no idea if any of them are actually from me or just include the characters nl. PG has a similar problem, but at least you can see some of his first."}, {"id": 50671009, "au": "bawolff", "dom": 37, "sr": 16, "sc": 2.46, "ep": 2.75, "bs": 0.0, "d": 2, "age": 16.67, "grav": 194.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 29308, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "search_predictions", "flbl": "Search & Predictions (Huang)", "urls": [], "ig": 0.577, "fa": 0.0, "gp": 0.964, "bl": 0.0, "ds": 0.0, "txt": "Probably because we know enough to make bold, specific predictions.\n\ne.g. WinUI team disbanded is a hell of a lot more surprising prediction than some of the geopolitics predictions (e.g. there will be a war in middle east)"}, {"id": 50667736, "au": "mv4", "dom": 42, "sr": 17, "sc": 2.43, "ep": 4.95, "bs": 2.52, "d": 1, "age": 21.61, "grav": 296.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 75, "qw": 0, "k": 1508, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "driving_self", "flbl": "Driving & Self (Predictions)", "urls": ["https://news.ycombinator.com/item?id=21942835"], "ig": 1.167, "fa": 0.62, "gp": 0.305, "bl": 0.95, "ds": 0.0, "txt": "Interesting idea. The majority of the predictions I came across on HN were binary (X will happen by Y date) and only a few people gave probabilistic predictions like shown here, e.g. about Riemann:\n\nhttps://news.ycombinator.com/item?id=21942835\n\nSo my approach is perhaps less scientific, but I felt that things like Impact (and how many businesses or people may potentially be affected by the prediction) could be more interesting, but this is definitely a work in progress and I would love to hear what other people think!"}, {"id": 50671760, "au": "samtheprogram", "dom": 9, "sr": 18, "sc": 2.31, "ep": 2.46, "bs": 0.0, "d": 0, "age": 15.3, "grav": 169.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1441, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "test_turing", "flbl": "Test & Turing (Human)", "urls": [], "ig": 0.699, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "The thing about the Turing Test prediction is that yes, a few years ago GPT-4 seemed pretty human, but our senses have caught up.\n\nI'm pretty sure most people that interact with AI systems would read GPT-4 output as \"not a human\"."}, {"id": 50672057, "au": "gravypod", "dom": 54, "sr": 19, "sc": 2.22, "ep": 2.44, "bs": 0.0, "d": 0, "age": 14.74, "grav": 159.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 6929, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "search_predictions", "flbl": "Search & Predictions (Huang)", "urls": [], "ig": 0.559, "fa": 0.34, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "By the end of 2026 I will make at least one prediction and it will come true.\n\nI currently don't show up as having predictions so I'm interested in what happens now."}, {"id": 50675374, "au": "modeless", "dom": 24, "sr": 20, "sc": 2.17, "ep": 2.39, "bs": 0.0, "d": 0, "age": 5.69, "grav": 39.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 46139, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fair_based", "flbl": "Fair & Based (Version)", "urls": [], "ig": 0.93, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "I want a version of this expanded to all threads and all users. It would be awesome to have a hindsight accuracy score for every HN user based on every comment they've made. I think you'd find some interesting things."}, {"id": 50671822, "au": "jrmg", "dom": 26, "sr": 21, "sc": 1.9, "ep": 2.26, "bs": 0.0, "d": 0, "age": 15.21, "grav": 167.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 5516, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "driving_self", "flbl": "Driving & Self (Predictions)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.527, "bl": 0.0, "ds": 0.0, "txt": "It would be interesting if you split the predictions into \"poisitive\" and \"negative\" somehow. The e.g. self-driving-car cluster contains everything from \"Self driving will be here next year\" to \"Self driving will not be commonplace in 2050\"."}, {"id": 50677013, "au": "raddan", "dom": 18, "sr": 22, "sc": 1.8, "ep": 2.1, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1304, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "test_turing", "flbl": "Test & Turing (Human)", "urls": [], "ig": 0.891, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Turing test cleverly dodges the fact that we don’t have a good definition for intelligence. Humans seem to have it, whatever it is. If you can’t tell the difference between a machine and a human, then doesn’t the machine also have it?"}, {"id": 50676496, "au": "tovej", "dom": 39, "sr": 23, "sc": 1.54, "ep": 1.98, "bs": 0.0, "d": 2, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 876, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "picked_mine", "flbl": "Picked & Mine (Search)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because this forum is filled with people with a vested interest in certain outcomes. And a large par     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
