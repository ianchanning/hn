1, "useful_pct": 12.5, "terms": "anymore, verify, hand, agents"}, {"slug": "general_commentary", "label": "General Commentary", "count": 7, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "code_repository", "count": 1}, {"category": "general_web", "count": 1}], "story_anchors": ["engineers", "solve", "agent", "software", "systems", "agents", "human", "identity", "system", "trust", "infrastructure", "excited", "models", "space", "code", "hard", "apply", "industry"], "largest_root": {"root_id": 50628552, "author": "fruzz", "slots": 33, "start_dom": 53, "end_dom": 85, "share_pct": 29.5, "top_dom1_age": 4.1, "top_dom1_author": "rippeltippel"}, "buried_cutoff": 34, "rescue_top_k": 22, "ablations": [], "tournament": [], "comments": [{"id": 50630042, "au": "geoctl", "dom": 34, "sr": 1, "sc": 11.37, "ep": 11.37, "bs": 0.0, "d": 0, "age": 9.07, "grav": 75.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 207, "qw": 0, "k": 266, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": ["https://github.com/octelium/octelium"], "ig": 1.963, "fa": 2.08, "gp": 0.573, "bl": 0.0, "ds": 0.0, "txt": "I deeply believe we need some sort of a new Istio for the AI era that unifies identity management and authentication, L7-aware access control, modern structured L7-aware visibility, as well as providing runtime/orchestration infrastructure in a DevOps/GitOps-friendly k8s-like way exactly. Istio somewhat already achieved this for microservices but I think this can be easily extended to provide a unified infrastructure where AI agents, classical microservices/workloads as well as humans can securely access any type of workloads (e.g. internal resources behind NAT anywhere, SaaS resources, deployed k8s containers, etc.) while providing an deployment/orchestration infrastructure for AI agents and workloads. I've been working on a couple of open source projects myself trying to achieve this very same goal for many years now, namely Octelium https://github.com/octelium/octelium as a zero-trust architecture and Cordium for sandboxing, but I think there are also some interesting projects such as kagent, agentgateway, etc... The right building blocks such as k8s for runtime/orchestration as well as providing pluggable storage/networking interfaces, Envoy for building identity-aware proxies, OTEL for visibility, SPIFFE, CEL and OPA, WireGuard/QUIC, microVMs and rootless containers, etc... already exist but there needs to be a modern k8s/Istio to unify all of these into one zero trust arc"}, {"id": 50629202, "au": "lordnacho", "dom": 71, "sr": 2, "sc": 6.38, "ep": 6.38, "bs": 0.0, "d": 1, "age": 9.99, "grav": 87.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 31662, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.493, "fa": 0.56, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "I've felt that way in the past, but not with AI. Roughly speaking, software is making some decisions, executing on them, and looking at what new decisions come up.\n\nThe \"executing on them\" part was often frustrating. Having to spend your attention on little things was exciting in the beginning, but after a couple of decades, you aren't learning that much more, you are just spending your waking hours debugging something that isn't really all that complicated, it just has a small logic error in it somewhere.\n\nWith AI you are doing only the essential part of engineering, which is to exercise judgement. I can both do that for longer each day, and at a level of concentration that previously required me to carefully schedule my time. What I mean is, it's my experience that technically deep things needed to be done at specific hours when I was most awake, whereas the decisions that really mattered actually can be done at almost any hour of the day.\n\nThis might sound surprising, but the important decisions are normally the ones that are supported by all your experience and all the evidence from the project. The technical deep dives tend to be specific, \"this is broken because of this specific choice in this project, we just need to fix it\" kinda things."}, {"id": 50634787, "au": "ionetan", "dom": 112, "sr": 3, "sc": 6.01, "ep": 6.01, "bs": 0.0, "d": 1, "age": 3.81, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 101, "qw": 0, "k": 37, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": ["https://epiq.sh"], "ig": 1.494, "fa": 0.62, "gp": 0.502, "bl": 0.0, "ds": 0.0, "txt": "I use OpenShell to wrap up my agents and only whitelist the access they need, and never expose secrets to them, as secrets live in a proxy layer. A non-agent dispatcher (no LLM, so there's nothing to prompt-inject) in charge of spawning new agent sessions.\n\nThe control plane / issue tracker is one I've built myself (open source on GH https://epiq.sh ), and although it does not solve the problem of approving weeks of autonomous work, it helps out in the process, as you can follow the agents work on the board and on the code in real time (or view it after the fact via time-travel)."}, {"id": 50629868, "au": "itsrathercomple", "dom": 87, "sr": 4, "sc": 5.49, "ep": 8.01, "bs": 2.52, "d": 0, "age": 9.26, "grav": 78.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 63, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.895, "fa": 0.76, "gp": 0.957, "bl": 0.95, "ds": 0.0, "txt": "> We need proper authentication and authorization to identify agents, let them work together, enable them to take the actions they should, and prevent them from taking the actions they shouldn't. Security and proper isolation are critical for untrusted code and content. And we've gotta have monitoring and the ability to stop a system in its tracks when it's veering into the wrong territory.\n\nYou need authn, authz, security and logging. You are excited?\n\nSometimes I don't get people what excites people in software dev. 90% of it feels like plumbing. Some observability here, some authn there. Database? Yap and they need to be replicated using some kind of distribution scheme which, while technically impressive, are all incredibly unsexy and very plumb-y. Caching, IAM, APIs, health metrics, dashboards...\n\nI absolutely love the pleasure of beautiful, minimal architecture with the bare minimum of maximally orthogonal moving parts. Compositions out of reusable functionality, all dancing in a gorgeous harmony of song and dance. Seeing the engine roar to life in a celestial symphony inviting you to look at its majesty filling you with awe and inspiration for a better world.\n\nThen come the devops and security people, project managers, agile scrumlords and their ceaseless fascination for externalizing trivialities, the kanban boards and status reports.\n\nI know.. I am the problem. We're \""}, {"id": 50636357, "au": "jwpapi", "dom": 11, "sr": 5, "sc": 5.34, "ep": 5.34, "bs": 0.0, "d": 2, "age": 1.47, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 237, "qw": 0, "k": 906, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.711, "fa": 0.28, "gp": 0.358, "bl": 0.0, "ds": 0.0, "txt": "It’s not one thing, but a lot of things.\n\nI want a certain folder structure (custom linting rules)\nI want low complexity, I want one function per file \nI really want to trust my ci pipeline and e2e tests.\n\nI want monitoring, alerts on my phone when any unit economics move (even ads etc).\n\nNothing freaky, mainly proper monitoring, alerts, wide logging and I think the 'newest' part is my reviewer model, for every feature I usually launch a reviewer with it, that looks into customer journeys once to twice a day if something unexpected happens that we couldn’t solve before. This is in particular useful for AI workflows, as these are tricky to get right from the get go.\n\nI then also did monitoring on my reviewers if as I would hope they find less over time. Later I needed to optimize the cost of all that infra. I needed to think about proper naming. It’s really a lot of things that totally sound like groq overcomplicating now, but the guardrails, data models and unit economics I really think through in a way that they guarantee what I want them to guarantee. I’m not saying my approach is the best and I’m not even recommending my approach to others, I would just say it should be considered in building the pipeline versus building the software, but it totally depends as everything. For me in web application development it’s been right so far.\n\nIt’s more of a philosophy approach and wh"}, {"id": 50630925, "au": "reallyreason", "dom": 63, "sr": 6, "sc": 5.29, "ep": 5.44, "bs": 0.0, "d": 5, "age": 8.12, "grav": 64.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 14, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 1.551, "fa": 0.28, "gp": 0.687, "bl": 0.0, "ds": 0.0, "txt": "The OpenAI models are, I think, by far the worst in this respect now of the major players. I really think they are far behind Anthropic and Google in qualitative use aspects at this point because they have been focusing too much on benchmarks and whatever frail impression of \"engineering discipline\" they are trying to teach it that causes it to try to put arbitrary limits on everything.\n\nI haven't tried GPT-6.2 yet because GPT-6.1 was so bad I cancelled, but the thing that I think makes the GPT language so difficult to parse is that it coins phrases for things constantly. Oh oh, right, the \"bounded glipglop service queue,\" how could I have forgotten about that..."}, {"id": 50628657, "au": "skeeter2020", "dom": 79, "sr": 7, "sc": 5.06, "ep": 5.35, "bs": 0.0, "d": 1, "age": 10.61, "grav": 95.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 7371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 1.369, "fa": 0.34, "gp": 0.805, "bl": 0.0, "ds": 0.0, "txt": "Solving a giant set of hard problems CREATED by the new technology, with no support from leadership and no interest in engineering fundamentals while companies actively try to use AI as a cost cutting strategy to reduce the number of people involved and the top 1% hordes eye-watering wealth... There are a few software developers excited - for now."}, {"id": 50628921, "au": "visarga", "dom": 40, "sr": 8, "sc": 5.05, "ep": 5.05, "bs": 0.0, "d": 0, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 13944, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.729, "fa": 0.0, "gp": 0.682, "bl": 0.0, "ds": 0.0, "txt": "I want to add one more fundamental problem - testing generated code. My observation is that testing is hard because it requires imagining execution, which is theoretically impossible (halting problem). Instead of doing that we could build multiple replicas and fuzz or use prod data to detect execution divergence. So we replace imagined code execution with just execution, which is a much better position to be in.\n\nGenerating replicas can be done in parallel and might not take more time. But in order for differential execution to detect bugs we need to control all inputs. That is a big problem to solve over UIs, APIs, stochastic LLMs, stateful systems and humans in the loop. It is not trivial to replay the same task in conditions where a divergence in outcomes shows a bug. We need to wrap the agent completely on all sides, control every input. That is close to the security sandbox problem but different."}, {"id": 50634524, "au": "rippeltippel", "dom": 1, "sr": 9, "sc": 5.04, "ep": 5.04, "bs": 0.0, "d": 0, "age": 4.14, "grav": 26.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 914, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.547, "fa": 0.0, "gp": 0.966, "bl": 0.0, "ds": 0.0, "txt": "I am currently job hunting and the identity crisis is real. Some interviewers want candidates to go agents all the way down, summoning code fire-and-forget. Other ones require checking all the generated code before each commit. I sit in the middle of that spectrum and, since there's no consolidated right or wrong practice and no one knows in advance what any interviewer would prefer, interviews are now mostly a matter of luck. The problems mentioned in the article seem to me a consequence of that crisis: how much agency should agents have? The spectrum of possibilities is wide and mostly discretional."}, {"id": 50636755, "au": "daxfohl", "dom": 27, "sr": 10, "sc": 4.74, "ep": 4.74, "bs": 0.0, "d": 0, "age": 0.78, "grav": 6.3, "surf": 13.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 5698, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.56, "fa": 0.34, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "I think we're going to the point where engineering is no longer the bottleneck. It's not even Product per-se: it's users not needing new features that fast. Ever since we got code review and CI streamlined, our org has been pushing out changes usually within a day of receiving the PRD, and spending about 70% of our time cleaning up old tech debt and improving the infrastructure. Soon enough we'll be running out of things to keep everyone busy.\n\nI kinda wonder how much that last step in this blog post really matters. When you're already able to do everything and more with 1/10 of the engineering staff, going that last mile is a pretty big step with relatively less value."}, {"id": 50628883, "au": "refactor_master", "dom": 23, "sr": 11, "sc": 4.7, "ep": 4.7, "bs": 0.0, "d": 0, "age": 10.37, "grav": 92.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 1173, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.979, "bl": 0.0, "ds": 0.0, "txt": "I’d like to pretend I’m doing real engineering with real insights in my org. Working with a single agent speeds up my code greatly, but I’m still limited by many micro decisions every day; do we want this feature? Do we want to maintain it? Who’s going to monitor it? Monitor what? Who’s going to review all this? Does it bring value for the company or is it just “internal cool stuff that makes no money”?\n\nI could rewrite a pipeline from Python to Rust in a single prompt. But what would I gain? It runs at 2 AM when nobody looks at it.\n\nI wonder where agent swarms fit into this."}, {"id": 50629319, "au": "Trasmatta", "dom": 103, "sr": 12, "sc": 4.66, "ep": 4.66, "bs": 0.0, "d": 0, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 5, "k": 9238, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.063, "fa": 0.42, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "> Software engineers should be excited\n\nI don't like being told how I should feel. I am NOT excited by those problems listed. Those are not the problems I got into the industry to solve. And they're not going to be \"solved by engineers\" anyway - those problems will also just be fed into the new AI agent loop based engineering flow anyway, with giant slop PRs that nobody reads."}, {"id": 50629168, "au": "arbor-group", "dom": 52, "sr": 13, "sc": 4.55, "ep": 4.55, "bs": 0.0, "d": 0, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 1, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.562, "fa": 0.0, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "The part that rings true for me is how the work shifts from writing code to deciding what is worth building and then proving it works. An agent can rewrite a pipeline in a prompt, but that does not tell me whether the rewrite was needed, whether it preserves the edge cases I learned about the hard way, or whether anyone will notice the difference. That is why testing generated code feels like the real new problem, not a side task: without a good test suite and a clear spec, I am just reviewing output faster instead of understanding the system better. For a solo builder that trade-off is sharp, because there is no second engineer to catch what I miss while I am context-switching between prompts. I am less interested in agents that solve more problems for me than in workflows that make the verification step cheaper and more reliable."}, {"id": 50629634, "au": "darkwater", "dom": 30, "sr": 14, "sc": 4.49, "ep": 4.49, "bs": 0.0, "d": 0, "age": 9.52, "grav": 81.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 7777, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.979, "bl": 0.0, "ds": 0.0, "txt": "The interesting problems listed there are just for very big enterprises, or for the LLM providers, or at most some new startup that will try to sell the solutions to the shop that previously employed a few tens/hundreds of software engineers.\n\nI still believe that it won't be a massacre as many are currently believing in terms of jobs slashing, because we will also produce more (and hopefully better) software, but agents ecosystem is software in itself so we are at the \"machines that build machines\" stage already."}, {"id": 50629659, "au": "markus_zhang", "dom": 72, "sr": 15, "sc": 4.4, "ep": 5.06, "bs": 0.0, "d": 1, "age": 9.49, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.512, "fa": 0.28, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "I feel the same so I separate work and hobbyist coding and apply different AI strategies.\n\nFor work I really don’t care. The company doesn’t care either. The CTO specifically wants us to be fast. So I prompted and checked a it and let it go into the PR drain, which got approved by someone else without even reading what it does.\n\nFor my personal project I took great pain to limit AI to discussion, guidance (because it is technically challenging) and plan review. LLM doesn’t code anything or even write any comment. I only use ChatGPT to make sure it has absolutely no way to write any code or comment for me if I were somehow too lazy."}, {"id": 50634769, "au": "jwpapi", "dom": 9, "sr": 16, "sc": 4.27, "ep": 4.42, "bs": 0.0, "d": 0, "age": 3.83, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 906, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 0.885, "fa": 0.34, "gp": 0.947, "bl": 0.0, "ds": 0.0, "txt": "A couple of weeks ago a comment here triggered me: \"What would need to be true so you wouldn’t need to verify what the agents are doing by hand anymore?\". Whilst first annoyed, 3 days later it clicked. Since then this became my guiding principle and I’m building infrastructure and not code anymore, continuously delivering more value to my customers.\n\nIt’s fun, interesting and challenging."}, {"id": 50628552, "au": "fruzz", "dom": 53, "sr": 17, "sc": 4.09, "ep": 4.53, "bs": 0.0, "d": 0, "age": 10.72, "grav": 97.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 409, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.822, "fa": 0.34, "gp": 1.124, "bl": 0.0, "ds": 0.0, "txt": "I'm just tired.\n\nI've been at this for 18 years, and every new innovation has had me do more in less time. It's compressed my day, taken the natural breaks that let me breathe, and I'm still stressing about rent at the end of the month (I don't make American wages.)\n\nSo no, I'm not excited. I'm exhausted."}, {"id": 50629937, "au": "AlexKalWork", "dom": 41, "sr": 18, "sc": 4.02, "ep": 4.24, "bs": 0.0, "d": 0, "age": 9.19, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 0, "k": 8, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.426, "fa": 0.0, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "Something does not make sense for me when I read posts like that. If we assume that coding (and a lot of white collar knowledge work) is solved and that we have a highly intelligent machine that we can ask it to prove RH, what exactly stops me from spinning up an agent swarm to solve the problems mentioned in this article? What makes these things so fundamentally hard to solve that a swarm of highly intelligent AIs that can fit whole books worth of context in its working memory can't solve and I will be needed? I also see this a lot now in the form of \"Architecture matters\" or \"Strategy Matters\" if again we assume that we have a 140IQ machine that can reason why can't I just ask it to \"Architecture X, make no mistakes\"? I don't claim that those assumptions are true right now but I don't understand people who do and they think that for some reason the replacement will stop at abstraction layer N and humans will always be better at layer N + 1."}, {"id": 50631045, "au": "nsypteras", "dom": 8, "sr": 19, "sc": 3.61, "ep": 3.83, "bs": 0.0, "d": 0, "age": 7.99, "grav": 62.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 328, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.201, "fa": 0.0, "gp": 0.692, "bl": 0.0, "ds": 0.0, "txt": "While I don’t necessarily disagree with the sentiment that there are interesting problems to be solved, I think the phrasing “software engineers should be excited” lacks some necessary empathy. A more compelling message would be “here are some new areas I find super interesting and why”. The reason why empathy is needed is made clear by the comments that reasonably push back on this article."}, {"id": 50631225, "au": "yturijea", "dom": 46, "sr": 20, "sc": 3.51, "ep": 3.95, "bs": 0.0, "d": 0, "age": 7.8, "grav": 60.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 37, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.393, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "Writing code is/was fun, but I have always been at it designing the system as an architect anyway, so AI vs no AI is really much of the same.\n\nNow I can just create services much quicker and get much more concrete feedback working with an agent.\n\nHowever one of the bigger problems is to setup environments with the agent, without sharing any secrets with the agent, so in that space, you still need to do the grunt work yourself obviously. Anyone sharing their secrets with an agent is inherently waiting to be exploited. So you should always run your agent in a containerized env, only giving it read and write to what it needs, nothing more.\n\nFor our organisation I have done exactly that, so everyone can work with agents in what we see as the best balance between safety with infrastructure and still not losing too much productivity, which also forces a certain amount of human oversight to development."}, {"id": 50634960, "au": "magus-stoopr", "dom": 48, "sr": 21, "sc": 3.5, "ep": 3.94, "bs": 0.0, "d": 0, "age": 3.57, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 21, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.56, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "one of those problems is really easy to solve on its own\n\nagent authentication should use a one-time pad: meaning, the spawning agent creates a random string, hands it off at creation time to the sub-agent, all communication between them is fully/strictly encrypted, and the random string, [completely unhackable unless read or accessed by another], is the only valid future authentication method\n\none problem solved!\n\n[tongue firmly in cheek here]"}, {"id": 50635504, "au": "leptons", "dom": 101, "sr": 22, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 0, "age": 2.83, "grav": 17.1, "surf": 5.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 36, "k": 2165, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.876, "fa": 0.42, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": ">But software engineers have to solve all these problems if we're going to actually unlock that power and enable the world to trust it to create good outcomes like cured diseases rather than bad outcomes.\n\nThis only makes the wealthy even more wealth and probably won't cure anyone that lost their job because AI took it and now they have no health insurance. Sorry but AI solving anything has no benefit to me if I can't feed me and my family."}, {"id": 50637102, "au": "hi_hi", "dom": 12, "sr": 23, "sc": 3.21, "ep": 3.5, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 973, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 1.393, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "Please keep spreading this message. There was another thread recently that echoes this. You are now an architect. The quality of the code is no longer directly a thing you control, but you need to be able to verify the quality. The abstraction has moved up (again), adjust accordingly.\n\nIt sucks for people who largely want to be left alone to live in their own heads, writing code and understanding things at a deeper level. It’s great for people who have broader interests and curiosity."}, {"id": 50629854, "au": "vanuatu", "dom": 37, "sr": 24, "sc": 3.19, "ep": 3.63, "bs": 0.0, "d": 0, "age": 9.27, "grav": 78.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 327, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.163, "fa": 0.0, "gp": 0.62, "bl": 0.0, "ds": 0.0, "txt": "just fyi this is from the head of platform at ant, so it's the new set of problems for engineers (working on platforms that serve or utilize agents) to solve, not a general statement on what all engineers are going to do\n\nim confused by the people here saying they're only doing the drudgery with AI doing the 'hard' parts. since AI i have only been tackling harder and more ambitious problems and automating the rest"}, {"id": 50634535, "au": "alex_suzuki", "dom": 91, "sr": 25, "sc": 3.03, "ep": 3.25, "bs": 0.0, "d": 1, "age": 4.12, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1910, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.972, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Then, takes a swim in their newly acquired IPO wealth.\n\n96% of Anthropic employees are sitting on 1M+ post-IPO. Maybe that makes these things “exciting” to them."}, {"id": 50628911, "au": "adamtaylor_13", "dom": 47, "sr": 26, "sc": 3.01, "ep": 3.67, "bs": 0.0, "d": 0, "age": 10.34, "grav": 92.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 1276, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "I'm not super interested in the new problems, so much as I'm very interested in solving the old problems better, faster, stronger.\n\nThere are still big challenges to be solved in traditional software development with AI-assistance and IMO delighting the client is still the most fun part of my job; as long as agents keep helping me do that I'm still on for the ride."}, {"id": 50631418, "au": "0xbadcafebee", "dom": 109, "sr": 27, "sc": 2.9, "ep": 6.61, "bs": 3.05, "d": 0, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 473, "qw": 92, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 2.07, "fa": 0.34, "gp": 0.534, "bl": 1.15, "ds": 0.0, "txt": "> They can go idle for arbitrary amounts of time between bits of work, and they spend a lot of time waiting on tools, model inference, other agents, or human input. Some workloads need fast startup times, others need to avoid wasting compute, and others need crazy scale.\n\nSo it's a CI/CD workload. Sits around until action is needed, can spin for hours, requires fast start times and massively parallel work, takes occasional human input, is triggered by external signals. They aren't stateful though; AI agents literally are stateless HTTP request/response clients with state stored in files between turns (which could easily be in a DB instead). They're so stateless you can literally fork their progress at any point.\n\n> Agent authorization as a problem space is much more wide open - what do you allow an agent to do?\n\nAllow agents to do anything they want, in a sandbox. Read-only access to the world, but write access is sandbox-only. They pull in any information they need, but can only scaffold a solution in a protected space. Once it looks like the task is accomplished (after many automatic checks), they'd ping a human to review the sandbox. The human either instructs the agents to continue refining work, or commits the work back into the real world.\n\n> how does the human meaningfully approve what their agent can do?\n\nIf the human can't understand what the agent is doing, it can't a"}, {"id": 50636542, "au": "markus_zhang", "dom": 5, "sr": 28, "sc": 2.71, "ep": 2.86, "bs": 0.0, "d": 3, "age": 1.17, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 1.218, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I do use LLM with full power in work. I don’t care anymore. The whole team doesn’t care anymore.\n\nI only limit its usage in my personal project, because I’m sort of a “need to know why” person, not a “built this cool thing” person. LLM can accelerate the later, but for the former I still need to use as much as my brain as possible."}, {"id": 50636224, "au": "jcims", "dom": 13, "sr": 29, "sc": 2.64, "ep": 3.96, "bs": 0.0, "d": 2, "age": 1.72, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 15873, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.559, "fa": 0.0, "gp": 0.207, "bl": 0.0, "ds": 0.0, "txt": "For me it was just start doing it.\n\nTUIs help here.\n\nIt’s going to fail, catastrophically at times, so start in low risk ventures.  Build up a workflow that covers the key priorities explicitly.  Create constraints to manage scope.  Inform the models as best you can about ecosystem, environment, controls.  Mix model providers if you can. Test, test and retest.  Embrace your role as conjurer."}, {"id": 50629894, "au": "m0llusk", "dom": 110, "sr": 30, "sc": 2.37, "ep": 3.03, "bs": 0.0, "d": 0, "age": 9.23, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 3502, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.288, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This really misses the point.  Going extremely fast means giving up on comprehension which really changes what can be produced.  So called AI has resulted in managers insisting that workers do what ChatGPT told them should be done.  The new problems are not so much with the tooling but with the valuation of speed over quality and the batshit behavior of high level managers which has gone from common to standard."}, {"id": 50633399, "au": "kixiQu", "dom": 39, "sr": 31, "sc": 2.36, "ep": 3.24, "bs": 0.0, "d": 0, "age": 5.34, "grav": 36.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2423, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "I'm a bit suspicious of the Giant Fleets of Agents stuff. I can't seem to find pragmatic non-slop write-ups of folks getting value from them in the way that e.g. simonw covers his workflows. This piece seems to take it as axiomatic that that's the direction."}, {"id": 50631611, "au": "ddellacosta", "dom": 89, "sr": 32, "sc": 2.23, "ep": 6.24, "bs": 3.58, "d": 0, "age": 7.33, "grav": 55.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 189, "qw": 0, "k": 699, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 1.608, "fa": 0.5, "gp": 0.718, "bl": 1.35, "ds": 0.0, "txt": "This is making tons of non-validated assertions about where the field is going. As far as I can tell these software factories/multi-agent swarms/whatever are absolutely not proven out as a model for building software, and have so far caused as many problems as they've solved. Dropping an agent into a production system is still madness as far as I'm concerned, let alone ten or a hundred, when we haven't even come close to figuring out all the security implications. And \"alignment\" is a nonsense term that gives these frontier model companies a framing that allows them to remove themselves from the chain of responsibility in a way that implies the models themselves have independent agency--they do not and should not, and we should not be allowing these companies to dictate the narrative to the rest of us. It's a psyop folks.\n\nAs someone else pointed out this person has an agenda: they lead platform engineering at Anthropic. Leaving aside how tone-deaf the piece is I wouldn't trust any assertion they make around this--Of COURSE they want this to be the model. However, the future of how we will produce software is far from decided."}, {"id": 50636163, "au": "voidfunc", "dom": 15, "sr": 33, "sc": 2.14, "ep": 3.68, "bs": 0.0, "d": 3, "age": 1.82, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 10030, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.472, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "This has been my experience as well. Once you build up a goal state and a testing / experimentation apparatus that gives enough observability that they can move closer to the goal state without human interpretation of results then the closer you are to just letting them go.\n\nWhat I'm finding challenging tho is aligning teams using agents on this. Teams of people right now are a mess without everyone running their own bespoke process and agents and you get vast varying levels of output quality."}, {"id": 50629113, "au": "Trasmatta", "dom": 67, "sr": 34, "sc": 2.13, "ep": 3.67, "bs": 0.0, "d": 3, "age": 10.09, "grav": 88.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 9238, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.42, "fa": 0.0, "gp": 0.231, "bl": 0.0, "ds": 0.0, "txt": "Not to mention the total loss of the human aspect that comes from managing people. Humans evolved to be inherently social, and replacing your team of humans with a team of robots makes the entire thing feel empty and meaningless.\n\nI know that managing humans can suck a lot and not everyone likes working with people, so this is of course a generalization. But I think there's something fundamental and important we're losing by replacing our human teammates with machines."}, {"id": 50636354, "au": "globalnode", "dom": 4, "sr": 35, "sc": 2.11, "ep": 3.28, "bs": 0.0, "d": 2, "age": 1.47, "grav": 9.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 717, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I used to be like this until I finally accepted we are living in a new world now. With LLM help, programs get completed faster (and sloppier) than before, and if that's what managers want, then that's what managers get. Rather than lament the loss of artisanal programming you can kind of embrace it. Think of the awesome mathematics and software that runs these bots, think of the increased productivity, and at the end of the day, you are still a software developer and realistically the only one capable of verifying, debugging and guiding the LLM to a finished product. Someone with no software skills can't do it, they'll get lost in the weeds for months trying to debug it.\n\nWhat I'm trying to say is its not the end of programming, it's the evolution of programming. When I think of personal projects I've been wanting to do for years but never get done because of scope, I start to wonder if they may be possible now."}, {"id": 50631444, "au": "Multicomp", "dom": 35, "sr": 36, "sc": 1.88, "ep": 3.12, "bs": 0.0, "d": 1, "age": 7.54, "grav": 58.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2644, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree, current vendor offerings include tailscale+border0 but while that handles zero trust networking and access control (tailscale with its capabilities features) and some credential proxying and policy-based 'who can access what secrets') from border0, the monitoring and metrics still are unsolved problems."}, {"id": 50634533, "au": "TeMPOraL", "dom": 32, "sr": 37, "sc": 1.83, "ep": 3.08, "bs": 0.0, "d": 1, "age": 4.13, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.311, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not to mention, these problems are interesting for a very specific subset of software engineers. For me, personally? They're the literal definition of boring.\n\nI'm not excited. Fortunately, I mostly processed that a decade ago. I gave in and accepted that well-paid work in this space is plain mind-dumbingly boring if you're not in puzzles for puzzles' sake, but needs to be done and pays. It's work, after all."}, {"id": 50635739, "au": "hungryhobbit", "dom": 6, "sr": 38, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 1, "age": 2.5, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 1738, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.373, "fa": 0.0, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "Hasn't it always been like this.  Long before AI, you'd go to an interview and be asked \"OOP or Functional?\" (I'm a JS dev; we have a choice in style).\n\nThere wasn't one right answer, just the right answer for that shop (do they write their JS OOP-style or Functional-style?).  Or maybe they'd ask about React vs. Angular, Styled Components vs. Tailwind, etc. ?\n\nWon't this always be the way ... at least as long as different shops have different opinions (and don't publish them in the job posting)?"}, {"id": 50635414, "au": "Kuyawa", "dom": 51, "sr": 39, "sc": 1.8, "ep": 2.9, "bs": 0.0, "d": 0, "age": 2.97, "grav": 17.9, "surf": 5.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "We need new OSes. New programming languages. New browsers. New app sandboxes. New UI libs. New Harnesses. New AI tools. New server tools. New repo managers. New diff trackers\n\nThere is so much to build"}, {"id": 50629163, "au": "reallyreason", "dom": 56, "sr": 40, "sc": 1.76, "ep": 2.86, "bs": 0.0, "d": 3, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 14, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "A person would also never speak to me in the absolutely insane way an AI agent writes. It is incredibly mentally taxing just parsing these AI responses and trying to extract the essential information. Not everything needs to be a five paragraph dossier in PhD voice."}, {"id": 50635719, "au": "brahadeesh", "dom": 14, "sr": 41, "sc": 1.75, "ep": 2.2, "bs": 0.0, "d": 2, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 169, "kpp": 9.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 0.862, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "Not OP, but giving agents a way to verify their work is key. The closer to the real-world workflow they can run the better. How easily/efficiently they run it also matters."}, {"id": 50634281, "au": "bsoles", "dom": 97, "sr": 42, "sc": 1.7, "ep": 2.8, "bs": 0.0, "d": 0, "age": 4.48, "grav": 28.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 5, "k": 1078, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.563, "fa": 0.42, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "> Software engineers should be excited.\n\nBeatings will continue until morale improves.\n\nAll of these \"exciting\" problems are accidental complexities that AI brought upon us. They are nothing to be excited about."}, {"id": 50629046, "au": "karmakurtisaani", "dom": 55, "sr": 43, "sc": 1.7, "ep": 3.24, "bs": 0.0, "d": 2, "age": 10.17, "grav": 89.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.155, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "They claim managing agents is like managing people, but I don't find that to be the case at all. People would push back, question, stick to key points and tell you once things are ready to release. LLMs just floods you with information that you're supposed to keep track of and use to make good decisions. It gets exhausting very fast."}, {"id": 50631682, "au": "throw-the-towel", "dom": 88, "sr": 44, "sc": 1.67, "ep": 2.92, "bs": 0.0, "d": 1, "age": 7.24, "grav": 54.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 31, "k": 1395, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.733, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I absolutely love the pleasure of beautiful, minimal architecture with the bare minimum of maximally orthogonal moving parts. Compositions out of reusable functionality, all dancing in a gorgeous harmony of song and dance.\n\nWhen AI coding just became viable I was excited because I thought I'd get to keep all that, and leave the necessary minutiae to the AI. Sadly, it turned out economic incentives don't allow for that."}, {"id": 50631649, "au": "vander_elst", "dom": 95, "sr": 45, "sc": 1.66, "ep": 2.76, "bs": 0.0, "d": 0, "age": 7.28, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 802, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.969, "fa": 0.0, "gp": 0.334, "bl": 0.0, "ds": 0.0, "txt": "Sorry for the bad tone, but I really wonder if all the people who are excited about the new state of things, actually carefully look and understand the output (in terms of code and artifacts). And also I wonder if the context switching is taken into account."}, {"id": 50636152, "au": "rippeltippel", "dom": 7, "sr": 46, "sc": 1.63, "ep": 3.17, "bs": 0.0, "d": 2, "age": 1.84, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 914, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.348, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sort of, but not quite. At least in my experience, job descriptions used to mention functional programming (when required) and the tech stack, including frameworks. They also mentioned work paradigms, e.g. Agile/Lean. Now they just say \"AI-native\", a catch-all term that means nothing specific. It's human slop."}, {"id": 50632468, "au": "marcosdumay", "dom": 77, "sr": 47, "sc": 1.61, "ep": 3.15, "bs": 0.0, "d": 5, "age": 6.39, "grav": 46.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 32418, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Several kinds of prompts for finding issues or making suggestions to improve the code. I didn't notice a lot of difference from one prompt to another.\n\nI do put the experience as a net positive. But I do question everybody that comes with that common \"I have tons of experience on this and LLMs do great all the time\" comment you see often around here."}, {"id": 50628924, "au": "reallyreason", "dom": 54, "sr": 48, "sc": 1.57, "ep": 3.11, "bs": 0.0, "d": 1, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 14, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.236, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Me too. When agents do all the hard and interesting work, the only thing left for me is a constant slog of minutia. It's all I can do to work through prompt after prompt after response after response all day, constantly context-switching, at a faster pace than my brain can adapt, just to keep the flywheel spinning.\n\nManagement used to say \"use AI to reduce your toil\" but what it's actually done is reduced my job to toil. It's been months of this, with nothing interesting to do or even slightly engaging. I'm so tired."}, {"id": 50629521, "au": "irishloop", "dom": 36, "sr": 49, "sc": 1.42, "ep": 2.52, "bs": 0.0, "d": 0, "age": 9.64, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 871, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.724, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "These are fun problems if you happen to like the DevOps side of things. I am not sure that holds true for all SWE's. I am personally not that interested in identity and security."}, {"id": 50635740, "au": "a34729t", "dom": 82, "sr": 50, "sc": 1.35, "ep": 2.89, "bs": 0.0, "d": 2, "age": 2.5, "grav": 15.0, "surf": 6.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 440, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Every very senior IC who is respected (apart from the politicans) at my very large tech employer looks exhausted and the rest of the ICs are either tired and/or have stopped caring. Good times ahead!"}, {"id": 50629109, "au": "g-b-r", "dom": 99, "sr": 51, "sc": 1.25, "ep": 2.35, "bs": 0.0, "d": 0, "age": 10.1, "grav": 88.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.69, "fa": 0.0, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "Yey, engineers should be so excited that there's not two, not three but FOUR problems to solve before becoming completely useless!"}, {"id": 50629800, "au": "markus_zhang", "dom": 74, "sr": 52, "sc": 1.18, "ep": 2.72, "bs": 0.0, "d": 3, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 1.156, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah they are definitely better than me on topics such as kernel programming and such. However, I don’t have the technical skills to evaluate them —- but so far I think they are pretty good.\n\nDespite being indeterminate, they can also read a repo and pinpoint the code that I overlooked. So far I haven’t found cases of obvious hallucinations."}, {"id": 50635761, "au": "avgDev", "dom": 2, "sr": 53, "sc": 1.07, "ep": 2.61, "bs": 0.0, "d": 1, "age": 2.46, "grav": 14.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4727, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "This is where I am at. I've been using ChatGPT/Codex for a bit now. There are things I don't do proper code review on. I do some manual tests. However, there are some things I review in detail.\n\nI would never trust the agents to just run wild.\n\nHonestly, I would hate to be interviewing right now. I also don't see a point to grind leetcode at all."}, {"id": 50636665, "au": "kodoman", "dom": 64, "sr": 54, "sc": 1.06, "ep": 3.23, "bs": 0.85, "d": 6, "age": 0.92, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 255, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yes they make my eyes go squiffy, Once I understand what it means it it does what I want it to quite well and been impressed with the what it can do for the price (been the best value).\n\nClaude will just use the same formulaic speech and it gets annoying but I agree actually easier to parse even if it can be verbose.\n\nOn an aside I still don't think we are actually where these AI companies are claiming we are writing good software without developers, it feels like these things need a lot of babysitting. Everyone I have seen who is doing the agent swarms is either doing tests or researching vulns (kind of like a very good but expensive fuzzer really) or they seem to be entering some kind of AI psychosis where they have not actually built anything useful but are burning tokens doing nothing and thinking they are lord of the machines, while spitting out garbage."}, {"id": 50629862, "au": "chrisbrandow", "dom": 104, "sr": 55, "sc": 1.05, "ep": 1.42, "bs": 0.0, "d": 1, "age": 9.27, "grav": 78.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1068, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 0.604, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A statement like this by the author is such a tell about how narrow and naive their perspective is. The whole post is a long way of saying, “As an engineer, I like working this way. You are an engineer, so you would like it too!”\n\nIf you don’t see the fallacy, you’re telling on yourself."}, {"id": 50631965, "au": "yCombLinks", "dom": 90, "sr": 56, "sc": 1.05, "ep": 2.26, "bs": 0.0, "d": 0, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1063, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.761, "fa": 0.0, "gp": 0.321, "bl": 0.0, "ds": 0.0, "txt": "Says there are lots of interesting new problems to solve : proceeds to list extremely boring problems with very narrow applications."}, {"id": 50629711, "au": "pmg101", "dom": 68, "sr": 57, "sc": 1.05, "ep": 1.98, "bs": 0.0, "d": 4, "age": 9.44, "grav": 80.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 802, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.842, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Am I the only one who finds robot devs much easier to manager than human ones? I felt I was always fighting my way through layers of poorly understood social convention just to get anything done. Now I find it so much less stressful."}, {"id": 50628741, "au": "liam_grossmann", "dom": 111, "sr": 58, "sc": 1.05, "ep": 4.49, "bs": 2.52, "d": 0, "age": 10.51, "grav": 94.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 1.714, "fa": 0.0, "gp": 0.321, "bl": 0.95, "ds": 0.0, "txt": "On authorization: in the systems I've worked on (banking, mostly), the answer that held up was to never let the caller decide what it's allowed to do. The agent's login can execute a few fixed stored procedures and nothing else. Every table is denied, masking and row-level security apply per caller, and every call is written to an append-only ledger table that no one can edit, sa included. It's old, boring database security, but it means a prompt-injected agent can only get what those procedures return. The on-behalf-of consent problem is harder. I don't think anyone has a good answer yet for \"approve weeks of autonomous work\"."}, {"id": 50636127, "au": "webdood90", "dom": 31, "sr": 59, "sc": 1.05, "ep": 1.96, "bs": 0.0, "d": 1, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 423, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.835, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I work at a not-sexy start up of a dozen folks and we've decided not to seek additional funding because we're able to move fast enough with AI.\n\nI think it's absolutely impacting the market in a big way - it doesn't always look like layoffs."}, {"id": 50628923, "au": "weakfish", "dom": 24, "sr": 60, "sc": 1.05, "ep": 1.91, "bs": 0.0, "d": 1, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1676, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.713, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Same experience here. Multi-agent swarms mean I can build the wrong thing faster if I want... but I still spend most of my time figuring out what the right thing to build is."}, {"id": 50632080, "au": "markus_zhang", "dom": 76, "sr": 61, "sc": 1.05, "ep": 1.91, "bs": 0.0, "d": 4, "age": 6.79, "grav": 50.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 0.812, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Just curious what kind of question did you ask LLM? So far my experience is OK, but maybe that’s because I don’t know the topic enough —- but then again, if I know enough I wouldn’t need to ask in the first place."}, {"id": 50635976, "au": "bigstrat2003", "dom": 22, "sr": 62, "sc": 1.05, "ep": 1.89, "bs": 0.0, "d": 1, "age": 2.1, "grav": 12.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.806, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would need them to actually be able to understand things, instead of predicting the next token. Since the latter is intrinsic to what LLMs are, I will never be able to trust them."}, {"id": 50629753, "au": "pmg101", "dom": 73, "sr": 63, "sc": 1.05, "ep": 1.84, "bs": 0.0, "d": 2, "age": 9.38, "grav": 79.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 802, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.559, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "LLMs are great conversation partners on technical discussions, aren't they? What we used to call rubber ducking, turned up to 11. They often raise a lot of food for thought, I find. It does slow me down but I reach a better design, often."}, {"id": 50629751, "au": "hax0ron3", "dom": 65, "sr": 64, "sc": 1.05, "ep": 1.83, "bs": 0.0, "d": 4, "age": 9.38, "grav": 79.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.7, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "When AI does that, I tell it to explain things more simply. Or I guide it in other ways to reformulate what it's saying in a way that is easier for me to understand. It still tends to lean on the side of being very information-dense in its words, even after that. But I can usually get it to change its explaining approach to something that I can understand."}, {"id": 50636556, "au": "0c3ca83", "dom": 21, "sr": 65, "sc": 1.05, "ep": 1.82, "bs": 0.0, "d": 1, "age": 1.14, "grav": 7.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 838, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_companies", "flbl": "Anthropic & Companies (Wealth)", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So you're working on legal liability for agents and their controlling companies?\n\nI may be willing to trust them when Anthropic accepts liability for their fuckups."}, {"id": 50629814, "au": "hax0ron3", "dom": 85, "sr": 66, "sc": 1.05, "ep": 1.7, "bs": 0.0, "d": 2, "age": 9.31, "grav": 78.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 0.724, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sometimes feels like it's easier to get homes for agents built than to get homes for humans built, even given the current unpopularity of data centers with the public. Doesn't help that building more homes for humans is unpopular with some humans."}, {"id": 50631746, "au": "Trasmatta", "dom": 69, "sr": 67, "sc": 1.05, "ep": 1.67, "bs": 0.0, "d": 5, "age": 7.16, "grav": 53.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 9238, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 0.711, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree that working with humans is stressful (and it depends immensely on the specific people), but I think that friction is part of the point, and is important."}, {"id": 50630742, "au": "philipwhiuk", "dom": 29, "sr": 68, "sc": 1.05, "ep": 1.59, "bs": 0.0, "d": 1, "age": 8.31, "grav": 66.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 4320, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.678, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeh this is his/her job - it's not everyone's job and most of them only need to be solved a small number of times (once plus competitors)."}, {"id": 50629293, "au": "imtringued", "dom": 108, "sr": 69, "sc": 1.05, "ep": 1.42, "bs": 0.0, "d": 1, "age": 9.89, "grav": 86.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 12744, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.603, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because the economy runs on unpriced unemployment insurance. In theory money holders should pay the unemployment insurance. This creates a point where money holders decide whether the cost of unemployment insurance that automation induces is worth it or whether they would prefer employing humans to avoid unemployment insurance costs."}, {"id": 50634999, "au": "pmg101", "dom": 70, "sr": 70, "sc": 1.05, "ep": 2.1, "bs": 0.85, "d": 6, "age": 3.52, "grav": 21.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 802, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yes I was thinking about this the other day. We're a small dev team and could probably be half the size and maintain output but we'd also be halving the diversity of thought and experience and I think that would tell. So I agree, friction can be a positive.\n\nBut sometimes it can also just be friction, as anyone who accomplished more in a small team than a large team could ever achieve knows."}, {"id": 50629091, "au": "rvz", "dom": 84, "sr": 71, "sc": 0.83, "ep": 0.83, "bs": 0.0, "d": 1, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 10577, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "agents_human", "flbl": "Agents & Human (Secrets)", "urls": [], "ig": 0.352, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The agents can take over here, as they aren't tired.\n\nMaybe we need to build more data centres (homes for agents) to get more work done."}, {"id": 50635263, "au": "warkdarrior", "dom": 10, "sr": 72, "sc": 0.78, "ep": 1.97, "bs": 1.19, "d": 1, "age": 3.15, "grav": 19.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1891, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anymore_verify", "flbl": "Anymore & Verify (Hand)", "urls": [], "ig": 0.331, "fa": 0.0, "gp": 0.825, "bl": 0.45, "ds": 0.0, "txt": "Don't leave us hanging, man. What would need to be true so you wouldn’t need to verify what the agents are doing by hand anymore?"}, {"id": 50634696, "au": "markus_zhang", "dom": 78, "sr": 73, "sc": 0.51, "ep": 1.36, "bs": 0.85, "d": 6, "age": 3.92, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "excited_engineers", "flbl": "Excited & Engineers (Software)", "urls": [], "ig": 0.58, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I see, thanks for sharing. I guess if you are experiencing then AI may not be appealing to you. I know very little about my topics so AI does look good —- but as I said I don’t have the skills to measure it."}, {"id": 50629249, "au": "vishnugupta", "dom": 58, "sr": 74, "sc": 0.44, "ep": 1.63, "bs": 1.19, "d": 4, "age": 9.93, "grav": 86.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 4, "k": 6401, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "prompt_code", "flbl": "Prompt & Code (Solving)", "urls": [], "ig": 0.619, "fa": 0.0, "gp": 0.119, "bl": 0.45, "ds": 0.0, "txt": "> dossier in PhD voice.\n\nI add this to the end of every prompt: “Keep it short, I don’t want a PhD thesis” and it works, usually."}, {"id": 50629772, "au": "bobmcnamara", "dom": 50, "sr": 75, "sc": 0.42, "ep": 1.61, "bs": 1.19, "d": 1, "age": 9.36, "grav": 7 /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
