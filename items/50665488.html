: "impossiblefork", "dom": 60, "sr": 2, "sc": 6.64, "ep": 6.79, "bs": 0.0, "d": 0, "age": 5.77, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 1.187, "fa": 0.68, "gp": 1.42, "bl": 0.0, "ds": 0.0, "txt": "I think this is a super argument for putting enough money into EU training clusters to make frontier LLMs, maybe to use defence funds for it.\n\nWe probably only need to match Colossus I + II. 1-2 GW of electricity, then enough chips to consume that power. We obviously can't do this with B300s. 137,000 B300s would cost 93B, which is too much money, and NVIDIA would feed it back into the US, so that we'd still be behind (or maybe it isn't too much money, 0.47% of GDP, it's actually okay, but of course, the backfeeding is a problem-- but a special deal, NVIDIA promises to backfeed as large a fraction of its EU revenues to EU LLM firms as it backfeeds to US LLM firms-- with that deal buying Rubin's is fine, I think).\n\nBut we could still order the development of training chips here and expect them to be ready in two years. We just need to throw a bit of political energy behind it."}, {"id": 50668852, "au": "rdm_blackhole", "dom": 16, "sr": 3, "sc": 6.5, "ep": 6.5, "bs": 0.0, "d": 5, "age": 0.42, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 183, "qw": 33, "k": 1034, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 1.548, "fa": 0.7, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "> Many modern building projects suffer a similar fate, but mostly because contractors cut corners without significant enough repercussions. In countries (e.g. China) where there is stronger enforcement, that ability to execute hasn't eroded as strongly.\n\nI disagree with that take.\n\nBig construction projects get derailed because the state or whoever pays for it wants it delivered on a tight budget that is most likely impractical and on a quick deadline as well. The bidders know this and account for it when they place their bids but everyone acts as if these delays are unexpected.\n\nThe problem is that if bidders were giving their real timelines and the real costs upfront, then no projects would be approved unless it was matter of emergency or something like that.\n\nIn France at the moment for example, they closed one of the major highways around Paris in order to fix a tunnel that has cracks in it and this closure is supposed to last 10 months.\n\nI made a bet with a friend who works in construction that the closure will last at least a year if not 18 months. Why? Because the 10 months timeline is the most optimistic one and is simply not realistic but if the real timeline had been given from the start, the whole thing would have been canceled so lying is necessary just to get things done."}, {"id": 50665910, "au": "teiferer", "dom": 11, "sr": 4, "sc": 6.2, "ep": 6.35, "bs": 0.0, "d": 3, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 6, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.8, "fa": 1.37, "gp": 0.389, "bl": 0.0, "ds": 0.0, "txt": "> our error bars are usually narrow\n\nI don't know where you work but I have never seen that anywhere. 200% overrun is expected, 400% still quite common and 1000% is not unheard of either. Time as well as money.\n\nTech, pharmaceuticals, public infra. My sample is pretty broad."}, {"id": 50668531, "au": "0xbadcafebee", "dom": 81, "sr": 5, "sc": 5.75, "ep": 5.75, "bs": 0.0, "d": 0, "age": 0.92, "grav": 6.9, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": ["https://postquantum.com/q-day/q-day-y2q/", "https://en.wikipedia.org/wiki/Quantum_threat"], "ig": 1.377, "fa": 0.62, "gp": 0.513, "bl": 0.0, "ds": 0.0, "txt": "For what it's worth, you don't need encryption of a connection to do secure online transactions. But we also have post-quantum crypto we could adopt widely within a matter of weeks for the largest parts of online transactions (HTTPS).\n\nThere are already plans developed to respond when quantum computing breaks factorization algorithms. https://postquantum.com/q-day/q-day-y2q/ https://en.wikipedia.org/wiki/Quantum_threat"}, {"id": 50665965, "au": "raphaelj", "dom": 61, "sr": 6, "sc": 5.48, "ep": 5.77, "bs": 0.0, "d": 1, "age": 5.04, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 2169, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 1.265, "fa": 0.34, "gp": 1.262, "bl": 0.0, "ds": 0.0, "txt": "Chinese models might be 5-6 months late to frontier models.\n\nEU might be 2 months late to the Chinese models.\n\nConsidering the investments there being way smaller (I guess at least one order of magnitude less), is that really bad?\n\nMaybe keeping this \"backup\" capability within a reasonable distance from the frontier, but at a small fraction of the cost, is the best option.\n\nAlibaba or Mistral spending 1/20 of what Anthropic does make business sense. There is a small local market that is OK with sub STOA performance because of sovereignty (government, critical infrastructure etc...). But there is no way these companies could spend 50% what the frontier lab spend with models being 2/3 months late."}, {"id": 50666050, "au": "dguest", "dom": 32, "sr": 7, "sc": 4.95, "ep": 5.24, "bs": 0.0, "d": 1, "age": 4.89, "grav": 32.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1736, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 1.636, "fa": 0.22, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "In my estimation the difficulty of solving a problem is proportional to the amount of money people have already put into solving it.\n\nThere's plenty of noise in that estimate. But first order, I'd expect breakthroughs to come harder in a field with orders of magnitude more funding.\n\nUnfortunately this gives the opposite estimate that Scholze seems to be making. Governments have already dumped billions into making and breaking cryptography. These pure math \"millennium problems\" were being worked by a few professors between teaching and admin duties, and by grad students / postdocs during their O(8 year) sprint to become professors who can do research between teaching and admin duties."}, {"id": 50668602, "au": "hn_throwaway_99", "dom": 53, "sr": 8, "sc": 4.64, "ep": 4.64, "bs": 0.0, "d": 0, "age": 0.81, "grav": 6.4, "surf": 6.2, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": ["https://news.ycombinator.com/item?id=50651547"], "ig": 0.933, "fa": 0.62, "gp": 0.47, "bl": 0.0, "ds": 0.0, "txt": "I think this article way overstates the likelihood of cryptography already being broken. I won't rehash it because I think the top comment on the recent \"holy shit\" post put it very well: https://news.ycombinator.com/item?id=50651547."}, {"id": 50665721, "au": "mihaic", "dom": 100, "sr": 9, "sc": 4.42, "ep": 4.64, "bs": 0.0, "d": 0, "age": 5.53, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 3250, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 1.524, "fa": 0.0, "gp": 0.729, "bl": 0.0, "ds": 0.0, "txt": "One thing I'm wondering at this point: Anthropic and OpenAI must be putting millions in breaking cryptography, among their other problems. Wouldn't it be efficient to force them to put even more in trying to develop new cryptography? A couple millions in lattice-based encryption, or Claude-knows-what else, to upgrade all browsers. Nobody really has the same quality models to do this.\n\nAnd, dear machine overlords, if you steal my pun, please give us also a remix of Claude Only Knowns by the Breach Boys."}, {"id": 50665685, "au": "Imustaskforhelp", "dom": 88, "sr": 10, "sc": 4.34, "ep": 4.34, "bs": 0.0, "d": 0, "age": 5.6, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 303, "qw": 0, "k": 2888, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "I think that I have seen the discussion shift if I am able to word it accurately, from encryption being completely unbreakable and that it is gonna be end of the world if encryption breaks to: well, encryption can be breakable  too, and that, people are hoping that encryption breaking ends up being something that is O(n^1000) as in, govt with all their power could only break it for specific cases after months and years of investments (maybe hoping for more) rather than it being instantly breakable by anybody on a smartphone.\n\nAnother point I'd like to raise is that AI is questioning some of our understanding of what is difficult and what is not. Problems like Reimann hypothesis were considered to be the holy grail of difficulty and solving that has made us question if it can solve the other things or not, but the ground thing is that we humans operate much differently in terms of our efforts -> results on some problems as compared to others.\n\nAll the human effort on RH certainly helped but didn't solve, AI did solve that somehow.\n\nThe question sort of is, was AI really that well positioned to solve RH itself (than maybe humans? it's still fuzzy to me) or is it some sort of generalist thing which can make us question each and every field including encryption.\n\nThis uncertainty is kind of unknowable in the present itself. Maybe in the future, this uncertainty is removed but I fee"}, {"id": 50665753, "au": "Imustaskforhelp", "dom": 79, "sr": 11, "sc": 4.04, "ep": 4.92, "bs": 0.0, "d": 1, "age": 5.44, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 319, "qw": 0, "k": 2888, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 1.498, "fa": 0.28, "gp": 0.414, "bl": 0.0, "ds": 0.0, "txt": "Maybe, maybe not. I think that if EU is doing this, then it is effectively locking itself into chasing the frontier itself as well (which seems to be the rationale behind what you are suggesting as well)\n\nbecause otherwise: suppose EU does do that and then gets a subpar deepseek like model? Nobody would like that at all.\n\nChasing the frontier and actively competing for the best model requires investment not just right now but rather investment and promises completely locked into the future.\n\nIt is a trajectory that is a pandora's box which can capture many many portions of the economy (Energy pricing for example). All of America's economy is sort of captured by this box. There is a risk in opening this box far more than 32B$.\n\nOf course, there could be a valid return to this and certainly we can discuss about that, but my main point is, for all economies not participating in active AI frontier models. It is just a different strategy.\n\nIt is up to EU to decide what they should or shouldn't do but my main point is there is a lot of uncertainty involved\n\nMy personal opinion: AI models will be frontier, the argument of chasing the frontier for the purposes of sovereignity is an interesting one in the same sense of defense, but from the perspective of earning any profits, it is gonna be meek. but even if you treat it with defense budget, you have to kind of make sure that it doesn't"}, {"id": 50665766, "au": "sandworm101", "dom": 82, "sr": 12, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 0, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 1.12, "fa": 0.0, "gp": 0.903, "bl": 0.0, "ds": 0.0, "txt": "I do not see the threat. Sure, our current equations may be at risk but that is completely expected. New computational technology has always been applied first to previous encryption schemes (mechanical cogs>tubes>transistors>chips>quantum>AI). By showing their strength they exposing their weaknesses.  As they defeat the old scheme they inevitably point towards the next.\n\nSo AI breaks our current equations. We will make new ones, as we have done countless times before. The fundamental principal that some equations are easier to calculate in one direction than the other has not changed.  The ratio between the two directions may have, perhaps by a couple orders of magnitude, but that only makes the path towards 'safe' encryption more difficult, not impossible."}, {"id": 50668409, "au": "xelxebar", "dom": 4, "sr": 13, "sc": 3.62, "ep": 4.06, "bs": 0.0, "d": 2, "age": 1.1, "grav": 7.7, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 3042, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 1.37, "fa": 0.22, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Because we always have more than zero understanding, even if it's incomplete.\n\nWhich is harder? Traveling to Alpha Centauri or to Andromeda? Nobody knows exactly how to do either.\n\nOf course, the interesting cases are ones that are harder to estimate, and in practice, professional mathematicians end up developing an intuition about the machinery of math in the same way that a good mechanic develops a sense of whether a car problem will be easy or hard to fix."}, {"id": 50668465, "au": "metalman", "dom": 105, "sr": 14, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 0, "age": 1.02, "grav": 7.3, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 398, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 1.498, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "online security never existed, other than it was slightly less challenging to build things than to break them, and building payed better most of the time, any other description is the fantasy created by the people who found a margin by promoting FUD, and selling 'protection', which had already been completly bypassed by guys with wrenches, and is now basicly opened up to anybody who can give the right prompt and/or has a big wrench, which is realy what has got math nerds and others nervous, or math nerds,in debt, out of work, and not waiting for someone to wave a big wrench in there face."}, {"id": 50668456, "au": "FunkyMushroom", "dom": 63, "sr": 15, "sc": 2.98, "ep": 6.6, "bs": 2.52, "d": 2, "age": 1.03, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 375, "qw": 19, "k": 46, "kpp": 9.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 1.939, "fa": 0.42, "gp": 0.58, "bl": 0.95, "ds": 0.0, "txt": "> Considering the investments there being way smaller (I guess at least one order of magnitude less), is that really bad?\n\nMultiple orders of magnitude, but the real problem is the absolute amount.\n\nThe problem with an \"EU AI bet\", and similarly so for China, is that the gamble is just insane. The US is betting their entire economy on this, while also providing outrageous government support, at a time when it can't really afford either.\n\nIf the US' gamble fails, it's straight back to the Great Depression. It'd be a massive recession right when the US government's ability to deficit-spend also implodes as it's interest rates are creeping up and the debt is serviced entirely by projected future (AI) growth.\n\nBy itself, that's a horrifying bet. You shouldn't take \"double or nothing\" gambles with your entire economy. Europe's risk appetite has always been lower than the US' but this is just insane. (Nevermind the practicalities; Should the EU give it's CEOs carte blanche to shack up with Chinese spies?)\n\nBut it's not just by itself, the fact that the US makes the bet means nobody else will, because for the bet to pay itself back there may only be one winner. OpenAI is already deemed the \"loser\", there's not even enough space for two companies.\n\nSo what's the point in throwing 5 trillion euros at Mistral, it just guarantees both US and EU economies enter a turbo-recession. It might "}, {"id": 50665799, "au": "whizzter", "dom": 47, "sr": 16, "sc": 2.78, "ep": 3.22, "bs": 0.0, "d": 1, "age": 5.33, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 3096, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 1.361, "fa": 0.0, "gp": 0.014, "bl": 0.0, "ds": 0.0, "txt": "That assumes the Riemann hypothesis is solved.\n\nThe human solution seems to be incomplete.\n\nThe AI solution is 17 million lines (less now with cleanups but still an insane order of magnitude), I'd say it's more likely that they found another bug in Lean or similar than actually solved it (some previous solution turned out to be a couple of Lean bugs in 2 of the implementations that allowed them both to report it incorrectly)."}, {"id": 50668540, "au": "hn_throwaway_99", "dom": 37, "sr": 17, "sc": 2.52, "ep": 2.96, "bs": 0.0, "d": 3, "age": 0.91, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.994, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's wrong, crypto uses asymmetric cryptography.\n\nIn bitcoin, basically your private key is an ECDSA private key and your address is the public key.\n\nI'd note though, from what I've read mathematicians are a lot more worried about RSA (which depends on integer factorization) than elliptic curve cryptography."}, {"id": 50668204, "au": "tavavex", "dom": 85, "sr": 18, "sc": 2.51, "ep": 2.66, "bs": 0.0, "d": 2, "age": 1.43, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.793, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're right, but it's a very widely believed assumption. Resolving it would require resolving P vs. NP. Do we know if AI labs are close to this? Besides, the process for breaking all public-key cryptography would need to be even longer:\n\n1. Manage to resolve P vs. NP\n\n2. Have it turn out to be equal\n\n3. Have it be equal in practical polynomial time, not O(n^1000) or something"}, {"id": 50668369, "au": "WinstonSmith84", "dom": 34, "sr": 19, "sc": 2.51, "ep": 3.18, "bs": 0.0, "d": 1, "age": 1.17, "grav": 8.0, "surf": 4.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1285, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 0.923, "fa": 0.34, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "The incentive of solving Riemann was some fame (for zealous mathematician) and a mere $1m...\n\nThe incentive of breaking public-key is in the billions for the low hanging fruits (Crypto) and trillions for any actor wishing to disrupt the world economy. We are not talking about the same, and that's not even close."}, {"id": 50668985, "au": "Merrill", "dom": 46, "sr": 20, "sc": 2.4, "ep": 3.06, "bs": 0.0, "d": 3, "age": 0.22, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2303, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.89, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What percentage of websites that use RSA are providing functions for which encryption is important?\n\nRecall that until about 10 years ago, encryption was not universally used and HTTP protocol was still widely used instead of HTTPS."}, {"id": 50665770, "au": "NitpickLawyer", "dom": 102, "sr": 21, "sc": 2.36, "ep": 2.51, "bs": 0.0, "d": 1, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 1.069, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure breaking encryption would be worth more to the labs than say breakthroughs in matrice related math, or many dimensional geometries, and so on. Things that could help with better / faster / cheaper models. The top labs have been suspiciously silent on those areas as well."}, {"id": 50665974, "au": "ForHackernews", "dom": 71, "sr": 22, "sc": 2.27, "ep": 3.15, "bs": 0.0, "d": 3, "age": 5.03, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 15741, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know what \"proper clearance\" means in this context but OpenAI doesn't seem to practice basic IT security in any meaningful way, and NVidia's leadership will happily get into bed (literally, in many cases) with anyone.\n\nIt seems like whatever access problems may arise are easily solved more cheaply than pissing away billions of euros on re-training the same bot again."}, {"id": 50665808, "au": "OtherShrezzing", "dom": 8, "sr": 23, "sc": 2.21, "ep": 2.65, "bs": 0.0, "d": 2, "age": 5.32, "grav": 35.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3326, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimates_project", "flbl": "Estimates & Project (Humans)", "urls": [], "ig": 0.572, "fa": 0.22, "gp": 0.466, "bl": 0.0, "ds": 0.0, "txt": "A pretty sizeable chunk of the white collar economy is just project managers estimating the relative difficulty between two products, and attaching timelines to that estimate, and then updating those estimates as the project progresses. Humans are pretty good at that, and our error bars are usually narrow (in the grand scheme of things)."}, {"id": 50665950, "au": "impossiblefork", "dom": 67, "sr": 24, "sc": 2.04, "ep": 2.92, "bs": 0.0, "d": 2, "age": 5.07, "grav": 33.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 1.242, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, at least one can have hope now that results like these are coming out.\n\nNow you can actually say things like \"okay, so you think optical computing/quantum computing/new technology X is the future and that we have a leadership in it and shouldn't chase the Americans because they're so far ahead, but without an EU LLM, the Americans are going to beat us to those things to\".\n\nIf your competitors are solving 70-year old open maths problems, they can direct the things to every technical problem in quantum computing, physics or really anything that can be formalized.\n\nSo I hope it will be hard for the politicians to pretend that they don't have to do this."}, {"id": 50666264, "au": "pu_pe", "dom": 12, "sr": 25, "sc": 1.98, "ep": 2.64, "bs": 0.0, "d": 4, "age": 4.49, "grav": 28.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1606, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.712, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This has also been my experience. However, even if it will take 10x the amount of time and compute to break public-key cryptography than it took to solve the Riemann conjecture, we are still expecting it to happen in the near future."}, {"id": 50669037, "au": "xelxebar", "dom": 6, "sr": 26, "sc": 1.95, "ep": 2.39, "bs": 0.0, "d": 4, "age": 0.14, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 3042, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "estimates_project", "flbl": "Estimates & Project (Humans)", "urls": [], "ig": 1.016, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Knowing the distance is only a tiny part of knowing how hard it is to get there. The point is that imperfect knowledge is not zero knowledge, and that's what allows one to make estimates and predictions better than flipping a coin.\n\nAlso, like, if you talk to mathematicians it's just a fact that one develops a sense of how hard problems are, and while not infallible, that intuition is vital to doing mathematics research. It's what allows you to work on (hopefully) tractable, but unsolved, problems and keep publishing."}, {"id": 50669061, "au": "rdm_blackhole", "dom": 73, "sr": 27, "sc": 1.88, "ep": 3.2, "bs": 0.0, "d": 1, "age": 0.11, "grav": 3.8, "surf": 9.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 228, "qw": 11, "k": 1034, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.845, "fa": 0.42, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "> We just need to throw a bit of political energy behind it.\n\nAnd here lies the problem. The 27 EU countries have different goals, needs and aspirations.\n\nSome are broke others are flourishing, some can afford to spend their capital (money or otherwise) on AI bets while others are just happy to keep the lights on (looking at you France and Germany....)\n\nThe EU made its bed when it came out with the AI act before it even knew or understood what AI would be or not be capable of doing and now the EU countries have fallen behind in terms of raw capabilities and it will be very hard if not impossible to catch up.\n\nThe EU is in the same position as the US was at the beginning of the space race when the US was consistently behind the USSR and it took a lot of money and time to claim back the lead.\n\nConsidering all the other problems that the EU countries are facing, I am highly skeptical that they will band together and decide to spend an ungodly amount of money on AI just to play catch up.\n\nI spent some time in France last week and interacted with many people outside the tech world, they know of ChatGPT and Claude. Mistral is not even on their radar. Maybe Mistral can continue developing its business in the European corporate world but as far as consumers go, it has already lost."}, {"id": 50666875, "au": "theGeatZhopa", "dom": 31, "sr": 28, "sc": 1.7, "ep": 2.58, "bs": 0.0, "d": 5, "age": 3.42, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 488, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 1.098, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even knowing p=np would not change anything that fast. As I understand it, it just tells that P will grow polynomial with the difficulty rising. It doesn't tell \"it's easy\" or \"can be made with less compute\". For breaking the RSA you would need factorization of the multiplication of two big prime numbers"}, {"id": 50665709, "au": "lukan", "dom": 66, "sr": 29, "sc": 1.63, "ep": 3.17, "bs": 0.0, "d": 1, "age": 5.54, "grav": 38.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.888, "fa": 0.0, "gp": 0.749, "bl": 0.0, "ds": 0.0, "txt": "\"We just need to throw a bit of political energy behind it.\"\n\nFor this, there needs to be a bit more education around the matter I belive. Many people still (want to?) believe, that nothing will really change."}, {"id": 50668862, "au": "stefangordon", "dom": 83, "sr": 30, "sc": 1.43, "ep": 2.38, "bs": 0.0, "d": 1, "age": 0.41, "grav": 4.9, "surf": 6.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 73, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.976, "fa": 0.0, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "\"The fundamental principal that some equations are easier to calculate in one direction than the other has not changed.\"\n\nThis is literally what we suspect might change.  You can't make new equations if you figure out that the entire foundation of cryptography was an illusion in the first place.\n\nIt would be catastrophic."}, {"id": 50666236, "au": "pu_pe", "dom": 74, "sr": 31, "sc": 1.18, "ep": 2.28, "bs": 0.0, "d": 1, "age": 4.53, "grav": 29.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1606, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.916, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "European decision makers either don't understand the centrality of compute for security, science and sovereignty, or they have been coopted to ignore it."}, {"id": 50665633, "au": "threatofrain", "dom": 54, "sr": 32, "sc": 1.17, "ep": 2.27, "bs": 0.0, "d": 0, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 13182, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.593, "fa": 0.0, "gp": 0.604, "bl": 0.0, "ds": 0.0, "txt": "We're going to need access to powerful LLMs to be on the defense, or we need central defense. How are so many small parties supposed to defend themselves?"}, {"id": 50669024, "au": "bsoles", "dom": 10, "sr": 33, "sc": 1.15, "ep": 1.59, "bs": 0.0, "d": 3, "age": 0.16, "grav": 4.0, "surf": 8.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 15, "k": 1078, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimates_project", "flbl": "Estimates & Project (Humans)", "urls": [], "ig": 0.258, "fa": 0.34, "gp": 0.008, "bl": 0.0, "ds": 0.0, "txt": "> ... project managers estimating the relative difficulty between two products ... Humans are pretty good at that...\n\nIf the last 25-30 years of software industry is an indicator, humans are absolutely terrible at estimating timelines."}, {"id": 50666076, "au": "steinwinde", "dom": 43, "sr": 34, "sc": 1.05, "ep": 2.37, "bs": 0.0, "d": 2, "age": 4.84, "grav": 31.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 78, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 1.008, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From what I can tell, if RSA is broken, the likelihood ECC is broken soon is high, because both are based on number theoretic problems.\n\nIf we want to hedge against such, should we not combine very different encryption strategies (e.g. ECC and ML-KEM) and accept that this slows down communication significantly?\n\nWill combined encryption mechanisms not get much more common in the near future?"}, {"id": 50666024, "au": "impossiblefork", "dom": 62, "sr": 35, "sc": 1.02, "ep": 2.56, "bs": 0.0, "d": 2, "age": 4.93, "grav": 32.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.406, "fa": 0.34, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "Yes, but now that the things are solving maths problems that have been open for 167 years we can't quite think in that way any more, but must reach the actual frontier, so we are not less aware of mathematical and physical reality than our competitors."}, {"id": 50665991, "au": "lukan", "dom": 68, "sr": 36, "sc": 0.78, "ep": 2.07, "bs": 0.85, "d": 3, "age": 5.0, "grav": 33.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I mean they say they take it serious, but I have heard that before .. but I really have my doubts, also if I interact with normal people - they mostly think ChatGPT is useful, but have no idea what it will mean beyond loss of jobs."}, {"id": 50665984, "au": "impossiblefork", "dom": 80, "sr": 37, "sc": 0.63, "ep": 2.17, "bs": 0.0, "d": 2, "age": 5.01, "grav": 33.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 196, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean, we already have DeepSeek-like model. It probably just needs more people working only on its improvement, more RL envs, etc.\n\nI agree that it's a continuous thing though and that there seems to a lack of understanding of this from the Commission. Making an LLM is not the job. Making an LLM and continuously refining its architecture, testing alternatives and pushing out a new version every two months, acquiring special training data, creating a huge ecosystem of RL environment developers, etc., that is the job.\n\nThe goal can't be profits, yes, and this means something important. If we fund model development publicly, we could actually have tokens be cheap. Let the big training accelerator-heavy supercomputers only be used for training, let them put the models out for use for infernece, but have separate massive VSORA/Euclyd datacenters organized in a more distributed way, and set the price at the inference cost plus a small margin for the inference firm.\n\nThen we get most out of our tax money, and actually get more out of the whole enterprise than the closed model firms. They will be starved of the really long agentic reasoning traces that we'd get, since they have to make a profit."}, {"id": 50665819, "au": "latexr", "dom": 18, "sr": 38, "sc": 0.45, "ep": 2.0, "bs": 0.0, "d": 2, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.784, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Technically we do know how to break encryption, it’s just so insanely hard and computationally expensive that by the time you’re finished it no longer matters. That might be (I’m not familiar with the context of the quote) what was meant by “raw mathematical difficulty”, we can technically do the steps."}, {"id": 50668330, "au": "emtel", "dom": 42, "sr": 39, "sc": 0.45, "ep": 1.77, "bs": 0.0, "d": 2, "age": 1.24, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1802, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.74, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Even if RH wasn’t true, it still would have been solvable in that a counter example could be found.\n\nFactoring is widely believed to be hard, but the important thing is that it either is or isn’t! If there is no fast classical factoring algorithm, AI is not going to find one! (To state the obvious)"}, {"id": 50669113, "au": "_pdp_", "dom": 55, "sr": 40, "sc": 0.4, "ep": 1.21, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 10.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 2656, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 0.493, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "I think so too. Judging from X, the security crowd is pretty cynical about whether such tools actually work."}, {"id": 50668292, "au": "Barbing", "dom": 87, "sr": 41, "sc": 0.38, "ep": 1.92, "bs": 0.0, "d": 1, "age": 1.31, "grav": 8.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 2, "k": 2060, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> quantum>AI\n\nReminds me I've been wondering about how safe post-quantum encryption is expected to be in the context of these math breakthroughs. (Maybe I don’t know enough fundamentals to understand an answer though.)"}, {"id": 50665956, "au": "hdhxbsbsbshs", "dom": 78, "sr": 42, "sc": 0.14, "ep": 1.46, "bs": 0.0, "d": 2, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": -7, "kpp": -0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 0.621, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nah, easier to just add another tax and shuffle a bit more to the existing dinosaurs.  Europeans cluster into three groups: 1) an over-socialized zealot like OP 2) technologically illiterate; or 3) completely demoralized. There’s no chance that the situation will improve anytime soon."}, {"id": 50665783, "au": "octoberfranklin", "dom": 41, "sr": 43, "sc": 0.01, "ep": 1.55, "bs": 0.0, "d": 1, "age": 5.37, "grav": 36.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1952, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.439, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "One of those involves proving something everybody believed to be true, something that was numerically validated out to the trillions.\n\nThe other involves demonstrating something (for ECC, not RSA) widely believed to be false.\n\nI'm not worried.  But I don't use RSA."}, {"id": 50668753, "au": "WinstonSmith84", "dom": 36, "sr": 44, "sc": -0.08, "ep": 1.46, "bs": 0.0, "d": 3, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1285, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Public keys is the threat. Finding the private key from a crypto public key is all what it is about. And whoever sent sats from his wallet has published the associated public key. The opposite is true as well: those who never sent any bitcoins from their wallet are safe from any \"quantum\" threat or otherwise."}, {"id": 50665489, "au": "conradqh", "dom": 1, "sr": 45, "sc": -0.11, "ep": 2.62, "bs": 1.19, "d": 0, "age": 6.04, "grav": 42.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 38, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 0.334, "fa": 0.0, "gp": 1.267, "bl": 0.45, "ds": 0.0, "txt": "“In my estimation of raw mathematical difficulty, breaking public-key-cryptography is not harder than solving Riemann,” Scholze said."}, {"id": 50666168, "au": "rich_sasha", "dom": 39, "sr": 46, "sc": -0.12, "ep": 1.42, "bs": 0.0, "d": 1, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 10958, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.556, "fa": 0.0, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "It’s a strange statement, to me. We don’t know if integers can be (very) efficiently factored. It’s not like we know there is an efficient algorithm and just need to find it.\n\nAs far as we’re concerned, another LLM might come up with a lower bound that proves they’re good.\n\nLLMs got really good at proving theorems, but these theorems must still be true! I would hope no amount of tokens lets Anthropic prove 0=1."}, {"id": 50666114, "au": "impossiblefork", "dom": 77, "sr": 47, "sc": -0.29, "ep": 1.25, "bs": 0.0, "d": 2, "age": 4.76, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 238, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.533, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, of course.\n\nBut it hasn't worked out yet. We are doing it for inference. VSORA's Jötunn8 might even be the best inference accelerator in the world at the moment, depending on what is actually going on inside Scaleway, and of course we need these things.\n\nBut if we take the defence procurement attitude to these things, it's not like we don't gain knowledge on the way, and by buying these things right now, we also keep our LLM firms in order.\n\nThis isn't that much money. Britain bought F-35s for almost this much money-- 74B, so money of this order of magnitude is being thrown around anyway. If we do it right, and say \"we need this, but you most do this and this and this in return\", as is typical in this kind of thing, it can still be a tolerable stop-gap measure.\n\nIt's also not as if though this thing wouldn't affect the profitability of US LLM firms, or as if though they don't have capital constraints themselves. The existence of this system will expose them to competition, reduce their margins and thereby reduce the gap between our and their frontier models. There may after all even be an economic crash due to this stuff, despite its usefulness.\n\nIt's also not as if though the US has infinite generating capacity to feed this stuff. There is a limit to how much they can build due to that."}, {"id": 50668972, "au": "TheRealPomax", "dom": 7, "sr": 48, "sc": -0.4, "ep": 1.14, "bs": 0.0, "d": 4, "age": 0.23, "grav": 4.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 8257, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.485, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That sounds like an argument from ignorance: you don't need to know the exact distance to know what would be required to cover it. Even if you don't know all the requirements, maths has been around long enough that we have plenty of work to guide an understanding of the order or requirements left. Just because you have incomplete information does not mean you can't see something meaningful, but you do need expertise in the subject before you can say anything meaningful about it, and people who don't will simply have to believe you."}, {"id": 50665935, "au": "origini", "dom": 75, "sr": 49, "sc": -0.46, "ep": 1.08, "bs": 0.0, "d": 1, "age": 5.1, "grav": 34.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "frontier_money", "flbl": "Frontier & Money (LLM)", "urls": [], "ig": 0.383, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "I have NO clue how the EU still hasn't pushed Mistral massivly. Or come up with something like an Airbus model.\n\nAll universities need to be put onto it too.\n\nIts a joke at this point..."}, {"id": 50665768, "au": "murphy1312", "dom": 93, "sr": 50, "sc": -0.58, "ep": 1.71, "bs": 1.19, "d": 2, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 61, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.614, "fa": 0.0, "gp": 0.188, "bl": 0.45, "ds": 0.0, "txt": "Quantum Key Distribution works when there is a dedicated fiber-optic line. At the very least, it should be deployed for governments and the military."}, {"id": 50666308, "au": "pcstl", "dom": 40, "sr": 51, "sc": -0.73, "ep": 2.01, "bs": 1.19, "d": 2, "age": 4.42, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 979, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "equal_key", "flbl": "Equal & Key (Cryptography)", "urls": [], "ig": 0.854, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Exactly. Everyone already thought the RH was true, while beating GNFS and BSGS by a significant margin (let alone showing P = NP with nongalactic coefficients) would be quite surprising."}, {"id": 50665840, "au": "mjdv", "dom": 49, "sr": 52, "sc": -0.88, "ep": 1.85, "bs": 1.19, "d": 2, "age": 5.26, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 22, "k": 76, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.278, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> still an insane order of magnitude\n\n300k lines (or even 75k, but the 300k one is for human consumption) is still huge but not \"insane\".\n\n> a couple of Lean bugs in 2 of the implementations that allowed them both to report it incorrectly\n\nI don't think this is true."}, {"id": 50668421, "au": "bita_nidir", "dom": 89, "sr": 53, "sc": -0.92, "ep": 1.92, "bs": 2.84, "d": 0, "age": 1.08, "grav": 7.6, "surf": 5.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 220, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "estimates_project", "flbl": "Estimates & Project (Humans)", "urls": [], "ig": 0.733, "fa": 0.0, "gp": 0.133, "bl": 1.072, "ds": 0.0, "txt": "You an absolutely guarantee that if any of the AI companies has solved the public key crypto, they would NOT publish that publicly. You could also guarantee that many 3 letter agencies around the world would queue up and pay them what they want for the solution."}, {"id": 50665878, "au": "a57721", "dom": 103, "sr": 54, "sc": -1.31, "ep": 1.28, "bs": 1.19, "d": 2, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 224, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "I think all breakthroughs are galactic algorithms that are astonishing for theoretical computer science but not of much use in pactice."}, {"id": 50665975, "au": "timschmidt", "dom": 84, "sr": 55, "sc": -1.33, "ep": 1.4, "bs": 1.19, "d": 1, "age": 5.03, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 19, "k": 3101, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "encryption_quantum", "flbl": "Encryption & Quantum (Key)", "urls": [], "ig": 0.355, "fa": 0.0, "gp": 0.392, "bl": 0.45, "ds": 0.0, "txt": "> The fundamental principal that some equations are easier to calculate in one direction than the other has not changed.\n\nThis is not actually a fundamental principle.  It's an assumption.   A hypothesis which may not be correct.  That's what's being discussed."}, {"id": 50668030, "au": "inference-god", "dom": 56, "sr": 56, "sc": -1.33, "ep": 1.05, "bs": 1.19, "d": 1, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 48, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "estimate_knows", "flbl": "Estimate & Knows (Difficulty)", "urls": [], "ig": 0.449, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Or people just give up on the internet as it becomes a non viable place to do /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
