ategories": [{"category": "general_web", "count": 9}], "story_anchors": ["native", "fps", "ios", "safari", "feel", "web", "scroll", "page", "webkit", "compositor", "glass", "rate", "offscreencanvas", "scrolling", "refresh", "device", "screen", "apple"], "largest_root": {"root_id": 50638522, "author": "jkahrs595", "slots": 14, "start_dom": 67, "end_dom": 80, "share_pct": 10.6, "top_dom1_age": 0.1, "top_dom1_author": "Kon5ole"}, "buried_cutoff": 40, "rescue_top_k": 26, "ablations": [], "tournament": [], "comments": [{"id": 50641844, "au": "mrob", "dom": 121, "sr": 1, "sc": 8.56, "ep": 8.56, "bs": 0.0, "d": 2, "age": 8.51, "grav": 69.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 11413, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.842, "fa": 0.95, "gp": 1.048, "bl": 0.0, "ds": 0.0, "txt": "Some monitors/OSes default to 60Hz even if the monitor is capable of higher. I've seen posts by people who claimed to have run their fast monitor at 60Hz by accident because they didn't know this.\n\nAnd a fast monitor needs a fast mouse to take full advantage of it. USB mouse protocol does not inform the mouse of the monitor's refresh phase/frequency, so the mouse has to run asynchronously. You need a high mouse sampling rate to avoid noticeable beat patterns caused by this discrepancy. Non-gaming mice sometimes only support 125Hz, which isn't even enough for 60Hz monitors. Common gaming mice support 1000Hz, which is enough for perceptibly flawless mouse control at 120Hz, but for 240Hz you need a high-end gaming mouse with higher sampling rate."}, {"id": 50643834, "au": "Rohansi", "dom": 122, "sr": 2, "sc": 8.01, "ep": 8.15, "bs": 0.0, "d": 3, "age": 5.56, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 34, "k": 1494, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.26, "fa": 1.37, "gp": 0.888, "bl": 0.0, "ds": 0.0, "txt": "> I've seen posts by people who claimed to have run their fast monitor at 60Hz by accident because they didn't know this.\n\nThis is far more understandable because that makes everything run at 60Hz. The article here is a scenario where you have 60Hz content mixed in with 120Hz on the same screen. But still, people who are accustomed to high refresh rate displays would be able to immediately notice.\n\n> And a fast monitor needs a fast mouse to take full advantage of it.\n\nIdeally, yes, but you don't need a high polling rate mouse to be able to notice the difference."}, {"id": 50647188, "au": "ridafkih", "dom": 88, "sr": 3, "sc": 7.37, "ep": 8.17, "bs": 0.8, "d": 1, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": ["https://lobste.rs/s/pxvmxo/bypassing_ios_safari_60_fps_limit\u0023:~:text=This%20is%20simply%20an%20interactive%20demonstration"], "ig": 1.158, "fa": 1.58, "gp": 0.65, "bl": 0.3, "ds": 0.0, "txt": "A user on lobste.rs commented on the battery draw as well so I responded over there if you're curious with some benchmarks. This increases power draw by about 200 mW over a 60 FPS variant of the exact same thing while scrolling, and does not increase power draw while idling.\n\n(https://lobste.rs/s/pxvmxo/bypassing_ios_safari_60_fps_limit...)"}, {"id": 50640051, "au": "ridafkih", "dom": 72, "sr": 4, "sc": 7.22, "ep": 7.22, "bs": 0.0, "d": 3, "age": 12.93, "grav": 129.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.449, "fa": 0.95, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "If you shake your hand in front of a strobe light, you should be able to count the afterimages, as if your hand was copied into multiple places in the same instant.\n\nSame goes here. If you go to the first two grids, and you shake the square until you can count the afterimages, check to see if one shows more afterimages than the other despite the same speed.\n\nIf your device is genuinely limited to 60Hz for any reason or another, you'll see a little warning icon on the top-right.\n\nIt might be easier in Low Power Mode, as well. This'll reduce the requestAnimationFrame loop to 30 Hz, but the higher refresh rate examples in this post will show at 60 Hz."}, {"id": 50639719, "au": "leokennis", "dom": 103, "sr": 5, "sc": 6.75, "ep": 6.75, "bs": 0.0, "d": 2, "age": 13.85, "grav": 144.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 63, "qw": 0, "k": 4602, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": ["https://i.imgur.com/6cRn9Gs.jpeg"], "ig": 1.5, "fa": 0.62, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "I noticed that glass thing in the top right immediately on my iPhone.\n\nEspecially because since iOS27, there is a slider to put Liquid Glass into a less transparent look [1] so the glass pill on this site stood out immediately as \"the bad old iOS26 days\" of Liquid Glass.\n\nWith the newly possible iOS27 look, I'd say it is a perfect blend of \"looks nice\" and \"still readable\".\n\n[1] https://i.imgur.com/6cRn9Gs.jpeg"}, {"id": 50641402, "au": "jeroenhd", "dom": 23, "sr": 6, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 2, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 113, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": ["https://bijlage.zip/e218ea6b-389f-4ac0-9e3c-c1f45624e05f.mp4"], "ig": 1.577, "fa": 0.62, "gp": 0.598, "bl": 0.0, "ds": 0.0, "txt": "Tested this on my Pixel 9 Pro with Firefox and Chrome.\n\nThe \"improved\" canvas seems to lose tracking with my finger. It's perfectly smooth (although both seem to be?), but at the end of a little wiggle motion, the square is no lunger underneath my finger.\n\nThis also makes the glass-pill-drag control look weird, because I expect the pill to be dragged along further than it actually ends up being.\n\nThe effect is much more pronounced on Firefox, but scrolling feels weird and off in Chrome as well. I also don't even know if you need this hack to work around the frame rate issue on Android.\n\nI recorded my screen with the touch tracing feature enabled: https://bijlage.zip/e218ea6b-389f-4ac0-9e3c-c1f45624e05f.mp4"}, {"id": 50647909, "au": "hnlmorg", "dom": 75, "sr": 7, "sc": 6.3, "ep": 8.15, "bs": 1.7, "d": 6, "age": 0.1, "grav": 3.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 12535, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": [], "ig": 1.63, "fa": 0.96, "gp": 1.09, "bl": 0.64, "ds": 0.0, "txt": "The Liquid Glass part of the page didn’t bother me because it was clearly just there as a demo widget.\n\nthe question I have is this: if the difference between 60hz and 120hz matters, then why wouldn’t you choose a different software stack that compiles down to native code? You end up with better performance, better battery life, and cleaner code.\n\nI get this page should be treated as a lab demonstrating a solution. But it is, in my humble opinion, the wrong solution to that problem presented because it comes with far too many negative trade offs.\n\nAnd the AI point you raise is a great one. Because the old argument of sticking firmly with the web stack (“I only know how to use JavaScript so therefore I’m going to shoehorn JavaScript into every problem”) no longer applies."}, {"id": 50640150, "au": "wodenokoto", "dom": 49, "sr": 8, "sc": 5.87, "ep": 6.09, "bs": 0.0, "d": 0, "age": 12.63, "grav": 125.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 32, "k": 18128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 0.946, "fa": 0.76, "gp": 1.17, "bl": 0.0, "ds": 0.0, "txt": "> If you’re on iOS Safari, you’ll immediately be able to tell which is which because one refreshes at most 60 times a second in a renderer pass, while the other uses the compositor.\n\nNo. The difference has nothing to do with refresh rate. They move differently using different logic. I can only tell them apart because one has inertia and keeps moving after release. If I keep my thumb down they are the same.\n\nIPhone 17, iOS 26"}, {"id": 50641762, "au": "mrob", "dom": 126, "sr": 9, "sc": 5.78, "ep": 6.07, "bs": 0.0, "d": 4, "age": 8.67, "grav": 71.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 11413, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.194, "fa": 0.68, "gp": 0.917, "bl": 0.0, "ds": 0.0, "txt": "60 to 120 is a big difference. 120 to 240 is nice to have but not as dramatic. Considering how unpleasant it is to do anything on a mobile device because of how much worse a touchscreen is than keyboard and mouse, I think it's reasonable to cap at 120fps or even 60fps if it saves battery. By using a mobile device you're already accepting an inferior user experience."}, {"id": 50641755, "au": "afavour", "dom": 4, "sr": 10, "sc": 5.71, "ep": 5.71, "bs": 0.0, "d": 0, "age": 8.7, "grav": 71.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 30748, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": [], "ig": 1.193, "fa": 0.68, "gp": 0.669, "bl": 0.0, "ds": 0.0, "txt": "In case you’re wondering “why isn’t 120fps enabled by default”: on the native side iOS selectively enables it for transitions that cover a lot of the screen. If you use SwiftUI or UIKit it’s done for you but there are switches on CAAnimation (IIRC) that control it.\n\nThe web has no equivalent. So it’s all 120hz all the time, or not. And that would drain the battery more than Apple would like."}, {"id": 50640400, "au": "latexr", "dom": 54, "sr": 11, "sc": 5.56, "ep": 5.71, "bs": 0.0, "d": 2, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 15, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": ["https://en.wikipedia.org/wiki/Soap_opera_effect"], "ig": 0.783, "fa": 1.04, "gp": 0.622, "bl": 0.0, "ds": 0.0, "txt": "> I am starting to think some people genuinely can't tell the difference between 60 Hz and 120 Hz.\n\nThat’s certain. Lots of people also can’t perceive the soap opera effect, even if you turn off frame interpolation on their TV and show them the before and after.\n\nhttps://en.wikipedia.org/wiki/Soap_opera_effect"}, {"id": 50640499, "au": "ksec", "dom": 2, "sr": 12, "sc": 5.55, "ep": 5.55, "bs": 0.0, "d": 0, "age": 11.74, "grav": 111.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 64, "qw": 0, "k": 58062, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": ["https://x.com/ridafkih/status/2122834693611819451"], "ig": 1.228, "fa": 0.62, "gp": 0.617, "bl": 0.0, "ds": 0.0, "txt": "I thought the demo linked to twitter was much more impressive. [1] I can't believe that was web only and not native app. Absolutely blows my mind how far we have come. I know it is prototype and there are bounds to be some edge case still not polished but I think this is the first time ever Web has native app quality, and this is without much JavaScripts.\n\n[1]https://x.com/ridafkih/status/2122834693611819451"}, {"id": 50638363, "au": "catlifeonmars", "dom": 119, "sr": 13, "sc": 5.4, "ep": 5.84, "bs": 0.0, "d": 0, "age": 17.51, "grav": 210.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2088, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 0.797, "fa": 0.95, "gp": 0.868, "bl": 0.0, "ds": 0.0, "txt": "60fps is perfectly serviceable. That first example is updating _at most_ 60fps and that phrase is doing a lot of heavy lifting. What you see is <60fps jerks. This article feels disingenuous"}, {"id": 50645876, "au": "ridafkih", "dom": 74, "sr": 14, "sc": 5.37, "ep": 6.51, "bs": 0.85, "d": 5, "age": 2.88, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 1.823, "fa": 0.34, "gp": 0.866, "bl": 0.32, "ds": 0.0, "txt": "It's a series of learnings, rather than an actual step-by-step on making a website feel native on iOS Safari. A good example for this would be a drawing application isolating the controller idea to get better responsiveness when someone draws, or a mobile game PWA using the refresh rate boosting to make the game feel better to players.\n\nI've been making websites for over a decade now, and yet even with AI in the loop, the blog post and demos took almost 5 days to become publishable, and another 4 to get the performance in a place where I was happy. This is because of the hybrid approach, and needing to build the entire page around that fact.\n\nWould I ever use liquid glass in an actual website? I would not, and certainly not as I did here with an annoying `_UILiquidLensView`-inspired scroll indicator. Do I think it serves as a good illustration/example for high-refresh rate websites on mobile? Absolutely!"}, {"id": 50640588, "au": "shortercode", "dom": 81, "sr": 15, "sc": 5.31, "ep": 5.31, "bs": 0.0, "d": 0, "age": 11.54, "grav": 108.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 190, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 1.447, "fa": 0.34, "gp": 0.647, "bl": 0.0, "ds": 0.0, "txt": "It’s fun that Fable completely fails on this. OffscreenCanvas is _designed_ to bypass paint and go straight to the compositor and it’s not a new feature. It’s one of the really great things about OffscreenCanvas. Primarily it’s to allow a worker to update the canvas without worrying about the main context being blocked by user interaction, layout, paint, etc.\n\nI couldn’t have told you if this would have triggered the compositor at 120Hz but if anything worked it would be this."}, {"id": 50642066, "au": "maelito", "dom": 3, "sr": 16, "sc": 4.8, "ep": 4.95, "bs": 0.0, "d": 1, "age": 8.15, "grav": 64.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 0, "k": 3804, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": ["https://cartes.app/blog/navigation-mode"], "ig": 1.211, "fa": 0.62, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "Here's a blog post explaining that a full map navigation mode is completely on the Web. https://cartes.app/blog/navigation-mode\n\nWe've also switched a few months ago to a CSS bottom sheet, it's way better than the previous javascript version."}, {"id": 50641394, "au": "smcleod", "dom": 36, "sr": 17, "sc": 4.78, "ep": 5.22, "bs": 0.0, "d": 0, "age": 9.49, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 9705, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.11, "fa": 0.68, "gp": 0.465, "bl": 0.0, "ds": 0.0, "txt": "By flip \"Prefer Page Rendering Updates near 60fps\" does the author mean turn it on, or turn it off? I'd assume on but that would suggest limiting pages to 60fps and it's the default setting in iOS 27."}, {"id": 50640996, "au": "lucideer", "dom": 19, "sr": 18, "sc": 4.43, "ep": 4.58, "bs": 0.0, "d": 0, "age": 10.52, "grav": 94.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 15113, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 1.18, "fa": 0.34, "gp": 0.577, "bl": 0.0, "ds": 0.0, "txt": "Haven't had a chance yet to check this on iOS yet, but just to mention for those who only have access to iOS, I expected the disclaimer at the top of the page to imply that the differences between the demos would be imperceptible on Android. They aren't - the canvas is significantly worse.\n\nI guess this may be a worthy trade-off if you're confident your userbase is 100% iOS."}, {"id": 50644143, "au": "unethical_ban", "dom": 89, "sr": 19, "sc": 4.24, "ep": 4.9, "bs": 0.0, "d": 0, "age": 5.23, "grav": 35.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 11236, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.42, "fa": 0.34, "gp": 0.412, "bl": 0.0, "ds": 0.0, "txt": "How is this the first time I'm learning that 60fps is a cap for web browsing in iOS?\n\nNot that I'm an Apple junkie, but this is like learning Ford caps its trucks at 100HP if you swap rims, or something.\n\nIf I bought an iPhone with high refresh rate, took it home and realized my browser (the main app I use on a phone) is locked at half the device's capacity, I would immediately get a refund."}, {"id": 50638930, "au": "doug_durham", "dom": 27, "sr": 20, "sc": 4.19, "ep": 4.41, "bs": 0.0, "d": 0, "age": 16.03, "grav": 182.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1201, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": [], "ig": 1.06, "fa": 0.34, "gp": 0.653, "bl": 0.0, "ds": 0.0, "txt": "On an iPad the compositor loses track of the cursor position as you drag things.  The 60 fps javascript approach keeps everything locked. It seems like there is more work to be done."}, {"id": 50639385, "au": "matsemann", "dom": 102, "sr": 21, "sc": 3.87, "ep": 4.01, "bs": 0.0, "d": 1, "age": 14.73, "grav": 159.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 0.901, "fa": 0.34, "gp": 0.64, "bl": 0.0, "ds": 0.0, "txt": "I guess in this post it served a purpose, it was the example of how a full site could react in 120 Hz to inputs.\n\nBut man, is that effect how annoying it is to use iOS now?"}, {"id": 50638285, "au": "SV_BubbleTime", "dom": 99, "sr": 22, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 0, "age": 17.73, "grav": 214.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2333, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.101, "fa": 0.34, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "I have nothing to add on IOS or a 60fps website cap… but I did notice the “glass” UI element in the top left corner and how much more glass looking that is than whatever Apple tried to do. The chromatic aberrations 0.95, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "You need an iPhone Pro (which has a 120hz pro-motion display). Or a regular iPhone 16 or newer which also ships a 120hz display.\n\nEarlier or lower tiers models only has a 60hz display and if you’re not seeing a difference, it’s because on your device there probably isn’t."}, {"id": 50644197, "au": "allthetime", "dom": 113, "sr": 26, "sc": 3.55, "ep": 3.99, "bs": 0.0, "d": 1, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 623, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": [], "ig": 1.256, "fa": 0.34, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "Not sure why you’d avoid react native in 2026. And if you need more performance (most don’t) just go native. It’s almost trivial to maintain separate code bases with AI. You can use a front/back split keeping UI in OS-land and doing other work with shared C++, etc"}, {"id": 50642410, "au": "throwaway2037", "dom": 82, "sr": 27, "sc": 3.35, "ep": 3.57, "bs": 0.0, "d": 0, "age": 7.63, "grav": 58.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 0.989, "fa": 0.34, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "I need to ask from the perspective of normie users: Do they care about greater than 60 FPS limits in web apps?  I find it hard to believe."}, {"id": 50639420, "au": "ridafkih", "dom": 108, "sr": 28, "sc": 3.32, "ep": 3.83, "bs": 0.0, "d": 2, "age": 14.62, "grav": 157.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.631, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're the first person who has made that criticism that actually understood why glass was used for the demo page.\n\nEvery \"liquid glass on web\" library in existence falls short because it can't keep up the compositor refresh rate. Simple as that. Part of it was also bringing native UI to the web because I figured it'd be quite jarring to see a convincingly native element in a website for those familiar with web development.\n\nAs for using iOS, Apple doesn't use the glass effect (`_UILiquidLensView`) I used for the progress/scroll indicator outside of a very select few use-cases because (as is the case on this website) if it's not positioned squarely in the centre of your macula, the intensity of the refraction combined with the chromatic aberration makes it so that it appears flashy and distracting. I accepted it for the sake of the demo."}, {"id": 50640186, "au": "ridafkih", "dom": 50, "sr": 29, "sc": 3.28, "ep": 5.47, "bs": 0.8, "d": 1, "age": 12.5, "grav": 123.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 0.711, "fa": 0.95, "gp": 0.752, "bl": 0.3, "ds": 0.0, "txt": "Curious, can you tell the difference if you turn on Low Power Mode? The one on the left will drop to 30 Hz while the one on the rate will pin to the device refresh rate of 60 Hz. I am starting to think some people genuinely can't tell the difference between 60 Hz and 120 Hz."}, {"id": 50638280, "au": "CGamesPlay", "dom": 59, "sr": 30, "sc": 3.05, "ep": 3.49, "bs": 0.0, "d": 0, "age": 17.74, "grav": 214.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 8744, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.173, "fa": 0.0, "gp": 0.508, "bl": 0.0, "ds": 0.0, "txt": "That \"liquid glass\" scroll tracker widget is the best ocular migraine simulator I've ever encountered. If you've ever wanted to know what an ocular migraine looks like, look a few inches away from that thing and scroll the page."}, {"id": 50639581, "au": "Rodmine", "dom": 90, "sr": 31, "sc": 3.01, "ep": 3.45, "bs": 0.0, "d": 0, "age": 14.15, "grav": 149.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 8, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "Safari is one of the greatest pieces of niche applications. It has to be made exactly good enough for web browsing that users don’t feel like downloading an alternative but also exactly bad enough for building web apps on it so that developers are forced to create a native iOS app."}, {"id": 50641335, "au": "bruce343434", "dom": 30, "sr": 32, "sc": 2.73, "ep": 2.95, "bs": 0.0, "d": 0, "age": 9.65, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2379, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "When scrolling past the isometric scrolling thing in firefox, it crashes the tab. But this is a very cool article and even though I'm on linux desktop, the OffscreenCanvas technique is snappier and I will be adapting it. Thanks!"}, {"id": 50639195, "au": "2001zhaozhao", "dom": 115, "sr": 33, "sc": 2.61, "ep": 3.41, "bs": 0.0, "d": 1, "age": 15.15, "grav": 166.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 1008, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 1.447, "fa": 0.0, "gp": 0.009, "bl": 0.0, "ds": 0.0, "txt": "I don't know about Rust framework, but Kotlin Multiplatform has always been a good option compared to Flutter. It has good interop so you can build actual native iOS UI while sharing business logic in Kotlin, or you can just build the UI in Compose Multiplatform (decently fast on iOS, literally native on Android which is the more important platform because Androids are slower)."}, {"id": 50639630, "au": "kalev", "dom": 76, "sr": 34, "sc": 2.61, "ep": 4.15, "bs": 0.0, "d": 1, "age": 14.03, "grav": 147.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 361, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 0.956, "fa": 0.62, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "Only iPhone 13 Pro and Pro Max models and newer support adaptive refresh rates of up to 120Hz, which are the devices this post is specifically aimed at."}, {"id": 50641931, "au": "derangedHorse", "dom": 13, "sr": 35, "sc": 2.44, "ep": 3.03, "bs": 0.0, "d": 0, "age": 8.37, "grav": 67.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1312, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 0.867, "fa": 0.0, "gp": 0.685, "bl": 0.0, "ds": 0.0, "txt": "I only saw a subtle difference in the first example between the scrollable square canvases, but I’m sure there are cases where it would be more noticeable. Nevertheless, this post was an interesting read."}, {"id": 50638744, "au": "srcreigh", "dom": 9, "sr": 36, "sc": 2.36, "ep": 3.02, "bs": 0.0, "d": 0, "age": 16.52, "grav": 191.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 2515, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 0.865, "fa": 0.0, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "What an incredible post. Not only the bypass , but the method of hacking through WebKit source to find UX workarounds."}, {"id": 50643006, "au": "phoghed", "dom": 44, "sr": 37, "sc": 2.32, "ep": 3.42, "bs": 0.0, "d": 1, "age": 6.63, "grav": 48.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1048, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.041, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The difference is definitely noticeable, you’d be able to tell easily on a larger surface, like a map scrolling, just like you can see the diff scrolling around home screens if you side by side with a 60Hz iPhone."}, {"id": 50641474, "au": "FLHerne", "dom": 21, "sr": 38, "sc": 2.12, "ep": 3.07, "bs": 0.0, "d": 2, "age": 9.31, "grav": 78.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 89, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "On my Pixel 9, the scrollarea 'snaps' to pure vertical or horizontal scrolling when the movement is within a few degrees of those.\n\nThat would be desirable in the normal use case of scrolling through content, but in this application causes the item dragging to be erratic and not follow my finger reliably."}, {"id": 50639203, "au": "ckaik", "dom": 69, "sr": 39, "sc": 2.1, "ep": 6.16, "bs": 2.52, "d": 2, "age": 15.13, "grav": 166.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 1.124, "fa": 0.96, "gp": 0.541, "bl": 0.95, "ds": 0.0, "txt": "Same as well.\n\nI'm on an iPhone with ProMotion and both of these are running at 120 fps here. I thought I was going mad, so I had to dig into it a little, even if it's just to provide op with more information.\n\nAs far as I could tell (Settings.app's Search seems useless) there are three settings you could engage to influence the refresh rate of websites in Safari:\n\n- Low Power Mode\n\n- \"Prefer Rendering Updates at 60Hz\" Feature Flag in Safari - which is enabled by default\n\n- Limit Refresh Rate in Accessibility -> Motion\n\nI didn't try Low Power Mode, but the Accessibility setting did the trick for me and I was immediately able to see the difference.\n\nNot sure what's causing this. I'm on an iPhone 15 Pro Max running iOS 27.0.1."}, {"id": 50639907, "au": "r_lee", "dom": 129, "sr": 40, "sc": 2.04, "ep": 3.36, "bs": 0.0, "d": 5, "age": 13.34, "grav": 136.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1407, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 1.019, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean, 30 and hz, not noticing that is pretty surprising\n\nand 60 vs 120hz, you may not notice it immediately but when you e.g. move a window around on a monitor you should be able to feel it, at least for me it's instantly noticeable, but you may not notice it if you're not switching between or aren't moving things around"}, {"id": 50643003, "au": "afavour", "dom": 6, "sr": 41, "sc": 1.93, "ep": 2.96, "bs": 0.0, "d": 2, "age": 6.64, "grav": 48.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 30748, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.112, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "I don't think the UIKit heuristic is that intelligent, it's simply \"is this a transition between two view controllers\". Again, the lack of any formalised notion of \"root views\" or whatever on the web would be a blocker here I think. That said I'd be curious what happens with the View Transitions API, since it's about as close as you'll get to that."}, {"id": 50639903, "au": "hnlmorg", "dom": 111, "sr": 42, "sc": 1.92, "ep": 2.58, "bs": 0.0, "d": 0, "age": 13.34, "grav": 136.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 12535, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "native_code", "flbl": "Native & Code (Edge)", "urls": [], "ig": 1.044, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "The white square glitches out on latest iOS iPhone Duo.\n\nBut my advice here is just don’t do it. Respect your users battery life. If you want a native feel then compile to native code."}, {"id": 50638687, "au": "Rohansi", "dom": 120, "sr": 43, "sc": 1.69, "ep": 3.23, "bs": 0.0, "d": 1, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1494, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "iphone_pro", "flbl": "Iphone & Pro (Rate)", "urls": [], "ig": 0.86, "fa": 0.34, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "Sure, dropping frames is worse, but why would it ever be acceptable for an app to cap itself at half the screen's refresh rate? Especially when the difference between 60 and 120fps is very noticeable?"}, {"id": 50639966, "au": "andai", "dom": 10, "sr": 44, "sc": 1.67, "ep": 2.77, "bs": 0.0, "d": 0, "age": 13.22, "grav": 134.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 0.854, "fa": 0.0, "gp": 0.527, "bl": 0.0, "ds": 0.0, "txt": "That glass effect is very cool but very distracting.\n\nThere's a \"hide scroll tracker\" toggle in the hamburger menu which hides it."}, {"id": 50639728, "au": "ridafkih", "dom": 130, "sr": 45, "sc": 1.66, "ep": 3.99, "bs": 0.8, "d": 1, "age": 13.84, "grav": 144.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 60, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "glass_liquid", "flbl": "Glass & Liquid (Whatever)", "urls": [], "ig": 1.286, "fa": 0.34, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "By \"first example,\" do you mean the glass element on the top-left, or do you mean the first pair of grids?\n\nLow to mid tier devices might get hitches on the glass elements since the glass runs on the GPU during scrolls. If you mean the actual first demo and the one on the right is rendering below 120 Hz, your device is simply not capable of it."}, {"id": 50642366, "au": "AlexandrB", "dom": 94, "sr": 46, "sc": 1.6, "ep": 2.85, "bs": 0.0, "d": 1, "age": 7.71, "grav": 59.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_safari", "flbl": "Apps & Safari (Notice)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Believe it or not I use Safari willingly and happily on macOS. No other browser is as easy on the battery and the lack of some web features is a selling point for me. I don't want to give websites access to hardware peripherals. Ever. Thank you."}, {"id": 50639419, "au": "trymas", "dom": 61, "sr": 47, "sc": 1.56, "ep": 2.59, "bs": 0.0, "d": 2, "age": 14.63, "grav": 157.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3723, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "android_weird", "flbl": "Android & Weird (Finger)", "urls": [], "ig": 0.688, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Same, /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
