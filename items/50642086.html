: 0, "k": 3960, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.613, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Let's say we invented something.\n\nFor an invention to achieve real impact, it does require human to push. To advance it. Invest money. Market. Build a company. Etc...\n\nTo get a human to spend all that effort, it is useful for him to believe either that \"he had some part of inventing it. This is his\", or that there's something unique here, that can create a competitive advantage and make money.\n\nSo this means, if the AI companies want maximize the economic usefulness of their tool, it's better for them for their tool to leave some room for contribution by people, either to feel authorship, or top feel \"this invention is unique\".\n\nSo it make sense for them to somewhat limit the capabilities of models."}, {"id": 50643113, "au": "inkysigma", "dom": 65, "sr": 83, "sc": 3.36, "ep": 3.75, "bs": 0.0, "d": 1, "age": 16.42, "grav": 189.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 482, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.16, "fa": 0.0, "gp": 0.709, "bl": 0.0, "ds": 0.0, "txt": "If you assume factoring is in P, what effect does that have on PKI? I don’t think there would be immediate implications for ECC? I’m sure people still use RSA, but to what extent?\n\nAlso, what would be the implication for quantum computing? I think that’s the canonical example of a non quantum problem with exponential speed up that is also practical. Are there any other current examples?"}, {"id": 50643223, "au": "magus-stoopr", "dom": 349, "sr": 84, "sc": 3.36, "ep": 3.75, "bs": 0.0, "d": 0, "age": 16.27, "grav": 186.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 21, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.256, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "everything else in science requires reproducibility. why are we not holding the same standard for these absurdly-long maths results?\n\nfor it to be a valid publication, others need to be able to reproduce it: test it probe it understand it\n\nthe default we have to have for scientific results from AI"}, {"id": 50645259, "au": "pishpash", "dom": 171, "sr": 85, "sc": 3.36, "ep": 3.74, "bs": 0.0, "d": 3, "age": 13.66, "grav": 141.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 1637, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.592, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even university labs have no access to this kind of compute, so actual academia feels a little impotent. There is a disturbance in the force beyond process and into institutional questions. What if universities aren't even the center of new knowledge? Professors all become glorified lecturers? People all said universities die back from the teaching side due to AI but now I think they die back from the research side instead!"}, {"id": 50644207, "au": "fguerraz", "dom": 244, "sr": 86, "sc": 3.36, "ep": 3.74, "bs": 0.0, "d": 1, "age": 15.11, "grav": 165.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 873, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.414, "fa": 0.0, "gp": 0.285, "bl": 0.0, "ds": 0.0, "txt": "These are not breakthroughs yet. They are very complicated proofs of things we’ve assumed to be true for decades and use in applied mathematics already.\n\nOur best factorisation technique, GNFS, already uses a heuristic value for its search that is 55 times lower than the one this paper proves.\n\nI’m not saying this is useless research, I’m saying it has no practical application yet."}, {"id": 50644253, "au": "AlexandrB", "dom": 156, "sr": 87, "sc": 3.36, "ep": 3.73, "bs": 0.0, "d": 2, "age": 15.05, "grav": 164.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.184, "fa": 0.22, "gp": 0.218, "bl": 0.0, "ds": 0.0, "txt": "I'd settle for an LLM doing something of its own volition, without being asked/directed by a human first. As it stands a humanoid murdering a person, while plausible, would be a case of a human somewhere giving directions to the LLM first. Perhaps scary as an advancement of military technology, not so scary as proof of some kind of AI takeover."}, {"id": 50644214, "au": "AlexandrB", "dom": 149, "sr": 88, "sc": 3.36, "ep": 3.72, "bs": 0.0, "d": 6, "age": 15.1, "grav": 165.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 6, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.944, "fa": 0.42, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "> Everything is credentialism in the end.\n\nIt's really not. The only reason credentials have any value is because folks from those fields are usually ethical/right (at least in that field). This is not a given though - if enough bad actors acquire credentials and talk nonsense the credential becomes devalued."}, {"id": 50642430, "au": "fwlr", "dom": 343, "sr": 89, "sc": 3.36, "ep": 3.7, "bs": 0.0, "d": 0, "age": 17.56, "grav": 211.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.254, "fa": 0.0, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "The proof reduces monochromatic rectangle density via Gaussian hyperplane rounding and box-constrained biasing to refuting the existence of biased Kullback–Leibler-stable sign matrices S ∈ −1, 1^(X×Y) of rank at most r + 1 above R_0 := ⌈e^(4×10^6)⌉ (Theorem 3.1).\n\nAh yes, of course, I have often wondered about that."}, {"id": 50649512, "au": "kccqzy", "dom": 40, "sr": 90, "sc": 3.36, "ep": 3.69, "bs": 0.0, "d": 2, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 20062, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.084, "fa": 0.34, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Posting a public factorization of RSA-2048 will instantly make you a target of nation states. No matter where you live, you will face the risk of sudden abduction by state-sponsored hacking groups to force you to divulge your algorithm."}, {"id": 50643325, "au": "sylware", "dom": 279, "sr": 91, "sc": 3.36, "ep": 3.68, "bs": 0.0, "d": 1, "age": 16.14, "grav": 184.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 82, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.564, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From one spacetime vids on youtube (please use yt-dlp and not a whatwg cartel browser, thx).\n\n\"AI _with curated Human bias on physics observations__ is already able to rebuild all our physics math models\"\n\nHope, I did not hallucinate that since I was half asleep while watching the vid."}, {"id": 50643099, "au": "topicalSoup", "dom": 145, "sr": 92, "sc": 3.36, "ep": 3.66, "bs": 0.0, "d": 3, "age": 16.44, "grav": 189.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 37, "qw": 0, "k": 11, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": ["https://leanprover-community.github.io/blog/posts/riemann-hypothesis/"], "ig": 0.804, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Interesting theory. Can you provide the credentials that make you more of a subject matter expert than Alpöge and the team that verified his work, who seem to believe that this is actually a proof of the RH? [1]\n\n[1] https://leanprover-community.github.io/blog/posts/riemann-hy..."}, {"id": 50644094, "au": "tkz1312", "dom": 129, "sr": 93, "sc": 3.36, "ep": 3.62, "bs": 0.0, "d": 1, "age": 15.24, "grav": 168.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 481, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.287, "bl": 0.0, "ds": 0.0, "txt": "I personally find it absolutely astonishing that llms have reached such heights and would have laughed in your face if you would have suggested it to me when chatgpt first came out.\n\nI've been working on proof automation for quite a long time, and the most I ever expected from these systems was a useful tactic (like grind or sledgehammer), and maybe some help with proof repair.\n\nIn fact until this year that's pretty much what they were, and my head absolutely spins that in 12 months we have gone from that to millenium prize problems."}, {"id": 50642643, "au": "fghorow", "dom": 281, "sr": 94, "sc": 3.36, "ep": 3.62, "bs": 0.0, "d": 0, "age": 17.19, "grav": 204.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.182, "fa": 0.0, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "OK, so from a layperson's viewpoint (I'm a geophysicist, not a CS person), do the discrete logarithm and integer factorization results invalidate public key crypto?\n\nPlease ELIF!"}, {"id": 50645747, "au": "karmakurtisaani", "dom": 119, "sr": 95, "sc": 3.36, "ep": 3.58, "bs": 0.0, "d": 2, "age": 13.04, "grav": 131.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.468, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "If I was in academia, I might even be cautiously optimistic. To me it looks like that at least in the near future, what you can do is tackle a problem with LLMs, ask it questions, pick the interesting answers, clean them up and build a theory around the results and publish in one paper the amount you previously would have required 5 papers for. Just because you can now go deeper faster.\n\nI'm not sure how they'll deal with the flood of papers done with LLMs tho, that seems difficult to tackle."}, {"id": 50642537, "au": "edumucelli", "dom": 328, "sr": 96, "sc": 3.36, "ep": 3.55, "bs": 0.0, "d": 0, "age": 17.34, "grav": 206.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 350, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "Students doing their Ph.Ds in Math and Computer Scientists on more theory-related thesis are having a tough time. You never know if your thesis is going to be the next OpenAI/Anthropic and now Google trophy paper."}, {"id": 50645699, "au": "skybrian", "dom": 170, "sr": 97, "sc": 3.36, "ep": 3.55, "bs": 0.0, "d": 3, "age": 13.11, "grav": 132.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.493, "fa": 0.0, "gp": 0.03, "bl": 0.0, "ds": 0.0, "txt": "There are people who get so interested in writing a game engine that they never actually release a game. Other people are more interested in building games. Neither is inherently better but people have different interests.\n\nAlong those lines, I’m more interested in building web apps than in AI research. Picking a different model from a list of LLMs now and then is about as much as I want to do. I don’t even have proper evals. Maybe I’m not using the best model available, but it seems good enough? I just try new models now and then."}, {"id": 50642966, "au": "alchemist1e9", "dom": 292, "sr": 98, "sc": 3.36, "ep": 3.55, "bs": 0.0, "d": 1, "age": 16.66, "grav": 193.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1367, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No. These results do not invalidate public-key cryptography.\n\nThe recent AI math results don’t break Bitcoin’s cryptography, they either go in the hardness direction or improve classical algorithms that Bitcoin doesn’t rely on, with constants that still leave them impractical. There is a lot of FUD floating around trying to push crypto prices lower."}, {"id": 50643037, "au": "Frost1x", "dom": 303, "sr": 99, "sc": 3.36, "ep": 3.53, "bs": 0.0, "d": 2, "age": 16.54, "grav": 191.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 6190, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.385, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Is integer factorization really the crown jewel or the threat everyone is racing to be/protect from.\n\nI’d hope the crown jewel of quantum computing would be possibility simulation and forecasting to help humanity writ large. Then again that’s surely not what people with lots of money and power backing and hoping for quantum success want."}, {"id": 50652436, "au": "inkysigma", "dom": 73, "sr": 100, "sc": 3.36, "ep": 3.5, "bs": 0.0, "d": 3, "age": 0.34, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 482, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.354, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "I think it is possible you get fast factoring but not the abelian HSP problem solved which is why I don't think there is any immediate implication. Like you say, Shor's works because it solves the abelian HSP problem by period finding on a finite (abelian) group. However, integers carry a lot more structure than elliptic curves so it's possible that additional structure gives us a polytime algorithm for factoring but not ECDLP.\n\nThis would be a bit odd in my view though not implausible mostly because I think it would be somewhat strange that the only arithmetic BQP problem with exponential speedup is somehow ECC and some of the related HSP problems, even more narrow than previously. I don't know if someone more well versed in BQP vs P might have a different opinion here."}, {"id": 50643923, "au": "CamperBob2", "dom": 143, "sr": 101, "sc": 3.36, "ep": 3.37, "bs": 0.0, "d": 3, "age": 15.42, "grav": 171.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 14249, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.032, "fa": 0.28, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "At this point it is probably not entirely unfair to compare this outlook to that of a Flat Earther or moon-landing denier.  Do you have other unconventional perspectives on some of these commonly-accepted topics, or do you only deny without evidence the presence of jagged but real intelligence in machine-learning models?"}, {"id": 50644506, "au": "adamors", "dom": 31, "sr": 102, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 5, "age": 14.74, "grav": 159.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2940, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.921, "fa": 0.34, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "Encryption is almost as old as writing. Some level of symbol replacement, cyphers etc. have existed for thousands of years. Caesar cipher is more than 2000 years old"}, {"id": 50642883, "au": "howunfortunate", "dom": 225, "sr": 103, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 0, "age": 16.8, "grav": 196.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.942, "fa": 0.0, "gp": 0.783, "bl": 0.0, "ds": 0.0, "txt": "It's so bizarre to see these crazy breakthroughs daily, but the market (and especially the AI market) keeps sliding down.\n\nI know pure math isn't exactly the stuff investors dream about, but still. I'll assume the market knows something I don't, but I'm going to keep buying..."}, {"id": 50642967, "au": "fidotron", "dom": 6, "sr": 104, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 2, "age": 16.65, "grav": 193.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 12896, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.983, "fa": 0.0, "gp": 0.702, "bl": 0.0, "ds": 0.0, "txt": "I know we all like to be cynical regarding the NSA, and with good reason, but they have in the past shown some level of foresight, and I would hope they have some sort of plan for how to deal with something being found to be broken and how to co-ordinate with industry to minimise the impact of that.\n\nIn this situation I do not see any realistic option for a US lab that wouldn't involve engaging the NSA, and would be very surprised if this wasn't already the case."}, {"id": 50646495, "au": "pona-a", "dom": 75, "sr": 105, "sc": 3.31, "ep": 3.31, "bs": 0.0, "d": 1, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1281, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "How likely is it to be the opposite, a game of telephone where some people at Google told their coworkers they're working on integer factorization, then they told somebody else they have a better factoring algorithm, then somebody else believed they meant a cryptographically-meaningful one, and then they emailed that to Scott who wrote a cryptic comment about it..."}, {"id": 50644272, "au": "rerdavies", "dom": 324, "sr": 106, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 1, "age": 15.02, "grav": 164.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 1071, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I console myself with the observation that -- so far -- they (AI coding assistants, in my case) seem to be very good at truth, but not so good at beauty.\n\nPersonally, that has always been my consuming passion: to create beautiful (and useful) things. So I'd like to think that all I really need to do is radically expand the scope and ambition of the beautiful things I want to bring into the world now that I have tools that will increase my productivity by at least one order of magnitude, and possibly another one as well."}, {"id": 50644519, "au": "bjornsing", "dom": 154, "sr": 107, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 1, "age": 14.72, "grav": 159.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5245, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "The very surprising part for me is that much of this math ability came from “pre-training”, essentially fitting an enormous statistical model to all the data on the internet. Both weird and wonderful. Who would have known commenting on HN would help solve the Riemann hypothesis?"}, {"id": 50642504, "au": "roomey", "dom": 297, "sr": 108, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 0, "age": 17.42, "grav": 208.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1268, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.019, "fa": 0.0, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "Are we going to see factorization on classical computers with this?\n\nAny opinions on the possibility of a novel algorithm to allow large int factorization, and will post quantum algorithms also help protect against these?"}, {"id": 50642902, "au": "mapcars", "dom": 215, "sr": 109, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 2, "age": 16.77, "grav": 196.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 721, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.016, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Going into a field just for a career is a bad choice anyway, if it works out you will be tangled with something you don't care about for years, so you lose either way.\n\nI bet this is one of the big reasons for mental health issues in modern society, doing something that is not as lucrative but gives you sense of satisfaction and purpose works much better in the long term."}, {"id": 50646004, "au": "TSiege", "dom": 32, "sr": 110, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 5, "age": 12.61, "grav": 124.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 9, "k": 2213, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.755, "fa": 0.42, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "> That's how everything worked for most of human history\nYou could say this about computers, vaccines, antibiotics, the haber bosch process, or anything that makes it the modern world. That doesn't mean life as we know it today would be tolerable without those things"}, {"id": 50642964, "au": "fn-mote", "dom": 192, "sr": 111, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 2, "age": 16.66, "grav": 194.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 4953, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Way too soon to see the effect. Right now in the US, the primary driver in postgraduate studies is the (lack of) federal funding.\n\nSince I talk to people every day about “is computer science still a good field to work in”, it’s clear to me interest in CS is going to drop. The only question is how far. That will be driven by the economic fallout of the AI boom."}, {"id": 50643457, "au": "ion_trapper", "dom": 68, "sr": 112, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 3, "age": 15.97, "grav": 181.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 88, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Honestly, if factoring goes down the quantum industry is dead. It is the only useful algorithm with a known exponential speedup versus best known classical, everything else is just suggestive and involves a ton of hand waving. And like you said, any apparent quantum speedup tends to disappear for these other problems when enough attention and classical compute is brought in. If we solve factoring classicaly, there’s very little chance all those other problems don’t also have good-enough classical algorithms."}, {"id": 50642911, "au": "bemtevi", "dom": 167, "sr": 113, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 16.76, "grav": 195.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.834, "fa": 0.0, "gp": 0.763, "bl": 0.0, "ds": 0.0, "txt": "That's because for the sake of this sort of thing, there are two types of people: those who just want to absorb as much knowledge as they can and see new stuff, and those who care more about the process of acquiring knowledge. For the latter, community is important, as well as having a space to explore one's own curiosity without being overtaken by the production-oriented with super-fast machines.\n\nIt is like the person who likes to bake at home versus the person who loves industrial baking because they can try fifty different deserts every day.\n\nA lot of people are in the latter camp too, and it is them who should just forget about academia and computer science, because the LLM crowd is making the atmosphere one which is contradicts their principles and asthetic.\n\nUnfortunately, the LLM crowd typically dismisses the concerns of the other as irrelevant because they're too addicted to knowledge absorption and cannot see any downside to it."}, {"id": 50643127, "au": "xdennis", "dom": 224, "sr": 114, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 1, "age": 16.4, "grav": 189.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2775, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.297, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "People say \"Don't go into Computer Science\" because it's not a good career path, since writing software has been largely automated and it's only going to become harder to find a job.\n\nExcitement has nothing to do with it. I'm sure people who study medieval French literature find it very exciting, but I wouldn't recommend it to anyone who wants a career out of it.\n\nSoftware engineering and computer science will become exactly that: a field for people who find it interesting but are completely useless economically."}, {"id": 50646777, "au": "proteal", "dom": 340, "sr": 115, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 0, "age": 11.58, "grav": 109.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 244, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "Wow - the prime factorization theorem is a really interesting result. Too bad it only works on odd numbers. Hopefully someone throws some compute towards an algorithm that works on the rest of the integers."}, {"id": 50642852, "au": "curt15", "dom": 186, "sr": 116, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 1, "age": 16.88, "grav": 198.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "Do we see the recent math results dissuade students from pursuing cutting edge mathematics? Would computer science fare any differently?"}, {"id": 50644574, "au": "DaSHacka", "dom": 183, "sr": 117, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 4, "age": 14.65, "grav": 158.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1924, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.258, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Or the inverse, anecdotally I knew many people in HS that were going into CS while being extremely nontechnical and not particularly interested in the field (most were artists, with a few creative writers) due to the 'stable, high-paying employment' reputation. I suspect many of them have since transferred majors and future prospective college freshmen like them will never apply for these CS programs in the first place."}, {"id": 50646746, "au": "rsoto2", "dom": 94, "sr": 118, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 1, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 140, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "of course morons on HN are willing to believe AI solved P=NP without proof. They think it solved the Riemann hypothesis without any actual proof that the LLM didn't exploit lean, despite examples of LLMs exploiting lean."}, {"id": 50643753, "au": "int32_64", "dom": 79, "sr": 119, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 15.62, "grav": 174.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 813, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Nvidia is getting slaughtered by China hawks promising a congressional massacre and you think AI labs would release something that would allow HNDL doomsday scenario to play out compromising US national security worse than anything else in history?"}, {"id": 50643281, "au": "mschuster91", "dom": 222, "sr": 120, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 1, "age": 16.19, "grav": 185.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.123, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "Computer science will be (or is) going down the same route as most of the humanities, arts etc. - sure a nice and interesting thing to study, but you will not make a living out of it in the \"real economy\" and slave away decades of your life if you wish to make it to a tenure track in academia."}, {"id": 50643143, "au": "emtel", "dom": 141, "sr": 121, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 3, "age": 16.38, "grav": 188.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1802, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.128, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "No it isn’t. RH had already been formulated in lean’s mathlib long ago and reviewed by experts. No one doubts that the theorem is stated correctly.\n\nIf there were errors in the proof, the lean checker would have caught them.\n\nIf the proof was exploiting bugs in the lean checker, the same bug or bugs would have to be present in every lean kernel that has been used to check the proof so far, including the ones that are themselves formally verified."}, {"id": 50645435, "au": "ls612", "dom": 242, "sr": 122, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 2, "age": 13.44, "grav": 137.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 3488, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.654, "fa": 0.28, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "3) Wall Street thinks if RSI is real there is a good possibility there will be a titanic backlash/upheaval/violence in the streets type of situation and that the whole endeavor will be destroyed/outlawed, at least for public or commercial use."}, {"id": 50643097, "au": "thewillowcat", "dom": 253, "sr": 123, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 1, "age": 16.45, "grav": 190.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 240, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "The question is no longer whether AI can achieve remarkable things. From the market's point of view,  the question is whether the major AI companies can capture most of the gains that are realized. Their valuations are so large that they depend on it, but where are their moats?" ": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 19, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.57, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Wanting an environment to do research free of LLMs is a valid preference, and many people do have that preference.\n\nWanting an environment to work with your hands free of manufacturing robots is a valid preference, and many people do have that preference.\n\nIn both cases the problem is economic. Why would anyone pay you more money for a possibly inferior product just so you can exercise your preference? There will always be a niche there, but it's definitely a sea change in white collar work."}, {"id": 50645575, "au": "juancn", "dom": 153, "sr": 134, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 1, "age": 13.26, "grav": 135.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2377, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "One way to look at it is that LLMs are a type of probabilistic index over the knowledge in their training set.\n\nThey explore and connect seemingly disparate ideas really easily, so any proofs that we have the basic machinery for but we haven't realized yet how to connect it, should fall relatively quickly."}, {"id": 50646417, "au": "IshKebab", "dom": 161, "sr": 135, "sc": 2.5, "ep": 2.5, "bs": 0.0, "d": 1, "age": 12.02, "grav": 115.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 20333, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.6, "fa": 0.34, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "If you don't think it should be very surprising to back and read HN comments from 1 or 2 years ago. A significant number of people were still under the \"stochastic parrot\" delusion. Some still are!"}, {"id": 50642869, "au": "llm_nerd", "dom": 214, "sr": 136, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 1, "age": 16.84, "grav": 197.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 4946, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 0.93, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "Being exciting and being a career that is a credible field of employment are two very different things. People are discouraged about the latter, for extremely rational, metric-based reasons.\n\nA lot of computer science is going to continue to happen, but I suspect by an increasingly smaller and smaller number of people."}, {"id": 50646446, "au": "GuB-42", "dom": 176, "sr": 137, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 2, "age": 11.98, "grav": 115.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.045, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There is a third type. Those who don't care at about computers, knowledge and all that stuff. They just see that it is a degree with good job prospects.\n\nIt is like the person who prefers cheese over deserts, but they don't become cheesemakers because it doesn't pay, and they can get more cheese by making deserts, selling them and buying cheese with the money. They focus on making deserts that sell well, no matter how, but preferably with minimal effort."}, {"id": 50649894, "au": "TacticalCoder", "dom": 78, "sr": 138, "sc": 2.42, "ep": 2.42, "bs": 0.0, "d": 3, "age": 6.85, "grav": 50.7, "surf": 0.0, "fade": "c00", "d ntum computer that can run \"arithmetic\" algorithms like Shor's. However AI (e.g. AlphaFold) has been providing disturbingly good advanced on that side too.\n\nThere are some other advantages to quantum technologies (sensing, some specific forms of secure communication, some forms of noise-resilience in networking) that are not to be discarded too."}, {"id": 50643247, "au": "edumucelli", "dom": 334, "sr": 144, "sc": 2.2, "ep": 2.2, "bs": 0.0, "d": 2, "age": 16.24, "grav": 186.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 350, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "During my PhD it was mandatory to have top-tier publications in order to defend. Imagine your top-tier publication is gone because those labs got it first?"}, {"id": 50643139, "au": "throw10920", "dom": 144, "sr": 145, "sc": 2.2, "ep": 2.2, "bs": 0.0, "d": 3, "age": 16.38, "grav": 188.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 4219, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 0.935, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Uh, hallucinations in any part of the proof except the formal description of the theorem being proved would result in the proof checker throwing an error. Are you saying that the formal description of the RH is millions of lines long?"}, {"id": 50642835, "au": "txdv", "dom": 344, "sr": 146, "sc": 2.19, "ep": 2.19, "bs": 0.0, "d": 1, "age": 16.91, "grav": 198.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 549, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.863, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "Basically something that might help understand how to make AI better, I think they started the race for AI improving AI to make it faster, cheaper, more accurate."}, {"id": 50644887, "au": "g-b-r", "dom": 251, "sr": 147, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 1, "age": 14.21, "grav": 150.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2415, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.829, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "For what I can tell it's just not been picked up enough by news outlets.\n\nHad RH happened with the markets open, it would have probably had an effect.\n\nIt might still make a splash when the CMI recognizes it.\n\nI think only problems as well known as that or P NP can have a big markets impact, though."}, {"id": 50643324, "au": "raincole", "dom": 350, "sr": 148, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 1, "age": 16.14, "grav": 184.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.912, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For starters, math isn't science.\n\nSecond, none of these Google papers is \"absurdly-long.\" You're experiencing human-hallucination."}, {"id": 50652232, "au": "grogenaut", "dom": 8, "sr": 149, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 4, "age": 0.96, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5776, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 0.912, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They do try and keep THEIR signals secure where THEIR is wider than the agency and they have good ideas of what is possible unless of course they're leaving the military and everyone else open to spying by themselves and equivalents. I have a hard time believing they'd be allowed to do that but what do I know."}, {"id": 50643114, "au": "gregdeon", "dom": 136, "sr": 150, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 3, "age": 16.41, "grav": 189.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 100, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 0.825, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Your argument misunderstands how Lean works. We know that the theorem statement is correct because we wrote it. Lean only accepts correct proofs of that theorem statement. So we are certain that it proves what it was asked to prove. If there was a hallucination in the code that broke the proof, Lean would find it."}, {"id": 50642583, "au": "tensegrist", "dom": 311, "sr": 151, "sc": 2.12, "ep": 2.12, "bs": 0.0, "d": 3, "age": 17.29, "grav": 205.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 24, "qw": 31, "k": 495, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": ["https://www.karlin.mff.cuni.cz/~spurny/doc/articles/arnold.htm"], "ig": 0.395, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> So I would say the best tool is Physics to represent and build models of our reality. Physics is like a subset of Math which is actually the ground truth in our universe.\n\n\"Mathematics is a part of physics. Physics is an experimental science, a part of natural science. Mathematics is the part of physics where experiments are cheap.\"\n\nhttps://www.karlin.mff.cuni.cz/~spurny/doc/articles/arnold.h..."}, {"id": 50645708, "au": "bennettnate5", "dom": 16, "sr": 152, "sc": 2.07, "ep": 2.07, "bs": 0.0, "d": 4, "age": 13.1, "grav": 132.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 713, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 0.832, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "Interestingly enough, cellular mobile networks will become the sole bastion of cryptographic trust--SIM cards store symmetric keys shared only with the telco provider, and no asymmetric crypto is used during authentication or ciphering (unless you count 5G IMSI concealment, which only really gives a little privacy improvement that is trivially breakable by downgrade to LTE anyways)."}, {"id": 50643301, "au": "sedictious", "dom": 217, "sr": 153, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 3, "age": 16.16, "grav": 184.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 0.876, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree but there is a wide gap between \"there are better career options\" and \"you will almost certainly be unemployable\". I didn't study maths because the career prospects were great, but I don't think I would have done it with the same enthusiasm and optimism if I was starting again now"}, {"id": 50643349, "au": "dichloromethane", "dom": 306, "sr": 154, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 0, "age": 16.11, "grav": 183.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 6, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 0.741, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "Has anyone found the lean formalisations? They claim that they asked the models to produce one in the README, but they don't appear to be anywhere in the repo."}, {"id": 50646126, "au": "karmakurtisaani", "dom": 121, "sr": 155, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 4, "age": 12.42, "grav": 122.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.868, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I suppose my thinking was that journals would also start expecting more from their papers. The good ones at least."}, {"id": 50643051, "au": "bemtevi", "dom": 230, "sr": 156, "sc": 1.99, "ep": 3.85, "bs": 1.85, "d": 3, "age": 16.53, "grav": 191.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 21, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.906, "fa": 0.42, "gp": 0.36, "bl": 0.7, "ds": 0.0, "txt": "> At this point, a philosopher sitting nearby pipes in, 'Ha, we've got you beat! All we need is paper and pencil!\"\n\nNo longer to be true now that most graduate students will need LLM subscriptions, the cost of which will rise as the power needed to stay ahead will rise. The privatization of mathematics, indeed."}, {"id": 50645343, "au": "tyho", "dom": 77, "sr": 157, "sc": 1.96, "ep": 1.96, "bs": 0.0, "d": 2, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1493, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.832, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There isn’t any good reason to think PQC algorithms are safer against AI assisted advancements in algorithms. Personally I’d say they are more at risk by virtue of being newer and receiving less attention."}, {"id": 50642757, "au": "dzaima", "dom": 288, "sr": 158, "sc": 1.92, "ep": 1.92, "bs": 0.0, "d": 1, "age": 17.05, "grav": 201.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1754, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The factorization is O(exp(105 × (ln n)^(1/3) × (ln ln n)^(2/3))); plug in n=10 (i.e. factoring 10 to 2×5), you get a number larger than the number of atoms on earth. So still a bit to go."}, {"id": 50646882, "au": "dada216", "dom": 211, "sr": 159, "sc": 1.91, "ep": 1.91, "bs": 0.0, "d": 5, "age": 11.46, "grav": 107.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 102, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.398, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But would it be detrimental to humas to advance it because of the advancements in themselves or because we cannot spread them ethically?\nI'm much more concerned about the fact that probably 500 people in total are on track to become the only \"owners\" of science."}, {"id": 50643264, "au": "raverbashing", "dom": 82, "sr": 160, "sc": 1.89, "ep": 1.89, "bs": 0.0, "d": 1, "age": 16.22, "grav": 185.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 23295, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.688, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "It could be P but most likely a \"not so easy P\" or even more likely something that is \"in between\" P and NP\n\nI mean, current algos are already \"easier NP\"\n\n(yes I know, these are not mathematically rigorous descriptions)"}, {"id": 50642805, "au": "jherdman", "dom": 194, "sr": 161, "sc": 1.88, "ep": 1.88, "bs": 0.0, "d": 2, "age": 16.96, "grav": 199.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1237, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.407, "fa": 0.0, "gp": 0.634, "bl": 0.0, "ds": 0.0, "txt": "In my experience intuition really only comes from the experience of plumbing the depths of a subject. I don't really see how letting AI handle the depth is going to work out in the long run if we want humans to be in the mix."}, {"id": 50644254, "au": "DrScientist", "dom": 114, "sr": 162, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 2, "age": 15.05, "grav": 164.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2360, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Perhaps. But it's also possible that different disciplines will have different scales of unexplored space left.\n\nIn your example - biology - there was and still is, huge unexplored space left - 4 billion years of evolution has created a lot of weird, wonderful and complex diversity, and even more complex dynamic systems.\n\nIs there as much unexplored physics, or indeed maths?\n\nI don't know, but it feels likely to be less unexplored space."}, {"id": 50652547, "au": "CJefferson", "dom": 5, "sr": 163, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 15726, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.795, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not that much. I actually figure out how long the exponent could be on a polynomial time for SAT (if P=NP) and it was shockingly low.\n\nI think if SAT was solvable in O(n^8) time, when n is the size of a compact encoding of the SAT problem, but it could really be reduced further, it would actually change much."}, {"id": 50648335, "au": "falcor84", "dom": 250, "sr": 164, "sc": 1.81, "ep": 2.66, "bs": 0.85, "d": 5, "age": 9.42, "grav": 80.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 8179, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.132, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "We're answering a slightly different question - your table there is apparently of E[earnings | degree], while I was searching for E[degree | ultra-wealthy] (given the earlier comment's framing of \"People with postgraduate degrees are the wealthiest people alive\").\n\nBut yes, agreed we're getting too far into the weeds."}, {"id": 50645327, "au": "consp", "dom": 48, "sr": 165, "sc": 1.8, "ep": 1.8, "bs": 0.0, "d": 3, "age": 13.58, "grav": 140.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4595, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 0.768, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Isn't for all practicality any order over two bad for utilitary purpose? Means you should move away but not like it's a disaster of epic proportions and the world ends as we know it, like what is already happening."}, {"id": 50643595, "au": "trenchgun", "dom": 134, "sr": 166, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 4, "age": 15.82, "grav": 178.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w" lbl": "Proof & Lean (Math)", "urls": [], "ig": 0.377, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "That's not true. The neat part about Lean is that it verifies the Lean proof is correct. We have no idea whether the English proof is a faithful representation of the Lean proof."}, {"id": 50643073, "au": "IHLayman", "dom": 218, "sr": 304, "sc": -4.34, "ep": 0.83, "bs": 5.17, "d": 3, "age": 16.48, "grav": 190.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 461, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 0.351, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "But, this is the catch... you need to invest a lot of time to go into a career, only for that career to burn you out of liking the thing you spent a lot of time investing your self-worth into, while employers see that investment as a passion and derive a way to tax it (\"Why should I pay you more when you enjoy the thing that you do and would do it anyway? How low can I go?\").\n\nDoing something that is not as lucrative but gives you a sense of satisfaction means you are doing that thing out of a passion or purpose. And that is the very thing that is taxed: nurses, teachers, EMTs, firefighters... all of them are being preyed upon by the private equity class because you can lower the pay if the pay is not what is keeping the person at the position, to the point where it is subsistence wages, and the person is burning themselves up to do the job but not being paid the money equal to the worth of that person in society, just breaking the contract of capitalism.\n\nThus, I would counter that going into a field that gives you a sense of satisfaction and purpose is a bad choice, because you will be exploited, and that there really is no good option in this scenario."}, {"id": 50643474, "au": "falcor84", "dom": 110, "sr": 305, "sc": -4.38, "ep": 0.78, "bs": 5.17, /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
