: 3, "lu": 0, "w": 8, "qw": 0, "k": 3516, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": ["https://arxiv.org/abs/2609.40324"], "ig": 0.734, "fa": 2.69, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "Context: \"Cogentic: Multi-Agent Orchestration for Automated Proof Discovery\" (2026)\n\nhttps://arxiv.org/abs/2609.40324"}, {"id": 50643529, "au": "jrflo", "dom": 235, "sr": 4, "sc": 9.94, "ep": 10.09, "bs": 0.0, "d": 1, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.783, "fa": 1.23, "gp": 1.651, "bl": 0.0, "ds": 0.0, "txt": "I have been wondering the same thing. I think there are a couple explanations:\n\n1) Wall St. isn't RSI-pilled. If RSI isn't real, then the expanding intelligence we see in math and coding will produce interesting research but not a tangible productivity boost outside of software development, where it's already becoming saturated. If AI is \"normal technology\", it's growth is already priced in.\n\n2) Uncertainty. There is huge uncertainty in where AI developments are going to go in the next 3 years, and the stock market doesn't like uncertainty. ANT might 10x in the next 3 years if it hits RSI and we have a decade of progress in a single year, or it might go to zero if they slow down and open models catch up and AI becomes commoditized.\n\nPersonally, I think RSI is coming so I'm happy with my buys, but it's definitely not a sure thing."}, {"id": 50643957, "au": "Sandworm5639", "dom": 307, "sr": 5, "sc": 9.81, "ep": 9.81, "bs": 0.0, "d": 1, "age": 15.39, "grav": 170.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 26, "qw": 0, "k": 26, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": ["https://github.com/google-research/google-research/commit/4a7bc8ab0bc770e71a259b7966c500496b99010a"], "ig": 0.92, "fa": 2.35, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "Same lol, I don't trust natural language AI slop that much.\n\nThe commit message says \"Lean 4 formalizations of all six proofs will be released in a companion submission.\" https://github.com/google-research/google-research/commit/4a..."}, {"id": 50647075, "au": "pixl97", "dom": 127, "sr": 6, "sc": 9.45, "ep": 9.45, "bs": 0.0, "d": 3, "age": 11.19, "grav": 103.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.944, "fa": 1.24, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "I wish I had kept more of my communications on self driving, but they are on sites that no longer exist.\n\nNot as long as 15 years ago, but over 5 years ago I came to the conclusion that self-driving would require general intelligence capable of conceptualizing. Driving has a lot of reacting, but it requires a lot of predicting to truly be effective. It also requires very low latency. Most of the reacting can be dealt with by deterministic processes, for example sensors that show a car has appeared in front of you.\n\nThe real issue with driving is future state prediction. A whole lot of driving safety is about completely avoiding bad positions in the first place. This is where you need a world model and an understanding of humans/animals/physics, etc."}, {"id": 50644053, "au": "martythemaniak", "dom": 126, "sr": 7, "sc": 9.27, "ep": 9.42, "bs": 0.0, "d": 2, "age": 15.29, "grav": 169.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 11235, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 2.081, "fa": 0.95, "gp": 1.255, "bl": 0.0, "ds": 0.0, "txt": "We are really terrible at predicting what's easy and what's hard -- 15 years ago we were screaming at truck drivers to learn to code, lol. Another really fun story I like -- what if in the summer of 2020 (GPT-3 release) someone told you that language model was about as close to self-driving as Tesla's Autopilot was, with it's billions of miles of data and vision-first approach. Would have sounded nutty, but VLAs drive cars now. My lack of surprisal is mostly appreciating the uncertainty in dealing with unknowns.\n\nBut I generally agree, there's a lot of takes now about \"RH fell, cancer is next\", and I'm very skeptical. We'll probably see lots of progress in parts of biology or physics that already have ready-made verification systems, there's probably lots of business opportunities in building physical verifiers, and there's probably a lot potential in applying existing methods to larger data sets like the Vera Rubin telescope. But what if you need a 50B telescope and 20 years to build it in order to verify some physics hypothesis? What if you do need a RCT across a population to verify a new drug hypothesis? Progress will look a lot like classical progress then, despite AI."}, {"id": 50643808, "au": "tempusername", "dom": 296, "sr": 8, "sc": 9.11, "ep": 11.63, "bs": 2.52, "d": 0, "age": 15.54, "grav": 173.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 146, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": ["https://mathstodon.xyz/@tao/117237320796901560", "https://en.wikipedia.org/wiki/List_of_unsolved_problems_in_mathematics", "https://en.wikipedia.org/wiki/Lists_of_problems"], "ig": 1.913, "fa": 2.13, "gp": 0.734, "bl": 0.95, "ds": 0.0, "txt": "Now this is becoming clear: companies want to prove whose models are the best.\n\nAccording to the MSC (Mathematics Subject Classification) 2020, there are approximately 5,000 subfields of mathematics. If we take the 100 most important problems from each subfield, we get:\n\n5,000 × 100 = 500,000 problems.\n\nThat's roughly half a million problems in total!\n\n(Of course, my calculations are based on naive assumptions. Or I may be wrong. Technically, mathematics allows us to formulate infinitely many problems.)\n\nEven though the ocean is vast, it isn't as easily usable as a river[0]. Similarly, the mathematical problem space is enormous, but we need a manageable and meaningful set of problems for math community to be operational.\n\n[0].https://mathstodon.xyz/@tao/117237320796901560\n\nPerhaps these problems could serve as a benchmark for measuring mathematical intelligence. Just look at the following link to get an idea of how many problems are out there. All of them could potentially be used to measure the intelligence of these models.\n\nhttps://en.wikipedia.org/wiki/List_of_unsolved_problems_in_m...\n\nhttps://en.wikipedia.org/wiki/Lists_of_problems"}, {"id": 50642416, "au": "abixb", "dom": 309, "sr": 9, "sc": 8.69, "ep": 8.69, "bs": 0.0, "d": 1, "age": 17.58, "grav": 211.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 67, "qw": 11, "k": 4406, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": ["https://en.wikipedia.org/wiki/Ultimate_reality"], "ig": 1.475, "fa": 1.04, "gp": 1.559, "bl": 0.0, "ds": 0.0, "txt": ">Math is going through its own version of the industrial revolution.\n\nGiven that math is, for better or worse, the best tool we have to accurately represent and build models of our reality, what will this mean for our understanding of ultimate reality? [0] It's wild, to be honest.\n\nI'm also hoping that AI is able to narrow the gap between theoretical and highly abstract math and their practical application in bettering the human condition.\n\nWhat a time to be alive.\n\n[0] https://en.wikipedia.org/wiki/Ultimate_reality"}, {"id": 50642765, "au": "vlovich123", "dom": 298, "sr": 10, "sc": 8.45, "ep": 8.45, "bs": 0.0, "d": 1, "age": 17.04, "grav": 201.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 34, "k": 16820, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.768, "fa": 1.1, "gp": 0.803, "bl": 0.0, "ds": 0.0, "txt": "> Are we going to see factorization on classical computers with this?\n\nGNFS would take 10^47 operations while this takes 10^2572 for a 4096 bit rsa key. The only improvement here is that this is guaranteed to work for arbitrary numbers.\n\n> Any opinions on the possibility of a novel algorithm to allow large int factorization,\n\nMy money would be no for normal RSA key sizes\n\n> and will post quantum algorithms also help protect against these?\n\nElliptic curve cryptography already uses a different mechanism that isn’t susceptible to factorization improvements. Post quantum algorithms are similar but in using other mathematical building blocks but they’re really meant to fight a hypothetical quantum computer - without that elliptic curve and other classical methods are preferable as they’re smaller keys and much more efficient."}, {"id": 50646599, "au": "ion_trapper", "dom": 70, "sr": 11, "sc": 8.44, "ep": 8.44, "bs": 0.0, "d": 5, "age": 11.77, "grav": 112.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 330, "qw": 0, "k": 88, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 2.059, "fa": 0.78, "gp": 0.947, "bl": 0.0, "ds": 0.0, "txt": "Not following why factoring being easy would imply other quantum problems being harder. The entire field of quantum computing essentially sits on the stilts of Shor’s algorithm. It is the only clear end-to-end exponential algorithmic speedup. Because of this, people have conjectured that quantum computers would have exponential speedups for other problems too, but to date nothing else has reached the same clear utility as Shor’s. Other problems tend to fall into one of several categories:\n\n1) modest polynomial speedups, like Grover’s algo, which also requires you prepare a quantum oracle. unclear if this ever beats a classical computer end to end for a practical problem\n\n2) random circuit sampling (ie any claims of quantum “supremacy” to date), which solves no interesting problem\n\n3) intrinsically quantum problems like Hamiltonian simulation for which it is unclear whether a QC actually has algorithmic advantage for interesting observables, as opposed to just being a good classical analog computer for solving such problems. These are exactly the problems that tend to fall to classical methods when sufficient compute and algorithmic advances are applied to them, and I suspect would fall especially quickly with AI assistance.\n\nThe fundamental problem is that once Shor was published, there has been a huge effort on the quantum side to figure out “what other problems can a QC solve"}, {"id": 50642719, "au": "thomasahle", "dom": 342, "sr": 12, "sc": 7.48, "ep": 7.48, "bs": 0.0, "d": 0, "age": 17.08, "grav": 201.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 7006, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 2.056, "fa": 0.5, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "Summary of the new results versus previous established bounds:\n\n1. Integer factorization (randomized / Las Vegas):\n\n- New: `L_N[1/3, 105]`\n\n- Previous: L_N[1/2, 1]\n\nIn practice the General Number Field Sieve was assumed to run in L_N[1/3, 1.923] time. But it's unproven.\n\nHere L_N[a,c] = exp((c+o(1)) * (log N)^a * (log log N)^(1-a)).\n\n2. Discrete logarithms:\n\n- New: exp((2+o(1)) * (log n)^2 / log log log n)\n\n- Previous: exp(O((log n)^2))\n\nSo it wins by logloglogn in the denominator.\n\n3. Approximate Nash equilibrium\n\n- New: polynomial time for epsilon = 1/5\n\n- Previous: polynomial time for epsilon = 1/3 + delta\n\n4. Deterministic integer factorization\n\n- New: exp(O((log N)^(3/4)))\n\n- Previous established bound: N^(1/5+o(1))\n\n5. Log-rank conjecture (How many bits do you need to communicate to compute a boolean function f(x,y) \\in {0,1}?)\n\n- New: O(r^0.499995)\n\n- Previous: O(r^0.5)\n\n6. Can you reconstruct a graph given all m subgraphs obtained by deleting exactly one edge?\n\n- New: m >= 1000n\n\n- Previous: m > n log_2(n)"}, {"id": 50642700, "au": "martythemaniak", "dom": 97, "sr": 13, "sc": 7.33, "ep": 7.63, "bs": 0.0, "d": 0, "age": 17.11, "grav": 202.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 196, "qw": 0, "k": 11235, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.891, "fa": 0.34, "gp": 1.526, "bl": 0.0, "ds": 0.0, "txt": "I don't think the recent spate of math discoveries should be very surprising. Consider 10 years ago when AlphaGo beat Lee Sedol, what was really happening there? You had an very large search space (all possible Go moves) that humans had been navigating by a combination of intuition, trial-and-error and passing knowledge between master-student. Then a program was build that could explore that search space both from existing searches (AlphaGo) and from scratch (AlphaGo Zero), and the program found some interesting results (winning moves no one had thought of before).\n\nToday's LLMs are vastly bigger and they operate in an immensely larger search space (all of symbolic representation of the world) using immensely more power, and now they're finding results in that search space that people could not. In both cases, the space-search program needed a way to verify whether its results were valid - the Go board in AlphaGo's case, and Lean in current math work. So it really shouldn't be surprising that the space-searchers found something people either missed or was too big/far away to be accessible (that is, it is unknown whether the current RH proof can be simplified and/or understood like classical human proofs)"}, {"id": 50644765, "au": "throwaway0123_5", "dom": 210, "sr": 14, "sc": 7.23, "ep": 7.38, "bs": 0.0, "d": 4, "age": 14.39, "grav": 153.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 63, "qw": 17, "k": 307, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": ["https://en.wikipedia.org/wiki/Nazi_human_experimentation", "https://en.wikipedia.org/wiki/Unit_731", "https://en.wikipedia.org/wiki/Guatemala_syphilis_experiments"], "ig": 1.317, "fa": 1.04, "gp": 0.913, "bl": 0.0, "ds": 0.0, "txt": "> if there are ways to advance science you cannot dismiss them because you don't like the method\n\nI would argue that there are plenty of examples of \"methods for advancing science\" that were not dismissed and should have been because the methods were abhorrent:\n\nhttps://en.wikipedia.org/wiki/Nazi_human_experimentation\nhttps://en.wikipedia.org/wiki/Unit_731\nhttps://en.wikipedia.org/wiki/Guatemala_syphilis_experiments\nhttps://en.wikipedia.org/wiki/Unethical_human_experimentatio...\n\nAI doesn't quite so obviously fall into the category of \"abhorrent methods,\" but it isn't too hard to think of good faith arguments that using it to mass-manufacture scientific discovery is net-bad for science and/or humanity."}, {"id": 50643824, "au": "wasabi991011", "dom": 335, "sr": 15, "sc": 7.1, "ep": 7.1, "bs": 0.0, "d": 2, "age": 15.53, "grav": 173.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 19, "k": 1149, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.602, "fa": 0.76, "gp": 0.809, "bl": 0.0, "ds": 0.0, "txt": "> Can a PhD in math or theoretical CS not be about using models and agents to more efficiently explore ideas?\n\nThe previous comment wasn't about simply \"using AI\", but about the enormous imbalance in research power that these AI labs have.\n\nAnd in that context, no, Math and TCS PhDs can't \"just use AI models too\". They don't have access to the same models that these companies do, nor the same amount of tokens available to throw at the problem (by orders of magnitude). Even just for the 200x AI plans (still very limited compared to AI labs), I don't know of any Math or Theoretical CS prof willing to pay for the subscription for all their students, and most PhD funding is low enough that the subscription is really hard to justify paying yourself."}, {"id": 50644906, "au": "gukoff", "dom": 264, "sr": 16, "sc": 6.6, "ep": 6.6, "bs": 0.0, "d": 0, "age": 14.2, "grav": 150.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 261, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.84, "fa": 0.5, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "The form of the integer factorization result is a bit surprising.\n\nIt's built on top of the general number field sieve (GNFS) which already gives a MUCH better asymptotic complexity than Google's algorithm. But GNFS relies on three unproven heuristics/conjectures.\n\nCogentic ended up not proving these conjectures, but replacing parts of GNFS that relied on them, paying a big complexity tax.\n\nThe result is still curious, but the bar for the AI proofs has been raised so high, that I'd expect it to successfully attack those conjectures directly."}, {"id": 50646021, "au": "pixl97", "dom": 54, "sr": 17, "sc": 6.51, "ep": 6.88, "bs": 0.0, "d": 4, "age": 12.59, "grav": 124.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 141, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": ["https://www.geotrust.com/research/state-of-ssl"], "ig": 1.754, "fa": 0.62, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "If this site is to be believed the internet has done a decent job of moving to TLS 1.3 and post quantum.\n\nhttps://www.geotrust.com/research/state-of-ssl\n\nThe real problems start to show up in legacy systems that didn't use forward secrecy, that is that secret information may now be disclosed. That and legacy systems that are going to be difficult to upgrade or patch as they are mostly not being updated or are very fragile to large updates like this.\n\nWhile these legacy systems should not be directly exposed to the internet, with the number of exploits coming out you should expect they are still under high risk from attacks on compromised hosts inside the network. Worse these systems are typically not designed for things like zero trust networks so there may be billions of dollars of software and hardware that is no longer fit for purpose."}, {"id": 50649609, "au": "nix-zarathustra", "dom": 231, "sr": 18, "sc": 6.36, "ep": 6.65, "bs": 0.0, "d": 4, "age": 7.4, "grav": 56.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 81, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.487, "fa": 0.68, "gp": 0.84, "bl": 0.0, "ds": 0.0, "txt": "In 1996, Deep Blue was released and could beat a human in chess. By the early 2010s, consumer hardware could easily run a chess engine significantly better than Deep Blue. In 10 to 20 years you will likely be able to run a frontier model today on consumer hardware, with better hardware and faster software."}, {"id": 50642665, "au": "lifeisstillgood", "dom": 277, "sr": 19, "sc": 6.15, "ep": 6.37, "bs": 0.0, "d": 0, "age": 17.16, "grav": 203.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 23962, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.657, "fa": 0.34, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "So with Claude, openAI and google all taking bites out of previously impossible problems, it’s fair to say frontier labs all teachers tipping point (presumably measureable in parameters?) - and that (with a lot of caveats) it’s just a question of scale - that it really does not matter if China or enemy-du-jour is 9 months behind, it’s a state level throw money at the problem\n\nIs there any assumption that now these things are able to bring concepts together (not gracefully) from vastly different fields, that they will hit a wall - that if they are unable to get to relativity from 1901 data - then they cannot get to unified gravity etc because we have not got there ?"}, {"id": 50646402, "au": "Animats", "dom": 24, "sr": 20, "sc": 6.13, "ep": 6.86, "bs": 0.0, "d": 6, "age": 12.04, "grav": 116.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 116, "qw": 0, "k": 168316, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": ["https://hackaday.io/project/1569-nsa-away/details"], "ig": 1.491, "fa": 0.62, "gp": 1.097, "bl": 0.0, "ds": 0.0, "txt": "That is an option. You have a hardware device which generates long random keys and writes them to two identical output devices. The device has no persistent internal memory - just a ROM with the program and the hardware generator. Before every generation it's powered off and on again to clear it.\n\nSuch key generators exist, and are used for important government point to point links. Embassy to State Department links work that way. Hackaday has a design you can build.[1] It writes the same random bits to two SD cards.\n\nThe end of public key encryption means you can only communicate securely with someone by pre-arrangement. Your bank, yes. Bank to bank,yes. User to random web sites, no.\n\n[1] https://hackaday.io/project/1569-nsa-away/details"}, {"id": 50644136, "au": "HarHarVeryFunny", "dom": 257, "sr": 21, "sc": 6.03, "ep": 6.47, "bs": 0.0, "d": 1, "age": 15.21, "grav": 167.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 8399, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.911, "fa": 0.34, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "The market sliding isn't really a prediction of the potential of AI (or LLMs for now), but more about the valuation of the stocks and the risk of some of them, such as CoreWeave, remaining solvent.\n\nMath results are cool, but of course don't have much value. Earning $1M prize money for proving RH doesn't move the needle on a $1T stock. The stock market is going to want to see revenue and earnings.\n\nIt's normal behavior for stock market sectors to move as a whole - the good and the bad moving together. The AI/datacenter sector may currently be getting flushed, but the ones with real value will rise back up.\n\nI do find the ANT slump rather amusing - reminds me of Adam Sandler's character yelling at his golf ball \"that's your home! go to your home!\". Not clear yet where ANT's home is though."}, {"id": 50642677, "au": "jvanderbot", "dom": 329, "sr": 22, "sc": 5.98, "ep": 6.12, "bs": 0.0, "d": 1, "age": 17.14, "grav": 203.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 19424, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.677, "fa": 0.34, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "My PhD was 30-50% applied, with small proofs of correctness vs adversarial worlds. Essentially build a robot to a novel task, prove it out, and go one step further and prove its policies cannot be beat within polynomial factor of optimal in the real world.\n\nI say this b/c I can imagine still doing all that work today, if I hadn't done it then. The real work was so far from these highfalutin proofs. And I think the experimental phase would have been _much_ easier with a little LLM sugar."}, {"id": 50650602, "au": "jrflo", "dom": 237, "sr": 23, "sc": 5.77, "ep": 6.66, "bs": 0.0, "d": 3, "age": 5.34, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.816, "fa": 0.34, "gp": 0.979, "bl": 0.0, "ds": 0.0, "txt": "I don’t work at the big labs but I’ve made fully automated harnesses for machine learning research on more niche problems. Even the public models like opus build excellent ML models with no human in the loop, far faster than I could. I entered one in a kaggle competition as a curiosity and it got to the top 1% without me doing anything. A lot of people on Kaggle are winning competitions with fully automated or mostly automated harnesses. It’s easy to imagine that this would speed up ML research, especially with their internal models.\n\nIt’s also been generalizing too, 6 months ago it was terrible at mechanical design, but now I can have Claude do full 3d actuator work for me.\n\nThis experience, plus the METR report, plus the recent math results, makes be believe RSI may not be too far away.\n\nAnd the thing about RSI is that models only need to be good at ML research for the uplift to eventually extend with other fields too."}, {"id": 50642784, "au": "dgacmu", "dom": 338, "sr": 24, "sc": 5.46, "ep": 5.46, "bs": 0.0, "d": 0, "age": 16.99, "grav": 200.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 8156, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.82, "fa": 0.0, "gp": 0.817, "bl": 0.0, "ds": 0.0, "txt": "I'm amused that their integer factorization paper notes that you can verify the primes using AKS; clearly, someone needed to poke their AI and mention the GRH result so they could have used Miller. :-)\n\nAlso, \"effectively computable constants\" is, uh, true, but a little generous for an ln(n)^6 runtime.\n\nSince several comments ask about the practical effect of this paper for things like factorization: None at all. What it shows is that you can reliably achieve the same asymptotic runtime that we get with the current practical factoring approach, the general number field sieve. Where \"reliably\" means \"with an algorithm you wouldn't want to run because it has a massive constant so just keep using GNFS\""}, {"id": 50644936, "au": "supern0va", "dom": 102, "sr": 25, "sc": 5.43, "ep": 6.53, "bs": 0.0, "d": 4, "age": 14.16, "grav": 149.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 19, "k": 715, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.365, "fa": 0.64, "gp": 1.033, "bl": 0.0, "ds": 0.0, "txt": "> When we say AI capabilities are jagged, don't we mean precisely that generalization of capability has not been achieved.\n\nI think it's a bit more nuanced than that. I have a side project in a domain that I am fairly certain has not materially expanded in the training data over the last few years, since it's unlikely something being tuned with RLHF or RLVR. And yet, I see capabilities increasing.\n\nMy intuition here is that generalization is happening, but nonetheless lags what you're explicitly training on and deriving some degree of generalization from. If you're training on math and code, those perform best, but logic comes along for the ride. Rising tides lift all boats, but some boats are nonetheless at the peak of the wave and above the other boats, if we need a (kind of mediocre) analogy.\n\nI'm curious if others have seen similar or are getting that vibe as well."}, {"id": 50645279, "au": "ben_w", "dom": 112, "sr": 26, "sc": 5.4, "ep": 6.06, "bs": 0.0, "d": 6, "age": 13.64, "grav": 141.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.473, "fa": 0.5, "gp": 0.812, "bl": 0.0, "ds": 0.0, "txt": "Good news and bad news.\n\nBad news is, the richest people in the world are racing as hard as possible to push this everywhere, and appear to be succeeding in important places where they shouldn't, for example the US federal government.\n\nGood news is, this is so wildly unpopular it appears to have been a contributing cause to why the most recent election went the way it did."}, {"id": 50642909, "au": "bscphil", "dom": 2, "sr": 27, "sc": 5.23, "ep": 5.89, "bs": 0.0, "d": 1, "age": 16.76, "grav": 195.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 8426, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.525, "fa": 0.34, "gp": 0.924, "bl": 0.0, "ds": 0.0, "txt": "I've been thinking about what I'd do if I worked at one of these labs with access to a usable (not galactic) \"factorization in P\" result. I think the only reasonable thing would be to post a public factorization of the 2048 bit RSA challenge number. Basically, it's pretty easy to give the necessary warning to the world that would push us to fix crypto before it's public, there's no need to dump the full result publicly right away. You also want to avoid the risk of something like that becoming a 3-letter-agency secret for the next several years."}, {"id": 50642746, "au": "lf88", "dom": 322, "sr": 28, "sc": 5.18, "ep": 5.62, "bs": 0.0, "d": 0, "age": 17.05, "grav": 201.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 239, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.825, "fa": 0.0, "gp": 0.917, "bl": 0.0, "ds": 0.0, "txt": "Superficially, all these recent successes in mathematics seem like something to be celebrated. However, I cannot celebrate what I think are the first steps towards a bleak future where human intelligence becomes irrelevant.\nI suspect humanity will very soon regret having taken the technological path of full automation of our cognitive functions, instead of developing tools to empower people and augment our intelligence. I hope it won’t be too late to change course."}, {"id": 50645551, "au": "exmadscientist", "dom": 69, "sr": 29, "sc": 5.02, "ep": 6.12, "bs": 0.0, "d": 4, "age": 13.29, "grav": 135.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 19, "k": 5969, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.526, "fa": 0.42, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "> If we solve factoring classicaly, there’s very little chance all those other problems don’t also have good-enough classical algorithms\n\nIsn't it the exact opposite: if integer factoring is a weak problem, doesn't that mean other problems are likely to be harder?\n\nFactoring has been known to be sketchy for decades; it's why people developed alternatives to RSA in the first place. If it falls into a non-galactic, practical classical algorithm, it would be big news but not break the universe of cryptography. So that doesn't say much about discrete logs.\n\nYour broader point that quantum computers don't have much to offer here is entirely correct, though. Even the quantum factoring algorithms barely work."}, {"id": 50643791, "au": "koolherc", "dom": 66, "sr": 30, "sc": 4.81, "ep": 5.91, "bs": 0.0, "d": 2, "age": 15.57, "grav": 174.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 127, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.301, "fa": 0.68, "gp": 0.632, "bl": 0.0, "ds": 0.0, "txt": "Handshakes have been ECDHE for years, but a lot of the identity layer underneath is still RSA, because nobody changes the defaults.\nTake Kubernetes: as far as I know kubeadm generates the cluster's keys and certs as RSA-2048 unless you set encryptionAlgorithm, and the cluster CA is valid for 10 years by default. Similar story with cert-manager and Istio."}, {"id": 50645900, "au": "pixl97", "dom": 34, "sr": 31, "sc": 4.76, "ep": 5.42, "bs": 0.0, "d": 5, "age": 12.79, "grav": 127.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 9, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.465, "fa": 0.42, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": ">You can still move letters like they always did.\n\nNa, not really.\n\nTechnological progress and privacy may be diametrically opposed at a fundamental level of reality. If that is the case the future of humanity is going to be really really messy.\n\nWe're already at the point that almost all metadata of who is contacting who is known. Knowing who contacted who at which times can start narrowing probabilities to the point that you no longer need exact answers. Get enough metadata and you might as well have actual data as you approach unity."}, {"id": 50644751, "au": "dgoldstein0", "dom": 116, "sr": 32, "sc": 4.68, "ep": 6.01, "bs": 0.0, "d": 4, "age": 14.41, "grav": 153.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 970, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.555, "fa": 0.28, "gp": 1.071, "bl": 0.0, "ds": 0.0, "txt": "We've answered a lot.  What we don't know seems to boil down into extreme conditions\n- super large masses and high energies\n- tiny things far too small to measure, eg various things smaller than a hydrogen atom\n- some stuff we can model but where the math gets too gnarly to solve & predict stuff\n\nAnd combinations of those.\n\nIs there an open physics problem that doesn't fall into the above? Maybe dark energy as we don't quite know what it is"}, {"id": 50645243, "au": "sdenton4", "dom": 229, "sr": 33, "sc": 4.5, "ep": 5.82, "bs": 0.0, "d": 4, "age": 13.68, "grav": 141.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 11039, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.904, "fa": 0.0, "gp": 0.926, "bl": 0.0, "ds": 0.0, "txt": "Labor investment also has financial implications. My point is that, historically, the Investment side of ROI has been extremely low for mathematics, thanks to relatively low costs.\n\nAt the same time, the returns include not just research results, but educating generations of engineers, statisticians, etc, in the core mathematics needed to power society. Additionally, people trained in mathematics in undergraduate often pick up skills which let the cross over for great success in a diversity of fields like computer science and law.\n\nOverall, I believe the ROI for mathematics has been very good."}, {"id": 50642161, "au": "david-gpu", "dom": 308, "sr": 34, "sc": 4.49, "ep": 5.52, "bs": 0.0, "d": 0, "age": 17.96, "grav": 218.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 5968, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.611, "fa": 0.22, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Cogentic appears to be a specialized harness for existing LLMs to collaborate together to solve mathematical conjectures, using a central orchestrator and a shared database of intermediate proofs.\n\nAnd with just that, using Gemini 4 Argon, they have already obtained a number of interesting results? Math is going through its own version of the industrial revolution."}, {"id": 50644810, "au": "dreamcompiler", "dom": 304, "sr": 35, "sc": 4.37, "ep": 5.61, "bs": 0.0, "d": 3, "age": 14.35, "grav": 152.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 17685, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.483, "fa": 0.34, "gp": 0.8, "bl": 0.0, "ds": 0.0, "txt": "Humans being what they are, the first quantum computer that can do practical integer factorization will be used for just that, setting off a gold rush among everyone rich enough to build one. Startups will be funded, quantum data centers will be built, and the resulting bubble based on thievery will make everybody reminisce about 2026."}, {"id": 50643826, "au": "howunfortunate", "dom": 249, "sr": 36, "sc": 4.14, "ep": 5.68, "bs": 0.0, "d": 4, "age": 15.53, "grav": 173.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 69, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": ["https://doctorateguru.com/wp-content/uploads/2024/06/Salary-Comparison-by-Degrees-in-Top-Majors-M.Sc_.-vs.-Ph.D.jpg"], "ig": 1.199, "fa": 0.62, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "Looks like PhD eng cleanly beats MBA: https://doctorateguru.com/wp-content/uploads/2024/06/Salary-...\n\nAt a certain point we're getting too far in the weeds though.\n\nPursuing a PhD is itself a behavioral signal that one doesn't value money, or at least that one is willing to defer money for a very long time.\n\nBut I do think the general point holds that those who hold a lot of intelligence and knowledge are frequently capable of converting that into high income."}, {"id": 50643084, "au": "js8", "dom": 14, "sr": 37, "sc": 4.1, "ep": 4.98, "bs": 0.0, "d": 2, "age": 16.46, "grav": 190.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 8720, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.408, "fa": 0.28, "gp": 0.603, "bl": 0.0, "ds": 0.0, "txt": "As someone who hopes for a usable algorithm for NP (a quasipolynomial with small constants would be fine), I think realize that the encryption is not everything, and benefits (for optimization) would outweight the costs. Honestly it might not even be that a bad world if people can read each others communications.\n\nBut for factoring or discrete log specifically.. I don't care that much. You can try to keep it a secret if you want."}, {"id": 50642501, "au": "sidkshatriya", "dom": 310, "sr": 38, "sc": 4.08, "ep": 5.47, "bs": 0.0, "d": 2, "age": 17.43, "grav": 208.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 22, "k": 1267, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.403, "fa": 0.42, "gp": 0.673, "bl": 0.0, "ds": 0.0, "txt": "> Given that math is, for better or worse, the best tool we have to accurately represent and build models of our reality\n\nDon't fully agree.\n\nMath is unrestrained and unconstrained. Set various axioms and you can build complex worlds very different from our current universe.\n\nSo I would say the best tool is Physics to represent and build models of our reality. Physics is like a subset of Math which is actually the ground truth in our universe."}, {"id": 50643187, "au": "noodlesUK", "dom": 99, "sr": 39, "sc": 4.07, "ep": 5.61, "bs": 0.0, "d": 2, "age": 16.32, "grav": 187.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 6386, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.803, "fa": 0.0, "gp": 0.95, "bl": 0.0, "ds": 0.0, "txt": "I completely agree with this. A family member of mine who did her PhD in plant genetics in the 80s often makes remarks about how her entire PhD experimental method would be doable in a weekend with modern equipment and bioinformatics.\n\nThis does not mean that biology is solved at all, just that it's changed dramatically in a few decades, and the questions that are being asked and answered are different.\n\nEven with current genAI tools like Claude, I can one-shot certain programming tasks that would have taken me days of fiddling in the past. I wouldn't say that my workload has materially increased or decreased though, it has just changed in character substantially."}, {"id": 50652511, "au": "cheema33", "dom": 294, "sr": 40, "sc": 3.97, "ep": 5.07, "bs": 0.0, "d": 2, "age": 0.14, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1759, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.792, "fa": 0.0, "gp": 0.589, "bl": 0.0, "ds": 0.0, "txt": "I guess if you are holding a sizable Bitcoin bag, you are betting that none of the rapid AI advancements, that appear to be accelerating by day, are coming for your Bitcoin stash.\n\nI can regenerate my SSH keys. Use a new algorithm, use whitelisted IPs etc. etc. to protect my server and improve security. You can't protect your bitcoin, if and when the algorithm is broken. You could put it inside the world's safest safe and drop it in Mariana Trench. And that wouldn't be enough."}, {"id": 50643056, "au": "BatchJob", "dom": 135, "sr": 41, "sc": 3.95, "ep": 5.49, "bs": 0.0, "d": 2, "age": 16.52, "grav": 191.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 228, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.438, "fa": 0.22, "gp": 1.027, "bl": 0.0, "ds": 0.0, "txt": "It is highly unlikely in the millions of lines of Lean code that there is not a single hallucination.\n\nMost of these LLMs cant get through a paragraph without some fundamental misunderstanding. (Which is simply misquotation since LLMs do not understand anything at all)\n\nHuman reductions of the proof will ignore the hallucinations and attempt to cover for the LLM and likely will not be provable.\n\nWe think it proves something in Lean.  But its doubtful it proves what it was asked to prove."}, {"id": 50643802, "au": "spot5010", "dom": 233, "sr": 42, "sc": 3.87, "ep": 5.42, "bs": 0.0, "d": 4, "age": 15.56, "grav": 173.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 212, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.532, "fa": 0.28, "gp": 0.702, "bl": 0.0, "ds": 0.0, "txt": "This part makes me a bit sad. I'm hoping open source models that are specifically trained for math will be good enough to keep advancing the frontier. While larger models generalize well, I don't see why an LLM used for theorem proving, lean formalization, and exposition needs to know every bit of random information on the internet."}, {"id": 50643032, "au": "sdenton4", "dom": 227, "sr": 43, "sc": 3.87, "ep": 5.41, "bs": 0.0, "d": 2, "age": 16.55, "grav": 191.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 11039, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.858, "fa": 0.0, "gp": 0.718, "bl": 0.0, "ds": 0.0, "txt": "OTOH, the resources needed for research mathematics are tiiiiiiiiny compared to just about everything else.\n\nA mathematician and a physicist are eating in the university cafeteria. The mathematician sez, 'Hey, you guys use up so much money with your particle colliders, electron microscopes, and lasers and stuff. All we mathematicians need are paper, pencils, and wastebaskets.'\n\nAt this point, a philosopher sitting nearby pipes in, 'Ha, we've got you beat! All we need is paper and pencil!\""}, {"id": 50644979, "au": "newyankee", "dom": 151, "sr": 44, "sc": 3.83, "ep": 5.37, "bs": 0.0, "d": 1, "age": 14.07, "grav": 148.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1430, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.507, "fa": 0.34, "gp": 0.595, "bl": 0.0, "ds": 0.0, "txt": "It seems straightforward in hindsight but Demis referred to this in many of his interviews since eternity. It was about how probably a lot of things do not need brute force and probably a pattern exists in nature like evolution. Since 2022 though the compute availability and the incentive to break a lot of these became true but I still feel heavy lifting is done by the bitter lesson"}, {"id": 50642575, "au": "cogman10", "dom": 299, "sr": 45, "sc": 3.82, "ep": 5.21, "bs": 0.0, "d": 1, "age": 17.3, "grav": 206.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 9, "k": 22959, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.068, "fa": 0.64, "gp": 0.605, "bl": 0.0, "ds": 0.0, "txt": "> will post quantum algorithms also help protect against these?\n\n\"Post quantum\" really just means \"doesn't rely on integer factorization\".  It's possible there are other quantum algorithms that could attack current best asymmetric cryptography (though it seems unlikely)."}, {"id": 50643728, "au": "mtlmtlmtlmtl", "dom": 260, "sr": 46, "sc": 3.81, "ep": 5.35, "bs": 0.0, "d": 3, "age": 15.65, "grav": 175.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 5672, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.825, "fa": 0.0, "gp": 0.735, "bl": 0.0, "ds": 0.0, "txt": "It's possible that most of the profits will be generated not by frontier labs, but by LLM users in general, while models become commoditised and optimisation leads the growth in needed compute to level off.\n\nIn the market so far, the prevailing story has been one based on a massively, accelerated buildout of datacentres. So most of the valuation(private or public) has been in frontier labs, cloud companies, chip companies and derivatives like utilies and GEV(gas turbines).\n\nIf the above scenario happens a lot of that investment has been completely misplaced ans the market must go down."}, {"id": 50643110, "au": "fn-mote", "dom": 337, "sr": 47, "sc": 3.72, "ep": 5.12, "bs": 0.0, "d": 2, "age": 16.42, "grav": 189.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 6, "k": 4953, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.294, "fa": 0.42, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "> not at risk of being scooped\n\nIt is at risk of being useless.\n\nA PhD is supposed to involve novel work. I’m unsure of the novelty of using AI to explore ideas - are you going to come up with a novel way of doing that? And what training would help you? Every day people are telling Claude “make no mistakes, try harder”."}, {"id": 50647131, "au": "idiotsecant", "dom": 27, "sr": 48, "sc": 3.71, "ep": 4.59, "bs": 0.0, "d": 5, "age": 11.1, "grav": 102.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 8706, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.668, "fa": 0.0, "gp": 0.463, "bl": 0.0, "ds": 0.0, "txt": "Once again HN missing the forest for the trees. Such an event would be cataclysmic because it would disrupt all the processes that make the modern world work. Covid showed us that we are the ragged edge of brittle system failure at all times. This would be covid x1000. It would break supply chains, energy markets, food and drug supplies, literally everything. Yes, the entire system could be rebuilt after an event like that but it's the sort of thing that has a whole chapter in the history books. It would be an epoch in the history of modern humanity .\n\nIt would be very bad."}, {"id": 50644294, "au": "vkgcr", "dom": 236, "sr": 49, "sc": 3.68, "ep": 5.22, "bs": 0.0, "d": 2, "age": 15.0, "grav": 163.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 160, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.386, "fa": 0.28, "gp": 0.801, "bl": 0.0, "ds": 0.0, "txt": "Honest question : why are you RSI-pilled? In the sense, what evidence has led you to believe that LLMs will lead to RSI?\n\nIs there any evidence that setting up a training loop like karpathy's autoresearch will lead to RSI? Or is it just faith?\n\nI'm not trying to be snarky, perhaps you work in one of the big labs and have more insight on the state of RSI (I'm personally agnostic)."}, {"id": 50646387, "au": "phkahler", "dom": 280, "sr": 50, "sc": 3.63, "ep": 4.29, "bs": 0.0, "d": 0, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 24044, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.351, "fa": 0.28, "gp": 0.216, "bl": 0.0, "ds": 0.0, "txt": "What does this mean for factoring? My understanding until now was that the fastest algorithms in practice still had probability issues - either they worked in a sub-exponential time with some probability of failure, or they always gave a factorization but the complexity limit was probably sub-exponential. Something like that. So do these two new paper simply reinforce upper bounds with determinism? That'd still be a useful result, but it's nothing like putting factorization in P. Did I get that right?"}, {"id": 50643061, "au": "kannanvijayan", "dom": 98, "sr": 51, "sc": 3.49, "ep": 5.03, "bs": 0.0, "d": 1, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 1547, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.535, "fa": 0.0, "gp": 0.983, "bl": 0.0, "ds": 0.0, "txt": "My father was a botanist that went into plant genetics research and I remember him describing to me at one point how it felt when the later sequencing technologies came online in that field.\n\nA scientist could spend an entire lifetime characterizing a single gene with careful meticulous breeding and old techniques for sequencing.  At some point sequencing machines started producing entire libraries of mRNA transcripts in one run.  Things moved on, and new techniques were invented to leverage these tools.  Metagenomics and whole population transcriptome analysis were just like, born.\n\nI don't think math is threatened at all here - we just don't know where the new frontier is yet.  Something humans had been hand-digging at with picks and chisels is now being excavated by mass earth movers.  The frontier will move to the limits of these tools."}, {"id": 50646099, "au": "cman1444", "dom": 240, "sr": 52, "sc": 3.43, "ep": 4.97, "bs": 0.0, "d": 3, "age": 12.46, "grav": 122.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 307, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.752, "fa": 0.0, "gp": 0.591, "bl": 0.0, "ds": 0.0, "txt": "I don't think the product is sticky at all. It's extremely easy to switch model providers, and cheaper ones are mere months behind. Their entire business model relies on maintaining that lead, and in order to do so they have to burn immense piles of cash on training each new model. If they stop doing that then the gap closes almost instantly and those revenues evaporate.\n\nThey're running a marathon by sprinting all out the whole time. Their only hope is not just that growth is exponential, but that their exponential growth has a larger exponent than their competitors' exponential growth."}, {"id": 50643007, "au": "bemtevi", "dom": 323, "sr": 53, "sc": 3.43, "ep": 4.67, "bs": 0.0, "d": 1, "age": 16.59, "grav": 192.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.661, "fa": 0.0, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "In all human endeavours, it's good to have some \"space without\", or space just to think and create without always being bothered by stimuli and progress. I think that's fundamental to math, to art, etc. LLMs counter that. They're great at squeezing out what was missed before and coagulating knowledge to gain some insight but their nature runs counter to fostering the creative spirit. And it's this spirit that is more important to innovation and creativity in the long-term, compared to refining and mass production that the focus of LLM-productivity today."}, {"id": 50650048, "au": "TacticalCoder", "dom": 243, "sr": 54, "sc": 3.4, "ep": 4.94, "bs": 0.0, "d": 2, "age": 6.52, "grav": 47.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 10581, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.784, "fa": 0.0, "gp": 0.513, "bl": 0.0, "ds": 0.0, "txt": "Isn't there another possibility: RSI is real, but there are physical limitations and we're already close to those and those limitations shall prevent AGI?\n\nWe've already seen many models getting very close to each other in capabilities.\n\nMaybe there's going to be RSI up until some plateau?\n\nAs an aside I'd point out that planes country-wide being stuck to the ground and overall everything working way shittier than before doesn't exactly inspire confidence in the \"good\" AI is bringing so far to systems/codebases.\n\nWall Street has a \"show me the money\" mentality: now you deliver software that works, planes and trains that leave on time, bank websites that are secure, etc. Or your valuation GTFO."}, {"id": 50642926, "au": "hgoel", "dom": 312, "sr": 55, "sc": 3.36, "ep": 4.9, "bs": 0.0, "d": 2, "age": 16.72, "grav": 195.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "For math to improve our modeling of reality, I think it's going to have to be able to produce meaningul new \"tools\", not just brute force use of existing tools to produce an ultra long, garbage filled proof/counter-example. Thus far we haven't really seen this kind of thing happening.\n\nGranted, this is partly because the companies are clearly not that interested in actually contributing to research, if Alpoge's recent behavior is anything to go by. If they cared they wouldn't be dumping 17 million lines of code where they knew most of it was junk and \"joking\" about 250k page writeups coming at some future point."}, {"id": 50643355, "au": "gregdeon", "dom": 125, "sr": 56, "sc": 3.36, "ep": 4.83, "bs": 0.0, "d": 1, "age": 16.1, "grav": 183.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 100, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.692, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't go so far as to say that it's not surprising. I personally expected the slow march of progress to continue -- there's no reason why an IMO gold medal should be the peak -- but I never would have guessed that problems like RH or matrix multiplication would have been fully resolved this year. I don't think I'm alone, either: a month ago, Terry Tao said he expected some progress on RH by 2050!\n\nThat said, I do agree that there are similarities. My mental model of what's going on here is proof assistants have made math into a game-like environment, so much that we know about making superhuman game AI carries over to writing superhuman proofs. My biggest question now is whether other fields can be turned into games in the same way (is there a \"drug discovery game\"?). In that sense, I think the sim-to-real gap is alive and more important than ever."}, {"id": 50652190, "au": "quaffcode", "dom": 7, "sr": 57, "sc": 3.36, "ep": 4.83, "bs": 0.0, "d": 3, "age": 1.09, "grav": 7.6, "surf": 24.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 38, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.461, "fa": 0.34, "gp": 0.294, "bl": 0.0, "ds": 0.0, "txt": "Look up the Crypto Wars.\n\nThe NSA tried to regulate cryptography as a munition, capped everyone at 40 bits. They wanted everyone using basic RC4 keys that were known even then to be crackable with basic hardware. Then it was DES.\n\nWhen Phil Zimmerman released PGP the NSA investigated him for FIVE YEARS. He only avoided conviction because he released the PGP source code as a printed book and didn't put it on the Internet. The Gov had to get sued because cryptography is free speech, and didn't drop the 'export restrictions' until 1999.\n\nThe NSA is not there to make YOUR signals secure... quite the opposite!"}, {"id": 50644148, "au": "ndriscoll", "dom": 23, "sr": 58, "sc": 3.36, "ep": 4.55, "bs": 0.0, "d": 5, "age": 15.19, "grav": 167.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.08, "fa": 0.34, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "Not really even that difficult to imagine for things like payments. Distribute OTP material in person, and you can still do remote banking. You could even \"charge\" your phone with a 100 MB of pad material or something. There'd even be a reason to go back to sites that actually work with a few kB of data transfer to cut down on need to recharge, so yeah let's bring on the end of key-based crypto!"}, {"id": 50643295, "au": "GuB-42", "dom": 142, "sr": 59, "sc": 3.36, "ep": 4.47, "bs": 0.0, "d": 3, "age": 16.18, "grav": 185.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 18, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.198, "fa": 0.42, "gp": 0.316, "bl": 0.0, "ds": 0.0, "txt": "> It is highly unlikely in the millions of lines of Lean code that there is not a single hallucination.\n\nIf the statement of the problem is correct and the Lean code compiles, then it is correct, no matter how the LLM got there. The statement has been worked on and verified by human mathematicians, the Lean compiler uses pure, exact logic. Bugs in the latter are possible, but several implementations have been tested and it still works."}, {"id": 50644393, "au": "AlexandrB", "dom": 200, "sr": 60, "sc": 3.36, "ep": 4.42, "bs": 0.0, "d": 5, "age": 14.87, "grav": 161.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.635, "fa": 0.0, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "Wild position given how many folks still die from preventable causes. Just fully automating transportation (especially driving) will probably save tens of thousands of lives per year. Then there's medical science: lots of remaining opportunities to save lives and ease suffering."}, {"id": 50642997, "au": "fn-mote", "dom": 188, "sr": 61, "sc": 3.36, "ep": 4.39, "bs": 0.0, "d": 3, "age": 16.61, "grav": 193.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 19, "k": 4953, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 0.807, "fa": 0.76, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "> Wanting an environment to do research free of LLMs is a valid preference, and many people do have that preference.\n\nOne issue is funding. Theoretically, grants support work towards results. If using LLMs gets better results, it’s going to be very hard to even be in the top 25% when you’re not using AI. That means you won’t get funded."}, {"id": 50643463, "au": "howunfortunate", "dom": 247, "sr": 62, "sc": 3.36, "ep": 4.32, "bs": 0.0, "d": 2, "age": 15.96, "grav": 181.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 60, "qw": 0, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": ["https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/2021_Median_household_wealth%2C_by_highest_educational_attainment_-_US.svg/250px-2021_Median_household_wealth%2C_by_highest_educational_attainment_-_US.svg.png"], "ig": 0.717, "fa": 0.9, "gp": 0.047, "bl": 0.0, "ds": 0.0, "txt": "I have several objections:\n\n1. Not all knowledge is convertible to profit, but LLMs don't discriminate.\n\n2. As a PhD grad, I found academia very 'narrowing'. Yes I became a frontier expert in my area, but when I switched to industry it was a deluge of new knowledge because I needed breadth for the first time.\n\n3. People with postgraduate degrees are the wealthiest people alive (on average and on median): https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/20..."}, {"id": 50647090, "au": "fpoling", "dom": 118, "sr": 63, "sc": 3.36, "ep": 4.31, "bs": 0.0, "d": 5, "age": 11.17, "grav": 103.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 4458, "kpp": 8.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.393, "bl": 0.0, "ds": 0.0, "txt": "Consider a problem of metallic state of hydrogen. It cannot be simpler, just a bunch of electrons and protons. Yet we are unable to calculate or even predict from models if it exists. And the math is not gnarly but very standard.\n\nWhich brings the big problem of the current physics is that  the math it uses is often useless at solving practical problems.\n\nIf AI can address that, it will be extremely consequential. But so far the practical consequence of LLMs solving hard math problems are limited and do not help physicists that much."}, {"id": 50643871, "au": "js8", "dom": 20, "sr": 64, "sc": 3.36, "ep": 4.28, "bs": 0.0, "d": 4, "age": 15.48, "grav": 172.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 8720, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.405, "fa": 0.0, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "No, it won't. You will talk to humans directly for these things. You will have local banks that check your id for anything big. If somebody commits a fraud, people will learn about it and fix it. The payment systems will be less centralized.\n\nIt is viable, but might be difficult to imagine.\n\nJust like elections - not everything needs to be computerized. Paper elections work fine, too."}, {"id": 50643036, "au": "FeteCommuniste", "dom": 52, "sr": 65, "sc": 3.36, "ep": 4.24, "bs": 0.0, "d": 2, "age": 16.54, "grav": 191.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1160, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.419, "fa": 0.22, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "The most commonly used encryption depends on the computational infeasibility of quickly factoring the products of very large primes. Finding a vastly more efficient algorithm for such factorization would render huge swaths of the web, payment systems, etc. very vulnerable."}, {"id": 50643118, "au": "uw_rob", "dom": 169, "sr": 66, "sc": 3.36, "ep": 4.24, "bs": 0.0, "d": 2, "age": 16.41, "grav": 189.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 296, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.451, "fa": 0.0, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "The bigger problem is that everyone can cook at home but few get the privilege of running a factory.\n\nRight now might be the most exciting time ever to get into CS given you _could_ go work at a lab and play around with SOTA models.\n\nI don’t think you can play along at home though - public SOTA models are far too expensive to run in swarms for “what ifs” and the private SOTA models are one step ahead."}, {"id": 50642972, "au": "brandonpelfrey", "dom": 333, "sr": 67, "sc": 3.36, "ep": 4.17, "bs": 0.0, "d": 1, "age": 16.65, "grav": 193.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 216, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.433, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "This is a weird take to me. Can a PhD in math or theoretical CS not be about using models and agents to more efficiently explore ideas? That seems like an extremely valuable path that also benefits from domain specific reasoning and goals.\n\nI don’t think a PhD needs to be about one grand problem. How to utilize these tools is immensely important and not at risk of being scooped."}, {"id": 50643193, "au": "fghorow", "dom": 293, "sr": 68, "sc": 3.36, "ep": 4.13, "bs": 0.0, "d": 2, "age": 16.31, "grav": 187.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1120, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Personally, I am far more worried about TLS, Wireguard, and/or SSH etc. being broken than any cryptocoin issues. YMMV."}, {"id": 50646072, "au": "thaeli", "dom": 120, "sr": 69, "sc": 3.36, "ep": 4.12, "bs": 0.0, "d": 3, "age": 12.5, "grav": 123.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1003, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.425, "fa": 0.0, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "The incentives in academia prioritize paper count though. Being able to publish five papers in the time that used to be required for one is the big win there. (Splitting up a single result into as many papers as academic propriety lets you get away with has been common practice for a long while.)\n\nDoesn’t go against your point, just a bit more perspective."}, {"id": 50651057, "au": "traes", "dom": 196, "sr": 70, "sc": 3.36, "ep": 4.08, "bs": 0.0, "d": 2, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 760, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.213, "fa": 0.34, "gp": 0.18, "bl": 0.0, "ds": 0.0, "txt": "The biggest AI results are all coming from AI's astounding breadth, though! The Riemann proof uses virtually every corner of number theory from the last 50 years, more than any single individual knew themselves."}, {"id": 50643347, "au": "sedictious", "dom": 168, "sr": 71, "sc": 3.36, "ep": 4.05, "bs": 0.0, "d": 2, "age": 16.11, "grav": 183.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.591, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "The physically possible rate of absorption also plays a role. You could argue that already the introduction of computers sped a lot of things to a rate exceeding our natural comprehension but LLMs are yet another level. No one is absorbing even a tiny fraction of whatever we are producing today. In any case, I don't think \"lack of things to absorb\" has been an issue, especially since the introduction of the internet"}, {"id": 50642948, "au": "bemtevi", "dom": 226, "sr": 72, "sc": 3.36, "ep": 5.89, "bs": 1.85, "d": 1, "age": 16.68, "grav": 194.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Math)", "urls": [], "ig": 1.278, "fa": 0.68, "gp": 0.655, "bl": 0.7, "ds": 0.0, "txt": "As a former research mathematician (now retired), I'd say that math in general has been reaching the point of diminishing returns, at least in terms of what practical results new math can give us in 20-30 years. (Basically nothing for 99% of it). That's not to say it's not worth pursuing, but the resources being put into it don't match the return, and that was true even before AI."}, {"id": 50643035, "au": "bemtevi", "dom": 189, "sr": 73, "sc": 3.36, "ep": 5.89, "bs": 1.85, "d": 4, "age": 16.54, "grav": 191.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 40, "k": 332, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.53, "fa": 0.42, "gp": 0.756, "bl": 0.7, "ds": 0.0, "txt": "> One issue is funding. Theoretically, grants support work towards results. If using LLMs gets better results, it’s going to be very hard to even be in the top 25% when you’re not using AI. That means you won’t get funded.\n\nAbsolutely right. Unfortunately it's just the reality that the more efficient will conquer the less efficient, even if the less efficient is healthier in the long-run. Some people do want to shift the incentive and create grants towards exposition of results, which could theoretically help, but even then, it will be those who use AI who are likely to benefit. The end result is a high-production monoculture much like our current state of monoculture agriculture with wheat and corn. Efficient, but lifeless."}, {"id": 50647685, "au": "curt15", "dom": 275, "sr": 74, "sc": 3.36, "ep": 4.03, "bs": 0.0, "d": 1, "age": 10.32, "grav": 91.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.254, "fa": 0.34, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "The US federal budget for mathematics is approx $100M per year. How much could human research productivity also benefit from the billions poured into training and running the various LLMs?"}, {"id": 50643246, "au": "satnhak", "dom": 47, "sr": 75, "sc": 3.36, "ep": 3.99, "bs": 0.0, "d": 2, "age": 16.25, "grav": 186.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 18, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.284, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't think that follows automatically. What matters is the order of the polynomial. Primes is in P was proved around 25 years ago, but the order was 12 and then 6 and the algorithm is theoretically important, but cannot compete with Miller–Rabin for cryptographic applications. Being in P is a definition of tractability, not utility."}, {"id": 50643456, "au": "dsign", "dom": 278, "sr": 76, "sc": 3.36, "ep": 3.97, "bs": 0.0, "d": 1, "age": 15.97, "grav": 181.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 3579, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.618, "fa": 0.0, "gp": 0.118, "bl": 0.0, "ds": 0.0, "txt": "I may be wrong here, but I don't think there's a mathematical theorem saying that our current formalisms are the only ones admissible. So there is a non-zero chance that if somebody points a sufficiently advanced LLM to the problem in the not so far future, it will improve the mathematical formalisms of quantum mechanics and general relativity in a way that it's materially significant, i.e. it solves quantum gravity or whatever it would be called afterwards and makes the new math compatible with all observations.\n\nHowever, there are all sorts of walls for the AIs to hit in more practical problems."}, {"id": 50645295, "au": "zrm", "dom": 3, "sr": 77, "sc": 3.36, "ep": 3.97, "bs": 0.0, "d": 2, "age": 13.62, "grav": 140.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 3010, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "factorization_algorithm", "flbl": "Factorization & Algorithm (Science)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.511, "bl": 0.0, "ds": 0.0, "txt": "Right now people only spend a medium amount of resources on factoring, because nobody knows if it's even possible to do it in a way that comprehensively breaks RSA. If it is possible and you publish proof, that changes fast and you'll have others who can do it very quickly, and no guarantee that it doesn't then become public knowledge in short order.\n\nThat's still probably the best way to do it, but it's not going to be fun. If you see someone publish a factorization of the challenge number then it's time to drop everything and immediately stop using RSA, to the extent anyone hasn't already.\n\nAnd then the question is whether the result generalizes to elliptic curves."}, {"id": 50644293, "au": "skybrian", "dom": 162, "sr": 78, "sc": 3.36, "ep": 3.97, "bs": 0.0, "d": 1, "age": 15.0, "grav": 164.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "quantum_computer", "flbl": "Quantum & Computer (Physics)", "urls": [], "ig": 1.329, "fa": 0.28, "gp": 0.033, "bl": 0.0, "ds": 0.0, "txt": "Surprising or not, thinking of AI as a very good search engine (in this case for mathematics) seems like a fruitful metaphor.\n\nIt’s not going to find anything that wasn’t there to find, but it’s often difficult to predict what specifically it will find and its consequences.\n\nIn math, fortunately, most discoveries have no practical applications. What might the worst discoveries do? Perhaps break cryptographic algorithms.\n\nThe implications of a really good search for security bugs are obvious.\n\nScientific searches seem particularly fraught. The worst scientific discovery was probably nuclear fission. I’m doubtful anything like that remains for physics (too well known) but for biology, who knows?"}, {"id": 50643348, "au": "robrenaud", "dom": 172, "sr": 79, "sc": 3.36, "ep": 3.95, "bs": 0.0, "d": 2, "age": 16.11, "grav": 183.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 2531, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knowledge_market", "flbl": "Knowledge & Market (Data)", "urls": [], "ig": 1.449, "fa": 0.0, "gp": 0.376, "bl": 0.0, "ds": 0.0, "txt": "People didn't stop baking at home because of industrial baking.\n\nPeople didn't stop playing chess because they were worse than computers at chess.\n\nI definitely see downsides to say, gas powered data centers using enormous energy, or teenagers killing themselves because of ai psychosis.\n\nIf you want to aquire technical knowledge, it has never been easier.  You have an infinitely patient teacher who has read approximately everything every written available cheaply at your fingertips. It also makes ideas/experiments way easier to implement and run."}, {"id": 50645816, "au": "haolez", "dom": 266, "sr": 80, "sc": 3.36, "ep": 3.87, "bs": 0.0, "d": 1, "age": 12.93, "grav": 129.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 4384, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "Why? Math is a field that is easy to automatically verify until you reach the correct answer. Given infinite time, even a random generator could achieve these breakthroughs.\n\nI'm not downplaying the relevance of the findings. I'm just questioning the intuition that math would be one of the hardest fields for AI - my intuition was always that it is one of the easiest."}, {"id": 50643859, "au": "postexitus", "dom": 105, "sr": 81, "sc": 3.36, "ep": 3.84, "bs": 0.0, "d": 3, "age": 15.49, "grav": 172.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 883, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "etc_money", "flbl": "Etc & Money (Models)", "urls": [], "ig": 1.083, "fa": 0.34, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "Same applied with calculators, computers, databases, internet etc. etc. You only think it's different now, because it's new. In 10 years time, when it's established, the new world will feel extremely normal."}, {"id": 50643970, "au": "petra", "dom": 109, "sr": 82, "sc": 3.36, "ep": 3.79, "bs": 0.0, "d": 4, "age": 15.38, "grav": 170.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw"
