, {"slug": "general_commentary", "label": "General Commentary", "count": 8, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 6}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["macrohistory", "per", "history", "growth", "live", "countries", "course", "human", "average", "data", "correlation", "rate", "income", "macro", "gdp", "poor", "states", "hard"], "largest_root": {"root_id": 50639982, "author": "aarroyoc", "slots": 19, "start_dom": 6, "end_dom": 24, "share_pct": 23.5, "top_dom1_age": 4.1, "top_dom1_author": "lastofthemojito"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50643109, "au": "throw0101c", "dom": 12, "sr": 1, "sc": 14.11, "ep": 14.11, "bs": 0.0, "d": 3, "age": 4.22, "grav": 26.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 56, "qw": 267, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": ["http://www.econ.yale.edu/smith/econ116a/keynes1.pdf", "https://www.vox.com/2014/11/20/7254877/keynes-work-leisure"], "ig": 1.439, "fa": 3.39, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "> Not if you decide to work less because you don't need the extra money\n\nThe historical record shows that this does not happen (at least at a collective level):\n\n> Now it is true that the needs of human beings may seem to be insatiable. But they fall into two classes --those needs which are absolute in the sense that we feel them whatever the situation of our fellow human beings may be, and those which are relative in the sense that we feel them only if their satisfaction lifts us above, makes us feel superior to, our fellows. Needs of the second class, those which satisfy the desire for superiority, may indeed be insatiable; for the higher the general level, the higher still are they. But this is not so true of the absolute needs-a point may soon be reached, much sooner perhaps than we are all of us aware of, when these needs are satisfied in the sense that we prefer to devote our further energies to non-economic purposes.\n\n[…]\n\n> For many ages to come the old Adam will be so strong in us that everybody will need to do some work if he is to be contented. We shall do more things for ourselves than is usual with the rich to-day, only too glad to have small duties and tasks and routines. But beyond this, we shall endeavour to spread the bread thin on the butter-to make what work there is still to be done to be as widely shared as possible. Three-hour shifts or a fifteen-hour week"}, {"id": 50640787, "au": "m000", "dom": 60, "sr": 2, "sc": 8.16, "ep": 8.16, "bs": 0.0, "d": 1, "age": 8.78, "grav": 72.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 244, "qw": 51, "k": 2853, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": ["https://paulkrugman.substack.com/p/pop-goes-the-bubble"], "ig": 1.796, "fa": 1.04, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "> I hope the results are felt soon across the world.\n\nYes, oligarchs will feel their pockets overflowing.\n\n> Actually a lot of these guys are selfish tbh - caring about their first world cushy programming jobs and thus defending the current status quo. No different from billionaires tbh. If anything guys like Amodei or Huang are the ones leading the progress here.\n\nProgress towards what? The Industrial Revolution raised the living standards of the working masses because there was room to extract more resources from the environment. There was a hiccup in employment, but lost jobs were eventually replaced by new ones that allowed for even greater resource extraction. A crucial role was also played by socialist/communist movements, which forced capitalists to become more competitive in terms of wages.\n\nNeither of these conditions holds today. We are already overextracting, so any projected productivity gains will come at the expense of further deterioration of the planet we are still bound to. And there is also no real social movement that would force capitalists to transfer part of the productivity gains to working people.\n\nThat last part is already a dire reality. See [1] (also posted recently on HN) citing: \"We've already seen a substantial reduction in the share of national income going to workers.\" I.e. the GDP per capita which is the focus of TFA is just an average, and its "}, {"id": 50643796, "au": "km144", "dom": 4, "sr": 3, "sc": 8.01, "ep": 8.01, "bs": 0.0, "d": 0, "age": 3.36, "grav": 20.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 45, "k": 876, "kpp": 8.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 1.306, "fa": 1.37, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "> Walking around outside, I think we should really feel bombarded with this fact, every day. All these buildings? All these people? All this stuff? This is all kind of crazy. It’s all a little bonkers. Compared to the grand sweep of macrohistory, we live in a weird time.\n\nI am consistently fascinated with this fact. It's always been true that nobody alive today knows what life was like 100 years ago, but it's has never been true that it was consequential--for almost all of human history, life was pretty much the same 100 years ago. I think we'd all be better off if we thought from a more historical perspective about whether certain technological advancements are really making the world a better place.\n\nThe last 100 years in the developed world is a story of the constant changing of what is means to be a human in ways that nobody really understands."}, {"id": 50644285, "au": "hackeraccount", "dom": 57, "sr": 4, "sc": 6.26, "ep": 6.41, "bs": 0.0, "d": 2, "age": 2.8, "grav": 16.8, "surf": 3.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 1483, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 1.258, "fa": 0.95, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "Where's the burden of proof on that question?  Historically absolute poverty all the world over has been decreasing.  It can be hard to see because year to year it seems nothing changes but imagine you have a choice between living in the poorest country in the world today vs. 500 years ago?  Or 100 years ago?  Or 50?\n\nAt some point (1 year ago?  10 years ago?) you'd rightly say it's a wash or even that you'd be better off in the past but it's going to be a small window.  On a larger time scale everyone would say the present.\n\nDoes AI contribute to that or take away from it?  I tend to think it enables that growth but honestly, ask me in 10 years?  Or 20 years.  If it doesn't though most people aren't even going to remember what an AI is."}, {"id": 50639411, "au": "regularization", "dom": 46, "sr": 5, "sc": 6.21, "ep": 6.21, "bs": 0.0, "d": 0, "age": 12.41, "grav": 121.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 394, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.763, "fa": 0.34, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "More macrohistory:\n\nAfter World War II, factory workers with a high school education could raise a family on one income, buy a house and car and send kids off to college.\n\nNowadays young couples can not afford to buy a house.  Even FAANG workers have endured layoffs and slack hiring.\n\nMacrohistory:\n\nAnthropologists found migratory hunter-gatherers often work only 35 or 30 hours a week.  They often have to work less than we do.  That is human history before the rise of slave empires several thousand years ago.\n\nWith European and US leaders cheering as Israel announced it was blocking food to Gaza, often increasing aid at that point, and other horrors, I don't see things in Panglossian terms.  Nor do laid of FAANG workers, or workers the world over.  It is why places like New York are getting socialist mayors."}, {"id": 50645332, "au": "neilk", "dom": 2, "sr": 6, "sc": 6.08, "ep": 6.08, "bs": 0.0, "d": 0, "age": 1.37, "grav": 8.9, "surf": 11.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 45, "k": 13639, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.397, "fa": 0.76, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "> Walking around outside, I think we should really feel bombarded with this fact, every day. All these buildings? All these people? All this stuff? This is all kind of crazy. It’s all a little bonkers. Compared to the grand sweep of macrohistory, we live in a weird time.\n\nI feel this way all the time. In the city where I live, 150 years ago it was essentially all forest. It’s so close in time we’re still sorting out treaties with indigenous peoples. Now they want to build a datacenter a block away. I keep wondering how it is possible that I sometimes come across a discarded set of headphones that literally has more computing power than the lunar landers. Or where all this concrete and steel is coming from. It all seems impossible.\n\nWho is more insane? The person who thinks this will continue, or the person who thinks it can’t?"}, {"id": 50641424, "au": "ordu", "dom": 7, "sr": 7, "sc": 5.65, "ep": 5.8, "bs": 0.0, "d": 1, "age": 7.17, "grav": 53.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 8, "k": 3285, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 1.058, "fa": 0.7, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "> GDP is not a good metric for many things.\n\nIt is good enough most of the time, what is misleading is GDP/capita, which ignores inequality. If those graphs used median income it would be much more interesting to look at them.\n\nFor example, I'd expect median income growth to be much more bumpy. GDP/capita can't explain Luddites, while median income can."}, {"id": 50643352, "au": "fanwood", "dom": 13, "sr": 8, "sc": 5.32, "ep": 5.61, "bs": 0.0, "d": 4, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 87, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 1.285, "fa": 0.68, "gp": 0.452, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure that's true at all. Working hours have been decreasing in Europe for centuries. Also in my (of course anecdotal) experience living in Zurich, almost everyone I know work at most 80% (4 days a week) because they can afford it. This was not always the case and is the result of favorable working conditions recently. The difference between working more or less with increasing productivity may have more to do with cultural differences (US vs Europe) as well as social support and safety"}, {"id": 50640167, "au": "skybrian", "dom": 48, "sr": 9, "sc": 5.2, "ep": 5.34, "bs": 0.0, "d": 2, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 89, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": ["https://www.amazon.com/dp/1780747411"], "ig": 1.254, "fa": 0.62, "gp": 0.434, "bl": 0.0, "ds": 0.0, "txt": "In pre-industrial times, I’m not sure quality of life mattered for how it turned out. Some patterns “made sense” because organizing a defense against other hostile tribes was a requirement. States where a military and religious elite extracted the agricultural surplus of mostly defenseless peasants were able to push hunter-gatherers out of fertile river valleys to more marginal land to become “hill peoples” or “barbarians.”\n\n(Or if the barbarians won, they might become the new military elite.)\n\nI thought this was a pretty good introduction:\n\nPre-Industrial Societies: Anatomy of the Pre-Modern World\nby Patricia Crone\n\nhttps://www.amazon.com/dp/1780747411"}, {"id": 50639771, "au": "throwaw12", "dom": 36, "sr": 10, "sc": 4.92, "ep": 4.92, "bs": 0.0, "d": 0, "age": 11.47, "grav": 107.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 6, "k": 2400, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.086, "fa": 0.42, "gp": 0.807, "bl": 0.0, "ds": 0.0, "txt": "> in richer countries, people work less\n\nSure, when you live off your earnings from current and past colonialism, of course you can work less, while countries they ruined work hard to either rebuild their country or to enrich corrupt governments put by colonialists"}, {"id": 50640245, "au": "thibsrn", "dom": 40, "sr": 11, "sc": 4.76, "ep": 4.76, "bs": 0.0, "d": 0, "age": 10.13, "grav": 89.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 105, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 1.226, "fa": 0.34, "gp": 0.631, "bl": 0.0, "ds": 0.0, "txt": "Most of those graphs tell more about the value of money than anything else, surely not about quality of life. It's easy to draw a graph and make hasty conclusions, the problem in economics is the choice of metrics. Money is an easy one to observe, but it is a human construct and is influenced by a lot of factors. No surprise GDP has been steadily risen by 2% for a few decades, it's been designed that way."}, {"id": 50638550, "au": "portmanteur", "dom": 62, "sr": 12, "sc": 4.46, "ep": 4.46, "bs": 0.0, "d": 0, "age": 14.76, "grav": 159.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 17, "k": 63, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": [], "ig": 0.9, "fa": 0.42, "gp": 0.79, "bl": 0.0, "ds": 0.0, "txt": "This was very enjoyable. It’s clearly opinionated, but I didn’t find anything particularly objectionable, apart from this line:\n\n> Income varies enormously across countries. Those of us born in the United States are so, so lucky.\n\nNo, I’m not the product of luck. I’m the product of deliberate decisions, bravery, sacrifices, and prudent stewardship of limited resources by my ancestors, who acted on behalf of their progeny. I’m making my own deliberate decisions and sacrifices on behalf of my children, so they will have the best life I can possibly give them (and slightly selfishly, to maximize the number of grandchildren I might get to meet).\n\nPeople who are better at decision making and stewardship of limited resources can have good days and bad days, but over the course of a lifetime we should expect better outcomes than those who are not as good at decision making and stewardship of limited resources."}, {"id": 50641425, "au": "AIShill101", "dom": 58, "sr": 13, "sc": 4.41, "ep": 7.22, "bs": 2.52, "d": 2, "age": 7.16, "grav": 53.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 1.879, "fa": 0.68, "gp": 0.599, "bl": 0.95, "ds": 0.0, "txt": "The increasing availability of cheap middling(even, in the worst case) intelligence will decrease by orders of magnitude the cost of the immaterial services and goods provided.\n\nOn the topic of material goods, it's already making headway into CAD and PCB/IC design again increasing productivity by 2-3x. And that's not including the compounding gains automating the software already did.\n\nAdd to that pile the new STEM stuff made accessible by AI and we could indeed see material goods getting cheaper by an order of magnitude.\n\nThis is huge. Like one area I'm especially interested in is pharmaceuticals and the pathology industries. So yea, life is good.\n\nPS - Don't bring up stuff like the \"cost of living\" and stuff. I'm more concerned about the rest of the world excluding NA/EU. Y'all already live rich enough lives.\n\nPPS - If you want a concrete example - if the adoption of LLMs makes a chemical plant 2x efficient due to future cheap robots driven by VLAs that amortize over say a decade in say India. Then the entire world benefits, including the poorest regions of the world.\n\nLike I said, not everybody is fortunate enough to care about cars or houses in some first world country. This is what I consider more important as an engineer."}, {"id": 50640659, "au": "riffraff", "dom": 41, "sr": 14, "sc": 4.31, "ep": 4.46, "bs": 0.0, "d": 1, "age": 9.11, "grav": 76.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 22218, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 1.274, "fa": 0.0, "gp": 1.007, "bl": 0.0, "ds": 0.0, "txt": "The late Hans Rosling had a wonderful measure of quality of life in Factfulness: guitars per kid. It's a silly measure but it covers many things (free time, access to education, family wealth/poverty etc).\n\nIt's been going up pretty well almost everywhere.\n\n(Doesn't mean there aren't pockets of things going bad, of course.)"}, {"id": 50640313, "au": "skybrian", "dom": 9, "sr": 15, "sc": 4.3, "ep": 4.75, "bs": 0.0, "d": 1, "age": 9.95, "grav": 86.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 1.109, "bl": 0.0, "ds": 0.0, "txt": "Yes, it’s just a rough metric. But a useful one. At very large scale, when comparing nations, rich countries are generally better off than poor ones and GDP captures that reasonably well.\n\nAlso, for organizations, public or private, for-profit or not, increased revenue tends to be good and a drop in revenue means you are in trouble.\n\nAnd obviously it’s better to be rich than poor.\n\nBut that doesn’t mean all income is equally good, and there is more to life than increasing your income. It’s not something to be pursued blindly."}, {"id": 50638731, "au": "WelkinFolk", "dom": 64, "sr": 16, "sc": 3.84, "ep": 3.99, "bs": 0.0, "d": 1, "age": 14.31, "grav": 152.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 50, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.127, "fa": 0.0, "gp": 0.927, "bl": 0.0, "ds": 0.0, "txt": "I think you inflate how much agency people have, and have had, throughout history.\n\nYou are the product of luck, because not everyone (and no, not even everyone's ancestors) is born with the same amount of resources or the means to utilize resources.\n\nI think rich (note: this means rich relative to the world) people often overestimate how much their \"hard work\" is what made them, and not sheer chance.\n\nI've been successful at many things, yet I acknowledge that many of them also involved me being lucky + hard work."}, {"id": 50639982, "au": "aarroyoc", "dom": 6, "sr": 17, "sc": 3.63, "ep": 4.29, "bs": 0.0, "d": 0, "age": 10.91, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 1910, "kpp": 12.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 1.325, "fa": 0.0, "gp": 0.815, "bl": 0.0, "ds": 0.0, "txt": "GDP is not a good metric for many things. The classic example, if can you take a bike instead of a car, you'll pay less for it, pay less maintenance, zero gas, your health will be better (less hospital visits),... But you will contribute less to the GDP.\n\nAlso GDP calculation has been modified several times. At once, they did not include illegal activities, later they added them to the calculation (an estimation of course)."}, {"id": 50640776, "au": "penteract", "dom": 3, "sr": 18, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 0, "age": 8.8, "grav": 72.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 684, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 1.272, "fa": 0.0, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "The \"Fact 6\" graph in which log(doubling time) is plotted against log(time before present) is poorly used, since any straight line drawn on that graph in a world with increasing growth would imply a singularity at the present.\n\n\"doubling time\"  itself involves another logarithm. Note that this is undefined for negative growth."}, {"id": 50639310, "au": "tryauuum", "dom": 63, "sr": 19, "sc": 3.53, "ep": 3.83, "bs": 0.0, "d": 1, "age": 12.63, "grav": 125.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1032, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": [], "ig": 1.108, "fa": 0.0, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "The text never called those born in United States \"the product of luck\", it called them \"lucky\". You might be a product of bravery and correct decisions of your ancestors. At the same time, you personally could not affect the place of your birth, it's fair to call you lucky if you got something without putting in any effort."}, {"id": 50643166, "au": "lastofthemojito", "dom": 1, "sr": 20, "sc": 3.43, "ep": 3.65, "bs": 0.0, "d": 0, "age": 4.15, "grav": 26.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2688, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.349, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "Does the term \"macrohistory\" generally mean \"macroeconomic history\"?\n\nI was expecting observations about all aspects of history, like the influence of trade on languages or how wars are fought with increasingly lethal weapons, or population shifts with climate changes ... but no, it's all about money.  Which is fine, and not surprising once I realize the author is an economics professor, but not what I was expecting from \"Macrohistory in Six Facts\"."}, {"id": 50638698, "au": "slacknatcher12", "dom": 32, "sr": 21, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 1, "age": 14.39, "grav": 153.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 45, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 1.354, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, that fixation of GDP as if it were a natural metric is odd. Plus most of these analysis tend to focus on an absolute scale where GDP increases always look good.\n\nThese days I am more interested on two things: First is income inequality as a predictor on how fragile a democracy is. Second is proportion of GDP invested in investigation as the real motor of progress. The US has that with their defense industry. Korea also had it. Sadly Chile does not has that and it shows...\n\nMy point is GDP does not predict as good as we would like because how it is defined. It will lead obviously to the results it is always correlated with."}, {"id": 50643058, "au": "mritterhoff", "dom": 5, "sr": 22, "sc": 2.88, "ep": 3.1, "bs": 0.0, "d": 0, "age": 4.3, "grav": 27.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 43, "qw": 0, "k": 140, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": ["https://www.amazon.com/dp/1982103574"], "ig": 0.506, "fa": 0.62, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "If you enjoyed this post then I highly recommend the book \"More from Less: The Surprising Story of How We Learned to Prosper Using Fewer Resources―and What Happens Next\" by Andrew McAfee which goes into much greater detail on many of these points.\n\nhttps://www.amazon.com/dp/1982103574"}, {"id": 50646086, "au": "zug_zug", "dom": 42, "sr": 23, "sc": 2.58, "ep": 3.31, "bs": 0.0, "d": 1, "age": 0.27, "grav": 4.4, "surf": 19.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 0.99, "fa": 0.34, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "Exactly. Plot it against suicide rate (flat or slightly upward since 1940), or rates of depression, or average number of close relationships, etc."}, {"id": 50639787, "au": "bumperhazard", "dom": 47, "sr": 24, "sc": 2.5, "ep": 5.75, "bs": 2.52, "d": 1, "age": 11.4, "grav": 106.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 33, "k": 4, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": [], "ig": 1.192, "fa": 0.7, "gp": 0.661, "bl": 0.95, "ds": 0.0, "txt": "> Anthropologists found migratory hunter-gatherers often work only 35 or 30 hours a week. They often have to work less than we do. That is human history before the rise of slave empires several thousand years ago.\n\n1. That number is kinda debated because it only counts the time away from camp, but I'll give it to you.\n\n2. This does not address the difference in quality of life or life expectancy.\n\n3. Multiple civilizations gave up hunting and moved to agriculture independently, thousands of years ago, because it made more sense, and not because of \"slave empires\"."}, {"id": 50639780, "au": "throwaw12", "dom": 39, "sr": 25, "sc": 2.47, "ep": 3.06, "bs": 0.0, "d": 1, "age": 11.44, "grav": 107.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 8, "k": 2400, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 0.793, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> In richer countries, on average people are happier.\n\nSure, look parent comment, if my country is ruined by war or getting ruined by puppet governments established by the richer, colonial entity, of course people will be less happy"}, {"id": 50638624, "au": "exmadscientist", "dom": 31, "sr": 26, "sc": 2.2, "ep": 3.01, "bs": 0.0, "d": 0, "age": 14.56, "grav": 156.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5969, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.407, "bl": 0.0, "ds": 0.0, "txt": "A critical thing to note about this stuff is that the author's magic \"GDP\" is, well, magic. While GDP is straightforwardly defined in a textbook, in reality it's a highly synthetic figure. And the particular way it's synthesized probably has a pretty strong correlation with many of these observations."}, {"id": 50642856, "au": "AnimalMuppet", "dom": 27, "sr": 27, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 2, "age": 4.66, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 29384, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 0.512, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Since 1975.  The article's perspective is much longer than that.  What has happened with inequality since 1700?  Since AD 1?"}, {"id": 50646271, "au": "oofbey", "dom": 16, "sr": 28, "sc": 2.01, "ep": 3.11, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 16.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 908, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.31, "fa": 0.0, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "The very first section of the post shows that GDP is a good predictor for many things that clearly do matter: life satisfaction, life expectancy, child mortality, fewer hours worked, trust in neighbors.  Do you have any response to the actual hard data presented in the article, or are you just restating a tired criticism?"}, {"id": 50641226, "au": "rolandog", "dom": 22, "sr": 29, "sc": 1.87, "ep": 2.53, "bs": 0.0, "d": 2, "age": 7.72, "grav": 59.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1215, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.351, "bl": 0.0, "ds": 0.0, "txt": "You can save for a rainy day, too.\n\nMaybe take time off work to help out friends or family.  Not everything needs to be a market (and worse, not everything needs to concentrate \"for efficiency\" into a monopoly or a cartel) and not everyone needs to be producing constantly all the time."}, {"id": 50640036, "au": "lbreakjai", "dom": 10, "sr": 30, "sc": 1.66, "ep": 2.32, "bs": 0.0, "d": 1, "age": 10.74, "grav": 97.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1125, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 0.285, "fa": 0.0, "gp": 1.137, "bl": 0.0, "ds": 0.0, "txt": "But the money you saved biking is money you will either spend anyway, or set aside in the bank, which will be lent to other people for them to spend, or start a business.\n\nIt will eventually find its way into the economy, you just have found a more productive way to spend it."}, {"id": 50640096, "au": "pmg101", "dom": 52, "sr": 31, "sc": 1.31, "ep": 2.19, "bs": 0.0, "d": 1, "age": 10.55, "grav": 94.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 802, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 0.827, "fa": 0.0, "gp": 0.174, "bl": 0.0, "ds": 0.0, "txt": "\"But what about my job!\" has been the refrain of the selfish and unimaginative preventing progress that benefits billions throughout history. It's the most parochial thinking possible. Thank god we never listen to those people or we'd still be out here smashing rocks together."}, {"id": 50640318, "au": "paulstovell", "dom": 43, "sr": 32, "sc": 1.29, "ep": 2.61, "bs": 0.0, "d": 1, "age": 9.94, "grav": 86.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 345, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 0.945, "fa": 0.0, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "Babies not dying is a pretty strong counter example.\n\nA similar correlation graph would be “chances of being murdered” or “chances of starving to death”."}, {"id": 50639573, "au": "azaras", "dom": 81, "sr": 33, "sc": 1.27, "ep": 2.15, "bs": 0.0, "d": 1, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 203, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 0.916, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No. Communists understand this, but they also recognize that capitalism is an ideology with flaws, and that economies operate within the limits of anthropology, biology, and physics.\n\nA system can appear to grow exponentially until it reaches its peak and begins to decline."}, {"id": 50644945, "au": "ForHackernews", "dom": 20, "sr": 34, "sc": 1.26, "ep": 2.14, "bs": 0.0, "d": 3, "age": 1.93, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 15741, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "increasing_climate", "flbl": "Increasing & Climate (Rich)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, and you can apply PPP to maybe get a better sense of what it's actually like living there (certainly I'd rather live in Eindhoven than Biloxi) but the overall correlation is obviously true."}, {"id": 50639866, "au": "geocar", "dom": 38, "sr": 35, "sc": 1.04, "ep": 2.43, "bs": 0.0, "d": 1, "age": 11.21, "grav": 104.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 6424, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We live in a weird time.\n\nRobots could be making us farms and houses: The end of human labours could be so very near, because people will understand this very very soon.\n\nAt that point, the colonialists who still want to argue will absolutely get eaten first."}, {"id": 50640100, "au": "gampleman", "dom": 49, "sr": 36, "sc": 1.01, "ep": 1.46, "bs": 0.0, "d": 2, "age": 10.52, "grav": 94.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1383, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My understanding is that it’s the price of scaling (hey there’s an engineering lesson here). Can a small tribe have a fairly good life in a fairly large territory by hunting and gathering? Sure. But as soon as they start growing past the limit where their prey can naturally outgrow their predation of it, they starve. Agriculture can more reliably feed a much larger population before you hit scaling limits."}, {"id": 50639413, "au": "AIShill101", "dom": 51, "sr": 37, "sc": 0.98, "ep": 4.6, "bs": 2.52, "d": 0, "age": 12.41, "grav": 121.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 1.508, "fa": 0.0, "gp": 0.726, "bl": 0.95, "ds": 0.0, "txt": "I would really like to repeat for the ones in the back - we used to be really poor before the industrial revolution.\n\nAnd that the rate of growth is increasing. I see so much anti-AI sentiment here and it's very appalling because atleast technologically competent people should realize how big of a deal engineering is.\n\nSTEM is accelerating yet again, and I hope the results are felt soon across the world. I hope to see a decrease in absolute poverty all around the world.\n\nActually a lot of these guys are selfish tbh - caring about their first world cushy programming jobs and thus defending the current status quo. No different from billionaires tbh. If anything guys like Amodei or Huang are the ones leading the progress here."}, {"id": 50639014, "au": "joebates", "dom": 65, "sr": 38, "sc": 0.86, "ep": 1.96, "bs": 0.0, "d": 1, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 86, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "decisions_ancestors", "flbl": "Decisions & Ancestors (Lucky)", "urls": [], "ig": 0.314, "fa": 0.0, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "And you are lucky to be the product of deliberate decisions, bravery, sacrifices, and prudent stewardship. You did not choose to be this. You had no influence in choosing your ancestors. That is luck."}, {"id": 50640822, "au": "yard2010", "dom": 68, "sr": 39, "sc": 0.85, "ep": 2.39, "bs": 0.0, "d": 1, "age": 8.69, "grav": 71.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2005, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hard_macrohistory", "flbl": "Hard & Macrohistory (Live)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "What you wrote here hits the spot as a new parent. I understand that it matters less and less the consequences of my actions for me, and more and more for the next generations to come."}, {"id": 50646007, "au": "clickety_clack", "dom": 8, "sr": 40, "sc": 0.78, "ep": 2.32, "bs": 0.0, "d": 2, "age": 0.4, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1971, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 0.986, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "GDP is the worst measure of economic development, except for all the others. Does median income better predict things like lifespan, childhood mortality etc. that the author showed?"}, {"id": 50642733, "au": "bryanlarsen", "dom": 14, "sr": 41, "sc": 0.76, "ep": 2.3, "bs": 0.0, "d": 1, "age": 4.87, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 43695, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 0.569, "fa": 0.0, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "It's not a perfect metric, but it's perhaps the best we have.  As another commenter suggested, median income might be a better one.  If so, it'd be nice if someone proved it."}, {"id": 50644355, "au": "hackeraccount", "dom": 61, "sr": 42, "sc": 0.72, "ep": 2.26, "bs": 0.0, "d": 2, "age": 2.72, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1483, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "median_income", "flbl": "Median & Income (GDP)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't think the Industrial Revolution primarily raised living standards by increasing extraction.  The main thing it did was to increase productivity.\n\nThere's a difference between those two things.  Extraction is just getting more stuff because you increase inputs.  Productivity is getting more stuff just because."}, {"id": 50641230, "au": "anothaway", "dom": 56, "sr": 43, "sc": 0.68, "ep": 4.52, "bs": 2.52, "d": 1, "age": 7.7, "grav": 59.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 53, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "poverty_progress", "flbl": "Poverty & Progress (Absolute)", "urls": [], "ig": 1.191, "fa": 0.42, "gp": 0.36, "bl": 0.95, "ds": 0.0, "txt": "You must be trolling, surely.\n\n> I hope to see a decrease in absolute pover /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
