": 4469, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": ["https://github.com/rmcrackan/Libation"], "ig": 0.882, "fa": 2.08, "gp": 1.166, "bl": 0.0, "ds": 0.0, "txt": "For anyone who still has credits, or want to buy Audible exclusives, there's https://github.com/rmcrackan/Libation. Worked for me.\n\nAs a second step, I would recommend pausing your subscription. If they don't renege, I'll cancel mine."}, {"id": 50678639, "au": "jmyeet", "dom": 153, "sr": 3, "sc": 7.81, "ep": 7.81, "bs": 0.0, "d": 0, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 263, "qw": 0, "k": 10983, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.742, "fa": 0.95, "gp": 0.698, "bl": 0.0, "ds": 0.0, "txt": "I had Spotify for more than a decade and in the last year switched to Amazon Music. The app just isn't as good. Spotify is really a polished UI/UX experience. Anyway, the reason I did it was I started listening to audiobooks again. Spotify gives you 12 hours a month. Amazon Music gives you one audiobook a month, which can be substantially longer than 12 hours.\n\nYou don't get to keep the audiobook but I don't care about that. I hardly ever read something twice. You can download it and listen while being offline, which is nice.\n\nAnyway, at different times I've thought about signing up for Audible but I absolutely hate the business model. I don't want to subscribe. I don't want credits. I don't want to figure out if my credits roll over. I don't want to figure out how many credits a given book is. I don't want to figure out if I can download something or not. I don't want to figure out if I \"own\" it. And audio book prices themselves are kinda ridiculous. So I've never really gone down that road.\n\nIn general I refuse to \"buy\" digital goods other than games. I will never again purchase TV, movies, music or audiobooks.\n\nAnyway, the other option is... your local library. You have an app and you can \"borrow\" audiobooks, generally for 21 days. You might have to wait for a popular audiobook but that's fine. There's honestly no rush. There are other things to consume.\n\nBut why can't we ju"}, {"id": 50677718, "au": "swozey", "dom": 143, "sr": 4, "sc": 6.3, "ep": 6.3, "bs": 0.0, "d": 0, "age": 2.67, "grav": 16.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3466, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.446, "fa": 0.68, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "I earlier this year I found out that if I stop paying for Audible, now, they cut me off from access. Now they cut off downloading. Wild. I literally downloaded all of my 300+ books this week. I will be cancelling immediately. I've payed that $10-15/mo for probably 10 years. They were heavily throttling downloads a few days ago, I was getting rate limited a lot.\n\nThank god for libation/openaudible."}, {"id": 50678797, "au": "aenis", "dom": 3, "sr": 5, "sc": 6.25, "ep": 6.25, "bs": 0.0, "d": 2, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 1565, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.401, "fa": 0.68, "gp": 0.703, "bl": 0.0, "ds": 0.0, "txt": "It would be interesting to know how many people are 'working' on their app. Like OP, I've used it since it launched, bought ~500 titles, and my wife probably twice that. The app is comically bad, making it harder and harder to sift through ones library etc. And its not because of AI. I am 100% sure a good rewrite would require literally one unattended session with a decent model. \"Look at the core functionalities, rewrite with the user convenience in mind, make no mistakes\". There, Amazon, here you go, that one is on me."}, {"id": 50678751, "au": "sandreas", "dom": 82, "sr": 6, "sc": 6.24, "ep": 6.24, "bs": 0.0, "d": 0, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 2873, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.83, "fa": 0.34, "gp": 0.669, "bl": 0.0, "ds": 0.0, "txt": "First things first: I'm not an active audible user.\n\nTo my knowlwdge they first removed the download button for purchases made in the base plan (6.90) while still having it for purchases made with premium (9.90).\n\nThese downloads an aax file which basically is an encrypted 128kbits  m4a file and can be decrypted by a variety of tools.\n\nThe web player uses pretty secure widevine DRM which downloads and decrypts the file in small pieces and makes it harder to speed up the process of \"downloading\".\n\nLibation seems to still work, however audible is trying hard to prevent liberating purchases from anything not owned by them.\n\nThe last stand is analog recording, which can be vibecoded to use a virtual soundcard in a vm and record audio 1:1 which makes the process take as long as the book, but should work future proof.\n\nThere are alternatives like your local libraries online streaming, ripping CDs, here in germany also bookbeat, Thalia and others, but for the audible exclusives you are out of alternatives. What a pity..."}, {"id": 50678888, "au": "swatcoder", "dom": 13, "sr": 7, "sc": 6.23, "ep": 6.37, "bs": 0.0, "d": 2, "age": 0.69, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 21, "k": 14944, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.693, "fa": 0.42, "gp": 0.826, "bl": 0.0, "ds": 0.0, "txt": "> I think people care less about download but the ability to play offline\n\nIt's not just offline access.\n\nPeople are also becoming more aware of how ephemeral streamed/in-app media is now that it's been around long enough for their favorite content to go from available to not -- even for stuff they've ostensibly \"purchased\". Almost everyone has experienced that now.\n\nBehind the scenes, that's a mostly-insurmountable license clearing dilemma, but that doesn't make it any more satisfying for people when they lose tomorrow something that they had just yesterday.\n\n> Still more convenient to whatever else the alternative is.\n\nAnd now you understand exactly why Napster and Limewire came to be. It is inconvenient to pirate stuff, but if it becomes normalized or necessary enough, technological innovation in convenience comes to the high seas as well. Even now, and especially with agents that can set things up, a rented seedbox along with a plex or jellyfin service are already a lot less byzantine and inconvenient than your example makes it seem."}, {"id": 50678372, "au": "djhworld", "dom": 132, "sr": 8, "sc": 5.73, "ep": 5.73, "bs": 0.0, "d": 0, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 4499, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.608, "fa": 0.34, "gp": 0.677, "bl": 0.0, "ds": 0.0, "txt": "I noticed this the other day, I had 1x credit so purchased an audiobook and then found the download button missing.\n\nAfter searching online found a reddit post suggesting to use this Libation software which worked, downside is you need to sign in to amazon through it to give it access. I managed to download my purchased book through it, then changed my password etc just in case…\n\nBut yeah, cancelled my subscription after that, putting in the cancellation reason that the download feature was the primary reason why I subscribed in the first place.\n\nI suppose the enshittification had to come to Audible eventually and now it’s time"}, {"id": 50678677, "au": "horsawlarway", "dom": 45, "sr": 9, "sc": 5.56, "ep": 5.86, "bs": 0.0, "d": 4, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 116, "k": 11597, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.439, "fa": 0.42, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "I think this is admitting defeat, and should be viewed with skepticism.\n\nWorse - long term it's a losing play.  We're already seeing that the vast majority of tv shows, movies, and games no longer include any physical format for sale at all.  Books are walking the same path, just slightly slower.\n\n---\n\nSo no - Fuck buying physical books (in the context of this conversation, I mean.  You do you otherwise, they feel nice and smell great).  Demand a digital equivalent of the doctrine of first sale.\n\nDemand a way to compensate an author for their work that mirrors the rights you'd have with physical books.  And yes - I understand there is nuance here around how we make this work with digital goods.  But accepting the idea that the only way to \"buy\" a digital work is to be granted a non-transferable, revokable, \"we, the corporate middleman, can do whatever the fuck we please\", style license is not an acceptable state.\n\nIt's a great way to allow rent-seeking in the market.  It's not good for society."}, {"id": 50678369, "au": "robrain", "dom": 126, "sr": 10, "sc": 5.08, "ep": 5.08, "bs": 0.0, "d": 0, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 333, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.786, "fa": 0.0, "gp": 0.611, "bl": 0.0, "ds": 0.0, "txt": "Customer \u00234902384023842 (me, made up number) already removed the purchase audiobooks option from Audible along with the rest of his account. Also the Prime features of Amazon. Along (mostly) with any purchasing from Amazon.\n\nMy local bookshop, meanwhile, lets me browse and orders stuff when they haven't got it, often for next day (no real need for that, my inbox is twenty books deep). It's also next to a nice coffee shop and there's free parking before 10am. Down the road from there is the library which has free access to borrow audiobooks - yes, borrow, but also yes, free, via Libby, Hoopla et en langue française par Cantook."}, {"id": 50678117, "au": "breakwaterlabs", "dom": 93, "sr": 11, "sc": 5.05, "ep": 5.05, "bs": 0.0, "d": 2, "age": 2.05, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 536, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.36, "fa": 0.34, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "Buy a car! Only $20,000! No fine print or conditions!\n\nPurchase is for a license only for a limited time. Conditions may apply\n\nSee, its not lying, because we added fine print!\n\nAnd i wish this were hyperbole, one of the streaming services (Prime?) literally does this with a \"buy\" button whose buried fine print states that it is not actually buying anything but leasing or renting."}, {"id": 50678903, "au": "komali2", "dom": 138, "sr": 12, "sc": 4.74, "ep": 4.74, "bs": 0.0, "d": 0, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 17688, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.381, "fa": 0.28, "gp": 0.479, "bl": 0.0, "ds": 0.0, "txt": "Alternatives to audible, including good app and offline support:\n\n1. Libby. Checkout audiobooks from your local library. For a fun time, go on a road trip and collect library cards from anyone who will give them to you, which increases your likelihood to successfully \"checkout\" the audiobook you want.\n\n2. \"Audiobookshelf\" app plus \"shelfmark\" for acquiring audiobooks"}, {"id": 50678674, "au": "Zak", "dom": 14, "sr": 13, "sc": 4.57, "ep": 5.01, "bs": 0.0, "d": 2, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 12, "k": 17002, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.251, "fa": 0.42, "gp": 0.603, "bl": 0.0, "ds": 0.0, "txt": "> I think people care less about download but the ability to play offline.\n\nThey're the same thing.\n\nThere are torrent clients with integrated search for Android. Some are even in the Play Store, which surprised me a bit. iPhone users will have a worse experience.\n\nThe reason so many millennials have above-average tech skills is that technical hurdles stood between them and things they wanted. Whether it was playing games, getting free music, or finding like-minded people to talk to, there was usually some troubleshooting involved sooner or later. There's nothing keeping anyone else from clearing similar hurdles if the motivation becomes strong enough."}, {"id": 50678324, "au": "ihsw", "dom": 25, "sr": 14, "sc": 4.52, "ep": 4.96, "bs": 0.0, "d": 2, "age": 1.65, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5568, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.487, "fa": 0.34, "gp": 0.342, "bl": 0.0, "ds": 0.0, "txt": "\"Playing offline\" requires an enormous asterisk next to it.\n\nSpotify, Netflix, et al will support offline playing for a limited duration, eg: 7 days, where your downloads will expire and be unusable after that duration.\n\n\"Playing offline\" should mean indefinite without phone-home requirements but here we are parsing the definition."}, {"id": 50678472, "au": "caseysoftware", "dom": 125, "sr": 15, "sc": 4.38, "ep": 4.38, "bs": 0.0, "d": 0, "age": 1.4, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 12971, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.16, "fa": 0.34, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "0% surprised on this one.\n\niirc, it was February '25 where Amazon killed their epub download, even for non-DRM works. Previously, I bought 3-4 books through them each month. I've bought zero since.\n\nDon't reward them with your dollars - or Euros or whatever."}, {"id": 50679271, "au": "smegger001", "dom": 78, "sr": 16, "sc": 4.25, "ep": 4.47, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 207, "qw": 0, "k": 2279, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.664, "fa": 0.0, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "netflix doesn't grant you a permant licence traditionally Audible has. they have been fucking with the payment structure and licencing the last few years however.\n\nstarting with the \"free library\" for subscribers that were only good for a limited time, moving on to lower pricing tiers where what you keep and what goes away is more complicated depending what was bought with credits vs cash until now at least the regular subscription teir always kept all of their books (with the exception of the free library) no matter the type of purchase (credit or cash) or whether they are currently subscribed\n\n(along the way they have been also f'ing up the author compensation with credit purchases so that the credit purchases compensation is also spread amongst authors of the free books as well as the authors of books that were purchased with credits causing authors that didn't allow their books to be in the free library to have to share their profits with those who did)\n\nnow it looks like they are preping to make a worst of both worlds pricing/licencing structure where you wont be able to download your content so that they can keep your old purchases hostage and you will pay per title but own nothing."}, {"id": 50677936, "au": "bko", "dom": 12, "sr": 17, "sc": 3.96, "ep": 4.41, "bs": 0.0, "d": 1, "age": 2.32, "grav": 13.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 17517, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 0.907, "bl": 0.0, "ds": 0.0, "txt": "I think people care less about download but the ability to play offline. Still more convenient to whatever else the alternative is.\n\nMost people aren't going to figure out how to connect their phone to a computer, many don't even own a personal computer. And then download a torrent client , find a torrent site, get through the spam and scams, download it, transfer it to your phone, find a client app the play and manage downloaded audio books, ..."}, {"id": 50678939, "au": "KingOfCoders", "dom": 77, "sr": 18, "sc": 3.92, "ep": 4.28, "bs": 0.0, "d": 0, "age": 0.6, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 10384, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.319, "fa": 0.28, "gp": 0.265, "bl": 0.0, "ds": 0.0, "txt": "What I always found interesting with Audible, how they can keep that high price? It's (Germany) 10 EUR / book (if you want to relisten) per month, whereas Netflix is ~ the same price for unlimited movies. Book publishers kept prices high while movie studies couldn't."}, {"id": 50679265, "au": "tptacek", "dom": 63, "sr": 19, "sc": 3.53, "ep": 3.97, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 427695, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.459, "fa": 0.0, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "Can somebody explain this in terms an Amazon audiobook consumer would understand? I've bought just one book on Audible itself (Go Ahead In The Rain, the Tribe Called Quest book, which wasn't available on Amazon at the time) and I'm not familiar with Audible's own weird account tier system.\n\nThe notion of an audiobook provider that only works when connected to the Internet seems farcical; that can't be what they're saying, right? A huge fraction of their customers listen to audiobooks while traveling, on iPhones."}, {"id": 50677966, "au": "Ungh", "dom": 34, "sr": 20, "sc": 3.26, "ep": 3.7, "bs": 0.0, "d": 1, "age": 2.29, "grav": 13.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 356, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.452, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "Amazon killed my retail account after I returned too much no brand shit that fell to bits after a month. This took out all my kindle ebooks. And broke the kindle family too.\n\nSo I only buy second hand books and pirate epubs now to recoup my losses.\n\nThat’s how it goes. Files on disk or media in hand. No DRM, no accounts. Own or steal."}, {"id": 50678301, "au": "AndyMcConachie", "dom": 146, "sr": 21, "sc": 3.25, "ep": 3.25, "bs": 0.0, "d": 0, "age": 1.69, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2884, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "This is why I paid for OpenAudible, downloaded everything and converted it to mp3. People at the time in reddit/r/audible told me the only possible reason I could have for converting everything to mp3 was because I must be a pirate. But I cancelled my Audible subscription last year and I still have everything I ever bought stored as an MP3 in my house.\n\nSuck it Amazon!"}, {"id": 50678399, "au": "ianmarcinkowski", "dom": 99, "sr": 22, "sc": 3.23, "ep": 3.89, "bs": 0.0, "d": 0, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 38, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.049, "fa": 0.34, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "I recently downloaded all of my purchased audiobooks from audible from 10-15 years so I could self-host them.  I stopped using them when it became difficult to have a Canadian Amazon account + all of my audiobooks were trapped in the US region.  Now I have Audiobookshelf."}, {"id": 50678789, "au": "jrflo", "dom": 105, "sr": 23, "sc": 3.22, "ep": 3.66, "bs": 0.0, "d": 2, "age": 0.89, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2192, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.045, "fa": 0.34, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Oh interesting, when I left Audible a couple years back they were the same price ($15/mo for one credit per month). Looks like Audible have since launched a cheaper tier."}, {"id": 50677554, "au": "ericpauley", "dom": 119, "sr": 24, "sc": 3.14, "ep": 3.36, "bs": 0.0, "d": 0, "age": 2.93, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 4072, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 0.452, "bl": 0.0, "ds": 0.0, "txt": "I am so done with “purchasing” digital goods. If I want it digital it’s coming from Libby, and if I want to own it I’m buying the physical paper. It has become abundantly (and contractually) clear that when your purchase digital you don’t really own anything, and that the experience will inevitably be degraded under the premise that you are the product."}, {"id": 50678970, "au": "andyjohnson0", "dom": 80, "sr": 25, "sc": 3.08, "ep": 3.08, "bs": 0.0, "d": 0, "age": 0.54, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 18136, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "If you don't own the open format media then you don't own the thing.\n\nI acquire audiobooks on CD from charity shops and ebay. Rip to my NAS then sync to my phone's local storage with Syncthing. Play with Musicolet. CD goes on the shelf."}, {"id": 50678513, "au": "bko", "dom": 16, "sr": 26, "sc": 2.98, "ep": 3.42, "bs": 0.0, "d": 3, "age": 1.32, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 17517, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.232, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Sure, but I know downloading torrents on a phone is much harder. Try downloading a torrent client on an iPhone and managing a torrent site (without an ad blocker since that's prevented as well)\n\nEven on Android, you're relying on APKs which is another thing to manage"}, {"id": 50678658, "au": "touwer", "dom": 128, "sr": 27, "sc": 2.88, "ep": 3.32, "bs": 0.0, "d": 0, "age": 1.07, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 318, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "What's not to like? We have to help poor Bezos getting a higher margin so he can spoil the earth and democracy even more!\n\nOk, more serious: I'm really glad I said goodbye to all Amazon, Meta and Microsoft services a long time ago. Still working on Apple and Google"}, {"id": 50677675, "au": "bambax", "dom": 83, "sr": 28, "sc": 2.82, "ep": 3.04, "bs": 0.0, "d": 0, "age": 2.74, "grav": 16.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 25915, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.429, "bl": 0.0, "ds": 0.0, "txt": "I don't understand this strategy, it seems pretty short term? I learned about Anna's Archive when it became impossible to download Kindle books. Now I'm gone and won't come back."}, {"id": 50677834, "au": "freedomben", "dom": 1, "sr": 29, "sc": 2.7, "ep": 3.73, "bs": 0.0, "d": 0, "age": 2.48, "grav": 14.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 30428, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "Well, that's it for me and Audible.  I've been a paying customer for so long I don't even remember when it started.  I started using Audible files on my iPod in the late 00s.  Hundreds of dollars a year spent on audiobooks over nearly two decades.  I strongly dislike the Audible app though (and have for a very long time) so I use Audiobookshelf.  If there's no reasonable path for me to have my Audible books in Audiobookshelf, Audible can go to hell."}, {"id": 50678754, "au": "gspr", "dom": 51, "sr": 30, "sc": 2.7, "ep": 3.14, "bs": 0.0, "d": 1, "age": 0.94, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 3189, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "I agree. But I'm worried that this time around, the industry is at least an order of magnitude wealthier, an order of magnitude more prepared, an order of magnitude better connected to governments, an order of magnitude more ready to employ draconian measures. Attested devices have steadily been normalized. It is not unthinkable that this time around it ends not with concessions to consumers, but with a ban on general purpose computing in the hands of individuals.\n\nOf course I hope I'm wrong. But I'm worried."}, {"id": 50678838, "au": "notnullorvoid", "dom": 87, "sr": 31, "sc": 2.66, "ep": 2.88, "bs": 0.0, "d": 0, "age": 0.79, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 945, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "I wish there was an alternative, but many of the books I want are audible exclusives. Buying hard copies or epub elsewhere then pirating the audio could mean narrators and audio production team don't get a cut."}, {"id": 50678739, "au": "0xpiguy", "dom": 69, "sr": 32, "sc": 2.58, "ep": 3.24, "bs": 0.0, "d": 2, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 16, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, they added that later. I believe it offers 3 month pause  then automatically starts the monthly charge again. It wasn’t a feature designed to help the customers. It’s designed so that they can charge the membership for a few more months because most of us don’t keep track of the start and end date of that pausing period."}, {"id": 50678253, "au": "jswelker", "dom": 73, "sr": 33, "sc": 2.5, "ep": 3.08, "bs": 0.0, "d": 1, "age": 1.76, "grav": 10.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 571, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.09, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Does Libation still work? I have a huge legally purchased collection of mostly kids content. I rip all of it to mp3s for my kids to play on different apps and devices because Audible parental controls and portability are so good awful.\n\nIf Libation continues to work I will keep buying Audible content. If not, goodbye."}, {"id": 50678998, "au": "ajmurmann", "dom": 6, "sr": 34, "sc": 2.48, "ep": 3.44, "bs": 0.0, "d": 4, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 11951, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.083, "bl": 0.0, "ds": 0.0, "txt": "This IMO is such a common misunderstanding of why apps are bad. It’s not that the engineers don’t know how to make it better, it’s that what they company optimizes for doesn’t match what the user thinks of as “better”. It doesn’t even need to be adversarial like in this’s example but simple be orthogonal. It frequently is also a difference between stated and revealed preference where users wish for instant performance was better but don’t in fact flock to applications that are faster but less feature rich."}, {"id": 50677800, "au": "embedding-shape", "dom": 53, "sr": 35, "sc": 2.27, "ep": 3.15, "bs": 0.0, "d": 1, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 21467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Literally. I went from pirating books because there was no alternative, to buying and purchasing books via Kindle because it became easier than pirating, to now being back to pirating because it's again easier and less hassle. Same with TV shows.\n\nIt really boggles my mind how there aren't enough people with enough influence at all these companies to realize how it works yet??? They keep shooting themselves over the foot, and reversing decisions anything with a brain could have foreseen the consequences of."}, {"id": 50678810, "au": "trothamel", "dom": 96, "sr": 36, "sc": 2.26, "ep": 2.92, "bs": 0.0, "d": 0, "age": 0.85, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 4174, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.128, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "This is one of those things where Amazon does DRM, but it doesn't really matter because of the nature of what Kindle and Audible sell.\n\nIt's easy enough to make a tool that just captures the audio from their website and saves it to an mp3, and easy enough to make a tool that runs through the kindle reader page by page and makes captures.\n\nI'd say it's the analog loophole, but it's not that analog, even."}, {"id": 50678598, "au": "0xpiguy", "dom": 66, "sr": 37, "sc": 2.22, "ep": 3.47, "bs": 0.0, "d": 0, "age": 1.19, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 16, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.631, "bl": 0.0, "ds": 0.0, "txt": "One of the things I hate the most about audible is that they cancel all credits you’v paid for as soon as you cancel your membership. So you are forced to stay with them. I ended up bought a bunch of books I don’t need just so I can used up all credits and cancel the account. Never signup with them again. Oh, the credits also expires after a year."}, {"id": 50679040, "au": "smegger001", "dom": 4, "sr": 38, "sc": 2.02, "ep": 3.35, "bs": 0.0, "d": 3, "age": 0.43, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 2279, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.424, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "except they are optimizing for sales not user convenience, used to be you could pin a link to the library to your home screen (on android cant speak to ios) to skip the marketplace interface entirely they removed that feature forcing you to open the app to the store-front first."}, {"id": 50679299, "au": "pjmlp", "dom": 71, "sr": 39, "sc": 2.01, "ep": 2.67, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 134516, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.058, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Still getting my audio books on play old CDs, and occasional DVD/Blue Ray for shows that I care about.\n\nVote with your wallet, not with convenience."}, {"id": 50677990, "au": "swozey", "dom": 55, "sr": 40, "sc": 1.99, "ep": 3.53, "bs": 0.0, "d": 3, "age": 2.25, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 3466, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.5, "fa": 0.0, "gp": 0.007, "bl": 0.0, "ds": 0.0, "txt": "I just discovered Mornye/Lokal (fork of the dead Spotiflac) which acts like Stremio (video player) - where you put sources (spotify, apple, deezer, tidal etc) in and it automatically finds the FLAC files like stremio finds videos and its incredible. I get to nuke audible and spotify this month."}, {"id": 50678850, "au": "seemaze", "dom": 113, "sr": 41, "sc": 1.95, "ep": 3.05, "bs": 0.0, "d": 0, "age": 0.77, "grav": 6.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1676, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.766, "fa": 0.34, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "I’ve been purchasing DRM-free audiobooks from libro.fm for a while when prices were similar to Audible. More recently I’ve only purchased from Audible if they were the sole distributor and stripping the DRM.\n\nI guess my Audible usage will now be 0%."}, {"id": 50677929, "au": "claaams", "dom": 54, "sr": 42, "sc": 1.94, "ep": 3.49, "bs": 0.0, "d": 2, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 900, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "It's the same with music. I used to collect lots of music over the years and eventually stopped because streaming was so much more convenient. Now, I add music to my library and random tracks or albums from it disappear for months or years (or forever) with no ready explanation. So now I am working on building a library of music on a NAS so I can't have a backup if I want to hear something. I purchase albums from artists where I can but not all of it is available digitally."}, {"id": 50677817, "au": "rpdillon", "dom": 84, "sr": 43, "sc": 1.86, "ep": 3.11, "bs": 0.0, "d": 1, "age": 2.5, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7216, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.909, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I've been an Amazon customer for 20 years buying e-books and audiobooks. Since these changes, I've made my last purchase from them. I'm just not gonna pay money for something I can't actually access reliably."}, {"id": 50678737, "au": "i5heu", "dom": 65, "sr": 44, "sc": 1.82, "ep": 2.92, "bs": 0.0, "d": 0, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1482, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.118, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "If you are from Germany this might be interesting:\n\nI just switched to Thalia because of this.\nI think they are competitive. They have a subscription with one Audiobook per month for 8€ per month.\n\nAnd I just downloaded my audiobook in MP3 so this works good enough.\n\nLooks like they watermark the downloads but this is acceptable.\n\nThey also have a “flat” but idk if you can download the audiobooks with that, I doubt it.\n\n(I do not work there or have any other connection to this company)"}, {"id": 50678886, "au": "brookst", "dom": 5, "sr": 45, "sc": 1.81, "ep": 3.35, "bs": 0.0, "d": 3, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 15741, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.383, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "But that doesn’t monetize as well. Once someone has books, they’ll dig through however much spam and “discovery” pages as needed. Each one of those accretes a tiny bit of additional revenue.\n\nEventually your books will be in Audible -> me -> other features -> media -> beware of tiger -> file cabinet\n\nThe last thing Amazon wants is people wasting valuable shopping time listening to audiobooks they’ve already paid for."}, {"id": 50678229, "au": "svelle", "dom": 107, "sr": 46, "sc": 1.77, "ep": 2.65, "bs": 0.0, "d": 0, "age": 1.81, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 126, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "After reading this I checked if OpenAudible still works. It does. \nThanks for the reminder to safely backup my purchased books, I had purchased quite a few since my last one."}, {"id": 50678164, "au": "VladVladikoff", "dom": 121, "sr": 47, "sc": 1.77, "ep": 2.65, "bs": 0.0, "d": 0, "age": 1.94, "grav": 11.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2087, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 0.941, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "This is probably my fault guys. I’ve been rocking free trials for years and downloading the books and then returning the free book for another credit and downloading that. Sorry."}, {"id": 50678231, "au": "happymellon", "dom": 57, "sr": 48, "sc": 1.76, "ep": 3.3, "bs": 0.0, "d": 2, "age": 1.8, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5339, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 0.874, "fa": 0.34, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "You make it sounds like my friends in 2000 already knew filesystem's before they started downloading mp3s.\n\nI can assure you, that was nerd knowledge that people learnt because it unlocked music for their iPods. They only don't know now because it isn't worth the effort. If piracy makes a come back, they will learn again."}, {"id": 50679049, "au": "dmitrig01", "dom": 67, "sr": 49, "sc": 1.67, "ep": 3.07, "bs": 0.0, "d": 1, "age": 0.4, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 729, "kpp": 10.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.857, "fa": 0.34, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "When I canceled my account (maybe ~2-3 years ago), I wrote to their support and asked them to refund my remaining credits, which they did."}, {"id": 50678172, "au": "sethops1", "dom": 94, "sr": 50, "sc": 1.6, "ep": 2.84, "bs": 0.0, "d": 3, "age": 1.93, "grav": 11.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1444, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.797, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean we're basically there with the car example, if you buy into the Tesla Cybercab. It's a $30,000 brick if you don't pay the monthly subscription, which Tesla could ban you from at any time."}, {"id": 50678589, "au": "archon", "dom": 106, "sr": 51, "sc": 1.59, "ep": 2.69, "bs": 0.0, "d": 0, "age": 1.21, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 959, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure if something changed between now and August when this was apparently originally posted, but I still have a working download option for purchased audiobooks in my library on Nov. 28 on the US site.\n\n(This did remind me that it's been a while and I needed to archive my recent purchases though.)"}, {"id": 50677698, "au": "loufe", "dom": 123, "sr": 52, "sc": 1.58, "ep": 2.68, "bs": 0.0, "d": 0, "age": 2.7, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2488, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "I listen to my audible books while I'm at work, where there's no internet... This feels like the \"deal\" I've had with them has been silently broken. Surely audiobook  piracy isn't that bad a problem for their bottom line right now?"}, {"id": 50678743, "au": "brookst", "dom": 2, "sr": 53, "sc": 1.57, "ep": 3.11, "bs": 0.0, "d": 1, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 15741, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 0.82, "fa": 0.34, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Yep same. More than 1000 purchased books, and the app just gets worse and worse as they make it more and more steps to actually listen to a book.\n\nBye audible. Fortunately I have my purchases backed up."}, {"id": 50679262, "au": "delichon", "dom": 120, "sr": 54, "sc": 1.54, "ep": 2.64, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 11774, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.062, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "I get most of my audiobooks from AudioBook Bay. Yes it is stealing. Someone please build an app to make it easy to pay the authors directly. I feel that I can bear the shame of failing to pay the publishers."}, {"id": 50679065, "au": "ndriscoll", "dom": 41, "sr": 55, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 6, "age": 0.38, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 5444, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 1.303, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Most people aren't interested in becoming lawyers to listen to an aduiobook, so it's easier to just say \"well if my counterparty isn't going to be reasonable, I'll just ignore their terms and go get it for free with no terms.\" The terms aren't as important as the behavior.\n\nCopyright is entirely based on people believing it's reasonable and playing along. Part of maintaining that facade is that companies have to behave reasonably. Individuals have all the power here."}, {"id": 50678780, "au": "andsoitis", "dom": 46, "sr": 56, "sc": 1.52, "ep": 3.01, "bs": 0.0, "d": 5, "age": 0.89, "grav": 6.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The only practical solution I can see for the individual is stop buying books from Amazon. Spend a dollar or two more and buy a physical book from a different seller or rent from your friendly library.\n\nIf Amazon wants to transact along these terms, let them. Why try to give them business if you hate them?"}, {"id": 50678703, "au": "baq", "dom": 43, "sr": 57, "sc": 1.52, "ep": 2.97, "bs": 0.0, "d": 4, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 7, "k": 21723, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 0.851, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Terms are known at time of purchase.\n\nIncluding ‘we can unilaterally change the terms and let you know 30 days earlier because the government forced us to let you know’"}, {"id": 50678587, "au": "Zak", "dom": 18, "sr": 58, "sc": 1.52, "ep": 2.94, "bs": 0.0, "d": 4, "age": 1.21, "grav": 8.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 17002, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "For Android, there are torrent clients in the Play Store, some of which have integrated search. I have no comment on their safety or UX.\n\nA quick search suggests it's harder on iPhone as Apple forbids torrent clients in its store."}, {"id": 50678534, "au": "Aboutplants", "dom": 32, "sr": 59, "sc": 1.52, "ep": 2.9, "bs": 0.0, "d": 1, "age": 1.29, "grav": 8.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 1966, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 0.678, "fa": 0.34, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "Piracy is currently is a massive boom era again, reverse engineering any and all software is introducing an entire new generation to the solution to issues that a lot of us experienced in the late 90’s and early 2000’s.\n\nThe difference this time is that there seems to be much more acceptable use of piracy based on the fact that an entire multi trillion dollar industry is literally built on other people’s work so utilizing it in any sort of to further your own purposes leaves little to no concern about copyright issues."}, {"id": 50678280, "au": "loloquwowndueo", "dom": 42, "sr": 60, "sc": 1.52, "ep": 2.88, "bs": 0.0, "d": 4, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 7011, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 1.125, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "That’s the thing - sometimes they may not be? I mean - that thing with audible not allowing downloads, surely wasn’t specified in the original terms. “I am altering the deal, pray I don’t alter it any further”?\n\nPhysical books = yes and I’d also advocate for buying used. A lot of people only read a book once."}, {"id": 50678664, "au": "bentt", "dom": 112, "sr": 61, "sc": 1.52, "ep": 2.6, "bs": 0.0, "d": 0, "age": 1.06, "grav": 7.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2132, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.962, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "Ok yeah, we’re out. I have always remained a subscriber with the understanding that I could bail with my books if I wanted to. Now feeling locked in, I won’t pay them another cent."}, {"id": 50678092, "au": "waltwalther", "dom": 144, "sr": 62, "sc": 1.52, "ep": 2.58, "bs": 0.0, "d": 0, "age": 2.09, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 295, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.978, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "I download my audiobooks when on wireless so that I can stream them without using my data.  This seems like a big pile of horseshit to me.  Hopefully there will be a huge customer backlash, and this will only be temporary."}, {"id": 50677613, "au": "barbazoo", "dom": 118, "sr": 63, "sc": 1.52, "ep": 2.57, "bs": 0.0, "d": 1, "age": 2.83, "grav": 17.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 10211, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Same. You can just download the DRM free files and put them on whatever device. Fuck Amazon and their shitty behavior that's making everything worse. They're infested with greed. It's disgusting."}, {"id": 50678192, "au": "jdr23bc", "dom": 21, "sr": 64, "sc": 1.52, "ep": 2.53, "bs": 0.0, "d": 2, "age": 1.89, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 63, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.001, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "There are loads of apps now for torrent search and download for phones. Your point stands though, most people won't bother. I only use my phone for torrent search now because it has an app that scrapes several sites for each query!"}, {"id": 50678761, "au": "andsoitis", "dom": 40, "sr": 65, "sc": 1.52, "ep": 2.45, "bs": 0.0, "d": 5, "age": 0.93, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.043, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The terms at time of transaction, I bet, include the option for the terms to be modified within a certain range of parameters. Read the terms when you spend your money and decide whether or not you can live with it.\n\nA company will optimize for flexibility and revenue from their end, but they can only push the boundary up to a point before customers or potential customers turn their back."}, {"id": 50679060, "au": "ninjagoo", "dom": 88, "sr": 66, "sc": 1.52, "ep": 2.43, "bs": 0.0, "d": 1, "age": 0.39, "grav": 4.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1350, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Local AI is good enough now so with a bit of tinkering you might be able to read out onscreen books in realtime or generate audio narration for offline use."}, {"id": 50678682, "au": "miek", "dom": 70, "sr": 67, "sc": 1.52, "ep": 2.4, "bs": 0.0, "d": 1, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 494, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For my account, I can only accrue 6 credits.  I'm going to use what I have left and cancel audible.  I'll forever have access to the hundreds of audiobooks i \"purchased\".\n\nAnnoying, but I've been considering cancelling for a while due to the hostile app changes."}, {"id": 50678558, "au": "jrflo", "dom": 103, "sr": 68, "sc": 1.52, "ep": 2.38, "bs": 0.0, "d": 0, "age": 1.25, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 2192, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books", "flbl": "Audiobooks & Books (Credits)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "For those that are upset with Audible, check out libro.fm. It's a non-profit audiobook store that is the same price as Audible, and donates their profits to a local bookstore of your choosing. Also, they let you download your audiobook files in a non-DRM format."}, {"id": 50678417, "au": "analog8374", "dom": 28, "sr": 69, "sc": 1.52, "ep": 2.35, "bs": 0.0, "d": 1, "age": 1.49, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 42, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "entire_piracy", "flbl": "Entire & Piracy (Audible)", "urls": [], "ig": 0.818, "fa": 0.0, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "The main advantage of piracy is that you have access to the whole catalog. The entire output of the human race since forever. Even the unpopular stuff. Not just what Netflix is teasing you with this week."}, {"id": 50678287, "au": "frnx", "dom": 152, "sr": 70, "sc": 1.52, "ep": 2.31, "bs": 0.0, "d": 1, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 67, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "store_free", "flbl": "Store & Free (Services)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, me too. I try to buy from alternative stores, but I bought a Kobo so that I can still access their store if needed : even the Kobo / Kindle duopoly is better than just having Amazon control everything this way."}, {"id": 50679119, "au": "otterley", "dom": 81, "sr": 71, "sc": 1.52, "ep": 2.3, "bs": 0.0, "d": 1, "age": 0.28, "grav": 4.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 14415, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kindle_purchased", "flbl": "Kindle & Purchased (License)", "urls": [], "ig": 0.977, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IAAL who specializes in copyright (this is not legal advice).\n\nYou don’t own copyrighted material you haven’t produced yourself, even if you have an offline copy of its bits. What you have is a license and maybe a piece of physical medium."}, {"id": 50678180, "au": "onthrowaway457", "dom": 145, "sr": 72, "sc": 1.52, "ep": 2.26, "bs": 0.0, "d": 1, "age": 1.9, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 12, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audio_phone", "flbl": "Audio & Phone (Epub)", "urls": [], "ig": 0.961, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Seems like that still works and the title overstates the scope. It’s the ability to download standalone audio files that’s been removed. I wasn’t doing that anyway. But downloading in the app with WiFi is still fine from what I can tell."}, {"id": 50679230, "au": "NeutralCrane", "dom": 102, "sr": 73, "sc": 1.52, "ep": 2.19, "bs": 0.0, "d": 2, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 3507, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "audiobooks_books" (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
