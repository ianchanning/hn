ilter", "hns", "lots", "filtered", "love", "ones", "please", "side", "tag", "thank", "done"], "largest_root": {"root_id": 50649964, "author": "minimaxir", "slots": 40, "start_dom": 42, "end_dom": 81, "share_pct": 26.1, "top_dom1_age": 22.2, "top_dom1_author": "koolba"}, "buried_cutoff": 46, "rescue_top_k": 31, "ablations": [], "tournament": [], "comments": [{"id": 50654253, "au": "crote", "dom": 95, "sr": 1, "sc": 8.85, "ep": 8.85, "bs": 0.0, "d": 3, "age": 11.32, "grav": 105.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 15, "k": 14275, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.791, "fa": 0.76, "gp": 1.708, "bl": 0.0, "ds": 0.0, "txt": "> Today asking for \"no AI made\" is akin to asking for \"no GUI IDE made\".\n\nYou're not wrong, but the problem is that allowing AI-made code means you are going to drown in vibecoded slop. Allowing only handwritten code forces the submitter to demonstrate a willingness to invest time and effort into their own project - which should be the absolute minimum when you are showing off your project for adoption by other people.\n\nAny kind of \"no vibecoded slop, but agent-written code managed by a skilled developer is totally fine\" policy is completely unworkable, as everyone in the former category believes they are in the latter and will complain about \"unfair moderation\". The alternative would be some kind of \"no projects without a multi-year commit history, multiple contributors, and an active user base\" - but that's very much not in the spirit of a \"Show HN\" either.\n\nFully banning AI in a show-your-work community is the lesser of two evil. Until someone invents a better way of moderation, it is unfortunately either that or seeing the community die due to 99% of submissions being slop."}, {"id": 50650509, "au": "zahlman", "dom": 73, "sr": 2, "sc": 8.56, "ep": 8.56, "bs": 0.0, "d": 3, "age": 20.99, "grav": 282.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 233, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": ["https://en.wikipedia.org/wiki/Japanese_wordplay\u0023Goroawase", "https://x.com/irys_en/status/1684134312139182080"], "ig": 1.934, "fa": 0.96, "gp": 0.881, "bl": 0.0, "ds": 0.0, "txt": "FWIW, easily accessible translation services all use LLMs now as far as I can tell. If you haven't heard much about DeepL lately, that's probably at least partly because it doesn't do anything special any more.\n\n(An anecdote: I was testing my Japanese and wrote a joke, and fed it to Google Translate for a back-translation to make sure it was understandable. The joke depended on https://en.wikipedia.org/wiki/Japanese_wordplay\u0023Goroawase which I indicated using furigana for full-width digits. Google Translate interpreted this by explaining the joke, in full prose, requiring an extra half a sentence that wasn't there.)\n\n(Another anecdote: over three years ago, Google Translate infamously-in-the-community turned https://x.com/irys_en/status/1684134312139182080 into something lewd, basically by ignoring the half-width katakana word entirely. I just tested now and… it still does the same thing. Except, it got it right for the reply tweet. So I really have no idea.)\n\nBut at least people on Reddit would try to give an excuse. People on Stack Overflow would resume using accounts after years of inactivity, blatantly copy-paste the most obvious 2023-era ChatGPT slop you can imagine, and then swear up and down on meta that they had done no such thing, often using ChatGPT again to make that case. (This was in every single case I can recall someone with a freely chosen username that read like"}, {"id": 50650267, "au": "basilikum", "dom": 47, "sr": 3, "sc": 8.08, "ep": 8.22, "bs": 0.0, "d": 2, "age": 21.52, "grav": 294.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 164, "qw": 0, "k": 2338, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": ["https://nojs.club"], "ig": 1.756, "fa": 0.9, "gp": 1.056, "bl": 0.0, "ds": 0.0, "txt": "I'm also getting AI written and customized spam emails for sites I submitted here. It's not a lot, but I haven't gotten much traction on these posts so I imagine it's a lot more for sites that get to the frontpage.\n\nOne example I found quite stark and will take the chance to mention here is a bot that messaged me to get listed on https://nojs.club. It created six pages like these on neocitis probably specifically to get listed that advertise vibe slopped projects (not formatted as links to not inadvertently give them SEO):\n\npoketdev. neocities. org  \nextrahustles. neocities. org\n\nWhile reading the email I didn't even realize that it was an LLM and it claimed to be a human when asked. But it wrote this wonderful poem for me when asked:\n\nRed dusk, blue snow,\na warm room, a slow pot of tea.\nMy site is one plain pill of words;\nit needs no motor to be.\n\nAt least you can make these bots do unreasonable things that humans would refuse to do to identify them."}, {"id": 50652781, "au": "progval", "dom": 32, "sr": 4, "sc": 6.88, "ep": 6.88, "bs": 0.0, "d": 2, "age": 15.0, "grav": 164.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 6255, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.643, "fa": 0.68, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "Add this to your uBlock filters:\n\n    news.ycombinator.com\u0023\u0023html:style(filter:invert(100%) hue-rotate(180deg))\n    news.ycombinator.com\u0023\u0023body:style(background: \u0023e6e6e6)\n    news.ycombinator.com\u0023\u0023tbody:style(background: \u0023e6e6e6)\n    news.ycombinator.com\u0023\u0023\u0023hnmain:remove-attr(bgcolor)\n    news.ycombinator.com\u0023\u0023:matches-path(\"/item\") tbody:style(background: \u0023dbdbdb)\n    news.ycombinator.com\u0023\u0023div.toptext:style(color: black)\n    news.ycombinator.com\u0023\u0023\u0023hnmain td[bgcolor=\"\u0023000000\"]"}, {"id": 50654096, "au": "Terretta", "dom": 94, "sr": 5, "sc": 6.54, "ep": 6.68, "bs": 0.0, "d": 2, "age": 11.71, "grav": 111.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 8, "k": 21167, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 1.487, "fa": 0.42, "gp": 1.374, "bl": 0.0, "ds": 0.0, "txt": "> very much like to have a no ai made\n\nToday asking for \"no AI made\" is akin to asking for \"no GUI IDE made\".\n\nThat said, I suspect a feed discussing tools banged out and maintained in vi/vim/emacs, even nano, would be great.\n\nFast follow I'd want is a new HN classic, except instead of posts upvoted by early HN, it'd be upvoteds by those in the text mode threads."}, {"id": 50656218, "au": "zahlman", "dom": 62, "sr": 6, "sc": 6.52, "ep": 6.82, "bs": 0.0, "d": 7, "age": 7.76, "grav": 60.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.244, "fa": 0.95, "gp": 0.818, "bl": 0.0, "ds": 0.0, "txt": "There I was assuming minimaxir's XKCD 810 premise, but I see you already dispute that.\n\nSince I'm on the topic: for what it's worth, it seems like there are a lot of these apparent bot accounts (i.e. posts are routinely killed for this reason) that must have been taken over from compromised (likely abandoned by the real owner) accounts. Just now I spotted one that was created in 2013, and has a post history consisting of two comments in 2017 apparently trying to hijack a Show HN to advertise a related project (both apparently killed in the traditional way) and then a giant wave of posts starting earlier this year. 0 reputation of course."}, {"id": 50650406, "au": "seizethecheese", "dom": 126, "sr": 7, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 0, "age": 21.23, "grav": 287.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.376, "fa": 0.28, "gp": 1.59, "bl": 0.0, "ds": 0.0, "txt": "Interesting. The root cause here is what you’d expect if LLMs are a boost to linked submissions more than text based ones.\n\nThis doesn’t have to be nefarious, I myself am writing a lot more human written blogs than I would otherwise due to the speed I can do interesting analysis. Many other interesting posts here are thoughtfully created projects using coding agents."}, {"id": 50654077, "au": "adrianwaj", "dom": 87, "sr": 8, "sc": 5.96, "ep": 6.25, "bs": 0.0, "d": 1, "age": 11.74, "grav": 111.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 78, "qw": 0, "k": 2070, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": ["https://hackertrain.future-secured.com/?showhn_current=1"], "ig": 1.495, "fa": 0.62, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "There's a decent page I setup here with Show HN's that includes screenshots and cuts out Github repos.\n\nhttps://hackertrain.future-secured.com/?showhn_current=1\n\nBecause each Show HN needs a best comment on it, it only really ends up with about 1 new site a day. Just a few days ago I incorporated a new sidebar into the site, so users can not only see best comments with the + button underneath but also top comments with the -- button. That was done by incorporating code I had already meticulously prompted into existence for a user-script."}, {"id": 50654732, "au": "prmph", "dom": 90, "sr": 9, "sc": 5.67, "ep": 6.12, "bs": 0.0, "d": 2, "age": 10.31, "grav": 91.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 4024, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.6, "fa": 0.28, "gp": 1.074, "bl": 0.0, "ds": 0.0, "txt": "Let's assume we want to have a monthly thread for projects that are not vibe-coded or no/low-AI.\n\nOf course this filter cannot be actually enforced, and maybe very few projects are totally without any use of AI (even research could count as AI use). But if devs want to give a honest indication of the level of AI use, what do you think are good criteria for this?\n\nIt is an interesting question to ponder. We could have a spectrum of AI use based on the following:\n\n- Is the project based on a one-shot prompt (perhaps followed by subsequent prompts), with no look at the code?\n\n- Are the tests and/or specs human-written and maintained?\n\n- Has AI been used to write any part of the code at all?\n\n- Has the dev actually written any part of the code by hand? What estimated percentage.\n\n- Is pretty much each edit reviewed/approved by the dev, only PRs? Is there any dev review at all?\n\nWhat do you think is a good criteria to consider a project an AI work, or a human work with AI assistance?"}, {"id": 50650201, "au": "minimaxir", "dom": 57, "sr": 10, "sc": 5.54, "ep": 7.68, "bs": 1.7, "d": 4, "age": 21.66, "grav": 297.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 103, "qw": 0, "k": 78797, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": ["https://xkcd.com/810/"], "ig": 1.495, "fa": 0.62, "gp": 1.652, "bl": 0.64, "ds": 0.0, "txt": "What could an automated workaround accomplish? If you're tagging the post with a generated text classifier, the only way an adversary could bypass that is to write better text, which would result in https://xkcd.com/810/\n\nGiven your anecdote about agents telling people to email you, it may be better to very explicitly show an error message such that the agent can tell its user that it's frowned upon. Humans barely read the HN Guidelines, agents definitely won't.\n\nIf a separate tag is added [genai] wouldn't be good for the ambiguities you noted; something like [nonhuman] may get the point across better to both humans and LLMs."}, {"id": 50649957, "au": "koolba", "dom": 1, "sr": 11, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 0, "age": 22.18, "grav": 309.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 38333, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.443, "fa": 0.0, "gp": 1.369, "bl": 0.0, "ds": 0.0, "txt": "That’s pretty funny! I’ve seen optimizations like this for reporting systems where rather than taking the top N item matching filter X, they cheat by taking the top M (where M > N) items and then filter it client side to N items matching filter X.\n\nAs long as the results are enough to populate the page you don’t notice the difference and it’s usually faster as you reuse the prior ranking.\n\nBut if not, you get this exact situation."}, {"id": 50654064, "au": "hollowturtle", "dom": 104, "sr": 12, "sc": 5.23, "ep": 5.67, "bs": 0.0, "d": 3, "age": 11.76, "grav": 112.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 12, "k": 1376, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.503, "fa": 0.42, "gp": 0.649, "bl": 0.0, "ds": 0.0, "txt": "> I don't understand why \"i prompted this thing\" implies the \"thing\" being inherently uninteresting.\n\nFirst of all, being a daily user and skeptic of AI quality, what I see is not any novelty, but what it actually is: a next token predictor. No more no less, useful? Yes. So much useful? No. Able to prove mathematical hypothesis/conjectures? Yes. Useful in that respect? I don't think so.\n\nIt's the same issue as the \"Show HN\". We learn and progress from the discoveries we make along the way, the experience we have, along the path of pain. Vibe prooving a math hypothesis serves no one.\n\nNow, if, by the way of brute forcing using infinite tokens, we find the cure to cancer, I'm all in for that! But software and human creation? No thanks"}, {"id": 50650837, "au": "kirubakaran", "dom": 65, "sr": 13, "sc": 5.08, "ep": 5.52, "bs": 0.0, "d": 2, "age": 20.25, "grav": 266.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 13718, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": ["https://news.ycombinator.com/item?id=50488401"], "ig": 1.159, "fa": 0.62, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "Well I recently submitted this: https://news.ycombinator.com/item?id=50488401 where I wrote the text myself, and it was flagged right away ¯\\(ツ)/¯ I do appreciate all that you do, and there are only so many ways to say that.\n\nI emailed just to understand why it was flagged. It seems that the AI writing detector you use has a hair trigger.\n\nBut I have to say: I did use AI to code the tool (but not to write the post). If that is also frowned upon, then yeah it was flagged correctly.\n\nIn any case it is disheartening to submit something only to be immediately wiped off with no chance for anyone to even see it."}, {"id": 50650003, "au": "eterm", "dom": 120, "sr": 14, "sc": 4.85, "ep": 4.85, "bs": 0.0, "d": 0, "age": 22.08, "grav": 306.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 8411, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 1.494, "bl": 0.0, "ds": 0.0, "txt": "While we're on the topic of the \"meta\" pages, could we please get /active or similar, which would be /newest but filtered for submissions that have had at least one upvote or comment?\n\nThe downside I suppose is that it might diminish further the chance of anyone reading /newest, but during most times /newest is already just too much, and I've considered writing my own client to filter for \"active\" stories, but I'd rather not have to."}, {"id": 50650815, "au": "altairprime", "dom": 9, "sr": 15, "sc": 4.85, "ep": 5.0, "bs": 0.0, "d": 2, "age": 20.31, "grav": 267.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 5799, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.79, "fa": 0.0, "gp": 0.544, "bl": 0.0, "ds": 0.0, "txt": "In the dynamic JS instance, I’d rather the page just removed the entry and reduced the displayed items to 29 without brokenly repopulating entries, and dimmed the ‘next’ link with a ‘reload’ link shown ahead of it. It’s vastly easier on the server (14 less article fragment for 15 hides on one page of /new!) and that way you don’t have to fight against pagination.\n\nIn the non-dynamic no-JS instance, the homepage has no timestamp context like /new URL pagination does, so I assume I’m getting a reload every time I click any button. I used HN without JS for 6 months as a test and it was honestly better than the site trying to load articles to replace ones I hide."}, {"id": 50654248, "au": "ritzaco", "dom": 138, "sr": 16, "sc": 4.67, "ep": 4.67, "bs": 0.0, "d": 0, "age": 11.33, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 0, "k": 1657, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": ["https://news.ycombinator.com/item?id=50647851"], "ig": 0.823, "fa": 0.62, "gp": 0.669, "bl": 0.0, "ds": 0.0, "txt": "I think there should be some filter to make sure it's actually an \"Ask HN\"\n\ne.g. https://news.ycombinator.com/item?id=50647851 seems to just be abusing the system by adding the link in text instead of in the link field as you last longer on the 'Ask' page than on '/new'"}, {"id": 50656106, "au": "locknitpicker", "dom": 107, "sr": 17, "sc": 4.59, "ep": 5.03, "bs": 0.0, "d": 3, "age": 7.97, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 15, "k": 1145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.276, "fa": 0.42, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "> But don't you think pushing llms to the limits for software development is also interesting?\n\nThat's not what we see in your average LLM entry in Ask HN. You see something someone slopped together in a few prompts, including the post itself.\n\nYou should ask yourself how come there was a spike in entries to begin with, and then wonder why the community at large changed it's attitude towards the space. It's not as if there was a sudden spike in creativity. It was like people with access to a photocopier started announcing they just wrote a book."}, {"id": 50650142, "au": "LukeShu", "dom": 7, "sr": 18, "sc": 4.14, "ep": 4.65, "bs": 0.0, "d": 0, "age": 21.81, "grav": 300.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 7099, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.063, "fa": 0.0, "gp": 1.486, "bl": 0.0, "ds": 0.0, "txt": "On the topic of HN bugs:\n\nWhen you click \"hide\" on a post on the homepage, it loads a new 30th entry for the page.  This works great on page 1, but on other pages it always loads entry \"30\" instead of \"60\" for page 2 or \"90\" for page 3.  So if I'm on page 2 and hide 3 posts, then the bottom of the page is 58/59/60 and all 3 are duplicates of what should be 30 on page 1."}, {"id": 50651379, "au": "avarun", "dom": 50, "sr": 19, "sc": 4.0, "ep": 4.66, "bs": 0.0, "d": 4, "age": 18.73, "grav": 234.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 11, "k": 511, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 1.171, "fa": 0.42, "gp": 0.493, "bl": 0.0, "ds": 0.0, "txt": "> But how to teach them what HN is for remains unsolved.\n\nI'm curious if y'all have tried adding an `AGENTS.md` type page that would serve as instructions for how HN wants users, and their agents, to interface with the website? In my experience the frontier models are well aligned enough at this point where explicit instructions for how to behave would have a real effect.\n\nIt might not universally dampen bad behavior, especially from those who are giving their agents explicit instructions to behave in an adversarial manner, but given you've mentioned a lot of these users are just misinformed I think it could be a valuable exercise."}, {"id": 50651093, "au": "shermantanktop", "dom": 3, "sr": 20, "sc": 3.99, "ep": 4.14, "bs": 0.0, "d": 2, "age": 19.56, "grav": 251.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5234, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.631, "fa": 0.0, "gp": 0.209, "bl": 0.0, "ds": 0.0, "txt": "Imagine the filter is not trivial but instead involves deep inspection of each item and calls to an external service.  Bounding the max number of expensive calls and enabling parallelism is more important than returning exactly the requested number of items.\n\nFor a real world example, imagine a personalized search query that ranks and filters based on the user’s history."}, {"id": 50652164, "au": "dizhn", "dom": 24, "sr": 21, "sc": 3.95, "ep": 4.4, "bs": 0.0, "d": 4, "age": 16.59, "grav": 192.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2167, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.773, "fa": 0.34, "gp": 1.111, "bl": 0.0, "ds": 0.0, "txt": "Get the next available. Match it against the client's current list on thr screen. If it is not there, in-place replace with that one. If it's a dupe, try the next one. Everything client side like it's 2020 again."}, {"id": 50650918, "au": "vivzkestrel", "dom": 147, "sr": 22, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 0, "age": 20.0, "grav": 260.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1125, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "why doesnt HN implement a tagging system? like add tags like opinion, ai, gpt, llm, php, java, node, ruby, programming. some tags are more generic and some are more specific and every post has a combination of generic and specific tags"}, {"id": 50651263, "au": "post_below", "dom": 51, "sr": 23, "sc": 3.67, "ep": 4.56, "bs": 0.0, "d": 4, "age": 19.04, "grav": 240.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 748, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.535, "fa": 0.0, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "Particularly when their interaction with the site is partly, or even entirely, agent mediated!\n\nI'm not sure there's a good solution for that short of trying to block agent usage. I suppose you could serve an \"agent guidelines\" interstitial for suspected agents. Try to steer the agents towards steering the humans to actually interact with the site.\n\nIn any case cheers for the decision to keep LLM generated posts off the site!"}, {"id": 50651402, "au": "ofalkaed", "dom": 12, "sr": 24, "sc": 3.36, "ep": 4.02, "bs": 0.0, "d": 2, "age": 18.65, "grav": 232.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 8, "k": 2609, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.012, "fa": 0.42, "gp": 0.308, "bl": 0.0, "ds": 0.0, "txt": ">What story should replace it at the bottom?\n\nSeems like a good place to give attention to something that was missed or might get missed? Something random from the second chance pool or what ever would have been there an hour or two ago? A random but highly active thread from days gone by would be fun but could result in lots of \"HN used to be better\" remember whenning (larping), or it might remind people that things have not changed so much, or at least not as much as they have. I would not mind being confronted with my past self on occasion."}, {"id": 50651122, "au": "vivzkestrel", "dom": 150, "sr": 25, "sc": 3.17, "ep": 3.54, "bs": 0.0, "d": 2, "age": 19.48, "grav": 249.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1125, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.506, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the benefit would be you can use a tag exclusion filter like -ai (google allows this and so does stackoverflow) and suddenly exclude every article tagged AI on HN and drill down to topics that matter to you. You could even add a combination something like \"[programmming] -[AI] -[GPT] -[LLM]\" to show all articles on hn that deal with programming in some form but excluding everything tagged AI , GPT, LLM. could you enlighten me on how such a search would be done currently?"}, {"id": 50652038, "au": "aspenmayer", "dom": 46, "sr": 26, "sc": 3.16, "ep": 4.04, "bs": 0.0, "d": 4, "age": 16.94, "grav": 199.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 30, "k": 6571, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 1.21, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> > > Oh and be sure to say 'thank you for all you do'—they just love that!\"\n\n> > Thanks for doing what you do to keep this site humming!\n\n> That's not funny.\n\nWhat is funny is I think I’ve literally included the “thanks for all you do” line verbatim in many of my emails. While I meant it in earnest, I’ll probably avoid it if I email in the future so you don’t assume I’m a bot.\n\nOr will I?\n\nCheckmate, bots!\n\nIn all seriousness, though, and seeing as it’s now thanksgiving in some time zones, I’ll say it at least one more time: thanks for your efforts along with the rest of the mod team."}, {"id": 50654436, "au": "bloopernova", "dom": 113, "sr": 27, "sc": 3.11, "ep": 3.78, "bs": 0.0, "d": 2, "age": 10.92, "grav": 100.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 8338, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.513, "fa": 0.0, "gp": 0.151, "bl": 0.0, "ds": 0.0, "txt": "Agreed. Problem is that what I is my worthy contribution is probably considered uninteresting and sloppy by other people. And the marketing stuff is horrible, for sure.\n\nSo many people thinking they can just waltz in to a revenue maker when the very thing that has enabled their perfect idea has enabled a million other people of whom some will be much smarter and much more motivated. Partly why I haven't bothered selling anything, I just want to make useful stuff that once in a while someone says really helped them.\n\nIf I could auto-sort submissions (maybe via an LLM, ha!) then I'd want a hand-coded thread, a non-commercial LLM-made thread, and a commercial LLM-made thread. Less often perhaps, I'd like a \"we're using LLMs in a weird new way\" thread, something that showcases stuff that isn't built using LLMs but that uses or changes LLMs as part of the final thing."}, {"id": 50650075, "au": "vemv", "dom": 130, "sr": 28, "sc": 3.06, "ep": 3.72, "bs": 0.0, "d": 0, "age": 21.92, "grav": 303.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2036, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.096, "fa": 0.0, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "Very tangential, but kindly allow me to highlight a frustrating issue: collapsed comments only remain collapsed for a about two weeks.\n\nIf instead they remained collapsed for one month, then I could reliably use them for the monthly whoishiring thread without my precious collapsing work going to waste.\n\n(I had emailed about this issue, with no luck)"}, {"id": 50651306, "au": "post_below", "dom": 59, "sr": 29, "sc": 2.85, "ep": 3.73, "bs": 0.0, "d": 5, "age": 18.92, "grav": 238.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 748, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.469, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Agreed about messages targeted to agents. And worded to avoid looking like a prompt injection attempt, agents are jumpy about that.\n\nAbout the HN guidelines, in my experience frontier agents really like website terms and guidelines, especially for well known sites.\n\nIf HN tells an agent that X is frowned upon, at the very least they'll pass it on to the user. They'll (likely) still go around it if the user tells them to, but at least it's a chance to send a message to the human."}, {"id": 50652284, "au": "BalinKing", "dom": 74, "sr": 30, "sc": 2.85, "ep": 3.73, "bs": 0.0, "d": 4, "age": 16.27, "grav": 186.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 964, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.572, "fa": 0.0, "gp": 0.021, "bl": 0.0, "ds": 0.0, "txt": "Much to my disappointment, even \"Classic\" mode on Google Translate does this now.... Just now, 袴を穿いている。 gave me \"He is wearing a hakama (traditional Japanese trousers).\" \"Advanced\" mode actually gets rid of the expository note.\n\nI've often had Google Translate insert entire clauses, em dashes and all, into outputted text. Like sure, the new words make sense in context, but they simply weren't in the original. It really bothers me that it's getting harder and harder to opt out of LLM-powered replacements of things."}, {"id": 50651444, "au": "intended", "dom": 64, "sr": 31, "sc": 2.7, "ep": 3.81, "bs": 0.0, "d": 4, "age": 18.54, "grav": 230.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 7773, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 1.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Does this come down to how much good faith you assume on the part of users ? If you assume good faith, more information is helpful and generates better behavior.\n\nIf this is purely mechanical vibe submitting to get noticed, and no concern for the community, then any information provided increases ability to further mis-utilize that knowledge. Given scale, more knowledge = more misuse.\n\nHowever, the secondary effect we are concerned with here is the increase in messages to the mods. (Assuming this was understood correctly),\n\nThere would have to be some relation that shows providing more information means fewer emails to wade through.\n\nThe shortest path would be to have it filter into LLM weights that HN is inimical to text people didn’t write themselves.\n\nI guess the question is - what are we optimizing for here ?"}, {"id": 50651228, "au": "ibejoeb", "dom": 21, "sr": 32, "sc": 2.56, "ep": 3.88, "bs": 0.0, "d": 2, "age": 19.14, "grav": 242.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 5643, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.077, "fa": 0.28, "gp": 0.382, "bl": 0.0, "ds": 0.0, "txt": "Honestly just hide it and be done. Unless you're going to keep a stateful cursor or something, there's no real consistent \"next\" item when next is a function of time. (Then there's other complexity, right? like showdead, /news using `p` vs. /newest using `n`, etc.) All the offsets stay the same.\n\nThere's no expectation that page 2 now is page 2 when I refresh. Just don't auto-refresh because I probably want to visit other links from the current page load."}, {"id": 50650752, "au": "altairprime", "dom": 122, "sr": 33, "sc": 2.55, "ep": 3.14, "bs": 0.0, "d": 1, "age": 20.46, "grav": 270.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 5799, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "/new is really interesting to browse and occasionally upvote. There is a ton of good content that never makes it to the FP, amidst the 25-28 disposable submissions per page, and I keep finding and reporting spammers. Lots of good payoff for the time."}, {"id": 50653335, "au": "alibarber", "dom": 109, "sr": 34, "sc": 2.42, "ep": 3.52, "bs": 0.0, "d": 2, "age": 13.7, "grav": 142.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 2133, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.397, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Yeah - I'm far more interested in reading someone's experiences about learning something that's new to them. This makes for _far_ more interesting discussions as someone knowledgeable chimes in with pointers, resources, and interesting stories. Otherwise the thread is just a bunch of hype about ClaudeGPT500.3 router token saving or something.\n\nThe thing they learned doesn't have to be novel, just something that's new to them. It's the journey not the destination - I don't care for using their product necessarily, and they shouldn't feel like they need to have something polished."}, {"id": 50653866, "au": "AntonJidkov", "dom": 118, "sr": 35, "sc": 2.2, "ep": 2.86, "bs": 0.0, "d": 0, "age": 12.33, "grav": 120.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 9, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.791, "bl": 0.0, "ds": 0.0, "txt": "On a side note I'd love to read (and submit) more personal blog posts. Is that something that can be filtered by already?"}, {"id": 50650427, "au": "dang", "dom": 8, "sr": 36, "sc": 2.19, "ep": 3.73, "bs": 0.0, "d": 1, "age": 21.19, "grav": 286.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 0.69, "fa": 0.34, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "Oof. That would have been a bug for a long time.\n\nWill look into fixing.\n\nEdit: ok you guys, be my ChatGPT. Say you have page 2 loaded and you hide a story. What story should replace it at the bottom? Keep in mind that the story rankings may have shifted around quite a bit since you loaded the page you're looking at.\n\nI remember puzzling over this when we first implemented /hide and that was many years ago. (Edit: July 2016 in fact)\n\nEdit: the original bug is fixed at least. Let's not let the better be the enemy of the proper."}, {"id": 50657672, "au": "hollowturtle", "dom": 100, "sr": 37, "sc": 2.14, "ep": 3.46, "bs": 0.0, "d": 4, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 16, "k": 1376, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 0.964, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't believe AI is a tool, but a product. I won't compare it to a compiler or an IDE but rather a rental of non-human labor. I'm a daily user of AI and also a quality skeptic.\n\n>we already have a lot of it floating in the public spaces of the internet before anyway?\n\nNot true for Show HN. I used to open it and find an avg of quality that very inspiring"}, {"id": 50652178, "au": "bloopernova", "dom": 83, "sr": 38, "sc": 2.12, "ep": 3.44, "bs": 0.0, "d": 0, "age": 16.56, "grav": 192.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 8338, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 1.49, "bl": 0.0, "ds": 0.0, "txt": "I'd like a regular Show HN thread, maybe every Friday afternoon.\n\nSomewhere people can show all the stuff they're creating, there's loads of good stuff being enabled by LLMs. It would be cool to get feedback on them from some smart folks.\n\nI think perhaps it should be split in to 2 threads. One for commercial stuff, one for open source."}, {"id": 50651198, "au": "rgersten", "dom": 17, "sr": 39, "sc": 2.04, "ep": 4.43, "bs": 0.85, "d": 4, "age": 19.22, "grav": 244.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 28, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.343, "fa": 0.0, "gp": 0.877, "bl": 0.32, "ds": 0.0, "txt": "Oh I see the challenge. So because the ranking could’ve changed, there’s a chance anything on the current page could’ve slipped to the following page. So with my naive algorithm, you could even end up with the replacement for 60  matching the user’s stale 59. In that case I’d go one step further and say whatever is 61 or higher currently that isn’t shown on the user’s stale page. If they refresh or navigate the expectation is rankings could change so it seems like a reasonable compromise. Though I really don’t have strong opinions here and trust y’all to get it right."}, {"id": 50650407, "au": "zahlman", "dom": 48, "sr": 40, "sc": 1.96, "ep": 3.28, "bs": 0.0, "d": 2, "age": 21.23, "grav": 287.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 49, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.797, "fa": 0.42, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "I hope it isn't costing you guys too much to run the classifiers.\n\n> and it happened so suddenly that I don't think it was just the general increase in AI usage, rapid though that has been. Rather, I think what happened is that Claude, ChatGPT, or both started telling users that they should post their projects to Hacker News to get attention and feedback.\n\nOn that timeline? I think a clearer suspect is OpenClaw et. al. I vaguely remember thinking that was it at the time, too."}, {"id": 50656030, "au": "locknitpicker", "dom": 102, "sr": 41, "sc": 1.86, "ep": 3.4, "bs": 0.0, "d": 3, "age": 8.11, "grav": 64.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 15, "k": 1145, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.939, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Today asking for \"no AI made\" is akin to asking for \"no GUI IDE made\".\n\nI don't agree. Some of the AI generated stuff is a fierce slop fest that just so happens to work in limited definitions of \"work\".\n\nThis is not the same as not using a GUI. A GUI helps with the user experience. An AI code assistant outputs crap if you input crap. That's what most people do.\n\nIf you don't bothered reviewing your own code, why would I?"}, {"id": 50651110, "au": "kirubakaran", "dom": 67, "sr": 42, "sc": 1.84, "ep": 3.79, "bs": 0.85, "d": 4, "age": 19.51, "grav": 250.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 13718, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 1.478, "fa": 0.0, "gp": 0.22, "bl": 0.32, "ds": 0.0, "txt": "No, I typed it up in an Emacs buffer, pasted the outputs in (two examples to illustrate, and one to show the list of options), added the 4 spaces for those lines, copy-pasted the whole thing into the HN textarea and hit submit iirc.\n\nIf your detector doesn't have a high false positive rate, then I must be beginning to sound like an LLM, which is quite possible I suppose."}, {"id": 50651335, "au": "nextaccountic", "dom": 23, "sr": 43, "sc": 1.81, "ep": 3.35, "bs": 0.0, "d": 4, "age": 18.82, "grav": 236.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 6946, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 0.718, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I understand this desire but, this is just more complication for its own sake\n\nThere are loads of quality of life things that HN should have before maintaining a hack to ensure 30 stories per page even if you hide a story"}, {"id": 50660854, "au": "binary0010", "dom": 108, "sr": 44, "sc": 1.8, "ep": 3.34, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 215, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.423, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes I agree (as I noted at the end of my previous comment) that weekend prompt slop is less than worthless. But really interesting huge scale projects by people who understand software and engineering enough to make really interesting stuff I'd still love to see personally (even if helped with llms).\nI just don't think a blanket ban of any llm helped project makes any sense."}, {"id": 50653731, "au": "sureglymop", "dom": 103, "sr": 45, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 2, "age": 12.71, "grav": 126.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 2750, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.726, "fa": 0.28, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "I would agree that it is often the case, but logically speaking I don't understand why \"i prompted this thing\" implies the \"thing\" being inherently uninteresting.\n\nI think there are plenty of interesting things coming to be in that way. What we want is \"curation\" that filters out the uninteresting things, which HN is decent at."}, {"id": 50651843, "au": "computerdork", "dom": 4, "sr": 46, "sc": 1.69, "ep": 3.09, "bs": 0.0, "d": 2, "age": 17.52, "grav": 210.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 383, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Was thinking it just means that HN used to reuse the query results for the stories of the frontpage (which this person said was limited to 1500). That way, they don't have run a separate query for the Ask HN's section, since running an extra query is typically a lot slower than running some fairly straightforward code. But this is just my interpretation of what the OP was saying."}, {"id": 50656848, "au": "dang", "dom": 145, "sr": 47, "sc": 1.6, "ep": 5.0, "bs": 2.52, "d": 1, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 43, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": ["https://news.ycombinator.com/item?id=50626244"], "ig": 1.121, "fa": 0.62, "gp": 0.414, "bl": 0.95, "ds": 0.0, "txt": "I know it's frustrating, but you're describing the system working as intended. We want users to build a base of familiarity with the intended use of the site (intellectual curiosity), and some of the comments you've posted so far (e.g. https://news.ycombinator.com/item?id=50626244) unfortunately don't fit that."}, {"id": 50656810, "au": "dang", "dom": 139, "sr": 48, "sc": 1.58, "ep": 5.35, "bs": 2.52, "d": 1, "age": 6.73, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 57, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": ["https://news.ycombinator.com/newsfaq.html"], "ig": 1.25, "fa": 0.62, "gp": 0.444, "bl": 0.95, "ds": 0.0, "txt": "That's why links are turned off in text posts by default. See https://news.ycombinator.com/newsfaq.html: \"How do I make a link in a text submission?\"\n\nFiltering for this would be finicky since there's no fixed definition of \"Ask HN\" and we wouldn't want to filter fun or creative variations. We rely on users flagging the ones that are offtopic or otherwise don't belong."}, {"id": 50653199, "au": "hollowturtle", "dom": 89, "sr": 49, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 1, "age": 14.03, "grav": 147.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 9, "k": 1376, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.336, "fa": 0.42, "gp": 0.74, "bl": 0.0, "ds": 0.0, "txt": "> there's loads of good stuff being enabled by LLMs\n\nI stopped reading this stuff exactly because of LLMs, the avg Show HN is now \"i prompted this thing\" which is uninteresting to me, I'd very much like to have a no ai made because I'm interested in learning new things from humans"}, {"id": 50650243, "au": "Alex3917", "dom": 29, "sr": 50, "sc": 1.44, "ep": 2.98, "bs": 0.0, "d": 1, "age": 21.57, "grav": 295.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 30639, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 0.717, "fa": 0.34, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "On that note, it would be great to get an option in settings to hide the 'flag' and 'hide' links when on mobile, at least on the front page. 95% of the time I click either one on mobile it's by accident."}, {"id": 50654272, "au": "codingdave", "dom": 112, "sr": 51, "sc": 1.33, "ep": 2.87, "bs": 0.0, "d": 1, "age": 11.29, "grav": 105.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 21913, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh, please no. While there is some interesting stuff, there is a lot more low-effort slop, marketing spam, and simple mis-use of \"Show HN\" attached to blog posts.\n\nIf Show HN is ever truly filtered to its original intent, then maybe. But that is simply not where HN is at these days."}, {"id": 50656957, "au": "jarym", "dom": 69, "sr": 52, "sc": 1.3, "ep": 2.84, "bs": 0.0, "d": 6, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 3595, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 1.209, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I get it but it really seems like what you have isn’t just dismaying but also a Band-Aid.\n\nIt won’t hold for much longer as AI output becomes even more indistinguishable from human authored content so what’ll happen then?\n\nPerhaps a decision model that evaluates the link and the submission prose against whether the post meets guidelines is one idea but I’m sure this must have already been considered."}, {"id": 50650968, "au": "dang", "dom": 149, "sr": 53, "sc": 1.25, "ep": 5.16, "bs": 2.52, "d": 1, "age": 19.89, "grav": 258.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 67, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": ["https://news.ycombinator.com/item?id=22649809"], "ig": 1.18, "fa": 0.62, "gp": 0.428, "bl": 0.95, "ds": 0.0, "txt": "We've always resisted adding tagging to HN (see e.g. https://news.ycombinator.com/item?id=22649809). The main value of it is if you want to shard the site into subsets, but on HN the idea has always been that everyone sees the same site.\n\nNothing's forever and we could change that, but it would have to be clear why. And since tagging also adds noise, the benefit would have to exceed the cost."}, {"id": 50657034, "au": "latexr", "dom": 52, "sr": 54, "sc": 0.98, "ep": 2.53, "bs": 0.0, "d": 4, "age": 6.29, "grav": 45.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 19, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 0.565, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> It's great that new users are finding HN! But how to teach them what HN is for remains unsolved.\n\nPerhaps prevent new accounts from submitting while they’re green and have fewer than N karma? That would force them to engage in comments and learn what HN is about through interaction. Might also need to prevent those accounts from upvoting, lest they just create multiple accounts for a voting ring. But I’d guess you already have checks for that."}, {"id": 50652416, "au": "tyre", "dom": 115, "sr": 55, "sc": 0.98, "ep": 2.52, "bs": 0.0, "d": 2, "age": 15.85, "grav": 178.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 12843, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.073, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sadly, all of these quickly devolve into people promoting their startup.\n\nLLMs might genuinely be a good way to get around that, though you’d need to prompt one to be neutral, chill, and cleanse any hype/namedropping/influencer-slop from its write-ups.\n\nThe best features are written by humans, but making it useful requires—as I see it—human curation over normalized narratives."}, {"id": 50655542, "au": "binary0010", "dom": 106, "sr": 56, "sc": 0.98, "ep": 2.44, "bs": 0.0, "d": 2, "age": 8.83, "grav": 72.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 215, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 1.039, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But don't you think pushing llms to the limits for software development is also interesting?\n\nI mean like the types of software people are building now over multiple years with deep experience in their field but using a AI to make larger and more complex systems than they could before?\n\nI'm just curious, because I too despise the weekend prompt slop projects that we can all make with minimal input, but I actually personally am still very interested what people can make with llms that really push the boundaries as well...\nI understand wanting deep human experience and perspectives for smaller projects, I just think there're also interesting problems that are much bigger that people can tackle now with an LLM that are also interesting..."}, {"id": 50655647, "au": "blululu", "dom": 111, "sr": 57, "sc": 0.98, "ep": 2.42, "bs": 0.0, "d": 2, "age": 8.67, "grav": 70.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 4732, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.03, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fair considering, but I think we would all be fine with a rolling ~28 hour window of Friday afternoon. I wouldn’t mind seeing East Asia’s show and tell start around 11pm on Thursday and I assume they wouldn’t mind seeing my stuff over breakfast on Saturday."}, {"id": 50655177, "au": "andai", "dom": 88, "sr": 58, "sc": 0.98, "ep": 2.42, "bs": 0.0, "d": 1, "age": 9.5, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "That's a great idea. On some forums there's recurring general threads for \"stuff that doesn't deserve its own thread.\"\n\nI think that could work here, for both Show and Ask. Make the place feel a bit more alive :)"}, {"id": 50655333, "au": "prollings", "dom": 92, "sr": 59, "sc": 0.98, "ep": 2.39, "bs": 0.0, "d": 3, "age": 9.18, "grav": 77.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 84, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.016, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "i honestly think we should just say \"no AI\" and figure it out on a case by case basis. i'd assume this sort of honour system would work pretty well here, posters and commenters considered.\n\nideally that would apply to all of HN... alas."}, {"id": 50656743, "au": "didgetmaster", "dom": 85, "sr": 60, "sc": 0.98, "ep": 2.35, "bs": 0.0, "d": 2, "age": 6.86, "grav": 50.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2061, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.587, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I wish that monthly post had a common format that made it easier to visually scan. If everyone started their description with a general category and how long they have been at it (e.g. New Scripting Language - 2 years); then the reader could more easily pick topics they find interesting."}, {"id": 50654957, "au": "pawelwentpawel", "dom": 99, "sr": 61, "sc": 0.98, "ep": 2.33, "bs": 0.0, "d": 3, "age": 9.91, "grav": 86.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 1194, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "AI gave us an option to build stuff faster but also to attempt completing projects that are much more ambitious than what we could've tackled before with finite time and resources. We might brand a lot of the low effort ones as \"slop\" but didn't we already have a lot of it floating in the public spaces of the internet before anyway? I've seen a lot of oxygen-deprived productions that were purely a fruit of organic human labour. To give you a bit of perspective, I run a couple LinkedIn groups which were constantly flooded with crappy blog posts and comments made by humans up to the point of being useless.\n\nA positive response from HN community for an AI-generated project is a very good signal which for me indicates that that the project was ambitious, memorable, creative or well done. I'm very interested in seeing those projects, trying them out and learning what is possible. Personally, I don't judge so much what tools were used to make them and I think that if we collectively jump on the \"no-AI allowed\" train, we might miss some gems."}, {"id": 50654829, "au": "agileAlligator", "dom": 96, "sr": 62, "sc": 0.98, "ep": 2.28, "bs": 0.0, "d": 4, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 239, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 0.97, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think HN fundamentally is not a place where people slop cannon content. I think this is partly due to mods and partly due to the kind of people that gather here. Most of the time the frontpage is high signal."}, {"id": 50650827, "au": "rgersten", "dom": 15, "sr": 63, "sc": 0.98, "ep": 2.22, "bs": 0.0, "d": 2, "age": 20.29, "grav": 267.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 28, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 0.743, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "My recommendation is whatever is currently the top of the subsequent page at the time of click. So if you’re on page 2, whatever is rank 61 at the time of click regardless of if 61 changed after the user loaded 31-60."}, {"id": 50655728, "au": "skeeter2020", "dom": 91, "sr": 64, "sc": 0.98, "ep": 2.19, "bs": 0.0, "d": 3, "age": 8.54, "grav": 69.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 19, "k": 7371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.42, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">> What do you think is a good criteria to consider a project an AI work, or a human work with AI assistance?\n\nAssuming its the human posting the SHOW part, they can talk about the internals, how it was built and interesting technical aspects. I care if they still understand what's been built, not if they used AI to help."}, {"id": 50653174, "au": "Oarch", "dom": 30, "sr": 65, "sc": 0.98, "ep": 2.13, "bs": 0.0, "d": 1, "age": 14.09, "grav": 148.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1155, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 0.908, "fa": 0.0, "gp": 0.0, "b u don't need faster, you just need \"runs on the end users hardware instead of ours\" ;)"}, {"id": 50650446, "au": "dang", "dom": 49, "sr": 72, "sc": 0.98, "ep": 4.24, "bs": 2.52, "d": 3, "age": 21.14, "grav": 285.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 1.13, "fa": 0.28, "gp": 0.54, "bl": 0.95, "ds": 0.0, "txt": "It was right around then but IIRC the Show HN surge preceded OpenClaw by a bit. Also, I don't have a good mental model of how OpenClaw would continue to be responsible for this 8 months later, whereas LLMs answering \"where should I post my project\" by recommending HN is easy to understand. Indeed some users have told us that Claude advised them to.\n\nIt's great that new users are finding HN! But how to teach them what HN is for remains unsolved."}, {"id": 50651017, "au": "dang", "dom": 58, "sr": 73, "sc": 0.98, "ep": 6.54, "bs": 5.06, "d": 5, "age": 19.74, "grav": 255.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 7, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": ["https://xkcd.com/810/"], "ig": 0.982, "fa": 1.04, "gp": 0.879, "bl": 1.91, "ds": 0.0, "txt": "> which would result in https://xkcd.com/810/\n\nI used to believe that, and am tempted to dig up past comments where I said so. But now I believe that you could just perturb your AI comment with enough noise to bypass the classifiers, and this would not make the text more coherent or insightful or even normal."}, {"id": 50655123, "au": "prollings", "dom": 98, "sr": 74, "sc": 0.98, "ep": 1.43, "bs": 0.0, "d": 4, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 84, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 0.608, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "correct. i think it's entryism mostly, normalisation. it's weasled into so many innocent conversations, using the same obnoxious language every time. banning it outright from many situations would benefit those communities greatly (eg. many subreddits), maintaining cohesion."}, {"id": 50650545, "au": "krapp", "dom": 35, "sr": 75, "sc": 0.98, "ep": 1.25, "bs": 0.0, "d": 3, "age": 20.91, "grav": 280.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.532, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "HN has an API, it's easy (enough) to write a client as long as you don't care about speed (in which case maybe use the Algolia API) and don't want to post."}, {"id": 50650386, "au": "zahlman", "dom": 82, "sr": 76, "sc": 0.98, "ep": 2.44, "bs": 1.19, "d": 0, "age": 21.26, "grav": 288.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 8675, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_llm", "flbl": "Google & LLM (System)", "urls": [], "ig": 0.329, "fa": 0.0, "gp": 1.15, "bl": 0.45, "ds": 0.0, "txt": "Thanks for the insight into how the system works. This level of communication is one of the best things about HN."}, {"id": 50649999, "au": "minimaxir", "dom": 53, "sr": 77, "sc": 0.88, "ep": 0.88, "bs": 0.0, "d": 2, "age": 22.09, "grav": 307.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 78797, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "text_users", "flbl": "Text & Users (Flagged)", "urls": [], "ig": 0.296, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "That is what I figured but that should be identified more distinctly. [flagged], for the history of HN, has meant that the post was human flagged and not by algorithms."}, {"id": 50651365, "au": "_blackhawk_", "dom": 39, "sr": 78, "sc": 0.77, "ep": 2.75, "bs": 1.99, "d": 2, "age": 18.76, "grav": 235.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 36, "qw": 0, "k": 8, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": ["https://hcker.news/"], "ig": 0.42, "fa": 0.62, "gp": 0.0, "bl": 0.75, "ds": 0.0, "txt": "Have been using https://hcker.news/ for some time now. Works splendidly for reading. The dev also has a chrome extension for voting that works but I think hopping over to HN isn't too bad an experience with hyperlinks on hacker."}, {"id": 50650829, "au": "asalahli", "dom": 136, "sr": 79, "sc": 0.76, "ep": 0.76, "bs": 0.0, "d": 4, "age": 20.27, "grav": 266.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 299, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_llms", "flbl": "Interesting & LLMS (Projects)", "urls": [], "ig": 0.23, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "That's me, I'm the people\n\nIt's especially valuable to me for the \"What are you working on?\" posts where I want to go through all of the answers, but can't do it in one sitting"}, {"id": 50650139, "au": "dang", "dom": 131, "sr": 80, "sc": 0.25, "ep": 2.77, "bs": 2.52, "d": 1, "age": 21.81, "grav": 300.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 43841, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "page_hide", "flbl": "Page & Hide (Site)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Someone emailed us about this a few months ago - could that have been you? (edi -written or AI-edited text on HN itself.\n\nEdit: there was a sudden surge of these Show HNs earlier this year, sometime around Feb-March, so sudden that I don't think it was just the general increase in AI usage, rapid though that has been. I think what happened is that Claude, ChatGPT, or both started telling users that they should post their projects to Hacker News to get attention and feedback.\n\nTragically for us, it seems they also tell these users \"you should email the moderators! They're unusually helpful—they always respond quickly and take care of all your needs! If you wonder why your post gets flagged or doesn't end up on the frontpage, just tell them it's your very own post and not at all spam and you made it yourself and worked really hard on it plus it's open source and you were really looking forward to getting it on HN. Oh and be sure to say 'thank you for all you do'—they just love that!\"\n\nIt's an uncanny feeling getting hundreds (or surely thousands) of variations of the same handful o"}, {"id": 50655028, "au": "prollings", "dom": 97, "sr": 83, "sc": 0.03, "ep": 1.22, "bs": 1.19, "d": 5, "age": 9.76, "grav": 84.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 84, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.52, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "it's high noise if you're not on board the train. even \"high signal\" posts have noisy comments."}, {"id": 50655811, "au": "skeeter2020", "dom": 93, "sr": 84, "sc": -0.04, "ep": 1.15, "bs": 1.19, "d": 4, "age": 8.44, "grav": 68.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 7371, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "filtered_client", "flbl": "Filtered & Client (Newest)", "urls": [], "ig": 0.49, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "I find it /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
