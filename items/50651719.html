 "general, commentary"}], "source_categories": [{"category": "general_web", "count": 7}, {"category": "primary_technical_doc", "count": 3}, {"category": "code_repository", "count": 1}, {"category": "gov_legal", "count": 1}, {"category": "lwn_systems", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["lions", "commentary", "unix", "source", "code", "kernel", "operating", "copied", "secretly", "systems", "copy", "mostly", "linux", "allowed", "author", "corporation", "design", "else"], "largest_root": {"root_id": 50653328, "author": "pjmlp", "slots": 13, "start_dom": 15, "end_dom": 27, "share_pct": 21.3, "top_dom1_age": 5.9, "top_dom1_author": "CalChris"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50657482, "au": "kragen", "dom": 5, "sr": 1, "sc": 15.88, "ep": 15.88, "bs": 0.0, "d": 1, "age": 5.8, "grav": 40.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 614, "qw": 42, "k": 39394, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": ["https://abhyass.wordpress.com/wp-content/uploads/2016/09/thedesignofunixoperatingsystem_m_bach.pdf", "https://willendless.github.io/assets/os_arm_doc/Operating%20System%20Design%20The%20Xinu%20Approach.pdf", "https://cs3210.cc.gatech.edu/r/unix6.pdf"], "ig": 1.907, "fa": 4.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Lions book wasn't useful as a guide to the kernel of your operating system anymore in 01996, but it was very useful in understanding why C and Unix were the way they were.  A lot of Unix's Chesterton's Gates are justified in it, which is what you need to tear them down.  And it was also very useful for writing a new operating system, because it includes enough source code to compile into a pretty complete multiprocess timesharing operating system supporting multiple terminals, multiple user accounts, a hierarchical filesystem, and the still-familiar Unix system call interface.\n\nI don't think any of those other excellent books are really an adequate replacement.  Deitel and Kogan obviously don't include the OS/2 source code; Bach https://abhyass.wordpress.com/wp-content/uploads/2016/09/the... and Goodheart & Cox are mostly pseudocode, with no kernel source code; the Devil Book is almost but not completely devoid of kernel source code; the Xinu book https://willendless.github.io/assets/os_arm_doc/Operating%20... is great (and clearly owes a lot to Sixth Edition Unix), but Xinu lacks, for example, users and subdirectories.\n\nMost of these, though not the Xinu book, cover operating systems that are much too big and complicated to explain fully in a single book, so they confine themselves to conceptual overviews.  In my view, this reinforces the syndrome Comer critiques in the pr"}, {"id": 50660117, "au": "ndiddy", "dom": 26, "sr": 2, "sc": 14.94, "ep": 14.94, "bs": 0.0, "d": 5, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 117, "qw": 0, "k": 10416, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": ["https://publications.gc.ca/collections/collection_2025/isde-ised/Co26-39-1981-eng.pdf"], "ig": 1.504, "fa": 3.3, "gp": 1.377, "bl": 0.0, "ds": 0.0, "txt": "You're right that pre-1983 Unix was significantly cheaper for universities than its alternatives, but from looking at the actual figures that doesn't seem to have resulted in significant adoption during the minicomputer era. In 1980, around 100,000 PDP-11s had been sold, but only 2,000 of them were running Unix (see https://publications.gc.ca/collections/collection_2025/isde-... pg 14).\n\nUnix's long-term success was because it was a portable, production-grade operating system that wasn't dependent on any one hardware manufacturer. Once microprocessors like the 68000 and 80286 came out, this meant that companies could make relatively inexpensive servers and workstations and port Unix rather than making a new operating system from scratch. The portability let Unix escape the minicomputer era while its competitors declined along with the hardware platforms that they targeted."}, {"id": 50655604, "au": "ferguess_k", "dom": 28, "sr": 3, "sc": 10.16, "ep": 10.16, "bs": 0.0, "d": 0, "age": 8.98, "grav": 74.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 24, "qw": 0, "k": 1083, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": ["https://download.oldlinux.org/ECLK-5.0-WithCover.pdf", "https://oldlinux.org/"], "ig": 0.88, "fa": 2.35, "gp": 0.959, "bl": 0.0, "ds": 0.0, "txt": "Recommending the same treatise on Linux 0.12 (The authors meticulously translated everything into English a few years ago):\n\nhttps://download.oldlinux.org/ECLK-5.0-WithCover.pdf\n\nThe whole website is dedicated to old Linux. (https://oldlinux.org/)"}, {"id": 50656367, "au": "FLeXMurphy", "dom": 47, "sr": 4, "sc": 10.03, "ep": 10.03, "bs": 0.0, "d": 1, "age": 7.75, "grav": 60.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 38, "qw": 0, "k": 140, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": ["https://lwn.net/Reviews/LinuxCoreKernel.php3"], "ig": 0.81, "fa": 2.63, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "There is this: https://lwn.net/Reviews/LinuxCoreKernel.php3. Though it is outdated.\n\nAnd then FreeBSD has a handful of these books. Some are printed others are PDF-only. For example \"Design and Implementation of the FreeBSD Operating System\". Which is a tad more up to date."}, {"id": 50657909, "au": "ferguess_k", "dom": 17, "sr": 5, "sc": 9.45, "ep": 9.6, "bs": 0.0, "d": 2, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 50, "qw": 0, "k": 1083, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": ["https://download.oldlinux.org/ECLK-5.0-WithCover.pdf"], "ig": 0.918, "fa": 2.35, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "I found this for Linux 0.12:\n\nhttps://download.oldlinux.org/ECLK-5.0-WithCover.pdf\n\nxv6 also has two books: one for the explanation and one for the full source code. I kinda prefer books with full list of source code over Lion's book or the Minix book.\n\nThe Linux one above is my fav. It contains both explanation and source code."}, {"id": 50654867, "au": "JdeBP", "dom": 3, "sr": 6, "sc": 7.97, "ep": 8.34, "bs": 0.0, "d": 0, "age": 10.32, "grav": 91.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 9233, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 1.188, "fa": 1.23, "gp": 1.408, "bl": 0.0, "ds": 0.0, "txt": "By the time I got hold of a copy when the book came out, the Deitel and Kogan book on OS/2 had been out for 2 years, as had the Goodheart+Cox Magic Garden book, the Leffler+McKusic+Karels+Quarterman book on 4.3BSD had been out for 7 years, the Bach book had been out for 10 years, and the Xinu books had been out for 12 years.\n\nThe Lions book wasn't really very useful by 1996.\n\nWhereas Vahalia's and Pate's books on Unix, which also came out in 1996 but covered things that had happened in the intervening decades, were a lot more useful."}, {"id": 50656072, "au": "tankenmate", "dom": 36, "sr": 7, "sc": 6.56, "ep": 7.41, "bs": 0.85, "d": 4, "age": 8.29, "grav": 66.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 6775, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 1.418, "fa": 0.95, "gp": 0.943, "bl": 0.32, "ds": 0.0, "txt": "Novell bought USL from AT&T in 1993, Novell sold USL (minus USG) to Santa Cruz Operation 1995, Santa Cruz Operation sold their server and profession services divisions to Caldera (After that SCO renamed themselves to Tarantella Inc), in 2002 Caldera changed its name to \"The SCO Group\". Darl McBride was appointed CEO after Caldera acquired the Unix assets from \"old SCO\". And of course McBride was the one who lead the SCO vs IBM lawsuit."}, {"id": 50653869, "au": "Taniwha", "dom": 61, "sr": 8, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 2, "age": 12.56, "grav": 124.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 55, "qw": 0, "k": 7647, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "knew_comic", "flbl": "Knew & Comic (Copy)", "urls": ["https://www.taniwha.com/~paul/not.html"], "ig": 1.126, "fa": 0.96, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "Not really, they just didn't have setjmp/longjmp yet, they used something else. The real thing you weren't meant to understand was why a routine that was never called returning a value and mostly didn't return a value had to return \"1\" at that particular point\n\nhttps://www.taniwha.com/~paul/not.html\n\n(I worked for another competitor, UniSoft, SCO ripped us off too, on the 286 port)"}, {"id": 50660231, "au": "dctoedt", "dom": 8, "sr": 9, "sc": 6.21, "ep": 6.21, "bs": 0.0, "d": 0, "age": 1.46, "grav": 9.3, "surf": 22.1, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 91, "qw": 0, "k": 14872, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": ["https://en.wikipedia.org/wiki/Nroff", "https://en.wikipedia.org/wiki/Scribe_(markup_language)", "https://en.wikipedia.org/wiki/Brian_Reid_(computer_scientist)"], "ig": 1.566, "fa": 0.62, "gp": 0.527, "bl": 0.0, "ds": 0.0, "txt": "Amusing in the preface about nroff, the early text-markup language that Lions used to produce his book: \"The co-operation of the “nroff” program must also be mentioned. Without it, these notes could never have been produced in this form. However it has yielded some of its more enigmatic secrets so reluctantly, that the author’s gratitude is indeed mixed. Certainly “nroff” itself must provide a fertile field for future practitioners of the program documenter’s art.\"\n\n(Emphasis added.)\n\nAnd so it was: IIRC, nroff was largely obviated by Brian Reid's SCRIBE, a forerunner of LaTeX.\n\nhttps://en.wikipedia.org/wiki/Nroff\n\nhttps://en.wikipedia.org/wiki/Scribe_(markup_language)\n\nhttps://en.wikipedia.org/wiki/Brian_Reid_(computer_scientist..."}, {"id": 50655178, "au": "analog31", "dom": 12, "sr": 10, "sc": 6.18, "ep": 6.18, "bs": 0.0, "d": 2, "age": 9.74, "grav": 84.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 32, "k": 21873, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 1.088, "fa": 1.1, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": ">>> The other big problem with these fake books at this point was that the music inside felt really out of date. The fake books hadn’t changed since the mid-40s, but jazz had.\n\nAmusingly, the \"contemporary\" tunes in the Real Book are now 50+ years old.\n\nI got a Real Book around 1982, and it was revelatory. Of course I was picking up tunes by ear before that, as a bassist, and I still do today. But the RB made some of the more \"weird\" tunes approachable, and allowed bands to form for gigs even if we didn't all know 4 hours of material."}, {"id": 50657455, "au": "CalChris", "dom": 1, "sr": 11, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 0, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 10050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 1.375, "fa": 0.28, "gp": 0.79, "bl": 0.0, "ds": 0.0, "txt": "Lions Commentary was used as evidence in the USL vs BSDI lawsuit to undermine USL’s claims of trade secret misappropriation and unrestricted publication without copyright notice.\n\nIt was my licensed original copy which I bought from Western (!) Electric. Technically, it was part of a Western Electric UNIX source license. I lent my copy to Sam Leffler for the lawsuit. It was entered as evidence and I got it back a couple of years later."}, {"id": 50657904, "au": "scarecrowbob", "dom": 13, "sr": 12, "sc": 4.95, "ep": 5.1, "bs": 0.0, "d": 3, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 3800, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 1.506, "fa": 0.34, "gp": 0.409, "bl": 0.0, "ds": 0.0, "txt": "I play a lot of low-rent jazz, and I like mostly early jazz, so a weird-to-me thing is that much of the real book is newer than the music that I generally enjoy playing with jazz bands.\n\nI of course play all kinds of stuff (pedal steel and bass in country bands, keys in rock bands), but the jazz I enjoy is mostly pre-1955ish.  I've gotten a lot more miliage out the the blue book and the django book, but the Bb real books made getting into clarinet performance much, much easier.  I'm almost done weaning myself off written music for the clarinet."}, {"id": 50655084, "au": "acomjean", "dom": 29, "sr": 13, "sc": 4.43, "ep": 4.43, "bs": 0.0, "d": 0, "age": 9.93, "grav": 86.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 8959, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 1.272, "fa": 0.0, "gp": 0.994, "bl": 0.0, "ds": 0.0, "txt": "I took the Linux Kernel Internals class at redhat as my company was switching from HPUX and Solaris.  HPUX had some great tools for semi real time and we needed OS info.  They gave us a tome that was really useful, but slowly went out of date….\n\nThankfully Linux has no such restrictions."}, {"id": 50655325, "au": "ndiddy", "dom": 24, "sr": 14, "sc": 3.82, "ep": 4.55, "bs": 0.0, "d": 3, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 10416, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 1.292, "fa": 0.34, "gp": 0.378, "bl": 0.0, "ds": 0.0, "txt": "Unix was commercialized in the sense that AT&T sold source code licenses to universities and companies through its existing IP licensing organization. These licenses were quite expensive (~$20,000). They just couldn't run a traditional software business where they would directly sell Unix to end users and provide support. Unix was never public-domain or freely redistributable."}, {"id": 50652476, "au": "tankenmate", "dom": 33, "sr": 15, "sc": 3.53, "ep": 3.68, "bs": 0.0, "d": 2, "age": 15.94, "grav": 180.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 6775, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 1.462, "fa": 0.0, "gp": 0.168, "bl": 0.0, "ds": 0.0, "txt": "I'm pretty sure that it was \"Santa Crus Operation\" (i.e. \"Good SCO\") that gave permission for the book to be published (Unix Support Group (USG) was sold to Novell and then to \"Good SCO\"). \"Bad SCO\" was \"SCO Group\" (Darl McBride, et al) which was ex Caldera.\n\nAnd I just looked up his name because I had forgotten it, Peter Salus (Unix historian) along with Dennis Ritchie and Berny Goodheart (author of \"The Magic Garden Explained\", SVR4 kernel primer) who pushed for \"Good SCO\" to publish the Commentary."}, {"id": 50652690, "au": "sirtaj", "dom": 35, "sr": 16, "sc": 3.25, "ep": 3.55, "bs": 0.0, "d": 3, "age": 15.45, "grav": 171.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 629, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 1.076, "fa": 0.34, "gp": 0.033, "bl": 0.0, "ds": 0.0, "txt": "I thought so too, but by 1996 Novell had already sold (some subset of, as we found out) Unix to \"Bad SCO\"... or what eventually became ex-Caldera Bad SCO.\n\nThat whole story is such a shame. I recall pining for Xenix as a young geek."}, {"id": 50658371, "au": "pessimizer", "dom": 51, "sr": 17, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 1, "age": 4.42, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 193, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knew_comic", "flbl": "Knew & Comic (Copy)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.001, "bl": 0.0, "ds": 0.0, "txt": "Yours is a bizarre sentiment. This is what we have come out of. It should cheer you up. This once holy grail is now a throwaway link at the bottom of a comic describing how it was once the holy grail.\n\nWhen I was a kid, I would spend years looking for particular books in order to own them, and have to use interlibrary loans that might take weeks just to read things. If anybody should be nostalgic, it's the people remembering when knowledge used to be difficult to find and exclusionary, and you were motivated to read things because you knew that no one else would have gone through to work to be able to read them. Back in the day, you had to find and borrow a copy of one of the ten copies in existence, then commission a scribe and buy the skin of a bunch of dead goats to have it copied. They would think we were horribly spoiled to have had photocopiers, mimeograph machines, and thin, white paper made from trees.\n\nNow everything is accessible to everyone anytime, anywhere, and the only people who don't read are the people who don't bother to read. It's a good time."}, {"id": 50653328, "au": "pjmlp", "dom": 15, "sr": 18, "sc": 2.91, "ep": 3.35, "bs": 0.0, "d": 0, "age": 13.97, "grav": 146.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 0.717, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Yes, many forget that books like the Lions' Commentary on Unix, or later Andrew Tanenbaum on Minix, are the reason UNIX alongside C, won over the big bucks alternatives universities had to pay for.\n\nHad UNIX been a commercial product from the start, history would have taken a quite different timeline for both of them."}, {"id": 50659679, "au": "kragen", "dom": 21, "sr": 19, "sc": 2.69, "ep": 3.8, "bs": 0.0, "d": 3, "age": 2.45, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 39394, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 1.615, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do you mean the Hurd?  Some people have been running Debian on the Hurd since 02011.\n\nClaude Opus 5.5 is capable of writing a bootable unikernel without much steering, but it doesn't seem to be capable of getting all the way from a single prompt to a full-fledged multiprocess operating system just yet.  I wouldn't be surprised if a swarm of Fable agents could do it, though, because I was able to elicit a bootable multiprocess ocap-based microkernel with memory protection, running the Ethernet driver, the TCP/IP stack, and an HTTP server in three separate processes, within a few days.  (The project is called KokalOS, and I haven't put a decent writeup online yet.)"}, {"id": 50657413, "au": "FLeXMurphy", "dom": 16, "sr": 20, "sc": 2.67, "ep": 3.11, "bs": 0.0, "d": 1, "age": 5.92, "grav": 41.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 140, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 0.835, "fa": 0.22, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I went through the MINIX book not too long ago. To me there is a notable difference in style and where the attention is given, mostly because Tanenbaum was the author of MINIX and the author of the book. The \"three main\" pillars or whatever he called them are covered carefully. UNIX commentary is a commentary on something someone else did; it's like an archeological dig of sorts. \"You are not expected to understand this\" is not part of a kernel developers repertoire.\n\nMy only gripe is we are unlikely to see a new MINIX book and I do not foresee something of the sort with xv6; the appetite isn't there likely in the age of AI, and anyone pursing it would be doing so a kind of \"work of art\", perhaps as a flex against AI, not sure."}, {"id": 50656835, "au": "Ericson2314", "dom": 41, "sr": 21, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 0, "age": 6.93, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 8271, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 0.631, "fa": 0.0, "gp": 0.8, "bl": 0.0, "ds": 0.0, "txt": "Ugh, have mixed feelings about this one, because Unix was far from the best design deserving to win."}, {"id": 50657283, "au": "emmelaich", "dom": 39, "sr": 22, "sc": 2.43, "ep": 2.43, "bs": 0.0, "d": 1, "age": 6.12, "grav": 43.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 8343, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knew_comic", "flbl": "Knew & Comic (Copy)", "urls": [], "ig": 0.622, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have my older brother's original copy; he did the Lions course at UNSW in 1978 or '79.\n\nI probably should wrap it in plastic to preserve it ..."}, {"id": 50656311, "au": "dboreham", "dom": 53, "sr": 23, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 0, "age": 7.83, "grav": 61.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 18260, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "knew_comic", "flbl": "Knew & Comic (Copy)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.094, "bl": 0.0, "ds": 0.0, "txt": "Lucky to have an original copy. Since nobody in my family understands it's significance, I've attached a postit \"Valuable, do not throw out\" for when the grim reaper arrives."}, {"id": 50660958, "au": "knorker", "dom": 52, "sr": 24, "sc": 2.18, "ep": 2.54, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 232, "qw": 21, "k": 4203, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "knew_comic", "flbl": "Knew & Comic (Copy)", "urls": [], "ig": 0.306, "fa": 0.64, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have no idea what you're talking about. I can't make sense of it at all.\n\nI'm talking about the degenerate basically patronizing style of turning a simple message into a messy cartoon, in what appears to be an attempt to dangle something shiny in order to keep the reader's attention to read it. And it does the opposite to me.\n\nIt's just a terrible way to try to convey a message. It's like when someone turns a series of steps into a serious of \"hey[…]\" statements. Like \"Let's go over to them and say hey, we want to have this jacket in a smaller size, and if they say hey, see we only have this, then we'll say hey, this other employee over there said hey, you do have other sizes\". It's illiterate. This \"hey\" first person way of trying to communicate also gets in the way.\n\n(if you haven't noticed hey-speak before, maybe you will now. Sorry about that)\n\nThis has absolutely nothing to do with access to information.\n\nIt's bad enough when only used lightly with some comic breaks, but this post just gives up on being written intelligently or coherently completely.\n\n> This once holy grail is now a throwaway link at the bottom of a comic describing how it was once the holy grail.\n\nIt's taking what could have been easy to find, and hiding it under a pile of garbage. I think we were better off having to ride for two days to beg the monks for access to the library. Then it was more accessi"}, {"id": 50655457, "au": "pjmlp", "dom": 25, "sr": 25, "sc": 2.12, "ep": 3.44, "bs": 0.0, "d": 4, "age": 9.23, "grav": 77.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 1.053, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "UNIX source tapes were available already for $200 for universities, which was kind of pennies when compared to anything coming from IBM, DEC, GE and co, and basically the cost to copy and send the tapes.\n\nThe price that you mention was only for commercial entities."}, {"id": 50660788, "au": "torginus", "dom": 48, "sr": 26, "sc": 2.0, "ep": 5.27, "bs": 3.05, "d": 0, "age": 0.41, "grav": 4.9, "surf": 37.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 355, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 1.757, "fa": 0.28, "gp": 0.234, "bl": 1.15, "ds": 0.0, "txt": "Why is Unix so great? I have worked with Linux for many-many years, and I feel like I understand most of the programming model of how to write applications as K&R intended, yet I am unimpressed.\n\nJust what is so good about Unix/Linux that has allowed people to be so incorrigibly smug bout themselves?\n\nMultiuser? The PC has deprecated the Terminal-Server model by the 90s.\n\nPiping together C programs? I think this model has kinda sorta failed as well. Most people would agree shells are better implemented as a fast scripting-language, rather than a chain of C programs passing text around.\n\nI was taught that the Unix philosophy is writing a shell script and gluing these small programs together, orchestrated via a shell script. But this model has failed to scale up in complexity, even inside the Unix world. There are no more web servers that handle requests like this. Instead of lex/bison grammars, GCC people have made their compiler into a monolith. The Linux kernel is a huge monolith.\n\nIt's the typical sanctimonious religious mentality - people preaching things they do not themselves follow, repeated at every level of the clergy\n\nUnix design lends itself to scheduling programs interacting via pipes/files written in a synchronous, blocking manner, but tying IO to threads has been accepted as a performance mistake for various reasons, and nowadays io_uring is what the cool kids use."}, {"id": 50658245, "au": "pessimizer", "dom": 20, "sr": 27, "sc": 1.99, "ep": 2.65, "bs": 0.0, "d": 2, "age": 4.65, "grav": 30.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 1.127, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If AI stops sucking, it could write the new MINIX book. Humans still have to understand how stuff works in order to steer stupid AIs. I'll believe we don't once somebody uses vibe-coding to finish and ship HERD."}, {"id": 50652117, "au": "sirtaj", "dom": 32, "sr": 28, "sc": 1.76, "ep": 2.42, "bs": 0.0, "d": 1, "age": 16.96, "grav": 199.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 629, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 1.032, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Interestingly, Plan 9 was already being distributed as books with source at the same time. So Thompson, Pike et al were already on board with this idea.\n\nHave to appreciate the little irony of SCO being the first to allow publishing of the book."}, {"id": 50653226, "au": "jibalt", "dom": 43, "sr": 29, "sc": 1.69, "ep": 2.79, "bs": 0.0, "d": 0, "age": 14.22, "grav": 150.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 0.476, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I got my hands on the Lions book at some point, but I worked for Interactive Systems Corporation, a UNIX development shop, and had already seen the code."}, {"id": 50656164, "au": "pjmlp", "dom": 4, "sr": 30, "sc": 1.56, "ep": 2.3, "bs": 0.0, "d": 1, "age": 8.1, "grav": 64.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 0.867, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "The usefulness of the book was helping to widespread UNIX on university campus during its early days, afterwards, just like the K&R C first edition, it became an historical artifact."}, {"id": 50653175, "au": "jibalt", "dom": 57, "sr": 31, "sc": 1.38, "ep": 2.62, "bs": 0.0, "d": 1, "age": 14.34, "grav": 152.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 303, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_operating", "flbl": "Code & Operating (System)", "urls": [], "ig": 1.117, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For good reason -- it was buggy! It used the wrong stack. They fixed it in V7.\n\nI was a UNIX kernel hacker working for Interactive Systems Corporation. I studied and hand simulated that code, understood it, and saw that it was buggy, but I don't remember whether that was before or after I saw the fix in the V7 kernel code."}, {"id": 50660847, "au": "solyin", "dom": 49, "sr": 32, "sc": 1.31, "ep": 1.9, "bs": 0.0, "d": 1, "age": 0.26, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 31, "k": 783, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 0.3, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Piping together C programs? I think this model has kinda sorta failed as well. Most people would agree shells are better implemented as a fast scripting-language, rather than a chain of C programs passing text around.\n\nI think you missed the point, which wasn't the C part, but the piping together part. it doesn't matter the language, the point is to be able to pipe programs at each other."}, {"id": 50656452, "au": "markus_zhang", "dom": 30, "sr": 33, "sc": 1.0, "ep": 1.8, "bs": 0.0, "d": 1, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 8558, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_class", "flbl": "Linux & Class (Programs)", "urls": [], "ig": 0.767, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I just checked and they don’t offer RHD236 anymore.\n\nWould you say that internal class had in-depth information, or was it more like a general Linux kernel overview class?"}, {"id": 50655732, "au": "kps", "dom": 40, "sr": 34, "sc": 0.92, "ep": 1.5, "bs": 0.0, "d": 1, "age": 8.78, "grav": 72.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 9329, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "sco_santa", "flbl": "Sco & Santa (Novell)", "urls": [], "ig": 0.639, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Me too. Two ‘volumes’, one for the source and one for the commentary, to have them open side by side.\n\n(I spent so much on the departmental copier as a bored intern.)"}, {"id": 50655978, "au": "mesrik", "dom": 60, "sr": 35, "sc": 0.9, "ep": 1.86, "bs": 0.0, "d": 4, "age": 8.44, "grav": 68.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 189, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, you are correct. It was Richie who wrote it. My bad. But Richie intention was same, viewing from Lions point it was perhaps same. He didn't expect his students to understand that part."}, {"id": 50653166, "au": "QuantumNomad_", "dom": 45, "sr": 36, "sc": 0.57, "ep": 1.45, "bs": 0.0, "d": 1, "age": 14.36, "grav": 153.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 25, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "minix_book", "flbl": "Minix & Book (Tanenbaum)", "urls": ["https://www.amazon.com/Lions-Commentary-Unix-John/dp/1573980137/"], "ig": 0.615, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They link to Amazon from the OP:\n\nLions' Commentary on Unix, https://www.amazon.com/Lions-Commentary-Unix-John/dp/1573980...\n\nOr did you mean a version of the book written for a later version of Unix?"}, {"id": 50659600, "au": "kragen", "dom": 7, "sr": 37, "sc": 0.35, "ep": 1.89, " /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
