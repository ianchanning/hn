y", "label": "General Commentary", "count": 17, "useful": 1, "useful_pct": 5.9, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 11}, {"category": "doi_peer_reviewed", "count": 1}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["dragon", "riders", "progress", "ride", "models", "longer", "goal", "discoveries", "important", "mind", "end", "far", "gone", "human", "results", "three", "done", "theoretical"], "largest_root": {"root_id": 50642355, "author": "jazzypants", "slots": 27, "start_dom": 1, "end_dom": 27, "share_pct": 16.4, "top_dom1_age": 6.2, "top_dom1_author": "jazzypants"}, "buried_cutoff": 50, "rescue_top_k": 33, "ablations": [], "tournament": [], "comments": [{"id": 50641861, "au": "bariumbitmap", "dom": 96, "sr": 1, "sc": 18.47, "ep": 18.47, "bs": 0.0, "d": 0, "age": 6.99, "grav": 52.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 280, "qw": 216, "k": 1155, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": ["https://retractionwatch.com/2026/10/08/openai-withdraws-preprints-722-manuscripts-unsolved-math-problems/", "https://en.wikipedia.org/wiki/Abc_conjecture", "https://www.nature.com/articles/d41586-020-00998-2"], "ig": 1.74, "fa": 4.0, "gp": 2.057, "bl": 0.0, "ds": 0.0, "txt": "One pattern I've noticed in discussion about the progress of AI models in mathematics and physics is a lack of agreement from experts. For example, from this article:\n\n> Concretely, the models are now able to carry out complex analytical calculations, work out lengthy proofs, turn well-posed problems into code, all with minimal input. They iterate, correct their errors, launch simulations to verify their conjectures, and summarize their work. On my own problems, I have already seen the impossible being done several times, starting with Fable 5 in May (I reported some on X and LinkedIn). Those who deny this progress have just not tried hard enough (with the latest models), or are blinded by their ego.\n\nFrom this I might infer a presumption of accuracy for the outputs of these models. On the other hand, Retraction Watch recently posted about OpenAI withdrawing three of its papers:\n\n> But on Oct. 7, OpenAI announced the withdrawal of three manuscripts because of a sign error. The error invalidated an argument in one manuscript and the construction used by two dependent papers, according to the announcement. Each of the withdrawn papers carry notices explaining “the gap,” and that OpenAI has “revised 14 other manuscripts with proof repairs, corrected statements, clearer hypotheses and dependencies, and one correction to an obsolete citation.”\n\n> That an error cascaded into three of"}, {"id": 50642866, "au": "olooney", "dom": 117, "sr": 2, "sc": 9.33, "ep": 9.33, "bs": 0.0, "d": 0, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 608, "qw": 7, "k": 2793, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.846, "fa": 0.76, "gp": 1.953, "bl": 0.0, "ds": 0.0, "txt": "> Physicists are likely only three months behind.\n\nThis is one I kind of hope is true, not because I want physicists to be unemployed or obsolete, but because there is a specific result that I would love to see in my lifetime, and which physicists have been working on for the past 50 years without much luck.\n\nIt's the unification of general relativity and the standard model. You see, there are only four known fundamental forces in the universe: gravity, electromagnetism, and the strong and weak nuclear forces. The standard model is a single equation that models three of these as fields over flat Minkowski space and represents mass via the Higgs field. It explains things that are very small or moving very fast, with only a handful of exceptions. Einstein's theory of general relativity models gravity in a completely different way, as the natural result of objects moving along geodesics through curved spacetime, where local curvature is proportional to mass. It explains things that are very big and very slow, and between the two they explain almost everything we've ever observed about the universe we live in.\n\nThese two theories share a lot of tantalizing similarities. Both are second-order partial differential equations with respect to time. Both have a kind of divergence theorem, both can be approximated by inverse square laws when conditions are mild, and so on. It's extremely "}, {"id": 50642339, "au": "probably_wrong", "dom": 70, "sr": 3, "sc": 9.02, "ep": 9.02, "bs": 0.0, "d": 0, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 99, "qw": 13, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": ["https://news.ycombinator.com/item?id=50604506"], "ig": 1.637, "fa": 1.04, "gp": 1.523, "bl": 0.0, "ds": 0.0, "txt": "This article was suggested a couple days ago in a comment [1] and I insist on my comment from back then, this time in short form:\n\n> No, even if it burns me, I still think we should steal the fire!\n\nWe wanted to steal the fire to improve life in our village - cooking food, lighting our houses at night, etc. If someone steals the fire and uses it to set all villages (and villagers) on fire, I don't think that's something to look forward to, much less celebrate.\n\nI also consider the author particularly misguided when arguing that \"nerds in Silicon Valley\" are the best ones to assess and balance the existential risks for humanity, but that's a different topic.\n\n[1] https://news.ycombinator.com/item?id=50604506"}, {"id": 50642324, "au": "ldite", "dom": 52, "sr": 4, "sc": 8.7, "ep": 8.7, "bs": 0.0, "d": 1, "age": 6.29, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 8, "qw": 0, "k": 664, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://gwern.net/doc/fiction/science-fiction/2000-chiang.pdf"], "ig": 0.271, "fa": 2.35, "gp": 0.945, "bl": 0.0, "ds": 0.0, "txt": "Ted Chiang has a prescient short story on that; https://gwern.net/doc/fiction/science-fiction/2000-chiang.pd..."}, {"id": 50643130, "au": "doginasuit", "dom": 28, "sr": 5, "sc": 8.4, "ep": 8.4, "bs": 0.0, "d": 0, "age": 4.94, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 19, "k": 1217, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.569, "fa": 0.92, "gp": 1.441, "bl": 0.0, "ds": 0.0, "txt": "> I think we deserve all the bad things that will happen to us if we react like such sore losers.\n\nLikewise, we deserve all the bad things that will happen if we assume were going to lose in the first quarter.\n\nIs it not even that the other team is outplaying us, yet. The author acknowledges that AI lacks critical faculties for intellectual work. They are just getting better at a rate we didn't expect, and so it seems plausible those faculties will come in turn.\n\nBut they go further, that AI will inevitably advance to a point where human involvement in research will lose all practical value. I'm not sure where this is coming from, certainly not the available evidence. It is a fallacy that the trends we see now must continue in perpetuity.\n\nWe shouldn't be so ready to throw in the towel and declare human intelligence obsolete. Even if some people accept this, others will not. The human brain is an adaptation machine, its most valuable output a response to a challenge, adapt or perish. As AI unlocks new potential, so must human intelligence. And I would not start betting against it now."}, {"id": 50646733, "au": "zackmorris", "dom": 133, "sr": 6, "sc": 8.33, "ep": 8.33, "bs": 0.0, "d": 1, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 406, "qw": 0, "k": 6221, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.869, "fa": 0.95, "gp": 0.849, "bl": 0.0, "ds": 0.0, "txt": "1000% and I'm pushing 50.\n\nMy first experience with tech was watching a family friend play Adventure on an Atari 2600 when I was maybe 5. Later I got to see one of the first Macintosh computers at a computer shop and the patterns looked like colors because a black and white screen at close to print quality was so revolutionary that synesthesia took the wheel. I got to watch the home computing revolution from Nintendo through when the iPhone came out in 2007, which is when I feel that computer science began its long slow decline after the tech bros took over.\n\nIn the meantime, I got my electrical and computer engineering (ECE) degree in the late 1990s and fell into the web development catchall after hardware engineering got outsourced in the 2000s. So I know computers from the atomic level to the highest abstractions in functional programming, not that it ever did me much good in a winner-take-all workaday world where the idea people are broke and the wealth hoarders only hoard more wealth.\n\nNone of that matters now. Nobody cares.\n\nSo to me, the central crisis of my life (separation from agency) is now shared by the world and future generations. We all must choose between creating a brighter future that works for everyone, or taking to the yolk under subjugation and wealth inequality.\n\nI would propose that now that we know that this timeline is ending in the very near future, it"}, {"id": 50641593, "au": "keybored", "dom": 165, "sr": 7, "sc": 7.85, "ep": 7.85, "bs": 0.0, "d": 0, "age": 7.54, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 584, "qw": 274, "k": 2352, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": ["https://news.ycombinator.com/item?id=50489633", "https://news.ycombinator.com/item?id=50588464", "https://news.ycombinator.com/item?id=50639952"], "ig": 1.76, "fa": 1.04, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "I’m not into physics. But it’s curious how we are getting these identity crises out of theoretical academia. First it was mathematics.[1] Now it’s physics.\n\nThe play-by-play is predictable.\n\n> Like most scientists, I am conflicted.\n\nIt’s always about feelings.[2]\n\n> I have always been a techno-optimist absolutist. It would be a betrayal to flip now that the wave of progress touches my craft. No, even if it burns me, I still think we should steal the fire!\n\nLike with the math case,[1] academic theorycrafting sure is a convenient platform to erect this stance:\n\n> > Ivory tower image. Not obviously directly applicable to the real world. Theoriticians solving theoretical problems because the problems are there and tenure. That’s the perception, anyway; highly-educated whiteboard writers, not salt of the earth workers. Then you frame that crowd as jealously guarding their theorycrafting fiefdom. But it’s no match for the great AI.\n\nBecause what are you guarding anyway? Just your job. Why are you betraying Science?\n\nThis stance is easier to pull off for professor-coded endeavors compared to the “we will AI your jobs” narrative of ten years ago with truck drivers; knowledge workers have the self-serving intuition that “trades” are automatable while their PC-bound jobs are not because creativity-something.[3] That’s the Paradox you’ve heard about. So automating physics and maths doesn’"}, {"id": 50642044, "au": "mjdv", "dom": 97, "sr": 8, "sc": 7.18, "ep": 7.33, "bs": 0.0, "d": 1, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 213, "qw": 32, "k": 76, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.734, "fa": 0.76, "gp": 0.749, "bl": 0.0, "ds": 0.0, "txt": "For mathematical results in particular, the fact that frontier models seem to be excellent at outputting formal (i.e., Lean) proofs means that we only have to vet a very small part of the proof to be convinced of its correctness. The enormous proof of RH was thoroughly independently verified within 48 hours, which is extremely fast compared to ordinary peer review for even a short result. The retracted OpenAI proofs did not have Lean certificates.\n\n> But why are we talking about \"camps\" in mathematical proofs? It's been over 14 years, why is there still such profound disagreement between multiple experts about whether the proof is correct or not?\n\nI am not an expert in the mathematics, take what I am saying with a grain of salt. My understanding is as follows: there is very widespread consensus that the abc conjecture has not been proved. The only people (with perhaps a small handful of exceptions) still standing behind Mochizuki's work are ones who have \"ulterior motives\": they would lose social standing by disbelieving it. Mochizuki is chief editor of the journal that published the work. His work is complex and highly technical, but two of the people in the world most qualified to interpret it have done so and found it wanting. They have tried extensively to have a dialogue with Mochizuki about the issues, but did not get anywhere, and have given up on this endeavor. As a lay"}, {"id": 50641645, "au": "za_creature", "dom": 122, "sr": 9, "sc": 7.0, "ep": 7.0, "bs": 0.0, "d": 0, "age": 7.42, "grav": 56.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 233, "qw": 10, "k": 168, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.731, "fa": 0.42, "gp": 1.199, "bl": 0.0, "ds": 0.0, "txt": "> The goal was the friends we made along the way\n\nLet me give you a different analogy. For drug users, everything is great at first since your healthy body can safely metabolize the substances and you're left with just the good parts.\n\nAt some point this stops but you're justifying yourself by claiming that you're better off overall: it keeps you focused, it clears your mind, discomfort is a small price to pay for the extra productivity.\n\nThen the side effects become strong enough that the cognitive dissonance starts getting noticeable, so you avoid it completely by doubling down and start evangelizing. Surely other substance abusers can't all be wrong, it is the prudes that have closed their minds to the benefits and you owe it to them to show them the error of their ways.\n\nFinally, the side effects reach a point where you are no longer capable of functioning in the absence of the substance.  It has in effect become a part of you both physically and a core part of your value system. You are unable to maintain relationships outside your circle. You justify this too by claiming the others are too far gone to change.\n\nBack on topic, the historical goal of science has been to advance human understanding. Many of those that achieved that goal had in fact been substance abusers but none of them demanded the use of the substance to understand the advancement.\n\nDo not chase the dragon"}, {"id": 50642355, "au": "jazzypants", "dom": 1, "sr": 10, "sc": 6.97, "ep": 6.97, "bs": 0.0, "d": 0, "age": 6.24, "grav": 44.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 222, "qw": 79, "k": 1024, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.606, "fa": 0.42, "gp": 1.381, "bl": 0.0, "ds": 0.0, "txt": "It's a well written article, but I disagree with it completely. It doesn't seem entirely internally cohesive. First, he says this:\n\n> As of November 2026, the best public models still lack research taste. They execute beautifully when given a clear goal but are worse than the best researchers at coming up with good questions, or at having the sparks of creativity needed to get out of a dead end. They do not have as much vision as the best humans.\n\nI agree! But then, apparently through the magic of RLVR, he somehow thinks that models will someday suddenly accrue this taste.\n\nWhy hasn't that happened yet? I get just as frustrated when I let Fable 5.2 make product decisions as I did with ChatGPT4. They solve the problems I give them much better, but when I try to let them lead to the next milestone, they consistently choose the worst, most conservative option.\n\n> To do great things, we need to forgo some understanding of what is going on at lower levels, to focus on higher ones\n\nIf we don't understand the lower levels, how will we ensure that the \"research taste\" is good? How will we have any idea whether we are pushing towards the right kind of discoveries? It doesn't make any sense!\n\nYou can pretend that this is the same as something like my day job as a web developer. I don't fully understand how the hardware works at an atomic level. However, I have found that every time I lea"}, {"id": 50643163, "au": "simonklitj", "dom": 55, "sr": 11, "sc": 6.84, "ep": 6.99, "bs": 0.0, "d": 1, "age": 4.9, "grav": 32.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 69, "qw": 0, "k": 476, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": ["https://philpapers.org/rec/EMENBT"], "ig": 1.529, "fa": 0.9, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "In many ways, such an undertaking is already far underway in the philosophy of science/meta-science.\n\nI enjoyed (although disagreed with some of her conclusions) Nina Emery’s “Naturalism Beyond the Limits of Science,” in which she tries to identify some of the extra-empirical principles guiding science. Mapping science thus seems more important than ever [1].\n\nI agree with you that this field will greatly expand, and be challenged in the coming years.\n\n[1]: https://philpapers.org/rec/EMENBT"}, {"id": 50643200, "au": "hax0ron3", "dom": 84, "sr": 12, "sc": 6.68, "ep": 6.68, "bs": 0.0, "d": 3, "age": 4.85, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 7, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.531, "fa": 0.7, "gp": 0.753, "bl": 0.0, "ds": 0.0, "txt": ">What would be the software development equivalent?\n\nMost software is written in order to make money so I think realistically, in most cases the software development equivalent is simply the amount of money that the person or company running the software makes. There is the problem of \"the market can stay irrational longer than one can stay solvent\", but entirely human companies are already inhuman entities that attempt to optimize profit (just ones that happen to be made of people) and that doesn't stop them from in many cases successfully increasing profits.\n\nIn some specific areas of software development there are also other verifiable goals that can be used: for example, uptime."}, {"id": 50641902, "au": "pama", "dom": 110, "sr": 13, "sc": 6.58, "ep": 6.58, "bs": 0.0, "d": 1, "age": 6.93, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 188, "qw": 36, "k": 3809, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.844, "fa": 0.42, "gp": 0.722, "bl": 0.0, "ds": 0.0, "txt": "> > To do great things, we need to forgo some understanding of what is going on at lower levels, to focus on higher ones.\n\n> People say this a lot, but it really makes no sense in this context.\n\nOversimplified, hypothetical example, in case it helps:\n\nThe generalized Riemann hypothesis is proven true. Hundreds of people had already built theories conditional on it. Their work is now also true; they might not need to understand the proof of the GRH, but they understand their own work. In the future someone can built on top of their work, without understanding the details of their proof or the details of the GRH proof.\n\nI have always liked math and science for their methods, but the level of abstraction has been changing as society evolved. Physics can still technically connect all the way to Hamiltonians that describe everything, but are solvable only for extremely simple examples we fully understand, like single atoms, or harmonic oscillators, or idealized periodic lattices. But the major productive works of humanity happen at a level of abstraction where someone uses a packaged tool, building on the shoulders of others, without having to go back and understand implementation details. Formal verification has extended the level of trust without understanding to a degree far beyond what society was previously already accepting, and without loopholes/gaps that occasionally surface"}, {"id": 50643532, "au": "dantillberg", "dom": 118, "sr": 14, "sc": 6.38, "ep": 6.53, "bs": 0.0, "d": 1, "age": 4.42, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 2319, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.818, "fa": 0.28, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "While it's possible that there exists some \"clearly simple\" unified theory similar to previous theoretical physics discoveries that were subsequently verified experimentally, there exist an infinite number of possible unified theories matching the corpus of experimental evidence available. The correct one(s) can't be deduced on logic alone, and the actual universe in which we reside may not follow the most logical or simple rules. Ground truth in mathematics can be deduced logically, while in physics the ground truth must come from physical experiments.\n\nThat said, I also imagine that LLMs can help piece together the existing evidence in novel ways, speedrunning theoretical physics to inform better selection of experiments to fill in the gaps."}, {"id": 50643809, "au": "remywang", "dom": 59, "sr": 15, "sc": 6.35, "ep": 6.35, "bs": 0.0, "d": 0, "age": 4.09, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 942, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": ["https://nick-black.com/dankwiki/index.php/Book_list_for_streetfighting_computer_scientists", "https://en.wikipedia.org/wiki/Ceratioidei\u0023Reproduction"], "ig": 1.291, "fa": 0.62, "gp": 1.072, "bl": 0.0, "ds": 0.0, "txt": "I badly needed to read this and so does anyone reluctant to ride the dragon, but I think there is a majority of researchers who are rather eager to give up all their street fighting [1] skills to ride dragons. They remind me of how a male anglerfish gets absorbed into its mate and turns into a lump for the rest of its life [2].\n\n[1]: https://nick-black.com/dankwiki/index.php/Book_list_for_stre...\n\n[2]: https://en.wikipedia.org/wiki/Ceratioidei\u0023Reproduction"}, {"id": 50644786, "au": "norir", "dom": 67, "sr": 16, "sc": 6.29, "ep": 6.29, "bs": 0.0, "d": 0, "age": 2.92, "grav": 17.6, "surf": 3.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 363, "qw": 0, "k": 1118, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.942, "fa": 0.22, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "I struggle to relate at all to the mindset of the author. It is worth ruminating on reaching the end of science, and indeed knowledge itself, which seems to be the state the author is excited for. This to me seems indistinguishable from the end of life itself. At this point, we would have reduced everything to a purely mechanistic enactment of physical laws. As an entity in this space, we would have no autonomy and thus would be functionally dead.\n\nThere is also a distinction between physical and social laws though they are intertwined with one another. Certain molecules physically burn at a given time purely due to economic laws, rather than some purely mechanistic model of the universe. AI undoubtably creates a new set of economic laws that will change our underlying material reality. Whether this is good or bad depends on values, which unfortunately are a messy topic that cannot easily be reduced to mathematical formulae.\n\nMoreover, while the author bemoans process as an end, ends as an end is a vacuous tautological value statement that assumes scientific knowledge, whatever that means, as the highest value. It's a lot easier to casually dismiss others, as the author does repeatedly, that seriously engage with their position and more honestly interrogate their own belief systems and refrain from assuming one's own superiority. The author mocks those who value the process, bu"}, {"id": 50642458, "au": "Nevermark", "dom": 99, "sr": 17, "sc": 6.18, "ep": 6.48, "bs": 0.0, "d": 1, "age": 6.06, "grav": 42.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 13, "k": 6584, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.82, "fa": 0.42, "gp": 0.691, "bl": 0.0, "ds": 0.0, "txt": "> From this I might infer a presumption of accuracy for the outputs of these models.\n\nThere is no need for a \"presumption of accuracy\".\n\nThere is no presumption of accuracy for humans.\n\nScience as a process, mathematical proof, etc. are designed around the presumption of human inaccuracy.\n\nIteratively coming up with potential solutions, testing them, learning from the result, repeat, turned bogglingly inaccurate humans into a technological species.\n\nModels can do this iteration faster, in many cases, orders of magnitude faster.\n\n• In the small, they can iterate on particular solutions, or elements of solutions, faster.\n\n• In the large, even with separate training and inference, their model training/update rounds are profoundly faster at improving accuracy.\n\nLook at search trees. They are extremely unreliable in any given step, super reliable at exhaustion. The first does not preclude the latter. On the contrary, being \"wrong\" at high speed is what makes them so reliably \"right\" in the end."}, {"id": 50641815, "au": "api", "dom": 159, "sr": 18, "sc": 6.13, "ep": 6.35, "bs": 0.0, "d": 0, "age": 7.08, "grav": 53.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 329, "qw": 0, "k": 35837, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.93, "fa": 0.34, "gp": 0.585, "bl": 0.0, "ds": 0.0, "txt": "Humans are dragon riders. It's a key part of how our species works. First with animals (dogs, cats, horses, cattle, etc.) then machines.\n\nWe long, long ago went through these stages of grief for manual labor and for what was once a source of pride for many: warfare. When first guns and then machine guns and tanks and then nukes and drones dropped, the true warrior became more and more obsolete.\n\nWhich leads to a weird politics tangent but I think it relates.\n\nThe cultural cult of the warrior might be a good study here. It still has flashes of nostalgia and revivalism. Look at today’s masculinist LARPers, with a key one being US defense… no WAR… secretary Pete Hegseth.\n\nI just realized that whole thing is hitting right as it becomes obvious that robots will replace ground soldiers.\n\nNow we are at the start of this process for white collar and intellectual fields. Machines will do it all better. They will solve problems, make decisions, possibly run companies or do a large share of that, solve math problems, write code, theorize.\n\nWhat’s left?\n\nVolition, maybe. That might be more a function of life than intelligence.\n\nAnd ironically the very first field to freak out about AI and the one that took it the hardest: art. Artists going through their grief might be premature. They might be the only ones left standing.\n\nBecause the whole point of art is that a human made it.\n\nNow I’m su"}, {"id": 50642754, "au": "m0llusk", "dom": 164, "sr": 19, "sc": 5.94, "ep": 6.16, "bs": 0.0, "d": 0, "age": 5.59, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 175, "qw": 21, "k": 3502, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.586, "fa": 0.64, "gp": 0.417, "bl": 0.0, "ds": 0.0, "txt": "> ... I have already seen the impossible being done several times ...\n\nInteresting data, but you might want to skip trying to impress people with your AI psychosis.  You have not seen the impossible being done.\n\n> ...  internal models at OpenAI and Anthropic have now solved countless open problems ...\n\n\"Countless\"?  Really?  Maybe you could get a \"properly\" harnessed AI to give you an estimate?  On the one hand super powers, on the other hand not knowable or measurable.  And exactly what human progress has resulted from these \"solved open problems\"?\n\nThe fact is that these are powerful tools.  The same ideas that apply to other powerful tools apply here.  Which ones should be used for which problems and how?  What models, what harness, what training.  Dropping the word \"proper\" on harnesses is interesting.  Do you have any substantial work relating to what exactly that might mean?\n\nRiding the dragon does indeed sound like a great idea, but right now we seem to be in the mode of blind philosophers trying to make sense of an elephant.  Perhaps now would be a good time to start taking things seriously and applying the wisdom gained from centuries of science since the start of the enlightenment."}, {"id": 50645488, "au": "munificent", "dom": 33, "sr": 20, "sc": 5.84, "ep": 5.98, "bs": 0.0, "d": 2, "age": 1.91, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 156, "qw": 15, "k": 48847, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.561, "fa": 0.42, "gp": 0.771, "bl": 0.0, "ds": 0.0, "txt": "> we will reach new heights with them even if they are in the driver seats.\n\nThis may be true in some aspects. If a new cancer cure appears, I will happily take it regardless of whether an AI came up with it, and not having cancer will certainly increase the height of my existence.\n\nBut in everything I have learned about human psychology and from simply being a person for nearly half a century, one of the deepest lessons I have learned is that humans are not happy when passive. We seem to be hard-wired to crave a certain amount of agency, autonomy, and sense of mastery.\n\nA world with super-intelligent AI—even a utopian world where the fruits of that super-intelligence are distributed fairly among all people and not consolidated in the hands of the greedy—is still more or less a human zoo. It's a world where all decisions of consequence are made by beings smarter and more capable than us, and thus where nothing we do really matters.\n\nIt's hard to imagine people flourishing in an environment like that."}, {"id": 50642974, "au": "notpachet", "dom": 115, "sr": 21, "sc": 5.79, "ep": 5.79, "bs": 0.0, "d": 0, "age": 5.19, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 72, "qw": 0, "k": 2091, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": ["https://robinsonjeffersassociation.org/his-writing/poetry/rearmament/"], "ig": 1.071, "fa": 0.62, "gp": 1.034, "bl": 0.0, "ds": 0.0, "txt": "This line from the post...\n\n\"No, even if it burns me, I still think we should steal the fire!\"\n\n...reminded me of the poem \"Rearmament\" by Robinson Jeffers[0]:\n\nI would burn my right hand in a slow fire\n\nTo change the future... I should do foolishly. The beauty of modern\n\nMan is not in the persons but in the\n\nDisastrous rhythm, the heavy and mobile masses, the dance of the\n\nDream-led masses down the dark mountain.\n\n[0] https://robinsonjeffersassociation.org/his-writing/poetry/re..."}, {"id": 50643215, "au": "ilaksh", "dom": 128, "sr": 22, "sc": 5.57, "ep": 6.16, "bs": 0.0, "d": 1, "age": 4.83, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 10904, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.606, "fa": 0.28, "gp": 1.095, "bl": 0.0, "ds": 0.0, "txt": "Reasonable point. But humans still do a lot of things that machines have surpassed us on. For example, competitive games like chess, board games, e-sports. Car racing.\n\nIt's sad in a way, but at least for the moment we have a few advantages left and can \"ride the dragons\" which calls for at least a momentary exhaltation. But after that maybe we will be able to merge somewhat with BCIs.\n\nAnd after that we can still have meaningful lives within our own human communities and deliberately human pursuits.\n\nPhilosophically it may be sad to lose relevance over all to the machines, but humans will construct elaborate social structures where accomplishments have meaning. So there isn't a reason that they will need to actually be personally depressed or feel they don't have meaning.\n\nThe access to and ability to harness the \"magic\" of advanced AI-invented technology may factor a lot into the lives of the next generation also."}, {"id": 50642893, "au": "lubujackson", "dom": 42, "sr": 23, "sc": 5.35, "ep": 6.01, "bs": 0.0, "d": 0, "age": 5.34, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 272, "qw": 0, "k": 5387, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.88, "fa": 0.0, "gp": 1.097, "bl": 0.0, "ds": 0.0, "txt": "I think it will become clear at some point that AI can continue to improve but its usefulness to humans will remain heavily bound by our human understanding of its output.\n\nConsider chess engines, a precursor to AI absorbing human knowledge work. Chess engines may be unbeatable by humans, but humans continue to play chess (in fact, more than ever). Humans study games from engines, taking what is understandable and discarding what is not. We use engines to analyze our own positions and to train. We have reached something of an equilibrium with chess engines, using them to accelerate human understanding as the primary goal.\n\nAI is already far more capable than we can comprehend. Consider projects where people take game binaries from PS3 games and rebuild them as efficient web apps. This is only possible because AI has perfect knowledge and a clearly defined goal. AI's limitation is now only, and will remain, our ability to define the question and validate the answer.\n\nUnlike a fixed chessboard, some fields are wide open but verifiable (like math) where results can compound without full human understanding. The problem will soon become: what answers even matter? \"Discoveries\" are a human construct and we will always need to know at least what questions we want answered, even if LLMs can capably proceed down any path.\n\nI suspect human intuition about which questions will lead to ne"}, {"id": 50641661, "au": "tempfile", "dom": 109, "sr": 24, "sc": 5.34, "ep": 5.7, "bs": 0.0, "d": 0, "age": 7.39, "grav": 56.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 41, "k": 603, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.236, "fa": 0.42, "gp": 1.104, "bl": 0.0, "ds": 0.0, "txt": "> To do great things, we need to forgo some understanding of what is going on at lower levels, to focus on higher ones.\n\nPeople say this a lot, but it really makes no sense in this context.\n\n> we no longer code in assembly, compute integrals manually with quadratures, or extract square roots with Newton’s method\n\nNone of these things has anything to do with understanding. Computing an integral by an algebraic method or by applying some powerful trick does not reduce your understanding by even the tiniest amount. Likewise, using abstract \"mathematical machinery\" to easily answer many problems in a very concise way does not reduce your understanding. Not \"doesn't reduce it by much\". Doesn't reduce it at all.\n\nSaying \"I don't get it but the bot says it's right\" or \"the bot did it but I don't know how\" is completely different. In this case you understand almost nothing. Which is maybe fine for things that don't matter, but if you ever need to apply that knowledge to the real world, good luck!"}, {"id": 50641903, "au": "stymaar", "dom": 134, "sr": 25, "sc": 4.88, "ep": 5.32, "bs": 0.0, "d": 0, "age": 6.93, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 141, "k": 3464, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.225, "fa": 0.42, "gp": 0.862, "bl": 0.0, "ds": 0.0, "txt": "> However, the most visible public reaction, initiated by 25 Fields medalists, is terrible in a way that can only be explained by shock. The best problem solvers alive are now claiming that results, proofs, technical breakthroughs, which in many cases gave them their status and fame, were not really the goal. The goal was the friends we made along the way: the serendipitous discoveries, the mathematical community that got built, the long hours spent pondering in front of a blackboard. This enjoyment, this human understanding, for the community and by the community, is what had value all along.\n\n> I disagree. I think we deserve all the bad things that will happen to us if we react like such sore losers. Serendipitous discoveries are important, but first, it is unclear that AIs will necessarily lead to fewer, and second, the end results clearly mattered and still matter.\n\nCalling mathematicians sore losers for reminding everyone what the core of their profession is, is quite something.\n\n(Because of course the field medalists are right here, most of the time the “result” doesn't matter at all, GRH being true or false doesn't, in itself, have any interest whatsoever, the problem was only interesting because it was hard and as such forced mathematicians to develop new tools to try and address it)."}, {"id": 50644511, "au": "scythe", "dom": 9, "sr": 26, "sc": 4.85, "ep": 5.88, "bs": 0.0, "d": 2, "age": 3.28, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 9077, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.178, "fa": 0.95, "gp": 0.278, "bl": 0.0, "ds": 0.0, "txt": "I don't think it's this. It's that ultimately, research taste is human preference. Models can learn to do various things with 99%, 99.9%, 99.9999%, etc, fidelity. In many (apparently most) cases this is better than human fidelity. But there are a few things where humans have 100% fidelity, which is only possible because those things are intrinsically human, for the same reason that breaking a rock has 100% fidelity for the mechanics of breaking a rock. Humans may not always do all the work in those areas because 100% fidelity doesn't always matter, but when it does matter, experiment is king."}, {"id": 50645225, "au": "aliasxneo", "dom": 60, "sr": 27, "sc": 4.84, "ep": 4.84, "bs": 0.0, "d": 0, "age": 2.25, "grav": 13.5, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 2451, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.652, "fa": 0.0, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "I actually read through most of the comments here. The biggest gap I see is people seem to skip over how fragile the ecosystem that powers AI is. I think of the recent exchange between Iran and the UAE where a few drones were able to take out what are supposed to be high uptime AWS datacenters for quite awhile. How unrealistic is it that a theoretical WW3 could significantly set back development? Looking at the current drone warfare between Russia and Ukraine, it seems that nothing is able to be protected anymore, no matter how far inland it is (i.e. the time where Ukraine snuck in a semi truck of drones and blew up planes far into mainland Russia). And this doesn't even account for guerilla factions that may arise with specific anti-AI sentiments."}, {"id": 50643723, "au": "jsnell", "dom": 12, "sr": 28, "sc": 4.5, "ep": 5.46, "bs": 0.0, "d": 1, "age": 4.2, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 19, "k": 34306, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.445, "fa": 0.42, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "> Why hasn't that happened yet?\n\nIt has. But there's a lot of space to fill between complete ineptitude and \"better than the best researchers in all domains\".\n\n> I get just as frustrated when I let Fable 5.2 make product decisions as I did with ChatGPT4.\n\nThat's just the hedonic treadmill. Humans adjust their expectations for what's normal very quickly, and it's hard to remember just how useless those old models were. Try breaking out a three year old model and let it run the project and delegate execution to a frontier model."}, {"id": 50642332, "au": "Bouncingsoul1", "dom": 125, "sr": 29, "sc": 4.5, "ep": 5.09, "bs": 0.0, "d": 3, "age": 6.27, "grav": 44.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 526, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.377, "fa": 0.28, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "\"Agriculture has made us less skilled hunters not because farmers were fundamentalist vegans but because suddenly you weren't as incentivized to grab a bunch of your buddies\" Wrong! Agriculture allowed us to form bigger communities, therefore organize better and suddenly we hunt so \"good\" to bring some species to extinction.\n\"Similarly, mechanization has made us less skilled artisans and the rest of industrialization has made us less physically fit overall\" Wrong! industrialization has brought abundance, which also meant more calories. Overall people post industrialization are bigger and stronger. In particular industrialization also brought more calories to spend for eg. sport in general in professional sport in particular."}, {"id": 50642727, "au": "tempfile", "dom": 111, "sr": 30, "sc": 4.45, "ep": 4.97, "bs": 0.0, "d": 2, "age": 5.62, "grav": 38.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 23, "k": 603, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.299, "fa": 0.42, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "> Their work is now also true; they might not need to understand the proof of the GRH, but they understand their own work.\n\nThis was true before LLMs and I don't think it's qualitatively different using LLMs. It's a good example of a real abstraction, which hides detail without reducing understanding.\n\nI am arguing this is very different from \"letting the dragon deal with what it does\". If you do this, the best you can hope for is a bunch of yes/no answers to questions you are progressively less and less well-positioned to ask. It's like building up tech debt."}, {"id": 50645168, "au": "LouisSayers", "dom": 39, "sr": 31, "sc": 4.41, "ep": 4.71, "bs": 0.0, "d": 2, "age": 2.32, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 6, "k": 1393, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.288, "fa": 0.42, "gp": 0.333, "bl": 0.0, "ds": 0.0, "txt": "> Survivors are POSSIBLE, but not probable.\n\nWe need our own products. If you're a dev now's the time to lean into AI for your own benefit. Bring to life those ideas you've had in the past but never had the time for. Build your own moat.\n\nI think in terms of \"stupidity\", people want control in their lives so rationalise in order to maintain the status quo (\"fire? what fire? I'm safe, there's no fire ...\"). This is also how smart people cling to things like religion, because of the inability to regulate their own emotions around mortality, or to feel like they have some control for things which cannot be controlled.\n\nIt's tough to look at reality and to see yourself standing in it."}, {"id": 50642351, "au": "jshaqaw", "dom": 126, "sr": 32, "sc": 4.32, "ep": 5.71, "bs": 0.0, "d": 0, "age": 6.25, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 235, "qw": 0, "k": 1495, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.627, "fa": 0.0, "gp": 1.304, "bl": 0.0, "ds": 0.0, "txt": "The timeline seems about right and it’s tragic. Old farts like me and the author can say we had our day and go out in a final blaze of glory. I have two teenage daughters. Both are math/science oriented with more raw brains and work ethic than I ever had. I can’t look them in the eye and tell them there will be much math or science left by the time they reach adulthood. I sometimes want to tell them to stop working so hard in high school because they are working towards something that no longer exists.\n\nMachines will spit out math proofs and quantum theories for a while because legacy social structures like university departments take time to unwind. But soon enough there won’t be any pure math or non-applied physics because nobody will remain who understands or cares about the output. It seems like a sadly diminished world to me without these endeavors but I suppose there are lots of things people used to care about which no longer exist.\n\nAll of this will come for the rest of the world too.  I’m glad I’m in my 50s and got to experience most of my productive life in a golden age when human intellectual endeavors mattered. Like most golden ages, one doesn’t realize it’s a golden age until it’s over. My kids will grow up into a world where there is no reason to do anything. It’s one of the saddest things I can imagine."}, {"id": 50642314, "au": "mccoyb", "dom": 157, "sr": 33, "sc": 4.15, "ep": 4.81, "bs": 0.0, "d": 0, "age": 6.31, "grav": 45.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 1567, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.616, "fa": 0.0, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "I’m mostly in strong agreement with the author of this post.\n\nHowever, I take great offense to the idea that science be kept in the stables of the largest dragon breeders, and we (the peasantry) may only be allowed to watch the gentle beasts from afar.\n\nMoreover, two kinds of dragons have been bred: first, human intelligence and now a kind based on principles which are far different.\n\nIs it foolish to think that where lightning strikes twice, it may strike many times? And, in fact, in different forms?\n\nWe now know that there are at least two ways of conjuring intelligent behavior … it seems foolish to bet that there are only two ways, especially since the two ways come with extremely different compute energy tradeoffs.\n\nI, for one, hope that the next few years will see everyone breeding new kinds of dragons."}, {"id": 50643255, "au": "topicalSoup", "dom": 3, "sr": 34, "sc": 4.0, "ep": 4.88, "bs": 0.0, "d": 2, "age": 4.78, "grav": 31.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 11, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.51, "fa": 0.28, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "This is not necessarily the case. Let’s take AI research. It is the case that researching new algorithms and approaches has a verifiable reward in the form of training loss or time to achieve a specific loss (see NanoGPT speedrun).\n\nYou might say that this doesn’t directly train research taste, but if you look at the last years of LLM progress what we’ve seen time and time again is that if you train these things with sufficient compute towards a well-defined goal, they will develop emergent abilities. And I can’t see any reason why these emergent abilities can’t include things like research taste. As a matter of fact, like the author, I expect that it will include research taste and I would need stronger evidence to the contrary than simply “it hasn’t happened yet” because such arguments have fallen apart over and over as these systems have become more powerful."}, {"id": 50642277, "au": "shevy-java", "dom": 162, "sr": 35, "sc": 3.93, "ep": 4.81, "bs": 0.0, "d": 0, "age": 6.36, "grav": 45.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 12, "k": 2075, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.258, "fa": 0.42, "gp": 0.453, "bl": 0.0, "ds": 0.0, "txt": "> Granted, the fire, this time, may come with existential risks for humanity.\n\nWhy do we not tax these corporations properly?\n\nThey cause so much damage to real people. Tons of jobs are already gone,\nmore will follow. I do not understand why Anthropic etc... are not being\ntaxed to no ends. This is a mafia structure if we allow a few to cause so\nmuch damage to people. Just the RAM price explosion - why do we now have to\npay more? I don't want to help these companies cause more damage."}, {"id": 50642461, "au": "dgacmu", "dom": 2, "sr": 36, "sc": 3.76, "ep": 4.87, "bs": 0.0, "d": 1, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 205, "qw": 0, "k": 8156, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "Neither research taste nor product taste nor good writing have verifiable rewards.\n\nBut I interpreted it as saying that people doing research with the goal being research outcomes may have to let go of some of the lower levels, and I think I agree.\n\nThat's different from the process of education and training, where I agree with you that the low levels are important. I'm struggling with this a lot as I think about getting ready for my class next semester, in which I do teach the students assembly language, because I still believe that even in the era of LLMs, it's important for them to have an intuition for the behavior of the machine underneath them.\n\nWe shifted a long time ago to emphasize reading and understanding assembly instead of writing it, and we may see a similar shift in aspects of code, but I think having the right mental models for the system you're acting on will remain important for a while at least. At some point, code may become the transistors of programming, but I think it will be a while. ( Remembering, of course, that there are a gajillion Excel programmers in the world who have no idea about any of this, and the computers still make their lives easier, but a subset of programmers need deeper understanding.)"}, {"id": 50644078, "au": "somesortofthing", "dom": 11, "sr": 37, "sc": 3.73, "ep": 5.05, "bs": 0.0, "d": 1, "age": 3.81, "grav": 23.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 628, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.562, "fa": 0.28, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "Research taste is the final piece of the puzzle missing to remove the understanding requirement completely. It can already execute faster and better than you. Once it can decide what to execute faster and better too, you being in the loop just slows it down. Since you need to sleep, eat, check your notifications, type, etc., you being in the loop slows it down a lot.\n\nThough RLVR is probably not how models will get research taste. Just a few days ago, OpenAI published evidence of fast and accelerating pretraining progress as measured by perplexity against a test corpus. It seems likely that we won't need to solve the problem of how to RL on long-horizon non-repeatable tasks."}, {"id": 50642269, "au": "zodwick", "dom": 62, "sr": 38, "sc": 3.73, "ep": 3.95, "bs": 0.0, "d": 0, "age": 6.38, "grav": 45.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 44, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.241, "fa": 0.0, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "Wow such an amazing read. I'm sure the author has good future in writing even if academia dies out. So many great quotes.\n\nJokes apart, honestly i sorta hope that there will be a property that humans possess that will be uneconomically hard to recreate in silicon."}, {"id": 50643546, "au": "dgacmu", "dom": 6, "sr": 39, "sc": 3.69, "ep": 6.93, "bs": 1.7, "d": 5, "age": 4.41, "grav": 28.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 0, "k": 8156, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.54, "fa": 0.56, "gp": 1.181, "bl": 0.64, "ds": 0.0, "txt": "I don't, really - I think we often think of taste as applying to the generation of new questions and to the \"shape\" or feel of solutions. It's a very subjective thing, though. I think most people look at a big pile of complexity and go \"yuck\", whereas that might actually be a perfectly fine solution when you're trying to optimize a specific problem. So we may well be able to have RLVR for effective search strategies, but I don't know how to auto-verify the beauty of them.\n\nWe all have different notions of what makes problems and solutions elegant, so it's a little tricky to pin down. Physicists seem to adore symmetry. I adore simplicity and efficiency. I don't feel qualified to say what mathematicians aim for as I'm far from being able to understand the vast majority of modern math research, but I know they have their own intuitions for what makes problems interesting or solutions beautiful."}, {"id": 50645642, "au": "doginasuit", "dom": 35, "sr": 40, "sc": 3.63, "ep": 5.17, "bs": 0.0, "d": 2, "age": 1.73, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 0, "k": 1217, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.431, "fa": 0.34, "gp": 0.577, "bl": 0.0, "ds": 0.0, "txt": "I can't speak for HN at large but my own outlook on AI has generally held. When LLMs first emerged as capable of doing serious work in 2024, I began using them and I was definitely ahead of the conventional wisdom that they couldn't be seriously used to write code. My take has been that they are great for connecting the dots, terrible for plotting them.\n\nTwo years later, that is still basically true. Over that time they've gotten even better at connecting the dots, and remain about as awful at plotting them. The thing I wouldn't have predicted is that they've gotten so good at connecting them that their inability to plot can be overcome, if you don't care about the code. I still think that part matters.\n\nIt is still incredible how dumb they can be while simultaneously being so smart. Despite people like yourself arguing the other side at every point, it seems like my role is more valuable today, not less. Where it goes from here is an open question, its a mistake to assume that trend will hold in any particular shape."}, {"id": 50645526, "au": "doug_durham", "dom": 127, "sr": 41, "sc": 3.62, "ep": 5.16, "bs": 0.0, "d": 1, "age": 1.87, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 1201, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.347, "fa": 0.34, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "You are making an unfounded conclusion.  There will be different intellectually challenging work in the future.  Your daughters and my daughters have the opportunity to forge the path.  Math != intellectual endeavors.  It is a niche. Do not make the mistake that math is a proxy for all human intellectual endeavors.  I'm an engineer and am deeply invested in math as a tool.  I appreciate its value.  I also appreciate what engineers bring to the table.  I've been at this for over 40 years and I am more excited than ever for the future of the field."}, {"id": 50641773, "au": "monospacegames", "dom": 137, "sr": 42, "sc": 3.54, "ep": 4.64, "bs": 0.0, "d": 0, "age": 7.17, "grav": 54.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 113, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.332, "fa": 0.28, "gp": 0.49, "bl": 0.0, "ds": 0.0, "txt": "This is a pretty good analogy, let us extend it a bit further to see if we can draw any more conclusions from it:\n\n1. The dragon breeders are breeding ever larger and larger dragons, and keeping the largest dragons to themselves.\n\n2. They are happy to do the work that you are doing, at a much higher rate, using their Smaug sized dragons.\n\n3. Once the dragons get Ancalagon sized there will no longer be any use for the knights of the realm whether they made an attempt to rebrand as dragon-riders or otherwise.\n\nIs it still worth it to learn how to ride a dragon in this scenario?"}, {"id": 50642386, "au": "kubb", "dom": 144, "sr": 43, "sc": 3.3, "ep": 3.74, "bs": 0.0, "d": 0, "age": 6.18, "grav": 44.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 5158, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 0.99, "fa": 0.28, "gp": 0.425, "bl": 0.0, "ds": 0.0, "txt": "TLDR:\n\n1. Ai is good and will inevitably get better.\n\n2. People don’t like it.\n\n3. We shouldn’t do science without it.\n\n4. For a couple of years we will use it and then it will do everything on its own, and we should be happy. There will be no more problems to solve.\n\nThe same story that is repeated every single day, everywhere.\n\nWow, what a wonderful beautiful read."}, {"id": 50643323, "au": "lordnacho", "dom": 13, "sr": 44, "sc": 3.26, "ep": 4.59, "bs": 0.0, "d": 1, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 162, "qw": 116, "k": 31662, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.828, "fa": 0.7, "gp": 0.444, "bl": 0.0, "ds": 0.0, "txt": "> If we don't understand the lower levels, how will we ensure that the \"research taste\" is good? How will we have any idea whether we are pushing towards the right kind of discoveries? It doesn't make any sense!\n\n> You can pretend that this is the same as something like my day job as a web developer. I don't fully understand how the hardware works at an atomic level. However, I have found that every time I learn more about the foundations on which my abstractions are built, I make better decisions in my job even though that knowledge is technically unnecessary. Understanding pointers in C finally made me understand object references in JavaScript, and it helped me to write more efficient code.\n\nThis is the big question. Is it possible to become good at something high level without spending the time learning the lower levels?\n\nAnswers range from \"yes, eg we don't need to learn ASM anymore\" to \"no, eg you can't learn how to use a calculator until after you learned arithmetic\".\n\nI have not decided what I think about it yet. I'm inclined to think, but only intuitively (evidence will take time to build), that to go from a technical junior to a senior you need to have spent a bunch of time in the trenches taking apart small things and slowly building up a repertoire that eventually can be built into high-level understanding.\n\nHowever I do acknowledge that this is the only way I have "}, {"id": 50644203, "au": "pixl97", "dom": 7, "sr": 45, "sc": 3.2, "ep": 4.74, "bs": 0.0, "d": 6, "age": 3.65, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 217, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.751, "fa": 0.0, "gp": 0.43, "bl": 0.0, "ds": 0.0, "txt": "My question is, is taste decided post ad hoc?\n\nLike when we judge taste on a particular set of problems is it already super filtered to a very tiny 'pre-trained' portion of the population that we're judging. These 'tasters' take a long time to train to this point, there is no particular shortcut other than experience. We just happen to have 8 billion people that we can select from and train an appropriate number.\n\nThis puts humans at the advantage for now, but I do question how long that will last? The models we are training currently are what I call 'mega-models'. They are highly energy intensive to train so the actual total number of models is very low. We could fill a travel bus with models that we've called SOTA.\n\nIf and when we develop a means of individualizing SOTA models much more quickly and cheaply I think the above status quo will quickly collapse and catch a large number of people by surprise. Instead of having maybe a hundred 'individuals' when it comes to models the number could explode to tens of thousands to millions in months. Models with 'taste' that other models and humans like will percolate out. Better or worse, the number of high taste high experience models may quickly dwarf all of the humans that were ever experts in a particular field."}, {"id": 50643070, "au": "hax0ron3", "dom": 73, "sr": 46, "sc": 3.08, "ep": 3.73, "bs": 0.0, "d": 1, "age": 5.03, "grav": 33.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, most of them had nothing to do with building it.\n\nEven for someone as cognitively advanced as a mathematician, it's hard to think about the greater good of a field while simultaneously worried about paying the rent or the mortgage.\n\nAlso, AI is stripping away the romance and mystique of math and theoretical physics, the sense that people who are good at those things are superhuman beings who commune with sublime divine powers. To put it another way, it's fucking up the aesthetics. Maybe AI is communing with sublime divine powers. The possibility should not be excluded. But there's nothing romantic about a data center, it's just a warehouse full of metal boxes and stuff. We want the heroic genius, the romantic thought-hero dashing through the streets, his mind absorbed in math, the divine fire..."}, {"id": 50641809, "au": "awanderingmind", "dom": 88, "sr": 47, "sc": 3.02, "ep": 4.12, "bs": 0.0, "d": 0, "age": 7.1, "grav": 53.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 429, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.978, "fa": 0.0, "gp": 1.255, "bl": 0.0, "ds": 0.0, "txt": "That was an interesting read, but I happen to disagree. Insisting that science remain human-centric and understandable (at least by experts in the field) does not make people \"sore losers\"- otherwise what is the point of any of it? What is the point of science if it does not advance our understanding of nature?"}, {"id": 50642393, "au": "cloudbonsai", "dom": 138, "sr": 48, "sc": 2.93, "ep": 4.18, "bs": 0.0, "d": 1, "age": 6.16, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 887, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.263, "fa": 0.28, "gp": 0.284, "bl": 0.0, "ds": 0.0, "txt": "There is a surprisingly wide range of outcomes from interacting with dragons. Some people are making big scientific progress using them, while others are using them to generate motivational thought pieces on LinkedIn.\n\nSo I’d suggest that, at this point, the bottleneck is not dragons but people, which implies that human training does matter."}, {"id": 50642703, "au": "pyrale", "dom": 116, "sr": 49, "sc": 2.87, "ep": 7.02, "bs": 3.05, "d": 0, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 251, "qw": 106, "k": 8313, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": ["https://atilloy.com/working-with-me-2/"], "ig": 1.6, "fa": 0.62, "gp": 1.026, "bl": 1.15, "ds": 0.0, "txt": "That's an interesting discourse, but ultimately the author contradicts his own point when defining the value of research. When dismissing the point made in the 25-fields-medalists reaction, he says:\n\n> and second, the end results clearly mattered and still matter. Seeing the process as an end in itself, rather than a means to an end, is profoundly self-serving [...] I hold the naive view that the goal of research is to push toward new results, knowledge, applications, understanding that can be shared.\n\nIf I understand him, he dismisses the value of the process and the structure created by it, and reaffirms that new results and associated breakthroughs is what matters, as well as sharing them.\n\nHe, however points out that:\n\n> Those who do not ride it now may never be able to ride it in the future, at least not to find new things.\n\n> At some point it will not be possible to raise the bar, stay above the wave, and it is plausible that nothing biological will be able to give valuable insights to the silicon.\n\nIn his opinion, there is little chance to see a next generation of humans able to use or exploit the results. That questions whether he will be able to share his work. He seems to acknowledge that point by choosing to no longer take new PhD students, at least for a conventional training [1].\n\nThat leaves his pursuit of research with only the goal of making new discoveries, whi"}, {"id": 50642254, "au": "Kuyawa", "dom": 161, "sr": 50, "sc": 2.8, "ep": 3.68, "bs": 0.0, "d": 0, "age": 6.39, "grav": 46.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.482, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "\"Those who deny this progress have just not tried hard enough, or are blinded by their ego\"\n\nI call them luddites, they move in droves to downvote everything AI related, it has cost me hundreds of points here, but the overwhelming joy of creating amazing stuff at an incredibly accelerated pace doesn't let me look in the rear view mirror"}, {"id": 50644838, "au": "krunck", "dom": 61, "sr": 51, "sc": 2.73, "ep": 3.83, "bs": 0.0, "d": 0, "age": 2.85, "grav": 17.2, "surf": 3.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2000, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.374, "bl": 0.0, "ds": 0.0, "txt": "Unfortunately the AI models don't exist only in the realm of scientific research. Their influence spans all of society.\n\nThe largest concern stemming from this fact is that AI will empower a few select few to have immense control over narratives in society allowing them to influence public opinion and indeed even public perception of anything. That kind of control never ends well."}, {"id": 50645314, "au": "asdfman123", "dom": 10, "sr": 52, "sc": 2.67, "ep": 4.22, "bs": 0.0, "d": 1, "age": 2.13, "grav": 12.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 8813, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.28, "fa": 0.28, "gp": 0.283, "bl": 0.0, "ds": 0.0, "txt": "AI didn't have taste w.r.t writing my code until it did. It turns out that taste is just a set of rules, which can be written down in prompt files or encoded into weights, and the justification for employing good taste reveals itself with enough training.\n\nIn a lot of ways taste is just simplicity, for example. A computer can easily optimize for simpler answers. But that's just one component of it."}, {"id": 50644951, "au": "lukan", "dom": 114, "sr": 53, "sc": 2.67, "ep": 3.77, "bs": 0.0, "d": 0, "age": 2.67, "grav": 16.0, "surf": 3.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "Yeah, all my skills and experience I learned in all those years ind hard nights and days debugging through code chasing ghost bugs really pay off now to get the most out of the agents (actually also literally building dragon riders right now for a game) - but how long that will last? Also no idea, right now I live and now it flows. I am a bit more optimistic, that we humans remain relevant for some time for real understanding - I am still unconvinced that models have any understanding in our sense - but I am also open for the possibility of the singularity now. Opus and now Fable left me speechless too often. So let's ride some dragons while it is fun and we can feel important."}, {"id": 50642199, "au": "sesteel", "dom": 51, "sr": 54, "sc": 2.65, "ep": 4.05, "bs": 0.0, "d": 0, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 679, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 1.043, "bl": 0.0, "ds": 0.0, "txt": "I think there is a meta science brewing.  To forgo understanding the leading edge of science because the bow wave is created by AI is no different in my mind than saying, I will forgo understanding what causes weather.  Science is now a phenomena that will require its own research to understand the science."}, {"id": 50643442, "au": "PeterisP", "dom": 135, "sr": 55, "sc": 2.65, "ep": 3.9, "bs": 0.0, "d": 1, "age": 4.53, "grav": 29.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 202, "qw": 0, "k": 22933, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.619, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "I think the main issue is that there always has been a disconnect between those different purposes - the theorems as the main goal, and the understanding obtained in the process; and while the latter (IMHO) has always been the core of the profession, the mathematics community has spent a long time \"advertising\" to  sources of funding that the former is their purpose, that they'll bring proofs that are valuable to the applied sciences and because of that their field should get funding. And so there were two different, contradictory notions of \"what is the purpose of math\" systematically told to different audiences.\n\nSo the recent advances push a painful choice - if the math community asserts that \"The goal was the friends we made along the way\", they lose a key argument that was forever used in all the grant applications I have seen; and if they assert that yes, the proven theorems were what matters and that it was and is the main purpose, then they have to admit that this narrow purpose can be done by AI, and perhaps a physicist (or some other applied science team) should be looking for AI to prove/disprove the mathematical hypotheses they need, instead of funding new theoretical math doctorates."}, {"id": 50641966, "au": "mccoyb", "dom": 103, "sr": 56, "sc": 2.65, "ep": 4.19, "bs": 0.0, "d": 1, "age": 6.83, "grav": 50.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 46, "qw": 0, "k": 1567, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": ["https://scottaaronson.blog/?p=10362"], "ig": 0.777, "fa": 0.62, "gp": 0.409, "bl": 0.0, "ds": 0.0, "txt": "There is no such epistemic crisis: https://scottaaronson.blog/?p=10362\n\nPerhaps in natural language proofs, the possibility of error is just that: a possibility. But are you familiar with how Lean works?\n\nNo serious person is saying that the AI-generated Lean proof of GRH is not true. That's not the issue."}, {"id": 50643314, "au": "topicalSoup", "dom": 27, "sr": 57, "sc": 2.65, "ep": 3.97, "bs": 0.0, "d": 3, "age": 4.7, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 11, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.279, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Absolutely correct. To avoid any intelligence theft in my own life, my parents had me raise myself in the woods with no access to humanity’s prior learnings so that I could discover everything from first principles. To this day, my only conduit to the library of humanity is through an old Nokia 6670 that I use to browse HackerNews from my cave in the north Alaskan wilderness. A local group of indigenous people once tried to teach me how to fish but luckily I was able to close my eyes and jam my fingers in my ears just in time to avoid learning anything. Based on your comment, I feel a sort of kinship as it appears you have used a similar strategy throughout your life."}, {"id": 50643862, "au": "gus_massa", "dom": 119, "sr": 58, "sc": 2.65, "ep": 3.86, "bs": 0.0, "d": 1, "age": 4.04, "grav": 25.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 20321, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.642, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I expect number crunching the results of CERN to be the next. The raw results of the experiments are out there. Procesing them is not so easy, you must draw all the Feynman diagrams, remove repetitions that are not so obvious, renormalize to avoid infinites and a few extra steps that I don't even know. Hard, but automatizable by an LLM. They probably have to raise the interesting threshold to 6 sigmas, because the 5 sigma assume there are only a finite amount of researchers doing that, and more attempts means a greater probability of false positives.\n\nOther branches like superconductors are harder for LLM. There are only a few (thousands?) of experimental results, and the simulations are not good enough because the exact problem has an exponential calculation time and the approximated calculation may be wrong. So for each brilliant idea of the LLM, they have to get someone in the lab to mix the powders, cook it and sold the electrodes, that takes a lot of time and is bounded by the number of available humans hands."}, {"id": 50643797, "au": "threethirtytwo", "dom": 34, "sr": 59, "sc": 2.65, "ep": 6.89, "bs": 3.05, "d": 1, "age": 4.11, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 777, "qw": 41, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.84, "fa": 0.62, "gp": 0.55, "bl": 1.15, "ds": 0.0, "txt": "> Likewise, we deserve all the bad things that will happen if we assume were going to lose in the first quarter.\n\nI’m tired of fucking attitudes like this. You don’t need to assume you’ll lose but you NEED to be AWARE of the most realistic outcome and about how WRONG and how much you’ve “lost” in the past when predicting AI performance relative to human performance.\n\nIt is utterly clear since the inception of ChatGPT and prior that the trendline for AI improving to the point of where it is today has REMAINED the same. Where we are today WAS the most obvious outcome.\n\nI’ve said repeatedly on HN in the early days of LLMs that the objective, most logical outcome is that AI surpasses us and we know this simply by looking at how much ai has continuously improved for the last decade and a half.\n\nBut everywhere on HN, devs have been pathetically wrong. Stupid shit like arguing over the definition of AGI and claiming LLMs are not it. Completely wrong antics like claiming it’s a “stochastic parrot” at a time where it clearly was not. Clinging to the fact that it couldn’t solve the amount of r’s in a strawberry while conveniently ignoring it could solve totally unique leetcode problems was another pathetically biased way of selectively choosing the evidence that best suited yourself.\n\nThe stupidest argument I’ve seen are the people who “understand” LLMs. “Its just a token predictor” or “"}, {"id": 50641904, "au": "jaynetics", "dom": 123, "sr": 60, "sc": 2.65, "ep
