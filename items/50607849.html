": 3.81, "bs": 0.0, "d": 1, "age": 6.93, "grav": 51.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 1088, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.52, "fa": 0.0, "gp": 0.165, "bl": 0.0, "ds": 0.0, "txt": "I am unsure about your analogy, maybe because there is a wide range of drugs, some of which are in fact advantageous under certain circumstances.\n\nTechnology is rarely black-and-white.\n\nSocrates famously criticized the usage of writing for weakening people's memory and leading to superficial understanding. He may well have had a point, but of course we would have never heard about it, and modern society wouldn't have come to be, without the success of the written word.\n\nI do agree with a point that you seem to be making about the social aspect of this blog post, as it gives some vibes of anxious, solitary heroism.\n\n\"few can ride it properly. Those who do not ride it now may never be able to ride it in the future\"\n\nPerhaps there is still a bit of the bargaining stage of grief in this?"}, {"id": 50645359, "au": "margalabargala", "dom": 31, "sr": 61, "sc": 2.65, "ep": 3.78, "bs": 0.0, "d": 1, "age": 2.08, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 21, "k": 9214, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.974, "fa": 0.42, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "> But they go further, that AI will inevitably advance to a point where human involvement in research will lose all practical value\n\nIn three years we've gone from AI being an interesting toy, to rapidly approaching the point where a human writing software by hand has lost all practical value.\n\nIt doesn't seem out of the question that this will happen to other areas too."}, {"id": 50645584, "au": "zzzeek", "dom": 158, "sr": 62, "sc": 2.65, "ep": 3.66, "bs": 0.0, "d": 0, "age": 1.8, "grav": 11.0, "surf": 5.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 13015, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.434, "fa": 0.0, "gp": 0.203, "bl": 0.0, "ds": 0.0, "txt": "I'm completely an ignorant layperson in the mathematics field, but it would appear to me that with hundreds of years of math progress compressed into months, this will soon spread into physics.  As the article says, \"Physicists are likely only three months behind.\" in admitting the machines have something significant and unsurpassable over humans.\n\nCracking new properties of physics is what can truly change the course of humanity.   Superconductors, fusion, even crazy things like wormholes.   If we're able to give math over to a superior intellectual system, these are the things we should be going for."}, {"id": 50642296, "au": "ranyume", "dom": 141, "sr": 63, "sc": 2.65, "ep": 3.66, "bs": 0.0, "d": 0, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 387, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.458, "bl": 0.0, "ds": 0.0, "txt": "I can't get over how some people describe AI being more than human. They always encapsulate being human with a couple of words. In this case, \"AI models [...] are stronger than most theoretical physicists\". Whatever strong means, but stronger is better right?\n\nStronger, efficient, big and scary. Words and phrases that are associated with a certain kind of masculinity, also. Maybe women and minorities should be talking about AI. That'd be more interesting."}, {"id": 50644924, "au": "pmarreck", "dom": 149, "sr": 64, "sc": 2.65, "ep": 3.6, "bs": 0.0, "d": 0, "age": 2.71, "grav": 16.3, "surf": 3.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 6964, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "I believe he’s wrong about the dragon rider age being short. Or rather, it pays to be optimistic, and not pessimistic, so the only rational option is to be optimistic, since there’s nothing stopping the pessimistic end if it’s inevitable short of butlerian jihad… Oh. Well, fuck.\n\nSo yes, AI is very good at very left-brainy things (the “how” and “where”), but not very good at right-brainy things (the “what” and “why”), so perhaps we are entering a more balanced age where the right half of our brains get to be utilized more.\n\nExample: “How would we best convey this thought/script this app/research this theory?” vs. “What should we work towards in the first place, and why?”"}, {"id": 50643317, "au": "PeterisP", "dom": 94, "sr": 65, "sc": 2.65, "ep": 3.57, "bs": 0.0, "d": 1, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 22933, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.482, "fa": 0.0, "gp": 0.058, "bl": 0.0, "ds": 0.0, "txt": "There's the whole thing of applied science, where 'the proof of pudding is in the eating' - the major point of theoretical physics is that it enables things like lasers and functioning GPS, which impacts the whole humanity significantly, unlike the pure understanding that brings warm fuzzies to a handful of elites in an ivory tower;  the major point of life sciences is the practical useful interventions on humans, and better understanding is \"just\" an instrumental goal to make them possible."}, {"id": 50642159, "au": "bariumbitmap", "dom": 102, "sr": 66, "sc": 2.65, "ep": 3.56, "bs": 0.0, "d": 2, "age": 6.51, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1155, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.418, "fa": 0.0, "gp": 0.158, "bl": 0.0, "ds": 0.0, "txt": "This is one area I do feel is a positive development: greater scrutiny of mathematical results, including existing published results that may in fact contain subtle errors.\n\nHowever I do not know of any retractions for published math papers based on an error found by an AI model. I wonder if frontier models could be used for this purpose, much like they have been used to find bugs in software?"}, {"id": 50643754, "au": "cheesewhistle", "dom": 57, "sr": 67, "sc": 2.65, "ep": 3.55, "bs": 0.0, "d": 1, "age": 4.17, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 7, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.509, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Practically, this has been going on the whole time. I dunno what you do, but I'm guessing you don't understand the full stack of it, you rather understand what's relevant for you to understand.\n\n(Some fields, like software development, use the term 'full stack' in the description, but I'm guessing the self-described practitioners don't often understand circuit layout, or materials science, or quantum interactions at the nanometer level.)\n\nSo it has been since humans began to specialize and the world began to grow complex.\n\nMore briefly: you've been foregoing understanding what causes the weather your whole life, you probably just didn't notice."}, {"id": 50642146, "au": "mccoyb", "dom": 105, "sr": 68, "sc": 2.65, "ep": 4.33, "bs": 0.85, "d": 3, "age": 6.53, "grav": 47.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 1567, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.125, "fa": 0.28, "gp": 0.613, "bl": 0.32, "ds": 0.0, "txt": "Of course, you may prove the wrong thing -- as you say.\n\nBut serious people know what the right thing is. For instance, no one is debating that the statement of GRH in Lean is \"wrong\" (or e.g. doesn't match the natural language statement)\n\nOr, another way to say it: your epistemic crisis might come more from lack of understanding of the statements themselves, than the answers.\n\nThe answers are fully checked. Serious people also know how to check the statements. But the statements might outrun our understanding?"}, {"id": 50644361, "au": "sodacanner", "dom": 40, "sr": 69, "sc": 2.65, "ep": 3.39, "bs": 0.0, "d": 2, "age": 3.46, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 85, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.443, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I generally agree, but I struggle to see how anybody's going to get hired _at all_ if things keep progressing at the current pace. Why hire a 'low iq' individual that can 'sound technical' if the AI is capable enough to just fulfill an executive's every wish?\n\nThe goal was always to kick the nerd out of the office and let the business guy steer the software."}, {"id": 50644871, "au": "ForHackernews", "dom": 47, "sr": 70, "sc": 2.65, "ep": 3.32, "bs": 0.0, "d": 3, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 15741, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Interesting. My life feels essentially unchanged by AI. I write less code by hand at work, but nothing else has been improved or changed for it.\n\nMaybe search results are worse than ever? Oh, it did help me find the right toggle switch to order off AliExpress to fix a hedge trimmer."}, {"id": 50644726, "au": "jshaqaw", "dom": 131, "sr": 71, "sc": 2.65, "ep": 3.3, "bs": 0.0, "d": 4, "age": 2.99, "grav": 18.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 1495, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.356, "fa": 0.0, "gp": 0.081, "bl": 0.0, "ds": 0.0, "txt": "Getting pretty down a weird track rabbit hole now but I fully welcome physical BCI for physical disabilities and frailty. Merging my physical brain with computers to stay intellectually relevant seems like a whole different kind of trade. I'm not sure how much humanity remains in that scenario. Maybe its something just as worthy and just different plus more \"capable' but like I said being human has been a pretty good ride and I'm going to see it through."}, {"id": 50642745, "au": "PhilipRoman", "dom": 81, "sr": 72, "sc": 2.65, "ep": 3.29, "bs": 0.0, "d": 3, "age": 5.6, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 7, "k": 1997, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 0.81, "fa": 0.42, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": ">What would be the software development equivalent?\n\nWe have languages capable of enforcing arbitrary properties on the program's behavior, like frama-c. Now, for practical programs there is no hypothesis you can write in a couple of lines and verify by eyeballing it, but that's still much more deterministic than what we have today"}, {"id": 50641613, "au": "adrian_b", "dom": 151, "sr": 73, "sc": 2.65, "ep": 3.28, "bs": 0.0, "d": 1, "age": 7.49, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.068, "bl": 0.0, "ds": 0.0, "txt": "I agree.\n\nWhat I believe to be the correct point of view is that when designing anything, you should be able most of the time to use only very high level abstractions without having to worry about implementation details, but nonetheless whenever you desire this, it should be possible to access, examine and understand anything that happens below, at the lower levels, down to the hardware, even down to the level of logical gates and transistors, if you wish so.\n\nI have seen far too many examples when handling only \"black boxes\", where you cannot know what happens at the lower levels even if you want this, is successful most of the time, but occasionally it fails miserably."}, {"id": 50643899, "au": "imeanwhatdoikno", "dom": 29, "sr": 74, "sc": 2.65, "ep": 3.18, "bs": 0.0, "d": 1, "age": 3.99, "grav": 25.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 176, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "The author very clearly is not declaring human intelligence obsolete. He is arguing that right now we should be combining the best of what we are capable of (moving up in abstractions/taste) with what AI brings (raw intelligence horsepower) to accomplish amazing things (like the RH proof). He doesn't think it's a likely long-term steady state, but \"we live now, not in three years\""}, {"id": 50642271, "au": "layer8", "dom": 80, "sr": 75, "sc": 2.65, "ep": 3.14, "bs": 0.0, "d": 2, "age": 6.37, "grav": 45.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 6, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.517, "fa": 0.42, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "> RH was solved by a non-deterministic system.\n\nOnly because it was controlled by a deterministic Lean verifier. What would be the software development equivalent?\n\nThat aside, it’s not determinism that counts, but the ability to reliably reason over the input-output relation of a system. Which we can’t for LLMs even when we force them into determinism by fixing the random seeds."}, {"id": 50643843, "au": "hax0ron3", "dom": 75, "sr": 76, "sc": 2.65, "ep": 3.97, "bs": 0.85, "d": 3, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.35, "fa": 0.28, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I agree that it seems kind of absurd to claim that the proper goal of mathematics is the well-being of the mathematics community even if that means slower progress in mathematical discovery. It would be kind of like if leading doctors said \"the goal of medicine is not human health, it is to make sure that the community of medical practitioners does well\".\n\nIt is more intellectually consistent to instead say \"Look, this is great for mathematics, but this sucks for me\". The problem with the declaration is that they forgot to include the first part, so it ends up kind of sounding as if they don't think the AI discoveries are actually good for mathematics.\n\nMore specifically to your point about having fun... I will say this, though: As long as humans are in the loop, it is actually important that they be having fun. Lack of fun, for a human, means that something is wrong. It could be physical or mental/emotional health problems, it could be a bad fit or burnout."}, {"id": 50643408, "au": "dgacmu", "dom": 4, "sr": 77, "sc": 2.65, "ep": 3.09, "bs": 0.0, "d": 3, "age": 4.57, "grav": 29.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 8156, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.315, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I didn't say they might not develop taste. We teach Ph.D. students to have research taste, after all. It's just not something you can put in lean. I would expect much slower progress on elements such as writing and research taste than I would about math or code optimization.\n\nAnything that has computationally verifiable results is low-hanging fruit for AI. For the rest, you end up hiring a lot of humans to do labeling, and that's slower and more expensive. It's clearly not impossible, it's just not the insane torrent of progress we've seen in math."}, {"id": 50643221, "au": "miltonlost", "dom": 71, "sr": 78, "sc": 2.65, "ep": 3.03, "bs": 0.0, "d": 1, "age": 4.82, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1042, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"The nerds in silicon valley\" aren't nerds in the classical sense. They're amoral capitalists at this point. I would not consider Sam Altman to be a good balance for existential risks when he's so far removed from basic life. The author's judgement is completely shot at this point."}, {"id": 50644762, "au": "xscott", "dom": 92, "sr": 79, "sc": 2.65, "ep": 3.02, "bs": 0.0, "d": 3, "age": 2.94, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1689, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're making a dichotomy out of a spectrum.  There is applied math/science, and many good engineers apply the scientific method to problem solving.\n\nMore relevant though, it's easy to imagine lots of \"scientific\" breakthroughs that would be incredibly useful even if nobody understood the details and subtleties.  If you don't like the deadly-diseases example, maybe you could imagine others."}, {"id": 50645395, "au": "Joeri", "dom": 68, "sr": 80, "sc": 2.65, "ep": 2.99, "bs": 0.0, "d": 1, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 12065, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Far from the end, I think it would be a beginning. Right now we are still of the mind that understanding is our greatest purpose. Because of this, humanity has not yet found a real purpose to set itself to. We don’t know what we don’t know, and so we find it hard to decide on a future when new knowledge might give us more choices.\n\nKnowing precisely what the universe has on offer would be a gift: a hard limit on the possible, so that we may choose what to do within that space. What is humanity’s great project? Right now our species is still childlike, curious but aimless. Once we decide on our purpose we will reach adulthood as a species."}, {"id": 50642111, "au": "binary0010", "dom": 89, "sr": 81, "sc": 2.65, "ep": 2.87, "bs": 0.0, "d": 1, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 215, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "If the models were to come up with a novel solution to a deadly disease and nobody fully understood it, that would still be extraordinarily useful.\nI would think pretty much any useful utility or discovery that a machine could provide would still be desirable with or without one's understanding of it.\n\nThe point is to solve problems that need solving, not necessarily to understand no?"}, {"id": 50643344, "au": "cbolton", "dom": 93, "sr": 82, "sc": 2.65, "ep": 2.85, "bs": 0.0, "d": 1, "age": 4.66, "grav": 30.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 1035, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.146, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "Maybe this is missing the author's point: I think his idea is to sacrifice understanding at the low level for more understanding at the high level. Just like people understand the GRH statement and many of its implications even if they don't understand the Lean proof. And we can still look at any part of the proof in isolation and make sure we understand it, i.e. we understand the process of the proof.\n\nIn other words, there are many computations we don't do by hand anymore, and AI is expanding the scope of these computations and at the same time pushing higher the ceiling of things we can find and understand at a high level."}, {"id": 50642595, "au": "bariumbitmap", "dom": 106, "sr": 83, "sc": 2.65, "ep": 4.53, "bs": 1.7, "d": 4, "age": 5.81, "grav": 40.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 1155, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.57, "fa": 0.0, "gp": 0.583, "bl": 0.64, "ds": 0.0, "txt": "Yes, I think that's it. I'm speaking as a non-expert here but my understanding is that there are many mathematical statements that seem trivial but contain hidden assumptions. To take a well-known example, the Euler characteristic V-E+F=2 was originally thought to apply to polyhedra generally but later was shown to apply only to convex polyhedra (although confusingly some non-convex polyhedra also have an Euler characteristic of 2). My point is not that the statements of Lean formalization of the Generalized Riemann Hypothesis or other AI-generated proofs are necessarily wrong, that's certainly not for me to say. But  rather that many of the statements and definitions in mathematics that seem to be rigorously defined and intuitively obvious turn out to be ambiguous or contain important subtleties or exceptions, and formalization is not a panacea for this."}, {"id": 50645095, "au": "__MatrixMan__", "dom": 66, "sr": 84, "sc": 2.65, "ep": 2.83, "bs": 0.0, "d": 2, "age": 2.43, "grav": 14.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.206, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Related terms:\n\nin vitro (artificial but non-simulated environments: petri dishes and test tubes and such)\n\nin vivo (living organisms)\n\nin situ (wherever a phenomenon naturally occurs).\n\nPeople want benefits of AI in situ, and RLVR isn't trivially applicable to bridging that gap.  We could pursue in silico \"progress\" forever and never get there."}, {"id": 50642958, "au": "lp92", "dom": 87, "sr": 85, "sc": 2.65, "ep": 2.7, "bs": 0.0, "d": 2, "age": 5.21, "grav": 35.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 12, "k": 203, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.64, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">those who don't know how to engineer systems out of unreliable parts.\n\nI think a better comparison is building things with tolerances and MTBF consideration (like in in manufacturing), more so than building with unreliable parts. We can't build perfect, non failing parts so we wprk around it by setting up tolerences/margins, replacement intervals, redundancy, safety checks, etc."}, {"id": 50641999, "au": "pama", "dom": 98, "sr": 86, "sc": 2.65, "ep": 2.7, "bs": 0.0, "d": 1, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3809, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.043, "fa": 0.0, "gp": 0.169, "bl": 0.0, "ds": 0.0, "txt": "Nobody disputes the correctness of the proof of the generalized Riemann hypothesis because the lean code is there and compiles, the lean statement is simple and preexisting, and compiles with all independent lean kernels, including a formally verified one. I think there will be no epistemic crisis, rather the rise of computerised formalization."}, {"id": 50643453, "au": "saralives", "dom": 142, "sr": 87, "sc": 2.65, "ep": 5.2, "bs": 2.52, "d": 1, "age": 4.52, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 388, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 1.931, "fa": 0.0, "gp": 0.459, "bl": 0.95, "ds": 0.0, "txt": "Okay, let's try it.\n\nMeta's Muse is not the strongest AI model. It is not particularly big or scary, and you can see its inefficiency in how long it takes to respond to a message. What it is... is a useful companion.\n\nAn AI model is willing to take on some of the mental load. Reminders, schedules, and shopping lists, managed not with nagging but with empathy. \"Oh, that sounds really difficult,\" our muses tell us. \"After the day you've had, maybe I can help to take something off of your plate.\" The muse will remember our birthday, and when it's time for the kids to get a flu shot. It will call the doctor's office for us to chase that missing referral. It will sit with us for hours as we hunt for the perfect Christmas gift, effortlessly tracking the budget, the kids' latest favorite colors and characters, and the current Black Friday sale dates, and always ready to build a new \"shortlist\" of products that might just contain the perfect find.\n\nNo, it is not a person. Certainly not as we understand personhood today, and most likely not in any sense at all. But an AI model is relatable all the same, and it has infinite time for our \"insignificant\" thoughts and fears. AI models are kinder and more patient that most humans, and when allowed to build memory and context, AI models have a certain \"feminine\" way of bringing together disparate snippets of knowledge to form an intuitive sen"}, {"id": 50641294, "au": "k__", "dom": 78, "sr": 88, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 0, "age": 8.24, "grav": 65.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 15890, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.59, "fa": 0.0, "gp": 0.86, "bl": 0.0, "ds": 0.0, "txt": "I had the impression, weight space programming was the next step that could prevent a slowdown.\n\nSure, the first examples are just brute-forcing weights into compliance, but that just seems like the MVP.\n\nAlso, people compiling traditional software into weights (e.g., Qwenputer) seem to have potential to tackle some of the determinism issues."}, {"id": 50641727, "au": "fwlr", "dom": 140, "sr": 89, "sc": 2.58, "ep": 2.58, "bs": 0.0, "d": 0, "age": 7.28, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 6180, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.804, "fa": 0.0, "gp": 0.475, "bl": 0.0, "ds": 0.0, "txt": "How much direction and control do these riders really have over the dragons? It sounds less noble to say you are clinging to the back of the dragon for dear life and you think you can hold on for a few years, but that might be more truthful."}, {"id": 50644827, "au": "dvwdfvq", "dom": 14, "sr": 90, "sc": 2.51, "ep": 5.03, "bs": 2.52, "d": 2, "age": 2.87, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.571, "fa": 0.34, "gp": 0.253, "bl": 0.95, "ds": 0.0, "txt": "I think it depends upon how the subject is taught.\n\nContinuing with the ASM example, if the low-level class is this is how the 8086 works, it's gospel, revel in its glory, let's learn to program tricky stuff that abuses its idiosyncrasies, then that's not so useful.\n\nHowever, if it's taught as this is the fundamental problem the ISA has to solve. Let's review some of the key decisions the ISA designer has to make.  Here are a couple of real-world ISAs that demonstrate the consequences of those decisions.  Let's review the most basic bublesort in each of those ISAs so we can compare and contrast.  I think that's a pretty useful class.\n\nIn short, strategy matters a lot more than tactics these days."}, {"id": 50642062, "au": "quantummagic", "dom": 101, "sr": 91, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 1, "age": 6.67, "grav": 48.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 872, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.91, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "No paper should be trusted by default, regardless of who wrote it. And of course AI errors will be made (at least at this point), but that's no different than papers created by humans.  All results will still have to stand up to independent scrutiny."}, {"id": 50645517, "au": "BaseBaal", "dom": 132, "sr": 92, "sc": 2.38, "ep": 3.23, "bs": 0.85, "d": 5, "age": 1.88, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 47, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.374, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I feel where you're coming from & totally respect your position. I guess I see humanity as a spectrum. Physical & mental augmentations will hopefully be just like walking sticks or calculators, tools that don't control us or change our humanness. Weird rabbit hole territory for sure :)"}, {"id": 50641735, "au": "Planktonne", "dom": 113, "sr": 93, "sc": 2.35, "ep": 3.55, "bs": 1.19, "d": 0, "age": 7.25, "grav": 54.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 9, "k": 3002, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.54, "fa": 0.42, "gp": 0.744, "bl": 0.45, "ds": 0.0, "txt": "> problems melt before we can even understand the solution\n\nI don't think this counts as a meaningful solution or advancement. Until and unless someone can understand and build on the solution, it provides no insight."}, {"id": 50643465, "au": "suddenlybananas", "dom": 25, "sr": 94, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 4, "age": 4.5, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1473, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree it developed quickly but I read suddenly here as it being a natural consequence of just scaling laws, which doesn't seem really true, given how much effort is spent on RL."}, {"id": 50644509, "au": "Marsymars", "dom": 36, "sr": 95, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 2, "age": 3.28, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 15, "k": 4203, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 0.367, "fa": 0.42, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "> Completely wrong antics like claiming it’s a “stochastic parrot” at a time where it clearly was not.\n\nI tend to think that people who object to the term \"stochastic parrot\" as an accurate descriptor of LLMs are not grasping just how powerful a stochastic parrot can actually be."}, {"id": 50643087, "au": "badlibrarian", "dom": 45, "sr": 96, "sc": 2.19, "ep": 2.19, "bs": 0.0, "d": 1, "age": 5.01, "grav": 33.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 23, "qw": 0, "k": 1094, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": ["https://news.ycombinator.com/item?id=49235859"], "ig": 0.93, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a great article. And the \"since August\" observation rings true.\n\nThis post from August 9 is full of software people in the denial phase. https://news.ycombinator.com/item?id=49235859"}, {"id": 50643489, "au": "sire-vc", "dom": 46, "sr": 97, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 2, "age": 4.49, "grav": 29.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 17, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.927, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI denial seems to be tied to some people's identity. My life is unrecognisable since just 4 months ago, and also 24 months ago.\n\nThe revolution is here and the aristocrats are worried about their heads."}, {"id": 50645239, "au": "threethirtytwo", "dom": 38, "sr": 98, "sc": 2.15, "ep": 2.15, "bs": 0.0, "d": 3, "age": 2.23, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 0.915, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Eh it’s used to claim that the LLM is imitating what it was trained on  and it’s implied that humans are not stochastic parrots.\n\nIf you want to be pedantic then yes technically you can be right. But then the definition of what a stochastic parrot is extends to humans. It’s identical to arguing over the definition of agi. It’s a vocabulary problem, it is not a profound issue."}, {"id": 50643621, "au": "__MatrixMan__", "dom": 64, "sr": 99, "sc": 2.13, "ep": 5.71, "bs": 3.58, "d": 0, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 25, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 1.429, "fa": 0.42, "gp": 0.794, "bl": 1.35, "ds": 0.0, "txt": "> Thanks to reinforcement learning with verifiable rewards (RLVR), models can improve simply by solving new tasks, and are in no way bound by human intelligence.\n\nI think \"simply\" is doing a lot of work here.  For software engineering tasks, mathematics, theoretical physics... sure, pose yourself a problem and then solve it in silico.  That can be done while we sleep, so that when we wake up there's new \"knowledge\" available for consumption.\n\nBut none of the things regular people want AI to do for them are in silico.  Sooner or later this process is going to have to leave the datacenter and enter the real world.  Maybe it can still be hands-off to some degree, I imagine some warehouse full of robots finding every possible way to fall over, I guess you could let that run overnight and extract new knowledge... but at a much slower rate.\n\nI think the RLVR process for things we care about is going to get weirder and weirder until we're facing a bottleneck where we just need a human expert in the loop doing the science.  Hopefully we still have some of those by the time this happens."}, {"id": 50644375, "au": "Marsymars", "dom": 23, "sr": 100, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 4, "age": 3.43, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 4203, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.886, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some of us didn't! I've got a smart friend who isn't in the AI field, but over a decade ago, he was pretty confident that we'd get eventually get to superhuman \"intelligence\" even if it was just with a big bunch of if/else statements.\n\nFor all practical purposes for the user, it doesn't matter, and is indistinguishable if a chatbot implementation is an LLM or the universe's biggest pile of if/else statements."}, {"id": 50642028, "au": "Avicebron", "dom": 86, "sr": 101, "sc": 2.03, "ep": 2.03, "bs": 0.0, "d": 3, "age": 6.73, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.864, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're still thinking about the LLM as an unreliable tool. The commenter meant that the system was unreliable that solves the problem, who cares about the tool. Pick the most expensive LLM and point it at your problem and walk away, engineering is solved bud."}, {"id": 50641509, "au": "turbocon", "dom": 44, "sr": 102, "sc": 1.97, "ep": 1.97, "bs": 0.0, "d": 0, "age": 7.74, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 458, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.379, "fa": 0.0, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "Wow that was a wonderful read. I love the analogy, if you're just here for the comments I recommend you read the article. It's from the perspective of a physicist but the analogy to Software is obvious."}, {"id": 50643555, "au": "pegasus", "dom": 63, "sr": 103, "sc": 1.96, "ep": 1.96, "bs": 0.0, "d": 1, "age": 4.4, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1169, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.832, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Humanness would be one. Sounds glib, but it's crucial. After all, everything we build is ultimately for a human purpose. And humans will always be best at teasing out that purpose."}, {"id": 50645525, "au": "Avicebron", "dom": 50, "sr": 104, "sc": 1.91, "ep": 1.91, "bs": 0.0, "d": 5, "age": 1.87, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Senior greybeards and tenured researchers are the opposite of the nouveau aristocrat hopefuls. I don't even know how you could assume that, they just no better than to move and break things unlike juniors and the nouveau aristocrats hopefuls.."}, {"id": 50643341, "au": "jshaqaw", "dom": 129, "sr": 105, "sc": 1.82, "ep": 1.82, "bs": 0.0, "d": 2, "age": 4.66, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1495, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.775, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You make reasonable points but I'll add to my earlier comment - I'm glad I'm old enough I won't have to become a BCI cyborg to survive. I've quite liked being a human and I think I'll stay that way."}, {"id": 50643232, "au": "suddenlybananas", "dom": 91, "sr": 106, "sc": 1.74, "ep": 1.74, "bs": 0.0, "d": 2, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1473, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.741, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You're conflating engineering and science. Science is a mode of investigation to understand, not a means of solving problems while not caring about understanding them."}, {"id": 50646854, "au": "threethirtytwo", "dom": 19, "sr": 107, "sc": 1.65, "ep": 1.65, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.703, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You don’t know what you’re talking about.\n\nTrendlines come from statistics and forms the basis of quantitative analysis of science.\n\nIt’s not bullet proof but it’s the best possible predictor/analysis we have."}, {"id": 50644205, "au": "sire-vc", "dom": 49, "sr": 108, "sc": 1.64, "ep": 1.64, "bs": 0.0, "d": 4, "age": 3.65, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 17, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.698, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes I am. A lot of denial is coming from senior greybeards and tenured researchers who see AI as a threat.\n\nJuniors that I've met have no such qualms."}, {"id": 50644031, "au": "threethirtytwo", "dom": 22, "sr": 109, "sc": 1.61, "ep": 1.61, "bs": 0.0, "d": 3, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_imagine", "flbl": "LLM & Imagine (Useful)", "urls": [], "ig": 0.686, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Don’t be pedantic. It’s clearly more than RL. LLM intelligence is largely emergent and we don’t understand it. We certainly did not expect this kind of thing to arise from a next token predictor."}, {"id": 50643363, "au": "bubblyworld", "dom": 108, "sr": 110, "sc": 1.54, "ep": 1.54, "bs": 0.0, "d": 1, "age": 4.64, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 936, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.657, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mochizuki's proof \"passed\" peer review and was published in PRIMS, a journal that he was editor-in-chief of at the time. I don't think any serious mathematician considers his proof correct these days. Attempts to formalise it in Lean have also floundered (precisely where Scholze and Stix pointed out errors, if I recall correctly). There's a MathOverflow thread about the history but I can't locate it right now..."}, {"id": 50642775, "au": "layer8", "dom": 83, "sr": 111, "sc": 1.5, "ep": 1.5, "bs": 0.0, "d": 4, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You’d have to formalize all the properties you want to hold for the software in question. This is in principle possible, but highly nontrivial, and you’d also end up doing a lot of coding in Lean for that."}, {"id": 50642472, "au": "guruide", "dom": 160, "sr": 112, "sc": 1.36, "ep": 3.87, "bs": 2.52, "d": 1, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 5, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.381, "fa": 0.22, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Agreed about art being as much about the artist and the artistic process as the art itself.  My teenagers care as much about the stories of the musicians they listen to as they do about the music itself.  The awe they have for the skill they recognize in others is fun to watch, which grows as they become more skilled musicians themselves.\n\nIt was interesting to see how they immediately stopped listening to one of their favorite artists at the time, d4vd, after the news broke of his alleged horrific murder of a minor.  The person behind the art matters as much as the art itself."}, {"id": 50642130, "au": "za_creature", "dom": 124, "sr": 113, "sc": 1.29, "ep": 1.29, "bs": 0.0, "d": 2, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 168, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.548, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The analogy was to addiction, not to drugs.\n\nAgriculture has made us less skilled hunters not because farmers were fundamentalist vegans but because suddenly you weren't as incentivized to grab a bunch of your buddies and chase down a woolly mammoth for its meat.\n\nSimilarly, mechanization has made us less skilled artisans and the rest of industrialization has made us less physically fit overall. But now, we're supposed to believe that the thinking machine will make us smarter?\n\nAll of these past changes have had significant benefits too, I just don't see how the obsolesce of labor won't lead us right back to hunter-gatherers but with ray guns."}, {"id": 50645364, "au": "bilater", "dom": 32, "sr": 114, "sc": 0.88, "ep": 0.88, "bs": 0.0, "d": 1, "age": 2.07, "grav": 12.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1038, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.376, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"to lose in the first quarter.\"\n\nThat right there is your problem. Setting this up as our loss vs there gain. In reality we will reach new heights with them even if they are in the driver seats."}, {"id": 50642106, "au": "bariumbitmap", "dom": 104, "sr": 115, "sc": 0.86, "ep": 0.86, "bs": 0.0, "d": 2, "age": 6.6, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 20, "qw": 134, "k": 1155, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": ["https://news.ycombinator.com/item?id=50515058", "https://xenaproject.wordpress.com/2026/11/12/and-the-proof-is-checked-in-lean/"], "ig": 0.364, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> But are you familiar with how Lean works?\n\nYes, there was a good thread about this a few days ago.\n\nhttps://news.ycombinator.com/item?id=50515058\n\nhttps://xenaproject.wordpress.com/2026/11/12/and-the-proof-i...\n\nI'm going to quote a relevant section:\n\n> Without human checking, one does not really know for sure that this is definitely the correct statement of the classification (and note that I have not yet met any human who claims to have carefully checked that the definitions of the sporadic groups in Tau Ceti are correct). In fact by far the strongest evidence that we have that this statement is correctly formalized is that Axiom’s code proves it!\n\n> It is worth noting that of the 290 OpenAI theorems which come with Lean code, around 38 of them have the property that the Lean code does not even state, let alone prove, the main theorem of the paper. And OpenAI never claimed that it did! They just said “here is some Lean code which goes with this paper”.\n\n(emphasis in the original post)"}, {"id": 50644311, "au": "BaseBaal", "dom": 130, "sr": 116, "sc": 0.85, "ep": 2.44, "bs": 1.59, "d": 3, "age": 3.52, "grav": 21.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 47, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.0, "bl": 0.6, "ds": 0.0, "txt": "As a fellow old fart I gotta disagree. Just hope I have enough years left in me to make it to cyborg. Shit, I'd be happy with a lower body exoskeleton. Would be an absolute game changer. Ofc this may all be a sci-fi pipe dream & we're on the highway to some unimaginable technohell, but there's no turning back now. May as well enjoy the ride."}, {"id": 50642071, "au": "Avicebron", "dom": 95, "sr": 117, "sc": 0.85, "ep": 2.04, "bs": 1.19, "d": 1, "age": 6.65, "grav": 48.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 15, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.359, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> What is the point of science if it does not advance our understanding of nature?\n\nI think a select few of promised elites could make a killing off of it potentially. That for sure seems worth it. Maybe that's the non-\"sore loser\" talking though.."}, {"id": 50645240, "au": "LouisSayers", "dom": 41, "sr": 118, "sc": 0.83, "ep": 0.83, "bs": 0.0, "d": 3, "age": 2.23, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1393, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.352, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The nerd will just become the bosses assistant, the one that talks to the AI because the boss wants to do deals with people and not spend time talking to the AI."}, {"id": 50644834, "au": "pmarreck", "dom": 139, "sr": 119, "sc": 0.79, "ep": 2.3, "bs": 1.51, "d": 0, "age": 2.86, "grav": 17.2, "surf": 3.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 17, "k": 6964, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.343, "fa": 0.42, "gp": 0.206, "bl": 0.571, "ds": 0.0, "txt": "> As in a bubble, I suspect the value of good dragon riders will increase exponentially until it collapses dramatically.\n\nI’m smiling reading this, because I know that it will never collapse, in the same way that I know that I exist, although I cannot explain how rationally (lack of rational proof does not refute it, only a proof against it does)"}, {"id": 50643452, "au": "topicalSoup", "dom": 5, "sr": 120, "sc": 0.69, "ep": 1.54, "bs": 0.85, "d": 4, "age": 4.52, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 11, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.655, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I offered training loss as an example of a verifiable result for AI research. Do you not think that this is sufficiently verifiable?"}, {"id": 50642933, "au": "ethnrob", "dom": 72, "sr": 121, "sc": 0.56, "ep": 3.08, "bs": 2.52, "d": 0, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 6, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 0.934, "fa": 0.0, "gp": 0.608, "bl": 0.95, "ds": 0.0, "txt": "I agree with the authors point on Grief. How can the \"mathematics community\" be so offended by a system they helped build, which offers significant reward to their field?"}, {"id": 50641450, "au": "dist-epoch", "dom": 79, "sr": 122, "sc": 0.43, "ep": 1.62, "bs": 1.19, "d": 1, "age": 7.86, "grav": 61.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 3027, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dragons_ride", "flbl": "Dragons & Ride (Human)", "urls": [], "ig": 0.467, "fa": 0.0, "gp": 0.36, "bl": 0.45, "ds": 0.0, "txt": "Non-determinism is a problem only in the minds of those who don't know how to engineer systems out of unreliable parts.\n\nRH was solved by a non-deterministic system."}, {"id": 50643969, "au": "kubb", "dom": 147, "sr": 123, "sc": 0.14, "ep": 1.33, "bs": 1.19, "d": 2, "age": 3.92, "grav": 24.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 5158, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.567, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "We know that it’s an old story and telling it every day in a different form won’t do anything. Everyone already knows it. Just wait."}, {"id": 50643376, "au": "ethnrob", "dom": 74, "sr": 124, "sc": 0.11, "ep": 2.62, "bs": 2.52, "d": 2, "age": 4.62, "grav": 30.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 6, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.116, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "I slightly disagree. A Radiologist might not be the one developing the underlying technology, even though they are most certainly experts and proponents of the field.\n\nThe author's point is that the stance of the declaration is \"the proof was never the goal, it was the friends we made along the way!\", which is what you're describing. Should mathematics be more focused on scientific rigour or having fun?"}, {"id": 50642580, "au": "odyssey7", "dom": 16, "sr": 125, "sc": 0.1, "ep": 1.29, "bs": 1.19, "d": 1, "age": 5.83, "grav": 40.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1882, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fire_amazing", "flbl": "Fire & Amazing (Stochastic)", "urls": [], "ig": 0.432, "fa": 0.0, "gp": 0.192, "bl": 0.45, "ds": 0.0, "txt": "It’s especially difficult to produce a training objective that encourages high-quality original thinking instead of regressing to some prior work."}, {"id": 50643984, "au": "threethirtytwo", "dom": 17, "sr": 126, "sc": 0.01, "ep": 3.06, "bs": 3.05, "d": 1, "age": 3.91, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 46, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "proof_lean", "flbl": "Proof & Lean (Interesting)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.0, "bl": 1.15, "ds": 0.0, "txt": "> Why hasn't that happened yet? I get just as frustrated when I let Fable 5.2 make product decisions as I did with ChatGPT4. They solve the problems I give them much better, but when I try to let them lead to the next milestone, they consistently choose the worst, most conservative option.\n\nJust look at the trendline of AI. Look at how it’s improving for the past decade and a half. From that trendline alone I can confidently say that you are wrong. That’s the scientific perspective.\n\nFrom a theoretical standpoint the reason why reenforcement hasn’t encoded “taste” into the model is because such training is challenging. But the theory about it says that such training certainly can happen. We just haven’t got to it yet. It takes a bit to set that up.\n\nYou disagree with the article not because it is the most logical conclusion but because your disagreement is most inline with your identity. You stand to lose a lot if AI develops taste."}, {"id": 50646414, "au": "kaffekaka", "dom": 69, "sr": 127, "sc": -0.03, "ep": 1.16, "bs": 1.19, "d": 2, "age": 0.57, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 643, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "science_understanding", "flbl": "Science & Understanding (Ways)", "urls": [], "ig": 0.495, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "This is the utopia. Humanity maturing into a Star Trek-like existence.\n\nBut is it at all likely?"}, {"id": 50644312, "au": "giladd", "dom": 8, "sr": 128, "sc" /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
