gurative sense, and despite being aware that generalisations like these aren't really rooted in reality, I'm just a salty millennial getting shafted by society once again."}, {"id": 50665259, "au": "cromka", "dom": 250, "sr": 249, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 2, "age": 12.93, "grav": 129.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 4605, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.928, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "if there was a NixOS based distro but with Debian governance that would be absolutely perfect for the severs (and desktop for that matter, too). I believe it's a niche that is still waiting to be filled and it would be a perfect distribution.\n\nIn fact I wish Debian did it themselves."}, {"id": 50667665, "au": "atmosx", "dom": 433, "sr": 250, "sc": 2.17, "ep": 3.37, "bs": 1.19, "d": 0, "age": 8.55, "grav": 69.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 31, "k": 6737, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.749, "fa": 0.42, "gp": 0.282, "bl": 0.45, "ds": 0.0, "txt": "> I find it somewhat ironic that AI, a technology largely dominated by big tech companies, is helping me become a little less dependent on those very companies in other areas of my digital life.\n\nUntil we're able to self-host models to produce and manage all the moving pieces on consumer hardware, there's not much irony involved; It's \"same old, same old\"."}, {"id": 50660675, "au": "alexpotato", "dom": 162, "sr": 251, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 2, "age": 24.77, "grav": 371.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7608, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.799, "fa": 0.0, "gp": 0.204, "bl": 0.0, "ds": 0.0, "txt": "LLMs that write and then update your Ansible really is the super combo.\n\nIf you throw in tests that the LLM also writes and it brings together the best of DevOps and LLM."}, {"id": 50662756, "au": "zinodaur", "dom": 179, "sr": 252, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 2, "age": 19.17, "grav": 243.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 528, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you want to share it with people without getting them to install something, yeah.\n\nI’ve been using a https reverse proxy with BasicAuth and strong passwords"}, {"id": 50661094, "au": "anonzzzies", "dom": 140, "sr": 253, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 3, "age": 23.8, "grav": 347.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 6684, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Our products are mostly not vibe coded but we are seeing this more and more; clients are replacing more and more just by using Claude code to make their own version of some module or app. It’s quite wild already; many of these people barely knew how to make a screenshot (they still cannot do that themselves but AI can) and now they are making apps for their business or department in a few weeks that replace things they paid for for years or even decades."}, {"id": 50662751, "au": "NegativeLatency", "dom": 422, "sr": 254, "sc": 2.15, "ep": 2.15, "bs": 0.0, "d": 1, "age": 19.18, "grav": 243.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4285, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.917, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Would recommend home assistant if you’re not using it already. It’s a nice place to land the data for stuff like your solar panels"}, {"id": 50662226, "au": "zeendo", "dom": 295, "sr": 255, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 2, "age": 20.58, "grav": 273.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 256, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.891, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Exactly. I don't know why this gets overlooked by all the skeptics here.\n\nSmall and extremely bespoke software is just _nice_. You can have it easily now - especially if you are already competent. Why not do it?"}, {"id": 50661681, "au": "andai", "dom": 339, "sr": 256, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 1, "age": 22.17, "grav": 309.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.668, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "For the scenario where you will have power but not internet?\n\nI thought these days it's the reverse, the mobile network stays up when the power goes out!\n\n(Agree that self hosting is good though)"}, {"id": 50665000, "au": "dspillett", "dom": 46, "sr": 257, "sc": 2.09, "ep": 3.78, "bs": 1.7, "d": 6, "age": 13.48, "grav": 138.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.034, "bl": 0.64, "ds": 0.0, "txt": "I'm considering work time and hobby time separately. Work time is a constant in that I can't readily choose how much of it I have to account for in other matters.\n\nWhile work time is another matter, it does have an indirect impact: as I leave the tech world because I'm obsolete unless I join the AI religion I'll be earning a lot less so funding for more expensive hobbies will dry up…"}, {"id": 50662195, "au": "WarmWash", "dom": 158, "sr": 258, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 2, "age": 20.65, "grav": 274.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.887, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Maybe the ASI's first show of force will be to hack the internet and finally push everything to IPv6"}, {"id": 50664255, "au": "conradfr", "dom": 324, "sr": 259, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 2, "age": 15.16, "grav": 166.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 4144, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.886, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have a low end DS223j and I tried running containers in it (using the \"Container Manager\") but it would trash the disk performance, even when the container was basically idle.\n\nApparently it could be because of healthcheck, or a bug."}, {"id": 50666573, "au": "antihero", "dom": 225, "sr": 260, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 2, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 224, "qw": 0, "k": 7523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We're basically product owners/architects now. It's weird.\n\nYet nothing is stopping you picking up a sewing needle, spinning your own yarn, opening up your IDE, and just writing.\n\nSo you have to figure out what your priority is - the meditative process of building something and figuring things out, or the enjoyment of creating a result more holistically, or whether there's a balance to be struck.\n\nWe used to have long arguments about how many spaces to use for indentation, or whether to put a new line after an open brace. Are these arguments meaningless and irrelevant now? Or were they an important part of the process that we went through in our lives?\n\nDoes clinging to the past thing we enjoyed so much make you a dinosaur, or someone that hasn't lost their passion and soul?\n\nAs coding \"artisans\" we'll always have a love for creating with our own hands, and most people won't understand, because code doesn't have the same emotional connection for most in the same way that a physical object like a chair does, however nothing can take this from us.\n\nThe logical option is to master staying good at both - become as exceptional at using AI to solve problems as we were with characters on a screen and our raw brains, but retain the love and curiosity for the low level mechanisms that underpin it all."}, {"id": 50667204, "au": "Stolpe", "dom": 365, "sr": 261, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 2, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 59, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.866, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, that describes the risk per thing you host. If AI leads to hosting more things, the combined risk will inevitably multiply."}, {"id": 50665793, "au": "brabel", "dom": 69, "sr": 262, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 6, "age": 11.65, "grav": 110.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 8713, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.861, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s like being a billionaire, I guess. But what do you do about that? Be poor to appreciate anything you get no matter how little? Or try to adapt and find a way to enjoy the new power you have in a way or another?"}, {"id": 50662250, "au": "ambicapter", "dom": 341, "sr": 263, "sc": 2.01, "ep": 2.01, "bs": 0.0, "d": 2, "age": 20.52, "grav": 272.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 4181, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.854, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes? My internet goes out (always temporarily, I’ve never had it down for longer than a couple hours) way more often than my power (which never goes out)."}, {"id": 50669790, "au": "swat535", "dom": 11, "sr": 264, "sc": 1.92, "ep": 1.92, "bs": 0.0, "d": 3, "age": 5.42, "grav": 36.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 4264, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.819, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My biggest worry is that just like the Internet, this era will also be regulated, locked down and restricted.\n\nOpen source models are actively under threat by Anthropic, OpenAI and others since it poses great danger to their bottom line.\n\nThe magic will eventually be killed the corporation, marketing, law makers and bean counters. I hope I am wrong but I've grown to be pessimistic over my long career in CS.."}, {"id": 50670611, "au": "ssl-3", "dom": 317, "sr": 265, "sc": 1.92, "ep": 1.92, "bs": 0.0, "d": 5, "age": 4.21, "grav": 26.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 5455, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.406, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is kind of like that, isn't it?\n\nBut if you can find someone who will appear instantly and work on my roof at any time of day or night for a flat $20 per month, please sign me up.  :)"}, {"id": 50663262, "au": "cyber_kinetist", "dom": 373, "sr": 266, "sc": 1.87, "ep": 1.87, "bs": 0.0, "d": 0, "age": 17.61, "grav": 212.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2423, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.423, "fa": 0.0, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "Though the hardware is so expensive now because of AI... it's probably the worst time for you to buy a new server."}, {"id": 50664712, "au": "bigbuppo", "dom": 307, "sr": 267, "sc": 1.84, "ep": 1.84, "bs": 0.0, "d": 2, "age": 14.13, "grav": 149.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1490, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.783, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh, all that definitely helps. And I should note I have a high tolerance for ceremony and ritual... I write Ada and COBOL regularly. One of those is for work, the other is for fun."}, {"id": 50668772, "au": "bicepjai", "dom": 394, "sr": 268, "sc": 1.83, "ep": 1.83, "bs": 0.0, "d": 0, "age": 6.86, "gr ate change, we'd at least learn to care about the world the next generation is inheriting. Surely just getting to \"make the video game of our dreams\" wouldn't be a strong enough sedative to wash all those concerns away.\n\nFew years later, I stand corrected and also without any optimism left. My only solace is that I still have plenty of friends who are actively resisting getting pacified by the narrative that it's \"just the next stage in our evolution\" and we should somehow be grateful to our new mechanical Gods. But it doesn't do much when watching the whole of society fall apart in real time"}, {"id": 50661382, "au": "simplesocieties", "dom": 200, "sr": 271, "sc": 1.71, "ep": 1.71, "bs": 0.0, "d": 1, "age": 22.97, "grav": 327.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 93, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.599, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "I have a few raspi throwaway servers I don't really care about losing data on, so I wanted to try firefighter but couldn't because I use claude subscription rather than API key billing. Any plans to support users on subscriptions?"}, {"id": 50661057, "au": "noosphr", "dom": 118, "sr": 272, "sc": 1.67, "ep": 2.86, "bs": 1.19, "d": 1, "age": 23.91, "grav": 350.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 3635, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.392, "fa": 0.0, "gp": 1.337, "bl": 0.45, "ds": 0.0, "txt": "We are entering levels of bipolar lisp developer never before seen in the history of programming."}, {"id": 50665505, "au": "ciefa", "dom": 474, "sr": 273, "sc": 1.55, "ep": 1.55, "bs": 0.0, "d": 0, "age": 12.31, "grav": 120.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, e is no MITM and therefore no need for TLS.\n\nOr if something like SSH rather than HTTPS, you've got TOFU instead of PKI."}, {"id": 50665846, "au": "tarsinge", "dom": 27, "sr": 429, "sc": -4.34, "ep": 1.68, "bs": 6.02, "d": 5, "age": 11.54, "grav": 108.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 3460, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.122, "bl": 2.27, "ds": 0.0, "txt": "You can run decent local models on Apple Silicon MacBooks, so yes it’s affordable if you’re in tech and at ~65W-100W it should be very low in the environmental priorities in your lifestyle.\n\nRegarding owning what was stolen, my point is that since models were trained on all human knowledge, I don’t see the moral issue if everyone can own them, as is the case with open weights."}, {"id": 50665976, "au": "sedictious", "dom": 112, "sr": 430, "sc": -4.36, "ep": 1.66, "bs": 6.02, "d": 6, "age": 11.33, "grav": 105.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 13, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.705, "fa": 0.0, "gp": 0.0, "bl": 2.27, "ds": 0.0, "txt": "I don't think what I said contradicts your framing but I also don't agree with it entirely. There absolutely is an asymmetry with regards to who gets effected and I would even agree with your framing it as genocide. But I don't know how it follows that it has no effect on the whole world. It is not like the natural habitat in Europe (and I guess US though can't speak from experience) hasn't seen the effects of pollution, global warming, deforestation and littering. Just the air we breath has significantly decreased in quality.\n\n> The lack of care is not for the world but for the people.\n\nThe \"world     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
