 bootc user I can say that Ansible is not a replacement for bootc. Big point of bootable images is that a lot of problems now happen during image building and not during update/deployment. Although I use bootc for my desktop OS, not homelab."}, {"id": 50663687, "au": "wickedsight", "dom": 480, "sr": 152, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 0, "age": 16.54, "grav": 191.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 5559, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.427, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "I've had an Oracle free tier server sitting around useless for years. For the last few days I've spent most of my token budget on setting up a project to easily be able to vibe code some apps and deploy them there behind a Cloudflare tunnel for access. It's amazing what you can achieve now in just a couple of hours of actual work."}, {"id": 50665564, "au": "LytraX", "dom": 224, "sr": 153, "sc": 3.83, "ep": 6.35, "bs": 2.52, "d": 1, "age": 12.15, "grav": 117.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.807, "fa": 0.34, "gp": 0.779, "bl": 0.95, "ds": 0.0, "txt": "I am a programmer for almost 30 years now, I have written a lot of code in my life.\nHaving AI agents write the code does not mean you are making a product with AI; for all my projects, I need to set targets, what features it needs, what the architecture will be, the supported platforms and how to handle limitations, establish and check license compatibility, decide on infra, countless things that Leads/Heads would do having to take decisions. The fact that AI agents can assist me with writting code is just an accelaration for me under my guidance.\n\nSolving problems and writting code was fun indeed. I have dozens of unfinished projects that I lost motivation after starting them over time. Now, if I care to create and finish a project, then AI will help me reach that goal."}, {"id": 50661774, "au": "Grombobulous", "dom": 187, "sr": 154, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 1, "age": 21.93, "grav": 303.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 2762, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": "Cloudflare Tunnels and Cloudflare Access used together pretty much eliminate this worry for the average person.\n\nNo ports exposed, all outgoing traffic, and Cloudflare won’t let you actually reach the service until you provide a service token or do an email 2FA from an authorized email domain/address."}, {"id": 50660705, "au": "selcuka", "dom": 207, "sr": 155, "sc": 3.81, "ep": 3.81, "bs": 0.0, "d": 2, "age": 24.73, "grav": 370.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 5319, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Unattended upgrades will only patch system packages installed via apt-get. You still need to patch node, python packages, or random software you downloaded and installed (via curl piped to sh)."}, {"id": 50663391, "au": "hizlikovboy27", "dom": 427, "sr": 156, "sc": 3.79, "ep": 3.79, "bs": 0.0, "d": 0, "age": 17.27, "grav": 205.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 14, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.224, "fa": 0.0, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "Yes, I understand you very well. I can now experiment with server related tasks wich I previously couldnt undertake due to a lack of time or energy much more easily and comfortably."}, {"id": 50663499, "au": "Fire-Dragon-DoL", "dom": 401, "sr": 157, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 2, "age": 16.99, "grav": 200.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2056, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.265, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Agree! My point was mainly targeted at stuff that introduce complexity by introducing \"hosting\" in the mix, when they can be applications that don't even need to be installed, just pure html pages on `file://` protocol (and of course, on http too)"}, {"id": 50665829, "au": "zedascouves", "dom": 101, "sr": 158, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 1, "age": 11.58, "grav": 109.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 30, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.291, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "Give AI ssh access to your VPS.\n\nHave to install coolify.\n\nConnect AI to CloudFlare.\n\nCreate a deployment skill (global on your pc)\n\nThen you just say: do this project and deploy in subdomain.domain.com\n\nCould not be easier."}, {"id": 50663612, "au": "kuboble", "dom": 66, "sr": 159, "sc": 3.75, "ep": 3.75, "bs": 0.0, "d": 5, "age": 16.71, "grav": 194.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1322, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.031, "fa": 0.34, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "It's much easier to spoil a baby than an adult.\n\nIf you grew up poor and you were poor way into your adulthood - You can't get spoiled like a kid.\n\nMy mom still can't stop appreciating little things like a warm bathroom, despite having this luxury for over 30 years.\n\nI think people who get the dream machine at the age of 50 won't ever stop being amazed by it."}, {"id": 50664390, "au": "Philip-J-Fry", "dom": 97, "sr": 160, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 5, "age": 14.89, "grav": 162.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3853, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.402, "fa": 0.0, "gp": 0.304, "bl": 0.0, "ds": 0.0, "txt": "They're not shitting on their friend. They are just bolstering the point that someone who doesn't know what they're doing will still create a monstrosity with AI.\n\nAny decent software developer would tell it to tell it load game assets from image files/sprite sheets/3d models, etc. the first second they saw it trying to generate this stuff in code."}, {"id": 50665399, "au": "Iolaum", "dom": 369, "sr": 161, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 1, "age": 12.57, "grav": 124.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1806, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.094, "fa": 0.34, "gp": 0.11, "bl": 0.0, "ds": 0.0, "txt": "For things that can be \"one-shotted\" or close to that maybe.\n\nBut for things you need a 1000x AI engineer merging 1k+Pr's a month while maintaining software and product quality, that SaaS will be fine."}, {"id": 50661840, "au": "pmarreck", "dom": 19, "sr": 162, "sc": 3.7, "ep": 10.85, "bs": 7.16, "d": 2, "age": 21.73, "grav": 299.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 2, "w": 115, "qw": 0, "k": 6964, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": ["https://pmarreck.github.io/quiet_depths/", "https://github.com/pmarreck/quiet_depths", "https://www.youtube.com/watch?v=Mt_8AlXr_dg"], "ig": 1.677, "fa": 2.08, "gp": 0.678, "bl": 2.7, "ds": 0.0, "txt": "Same exact feels. I mean, I can just vibe out a browser submarine game? On the side? And it's actually fun?? Just because I had a hankering for some Gato/Silent Service feels?? (dates me, but I don't care, I've seen some shit)\n\nhttps://pmarreck.github.io/quiet_depths/\n\n(source @ https://github.com/pmarreck/quiet_depths)\n\nNot to mention the countless config enhancements it's helped me make for my various machines and dev environments\n\nOf course there's some slop to deal with here and there (it helps if you have good controls and test methodology), but I just don't understand the negativity. I enjoyed coding as much as the next guy, but apparently I enjoyed CREATING things MORE. And I get to do SO MUCH MORE of that now!\n\nEDIT: https://www.youtube.com/watch?v=Mt_8AlXr_dg (GATO gameplay on the Mac) https://www.youtube.com/watch?v=3I8NVD6esNE (Silent Service 2)"}, {"id": 50670349, "au": "matthewfcarlson", "dom": 122, "sr": 163, "sc": 3.67, "ep": 3.67, "bs": 0.0, "d": 1, "age": 4.63, "grav": 30.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1999, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.442, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "The classic adage is that an idea is worth very little since execution was magnitudes more effort. Now that ideas can be executed effortlessly with vibe coding and done well with slightly more effort and expertise, is an idea worth more? I find clankers to be terrible at coming up with actually good ideas."}, {"id": 50664472, "au": "arjunmahishi", "dom": 410, "sr": 164, "sc": 3.66, "ep": 6.18, "bs": 2.52, "d": 0, "age": 14.7, "grav": 158.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.251, "fa": 0.68, "gp": 0.897, "bl": 0.95, "ds": 0.0, "txt": "Great post!\n\nI was able to revive my old collage laptop that I hadn't used for over 8 years. I cleaned it up,installed Debian 13, setup cloudflared and hermes. It's working so well. Made me so happy that I was able to reuse that laptop!"}, {"id": 50669217, "au": "visarga", "dom": 28, "sr": 165, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 6, "age": 6.21, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 13944, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.145, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The \"stolen\" framing, if we needed the training data itself we would get it directly by copying, downloading or storing it on hard drives, not generating it bootleg from LLMs. We use AI because we need something else than is in all the training examples. We need contextualized responses. Why burn $1B to train a worse cp."}, {"id": 50660478, "au": "onaclov2000", "dom": 406, "sr": 166, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 0, "age": 25.13, "grav": 380.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 70, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.012, "fa": 0.0, "gp": 0.882, "bl": 0.0, "ds": 0.0, "txt": "Self hosting at home is a blast!\n\nI run my AI stuff in docker containers so I am still working on ways to improve idea to actually working thing I can interact with, without having to go to a computer necessarily"}, {"id": 50663297, "au": "spunker540", "dom": 100, "sr": 167, "sc": 3.64, "ep": 3.64, "bs": 0.0, "d": 1, "age": 17.52, "grav": 210.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1231, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.091, "fa": 0.0, "gp": 0.742, "bl": 0.0, "ds": 0.0, "txt": "I really agree with this dichotomy— I’ve never been having so much fun and felt such a shortage of time to pursue the many personal projects I want to create, and at the same time, I’ve never found my job as a swe to be more intolerable, demotivating and isolating."}, {"id": 50665915, "au": "maybewhenthesun", "dom": 329, "sr": 168, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 0, "age": 11.44, "grav": 107.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 542, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "Hard disagree. AI made self-hosting a nightmare with the amount of updating I need to to to stay on top of all the AI discovered CVEs\n\nI (temporarily I hope) shut down all my self hosted websites /services."}, {"id": 50664425, "au": "fooddiesbeforea", "dom": 267, "sr": 169, "sc": 3.62, "ep": 6.14, "bs": 2.52, "d": 2, "age": 14.82, "grav": 160.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 16, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.722, "fa": 0.42, "gp": 0.616, "bl": 0.95, "ds": 0.0, "txt": "> and what do you do if and when you decide to let your Claude subscription lapse?\n\nI'll be to worried about how to feed myself and my wife.\n\nTraining AI models is the the LION'S SHARE of AI Lab expenditure right now. IF everyone stopped, we'd still have current models, at a cheaper rate. And in the worst case scenario where every AI lab has a fire at the same time my house floods, I'll still hopefully be able to buy a computer with the insurance money and ask my friend who has an abliterated model capable of generating code (and porn) a copy.\n\nUnless my friend also had their copy destroyed, at which point, I'll be asking YOU why are you talking about Claude of all things in the middle of an alien invasion."}, {"id": 50670469, "au": "akho", "dom": 7, "sr": 170, "sc": 3.6, "ep": 3.6, "bs": 0.0, "d": 6, "age": 4.45, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 979, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are low-energy books. The shortest of the short stories; some poetry collections.\n\n(I think the main energy sink is context you need to keep in mind and update; hence why doomscrolling works so well, and why I think short pieces work as replacement)\n\nAnki review may work, too."}, {"id": 50660709, "au": "AntonJidkov", "dom": 405, "sr": 171, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 0, "age": 24.72, "grav": 370.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 9, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.988, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "So much more fun! I'm now turning my old phones into servers for all the side projects I'm spinning up.\nPre ai I would have had zero inclination to go through the setup and maintenance process."}, {"id": 50662189, "au": "baseh", "dom": 425, "sr": 172, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 0, "age": 20.65, "grav": 275.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 63, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.062, "fa": 0.0, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "I find using railway.com/templates quickest way to pre-test self-hosting packages. Even if you dont host in railway - the Agent feature allows to connect your Claude code to add custom features and tailor any self-hosted to your liking"}, {"id": 50661207, "au": "hparadiz", "dom": 169, "sr": 173, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 5, "age": 23.45, "grav": 339.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 2303, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not really no. I tend to think everyone should be building their entire stack from source these days. I don't know why these distros with binaries pre-compiled are so popular these days when an LLM can fork it for you at any time. Especially among the Nix crowd. Like why would you want someone else to compile your software? I mean this seriously. Between you and bare metal there's really not that much. Linux kernel? 20 minute compile. Grub2, OpenRC / Systemd / sddm, kde or hyprland w/e, the browser is actually the thing that will take the longest to build. So do it. There's no excuses anymore. You can do it while you sleep."}, {"id": 50664363, "au": "sham1", "dom": 223, "sr": 174, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 1, "age": 14.94, "grav": 162.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 440, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.356, "bl": 0.0, "ds": 0.0, "txt": "I've reached a similar conclusion, which is why I refrain from using AI for hobby things. My homelab is for me to experiment with stuff and maybe to learn something, not to let the robot do all the thinking and work for me.\n\nI understand that some people like the idea of opportunity cost having gone down with the ability to just throw a problem to the robot and have it solve it, but I dunno. My hobby is computers, not AI, so I'd rather do the hobby instead of automating it away. It's like with art, I like the human aspects even if the AI can also do all the things for me."}, {"id": 50663522, "au": "r_lee", "dom": 68, "sr": 175, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 5, "age": 16.94, "grav": 199.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 45, "k": 1407, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.889, "fa": 0.42, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "> What I didn’t know at the time, and what the people in this thread still haven’t learned, is that being able to receive everything you want in minutes just devalues it; you play with it a bit and you have already moved to the next shiny idea.\n\nexactly. I've learnt this a long time ago, and seeing people say how they can everything they've ever wanted with LLMs like this just instantly made me think of this\n\nit'll get real old real fast."}, {"id": 50664861, "au": "talkin", "dom": 252, "sr": 176, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 1, "age": 13.79, "grav": 143.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 210, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.361, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "Yes, for risk reasons, you might want to wait till the current CVE wave has leveled up all projects and the volume is lowered a bit. But who knows if that’ll be 6 or 24 months…\n\nIt would be quite welcome to reach less stressful times ;)"}, {"id": 50665520, "au": "jwoq9118", "dom": 440, "sr": 177, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 1, "age": 12.26, "grav": 119.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 63, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.453, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They are entirely unbothered. Most consumers are not tech people. They don't care that they can self host, they pay for convenience. They're not about to use Claude Code or Codex or Lovable or anything and build their own cloud. Paying that fee every month so they can use what's convenient is fine by them. They already have their stuff organized in iCloud. They're not going to sit down and build their own cloud and set up all this stuff and migrate their photos. These are normal everyday people. We often lose site of this on this website. Most of everyone on earth is non-techy."}, {"id": 50661924, "au": "snailcoder", "dom": 431, "sr": 178, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 0, "age": 21.48, "grav": 293.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 24, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.977, "fa": 0.0, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "I’ve used it to take us to full Infra as code. All boxes can be deployed via terraform and ansible. Haven’t automated state management yet but it’s been awesome to move the needle on these items that otherwise I would’ve neglected."}, {"id": 50666762, "au": "whilenot-dev", "dom": 258, "sr": 179, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 2, "age": 9.9, "grav": 86.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1305, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.388, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It sure is a firewall issue, but I'd just expose WireGuard and block any ICMP requests. For anything public I'd use Cloudflare tunnels.\n\nWireGuards \"Silence is a Virtue\"-philosophy seems like the right approach to counter DoS attacks, and it makes fail2ban redundant. I'd just never expose SSH ports at all, and won't use any remote management products (Synology QuickConnect, UniFi Remote Management etc.). Just connect via WireGuard and make use of the LAN."}, {"id": 50663805, "au": "_the_inflator", "dom": 52, "sr": 180, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 2, "age": 16.25, "grav": 186.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2253, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "I tried roughly two years ago using AI for assembler coding on Amiga 500. And it was a joke.\n\nThe same result for C64.\n\nJust two days ago accidentally I talked over the art of doing side border action on C64 with Claude - and this time it felt like I talked to an elite scene demo coder.\n\nHighly impressive."}, {"id": 50661395, "au": "dyauspitr", "dom": 500, "sr": 181, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 0, "age": 22.94, "grav": 327.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.966, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI made everything fun again. I fell out of love with writing code like 3-4 years into my career and now I can implement all my ideas again. I’ve made a version of pretty much every single app I use regularly."}, {"id": 50664045, "au": "jjak82", "dom": 447, "sr": 182, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 0, "age": 15.62, "grav": 175.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 45, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "So true. The HW cost inflation is annoying.  On the other hand, constraints makes for interesting engineering also."}, {"id": 50663454, "au": "petesergeant", "dom": 268, "sr": 183, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 2, "age": 17.1, "grav": 202.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Honestly? Planning for a future where no LLMs are available sits outside my risk posture. Whatever has happened to get us there, I suspect my dinky little home services will be the least of my worries."}, {"id": 50662535, "au": "leovander", "dom": 346, "sr": 184, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 1, "age": 19.74, "grav": 255.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 347, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.268, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "You want Jellyfin with the Seer plugin. Regarding the torrent stuff, if you have Prowlarr, switch your private torrent trackers to a few paid usenet indexers and hosts, they can be used in Prowlarr as well to send off to sabnzbd or nzbget.\n\nMake sure you are using the https urls and you don't have to worry about fussing around with the vpns and slow dl speeds. You will get your full bandwidth of usage, your only bottleneck will be how beefy your NAS is since unzipping the files is the most intensive."}, {"id": 50667253, "au": "notesinthefield", "dom": 232, "sr": 185, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 1, "age": 9.18, "grav": 77.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 371, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "AI forced me to realize I only engage with computing for financial gain now, I haven’t found a single new piece of tech interesting in years. I’m thankful I at least can automate the mundane away."}, {"id": 50661119, "au": "DaveChurchill", "dom": 323, "sr": 186, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 1, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 99, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.265, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "I was doing the same thing as you but eventually moved all my hosting off the synology itself to a Dell optiplex micro sitting next to it. I've noticed performance of the NAS go up a lot since then\n\nThe only thing I run on the NAS now is qbittorrent so that it can write downloads directly to the drives instead of duplicating the traffic over the network."}, {"id": 50660607, "au": "_def", "dom": 464, "sr": 187, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 0, "age": 24.89, "grav": 374.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1393, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.515, "bl": 0.0, "ds": 0.0, "txt": "it made me move away from docker to ansible managed lxc containers on proxmox. Not sure yet if that was a good idea but on the other hand I don't have to do most of the plumbing anyway, so.. i guess it's fine?"}, {"id": 50662761, "au": "0xpgm", "dom": 208, "sr": 188, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 3, "age": 19.15, "grav": 242.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 818, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "For my needs, to minimize the manual effort, I limit my dependencies to those that come with the default distro repositories. I know it's not possible for each single application one may want to self-host, but there's already a lot that is possible by sticking to the default repos."}, {"id": 50661903, "au": "tempest_", "dom": 244, "sr": 189, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 3, "age": 21.54, "grav": 294.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2573, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.314, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have not really had that experience though I suppose it could happen if you let it plan ahead.\n\nWhat I do have happen is if I ask for an accessible html page it will spin up a python server script somewhere. It does this I assume because the existing code in the repository has python and this heavily biases its approach."}, {"id": 50672285, "au": "jinpan", "dom": 184, "sr": 190, "sc": 3.08, "ep": 3.08, "bs": 0.0, "d": 1, "age": 1.07, "grav": 7.5, "surf": 49.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 113, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "for side projects, i have a locked down container running within gcp cloud run services, with automated redeployments of updated dependencies.  bit costlier than a bare vm but it generally means i don't need to think about security as much."}, {"id": 50663860, "au": "flyby25", "dom": 377, "sr": 191, "sc": 3.06, "ep": 5.58, "bs": 2.52, "d": 1, "age": 16.11, "grav": 183.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 11, "k": 2, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.272, "fa": 0.64, "gp": 0.53, "bl": 0.95, "ds": 0.0, "txt": ">All those janky apps will be hacked over and over again.\n\nIt is unlikely that your instance will get so much as a glance from the people with the ability (albeit the bar has lowered AI), or the motivation to use exploits against some random's home server. What do they stand to gain going after your setup vs a small/medium sized business?"}, {"id": 50665668, "au": "LytraX", "dom": 448, "sr": 192, "sc": 3.05, "ep": 5.57, "bs": 2.52, "d": 0, "age": 11.94, "grav": 114.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.483, "fa": 0.34, "gp": 0.766, "bl": 0.95, "ds": 0.0, "txt": "I am self-hosting since 2005. It is nice if you really need it but I have to keep an eye on what is exposed, especially nowadays with all those CVEs.\nI now have a web server with some pages on a Macmini server only accesible to my LAN and I even check that for compromises frequently.\n\nBut frankly, other than home/office automation, I don't find any good reason to self-host anything; I could self-host my blog and say I don't care for power surges, but then I'd have to worry if the server is good isolated from the rest of my LAN and more security risks."}, {"id": 50665065, "au": "RobertSponge", "dom": 254, "sr": 193, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 1, "age": 13.37, "grav": 136.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Are you exposing your services to the internet?\n\nI tried doing security audit for my home network and homelab setup with opus-5-5 but claude quickly flagged my session and forced me to continue with opus-4. it said all green but i’m not sure if i can trust it :/"}, {"id": 50664825, "au": "AlfeG", "dom": 160, "sr": 194, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 2, "age": 13.87, "grav": 144.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 332, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.288, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Due to some limitations I cannot use Tailscale - so I started to put my services behind Iroh network. And it goes a bit too much. I even use Iroh on Pocketbook to access torrent served flibusta library service."}, {"id": 50668018, "au": "NateEag", "dom": 37, "sr": 195, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 6, "age": 8.01, "grav": 63.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2832, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For a lot of us, joining them is even less fun, and a massive violation of what we value in life.\n\nI have a mortgage and kids to take care of, so at work I'm gritting my teeth and doing what I'm required to, but I'm every other context I'm actively working to avoid using the bots or anything they've output."}, {"id": 50662035, "au": "RajT88", "dom": 95, "sr": 196, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 3, "age": 21.15, "grav": 285.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 8588, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.285, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A friend of mine is non-technical and vibe coded a browser based point and click adventure game.  It has a ton of bugs.\n\nIt also is ~500k, and every graphic and animation is CSS and JavaScript.  It's hilarious and totally mental.  There is no static art, everything is CSS defined shapes."}, {"id": 50660360, "au": "jraph", "dom": 356, "sr": 197, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 0, "age": 25.34, "grav": 385.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 13740, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.589, "fa": 0.0, "gp": 1.111, "bl": 0.0, "ds": 0.0, "txt": "It did the opposite: self hosting has been fun, but now you have to fight the constant flow of AI bots."}, {"id": 50661470, "au": "mathplebe", "dom": 22, "sr": 198, "sc": 2.99, "ep": 5.51, "bs": 2.52, "d": 3, "age": 22.77, "grav": 323.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.747, "fa": 0.0, "gp": 0.97, "bl": 0.95, "ds": 0.0, "txt": "You can still do it! Honestly the vibed stuff is frivolous. Without human input, they are still just toys.\n\nMy preferred approach is still AI augmenting my workflow and making the easy stuff easier. I find myself wanting to work on my shell-fu and work like an AI with find, grep, sed, awk.\n\nAI is living in this alternate universe where a GUI didn’t have to exist and it’s more productive there with basic tools which I find inspiring.\n\nIf you’re worried about environment maybe use a local hosted solution on modest hardware. At least then you know the energy footprint and can get some of the benefits too.\n\nOR just stay old school and code by hand. That still can provide enjoyment."}, {"id": 50665254, "au": "onel", "dom": 105, "sr": 199, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 12.95, "grav": 130.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 81, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "And you should go for it, really no reason to feel bad. If this is the only win that we get from AI, custom made software, it will still be huge.\n\nI think corporate will get better as they use ai, their software will get close to the mean and suck less"}, {"id": 50661492, "au": "sega_sai", "dom": 426, "sr": 200, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 0, "age": 22.73, "grav": 321.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5092, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.803, "fa": 0.0, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "I also recently discovered how easy it was to update an out-of date O/S with agents on a few machines that I manage. With Claude it was just so much easier and without worries that I would forget something or not know how to configure the new version of packages."}, {"id": 50660441, "au": "HolyLampshade", "dom": 298, "sr": 201, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 25.2, "grav": 382.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 463, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.15, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "Honestly I think these days those first two bits can be incentive enough. I’ve been self hosting a few apps (split between LLM hack jobs and some personal projects), and I’m just unwilling to pay for the ‘privilege’ of hosting the services or the data."}, {"id": 50668773, "au": "eli", "dom": 102, "sr": 202, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 6.86, "grav": 50.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 30561, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.081, "fa": 0.0, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "I’ve long thought the major AI companies should add a line to the prompt that the agent should search for similar existing projects whenever starting something new."}, {"id": 50663429, "au": "conrs", "dom": 391, "sr": 203, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 0, "age": 17.16, "grav": 203.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 68, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "We are in a wonderful era of bespoke software. I highly encourage you all to liberate yourselves from the platforms and their miserable UI's. And just for the record, I find HN's charming."}, {"id": 50661472, "au": "hoherd", "dom": 210, "sr": 204, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 3, "age": 22.77, "grav": 322.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1987, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.125, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "cron + topgrade -y will handle most of the userspace updates.\n\n`curl | sh` is a whole other ballpark though. that's not managed software, so of course you're going to have to manually update it. do you even remember what you've installed? i don't know how people think this is an acceptable way to install software."}, {"id": 50666521, "au": "antihero", "dom": 103, "sr": 205, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 1, "age": 10.31, "grav": 91.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.934, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "I get into a state where if I have an idea and decide it would be worth doing, the friction is so low to making it a reality, I feel almost compelled to. It's both amazing and scary."}, {"id": 50662240, "au": "0john", "dom": 261, "sr": 206, "sc": 2.86, "ep": 5.38, "bs": 2.52, "d": 1, "age": 20.55, "grav": 272.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 4, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.7, "fa": 0.0, "gp": 0.954, "bl": 0.95, "ds": 0.0, "txt": "What is your plan to maintain, and what do you do if and when you decide to let your Claude subscription lapse?\n\nI adopted a simple solution for my home server before LLM prevalence, which to this day I continue to use as the foundation.\nI spare the technical details, but the core principle is for it to be reasonable to recover/replace unassisted- which I believe to be the most important quality, perhaps tied with security.\nI'm interested in exploring new technologies and extensions, but I don't want to overcomplicate. I understand too well that I may drop interest at any point and leave it unfinished."}, {"id": 50663644, "au": "ozim", "dom": 89, "sr": 207, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 1, "age": 16.64, "grav": 193.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 7834, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.752, "fa": 0.0, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "AI changed everything for me.\n\nI implemented 5 apps that I always wanted but never had time to program those myself.\n\nNowadays I don’t have time to use those apps…"}, {"id": 50660381, "au": "1239876144", "dom": 434, "sr": 208, "sc": 2.83, "ep": 5.35, "bs": 2.52, "d": 0, "age": 25.3, "grav": 384.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 0, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://gmplib.org/"], "ig": 0.975, "fa": 0.62, "gp": 0.887, "bl": 0.95, "ds": 0.0, "txt": "Do people get an existential crisis if there is no new AI success story post for more than 10 min?\n\nHere are some folks who don't find self hosting easy or outsourcable to AI:\n\nhttps://gmplib.org/"}, {"id": 50672686, "au": "mattmanser", "dom": 221, "sr": 209, "sc": 2.82, "ep": 2.82, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 18249, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.2, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I wonder if it’s possible for those of you echoing this to change your perspective of what’s cool.\n\nI’m not saying you’re wrong, I’m saying isn’t it a matter of perspective? There’s plenty of cool things that aren’t shaders.\n\nI remember reading about the creators of super meatboy spending weeks getting the movement and jumps to feel just right. Changing the physics to be less realistic to make the movement more fluid.\n\nSo instead of getting obsessed about the waves in a game, can you instead get obsessed on how you use the waves as a game mechanic?"}, {"id": 50661577, "au": "someonehere", "dom": 446, "sr": 210, "sc": 2.82, "ep": 2.82, "bs": 0.0, "d": 0, "age": 22.45, "grav": 315.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 963, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "It really has. I have so many things running on old computers now at my home with the help of Claude. The last time I had this much fun building out things in a homelab was during the Covid lockdowns."}, {"id": 50663375, "au": "fireant", "dom": 163, "sr": 211, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 3, "age": 17.32, "grav": 206.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 135, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How do you reliably test ansible? I've been vibing ansible deployments at work instead of letting LLMs free roam on servers, but the deployment frequently works only on second or third try. The only way to do testing that I see is run a VM with a replica of the entire infra, which is infeasible for large or mixed legacy deployments..."}, {"id": 50667225, "au": "noitpmeder", "dom": 366, "sr": 212, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 3, "age": 9.22, "grav": 77.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1536, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.193, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah and if you think the risks outweigh the benefits then agreed the only solution is to stop doing it. I just don't think I'm at that point now. If AI figures out a way to let people hack into firewalled residental networks en-mass I'm sure we will have much larger things to worry about than my Project Zomboid server."}, {"id": 50666144, "au": "aaronax", "dom": 181, "sr": 213, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 4, "age": 11.01, "grav": 101.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 878, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A commercial version of this is Palo Alto firewall with User ID and Authentication Portal. It is typically used for internal network segmentation but I see no reason why it wouldn't work on the public side of things.\n\nOh, I guess your firewall itself would get owned pretty fast...the mgmt and other webpages hosted on the firewall tend to have a lot of CVEs which probably carries over to the Auth Portal too."}, {"id": 50661172, "au": "alana314", "dom": 456, "sr": 214, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 0, "age": 23.55, "grav": 341.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 191, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.658, "fa": 0.0, "gp": 0.837, "bl": 0.0, "ds": 0.0, "txt": "Lately I've been backing up and then having AI ssh in and fix the latest CVEs that have been hitting. So far it hasn't failed, and has saved me a lot of time."}, {"id": 50661173, "au": "rhines", "dom": 417, "sr": 215, "sc": 2.75, "ep": 2.75, "bs": 0.0, "d": 1, "age": 23.55, "grav": 341.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 242, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.99, "fa": 0.0, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "This is something I've been working on, just making a client I can run that encrypts any files I want to store on the cloud and has a DB for metadata. I'm sure there's plenty of existing tools for this but it's something I'm interested in so it's a fun project."}, {"id": 50661263, "au": "Trasmatta", "dom": 379, "sr": 216, "sc": 2.75, "ep": 2.75, "bs": 0.0, "d": 1, "age": 23.3, "grav": 335.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 9238, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "That's why you use a mini PC running on your home network and only access it via Tailscale / Headscale. There are still risks, but way way less than running services fully exposed to the Internet on a VPS somewhere."}, {"id": 50662072, "au": "Mikosa404", "dom": 31, "sr": 217, "sc": 2.72, "ep": 2.72, "bs": 0.0, "d": 3, "age": 21.0, "grav": 282.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1580, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "Lately I get angry a bit when I ask the llm to code something, and it goes and build everything. Then I have to decipher everything it wrote to make sure the resolution makes sense"}, {"id": 50662625, "au": "xgulfie", "dom": 350, "sr": 218, "sc": 2.7, "ep": 2.7, "bs": 0.0, "d": 1, "age": 19.5, "grav": 250.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 550, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.737, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have jellyfin with qbittorrent and a private tracker. No Arr stuff.\n\nqbittorrent's categories let me just click \"movie\" or \"show\" and it goes to the correct directory for jellyfin to find it. If I want to watch it now, I force sequential download and do some dishes for 5 minutes. By then it's usually playable.\n\nThis amount of friction is acceptable to me. It's more convenient than if Blockbuster was next door and gave me free rentals."}, {"id": 50662052, "au": "bigstrat2003", "dom": 472, "sr": 219, "sc": 2.7, "ep": 2.7, "bs": 0.0, "d": 1, "age": 21.09, "grav": 284.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 9847, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.148, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, to be blunt: self-hosting was always easy for anyone with the skills to work in a techy job. All the people going \"it's so fun and easy now thanks to AI\" have me scratching my head and wondering if they ever even tried before. It was always easy, and fun too. Adding an LLM into the mix doesn't actually improve anything here."}, {"id": 50662627, "au": "Pxtl", "dom": 51, "sr": 220, "sc": 2.69, "ep": 2.69, "bs": 0.0, "d": 3, "age": 19.5, "grav": 250.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 17739, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I still feel good about my hobby projects because they're not \"vibe coded\" but the LLM is doing a lot of PRs.  I'm used to writing requirements and reviewing what comes back, so I still make sure the craftsmanship is something I can stand behind even for dumb trivial crap.\n\nAnd I live in a place where the power is nuclear+hydro so using it in a local LLM is pretty guilt-free.  I also bought some credits on GreentPT when I want to bring in big the guns."}, {"id": 50664488, "au": "braedonwatkins", "dom": 196, "sr": 221, "sc": 2.69, "ep": 2.69, "bs": 0.0, "d": 1, "age": 14.66, "grav": 158.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.854, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "This was my thought exactly. I took a lot of my internet exposed stuff down because I know I'm on the wrong side of the dunning-kruger on cybersecurity and if the experts can't find stability in the current historical moment then I should probably think twice."}, {"id": 50667634, "au": "poisonborz", "dom": 396, "sr": 222, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 1, "age": 8.59, "grav": 69.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3547, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.118, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "Why not utilize quality open source apps that are already there and configurable instead of bootstrapping everything from zero. \"Photos\" alone is a huge topic, just displaying years of photos in an efficient way with endless scrolling is complicated enough, let alone searching etc."}, {"id": 50660499, "au": "DarmokJalad1701", "dom": 272, "sr": 223, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 1, "age": 25.09, "grav": 379.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1840, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.792, "fa": 0.0, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "I couldn't care less about knowing the details of how to configure some specific web app with all its quirks. What I do care about is not being nickel and dimed by subscriptions for every little thing."}, {"id": 50665845, "au": "sedatk", "dom": 359, "sr": 224, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 0, "age": 11.55, "grav": 109.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 7751, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.767, "fa": 0.0, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "The author wasn't clear about what he meant by \"self-hosting\", but if he meant self-hosting web pages, or other kinds of public facing servers, this is the worst time to self-host anything that's exposed to Internet."}, {"id": 50667978, "au": "andai", "dom": 342, "sr": 225, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 3, "age": 8.08, "grav": 64.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.122, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Interesting. Yeah it's opposite situation in Eastern Europe. Mobile network has been stable for 10+ years but power is still a bit dodgy (getting better though)."}, {"id": 50661540, "au": "_kb", "dom": 183, "sr": 226, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 2, "age": 22.55, "grav": 317.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 3663, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.117, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This applies in general. You can do a lot of cool things, across many domains. Only a very minute slice of that should ever be internet reachable.\n\nThe biggest boon of AI boosted vulnerability discovery / exploit development is defence in depth is something that is more widely considered and applied."}, {"id": 50664298, "au": "hypfer", "dom": 109, "sr": 227, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 3, "age": 15.08, "grav": 165.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.885, "fa": 0.0, "gp": 0.368, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't worry too much about that though.\n\nHumans still crave shared and curated experiences, and AI might not be able to actually fake that.\n\nIt might be good, actually, for people to get their hyper-individualized thing to notice that it eventually becomes worthless because there's no meaning to it.\n\nOr maybe I overestimate the humanity of our fellow humans and they will run with it like catnip"}, {"id": 50667131, "au": "noitpmeder", "dom": 364, "sr": 228, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 1, "age": 9.34, "grav": 79.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1536, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean it comes down to what method you think has a higher chance of getting it wrong (ex, deploying something insecurely): a human with no intimate experience, or an AI."}, {"id": 50668807, "au": "brachkow", "dom": 314, "sr": 229, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 3, "age": 6.81, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 102, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yes, this was the meaning\n\ni was unlucky doing some NixOS from scratch by hand, and while I liked idea this was painful\n\nnow i can enjoy idea without writing nix configs"}, {"id": 50661329, "au": "spullara", "dom": 13, "sr": 230, "sc": 2.58, "ep": 2.58, "bs": 0.0, "d": 2, "age": 23.11, "grav": 331.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 10261, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.475, "fa": 0.34, "gp": 0.341, "bl": 0.0, "ds": 0.0, "txt": "using LLMs to look at my 8th grade Commodore 128 code is just insane. it found a few bugs but they were pretty extreme edge cases :)"}, {"id": 50666088, "au": "r_lee", "dom": 70, "sr": 231, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 7, "age": 11.11, "grav": 102.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1407, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the latter is the right way, but I think it's just not going to last very long that whole \"magical\" feeling\n\nbut being able to do more higher quality, more complex software I think is a nice thing. I'd say that's the real plus vs just pushing out as much shit as possible"}, {"id": 50661280, "au": "dolebirchwood", "dom": 141, "sr": 232, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 4, "age": 23.26, "grav": 334.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 952, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 0.824, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "This is where people complaining about the \"end of my career\" should be paying attention. There's tons of opportunities for contracting and consulting to help small and mid-sized businesses create custom solutions for their tech problems that they were never able to afford in the past. Now there are actually cost-effective options on the table, but most business owners still don't want to deal with it themselves. Now you can be a whole software engineering at a fraction of the old world cost. I've already got months of work lined up that would not have been here for me pre-AI.\n\nYes, this means people will have to be entrepreneurial, have people skills, put yourself out there, actually be a member of your community, and not just coast as a code-writing cog in your dark corner of a corporate machine. If that's not for them, well... more for me, I guess."}, {"id": 50664763, "au": "paxiongmap", "dom": 104, "sr": 233, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 14.01, "grav": 147.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 15, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.649, "fa": 0.0, "gp": 0.642, "bl": 0.0, "ds": 0.0, "txt": "I've started shutting down things I vibe coded because I could. Nothing too radical, just add ons to personal sites and customisations of deployments to OSS projects.\n\nDiscernment and living 'less is more' is the real differentiator when implementation effort is near free."}, {"id": 50662140, "au": "byzantinegene", "dom": 30, "sr": 234, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 3, "age": 20.8, "grav": 278.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 312, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.809, "fa": 0.0, "gp": 0.381, "bl": 0.0, "ds": 0.0, "txt": "agree, i get using AI to do the boring, menial parts of work. But for your hobbies? That's eliminating half the fun!"}, {"id": 50662202, "au": "mrheosuper", "dom": 348, "sr": 235, "sc": 2.42, "ep": 2.42, "bs": 0.0, "d": 2, "age": 20.64, "grav": 274.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My Arr stack has Radarr, but i was expecting something more like Netflix. I can just boot up jellyfin, choose movie i want to watch and watch.\n\nBack in the day, i use to watch pirated movies on web, and the experience is very like netflix(if you ignore the horrible ads of course)."}, {"id": 50660932, "au": "GCUMstlyHarmls", "dom": 288, "sr": 236, "sc": 2.38, "ep": 2.38, "bs": 0.0, "d": 1, "age": 24.23, "grav": 357.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 634, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.899, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "I think this is just a repeat of why some people are programmers (lifestyle[0]) and some people are programmers (career[1]).\n\nSome people just like fiddling with servers, some people just ended up fiddling with servers because no one else would do it for them but now the agent can.\n\n[0] lifestyle: they wrote code before it was a job, they'll write code after they retire.\n\n[1]: career: it makes (made?) good money and they could do it but they would be equally passionate about being an accountant, network tech, sysadmin, ..."}, {"id": 50669532, "au": "icedchai", "dom": 23, "sr": 237, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 3, "age": 5.78, "grav": 40.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 10437, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.956, "fa": 0.0, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "It's \"fun\" building hobby projects with AI, but I find I quickly loose interest because I have very little personal investment in the process. That being said, I have built things with it that I would never have gotten around to."}, {"id": 50662319, "au": "wmichelin", "dom": 358, "sr": 238, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 1, "age": 20.3, "grav": 267.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 816, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.973, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Been having a ton of fun setting up my homelab as well. Running prometheus, grafana, several servers, ML training, all off of a PC that was collecting dust before. I never had the energy to go deep on this stuff outside of work hours."}, {"id": 50667104, "au": "wkjagt", "dom": 363, "sr": 239, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 0, "age": 9.38, "grav": 79.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1730, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.291, "bl": 0.0, "ds": 0.0, "txt": "For me AI made self hosting stressful. The more I hear about AI aided hacking, the more nervous I get about hosting stuff that's exposed to the internet."}, {"id": 50663424, "au": "debarshri", "dom": 444, "sr": 240, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 0, "age": 17.16, "grav": 203.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2276, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.58, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Fresh of the memory.\n\nOne of my customer was showing off the new helm stuff with agents. 5m aftee the agent ran helm uninstall, he realised he was connected to prod."}, {"id": 50662348, "au": "drnick1", "dom": 378, "sr": 241, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 1, "age": 20.2, "grav": 265.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 0.892, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "I have been running Debian stable with email and Web servers exposed to the Internet for years, and never had any security issue. So no, it's not foolish at all, and it is much better than handing over all your mail to Google or some other provider. The unattended-upgrades package take care of maintenance, it's is literally set and forget."}, {"id": 50663611, "au": "oliyoung", "dom": 265, "sr": 242, "sc": 2.25, "ep": 2.25, "bs": 0.0, "d": 2, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "
