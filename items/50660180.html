erms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 22}, {"category": "code_repository", "count": 9}, {"category": "investigative_or_tech_press", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["self-hosting", "ai", "fun", "changes", "tools", "home", "software", "server", "infrastructure", "git", "service", "container", "project", "help", "hosting", "makes", "automate", "interesting"], "largest_root": {"root_id": 50660901, "author": "cliche", "slots": 145, "start_dom": 1, "end_dom": 145, "share_pct": 29.0, "top_dom1_age": 24.3, "top_dom1_author": "cliche"}, "buried_cutoff": 150, "rescue_top_k": 80, "ablations": [], "tournament": [], "comments": [{"id": 50666101, "au": "antihero", "dom": 414, "sr": 1, "sc": 15.66, "ep": 15.66, "bs": 0.0, "d": 0, "age": 11.09, "grav": 102.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 375, "qw": 0, "k": 7523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://koan.rocks", "https://github.com/radiosilence/sift", "https://dither.win"], "ig": 2.156, "fa": 3.26, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "This is so true! Previously with self-hosting you had a myriad of options with debatable quality, mixed UX, inconsistent performance, many security issues.\n\nWith AI you can quickly build your entire own ecosystem of self-hosted tools that do exactly what you want, and if you are a developer already you have somewhat of a chance of building stuff that wont get you hacked.\n\nI have replaced:\n\n- Navidrome (https://koan.rocks)\n\n- beets (https://github.com/radiosilence/sift)\n\n- Imgur (https://dither.win / https://github.com/radiosilence/dither)\n\n- Drink logging apps (https://groglog.io)\n\n- Roon (https://koan.rocks)\n\n- play:Sub/foobar2000/Apple Music (https://koan.rocks)\n\n- Transmission (https://github.com/radiosilence/mariastew)\n\n- Nicotine/Slskd (https://github.com/radiosilence/slsk-mcp)\n\n- Fastmail's MCP (https://github.com/radiosilence/fastmail-cli)\n\n- Apple calendar MCP (https://github.com/radiosilence/caldav-cli)\n\n- Citymapper/TfL's API (https://github.com/radiosilence/tfl-mcp)\n\n- Wetherspoons app (https://github.com/radiosilence/spoons-mcp)\n\n- VPNs/Singbox (https://sbr.blit.cc)\n\n- watchman (https://github.com/radiosilence/watchwoman)\n\nWith tools that are made to a high quality specification I evolve, generally have more features, are lower resource usage and more performant, and share a consistent ecosystem and UI kits (datastar/askama on web, GPUI on desktop/phone), all built "}, {"id": 50664212, "au": "psviderski", "dom": 240, "sr": 2, "sc": 12.35, "ep": 12.35, "bs": 0.0, "d": 1, "age": 15.24, "grav": 168.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 122, "qw": 0, "k": 433, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://github.com/psviderski/uncloud"], "ig": 1.822, "fa": 2.08, "gp": 1.477, "bl": 0.0, "ds": 0.0, "txt": "The author does mention using Renovate + GitHub/Forgejo Actions to automate configuration updates and deployment. But it's not clear how those Compose files are actually deployed. I'd assume it’s just the good old 'git pull' on the server and 'docker compose up -d' as part of the actions workflow.\n\nI've done this, then used Ansible playbooks to deploy Compose services on separate servers, and my latest iteration is Uncloud (https://github.com/psviderski/uncloud) which solves both clustering and Compose deployment.\n\nSo if you want to deploy to multiple machines while still using the simple Compose format but don't want to go the k8s route, you may find Uncloud appealing. It's a CLI with commands similar to Docker so it's easy for AI agents to pick it up as well."}, {"id": 50665419, "au": "jwoq9118", "dom": 63, "sr": 3, "sc": 12.28, "ep": 12.28, "bs": 0.0, "d": 4, "age": 12.51, "grav": 123.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 168, "qw": 0, "k": 63, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": ["https://cmr.berkeley.edu/2023/03/are-tech-layoffs-a-major-disruption-or-a-just-minor-course-correction-from-past-excesses/", "https://www.insidehighered.com/opinion/views/2026/07/28/stop-telling-students-computer-science-dying-opinion"], "ig": 1.827, "fa": 2.42, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "Yes but when you look at the data and not the headlines it doesn't tell the story that AI has ended the software engineering profession.\n\nI don't think any of us truly think about what happened during COVID. Just one example, Microsoft grew headcount by 58%, from 114k to 228k. They started laying off before agentic coding was even a thing. Same story across big tech.\n\nAnd it's not over. Like, their headcounts are still way higher than pre-covid. Any layoffs the media and public says it's AI taking the jobs. But in many of these cases they're just trying to go back to headcount before COVID. Zuckerberg is a great example, hired the whole world to build his Metaverse thinking everyone will live online in the digital world always, covid is over, oh shoot i don't need you guys, AI is so good that's why I laid you off sure.\n\nhttps://cmr.berkeley.edu/2023/03/are-tech-layoffs-a-major-di...\n\nAnd the data also doesn't support jobs disappearing for new grads.\n\nhttps://www.insidehighered.com/opinion/views/2026/07/28/stop...\n\nAcross the internet we're slinging headlines and narratives without facts."}, {"id": 50663861, "au": "geek_at", "dom": 353, "sr": 4, "sc": 11.44, "ep": 11.44, "bs": 0.0, "d": 1, "age": 16.1, "grav": 183.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 169, "qw": 0, "k": 3757, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://pictshare.net/k84uxm.html", "https://pictshare.net/jdk9xk.html", "https://pictshare.net/j4q19c.html"], "ig": 2.174, "fa": 1.58, "gp": 1.264, "bl": 0.0, "ds": 0.0, "txt": "I also think (local) AI could be a way to make the Internet personal again. I've seen people who have no idea about webdev make good personal websites for their dogs, themselves and their hobbies with AI.\n\nDoesn't even have to be a frontier one for that. They all write very good HTML - even onepager sites in less than 5 minutes.\n\nI wrote a small wrapper that generates a random topic, takes images related to that topic from Pexels and then generates a single page site.\n\n- gemma-4-26B-A4B (Q4_K_XL, 57s): https://pictshare.net/k84uxm.html\n\n- gemma-4-12B (Q4_K_XL, 67s): https://pictshare.net/jdk9xk.html\n\n- Ling-3.0-tiny (Q4_K_M, 139s): https://pictshare.net/j4q19c.html\n\n- Qwen3.8-27B (exl3, 88s): https://pictshare.net/bk80zo.html\n\n- Qwen3.6-27B MTP (Q4_0, 205s): https://pictshare.net/89qwiv.html\n\n- Qwen3.6-27B Fable-Fusion finetune (IQ4_XS, 473s): https://pictshare.net/u72q1j.html\n\nPersonally I'm most impressed by Ling-3.0-tiny [1] it's small enough to run on basically any 8gb vram GPU. Might even be fast enough to run on CPU\n\nMore Ling-3.0-tiny (Q4_K_M) examples:\n\n- Vital Edge, fitness coaching (139s): https://pictshare.net/j4q19c.html\n\n- Artisan Roast Co., coffee roaster (102s): https://pictshare.net/r88upx.html\n\n- Verde Valley, music festival (98s): https://pictshare.net/i1dv33.html\n\n- Vitality Frame, fitness coaching (89s): https://pictshare.net/w11rh3.html\n\n- Vessel, album rel"}, {"id": 50661219, "au": "EGreg", "dom": 486, "sr": 5, "sc": 10.84, "ep": 10.84, "bs": 0.0, "d": 0, "age": 23.43, "grav": 338.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 70, "qw": 0, "k": 7910, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": ["https://github.com/Qbix/webserver", "https://github.com/SafeScript/safescript"], "ig": 1.585, "fa": 2.08, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "With the webserver I wrote this year in pure PHP, webhosting isn't just fun, it's now safe: https://github.com/Qbix/webserver\n\nInstead of PHP, I am using https://github.com/SafeScript/safescript which I invented. It works in both the browser and other environments (e.g. https://github .com/SafeScript/safescript-php)\n\nDrop files in folders. Things just work. Or, BYOB (Bring your own Bot) and it will use MCP to build and push your site. Any normie can go and make changes to their site, securely."}, {"id": 50662180, "au": "petesergeant", "dom": 289, "sr": 6, "sc": 10.81, "ep": 10.81, "bs": 0.0, "d": 2, "age": 20.68, "grav": 275.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 119, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://github.com/pjlsergeant/xslt-fever-dream"], "ig": 1.587, "fa": 2.08, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "I would have definitely put myself in the former category: I've been programming since I was 6, I would comfortably have said I wrote code every day, I've done a lot of stupid things[0] with code for the hell of it, etc.\n\nWhat's changed is the scope of what I take on now, and where I am involved in the process. I'm doing the same work, but now at the architecture and planning level. I'm not asking Claude to \"one shot x app make no mistakes\", I'm planning, revising, designing.\n\nIt's closer to having been a carpenter when power tools came out. I love carpentry, and maybe before I thought I loved the pulling the saw back and forth or the chiseling, but no, I enjoyed the actual carpentry, and now I'm doing a lot more of it.\n\n0: https://github.com/pjlsergeant/xslt-fever-dream"}, {"id": 50660442, "au": "jjcm", "dom": 146, "sr": 7, "sc": 10.03, "ep": 10.03, "bs": 0.0, "d": 0, "age": 25.2, "grav": 382.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 121, "qw": 0, "k": 12521, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": ["https://firefighter.sh/"], "ig": 1.909, "fa": 0.62, "gp": 2.604, "bl": 0.0, "ds": 0.0, "txt": "In some ways it's better, in some ways it's worse.\n\nIt's certainly easier than ever to spin up a VPS/cloudflare proxy and deploy. Agents can pretty much do that end to end.\n\nThe bigger issue is you're then accountable for keeping up with security. Previously that meant using fail2ban and running a system update every few months. Now it means patching within 24hrs of a CVE9+ dropping, which is happening at an accelerated rate.\n\nIt got so bad during October I made https://firefighter.sh/ as a joke (a root-permissioned agent that continuously monitors for CVEs and patches your system live as soon as they drop - it's a security nightmare given the nondeterministic aspect of AI), but I'm actually starting to come around to the idea for my non-critical servers."}, {"id": 50662360, "au": "jnaina", "dom": 421, "sr": 8, "sc": 9.63, "ep": 9.63, "bs": 0.0, "d": 0, "age": 20.18, "grav": 264.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 602, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 2.174, "fa": 0.95, "gp": 1.248, "bl": 0.0, "ds": 0.0, "txt": "Indeed it has been great. My earlier homelab server sprawl was fixed with the help of claude, from 5 servers to all on a xeon Dell R320 with 128GB RAM, with all services running on containers, linked a fast 10GB fibre link. Claude maintains all my configs on github, along with my OHV, AWS and Cloudflare accounts, including my dedicated LLM server running qwen 3.8 flash next. All monitored via a custom health portal, with notifications via ntfy.\n\nAll my side projects that would take weeks to setup/maintain/integrate, is now just a prompt away and completed within couple of hours.\n\nOne downside is the explosion of vibe coded apps/games that are now sitting on my iphone, apple TV, Mac, Linux, CF edge, sunlight game streaming server, etc.\n\nMy favourite app that Claude wrote for me is \"Quint\" for the iphone, which is a clone of Wordle, because I was too cheap to pay NYT $2 per month.\n\nMy next project is to automate the monitoring of all my solar panels by getting claude to build an interface for the victron charge controller."}, {"id": 50660392, "au": "jrecyclebin", "dom": 420, "sr": 9, "sc": 8.92, "ep": 8.92, "bs": 0.0, "d": 0, "age": 25.29, "grav": 384.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 41, "qw": 0, "k": 41, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://gitHub.com/jrecyclebin/freshbreath"], "ig": 0.791, "fa": 1.78, "gp": 1.369, "bl": 0.0, "ds": 0.0, "txt": "Not just at a personal level - seeing a lot of businesses self-host their apps as well!\n\nFor myself, I've been working on a personal server that I can publish to over MCP. It also automates publishing over SSH - so I can manage remote servers from it.\nhttps://gitHub.com/jrecyclebin/freshbreath"}, {"id": 50662215, "au": "mteoharov", "dom": 337, "sr": 10, "sc": 8.87, "ep": 8.87, "bs": 0.0, "d": 0, "age": 20.61, "grav": 273.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 133, "qw": 0, "k": 38, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://padar.ai"], "ig": 2.107, "fa": 0.62, "gp": 1.483, "bl": 0.0, "ds": 0.0, "txt": "I built a completely custom deployment pipeline to bare metal servers for this product I am currently working on - https://padar.ai.\n\nThe idea is that I have a fleet of these bare metal machines which run my workspaces in Qemu microVMs with k8 and kata container (kata is a container runtime k8 hooks up to).\n\nSo the pipeline is essentially a fully custom ansible pipeline which configures each node and essentially onboards new ones in the fleet fully automatically.\n\nAnsible sets up everything from firewalls, to dependencies, to propagating the latest builds to each target thru the internal fleet network. But it’s pretty much a joy to use - incredibly stable CI experience.\n\nAnd the best part is I’m planning on buying and self hosting servers racks in a data center as the product hopefully grows so that i can afford to offer better compute runtime rates."}, {"id": 50661522, "au": "n4bz0r", "dom": 237, "sr": 11, "sc": 8.84, "ep": 8.99, "bs": 0.0, "d": 0, "age": 22.63, "grav": 319.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 70, "k": 687, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.94, "fa": 0.42, "gp": 2.228, "bl": 0.0, "ds": 0.0, "txt": "> For my VPS infrastructure, I’ve also started building my own Debian-based bootc image (after thinking about it for some time).\n\n> I still remember what updating a service used to look like: bumping the version and adjusting the Docker Compose file on my laptop, pushing the changes to the Git remote, SSHing into the server, pulling the changes, and finally deploying them. Now, a single Git push is enough. If a push is even necessary.\n\nBoth of these cases are a great fit for Ansible or the alternatives. Given how much the author leans towards the idea of storing configuration in repos, it's a bit odd I haven't seen a single mention of configuration management tools.\n\nGenerate Ansible playbooks, set up a simple CI/CD workflow and you don't need an agent to do the same manual labor every time - it just needs to bump the versions and make a PR/push. Saves a great deal of tokens.\n\nI have a feeling that AI prices are only going to go up and such 'frivolous' usage when agents repeat a lot of unnecessary actions is going to become an anti-pattern (unless you have unlimited funds)."}, {"id": 50661729, "au": "h4kunamata", "dom": 375, "sr": 12, "sc": 8.7, "ep": 8.7, "bs": 0.0, "d": 0, "age": 22.08, "grav": 307.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 50, "k": 443, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.045, "fa": 0.7, "gp": 1.306, "bl": 0.0, "ds": 0.0, "txt": ">Most of my infrastructure configuration lives in Git repositories, mainly in the form of Docker Compose files, scripts, and other configuration files. This makes it possible to use AI coding agents to work on my infrastructure in much the same way as they would work on any other software project.\n\nYou do not need AI to self-host, OP environment was the issue, Docker alone is a nightmare.\n\nMy homelab is pretty much Proxmox running a few dozen Debian LXC containers fully automated via Ansible, I hardly ever touch Proxmox GUI. Ansible itself is then ran on schedule via Semaphore.\n\nMy code is self-hosted on Forgejo (Debian LXC container), Semaphore consumes the playbooks from there.\n\nThe only time I use AI is for example to convert a Docker project, errr, into an Ansible/LXC template.\n\nI then use my experience with Ansible to fix all the broken logic and what not speeding things up from hours or days into minutes, like having a single LXC container running Radarr, Sonarr, Jacket, qQ*, with the whole network traffic via a VPN, if it goes down everything stops working, all done via Ansible, it took me a weekend, would have taken me days otherwise without AI.\n\nBut saying you must have AI to self-host things, that is incorrect in so many levels."}, {"id": 50661274, "au": "joshstrange", "dom": 302, "sr": 13, "sc": 8.64, "ep": 8.64, "bs": 0.0, "d": 0, "age": 23.28, "grav": 334.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 238, "qw": 0, "k": 23837, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.88, "fa": 0.56, "gp": 1.813, "bl": 0.0, "ds": 0.0, "txt": "I couldn't agree more. I've been self-hosting/home-lab-ing for decades now and my, already high, usage of open source software has ballooned in the last year. I think I set up Immich myself earlier this year on my server but since then, pretty much every project has been deployed/managed by an agent.\n\nAny changes/checks/updates/etc needed, I mostly do through an agent. It will surface any release notes I need to see, it will do the backups I never did (lazy), it will make sure to lock down access better than I have in the past (due to mistakes/misconfiguration).\n\nI'm much more likely to try out an open source project since the time investment for setup is practically 0, therefore \"ROI\" is easier to achieve. I've spun up and down many things, I've written even more from scratch (with agents), and it's just so much easier to do things \"right\".  I have backups of critical data now, I have hourly/nightly postgres backups depending on the service (backed up to the cloud), I'm actually checking the backups and testing them unlike in the past.\n\nI love that closed models are enabling more independence and making it easier to switch away from the big clouds/tech. And when they rug-pull, I'll switch to the very capable (though not as good as the frontier) open models, maybe pay for 1 more month of Claude to have it help convert everything to GLM/DS/etc (which would be delicious itself)."}, {"id": 50660974, "au": "indigodaddy", "dom": 2, "sr": 14, "sc": 8.09, "ep": 8.24, "bs": 0.0, "d": 1, "age": 24.11, "grav": 355.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 14563, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 2.038, "fa": 0.34, "gp": 1.71, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I've been doing everything I've ever wanted, it's been amazing.. a seeded procedural unlimited lode runner web game, scrabble on the living room TV controlled by phones, a web remake of an old PC game from 1996 called WSOP Deluxe Casino Pak, my own CF JF-compatible frontend/management/pipeline to my videos living on cheap PHP storage (to name just a few).\n\nWhatever I've always wanted to do, I just do it.\n\nIncredible times to have been a kid at the dawn of the personal computer, and now to also be living through this LLM age, probably the single best generation for tech imo."}, {"id": 50662880, "au": "CaptWorld", "dom": 48, "sr": 15, "sc": 7.83, "ep": 8.12, "bs": 0.0, "d": 3, "age": 18.71, "grav": 234.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 291, "qw": 0, "k": -9, "kpp": -0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": ["https://www.anthropic.com/news/public-benefit-fund"], "ig": 1.943, "fa": 0.96, "gp": 0.565, "bl": 0.0, "ds": 0.0, "txt": "My 2 cents on your footnote. Any AI whoever built it, be it govt or corp or individual, will be considered theft. It might be impossible to compensate everyone for the amount of data that we need to build any sort of \"intelligent\" AI, in terms of logistics and speed of development. The data has been sitting there waiting to be used for training but no one else was able to do, atleast in a good way, until openai and anthropic stepped in. They should be commended for the engineering feat even though it might be ethically questionable. Ans the cost of the models to average consumer is decent and it's a steal deal. They've also made it so that it doesn't just regurgitate stuff and they take good care to prevent that. Anthropic atleast tries to compensate by donating to good charities and having seperate public benefit fund [1]. I've just googled regarding climate change and you can rest easy as the worst case scenarios for global warming, RPC 8.5/SSP5-8.5, have been retired due to the amazing development of renewabable mode of energy generation and the current worst case scenarios point to loss of <4% gdp in countries by 2100. This doesn't seem too bad and the problem seems to be solvable by tech and I feel like embracing AI can increase gdp to compensate for loss due to climate change. The companies are also trying to move to clean sources like SMEs for their energies going and cl"}, {"id": 50660501, "au": "skullone", "dom": 161, "sr": 16, "sc": 7.74, "ep": 8.1, "bs": 0.0, "d": 1, "age": 25.09, "grav": 379.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 898, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.791, "fa": 0.28, "gp": 2.135, "bl": 0.0, "ds": 0.0, "txt": "I have AI craft make files for common operations, patching, deploys etc. The makefiles compose terraform, ansible, misc scripts, DB migrations etc. this way, something reproducible and tested can be \"trusted\" to let AI operate with without it getting carried away or deep into the weeds on simple shit.  \nOf course, I also use the same makefiles too when I want, and it's just great.  \nKeeps credentials safe-ish, AI doesn't need to SSH itself or even know about the actual systems."}, {"id": 50661055, "au": "scottydelta", "dom": 355, "sr": 17, "sc": 7.72, "ep": 7.94, "bs": 0.0, "d": 0, "age": 23.91, "grav": 350.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 116, "qw": 0, "k": 1132, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://tarvis.io"], "ig": 1.679, "fa": 0.62, "gp": 1.538, "bl": 0.0, "ds": 0.0, "txt": "Using AI, I am making it fun and accessible to even non tech crowd. I am working on https://tarvis.io which makes running your own apps from github or open source apps one click job on a server.\n\nI abstracted the VPS, docker, networking, firewall, domains, SSL and backups from the user so that they just think of it as a workspace rather than a server.\n\nI have already been self-hosting things for over a decade and over the years the things I built to manage my own workloads evolved into this product which now can make self hosting accessible to anyone.\n\nI literally have non-technical users using Tarvis to develop and self host their next.js app with db and background workers. What a time to be alive!"}, {"id": 50665714, "au": "gjulianm", "dom": 155, "sr": 18, "sc": 7.58, "ep": 7.87, "bs": 0.0, "d": 6, "age": 11.84, "grav": 113.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 18, "k": 4409, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.711, "fa": 0.7, "gp": 1.282, "bl": 0.0, "ds": 0.0, "txt": "> wouldn't they also do just fine using a certificate signed by something manually added to their local trust store?\n\nThat means adding it to all the devices that need to connect to those sites. Which is fine if you're only connecting from a computer, but if it's a computer, several phones, a TV... then it's less fun. Yes, there are solutions, but having a LetsEncrypt certificate is simpler:\n\n1. Get a wildcard subdomain to refer to hosts in your LAN (e.g., *.lan.mydomain.com)\n2. Have a DNS resolver in your LAN (very common in homelab settings as people will already be running pihole or something like that) \n3. Override the DNS settings to resolve the LAN subdomains to local LAN IPs."}, {"id": 50665429, "au": "jordanbeiber", "dom": 370, "sr": 19, "sc": 7.53, "ep": 7.53, "bs": 0.0, "d": 2, "age": 12.48, "grav": 122.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 978, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.27, "fa": 1.23, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "The problem with SaaS is 1000+ customers:\n\n- Requirements from said 1000s of customers\n\n- Scale\n\nMedium to large business dev shops are actually in a position where:\n\n- scaling is not a problem and hasn’t been for many years(think 10.000 users today vs 20-25 years ago)\n\n- you know (or should know!) the ins and outs of your only customer\n\nTime will tell, but I’m seeing more of “SaaS is dead” where I’m sitting as CTO in a small’ish company with < 10.000 employees."}, {"id": 50662078, "au": "colordrops", "dom": 247, "sr": 20, "sc": 7.44, "ep": 7.74, "bs": 0.0, "d": 1, "age": 20.99, "grav": 282.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 17350, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": ["https://HomeFree.host"], "ig": 1.465, "fa": 0.9, "gp": 1.193, "bl": 0.0, "ds": 0.0, "txt": "Might as well just go all the way and use NixOS. Programmable, manages the entire operating system, and reproducible. Nix is a strongly typed functional language which makes AI highly effective at building and debugging config.\n\nI built a self-hosted router and app server on top of it:\n\nhttps://HomeFree.host"}, {"id": 50665117, "au": "DarmokJalad1701", "dom": 277, "sr": 21, "sc": 7.43, "ep": 8.02, "bs": 0.0, "d": 3, "age": 13.24, "grav": 134.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 1840, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.59, "fa": 0.95, "gp": 1.087, "bl": 0.0, "ds": 0.0, "txt": "I can get a lot for $20/mo. When I am actively working on larger projects, I can even justify $100. My laptop is good enough to run Inkling 2 Mini which can now do a lot of this stuff for free as well if I ever choose to do that.\n\nI get a ton of value out of my AI subscription just for fixing random problems for me. What I don't want to do is pay anything from $5-$15 per month each for tracking my kid's feedings/diaper changes, or for tracking my finances or so many other things. The open source apps exist. But it used to be a hassle to maintain them with docker + config files and everything else. Now I just open up a SSH link to my local server with a unix socket tunnel and have an agent connect and just do it for me. Then I have it set up a CloudFlare tunnel without the hassle of going and doing it manually through their web interface.\n\nIt takes away so much friction."}, {"id": 50664341, "au": "drybjed", "dom": 270, "sr": 22, "sc": 7.28, "ep": 7.28, "bs": 0.0, "d": 1, "age": 14.99, "grav": 163.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 304, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.894, "fa": 0.68, "gp": 0.611, "bl": 0.0, "ds": 0.0, "txt": "I maintain Linux servers professionally for 25 years now, and develop an open source management software based on Ansible for 13 years. I got burned out from the project for about a year, and recently I got back to it, and started experimenting with LLMs and harnesses for its development.\n\nIt's certainly controversial, but fun again. I think what I burned out on was not development but actual act of coding using a keyboard. If I can say to an agent to write some Python or an Ansible playbook and it does a well enough job for me to accept it, verify that it works as expected, that frees me from typing everything myself and lets me focus on design.\n\nI'm slowly improving the project to add an MCP interface so that I will feel confident enough to let an LLM manage the servers indirectly through it. I saw what it can do when given access to SSH and password-less sudo, so I won't ever give it direct production access, but with a proper control plane, a set of well designed Ansible playbooks, skills designed around them and some monitoring it might be very useful."}, {"id": 50661494, "au": "alienbaby", "dom": 82, "sr": 23, "sc": 7.04, "ep": 7.92, "bs": 0.0, "d": 1, "age": 22.72, "grav": 321.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 405, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.143, "fa": 0.34, "gp": 1.323, "bl": 0.0, "ds": 0.0, "txt": "Built k8s cluster on 3 rpi4s, setup ingress via reverse proxy NATed to home router, waf, deploy all the things, setup cicd pipelines, upgrade the cluster etc etc.\n\nAnd then I've just been building anything I can think of. To deploy or just messa round with. Games, web apps, manage data and train models remotely, desktop games, simulations, alife experiments, some websites to sell things, some to show things, lots of failures, etc etc lol anything that falls out of my head.\n\nI've been a developer or sysadmin or DevOps or SRE or doing storage admin or code migration, all sorts,  for 33 years at various times and places. It helps me drive these automatons quite well.\n\nAnd to be honest, I used to love lovingly crafting everything, but I'm getting old! And it is lovely and comfy to just have things spring together  on a whim or a moments inspiration.\n\nIn the realm of my own personal space, that's fine by me. Go wild, make stuff.  At work, it's a powerful tool that must be used responsibly."}, {"id": 50661051, "au": "brachkow", "dom": 311, "sr": 24, "sc": 6.98, "ep": 6.98, "bs": 0.0, "d": 1, "age": 23.91, "grav": 350.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 102, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": ["https://mise.jdx.dev/bootstrap.html"], "ig": 1.602, "fa": 0.62, "gp": 1.003, "bl": 0.0, "ds": 0.0, "txt": "Yes, and finally there is a sane way to use NixOS, which otherwise has quite steep learning curve.\n\nAnd for those who don't want to commit to a quirky OS – mise version manager has bootstrap/deploy commands that do a similar job of defining systems in configs but without OS and reproducibility.\n\nhttps://mise.jdx.dev/bootstrap.html"}, {"id": 50662073, "au": "sprior", "dom": 485, "sr": 25, "sc": 6.83, "ep": 7.49, "bs": 0.0, "d": 0, "age": 21.0, "grav": 282.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 519, "qw": 0, "k": 307, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.984, "fa": 0.62, "gp": 0.73, "bl": 0.0, "ds": 0.0, "txt": "I've been self hosting for more than 25 years.  I think I've done a pretty good job of doing things logically, but over so many upgrades and migrations I'm sure things drifted and a lot of technical debt has collected.  I just started using AI early this year.  So at first I set up a new git repo and gave it to a vs code/claude session and told it to collect documentation as I described it - Claude owned all edits/commits to that repo.  I set up Claude to keep its memory files inside the git repo so that's versioned too and synced across workstations.  I also set up a mkdocs job so that a static html site is built from the docs (but not the Claude memory) and served on a secure website.  Soon I set up key exchange ssh to my various hosts so I could tell Claude to connect to the box, take inventory and add that to the docs.  This worked better than I had imagined.  I gave Claude a set of guidelines how to communicate with me and the way I do things so it could do the same.  Later it guided me through setting up SOPS so I could make various credentials available and Claude could use them without seeing them itself.  I explained the layout of my dev workstation, git repo, Jenkins, docker hosts, k3s cluster, networking equipment, email server, database, web servers - everything.  I had learned about setting up prometheus/opensearch to centralize metrics and logging and after I set "}, {"id": 50660498, "au": "holoduke", "dom": 465, "sr": 26, "sc": 6.62, "ep": 7.28, "bs": 0.0, "d": 0, "age": 25.09, "grav": 379.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 0, "k": 2760, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.085, "fa": 0.34, "gp": 0.974, "bl": 0.0, "ds": 0.0, "txt": "Curious about others. I am running a few apps and websites for about 18 years now. I have about 50 servers on Hetzner. And till about 6 months ago issues were quite rare. But today I am in a constant fight with bot/scraper traffic. It's so extreme that if I disable things like Anubis, manual ip blocks, Cloudflare measures etc, I am getting so much traffic that my complete setup comes to a halt. Network io, disc io and cpu are all affected. Terabyte per minute is nothing crazy. Traffic originates from many different places. Some legit, some disguised as browsers. Lots of AI labs from the US, China or Singapore. But sudden moments of 1000s of ips from Germany or wherever is happening a lot. \nMost of the time I am able to mitigate the issues and have no downtimes in the apps. Although bot traffic remains the majority. Luckily I have a couple of AI agents that are helping me to find malicious behavior. It's the only way for I see otherwise one will lose this battle."}, {"id": 50669797, "au": "bilater", "dom": 330, "sr": 27, "sc": 6.42, "ep": 7.3, "bs": 0.0, "d": 0, "age": 5.41, "grav": 36.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 123, "qw": 0, "k": 1038, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://shiptiffin.com/"], "ig": 1.894, "fa": 0.62, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "This is exactly what happened to me. Never in my life did I think I’d be able to move away from my Vercel and Supabase setup, but here we are.\n\nI built my own self-hosted infrastructure layer on Hetzner that packages pretty much everything I need: Postgres, auth, object storage, caching, email, cron jobs, GitHub-triggered deployments, preview environments, automatic HTTPS, backups, analytics, error tracking and even SEO, all in one.\n\nI also built in MCP and CLI support so my coding agents can manage the infrastructure and deploy apps themselves. I can run a whole portfolio of apps on a single server.\n\nI open-sourced the whole thing.\n\nSelf-hosting is so much fun, and with AI, the sky is the limit (or, perhaps more accurately, the silicon is the limit).\n\nCheck it out: https://shiptiffin.com/"}, {"id": 50663911, "au": "terrut", "dom": 326, "sr": 28, "sc": 6.4, "ep": 6.62, "bs": 0.0, "d": 0, "age": 15.98, "grav": 181.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 36, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 2.081, "fa": 0.0, "gp": 1.196, "bl": 0.0, "ds": 0.0, "txt": "These tools have been so fun to experiment with.\n\nI'm having the time of my life with my little VPS. Last week I was a bit worried about the ngnix vulnerabilities and logged in to to disable http2. One thing led to another and today the server runs an assume breach security profile.\n\nWorkers have limited rights, all services are isolated. Debsecan runs daily and guides automatic patching. My canary is set up to notify about stuff that gets around my defenses.\n\nIt's is totally overkill and glorious. No work buerocracy or change process other than my automated deployment ci. I spent two afternoons rehearsing the migration to Trixie in VMs assuming my hosting provider was breached.\n\nI have started referring to my laptop as my Deck."}, {"id": 50660745, "au": "Bender", "dom": 328, "sr": 29, "sc": 6.29, "ep": 6.51, "bs": 0.0, "d": 0, "age": 24.65, "grav": 368.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 69679, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.811, "fa": 0.0, "gp": 1.552, "bl": 0.0, "ds": 0.0, "txt": "Certainly more fun for me.  I am not a proper developer.  LLM's have made private forks of my favorite things and helped me remove things I did not care for and add things I wanted.  I have personally found these exercises more fun that video games.   I have learned a little bit of Lua, C and Go.  Not enough to write anything anyone else would find useful by myself but more than enough to satisfy my curiosity.  LLM's have helped me add landlock protection to all my internet facing daemons to reduce the filesystem blast radius of future 0-days, including petty things like protecting tcpdump from writing or executing where it should not."}, {"id": 50661405, "au": "hdjrudni", "dom": 458, "sr": 30, "sc": 6.27, "ep": 7.15, "bs": 0.0, "d": 0, "age": 22.91, "grav": 326.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 39, "k": 573, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.775, "fa": 0.42, "gp": 1.229, "bl": 0.0, "ds": 0.0, "txt": "> I still remember what updating a service used to look like: bumping the version and adjusting the Docker Compose file on my laptop, pushing the changes to the Git remote, SSHing into the server, pulling the changes, and finally deploying them.\n\nDude should have invested more in the deployment process from the get-go. Every deploy should be a single command, AI or not. I've had all kinds of deployment processes over the years, but I always packaged it up in a shell script or Bun deploy script or Makefile or something. Whether that was scp, rsync or now k8s.\n\nBut to the point, yes, having AI write all my k8s YAMLs for me in a heartbeat sure is lovely.\n\nA recent example: it was announced that Nginx had a vulnerability and many of my pods were running an older version of Nginx. I had AI bump all my Dockerfiles past the vuln and redeploy. I'd never tried a massive multi-project update like that before (all slightly different), but it did it with ease."}, {"id": 50663694, "au": "edukite", "dom": 372, "sr": 31, "sc": 6.12, "ep": 6.56, "bs": 0.0, "d": 0, "age": 16.52, "grav": 191.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 108, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 2.167, "fa": 0.0, "gp": 1.01, "bl": 0.0, "ds": 0.0, "txt": "I have 5 mini and micro pc running entire platform on kubernetes and I'm loving it. I'm 40 with 2 small kids so doing this by myself is nearly impossible if I want to sleep what I need. If we through depression on the pile this would be borderline wishful thinking.\n\nIn other hand because of AI RAM and disk became so expensive I was forced to fix problem created by AI with AI.\n\nNearly everything I have on servers is Rust rewrite with sole goal of preserving memory to absolute minimum. Even requests are bunch of borrows and cloning data is forbidden.\n\nBookOrbit became BookVerse, Immich became Galery. I created oci registry called ocir with UI, tokens and fined grained authorization, brand new idp because it's simply impossible to ship java alternatives on my potatoes which pretend to be server.\n\nBut now I also have control over features and my idp accepts only authorized back-end and redirections so this is kind of a win"}, {"id": 50662303, "au": "spacephysics", "dom": 357, "sr": 32, "sc": 6.05, "ep": 6.49, "bs": 0.0, "d": 0, "age": 20.33, "grav": 268.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 1422, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.861, "fa": 0.0, "gp": 1.457, "bl": 0.0, "ds": 0.0, "txt": "AI has made me able to make a full-blown homelab with all sorts of integrations I’d never want to build out by hand.\n\nNow i have VLANs setup, with my own archival system whereby i submit a repo, website, or video and it gets pushed to my nas, which then encrypts and syncs up to a remote storage system. All sorts of apps for 3D printing, analysis of bills and usage trends.\n\nTook a bit to spin up the infra around the loop of securely building, pushing to CI, separating out secrets store such that the LLM never sees them. But now its nice to build out an idea from scratch"}, {"id": 50667998, "au": "worksonmine", "dom": 274, "sr": 33, "sc": 5.94, "ep": 7.33, "bs": 0.0, "d": 2, "age": 8.04, "grav": 63.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 80, "qw": 48, "k": 637, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://docs.docker.com/engine/network/port-publishing/"], "ig": 1.421, "fa": 1.04, "gp": 0.708, "bl": 0.0, "ds": 0.0, "txt": "> I couldn't care less about knowing the details of how to configure some specific web app with all its quirks.\n\nYou might know this, but there could be security issues hidden in those details. One common example people miss is that Docker opens any ports you export on a container on the host as well. It's so common they've added a warning[1].\n\n> Publishing container ports is insecure by default. Meaning, when you publish a container's ports it becomes available not only to the Docker host, but to the outside world as well.\n\nThis means that you might set it up behind a proxy with authentication and everything as you should but Docker was helpful and enabled bypassing the authentication by accessing the port directly (on the local network).\n\nSo you should care.\n\n[1]: https://docs.docker.com/engine/network/port-publishing/"}, {"id": 50662037, "au": "Dedime", "dom": 340, "sr": 34, "sc": 5.93, "ep": 5.93, "bs": 0.0, "d": 2, "age": 21.13, "grav": 285.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 77, "k": 318, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.318, "fa": 0.7, "gp": 0.58, "bl": 0.0, "ds": 0.0, "txt": "It's less about resiliency to utility outages, and more about what it means for your overall architecture - by following this principal, you're reducing your reliance on externally maintained infrastructure. This reduces costs, increases privacy, reduces attack surface, improves latency, and a host of other benefits.\n\n---\n\nSemi-related, but there's nothing instrincically wrong with using commercial AI to build your Homelab. It doesn't mean you're dependent on it. When AI builds me a Helm chart to deploy with Argo, its job is done - it's built me a resilient piece of infrastructure, and from that point on I could do the same job by hand.\n\nIt's a different story if you weave AI integrations into your homelab such that they become vitally important to its operations - see above."}, {"id": 50661162, "au": "cromka", "dom": 147, "sr": 35, "sc": 5.89, "ep": 7.43, "bs": 0.0, "d": 1, "age": 23.58, "grav": 342.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 21, "k": 4605, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.664, "fa": 0.42, "gp": 1.603, "bl": 0.0, "ds": 0.0, "txt": "> Previously that meant using fail2ban and running a system update every few months. Now it means patching within 24hrs of a CVE9+ dropping,\n\nHonestly, most of those issues can be mitigated by NOT exposing your services to the web and instead relying on Wireguard — and I am not mentioning other VPNs here because they, too, are vulnerable with their vast attack surfaces, like OpenVPN.\n\nIn fact I believe all this will lead to better VPN integration in our devices. I REALLY hope Wireguard gets widely adopted to the point every major platform finally adds support for it."}, {"id": 50663111, "au": "spacephysics", "dom": 262, "sr": 36, "sc": 5.86, "ep": 6.96, "bs": 0.0, "d": 2, "age": 18.07, "grav": 221.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 174, "qw": 0, "k": 1422, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.174, "fa": 0.0, "gp": 1.277, "bl": 0.0, "ds": 0.0, "txt": "Im in a similar boat, i have a dependency cache built that all my service dependencies proxy through, and a rule whereby new packages need to be out for a week before user (in case supply-chain attacks occur.) checks against each package against a CVE DB daily, and a UI to manage exceptions to the rule and view.\n\nVulnerabilities are patched as soon as a fix is out, with findings aggregated into a single queue\n\nI have ntop and other networking and server logs piped to Loki with grafana stats on all service. A cheap LLM run goes through logs/stats to look for any issues.\n\nModel can be swapped with claude, local AI etc.\n\nHave an archive service to archive sites, repos, videos, bills etc. a pipeline that runs NER and OCR, with lexical rules to anonymize account IDs and personal info before passing to the LLM for analysis.\n\nNetwork safeguards / VLANs segregating out services based on risk level.\n\nEverything stored in ansible scripts, documents in a repo and OpenSpec used for services.\n\nIf claude triples prices tomorrow, id just change the model and be set."}, {"id": 50660901, "au": "cliche", "dom": 1, "sr": 37, "sc": 5.84, "ep": 7.38, "bs": 0.0, "d": 0, "age": 24.28, "grav": 359.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 26, "k": 13, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.598, "fa": 0.42, "gp": 1.674, "bl": 0.0, "ds": 0.0, "txt": "> When implementing an idea becomes so easy, it’s perhaps more important than ever to occasionally ask myself whether it’s actually worth implementing in the first place.\n\nWish I had this restraint. I’ve been vibing everything I can think of. It’s got to the point I made a small platform on top of k3s so that the agent can yolo deploy into a homeserver behind Tailscale. Once deployed it becomes natural selection for which vibes live and which die.\n\nSolo vibey self hosting llm usage - bliss.\n\nCorporate agentic engineering working with others - soul crushing."}, {"id": 50663854, "au": "_the_inflator", "dom": 269, "sr": 38, "sc": 5.81, "ep": 7.06, "bs": 0.0, "d": 0, "age": 16.13, "grav": 184.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2253, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.805, "fa": 0.34, "gp": 1.277, "bl": 0.0, "ds": 0.0, "txt": "I have a Linux server for 20 years. I lost touch with the intricacies of its Linux workings, due to less time over the years to stay competitive.\n\nI lost interest in doing helpful things. Small changes felt like a weekend project for two lines of terminal code.\n\nI gave AI a chance and in two hours did more than in ten years before. And I felt safer than ever, testing the waters. The server got really hardened because of automation. The new way to monitor and log data for apps is so cool, but I would never have done this alone.\n\nWeird times: pro and contra are strange at the moment."}, {"id": 50664428, "au": "_rwo", "dom": 432, "sr": 39, "sc": 5.72, "ep": 6.38, "bs": 0.0, "d": 0, "age": 14.82, "grav": 160.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 42, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 2.134, "fa": 0.0, "gp": 0.939, "bl": 0.0, "ds": 0.0, "txt": "Excuse me? Is this is some clickbait? xd\n\nFirst of all - Renovate wasn't really \"invented by AI\" - that problem was solved long time ago, the upside is now LLM can read changelogs and merge PRs once your CI is green; if you already had good foundation in place (cough, cough, k3s) the friction of spinning up new software was almost gone anyway\n\nBut when it comes to self-hosting stuff exposed to The Internet it become miserable tbh; crawlers, bots, spam, google who basically kills organic traffic with AI summaries (while crawling your content to the death) and the never-ending CVEs patching pushed me to decision to close some services next year (including a page which I have been keeping online for 15y+) - it just slowly turns into full time job; yeah, you might argue - \"just automate it further with llm!!1oneone\" but personally I'm just done - why would I condemn myself to this? Instead I'm gonna enjoy the building process, but not the keeping the lights on and bad actors at bay part"}, {"id": 50661691, "au": "ericpruitt", "dom": 40, "sr": 40, "sc": 5.68, "ep": 7.22, "bs": 0.0, "d": 4, "age": 22.16, "grav": 308.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 15, "k": 340, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.365, "fa": 1.1, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "> It feels like that replicator thing off star trek that can make anything you want.\n\nThis is an amazing description, and it matches my feelings perfectly. I have never been a big fan of writing UI or front-end code, but I've had some projects I've wanted to do in that vein for some time. I threw one of the projects at DeepSeek, and with some back-and-forth, I was able to get 99% of the way there in 1% of the time it would've taken me to do it -- if I ever bothered to do it at all. You could argue that I'm losing out on developing skills, but most of my career has been infrastructure and backend engineering, and I have little interest in changing that."}, {"id": 50669148, "au": "joshstrange", "dom": 304, "sr": 41, "sc": 5.62, "ep": 6.42, "bs": 0.0, "d": 2, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 23837, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.771, "fa": 0.34, "gp": 0.89, "bl": 0.0, "ds": 0.0, "txt": "My plans are, once (if?) things cool down, to build out a rig for local inference. I never had \"real\" GPUs past gaming in the early 2000's, ever since then things like crypto put mostly out of my price range since it was just a hobby and now they've shot up again. I've played with running inference on my M1/M3 MBPs but it's rough (though super cool to get glimpses of the future!).\n\nWhen the M7 Mac Studio's come out I'll decide if I can justify that as my MBP replacement, since the M7's are rumored to be much better at inference (to the point they skipped the M6 Max/Ultra line to get to M7 faster). But if that price/performance isn't there and/or if GPUs have cooled off then I'll go for a custom build to put on my rack."}, {"id": 50664445, "au": "alienbaby", "dom": 84, "sr": 42, "sc": 5.44, "ep": 6.98, "bs": 0.0, "d": 3, "age": 14.77, "grav": 160.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 259, "qw": 0, "k": 405, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.175, "fa": 0.34, "gp": 0.618, "bl": 0.0, "ds": 0.0, "txt": "Full fat bare metal k8s, encrypted etcd, they host Jenkins for cicd and I use a full cicd workflow for work I do, and various websites, some static sites, some web games, some general apps, a thing that lets me remotely manage data sets and run training for a diffusion audio model a friend and I are fiddling with (kinda like homebrew ai cicd), (training doesn't happen in the pi's) etc, really anything I build that needs hosting.\n\nThe pis have proved more than capable at hosting it all.\n\nUsing traefik as an ingress, and nfs to a separate laptop for persistent volumes, incoming Https requests go through NAT to a reverse proxy that sends them to the ingress controller endpoint. Use a 'noip' type service to keep a domain name resolving to home routers external IP.\n\nI have a 512GB SSD hanging off each one so I'm not hammering a poor micro SD card.\n\nBuilt a simple SSH mcp server (though rarely use it nowadays and models will just ssh direct with pwdless setup available), attach to AI model harness of choice on workstation, and go nuts. I did not run a single cli command manually, AI built the whole thing from scratch, and configured the proxy, nfs , ingress , etc..   all yaml etc kept in repo's,  I use GitHub for repositories , rather than local.\n\nStarted as a 'I bet it can't' kind of experiment and rapidly became , well blimey it can.\n\nIt's great for just dropping anything that need"}, {"id": 50665970, "au": "urlwolf", "dom": 361, "sr": 43, "sc": 5.38, "ep": 6.26, "bs": 0.0, "d": 0, "age": 11.34, "grav": 106.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 3178, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.619, "fa": 0.34, "gp": 1.023, "bl": 0.0, "ds": 0.0, "txt": "This might expose how much I don't know about servers and security, but here's a thought. I read that AWS Automated Reasoning Group has close to 350 people working on formal verification of the software they use for their internal devops and config management. This group, I imagine, should provide a level of testing and security impossible to replicate with self-hosting. Is this not a strong reason to go with AWS? I'm saying this as someone who is very sympathetic to Andy Farnell's digital vegan ideas, and to declouding (more so in EU)"}, {"id": 50661139, "au": "45sdasf45", "dom": 376, "sr": 44, "sc": 5.36, "ep": 6.46, "bs": 0.0, "d": 0, "age": 23.64, "grav": 343.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 7, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 1.706, "bl": 0.0, "ds": 0.0, "txt": "Hard disagree. Self-hosting (public on internet) is foolish in this day and age. Unless you suddenly want to drop everything and patch everything every day. All those janky apps will be hacked over and over again.\n\nAI has made hosting ANYTHING an exercise in rapid exploitation, which makes the internet a worse place for everyone. I have shut down dozens of VMS in the last few months because maintenance is an impossible time sink in this internet storm.\n\nBunker down and remove anything internet facing."}, {"id": 50661102, "au": "jasonriddle", "dom": 322, "sr": 45, "sc": 5.32, "ep": 6.42, "bs": 0.0, "d": 0, "age": 23.76, "grav": 346.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 274, "qw": 0, "k": 115, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.84, "fa": 0.0, "gp": 1.445, "bl": 0.0, "ds": 0.0, "txt": "This resonates with how I'm feeling.\n\nI have a Synology nas, and I use portainer to run and manage docker apps. It's mostly fine, but Synology does a lot of weird things like how they handle file permissions, and they have their own seperate set of proprietary cli tools for interacting with the system. It was super annoying figuring out how all of these things glue together and their documentation is pretty terrible.\n\nIt's still super annoying, but I've started building out an aiwiki, where the agent starts in that wiki and it adds to that anytime it encounters anything odd or weird or anything I tell it to add to that. So it has an understand of my tailscale network, applications I'm running, how to ssh into things, etc. It saves a lot of time because I can just ask my agent to read 15 or so relevent wiki files and it has enough context to start working on a task.\n\nIt's not a perfect flow. Certain actions require you to use the Synology webui, which is painful and slow at times, but I haven't found a way to give agents access to that, while being able to monitor what they do.\n\nI've also been having luck with agents configuring things related to kubernetes. I'll spin up a cluster in the cloud with something like digitalocean, and then the agent can deploy apps to it and monitor things. Kubernetes is much easier to give better scope access to certain resources, so I'm slowly try"}, {"id": 50661896, "au": "bigbuppo", "dom": 305, "sr": 46, "sc": 5.31, "ep": 6.41, "bs": 0.0, "d": 0, "age": 21.55, "grav": 295.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 1490, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.468, "fa": 0.34, "gp": 1.375, "bl": 0.0, "ds": 0.0, "txt": "Using AI to automate the drudgery is perfectly acceptable.\n\nAnd for that matter, I've come around to it being okay to use AI to write code. I'm sure we've all felt the same annoyance when we write the same code over and over again on different projects. Even when you put the effort into writing libraries that handle 99.9% of the repetitive work along with all the shortcuts available you're still doing a whole lot of soul-crushing tedium that amounts to pointless ceremony. This is literally where the over-hyped autocorrection is at its best."}, {"id": 50664379, "au": "stsch", "dom": 219, "sr": 47, "sc": 5.31, "ep": 5.53, "bs": 0.0, "d": 1, "age": 14.91, "grav": 162.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 16, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.86, "fa": 0.0, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "During my 30+ years enjoyment with computers and programming, I tried building multiple applications and games. I've always failed, except in my dayjob, due to lack of motivation.\n\nOne day I admitted that it's not the end product that draws my interest, it's the building process. Spending hours and nights tinkering, writing awesome and clean code, debugging a bug for hours and finally solving it.\n\nWith AI, all of that is gone. Completely.\n\nGuess I'll try to make enough $$$ to leave the industry. It sucks now."}, {"id": 50662305, "au": "boznz", "dom": 413, "sr": 48, "sc": 5.29, "ep": 6.39, "bs": 0.0, "d": 0, "age": 20.33, "grav": 268.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 44, "qw": 0, "k": 2069, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://boznz.com"], "ig": 1.291, "fa": 0.62, "gp": 1.094, "bl": 0.0, "ds": 0.0, "txt": "Github + ImprovMX routed to gmail is a pretty cheap way to go for self hosting your domain. Just brought back to life my old site https://boznz.com with the AI converting all the wordpress files to static HTML and doing all the updates from a local wordpress source."}, {"id": 50670543, "au": "Forgeties79", "dom": 462, "sr": 49, "sc": 5.25, "ep": 6.13, "bs": 0.0, "d": 0, "age": 4.35, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 4019, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.507, "fa": 0.68, "gp": 0.45, "bl": 0.0, "ds": 0.0, "txt": "I feel like I would agree if I could get my local models to be good enough to really take care of stuff for me. With ram prices so high I only have 16gb vram and 32gb DDR5. It’s useful especially for troubleshooting stuff/getting unstuck, but I’m very constrained and I just don’t want anthropic/OAI/etc.  running around on my computer actually doing things for me because I don’t  trust them in the slightest. I run Claude at work on  a work laptop, separated from my personal life and computers"}, {"id": 50662552, "au": "wavewrangler", "dom": 463, "sr": 50, "sc": 5.19, "ep": 6.29, "bs": 0.0, "d": 0, "age": 19.7, "grav": 254.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 231, "qw": 0, "k": 84, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.778, "fa": 0.34, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "To be honest, aside from the slop all over the internet (put there by other people, anyway), I find that the scope of what I feel capable of undertaking seems less and less constrained. I’ve found myself completing more projects, asking more questions, and feeling considerably more enabled.\n\nI understand that this is just a little slice of AI as a whole. But that’s the amazing part. It has so much more to offer.\n\nAnd in some respects, we aren’t letting it. Us! People! Yes, there are real and pressing issues, but sometimes I wonder where the world would be if we’d all had access to a great teacher for the last 20 years. How much human potential has gone unrealized simply because people lacked the guidance to pursue it? We’ve always found ways to make do, but the difference between making do and realizing our potential might be as profound as the difference between hibernation and running a marathon.\n\nI appreciate how things used to be, but the future hasn’t happened yet. And I think that from the moment computation entered the realm of human understanding, something resembling this was always going to be an eventuality.\n\nI can hardly imagine how I made it as far as I did, feeling my way through the darkness. In hindsight, it seems almost unnatural that we should have had to.\n\nPerhaps we have mistaken the scarcity of intellectual guidance for an inherent limitation of human abili"}, {"id": 50660465, "au": "antisthenes", "dom": 301, "sr": 51, "sc": 5.09, "ep": 6.63, "bs": 0.0, "d": 1, "age": 25.16, "grav": 381.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 4343, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.656, "fa": 0.68, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "Having pride in your setup is a lot less important than self-hosting something for your friends that can bring joy to many people.\n\nI'm hosting Jellyfin and FoundryVTT (D&D platform) and a few other things for my friends. Couldn't care less about the \"pride\" in the setup - the only difference is it takes me 5 minutes with an LLM or 30 minutes following an old-school guide to set it up. This stuff isn't complicated one way or another.\n\nLLMs just make the discovery (e.g. that part where you look at config setup examples  and troubleshooting) and troubleshooting a breeze.\n\nBesides, no one is really stopping you from doing it old school. By all means, learn from linux CLI utilities man pages and write complicated bash scripts from scratch by yourself."}, {"id": 50661275, "au": "kikoreis", "dom": 407, "sr": 52, "sc": 5.07, "ep": 6.17, "bs": 0.0, "d": 0, "age": 23.28, "grav": 334.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 597, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.849, "fa": 0.0, "gp": 1.26, "bl": 0.0, "ds": 0.0, "txt": "Fun, possible and on occasion necessary. There is a lot of misalignment of interest with modern service providers, so we all need to a) pick them carefully and b) use some proportion of self hosted services -- kinda \"stay sharp or become the mark\".\n\nI have been running a bunch of stuff self hosted now including BBS (with ENIGMA1/2) and SMTP (with mox) and it is a strange adventure (with QSD grade nostalgia mixed in).\n\nCurrently looking for something simple for git for a small team."}, {"id": 50664832, "au": "jlengrand", "dom": 251, "sr": 53, "sc": 5.06, "ep": 6.16, "bs": 0.0, "d": 0, "age": 13.86, "grav": 144.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1565, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.724, "fa": 0.0, "gp": 1.456, "bl": 0.0, "ds": 0.0, "txt": "AI made self-hosting fun again for sure, for self-made tools or getting home assistant dashboards done in no time. But it mostly has made it scary as ever honestly. I've had a home server since forever, but with the sheer amount of CVEs lately I've been breached twice over the past year; and I've also been constantly hammered by bot traffic. \nSynology has had several zero days too in the past months.\n\nSelf-hosting is fun, but behind a triple reinforced wall."}, {"id": 50665044, "au": "moonlanders", "dom": 351, "sr": 54, "sc": 5.03, "ep": 5.47, "bs": 0.0, "d": 0, "age": 13.4, "grav": 137.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 15, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "This city builder y so great! Spent 8h a day playing!\n\nI've noticed I care more about construction, perfect planning and pristine army than the actual missions.\n\nBut oh boy the building is expensive and I've already spoiled this map... only if I could have infinite money this game would be EPIC because I could build more! Maybe there is a cheatcode out there?\n\nHail `ATM OF EREBUS`, it made me rich!\n\nNow I can build anything and the fun is finally gone! I don't play anymore!"}, {"id": 50663202, "au": "alexfortin", "dom": 393, "sr": 55, "sc": 5.03, "ep": 6.13, "bs": 0.0, "d": 0, "age": 17.81, "grav": 216.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 55, "qw": 0, "k": 121, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": ["https://news.ycombinator.com/item?id=48978707"], "ig": 1.239, "fa": 0.62, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "I blogged a while ago about my self-hosting journey into Forgejo [0] and still pretty happy about it. Since then I've also added some other services to the Podman bunch and it's definitely worth the effort in my case, given that all pros and cons of self hosting have been taken into account before going down the road.\n\n[0]: https://news.ycombinator.com/item?id=48978707"}, {"id": 50660637, "au": "AloysB", "dom": 192, "sr": 56, "sc": 5.03, "ep": 6.51, "bs": 0.0, "d": 1, "age": 24.84, "grav": 373.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 765, "kpp": 25.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.803, "fa": 0.0, "gp": 1.566, "bl": 0.0, "ds": 0.0, "txt": "Another massive drawback is the slop-avalanche on self-hosting communication channels.\n\nI don't mind someone vibing something out for their needs; but as soon as you advertise it and invite external users, I feel there was a moral obligation to provide a certain level of quality and security. Which doesn't seem to be as prevalent now.\n\nBuilding out a project used to take a fair amount of investment for the creator; now that producing code is \"cheap\", that price-to-entry is so low that anyone can spin up a project in a couple of hours.\n\nIt has added a lot of noise to the community channels - making it hard for good projects to stand out among the noise."}, {"id": 50661092, "au": "oliyoung", "dom": 260, "sr": 57, "sc": 5.03, "ep": 6.12, "bs": 0.0, "d": 0, "age": 23.81, "grav": 347.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1223, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.657, "fa": 0.0, "gp": 1.534, "bl": 0.0, "ds": 0.0, "txt": "I have a claude code managed self-hosted server that I would _never_ had time to put together as cleanly or complete as I have now. It's a fully complete docker managed budgetting, web, photos, git and media server, with automated backups, home automation, and vpns.\n\nThere's almost 60 services running, with API access to backblaze, unifi and cloudflare to manage the network.\n\nI have an idea for a service I want, claude goes off and does it. I haven't had this much personal web infra under my own roof in decades."}, {"id": 50660371, "au": "therealmarv", "dom": 491, "sr": 58, "sc": 5.03, "ep": 6.12, "bs": 0.0, "d": 0, "age": 25.32, "grav": 385.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 4739, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.593, "fa": 0.28, "gp": 1.087, "bl": 0.0, "ds": 0.0, "txt": "While it's true that self-hosting is easier now, good luck securing your own server and keeping it updated against all the new AI threats. For example, distros seem pretty slow lately at patching major security bugs (especially Ubuntu with their recent kernel fix).\n\nBecause of this, the maintenance burden has only grown.\n\nSo it's not a clear win."}, {"id": 50662137, "au": "petesergeant", "dom": 204, "sr": 59, "sc": 5.03, "ep": 6.04, "bs": 0.0, "d": 1, "age": 20.81, "grav": 278.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 13, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.699, "fa": 0.42, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "> The bigger issue is you're then accountable for keeping up with security.\n\nWithout agentic help, there's no chance I'd have: setup Falco and Trixy properly; properly segmented my home network with MikroTik hardware; setup Tailscale properly; built out a proper Yubikey-backed ssh-agent strategy; properly split out work and personal physical devboxes from my laptop; regularly scanned every device I own for credential leaks; etc etc etc"}, {"id": 50665286, "au": "raxxorraxor", "dom": 88, "sr": 60, "sc": 5.03, "ep": 5.96, "bs": 0.0, "d": 1, "age": 12.84, "grav": 128.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 3893, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.986, "fa": 0.0, "gp": 0.888, "bl": 0.0, "ds": 0.0, "txt": "I nuked containers and all that shit. I don't need it for medium scale any more. I yolo servers through ansible and they are far better maintained than before. Every service gets its own account, every service creates its key pair to auth against a self hosted id provider, every rotation of key pairs and certificates is automated. Every service restart is logged and interpreted by a local AI that also surveys every log of every server of every app and contacts me if something is fishy.\n\nBut the main advantage is in the ease of any CI pipeline, which gets annoying with too much containerisation. Sure, requirement is that alls hosted apps/services follow certain rulesets..."}, {"id": 50668069, "au": "xeromal", "dom": 98, "sr": 61, "sc": 5.03, "ep": 5.89, "bs": 0.0, "d": 6, "age": 7.93, "grav": 62.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 7589, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.742, "fa": 0.28, "gp": 0.689, "bl": 0.0, "ds": 0.0, "txt": "I think many software developers have this belief that there's a bit of perfection in software development, but I'd really classify those guys as code artisans. Rather than it actually needing to be perfect, they probably built a monstrosity, but in most cases, it doesn't really matter if they're happy with the server cost or self-hosted performance of it. It doesn't really matter.\n\nSome of the most famous and successful pieces of software were built on low standards and bad quality. Minecraft was written in Java, for instance.\n\nIn my opinion, AI-driven software development is allowing regular folks to have a hand at building stuff they want without having to bug their friends. I think the net result of that is a small percentage of them actually being drawn to the industry and being good contributors. This feels like a net positive to me."}, {"id": 50660999, "au": "echelon", "dom": 130, "sr": 62, "sc": 5.03, "ep": 5.89, "bs": 0.0, "d": 1, "age": 24.05, "grav": 353.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.631, "fa": 0.34, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "AI is a dream come true.\n\nOpportunity cost is melting away. So many things are within reach, it's amazing.\n\nInstead of working for corp, work for yourself. It's easy to get token spend on a product if you put in solo marketing. I've seen dozens of people get to $5-20M ARR in a few months, and I've done it myself more than once. (VCs won't even fund this anymore because it's become so commonplace.)\n\nSpend your weekend building the side project to fire your employer."}, {"id": 50663729, "au": "zkmon", "dom": 478, "sr": 63, "sc": 5.03, "ep": 5.88, "bs": 0.0, "d": 0, "age": 16.42, "grav": 189.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 24, "k": 2336, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.646, "fa": 0.42, "gp": 0.563, "bl": 0.0, "ds": 0.0, "txt": "> The entire process, from having an idea to having something actually running on my home server, requires much less effort than it used to.\n\nHosting is not so much about automating your CI/CD or selecting your tech stack. It's more about availability, fault tolerance, security, and recovery. To start with what do you do about power? Power outages are more common that you think. Go for solar? Add that cost. Redundancy? More servers? Add that cost. Security infrastructure (vault etc)?\n\nAfter adding all those cost, let us know why it self-hosting still makes sense for any serious prod deployment."}, {"id": 50671891, "au": "froggit", "dom": 10, "sr": 64, "sc": 5.03, "ep": 5.88, "bs": 0.0, "d": 4, "age": 1.93, "grav": 11.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 55, "k": 134, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.714, "fa": 0.42, "gp": 0.451, "bl": 0.0, "ds": 0.0, "txt": "> - Boredom I currently also have to fight with as projects and engineering challenges I was looking forward to tackling - which gave me great energy - became simple prompts.\n\n> If you have a great idea, it's amazing that in this era you can reach your goal faster than ever. I currently don't have a great idea or project I'm excited about. Pls fix?\n\nHave you considered, i dunno, actually tackling those projects and challenges yourself instead of turning them into simple prompts? Do you remember how to do that? Or that doing so is even an option?\n\nYeah, it'll take longer, but that's the whole point. It's a lot easier to get bored when you instantly finish everything exciting than it is when spending a long time finishing one exciting thing.\n\nWhen fighting boredom you're ultimately just trying to kill time in an enjoyable way. Taking a slow yet fun journey is far more effective than reaching your destination with the fastest, lowest effort route."}, {"id": 50662124, "au": "wraptile", "dom": 404, "sr": 65, "sc": 5.03, "ep": 5.78, "bs": 0.0, "d": 0, "age": 20.85, "grav": 279.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 2742, "kpp": 3.2, "td": 0.0, "mod": 0, "pp":
