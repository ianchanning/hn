 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.727, "fa": 0.0, "gp": 1.186, "bl": 0.0, "ds": 0.0, "txt": "I use a swarm of refurbished thinkpads as my home lab under single nixos repo with each host having it's overlay and it's incredible. My workflow is task claude -> review git pr -> merge and nixos switch -> callback to claude to verify the change shipped. It's so much fun to have an idea and have it launch on your own hardware so hassle free.\n\nThe next step is local model but I'm not sure when us normal consumer can get affordable compute again."}, {"id": 50663014, "au": "nurettin", "dom": 483, "sr": 66, "sc": 5.03, "ep": 5.77, "bs": 0.0, "d": 0, "age": 18.3, "grav": 225.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 4069, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.678, "fa": 0.34, "gp": 0.589, "bl": 0.0, "ds": 0.0, "txt": "With the help of sota I was able to discover and move dozens of services I had accumulated for the past 15 years from one provider to another without losing anything in a couple of hours. Just gave it the api keys and a gnu screen session with sudo. There was so much stuff in there  that I had completely forgotten about and the llm flew about, finding all the configs and environment variables, moving domains to the new ip, restoring databases. It was spectacular."}, {"id": 50660456, "au": "trowawee", "dom": 336, "sr": 67, "sc": 5.03, "ep": 5.75, "bs": 0.0, "d": 0, "age": 25.18, "grav": 381.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1632, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.629, "fa": 0.0, "gp": 1.326, "bl": 0.0, "ds": 0.0, "txt": "I've had almost the exact same experience (right down to using Nix and repurposing my couple-years-old gaming box as a combo gaming machine/home server) and it's been great. I've been having more fun with homelab stuff than ever, mostly because I'm spending way less time fiddling with Docker configs and way more time actually enjoying the fruits of that work: watching shows and movies, reading books, streaming games, etc."}, {"id": 50660888, "au": "vagab0nd", "dom": 310, "sr": 68, "sc": 5.03, "ep": 5.74, "bs": 0.0, "d": 0, "age": 24.31, "grav": 360.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1185, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 0.703, "fa": 0.68, "gp": 1.485, "bl": 0.0, "ds": 0.0, "txt": "NixOS is a must-have for this. There's no way I and the LLM could have created and manage about 20+ services and 30+ timers in a sane way on arch, which I had been running for 10 years until 2026."}, {"id": 50660892, "au": "usui", "dom": 150, "sr": 69, "sc": 5.03, "ep": 5.73, "bs": 0.0, "d": 1, "age": 24.3, "grav": 359.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 9, "k": 1975, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.768, "fa": 0.7, "gp": 1.332, "bl": 0.0, "ds": 0.0, "txt": "> Now it means patching within 24hrs of a CVE9+ dropping\n\nI know security by obscurity is not a good defense, but if the internet were on IPv6, it would be a lot harder for bots to find hosts by scanning the whole IP space, whereas when I open a port on IPv4 I can always see activity on it almost immediately. I've been watching traffic to IPv6-only hosts despite connecting to them from outside the local network and it's been completely silent from strangers. This would buy extra time for any critical CVE that needs patching."}, {"id": 50667052, "au": "techcode", "dom": 188, "sr": 70, "sc": 5.02, "ep": 5.72, "bs": 0.0, "d": 1, "age": 9.46, "grav": 80.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 173, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.977, "fa": 0.0, "gp": 0.742, "bl": 0.0, "ds": 0.0, "txt": "I've put the whole homelab behind wireguard/TailScale along with magic/split DNS - I get nice looking subdomains (e.g. jellyfin.home.top) with trusted SSL from ACME/LetsEncrypt. I actually bought real domain for that, but it has no public DNS records, all domain to IP stuff is done in the AdGuard-Home.\n\nAnd even with that - renovate bot creates MRs for new releases/images/versions and GitLab-CE and a bit of scripting makes a btrfs snapshot, updates service, even rolls back to last snapshot if it fails to reach running/healthy state."}, {"id": 50661796, "au": "hgoel", "dom": 90, "sr": 71, "sc": 5.02, "ep": 5.72, "bs": 0.0, "d": 1, "age": 21.88, "grav": 302.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 1741, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.679, "fa": 0.0, "gp": 1.225, "bl": 0.0, "ds": 0.0, "txt": "I started with this approach too, but I've found myself shifting towards considering what's actually worth making. Lots of little services are unnecessary because the use rate would be low enough that it's better to just ask an LLM to do the task every time. Tokens may be \"free\" because of local AI, but time is still valuable.\n\nThe best part of self-hosting in the age of AI has been offloading the busy work of updating, fixing and customizing things. The cost of fixing some annoying behaviors in self-hosted applications has become fairly cheap because maintenance can be automatic as part of having an LLM take care of the update process."}, {"id": 50660905, "au": "fph", "dom": 209, "sr": 72, "sc": 5.02, "ep": 5.59, "bs": 0.0, "d": 3, "age": 24.27, "grav": 359.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 0, "k": 834, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": ["http://some-sketchy-site.com/install"], "ig": 1.136, "fa": 0.62, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "And for some reason these days everyone and their cat wants you to install their software with `curl http://some-sketchy-site.com/install | bash`, even if building packages is easier than ever with LLMs and free Github Actions."}, {"id": 50662122, "au": "zeendo", "dom": 349, "sr": 73, "sc": 5.02, "ep": 5.58, "bs": 0.0, "d": 1, "age": 20.86, "grav": 279.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 179, "qw": 0, "k": 256, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 2.07, "fa": 0.0, "gp": 0.492, "bl": 0.0, "ds": 0.0, "txt": "I don't find the Plex+Arr stack to require all that much babysitting, so there's that. For TV shows, they just show up automatically on new episodes so that's pretty convenient. I also share mine with a lot of friends so I get a bit of cross pollination of interests, which is nice.\n\nOther things I self host are a handful of bespoke applications I've either made by hand (artisinal software from the beforetimes) or a bevy of apps I've vibe coded.\n\nExamples of the above (these are what me and my wife use)\n\nRecipe collection (lots of customization for my household's preferences)\nFinance tracking (A Mint.com clone)\nImmich (family photos)\nShared notes+todo lists (Google Keep clone)\nEbook catalog (Everything out there either does too much or too little)\n\n... plus a lot more little things that only I use.\n\nNone of these _have_ to be self hosted, but we certainly prefer it for things like Immich. And with my setup I have a pretty streamlined dev+build+test+deploy pipeline setup for apps that makes it pretty quick to go from idea to \"production\" deploy with TLS, auth, backups etc."}, {"id": 50660746, "au": "solyin", "dom": 286, "sr": 74, "sc": 5.02, "ep": 5.55, "bs": 0.0, "d": 3, "age": 24.65, "grav": 368.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 783, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.154, "fa": 0.68, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "$20/month for OpenAI vs first you guys dodge three different non-wordpress vendors, then you gotta give WordPress you're email address. Then you gotta deal with WordPress plugins. Yes, I'd rather just give OpenAI $20/month and be done with it."}, {"id": 50665234, "au": "jve", "dom": 180, "sr": 75, "sc": 5.02, "ep": 5.49, "bs": 0.0, "d": 3, "age": 13.02, "grav": 131.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3304, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.508, "fa": 0.34, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "(Pre-AI) I'v been thinking of a system that firewalls off 443 connections by default, but you get some sort of internal panel where you see these \"knocks\" and can choose to open access from that IP for x amount of time...\n\nWould work for occassional sharing/look at this scenario, but... in the end I decided I'm gonna just wireguard my internal network and deal with sharing using public services"}, {"id": 50663554, "au": "Bishonen88", "dom": 142, "sr": 76, "sc": 5.02, "ep": 5.45, "bs": 0.0, "d": 5, "age": 16.88, "grav": 198.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 519, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.849, "fa": 0.0, "gp": 0.763, "bl": 0.0, "ds": 0.0, "txt": "Funny coincidence. My friend who is a non-techie himself, having discovered the simplicity of creating an app via claude (a jobfinder), came to the same conclusion. I.e. perhaps a bit overly motivated, he figured that if he can build apps with little tech know how, then small companies would want some of their problems fixed with ai solutions as well, which he can build.\n\nIgnoring the knowledge gap in software, even if he'd be a techy, I still wonder how a solo dev can meaningfully support various businesses. E.g. it's easy to vibe code any app, deploying might be a bit harder, but then security, maintenance, updates, customer-support etc. spirals out of control when we're talking about doing that for many companies (I think).\n\nAnd with anthropic and others doing everything in their power to make vibe coding viable even for the completely tech-adverse, I wonder how long that niche is a thing anyway..."}, {"id": 50660513, "au": "Spivak", "dom": 300, "sr": 77, "sc": 5.02, "ep": 5.43, "bs": 0.0, "d": 1, "age": 25.06, "grav": 378.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 19462, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 2.016, "fa": 0.0, "gp": 0.479, "bl": 0.0, "ds": 0.0, "txt": "I can see the appeal honestly, I self host a lot of stuff and every app is bespoke; they  require pouring through often outdated and incomplete documentation and usually the source to make apps conform to the rest of my system. Stuff line OIDC and storing all data in 1-2 kinds of db and object storage (sometimes requiring FUSE for apps that demand a filesystem), backups, updates, monitoring, crash recovery.\n\nWriting down how the app should conform to my setup into a skill and then letting the AI do the tedious bits and outputting an Ansible role to do it would save a lot of time and let me experiment more often. I can't imagine letting AI actually build without the framework because the resulting system would be a huge mess."}, {"id": 50662179, "au": "LilBytes", "dom": 248, "sr": 78, "sc": 5.02, "ep": 5.43, "bs": 0.0, "d": 2, "age": 20.68, "grav": 275.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2235, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.808, "fa": 0.0, "gp": 0.814, "bl": 0.0, "ds": 0.0, "txt": "Yep I'm running TalOS and Nix on all my homelab infra now. I've got a 20RU rack cabinet full of end of life hardware running a bunch of shit at home now. Proxmox cluster underneath.\n\nI'm a platform Lead so know my in and outs of k8s. Claude rebuilt my hodge podge of Ansible scripts on Proxmox into all Nix in a couple of nights. And I'm using GitHub Actions to manage my flakes for the private repo.\n\nIt's pretty great."}, {"id": 50663812, "au": "sally_glance", "dom": 249, "sr": 79, "sc": 5.02, "ep": 5.38, "bs": 0.0, "d": 2, "age": 16.23, "grav": 185.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 269, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.86, "fa": 0.0, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "I started switching my homlab to NixOS just before the AI craze started and it was fulfilling but also extraordinarily time consuming. Fast forward to today, everything including my workstations is managed by Nix and AI agents are just crushing it. Compared to k8s and Ansible (still use those at work) I feel AI is much more effective and reliable with a NixOS setup. It can test everything locally, server-side debugging is (nearly) unnecessary and it can identify the esoteric workarounds sometimes needed with ease because it can verify stuff quickly."}, {"id": 50661084, "au": "cliche", "dom": 138, "sr": 80, "sc": 5.02, "ep": 5.38, "bs": 0.0, "d": 2, "age": 23.82, "grav": 348.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 13, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.572, "fa": 0.34, "gp": 0.492, "bl": 0.0, "ds": 0.0, "txt": "I’m just enjoying doing it for myself. I always had ideas to try and make a living of something I built and owned. Now I realise I’m too ADHD for that and if I succeed it will probably become soul sucking too.\n\nI’m just enjoying the moment. It feels like I went back in time 15 years to place I fell in love with computers and building weird stuff. Gonna just do that until it stops being fun.\n\nCorporate jobs are great for feeding the kids addiction to shelter and basic sustenance."}, {"id": 50665050, "au": "jillesvangurp", "dom": 253, "sr": 81, "sc": 5.02, "ep": 5.37, "bs": 0.0, "d": 2, "age": 13.39, "grav": 137.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 173, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.83, "fa": 0.0, "gp": 0.739, "bl": 0.0, "ds": 0.0, "txt": "For stress, anything where you are the bottleneck and a point of failure is going to be a source of stress. LLMs provide part of the solution here.\n\nAll you need to do regularly is ask for your AI coding tools of choice to deal with any new issues. It will never be completely risk free of course but staying on top of all the CVEs has become easier than ever. I have a daily CVE scan running in chat gpt that notifies me of critical new stuff that potentially impacts any of our libraries, services, and components that we are running. If there's anything urgent, I can follow up with a simple prompt to deal with mitigating the issue (roll out some update) as well.\n\nFor risk, less moving parts is better. But we all need to up our game on continuously checking for things to address either way. The way I set this up, I can just react to pre-qualified reports and pre-planned mitigation steps and just put them in motion with minimum hassle while I have my morning coffee."}, {"id": 50660771, "au": "pkulak", "dom": 159, "sr": 82, "sc": 5.02, "ep": 5.36, "bs": 0.0, "d": 1, "age": 24.59, "grav": 366.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 12766, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.471, "fa": 0.0, "gp": 1.31, "bl": 0.0, "ds": 0.0, "txt": "I'm updating my stuff WAY more often with AI. I have an agent check the current version, pull changelogs, look for anything that could go wrong, do a backup, stop, pull, start, verify, then delete backups and dangling containers. Pre AI I did that... basically never. Now I do it once a week. Could even schedule it if I really felt like it.\n\nAlso, I don't put two things on the open internet. My other 2-dozen services are behind Tailscale only."}, {"id": 50663267, "au": "Fire-Dragon-DoL", "dom": 395, "sr": 83, "sc": 5.02, "ep": 5.33, "bs": 0.0, "d": 0, "age": 17.6, "grav": 211.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 2056, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.537, "fa": 0.0, "gp": 1.182, "bl": 0.0, "ds": 0.0, "txt": "Agree, but I went even step further: why self hosting. As long as I have one remote drive of some kind (yes you can self host that), then you can create most apps you need as single page applications with oauth to such drive using sqlite. Of course it depends, but for me photos, cooking recipes, financial management can all be spa that dedupe at write time once in a while. Within a family it's easy to synchronize"}, {"id": 50668290, "au": "odiroot", "dom": 238, "sr": 84, "sc": 5.02, "ep": 5.31, "bs": 0.0, "d": 1, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 3396, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.885, "fa": 0.0, "gp": 0.609, "bl": 0.0, "ds": 0.0, "txt": "I had a similar realisation when I research building a self hosted setup.\n\nI settled on rootless Podman quadlets with systemd and Ansible to orchestrate it.\n\nThis is so simple, well documented and non-magic that even the cheapest models are good with setting it up.\n\nI usually just point an agent at some GH repo or project documentation to prepare a new role based on existing setup. Few minutes later it's all ready and usually doesn't even need any tweaks.\n\nThe hardest part was maybe just setting up Caddy (in a clean amd organised way) and Cloudflare tunnel. Everything else is just additive now."}, {"id": 50662133, "au": "fiso64", "dom": 345, "sr": 85, "sc": 5.02, "ep": 5.3, "bs": 0.0, "d": 1, "age": 20.82, "grav": 278.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 40, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.879, "fa": 0.0, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "I sometimes use Seearr (a fork of Seerr which works with my self-made media server). The Arrs just download straight to my media directory with the \"sequential order\" and \"first and last pieces first\" options passed to qbit, and media is rescanned automatically when it appears (jellyfin also has an option for this, I believe). I don't have to wait for the whole file to be downloaded, maybe at most a few minutes after requesting until it's ready. I found it works decently well after some initial tinkering, but I usually still prefer to browse the trackers and pick the version myself."}, {"id": 50663210, "au": "shevy-java", "dom": 482, "sr": 86, "sc": 5.02, "ep": 5.29, "bs": 0.0, "d": 0, "age": 17.79, "grav": 215.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 53, "k": 2075, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.406, "fa": 0.42, "gp": 0.544, "bl": 0.0, "ds": 0.0, "txt": "> NixOS is a good example. I’ve always liked the idea of declaratively configuring an entire system; I even used it on my laptop during my Linux honeymoon phase. But getting everything configured the way I wanted was quite a hurdle. With the help of AI, I’m now making much more extensive use of NixOS on my home server.\n\nThe idea behind NixOS is great. I am nowhere near as optimistic as to\nhaving to learn a programming language in order to use a computer system\nthough. I could - but I don't really want to use a language merely for\nthat particular use case (e. g. what NixOS offers). There should be\nmultiple ways how one could and should configure a computer system."}, {"id": 50660889, "au": "bendauphinee", "dom": 408, "sr": 87, "sc": 5.02, "ep": 5.26, "bs": 0.0, "d": 0, "age": 24.31, "grav": 359.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 487, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.631, "fa": 0.0, "gp": 0.986, "bl": 0.0, "ds": 0.0, "txt": "The robot caught a cryptominer that had been  put  into my Plex system within about an hour of it being dropped into my system. It was able to pin down the what where and why within five minutes of me  noticing the system was sluggish, and not only helped me clean it up, but also patch my system, and walked me through rotating my Plex credentials.\n\nSystem administration has become in some ways a lot less burdensome, and is definitely helping me to make sure updates are getting handled a lot faster."}, {"id": 50670410, "au": "BobbyTables2", "dom": 50, "sr": 88, "sc": 5.02, "ep": 5.24, "bs": 0.0, "d": 4, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 2660, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.924, "fa": 0.0, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "I’ve also begrudgingly come to similar conclusions.\n\nI didn’t use earlier AI models much but they seemed to mainly  parrot training data instead of anything higher.\n\nHow I find I can point Claude at highly niche things and it seemingly “comprehends” the niche environment and way of doing things.   Humans largely do similar when they re-use experience from employer A when they build things at employer B.\n\nStill bitter at the destruction of rare books though.  While technically not “wrong”, would feel better if they had made digital versions publicly available as a gesture of goodwill.\n\nSure we can’t stop billionaires from buying museums to use rare artifacts as target practice, but at least that doesn’t seem to be a problem today…"}, {"id": 50665536, "au": "grumbel", "dom": 228, "sr": 89, "sc": 5.02, "ep": 5.2, "bs": 0.0, "d": 1, "age": 12.21, "grav": 118.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 195, "qw": 0, "k": 1783, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.779, "fa": 0.0, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "It's the second order effects I find most troublesome. In the past dealing with AI was pretty great, all the stuff that would have been too complicated or laborsome, AI could help you with and you could build all the things you ever wanted, but you still had to guide it along the way.\n\nBut it feels like that period is already coming to an end, as AI isn't just automating part of the software development itself, but changes the nature of software itself. So much stuff that would have required a tool in the past, AI can just solve on the fly by plugging together what is needed. There is no permanent software tool build in the processes. Software loses its permanent status and just becomes something AI creates in a scratchpad and throws away when done with it.\n\nAnd that applies to all of creativity, the road from \"AI helping you to make a movie\", to movies just being something dispensed from the infinite-AI-content machine is short. A large chunk of stock images has already been killed by AI, how long until the same can be said about the next Lord of the Rings or Star Wars?"}, {"id": 50661294, "au": "kikoreis", "dom": 178, "sr": 90, "sc": 5.02, "ep": 5.16, "bs": 0.0, "d": 1, "age": 23.22, "grav": 333.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 597, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Do you need to pubicly serve the self hosted stuff? With a few exceptions I have opted to simply put the services behind a tailnet and use that as the simple security boundary. It works OK for a small team."}, {"id": 50672665, "au": "jmfldn", "dom": 218, "sr": 91, "sc": 5.02, "ep": 5.15, "bs": 0.0, "d": 1, "age": 0.06, "grav": 3.7, "surf": 46.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 2001, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.752, "fa": 0.0, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": "Agree. I decided to use AI in my personal projects as a teacher and to vibe code the tedious scaffolding bits. Eg. I'm building an algorithmic music generator with a bunch of graphics. I don't know anything about graphics so I ask Claude to do those bits, but I want to understand the algorithms. It could write these, but part of the joy for me is really understanding things, and I won't get that unless I write the code, the tests, refactor etc. Ultimately, I enjoy the feeling of thinking deeply, struggling with a problem, and having breakthroughs. And when I get stuck, Claude acts a powerful tutor."}, {"id": 50661325, "au": "downut", "dom": 497, "sr": 92, "sc": 5.02, "ep": 5.15, "bs": 0.0, "d": 1, "age": 23.13, "grav": 331.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 796, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.854, "fa": 0.0, "gp": 0.546, "bl": 0.0, "ds": 0.0, "txt": "What if we treated individual boundary hosts like cattle?\n\nOnce upon a time I even had external facing cattle of multiple species, as a hobby.  Hard to justify now that we are so used to evaluating hobbies based mainly on their ROI (6 month forward facing window).\n\nI just realized I should just push everything to the Cloud.  I should concede to safety considerations and let my betters do their job better.  Problem solved.\n\nThank you."}, {"id": 50663472, "au": "petesergeant", "dom": 400, "sr": 93, "sc": 5.02, "ep": 5.12, "bs": 0.0, "d": 1, "age": 17.04, "grav": 201.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.901, "fa": 0.0, "gp": 0.452, "bl": 0.0, "ds": 0.0, "txt": "I am interested to understand how opensource will fit into this. An interesting example to me is for my personal accounting: an agent is doing all the work, but they're using beancount, because I don't need Claude rediscovering dual-entry accounting edge-cases from first principles.\n\nI've recently rolled out a bespoke vulnerability database, migrating from Defect Dojo Community Edition, which has the most hateful UI known to humans. Having gotten (the agent) to put everything in DD first meant that I wasn't reinventing a data-model to handle this, there was the basis of one already.\n\nThere's a lot of knowledge about data-models, edge-cases, and sensible patterns in existing software."}, {"id": 50662655, "au": "Okiyre", "dom": 185, "sr": 94, "sc": 5.02, "ep": 7.61, "bs": 2.52, "d": 1, "age": 19.43, "grav": 248.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 2.079, "fa": 0.34, "gp": 1.208, "bl": 0.95, "ds": 0.0, "txt": "I would say it's been the complete opposite experience for me - more like the original author's experience.\n\nI've been able to start moving my config to ansible, build and deploy Wazuh across my homelab, decman for arch config, move my self hosted services to cloudflare reverse proxy, deploy OPNSense with better firewall rules than I could previously on my Asus router, add VLANs and IOT monitoring.\n\nThe amount of Crowdsec alerts I get now for bans is 10x lower because my services are only responding to IPs in my geo, after filtering for bad IPs, and Crowdsec also catches crawlers/scrapers before they reach my services.\n\nI also setup Incus VM with nested containerisation and network restrictions so I don't have to worry about auto mode nuking anything. They (agents) can work on my ansible config, test it, and push it to git. I can feed logs as needed for review and troubleshooting. And misconfigurations I'd had in Authelia (nothing impactful for external services) have been picked up as well.\n\nI am totally onboard with the author's experience.\n\nLove the site and concept too."}, {"id": 50672260, "au": "rpdillon", "dom": 38, "sr": 95, "sc": 4.98, "ep": 4.98, "bs": 0.0, "d": 7, "age": 1.13, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "So, I obviously disagree. But in the spirit of actual, honest discussion, I'd like to chat. I also have bills to pay on behalf of the family I support, but I think it's clearly the case that AI is going to be an inextricable element of our society from now on, and I'd best get used to it.\n\nCar analogies abound, but let me attempt one here: you may hate cars, and roads, and gasoline and everything it represents, but ultimately, for many people, you just capitulate and get a car so you can drive to the store and to your job, saving hours a day.\n\nWhen you're fighting \"hours a day\" with \"philosophically, this is bad\", saving time always wins, for better or for worse. For me: I think it's important to stay flexible in your thinking, and allow revolutions to happen. We can't fight the wave, we have to ride it."}, {"id": 50665340, "au": "suncemoje", "dom": 4, "sr": 96, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 3, "age": 12.69, "grav": 126.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 126, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.319, "fa": 0.28, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "- Doomscrolling is worse than smoking. If you come to the conclusion that it sucks more energy than it gives, delete the worst app.\n\n- Boredom I currently also have to fight with as projects and engineering challenges I was looking forward to tackling - which gave me great energy - became simple prompts.\n\nIf you have a great idea, it's amazing that in this era you can reach your goal faster than ever. I currently don't have a great idea or project I'm excited about. Pls fix?"}, {"id": 50668794, "au": "bjackman", "dom": 246, "sr": 97, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 1, "age": 6.83, "grav": 50.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 5033, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.677, "fa": 0.0, "gp": 0.686, "bl": 0.0, "ds": 0.0, "txt": "Sorry for the inevitable \"actually nix\" but I think actually nix is strictly superior now that we have good AI.\n\nAnsible lets you stick with the distros you're already using but now it's so easy to just say \"port that to NixOS\" I'm not sure this benefit is very meaningful any more.\n\nSo then you can get declarative configuration from the ground up instead of kinda tacking it onto a legacy system using janky Python plugins, and using a proper language instead of templated YAML.\n\nIn fact you don't even need a container runtime any more, you can just run everything under systemd on NixOS and if something isn't in nixpkgs you can just say \"package this service in Nix\" - haven't seen Claude ever fail to oneshot these tasks."}, {"id": 50663764, "au": "karles", "dom": 352, "sr": 98, "sc": 4.91, "ep": 4.91, "bs": 0.0, "d": 0, "age": 16.34, "grav": 187.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 508, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.5, "fa": 0.0, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "I am not a developer, but have been using my Mistral-sub to fix Linux-related issues on my desktop. AMD/DirectX-crash-reports while gaming have been monitored and mitigated with the help of AI. I have been able to secure a much smoother SSH-connection to my NAS with the help of my AI, making backups and maintenance of images/video much easier (before I had duplicates everywhere).\n\nI understand the concepts and what they can do for me, but as I'm not a dev, I have never been able to \"weild\" them. Now I can!"}, {"id": 50667584, "au": "poisonborz", "dom": 318, "sr": 99, "sc": 4.9, "ep": 4.9, "bs": 0.0, "d": 1, "age": 8.66, "grav": 70.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3547, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.36, "fa": 0.34, "gp": 0.51, "bl": 0.0, "ds": 0.0, "txt": "For desktops I get it, but servers? Nix is huge compared to a slim ~50Mb Linux container. With a few dependencies to install per app + snapshots, the single-file config isn't that appealing."}, {"id": 50664954, "au": "dspillett", "dom": 26, "sr": 100, "sc": 4.86, "ep": 4.86, "bs": 0.0, "d": 4, "age": 13.59, "grav": 140.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 20, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.295, "fa": 0.42, "gp": 0.431, "bl": 0.0, "ds": 0.0, "txt": "> Wouldn’t using local models remove your concerns?\n\nRunning local models on hardware I can afford at current prices? Would that really be comparable?\n\n> Less environmental impact than watching Netflix or YouTube\n\nMy gut says that is absolutely wrong. And even if not, I'll not be stopping playing videos so the additional power use is still additional power use.\n\n> you own what was stolen\n\nA model trained only on local data is not going to have enough input to be any good."}, {"id": 50669690, "au": "BobBagwill", "dom": 471, "sr": 101, "sc": 4.81, "ep": 4.81, "bs": 0.0, "d": 2, "age": 5.52, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 96, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.337, "fa": 0.34, "gp": 0.482, "bl": 0.0, "ds": 0.0, "txt": "Yeah, it was a bear getting K8s to run on my Casio F-91W.  I ended up having to wire a 144 together into a hypercluster to boot Linux on QEMU on SAM L22."}, {"id": 50661650, "au": "tempest_", "dom": 242, "sr": 102, "sc": 4.79, "ep": 4.79, "bs": 0.0, "d": 1, "age": 22.25, "grav": 310.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2573, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.577, "fa": 0.0, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": "I do notice that LLM agents love to re-invent the wheel when not prodded to use existing solutions. It is usually a bit of \"I created a bash script to ...<whatever>\" and then the existence of that script biases the agent later since that gets into the repo/context and just wants to build on what is already there.\n\nThen of course when asked why it didnt use ansible ect. because that is the use case it is all \"You are totally right etc etc.\""}, {"id": 50660549, "au": "skybrian", "dom": 416, "sr": 103, "sc": 4.77, "ep": 4.77, "bs": 0.0, "d": 0, "age": 24.98, "grav": 376.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.278, "fa": 0.0, "gp": 1.219, "bl": 0.0, "ds": 0.0, "txt": "It seems like a good time to get into client-side encryption. From now on, I plan to write code using a coding agent, but that doesn't mean I want to give it access to the family photos.\n\nIf the data is encrypted blobs, putting it in on R2 or whatever seems okay?\n\nThis is using encryption as a system boundary to make accidental leaks less likely. It doesn't mean I want to compete with Signal. Access control still matters."}, {"id": 50664678, "au": "egeozcan", "dom": 3, "sr": 104, "sc": 4.76, "ep": 4.76, "bs": 0.0, "d": 2, "age": 14.2, "grav": 150.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 6797, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.643, "fa": 0.0, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "This is a very similar feeling to first connecting to the internet and witnessing content appearing on the computer screen.\n\nI remember how my mind was blown to discover that I could download images and make them my wallpaper.\n\nI also remember thinking \"wow I'll never get bored ever in my life again\".\n\nSo many years later... Me doomscrolling, depressingly bored, in a waiting room somewhere."}, {"id": 50671893, "au": "carlosjobim", "dom": 229, "sr": 105, "sc": 4.75, "ep": 4.75, "bs": 0.0, "d": 2, "age": 1.93, "grav": 11.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1513, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.717, "fa": 0.0, "gp": 0.494, "bl": 0.0, "ds": 0.0, "txt": "This is just about stock images, but I think that is a sector that should have been killed long ago. Stock images delivers no value as they are in most cases unrelated to whatever context they are included in. The same for AI.\n\nReal photographs however will show reality, which delivers immense value for customers, and is still very under-used. Even though it's easier than ever to take high quality photos. Even though bandwidth permits delivering them. Even though Instagram is massively popular.\n\nWhy the hell do people insist on using stock images or AI generated images?"}, {"id": 50662505, "au": "samhclark", "dom": 402, "sr": 106, "sc": 4.73, "ep": 4.73, "bs": 0.0, "d": 0, "age": 19.82, "grav": 257.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 104, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.686, "bl": 0.0, "ds": 0.0, "txt": "To the author: bootc for my homelab was a great choice, I think that'll keep working well for you. I've been using it without problems for about a year and a half now. One nice thing is that you won't run into ZFS compatibility issues anymore with unattended upgrades, because the updated image will fail in CI instead.\n\nWish you luck getting that working with Debian! I've only used Fedora CoreOS, but I saw bootcrew's image and that didn't seem so hard to replicate myself..."}, {"id": 50661300, "au": "jwilliams", "dom": 435, "sr": 107, "sc": 4.72, "ep": 4.72, "bs": 0.0, "d": 0, "age": 23.19, "grav": 332.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 5725, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.448, "fa": 0.0, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "I self-host _a lot_ of stuff at work and home now. Cloudflare+D1+ZeroTrust is the way. And yes, that includes a delivery harness and bespoke CRM.\n\nMy only gripe is sometimes I want to use the tools in multiple places and they’re too tailored to their specific role (yes, the irony is sharp)."}, {"id": 50660650, "au": "manjalyc", "dom": 390, "sr": 108, "sc": 4.71, "ep": 4.71, "bs": 0.0, "d": 0, "age": 24.81, "grav": 372.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 257, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.826, "bl": 0.0, "ds": 0.0, "txt": "AI has made it ridiculously easy and extremely useful. Messing with self-hosted applications that would take me days to set, configure properly, and debug is now a few minutes of chatting. It’s exhilarating.\n\nSeems like a lot of people here roll their own security configs, if you’re application can sit behind a gate like Cloudflare zero trust it makes security a lot simpler."}, {"id": 50661475, "au": "ma2kx", "dom": 386, "sr": 109, "sc": 4.69, "ep": 4.69, "bs": 0.0, "d": 0, "age": 22.76, "grav": 322.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 12, "k": 130, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.987, "fa": 0.42, "gp": 0.812, "bl": 0.0, "ds": 0.0, "txt": "> They don’t need to [...] be particularly interesting to anyone other than me.\n\nI understand this opinion from an emotional perspective but I strongly disagree. We are now in a (I guess small) time window where nerds like us are capable of building something not just for us but for our local communities and we should try to use this chance before its gone again.\n\nWe rather should host instances of peertube, linkding, flarum or whatever community strengthening apps are out there because we have now the capabilities to integrate them as it was only possible for big tech a few years ago. I'm developing a small flarum instance where some \"vibe coded\" services ingest local events, news, political decisions etc. pp. which are things a global acting company just doesn't care (and what in my opinion led us to this horrible geopolitics we are in at the moment). Sure it's still not and will never be as polished as the big platforms but it's a bit like comparing Walmart (or Aldi for us german natives) with a local fish market where people can interact with other people without a corporate layer between."}, {"id": 50660569, "au": "killingtime74", "dom": 419, "sr": 110, "sc": 4.67, "ep": 4.67, "bs": 0.0, "d": 0, "age": 24.95, "grav": 375.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 2721, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.448, "fa": 0.0, "gp": 0.877, "bl": 0.0, "ds": 0.0, "txt": "I just set up a K3S Kubernetes cluster on my mini server and AI is able to easily host things, check logs, deploy, everything fully automated. While I do know Kubernetes, you wouldn't have to know it to do this because AI does it all for you.\n\nI use Cloud Native PG to provide databases and the Cloudflare Tunnel Operator to provide connectivity to my domain name.\n\nDon't have to expose any network ports or anything."}, {"id": 50663443, "au": "sph", "dom": 65, "sr": 111, "sc": 4.66, "ep": 4.66, "bs": 0.0, "d": 4, "age": 17.11, "grav": 202.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 33735, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.52, "fa": 0.0, "gp": 0.752, "bl": 0.0, "ds": 0.0, "txt": "But it’s good that the boomers are having the time of their lives creating slop.\n\nWhen I was a kid, I dreamt of a machine, to which I could ask and receive whatever I desire. This is what it feels reading the upthread comments. What I didn’t know at the time, and what the people in this thread still haven’t learned, is that being able to receive everything you want in minutes just devalues it; you play with it a bit and you have already moved to the next shiny idea.\n\nLike any spoiled baby, you’ll soon get bored of it. Quite fitting metaphor for the spoiled generation."}, {"id": 50662458, "au": "cco", "dom": 423, "sr": 112, "sc": 4.65, "ep": 4.65, "bs": 0.0, "d": 0, "age": 19.94, "grav": 259.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2282, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.499, "fa": 0.0, "gp": 0.781, "bl": 0.0, "ds": 0.0, "txt": "It's been a blast, smart mirrors, self hosted cloud photos, eink photo frames for my parents, personal fintech; everything all built and running the way I want.\n\nTailscale needs an extra shout out btw, makes a lot of this easier and more secure than it otherwise would be."}, {"id": 50662965, "au": "lhk931122", "dom": 309, "sr": 113, "sc": 4.65, "ep": 4.65, "bs": 0.0, "d": 0, "age": 18.45, "grav": 228.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 12, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.408, "fa": 0.0, "gp": 0.924, "bl": 0.0, "ds": 0.0, "txt": "With things like this, using and automating new stuff is getting so convenient. On the other hand, it seems like naturally picking up the knowledge about it is getting harder. So I'm studying separately, and it feels kind of like cars came along and the places you can go grew a lot, but your body actually got weaker so you go running separately for exercise."}, {"id": 50663502, "au": "unglaublich", "dom": 106, "sr": 114, "sc": 4.64, "ep": 4.64, "bs": 0.0, "d": 1, "age": 16.98, "grav": 200.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 3323, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.917, "bl": 0.0, "ds": 0.0, "txt": "I was vibing this fun game, and then showed it to a friend. He had great ideas and we said let's just share and collab a bit. And then the first PR came in and I was like \"fuck this shit\", it's like work.\n\nSo I explained to him that this wasn't fun for me, and that I would like to share ideas and experiences, and rather just prompt the agent myself instead of receiving huge PRs.\n\nSoftware for one, I heard another person call it."}, {"id": 50661493, "au": "_heimdall", "dom": 415, "sr": 115, "sc": 4.63, "ep": 4.63, "bs": 0.0, "d": 0, "age": 22.73, "grav": 321.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 6774, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.468, "fa": 0.0, "gp": 0.812, "bl": 0.0, "ds": 0.0, "txt": "I've definitely done more self-hosting now that I have a bit of help from, or can work more quickly with, Claude.\n\nI've had a homelab for years but it often went unattended and under utilized. About a year ago I revamped it with a fresh minipc and a couple SSDs and have been slowly building out a library of open source and one-off tools on a private tailnet."}, {"id": 50660524, "au": "jazzyjackson", "dom": 212, "sr": 116, "sc": 4.6, "ep": 4.6, "bs": 0.0, "d": 2, "age": 25.03, "grav": 377.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 12732, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.662, "fa": 0.0, "gp": 0.478, "bl": 0.0, "ds": 0.0, "txt": "I have a public ip VPS proxying to my home lab and I’m wondering where to go for the least attack surface if I’m just running caddy and wireguard.\n\nFedora CoreOS is an interesting offering, and Debian with unattended updates sounds good too. I like what SELinux can do for hardening the filesystem. Seems like even if a subprocess gets owned you get isolation from siblings."}, {"id": 50661350, "au": "dspillett", "dom": 21, "sr": 117, "sc": 4.59, "ep": 4.59, "bs": 0.0, "d": 2, "age": 23.07, "grav": 330.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 11, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.886, "fa": 0.42, "gp": 0.907, "bl": 0.0, "ds": 0.0, "txt": "> Yeah, I've been doing everything I've ever wanted, it's been amazing..\n\nI can't make myself do it. I've got a huge list of possible projects that I'd like to tinker with, and seeing what others do with AI it would be great. But I want to make those things, not have someone else or something else do it. And that's without my more general objections¹ to the whole thing.\n\n--------\n\n[1] environmental impact, the \"greatest theft of labour in history\" and the idea of funding the companies that did that, I could rant on but this isn't the thread for that"}, {"id": 50667273, "au": "LelouBil", "dom": 233, "sr": 118, "sc": 4.59, "ep": 4.59, "bs": 0.0, "d": 1, "age": 9.15, "grav": 76.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 2247, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.659, "fa": 0.0, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "What worked for me is to almost never let an agent edit my working copy of a project, however, to regularly prompt it for review, or to implement something I want in a scratch copy that I then use as a reference.\n\nIt's almost like working pre-AI, except I always have very relevant documentation available.\n\nI know if what I want to do is possible or not while retaining control because when implementing the feature (by hand) I understand what I'm typing and make edits if it doesn't make sense for me.\n\nThe rule is, if I don't understand it I'm skipping it, and I'll see what breaks and maybe re-prompt to ask, but never let the AI do the edits. Always prompt for explanation and never action.\n\nTo me, it's the best way to upgrade your workflow without losing ownership of your projects."}, {"id": 50660400, "au": "markasoftware", "dom": 271, "sr": 119, "sc": 4.58, "ep": 4.58, "bs": 0.0, "d": 0, "age": 25.28, "grav": 384.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1051, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.941, "fa": 0.0, "gp": 1.633, "bl": 0.0, "ds": 0.0, "txt": "What's the purpose of self hosting? Sure, part of it is data sovereignty and reducing dependence on big tech and whatever, but for me the main purpose and effect was to learn and to have pride in my setup (same reason one might buy an old car), both of which LLMs negate"}, {"id": 50669996, "au": "slohr", "dom": 20, "sr": 120, "sc": 4.58, "ep": 4.58, "bs": 0.0, "d": 3, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 12, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.76, "fa": 0.0, "gp": 0.304, "bl": 0.0, "ds": 0.0, "txt": "Yeah, the CREATING sentiment is spot on for me. I did enjoy slinging code and would even choose languages that I felt more \"creative\" with but now that I can vibe whatever I want it's total bliss. I didn't realize how deep my backlog of \"I wish I had this but ugh all of the boilerplate.\" And for the \"work\" part I feel more like a woodworker where I cook up highly specialized tools to help me with a specific task (think custom jigs etc.). Before I'd do without, but now I'll vibe up a tiny tool, solve the problem and then move on. No intention of marketing that tool but wow does it save me a ton of time. just absolute bliss."}, {"id": 50660726, "au": "randypewick", "dom": 430, "sr": 121, "sc": 4.56, "ep": 4.56, "bs": 0.0, "d": 0, "age": 24.69, "grav": 369.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 26, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.406, "fa": 0.0, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "I have been happy lately using LLMs with nixos: lots of small tasks that I had there waiting, pending, I managed to complete in a few days of sparse interaction with open LLMs. Best thing is that nix makes reviews very easy to me, so it was \"do, wait for my review, deploy\"."}, {"id": 50660987, "au": "dofm", "dom": 195, "sr": 122, "sc": 4.56, "ep": 4.56, "bs": 0.0, "d": 1, "age": 24.08, "grav": 354.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 28, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.953, "fa": 0.42, "gp": 0.776, "bl": 0.0, "ds": 0.0, "txt": "> Previously that meant using fail2ban and running a system update every few months. Now it means patching within 24hrs of a CVE9+ dropping, which is happening at an accelerated rate.\n\nYeah. This has fully changed my approach to web dev; for me as a solo/freelance developer at this scale, pretty much all interpreted languages are too great a risk in various different ways."}, {"id": 50661662, "au": "odo1242", "dom": 424, "sr": 123, "sc": 4.55, "ep": 4.55, "bs": 0.0, "d": 0, "age": 22.21, "grav": 309.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1470, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.184, "fa": 0.22, "gp": 0.788, "bl": 0.0, "ds": 0.0, "txt": "AI makes a lot of self-hosting tools and frameworks that have a really large startup cost but are very efficient and reliable once set up correctly a much better deal to work with. I've been hosting my homelab server on NixOS, at the moment, something I'd be unlikely to do otherwise."}, {"id": 50670415, "au": "cpill", "dom": 12, "sr": 124, "sc": 4.54, "ep": 4.54, "bs": 0.0, "d": 4, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 143, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.706, "fa": 0.0, "gp": 0.365, "bl": 0.0, "ds": 0.0, "txt": "really, anthropic are going to shut down China's open weights models (there are very few open source models). never going to happen. it's China's long game. as soon as the pressure on the hardware market drops, self housing becomes viable, AI bubble bursts, and the US/Global economy crashes. And I'll finally be able to buy another raspberry pi :D"}, {"id": 50660457, "au": "lazzurs", "dom": 428, "sr": 125, "sc": 4.54, "ep": 4.54, "bs": 0.0, "d": 0, "age": 25.17, "grav": 381.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 91, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 0.972, "fa": 0.34, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "Yep, totally agree with this and pretty much mirror it. I've been self hosting for 25 years or more but recently it's gotten easier and i've been doing more of it. Security is part of that for sure and wanting to not have my home dependant on cloud services that might be compromised."}, {"id": 50660363, "au": "xtracto", "dom": 334, "sr": 126, "sc": 4.53, "ep": 4.53, "bs": 0.0, "d": 0, "age": 25.33, "grav": 385.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7583, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 1.134, "bl": 0.0, "ds": 0.0, "txt": "I like to self-host but all my services run behind a Wireguard VPN. Otherwise they are services waiting to be PWNED by North Korea or any other random bad actor. I should know, a droplet I had with some PoC app I had got pwned. (well, only the docker container which ran with its own non-root user, but still...)"}, {"id": 50664119, "au": "velo_aprx", "dom": 217, "sr": 127, "sc": 4.53, "ep": 4.53, "bs": 0.0, "d": 0, "age": 15.49, "grav": 172.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 393, "kpp": 15.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 1.226, "bl": 0.0, "ds": 0.0, "txt": "With AI, the problem-solving aspect of my interest in computers is gone. And with it, much of my interest in computers.\n\nThe fact that AI can do pretty much anything is amazing, but using it feels about as rewarding as using cheat codes in your favorite game as a kid.\n\nIt's great fun for a while, until you realize you've ruined the game for yourself."}, {"id": 50669945, "au": "cruffle_duffle", "dom": 24, "sr": 128, "sc": 4.51, "ep": 4.51, "bs": 0.0, "d": 4, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 335, "qw": 0, "k": 891, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.682, "fa": 0.0, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "Yup. You hit the boundary between what the thing can crank out for you on basically autopilot and what you’d actually need to do to make it rise to the next level and go… “naw”…\n\nThese LLMs will get you to “average” but any more than that you have to become a knowledgeable domain expert yourself. Granted “average” is pretty amazing, but to me anyway the delta between what the thing cranked out and what I’d actually need to invest of myself in making it go further is what makes be table the thing.\n\nIt’s kind of weird because it’s a reminder that Brook’s “no silver bullet” is alive and true even in this brave new world.  To make something truly unique and interesting you still need to know stuff.  You won’t be able to create truly good user experiences unless you know the craft and can guide the AI.  You won’t be able to make a truly good music synth unless you actually know and understand the underlying way a synth works. You can vibe your way to “the average synth” or “the average UX” but the LLM won’t help you go any further unless you learn the domain you are working in.\n\nAnd while the LLM is a good teacher, you still need to validate it isn’t leading you off course because your lack of domain knowledge. It will be more then happy to teach you physics using a language that only makes sense in your head and will thus always be “somewhat wrong” and as a result you’ll get output"}, {"id": 50661425, "au": "xx__yy", "dom": 338, "sr": 129, "sc": 4.39, "ep": 4.39, "bs": 0.0, "d": 0, "age": 22.87, "grav": 325.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 101, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 1.079, "bl": 0.0, "ds": 0.0, "txt": "Completely agree, but don't fall into the trap of relying on an agent/AI for anything, unless it's also self hosted.\n\nNumber 1 rule - Home labs should continue working without an internet connection."}, {"id": 50660752, "au": "jamesfinlayson", "dom": 273, "sr": 130, "sc": 4.37, "ep": 4.37, "bs": 0.0, "d": 2, "age": 24.63, "grav": 367.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1255, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.115, "fa": 0.34, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I initially did it as a learning/keeping my skills sharp thing but knowing it was always going to be a flat $5 a month quickly became the real reason."}, {"id": 50660535, "au": "probably_wrong", "dom": 495, "sr": 131, "sc": 4.36, "ep": 4.36, "bs": 0.0, "d": 1, "age": 25.0, "grav": 377.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.603, "fa": 0.0, "gp": 0.406, "bl": 0.0, "ds": 0.0, "txt": "Security was always a problem, as there always were more CVEs than one can reasonably read and automated attacks are the background noise of the internet. Good practices (service isolation, one purpose per server) remain good practices, LLMs or not.\n\nFun fact: I recently learned of a server with a 10/10 vulnerability that had been online without updates for the last two years. Sometimes being small pays off."}, {"id": 50660587, "au": "comrade1234", "dom": 453, "sr": 132, "sc": 4.34, "ep": 4.34, "bs": 0.0, "d": 0, "age": 24.92, "grav": 375.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 3268, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.829, "bl": 0.0, "ds": 0.0, "txt": "I've been self-hosting for years and lately I've been using ai as a support-bot for configurations. It's nice but sometimes after a long day of back-and-forth communication with the ai and configuration changes I feel like I accomplished tons but then I step back and think about it and realize I probably would have been faster if I had just read some man pages and other documentation."}, {"id": 50661330, "au": "joegibbs", "dom": 87, "sr": 133, "sc": 4.34, "ep": 4.34, "bs": 0.0, "d": 1, "age": 23.11, "grav": 331.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 2141, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.261, "fa": 0.0, "gp": 0.949, "bl": 0.0, "ds": 0.0, "txt": "Agreed, if you have a good idea now then it's definitely worth just vibe coding it and seeing how it goes. After all, if the result is no good you can throw it away and you've only spent a couple of hours on it.\n\nPerhaps I have what seems like a good idea for a feature - then I spin it up and it's no good. Before, I would've spent hundreds of hours getting that feature done and I would feel attached to it even if it's not actually good. Now I can just throw it out and try something else."}, {"id": 50664725, "au": "crozzfire", "dom": 389, "sr": 134, "sc": 4.34, "ep": 6.85, "bs": 2.52, "d": 1, "age": 14.1, "grav": 148.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 75, "qw": 0, "k": 5, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://scintle.github.io/scintle/"], "ig": 1.406, "fa": 0.96, "gp": 0.562, "bl": 0.95, "ds": 0.0, "txt": "Don't even get me started! Truer words couldn't have been spoken. I thought it was my ADHD at first :p\n\nJust about 4 days back I built https://scintle.github.io/scintle/ because it was getting really hard for me to track and manage all the ideas; so I built a Claude Plugin that reads your Claude Code sessions and discovers the ideas and their milestones on its own. I'm currently the only user, but I've open sourced it hoping that it helps others like myself too!"}, {"id": 50666679, "au": "agile-gift0262", "dom": 387, "sr": 135, "sc": 4.32, "ep": 4.32, "bs": 0.0, "d": 0, "age": 10.06, "grav": 88.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 368, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.305, "fa": 0.28, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "One thing I find really useful with AI for self-hosting, is that now cloning the source and tweaking it to my liking isn't a PITA to maintain. For example, I have a patch to filter out shorts in my invidious instance, and now whenever I pull from upstream, if there are conflicts, I just tell an LLM to resolve them"}, {"id": 50662055, "au": "mrheosuper", "dom": 343, "sr": 136, "sc": 4.31, "ep": 4.31, "bs": 0.0, "d": 0, "age": 21.07, "grav": 284.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1215, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.868, "fa": 0.0, "gp": 1.57, "bl": 0.0, "ds": 0.0, "txt": "What are people self-hosting ?  \nI have Jellyfin with Arr stack on my machine, but it's not really convenient. I have to wait for a movie to download before i can start watching, then i also have to baby sit the arr stack(cloudflare stuff, torrent stuff, tracker stuff). It's just not ideal."}, {"id": 50668308, "au": "avtar", "dom": 344, "sr": 137, "sc": 4.21, "ep": 4.21, "bs": 0.0, "d": 1, "age": 7.56, "grav": 58.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 17, "qw": 0, "k": 977, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": ["https://github.com/kiriwalawren/nixflix"], "ig": 0.868, "fa": 0.75, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "Not sure what your setup is, but this project makes managing the arr stack a fairly hands-off experience:\n\nhttps://github.com/kiriwalawren/nixflix"}, {"id": 50667654, "au": "Velocifyer", "dom": 191, "sr": 138, "sc": 4.2, "ep": 4.2, "bs": 0.0, "d": 1, "age": 8.57, "grav": 69.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 779, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "self_hosting", "flbl": "Self & Hosting (Internet)", "urls": [], "ig": 1.544, "fa": 0.0, "gp": 0.394, "bl": 0.0, "ds": 0.0, "txt": "With the caddy webserver/reverse proxy, you can make so a file existing shuts down asses to a service, without editing the main config or reloading caddy. I wonder if an Ai agent that can autonomously create said files could work, as most vulnerabilities are for programs behind a reverse proxy anyways."}, {"id": 50661118, "au": "singingtoday", "dom": 93, "sr": 139, "sc": 4.19, "ep": 4.19, "bs": 0.0, "d": 1, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 255, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 0.997, "bl": 0.0, "ds": 0.0, "txt": "It's worth implementing more often than not I've found, these days anyways. You sometimes don't know if an ideas good until it's realized. Add implementing them is often a /goal with several follow-ups.\n\nIt's almost too easy! But, like you said, bliss!"}, {"id": 50660604, "au": "danparsonson", "dom": 493, "sr": 140, "sc": 4.18, "ep": 4.18, "bs": 0.0, "d": 1, "age": 24.9, "grav": 374.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 4589, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.641, "fa": 0.0, "gp": 0.224, "bl": 0.0, "ds": 0.0, "txt": "Consider hiding everything behind Wireguard and if you can afford a second server and your provider lets you build a private network, use a gateway as your public server, then you can remove all direct public access to your main server. Configure your providers firewall as well as the software firewalls and now your public attack surface is one Wireguard port and the firewalls. Not perfect by any means but it gives you a bit of breathing space when patches are delayed. Of course you should still patch everything and keep good security within your private network."}, {"id": 50664974, "au": "nz", "dom": 120, "sr": 141, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 2, "age": 13.54, "grav": 139.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 1166, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.619, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "Please, do not insult the bipolar lisp programmers[0]. At least the bipolar lisp programmers know how to program, and care enough about computing, that they are willing to put in the time and effort to change it. This is a different kind of bipolarity entirely. This is the bipolarity of pseudo-programmers. This is the bipolarity of those same people who were _mistaken_ for bipolar lisp programmers in the 90s, but then embraced perl at the first opportunity. Have lisp and its programmers not been defamed and scapegoated enough?\n\n[0]: I say this with empathy, as I certainly also fit the profile more often than I do not. Also, Lisp (the whole language family) holds and reveals far and away more secrets about computing than any LLM I've ever used."}, {"id": 50660895, "au": "whacko_quacko", "dom": 367, "sr": 142, "sc": 4.13, "ep": 4.13, "bs": 0.0, "d": 0, "age": 24.29, "grav": 359.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 97, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.858, "bl": 0.0, "ds": 0.0, "txt": "for me it's the other way around. now that every other day a model finds an RCE exploit in  a big software project or framework, I don't feel like I can trust myself to react fast enough to keep my infra secure..."}, {"id": 50667346, "au": "matsemann", "dom": 220, "sr": 143, "sc": 4.13, "ep": 4.13, "bs": 0.0, "d": 2, "age": 9.03, "grav": 75.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 24284, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.464, "fa": 0.0, "gp": 0.478, "bl": 0.0, "ds": 0.0, "txt": "Same. Tinkering is the fun. The \"project\" is just a means to find cool things to play with. I've also never made a game, but I've had loads of fun never making it.\n\nLike, my white whale is a puzzle game, and I once spent a week on learning how to write water shaders. Water is only in the background of a level and has no effect on the gameplay. It was just fun. If I wanted to actually finish the game, I could've skipped it or just downloaded a water asset. But that was never the point."}, {"id": 50661935, "au": "dangoodmanUT", "dom": 412, "sr": 144, "sc": 4.1, "ep": 4.1, "bs": 0.0, "d": 0, "age": 21.45, "grav": 292.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1506, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.766, "bl": 0.0, "ds": 0.0, "txt": "Agreed. Kubernetes, especially on AWS, has become so much easier now.\n\nThe k8s ecosystem has become so much more accessible. It's become a great foundation to build on, primarily using it as a low-level compute scheduler (just getting ec2 instances). Combined with the nitro runtime, you can build your own scheduler on top of k8s that is very portable across cloud providers."}, {"id": 50662053, "au": "echelon", "dom": 133, "sr": 145, "sc": 4.02, "ep": 4.02, "bs": 0.0, "d": 3, "age": 21.08, "grav": 284.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 22045, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.958, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "1. Twitter is full of them. You don't have to look hard.\n\n2. Ask any VC, and they'll tell you your $10M ARR isn't impressive anymore because they've seen it a thousand times this year.\n\n3. ArtCraft pre-Craft Apps"}, {"id": 50660430, "au": "ygjb", "dom": 290, "sr": 146, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 1, "age": 25.22, "grav": 382.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 2400, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 1.479, "fa": 0.0, "gp": 0.334, "bl": 0.0, "ds": 0.0, "txt": "That's not true.  I self host and build a lot of software using LLMs. I read everything and frequently add something like \"provide a step by step configure guide rooted in documentation with supporting links, and an explanation of why you are recommending that.\"\n\nCoupled with running it in a shell my agent has visibility into, I can makes sure I learn what I am building and get interactive help if something doesn't work and links to the reasons why."}, {"id": 50665389, "au": "onel", "dom": 335, "sr": 147, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 0, "age": 12.59, "grav": 124.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 81, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_selfhosting", "flbl": "Fun & Self-hosting (Server)", "urls": [], "ig": 1.269, "fa": 0.0, "gp": 0.672, "bl": 0.0, "ds": 0.0, "txt": "Fully agree with this.\n\nIf it wasn't for AI I wouldn't have been able to start building moose, an OS for self-hosting.\nIt is the kind of project that would have taken me years to get good at and more years to have the team to build.\n\nI can make it exactly as I want it and not do the things that I see at other self-hosting operating systems: like being fully open source.\nI can mak le the UX as I want it, etc\nMaybe as a builder it's more fulfilling, but also as a user this feels amazing because it's scratch a hard itch I had.\nMore of this"}, {"id": 50661237, "au": "cliche", "dom": 119, "sr": 148, "sc": 3.95, "ep": 3.95, "bs": 0.0, "d": 2, "age": 23.38, "grav": 337.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 13, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_nixos", "flbl": "Software & Nixos (Complex)", "urls": [], "ig": 1.516, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "Had to look up the reference. \nDescribes me very accurately. Weirdly though only on the graveyard of side projects. My professional life I’ve managed to get head down and ship the software. And I still take pride in what I build - professional software engineering.\n\nI think a lot of folks like myself just do something out of interest, get the initial buzz and learn some stuff.\n\nNot everything needs to be economically productive. I’m quite grateful for LLMs that I’ve been able to get at least some side projects into a useable state… even if just for myself as an unprofessional software engineer."}, {"id": 50661025, "au": "dawnerd", "dom": 354, "sr": 149, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 0, "age": 23.98, "grav": 351.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 9753, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_claude", "flbl": "Code & Claude (Apps)", "urls": [], "ig": 0.988, "fa": 0.0, "gp": 1.094, "bl": 0.0, "ds": 0.0, "txt": "Self hosted apps used to have fairly unique designs and sometimes quirky ui. Now it’s all half baked Claud uis. Even older apps that had good ui have switched to be more ai looking."}, {"id": 50661109, "au": "singingtoday", "dom": 388, "sr": 150, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 0, "age": 23.73, "grav": 345.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 255, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "It very much did!\n\nI've had an explosion of creativity and new projects over the last 6 months. Ideas I had been thinking of for years but never had the time. Some are even getting Google traffic, though that's not really my goal.\n\nIt's pure entertainment for me. Better than any game I played in my life. I'm having a blast with all these powerful tools!"}, {"id": 50662063, "au": "flaunf221", "dom": 239, "sr": 151, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 1, "age": 21.05, "grav": 283.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 134, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "getting_llm", "flbl": "Getting & LLM (Agent)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.595, "bl": 0.0, "ds": 0.0, "txt": "Author doesn't go into details on what they configure, but as
