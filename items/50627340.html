s when he chooses to stop taking my appointments.\n\nMy company has policies for when people want to move to a new department. Sometimes my boss can refuse the transfer. Depending on your company, sometimes you are allowed to switch to a different department and the old one can't ask your questions anymore."}, {"id": 50634703, "au": "tencentshill", "dom": 132, "sr": 240, "sc": 1.78, "ep": 1.78, "bs": 0.0, "d": 1, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2108, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "If I run my own abliterated AI agent locally that acts like a user, what exactly are they going to do about it? Ratelimiting my entire IP is all that can be done."}, {"id": 50628377, "au": "jatora", "dom": 211, "sr": 241, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 1, "age": 13.01, "grav": 131.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 222, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.671, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Hmm but objectively open models are not great. Closed models still devastate them in every way."}, {"id": 50629396, "au": "surajrmal", "dom": 146, "sr": 242, "sc": 1.75, "ep": 1.75, "bs": 0.0, "d": 2, "age": 11.87, "grav": 113.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 2079, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.743, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But we're not suggesting making guns illegal. We're suggesting that they deactivate when you try to use them in non lawful ways. Which itself has a lot of nuance, but I agree it's the right thing to do wrt llms."}, {"id": 50637360, "au": "keeda", "dom": 179, "sr": 243, "sc": 1.74, "ep": 2.59, "bs": 0.85, "d": 7, "age": 1.38, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.103, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Anthropic paid a 1.5 billion settlement for their violation of copyright law. And they and the rest of the industry changed their practices to buying (and famously, destroying) physical books to get their data legally. Looks like they're willing to comply with copyright laws, why not contract law?"}, {"id": 50629544, "au": "myaccountonhn", "dom": 142, "sr": 244, "sc": 1.72, "ep": 1.72, "bs": 0.0, "d": 1, "age": 11.72, "grav": 111.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1187, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.483, "fa": 0.0, "gp": 0.406, "bl": 0.0, "ds": 0.0, "txt": "To some extent yes. Of course the question is who gets to set the rules they adhere to because it sucks being blocked from doing an action because US laws dictated it not OK, when you're in a different country. Basically means there is no way for you to influence."}, {"id": 50632859, "au": "KellyCriterion", "dom": 52, "sr": 245, "sc": 1.72, "ep": 2.91, "bs": 1.19, "d": 2, "age": 8.07, "grav": 63.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 9, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.474, "fa": 0.42, "gp": 0.412, "bl": 0.45, "ds": 0.0, "txt": ">And LLM is autocomplete that you didn't create yourself\n\nWell, if thats the case then Im still happy watching the codequality growing massivly in our team month by month (and this is only one area of application)\n\n:)"}, {"id": 50636311, "au": "ragall", "dom": 12, "sr": 246, "sc": 1.7, "ep": 2.23, "bs": 0.53, "d": 3, "age": 3.67, "grav": 22.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 570, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "Even if the LLMs were subject to the same obligations as people, it would be even more difficult to prove that a leak occurred. The best choice here is to run your own models and never ever entrust that data to any third party."}, {"id": 50635162, "au": "warkdarrior", "dom": 103, "sr": 247, "sc": 1.68, "ep": 1.68, "bs": 0.0, "d": 8, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1891, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.493, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "So you are OK with LLM providers not taking on any liability. You the user of the LLM will be on the hook for anything the LLM does once you prompt it. Ok with this liability?"}, {"id": 50628926, "au": "bell-cot", "dom": 72, "sr": 248, "sc": 1.67, "ep": 1.67, "bs": 0.0, "d": 1, "age": 12.44, "grav": 122.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 13442, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.543, "fa": 0.0, "gp": 0.271, "bl": 0.0, "ds": 0.0, "txt": "This is a lovely ideal.\n\nVs. in the current real world...yeah.  It'd also be lovely if for-profit prisons were all focused on caring for every \"guest's\" health and happiness."}, {"id": 50629155, "au": "Aurornis", "dom": 174, "sr": 249, "sc": 1.67, "ep": 2.51, "bs": 0.85, "d": 3, "age": 12.16, "grav": 118.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.847, "fa": 0.0, "gp": 0.36, "bl": 0.32, "ds": 0.0, "txt": "Have you considered what that conspiracy theory would require? Thousands of employees all agreeing to never leak the fact that their employer is entering into legally binding contracts and then breaking those contracts?\n\nWe’re talking about AI labs where people quitting and going to the press with concerns about AI getting too good is a monthly occurrence. Their employees are literally trying to whistleblow that the product is working too well. And you think those same employees are going to join together and agree to never leak this critical secret that would destroy the company and drive away their customers?\n\nExtending this theory to Amazon Bedrock is even more unbelievable, as it would require Amazon to have secret agreements with the AI companies to exfiltrate the data back to them. I don’t think the people pushing this conspiracy theory have thought about what it would require and how many people would need to maintain secrecy about it forever."}, {"id": 50630338, "au": "Spivak", "dom": 154, "sr": 250, "sc": 1.66, "ep": 1.66, "bs": 0.0, "d": 3, "age": 10.87, "grav": 99.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 19462, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.484, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Tell me more about how you love an unaccountable corporation telling you what you what's best for you.\n\nBet you'll be extra happy when browsers decide to respect website operators who don't wish their ads or tracking to be blocked. I can't wait for the \"no but that's different…\""}, {"id": 50630605, "au": "pjmlp", "dom": 20, "sr": 251, "sc": 1.65, "ep": 1.65, "bs": 0.0, "d": 3, "age": 10.56, "grav": 95.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.641, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "In many companies, you either work on what you are told to do, or you leave.\n\nIt is still a choice, or not, depending on how the job market happens to be like."}, {"id": 50628223, "au": "tintor", "dom": 313, "sr": 252, "sc": 1.62, "ep": 1.62, "bs": 0.0, "d": 1, "age": 13.19, "grav": 133.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1549, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.688, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The only solution is open weight models, and the gap to frontier models is slowly shrinking."}, {"id": 50635995, "au": "keeda", "dom": 155, "sr": 253, "sc": 1.58, "ep": 1.58, "bs": 0.0, "d": 4, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.673, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sounds to me like the unaccountable corporation is not telling OP what’s best for them, but more like they both agree on what’s best for the world.\n\nOthers are free to disagree, of course, and they can use the products that are open source, or from another unaccountable corporation ;-)"}, {"id": 50634856, "au": "fk202611", "dom": 274, "sr": 254, "sc": 1.58, "ep": 4.1, "bs": 2.52, "d": 0, "age": 5.81, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 3, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.453, "fa": 0.0, "gp": 0.47, "bl": 0.95, "ds": 0.0, "txt": "I create Instagram Reels myself, so I read this article from a creator's perspective.As a creator, what the author was trying to do — find the artist and pay them fairly — is exactly what I would want viewers to do. However, the AI agent helped with an approach that brought no benefit to the creator.I use AI as one of my advisors, but I make the final decisions myself. However, this example shows that even this approach has its limitations.I may think I'm making the final decision myself, but in reality, AI may have already eliminated some possibilities before I even get to see them."}, {"id": 50629677, "au": "xtracto", "dom": 213, "sr": 255, "sc": 1.54, "ep": 1.54, "bs": 0.0, "d": 1, "age": 11.59, "grav": 109.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 7583, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.654, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That doesn't worry me at all. It's the same story we had with Open Source software since the 80s: when it was young, you couldn't compare it with their closed equivalents, but nowadays they have all but replaced them."}, {"id": 50628422, "au": "ArcHound", "dom": 171, "sr": 256, "sc": 1.52, "ep": 5.1, "bs": 3.58, "d": 0, "age": 12.95, "grav": 130.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 966, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.122, "fa": 0.0, "gp": 1.7, "bl": 1.35, "ds": 0.0, "txt": "This is a huge issue that everyone will be surprised by. Private data, trade secrets, research in progress (ehm, mathematics).\n\nOne day you'll wake up to your AI provider taking over your business even though the terms and conditions were stated differently.\n\nTo be fair, I'm also expecting this from Microsoft and other cloud providers, especially those with their own AI (Google)."}, {"id": 50637249, "au": "drnick1", "dom": 120, "sr": 257, "sc": 1.47, "ep": 1.47, "bs": 0.0, "d": 2, "age": 1.7, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3541, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.626, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have had to move away from Claude for those kinds of tasks because it now refuses to do RE. I still have a Claude subscription for other tasks, but I may entirely drop Claude in the future."}, {"id": 50637691, "au": "hollerith", "dom": 216, "sr": 258, "sc": 1.47, "ep": 1.47, "bs": 0.0, "d": 3, "age": 0.52, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 8144, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.626, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The term \"open source\" (as applied to software) was defined in the late 90s, but applying it to software of the 80s is not any more problematic than applying it to any other software."}, {"id": 50629111, "au": "soco", "dom": 182, "sr": 259, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 2, "age": 12.2, "grav": 118.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 5034, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.621, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In the age when even international treaties aren't worth more than the paper they are written on, of course let's totally rely on a (written) pinky promise from entities known for breaking sometimes pinky promises because of reasons."}, {"id": 50633573, "au": "gizzlon", "dom": 115, "sr": 260, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 4, "age": 7.29, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 2770, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.28, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Isn't usually a mix of all of these? Take Facebook for example, it's clearly some of A,but with the algorithms it's a little of B and a lot of C"}, {"id": 50629355, "au": "luc_", "dom": 315, "sr": 261, "sc": 1.37, "ep": 2.56, "bs": 1.19, "d": 0, "age": 11.92, "grav": 114.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 70, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.55, "fa": 0.0, "gp": 0.876, "bl": 0.45, "ds": 0.0, "txt": "I've been increasingly getting the feeling that, at times, I'm working for the LLM and not vice versa."}, {"id": 50637141, "au": "agnishom", "dom": 277, "sr": 262, "sc": 1.29, "ep": 1.29, "bs": 0.0, "d": 0, "age": 2.0, "grav": 12.1, "surf": 11.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1439, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.455, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "I agree with the conclusion /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
