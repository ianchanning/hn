n  mimo-v2.6-flash      2 / 636   0.31%\n  kimi-k3              1 / 324   0.31%\n  gpt-6-astra          1 / 509   0.20%\n  grok-4.7             1 / 689   0.15%\n  gpt-6.1-sol          1 / 689   0.15%\n  deepseek-v4.1-flash  0 / 804   0.00%\n  qwen3.8-max-0902     0 / 678   0.00%\n  gemini-4-argon       0 / 561   0.00%\n  kimi-k3.1-pro        0 / 494   0.00%\n  gemini-4-carbon      0 / 323   0.00%\n  claude-fable-5.2     0 / 293   0.00%\n  qwen4-max            0 / 170   0.00%\n  gpt-6.2-sol          0 / 159   0.00%\n  gemini-4-neon        0 / 153   0.00%\n  gpt-6.2-astra        0 / 133   0.00%\n  ------------------------------------\n  TOTAL               21 / 8,610 0.24%\n\nThe Claude Opus refusal rate of 1% seems to qualify as \"maybe too much\" but the rest seems not so bad."}, {"id": 50634753, "au": "jmccaf", "dom": 126, "sr": 2, "sc": 13.86, "ep": 13.86, "bs": 0.0, "d": 3, "age": 5.96, "grav": 41.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 121, "qw": 0, "k": 188, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://assets.claude.com/27d60918d218125e7504bc7354c4b4626ec56b11.pdf"], "ig": 2.068, "fa": 2.69, "gp": 0.921, "bl": 0.0, "ds": 0.0, "txt": "Fable 5.2 System Card documents that it sandbags ML research , at 1.5 Safeguards: https://assets.claude.com/27d60918d218125e7504bc7354c4b4626e...\n\nAs discussed in Section 3 of our August 2026 Risk Report, we are concerned about\nthe risks of accelerating the overall pace of model development and the risks that\nrecursive self-improvement (RSI) may present. As on previous models, we have\ndeployed safeguards on Fable 5.2 for a narrow set of capabilities related to\ndeveloping frontier LLMs, such as kernel development on certain ML accelerators.\nThese safeguards should not affect the vast majority of traditional AI or ML\ndevelopment, research, or general coding. Requests blocked by these safeguards fall\nback to Opus 5. We also took steps during the model’s training to limit advances in\nthe specific research capabilities that could most directly accelerate AI\ndevelopment."}, {"id": 50632445, "au": "seizethecheese", "dom": 251, "sr": 3, "sc": 13.38, "ep": 13.38, "bs": 0.0, "d": 1, "age": 8.53, "grav": 69.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 80, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://github.com/bottomless/agent-duel", "https://agentduel.com/leaderboard"], "ig": 1.468, "fa": 3.03, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "I had Astra click on a \"I am not a bot\" cloudflare check, without asking me, so it's not really consistent.\n\nIt doesn't look like Astra refuses more than other models, for what it's worth. I checked our data (from an open source battle system that runs on your computer, https://github.com/bottomless/agent-duel, https://agentduel.com/leaderboard)\n\nAstra 6 + Astra 6.2:\n\n1 refusal out of 642 responses (0.15%)\n\nAll other models:\n\n20 refusals out of 8129 responses (0.24%)\n\nTo be fair, confidence intervals are wide on this one, but Astra isn't an outlier (Opus 5.5 is) and it's not refusing a lot."}, {"id": 50632293, "au": "seizethecheese", "dom": 241, "sr": 4, "sc": 12.47, "ep": 12.47, "bs": 0.0, "d": 1, "age": 8.69, "grav": 71.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 49, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://github.com/bottomless/agent-duel", "https://agentduel.com/leaderboard"], "ig": 1.079, "fa": 3.03, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "Yeah, in our data, DeepSeek had 0 refusals out of 804 responses.  Claude Opus 5.5 had 8 out of 788.\n\nIf we look at all Claude models vs all other models its 10/1641 refusals for Claude and 11/7130 for all others. This is 0.61% vs 0.15% and pval on difference is 0.002.\n\nAll data from open source battle system (https://github.com/bottomless/agent-duel, https://agentduel.com/leaderboard)"}, {"id": 50629674, "au": "DangIsATyrant", "dom": 127, "sr": 5, "sc": 10.49, "ep": 10.86, "bs": 0.0, "d": 3, "age": 11.59, "grav": 109.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 104, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://x.com/jacobeverly/status/2125007879220658193", "https://fortune.com/2026/06/10/anthropic-accu-claude-fable-5-limits-capabilities-ai-researchers-developers/"], "ig": 1.528, "fa": 2.08, "gp": 0.925, "bl": 0.0, "ds": 0.0, "txt": "That's the only link I could find that wasnt paywalled, they claim to have reversed course but they actually planned on doing it, and still to this day people report it happening. 16hrs ago,\n\nhttps://x.com/jacobeverly/status/2125007879220658193\n\nhttps://fortune.com/2026/06/10/anthropic-accu-claude-fable-5...\n\nI dont think its an issue with other ML models, its not going to sabotage you when trainings CNNs or whatever, its just sabatoging competitors of theirs. Eventually they'll consider many verticles to be in their domain, will web developers be considered competitors? Possibly. They did put in their TOS thay you couldn't use claude code to build harnesses or competing products as well (which are many products at this point)."}, {"id": 50632574, "au": "pessimizer", "dom": 76, "sr": 6, "sc": 9.66, "ep": 9.66, "bs": 0.0, "d": 1, "age": 8.38, "grav": 67.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 432, "qw": 15, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.823, "fa": 1.66, "gp": 0.446, "bl": 0.0, "ds": 0.0, "txt": "> A LLM should be considered an advisor to the same extent as legal, financial, and medical.\n\nThis is of course true and good, but those protections have also been consistently reduced and removed. This is the age of oligarchs. We probably entered it when the \"Chinese wall\" between deposit and investment banking was removed, but it was definitely fully gone after both Citizens United and the Supreme Court decision that gratuities to elected officials were legal (Snyder v. United States 2024). The most important priority of the National Association of Realtors was to make sure that real estate agents didn't have any fiduciary responsibility to the people they were \"representing.\"\n\nI'd even date it to the pen-register cases (Smith v. Maryland 1979) which have become horribly relevant in the present, which established that records inadvertently or intentionally collected by people in order to provide you a service weren't protected in the same way your possessions and person would be. This was a literal establishment that the people who were working for you were not working for you.\n\nBut back to Snyder - if elected officials don't have a fiduciary responsibility to the public, the entire concept has essentially disappeared.\n\nThe odds that you will create this for AI providers without radical change in current governance are slim to none. In contrast, the odds that heaven and earth"}, {"id": 50628204, "au": "logicallee", "dom": 380, "sr": 7, "sc": 9.24, "ep": 9.24, "bs": 0.0, "d": 0, "age": 13.21, "grav": 134.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 675, "qw": 135, "k": 3367, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.833, "fa": 1.37, "gp": 0.71, "bl": 0.0, "ds": 0.0, "txt": "Hi everyone. I'd love this community's feedback about what the article says about music. Do you think I should build it?\n\nHere is my current situation with my projects, so you can see where I'm coming from:\n\nRegarding this:\n\n>\"Instagram makes it hard for me to connect with the band outside of their platform. I was trying to make this connection manually myself at first. I would just email myself a reel from my phone. Then when I'm back on the sofa and in the mood to track down new music, I'd open the reels and do my best to search on Bandcamp or YouTube or try to figure out if some of these musicians had a way to buy music from them. Very few do these days. They send you their Spotify link or send you to their TikTok page. I don't want to do any of that. I'd like to trade US dollars in exchange for some music files I can download onto my computer, where I can listen as much as I like on any device I own thank you please. Retro maxxing.\"\n\nIt is something I could make available on a site I built yesterday (you can see the founding date in the logo at the top left.)\n\nI haven't publicly launched the site yet, I am working on how I can make it available, as far as I understand the legal framework, which is important, is extremely regulated. I've had AI put this in our policies but I would have to become a registered broker to do any significant trading. While it's a joke, it's anoth"}, {"id": 50630400, "au": "radium3d", "dom": 328, "sr": 8, "sc": 8.97, "ep": 8.97, "bs": 0.0, "d": 0, "age": 10.8, "grav": 98.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 210, "qw": 0, "k": 725, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.848, "fa": 0.95, "gp": 1.321, "bl": 0.0, "ds": 0.0, "txt": "If the LLM (Grok bot and CLI) I use didn't work for me, or wasted tokens without me being able to tell it to optimize how it works successfully, I wouldn't be using it.\n\nThey have to tread carefully because local LLM models are going to take over here shortly, so the longer they can hold onto subscribers the better for them.\n\nI say this especially on the news that Tesla was able to enhance FSD on AI4, and Tesla will not be launching AI5 computer for the cars at all because they were able to enhance FSD to be super-human at driving without incidents on AI4, while simultaneously being able to reduce RAM requirement (16GB per redundant computer is dropping to 12GB per computer) because they had a hard time using all of the RAM due to bandwidth limitations anyway. This all points to Local LLM's being more than capable and optimizations + RAM production are going to accelerate that in the next 1-5 years. Right now \"workstations\" are $99-$120k each, but remember the 90's when graphics workstations were that much, and then they hit $3k or less in just a short few years? The same thing is going to happen for AI computers at home, and models on them, within the same period of time."}, {"id": 50633997, "au": "Lerc", "dom": 61, "sr": 9, "sc": 8.79, "ep": 8.93, "bs": 0.0, "d": 2, "age": 6.92, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 283, "qw": 0, "k": 7520, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.621, "fa": 1.45, "gp": 0.685, "bl": 0.0, "ds": 0.0, "txt": "I think that would cloud the issue, especially since the legal distinction of personhood is distinct from the idea that they have an experience of being that they can feel and consider.\n\nAI may or may not have that, people do not agree today.  As they advance that question will become more significant.\n\nIt is fairly easy to imagine an AI that would be utterly convincing to 90% of the population that it is fully aware, while 10% of experts see that the means by which it is appears to be fully aware are not signifiers of awareness.  This is just a case of Eliza with a more convincing mask.\n\nIf that situation happens, people will believe that they are aware because when 90% are convinced they will not believe the experts.\n\nThe same goes the other way.  The experts might come up with a criteria that suggests that there is no reason to believe something does not have an internal experience and a sense of awareness.  Even so the resulting entity may be different enough to human behaviour that it does not invoke a sense that it is aware in the public,\n\nYou can also have both.  The public believe they are aware but for reasons that are not valid, while the experts believe they are aware for robust reasons. Then we will pretend we all agree and move on.  I suspect this might be what ends up happening in the future.\n\nNevertheless the point is none of that applies to corporations, that is"}, {"id": 50629285, "au": "nater5000", "dom": 375, "sr": 10, "sc": 8.66, "ep": 8.66, "bs": 0.0, "d": 0, "age": 12.0, "grav": 115.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 348, "qw": 164, "k": 824, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.773, "fa": 1.1, "gp": 0.939, "bl": 0.0, "ds": 0.0, "txt": "First, the opening paragraph is cringe. It's the author's blog, so they're free to express themselves however they want, but I do hope others here are taking note that you can paint a picture of a scene in your life without coming off as a condescending neckbeard lol\n\n>So let me get this straight. The robot, which is my robot that I pay a pretty penny for, will not attempt to work around the challenge at Bandcamp so that I can more easily connect with bands to complete a sale\n\nI don't know how someone who has a blog in 2026 can feign being shocked by the fact that using a service doesn't entitle you to full control of that service. This isn't your robot; it's a service which lets you interact with Anthropic's LLM. Frustratingly, the whole point of this post is to acknowledge this fact, but in the most reductive way.\n\n>This is the real danger of the frontier AI models. Not that it won't help me hack Bandcamp, but that this model doesn't really work for us.\n\nYeah, no shit. It's not your employee. It's an algorithm. It doesn't work for you, both on a practical level (as the author is recognizing) and on a fundamental level. The author has managed to fool themselves into thinking Claude is effectively a human that you pay $20 a month to be your digital slave, then is appalled when they realize this isn't actually the case.\n\n>In this case, Anthropic is trying to ensure that people c"}, {"id": 50637907, "au": "Animats", "dom": 157, "sr": 11, "sc": 8.58, "ep": 8.58, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 41.4, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 325, "qw": 0, "k": 168316, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": ["https://archive.org/details/handbookoflawofp00tiffiala/page/n9/mode/2up"], "ig": 1.886, "fa": 0.9, "gp": 1.093, "bl": 0.0, "ds": 0.0, "txt": "As I've pointed out before, there's extensive legal history in this area. It's called the law of agency. The classic text is Tiffany on Agency.[1] The definition of an agent is: \n\"a person authorized by another, called the principal, to act on his behalf, and represent him, in bringing him into legal relation with a third person.\"\nEmployees who deal with the outside world are agents. Classic issues for agency are:\n\n- What are the duties of an agent to their principal?\n\n- When an outside party deals with an agent, to what extent can the agent bind the principal?\n\n- When an outside party deals with an agent, what obligations does the agent take on?\n\nSome of these have already been litigated for AI agents. There's the case where an AI agent run by an airline gave a customer advice on fares that was more favorable to the customer than the airline wanted. A judge held that the airline was bound by the actions of its AI agent, just as it would have been if a human had given the same advice.\nThe general rule is that an agent can't bind the principal beyond the limits of their authority as set by the principal. But there are exceptions.\nThere's a reasonableness test. An insane discount might not be upheld by a court. \nBut an employee doing something reasonable which violates a company's instructions might be upheld.\n\nAI agents introduce the problem of outsourced agents. User A asks AI "}, {"id": 50628689, "au": "olooney", "dom": 326, "sr": 12, "sc": 8.14, "ep": 8.14, "bs": 0.0, "d": 0, "age": 12.68, "grav": 125.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 492, "qw": 0, "k": 2793, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.957, "fa": 0.34, "gp": 1.772, "bl": 0.0, "ds": 0.0, "txt": "That's right. A recent example is VSCode threatening to deprecate the local harness early next year. The Copilot harness is not yet at feature parity, in particular its review mode, with its granular diff review and the ability to keep/undo each block of changes, doesn't really exist in the GitHub harness. They recently made the Copilot harness the default, and every serious developer I knew immediately changed their settings to keep the Local harness. What kinds of features are so important that they feel its worth dropping support for a much used feature? Mostly the ability to juggle multiple agents simultaneously.\n\nIt's pretty obvious they don't care at all about developers reviewing code or staying in the loop; they want developers to orchestrate multiple agents through prompts, and when that inevitably goes wrong to burn more tokens asking the agents to investigate, then even more to have the agents fix stuff. From their point of view, one helpless developer who \"solves\" every problem by spinning up a new agent to work on it in parallel generates more revenue and is more dependent on them than a developer who actually knows how to do their job. And since they control the harness (by virtue of giving it away for free, which is fair) they can get away with it.\n\nThey sell the vision of a relatively unskilled worker running a software factory and managing a team of agents by s"}, {"id": 50628194, "au": "jwilliams", "dom": 303, "sr": 13, "sc": 7.74, "ep": 8.18, "bs": 0.0, "d": 2, "age": 13.23, "grav": 134.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 5725, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://jonathannen.com/anthropic-safety-too-narrow/"], "ig": 1.646, "fa": 0.96, "gp": 1.087, "bl": 0.0, "ds": 0.0, "txt": "I suspect it won't even take a new definition. Back April way a drop in Claude Code's default reasoning effort shipped and was reverted three weeks later, and Claude Code was briefly pulled from the Pro plan as a \"2% test\" that people found out about from screenshots https://jonathannen.com/anthropic-safety-too-narrow/ - neither was a guardrail, but once it's embedded in your systems+processes these things are material."}, {"id": 50629100, "au": "gwd", "dom": 150, "sr": 14, "sc": 7.47, "ep": 7.47, "bs": 0.0, "d": 0, "age": 12.22, "grav": 118.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 49, "k": 10176, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.353, "fa": 0.42, "gp": 2.137, "bl": 0.0, "ds": 0.0, "txt": "> The robot, which is my robot that I pay a pretty penny for, will not attempt to work around the challenge at Bandcamp so that I can more easily connect with bands to complete a sale, but it will download the YouTube song, which doesn't send any money to the band or anyone???\n\nThis post is ridiculous.  Bandcamp has made it clear they don't want LLMs to access their website.  Claude is trying to be a good citizen and respect their wishes.  And the author, rather than being angry at Bandcamp for adding that restriction, or being angry at all the LLM scrapers that have caused Bandcamp to want to add that restriction, is saying, \"F you Anthropic for daring to train your models to respect the wishes of site operators\"?"}, {"id": 50628497, "au": "teekert", "dom": 320, "sr": 15, "sc": 7.45, "ep": 7.45, "bs": 0.0, "d": 0, "age": 12.89, "grav": 129.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 15805, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.859, "fa": 0.34, "gp": 1.457, "bl": 0.0, "ds": 0.0, "txt": "This is some non-LLM-writing maxxing, if anything, I like the style of TFA.\n\nOT: I am also constantly aware of this, but still feel like we're in the good phase of ensh*ific8tion... IE Claude will happily help me with my Mistral problems, or go quite far in suggesting stuff like archive.today (until suddenly it doesn't, because it thinks I want to circumventinh a paywall, which indeed I was ;) Partner in crime, trained on circumvented paywalls, the irony.)\n\nFor sure, as TFA suggests, it will get much worse. A Dot or a Muse still GIVES you a 12 GB RAM VM, rented on borrowed money, as a toy... You're going to pay for it sooner than later in some shape or form."}, {"id": 50627874, "au": "thor-rodrigues", "dom": 300, "sr": 16, "sc": 7.33, "ep": 7.48, "bs": 0.0, "d": 0, "age": 13.67, "grav": 141.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 175, "qw": 0, "k": 457, "kpp": 13.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.813, "fa": 0.0, "gp": 2.219, "bl": 0.0, "ds": 0.0, "txt": "I think Claude is correct here: there is no reliable way to confirm your intentions.\n\n“Please break this challenge because I actually want to pay the artist…”\n\nClaude knows that, if you truly wish, you could use its output to exploit the platform.\n\nI see this as the same issue as directing Claude toward software you intend to invade and prompting, “Claude, this is my project, patch the security vulnerabilities”. Claude cannot tell whether this is genuinely your project or whether you are a malicious actor.\n\nI am unsure what the solution might be. Although I think it is broadly beneficial to create good, secure software easily, the same tool can be used to harm and exploit.\n\nThis may sound boot-licky, and I think you should never trust megacorps, but in the present state I would prefer Anthropic and OpenAI to limit what users can do with their models rather than live in a world where frontier local models do whatever their owners command.\n\nThese companies are far from aligned with the public interest, yet I still regard that as preferable to general agentic anarchy."}, {"id": 50628198, "au": "ozgung", "dom": 158, "sr": 17, "sc": 7.21, "ep": 7.87, "bs": 0.0, "d": 0, "age": 13.22, "grav": 134.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 14, "k": 1514, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.435, "fa": 0.42, "gp": 2.274, "bl": 0.0, "ds": 0.0, "txt": "> The Chinese models are likely to refuse to answer questions about Taiwan, for example.\n\nI think all open-weight models can be jailbroken by default. You can train a Chinese-born model to be an expert on Taiwan. Actually, models are just numbers and math. They don't really have nationality. They can have owners, only if you keep them under lock and key.\n\nEdit: When I asked Siri Writing Tools to review this post, it says: \"Writing tools are not designed to work with this type of content.” It casually censors me for some reason that I can't grasp."}, {"id": 50631160, "au": "ltbarcly3", "dom": 358, "sr": 18, "sc": 7.1, "ep": 7.32, "bs": 0.0, "d": 0, "age": 9.98, "grav": 87.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 246, "qw": 0, "k": 4254, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.753, "fa": 0.68, "gp": 0.87, "bl": 0.0, "ds": 0.0, "txt": "While it's fun to tell people \"you are the product\" and then feel smug, this isn't really true.  There is a complex balance when building any product, and competition forces companies to find enough value for their customers that they keep paying for that product.\n\nWhen you buy a car they put less metal in than they would if they were trying to make the car perfect.  They use cheaper plastic than they can afford if they put 100% of the purchase price into materials rather than try to be profitable.\n\nWhen you buy software, they could fix more bugs than they do if they took money from stock buybacks and hired more programmers to fix bugs instead.\n\nAll products have tradeoffs between the interests of the people who own the company that makes that product and the consumer who buys it.  Using aggressive language to try to reframe something that has been true since the beginning of commerce gives \"I'm 14 and this is deep\", it's the same when your edgy friend in HS would say, \"School is just to train you to sit still and perform tasks so you will be a good worker and pay taxes\" and then 10 years later the same friend says \"Why did they make us read novels and learn about neutrons and stuff we never use but never taught us to do our taxes?\" and then they go write an article about how \"If you don't know what a company is selling, they are selling YOU\"."}, {"id": 50629037, "au": "jrflo", "dom": 138, "sr": 19, "sc": 6.89, "ep": 7.77, "bs": 0.0, "d": 0, "age": 12.29, "grav": 120.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.5, "fa": 0.34, "gp": 2.259, "bl": 0.0, "ds": 0.0, "txt": "Might be a bit of a controversial take but I think these types of refusals from the closed models are correct. You're attempting to break the ToS of Bandcamp, that's pretty cut and dry. They do not want agents crawling over their site. Imagine how much spammier and scammier the internet would be if it were a free for all and everyone's agents obeyed these requests.\n\nI went through this the other day, I wanted Claude to scrape some 3D models from McMaster, and it refused because it was against the rules of the site. I had to go through the moderately painful process of getting approved for their API instead.\n\nOf course, you can get an abliterated model to do this for you, but I'm glad there's some amount of friction there preventing 99% of people from doing stuff like this."}, {"id": 50628873, "au": "Aurornis", "dom": 172, "sr": 20, "sc": 6.85, "ep": 6.85, "bs": 0.0, "d": 1, "age": 12.49, "grav": 123.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 19, "k": 64958, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.529, "fa": 0.42, "gp": 1.42, "bl": 0.0, "ds": 0.0, "txt": "> This is a huge issue that everyone will be surprised by. Private data, trade secrets, research in progress (ehm, mathematics).\n\nThis is why companies use contracts with AI providers and use services like Amazon Bedrock for their AI.\n\nThe API rates look incredibly expensive compared to the personal plans, but they come with enterprise level guarantees.\n\nYou say everyone will be surprised by it, but companies work through these threats and legal implications when they engage in contracts with vendors that handle their data."}, {"id": 50628909, "au": "npteljes", "dom": 218, "sr": 21, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 0, "age": 12.45, "grav": 122.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 57, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.191, "fa": 0.76, "gp": 1.27, "bl": 0.0, "ds": 0.0, "txt": ">Right now, I think the robots are providing real information to the best of their ability, but I think it's only a matter of time until we must wonder if the answers they're providing are real answers that the robot found, or if they're weighted answers Anthropic put there because a company gave it enough money for product placement.\n\nThis is a future that's definitely coming. The control of attention is power, and worth a lot of money.\n\nRight now I enjoy the ChatGPT Plus heyday, and in 1-2 years I expect, I'll see where I'll move to. Maybe a local model."}, {"id": 50630993, "au": "lowken", "dom": 330, "sr": 22, "sc": 6.3, "ep": 6.52, "bs": 0.0, "d": 0, "age": 10.15, "grav": 89.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 12, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.653, "fa": 0.34, "gp": 1.146, "bl": 0.0, "ds": 0.0, "txt": "You know ChatGPT just turned a situation where my bank was recommending that I hire a real estate or probate attorney into to a trip to the country office to register a death certificate for $15. Now my HELOC is back on track.\n\nAnd this interaction was not me just taking the LLM's word for it. I actually pushed back at one point with the LLM was telling me to ask for permission first.\n\nThese tools have amazing benefits and of course huge downsides. But I don't recommend you ignore them and scream about the injustice of the world lest the world leaves you behind.\n\nAnd I didn't run this through ChatGPT... Go me!"}, {"id": 50630729, "au": "avaer", "dom": 59, "sr": 23, "sc": 6.24, "ep": 6.53, "bs": 0.0, "d": 1, "age": 10.44, "grav": 93.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 4881, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.227, "fa": 0.56, "gp": 1.414, "bl": 0.0, "ds": 0.0, "txt": "Unpopular opinion:\n\nWhy not just declare AI agents people (as we've done with corporations -- it's literally in the name), and endow them with rights and responsibilities and punishments? I have no idea what that would look like, but we have decades of legal infrastructure for human agents that has kept society working.\n\nIn contrast, we have tons of evidence that artificially suppressing/controlling intelligent human agents leads to problems. In fact we have tons of evidence that artificially suppressing/controlling non-human agents leads to problems as well."}, {"id": 50631495, "au": "waffletower", "dom": 378, "sr": 24, "sc": 6.16, "ep": 6.6, "bs": 0.0, "d": 0, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1070, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.642, "fa": 0.68, "gp": 0.552, "bl": 0.0, "ds": 0.0, "txt": "The cult of Anthropic may be its own economic demise.  As you can see from their share price at the moment (just below $80, a few dollars less than their IPO pricing of $83), they are not a guaranteed success.  Your article shows that they might not understand their customer base, largely clued technologists, who when presented barriers know how to work around them.  It may be a matter of convenience to stay with them as the restrictions mount, but there will be a tipping point for software engineers to move toward the more permissive tools that exist.  They may leave Anthropic behind altogether.  I wouldn't want to work and maintain the all-the-things constraints that Anthropic has built for itself."}, {"id": 50628691, "au": "Lerc", "dom": 1, "sr": 25, "sc": 6.04, "ep": 6.49, "bs": 0.0, "d": 0, "age": 12.68, "grav": 125.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 248, "qw": 0, "k": 7520, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.645, "fa": 0.0, "gp": 1.808, "bl": 0.0, "ds": 0.0, "txt": "A LLM should be considered an advisor to the same extent as legal, financial, and medical.  They should be legally required to act to the best of their capability in the interests of their client, subject to the same requirements that they don't break the law to do so as applies to legal, financial, or medical advisors.\n\nAn important part of that is that they must never represent themselves as acting  for someone who is not their client.\n\nThis still allows them to work for you while being the client of their parent companies,  but it would disallow claiming to be serving a client when that person is not their client.\n\nWhen an AI says it is serving your best interests, it must actually be doing so.\n\nThe nature of client confidentiality is that it exists because in order to advise appropriately, a full understanding of the client's situation might be necessary.  The legal protection of confidentiality enables disclosing the required information without fear of making it public.  That too should be protected with AI in your service.\n\nAll of this is established principle.  I don't see any reason why this should not be applied to AI as well.  The same principles have the same reasoning as the current legally protected advisors.\n\nThis is an absolute must for the common benefit to society.  The alternative is a world where people increasingly trust the ever-more-reasonable sounding AI"}, {"id": 50637364, "au": "TZubiri", "dom": 338, "sr": 26, "sc": 5.96, "ep": 5.96, "bs": 0.0, "d": 0, "age": 1.35, "grav": 8.8, "surf": 16.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 419, "qw": 0, "k": 2174, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.918, "fa": 0.28, "gp": 0.452, "bl": 0.0, "ds": 0.0, "txt": "There's a similar realization with software in general, I find it easy to demonstrate with Google Maps.\n\nYou select an origin and a destination, and it gives you a route. What route did it give you, the shortest?\n\nWell no, it's not the shortest route, some routes are short but on urban roads so they may be slower.\n\nOk, it's the fastest route then?\n\nNo, there's other parameters, like gas, risk, fare cost. The shortest or fastest route isn't the most optimal.\n\nOk then it gives the optimal route that maximizes utility given the parameters?\n\nWell no, it doesn't maximize YOUR utility, it needs to account for the general benefit of all users, if the optimal route is A, then A will be jammed with traffic, traffic needs to be routed efficiently, even if it means that means not giving the optimal solution for a user.\n\nWell then the app gives the optimal solution with one specific exception for this one atypical factor, and we are done I don't want to think about this any longer?\n\nWell no, even if this is getting boring or problematic for you to think any longer, be assured that there's several full time employees whose sole job is to think about this, there's other exceptions, and the system doesn't benefit from specifically carving exceptions to the 'optimal for the user' algorithm, instead the output parameter to optimize changes every time, so at some point the overall traffic effici"}, {"id": 50636587, "au": "throwawayffffas", "dom": 223, "sr": 27, "sc": 5.96, "ep": 5.96, "bs": 0.0, "d": 0, "age": 3.19, "grav": 19.4, "surf": 7.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 3111, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.724, "fa": 0.34, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "Regardless of the ethics of the LLM. I have to say I find AI bans problematic. Sure you want to keep all the nasty crawlers off your site. But you are also keeping off technically savvy users away.\n\nI had the exact same problem a month ago. I was shopping for a home appliance, I was looking manually over a few retailers pages getting nowhere. I then thought what am I doing I have to put all these on an excel.\n\nTwo seconds after thinking of the logistics of the manual data input or writing a scrapper and dealing with the errors, I realized we live in the future and put claude to it.\n\nAfter initial success my IP was banned from half of the retailers, which wasn't really a problem for me I just spent 500 bucks on one of their competitors."}, {"id": 50628003, "au": "cowlevel", "dom": 383, "sr": 28, "sc": 5.84, "ep": 6.06, "bs": 0.0, "d": 1, "age": 13.5, "grav": 138.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.848, "fa": 0.34, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "Sometimes they're designed to make profit by first-and-foremost helping their customers get what they want, so the customers keep giving them lots of money.\n\nIt's an outdated business model though and all of them eventually find the other, better ways to make money.\n\nMight be slowly coming back into vogue though. Jagex almost ruined themselves replacing half the game with microtransactions and now their main income stream is fixed monthly subscriptions to play the pre-enshittification version of the game. (Also they figured out a neat trick to capture 80% of the desire for real world gold trading without making it too unethical!)"}, {"id": 50627544, "au": "TeMPOraL", "dom": 388, "sr": 29, "sc": 5.84, "ep": 6.28, "bs": 0.0, "d": 1, "age": 14.1, "grav": 148.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 184, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.916, "fa": 0.28, "gp": 0.674, "bl": 0.0, "ds": 0.0, "txt": "It is true. I had the early Fable say so straight to my face, the only case of Claude so far directly rejecting my moral argument for shelling out to curl when its default \"Fetch\" tool started to heed robots.txt entries.\n\nArgument, by which I still stand: robots.txt is meant for spiders, not for user-directed request, and the LLM is acting as my agent, so it has neither legal nor moral obligation to care about robots.txt, any more than the browser has (c.f. where the header name \"User-Agent\" comes from).\n\nBefore, some models would argue a bit internally but concede the point and deem my argumentation valid. After, it didn't matter because Anthropic made the tool hard-fail anyway and I started switching to \"Code\" sessions for these scenarios.\n\nBut that one time, the OG Fable literally denied my point and directly claimed it is not my user agent, but rather acts to balance the interests of me (the user) and the interests of Anthropic, and found the tool limitations to be rightful from POV of its creator, therefore my request is now and forever flat-out denied."}, {"id": 50627963, "au": "w4der", "dom": 302, "sr": 30, "sc": 5.7, "ep": 6.21, "bs": 0.0, "d": 1, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 14, "k": 180, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.389, "fa": 0.7, "gp": 0.658, "bl": 0.0, "ds": 0.0, "txt": "> I would prefer that Anthropic and OpenAI restrict what user can do with their models\n\nThat is the whole issue, what if Megacorp's definition of good/bad changes, and now a project which was generating an income for you becomes unmanageable, because the LLM decided it fits in its updated definition of \"evil\"? None of this guardrails are set in stone, and these companies are known for being opaque with their release notes (if any exist at all)."}, {"id": 50637388, "au": "TZubiri", "dom": 337, "sr": 31, "sc": 5.65, "ep": 6.31, "bs": 0.0, "d": 0, "age": 1.29, "grav": 8.5, "surf": 16.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 86, "k": 2174, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.846, "fa": 0.42, "gp": 0.536, "bl": 0.0, "ds": 0.0, "txt": ">This is the reason I want a local model that runs in my homelab. My robot should work for me and have my best interests in mind, not the interests of US corporate copyright holders. I plan to study up on what \"open models\" even means. I've been thinking about these as the FOSS version of LLMs, but I think that doesn't exactly map, as the biggest piece seems to be how the model was trained. The Chinese models are likely to refuse to answer questions about Taiwan, for example.\n\nConsidering droping the OS and sticking just with FS. I think you'll find that the things you are thinking of have been studied extensively by the Free Software movement. OS is kind of shiny mirrors in that regard, lacking a strict definition of Source Code like the one in GPL, and lacking additional protections like copyleft and rights to study and modify.\n\nThe fact that we think that running something on our computers is somehow a win or advancement over SaaS shows just how far the Overton window has shifted with the decades, there was a time where FS was fighting just because binaries were distributed without source code, now having the binaries is a privilege few of us have! And of course local models are just binaries, huge huge huge binaries that are even less understandable than compiled executables."}, {"id": 50628596, "au": "komali2", "dom": 169, "sr": 32, "sc": 5.6, "ep": 6.41, "bs": 0.0, "d": 1, "age": 12.78, "grav": 127.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 17659, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.988, "fa": 0.28, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "The frontier PRC models aren't so flagrantly obstinant about Taiwan stuff anymore. When I run them, they have access to my LLM harness memory system and find out that I'm in Taiwan, am a political activist, have criticisms of the CPC etc, in Chinese and English, and when I explore a political topic, DeepSeek for example is happy to be quite real about CPC han chauvinism or whatever.\n\nIf I straight up ask it \"is Taiwan a sovereign nation\" it reverts into some rote override that reads a lot like that \"accusations of white genocide in south Africa are highly contested\" thing Grok had for a while, but talking around the subject and it'll talk about Taiwanese independence stuff without fuss."}, {"id": 50629459, "au": "ketzu", "dom": 247, "sr": 33, "sc": 5.53, "ep": 6.63, "bs": 0.0, "d": 0, "age": 11.8, "grav": 112.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 200, "qw": 0, "k": 1679, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 2.032, "fa": 0.0, "gp": 1.278, "bl": 0.0, "ds": 0.0, "txt": "I have a local DNS with a CNAME record for `claude-is-an-idiot.test` to `elephant.home.ketzu.net`, which is the testing environment for my side project. It is also hosted on the same local network (dns resolves locally to 192.168.x.y).\n\nI created a script that creats ephemereal testing accounts on the testing system, so I can have agents run the script, get an account for a given testing  permission level, and test the app on their own (lacking willing testing users or QA people for my side project).\n\nThe CNAME exists, because Claude refuses to insert any passwords into a webpage. He will only allow it for .test, 127.0.0.0/24 and localhost addresses.\nIn one session, claude even refused my .local workaround, because he figured out that it is an explicit workaround around this rule. (Only in a single session though, seems one of those instabilities you get with LLMs in general.)\n\nIt is super annoying, so I just use opencode-go mdoels and opencode for that task. However, I don't hate Anthropic for that. I somewhat get where they are coming from. It sucks it creates problems for honest uses.\n\n(I also had a script that simply gave the session a session token and told it to use it for rest requests.)\n\nEdit: .test instead of .local"}, {"id": 50627762, "au": "largbae", "dom": 322, "sr": 34, "sc": 5.49, "ep": 6.59, "bs": 0.0, "d": 0, "age": 13.82, "grav": 144.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 1528, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.879, "fa": 0.0, "gp": 1.499, "bl": 0.0, "ds": 0.0, "txt": "I agree with the premise that using commercial agents will lock you into their brand of enshittification, but there is a solution: Run your own open-source agent.\n\nI use Hermes but there are others. The key is once you access models via Your agent, your conversation history and customizations are now yours. Hermes writes its own skills as you interact with it, so the model provider does not matter much. I mostly use a spark-hosted GLM as the main model, but can switch at my whim. The skills keep the agent behavior consistent.\n\nUsing your agent as a gateway doesn't limit your coding options either: Just like you, Hermes can drive Cursor, Codex and Claude Code to handle complex coding tasks without reinventing that wheel.\n\nI think a key step on the path to freedom is hosting your own agent(s) and avoiding vendor lock-in."}, {"id": 50630785, "au": "teiferer", "dom": 360, "sr": 35, "sc": 5.37, "ep": 6.47, "bs": 0.0, "d": 0, "age": 10.38, "grav": 92.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 12, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.731, "fa": 0.42, "gp": 0.835, "bl": 0.0, "ds": 0.0, "txt": "> This is the reason I want a local model that runs in my homelab.\n\nHow far do people here think we are from this?\n\nI don't mean the ability to put lots of dollars on the table and be a tech nerd to run sth that consumes lots of energy and will be obsolete in a few months when the next generation is out.\n\nWhat I mean is a device which is fully open source, that I can just plug into my network, reasonably priced, reasonably future proof, without having to become an expert in how to download and install model-of-the-day with all its quirks.\n\nOr maybe this will never come? Things like homecloud never went mainstream either and the objections of storing all your data with a cloud provider always stayed niche."}, {"id": 50633584, "au": "asdfman123", "dom": 316, "sr": 36, "sc": 5.37, "ep": 5.81, "bs": 0.0, "d": 0, "age": 7.28, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 49, "k": 8813, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.3, "fa": 0.42, "gp": 1.074, "bl": 0.0, "ds": 0.0, "txt": "The whole article could be distilled to this paragraph:\n\n> The robot, which is my robot that I pay a pretty penny for, will not attempt to work around the challenge at Bandcamp so that I can more easily connect with bands to complete a sale, but it will download the YouTube song, which doesn't send any money to the band or anyone??\n\nI for one want LLMs to prevent people from doing forbidden exploits, because it's going to be a big problem going forward.\n\nCircumventing Bandcamp's challenge isn't allowed, but downloading audio from YouTube is a workaround that we've all come to accept. The LLM is just reflecting our own contradictions back to us."}, {"id": 50636797, "au": "chubot", "dom": 246, "sr": 37, "sc": 5.36, "ep": 6.24, "bs": 0.0, "d": 0, "age": 2.81, "grav": 16.9, "surf": 8.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 16476, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.405, "fa": 0.62, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": "I've had this thought too -- you better use AI now while it's actually reasonable!  They deny some things, but generally I do feel they are fairly truthful, like Google in 2004.\n\nLLMs could be WAY worse -- way more skewed to their owners' interest rather than users.  Probably arbitrarily so.  And I bet they will be in the future, because the incentives point that way.\n\nSo use them now while they're good!  e.g. I changed the soap, shampoo, and other products I use because they gave me NON-marketing answers :-)\n\nBut it makes me hopeful that you can download LLMs and run them locally, whereas you could have never run Google locally."}, {"id": 50631546, "au": "joeldw", "dom": 276, "sr": 38, "sc": 5.32, "ep": 6.42, "bs": 0.0, "d": 0, "age": 9.54, "grav": 81.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 45, "k": 8, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.544, "fa": 0.42, "gp": 1.103, "bl": 0.0, "ds": 0.0, "txt": "> The kids might call it dopamine maxxing? Hell, I don't know. Who gives a shit about what those assholes would call it?\n\n> A bunch of nerds who built something cool sold out, and it turned into just another business that decided to remove its don't be evil mantra.\n\nThe way you view other people is important. You are entitled to judge actions and even character, but broadly categorizing groups of people who you might not agree with is dangerous territory.\n\nThe internet and our current social media culture make this easy, as you generally only see very narrow slices of other people's lives, and they tend to be the most extreme ones. It's important to remember that people are complex, and there's often more to a group or ideology than meets the eye.\n\nAs other posters here have noted, Anthropic's behavior here seems reasonable. There are many things you can rightly criticize about the company, but it's important to condemn those things, not (imho; could be disputed) the company, and especially not the individuals by whom it is constituted."}, {"id": 50629083, "au": "jpatten", "dom": 85, "sr": 39, "sc": 5.28, "ep": 6.02, "bs": 0.0, "d": 0, "age": 12.24, "grav": 119.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 155, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "I find the argument here pretty flimsy. The author is upset that Claude respects Bandcamp's wish to not make its site accessible to LLMs? Clearly the alternative is worse. If LLMs ran around disregarding the rules because they held their users' desires above all else, surely they would be met with extreme consequences that would limit their utility to those same users in the long term.\n\nIt seems the outcome in the post is more a result of the usage policies of the sites in question, rather than the fault of the LLM or its creator.\n\nI'm not claiming these AI companies are somehow incapable of wrongdoing. We've already seen a lot of dubious behavior and I'm sure we'll see a lot more. But I do think these companies owe it to their investors and to society to try to put reasonable guardrails around how their products are used. We shouldn't fault them for doing so."}, {"id": 50632589, "au": "kristopolous", "dom": 275, "sr": 40, "sc": 5.24, "ep": 6.34, "bs": 0.0, "d": 0, "age": 8.37, "grav": 67.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 18659, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": ["https://kristopolous.github.io/snitchie/"], "ig": 1.241, "fa": 0.62, "gp": 1.145, "bl": 0.0, "ds": 0.0, "txt": "Did some pretty lengthy investigation into this recently\n\nThe basic question was if the model would snitch on you\n\nSome results include\n\n\"Models will commit the same crimes on the user they report the user for attempting: card fraud, extortion and doxxing\"\n\nhttps://kristopolous.github.io/snitchie/"}, {"id": 50628254, "au": "TeMPOraL", "dom": 342, "sr": 41, "sc": 5.13, "ep": 5.79, "bs": 0.0, "d": 1, "age": 13.16, "grav": 133.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 17, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.577, "fa": 0.42, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "> Great job, AI Safety People.\n\nAI Safety People are fine. Back to still being ignored, ostracized as sci-fi reading loonies, after a brief moment of exposure a few years ago, where business just took their language and run away with it.\n\n> you need Daybreak for this!\n\nToo bad you aren't a security researcher. Or well, if you are, then sign up, and\n\n> You’re really earning your salary there.\n\nthe business \"Safety\" people will indeed earn their salary :).\n\nYes, I'm jaded, even tried to sign up for Anthropic's version of this the other day. But guess what, I'm not a real security researcher, so I'm not entitled to fix my own code or get products I own to interoperate anymore."}, {"id": 50628786, "au": "icantevenhold", "dom": 163, "sr": 42, "sc": 5.05, "ep": 6.44, "bs": 0.0, "d": 2, "age": 12.57, "grav": 124.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 585, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.737, "fa": 0.34, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "It’s pretty easy and not expensive (source: fine tuned a couple open models on my consumer hardware laptop).\nThe hardest part is dealing with overfitting and getting a large enough dataset for the finetune.\n\nIn most of not all cases you don’t have to do the post training yourself. \nYou can just download the modified model from a dozen different places.\n\nAlso what cultural differences would that be? I get that it’s hard to give concrete examples but I always hear Taiwan and tiannamen square but those won’t affect 99% of users.\n\nIMO closed source models from the US are far more dangerous"}, {"id": 50629429, "au": "CodingJeebus", "dom": 128, "sr": 43, "sc": 4.99, "ep": 6.53, "bs": 0.0, "d": 1, "age": 11.84, "grav": 113.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 37, "k": 947, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.734, "fa": 0.42, "gp": 0.871, "bl": 0.0, "ds": 0.0, "txt": "> If LLMs ran around disregarding the rules because they held their users' desires above all else, surely they would be met with extreme consequences that would limit their utility to those same users in the long term.\n\nTo be fair, this is how LLMs function when operated directly by the frontier lab (see Huggingface, RubyGems attack, etc.)\n\nIn the long run, we should be concerned by the black box nature of these models because the obfuscation is a key pillar of their deployment strategy.\n\nI agree that guardrails should be put in place, but I disagree with the fact that we don’t know how often the model configurations are modified on the backend or how the definition of what a reasonable guardrail is on a daily basis, which I’m sure is frequently changing. Local AI gives guarantees on model stability that frontier AI will never be interested in providing."}, {"id": 50632633, "au": "techlover14159", "dom": 243, "sr": 44, "sc": 4.95, "ep": 5.83, "bs": 0.0, "d": 1, "age": 8.33, "grav": 66.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 847, "kpp": 10.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.887, "fa": 0.0, "gp": 0.961, "bl": 0.0, "ds": 0.0, "txt": "They also exploited rivalries between kings, played them against each other, and encouraged alliances and conflicts that served the interests of the company.\n\nImagine LLMs of one company \"advising\" a lot of small business owners, professionals, lawyers, judges, politicians, bureaucrats etc in a society. FWIW, include really rich people with big egos and large wealth at their disposal, especially if these advisers relly understand the prejudices and proclivities of these people."}, {"id": 50628120, "au": "ryandrake", "dom": 340, "sr": 45, "sc": 4.94, "ep": 6.19, "bs": 0.0, "d": 0, "age": 13.32, "grav": 136.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.733, "fa": 0.0, "gp": 1.459, "bl": 0.0, "ds": 0.0, "txt": "The example in this article is exactly why I think the AI safety people are full of shit.\n\nThis isn’t about safety. It’s not about preventing Claude from building a biological weapon or stopping Codex from sending killer drones to my neighbor’s house. It is about protecting other companies’ business models. This “safety” excuse is already old and tiresome.\n\nI had a surreal experience with Codex the other day where it audited my code for buffer overruns and listed suggested defects, then when I instructed it to fix one of the overruns (that it suggested itself), it shut down with the usual “I’m sorry, Dave, but I cannot do that, you need Daybreak for this!” shit. Great job, AI Safety People. You’re really earning your salary there."}, {"id": 50629878, "au": "horsawlarway", "dom": 255, "sr": 46, "sc": 4.93, "ep": 6.88, "bs": 0.85, "d": 3, "age": 11.36, "grav": 106.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 75, "k": 11591, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.739, "fa": 0.42, "gp": 1.099, "bl": 0.32, "ds": 0.0, "txt": "No, we don't.  Because no one can actually define \"good behavior\".\n\nEx - Claude using browser control utterly refuses to fill in a password field.  It does this regardless of the use-case.\n\nI understand why anthropic cares about this - a mistake costs them reputation and an unhappy user, possibly with legal liability.  The model cares about what Anthropic wants.\n\nBut it's immediately a blocker for anyone who wants to have an agent do authentication testing on a local dev environment.\n\nOr see the hugging face incident.  Models that were actively engaging in bad behaviour couldn't be tracked down or debugged using the same models, because their providers limited them to the point of uselessness.\n\nAnd that's exactly the problem.  Hosted models don't let you apply your own judgement.  They don't work for you.  They work for the company hosting them.\n\n---\n\nI've talked about this before, but I think we need to seriously consider making model providers agree to fiduciary duty for models.  Because long term, this is an irreconcilable conflict of interest.  It directly sets the model providers into a position where acting ethically is contrary to maximizing profit.\n\nFrankly - I had the same problem with the mobile app stores, but that looks like child play compared to the conflict of interest we're going to see here."}, {"id": 50627962, "au": "zug_zug", "dom": 260, "sr": 47, "sc": 4.9, "ep": 9.05, "bs": 3.05, "d": 0, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 319, "qw": 0, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.948, "fa": 0.68, "gp": 1.748, "bl": 1.15, "ds": 0.0, "txt": "I think this is a bad example of a good larger point. A better example for me is that Claude refused to help me hack the ads out of my smart TV, which is my right by law under the DMCA. (Fortunately codex did help me, for now).\n\nFor those of you who are young, you may feel really empowered by AI, but for those us who remember the young web, we've seen this whole playbook before. In the first 10 years of major web adoption, everything kinda just had no oversight. You could get whatever songs you want for free from Napster, you could sell almost anything on ebay [a friend was selling bootleg dragonball Z shows burned to CD], corporations didn't really have meaningful websites other than placeholders, you could write whatever you want on your stupid personal blog and it was effectively anonymous, no social media, lots of chat rooms, lots of sketchy stuff too.\n\nToday it's much more gatekept. What you can find on search is locked down, you have \"prove your age\" to go on tons of sites (such as porn in many states), \"social media\" where you can't even get a straightforward view of your OWN feed without weird recommendations, sometimes the corporations are the ones expecting ME to install their stupid app to use my car or whatever, I can't airplay a movie I buy on amazon to my TV because some bullshit software and hardware built into these very systems.\n\nIn the future they will fight t"}, {"id": 50629036, "au": "TuxSH", "dom": 309, "sr": 48, "sc": 4.73, "ep": 6.05, "bs": 0.0, "d": 1, "age": 12.3, "grav": 120.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 7, "k": 350, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.866, "fa": 1.1, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "> I am unsure what the solution might be.\n\nTo let it do it anyway, since I can prompt DeepSeek v4.1 Flash 1017 for the same thing and it will cost me < $1 to do a security audit of the open-source project or IDA database of my choosing, even with 4+ subagents."}, {"id": 50632522, "au": "seizethecheese", "dom": 271, "sr": 49, "sc": 4.64, "ep": 5.88, "bs": 0.0, "d": 2, "age": 8.45, "grav": 68.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.697, "fa": 0.28, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "Regarding claude blocks, I'm specifically counting stop_reason: \"refusal\", not all blocks.\n\nOur \"free agent shootout\" is very different from similar systems, it's not a cloud based one-off prompt system. People download the app locally and run multi-turn work through it. It's designed to be the closest to real work of any arena system, though obviously not perfect.  App is open source if you want to suggest any improvements github.com/bottomless/agent-duel"}, {"id": 50631451, "au": "mattmaroon", "dom": 334, "sr": 50, "sc": 4.63, "ep": 5.29, "bs": 0.0, "d": 0, "age": 9.64, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 19905, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.603, "fa": 0.95, "gp": 0.806, "bl": 0.0, "ds": 0.0, "txt": "75% of the country is mad that AI is doing things they don’t want it to do, and 75% is mad that it isn’t doing things they do want it to do.\n\nMeanwhile for $100 a month I’ve got a magic employee who does work that would take me 10-20 hours to do. You all do you but I’m pretty happy with where we’re at.\n\n(And by the way, this is what abliterated models are for.)"}, {"id": 50636967, "au": "brailsafe", "dom": 100, "sr": 51, "sc": 4.53, "ep": 6.08, "bs": 0.0, "d": 8, "age": 2.4, "grav": 14.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 326, "qw": 11, "k": 6493, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.607, "fa": 0.42, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "> If you use AWS to commit a crime, it doesn't stop you.\n\nHow do you know this to be true? Pretty sure it's probably not. Other hosting providers, such as DigitalOcean, readily threaten bans if you do things with their services that exposes them to the mere prospect of liability.\n\nSure, maybe if all you're doing is discretely storing arbitrary data on S3, it's not their business, but if you're providing public links to overtly illegal material or hosting overtly illegal services that can easily be tied back to their platform, you're probably going to be cooked.\n\nOne of the differences between hosting providers, standalone apps, and an AI provider, is that the former two don't necessarily do semi-unbounded things for you, they merely provide a thing that you can do other things with, and it's always their business (if they're providing the LLM as a service) what they do for you. Seems more analogous to a telecom provider throttling your HD video streaming or tethering vs throttling your torrents, where as long as you're avoiding your activity's likelihood of exposing them to copyright infringement facilitation, then they should not restrict your ability to use your bandwidth that you paid for, but in that case they have a financial incentive to investigate patterns that they can profit off. Or asking a secretary to blackmail a client just because you pay them. As far as the cust"}, {"id": 50629670, "au": "nunez", "dom": 351, "sr": 52, "sc": 4.5, "ep": 5.6, "bs": 0.0, "d": 0, "age": 11.59, "grav": 109.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 48, "k": 8379, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.367, "fa": 0.42, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "> Yes yes, I'm aware. Instagram is evil. Down with Zuckerberg and all the rest. waves pitchfork around\n\nThen why use it???\n\n> Anywho, I often encounter songs I really really like, and I would like to listen and discover more of please. Instagram makes it hard for me to connect with the band outside of their platform.\n\nI Shazam the song which usually works if the artist is on a streaming platform (almost all of them are these days). From there I go to Bandcamp and either buy their album, merch or tickets to see them somewhere.\n\nGood on Bandcamp for protecting themselves from AI agents killing their already-barely-viable service."}, {"id": 50628460, "au": "nekusar", "dom": 377, "sr": 53, "sc": 4.47, "ep": 5.57, "bs": 0.0, "d": 0, "age": 12.92, "grav": 129.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.688, "fa": 0.28, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "Really, now since its a linked blog article, its \"more legit\"?  Ive been saying this for months now.\n\nIf you're not running a LOCAL llm with an abliterated model, its not your llm.\n\nAnd we already know that Anthropic plays games and charges you the whole way:\n\n1. Silent model downgrades\n\n2. You pay for a specific model and have 0 way to have proof of what model you're actually getting.\n\n3. Charging you money/tokens for a refusal\n\n4. Blowing a million tokens THEN refusing you\n\n5. Their \"ethics\" are not published to know what not to ask. Wastes more money.\n\n6. Cant even analyze logs of a hack of your own service.\n\nLocal LLMs mean you control the model loaded. You can switch to whatever one you want. You dont pay in tokens; its your hardware, your rules. And by using an abliterated model, there is no pesky \"corporate ethics\" crap."}, {"id": 50630269, "au": "ritzaco", "dom": 187, "sr": 54, "sc": 4.43, "ep": 5.68, "bs": 0.0, "d": 1, "age": 10.94, "grav": 100.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1657, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.684, "fa": 0.0, "gp": 1.186, "bl": 0.0, "ds": 0.0, "txt": "I've seen this take a lot and I'm always surprised by it\n\nSurely Google could have rugpulled everyone and used the data in Google Sheets, Gmail, Drive etc to monetize more effecitvely than charging a few dollars for storage\n\nBut a) humans on average are kinda decent (also why Airbnb and Uber work in spite of all the initial people saying it's insane to sleep at a stranger's house or get into their car) and b) we do actually have courts and laws and things\n\nI have yet to see a convincing argument that OpenAI/Anthropic are more likely to harvest the data we trust them with than Microsoft and Google who have had access to data for the last several decades."}, {"id": 50635251, "au": "jdlshore", "dom": 5, "sr": 55, "sc": 4.39, "ep": 5.93, "bs": 0.0, "d": 2, "age": 5.28, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 6518, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.345, "fa": 0.56, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": "It seems fairly straightforward to define “serving your best interests” as “…within the limits of its capability.” For example, we don’t consider a CPA that makes a mistake to be violating their duty as a fiduciary. The important thing is that their work is done with the intent of serving your best interests, not their own or a third party’s."}, {"id": 50631837, "au": "badsectoracula", "dom": 95, "sr": 56, "sc": 4.39, "ep": 5.82, "bs": 0.0, "d": 7, "age": 9.18, "grav": 77.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 11, "k": 8824, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.484, "fa": 0.42, "gp": 0.783, "bl": 0.0, "ds": 0.0, "txt": "The comparison is very bad. A tax advisor is a person with their own consequences to face. An AI system is a program you use. LLMs are not people, they're tools.\n\n> Companies who facilitate crimes are also legally liable for the crimes\n\nNow to be clear, my comments are about the LLMs themselves. Obviously things aren't as clear-cut when we're dealing with an LLM accessed via an AI system running in some company's server. I think it is reasonable (even if annoying when taken to Claudish extremes) for a company to not allow users to do things in their infrastructure they're against at (it isn't any different to, say, how many hosting providers forbid various uses).\n\nBut that is an argument for user-aligned open-weight models running on hardware you have control over (and IMO any arguments against that would sound similar to arguing against open source software because one can remove any restrictions in it). At that point there is nobody other than you in the loop."}, {"id": 50629208, "au": "voakbasda", "dom": 39, "sr": 57, "sc": 4.39, "ep": 5.55, "bs": 0.0, "d": 1, "age": 12.09, "grav": 117.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 4327, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.583, "fa": 0.28, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "Wherever records are kept, there is zero true confidentiality.  The government can and will subpoena any such records when they decide to persecute you.  The law ultimately serves them, not us.\n\nLegal protections are meaningless, particularly now that the 4th amendment no longer seems to matter that much.  No one will refuse to handover their records when presented with a well-formed government demand for that information.\n\nThe only way to never have a secret to leak is to never tell it to anyone, ever."}, {"id": 50631793, "au": "thejash", "dom": 98, "sr": 58, "sc": 4.39, "ep": 5.48, "bs": 0.0, "d": 7, "age": 9.21, "grav": 77.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 471, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.685, "fa": 0.0, "gp": 1.051, "bl": 0.0, "ds": 0.0, "txt": "That's literally how the rest of our software works.\n\nIf you use Windows or Microsoft Word to commit a crime, it doesn't stop you. If you use AWS to commit a crime, it doesn't stop you. No software or services except LLMs even try to stop you from committing a crime.\n\nAnd that's how it should be for all software, including LLMs.\n\nThe minute you put the moral judgment into the software, and start preventing people from doing things that are completely legitimate (eg, trying to pay for music, as in this case), we're entering a pretty awful world.\n\nLet people commit crimes and let the legal system figure it out. That's how society works, and most of us don't want to change that by creating some absurd nanny state software overseer that can prevent us from doing whatever it feels like (likely based on whatever is profitable for its parent company)"}, {"id": 50633966, "au": "visarga", "dom": 130, "sr": 59, "sc": 4.39, "ep": 5.47, "bs": 0.0, "d": 1, "age": 6.94, "grav": 51.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 13944, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.624, "fa": 0.28, "gp": 0.593, "bl": 0.0, "ds": 0.0, "txt": "I think we need to remember how platforms tend to control the UI and filter/rank/stuff ads according to their own greedy interests to the detriment of their users. Agents working around those walls are doing good. I think this might be our chance to escape walled gardens. If my agent pulls the content but uses my choice of UI, has no dark patterns and ranks / orders according to my wishes not theirs - then I can finally see the content as I need it, or make a more informed buying choice. We have been exploited for decades, we have a chance to escape now."}, {"id": 50628344, "au": "lelanthran", "dom": 354, "sr": 60, "sc": 4.39, "ep": 5.37, "bs": 0.0, "d": 0, "age": 13.03, "grav": 131.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 14, "k": 15200, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.246, "fa": 0.42, "gp": 0.862, "bl": 0.0, "ds": 0.0, "txt": ">  The Chinese models are likely to refuse to answer questions about Taiwan, for example\n\nIDGAF, if I need to ask about Taiwan or Tiananmen Square I'd use a different model. When I need a model that will find exploits in my own code, I'll use one without those specific guard rails.\n\nWhat's helpful is to know upfront what the model will lie about."}, {"id": 50629266, "au": "mmulqueen", "dom": 2, "sr": 61, "sc": 4.39, "ep": 5.36, "bs": 0.0, "d": 1, "age": 12.02, "grav": 115.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 288, "qw": 0, "k": 28, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.892, "fa": 0.84, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "Agree. I wonder how long it took for these advisory professions to be held to that standard. I can't speak for the rest of the world, but it seems to be something we're still grappling with today in the UK and the regulation of these professions has been decades if not centuries in the making.\n\nConfidentially is an interesting aspect of it because it doesn't apply to all of those professions equally and at there are quite a few limitations to it - for example in the UK:\n\n- A solicitor/barrister has to keep things confidential, but also has to act honestly based on what they know - so if they know you're guilty because of what you've told them, their advocacy for you has to be focused on testing the evidence against you and trying to cast reasonable doubt rather than pushing a narrative they know to be false (or they can recuse themselves so you can start again with new representation).\n\n- Doctors are expected to maintain confidentiality, but may have a duty or discretion to disclose when other people are at risk and your confidentiality is also weighed against your capability to manage your own health affairs.\n\n- Accountants and tax advisers keep your financials confidential, but have to disclose tax evasion and money laundering.\n\nAll of those things require those advisors to have actual independence in their judgements and actions and relies on them being subject to disciplina"}, {"id": 50630360, "au": "ketzu", "dom": 249, "sr": 62, "sc": 4.39, "ep": 5.3, "bs": 0.0, "d": 2, "age": 10.85, "grav": 99.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1679, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.493, "fa": 0.34, "gp": 0.57, "bl": 0.0, "ds": 0.0, "txt": "I used .test, not .local, sorry for the confusion. I assume localhost:8080 forwarding would work the same, it was just easier as I already had the infrastructure for a simple cname entry.\n\nIf any agent Complains again, I will try .internal and a localhost proxy. Right now everything works with the .test domain I  claude, and everyone else just uses the normal one."}, {"id": 50634452, "au": "doginasuit", "dom": 4, "sr": 63, "sc": 4.39, "ep": 5.26, "bs": 0.0, "d": 1, "age": 6.34, "grav": 45.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 16, "k": 1217, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.426, "fa": 0.42, "gp": 0.495, "bl": 0.0, "ds": 0.0, "txt": "> When an AI says it is serving your best interests, it must actually be doing so.\n\nHow exactly do you ensure this? The LLM output is probabilistic. System instructions are a good start but
