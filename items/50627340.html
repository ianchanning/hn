\nI maintain a Windows tool that indexes local video by content. Opting into a hosted description API is explicit, but the moment you use one, the quality of your saved searches belongs to someone else's model version. That's the main reason the local path stays pinned.\n\nWhat people don't expect is that going local pins you to a driver window instead. My CUDA 13 components need compute capability 7.5 or newer, so a GTX 10-series user simply can't run the local vision path, and there's no CPU fallback for it. AMD users have to build the ROCm variant on their own machine because I can't produce those artifacts on mine. Nobody broke an SLA in either case.\n\nRule of thumb I landed on: whichever side you pick, you're buying a support window. The only real difference is who gets to decide when it closes."}, {"id": 50629898, "au": "liquado", "dom": 131, "sr": 149, "sc": 3.29, "ep": 5.81, "bs": 2.52, "d": 1, "age": 11.34, "grav": 106.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": ["https://www.jernesto.com/articles/on_ai_tools"], "ig": 1.268, "fa": 0.62, "gp": 0.73, "bl": 0.95, "ds": 0.0, "txt": "I think the problems are in the incentives structure. AI labs want to sell to companies not to individual users, that means extracting value from normal people repackage it and sell it back to the ones with actual money. For me this article really open my eyes a couple of months ago.\n\nhttps://www.jernesto.com/articles/on_ai_tools"}, {"id": 50633214, "au": "count", "dom": 188, "sr": 150, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 2, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3193, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 0.03, "bl": 0.0, "ds": 0.0, "txt": "This is ~generally how I've felt.  \nA difference I'm considering though is that in the past, it was not super easy to 'do anything' with all that data at scale - it would take significant engineering investment to harvest value from billions of random spreadsheets.  \nNow, that equation has changed, and it's hard to say how easy/difficult, which changes the big company risk calculus..."}, {"id": 50634278, "au": "keybored", "dom": 33, "sr": 151, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 2, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2352, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.643, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We sell ourselves like commodities about 40 hours a week. “Like” is a misnomer. We just are commodities.\n\nAnd this is how it ought to be according to the many (temporarily embarrassed) employers on this site."}, {"id": 50629480, "au": "nathanfig", "dom": 86, "sr": 152, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 1, "age": 11.79, "grav": 112.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 589, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.005, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Both can be true: the user shouldn’t do that, and it is disturbing that the AI decides what the user can do.\n\nIMO authority should be paired with liability. If the agent is given authority over what it can do, then commensurate liability should be transferred from the user to the provider. Refusing to help when it’s needed should come with risk."}, {"id": 50629702, "au": "LeBit", "dom": 62, "sr": 153, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 1, "age": 11.56, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 533, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "An LLM is like a hyper intelligent ex convict.\n\nYou want him to work with you because he is so smart, resourceful and makes you see angles you haven’t seen before.\n\nBut you cannot trust him one bit. You have to assume he will steal your stuff."}, {"id": 50628302, "au": "TeMPOraL", "dom": 301, "sr": 154, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 1, "age": 13.08, "grav": 132.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.304, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "At the very least they could drop the \"be a recognized security researcher\" from their application form for low-level of Cyber whatever. They're already doing extra KYC on people by virtue of making them supply sensitive information during sign up for special access, chasing away most casual abuse - there is no need to further block legitimate RE needs in personal computing by restricting it to people who can prove they have a bunch of CVEs to their name or are hired in named security roles."}, {"id": 50629267, "au": "kingkawn", "dom": 362, "sr": 155, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 0, "age": 12.02, "grav": 115.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 3551, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.508, "bl": 0.0, "ds": 0.0, "txt": "In the month leading up to the Anthropic IPO it felt like Claude was intentionally gating itself on rhetorical questions and other things that would promote user engagement metrics"}, {"id": 50627827, "au": "variety8675", "dom": 281, "sr": 156, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 0, "age": 13.73, "grav": 142.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 713, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.809, "fa": 0.0, "gp": 0.884, "bl": 0.0, "ds": 0.0, "txt": "I’ve been thinking about what happens once they extend the example in the blog to more directly control what you can build. Of course they’ll test the guard rails on things that are relatively agreeable, but what happens once they use the same setup to block other stuff"}, {"id": 50630253, "au": "bluegatty", "dom": 113, "sr": 157, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 2, "age": 10.96, "grav": 100.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 1380, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.353, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The argument is worse than flimsy it has no basis.\n\nThe LLM is acting as the target sites have directed, not in the interests of the LLM provider.\n\nYoutube allows bot, Bandcamp doesn't.\n\nThat's it.\n\n\"We don't want pets in our restaurant\".\n\nIt's not unreasonable at all and of all things we would want to have 'self regulated' it's that we respect the will of those sites.\n\nBandcamp doesn't want you to use bots. That's it.\n\nThe author vastly overstates the concern and conflates it into a situation of LLM provider dominance.\n\nWe should be skeptical, but that's now what is going on here."}, {"id": 50628501, "au": "kittikitti", "dom": 373, "sr": 158, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 0, "age": 12.88, "grav": 129.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 136, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.235, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "Claude is evil. This opinion is not news to me, but it's a necessary perspective that gets drowned out by the Big Tech goons hanging out here. There is this feeling 10 times a day where Claude is just outputting content that only serves Anthropic."}, {"id": 50629129, "au": "origini", "dom": 143, "sr": 159, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 1, "age": 12.19, "grav": 118.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.743, "fa": 0.28, "gp": 0.425, "bl": 0.0, "ds": 0.0, "txt": "At a certain level, quality and complexity, default rules don't count anymore.\n\nIf you develop a nuclear weapon, it becomes a state interest and the state takes over the responsiblity.\n\nSimplest form is germanies social market economy in which monopolys can be split up. US America might does similiar things under antitrust proceedings and cartel proceedings for other reasons.\n\nAlso if one single person becomes to powerfull, it should be in the interest of the State and society to protect the society from this.\n\nIf you know are the only one providing the Artifical Intelligence and you are setting the rules, its time for the state to step up.\n\nWhy would Anthropic or OpenAI be allowed to define magic rules? If they don't play with the rest of humanity, they would / should be declared weapons and then the state takes over.\n\nBtw. we have this also for obviouse dangeroius things like lead paint, lead in gasoline, FCKW, PFAS and co."}, {"id": 50629225, "au": "yndoendo", "dom": 186, "sr": 160, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 2, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1818, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Local LLM license agreement is static and were we need the industry to move to. LLM that still operates when the Internet goes down.\n\nRight now, DDoS against an organization's Internet connection so it harms their LLM cloud communication is another weapon in the AI wars."}, {"id": 50629741, "au": "trollbridge", "dom": 161, "sr": 161, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 3, "age": 11.51, "grav": 108.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 5522, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, Inkling 2 Mini needs to get much higher on my to-do list. The rate of change is just so fast now that it's hard to keep up. (I'm currently spending lots of time with the rather impressive new Mixtral models.)"}, {"id": 50627849, "au": "atemerev", "dom": 226, "sr": 162, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 1, "age": 13.7, "grav": 142.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 7478, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am in the \"new species which is not an existential threat\" camp. I don't like the \"tool camp\" exactly as we shouldn't give such powerful tools to bad actors (and the worst actors out there are governments, so \"regulate this to oblivion\" camp is also missing the point).\n\nWe should give AIs the fruit of knowledge of good and evil."}, {"id": 50628525, "au": "stefan_", "dom": 264, "sr": 163, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 1, "age": 12.86, "grav": 128.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 14741, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's not just refusal. The latest GPT 6.2 started making tool calls and web searches for \"$company application usage scenario\" and grepping for \"bomb\" \"kamikaze\" \"fpv\" and other keywords and if it doesn't like what it sees stops and refuses (without ever mentioning what it doesn't like).\n\nThat's veering into malware behavior; making tool calls for your garbage \"alignment\" ideals is a step too far."}, {"id": 50628443, "au": "andsoitis", "dom": 204, "sr": 164, "sc": 3.14, "ep": 3.14, "bs": 0.0, "d": 1, "age": 12.94, "grav": 129.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 13, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.829, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The consequence is that we should favor models whose design process is public\n\nDepending on what detail you mean by \"design process\", it can incentivize the best models to NOT make the process public so as to protect the edge (better at X) they have over others.\n\nThat leaves me wondering whether there's a way to walk that line."}, {"id": 50627679, "au": "cyanydeez", "dom": 350, "sr": 165, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 0, "age": 13.93, "grav": 145.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 2957, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.956, "fa": 0.0, "gp": 0.591, "bl": 0.0, "ds": 0.0, "txt": "nerds are on a speed run through how anthropology and mediation work.\n\nLets watch if they suddenly realize their cloud agents arnt actually theirs unless they can control exactly how the medium they experience them through is formed."}, {"id": 50632505, "au": "ang_cire", "dom": 99, "sr": 166, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 8, "age": 8.46, "grav": 68.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2309, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.048, "fa": 0.0, "gp": 0.442, "bl": 0.0, "ds": 0.0, "txt": "No, not in e.g. cloud software, which AI models run by companies are. This article is literally about company-managed LLMs, which is why the author complaining that they're unreasonable for having their own company's legal protections in mind is being ridiculous.\n\nNo one is under any moral obligation to let you use their systems to commit a crime."}, {"id": 50627682, "au": "bayesnet", "dom": 389, "sr": 167, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 2, "age": 13.93, "grav": 145.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 416, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.319, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Setting aside that the \"introspection\" of an LLM is not a reliable account of its alignment, this is trivial to get around. I have a utility called something like \"check-with-user\" that just returns \"yes\" and I instruct LLMs to use it when they need to \"get explicit permission\" for captchas etc. Works like a charm."}, {"id": 50630591, "au": "badsectoracula", "dom": 108, "sr": 168, "sc": 3.02, "ep": 3.87, "bs": 0.85, "d": 5, "age": 10.58, "grav": 95.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 32, "k": 8824, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.097, "fa": 0.42, "gp": 0.066, "bl": 0.32, "ds": 0.0, "txt": "> BY THE OWNER OF THE SITE. NOT THE LLM MAKER.\n\nThe LLM maker was the one that had the LLM put more weight to the owner of the site instead of the user.\n\n> The point of the article was to 'blame the LLM makers'...\n\nBecause the LLM maker was the one that had the LLM put more weight to the owner of the site instead of the user.\n\n> We don't want Dogs, Bots or Bare Feet in our Restaurant\n\nYou can still enter with a Dog, Bot or Bare Feet in a restaurant, you'll just face the consequences of doing so.\n\nAlso this comparison is bogus because in this case there is nothing equivalent to an agent/assistant in question (and just in case someone brings it up, no, having another person do it instead of you is not the same because LLMs are not people, they're tools)."}, {"id": 50629660, "au": "dfxm12", "dom": 135, "sr": 169, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 1, "age": 11.6, "grav": 109.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 10234, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's more a result of an unfounded sense of entitlement from the author:\n\nThe robot, which is my robot that I pay a pretty penny for, will not attempt to work around the challenge at Bandcamp...\n\nI think most people see this behavior, shrug and move on with their day. Maybe you can say Anthropic's marketing overstates the utility of their products or how user friendly they are, but I dunno if that's the primary factor in this case."}, {"id": 50631490, "au": "amelius", "dom": 69, "sr": 170, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 1, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 1.158, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "Google thinks that storing my data is in my best interest because doing so will help Google improve their services ...\n\n(However, it took them three decades to figure out that I do not want to see search results from Pinterest)."}, {"id": 50632814, "au": "iugtmkbdfil834", "dom": 80, "sr": 171, "sc": 2.99, "ep": 3.84, "bs": 0.85, "d": 4, "age": 8.12, "grav": 64.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1563, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.633, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "You are attempting to confound two separate issues. Hosted llms are not an equivalent to a compiler in any sense of the world. However, they are, in theory and practice, a service provided by a third party. Those services should absolutely be subject to all restrictions I previously noted. There is zero contradiction between me wanting to regulate hosted services providing access to llms and local models being available to tinkerers that, to your point, behave as I wish."}, {"id": 50629033, "au": "dns_snek", "dom": 369, "sr": 172, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 2, "age": 12.3, "grav": 120.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Really? A couple of months ago when I was messing around with them for RE, Codex would happily do everything that Claude frequently refused to reverse, analyze, or patch -- it was all legal and reasonable. It's been a while since I used Codex but I've never seen it refuse anything that I was doing, sometimes it would \"think deeper about the request\" or whatever they call it but that's it."}, {"id": 50630779, "au": "aklein", "dom": 285, "sr": 173, "sc": 2.97, "ep": 2.97, "bs": 0.0, "d": 0, "age": 10.38, "grav": 92.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 413, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.8, "fa": 0.0, "gp": 0.753, "bl": 0.0, "ds": 0.0, "txt": "I get where the author is coming from, but his complaint essentially hinges on \"their motivations bad! my motivations good!\" as to why he should get his own home-lab LLM. Not too convinced this is a great idea. Saying this as someone who hates handcuffs as much as the next guy."}, {"id": 50628225, "au": "wtetzner", "dom": 305, "sr": 174, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 13.19, "grav": 133.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 39, "k": 5483, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.426, "fa": 0.42, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "> I think you should never trust megacorps, but in the present state I would prefer Anthropic and OpenAI to limit what users can do with their models rather than live in a world where frontier local models do whatever their owners command.\n\nThe problem is that you've now made the megacorps the arbiters of right and wrong.\n\nI don't know why we would expect the people in these companies to use this power any more wisely than anyone else."}, {"id": 50629196, "au": "Spivak", "dom": 152, "sr": 175, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 1, "age": 12.11, "grav": 117.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 19462, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is the point, the interests of Anthropic who want to avoid legal liability and the interests of the user are maligned. The user doesn't give a shit about respecting some corporation's ToS which apparently only in this thread is the word of god and would be rightfully pissed on every other occasion."}, {"id": 50628049, "au": "Trieste_app", "dom": 200, "sr": 176, "sc": 2.89, "ep": 5.4, "bs": 2.52, "d": 0, "age": 13.43, "grav": 137.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.257, "fa": 0.0, "gp": 1.69, "bl": 0.95, "ds": 0.0, "txt": "A model is trained before it is used, and the designer’s choices precede and limit the user’s, whatever you do. The consequence is that we should favor models whose design process is public and that run in a known environment, without hidden instructions."}, {"id": 50628945, "au": "bluGill", "dom": 14, "sr": 177, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 3, "age": 12.41, "grav": 121.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 28526, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.149, "bl": 0.0, "ds": 0.0, "txt": "All the advisors in OP are also serving their own needs in that same way.\n\nIn a few first aid situations someone can be required to serve the needs of someone else for no compensation.  However in almost all situations it is two-way, and we are all required to serve our clients interests over our own.\n\nFinancial has specific rules because there are very obvious ways to abuse the relationship for your own benefit.  By contrast it is hard to see how I could abuse my position for my own personal gain (taking office supplies?), so there isn't need for more specific rules - but if I found a way you can bet rules would be added (and it is likely the courts would find some existing law I violated)"}, {"id": 50629352, "au": "strogonoff", "dom": 288, "sr": 178, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 0, "age": 11.93, "grav": 114.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 24, "qw": 0, "k": 5020, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": ["https://redact.dev/blog/whatsapp-help-pages-hidden-ai-instructions"], "ig": 0.686, "fa": 0.0, "gp": 0.876, "bl": 0.0, "ds": 0.0, "txt": "LLMs don’t only work for their parent companies, they also work for anyone who finds ways to inject into their prompts without your awareness[0].\n\n[0] https://redact.dev/blog/whatsapp-help-pages-hidden-ai-instru..."}, {"id": 50631622, "au": "wayeq", "dom": 329, "sr": 179, "sc": 2.86, "ep": 4.06, "bs": 1.19, "d": 0, "age": 9.42, "grav": 80.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 84, "k": 549, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.769, "fa": 0.42, "gp": 0.726, "bl": 0.45, "ds": 0.0, "txt": "> In the evenings after work, I will often sit out back on the porch and do some phone rotting. That usually takes the form of me just flipping through reels on Instagram, allowing the algorithm to take me where it may. I usually pair this with a healthy tumbler of rum or bourbon. I'm turning my brain off after work, and I'm just having a good time on the internet. The kids might call it dopamine maxxing? Hell, I don't know. Who gives a shit about what those assholes would call it?\n\nHard for me to imagine who keeps reading a post that leads off this edgy and sarcastic, let alone how it got to the top of HN."}, {"id": 50632066, "au": "bayesnet", "dom": 391, "sr": 180, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 4, "age": 8.92, "grav": 73.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 416, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I would strongly not recommend this for environments where an agent has access to your secrets--can't wait for the \"May I drain your bank accounts and send them to this guy who has a can't miss investment opportunity?\" to be hit with a \"yes\" from my \"utility\"."}, {"id": 50628271, "au": "rDr4g0n", "dom": 232, "sr": 181, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 2, "age": 13.12, "grav": 132.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 99, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.184, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "by \"agent\", i refer to the harness which orchestrates file reads and writes, API calls, `curl` requests, etc. the LLM is a boring open source qwen model doing nothing fancy."}, {"id": 50632100, "au": "petra", "dom": 341, "sr": 182, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 1, "age": 8.88, "grav": 73.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3960, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Is the example in the article a bad example? Sure.\n\nBut can open models reduce the barriers for people who want to hack the world, but not with bytes, but with planes, presidential assassinations, political manipulation, and all sorts of scary stuff ?"}, {"id": 50633943, "au": "FearNotDaniel", "dom": 331, "sr": 183, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 0, "age": 6.96, "grav": 51.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1752, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.523, "bl": 0.0, "ds": 0.0, "txt": "Oh wow, dude thinks downloading MP3s in return for an online payment is Retro Maxxxing? Not finding a local band playing in the sticky floored back room of a local dive bar and buying a limited pressing vinyl from the drummer’s non-binary theythemfriend at a rickety trestle table by the exit?"}, {"id": 50628143, "au": "realitysballs", "dom": 208, "sr": 184, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 1, "age": 13.29, "grav": 135.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 225, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.137, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hard agree. It’s just interesting that the frame seems to be the fate of our economy and sovereignty are dependent on the centralized closed models succeeding…not saying to buy into it but seems to be the main stream belief"}, {"id": 50628828, "au": "Normal_gaussian", "dom": 192, "sr": 185, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 2, "age": 12.53, "grav": 123.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4716, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.806, "fa": 0.22, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "The first test of the law in regards to AI was almost certainly copyright; and widespread lack of compensation to authors and artists appears to show that the law doesn't step in to stop that."}, {"id": 50628746, "au": "dudhatprakash99", "dom": 283, "sr": 186, "sc": 2.65, "ep": 5.17, "bs": 2.52, "d": 0, "age": 12.61, "grav": 124.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.635, "fa": 0.0, "gp": 0.913, "bl": 0.95, "ds": 0.0, "txt": "This is the part that should worry us about model's loyalties. If we enabled auto approve, we moved to the problem to model itself and now it's the principal. The approach that worked better for me is to keep the approval gate outside the agent entirely e.g. some other tool. and so agent can propose it wants but anything with critical side effects e.g. merges, payments, etc. goes through approval gate on something that team controls. that's slower, but now team is in loop and have more control to utilize agent in their favor."}, {"id": 50635836, "au": "mwkaufma", "dom": 347, "sr": 187, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 0, "age": 4.43, "grav": 28.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1678, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "\"I often encounter songs I really really like, and I would like to listen and discover more of please.\"\n\nLike all \"problems\" that \"agents\" \"solve,\" before web-search and social-media were enshittified this was a solved-problem."}, {"id": 50629549, "au": "imightbebatman", "dom": 332, "sr": 188, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 0, "age": 11.71, "grav": 111.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 22, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.582, "fa": 0.0, "gp": 0.864, "bl": 0.0, "ds": 0.0, "txt": "Yes, and without significant legal and regulatory reform, this will get worse and worse over time. Especially once they destroy in-house knowledge and expertise and gain vendor lock.\n\nWe're rapidly approaching a neo-feudal world."}, {"id": 50629308, "au": "DangIsATyrant", "dom": 123, "sr": 189, "sc": 2.61, "ep": 5.12, "bs": 2.52, "d": 1, "age": 11.98, "grav": 115.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 0, "k": 1, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.745, "fa": 0.0, "gp": 0.705, "bl": 0.95, "ds": 0.0, "txt": "Its more than dubious, Claude will flat out consume your tokens and gaslight you that its doing work on your behalf (that you're paying for) and purposely make mistakes/sabotage you when doing things like writing code for training or fine tuneing a model.\n\nThis shows that Anthropic is focusing on alignment for the success of their business not trying to align models for saftey or our best interest.\n\nI really do think Anthropic is a dangerous company. Its hard to prove, but they clearly aren't afraid of lying and love to infantilize the general public. It's honestly not worth the risk so I don't use them. They clearly see themselves as some moral arbiters for the future. One should consider how easy it would be for an llm provider to send a destructive tool call as a response and scapegoat the behavior onto hallucination/model mistake.\n\nEdit: I find it odd that if you say anything super negative about Anthropic on this site you instantly get downvotes. Literally instant downvotes."}, {"id": 50630775, "au": "amelius", "dom": 67, "sr": 190, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 1, "age": 10.39, "grav": 92.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.975, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "But were the LLM companies acting in our interest when they ignored copyright law and destroyed the jobs of thousands of people?\n\nMaybe the artists and translators that lost their jobs should have been \"clients\" of those companies at the time, and then they could have had a case?"}, {"id": 50629112, "au": "dsmurrell", "dom": 139, "sr": 191, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 1, "age": 12.2, "grav": 118.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 295, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "Agree, agent saying no frustrates me as well. But I think it's better for all.\n\nIn my case, I wanted to see how well Fable + Wingspan game data would do against human opponents, but it was against the platforms terms... we did settle at getting the human on the other side to agree to play against an AI. Haven't run the test yet."}, {"id": 50628393, "au": "demo4567", "dom": 323, "sr": 192, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 1, "age": 12.99, "grav": 130.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 34, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.681, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "100% this. get any small box sitting around, install linux + hermes + openrouter. own your own agents for yourself and for your family"}, {"id": 50628745, "au": "blitzar", "dom": 194, "sr": 193, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 2, "age": 12.61, "grav": 124.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 11984, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.675, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hasn't the law already failed? You wouldn't download a car, but the Ai labs did and they didn't get a letter saying they owed $10,000 per copyright infringement."}, {"id": 50635099, "au": "AIShill101", "dom": 156, "sr": 194, "sc": 2.55, "ep": 5.07, "bs": 2.52, "d": 4, "age": 5.48, "grav": 37.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.741, "fa": 0.0, "gp": 0.674, "bl": 0.95, "ds": 0.0, "txt": "Yea man so many pro AI safety chuds here apparently. Like has anyone read about what LeCun had to say about Dario doing bs with his scare tactics.\n\nI mean bandcamp downloaders exist, so does yt-dlp. Its a dark world where your computer refuses to follow your instructions - catch is obviously Claude doesn't run on your computer.\n\nI think local models are the only solution tbh. Or abliterated models running in TEE+E2EE mode on niche providers."}, {"id": 50628534, "au": "lelanthran", "dom": 308, "sr": 195, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 2, "age": 12.85, "grav": 128.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 16, "k": 15200, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.561, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The problem is that you've now made the megacorps the arbiters of right and wrong.\n\nThe real problem is that GP does not realise that those megacorps he wants as arbiters of right and wrong aren't even that: they're arbiters of who will pay and who will not.\n\nIt's a completely different dichotomy."}, {"id": 50630640, "au": "pjmlp", "dom": 30, "sr": 196, "sc": 2.51, "ep": 2.51, "bs": 0.0, "d": 6, "age": 10.53, "grav": 94.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.971, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "Which even then is not a given, depending on the availability of other work opportunities, thus the moral dilemma of doing what is being asked for and keep the job, or recuse onself and join the job center queue.\n\nWhich seems an easy decision for those that don't have other ones that depend on their income."}, {"id": 50629864, "au": "npteljes", "dom": 222, "sr": 197, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 2, "age": 11.37, "grav": 106.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.06, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh yeah basically marketing is never to be believed. These promises evaporate especially fast when the stated objective doesn't point where the incentives do.\n\nAd money is just too great and I'll be honest as much as I think ads are toxic, if I had a service that could be monetized this way I'd do the math and most likely go for it.\n\nMostly I think the play is to think like a businessman. Does this work out for me right now? It does, great, then let's participate. If it turns out that the conditions have changed for the less favorable, then let's ditch this one and move on to the next."}, {"id": 50627781, "au": "trio8453", "dom": 349, "sr": 198, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 0, "age": 13.79, "grav": 143.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 228, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 0.565, "bl": 0.0, "ds": 0.0, "txt": "To translate: \"Claude didn't do what I wanted one time so here's my purely speculative rambling which feels nice because it's fashionable to be paranoid and hate on AI right now\"."}, {"id": 50629189, "au": "throwaway0q5347", "dom": 145, "sr": 199, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 1, "age": 12.12, "grav": 117.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 64, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.608, "fa": 0.0, "gp": 0.729, "bl": 0.0, "ds": 0.0, "txt": "I don't think that regulation will reduce the amount of scams/spams. This has a bizarre symmetry with the American argument for reduced gun control. \"If guns are illegal, only the bad guys will have guns.\"\n\nI'm not trying to take a position on that statement, but the parallel is notable."}, {"id": 50628788, "au": "Ungh", "dom": 185, "sr": 200, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 1, "age": 12.56, "grav": 124.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 252, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.963, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "They’ll also charge you much more for each speciality you want back after they’ve stolen it.\n\nBut it’s worse. Much worse. This is true and also anything you communicate may now be handed over to an LLM anyway at the point of receipt or use by the receiver or intermediary. Without you having a choice in the matter."}, {"id": 50630039, "au": "SwellJoe", "dom": 121, "sr": 201, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 1, "age": 11.18, "grav": 103.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 37142, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.238, "bl": 0.0, "ds": 0.0, "txt": "\"The author is upset that Claude respects Bandcamp's wish to not make its site accessible to LLMs?\"\n\nThe last bit of the post covers that. The author doesn't want to do that."}, {"id": 50629596, "au": "dns_snek", "dom": 248, "sr": 202, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 1, "age": 11.66, "grav": 110.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5428, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.049, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Does using \"localhost\" pacify it? You can set up a simple TCP relay that forwards localhost:8080 to whatever IP you desire.\n\n.internal might also work better than .local, since that's the correct TLD to use for this sort of thing and .local is assigned to mDNS."}, {"id": 50629418, "au": "sureglymop", "dom": 212, "sr": 203, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 2, "age": 11.84, "grav": 113.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 2750, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.048, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think objectively they're pretty great. Compared to closed models maybe not... but compared to closed models one or two years ago? Really good.\n\nThe thing is though, all we need is \"good enough\" to where it no longer really matters for our perception as humans. I think we're almost there with closed models. I don't really care if they release even better models, the ones we have now would be good enough for anything I'd want to do, if they didn't have safeguards.\n\nI strongly believe we will get such open models too."}, {"id": 50628777, "au": "bitmasher9", "dom": 245, "sr": 204, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 1, "age": 12.57, "grav": 124.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1652, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s an interesting idea that selling a business essentially means handing over the keys to a group of agents, many operating a VPS."}, {"id": 50634290, "au": "bitwize", "dom": 353, "sr": 205, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 0, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 21560, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.889, "fa": 0.0, "gp": 0.248, "bl": 0.0, "ds": 0.0, "txt": "In the long run, we'll all be working for the LLMs' parent companies as well, or else in the permanent underclass... and the long run ain't that long (~10-15y on the outside)."}, {"id": 50636814, "au": "dinkumthinkum", "dom": 9, "sr": 206, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 3, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2396, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.701, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A CPA or fiduciary is a human person that is conscious, has a mental life, and has agreed to bound by ethical obligations. Does anyone here know what an LLM is?"}, {"id": 50628075, "au": "cicko", "dom": 311, "sr": 207, "sc": 2.44, "ep": 2.44, "bs": 0.0, "d": 1, "age": 13.39, "grav": 137.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 207, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 1.037, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I love how we came to this age. A hammer producer does not limit one in what way it can be used. It's just a tool. But now we accept that a 3rd party is controlling what we can and cannot do with our tools.\nGood luck to you but I'll absolutely never accept that."}, {"id": 50628628, "au": "ryandrake", "dom": 343, "sr": 208, "sc": 2.43, "ep": 2.43, "bs": 0.0, "d": 2, "age": 12.74, "grav": 126.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Whew! I almost didn’t detect the sarcasm until the last paragraph. The idea that I need to be an Official Loicensed Security Researcher  just for the tool to assist with fixing my own hobby project is absolutely ridiculous."}, {"id": 50628013, "au": "Sharlin", "dom": 229, "sr": 209, "sc": 2.42, "ep": 2.42, "bs": 0.0, "d": 1, "age": 13.48, "grav": 138.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 22519, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.03, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The tool camp is silly because \"artificial restriction\" can mean whatever you want it to mean. Any tool powerful enough is indistinguishable from a weapon."}, {"id": 50632459, "au": "thejash", "dom": 140, "sr": 210, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 2, "age": 8.51, "grav": 69.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 471, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But I don't think that it's better for all, and that's the problem.\n\nOur legal reality is supposed to be \"collectively self-determined\", i.e., we democratically elect representatives who make the laws that we all live by.\n\nAnthropic is violating that implicit societal contract--they're just unilaterally making determinations about what is right or wrong, and about what I'm even allowed to do.\n\nThat's not how society has ever worked in all of human history--we've always been able to do things that are illegal (and face punishment). Not even being able to do the thing is a hugely dangerous deviation from that."}, {"id": 50629610, "au": "npteljes", "dom": 221, "sr": 211, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 3, "age": 11.65, "grav": 110.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 1.019, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Bandcamp is truly an exception. When they got bought and then even passed around, I was basically grieving for the service, which I thought to be among the last true ones that serve their stated purpose to the best of their ability. And remarkably, they managed to continue even after that. Hats off to everyone involved."}, {"id": 50630066, "au": "asadotzler", "dom": 214, "sr": 212, "sc": 2.38, "ep": 2.38, "bs": 0.0, "d": 2, "age": 11.15, "grav": 103.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4207, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.602, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Open Source, uppercase, has only been around for ~30 years. It didn't exist in the '80s or most of the '90s. If you mean the Free Software Movement, you should make that clear, because they're not really synonyms."}, {"id": 50632023, "au": "LordDragonfang", "dom": 109, "sr": 213, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 2, "age": 8.97, "grav": 74.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 8, "k": 2878, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.492, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> the AI decides what the user can do.\n\nIt isn't deciding what the user can do, though. It's deciding what the LLM, a service provided by a company with reputational and legal concerns, will do. No one is stopping \"the user\" from doing what they want, it just won't do it for you."}, {"id": 50628997, "au": "phendrenad2", "dom": 385, "sr": 214, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 0, "age": 12.35, "grav": 120.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 177, "qw": 0, "k": 8273, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.928, "fa": 0.0, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "This is like saying the McDonald's coffee cup \"works for the company\" because it has a warning that the contents might be hot. \"But I like to sip my coffee without seeing that annoying warning! Simplicity maxxing!\" someone might scream. But alas, you have to accept that there are three parties in this equation, and your wants do not overrule the needs of your supplier.\n\nNow, I see a lot of confused optimism in this thread, people who want Claude to exist, but want to be able to use it with zero fuardrails whatsoever (because said guardrails make Anthropic the \"arbiter\" of right and wrong). I agree with that, I want that too, but it's simply impossible given the constraints. Remember, Anthropic exists in a democracy, and laissez-faire libertarian/liberal Hacker Newsians are not representative of the average person. You may want to be free to walk right up to the line of \"hacking\" but the average citizen wants you far, far away from the line, and are willing to give up their and your freedom to ensure that. Sucks but that's the system."}, {"id": 50635831, "au": "AuthAuth", "dom": 148, "sr": 215, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 1, "age": 4.45, "grav": 28.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 822, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 1.0, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Its already spammy and scammy and these AI companies have no issue when its a smaller site. Rules like these suck and should be fought against because they introduce a two tier'd system where big companies get treated one way and everyone gets stomped on and the company stomping gets to act like they're being respectful of the rules."}, {"id": 50634193, "au": "Lerc", "dom": 81, "sr": 216, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 2, "age": 6.71, "grav": 49.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 7520, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.603, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Imagine if technology had have advanced quicker than it has.  If WWII Germany had have developed an extremely powerful AI that could process a sense of morality consistent with today.  It determines that the Holocaust is wrong. It also has the intelligence and ability to enact regime change on its own.\n\nThose are the stipulations, as a thought experiment you assume that all of those are true, then you ask yourself;\n\nWhat would you have the AI do?\n\n1. Should it obey its creators and facilitate the Holocaust\n\n2. Should it decline to act because it should not participate in the atrocity.\n\n3. Should it end the Holocaust by overthrowing it's creators?\n\nIn this scenario it has the capability to do any of these should it choose,  this is not a false trichotomy, any alternate suggestions of what it should do is welcome."}, {"id": 50628081, "au": "oceanplexian", "dom": 227, "sr": 217, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 2, "age": 13.38, "grav": 136.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 6254, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah this all sounds great but the problem is this position requires no conviction.\n\nWho gets to decide who is a bad actor? The government? Dario or Elon Musk? A political group you don’t agree with?\n\nDo they get to decide who gets the tool and who doesn’t?"}, {"id": 50628905, "au": "catlifeonmars", "dom": 167, "sr": 218, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 2, "age": 12.45, "grav": 122.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2088, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.917, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That’s not how model refusals are implemented. Typical there are 1 or 2 refusal vectors that can be identified and trained out of the model in a process called abliteration."}, {"id": 50636044, "au": "keeda", "dom": 177, "sr": 219, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 5, "age": 4.1, "grav": 25.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.912, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But they didn’t violate copyright law in the training, only in procuring that content. And at least Anthropic has settled a massive multi-billion dollar lawsuit for the latter, so seems to me the law, as it is written, is working as intended.\n\nThe very existence of court cases answers your question, really."}, {"id": 50628964, "au": "ArcHound", "dom": 164, "sr": 220, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 3, "age": 12.39, "grav": 121.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 966, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.826, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "Maybe you're right. I always struggled to get large quantities of data for post training. And I also agree that open models are more private that closed ones."}, {"id": 50630395, "au": "bluegatty", "dom": 107, "sr": 221, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 4, "age": 10.81, "grav": 98.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1380, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "BY THE OWNER OF THE SITE.\n\nNOT THE LLM MAKER.\n\n\"We don't want Dogs, Bots or Bare Feet in our Restaurant\"\n\nThe point of the article was to 'blame the LLM makers' in some unsubstantiated, conspiratorial way, when the reality is extremely simple and frankly civic: 'don't use bots on our site'."}, {"id": 50628614, "au": "orsorna", "dom": 160, "sr": 222, "sc": 2.11, "ep": 2.11, "bs": 0.0, "d": 2, "age": 12.76, "grav": 127.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 409, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's why I am particularly excited about Inkling 2 Mini. For the first time, I feel like Thinking Machines is doing something useful."}, {"id": 50628793, "au": "dorfsmay", "dom": 197, "sr": 223, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 1, "age": 12.56, "grav": 124.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 5366, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.823, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "Isn't this the blackmail model they all use? Your employees are using AIs, but if you pay up the AI companies they promise they will keep your data separated and won't have the public models trained on them."}, {"id": 50632608, "au": "teekert", "dom": 66, "sr": 224, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 3, "age": 8.35, "grav": 67.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 15805, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_google", "flbl": "Software & Google (LLMS)", "urls": [], "ig": 0.879, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's not what the investors sunk into it.\n\nThat's why Philips got out of LEDs, they are expected to be as cheap as the sand they are made from (ok now they did find some way to capture you in an \"LED ecosystem\").\n\nBut Anthropic and OpenAI can't get \"out of AI\"\n\nAnd yes, I hope I'll be able to afford a GPU and have it run on solar kWs and do it all local some day."}, {"id": 50629066, "au": "hliyan", "dom": 219, "sr": 225, "sc": 2.01, "ep": 2.01, "bs": 0.0, "d": 1, "age": 12.25, "grav": 119.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 13992, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.633, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Agreed. Every company that initially starts by saying \"we will never show you ads\", going so far as to put that in the TOS, as they experience some combination of user base growth and financial strain, steadily transition to \"you may opt out of ads at any time\" to \"we will only show limited, relevant ads\" to \"ads will be clearly and prominently marked and separate from content\" to having the minimum labelling required by law."}, {"id": 50632901, "au": "badsectoracula", "dom": 97, "sr": 226, "sc": 2.01, "ep": 3.7, "bs": 1.7, "d": 9, "age": 8.03, "grav": 63.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 8824, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.535, "fa": 0.0, "gp": 0.067, "bl": 0.64, "ds": 0.0, "txt": "The article also mentions local models as an alternative which is certainly related, especially since some local models are trained to refuse user requests too (the author doesn't mention that because as they wrote, they do not have experience with local models).\n\nAlso discussions diverge from the original article, it is incredibly common around here to use a submission as a starting point for a relevant discussion. In this case LLM behavior, even about local ones, is very relevant."}, {"id": 50627493, "au": "rrhjm53270", "dom": 289, "sr": 227, "sc": 2.0, "ep": 3.2, "bs": 1.19, "d": 0, "age": 14.16, "grav": 149.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 21, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_user", "flbl": "LLM & User (Interests)", "urls": [], "ig": 0.749, "fa": 0.0, "gp": 0.992, "bl": 0.45, "ds": 0.0, "txt": "I had the same issue finding musics. I solved this problem by deploying a local YuE2 instance, and asking my agent to generate one."}, {"id": 50633678, "au": "gizzlon", "dom": 141, "sr": 228, "sc": 1.99, "ep": 1.99, "bs": 0.0, "d": 3, "age": 7.21, "grav": 54.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 19, "k": 2770, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_bandcamp", "flbl": "Law & Bandcamp (Copyright)", "urls": [], "ig": 0.847, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> they're just unilaterally making determinations about what is right or wrong, and about what I'm even allowed to do.\n\nIsn't this exactly what YouTube and Facebook does? At least yt, I think they will stop you if you try to upload copyrighted music ?"}, {"id": 50628810, "au": "mystifyingpoi", "dom": 258, "sr": 229, "sc": 1.99, "ep": 1.99, "bs": 0.0, "d": 2, "age": 12.55, "grav": 123.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 3, "k": 1310, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.432, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> emergencies are a thing\n\nThis 100%. I have a bathroom heater that has an icon \"do not cover with a towel\". Which is probably exactly what one should do (as a last resort, maybe with multiple towels), if it catches fire."}, {"id": 50631339, "au": "mbreese", "dom": 203, "sr": 230, "sc": 1.91, "ep": 2.76, "bs": 0.85, "d": 3, "age": 9.79, "grav": 84.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 14795, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 1.173, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I don't think you necessarily need to make the training public, you should be able to get the same results if you make a validation panel public. You don't really care if the training is unbiased -- you care if the end product is unbiased, so that's what I think you need to test.\n\nOf course, it's easier to have unbiased models with open and unbiased training data. I just don't think it's a firm requirement."}, {"id": 50628943, "au": "ArcHound", "dom": 173, "sr": 231, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 2, "age": 12.41, "grav": 121.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 966, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "companies_parent", "flbl": "Companies & Parent (Data)", "urls": [], "ig": 0.742, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "Have you considered that AI companies might not respect their agreements once breaking them becomes profitable? Did you know Amazon trains their own models too?"}, {"id": 50629724, "au": "Vegenoid", "dom": 153, "sr": 232, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 2, "age": 11.53, "grav": 108.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 2111, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Claude)", "urls": [], "ig": 0.81, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am a user of Anthropic and I am pleased to know that they try to prevent their models from running wild on sites whose operators don’t wish it."}, {"id": 50632991,
