contact"}, {"slug": "general_commentary", "label": "General Commentary", "count": 6, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 3}], "story_anchors": ["google", "trader", "app", "play", "android", "apps", "numbers", "status", "phone", "addresses", "details", "developers", "contact", "declare", "business", "store", "number", "users"], "largest_root": {"root_id": 50662729, "author": "ryandrake", "slots": 12, "start_dom": 11, "end_dom": 22, "share_pct": 21.8, "top_dom1_age": 3.0, "top_dom1_author": "kccqzy"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50662499, "au": "rvz", "dom": 34, "sr": 1, "sc": 9.04, "ep": 9.04, "bs": 0.0, "d": 0, "age": 2.94, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 114, "qw": 38, "k": 10577, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "app_store", "flbl": "App & Store (Play)", "urls": ["https://www.eu-digital-services-act.com/Digital_Services_Act_Article_30.html"], "ig": 1.501, "fa": 1.66, "gp": 0.539, "bl": 0.0, "ds": 0.0, "txt": "You have to thank the EU for enforcing this policy onto Google (and Apple) via their Digital Services Act (DSA).\n\nFrom [0]\n\n   Article 30, Traceability of traders - the Digital Services Act (DSA)\n\n   1. Providers of online platforms allowing consumers to conclude distance contracts with traders shall ensure that traders can only use those online platforms to promote messages on or to offer products or services to consumers located in the Union if, prior to the use of their services for those purposes, they have obtained the following information, where applicable to the trader:\n\n   (a) the name, address, telephone number and email address of the trader;\n\nIt also exists for the App Store, Now it exists for Google Play.\n\n> Under Google Play’s global developer policies, all active developer accounts must declare whether they are a trader or non-trader under European Economic Area (EEA) and United Kingdom (UK) laws in Play Console. This declaration must be completed by February 1, 2027\n\n[0] https://www.eu-digital-services-act.com/Digital_Services_Act..."}, {"id": 50662438, "au": "vorpalhex", "dom": 39, "sr": 2, "sc": 6.94, "ep": 6.94, "bs": 0.0, "d": 0, "age": 3.09, "grav": 18.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 16318, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": [], "ig": 1.547, "fa": 0.96, "gp": 0.39, "bl": 0.0, "ds": 0.0, "txt": "The deeply unfair, perverse incentives say that you should absolutely do the shady thing and use a cheap agent-as-a-service for your side projects that go commercial.\n\nNever use your actual house as a business contact.\n\nWe should want people who make things to be honest and unafraid of identifying themselves! This seems like a basic control for avoiding malbehavior.\n\nBut the issue is that the moment your personal details are out there you will be hounded by a significant amount of crappy sales teams, every drive-by scam ever, the occasional random no-reason death threat and the odd video of a stranger committing suicide who they have decided to send to you, someone they did $20 of business with that one time.\n\nSo either be prepared to get a commercial address and gain a bunch of cost and complexity or spend the $200 a year on a shady agent-as-a-service."}, {"id": 50663542, "au": "danpalmer", "dom": 21, "sr": 3, "sc": 5.03, "ep": 5.03, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 25003, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "box_realise", "flbl": "Box & Realise (Renting)", "urls": [], "ig": 1.311, "fa": 0.34, "gp": 0.678, "bl": 0.0, "ds": 0.0, "txt": "As you say, they can rent a place. Plus there are options between renting a P/O box and renting an office. A virtual office costs as little as $20/m, and can be used as a company's legal address.\n\nI realise that's a high bar for some side project, but that's kinda the crux – if you're making money off people you have to take it seriously, you can't wing it anymore, and your customers knowing \"who you are\" (potentially as a business) is part of that.\n\nIf that's too high a bar, make the app free. If you want to make money from it, get serious. Society already applies reasonable bars like this in other ways – safety certificates, liability insurances, etc. Software has been special in this regard, and I'm not sure it should be."}, {"id": 50662886, "au": "lapcat", "dom": 32, "sr": 4, "sc": 4.9, "ep": 4.9, "bs": 0.0, "d": 0, "age": 1.8, "grav": 11.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 16790, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "app_store", "flbl": "App & Store (Play)", "urls": ["https://support.google.com/paymentscenter/answer/7161426", "https://developer.apple.com/help/app-store-connect/manage-compliance-information/manage-european-union-digital-services-act-trader-requirements/"], "ig": 0.875, "fa": 0.9, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "Key detail not stated in the submitted article: \"We don't allow you to use a PO box address.\" https://support.google.com/paymentscenter/answer/7161426\n\nThat's not an EU requirement. In contrast with Google Play, the Apple App Store does allow a PO box: https://developer.apple.com/help/app-store-connect/manage-co..."}, {"id": 50662490, "au": "kccqzy", "dom": 1, "sr": 5, "sc": 4.62, "ep": 4.62, "bs": 0.0, "d": 0, "age": 2.96, "grav": 17.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 43, "qw": 0, "k": 20062, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": ["https://developer.apple.com/help/app-store-connect/manage-compliance-information/manage-european-union-digital-services-act-trader-requirements/"], "ig": 0.871, "fa": 0.62, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "I don’t know why Google is singled out here, but Apple does the same thing w.r.t. showing developers’ phone numbers and addresses. It was widely discussed when Apple announced it. I haven’t looked into the regulations myself but I believe it is required by regulations.\n\nApple’s page: https://developer.apple.com/help/app-store-connect/manage-co..."}, {"id": 50662729, "au": "ryandrake", "dom": 11, "sr": 6, "sc": 3.65, "ep": 3.79, "bs": 0.0, "d": 0, "age": 2.34, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_technically", "flbl": "Developers & Technically (Traders)", "urls": [], "ig": 1.182, "fa": 0.0, "gp": 0.701, "bl": 0.0, "ds": 0.0, "txt": "From the link, this isn’t all developers. This is developers who identify themselves as “traders”, which is based on: Profit-seeking motive, Transaction volume, Business Setup, and Legal status.\n\nThis seems to strike a good balance. I think if you’re just a person writing free software and putting it out there for people to use, privacy is fine. But if you are a business seeking to profit off of the public, you should be identifiable.\n\nEven better if the info is open to the public. The public should have the right to know who is behind companies trying to make money off them."}, {"id": 50663387, "au": "Izkata", "dom": 3, "sr": 7, "sc": 3.62, "ep": 3.76, "bs": 0.0, "d": 2, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 40, "k": 10109, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "app_store", "flbl": "App & Store (Play)", "urls": [], "ig": 1.006, "fa": 0.42, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "> when TFA makes it clear that they are just adhering to EU law\n\nGoogle first added it due to some consumer protection law in California, it was why I stopped updating my app.  I would've been fine just excluding California but at least back then it wasn't an option.  No idea if it would be now, I haven't bothered since then.\n\n> and also that the rules don't apply to all solo developers, just \"traders\", i.e. developers whose apps are a business designed to make money (as opposed to just a hobby)\n\nIt was all, at least back then.  You had to publish a street address customers could contact the seller at."}, {"id": 50662951, "au": "hn_throwaway_99", "dom": 2, "sr": 8, "sc": 3.42, "ep": 3.71, "bs": 0.0, "d": 1, "age": 1.59, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 78723, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_technically", "flbl": "Developers & Technically (Traders)", "urls": [], "ig": 1.247, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Can someone recommend a good word for when something is technically true, but gives an average person a completely false impression, and which has as much of a negative connotation as the word \"lying\"? Because that's what I feel about this headline, and I think \"clickbait\" is too mild a word.\n\nThat is, the headline is making it seem like Google just doesn't care about developers' privacy, when TFA makes it clear that they are just adhering to EU law, and also that the rules don't apply to all solo developers, just \"traders\", i.e. developers whose apps are a business designed to make money (as opposed to just a hobby). And as you point out, this is not a Google-specifc thing at all.\n\nI see this all the time now, where I think people want to be able to craft a narrative that is actually false, but they want to have a defense in being able to say they weren't technically lying."}, {"id": 50662593, "au": "usr1106", "dom": 35, "sr": 9, "sc": 3.24, "ep": 3.39, "bs": 0.0, "d": 1, "age": 2.68, "grav": 16.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 4963, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_technically", "flbl": "Developers & Technically (Traders)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": "Are solo Android developers traders? (Genuine question, I don't know) Edit: The criteria in TFA don't give any numbers. Do a couple of hundred or thousand €/$ make you a trader?\n\nWell, if they are getting significant amounts of my consumer money, I'd prefer to know who am I buying from.\n\nIn Germany the same information has to be provided on every web site. Not sure if it has created significant harm to those who put their information there. (Don't have a site under German legislation)"}, {"id": 50662858, "au": "hedora", "dom": 25, "sr": 10, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 0, "age": 1.9, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 26331, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "app_store", "flbl": "App & Store (Play)", "urls": [], "ig": 1.122, "fa": 0.0, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "Does anyone have any practical experience building a business using progressive web apps?\n\n“Click add to homescreen on tablets and phones, optionally download our desktop app or install through FDroid” has never looked better than it does today."}, {"id": 50662626, "au": "webprofusion", "dom": 26, "sr": 11, "sc": 2.9, "ep": 2.9, "bs": 0.0, "d": 0, "age": 2.6, "grav": 15.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 674, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": [], "ig": 0.977, "fa": 0.0, "gp": 0.419, "bl": 0.0, "ds": 0.0, "txt": "Yep, they already do phone and home address as well if you are  business. If you are a business you literally need to rent an actual office with phone primarily to maintain privacy for these online product listings. Likewise DUNS numbers (used as validation for many things)."}, {"id": 50663386, "au": "Anoian", "dom": 16, "sr": 12, "sc": 2.74, "ep": 3.03, "bs": 0.0, "d": 1, "age": 0.38, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 97, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "box_realise", "flbl": "Box & Realise (Renting)", "urls": [], "ig": 0.949, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What about people where privacy is not just a personal wish they have but an absolute necessity for safety? There are for example people who take in foster children where the families the children were taken from shall not know the personal addresses, as these people will use force against the people who have the children, to get them back.\n\nYou could argue that these people should just start companies on P/O boxes and then use that address here too but this is specifically blocked."}, {"id": 50662633, "au": "LoganDark", "dom": 51, "sr": 13, "sc": 2.61, "ep": 2.83, "bs": 0.0, "d": 0, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "app_store", "flbl": "App & Store (Play)", "urls": [], "ig": 0.791, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This will remove all apps from the Play Store that aren't updated by 2027. All of them. Every single one. Globally.\n\nWe need an incredibly large archival effort, NOW."}, {"id": 50663325, "au": "danpalmer", "dom": 19, "sr": 14, "sc": 2.42, "ep": 2.86, "bs": 0.0, "d": 2, "age": 0.54, "grav": 5.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 25003, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": [], "ig": 0.879, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are you selling directly as yourself to customers? If yes, and your only business premises are your home, then yes I do think customers have a right to know that. Not because it's your home, because it's the legal address of an entity they're doing business with.\n\nPeople are reading this as a privacy right, but you don't have a right to sell to customers, and if you do, they have a right to know who they're buying from. I believe the customer's right is more important because they can't work around it, whereas the business can if it matters to them."}, {"id": 50663353, "au": "danpalmer", "dom": 38, "sr": 15, "sc": 2.35, "ep": 2.65, "bs": 0.0, "d": 1, "age": 0.46, "grav": 5.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 25003, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "box_realise", "flbl": "Box & Realise (Renting)", "urls": [], "ig": 1.126, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As a former EU resident, I'm glad this is happening and this is the sort of thing I liked from the EU. This is the sort of thing I want in consumer protection.\n\nThe vast majority of businesses have no problem with this – it's just that software is in this awkward bit of a venn diagram where people often work from home, they do so as sole traders, and they make little enough money that they don't want to set up a business address. Very much the exception, not the rule."}, {"id": 50662758, "au": "TZubiri", "dom": 48, "sr": 16, "sc": 2.31, "ep": 2.75, "bs": 0.0, "d": 0, "age": 2.25, "grav": 13.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 2174, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "app_store", "flbl": "App & Store (Play)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You can't have privacy and due diligence for both parties, if you want one side to be anonymous, then the other side needs to be public.\n\nEven if you use some public proxy in the middle so that both parties can keep their identities private, which is what Google does in this case, but then again, the proxy is telling you they can't really do that, and one party, usually the one that decides they want to build an application for users, is the one that needs to be public.\n\nAs a user why would it be normal for random identities online to distribute their application on a vetted distribution list of applications. Do we even do this for server repos like apt?"}, {"id": 50663138, "au": "jkaplowitz", "dom": 46, "sr": 17, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 2, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4184, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_technically", "flbl": "Developers & Technically (Traders)", "urls": [], "ig": 0.875, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The linked Google support article says that Google does have a similar provision. See the Note section near the top. (Technically it covers the EEA + UK, not only the EU, but that's probably what you meant.)"}, {"id": 50663175, "au": "spaqin", "dom": 50, "sr": 18, "sc": 2.0, "ep": 2.37, "bs": 0.0, "d": 1, "age": 0.99, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 622, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": [], "ig": 0.595, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't see a problem with anonymity all around. I've been using computers for 30 years and I haven't learned of any developer's home address before."}, {"id": 50663412, "au": "Anoian", "dom": 20, "sr": 19, "sc": 1.98, "ep": 2.42, "bs": 0.0, "d": 3, "age": 0.3, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 97, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "box_realise", "flbl": "Box & Realise (Renting)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem with that assumption is that they actually legally cannot work around it as google and apple both block P/O boxes, so even if your company is registered on a P/O box, they will still show the address where you live. The only solution is renting a literal place, where you pay rent and utilities, but nobody is going to rent an office just for a side-project."}, {"id": 50662651, "au": "LoganDark", "dom": 45, "sr": 20, "sc": 1.88, "ep": 2.68, "bs": 0.0, "d": 1, "age": 2.54, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 4881, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "app_store", "flbl": "App & Store (Play)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Theoretically yes, if you ignore the letter of the law and interpret it to mean \"only if you do those things towards/in the EU\" (from what I can tell, nowhere does the DSA actually say this)\n\nBut if an app store requires you to declare whether or not you would qualify as a trader under the DSA, regardless of whether or not you actually distribute in or serve regions covered by the DSA, then answering that question untruthfully could have legal or administrative consequences.\n\nApple explicitly states that if you don't distribute in the EU, you're not acting as a trader on the App Store. I don't see whether Google has any similar provision or not."}, {"id": 50662426, "au": "jrl", "dom": 23, "sr": 21, "sc": 1.77, "ep": 2.21, "bs": 0.0, "d": 0, "age": 3.11, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 70, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "home_address", "flbl": "Home & Address (Business)", "urls": [], "ig": 0.658, "fa": 0.0, "gp": 0.457, "bl": 0.0, "ds": 0.0, "txt": "Regulation becomes doxxing. I wonder if you can use mailbox services in order not to reveal your home address."}, {"id": 50663248, "au": "froh", "dom": 29, "sr": 22, "sc": 1.69, "ep": 1.84, "bs": 0.0, "d": 3, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 2386, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_phone", "flbl": "Support & Phone (Offer)", "urls": [], "ig": 0.781, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "in some legislations you're obliged to provide contact info (like \"impressum\" in Germany for web pages)\n\nso unfortunately this fix is illegal there."}, {"id": 50663195, "au": "Terr_", "dom": 7, "sr": 23, "sc": 1.49, "ep": 1.93, "bs": 0.0, "d": 2, "age": 0.94, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 28451, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.394, "fa": 0.28, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Hmmm, word-wise, I would probably go with \"disingenuous.\"\n\nIt's a bit stronger than \"misleading\" since it implies the problem is more than an accident, and involves some bad intent."}, {"id": 50662630, "au": "flykespice", "dom": 44, "sr": 24, "sc": 1.42, "ep": 1.93, "bs": 0.0, "d": 0, "age": 2.59, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 2078, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
