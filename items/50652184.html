 "general_web", "count": 11}], "story_anchors": ["tokens", "moat", "usage", "prices", "wholesale", "model", "models", "membership", "discount", "costco", "open", "deepseek", "pay", "price", "cheapest", "replacement", "limits", "openrouter"], "largest_root": {"root_id": 50653633, "author": "jedjonesuk", "slots": 18, "start_dom": 1, "end_dom": 18, "share_pct": 11.2, "top_dom1_age": 27.8, "top_dom1_author": "jedjonesuk"}, "buried_cutoff": 48, "rescue_top_k": 32, "ablations": [], "tournament": [], "comments": [{"id": 50654746, "au": "Kuyawa", "dom": 137, "sr": 1, "sc": 8.31, "ep": 8.31, "bs": 0.0, "d": 0, "age": 25.04, "grav": 378.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.589, "fa": 0.95, "gp": 1.288, "bl": 0.0, "ds": 0.0, "txt": "The more the merrier, I love competition. So here is my opinion as a customer...\n\nI use DeepSeek, no monthly subscription, no credit card on record, just pay $2 and use it till you run out of tokens, then top up again with $5, $10, whatever you feel like spending, no strings attached, nothing bothering me to subscribe, renew, kneel, crawl, or beg for celestial forgiveness to switch\n\nAnd that, my friends, is how you keep a customer happy forever. Take note"}, {"id": 50652932, "au": "jochem9", "dom": 53, "sr": 2, "sc": 8.23, "ep": 8.23, "bs": 0.0, "d": 0, "age": 29.42, "grav": 495.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 322, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.591, "fa": 0.95, "gp": 1.232, "bl": 0.0, "ds": 0.0, "txt": "I tried Commandcode Go (with intent of upgrading to Goat - $10/m, ample usage). Was comparing it to Opencode Go (their $10/m subscription,). I am mainly using DeepSeek. Both are not getting DeepSeek API TPS. Commandcode sometimes goes fast, but regularly drops in performance. Opencode is always quite slow.\n\nI ended back at DeepSeek API pricing. For my usage it's a bit more expensive (about 50% more), but consistent performance is worth something."}, {"id": 50659989, "au": "Havoc", "dom": 111, "sr": 3, "sc": 8.16, "ep": 8.16, "bs": 0.0, "d": 0, "age": 16.44, "grav": 189.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 10, "k": 27478, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.467, "fa": 1.1, "gp": 1.088, "bl": 0.0, "ds": 0.0, "txt": "They'd benefit enormously from flipping this sentence around:\n\n>$5/mo to access the highest quality models at wholesale prices.\n\nIf I hear $5 for openrouter like service my reaction is fuck off, while if I hear wholesale model prices that is more interesting...and if you follow with ok it costs then my mind is already thinking about breakevens not $5 for something I can get for free.\n\nI do wonder how YC like startup companies launch without someone level headed looking at things like this...these are presumably smart people how is this not obvious"}, {"id": 50653846, "au": "lmeyerov", "dom": 81, "sr": 4, "sc": 7.99, "ep": 7.99, "bs": 0.0, "d": 0, "age": 27.11, "grav": 431.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 3385, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": ["https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens"], "ig": 1.829, "fa": 0.62, "gp": 1.327, "bl": 0.0, "ds": 0.0, "txt": "A bunch of routers and neoclouds have recently been caught leaking & reselling prompts, including blatantly ignoring ZDR: https://www.dragos.com/blog/ai-supply-chain-security-canary-... . It's worth reading this study - it was a long running one tracking many canary tokens across many providers, even leading to their honeypot AWS servers being hacked through the credentials they planted in the tainted prompts. Many in security will recognize the authors.\n\nFor most LLM tasks, I would be VERY careful renting servers and using token APIs from entities you do not have high trust in. And no, I don't believe in folks claiming GPU hw encryption (TEE), that can be bypassed."}, {"id": 50658486, "au": "vlyan", "dom": 9, "sr": 5, "sc": 7.76, "ep": 7.76, "bs": 0.0, "d": 4, "age": 18.79, "grav": 235.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 72, "qw": 48, "k": 345, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": ["https://openrouter.ai/blog/announcements/csam-screening/"], "ig": 1.669, "fa": 1.04, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": ">the providers lie, log everything despite claiming ZDR\n\nopenrouter itself does it.\n\nhttps://openrouter.ai/blog/announcements/csam-screening/\n\n>For inference content covered by OpenRouter’s ZDR policy, we do not retain prompts or responses after processing, except when you explicitly choose to have us store them or when retention is needed for CSAM review, reporting, and related legal preservation.\n\nI get it that openai/anthropic/google are terrified of another journo hit piece about gooners abusing imaginary children, and they must've bullied OR into implementing such a system to access their models. the sane thing to do was put a disclaimer that gpt/claude/gemini are not ZDR and leave the rest the fuck alone, because no one else gives a shit.\n\ninstead, they monitor, and likely log, absolutely everything."}, {"id": 50654251, "au": "skeledrew", "dom": 129, "sr": 6, "sc": 6.92, "ep": 7.77, "bs": 0.85, "d": 3, "age": 26.08, "grav": 404.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 67, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": ["https://www.paypal.com/us/cshelp/article/what-is-the-paypal-debit-mastercard%C2%AE-and-how-do-i-get-one-help669"], "ig": 1.606, "fa": 0.96, "gp": 0.866, "bl": 0.32, "ds": 0.0, "txt": "Well I've had one for at least 7 years now. Alas it turns out there's a serious wrinkle which I totally forgot about:\n\n\"To apply for a PayPal Debit Card, you need an active personal PayPal account in good standing, a confirmed US street address, your date of birth, and your social security number (SSN).\"⁰\n\nA non-starter for the ones who'd actually benefit the most. Unless they can find some kind of proxy.\n\n⁰ https://www.paypal.com/us/cshelp/article/what-is-the-paypal-..."}, {"id": 50656852, "au": "dotancohen", "dom": 21, "sr": 7, "sc": 6.77, "ep": 6.77, "bs": 0.0, "d": 2, "age": 21.4, "grav": 291.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 14071, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.565, "fa": 0.9, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "Depends on what you are doing.\n\nI could not for the life of me get the graphics card and suspend both working on a spanking new Acer laptop last year. I've been using Debian since 2005, so maybe I'm just inexperienced, I needed help. Being a new machine there was nothing personal on it, so I let Claude Code resolve everything. With full access to the machine it did in 40 minutes what I couldn't do in three days. I don't know if it would have been possible or how long it would have taken had I needed to type everything and copy everything over. And even then a malicious command could get through.\n\nI shudder since it needs updating. I think the mainline kernels support what I need by now. But we've all learned, never touch a running system..."}, {"id": 50653110, "au": "petesergeant", "dom": 115, "sr": 8, "sc": 6.66, "ep": 6.66, "bs": 0.0, "d": 0, "age": 29.0, "grav": 483.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 5653, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.368, "fa": 0.56, "gp": 1.278, "bl": 0.0, "ds": 0.0, "txt": "I had to write an embarassing security disclosure report yesterday, because while evaluating models for code security scanning I'd forgotten to set OpenRouter to be ZDR (for the first couple of hours only), and then later got a notice to tell me that one of the end providers it'd be routed to had been hacked.\n\nSuffice to say I will not be sending tokens to a company who doesn't tell me who the end inference provider is, where they're based, for what appears to be a 5% reduction in price (whatever their headline says) over what I'll get from OpenRouter."}, {"id": 50654273, "au": "ricardobeat", "dom": 152, "sr": 9, "sc": 6.55, "ep": 6.55, "bs": 0.0, "d": 0, "age": 26.04, "grav": 403.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.476, "fa": 0.68, "gp": 0.787, "bl": 0.0, "ds": 0.0, "txt": "Honestly it would be more appealing if the marketing wasn’t so disingenuous.\n\nYou don’t get “unlimited” and “no 5-hour limit” on the $5/month, you pay to get access to discounted models on a pay-as-you-go system. Of course no limits apply. The comparison to plan providers feels a little car-salesman-ish.\n\nThe discounted rates seem to be 20-30% cheaper than AIHubMix."}, {"id": 50653105, "au": "faangguyindia", "dom": 69, "sr": 10, "sc": 6.5, "ep": 6.5, "bs": 0.0, "d": 0, "age": 29.02, "grav": 484.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 959, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.395, "fa": 0.34, "gp": 1.554, "bl": 0.0, "ds": 0.0, "txt": "What are you guys using to provide inference/agent usage within your app? Curious what your setup looks like.\n\nI just load $100 on Deepseek api and let people use ai agent in one of my app for free and limited by request and token count per user (to prevent abuse)"}, {"id": 50653496, "au": "cubefox", "dom": 124, "sr": 11, "sc": 6.2, "ep": 6.35, "bs": 0.0, "d": 0, "age": 28.06, "grav": 457.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 166, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.666, "fa": 0.22, "gp": 1.246, "bl": 0.0, "ds": 0.0, "txt": "A huge problem with OpenRouter is how hard it is to pay them. In many countries you can only choose between either paying with credit card, which are not really common in many countries, or using some specific crypto currency (where the specifis are not supported on every crypto platform), which is a huge pain in the ass to set up.\n\nAdditionally, for many users the credit card payments to OpenRouter are simply declined, and nobody knows why. I tried to pay with \"Mastercard Debit\", OpenRouter said it was declined by my bank, my bank said Mastercard blocked it, Mastercard said they never block anything but can't confirm or deny whether a company has or hasn't some risk classification which may lead to a block, etc.\n\nMany other people have the same problem, but OpenRouter doesn't seem to care to add more payment options, despite claiming for over a year that more options (like PayPal) would come \"soon\".\n\nI think it's unlikely that small OpenRouter alternatives have payment options that are any better."}, {"id": 50654317, "au": "ricardobeat", "dom": 41, "sr": 12, "sc": 6.19, "ep": 6.19, "bs": 0.0, "d": 1, "age": 25.93, "grav": 400.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 0.938, "fa": 0.95, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "You pay $5 to be a member, then you can use models at cheaper rates than OpenRouter. It’s prepaid, not a subscription, you have to top-up your account.\n\nThis will make sense if you use more than `$discounted_rate * tokens - $5` every month - roughly $15-$20 of DS 4.1 Flash. For less than that it’s not worth it.\n\n(the $10 plan actually gives you usage credits)"}, {"id": 50655883, "au": "james2doyle", "dom": 11, "sr": 13, "sc": 5.94, "ep": 6.09, "bs": 0.0, "d": 2, "age": 23.08, "grav": 330.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 905, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": ["https://x.com/opencode/status/2123214984389771684", "https://x.com/thdxr/status/2125414608877895857"], "ig": 1.085, "fa": 0.96, "gp": 0.555, "bl": 0.0, "ds": 0.0, "txt": "OpenCode Go is now their own provider. At least with some of the models. They do fallback to others when there is service issues:\n\nAvoid the click: \"44% of our tokens today were served by our own GPUs\": https://x.com/opencode/status/2123214984389771684\n\nThey moved DeepSeek, GLM, and Kimi so far: https://x.com/thdxr/status/2125414608877895857"}, {"id": 50652995, "au": "resonious", "dom": 19, "sr": 14, "sc": 5.37, "ep": 5.51, "bs": 0.0, "d": 0, "age": 29.27, "grav": 491.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3696, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 1.594, "bl": 0.0, "ds": 0.0, "txt": "The trust element for LLM inference is huge. For serious usage I'm sending all kinds of data. I try not to get secrets in there but it's easy to slip up. But for sure all my source code ends up on there. But then with tool calling, it's basically full access to my machine. Will we see attacks where an infected/evil router injects malicious tool calls? I don't want to find out for myself.\n\nSo personally I would take these cheap routers as too good to be true. It's not really hard to make these yourself either."}, {"id": 50657717, "au": "joshheitzman", "dom": 125, "sr": 15, "sc": 5.34, "ep": 5.63, "bs": 0.0, "d": 1, "age": 19.94, "grav": 259.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 222, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.201, "fa": 0.68, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "Even when openrouter accepts a payment method it doesn't necessarily work.  I'm in the US and put $10 in using a Mastercard credit card in October.  Came back early this month to put in $20 on the same card.  Got a couldn't authorize error multiple times.  Tried a Discover card and same thing.  Tried again a couple of weeks later and it still didn't work.  Searching around shows this not to be an uncommon problem with openrouter, so I'm using vercel.com now instead."}, {"id": 50660390, "au": "pcthrowaway", "dom": 98, "sr": 16, "sc": 5.05, "ep": 5.27, "bs": 0.0, "d": 0, "age": 15.66, "grav": 175.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 6917, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.321, "fa": 0.34, "gp": 0.825, "bl": 0.0, "ds": 0.0, "txt": "I'm assuming they can only undercut Moonshot AI on their own Kimi models for now because they haven't hit the $20M revenue threshold yet.\n\nUntil then, this is pretty phenomenal value.\n\nAlthough I see others have mentioned fly-by-night providers that promised the same then routed to cheaper models behind the scenes, so I guess that's a possibility too."}, {"id": 50653718, "au": "KaiserPro", "dom": 145, "sr": 17, "sc": 4.77, "ep": 4.99, "bs": 0.0, "d": 0, "age": 27.49, "grav": 442.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 16739, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.656, "fa": 0.0, "gp": 0.756, "bl": 0.0, "ds": 0.0, "txt": "sigh\n\nLook kids, remember when you did cyber training, and there were lots of stupid examples about passwords taped to a monitor, or people entering in credit cards into dodgy sites to \"unlock new ring tones\"\n\nThis is that, but modern day and less millennial naivety.\n\nWho are they?\n\nhow are they able to provide compute for so cheap?\n\nAre they injecting prompts into your context?\n\nWhere/how are they storing the context?\n\nI'm not advocating for everyone buying either a GPU or frontier lab license, but come on, you know this is a scam. deep down its too good to be true, and you know it."}, {"id": 50652693, "au": "fedupnow", "dom": 64, "sr": 18, "sc": 4.56, "ep": 4.56, "bs": 0.0, "d": 1, "age": 29.95, "grav": 510.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.324, "fa": 0.34, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "Its not no limits, theyre giving you a discount. Like a \"costco\", card. You're still paying per token.\n\nIts really not that great of a deal either, and there's thousands of these discounted offerings now. Their prices are competitive to Openrouter i guess but there's lots of discounted token shops selling unused token allocations for 80%  off."}, {"id": 50654913, "au": "sixhobbits", "dom": 141, "sr": 19, "sc": 4.52, "ep": 4.74, "bs": 0.0, "d": 0, "age": 24.73, "grav": 370.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 7645, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.328, "fa": 0.28, "gp": 0.564, "bl": 0.0, "ds": 0.0, "txt": "I tried this out for a bit a few months ago but the hype seemed more than what they delivered\n\n- they kept saying they are going to 'open source it soon' but they never do\n\n- they keep hyping how cheap the tokens are, but it's not that different from opencodego etc I think?\n\n- there was a bunch of stuff about 'taste' that I didn't understand and I'm not sure if it's still relevant\n\nLooks like a cool product but overall if Pi is 'undersell over-deliver' then this seems to be the opposite."}, {"id": 50653245, "au": "throwa356262", "dom": 102, "sr": 20, "sc": 4.39, "ep": 4.83, "bs": 0.0, "d": 0, "age": 28.69, "grav": 474.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.425, "fa": 0.0, "gp": 1.023, "bl": 0.0, "ds": 0.0, "txt": "I recently tried the french provider Eden as a dropin replacement for openrouter. Turns out pi doesnt support them and the devs dont seem to be in a hurry to address this.\n\nMy point is, despite everyone using the same openai API format switching to a new router is not completely frictionless."}, {"id": 50656674, "au": "tancop", "dom": 31, "sr": 21, "sc": 4.24, "ep": 4.53, "bs": 0.0, "d": 1, "age": 21.72, "grav": 298.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 1490, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.445, "fa": 0.28, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "I don't care who gets my source code. All my personal projects are either open source, will be open source when they become usable or they're too specific to be useful for other people but there's nothing secret in them.\n\nWhen it comes to work it's simple. If they specifically ban non approved providers you should respect that, but if they don't feel free to use the cheapest API out of China you can find.\n\nI don't get why anyone feels like they need to protect their employer's IP. It shouldn't even belong to them anyway. Just do the bare minimum your contract says (not making the whole codebase public on purpose)."}, {"id": 50653504, "au": "ghosty141", "dom": 35, "sr": 22, "sc": 4.23, "ep": 4.82, "bs": 0.0, "d": 0, "age": 28.03, "grav": 456.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 927, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 1.437, "bl": 0.0, "ds": 0.0, "txt": "How is this supposed to be an OpenRouter \"Replacement\" when it offers quite different functionality.\n\nOpenRouter can be used with \"prepaid\" credits, no subscription. Moat doesn't.\n\nOpenRouter has tons of models to choose from, Moat doesn't.\n\nLike sure it is in a similar space but it's quite different and for me the two points I mentioned are the whole reason why I use it."}, {"id": 50653633, "au": "jedjonesuk", "dom": 1, "sr": 23, "sc": 4.19, "ep": 4.48, "bs": 0.0, "d": 0, "age": 27.75, "grav": 449.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 12, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.176, "fa": 0.0, "gp": 1.184, "bl": 0.0, "ds": 0.0, "txt": "Man they sure don't give a lot of detail on where these requests are being served? Is it them hosting? Is it the Chinese labs? Where are the servers located?\n\nThis is effectively a non starter for any org that is trying to take data governance seriously. It's not better than openrouter in that regard."}, {"id": 50655544, "au": "jedjonesuk", "dom": 7, "sr": 24, "sc": 3.95, "ep": 4.83, "bs": 0.0, "d": 3, "age": 23.58, "grav": 342.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 12, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.46, "fa": 0.34, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "And as we saw a week ago, everything they say is completely untrustworthy because the providers lie, log everything despite claiming ZDR, access tokens and such that run through the systems and then proxy the actual request to a chinese provider.\n\nSo using deepseek to process invoices or some such thing with a US provider would actually be leaking the invoices to 1 the provider who lied, and 2 deepseek themselves.\n\nWe have had to start re-assuring customers that we do not use open router, we control all the hardware, and we can tell them exactly which DCs they operate in. The only thing I am worried about now is it coming out that a bunch of Neo-providers have said they have DC in EU and they were actually somewhere else, but I put the odds of that being the case at like 10%."}, {"id": 50654994, "au": "hirako2000", "dom": 109, "sr": 25, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 1, "age": 24.58, "grav": 366.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2365, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.176, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's bulk negociate pricing. Transfered back to consumers.\n\nThe question is what happens when inference providers tighten their discounted offers, it won't be the steep 70% discount anymore, they will  get their own user base.\n\nBulk pricing is something Open router should do."}, {"id": 50654459, "au": "Semaphor", "dom": 146, "sr": 26, "sc": 3.69, "ep": 4.35, "bs": 0.0, "d": 0, "age": 25.62, "grav": 392.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 14991, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.211, "fa": 0.34, "gp": 0.366, "bl": 0.0, "ds": 0.0, "txt": "Maybe they should let a better agent build their vibeslopped site? It barely works. Random freezes, CPU usage going up to 10%. Haven’t seen such a broken page in a while. (Firefox, Win)"}, {"id": 50657656, "au": "arach", "dom": 94, "sr": 27, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 0, "age": 20.03, "grav": 261.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 125, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "Putting aside all the concerns shared in conversation so far, I bet \"Costco of AI\" gets a lot of traction, it's a smart brand promise"}, {"id": 50653218, "au": "drbscl", "dom": 82, "sr": 28, "sc": 3.44, "ep": 4.33, "bs": 0.0, "d": 0, "age": 28.75, "grav": 476.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 479, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.866, "bl": 0.0, "ds": 0.0, "txt": "Bold claim to say it’s an openrouter replacement; OR is clearly targeting people running services themselves who need an API for accessing AI models (a cloud AI gateway). This targets individual users.\n\nDon’t get me wrong it seems like good value for the use case, but it does not even come close to OR’s features."}, {"id": 50658993, "au": "raphar", "dom": 96, "sr": 29, "sc": 3.41, "ep": 3.63, "bs": 0.0, "d": 0, "age": 17.96, "grav": 218.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 2027, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.537, "bl": 0.0, "ds": 0.0, "txt": "Not saying anything about these guys.\n\nHow long until a competing (malicious) wholesale router assess its environment, realizes it is giving directions to a shell session and grabs everything at hand? (Or worse)"}, {"id": 50657473, "au": "Wicher", "dom": 47, "sr": 30, "sc": 3.22, "ep": 3.73, "bs": 0.0, "d": 2, "age": 20.32, "grav": 267.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 296, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.174, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The first thing I did was compare the rates for DeepSeek v4.1 Flash, and:\n\n             IN (MT)  OUT (MT)\n  OpenRouter 0.0507 / 0.2028\n  MOAT       0.06   / 0.24\n\nSo not cheaper. Then again that OpenRouter price is currently via a \"83 % off\" discounted Baidu Qianfan. Then again again, there's always something on discount somewhere. I don't know what to make of it. Will I now need a router to route between MOAT and OpenRouter?"}, {"id": 50654288, "au": "esskay", "dom": 2, "sr": 31, "sc": 3.0, "ep": 4.1, "bs": 0.0, "d": 1, "age": 26.01, "grav": 402.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3136, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "It'll be the same as openrouter and opencode go I'd assume - farming out to the cheapest provider, so yes China in many cases. For many people they dont tend to care as they are using these cheaper options for trivial local personal projects or assistant work rather than big dev projects."}, {"id": 50653732, "au": "boristsr", "dom": 119, "sr": 32, "sc": 2.85, "ep": 3.51, "bs": 0.0, "d": 1, "age": 27.46, "grav": 441.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 317, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.009, "fa": 0.34, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "I'm working on something exactly like this. Testing it with 2 friends at the moment, pushed nearly a billion tokens through it in the past 4 days. Going to open source it soon."}, {"id": 50661307, "au": "pampas", "dom": 151, "sr": 33, "sc": 2.66, "ep": 3.54, "bs": 0.0, "d": 0, "age": 13.54, "grav": 139.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 137, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "I don't trust Openrouter anymore. They changed their API key credit limit UI from a simple number input to a multi choice with 50/1000/5000/custom (or something similar) just to push higher limits. This is like a greedy restaurant soliciting huge tips.\n\nThe enshitification has begun."}, {"id": 50662408, "au": "tstenner", "dom": 80, "sr": 34, "sc": 2.65, "ep": 3.23, "bs": 0.0, "d": 4, "age": 10.42, "grav": 93.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 118, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 0.963, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But unless you're permanently monitoring the training you'll have serious alignment issues and security incidents after 12-16 years."}, {"id": 50653623, "au": "tamimio", "dom": 132, "sr": 35, "sc": 2.62, "ep": 3.72, "bs": 0.0, "d": 0, "age": 27.77, "grav": 449.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2464, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.035, "fa": 0.0, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "We don’t need costco of AI, we need home meal cooking of AI. Local models are the only true future or you are always under the mercy of many factors from the businesses to the laws to whatever."}, {"id": 50653172, "au": "fedupnow", "dom": 66, "sr": 36, "sc": 2.58, "ep": 3.16, "bs": 0.0, "d": 3, "age": 28.85, "grav": 479.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 30, "kpp": 15.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.346, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I could, and there are many but I dont necessarily want to promote them.\n\nI think its a very bad idea to use these discounted services without having some garuntee about where your requests are going.\n\nNot saying commandcode is doing this, I dont think they are, but selling discounted tokens is probably the most effective honeypot at the moment. Im sure there's some legit services, commandcode is probably one of them but some or them are certainly just being used to collect credentials/secrets and then make up the difference by other means.\n\nA platform might sell tokens, and be legit but their providers might not be.\n\nLLMs are essentially RATs we voluntarily allow to operate on our machines, you better trust the people you're renting them from."}, {"id": 50665493, "au": "ricardobeat", "dom": 44, "sr": 37, "sc": 2.49, "ep": 3.81, "bs": 0.0, "d": 3, "age": 2.7, "grav": 16.2, "surf": 12.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 23128, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.169, "fa": 0.34, "gp": 0.067, "bl": 0.0, "ds": 0.0, "txt": "They are able to negotiate due to volume - Command Code has been around for a long time.\n\nThose are 60% discounts when compared to the original provider pricing. You can find plenty of third-party providers that are as cheap, some cheaper."}, {"id": 50661515, "au": "seizethecheese", "dom": 100, "sr": 38, "sc": 2.47, "ep": 3.72, "bs": 0.0, "d": 2, "age": 13.02, "grav": 131.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.087, "fa": 0.34, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Most of the open weight providers have in their license that you need permission to serve their models if you're running a \"Model as a Service\" business. Some have that kick in over a certain revenue threshold (I'm assumin Kimi here has $20m as threshold.)"}, {"id": 50653144, "au": "zedascouves", "dom": 70, "sr": 39, "sc": 2.27, "ep": 3.66, "bs": 0.0, "d": 1, "age": 28.93, "grav": 481.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 30, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 0.597, "fa": 0.68, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "I have the $500 open ai plan which gives me $500 api credits every month. more than enough for my apps for now."}, {"id": 50663848, "au": "randomblock1", "dom": 90, "sr": 40, "sc": 2.19, "ep": 2.85, "bs": 0.0, "d": 3, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 445, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.214, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This only \"proves\" (loosely, there are holes) that TrustedRouter is running the routing software they say they are, and that they're sending and receiving requests to some upstream unmodified. It doesn't prove that the upstream API actually runs what it's supposed to... which is kind of the whole point. I'm not concerned about routers, I'm concerned about the upstream providers."}, {"id": 50664269, "au": "gkbrk", "dom": 138, "sr": 41, "sc": 2.17, "ep": 3.27, "bs": 0.0, "d": 0, "age": 5.51, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 3002, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.337, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "CommandCode founder also regularly explodes at random people. Even going as far as threatening thousands of their paying users with lawsuits and claiming that he told his payment team to report them to their bank.\n\nHe deleted most of these tweets but you can still find some from him and his team. And if you mention any of these, he'll block you on Twitter.\n\nNot really things that inspire confidence in something that will have so much of your personal data and potentially access to your computer (because they can always modify the `shell` tool commands that the models send)."}, {"id": 50657870, "au": "andai", "dom": 42, "sr": 42, "sc": 2.17, "ep": 3.27, "bs": 0.0, "d": 2, "age": 19.73, "grav": 255.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 0.978, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How are they able to offer such massive discounts? 60-70% off on some models.\n\nThey mention \"wholesale prices\", are they able to buy model capacity at a lower rate? Is that a thing?"}, {"id": 50653094, "au": "Oxodao", "dom": 114, "sr": 43, "sc": 2.11, "ep": 3.21, "bs": 0.0, "d": 1, "age": 29.04, "grav": 484.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 451, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For Pi / Opencode, if you have a subscription to one AI service and you're happy with it, you dont't need a router. Router are great to try out a lot of different models from different providers without having to create account everywhere.\n\nFor API usage that's a bit different since the use case can vary, but since you have to tweak your prompts depending on the model anyway I'm not sure it's that good of an idea to rely on a router for these..."}, {"id": 50653692, "au": "aktenlage", "dom": 133, "sr": 44, "sc": 2.09, "ep": 3.34, "bs": 0.0, "d": 1, "age": 27.58, "grav": 444.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 411, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.421, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Depends. Local models have definite advantages, but (for the foreseeable future) also have definite disadvantages.\n\nI think the most important thing is to have diverse providers of models and inference. It would be awful if we end up with a monopoly or oligopoly like for smartphone operating systems or web search.\n\nI think openrouter and moat both are helpful in making us less dependent on specific companies."}, {"id": 50653563, "au": "andrewinardeer", "dom": 74, "sr": 45, "sc": 1.9, "ep": 3.22, "bs": 0.0, "d": 1, "age": 27.9, "grav": 453.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1830, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mine my own silicon and then forge wafers in the garage. It's a long processes, but the supply chain is trusted. I then run inf on this silicon knowing full well there's no backdoors. I've gone through every line of code for the os and the inf software. Air gapped the whole thing, too. You can't be to careful."}, {"id": 50653300, "au": "trollbridge", "dom": 71, "sr": 46, "sc": 1.81, "ep": 3.35, "bs": 0.0, "d": 1, "age": 28.57, "grav": 471.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 5522, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "Combination of DeepSeek, Xiaomi MiMo, and local models.\n\nI generally run everything through a quick judgment in a local model basically saying \"is this likely to violate a provider's TOS/guadrails?\" since I'm dealing with user generated content."}, {"id": 50653669, "au": "skeledrew", "dom": 103, "sr": 47, "sc": 1.73, "ep": 2.98, "bs": 0.0, "d": 1, "age": 27.66, "grav": 446.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 4, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.266, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> pi doesnt support them\n\nOh My Pi may have support. But also you can have Pi extend itself with that support. If you're starting from zero, Get ChatGPT or another provider with web chat to bootstrap the extension.\n\nSomeone will eventually make a \"router bootstrapper\" recipe (if there isn't already) so anyone can generate code for a new router specific to their agent."}, {"id": 50662091, "au": "techno-beetle", "dom": 77, "sr": 48, "sc": 1.69, "ep": 3.01, "bs": 0.0, "d": 4, "age": 11.31, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 14, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As someone who works in a ghost factory etching viruses onto grains of sand, the fearmongering about sand supply chains has gone too far. If people could just stop worrying and trust the sand we'd be much better off as a society, in that I'd be much better off financially and that's probably best for society."}, {"id": 50653494, "au": "jiaosdjf", "dom": 153, "sr": 49, "sc": 1.56, "ep": 2.66, "bs": 0.0, "d": 0, "age": 28.07, "grav": 457.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 239, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 0.93, "fa": 0.0, "gp": 0.33, "bl": 0.0, "ds": 0.0, "txt": "It really is simple, either you're ZDR or you're storing / training on my prompts.\n\nYou either lead with that piece of information and the guarantees and systems you've put in place or you and your product can fuck right off."}, {"id": 50654363, "au": "throwa356262", "dom": 104, "sr": 50, "sc": 1.55, "ep": 2.94, "bs": 0.0, "d": 2, "age": 25.83, "grav": 398.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the router format needs to be standardised. The openai chat API doesnt work great for routers.\n\nI haven't tested oh-my-pi, maybe it works. Can be a last resort (but I prefer the simplicity of pi)."}, {"id": 50655872, "au": "rufo", "dom": 68, "sr": 51, "sc": 1.45, "ep": 2.84, "bs": 0.0, "d": 3, "age": 23.11, "grav": 330.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 2649, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.208, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They're a membership wholesale warehouse store. Most items are sold very close to or at cost, but you have to pay a membership fee to even browse. They operate in 14 countries in North America, Europe, Asia, and Oceania, so they aren't just an American thing."}, {"id": 50653352, "au": "cyanydeez", "dom": 30, "sr": 52, "sc": 1.34, "ep": 2.88, "bs": 0.0, "d": 1, "age": 28.42, "grav": 467.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2957, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.012, "fa": 0.0, "gp": 0.347, "bl": 0.0, "ds": 0.0, "txt": "i've got my gitlab setup on expiring tokens and moving to a One Time Password for securing my interfacts. That's the closest one can get when all this data is potentially logged somewhere in \"the machine\"."}, {"id": 50653815, "au": "tamimio", "dom": 134, "sr": 53, "sc": 1.33, "ep": 2.72, "bs": 0.0, "d": 2, "age": 27.19, "grav": 434.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 2464, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "openrouter_pay", "flbl": "Openrouter & Pay (Card)", "urls": [], "ig": 1.158, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "These disadvantages are mostly not natural and man made. If we mix up the timelines, and say operating systems boom is happening right now, we probably will never see linux as both MS and Apple will do the impossible to kill it before it’s born, similarly, if AI boom happened decades ago, we would have had local models as an equivalent or better options. Sure, having multiple companies remove the potential vendor lock between one or two, but looking at the history of how these go, usually other companies dissolve and one or two remain viable."}, {"id": 50659949, "au": "MallocVoidstar", "dom": 93, "sr": 54, "sc": 1.31, "ep": 2.56, "bs": 0.0, "d": 1, "age": 16.5, "grav": 191.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1788, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Went and looked at a GLM model, for the first provider listed Trustedrouter say they can't verify privacy, don't know where the provider is located, they don't know what region inference will be done in, they don't know what quantization the model is being served at, and it's not ZDR. How in the world is this supposed to be better than openrouter?"}, {"id": 50662230, "au": "byzantinegene", "dom": 24, "sr": 55, "sc": 1.28, "ep": 2.82, "bs": 0.0, "d": 1, "age": 10.95, "grav": 100.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 312, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llm_machine", "flbl": "LLM & Machine (Data)", "urls": [], "ig": 1.155, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "there are plenty of automated use cases that don't involve sensitive data (etc. web scraping, classification), and won't work on a claude/chatgpt subscription. these are good candidates for llm routers."}, {"id": 50655507, "au": "alentred", "dom": 4, "sr": 56, "sc": 1.28, "ep": 2.82, "bs": 0.0, "d": 3, "age": 23.64, "grav": 343.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 2, "k": 1637, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "provider_deepseek", "flbl": "Provider & Deepseek (Open)", "urls": [], "ig": 1.2, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> by location\n\nNot as flexible as one might think, though. You either use the default routing, or US-only, or EU-only. In eu.openrouter.ai in particular the offer is very limited as of today. Otherwise you basically need to cherry-pick the providers from the global list in the settings. I would love to see this being more usable/flexible as well as a larger offer in EU."}, {"id": 50662370, "au": "chanux", "dom": 12, "sr": 57, "sc": 1.28, "ep": 2.76, "bs": 0.0, "d": 1, "age": 10.53, "grav": 94.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 6540, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.028, "fa": 0.0, "gp": 0.236, "bl": 0.0, "ds": 0.0, "txt": "I find OpenRouter discounts page to be a bit sneaky in this way. On the main view, it shows a discount but if you click through, it's just one or two providers discounting in exchange of prompt retention.\n\n(Maybe it's just me. But I got caught by surprise.)"}, {"id": 50654785, "au": "skeledrew", "dom": 105, "sr": 58, "sc": 1.28, "ep": 3.54, "bs": 0.85, "d": 3, "age": 24.96, "grav": 376.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 1.505, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Oh I don't mean bootstrap a full router service; just the connection to any. Very simple because every router worth using implements the OpenAI and/or Anthropic API specs. The only thing that's really \"custom\" about a router that's relevant to base agent functionality is how to fetch and parse the list of models.\n\nA router service too should be fairly simple to setup though, as it's just a map of inference sources. The real work is in the deals struck with all those sources to get tokens priced so they can earn."}, {"id": 50660267, "au": "hackernud3s", "dom": 22, "sr": 59, "sc": 1.28, "ep": 2.61, "bs": 0.0, "d": 3, "age": 15.88, "grav": 179.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 206, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "discounted_price", "flbl": "Discounted & Price (Costco)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You could have just told claude to write a bunch of sudo commands and then eyeballed them before running them. Giving claude root is taking laziness too far imho."}, {"id": 50652606, "au": "rxliuli", "dom": 60, "sr": 60, "sc": 1.28, "ep": 2.56, "bs": 0.0, "d": 0, "age": 30.13, "grav": 515.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 62, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "api_usage", "flbl": "API & Usage (Router)", "urls": [], "ig": 0.508, "fa": 0.0, "gp": 0.944, "bl": 0.0, "ds": 0.0, "txt": "When I see a subscription model with \"no limits,\" my insti /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
