mmentary", "count": 112, "useful": 5, "useful_pct": 4.5, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 17}, {"category": "primary_technical_doc", "count": 2}, {"category": "code_repository", "count": 1}, {"category": "doi_peer_reviewed", "count": 1}], "story_anchors": ["leonida", "github", "gta", "banned", "school", "recomp", "lead", "xbox", "clone", "cut", "users", "massive", "official", "previous", "version", "alone", "complete", "decades"], "largest_root": {"root_id": 50627731, "author": "Rnonymous", "slots": 177, "start_dom": 246, "end_dom": 422, "share_pct": 29.5, "top_dom1_age": 11.9, "top_dom1_author": "K0IN"}, "buried_cutoff": 180, "rescue_top_k": 80, "ablations": [], "tournament": [], "comments": [{"id": 50628933, "au": "TMWNN", "dom": 127, "sr": 1, "sc": 14.49, "ep": 14.49, "bs": 0.0, "d": 2, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 79, "qw": 9, "k": 4665, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": ["https://web.archive.org/web/20120509040315/http://www.gamasutra.com/view/feature/134754/the_replay_interviews_will_wright.php", "https://archive.org/details/Computer_Gaming_World_Issue_27/page/n31/mode/1up?view=theater", "https://archive.org/stream/1988-09-compute-magazine/Compute_Issue_100_1988_Sep\u0023page/n89/mode/2up"], "ig": 1.935, "fa": 3.11, "gp": 0.746, "bl": 0.0, "ds": 0.0, "txt": ">Piracy has never had a significant impact on game sales.\n\nPiracy was unbelievably destructive to software companies and, ultimately, to the computer companies themselves.\n\nRaid on Bungeling Bay sold 20-30K copies on C64 but a million NES cartridges. <https://web.archive.org/web/20120509040315/http://www.gamasu...> Once Nintendo proved in 1986 that the console market wasn't dead, there was a massive move by software publishers to consoles, using cartridges that can't be easily duplicated; those that couldn't make the move, like Epyx, died. Piracy pretty much killed the Atari 8-bit software market <https://archive.org/details/Computer_Gaming_World_Issue_27/p...>, and the same thing happened to the ST <https://archive.org/stream/1988-09-compute-magazine/Compute_...>!"}, {"id": 50631711, "au": "throwaway0123_5", "dom": 496, "sr": 2, "sc": 12.79, "ep": 12.79, "bs": 0.0, "d": 3, "age": 8.85, "grav": 73.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 105, "qw": 19, "k": 307, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": ["https://independentonsaturday.co.za/technology/2026-11-23-gta-6-capped-at-30-fps-on-ps5-pro-due-to-cpu-limits-rockstar-games-confirms/"], "ig": 2.117, "fa": 2.27, "gp": 0.932, "bl": 0.0, "ds": 0.0, "txt": "> That the game doesn’t run ideally on consoles adds weight to the “pc version is harder than it looks”,\n\nI don't think this is necessarily true... the best console GTA VI runs on is PS5 Pro, which has:\n\n- 16 GB memory (shared between CPU/GPU)\n\n- a mid-tier 2020-era 8-core CPU with a cut-down cache (Rockstar has said the game is limited mainly by CPU [1])\n\n- a GPU roughly matching upper-midrange cards (between RTX 3070 and 3080, much closer to 3070) from 2020\n\nGood gaming PCs in 2020 had better specs and midrange 2026 gaming PCs should easily exceed PS5 Pro specs (albeit at a higher cost). High-end 2026 gaming PCs will have dramatically more processing power. Even if they can optimize a lot for the limited set of hardware used in consoles, consoles are starting from a significant hardware disadvantage.\n\n[1]: https://independentonsaturday.co.za/technology/2026-11-23-gt..."}, {"id": 50628179, "au": "jmyeet", "dom": 413, "sr": 3, "sc": 12.13, "ep": 12.13, "bs": 0.0, "d": 1, "age": 12.79, "grav": 127.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 222, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": ["https://www.gamesindustry.biz/eu-commission-no-evidence-that-piracy-affects-video-games-sales"], "ig": 2.011, "fa": 2.02, "gp": 1.133, "bl": 0.0, "ds": 0.0, "txt": "For those of us old enough to remember the early days of CD ripping and music sharing, the game RE panic is basically the same.\n\nThen the music industry came up with magic numbers about the trillions they lost from Napster, Limewire, etc. Studies of game piracy in later years showed no evidence that piracy displaced sales [1]. There was more evidence that those that pirated often bought more not less.\n\nThe other big data point was streaming. It used to be that it was very difficult to watch old TV shows. Sometimes you could buy DVD sets, sometimes not. Netflix really took off from being a place to watch a lot of content that was previously inaccessible. And this really impacted piracy.\n\nSo there's tons of data to suggest that piracy is an access or service problem. We have this concerted effort to port GTA6 to PC because Rockstar still wants to dictate the release cycle and, in their ideal world, they'd wait 1-1.5 years for a PC release because that's what they've done prior.\n\nThere are a lot of rumors that Rockstar has pushed up the likely PC release date to possibly as early as Q1 2027. I find these rumors at least plausible. If so, that's a good thing.\n\nBottom line: if you don't want people pirating your stuff, give them the option to buy it.\n\n[1]: https://www.gamesindustry.biz/eu-commission-no-evidence-that..."}, {"id": 50630260, "au": "toomuchtodo", "dom": 258, "sr": 4, "sc": 11.32, "ep": 11.47, "bs": 0.0, "d": 4, "age": 10.5, "grav": 94.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 123, "qw": 0, "k": 113040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": ["https://news.ycombinator.com/item?id=49700907", "https://news.ycombinator.com/item?id=49357337", "https://news.ycombinator.com/item?id=49027462"], "ig": 1.54, "fa": 1.85, "gp": 1.776, "bl": 0.0, "ds": 0.0, "txt": "Capitalism isn't working, based on a preponderance of the evidence. 100+ Democratic Socialists were elected this last midterm election cycle. Support for Democratic Socialism is 60%+ for the under 35 cohort. ~$5T/year in annual profits from the US economy are concentrated to the ~10% of American households who hold ~93% of equities. Most Americans cannot afford basic needs on their incomes, and the share of national income going to wages is at a historical low. I wouldn't make \"capitalism good\" a load bearing argument, as it is unsupported by the data and evidence (although it is used to argue for the suboptimal status quo to remain). Good for whom? Certainly not most of the citizenry.\n\nCitations:\n\nhttps://news.ycombinator.com/item?id=49700907\n\nhttps://news.ycombinator.com/item?id=49357337\n\nhttps://news.ycombinator.com/item?id=49027462\n\nhttps://news.ycombinator.com/item?id=48950696\n\nhttps://news.ycombinator.com/item?id=45475951\n\n(with my apologies to Gordon Gekko, and for an offtopic subthread for the assertion rebuttal)"}, {"id": 50633139, "au": "OkayPhysicist", "dom": 286, "sr": 5, "sc": 9.9, "ep": 10.19, "bs": 0.0, "d": 8, "age": 7.29, "grav": 55.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 365, "qw": 24, "k": 5940, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.914, "fa": 1.38, "gp": 1.214, "bl": 0.0, "ds": 0.0, "txt": "> Jesus was Jewish indeed, but the New Testament writes that Jesus fulfilled all the Jewish commandments and then set Christians free from all those.\n\nFor those following along, this is in reference to Matthew 5:17, where Jesus says \"Do not think that I have come to abolish the law or the prophets. I have come not to abolish but to fulfill.\"\n\nHowever, I think you've grossly misunderstood the meaning of it. Literally the next sentence, 5:18-19 is \"Amen, I say to you, until heaven and earth pass away, not the smallest letter or the smallest part of a letter will pass from the law, until all things have taken place. Therefore, whoever breaks one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven. But whoever obeys and teaches these commandments will be called greatest in the kingdom of heaven.\"\n\nJesus then proceeds to illustrate several examples, where he strengthens, not diminishes, old testament law. Jesus is not saying that Christians are no longer bound by those laws, he in fact says that his followers are expected to go above and beyond the requirements of the Jews. Don't merely pay off your wife to divorce her, don't divorce her at all. Don't merely limit your retaliation to equivalent damage, don't retaliate at all. Etc., etc.\n\nThe only scriptural weakening of teachings that I can think of is in Acts 10:11-15, where "}, {"id": 50630622, "au": "Agentlien", "dom": 465, "sr": 6, "sc": 9.55, "ep": 9.7, "bs": 0.0, "d": 1, "age": 10.09, "grav": 88.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 261, "qw": 0, "k": 2975, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.915, "fa": 1.24, "gp": 1.148, "bl": 0.0, "ds": 0.0, "txt": "I have a lot of sympathy for the people working at Rockstar. Personally, I used to work at EA on the Need For Speed franchise. A lot of really passionate people doing a lot of hard work trying to make something fun for the masses. We were 400 people on the project directly, 200 working full-time at the three Ghost Games offices.\n\nWhat I really didn't like was all the negativity online, the pure hostility from a lot of self-proclaimed fans, and accusations of not understanding or caring about our own game.\n\nBut the projects for modding, decompilation, etc.? Those felt like a love letter to the craft we cared about. They were generally loved by the actual people making the game and fiercely hated by the suits in legal and upper management. It was really sad how far we went to thwart them, deliberately paying in game performance and increasing debugging complexity for the hardest bugs just to make it harder for people to modify the game. And the stated reason for a big chunk of the complexity was to stop modders specifically.\n\nIt makes no sense to me that piracy would meaningfully threaten the livelihood of the people making a hugely popular game. Not when just buying the game on console is by far the most convenient option and there's so much money poured in advertisement. Personally I would love playing GTA VI and I will probably buy it when it does come to PC. If I had a lot mo"}, {"id": 50628099, "au": "wpm", "dom": 592, "sr": 7, "sc": 9.52, "ep": 9.52, "bs": 0.0, "d": 1, "age": 12.91, "grav": 129.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 237, "qw": 20, "k": 3715, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.894, "fa": 1.37, "gp": 0.8, "bl": 0.0, "ds": 0.0, "txt": "> but that kinda reads like \"yeah we wouldn't have beaten you up if you just gave us your lunch money\".\n\nDoes it? I would have happily shelled out $100 to play it on PC instead of having to watch streamers have all the fun because they happened to either buy a console they hardly used years ago or bought a PS5/Xbox at stupidly inflated prices so they can play at 30 fps with no keyboard/mouse support.\n\nIf anything, the entire situation reads to me like a bully, Rockstar, holding this great thing they paid to have made over everyone's heads unless you pay for the cuck pass, \"come on, just jump a little higher\", and AI and the leaker just came up and punched them in the gut for being a greedy sod. They had this coming. Wishing the REers all the best, I'll be happy to use their efforts on the 200GB dump I have sitting on my NAS, and maybe buy the official PC version at a discount on Steam in a few years.\n\nOh and by the way, Rockstar already made $4B in revenue on an estimated $1.5B development cost, and they don't pay their devs apparently very well. So they can kiss my ass. They'll end up making plenty of money on this game over the next decade, the few people who are going to risk running malware and putting up with a jank recomp are not going to affect that. Rockstar will resell the same game at full price to PS6 owners, to the next Xbox owners, and to PC owners."}, {"id": 50625895, "au": "spwa4", "dom": 565, "sr": 8, "sc": 8.72, "ep": 8.87, "bs": 0.0, "d": 5, "age": 16.99, "grav": 200.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 317, "qw": 0, "k": 1214, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.911, "fa": 0.95, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Why?\n\nAI labs became trillion dollar companies by committing hundreds of millions of copyright violations. All of tech has admitted by now to doing this, most in court (so can't be disputed, at least not in other court cases), have been doing this for over 10 years now. Congress illegally changed the law (there are things even congress isn't allowed to do, such as changing the law retroactively ... which they did anyway). If we now judge the tech bosses the way we judged 9 year olds during the \"nappster wars\" ($40k and 2 months prison PER INFRACTION), times hundreds of millions, \"ethically\" all of tech's senior management would be in jail until long after the human race dies out, and the fact that Alphabet is worth trillions doesn't matter, because hundreds of millions times 40k is far more than a few trillion dollars.\n\nThese companies don't get punished, won't get punished. Don't have to destroy illegally made products (which is essentially all non-trivial LLMs). Don't have to do anything. So THAT is considered ethhical, and government (all branches, executive, courts, legislative) has effectively forced that viewpoint on the rest of us.\n\nSo what exactly is the \"ethical\" case for disallowing something THAT'S LEGAL IN THE FIRST PLACE?\n\nOh, right, I know: billionaires get to violate copyright and we're just peasants.\n\nI think ethically we have the right to the government making "}, {"id": 50627727, "au": "TeMPOraL", "dom": 537, "sr": 9, "sc": 8.39, "ep": 8.39, "bs": 0.0, "d": 1, "age": 13.41, "grav": 137.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 126, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": ["https://portwatch-vi.xyz/"], "ig": 1.969, "fa": 0.9, "gp": 0.83, "bl": 0.0, "ds": 0.0, "txt": "Interesting bits:\n\n- This project already made rounds on social media, which is what makes the shutdown notable.\n\n- It's relevant to the ongoing conversation on LLM-assisted RE that became suddenly effective in past two-three months, and is being actively suppressed by first parties now -- this is the biggest recent development in topics of DRM, freedom of computing, asserting ownership, right to repair, adversarial interoperability, competitive compatibility, and so on.\n\n- Reveal that this project was driven by a high schooler, i.e. showing that LLMs are enough to supply the technical side for this, and the primary human contribution is drive to do it + spare time (both of which schoolkids have an advantage in).\n\nInteresting thing from this thread: not only there are parallel efforts, there's even a leaderboard for them now - https://portwatch-vi.xyz/."}, {"id": 50634011, "au": "altairprime", "dom": 420, "sr": 10, "sc": 7.98, "ep": 8.42, "bs": 0.0, "d": 1, "age": 6.45, "grav": 46.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 482, "qw": 13, "k": 5799, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.505, "fa": 1.38, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "Welcome to pro-capitalist sociopathy! You are now morally eligible to sit on a U.S. corporation’s board of directors :D\n\nIt’s a well-kept secret from much of the population that sociopathy is strongly correlated with profits. For example, Zuckerberg isn’t unique in being detached from humanity, he’s just unique in being obviously detached. The vast majority of us are much better at faking human concern and platitudes. In person, I can be extremely charming and flirtatious, though I prefer to keep that under wraps so I don’t have to suffer through people developing emotional attachments and then getting rude when I don’t. U.S. corporations learned this moral void from the great robber barons, who learned it from the industrialists and slavers preceding them. It’s not unique to any of them! Humanity has been producing us for millennia (I particularly enjoyed the portrayal of ancient pharaohs as competent sociopaths in Stargate, disregarding the alien veneer to get people to accept that portrayal as realistic) and you’re welcome to the party any time.\n\n> So why wouldn't that (lack of ethical) standard also apply here to us?\n\nThis is a primary contention in U.S. society, and has been for some time: Are ethical concerns of higher precedence than self-interest or not? Should society regulate morals upon those who prefer being unencumbered by them? Consider, ironically enough, both th"}, {"id": 50633792, "au": "the_lucifer", "dom": 446, "sr": 11, "sc": 7.92, "ep": 8.43, "bs": 0.0, "d": 3, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 25, "k": 201, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.683, "fa": 1.04, "gp": 1.044, "bl": 0.0, "ds": 0.0, "txt": "\"We think there is a fundamental misconception about piracy. Piracy is almost always a service problem and not a pricing problem\"\n\n- GabeN.\n\n> If Rockstar wanted the PC audience they would've put it on PC, they're clearly capable. You experiencing FOMO doesn't then make it right.\n\nThey 100% will put it in PC, either in 3 months or in 18 months, because they want money. They're just planning to increase the profits from exploitative double dipping by betting on people who will buy it again.\n\nMy hope is that the lost sales from these recomp efforts >>> the extra sales from douple dippers so they learn a lesson (which is probably unrealistic but can't tell given the scope and sheer societal significance of a GTA game and the eyes on this)."}, {"id": 50629367, "au": "magicmicah85", "dom": 116, "sr": 12, "sc": 7.84, "ep": 7.99, "bs": 0.0, "d": 5, "age": 11.46, "grav": 107.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 647, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": ["https://www.trueachievements.com/game/Grand-Theft-Auto-V/achievements"], "ig": 1.969, "fa": 0.62, "gp": 1.101, "bl": 0.0, "ds": 0.0, "txt": "The copies of GTA 5 sold is not accounting for all the people who have bought it across multiple generations and devices. We also don't have good data on how many people have played online versus single player, but if we use True Achievements as a source:\n\nhttps://www.trueachievements.com/game/Grand-Theft-Auto-V/ach...\n\n227k players have completed the first story mission called Welcome to Los Santos\n\n383k players have completed the GTA Online: Complete the Introduction mission.\n\nI think GTA Online was provided as a standalone purchase for awhile, so that might account for why there are 150k more people who have completed the GTA Online first achievement versus the story mode first mission."}, {"id": 50627752, "au": "dysoco", "dom": 78, "sr": 13, "sc": 7.77, "ep": 7.77, "bs": 0.0, "d": 0, "age": 13.39, "grav": 137.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 1658, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.54, "fa": 0.68, "gp": 1.523, "bl": 0.0, "ds": 0.0, "txt": "Funnily enough a coworker said to me \"Don't worry it's going to be reverse engineered and ported to PC in a week\" and I said no way that was going to happen any time soon, that AI has helped a lot but that this was still a massive undertaking.\n\nLooks like I was completely wrong and we might get a playable game in one or two weeks, guess that's another one to the list of my \"LLMs just won't\" guesses.\n\nTo think that only a few years ago I was trying to reverse engineer Commandos (1998) which is a much much smaller game, originally for Windows, without any encryption/anti-copy and I got nowhere near a 2% of it being done."}, {"id": 50629871, "au": "barnabee", "dom": 37, "sr": 14, "sc": 7.41, "ep": 7.41, "bs": 0.0, "d": 4, "age": 10.91, "grav": 100.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 3131, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.684, "fa": 0.34, "gp": 1.712, "bl": 0.0, "ds": 0.0, "txt": "I don't believe in IP law, I believe they should have no rights here.\n\nJust like I voluntarily pay for lots of music, journalism, TV, etc. (it's trivial to acquire a DRM free copy, in fact I sometimes do that for things I've paid for when the format or delivery is inconvenient), I'm also happy to pay $80 for GTA VI.\n\nBut I don't accept their right to prevent people copying it, and especially not to prevent them doing what they want with it if they paid for it, including running it elsewhere.\n\nI support and commend anyone risking civil disobedience to fight IP law."}, {"id": 50634940, "au": "load-bearing", "dom": 135, "sr": 15, "sc": 7.32, "ep": 8.06, "bs": 0.0, "d": 5, "age": 5.25, "grav": 35.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 61, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.693, "fa": 0.95, "gp": 0.945, "bl": 0.0, "ds": 0.0, "txt": "I'm from one of those regions, although steam reduced \"piracy\" to pretty low levels precisely because of adequate pricing.\n\nI don't know what to tell you. How much do you make each month? Let's say it's $10k; now imagine if you had to pay $500 (or more) for each game you played. Would you still pay for them or just download from the nearest tracker because, let's be honest, the published wasn't going to see a dime coming from you anyway?\n\nYou'll find money for hardware. It will cost several months of your salary and will be pretty crappy (~nobody in these countries runs 5090s, believe me), but you'll scrape and save, maybe even on food like I did. Because having the computer is essential. Paying for games, not really.\n\nI don't play anything these days newer than about 2004, fwiw. Have licenses for everything but run better \"pirated\" copies with their countless additional bug fixes and compatibility shims."}, {"id": 50629826, "au": "ApolloFortyNine", "dom": 425, "sr": 16, "sc": 7.04, "ep": 7.48, "bs": 0.0, "d": 2, "age": 10.95, "grav": 100.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 40, "k": 4727, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.619, "fa": 1.37, "gp": 1.462, "bl": 0.0, "ds": 0.0, "txt": ">The other side of the argument, which I used a lot, is that people who pirate the games wouldn't buy it anyway. At least it was my case back in the 90s -- nowadays paying on Steam or GoG is way more convenient.\n\nTo a certain extent this is true, if it's get too easy though, more and more people will simply steal it.\n\nLike if I go to a grocery store, I might be fine spending $50 on my cart, but if I also had the option to pay $0 it'd be difficult to continue spending $50.\n\nOr with television where the piracy solutions today are basically Netflix just with every show and movies out there and for less than $5/m. It's hard to compete with that if your target audience knows it exists."}, {"id": 50631594, "au": "breakwaterlabs", "dom": 359, "sr": 17, "sc": 6.77, "ep": 7.22, "bs": 0.0, "d": 6, "age": 9.02, "grav": 75.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 258, "qw": 0, "k": 402, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.975, "fa": 0.28, "gp": 1.225, "bl": 0.0, "ds": 0.0, "txt": "Framing is the key to making a compelling argument, but it can risk falling into deceit.\n\nYoutube could paywall its content, if it wanted to enforce certain terms. But this creates user friction, so they make their site open. This is a voluntary, market-driven decision. They understand that the fundamental operation of a web browser is to ask, \"please send me your content\", receive content, and then render it locally however a user pleases. That's the software contract, that's how the internet has operated since its inception. From the earliest days, it has been \"fetch remote content and render per user prefs\".\n\nIf my preferences are to block images-- which I do, and have done, for decades-- or cookies, or javascript, everyone by and large agrees that is my prerogative. And, in fact, for decades this has been a good idea for performance and security reasons: most sites that load third-party content specifically waive any liability for what those third party sites do. Malware injected into ad network pwned your system? That's between you and the ad provider, not the website on which the iframe resided!\n\nOne has to sweep all of that context under the rug to conclude that I have an obligation to Google's shareholders to consider their profits as I determine whether I want to load javascript that may harm my computer and media that is explicitly subversive to my will.\n\nThere is no "}, {"id": 50628675, "au": "nekusar", "dom": 417, "sr": 18, "sc": 6.59, "ep": 7.03, "bs": 0.0, "d": 1, "age": 12.25, "grav": 119.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 225, "qw": 0, "k": 792, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 2.12, "fa": 0.28, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "I find anybody bandying around \"ethics\" without the exact framework and axioms cited, as a way to throw the word 'ethics' in a discussion as to derail as 'something I dont like'.\n\nAn ethical system that IS cited and has rules is \"the law\". It is an ethical system. Not a great one. Lots of catch-22's and other gotchas, including precedent (court direction of interpretation).\n\nBut when companies talk about ethics, I find them extremely duplicitous. It was Milton Friedman's own comments that companies are ONLY beholden to increase shareholder value. When that's the ethical axiom, yeah, I do not trust ANYTHING they do at any scale. I'm not sure why others do either.\n\nAnd we see this leaking everywhere, especially in the tech sphere with 'felony contempt of business' by sidestepping or disabling DRM. Hardware supposedly \"sold\" is just fraudulent ill-defined rentals. Games are \"sold\" that have absolutely no resell rights or standard first-sale doctrine; again, shitty rentals. And due to federal courts being packed with a bunch of non-technical geriatric idiots, we got rulings like the Bnetd banning due to DMCA, rather than repealing the DMCA as a violation of 1fa.\n\nSo we wanna REALLY talk about ethics? Nah. Its just used to shut individuals up. The corporates dont give one fuck, except for their bottom line.\n\nAnd, nice banned Microsoft/Github link. They shouldn't have offended the co"}, {"id": 50629892, "au": "_fat_santa", "dom": 451, "sr": 19, "sc": 6.58, "ep": 7.02, "bs": 0.0, "d": 1, "age": 10.89, "grav": 99.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 31, "k": 10133, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.551, "fa": 0.42, "gp": 1.501, "bl": 0.0, "ds": 0.0, "txt": ">  Think of Rockstar what you will. 1000s of people have worked on this game for over 10 years. They want to continue to do so and in the process earn a decent living.\n\nBased on what I heard, Rockstar basically bet the farm on GTA VI and now having played it, I sincerely hope they make their investment back and a healthy profit so the next GTA will get greenlit.\n\nAs much as people hate GTA V for how they handled online over the years, you have to be honest and realize that the reason GTA VI is anywhere near it's current scale is precisely because they made so much money off the previous one and could justify sinking billions into development."}, {"id": 50628292, "au": "ndriscoll", "dom": 564, "sr": 20, "sc": 6.46, "ep": 6.75, "bs": 0.0, "d": 5, "age": 12.64, "grav": 125.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 321, "qw": 13, "k": 5435, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.795, "fa": 0.42, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "> law is just trying to capture our understanding of ethics and formalizing it\n\nThis is an extremely naive view of the law. There is no world where my understanding of ethics says that we should grant monopolies on our culture for multiple human lifetimes, locking out our descendants from their own heritage. Frankly, I'd consider someone pushing that position to be simply evil. Likewise with the decades long war on drug users. Or that we can just randomly go start wars with other countries without an extremely broad consensus (e.g. 90+% majority in a direct vote on the topic). There are a great many obvious evils that the law evidently allows for or even demands.\n\nPeople feel \"entitled\" to do these things because you were never entitled to tell them not to, and the social contract there has been long since turned into a complete farce. Kids don't entertain the attempt to gaslight them for even a moment. Good for them.\n\nThe fact that you were never entitled to tell them not to is related to why it's so hard to police: what they do has no effect on others, so it's easy for them to keep it on the down low if they want, and you'll never learn about it. There is no victim to complain.\n\nAdditionally, as far as I know these projects are generally taking an approach similar to WINE: they're just implementing platform libraries necessary for commodity PCs to run software that's designed"}, {"id": 50631187, "au": "__s", "dom": 197, "sr": 21, "sc": 6.34, "ep": 6.34, "bs": 0.0, "d": 4, "age": 9.51, "grav": 81.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 5741, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.804, "fa": 0.28, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "Ship is based on decomp, not recomp or emulation\n\nDecomp vs recomp is easiest to understand by undefined behavior not being portable in a decomp, whereas recomp is compiling MIPS to C to be bug compatible. Decomp C is meant to look like original source (with given compiler + arch, produce same binary) so is easier to work with"}, {"id": 50632703, "au": "maxglute", "dom": 506, "sr": 22, "sc": 6.32, "ep": 6.76, "bs": 0.0, "d": 1, "age": 7.79, "grav": 60.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 209, "qw": 3, "k": 3068, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.653, "fa": 0.68, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": ">offer for free.\n\nService problem blah blah.\n\nYes, games should be copied because we can, because merely doing so changes material conditions of how DRM and exclusivity are evaluated. Who cares about moral entitlement, it's about consumers gaining bargaining power / access / options.\n\nSoftware being trivially replicated like all other media should be celebrated, especially considering RAGE moat was under lock and key and LBH, no other developer has resources to replicate, post decomp there's going to be golden references one slop prompt away. Hopefully now rockstar will do day1 PC launches and incentivized to license engine tech. Either way breaking moats / proliferating tech / increasing access is net good for consumers... and non consumers.\n\nLBH rockstar gameplay pretty mid, if they get the shit squeezed out of them have have to go free to play and only make 100s of millions per year like Mihoyo then... ok? Oh no they lose double dip pricing power... thumbs up.\n\nSame with Nintendo charging $80 on gated $600 Zelda machines, making it inaccessible to majority of world unlike every other media. Wiping DRMs and forcing gaming companies to price without excludability/wall garden hardware is not morality, it's just new material reality. If artists in all domains have to adapt, why shouldn't billion dollar software/video game developers."}, {"id": 50629404, "au": "piokoch", "dom": 244, "sr": 23, "sc": 6.23, "ep": 6.23, "bs": 0.0, "d": 0, "age": 11.4, "grav": 106.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3832, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.822, "fa": 0.0, "gp": 1.344, "bl": 0.0, "ds": 0.0, "txt": "This reminds me a (very) old story about some Linux networking application that has become pretty popular, at some moment it turned out it had a bug, but the maintainer was not responding requests to fix it. After some investigation, contacting people (land-line telephones only times!) a friend of the maintainer was found and he said that maintainer had bad grades at school so his mom ban him access to the computer.\n\nFinally, when quite serious people called the mom, fix was delivered. Good times. Not sure if this is a true story or an urban legend, though."}, {"id": 50631917, "au": "judah", "dom": 321, "sr": 24, "sc": 6.08, "ep": 6.74, "bs": 0.0, "d": 4, "age": 8.64, "grav": 70.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 2932, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 2.105, "fa": 0.0, "gp": 1.239, "bl": 0.0, "ds": 0.0, "txt": "\"An eye for an eye\" is a good law, a quote from the Hebrew Bible, was to limit retributive justice. You can't kill someone for stealing your cattle.\n\nAnd it was not vigilantism either. It was instructing judicial courts to require from the guilty payment approximate to the amount of damages caused.\n\nAn eye for an eye is a good law, especially in the ancient near east where capital punishment was enforced for even trivial matters. The term Draconian refers to a real law code from ~600 BC where death was the punishment for even petty theft.\n\nModern minds have misunderstood this passage to mean everyone was poking each others' eyes out."}, {"id": 50636308, "au": "sensanaty", "dom": 134, "sr": 25, "sc": 6.07, "ep": 8.02, "bs": 0.85, "d": 5, "age": 3.22, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 5066, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.866, "fa": 0.68, "gp": 1.169, "bl": 0.32, "ds": 0.0, "txt": "Hardware is a one-time investment, buying a game like GTA 6 is EIGHTY Euros at the cheapest. If you're on a salary of 200EUR a month, you can justify saving up for a few months or even years to buy a console or dusty old PC, but can you really justify spending almost half of your monthly paycheck on a single game? Even if it's the greatest game to ever grace God's green earth, that kind of money is simply ludicrous for an entertainment product.\n\nAnd the PS2 was what, 300EUR from what I remember? That's a lot of dough for sure, but you blow past that budget with only a handful of MSRP games (especially back then when regional pricing wasn't a thing)."}, {"id": 50629452, "au": "max_streese", "dom": 423, "sr": 26, "sc": 6.05, "ep": 6.71, "bs": 0.0, "d": 0, "age": 11.36, "grav": 106.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 189, "qw": 0, "k": 73, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.439, "fa": 0.34, "gp": 1.627, "bl": 0.0, "ds": 0.0, "txt": "I am a bit flabbergasted by the discussion here. Think of Rockstar what you will. 1000s of people have worked on this game for over 10 years. They want to continue to do so and in the process earn a decent living.\n\nBut no matter, let's copy the game because... We can? Companies are evil? AI labs assimilated all of digital human knowledge?\n\nDoesn't sit right with me. You can't at the same time blame the AI labs for their unattributed assimilation of human knowledge without paying, while then paying those same AI labs for tokens in order to reverse engineer something that lots of people have spent lots of time creating.\n\nIn my view bring on the takedowns and issue lawsuits. This reverse engineering is not morally right. If you got issues with companies and AI labs good! Demonstrate, boycott, sue, call your representative, whatever. But don't pretend to hate the AI labs for stealing while you do the same and lead us to a future where human creation will be devalued and projects of this scope no longer viable because AI will be used to simply reverse engineer and offer for free."}, {"id": 50630373, "au": "llm_nerd", "dom": 174, "sr": 27, "sc": 5.93, "ep": 5.93, "bs": 0.0, "d": 2, "age": 10.38, "grav": 92.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 4946, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 2.104, "fa": 0.0, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "Circumventing \"digital locks\" is already illegal courtesy of the DMCA. If the aggrieved parties put pressure on the politicians they bought and paid for, I guarantee the major AI platforms would ban any such use overnight.\n\nI am honestly extremely surprised they've endured the possible risks allowing it so far. Expect congressional hearings full of ridiculous dog and pony displays and hysterical reactions to be coming soon.\n\nNo one should misread what I'm saying here. I abhor the restrictions we already live under, but it's a marvel that any of this was \"allowed\" at all. In the near future I suspect such work will happen only through black market Kimi K4 and GLM 6.2 models."}, {"id": 50625614, "au": "xdennis", "dom": 582, "sr": 28, "sc": 5.91, "ep": 6.57, "bs": 0.0, "d": 1, "age": 17.64, "grav": 212.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 47, "k": 2775, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.836, "fa": 0.42, "gp": 0.733, "bl": 0.0, "ds": 0.0, "txt": "I don't feel any sympathy because it doesn't go both ways.\n\nDid Anthropic care when it pirated millions of books to train its AI? It didn't care because it could easily pay the fine with its billion (now trillion) dollar valuation.\n\nDid EA care when it fired the developers of Battlefield 6 despite the game being successful?\n\nDid OpenAI explore the ethical questions of using millions of GitHub repos to train its AI? If asked, millions of developers would have denied permission. But it didn't care because it moved faster than people trying to create laws to assert ownership over their code.\n\n---\n\nWe're heading toward a depressing future where people will be replaced and the best possible future is that they'll allow us to live on UBI while holding no power.\n\nSo why should I give a hoot about the ethics of stealing a game that's made 3+ billion dollars in 24 hours."}, {"id": 50624960, "au": "throwaway7356", "dom": 560, "sr": 29, "sc": 5.75, "ep": 6.63, "bs": 0.0, "d": 1, "age": 18.96, "grav": 239.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 29, "k": 342, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.818, "fa": 0.42, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": "> Previously, crime was done with kids as meat shields, but there, it was still fairly trivial to trace back which adult actually was behind it and punish them accordingly.\n\nReverse engineering is not a crime.\n\nWe are not talking about Microsoft's copies of office software crashing intentionally when use with a Microsoft competitor's software to sabotage competition here, and nobody was punished for that either: the financial win from defending and furthering the monopoly is much larger than any symbolic fine paid much later.\n\nAlso note how Microsoft products are still not banned from Github despite that criminal backstory."}, {"id": 50629709, "au": "qingcharles", "dom": 515, "sr": 30, "sc": 5.71, "ep": 7.03, "bs": 0.0, "d": 1, "age": 11.1, "grav": 102.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 14, "k": 12423, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.191, "fa": 1.1, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "> They want to continue to do so and in the process earn a decent living.\n\nHate to say it, but there won't be a GTA7. If it takes 10 years to develop a whole version of GTA then it's too long. 3D engines as we know them with their vertices and polygons might not even exist in 10 years, the way things are going.\n\nWe're moving towards a point where everyone will have the ability to make whatever game they want. Things are going to become very personalized."}, {"id": 50625916, "au": "Arn_Thor", "dom": 217, "sr": 31, "sc": 5.69, "ep": 6.13, "bs": 0.0, "d": 2, "age": 16.94, "grav": 199.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 1607, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.288, "fa": 0.68, "gp": 0.801, "bl": 0.0, "ds": 0.0, "txt": "I expected for 30fps to feel severely limiting, but I actually don't mind. Steering vehicles and people is like turning a battleship, but I'm used to that from GTA. The blessing of low expectations I guess. The point is, I don't mind the 30 fps at all."}, {"id": 50629307, "au": "bayindirh", "dom": 403, "sr": 32, "sc": 5.58, "ep": 6.02, "bs": 0.0, "d": 1, "age": 11.53, "grav": 108.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 46, "k": 22695, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.389, "fa": 0.42, "gp": 1.077, "bl": 0.0, "ds": 0.0, "txt": "Disclaimer: I personally live by \"The Golden Rule\", and nothing can make me break it, but pragmatically, below is the reality of life:\n\n> So why wouldn't that (lack of ethical) standard also apply here to us?\n\nBecause you, as in a single person has no leverage against them. I love this example from my mom:\n\n> If you owe a bank $1000, bank will make your life hell to get that money back. Now, if you owe them $1,000,000 you'll be welcomed on a red carpet when you arrive to the branch.\n\nIf the somebody RE'ing the game was a big corp or someone powerful, they'll either kindly ask to stop, maybe offer some money to delay the RE, or offer a job to keep them busy and add them to their team, even if for a short time. However, person doing this is a high school student, so they feel it's appropriate to kick the child.\n\nPersonally which makes me doubly angry, because I don't believe in age, and treating talented people like rags because they are \"smol\" and makes my blood boil. I know, because I went through the same cycle."}, {"id": 50637560, "au": "somenameforme", "dom": 50, "sr": 33, "sc": 5.54, "ep": 6.13, "bs": 0.0, "d": 4, "age": 0.35, "grav": 4.7, "surf": 23.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 15941, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.027, "fa": 0.95, "gp": 0.694, "bl": 0.0, "ds": 0.0, "txt": "It's obviously not the developers' game. It's Take Two's. The developers will get relatively nothing back from the game. For GTA V, which would go on to make something like $10 billion in profit, they got $5k and a video game console on top of their ~$100k salaries. The profit sharing deal there was something like 50% to Take Two and 50% to Sam/Dan Houser (founders of Rockstar games). The devs get a share of profit that cleanly rounds to 0."}, {"id": 50622658, "au": "gnabgib", "dom": 184, "sr": 34, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 0, "age": 24.49, "grav": 364.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 17, "qw": 0, "k": 26203, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://news.ycombinator.com/item?id=50595168"], "ig": 0.429, "fa": 0.95, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "You can find this being discussed in the HN post on the repo (236 points, 2 days ago, 203 comments) https://news.ycombinator.com/item?id=50595168"}, {"id": 50631284, "au": "paxy", "dom": 456, "sr": 35, "sc": 5.07, "ep": 6.18, "bs": 0.0, "d": 5, "age": 9.4, "grav": 79.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3707, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.824, "fa": 0.95, "gp": 1.056, "bl": 0.0, "ds": 0.0, "txt": "If you invested $2 billion in the stock market the day GTA 5 released you'd have $11 billion today.\n\nIf you instead spent that $2 billion developing a game for 13 years and then got a $5 billion return I don't think you'd consider that a success."}, {"id": 50631046, "au": "kodt", "dom": 91, "sr": 36, "sc": 5.05, "ep": 6.3, "bs": 0.0, "d": 2, "age": 9.64, "grav": 82.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 836, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.449, "fa": 0.68, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "The progress is still very impressive. When in history has a console exclusive game been bootable on PC within a week of release?\n\nBloodborne, a console exclusive game that is over 10 years old only became playable on PC via emulation in the last 2 years, and a PC port only became playable in the last couple months."}, {"id": 50630189, "au": "Sohcahtoa82", "dom": 436, "sr": 37, "sc": 5.02, "ep": 6.57, "bs": 0.0, "d": 2, "age": 10.56, "grav": 95.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 11248, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.614, "fa": 0.34, "gp": 1.243, "bl": 0.0, "ds": 0.0, "txt": "Same.\n\nIn the 90s and 00s (especially early 00s), I pirated games all the time, especially single player games.\n\nBut now?  I don't think I've pirated a game in like 15 years.  Some of that has to do with the fact that I'm actually making money now, but the simple fact is, it's just easier.\n\nMaybe I'm just wearing a tinfoil hat, but I truly believe that Rock Star releases the PC versions of their games later so they can double-dip: They know there are lots of people that have both a console and a PC, that the PC version will look better, and there are people in this cohort that will buy the game twice.  Also, once the game is released on PC, it becomes trivial to pirate.  Even the best DRM is now getting broken in a matter of hours or days, not weeks or months.\n\nIf this Recomp actually works, we'll probably see the official PC release in 3 months, rather than 1+ year."}, {"id": 50629567, "au": "mjburgess", "dom": 486, "sr": 38, "sc": 5.01, "ep": 6.11, "bs": 0.0, "d": 1, "age": 11.24, "grav": 104.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 12626, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.992, "fa": 0.0, "gp": 0.987, "bl": 0.0, "ds": 0.0, "txt": "There's a war between consumer rights, \"corporate rights\" and public rights. Consumers won to be able to record TV shows to VHS tapes; won to be able to resell and share books; and so on. From which shop can I loan GTA? As a child I regularly went to blockbuster's to loan a video game.\n\nIn the digital era, consumers and the public have lost battle-after-battle for two decades. This here isn't about taking an ethical step narrowly construed, its about forcing a defeat. For many, it's about a narrowly \"unethical action\" taken as an act of civil disobedience at the corporate control of media."}, {"id": 50625171, "au": "hypfer", "dom": 580, "sr": 39, "sc": 4.9, "ep": 5.56, "bs": 0.0, "d": 2, "age": 18.58, "grav": 231.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.645, "fa": 0.28, "gp": 0.622, "bl": 0.0, "ds": 0.0, "txt": "What is different now is that the NESticle came (if I google correctly) more than a decade after launch, whereas the current efforts happen _at_ launch or rather even _before_ launch.\n\nThe previous way of things happening kinda worked, because at the point when emulation and recompilation and all happened, pretty much all commercial interest was already gone.\nThat is no longer the case, and that is the interesting part here.\n\n___\n\nIf you think about it, most devs probably _want_ their stuff preserved but are locked into contracts that might prevent that, so, emulation like it worked previously is actually in the interests of the creator.\n\nBut, as said, at that point the commercial relevance is no longer there, so their bigger interest of getting food on the table (+ continuing to have a job) is already resolved."}, {"id": 50624998, "au": "hypfer", "dom": 561, "sr": 40, "sc": 4.78, "ep": 5.89, "bs": 0.0, "d": 2, "age": 18.9, "grav": 237.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 5, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.311, "fa": 0.42, "gp": 1.11, "bl": 0.0, "ds": 0.0, "txt": "> Reverse engineering is not a crime.\n\nYeah but come on let's be real here. The purpose of this reverse engineering is to bypass a digital lock and do something that breaks the business model of the entity of the thing you're breaking free.\n\nWithout nuance, my sentence would also apply to something like people unclouding garage door openers by getting rid of MyQ, but there, the actual main product is the garage door opener, and the rest is just rent seeking.\n\nThat does not apply here.\n\nI'm looking forward as much as anyone else does to playing GTA 6 on my PC without paying for it, but let's not lie to ourselves here.\n\nAnd let's not throw genuine legit RE efforts under the bus as a conceptual shield. They're too important for that as that we could taint them like this."}, {"id": 50631131, "au": "Conscat", "dom": 238, "sr": 41, "sc": 4.66, "ep": 5.54, "bs": 0.0, "d": 0, "age": 9.56, "grav": 81.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1081, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.742, "fa": 0.0, "gp": 0.999, "bl": 0.0, "ds": 0.0, "txt": "My boyfriend begged me for a whole day to contribute to this repository. I finally cloned it in front of him and compiled on Linux with libwine and clang-cl using Claude. Only one line outside the build system had to change. I was willing to contribute that fix, but he immediately became concerned it could violate my NDA and begged me NOT to. I guess now I have a (rare-ish?) copy of that repo on my machine."}, {"id": 50631272, "au": "rafterydj", "dom": 241, "sr": 42, "sc": 4.51, "ep": 5.61, "bs": 0.0, "d": 0, "age": 9.41, "grav": 80.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 582, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.697, "fa": 0.0, "gp": 1.121, "bl": 0.0, "ds": 0.0, "txt": "Honestly I kind of sympathize with Rockstar's programmers here. Obviously this was thought about internally months ago, but the plans for release were settled before that, so right now I imagine there is a lot of internal strife centered around getting the official PC version ready in a timely manner. Probably related to a lot of their GTA Online work, too. And I can only imagine there's folks in the mix who are wondering \"lazy, hackers did this in a week\". Would not want to be in that meeting room."}, {"id": 50629646, "au": "steve_adams_86", "dom": 489, "sr": 43, "sc": 4.43, "ep": 5.97, "bs": 0.0, "d": 2, "age": 11.16, "grav": 103.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.576, "fa": 0.28, "gp": 1.01, "bl": 0.0, "ds": 0.0, "txt": "It doesn't matter how much it was hyped or what platform it's on, though.\n\nIf I put out a really nice looking sandwich in my shop, that doesn't make it more fair to steal it from me compared to if I had a less appealing sandwich put out.\n\nThis game is a totally elective pursuit, too. At least with food there's an innate need to have it. GTA is just nice to have if you can afford it.\n\nI'm not one to protect massive corporations — I think too many of them are actually indefensible, and it's a flagrant symptom of economic and political corruption. Yet in this case... I don't need to play GTA. It really did take over a decade and thousands of people's efforts. Have you seen it? I was absolutely stunned by the detail. This is a tremendous piece of work to put together. It's actually worth something. I don't think Rockstar is at fault for hyping their incredible work. I wouldn't steal this.\n\nI know you said \"an argument\", and not \"my argument\", so I'm not directing this at you specifically."}, {"id": 50629553, "au": "Jordan-117", "dom": 488, "sr": 44, "sc": 4.34, "ep": 5.88, "bs": 0.0, "d": 1, "age": 11.26, "grav": 104.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 1387, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.695, "fa": 0.0, "gp": 1.307, "bl": 0.0, "ds": 0.0, "txt": "An argument I've seen is that the usual baseline desire for a free game is being turbocharged by Rockstar's refusal to release concurrently on PC or even provide a launch date, basically double-dipping console sales. The game also does not perform ideally on consoles. Hype a title to this extent while limiting access to expensive exclusive platforms and don't be surprised people will try to pirate it. AI decompilation is just a means to that end."}, {"id": 50628878, "au": "Mawr", "dom": 230, "sr": 45, "sc": 4.34, "ep": 5.58, "bs": 0.0, "d": 3, "age": 12.03, "grav": 116.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1592, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.165, "fa": 0.62, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "Movies are not interactive, so it doesn't matter. It also doesn't matter much for static games.\n\nHowever, when the visuals can rapidly change based on player input (e.g. in first person games, like GTA), the latency becomes very noticeable.\n\n30 FPS is terrible. Even 60 is barely acceptable nowadays."}, {"id": 50628100, "au": "TeMPOraL", "dom": 163, "sr": 46, "sc": 4.31, "ep": 4.94, "bs": 0.27, "d": 3, "age": 12.91, "grav": 129.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.708, "fa": 0.0, "gp": 0.64, "bl": 0.1, "ds": 0.0, "txt": "You may be right. My fear is that they'll just bundle them into the lowest tier of the \"cyber certification\" programs they're already running. That alone is enough to cut out normal users.\n\n(Yes, I tried to apply for the lowest level, to stop getting refusals when asking IoT/Android questions, but it turns out I need to prove I'm a security researcher for that - which I'm not. I'm just a tech person who wants devices I own to work the way I want them to.)"}, {"id": 50631126, "au": "PUSH_AX", "dom": 92, "sr": 47, "sc": 4.19, "ep": 5.36, "bs": 0.0, "d": 3, "age": 9.57, "grav": 82.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1479, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.547, "fa": 0.34, "gp": 0.524, "bl": 0.0, "ds": 0.0, "txt": "It's not bootable, you can go into the menu or a cutscene at like 5fps and completely broken, not to mention very little human expertise has been applied to this, if you go down the rabbit hole people are literally prompting claude \"make it work\" then posting videos of complete jank.\n\nSorry, I'll concede it's subjective at most, but I'm not impressed. Let me know when it has parity with the unreleased PC version, then we'll talk about being impressed."}, {"id": 50628510, "au": "jjice", "dom": 221, "sr": 48, "sc": 4.19, "ep": 5.58, "bs": 0.0, "d": 3, "age": 12.42, "grav": 122.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 7509, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.059, "fa": 0.68, "gp": 0.795, "bl": 0.0, "ds": 0.0, "txt": "The PS5 Pro is isn't a cheap machine, and the game is struggling to hold 30 FPS, when the modern standard people want is 60 FPS. I believe it can hit that on the Xbox."}, {"id": 50633247, "au": "Zak", "dom": 306, "sr": 49, "sc": 4.09, "ep": 5.63, "bs": 0.0, "d": 4, "age": 7.17, "grav": 54.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 19, "k": 16907, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.283, "fa": 0.42, "gp": 0.981, "bl": 0.0, "ds": 0.0, "txt": "> Then they actually lose money because the people who really wanted it on PC already got it without paying.\n\nI'm operating under the assumption that those people got it by buying the console version and porting it with a decompile/recompile.\n\nIf they're also obtaining their copy by piracy, that's a separate issue. I see piracy as a grey area; pirating something you would have purchased deprives its creator of potential income, but pirating something you were never going to buy does not."}, {"id": 50629483, "au": "mschuster91", "dom": 154, "sr": 50, "sc": 3.94, "ep": 5.26, "bs": 0.0, "d": 1, "age": 11.33, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 28, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.497, "fa": 0.42, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "> I imagine that once this succeeds a lot of people who would have purchased the game on Steam if it was available are going to pirate the ported version instead.\n\n14 year old me would certainly do so, but 35 year old me... nah, I'd buy it - alone because I really do not trust the clanker peddlers to not ship some sort of plausibly deniable backdoor / malware. Even if the github may be \"clean\", it does not say anything about the binaries, and there aren't many targets for someone willing to deploy a credential stealer that are more attractive than any GTA6 hack."}, {"id": 50628690, "au": "inanutshellus", "dom": 254, "sr": 51, "sc": 3.88, "ep": 4.76, "bs": 0.0, "d": 2, "age": 12.23, "grav": 119.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 2938, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 1.051, "bl": 0.0, "ds": 0.0, "txt": "To your point, the \"Friedman Doctrine\"[1] comes to mind... it \"holds that the social responsibility of business is to increase its profits.\"\n\nThe doctrine allows for certain unique behavior. Under it, it's excusably the job of a corporation to block laws -- regardless of their morality -- that harm shareholder value.\n\nThus the citizenry's job is to keep corporations in check with laws, and amoral corporations job to prevent them.\n\n  [1] https://en.wikipedia.org/wiki/Friedman_doctrine"}, {"id": 50630452, "au": "steve_adams_86", "dom": 491, "sr": 52, "sc": 3.84, "ep": 5.38, "bs": 0.0, "d": 4, "age": 10.3, "grav": 91.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 247, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.792, "fa": 0.0, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "I agree, the analogy doesn't work well, and in retrospect I shouldn't have used it.\n\nThe only slice which does work is that it represents a lost commercial opportunity based upon my labour and, to a lesser extent, IP. We have no way of verifying that a pirated copy could have otherwise been purchased. That's a tough nut to crack, and not possible to do so here.\n\nPerhaps the most incompatible portion is that it's totally elective. If Rockstar chooses to limit the platform compatibility, that isn't license to steal it. I don't know where their responsibility in that lies: how easy is it to make a PC version they can afford to support? What are their actual profits on this game? If it made sense to release on PC, wouldn't they? Is this due to an agreement with Sony to reduce publishing fees or something?\n\nThese days it seems as though getting a game onto any platform is genuinely easier than ever, so I'm not sure what would cause them to delay. I suspect it's at least in part because pirating on PC will be far easier. That could genuinely reduce their commercial opportunities. If that's the case, I don't like it but I understand the hesitation.\n\nYou're also right that it's repetitive discourse. Digital property is very strange in that yes, it's ~free to duplicate, so why wouldn't we share it freely. Yet it takes real money and effort to create in the first place. I don't have my o"}, {"id": 50629416, "au": "gambiting", "dom": 117, "sr": 53, "sc": 3.77, "ep": 5.31, "bs": 0.0, "d": 5, "age": 11.39, "grav": 106.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 32097, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.007, "fa": 0.68, "gp": 0.695, "bl": 0.0, "ds": 0.0, "txt": "Numbers of what? Where from? Using anecdotes, I can say that I'm literally the only person in my circle of friends who has played the single player story of GTA5, everyone else owns it and only plays Online, it's basically an MMO within those circles - the fact that it even has a single player campaign is a fact I'm not sure they are even aware of. I wouldn't be surprised if Rockstar said that 230 out of those 235 million people played Online."}, {"id": 50629827, "au": "whamlastxmas", "dom": 514, "sr": 54, "sc": 3.76, "ep": 5.3, "bs": 0.0, "d": 1, "age": 10.95, "grav": 100.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 2818, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.886, "fa": 0.0, "gp": 0.602, "bl": 0.0, "ds": 0.0, "txt": "Rockstar made a billion dollars in a day and several billions over only a few days. Their employees' jobs are not at risk aside from greed of shareholders. Those thousands of employees are also not meaningfully profiting from sales and Rockstar's success, and like every employer I am positive Rockstar pays as little as humanly possible to retain the talent they need to make their profits. I guarantee you Rockstar still pays worse than similar roles outside the gaming industry."}, {"id": 50633441, "au": "alpaca128", "dom": 130, "sr": 55, "sc": 3.73, "ep": 5.27, "bs": 0.0, "d": 3, "age": 6.97, "grav": 51.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 20, "k": 8747, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.376, "fa": 0.42, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "In the case of the PSP it was also a much better experience to pirate games. Loading times were halved and the battery lasted longer without the UMD drive. So even when buying games legally a custom firmware was a big upgrade.\n\n> it was ridiculously easy to just copy games to the memory stick and play once the battery hack was released\n\nAnd years later one only had to open a manipulated file in the image viewer. I imagine it would have looked very differently if it was already common to ship automatic firmware updates back then."}, {"id": 50625370, "au": "wongarsu", "dom": 573, "sr": 56, "sc": 3.73, "ep": 5.08, "bs": 0.0, "d": 3, "age": 18.14, "grav": 222.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 33666, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.675, "fa": 0.0, "gp": 0.791, "bl": 0.0, "ds": 0.0, "txt": "Roughly speaking, there are two overlapping purposes behind the reverse engineering effort:\n\na) to make the game compatible with additional hard- and software it was (in the only versions sold) not intended for\n\nb) to pirate it\n\nDifferent people put different emphasis on the two. There is a sizable audience who cares primarily for b), but there is also a very sizable audience who cares primarily for a). I don't see anything morally or legally reprehensible about a), it's only b) that's bad\n\na) happens to also break an exclusivity deal Rockstar likely signed, but that's not something their customers have to care about. If someone made a controller that only worked with the XBox and I found a way to use it on a linux PC we'd all be cheering for that, regardless of what deal the controller manufacturer has with Microsoft. The only issue is if I then go and steal that controller from the store because I can bypass a license check"}, {"id": 50632324, "au": "maxglute", "dom": 345, "sr": 57, "sc": 3.73, "ep": 5.07, "bs": 0.0, "d": 4, "age": 8.2, "grav": 65.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3068, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.675, "bl": 0.0, "ds": 0.0, "txt": "Said licensing terms and monetization strategy going have to readapt now that games easy to copy like other media formats. Same with relying on 2B engine moat, reality is GTA6 going to get decomped and the most advanced RAGE tech going to proliferate to every slop coder and a lot of GTA special sauce that cost $$$ is going to be public. TBH that's great news."}, {"id": 50630126, "au": "sensanaty", "dom": 132, "sr": 58, "sc": 3.73, "ep": 5.06, "bs": 0.0, "d": 3, "age": 10.63, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 5066, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.708, "fa": 0.0, "gp": 0.718, "bl": 0.0, "ds": 0.0, "txt": "I'm a Serb and grew up in Indonesia, both countries where warez was (still is in Indonesia) so ubiquitous as to be sold in brick and mortar stores on burned CDs for very small sums (usually just the cost of the CD + a small convenience fee).\n\nI guarantee you if piracy wasn't an option (especially back in the pre-Steam and pre-regional pricing days), people simply wouldn't have played those games, for the simple reason that the majority of the people pirating couldn't have afforded it to begin with."}, {"id": 50630280, "au": "pornel", "dom": 182, "sr": 59, "sc": 3.73, "ep": 4.99, "bs": 0.0, "d": 1, "age": 10.47, "grav": 93.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 24506, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.711, "fa": 0.0, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "I'm worried that an overreaction profit-disrupting stunts like this could get reverse engineering banned (even more than DMCA's fig leaf for DRM). That would be a huge loss of freedom.\n\nIn the short term the two US AI behemoths will likely add \"Don't crack GTA\" to their system prompt and keep scaremongering that Chinese models haven't."}, {"id": 50627791, "au": "maskofthesea7", "dom": 196, "sr": 60, "sc": 3.73, "ep": 7.4, "bs": 2.52, "d": 3, "age": 13.32, "grav": 136.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 7, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.312, "fa": 1.1, "gp": 0.812, "bl": 0.95, "ds": 0.0, "txt": "No, Hookshot/Longshot are recompiles of the 2026 remake of OoT that released a little over a week ago for Nintendo Switch 2. Ship of Harkinian is for the original N64 game, but I'm not sure if that's an emulator or a recompile. I know nothing about their authors.\n\n>15 year old kid interested in N64 game\nA lot of kids are! Many of the old classics are still popular. I grew up with the Nintendo DS remakes of Super Mario 64, OoT, etc., and today's kids grow up with remakes for the Nintendo Switch."}, {"id": 50630131, "au": "FLeXMurphy", "dom": 102, "sr": 61, "sc": 3.73, "ep": 4.87, "bs": 0.0, "d": 1, "age": 10.63, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 34, "k": 140, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.398, "fa": 0.42, "gp": 0.268, "bl": 0.0, "ds": 0.0, "txt": "> To think that only a few years ago I was trying to reverse engineer Commandos (1998) which is a much much smaller game, originally for Windows, without any encryption/anti-copy and I got nowhere near a 2% of it being done.\n\nWere you using the Ghidra MCP or how did you go about it? The file formats for it were already documented since the modding tools for C1 and C2 are plenty, if I remember right, people already made web-based versions of it. So _enough_ prior work should exist."}, {"id": 50630130, "au": "Zvez", "dom": 21, "sr": 62, "sc": 3.73, "ep": 4.82, "bs": 0.0, "d": 1, "age": 10.63, "grav": 96.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 247, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.628, "fa": 0.0, "gp": 0.684, "bl": 0.0, "ds": 0.0, "txt": "By this logic you can justify pretty much everything\nImmigration laws don't let me in legally -> going by boat it is.\nImport of these goods are forbiddingly taxed -> contraband is justified\nI need a license to own a gun? -> black market can sell it to me just fine\n\nProvider of goods should have agency in decision who and how can consume their goods (obviously the extents of such decisions are defined by laws)"}, {"id": 50634111, "au": "greycol", "dom": 14, "sr": 63, "sc": 3.73, "ep": 4.72, "bs": 0.0, "d": 4, "age": 6.33, "grav": 45.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 215, "qw": 0, "k": 734, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.776, "fa": 0.0, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "This feels like asking \"when you've got cargo to take through the wilderness when do you notice your train is not a car?\" The entire structure of the console shapes how you use it. When you are just wanting to move a lot of cargo it's fine and you don't even consider taking the train home to your house, you thoughtlessly pay for associated hotel bills or taxis. The comparisons you make between them become outlandish, 'your car has to stick to the highways to get through that wilderness and carries less cargo, how is it different than train tracks?'.\n\nYou wouldn't be having your movies deleted by sony because you'd be using a cheaper third party store. You wouldn't worry about being machine id banned from a game when you buy a second hand console. You wouldn't be paying the console markup because you'd install linux and play the pc version of the game. All outlandish things to consider while in the walled garden and all much harder to do because of the licensing. When the landscape and paths inside the garden seem perfect for a garden why would you not have planted one let alone why would you rip out the flowers.\n\nWhen was the last time you noticed an airplane didn't drop you off at your door?"}, {"id": 50637415, "au": "denkmoon", "dom": 2, "sr": 64, "sc": 3.73, "ep": 4.6, "bs": 0.0, "d": 1, "age": 0.73, "grav": 6.1, "surf": 18.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4586, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.714, "fa": 0.95, "gp": 0.148, "bl": 0.0, "ds": 0.0, "txt": "30fps is unplayable and unacceptable. Don't really care about the rest, I've bought consoles for 1 or 2 exclusives before, would do it again, but not for 30fps (in the best case, it can go sub 30fps)."}, {"id": 50631902, "au": "s08148692", "dom": 242, "sr": 65, "sc": 3.73, "ep": 4.58, "bs": 0.0, "d": 1, "age": 8.65, "grav": 70.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 228, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.698, "fa": 0.0, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "\"Tony Stark was able to build this in a cave! With a box of scraps!\"...\n\n\"teenage layperson was able to build this in a bedroom! With a claude subscription!\"\n\nHonestly as a programmer the argument works. Yes - there's a bit more to it when you're the one building, but the push back I've seen from real programmers who almost refuse to adopt the powers of LLMs and code harnesses is crazy. We've seen how much faster we can go, and those who won't or can't aren't going to be in the industry much longer\n\nNone of our decades of coding experience matters for much now. We as a industry need to accept that, let our ego go, and get on with it in the brave new world we find ourselves in"}, {"id": 50637341, "au": "smuhakg", "dom": 22, "sr": 66, "sc": 3.73, "ep": 4.54, "bs": 0.0, "d": 2, "age": 0.99, "grav": 7.2, "surf": 13.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 121, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.794, "fa": 0.0, "gp": 0.225, "bl": 0.0, "ds": 0.0, "txt": "It's not even illegal to reverse engineer and recompile GTA 6. Copyright only applies to the game assets themselves like textures, visuals, or writing as expressions of an idea. Game mechanics themselves are uncopyrightable and are intended to be covered by patents.\n\nMicrosoft, makers of Xbox, is only a trillion dollar company because they reverse engineered Lotus 1-2-3 and made a clone called Excel in which the functionality was identical to preserve compatibility."}, {"id": 50629889, "au": "anon_shill", "dom": 490, "sr": 67, "sc": 3.73, "ep": 4.47, "bs": 0.0, "d": 3, "age": 10.89, "grav": 99.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 18, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.665, "fa": 0.95, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Sandwich analogy falls apart fast. Nobody stole the sandwich, they copied your sandwich to be compatible with their mouths. People would gladly pay $80 for your sandwich, but they can't afford the $600 to upgrade their mouths. You made $4 billion from your sandwich. You have not given a date when your sandwich will be compatible with more mouths. I'm not saying the piracy is ethical, but it is not the same as stealing a sandwich from your shop. This is early 2000s piracy discourse repeating itself."}, {"id": 50635016, "au": "Stevvo", "dom": 100, "sr": 68, "sc": 3.73, "ep": 4.42, "bs": 0.0, "d": 1, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0
