, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3792, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.794, "fa": 0.84, "gp": 0.11, "bl": 0.0, "ds": 0.0, "txt": "There is no evidence of that? The latest is broken rendering on 1st scene at 3 fps. This sort of project usually takes years to go from that point to actually something you would want to play."}, {"id": 50625406, "au": "maskofthesea7", "dom": 193, "sr": 69, "sc": 3.73, "ep": 6.92, "bs": 2.52, "d": 1, "age": 18.07, "grav": 221.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 1, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.882, "fa": 0.22, "gp": 1.287, "bl": 0.95, "ds": 0.0, "txt": "The author of this project is reportedly 14 or 15yo and doesn't have any technical background. Lots of people with no technical experience are spearheading much of these projects now. His previous project, Hookshot (Zelda Ocarina of Time recompile) was forked by a group of more experienced developers who set up a forgejo instance on their own domain to continue the development. Their fork is now the leading Zelda OoT recompile.\n\nTor is too high of a barrier of entry for most users, and these projects aren't illegal anyway, so hosting your own git forge is currently the best approach."}, {"id": 50631334, "au": "kodt", "dom": 93, "sr": 70, "sc": 3.73, "ep": 5.23, "bs": 0.85, "d": 4, "age": 9.34, "grav": 79.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 836, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.402, "fa": 0.34, "gp": 0.67, "bl": 0.32, "ds": 0.0, "txt": "The game boots. It is not playable. But it can boot into the menus and load a cut scene at ~5fps with broken lighting/shaders. Yes, AI is doing all the work but a decade ago you had to wait years to get to this point, not days. Being impressive or not is subjective. What is objectively different is the speed of progress."}, {"id": 50631489, "au": "fallingbananna", "dom": 27, "sr": 71, "sc": 3.73, "ep": 4.38, "bs": 0.0, "d": 1, "age": 9.14, "grav": 76.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 16, "k": 277, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.295, "fa": 0.42, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": ">and this gate keeping from some console vendors, seems like a good reason, to push on this\n\nWhile I understand the \"it's shitty thing to gatekeep\" reasoning.\n\nI feel like it's essential for the game consoles to survive.\n\nXbox decided to not engage in this behavior and it only lead to them not selling  many consoles, which then lead them on a downward spiral where many developers not porting games to Xbox because too few people owned that console."}, {"id": 50634223, "au": "motbus3", "dom": 410, "sr": 72, "sc": 3.73, "ep": 4.37, "bs": 0.0, "d": 1, "age": 6.22, "grav": 44.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1812, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.288, "fa": 0.34, "gp": 0.256, "bl": 0.0, "ds": 0.0, "txt": "It is questionable using open source without contributing back and all top 500 companies do. Now they also do copy books, magazines, personal projects, etc and still no judge ruled against them.\n\nStrange times to see an action taken against a project that has zero intellectual property violated since this was already legally ok since the 90s"}, {"id": 50630022, "au": "skinfaxi", "dom": 39, "sr": 73, "sc": 3.73, "ep": 4.25, "bs": 0.0, "d": 6, "age": 10.75, "grav": 97.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 9, "k": 1260, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.216, "fa": 0.42, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "> What entitles you to ownership of their hard work?\n\nIf someone bought the ps5 version and wants to port it to their PC, what entitles the 1st party from restricting what they do with their purchase? The first sale doctrine applies to things we bought remember? If I buy a book I can lend it to friends, too."}, {"id": 50634892, "au": "cubefox", "dom": 151, "sr": 74, "sc": 3.73, "ep": 4.17, "bs": 0.0, "d": 6, "age": 5.31, "grav": 35.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 17, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.851, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The PS5 released in 2020, when AI couldn't hack, so it hardly \"postdates\" AI. It was never hacked by a human, only recently by a modern LLM. Which suggests that, without modern AI, it would have remained unhacked till the end of its lifespan.\n\n> DeHackEd was released in 1994. ScummVM was 2001.\n\nThese are very old projects without the modern security systems of current consoles. Hacking them is exceptionally hard without AI.\n\n> His point was that \"decompilation\" has been happening since before AI.\n\nIt hasn't happened on current gen consoles before modern AI. It was mostly restricted to old games for which piracy was no longer relevant. So his inference that AI hacking/decompilation doesn't affect piracy is unjustified."}, {"id": 50625181, "au": "yreg", "dom": 104, "sr": 75, "sc": 3.73, "ep": 4.16, "bs": 0.0, "d": 0, "age": 18.56, "grav": 231.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 10140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.766, "fa": 0.0, "gp": 1.624, "bl": 0.0, "ds": 0.0, "txt": "I imagine that once this succeeds a lot of people who would have purchased the game on Steam if it was available are going to pirate the ported version instead.\n\nI'm curious if this kills the platform-exclusive business model as not being worth it."}, {"id": 50629903, "au": "max_streese", "dom": 516, "sr": 76, "sc": 3.73, "ep": 4.07, "bs": 0.0, "d": 2, "age": 10.88, "grav": 99.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 73, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.096, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "How would your very personalized game, the size of GTA 6 look like? You would just imagine all the characters or your LLM of choice would?\n\nWho knows what the world is going to look like in 10 years but I don't see it. For my part I am very happy with the game and just playing it instead of having to create it or have it created for me.\n\nIn my position somewhere in software my job is creating things a lot of the time. That doesn't mean that I want to spend that part of my free time I currently spend consuming a video game with instead creating a hyper personalized one and then have nobody but myself to share it with because it just isn't an event the same way a GTA 6 release is. I also wonder whether you overestimate how many people are interested how strongly in creating things like games vs simply consuming them."}, {"id": 50625016, "au": "hmry", "dom": 562, "sr": 77, "sc": 3.73, "ep": 4.05, "bs": 0.0, "d": 3, "age": 18.86, "grav": 237.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1825, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.509, "fa": 0.0, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": "Breaking someone's business model is not a crime either.\n\nIf your business model can be broken by people exercising their rights (by e.g. porting your program to another platform) then your business model is bad.\n\n(And of course, one has to note that sharing the decompiled code online is illegal. Distributing tools that allow people to take their own legally purchased copy and recompile it to run on a different platform is legal. I don't know which one this project was doing)"}, {"id": 50628974, "au": "TMWNN", "dom": 232, "sr": 78, "sc": 3.73, "ep": 4.04, "bs": 0.0, "d": 2, "age": 11.92, "grav": 114.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4665, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.305, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Context for others: Grand Theft Auto V was released late in the PS3/Xbox 360 console lifecycle, then later for PC, PS4/Xbox One, and PS5/Xbox Series.\n\n(Yes, there are people who bought all four versions.)"}, {"id": 50628984, "au": "K0IN", "dom": 1, "sr": 79, "sc": 3.73, "ep": 3.95, "bs": 0.0, "d": 0, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 219, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 1.359, "bl": 0.0, "ds": 0.0, "txt": "I understand all the comments for piracy, but I also want to point out, I am happy to spend 80€ but I'm not happy to lock in to a 500€+ console I do not own (I own a powerful PC), and this gate keeping from some console vendors, seems like a good reason, to push on this. I'm also happy to buy the game on xbox, just to play it on my computer."}, {"id": 50628715, "au": "MYEUHD", "dom": 80, "sr": 80, "sc": 3.73, "ep": 3.94, "bs": 0.0, "d": 2, "age": 12.2, "grav": 118.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1634, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.086, "fa": 0.34, "gp": 0.287, "bl": 0.0, "ds": 0.0, "txt": "Oviously you need the game in decrypted form in order to be able to emulate it / recompile it.\n\nIf the Xbox build didn't leak, someone would've dumped the game using a jailbroken PS5. That would require a jailbreak on the PS5 firmware 14.23, which exists but isn't available publicly for now."}, {"id": 50637417, "au": "robby_w_g", "dom": 44, "sr": 81, "sc": 3.73, "ep": 3.92, "bs": 0.0, "d": 8, "age": 0.72, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 505, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.303, "bl": 0.0, "ds": 0.0, "txt": "Is it an agreement? You buy a game, and then you’re forced to click “I agree” to a massive document in order to play it. In practice, barely anyone reads the legalese and no one is actually expected to.\n\nAnd after the massive IP theft and IP laundering that is LLMs, I have little patience for any argument for protecting these incredibly wealthy tech companies."}, {"id": 50625347, "au": "bob1029", "dom": 226, "sr": 82, "sc": 3.73, "ep": 3.87, "bs": 0.0, "d": 2, "age": 18.19, "grav": 223.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.783, "fa": 0.34, "gp": 0.732, "bl": 0.0, "ds": 0.0, "txt": "On the PS5 pro it runs locked at 30 with zero variance outside physics simulation edge cases.\n\nLow frame rates suck mostly when there is a large difference in the timing of each frame. Movies at 24fps don't seem to bother many. Low FPS is generally correlated with high frame time variance in gaming."}, {"id": 50630057, "au": "terafo", "dom": 452, "sr": 83, "sc": 3.72, "ep": 3.82, "bs": 0.0, "d": 2, "age": 10.71, "grav": 97.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1143, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.779, "fa": 0.22, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "That game made 3.8 billion dollars in the first day. Next GTA is unlikely to be made in the foreseeable future though, they are going to be squeezing every bit of profit that they can from online mode now."}, {"id": 50634198, "au": "4gotunameagain", "dom": 191, "sr": 84, "sc": 3.72, "ep": 3.81, "bs": 0.0, "d": 2, "age": 6.25, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 2956, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.21, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Musicians and programmers and artists see single digits of the profits of all this.\n\nNot only they already made their money back, but they will be selling shark cards and lootboxes and whatnot in GTA VI for 15 more years.\n\nYou are not hurting an artist. Rockstar will hurt the artists when they fire 80% of them so they can milk the game for a decade."}, {"id": 50629773, "au": "whamlastxmas", "dom": 418, "sr": 85, "sc": 3.72, "ep": 3.79, "bs": 0.0, "d": 1, "age": 11.01, "grav": 101.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 2818, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "Laws aren't ethics and something being legal doesn't mean it's ethical vice versa etc.\n\nWriting your own code, regardless of what it does, should never be illegal. Reverse engineering projects don't require any of the original code to be present and they usually don't have any.\n\nImagine if just writing to the steps to reverse engineer something was illegal and what a massive infringement on personal rights that would be."}, {"id": 50630602, "au": "torginus", "dom": 389, "sr": 86, "sc": 3.72, "ep": 3.78, "bs": 0.0, "d": 1, "age": 10.11, "grav": 89.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.662, "fa": 0.56, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "I think the ethical and legal framework that should fit here the most is fair use, which is substantially different from how its handled today.\n\nFair use implies that the derived product must be transformative in some way, and not a substitute of the original - for example, a cover song still falls under copyright.\n\nSo should a recompilation imo, and any attempts to reproduce the original in a way that it can substitute it."}, {"id": 50630247, "au": "TeMPOraL", "dom": 266, "sr": 87, "sc": 3.72, "ep": 4.01, "bs": 0.27, "d": 3, "age": 10.52, "grav": 94.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 12, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.132, "fa": 0.42, "gp": 0.108, "bl": 0.1, "ds": 0.0, "txt": "> \"holds that the social responsibility of business is to increase its profits.\"\n\nIs that an actual quote? Would be ironic if it turned out the whole late 20th / early 21st century history could be summarized as everyone misunderstanding \"its\" as referring to \"business\", when the speaker meant it to refer to \"society\"."}, {"id": 50631172, "au": "tanepiper", "dom": 366, "sr": 88, "sc": 3.72, "ep": 3.74, "bs": 0.0, "d": 1, "age": 9.52, "grav": 81.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 53, "qw": 0, "k": 1035, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": ["https://tanepiper.github.io/game-frame/"], "ig": 0.583, "fa": 0.62, "gp": 0.414, "bl": 0.0, "ds": 0.0, "txt": "I created this a couple of months back - https://tanepiper.github.io/game-frame/\n\nIt's exactly that ethical boundary I wanted to make clear in this - old game preservation is good, but decompiling something that just came out - that's not even a fine line, it's just bad.\n\nThere's a whole legal section in there too, covering what is an isn't legal in different jurisdictions."}, {"id": 50631196, "au": "croes", "dom": 519, "sr": 89, "sc": 3.72, "ep": 3.73, "bs": 0.0, "d": 1, "age": 9.5, "grav": 81.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 14, "k": 25736, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.031, "fa": 0.42, "gp": 0.073, "bl": 0.0, "ds": 0.0, "txt": "> They want to continue to do so and in the process earn a decent living.\n\nFor GTA 6 that goal is already reached.\n\nAnd for GTA 7, how many developers will replaced by AI until it’s done?\n\nMaybe they already fired developers because they do the PC port per AI.\n\nCould there be a better way to get a ban of such AI than projects like this?"}, {"id": 50631146, "au": "gloosx", "dom": 360, "sr": 90, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 6, "age": 9.54, "grav": 81.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 1513, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.576, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I dont even need to claim the moral high ground to justify blocking ads. YouTube acts in its own economic interests, and I am equally entitled to act in mine. Its strange to characterize one as legitimate business practice and the other as selfishness. I am not responsible for maximizing their profits, attention is a finite resource and my desire to resist monetisation is just as selfish as their attempt to monetize on me.\n\nIm also opposed to the deceptive business model of luring people in with supposedly \"free\" content while charging them an increasingly intrusive and unpredictable price in attention and personal data, it is a free cheese in a mousetrap business model, and I find nothing selfish about the natural human instinct to avoid the trap."}, {"id": 50627628, "au": "TeMPOraL", "dom": 194, "sr": 91, "sc": 3.68, "ep": 3.95, "bs": 0.27, "d": 2, "age": 13.55, "grav": 139.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 0.214, "bl": 0.1, "ds": 0.0, "txt": "Yup. LLMs now provide the technical skills, humans provide the time and attention, and like in good ol' days of early open-source and all kind of scenes, it's school kids who have both the drive and spare time in ample supply."}, {"id": 50632193, "au": "customguy", "dom": 62, "sr": 92, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 2, "age": 8.33, "grav": 66.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 785, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.153, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "that people call it theft is reason enough to pirate. Crack it, distribute it, just as a healthy middle finger. I wouldn't waste my time playing \"American TV Show - the game\" but I'm 100% on board with pirating it. People who pirate it are a lot more moral, and causimg less harm to society, than people calling it theft, in my books."}, {"id": 50636057, "au": "tacticalturtle", "dom": 447, "sr": 93, "sc": 3.67, "ep": 3.67, "bs": 0.0, "d": 4, "age": 3.63, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 37, "k": 1046, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.837, "fa": 0.42, "gp": 0.348, "bl": 0.0, "ds": 0.0, "txt": "> They 100% will put it in PC, either in 3 months or in 18 months, because they want money. They're just planning to increase the profits from exploitative double dipping by betting on people who will buy it again\n\nI don’t understand why people keep making this argument.\n\nAre there stats on the number of people who buy the game twice, once to “experience the cultural moment” and once to play in the platform they actually want to use?\n\nMy suspicion is that this is a tiny fraction of GTA 6 players."}, {"id": 50622687, "au": "noir_lord", "dom": 522, "sr": 94, "sc": 3.65, "ep": 3.65, "bs": 0.0, "d": 1, "age": 24.42, "grav": 362.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 18124, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.333, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Entertaining but \"dev\" is doing a lot of lifting there.\n\nI suspect language hasn't caught up yet to disambiguate devs from \"non-dev with AI\", viber is pejorative in a way that doesn't necessarily fit."}, {"id": 50629345, "au": "RIMR", "dom": 58, "sr": 95, "sc": 3.65, "ep": 3.65, "bs": 0.0, "d": 2, "age": 11.48, "grav": 108.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 2351, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.332, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "If Rockstar doesn't want people finding their own way, they shouldn't have created a gap between console and PC releases.\n\nThe only reason the gap exists is because console makers paid them to make it a console exclusive for a while just to sell consoles.\n\nI want to play GTA VI, because they have been relentlessly advertising it to me. I don't want to buy a console just to play one game.\n\nIt's a service problem. Rockstar is free to do business however they want to, but the consequences of their actions are entirely their doing."}, {"id": 50632823, "au": "yreg", "dom": 125, "sr": 96, "sc": 3.62, "ep": 3.62, "bs": 0.0, "d": 2, "age": 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 10140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.471, "fa": 0.0, "gp": 0.112, "bl": 0.0, "ds": 0.0, "txt": "That's a totally out of touch take.\n\nI know plenty of people including me who have no issue paying for PC games and also refuse to play on console. My Steam library is embarrassingly expensive.\n\nI believe many of us will have zero ethical concerns pirating a console only game. Same as pirating a rom to play Pokemon without getting a Gameboy."}, {"id": 50635875, "au": "__m", "dom": 223, "sr": 97, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 4, "age": 3.91, "grav": 24.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 531, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.1, "fa": 0.34, "gp": 0.026, "bl": 0.0, "ds": 0.0, "txt": "the ps5 pro isn't expensive either if you compare it to pc gpu prices. I wouldn't trade the additional 30 fps for quality."}, {"id": 50632223, "au": "tavavex", "dom": 492, "sr": 98, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 5, "age": 8.3, "grav": 66.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 275, "qw": 93, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.965, "fa": 0.42, "gp": 0.084, "bl": 0.0, "ds": 0.0, "txt": "> The only slice which does work is that it represents a lost commercial opportunity based upon my labour and, to a lesser extent, IP. We have no way of verifying that a pirated copy could have otherwise been purchased. That's a tough nut to crack, and not possible to do so here.\n\nYeah, this is an issue. It's what makes certain types of 'piracy' much less objectionable to many people (old games, retired games, games that were never on your platform). If you were never going to buy it or if the seller never wanted to sell it to you, or stopped selling it a long time ago, then there's no sale lost. If you want to debate this specific case of piracy, I don't think this represents a lot of actual lost sales because some of the people involved may literally not have enough money to buy the game (see the title of this post), while others would buy the proper release anyway when it comes out. I know I would do that. Even if there's a janky fanmade port, if the game is actually good and fun to play, I will buy it properly when it comes out.\n\n> how easy is it to make a PC version they can afford to support? What are their actual profits on this game? If it made sense to release on PC, wouldn't they? Is this due to an agreement with Sony to reduce publishing fees or something?\n\nTaking into account how every major game of the series released in the past, and how they've worked on it, ther"}, {"id": 50629576, "au": "mrinf1nity", "dom": 497, "sr": 99, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 1, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 85, "k": 37, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.819, "fa": 0.42, "gp": 0.318, "bl": 0.0, "ds": 0.0, "txt": "> You can't at the same time blame the AI labs for their unattributed assimilation of human knowledge without paying, while then paying those same AI labs for tokens in order to reverse engineer something that lots of people have spent lots of time creating.\n\nSure you can. And, they did. And, they will.\n\n> In my view bring on the takedowns and issue lawsuits\n\nThey will, count on that\n\n> lead us to a future where human creation will be devalued and projects of this scope no longer viable because AI will be used to simply reverse engineer and offer for free.\n\nIt's going to be like that, the cat's out of the bag.\n\nNot saying I agree with taking leaked data and doing with it as people want. Not saying it's right, and not saying I hate AI companies for stealing intellectual property / destroying millions of books / pirating books (they did, and do) but keep your eyes open, because this is how it is."}, {"id": 50629721, "au": "sandos", "dom": 229, "sr": 100, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 5, "age": 11.08, "grav": 102.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 679, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.111, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is truly horrible idea for games, no?\n\nHmm, ok, maybe not.. since people do more or less the same thing with piping the output from the console through DLSS 5 or similar.. And learning that the lag is ~190ms natively for GTA, whats a few added frames?\n\nThis is also fun, because I play it on streaming, and I barely notice any lag."}, {"id": 50629875, "au": "MattDamonSpace", "dom": 495, "sr": 101, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 2, "age": 10.91, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.176, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "1. That the game doesn’t run ideally on consoles adds weight to the “pc version is harder than it looks”, given the fractured hardware landscape in pc gaming. They can’t even get it to run well on specific hardware!\n2. “The usual baseline desire for a free game” yeah that’s just called stealing and nothing a company does justifies it, anything else is rationalizations"}, {"id": 50625148, "au": "ada-h00k", "dom": 579, "sr": 102, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 1, "age": 18.62, "grav": 232.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 254, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.032, "fa": 0.28, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't agree that it's unethical, but I do think that, for most people, ethics is irrelevant to this issue. There’s a demand to play GTA 6 on PC. Either Rockstar decides to meet that demand, or others will. In the past, without LLMs, that was much harder and therefore happened less often. But even back then, there were similar cases, such as NESticle. There were people who wanted to play NES games on PC, so someone created an emulator."}, {"id": 50631717, "au": "vuldin", "dom": 546, "sr": 103, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 0, "age": 8.85, "grav": 73.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 306, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.48, "fa": 0.0, "gp": 0.05, "bl": 0.0, "ds": 0.0, "txt": "I have never pirated games. But I have already bought GTA6 on the PlayStation in spite of originally planning to exclusively play this on the PC. Rockstar chose to take advantage of walled gardens, and their fans, yet again, by making the game exclusive to consoles on release. If GTA6 becomes playable on PC, whether that's from Rockstar or some other way, I'll be happy to play it on my chosen platform."}, {"id": 50632253, "au": "rangestransform", "dom": 260, "sr": 104, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 5, "age": 8.27, "grav": 66.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 752, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.509, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t get why American social democrats redwash themselves as democratic socialists, as far as I can tell they support policies that are closer to “Nordic welfare state” than anything Marx cooked up. To me, anything that does not involve democratic ownership of the means of production can’t call itself socialism"}, {"id": 50631483, "au": "varispeed", "dom": 540, "sr": 105, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 0, "age": 9.15, "grav": 76.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3198, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.426, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "\"Recomp\" is mathematical transformation that produces equations that give the same result. It's akin to storing the code on a differently encoded medium. It's piracy with extra steps."}, {"id": 50626052, "au": "krapp", "dom": 145, "sr": 106, "sc": 3.54, "ep": 3.54, "bs": 0.0, "d": 1, "age": 16.63, "grav": 193.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 20431, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.378, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "Games have been getting \"decompiled\" even before AI made it possible without any real technical skill. People didn't choose hacked copies en masse, and it didn't kill anyone's business model.\n\nThis sort of thing is just going to make indie development even worse. It isn't going to affect the big players at all and most people will just wait until the official port comes out."}, {"id": 50629891, "au": "gbraad", "dom": 408, "sr": 107, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 1, "age": 10.89, "grav": 99.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1074, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 0.491, "bl": 0.0, "ds": 0.0, "txt": "Reverse engineering is not unethical. It however did get bad name in recent time, as it is used to whitewash copying software. Just like AI has been used to strip GPL licenses away from OSS. That is what makes it unethical, plus the fact this is more like piracy when you use it as an excuse to not pay. (Piracy for things you already own(ed) is a different matter; like Sony taking away yout movies, or games like The Crew)."}, {"id": 50624916, "au": "hypfer", "dom": 559, "sr": 108, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 0, "age": 19.04, "grav": 240.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 156, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.819, "fa": 0.28, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "The interesting ethics question to explore here I think is how it comes to be that people feel entitled to doing this. You see people going \"Yeah this wouldn't have happened if they had just released on PC\", but that kinda reads like \"yeah we wouldn't have beaten you up if you just gave us your lunch money\".\n\nOf course, big studio and sales are still fine and all, but the social contract is breaking down a bit there.\n\nA completely different thing to explore here is that kids (little accountability) are steering LLMs (no accountability) here, which is an interesting new development. Previously, crime was done with kids as meat shields, but there, it was still fairly trivial to trace back which adult actually was behind it and punish them accordingly.\n\nWhereas here, it is Kids doing this on their own with the power of the whole industry distilled into a bunch of floats backing them up.\n\nWild times."}, {"id": 50632929, "au": "throwaway2037", "dom": 422, "sr": 109, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 2, "age": 7.54, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.64, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are you equally upset that TSMC has a profit margin of 50%?  NVidia is also over 50%.  What is an acceptable profit margin for Rockstar Games for GTA 6?"}, {"id": 50629575, "au": "ferguess_k", "dom": 424, "sr": 110, "sc": 3.43, "ep": 3.43, "bs": 0.0, "d": 1, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1083, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.913, "fa": 0.0, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "The other side of the argument, which I used a lot, is that people who pirate the games wouldn't buy it anyway. At least it was my case back in the 90s -- nowadays paying on Steam or GoG is way more convenient.\n\nIn the GTA 6 case I think there is another side of the argument -- that people just want to play the game on PC right now, not after a few months. If they decided to buy, they probably would.\n\nHonestly I think companies way overestimate the revenue they lost to piracy."}, {"id": 50628233, "au": "anthonybsd", "dom": 115, "sr": 111, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 4, "age": 12.73, "grav": 126.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 999, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.804, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You think that more than half of 235 million people that bought GTA 5 have tried playing it online? The numbers simply don't support this."}, {"id": 50630166, "au": "daveidol", "dom": 443, "sr": 112, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 1, "age": 10.59, "grav": 95.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 903, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.233, "fa": 0.0, "gp": 0.299, "bl": 0.0, "ds": 0.0, "txt": "I totally agree, except the issue here is that I have no means of actually paying Rockstar for the game to play on my PC. I'd much, much rather pay them and play the full version - but I have no idea when or even if that will be available to me.\n\nSo, as it is, I'm very interested in playing the recomp version instead so I don't miss out on the 'cultural moment' and can discuss with my console friends.\n\nIf/when Rockstar does release it on PC, I will still buy a copy at that time. And no, I don't want to buy an entire console just to play one game."}, {"id": 50632586, "au": "palata", "dom": 302, "sr": 113, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 3, "age": 7.92, "grav": 62.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.082, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "There are many reasons for those people to be upset. First, it doesn't bring them money. They don't care about not losing money, they care about making money. Unless you prove to them that it actually increases their profit, they won't ever accept it, period.\n\nSecond, they would say that it may hurt their reputation: if the game experience on an unsupported platform is subpar, people may think the game is subpar. I would say probably not, because people are generally not completely stupid, but... those people wouldn't take that risk.\n\nFinally imagine that they later decide to port the game to PC? Then they actually lose money because the people who really wanted it on PC already got it without paying."}, {"id": 50632892, "au": "throwitaway222", "dom": 261, "sr": 114, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 5, "age": 7.59, "grav": 58.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 606, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If they ran on a communist ticket, none of them would have been elected. It's been well established that DSA is using the name \"Democrats\" and toxic social media influence to push out the rest. If people think socialism or communism is going to bring on the golden age, they're in for a real treat. (As in death, destruction and total moral collapse.) Yes capitalism has problems and most of that is because regulators fell asleep.  Socialism and communism will require perfect regulation and watch over the entire society to work correctly - and that's not possible - maybe they can do it if they let AI control it?\n\nIn a country that has Democrats literally asleep over the massive fraud problems - socialism is here to bring doom."}, {"id": 50631502, "au": "gloosx", "dom": 365, "sr": 115, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 2, "age": 9.13, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1513, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.4, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Modifying a legitimately purchased copy to run on a different hardware is not morally equivalent to obtaining an unauthorized copy without paying, you seem to conflate the two.\n\nIf someone paid for the game and invested their own time and technical expertise into making it run on a PC, what exactly is the moral wrongdoing? Depriving Rockstar of the opportunity to sell them the same game twice?\n\nI find it strange that you consistently frame corporate self-interest as legitimate while treating consumer self-interest as a moral failing."}, {"id": 50629489, "au": "tracerbulletx", "dom": 340, "sr": 116, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 1, "age": 11.33, "grav": 105.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 4510, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.765, "fa": 0.0, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": "If someone spends 2 billion dollars paying artists, voice actors, animators, fashion designers, and programmers to make a really incredible game I believe they have the right to dictate its distribution to make the return worth the investment. The fact that companies often act immorally is not directly relevant here. If you want to pirate some software from a company truly doing evil and not just selling on the terms you personally dislike, feel free. That's not the case here."}, {"id": 50625194, "au": "Pinegulf", "dom": 536, "sr": 117, "sc": 3.26, "ep": 3.26, "bs": 0.0, "d": 0, "age": 18.52, "grav": 230.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 305, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.161, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "A bit more context would have been nice. As far as I was able to figure out: \nSomeone (Leonida) was trying to port GTA6 to PC. Got banned. Probably by IP owner.\n\nSurprised Pikachuface"}, {"id": 50631060, "au": "drop_star", "dom": 216, "sr": 118, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 3, "age": 9.62, "grav": 82.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 116, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.968, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I thought this too until I turned on frame interpolation. It creates in-between frames to make motion look smoother. Playing the game at 60FPS I dont think i can go back."}, {"id": 50637467, "au": "Rapzid", "dom": 461, "sr": 119, "sc": 3.23, "ep": 3.23, "bs": 0.0, "d": 2, "age": 0.62, "grav": 5.7, "surf": 12.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 6952, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, plete the first chapter (you can get global steam achievement percentages for games).\n\nA large percentage of revenue is carried by people who like the idea of playing a game, but don't actually play it."}, {"id": 50630493, "au": "tracerbulletx", "dom": 358, "sr": 127, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 5, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 4510, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.982, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "That's just an insult, not an argument. People put a lot of work into making youtube videos, and youtube puts a lot of work into building the infrastructure. They have the right to monetize, ads are how they monetize, circumventing monetization is just a selfish choice that has nothing to do with a moral high ground. You can also buy Youtube Premium, its not expensive for the amount of content."}, {"id": 50625899, "au": "olavgg", "dom": 214, "sr": 128, "sc": 3.08, "ep": 3.08, "bs": 0.0, "d": 2, "age": 16.98, "grav": 199.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1790, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.564, "fa": 0.34, "gp": 0.543, "bl": 0.0, "ds": 0.0, "txt": "Rockstar has really optimized this game for 30 fps. Honestly I am surprised how well it works, because I never think about it when I play. I have a base PS5."}, {"id": 50629956, "au": "quasi7", "dom": 548, "sr": 129, "sc": 3.02, "ep": 5.53, "bs": 2.52, "d": 1, "age": 10.83, "grav": 98.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 1.722, "fa": 0.28, "gp": 0.475, "bl": 0.95, "ds": 0.0, "txt": "But the AI industry is generating massive dollar amounts of economic activity and singlehandedly propping up yhe US economy\n\nOn the other hand you have a nobody teenager who probably hasn't even paid much in taxes.\n\nOne of these is clearly more valuable than the other and we can bend the rules for them whereas the other is a net-cost disrupting law and order.\n\nIt may sound harsh, but I guarantee you youn will be seeing this play out much of explicitly in politics, law, economics in the coming decades."}, {"id": 50632995, "au": "yreg", "dom": 146, "sr": 130, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 2, "age": 7.47, "grav": 57.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 10140, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have spent over a decade trying to game on a mac before finally building a dedicated PC.\n\nThere were very very few unofficially ported AAA games that actually ran well during that time. Pretty much the only one I remember working well is Oblivion.\n\nWe will see about the quality of the vibed ports, but this was definitely not a solved problem."}, {"id": 50630053, "au": "izacus", "dom": 508, "sr": 131, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 2, "age": 10.72, "grav": 97.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 28301, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.279, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The company in question earned 2.5billion USD in pure profit in two days. Cut the crocodile tears about working for free.\n\nIf they launched the PC version, they'd earn even more."}, {"id": 50635853, "au": "zardo", "dom": 372, "sr": 132, "sc": 3.0, "ep": 3.0, "bs": 0.0, "d": 6, "age": 3.95, "grav": 24.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 3631, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.275, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Distributing them is not a legitimate legal activity. Reverse engineering GTA risks what? Getting your GitHub account banned for a TOS violation?\n\nYou would be a fool to upload the game disk itself."}, {"id": 50630188, "au": "svnt", "dom": 501, "sr": 133, "sc": 2.97, "ep": 2.97, "bs": 0.0, "d": 1, "age": 10.57, "grav": 95.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 3532, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "This project is not exactly copying the game. It enables people to play the copy of the game they purchased for Xbox on their PC.\n\nIt has parallels to printing an ebook for your personal\nuse.\n\nTake Two of course would prefer to get paid twice for the same IP because you wanted to play it with your friends now and then later also wanted to play it on a PC. Is that fair?"}, {"id": 50630451, "au": "jayd16", "dom": 384, "sr": 134, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 1, "age": 10.3, "grav": 91.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 14948, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.975, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "You're advocating for a complete lack of morals?\n\nWell morals aside, if you want games to be funded then they need to make the money back.  Patents and copyright are not moral designs but practical ones.\n\nThe same logic can be applied here even if there is currently a legal hole."}, {"id": 50632549, "au": "madduci", "dom": 473, "sr": 135, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 1, "age": 7.97, "grav": 62.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 914, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "The main issue here is that one of the most hyped games in history has explicitly ignored the major gaming platform which is PC.\n\nYou see it from the hard limitation of FPS set to 30 on a PS5.\n\nThis wouldn't probably happen, if they've released the game from the day 1, even for PC."}, {"id": 50625075, "au": "scotty79", "dom": 596, "sr": 136, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 18.77, "grav": 235.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 20, "k": 15735, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.737, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Of course, big studio and sales are still fine and all, but the social contract is breaking down a bit there.\n\nSocial contract is, you didn't seek my permission to publish GTA VI (why would you?) I don't seek permission to reverese engineer it (why would I?).\n\nFreedom for thee, but also for me."}, {"id": 50627979, "au": "cubefox", "dom": 149, "sr": 137, "sc": 2.92, "ep": 3.45, "bs": 0.53, "d": 4, "age": 13.07, "grav": 132.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 8133, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.644, "fa": 0.68, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "False. The PS5 (released in 2020) has only recently been hacked, and only with the help of AI. The Xbox Series (also released in 2020) has not been hacked."}, {"id": 50631077, "au": "fooqux", "dom": 517, "sr": 138, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 3, "age": 9.61, "grav": 82.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 4493, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's already entire markets out there for AI characters for you to interact with. People create them, give them personalities, then release them for free or for profit.\n\nThat's all just text and obviously generative AI can create that all day. And the kinds of characters in your story can be guessed as well.\n\nIt's entirely possible for AI to create whole interactive worlds right now, today. You might be interacting with it via text and pictures, but the inflection point of generative video is coming; its just a scaling problem."}, {"id": 50624898, "au": "ipsum2", "dom": 236, "sr": 139, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 19.07, "grav": 241.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 8936, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.973, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unfortunately most of the work was done in the PRs, which weren't merged. It's all slop anyways, so its unclear how many of those millions lines of code were actually useful."}, {"id": 50630673, "au": "fooqux", "dom": 511, "sr": 140, "sc": 2.91, "ep": 2.91, "bs": 0.0, "d": 1, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 25, "k": 4493, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.657, "fa": 0.42, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": "> 1000s of people have worked on this game for over 10 years. They want to continue to do so and in the process earn a decent living.\n\nWhen the programmers and graphic designers lost their job due to AI, they were told to \"get with the times\" and compared to various things like telephone switchboard operators or horse buggy whip makers. But when a company only makes a billion in profit on the first day, that's cause for concern.\n\nI'm not trying to strawman you here, I know this wasn't your original point. But there's this sense of \"won't someone please think of the shareholders\" going on.\n\nI know this is a bit of a hot take, but I don't see why they shouldn't be in the same boat."}, {"id": 50630764, "au": "Creamsicle47", "dom": 463, "sr": 141, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 1, "age": 9.95, "grav": 87.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 11, "k": 46, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.219, "fa": 0.68, "gp": 0.296, "bl": 0.0, "ds": 0.0, "txt": "> 1000s of people have worked on this game for over 10 years\n\nIncorrect, the game has not been in development for \"over 10 years\" - it has been over 10 years between GTA5 & 6. Very different things."}, {"id": 50631375, "au": "quchen", "dom": 394, "sr": 142, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 2, "age": 9.28, "grav": 78.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1487, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.812, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So far it's only being used to show non-shaded gif versions of GTA6 without face movement, if we want to play the \"actually\" and \"lawyer\" game. I'm only 70% joking here ;-)"}, {"id": 50630292, "au": "close04", "dom": 399, "sr": 143, "sc": 2.88, "ep": 2.88, "bs": 0.0, "d": 4, "age": 10.46, "grav": 93.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 5955, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.224, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even if the fine is the same in relative terms and is a lot higher in absolute terms for the rich person, it also leaves a lot more money in the pocket for those who can afford it. There's a financial danger point where any fine tips the scales towards not being able to make other payments. And what's left can't be used to make more money, it gets spent on necessities.\n\nSo money alone isn't a good disincentive for certain actions. Pressure from society works in some countries. And taking away time, of which most have a similar amount over the lifetime, or in the same ballpark, is very effective. You can't make more time at the same rate as you can make more money."}, {"id": 50627926, "au": "GaryNumanVevo", "dom": 202, "sr": 144, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 2, "age": 13.15, "grav": 133.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1997, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's no surprise to anyone that people with experience doing RE and working on prior R* modding efforts have been the quickest to get actual geometry rendering and a bit of the shading pipeline working. The Leonida people didn't even get the 3D pipeline to boot."}, {"id": 50630200, "au": "TeMPOraL", "dom": 166, "sr": 145, "sc": 2.87, "ep": 3.13, "bs": 0.27, "d": 5, "age": 10.55, "grav": 95.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.994, "fa": 0.28, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "They ask for CVEs that can be linked to your name, or evidence of being employed in a security-related position. Plus plenty of sensitive information.\n\nClaude is useful enough for me that I'm not going to risk bullshitting my way through this. Nor I believe I should need to."}, {"id": 50633326, "au": "ux266478", "dom": 150, "sr": 146, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 5, "age": 7.08, "grav": 53.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1058, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.396, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The PS5 postdates AI. His point was that \"decompilation\" has been happening since before AI. DeHackEd was released in 1994. ScummVM was 2001."}, {"id": 50630258, "au": "thepasch", "dom": 493, "sr": 147, "sc": 2.86, "ep": 2.86, "bs": 0.0, "d": 3, "age": 10.5, "grav": 94.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 4, "k": 737, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.217, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Have you seen it?\n\nI have not, actually! I'd love to, but I'm currently unable to because Take2 considers me - and everyone else who shares my platform of choice - a piggy bank they can squeeze into being breakable twice.\n\nI'm going to purchase the game for my platform of choice the moment it's available for it. Until then, I'll treat Take2's decisions with as much consideration as they have treated mine. In an era where \"consoles\" are just x86 PCs in fancy trenchcoats and sunglasses, there really is no more excuse for this crap."}, {"id": 50627844, "au": "mft_", "dom": 395, "sr": 148, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 1, "age": 13.26, "grav": 135.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5411, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.642, "fa": 0.0, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "The cynical take is that nowadays the borders of legality are more defined by whether you can afford the consequences (both any legal support necessary, and/or financial penalties).\n\nThis is the calculus by which large organisations and wealthy individuals effectively have carte blanche, but more modest individuals don’t."}, {"id": 50631448, "au": "kikdij", "dom": 15, "sr": 149, "sc": 2.84, "ep": 2.84, "bs": 0.0, "d": 3, "age": 9.19, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 96, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "To be fair, when it comes to videogames, you almost never own them. It's in about all proprietary videogames' EULA. They keep the ownership of the game, you're only licensed the right to play it. It's meant to prevent someone claiming they're allowed to do whatever they please with their copy of the game since they own it. Except of course, they bury it in the EULA because it would not look so great to very publicly state it."}, {"id": 50623871, "au": "b33fsDedYall", "dom": 528, "sr": 150, "sc": 2.83, "ep": 5.35, "bs": 2.52, "d": 2, "age": 21.81, "grav": 300.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.856, "fa": 0.0, "gp": 0.68, "bl": 0.95, "ds": 0.0, "txt": "They develop interactive computer experiences.\n\nThere already exist specific terms for what you mean; programmer, coder; \"developer\" is not an IT exclusive term and is used elsewhere.\n\nThe irony of giving English semantics lessons to a .co.uk user with \"desktop\" and \"web\" developer in their profile; clear demonstration they know this already."}, {"id": 50629468, "au": "gambiting", "dom": 129, "sr": 151, "sc": 2.82, "ep": 2.82, "bs": 0.0, "d": 2, "age": 11.34, "grav": 106.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 32097, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.199, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What an insane statement to make. There are countless examples of this being true - perhaps my favourite one being that PSP was one of the best selling portable consoles of all time, and software sales for it were abysmal. And I'm pretty sure it's not because all those kids were using their PSPs to play MP3s. Most of my friends at school had a PSP but I don't remember anyone owning any actual UMD games, it was ridiculously easy to just copy games to the memory stick and play once the battery hack was released. To so confidently say \"piracy has never had a significant impact on game sales\" is ignorant beyond absurd."}, {"id": 50629653, "au": "lo_zamoyski", "dom": 256, "sr": 152, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 3, "age": 11.15, "grav": 103.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 209, "qw": 0, "k": 2050, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.787, "fa": 0.28, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "On the one hand, yes, a for-profit corporation's is not charity. It may give to charity, its employees may give to charity, but its mission isn't charitable per se. Clarity of mission is important in all things lest our energies become diffused, distracted, and diluted to the point of becoming fruitless.\n\nOn the other hand, while a corporate body does not possess agency or moral responsibility in the manner an individual moral agent does - that much is true and that has to be understood consistently - a corporate body is nonetheless bound by moral laws and the demands of justice. Not only is a corporate body operating solely according to considerations of profit without any moral restraint and direction a disordered corporate body (and one that nudges people into at least remote complicity, if not culpability), the very decision to make a corporate body centered on profit without moral restraint is itself a moral evil.\n\nSo, corporations have a moral obligation to observe the demands of justice and to subordinate their activity to the common good and the ultimate end of human life. to the degree that a corporation deviates from these, it is a defective corporation and one that is inflicting harm no just on the common good, but on its employees by frustrating their attainment of the good."}, {"id": 50629841, "au": "zetanor", "dom": 336, "sr": 153, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 10.94, "grav": 100.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 914, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "This golden rule is a joke, anyway. Treating others how you want to be treated rapidly becomes learned helplessness against some (most?) people. The default mode of life is to take everything, and there's a lot of stock firmware running around.\n\nThis is only truer when the other \"person\" has a stock ticker, but it's not exclusive to them."}, {"id": 50631301, "au": "100percentjake", "dom": 466, "sr": 154, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 9.39, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 179, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.782, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Which games did you work on? The original Hot Pursuit 2/UG2/MW were of course my favorites in their day, Hot Pursuit 2010 was another high point as a return to the 90s arcade gameplay with an extremely casual playstyle I wish would make a return, and I have enjoyed the portion of Heat that  I've played (I basically played until I was able to build a recreation of my IRL F87 M2 and then haven't touched the game since for some reason)."}, {"id": 50630199, "au": "simonklitj", "dom": 45, "sr": 155, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 6, "age": 10.55, "grav": 95.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 476, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 1.107, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "If I buy a book, I can cut out and rearrange the words however I want, I can re-bind it. And, I can tell others how I cut out my book, so that they can do the same with their book.\n\nSurely, the above is analogous (at least in an ethical sense) to this situation?"}, {"id": 50632866, "au": "throwaway2037", "dom": 368, "sr": 156, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 3, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "t
