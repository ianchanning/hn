0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 121, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I saw nobody mention the project was banned. Or that it was while he was actively in class and couldn't merge any PRs.\n\nBrilliant timing on the part of Rockstar, I must say, much harder to fork now."}, {"id": 50625242, "au": "foxrider", "dom": 569, "sr": 160, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 3, "age": 18.42, "grav": 228.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 414, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.078, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "No, no, this relies on your ability to extract the game from the Xbox. The fact that a build was leaked is irrelevant, this port itself doesn't really give you a way to get these files. It's the same dumb argument that Nintendo used with Switch emulation - me modding my switch to dump my prod.keys is completely irrelevant to the emulator development."}, {"id": 50632915, "au": "I_Am_Nous", "dom": 18, "sr": 161, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 4, "age": 7.55, "grav": 58.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 1318, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.154, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The EULA is a non-starter anyway. You HAVE to accept the terms to use the software, it almost doesn't matter what it says. There have been legal cases of EULAs being unenforceable because the terms were shown to be something a reasonable person would never agree to, and them not reading the EULA didn't make the EULA enforceable even if they clicked accept. This is almost never the case anymore, but then you get stuff like Disney+ users being forced into arbitration when injured at a Disney park because that was part of the Disney+ EULA.\n\nYour only choice is to just not use the software, and that's no choice at all."}, {"id": 50625197, "au": "foxrider", "dom": 213, "sr": 162, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 1, "age": 18.51, "grav": 230.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 414, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.388, "fa": 0.34, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "What's insulting is even on PS5 Pro this game runs at less than 30FPS. So you can imagine people who really like it would run to buy it on the eventual PS6, just like they did with TotK on Switch/Switch 2"}, {"id": 50635259, "au": "max_streese", "dom": 500, "sr": 163, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 2, "age": 4.81, "grav": 31.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 73, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why? Because from your point of view my position is going against some sort of hacker ethos?\n\nI don't know, but from where I stand LLM created reverse engineered copies of games that I fear will devalue human creation and might usher in some sort of \"all media is created by AI\" dystopia does not seem very well aligned with that.\n\nOr put in another way: Are we really thinking that we are all tinkering here and learning wonderful things about how things function and passing the knowledge? Or are we just telling the LLM to clone and make no mistakes so we can play a game we believe we have some sort of right to have been released on PC already and if not its evil companies own fault? That just seems like moral bankruptcy to me."}, {"id": 50631249, "au": "nickludlam", "dom": 553, "sr": 164, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 2, "age": 9.44, "grav": 80.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 16, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.038, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "It looks like most of the reverse engineering efforts and build process are implemented in Python. Check the `tools/` folder."}, {"id": 50629849, "au": "K0IN", "dom": 239, "sr": 165, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 0, "age": 10.93, "grav": 100.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 219, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.656, "fa": 0.0, "gp": 0.755, "bl": 0.0, "ds": 0.0, "txt": "Also I heared that the discord was wiped and users that joined there were banned on discord."}, {"id": 50635256, "au": "palata", "dom": 304, "sr": 166, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 5, "age": 4.82, "grav": 31.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.109, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Or, simply, we say that it's okay to do whatever you want with the game as long as you bought it and don't redistribute it.\n\nIt is NOT okay to buy the game, make copies and resell them.\n\nIt is NOT okay to reverse engineer the game, make it work on PC and sell that version.\n\nIt is OKAY to buy the game and never play.\n\nIt is OKAY to buy the game, reverse engineer it and play on your PC.\n\nThe problem is not the \"reverse engineering\" part, the problem is whether or not you resell something you don't own."}, {"id": 50627756, "au": "TeMPOraL", "dom": 161, "sr": 167, "sc": 2.61, "ep": 2.87, "bs": 0.27, "d": 1, "age": 13.38, "grav": 136.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.547, "fa": 0.28, "gp": 0.543, "bl": 0.1, "ds": 0.0, "txt": "I hope they'll try now and lose. A precedent would be nice right now, to remove the motivation for currently ongoing, proactive attempts of the AI labs to nerf RE capabilities."}, {"id": 50630886, "au": "ApolloFortyNine", "dom": 427, "sr": 168, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 4, "age": 9.81, "grav": 85.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 23, "k": 4727, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.599, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Yet Cyberpunk 2077 still made enough money to cover its development expenses pretty much instantly and have a 1000+ people company stay around six years later.\n\nWe're not talking about if a company can't still make a profit even if X people who would have bought their game if they couldn't pirate it, pirated it.\n\nWe're talking about how big X is and how big X can get.\n\nHelps too when a large percentage of your audience is on console."}, {"id": 50628849, "au": "dpz", "dom": 381, "sr": 169, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 1, "age": 12.06, "grav": 116.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 98, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.774, "fa": 0.0, "gp": 0.535, "bl": 0.0, "ds": 0.0, "txt": "Because they continue to keep doing it. The world in its current states doesn't reward people for being ethical and doesn't punish people for being not. If they're using the same tools to negatively impact individuals it's about time for the individuals to fight back."}, {"id": 50630183, "au": "tracerbulletx", "dom": 343, "sr": 170, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 3, "age": 10.57, "grav": 95.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 4510, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "What im saying is that if you make a game you can set the license terms. You don't deserve to do whatever you want with it. Restricting it to specific platforms is part of the monetization strategy. 2 billion or written at home by one guy spending his time is not the point."}, {"id": 50631124, "au": "jmuguy", "dom": 187, "sr": 171, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 0, "age": 9.57, "grav": 82.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 3043, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.716, "fa": 0.0, "gp": 0.604, "bl": 0.0, "ds": 0.0, "txt": "I really can't stand the entitlement around this.  Justifying why this is not only OK to do but actually is a good thing because XYZ reasoning.  People have been pirating media forever.  At no point were we out here patting ourselves on the back about it, that we deserved all these things for free."}, {"id": 50627684, "au": "eppp", "dom": 136, "sr": 172, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 3, "age": 13.47, "grav": 138.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 792, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.747, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Suppose it was impossible to pirate there, would the sales increase more than marginally in a country like that? I doubt it. So therefore it has little effect in the end."}, {"id": 50631268, "au": "weli", "dom": 41, "sr": 173, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 8, "age": 9.42, "grav": 80.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 857, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.604, "fa": 0.0, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "That's not how law works. Your platform policies don't supersede consumer rights. You can't put a notice in front of a book saying \"If you buy this book you agree with never being able to quote any part of it\". This is effectively a no-op from the perspective of the law and any court will agree. You are still entitled to your rights, and you can't sign them away."}, {"id": 50625213, "au": "foxrider", "dom": 594, "sr": 174, "sc": 2.49, "ep": 2.49, "bs": 0.0, "d": 2, "age": 18.48, "grav": 229.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 414, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.061, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Haha, yeah, it is weighted towards the right holders, unless you're an AI company pirating things to train on. Let's be real, it's weighted towards deeper pockets. Every YouTuber can attest to that."}, {"id": 50630369, "au": "akramachamarei", "dom": 7, "sr": 175, "sc": 2.47, "ep": 3.66, "bs": 1.19, "d": 1, "age": 10.38, "grav": 92.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 10, "k": 134, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.955, "fa": 0.42, "gp": 0.149, "bl": 0.45, "ds": 0.0, "txt": "> I'm not happy to lock in to a 500€+ console I do not own\n\nIgnoring the strange use of the term \"lock in\", what console is available for sale today for which the limited license offers a noticeably different experience than \"true\" ownership?"}, {"id": 50627833, "au": "spwa4", "dom": 557, "sr": 176, "sc": 2.46, "ep": 2.46, "bs": 0.0, "d": 2, "age": 13.27, "grav": 135.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1214, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 1.046, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Because it's just github doing this?\n\nOr because there is no way any court will take a position against either billionaire company? And this would seem to be a direct choice: either AI outputs are copyrighted by the people who owned a copyright to the inputs or you can \"decopyright\" things be rapidly reverse engineering them using AI ...\n\nEither way some billionaires are losing an income stream."}, {"id": 50632397, "au": "gosub100", "dom": 484, "sr": 177, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 1, "age": 8.13, "grav": 64.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 11, "k": 1286, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.396, "fa": 0.42, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "> 1000s of people have worked on this game for over 10 years.\n\nAnd they got paid. They don't each get a piece of the revenue stream after launch, nor do they have to pay back their salaries if someone copies the game. Nor did they forego salaries until the game was sold. They are square."}, {"id": 50632038, "au": "EcommerceFlow", "dom": 441, "sr": 178, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 2, "age": 8.5, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 489, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.457, "fa": 0.34, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "Not true, World of Goo devs said they estimated around a 90% piracy rate. If offered, it will get mass pirated."}, {"id": 50631039, "au": "lou1306", "dom": 346, "sr": 179, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 3, "age": 9.65, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 2415, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 1.007, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well recomp is almost certainly an usage of a binary artifact that's outside of its license. Calling it piracy is all but far-fetched."}, {"id": 50631726, "au": "mikhmha", "dom": 95, "sr": 180, "sc": 2.36, "ep": 2.36, "bs": 0.0, "d": 2, "age": 8.84, "grav": 72.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 292, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "Thank you! I've been following the progress and feel like I'm taking crazy pills. I'm not saying they will be unsuccessful, but I have major doubts. It's a bunch of amateurs who don't know what they are doing. It's also hard to get any actual technical info on what they have working. There is a lot of younger people (or ESL?) who gas up the progress and make hype statements. Then you look into it and realize its non-technical folks hyping up very basic things. Yesterday they were going nuts because the 15 year old kid was able to boot the \"intro\" which is just a static bink file bundled with the game data.\n\nThe group that would have the easiest time recomping the game is Rockstar themselves. There is nothing stopping them from doing it. They could DMCA any working recomps to oblivion while quickly putting out a PC release if they wanted to."}, {"id": 50631219, "au": "skinfaxi", "dom": 434, "sr": 181, "sc": 2.36, "ep": 3.21, "bs": 0.85, "d": 5, "age": 9.47, "grav": 80.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1260, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.87, "fa": 0.34, "gp": 0.133, "bl": 0.32, "ds": 0.0, "txt": "It's too bad steam doesn't show a breakdown by purchase price. I've bought several AAA games on deep discount (like $5) that I've not played."}, {"id": 50631776, "au": "Geof25", "dom": 543, "sr": 182, "sc": 2.35, "ep": 3.2, "bs": 0.85, "d": 3, "age": 8.78, "grav": 72.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 107, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 1.362, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I am not disputing that it is illegal. I am saying that this situation was completely preventable. But instead of providing good service, Rockstar gave bunch of 15 year old kids a comically huge motivation to get it running and maybe learn something along the way."}, {"id": 50629518, "au": "adammarples", "dom": 53, "sr": 183, "sc": 2.35, "ep": 2.35, "bs": 0.0, "d": 5, "age": 11.3, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47 orally grey. Make it so the people that created the game get a cut out of it (small), and if they want the majority of profits let them port it and release it themselves.\n\nI'm sure the big studios would still hate this system but in my opinion it would benefit the consumer while still getting the people who made the systems paid, and it encourages an open ecosystem."}, {"id": 50630319, "au": "bathtub365", "dom": 224, "sr": 221, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 4, "age": 10.44, "grav": 93.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 2066, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.341, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It doesn’t struggle to hold 30fps on PS5 Pro. I also don’t understand how it’s “insulting”. Maybe disappointing, sure"}, {"id": 50629071, "au": "Mindwipe", "dom": 225, "sr": 222, "sc": 1.76, "ep": 1.76, "bs": 0.0, "d": 4, "age": 11.8, "grav": 112.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 8, "k": 1589, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.337, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> I believe it can hit that on the Xbox.\n\nYou can glitch it to try and run at 60fps, but it generally only achieves about 34 - 35 with significant drops from that."}, {"id": 50631400, "au": "_3u10", "dom": 415, "sr": 223, "sc": 1.75, "ep": 1.75, "bs": 0.0, "d": 1, "age": 9.26, "grav": 78.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 12682, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.625, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "It’s not ethics, it’s legality. Copyright is a legal framework r": 235, "sc": 1.49, "ep": 1.49, "bs": 0.0, "d": 2, "age": 9.32, "grav": 78.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 4254, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.635, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The golden rule is not useful day to day because you can make it give any answer you want by just adding context.\n\nShould I cheat someone?  Well I would not want to be cheated, so I shouldn't cheat someone.\n\nShould I cheat someone who cheated me previously?  Well if I cheated and harmed someone, I would feel guilty, and I would feel a bit better if they cheated and harmed me back, as long as they didn't hurt me too much.\n\nSo the golden rule tells me to go ahead and cheat and harm someone back, but proportionally, and only if I have a conscience.  Oddly enough the golden rule tells a sociopath that they are not allowed to cheat and harm someone back!  You can dial it in to say whatever you want or the opposite.\n\nThe golden rule is something you use to help a 4 year old learn to act with empathy.  It is not a way to reason through the ethical implications of grown up situations."}, {"id": 50625047, "au": "hypfer", "dom": 563, "sr": 236, "sc": 1.48, "ep": 2.01, "bs": 0.53, "d": 4, "age": 18.82, "grav": 236.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 3107, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.632, "fa": 0.0, "gp": 0.36, "bl": 0.2, "ds": 0.0, "txt": "I think it actually is more often than not?\n\nBut beside that, law is just trying to capture our understanding of ethics and formalizing it, and it is pretty obvious here that the goals aren't necessarily ethical.\n\nIt is of course also true that the whole system of corporate power isn't ethical either, but if we want them to be held to standards, we first need to kinda acknowledge that these standards exist even when they paint us in a worse light than we'd want it to be."}, {"id": 50631310, "au": "mistercheph", "dom": 364, "sr": 237, "sc": 1.48, "ep": 1.48, "bs": 0.0, "d": 2, "age": 9.38, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 744, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.628, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Nah, I'm want to train my model on it, i dont care about who paid them sounds like good lucks to t hem, im training booger 5.8, dont stand in the way of process ya ludd"}, {"id": 50629996, "au": "collingreen", "dom": 382, "sr": 238, "sc": 1.47, "ep": 1.47, "bs": 0.0, "d": 2, "age": 10.78, "grav": 98.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 2174, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.627, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Has the world really changed though?\n\nI think its important to recognize that \"fighting back\" can be \"sinking to their level\" and giving up on good behavior or it can \"doing the right thing\" and working on our shared governance to reduce abuse. The self righteous one is easy and feels vindicating but I'm not sure it is the responsible choice aligned with the values of someone wanting a more ethical system."}, {"id": 50635273, "au": "Wowfunhappy", "dom": 275, "sr": 239, "sc": 1.47, "ep": 1.47, "bs": 0.0, "d": 2, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 31971, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": if I was selling games, I wouldn't be upset by someone making a tool to run the game on unsupported platforms. That doesn't seem likely to cost me many, if any sales.\n\nI might be compelled by an exclusivity deal to try to stop them from doing that, but I wouldn't see it as bad in the golden rule sense."}, {"id": 50633233, "au": "hiccuphippo", "dom": 445, "sr": 243, "sc": 1.36, "ep": 1.36, "bs": 0.0, "d": 3, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2247, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.492, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Game companies (ab)use FOMO to make money all the time. Why doesn't it matter now that it's about them not making money?\n\nThey should feel the FOMO and release the PC version now."}, {"id": 50631497, "au": "jooops1", "dom": 349, "sr": 244, "sc": 1.36, "ep": 1.36, "bs": 0.0, "d": 2, "age": 9.14, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 75, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.503, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "If you have that many talented people involved is It acceptable to deny them a large part of their actual audience, by restricting the game to console only, with those hardware prices? Personally as a programmer I don't like building software only for elites."}, {"id": 50631156, "au": "badsectoracula", "dom": 428, "sr": 245, "sc": 1.34, "ep": 2.19, "bs": 0.85, "d": 5, "age": 9.53, "grav": 81.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 8824, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.932, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "And my point is that despite being incredibly easy it doesn't matter because people will still prefer to buy the game[0] so even if the real X is smaller than the hypothetically maximized X if all stars are aligned, it is still more than large enough to not matter.\n\n[0] for a variety of reasons, including convenience and socials"}, {"id": 50636928, "au": "fooqux", "dom": 513, "sr": 246, "sc": 1.34, "ep": 2.19, "bs": 0.85, "d": 3, "age": 2.04, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 4493, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.932, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I feel the same. The fact that generative AI was trained on everything from our answers freely given on Stack Overflow, to our books, photographs, FOSS code, and everything in-between really tarnishes my taint. I think the worst part for me is that they took the last bit remaining on the internet that was wholesome and good (all the information we share with each other just to help uplift others) and found a way to feed it into the capitalism coal-burner and turn it against the very people whose works fueled it without permission.\n\nWith all that said, I find it hard to blame people too much about using AI to RE non-free software.\n\nAm I sad that white collar workers at Rockstar are potentially going to be hurt by this? Of course. But they're no different than any other SWE being potentially replaced by AI. I don't get much freelance work any more for the same reason that they most likely won't be  working on GTA7, if it ever materializes. It's just another facet."}, {"id": 50630162, "au": "sorrywhat", "dom": 122, "sr": 247, "sc": 1.34, "ep": 1.34, "bs": 0.0, "d": 2, "age": 10.59, "grav": 95.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 39, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.57, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's more than enough players who are neither going to buy a console nor download a sketchy vibeslop port.\n\nR* won't just leave billions of dollars on the table, especially with the vastly reduced costs of porting the game."}, {"id": 50625088, "au": "__m", "dom": 212, "sr": 248, "sc": 1.32, "ep": 2.52, "bs": 1.19, "d": 0, "age": 18.74, "grav": 234.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 531, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.377, "fa": 0.0, "gp": 1.123, "bl": 0.45, "ds": 0.0, "txt": "People really want to play it on pc, but unfortunately console is much more profitable, especially for live services, so i can understand why pc isn't their highest prio."}, {"id": 50629377, "au": "shrubby", "dom": 404, "sr": 249, "sc": 1.32, "ep": 1.32, "bs": 0.0, "d": 2, "age": 11.44, "grav": 107.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 433, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "treat_rule", "flbl": "Treat & Rule (Golden)", "urls": [], "ig": 0.562, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Did you think about the golden rule in terms of planetary impacts, such as carbon footprint?\n\nWhat other real world impacts have you figured out from living by it?\n\nI'm more of a categorical imperative kind of guy, but golden rule is nice too."}, {"id": 50632728, "au": "superxpro12", "dom": 464, "sr": 250, "sc": 1.32, "ep": 1.32, "bs": 0.0, "d": 1, "age": 7.77, "grav": 60.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 794, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", .85, "d": 5, "age": 4.62, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 250, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.591, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "I have a slightly different view. To me, what you buy when you pay for the game is \"the right to play the game\". It does not have to be this particular copy of the game (back in the days it would have been the CD-ROM or the DVD): if you download the exact same version in torrent and play that version, it's completely fine. If you reverse-engineer it to play on your PC, it's totally fine, too.\n\nIf you don't pay for it (and nobody pays for you, of course), then downloading the game is piracy, whether or not you convince yourself that you were never going to buy it anyway.\n\nOf course, this is harder to enforce for the owners than, say, just making it illegal to do anything other than play the game on your console.\n\nIt's similar with DRMs: If I pay for the Netflix subscription, I should be able to watch it on any TV. But the way Netflix (and all their friends of course) prevent me from copying and distributing the content is with DRM, which means that I have to connect to Netflix from hardware that they trust. But if I managed to break the DRMs and watch Netflix on an unsupported TV, I think it should not be illegal. Actually, I should be able to sell a solution to bypass DRMs (that's fair game), but it should still be illegal to pirate movies. It's just harder to enforce for those people, so they go for what is more profitable for them."}, {"id": 50628649, "au": "geraneum", "dom": 337, "sr": 274, "sc": 0.46, "ep": 1.65, "bs": 1.19, "d": 2, "age": 12.27, "grav": 119.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 2203, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "fa ey didn't harm the rest of the network. Before that, AT&T didn't sell phones. They rented phones, and you couldn't even touch it or replace it or repair it, and it was hard wired to the wall, no jack.\n\nWe did the same with railroads over a century ago, forcing them to allow rail traffic from competitors to crush \"network effects\" that would otherwise create uncompetitive situations.\n\nCompare that to the post DMCA world where even decrypting a string in a binary is a crime now.\n\nWe used to live in a world where you could carefully clone IBM's fucking product in your garage and become a giant company, where trying to build walls caused the government to declare your walls meaningless, and your investment "}, {"id": 50637260, "au": "phoghed", "dom": 31, "sr": 335, "sc": -0.64, "ep": 0.55, "bs": 1.19, "d": 4, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 1048, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.233, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Then the consoles should sell just fine and survive and all that even without a PC delay"}, {"id": 50631796, "au": "sebzim4500", "dom": 457, "sr": 336, "sc": -0.66, "ep": 2.39, "bs": 3.05, "d": 6, "age": 8.76, "grav": 72.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 6803, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.11, "fa": 0.68, "gp": 0.13, "bl": 1.15, "ds": 0.0, "txt": "Most of the $2 billion will have been spent much more recently than 2013"}, {"id": 50631639, "au": "itsdesmond", "dom": 386, "sr": 337, "sc": -0.67, "ep": 0.92, "bs": 1.59, "d": 2, "age": 8.95, "grav": 74.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 360, "kpp": 3.6, "td": 0.0, "mod":  94.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 219, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 1, "tier": "meme_or_snark", "facet": "game_play", "flbl": "Game & Play (Console)", "urls": [], "ig": 0.371, "fa": 0.0, "gp": 0.144, "bl": 1.65, "ds": 0.0, "txt": "Idk, if I go buy a baguette and use it to paint my house no one forbid me that, why can't I buy the game, and use the files to run it on my PC?"}, {"id": 50629640, "au": "parineum", "dom": 257, "sr": 407, "sc": -3.3, "ep": 1.86, "bs": 5.17, "d": 3, "age": 11.17, "grav": 103.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 210, "qw": 0, "k": 2550, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.46, "fa": 0.0, "gp": 0.54, "bl": 1.95, "ds": 0.0, "txt": "All of these \"evil\" quotes about profits are taken out of their context reframed by people who don't understand the framework for what profits represent in these quotes.\n\nThe whole point of capitalism is that profits are gained by serving people better than the next guy. In that vein, increasing profits means increasing public utility. Blocking laws because they would harm profits then represents a collective pushback from the group of people who appreciate whatever service is being provided for their money against the people who would curb that service.\n\nThe function of capitalism is to redirect the fundamental greed of people and align it with public good. The role of regulation in free market capitalism is to ensure that alignment. Where that alignment is out of wack, Milton Friedman would hold that the market is not free or perverted in some way.\n\nIf some company is profiting by reducing consumer utility and customers don't have recourse (monopolies, for example), that's a failure of government to protect the free market. Despite the strawman usually created in the conversations, the government regulation does play a role in keeping the market free. The general anti-regulation sentiment from the free market types comes where regulation curbs the free market (like zoning or occupational licensing, for example)."}, {"id": 50632959, "au": "joquarky", "dom": 301, "sr": 408, "sc": -3.32, "ep": 0.92, "bs": 4.24, "d": 3, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 15, "qw": 0, "k": 1128, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.393, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Exclusivity is one of the main problems caused by the current implementation of copyright laws"}, {"id": 50629391, "au": "devsda", "dom": 320, "sr": 409, "sc": -3.32, "ep": 1.84, "bs": 5.17, "d": 4, "age": 11.42, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2517, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.67, "fa": 0.0, "gp": 0.186, "bl": 1.95, "ds": 0.0, "txt": "The one poking eyes will eventually run out of eyes to poke if it is tolerated outside and within their own group. The world will still turn blind in the end.\n\nIf there is cost and consequence to poking, there is a good chance that it will reach an equilibrium point when everyone involved realizes the true cost of action and/or  inaction."}, {"id": 50628986, "au": "whamlastxmas", "dom": 379, "sr": 410, "sc": -3.34, "ep": 1.82, "bs": 5.17, "d": 3, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2818, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.776, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Why is it morally acceptable t  "meme": 0, "tier": "bullshit_or_flamewar", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 0.119, "bl": 3.9, "ds": 0.0, "txt": "This is, sadly, one of those silly clichés or \"deepities\" that pretend to a wisdom that they don't possess.\n\nUltimately, it shows a lack of understand of lex talionis. \"An eye for an eye\" does not mean inflicting harm on just anyone or by just anybody, nor does it endorse endless cycles of personal vengeance or vendettas. Instead, it means lawful authorities should inflict harms on wrongdoers specifically, proportional to the harms they inflicted on the innocent.\n\nThe cliché simply fails to distinguish between crime and punishment, and the meaning of an act in relation to justice. Because lawful authorities punishing the guilty are acting justly rather than committing a crime, punishing a wrongdoer does not make the authority a new target for retaliation.\n\nSo, yes, inflicting proportional harms on wrongdoers would leave all wrongdoers proportionally harmed. That's the point."}, {"id": 50628972, "au": "f6v", "dom": 109, "sr": 533, "sc": -8.04, "ep": 0.57, "bs": 8.61, "d": 2, "age": 11.92, "grav": 114.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 0, "k": 3723, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.242, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "It's not just Russia, it's regional pricing in general."}, {"id": 50630978, "au": "shrubby", "dom": 299, "sr": 534, "sc": -8.07, "ep": 1.47, "bs": 9.54, "d": 4, "age": 9.72, "grav": 83.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 433, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 1, "tier": "meme_or_snark", "facet": "developers_gta", "flbl": "Developers & Gta (Game)", "urls": [], "ig": 0.624, "fa": 0.0, "gp": 0.0, "bl": 3.6, "ds": 0.0, "txt": " : 0, "lu": 0, "w": 107, "qw": 0, "k": 4007, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "It’s a very interesting point. Indeed, the New Testament is very strict. It has fewer commandments, but the “love your neighbor as yourself” is a hard one indeed. It’s just hard to do that each and every day for each and every one.\n\nAnother rule that was taken away though next to eating was circumcision. Plus all those mandatory days like Passover and less strict Sabbath adherence. Still today, Judaism has 613 strict commandments while New Testament seems to focus a bit more on grace and loving neighbor. But, there is much more to say about the differences. Bible is a very dense book so it’s hard to summarize all nuances here."}, {"id": 50629781, "au": "huijzer", "dom": 279, "sr": 547, "sc": -8.5, "ep": 1.83, "bs": 10.34, "d": 5, "age": 11.0, "grav": 101.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 4007, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "Leviticus 19:18: \"Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I am the LORD.\"\n\nProbably written 1400 BC by Moses. The Bible is consistent. I’ve read the Talmud and it’s not consistent on this message so I find your citing of a Babylonian sage surprising. Jesus did not only say it but also consistently live by this saying."}, {"id": 50632685, "au": "huijzer", "dom": 281, "sr": 548, "sc": -8.52, "ep": 1.82, "bs": 10.34, "d": 7, "age": 7.82, "grav": 61.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 35, "k": 4007, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.441, "fa": 0.0, "gp": 0.54, "bl": 3.9, "ds": 0.0, "txt": "> the early Jesus movement was a sect within Judaism\n\nJesus was Jewish indeed, but the New Testament writes that Jesus fulfilled all the Jewish commandments and then set Christians free from all those.\n\n> Christianity is at its core a Jewish faith.\n\nAccording to the New Testament, Christianity replaces the Jewish fate. In the Old Testament, animals had to die to make the testament. In the New Testament, Jesus died to make the testament.\n\nHebrews 9:16, \"For where a testament is, there must also of necessity be the death of the testator.\"\n\nAbout half of the New Testament is about how opposed Jesus and the disciples were against the Jewish fate, trying to convert Jews to Christianity.\n\n1 Thessalonians 2:14-15, \"... of the Jews: Who both killed the Lord Jesus, and their own prophets, and have persecuted us; and they please not God, and are contrary to all men:\"\n\nGalatians 1:13, \"For ye have heard of my conversation in time past in the Jews' religion, how that beyond measure I persecuted the church of God, and wasted it:\"\n\n> With regards to Hillel the Elder, he was born in Babylon but lived in Jerusalem during the time of Jesus\n\nThat makes it possible he was one of the Pharisees which later caused Jesus to be crucified, so I don't see how that fact makes him sound much better, see 1 Thessalonians 2:14-15."}, {"id": 50634196, "au": "sapphicsnail", "dom": 282, "sr": 549, "sc": -8.68, "ep": 1.66, "bs": 10.34, "d": 8, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 909, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.545, "fa": 0.0, "gp": 0.259, "bl": 3.9, "ds": 0.0, "txt": "There is no monolithic New Testament. The writers often contradict each other and have different views e.g. Paul and the author of Matthew have very different ideas about how Christianity relates to Judaism."}, {"id": 50628744, "au": "huijzer", "dom": 277, "sr": 550, "sc": -8.69, "ep": 1.64, "bs": 10.34, "d": 3, "age": 12.16, "grav": 118.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 8, "k": 4007, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "law_jesus", "flbl": "Law & Jesus (Legal)", "urls": [], "ig": 0.396, "fa": 0.0, "gp": 0.49, "bl": 3.9, "ds": 0.0, "txt": "> Golden Rule is tied with post-conventional moral development\n\nThe golden rule dates back to Jesus, Matthew 7:12, \"Therefore all things whatsoever ye would that men should do to you, do ye even so to them: for this is the law and the prophets.\""}, {"id": 50636811, "au": "palata", "dom": 316, "sr": 551, "sc": -8.72, "ep": 1.53, "bs": 10.26, "d": 11, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 9, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "reverse_software", "flbl": "Reverse & Software (Engineering)", "urls": [], "ig": 0.651, "fa": 0.0, "gp": 0.0, "bl": 3.87, "ds": 0.0, "txt": "If you remove the copyright, it means that selling anything that can trivially be copied won't work. Microsoft won't sell you Excel as a one-time purchase for 100$ if it means that you can go online and resell the exact same Excel for 2$. It obviously doesn't work.\n\nSo what will Microsoft (and the other big players) do? They won't sell you something that can trivially be copied. They will sell you a subscription to their cloud.\n\nWhat will Netflix do? They will use DRMs.\n\nThe big players can already do that. If you remove copyright, you just prevent small players from selling software without selling a subscription to their cloud or using DRMs."}, {"id": 50628305, "au": "philipov", "d /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
