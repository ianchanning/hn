, "age": 5.48, "grav": 37.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 92, "qw": 0, "k": 4250, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": ["https://mitchellt.com/2018/10/23/why-is-55-so-important.html"], "ig": 1.71, "fa": 1.57, "gp": 1.041, "bl": 0.0, "ds": 0.0, "txt": "Well, it killed the chiller for data centers that have liquid cooled racks. Which is good news, 300-350 watts per ton of cooling is better than 1000 watts per ton of cooling from a chiller.\n\n1 ton of cooling = 12,000 BTU/hr = 3.52 kW thermal cooling\n\nAir handlers in every non data center building will continue using chilled water at 45F to 55F (7C to 13C) to maintain a 55F discharge air temp setpoint during cooling.\n\nhttps://mitchellt.com/2018/10/23/why-is-55-so-important.html\n\nThe same set of companies that make chillers are the ones that make dry coolers: Carrier, Daikin, Trane, York (JCI), Liebert (Vertiv)"}, {"id": 50656997, "au": "throw0101c", "dom": 75, "sr": 3, "sc": 8.31, "ep": 8.31, "bs": 0.0, "d": 0, "age": 4.28, "grav": 27.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 33, "qw": 121, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": ["https://www.upsite.com/blog/the-importance-of-mutual-understanding-between-it-and-facilities-part-2-specifying-a1-a2-a3-or-a4-servers/", "https://www.upsite.com/blog/what-you-need-to-know-about-ashraes-fifth-edition-of-thermal-guidelines/", "https://www.ashrae.org/technical-resources/bookstore/datacom-series"], "ig": 1.271, "fa": 1.32, "gp": 1.079, "bl": 0.0, "ds": 0.0, "txt": "ASHRAE TC 9.9, \"Mission Critical Facilities\", members are IT folks, and they have defined a Category/Class \"A4\" that have dry-bulb operating temperatures in the 5-45˚C range:\n\n* https://www.upsite.com/blog/the-importance-of-mutual-underst...\n\nThere's also:\n\n> For those familiar with the liquid cooling guidelines, the most obvious change will be that of the Liquid Cooling class designations. Previously, the classes were designated W1, W2, W3, W4 and W5. Each of those classes had a lower temperature limit of 2°C, while the upper limits were 17°C, 27°C, 32°C, 45°C, and Over 45°C respectively. The deficiency in the original designations didn’t really appear until the debate began over adding a class between 32°C and 45°C.\n\n> […] In the end, due to the need for enhanced flexibility, not to mention making it easier for users to remember what temperature goes with the Class, the 5th Edition redesignated the classes based on their upper temperature limit – therefore the classes are now W17, W27, W32, NEW class W40, W45, and the now named W+.\n\n* https://www.upsite.com/blog/what-you-need-to-know-about-ashr...\n\nSo >35C isn't entirely unknown already.\n\n* https://www.ashrae.org/technical-resources/bookstore/datacom...\n\n* https://greencalculus.com/standards/ashrae-tc-9-9-thermal-gu..."}, {"id": 50658852, "au": "coryrc", "dom": 84, "sr": 4, "sc": 7.6, "ep": 7.6, "bs": 0.0, "d": 2, "age": 1.37, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 126, "qw": 0, "k": 5003, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": ["https://www.seattletimes.com/business/retail/who-doesnt-want-winco-store-to-open-in-north-seattle/"], "ig": 1.661, "fa": 0.9, "gp": 0.783, "bl": 0.0, "ds": 0.0, "txt": "In much of America, you can cheaply stop other people developing their own property by claiming it affects the environment. Here in Seattle, the local labor unions are blocking a grocery store from opening, in a building which used to be a grocery store, by claiming the environmental impact of parking has not been sufficiently measured: https://www.seattletimes.com/business/retail/who-doesnt-want...\n\nSo if anyone anywhere just doesn't want data centers, they'll throw every claim and go with whatever sticks.\n\nOddly, the few immediate claims, like impact from sound levels, they won't support actually writing laws preventing it, because it only affects dozens of people and the rest can't be bothered because it might reduce their leverage in stopping the project, so the immediate neighbors end up getting screwed when projects do get approved..."}, {"id": 50656349, "au": "mschuster91", "dom": 77, "sr": 5, "sc": 6.77, "ep": 6.92, "bs": 0.0, "d": 1, "age": 5.45, "grav": 37.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 24125, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": ["https://www.br.de/nachrichten/bayern/noch-haeufig-ungenutztes-potenzial-abwaerme-von-rechenzentren,V1kyrbM", "https://www.bayern-innovativ.de/emagazin/detail/tu-muenchen-nutzt-abwaerme-aus-rechenzentrum"], "ig": 1.547, "fa": 0.62, "gp": 1.045, "bl": 0.0, "ds": 0.0, "txt": "Evaporative cooling seems to be some American nonsense.\n\nHere in Europe, the only things using evaporative cooling are large power plants and industrial processes needing to shed a lot of heat. Everything else is either using pure air cooling, cooling based on a nearby river, or in extremely modern/research projects, dump their excess heat into district heating systems [1][2].\n\nFor me as a German, reading about Americans complain about water usage for datacenters was a real culture shock.\n\n[1] https://www.br.de/nachrichten/bayern/noch-haeufig-ungenutzte...\n\n[2] https://www.bayern-innovativ.de/emagazin/detail/tu-muenchen-..."}, {"id": 50656533, "au": "maeln", "dom": 78, "sr": 6, "sc": 6.53, "ep": 6.82, "bs": 0.0, "d": 2, "age": 5.12, "grav": 34.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 8, "k": 4883, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.59, "fa": 0.42, "gp": 1.303, "bl": 0.0, "ds": 0.0, "txt": "> Evaporative cooling seems to be some American nonsense.\n\nDon't quote me on that, but I remember OVH proudly advertising their new \"passive\" DC cooling system, which was based on evaporative cooling. The idea of using less energy, but more water was sold as \"green\" a few years back.\n\nA lot of the new DC getting out of the ground in China where also designed with evaporative cooling in mind. It's definitely not an \"american nonsense\".\nWhat is non sensed though is that both China and the U.S are building a lot of their DC designed with evaporative cooling in water stressed region right now. \nWhile it makes sense in terms of cooling (drier air makes evaporative cooling better), I don't think I have to mention the obvious problem of pumping tons of water in dry region."}, {"id": 50658551, "au": "viktorcode", "dom": 1, "sr": 7, "sc": 6.43, "ep": 6.43, "bs": 0.0, "d": 0, "age": 1.86, "grav": 11.4, "surf": 3.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 26, "k": 1970, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.379, "fa": 0.7, "gp": 0.826, "bl": 0.0, "ds": 0.0, "txt": "> We're approaching a point where industry advances are answering many of the objections (the real ones, not the hysterical ones) raised by the anti-data center movement.\n\nAFAIK the main objections are against sharing the electricity bill and tax exemptions in exchange for a paltry amount of jobs created. Does the author classify those as hysterical?\n\nAlso, the existence of technologies does not mean the data center next door will use them. For instance, many can run on closed water loops, but prefer not to, because it is cheaper."}, {"id": 50656335, "au": "ExoticPearTree", "dom": 94, "sr": 8, "sc": 6.13, "ep": 6.13, "bs": 0.0, "d": 0, "age": 5.46, "grav": 37.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 1434, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.642, "fa": 0.34, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "ASHRAE has a maximum inlet temperature of 45 degrees Celsius. You can order Dell servers configured for this in an air-cooled design. I looked at it for places where proper AC is not readily available or best I could is a fan (mostly industrial facilities with close to no IT).\n\nThe Nvidia design is not new, I think here there was a link to a paper a while back discussing the advantages of raising the liquid temperature in liquid-cooled designs.\n\nNow, keep in mind that yes, 45 degrees is quite hot for humans, but if a computer can get to 100 or 150 degrees without cooling, those 45 degrees make the liquid temperature quite cold.\n\nAs a parallel, think of the fact that car cooling is done at 90 degrees Celsius. Too hot for humans, but very cool for engines."}, {"id": 50656955, "au": "KaiserPro", "dom": 96, "sr": 9, "sc": 5.98, "ep": 5.98, "bs": 0.0, "d": 1, "age": 4.34, "grav": 27.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 16739, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.411, "fa": 0.56, "gp": 0.737, "bl": 0.0, "ds": 0.0, "txt": "Depends on the datacentre.\n\nfor \"traditional\" datacenters, its up to half. Ie you put in one megawatt and then spend a megawatt to move that heat outside. (although its never quite that bad, you need to spec it for the hottest day in that area + 10%)\n\nIf you use evaporative cooling, then you cut your cooling bill significantly (ie top up chillers plus cooling loop pumps)"}, {"id": 50657597, "au": "swed420", "dom": 40, "sr": 10, "sc": 5.97, "ep": 5.97, "bs": 0.0, "d": 5, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 718, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.788, "fa": 0.28, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "I've seen subcomponents to the energy concern:\n\n- Grid upgrade costs provoked by building DCs raises utility costs for small-time consumers\n\n- Adding heat to an already overheating planet\n\nNoise seems like a valid complaint if the area is used to peace and quiet.\n\nThere's also a lingering anxiety about mass unemployment, since at this stage almost everybody knows someone who's been laid off and struggles to find work among an increasing pool of unemployed people. Talk of massive DC expansions from AI while the job loss topic is ignored makes for poor optics."}, {"id": 50658734, "au": "toomuchtodo", "dom": 54, "sr": 11, "sc": 5.68, "ep": 5.68, "bs": 0.0, "d": 9, "age": 1.54, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 113040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.583, "fa": 0.34, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "There are people who swear by pex, and as a hobbyist enthusiast in the building science domain, I remain wildly allergic to it versus copper (regardless of the cost and labor premium).\n\nIt’s fine if it’s located in an area entirely accessible for the lifetime of the structure for when failure and replacement might occur, but otherwise, it’s pain waiting to fail imho.\n\nAlas, the cost of longtermism mindset (“This is the last time someone will need to touch what I’ve built for the next 100 years, at a minimum”)."}, {"id": 50656894, "au": "bob1029", "dom": 22, "sr": 12, "sc": 5.55, "ep": 5.69, "bs": 0.0, "d": 1, "age": 4.46, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": [], "ig": 1.231, "fa": 0.68, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "Semiconductors are unique in that higher temperatures are sometimes preferable for certain electrical characteristics.\n\nI would worry more about thermal cycling and temperature gradients across the die. A machine that runs at 100% 24/7/365 tends to be pretty reliable."}, {"id": 50656693, "au": "lucaspiller", "dom": 47, "sr": 13, "sc": 5.42, "ep": 5.57, "bs": 0.0, "d": 2, "age": 4.84, "grav": 31.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 4803, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.552, "fa": 0.34, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "My city has district heating which covers around 500k people. The peak output of all the heat plants combined is 239 MW, which is around the same heat output as one or two large data centres.\n\nThere are no power plants in my city, so to generate the heat there are heat plants which burn natural gas, biomass or (if supplies get low) something similar to bunker fuel.\n\nOf course it's seasonal, but I'm sure the cost of getting rid of the excess heat in summer would outweigh the current costs of the system (it's more expensive per kWh than a gas boiler), as well as the environmental benefits from not burning all this stuff near where people live."}, {"id": 50656485, "au": "entrope", "dom": 81, "sr": 14, "sc": 5.3, "ep": 5.74, "bs": 0.0, "d": 2, "age": 5.19, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 248, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": ["https://www.techzine.nl/nieuws/infrastructure/577227/datacenter-voor-microsoft-verbruikt-tot-420-miljoen-liter-industriewater-per-jaar/", "https://www.nrc.nl/nieuws/2026/08/16/nieuw-amerikaans-datacenter-in-amsterdam-verbruikt-veel-meer-drinkwater-dan-de-bedoeling-is-overmacht-zegt-de-bouwer-anders-past-het-niet-a4934490"], "ig": 1.129, "fa": 0.62, "gp": 0.911, "bl": 0.0, "ds": 0.0, "txt": "Some European data centers use evaporative cooling because they got permits long ago, they don't have the physical space for a non-evaporative system, or both.  [1] and [2] (both Dutch, because I happened to go there for spring break this year and saw the coverage then) are two examples.\n\n[1]- https://www.techzine.nl/nieuws/infrastructure/577227/datacen...\n[2]- https://www.nrc.nl/nieuws/2026/08/16/nieuw-amerikaans-datace..."}, {"id": 50659530, "au": "tadfisher", "dom": 34, "sr": 15, "sc": 5.19, "ep": 5.55, "bs": 0.0, "d": 5, "age": 0.37, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 7134, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.596, "fa": 0.28, "gp": 0.694, "bl": 0.0, "ds": 0.0, "txt": "Two points:\n\n- In other parts of the world, public resistance is backed by collective action. American protests are tame and non-violent, so it's cheaper to ignore them until the next election.\n\n- The tradeoff for closed-loop cooling is power use, e.g. chillers. The physics require that additional energy conversion to produce heat which must be rejected upstream of the DC. The most power-efficient form of rejecting heat is to dump it into water and then into the air via cooling towers. I am willing to bet that a non-zero percentage of generating plants in, say, Europe are cooled via this method, because it is the cheapest way to do it!"}, {"id": 50656946, "au": "arghwhat", "dom": 9, "sr": 16, "sc": 4.34, "ep": 4.64, "bs": 0.0, "d": 3, "age": 4.35, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 9034, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.692, "fa": 0.0, "gp": 0.457, "bl": 0.0, "ds": 0.0, "txt": "We strictly speaking never do pure air-cooling in this context.\n\nTraditional water-cooling transfers heat to a fluid, which is then moved to a large radiator to be cooled by air.\n\nTraditional \"air-cooling\" transfers heat to a phase-changing fluid (heat-pipe), which is then moved to a large radiator to be cooled by air.\n\nOnly differences are the type of and amount of fluid, as well as the presence of pumps. Phase-change beat using a fluid as a thermal buffer by quite a bit. The benefit of water is that it's easy to provide massive thermal inertia, and the ability to transfer the heat to a far larger external radiator than could be implemented internally with heat-pipes."}, {"id": 50658875, "au": "imoverclocked", "dom": 5, "sr": 17, "sc": 4.27, "ep": 4.42, "bs": 0.0, "d": 1, "age": 1.34, "grav": 8.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 211, "qw": 0, "k": 2902, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.812, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "This. It goes deeper though. Yes, data centers use a lot of resources but they also enable abuses of power… political as well as energy.\n\nThe rush to put data centers up has created situations where construction of entire nuclear plants are in the plans (~10 year horizon) while the short term goal of energy production is diesel based. Anyone want to wager on the odds that the nuclear plants actually get built? The planned energy production is sometimes in the small percentages of a host countries entire carbon budget.\n\nAs for political abuses, flock cameras are definitely enabled by large data centers and have been in the middle of a lot of surveillance scandals. Large layoffs by AI as well as AI slop in practically every sector of our society make it even less palatable to spend more on data centers.\n\nIt’s not uncommon for me to go shopping and the person at the checkout is bemoaning the computer in front of them. When is the last time you heard someone outside of tech get excited about a new computer? Unless it’s for games or they had none to start with, I find it to be less and less common. Data centers are just an extension of the general malaise we have created as an industry."}, {"id": 50658820, "au": "marginalia_nu", "dom": 71, "sr": 18, "sc": 4.03, "ep": 4.25, "bs": 0.0, "d": 1, "age": 1.41, "grav": 9.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 26393, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.577, "fa": 0.0, "gp": 0.374, "bl": 0.0, "ds": 0.0, "txt": "Shouldn't matter very for this application.  In space you're using blackbody radiation to get rid of excess heat, and that only does meaningful work if you use a heat exchanger first to increase the temperature of the medium on the radiator side (basically same principle as a refrigerator) since the Stefan–Boltzmann law says thermal radiation per area is P∝T^4 (and blackbody radiation is itself pretty anemic unless temperatures are pretty high).\n\nAlso worth noting that only the projected area matters for blackbody radiation so having a convoluted high surface area low volume radiator like we do when air or liquid cooling basically does bupkis."}, {"id": 50657058, "au": "swed420", "dom": 35, "sr": 19, "sc": 4.02, "ep": 4.76, "bs": 0.0, "d": 3, "age": 4.17, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 718, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.44, "fa": 0.28, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "The water argument always seemed like bs engineered by pro-DC people:\n\n1) Disseminate fake or exaggerated concerns about water\n\n2) Uninformed people include them in their anti-DC arguments\n\n3) Point out the antis are wrong about water, and imply their other concerns should be ignored entirely\n\naka \"motte-and-bailey fallacy\" iirc"}, {"id": 50657045, "au": "hdndjsbbs", "dom": 23, "sr": 20, "sc": 3.95, "ep": 4.4, "bs": 0.0, "d": 2, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 210, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": [], "ig": 1.709, "fa": 0.0, "gp": 0.262, "bl": 0.0, "ds": 0.0, "txt": "There is a well-known formula, Black's Equation, which computes mean time to failure for chips caused by electromigration. Temperature is absolutely a factor. In industry it is very common to accelerate MTBF testing by increasing ambient temperature in a heating chamber, because you can predictably calculate MTBF at standard operating temps based on testing at elevated temps.\n\nElectromigration is an unavoidable problem that increases at lower process sizes and higher temperatures. Cutting edge chips at high temps will fail faster without sufficient redundancy designed in."}, {"id": 50656268, "au": "helsinkiandrew", "dom": 6, "sr": 21, "sc": 3.85, "ep": 4.29, "bs": 0.0, "d": 0, "age": 5.59, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 19, "qw": 0, "k": 26254, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": ["https://news.ycombinator.com/item?id=48660178"], "ig": 0.903, "fa": 0.34, "gp": 0.828, "bl": 0.0, "ds": 0.0, "txt": "Discussion on Nvidia blog post (429 comments) https://news.ycombinator.com/item?id=48660178\n\nI wonder if moving from 30-35 to 45 degrees has an impact on component lifespan"}, {"id": 50657847, "au": "hommelix", "dom": 79, "sr": 22, "sc": 3.26, "ep": 3.7, "bs": 0.0, "d": 3, "age": 2.93, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 279, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.488, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "How I remember the passive cooling of OVH, it was only air. The building ventilation shaft was made with larger opening for fresh air at the bottom and a smaller section chimney at the top. The draft due to the hot air speeding at the chimney pulls the cold air at the bottom.\n\nUnfortunately at the Strasbourg DC, there was no flaps to close the air inlet during fire and this lead to the event that turned a few servers into ash."}, {"id": 50659025, "au": "theptip", "dom": 3, "sr": 23, "sc": 3.26, "ep": 3.99, "bs": 0.0, "d": 1, "age": 1.08, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 12410, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.593, "fa": 0.0, "gp": 0.171, "bl": 0.0, "ds": 0.0, "txt": "All this is easily fixable by a government that actually cares. So many commentators (and the markets) freaking out about how DC buildout is going to halt, but when you look at the demands they are easily satisfiable.\n\nIf tax exemptions are off the table, DC operators will just bid higher, including paying a lot more in up-front power commitments, or even just paying off the local communities.\n\nThe profit margins on compute are ludicrously high for the big guys, they can and will pay a lot more into the local community if that’s what’s needed to get approval in ‘27. Like, Anthropic could pay double per MW and still have plenty of margin on their inference operations.\n\nIt’s been a free for all up until now because of the federal government’s “build at all costs” stance, now the blowback has hit, and next the price will be established and the new equilibrium found."}, {"id": 50659066, "au": "tomaskafka", "dom": 98, "sr": 24, "sc": 3.23, "ep": 3.23, "bs": 0.0, "d": 0, "age": 1.01, "grav": 7.3, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2913, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.326, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "Excellent, hyperscalers don’t need to care about climate anymore as ability to work in 45 degrees Celsius means AI will comfortably keep working through human extinction level temperatures just fine.\n\nShareholders in climatized New Zealand bunkers rejoice."}, {"id": 50656869, "au": "teiferer", "dom": 61, "sr": 25, "sc": 2.87, "ep": 3.83, "bs": 0.0, "d": 2, "age": 4.52, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.286, "fa": 0.28, "gp": 0.006, "bl": 0.0, "ds": 0.0, "txt": "District heating is typically a closed loop high pressure system which is not just pute water but has some nasty additives. You then use a heat exchanger in your basement to heat up your hot water coming out of the tap.\n\nBesides, 45C is what needs to go into the data center. What comes out of it is much hotter and you then need to bring it down to 45C. For example by heating your house or your shower water."}, {"id": 50659761, "au": "fakedang", "dom": 4, "sr": 26, "sc": 2.87, "ep": 3.97, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 48, "k": 2685, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.181, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The profit margins on compute are ludicrously high for the big guys, they can and will pay a lot more into the local community if that’s what’s needed to get approval in ‘27. Like, Anthropic could pay double per MW and still have plenty of margin on their inference operations.\n\nAnd yet most of them decide to use aging technology just because it's cheaper and faster to deploy - like Google just chopping down prime forest land in Finland or xAI using fossil-fuel based sources for energy. They could if they wanted to but they won't because money."}, {"id": 50657295, "au": "Waterluvian", "dom": 87, "sr": 27, "sc": 2.62, "ep": 2.84, "bs": 0.0, "d": 0, "age": 3.77, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 54558, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.01, "fa": 0.0, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "Are there any Factorio-like games that treat heat gradients as a kind of spatial resource? Like in some sci fi factory you’ve got an iron smelter pressed right up against your data refinery?"}, {"id": 50656346, "au": "iamniels", "dom": 28, "sr": 28, "sc": 2.57, "ep": 3.89, "bs": 0.0, "d": 0, "age": 5.45, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 215, "kpp": 8.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.387, "fa": 0.0, "gp": 0.436, "bl": 0.0, "ds": 0.0, "txt": "This means that locations where the temperature never comes close to 45C are becoming much more attractive than many of the deserts where many datacenters are being built currently. Not having to pay the CAPEX and OPEX for evaporative cooling is a big difference I imagine.\n\nI have developed water cooled car electronics and there we had to work with 80C coolant with peaks to 105C. And MTBF figures had to be low, so this was a big cost driver for the design."}, {"id": 50657088, "au": "origini", "dom": 102, "sr": 29, "sc": 2.47, "ep": 2.69, "bs": 0.0, "d": 0, "age": 4.12, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 404, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": [], "ig": 1.032, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "I don't get it anyway.\n\nThese DC are big and create a lot of heat. Why is there nothing around them which would take that heat off them?\n\nCan't we even use a heatpump to even take it to make a higher difference for some industries etc.?\n\nSuckerburg even destroyed a CPU based DC to build it up again as a GPU based on. They can build stuff"}, {"id": 50656897, "au": "teiferer", "dom": 63, "sr": 30, "sc": 2.45, "ep": 3.11, "bs": 0.0, "d": 2, "age": 4.46, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.187, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "Not sure if sarcastic or not ..\n\nAlternative is to evaporate the water. Not sure how that is more ethical.\n\nAs an ethically inclined meat eater (i.e. non-vegetarian) I often prefer eating the parts of the animal that are considered \"waste\". Sausages (full of things like intestines, liver etc), skewers with chicken hearts, that kind of stuff. Similar to the hot water, at least you can do sth meaningful with the \"waste\". Arguably more ethical than throwing it away (into which I count biogas generation)."}, {"id": 50656640, "au": "dachris", "dom": 65, "sr": 31, "sc": 2.29, "ep": 3.17, "bs": 0.0, "d": 2, "age": 4.94, "grav": 32.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 514, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.217, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "There was a satire in Germany many years ago where someone sold a filter that would filter out electricity from nuclear power plants.\n\nBusiness opportunity: sell a device that restores the water's pureness by mining bitcoin into your account."}, {"id": 50658752, "au": "fancyfredbot", "dom": 2, "sr": 32, "sc": 2.18, "ep": 3.07, "bs": 0.0, "d": 1, "age": 1.5, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3754, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "This technology is very likely to see widespread adoption because it's much cheaper not to have chillers.\n\nIt should genuinely reduce power required for a given amount of compute which is a good thing. Probably still too much power though.\n\nThe real solution to the tax exemption issues, as well as to electrical bills, is at the ballot box and not at an Nvidia design meeting."}, {"id": 50656824, "au": "lazide", "dom": 13, "sr": 33, "sc": 2.09, "ep": 2.97, "bs": 0.0, "d": 3, "age": 4.62, "grav": 30.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 13049, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": [], "ig": 1.264, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "(Almost) everything chemical, which is at some level almost everything.\n\nElectrical resistance also (generally) increases with temperature, which causes non-linear effects.\n\n(More resistance == more heat, which makes more resistance until the magic smoke comes out, which typically causes a short and resistance drops to zero)\n\nThere are some very weird exceptions, but if you don’t know what they are, it won’t help you."}, {"id": 50658111, "au": "__MatrixMan__", "dom": 57, "sr": 34, "sc": 1.97, "ep": 3.07, "bs": 0.0, "d": 4, "age": 2.51, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I doubt the practice will persist if the future forces us to take carbon capture seriously. Whatever energy you get from burning the trash you're gonna have to spend on  whatever scheme pulls the carbon from the air.  Leaving it as plastic and burying it cuts out the middleman."}, {"id": 50656381, "au": "IndrekR", "dom": 7, "sr": 35, "sc": 1.86, "ep": 2.96, "bs": 0.0, "d": 1, "age": 5.39, "grav": 36.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1961, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 0.908, "fa": 0.0, "gp": 0.571, "bl": 0.0, "ds": 0.0, "txt": "Rule of thumb is that 10 degrees difference makes reactions go, and things fail, twice as fast. This is not exact science, but ballpark is about right."}, {"id": 50658724, "au": "mvc", "dom": 100, "sr": 36, "sc": 1.61, "ep": 2.27, "bs": 0.0, "d": 0, "age": 1.57, "grav": 9.9, "surf": 4.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 812, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mtbf_semiconductors", "flbl": "Mtbf & Semiconductors (Resistance)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.066, "bl": 0.0, "ds": 0.0, "txt": "Glad the computers will continue to be operable when their rampant use makes planet hotter. Are us humans going to get a similar upgrade?"}, {"id": 50656035, "au": "cucumber3732842", "dom": 105, "sr": 37, "sc": 1.56, "ep": 2.66, "bs": 0.0, "d": 0, "age": 6.01, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1088, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Sooooo... downsize everything, still run chillers and have better capex for the same-ish opex?\n\nThere's no inherent reason this has to be a hard cut or that a hard cut to a different cooling architecture will be the right way to go."}, {"id": 50657767, "au": "toomuchtodo", "dom": 52, "sr": 38, "sc": 1.54, "ep": 2.86, "bs": 0.0, "d": 7, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 113040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "hot_degrees", "flbl": "Hot & Degrees (Water)", "urls": [], "ig": 1.217, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Point of use heaters at the inlet are also an option if you’re already installing one at the sink. Think 120V 15-20A resistance heat to heat the water when use starts until hot water from the hot water heater arrives. Is it better or worse than a recirculating pump? Depends, have to model each way."}, {"id": 50656445, "au": "m4rtink", "dom": 83, "sr": 39, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 2, "age": 5.27, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5730, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 1.047, "fa": 0.0, "gp": 0.415, "bl": 0.0, "ds": 0.0, "txt": "It's not just modern stuff - steel works and other heavy industry used process powered district heating for a very long time. In some cases it created problems when the enterprise went bankrupt or fragmented and suddenly the process that is providing the district heating might no longer be running. :P"}, {"id": 50659341, "au": "postalrat", "dom": 72, "sr": 40, "sc": 1.51, "ep": 2.54, "bs": 0.0, "d": 1, "age": 0.61, "grav": 5.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 2816, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I feel the way we get space data centers is to create processing blocks as large as the silicon solar cells. With data moving one way across multiple meters as it is processed."}, {"id": 50656877, "au": "leoedin", "dom": 8, "sr": 41, "sc": 1.5, "ep": 2.82, "bs": 0.0, "d": 2, "age": 4.5, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 6783, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 1.143, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "Is a chip cooled with water at 45C necessarily going to be hotter than a chip cooled by air? I imagine the temperature differentials between chip and coolant on a water cooled setup are much better than the differential between chip and airflow on a typical air cooled setup."}, {"id": 50657644, "au": "leni536", "dom": 91, "sr": 42, "sc": 1.24, "ep": 2.34, "bs": 0.0, "d": 0, "age": 3.22, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 4551, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "heat_power", "flbl": "Heat & Power (Area)", "urls": [], "ig": 0.806, "fa": 0.0, "gp": 0.308, "bl": 0.0, "ds": 0.0, "txt": "I assume this also means more water moved for the same power and target die temperature. I wonder what other engineering considerations follow from that."}, {"id": 50656921, "au": "jfkimmes", "dom": 101, "sr": 43, "sc": 1.16, "ep": 3.15, "bs": 1.99, "d": 0, "age": 4.41, "grav": 28.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 329, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.pangram.com/history/6901a6ab-fc82-40bc-9be6-f67ad970ee0e"], "ig": 0.49, "fa": 0.62, "gp": 0.159, "bl": 0.75, "ds": 0.0, "txt": "Wow, this contains so many AI-isms that it is legitimately hard to read for me. Shocking to see such blatant slop in a journalistic publication (vs. a random blog post).\n\nhttps://www.pangram.com/history/6901a6ab-fc82-40bc-9be6-f67a..."}, {"id": 50656385, "au": "deadbabe", "dom": 62, "sr": 44, "sc": 1.15, "ep": 2.69, "bs": 0.0, "d": 1, "age": 5.38, "grav": 36.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1093, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "People do not want to bathe in your unethical cursed water that was used to cool chips creating AI content trained on stolen data!"}, {"id": 50656900, "au": "InsidiousWombat", "dom": 86, "sr": 45, "sc": 0.98 n't work well in humid climates of course."}, {"id": 50657308, "au": "citrin_ru", "dom": 82, "sr": 52, "sc": 0.69, "ep": 2.23, "bs": 0.0, "d": 2, "age": 3.73, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 8, "k": 2366, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cooling_evaporative", "flbl": "Cooling & Evaporative (Water)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.291, "bl": 0.0, "ds": 0.0, "txt": "> Evaporative cooling seems to be some American nonsense\n\nEvaporative cooling saves energy (compare to A/C like systems with a compressor) so if water is abundant (in some climates it is) it makes sense."}, {"id": 50658729, "au": "shepherdjerred", "dom": 88, "sr": 53, "sc": 0.68, "ep": 1.92, "bs": 0.0, "d": 1, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 19, "qw": 0, "k": 5764, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": ["https://wiki.factorio.com/Aquilo\u0023:~:text=to%20pave%20ice.-,Freezing,-Aquilo%20is%20brutally"], "ig": 0.819, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Factorio has this mechanic in the endgame of its Space Age expansion\n\nhttps://wiki.factorio.com/Aquilo\u0023:~:text=to%20pave%20ice.-,F...\n\nThere's also a similar mechanic for nuclear reactors"}, {"id": 50656270, "au": "samuelknight", "dom": 106, "sr": 54, "sc": 0.66, "ep": 1.9, "bs": 0.0, "d": 1, "age": 5.59, "grav": 38.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 356, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_center", "flbl": "Data & Center (Political)", "urls": [], "ig": 0.81, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No. Similar capex and better opex. Chillers are not very expensive compared to the chips. Data center economics is built around PUE, a ratio of tot /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
