ug": "general_commentary", "label": "General Commentary", "count": 44, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 32}, {"category": "code_repository", "count": 12}, {"category": "github_artifact", "count": 4}, {"category": "low_cred_or_joke", "count": 4}, {"category": "doi_peer_reviewed", "count": 2}, {"category": "primary_technical_doc", "count": 1}], "story_anchors": ["firefox", "browser", "talk", "trynix", "inside", "compiled", "unkernel", "webassembly", "remember", "application", "javascript", "recommend", "faster", "nix", "package", "windows", "love", "single"], "largest_root": {"root_id": 50625806, "author": "glimshe", "slots": 160, "start_dom": 36, "end_dom": 195, "share_pct": 43.7, "top_dom1_age": 12.5, "top_dom1_author": "gbl08ma"}, "buried_cutoff": 110, "rescue_top_k": 73, "ablations": [], "tournament": [], "comments": [{"id": 50630298, "au": "hobofan", "dom": 254, "sr": 1, "sc": 15.17, "ep": 15.17, "bs": 0.0, "d": 4, "age": 8.72, "grav": 71.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 200, "qw": 0, "k": 8361, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": ["https://github.com/EratoLab/erato"], "ig": 2.026, "fa": 3.03, "gp": 1.222, "bl": 0.0, "ds": 0.0, "txt": "Our customers all run that within their own Kubernetes setups. The end users that are using it are the organizations employees (that are typically using it via our self-hosted AI chat platform[0]) with the most common tasks just being file manipulation. So there is a decent trust relationship, but the attack model is more of a typical organization-wide cyberattack one, where this shouldn't pose a weak link.\n\nThe worst case would be that any of the isolation mechanisms significantly fails, and concurrent workers can see each others files, e.g. confidential files inside the company. This should be quite hard in the architecture, and barring a bug in our server code require escape from multiple layers of sandboxing, and beyond that would require coordinating timing with the attack target.\n\nIn terms of stability, if a single worker OOMs, that just leads to it being killed. If you were able to get multiple workers to reach high memory usage, the pod will just be OOM-killed by Kubernetes and restarted.\n\nIt's not perfectly resource-preserving if you are running with a pre-warmed worker, but economically it's still a steal. You get functionality for $10-20 of compute a month for ~1000 employees that you would with many alternative providers pay $5-10 _per user per month_.\n\n[0]: https://github.com/EratoLab/erato"}, {"id": 50626741, "au": "DonHopkins", "dom": 184, "sr": 2, "sc": 13.36, "ep": 16.94, "bs": 3.58, "d": 1, "age": 13.32, "grav": 136.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 1, "w": 443, "qw": 222, "k": 25710, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://github.com/SimHacker/moollm/tree/main/designs/korz", "https://www.youtube.com/watch?v=k2pwJ294r8o", "https://en.wikipedia.org/wiki/Open_Firmware"], "ig": 2.175, "fa": 3.72, "gp": 0.846, "bl": 1.35, "ds": 0.0, "txt": "Mitch Bradley retired and didn't want to ever write a Forth implementation again (after a long line of them like CForth and OpenFirmware) but I talked him into using Claude to write one for the PDP-7, which he went to bed skeptical of, woke up at 7am with some ideas, and finished implementing by noon. Including a turtle graphics library for the Type 340 vector graphics display -- itself an assembler for 340 intructions, written in Forth running on PDP-7 instructions!\n\nHe really enjoyed doing it, I enjoyed building on top of what he did, and it's one of the most elegant implementions of Forth I've seen, as if for decades the PDP-7 has always had a fast lean mean Forth screaming to get out, thanks to its ideal instruction set.\n\nNow thanks to JavaScript's efficient VMs inspired by Self, and Dave Ungar's subsequent ideas about Korz, it runs ridiculously fast on a Korz PDP-7 emulator implemented in TypeScript with a PDP-7 instruction to JavaScript JIT. So does the Korz Apple ][ emulator. Now I'm working on reincarnating my Apple ][ ProDOS 6502 Forth 83 system.\n\nhttps://github.com/SimHacker/moollm/tree/main/designs/korz\n\nForth Day Talks: Mitch Bradley, PDP-7 Forth, Don Hopkins, PDP-7 and Apple ][ Emulator\n\nhttps://www.youtube.com/watch?v=k2pwJ294r8o\n\nhttps://en.wikipedia.org/wiki/Open_Firmware\n\nhttps://en.wikipedia.org/wiki/OpenBIOS\n\nhttps://github.com/mitchbradley\n\nForth Day notes:\n"}, {"id": 50626803, "au": "schmuhblaster", "dom": 265, "sr": 3, "sc": 12.3, "ep": 12.3, "bs": 0.0, "d": 0, "age": 13.21, "grav": 134.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 197, "qw": 0, "k": 304, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://github.com/deepclause/agentvm", "https://github.com/container2wasm/container2wasm"], "ig": 1.874, "fa": 2.08, "gp": 1.355, "bl": 0.0, "ds": 0.0, "txt": "I really like how well the nix philosophy works here and I can see this being very useful for all sorts of agentic work. In my own side-project [0] I just use Alpine and run it in TinyEMU compiled to WASM, as it allows for riskv64, which is a bit faster to interpret than x86. (I built it on top of container2wasm, the maintainer of which - I believe - is also behind the qemu WASM that OP uses).\n\nTruly marvelous times we live in: I am by no means a system programmer or OS expert, but thanks to various coding agents and models I was able to add networking and overlay FS, a frambeuffer and sound.\n\nI wonder what the right approach is though. If the base system is run through an emulator, a lot of things can become unbearably slow for a lot of use cases, but at least as far as my limited understanding goes, a lot more could be achieved if there was more progress on the WASM/WASI standard side. Or maybe syscall emulation is a better way to go here like some comments suggest?\n\n[0] https://github.com/deepclause/agentvm (it wasn't mean to run in a browser, but you can let your favorite agent create a Wasi shim for web within maybe an hour or so...)\n\n[1] https://github.com/container2wasm/container2wasm"}, {"id": 50625900, "au": "rvz", "dom": 258, "sr": 4, "sc": 11.36, "ep": 11.51, "bs": 0.0, "d": 1, "age": 15.23, "grav": 168.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 82, "qw": 0, "k": 10577, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://soft.vub.ac.be/Publications/2022/vub-tr-soft-22-02.pdf", "https://files.usenix.org/s3fs-public/cdn/sec20-lehmann.pdf", "https://bugzilla.mozilla.org/show_bug.cgi?id=2013741"], "ig": 1.42, "fa": 2.35, "gp": 1.015, "bl": 0.0, "ds": 0.0, "txt": "There is no use case and it is only \"because of reasons\".\n\nIn fact, as another commenter correctly said in a thread to me recently, WebAssembly is not the solution to \"sandboxing\" for various reasons, [0] [1] [2] especially when you are still dealing with browser engines that are written in C (QuickJS) and C++ (V8, Gecko) which are regularly targeted for memory corruption vulnerabilities with a kernel written in C (Linux) even when it is compiled to WASM.\n\nThey still bring over the very same C style vulnerabilities with them.\n\n[0] https://soft.vub.ac.be/Publications/2022/vub-tr-soft-22-02.p...\n\n[1] https://files.usenix.org/s3fs-public/cdn/sec20-lehmann.pdf\n\n[2] https://bugzilla.mozilla.org/show_bug.cgi?id=2013741"}, {"id": 50629330, "au": "hobofan", "dom": 252, "sr": 5, "sc": 10.09, "ep": 10.38, "bs": 0.0, "d": 2, "age": 9.77, "grav": 84.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 79, "qw": 0, "k": 8361, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://github.com/EratoLab/code-interpreter-mcp", "https://github.com/pydantic/mcp-run-python"], "ig": 1.337, "fa": 2.06, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "I'm also confused. V8 + Pyodide are perfectly practical, and we built a Python worker MCP on top of it that's used without much pain across many of our customers[0].\n\nI know that the Pydantic folks also built a similar MCP in the past[1] but abandoned it for \"latency\" and security/isolation concerns. All those are pretty easy to remedy with a pool of pre-initialized workers and subprocess isolation. Overall, it's one of the easiest ways to ship an easily on-premise-deployable solution like that.\n\n[0]: https://github.com/EratoLab/code-interpreter-mcp\n\n[1]: https://github.com/pydantic/mcp-run-python"}, {"id": 50626553, "au": "hollowonepl", "dom": 204, "sr": 6, "sc": 9.83, "ep": 9.83, "bs": 0.0, "d": 0, "age": 13.74, "grav": 142.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 280, "qw": 0, "k": 166, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 2.132, "fa": 0.96, "gp": 1.437, "bl": 0.0, "ds": 0.0, "txt": "Yeah, that's fine, everything can be written in everything.\n\nI remember these pitches as early as 2008-10 from various Mozilla evangelists who were pitching that browser will be the OS and javascript will be the platform for all apps.\n\nI kind of doubted it and I still do. Of course a lot of stuff is written in Js.. because web is based on Js. a lot of desktop apps are written in Js (+Electron) because people who are not good at native development (and also platform vendors are not helpful to provide consistent approach to GUI and desktop apps) decided that Js+Electron runtime is best way to write portable apps.\n\nIt works.. but I personally hate each and every desktop app written in Javascript due to the bloat factor measured by its size overhead and performance impact.\n\nPeople write backend/server side applications in Javascript because of NodeJs.. and that's more legit to me, although just one of many fashionable ways to create a web server these days. nothing truly unique outside personal choice and recommendation on per project basis.\n\nSo web in the browser wins (although if somebody invented better way to create client side application without Javascript I'd bless him.. it's such a horrible language). Server side is ok-ish to consider if one likes it... and for true client side apps which belonged to desktop in the past... well actually rust, crystal, nim and all the renais"}, {"id": 50630733, "au": "toomuchtodo", "dom": 27, "sr": 7, "sc": 9.31, "ep": 9.31, "bs": 0.0, "d": 5, "age": 8.24, "grav": 65.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 141, "qw": 0, "k": 113040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://news.ycombinator.com/item?id=50630798", "https://news.ycombinator.com/item?id=39193331", "https://blog.sentinel-team.org/p/special-report-rising-bond-rates"], "ig": 1.595, "fa": 1.57, "gp": 0.748, "bl": 0.0, "ds": 0.0, "txt": "What does current software engineering comp look like versus historical? Keep in mind that it isn't all AI, but also interest rates making money more expensive.\n\nMy humble opinion is that FAANG comp was never sustainable, and that outlier software engineering comp was an artifact of Big Tech's moats and zero interest rate policy. Software engineering comp is now converging towards other white collar work. $200k-$300k/year total comp is probably still doable with a few years of experience, but $500k+ not so much.\n\nThe Distress in the Software Asset Class Is About to Get Worse - https://news.ycombinator.com/item?id=50630798 - November 2026\n\n- \"Software is being hit by a double whammy of AI disruption and rates staying higher for longer.\"\n\nWhat the The end of 0% interest rates means for software engineers  - https://news.ycombinator.com/item?id=39193331 - January 2024 (169 comments)\n\nAre interest rates going to go down in the future? All signs points to no.\n\nhttps://blog.sentinel-team.org/p/special-report-rising-bond-...\n\nhttps://www.ustreasuryyieldcurve.com/"}, {"id": 50630267, "au": "goodmythical", "dom": 41, "sr": 8, "sc": 9.26, "ep": 9.4, "bs": 0.0, "d": 5, "age": 8.74, "grav": 71.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 209, "qw": 29, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.418, "fa": 1.65, "gp": 0.945, "bl": 0.0, "ds": 0.0, "txt": ">Except somehow, every day these models still write the same awful code, make the same mistakes, and apologize profusely when you call them out on the dumbest of errors.\n\nI don't see how that can be as true for you as it was during gpt3.5 days. It may still happen, but there's no way someone is shipping a full translation of ps5/xbox shaders in the days/weeks we've seen those projects complete in the same timeframe during the 3.5 days. At least not without vastly more tokens/compute/spend.\n\nThe same could be said of humans \"Except somehow I still see my direct reports forgetting semi-colons, forgetting to merge, merging to the wrong branch, deleting critical files, submitting with obvious typos...\".\n\nAnd yet here we are succesfully maintaining both more and more complicated software than we were doing 5 years ago.\n\nIt's the same solution in both cases, from what I've seen. You need solid definitions, architecture, testing, benchmarks, etc to measure your agents against regardless of their natural/synthetic origin. If some are having success managing synthetic agents, then there must be some method by which they are doing so in just the same way that there must be some method to a human succesfully managing human agents.\n\nYou can't prompt your average (or really even field leading) humans with \"build a saas try hard make no mistakes\" and expect to check in next quarter to find s"}, {"id": 50630866, "au": "toomuchtodo", "dom": 29, "sr": 9, "sc": 9.08, "ep": 9.44, "bs": 0.0, "d": 7, "age": 8.1, "grav": 64.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 170, "qw": 0, "k": 113040, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://news.ycombinator.com/item?id=50183568"], "ig": 1.647, "fa": 1.57, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "I have ~25 years of experience in technology professionally. No FAANG or Big Tech employment experience (they don't hire high school dropouts). I am a high school dropout, no credentials, all work experience. My first job was a busboy making minimum wage. My first tech job was as a junior sysadmin making ~$45k/year wrangling all of the tech for a web development shop circa 1999-2000. I've made $80k/year at a DOE lab supporting data taking and physics jobs for a detector at the LHC, I've made ~$95k/year working for a YC startup, I've made $200k-$300k/year in large, profitable enterprises, I've made $1M+ some years with my own businesses. My take is that of a scholar of the macro, take it for what it is.\n\nIt sucks when industries change, I deeply empathize, but change is inevitable. Keep riding waves until you're done surfing for cashflow. Those who enjoyed lottery tickets of fantastic comp during zero interest rate policy should enjoy that they paid out. I have no issue with folks who won the lottery, congrats to them.\n\nhttps://news.ycombinator.com/item?id=50183568"}, {"id": 50629015, "au": "gustavus", "dom": 118, "sr": 10, "sc": 8.68, "ep": 9.41, "bs": 0.0, "d": 2, "age": 10.13, "grav": 89.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 12, "k": 1654, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 2.121, "fa": 0.98, "gp": 1.126, "bl": 0.0, "ds": 0.0, "txt": "> So, yes, it would be great if fixing your browser involved actions\nthat were not semantically equivalent to voodoo. But, on the\nbright side, things could always be worse. For example, it\nwould definitely be horrible if your browser’s scripting lan-\nguage combined the prototype-based inheritance of Self, a\nquasi-functional aspect borrowed from LISP, a structured\nsyntax adapted from C, and an aggressively asynchronous\nI/O model that requires elaborate callback chains that span\nmultiple generations of hard-working Americans. OH NO I’VE\nJUST DESCRIBED JAVASCRIPT. What an unpleasant turn\nof events! People were begging for a combination of Self, LISP,\nand C in the same way that the denizens of Middle Earth were\nbegging Saruman to breed Orcs and men to make Uruk-hai.\nOrcs and men were doing a fine job of struggling in their sepa-\nrate communities—creating a new race with the drawbacks of\nboth is not a good way to win popularity contests.\n\n- James Mickens"}, {"id": 50631585, "au": "runjake", "dom": 200, "sr": 11, "sc": 8.49, "ep": 8.49, "bs": 0.0, "d": 3, "age": 7.28, "grav": 55.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 50, "qw": 25, "k": 16544, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://blockedforaireply.com"], "ig": 1.344, "fa": 1.32, "gp": 1.083, "bl": 0.0, "ds": 0.0, "txt": "> Someone with an account should tell him that X is where dead internet theory is most prevalent.\n\nI'd tell him, but that would be a lie. The owner is a jackass, but X is where bunches of tech happens first, including something called \"AI\".\n\n> I don't go on X anymore because it's mostly bots now.\n\n1. If you don't \"go on X anymore\", how do you know it's mostly bots? lol.\n\n2. Why are you following bots?\n\n3. https://blockedforaireply.com plus the new X native blocking tools for replies."}, {"id": 50632106, "au": "budro", "dom": 344, "sr": 12, "sc": 8.45, "ep": 8.45, "bs": 0.0, "d": 0, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 416, "qw": 0, "k": 45, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": ["https://koffi.dev/", "https://blog.codinghorror.com/falling-into-the-pit-of-success/", "https://eslint.style/"], "ig": 2.13, "fa": 0.9, "gp": 0.608, "bl": 0.0, "ds": 0.0, "txt": "JavaScript (even with TypeScript) is the most \"pit of despair\" language I have had the displeasure of working in. I've gone from working on embedded C, to Dart + Flutter (desktop/mobile apps), to now building desktop/CLI apps with TypeScript along with their corresponding packages for interfacing with hardware (mostly custom hardware, some off the shelf).\n\nTo give credit where it's due, I think the FFI works well with Koffi [1]. And it's nice that Node.js has the ability to run `.ts` directly (erasableSyntaxOnly). TypeScript's type system is also really good!\n\nApart from what arguably should be the basics? Nothing has been easy. Unlike Dart which seemed heavily biased towards falling into the pit of success [2], the JS ecosystem seems to be a chasm of despair that is almost unavoidable, even with a huge amount of work (and indeed, billions of dollars has gone into this chasm). In the last three months I've run into friction in:\n- Dependency resolution. Why can you have multiple copies of the same package with different versions??? Just print a dependency resolution error. That's what Dart does, and I imagine it's part of why the dependency culture isn't anywhere near as bad over there.\n- Packaging & Lifecycle script semantics.\n- Semver with monorepos + `git:` dependencies. npm and yarn will resolve semver ranges for the repo using git tags like `v1.0.2`, but they won't consider"}, {"id": 50631775, "au": "titzer", "dom": 9, "sr": 13, "sc": 8.31, "ep": 8.6, "bs": 0.0, "d": 3, "age": 7.04, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 21, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": ["https://dl.acm.org/doi/10.1145/3689031.3717470", "https://github.com/Wasm-Thin-Kernel-Interfaces/WALI"], "ig": 0.318, "fa": 2.35, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": "That's more or less what WALI is. We wrote a research paper about it (https://dl.acm.org/doi/10.1145/3689031.3717470) and there is a toolchain and runtime implementation here: https://github.com/Wasm-Thin-Kernel-Interfaces/WALI"}, {"id": 50625812, "au": "momojo", "dom": 246, "sr": 14, "sc": 7.57, "ep": 8.01, "bs": 0.0, "d": 0, "age": 15.41, "grav": 171.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 60, "qw": 0, "k": 486, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": ["https://news.ycombinator.com/item?id=50533945\u002350598791"], "ig": 1.455, "fa": 0.62, "gp": 1.95, "bl": 0.0, "ds": 0.0, "txt": "I asked on the original unkernel thread[0] but I'll ask again:\n\nWhat do people foresee this being used for? `trynix` is only 1 fork downstream. What's 2 forks away? 3?\n\nThis interests me the way V8 isolates or pyodide originally but I've since learned to curb my enthusiasm bc it always turns out \"oh its not actually realistic to use this in production because...\"\n\n[0] https://news.ycombinator.com/item?id=50533945\u002350598791"}, {"id": 50627382, "au": "ivanjermakov", "dom": 282, "sr": 15, "sc": 7.49, "ep": 7.49, "bs": 0.0, "d": 0, "age": 12.17, "grav": 118.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 3129, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.993, "fa": 0.34, "gp": 1.27, "bl": 0.0, "ds": 0.0, "txt": "Yesterday I was able to compile and run a game I'm making bit-perfect (physics world snapshot is the same) on linux and windows (via wine) cross compiled from the same machine.\n\nI'm happy that it's possible and working, but so confused why this is not something that comes out of the box. A long chain of technical decisions led to the world where a simple game written in C needs to be aware of multiple CPU architectures, OSes, graphics APIs, display servers, sound subsystems to have a chance to work properly on platforms it knows about.\n\nCross platform support is difficult because platforms made it difficult and have no incentive to befriend.\n\nI hope one day we get posix v2 with performant standard APIs to not worry about platforms in application's code. Perhaps 2035?"}, {"id": 50627172, "au": "gbl08ma", "dom": 1, "sr": 16, "sc": 7.49, "ep": 7.93, "bs": 0.0, "d": 0, "age": 12.52, "grav": 123.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 175, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": ["https://waarm64.com"], "ig": 1.505, "fa": 0.62, "gp": 1.809, "bl": 0.0, "ds": 0.0, "txt": "I had been working (read: prompting Claude) on https://waarm64.com for two months and it was slightly heartbreaking to see unkernel get all the attention when I was like two weeks away from a public announcement. It would obviously have been worse if I had actually built more of mine \"by hand,\" but still, even if just doing by orchestration/\"asking good questions to the LLM\" kind of work, I spent probably over a hundred hours on it. I rushed its release, but now I don't even really feel like working much more on mine anymore, even though it achieves (or achieved) better performance than unkernel and (for now) still has a more complete feature set. Oh well, it is in line with the motivation I had for mine, which was to see if LLMs could help one person build that sort of thing. Turns out that not only can LLMs do the bulk of this kind of work, they can do it so well that numerous projects of the same kind are popping up pretty much simultaneously. They still can't make WebAssembly beat hardware virtualization, though :D"}, {"id": 50626877, "au": "Bengalilol", "dom": 308, "sr": 17, "sc": 7.39, "ep": 11.89, "bs": 3.84, "d": 3, "age": 13.04, "grav": 131.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 57, "qw": 0, "k": 652, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://wland.vercel.app", "https://github.com/pithings/wland", "https://github.com/pithings/unkernel/blob/main/web/src/"], "ig": 1.634, "fa": 2.35, "gp": 0.932, "bl": 1.45, "ds": 0.0, "txt": "No, that one uses a custom browser-based Wayland compositor written in Zig/Wasm called wland that renders app windows directly over a web terminal. And the bottom dock is just custom HTML/CSS built into the web page (yet.. that's crazy as is this project).\n\n<https://wland.vercel.app>\n<https://github.com/pithings/wland>\n\n<https://github.com/pithings/unkernel/blob/main/web/src/>\n<https://github.com/pithings/unkernel/blob/main/web/src/compo...>\n\nAs for Linux, I would opt for Hyprland <https://hypr.land> and go down the r/hyprland rabbit hole <https://www.reddit.com/r/hyprland/>"}, {"id": 50625806, "au": "glimshe", "dom": 36, "sr": 18, "sc": 7.23, "ep": 7.89, "bs": 0.0, "d": 0, "age": 15.42, "grav": 171.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 223, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.874, "fa": 0.34, "gp": 1.737, "bl": 0.0, "ds": 0.0, "txt": "Around 5 years into my career, I became a tech lead. Over the following years, I slowly drifted towards roles that had less hands-on technical work and more managerial responsibilities.\n\nI've always struggled with leaving hands-on work behind but what made it at first tolerable, and then a blessing, was the rise of Javascript. I think Javascript is so awful, and until recently so prevalent in the roles available to me, that it made me want to not be a Software Engineer anymore. I felt that Javascript was some sort of joke that stayed around long enough until it became a cancer to Software Engineering.\n\nI only stayed in the profession, eventually as a manager, because I like dealing with people and still found \"human problems\" intellectually challenging and rewarding.\n\nEvery day you read many comments here from people who believe that AI took the fun away from their work and lives. It destroyed the reason that made them want to be Software Engineers. That's exactly how I felt about Javascript.\n\nBut I feel the complete opposite about AI. In fact, AI brought back the fun that was stolen from my life by Javascript. I'm now retired and spend a good amount of my day working my own programming projects. And I'm absolutely happy to vibecode all the Javascript parts (which isn't a lot in my projects) so I don't ever have to see this damn thing in front of me again."}, {"id": 50630621, "au": "willio58", "dom": 139, "sr": 19, "sc": 7.21, "ep": 7.65, "bs": 0.0, "d": 1, "age": 8.35, "grav": 67.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 198, "qw": 27, "k": 4570, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.334, "fa": 1.1, "gp": 0.952, "bl": 0.0, "ds": 0.0, "txt": "> AI brought back the fun that was stolen from my life by Javascript. I'm now retired and spend a good amount of my day working my own programming projects.\n\nThis sounds great. I think there's an anxiety that's hard to express in my role as a 29 year old Engineering Manager still early in my career.\n\nI also have started building again, I've seen the quality of our codebase and delivery increase massively over the past year. But it seems every day there are more demands to \"let go\".\n\nAt first I thought we'd pair program with AI. Had to let go of that, have it code for me. Recently we've had so many PRs stack up we've had to loosen review requirements to 1 reviewer. Yesterday Claude announced Ship, and I gaurantee my bosses are going to push for no reviews on lots of PRs soon.\n\nThing is, I'm fine with this in theory. Even with reduced reviewing the code making it in is better than before. But, this has happened in less than 1 year. What in the actual hell will software dev be like in 20 years? Even then I'd still be 50. Unless I really save my ass off, I'm not retiring at that time.\n\nIn this way, I yearn for the career track so many had over the last 20-30 years. I miss the time when I thought my programming skills were a true differentiator in the market."}, {"id": 50627672, "au": "llm_nerd", "dom": 327, "sr": 20, "sc": 7.08, "ep": 7.96, "bs": 0.0, "d": 3, "age": 11.75, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 4, "k": 4946, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.6, "fa": 0.96, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": ">Nobody ever claimed that?\n\nWritten in meaning shipped in. JavaScript is irrelevant to WASM. They are not interchangeable. It has literally zero relevance to the projects it uses to demonstrate its point.\n\nLike, just a few quotes from the article (some of which are quotes to support the argument)-\n\n\"JavaScript will come to dominate all software.\"\n\n\"inevitability of JavaScript’s dominance\"\n\n\"how JavaScript came to be the defacto language for all software\"\n\nWith an old video about someone saying that eventually we'll compile everything to JavaScript by 2035, ergo 2035 came early. Then trying to twist that such that...well...a browser hosts something, and it also hosts JavaScript, therefore prediction came early!\n\nI, uh...guess."}, {"id": 50626657, "au": "reacharavindh", "dom": 305, "sr": 21, "sc": 6.69, "ep": 7.28, "bs": 0.0, "d": 0, "age": 13.5, "grav": 138.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 7077, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://unkernel.dev"], "ig": 1.398, "fa": 0.62, "gp": 1.536, "bl": 0.0, "ds": 0.0, "txt": "All the obvious amazement aside, I am here wondering what desktop shell is being used at https://unkernel.dev ?\n\nIt looks clean, minimal, transparency/modern, crisp, a superb dock implementation..\n\nI wish I could have _that_ as my regular Linux Desktop..."}, {"id": 50625701, "au": "sheepscreek", "dom": 273, "sr": 22, "sc": 6.56, "ep": 6.56, "bs": 0.0, "d": 0, "age": 15.68, "grav": 176.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": ["https://unkernel.dev"], "ig": 1.164, "fa": 0.62, "gp": 1.421, "bl": 0.0, "ds": 0.0, "txt": "FYI this is a wrapper around https://unkernel.dev which is the OG GOAT.\n\nUPDATE: for context, trynix had been around until unkernel showed up and the author switched to it from qemu."}, {"id": 50626725, "au": "revengerwizard", "dom": 364, "sr": 23, "sc": 6.55, "ep": 7.4, "bs": 0.85, "d": 3, "age": 13.36, "grav": 136.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 51, "qw": 0, "k": 19, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": ["https://revengerwizard.github.io/micro-wasm/"], "ig": 1.547, "fa": 0.9, "gp": 0.826, "bl": 0.32, "ds": 0.0, "txt": "Yea, it's pretty nice for non-demanding 2D games, or even 3D I guess. PICO-8's website for example lets you play carts uploaded directly on the browser.\nI also tried with a simple C pixel framework I made which uses my scripting language and it's pretty cool that it runs all in browser (far from perfect, though): https://revengerwizard.github.io/micro-wasm/"}, {"id": 50625989, "au": "yorwba", "dom": 354, "sr": 24, "sc": 6.31, "ep": 6.53, "bs": 0.0, "d": 1, "age": 15.04, "grav": 164.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 16195, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.363, "fa": 0.68, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "Firefox launched in about 5 minutes (much of which appeared to be spent downloading dependencies) in Firefox for Android on my phone with 8 GB RAM. It didn't react to input, though. Not sure whether that's because the CPU is too slow or simply touch input not being wired up.\n\nCheck the settings to see whether unkernel is supported on your browser."}, {"id": 50628246, "au": "hollowonepl", "dom": 207, "sr": 25, "sc": 6.18, "ep": 7.43, "bs": 0.0, "d": 2, "age": 10.97, "grav": 100.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 485, "qw": 0, "k": 166, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.953, "fa": 0.62, "gp": 0.74, "bl": 0.0, "ds": 0.0, "txt": "I've been there but reverted and I'm escaping the browser unless we talk about small web.\n\n- I write in Scrivener, Zed and Helix Editor, also Word and Acrobat, also Typst to automatize various things to the right outcome\n\n- I design in Photoshop and similar apps on desktop\n\n- I do programming in terminal and just 'git this' and 'git that' plus `codex resume` a lot\n\n- I do email in my own alternative to Outlook (which is Javascript bloat anyway). I wrote it to consume graph API and it connects to my own task management tool that uses SharePoint as a backend database for shared workflows. It's funky definition of server-less and I eliminated Confluence, Jira and many other things this way, plus own software means I could integrate it with LLMs the way I want, no question about it.. written in Python with Qt for GUI, and glad I did not need to touch JavaScript for that project)\n\n- I don't do messenger things too much. I use iPhone Messages for texting sure. I use signal on iPhone too (which is an app) and the only \"messenger\" i occasionally use in a browser is Discord which comes with Javascript+Electron bloated app that was consuming my resources and I uninstalled it, and benefit from all the add and tracking blockers I can install in my browser to show them a surveillance middle finger as much as I can. I'm happy to drop Discord soon though.. it's such a waste of time often when"}, {"id": 50626250, "au": "bartread", "dom": 303, "sr": 26, "sc": 6.09, "ep": 6.31, "bs": 0.0, "d": 0, "age": 14.46, "grav": 154.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 10938, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.773, "fa": 0.0, "gp": 1.48, "bl": 0.0, "ds": 0.0, "txt": "Good grief.\n\nI remember thinking sometime a year or two back that I'd built a ridiculous tower of abstraction when I was running 16-bit Amiga games on a Kickstart 1.3 image running inside, IIRC, WinUAE running on Wine running on Rosetta running on macOS running on Apple Silicon but I can see now this that was real amateur league stuff and that I need to get into nesting operating systems inside browsers inside operating systems inside browsers..."}, {"id": 50629072, "au": "titzer", "dom": 46, "sr": 27, "sc": 5.97, "ep": 7.51, "bs": 0.0, "d": 5, "age": 10.06, "grav": 88.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 45, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.958, "fa": 0.42, "gp": 1.179, "bl": 0.0, "ds": 0.0, "txt": "> the runtime is both slower to load, run and is significantly more complex than NaCL ever was, while suffering from lots of limitations, meanwhile WASM code exists separated from the JS runtime. It's high level features like garbage collection, aren't really usable by language runtimes.\n\nBasically everything in this sentence is false. Wasm runtimes are simpler than NaCl, which required an entire LLVM. They start faster, with lazy compilation, interpreters, parallel concurrent compilation, and dynamic tier up. It has fewer limitations than NaCl--it supports SIMD, can access all JS and browser APIs, and didn't require rearchitecting the browser. It's not separated from the JS runtime--all the browser engines use the same compilation, GC, and runtime infrastructure. The high-level features like GC that you mention not being usable from language runtimes are being used by Scala, Kotlin, and OCaml, with more coming.\n\nI shipped the first versions of Wasm in Chrome, and it's true startup wasn't great. Initially, we compiled all Wasm with the top tier before starting. V8 doesn't do that anymore, nor do any other runtimes. Startup is better, topline performance is better, and integration with JS is better.\n\nAnd did I mention that Wasm also runs in lots of other places?"}, {"id": 50630579, "au": "gbl08ma", "dom": 10, "sr": 28, "sc": 5.91, "ep": 7.45, "bs": 0.0, "d": 3, "age": 8.4, "grav": 67.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 139, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://news.ycombinator.com/item?id=50626676"], "ig": 1.815, "fa": 0.62, "gp": 0.976, "bl": 0.0, "ds": 0.0, "txt": "Elsewhere in these comments someone shared another initiative that seems very close to this: https://news.ycombinator.com/item?id=50626676\n\nI think that software compatibility with these kinds of solutions will always be worse than emulating an entire machine, even if performance has some opportunities to be better (and for some software, it'll be _much_ better to compile directly to wasm). For one, wasm is still a bit of a niche target for many compilers; working on waarm64 alone, Claude found a wasm miscompile in Rust that turned out to be a LLVM problem (which I already reported and has already been fixed upstream). Then there's all the closed source software: it's probably a far fetched example in terms of use cases, but good luck getting e.g. Valve/Steam to care about wasm when they've only started caring about aarch64 recently - meanwhile, Steam already works, with some patience, in my emulator."}, {"id": 50627813, "au": "qalmakka", "dom": 57, "sr": 29, "sc": 5.9, "ep": 6.34, "bs": 0.0, "d": 4, "age": 11.55, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 5253, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 2.056, "fa": 0.0, "gp": 1.039, "bl": 0.0, "ds": 0.0, "txt": "In the last few decades the hype around GC kind of faded because GC is literally a complex solution designed to fix only one single class of leaks - memory leaks - which often makes other kinds of leaks (mutex, file descriptors, handles, ..) actually harder to handle unless the language is carefully designed around them. Just look at Java's `try()` or `with` in Python, etc, which are afterthoughts added later. RAII may be rudimental but it can potentially fix all classes of leaks by introducing deterministic lifetimes and scopes which aren't tied with the resource itself. There are other solutions for this? yes of course, but the success of Rust which is literally built over a stronger, deterministic form of RAII kind of makes debatable whether a better system is needed at all. Especially since LLMs are excellent at Rust and kind of make opting for \"weird\" languages moot. And I say this as a person which _loves_ niche languages and language design.\n\nNowadays you can probably vibe/slopcode whatever you need with just a bit of Rust, Python/shell scripts as glue and maybe Javascript if it's a webapp (but we'll likely replace that with WASM soon I'm afraid)"}, {"id": 50627109, "au": "MatMercer", "dom": 287, "sr": 30, "sc": 5.62, "ep": 6.72, "bs": 0.0, "d": 0, "age": 12.61, "grav": 124.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 6, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.956, "fa": 0.95, "gp": 1.219, "bl": 0.0, "ds": 0.0, "txt": "This is a very cool insight, but the \"2035 came early\" is a stretch, since all web browser engines and web assembly down to your device drivers aren't made in Javascript. If you take the % of what is exactly JS, maybe we arrive at 20%, 30%?"}, {"id": 50632868, "au": "andai", "dom": 22, "sr": 31, "sc": 5.6, "ep": 6.48, "bs": 0.0, "d": 1, "age": 5.87, "grav": 41.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 17, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.011, "fa": 1.37, "gp": 0.137, "bl": 0.0, "ds": 0.0, "txt": ">It would obviously have been worse if I had actually built more of mine \"by hand,\" but still\n\nI realized this in 2023. I had in mind a project which would take 5-10 years to do by hand, and realized — much like in scifi, where it's better to wait a decade for a better spaceship to be invented, because it's so much faster that it actually ends up arriving at the destination before the first one — I realized that by the time I finished, AI would be able to do the whole thing in under 24 hours.\n\n...And then I learned absolutely nothing, and spent several years working on a different project, which AI can now also replicate in about 15 minutes ;)"}, {"id": 50637061, "au": "zoom6628", "dom": 6, "sr": 32, "sc": 5.53, "ep": 6.41, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 26.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 765, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.879, "fa": 0.68, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "Great work. Please do share for the masses your setup as I'm finding that an education in itself. Not yet into LLM created software as I'm first working through the (too) many look alike GUI and CLI tools to see which works for me for simple learning type of tasks. FWIW my laptop is a 2013 vintage HP x360 with i7 and 16Gb. Can only run very small instruction only type of models so far (no AVM512 support and only 8-cores).\n\nCurrently using Qwen Code for code samples and AnythingLLM for general chat. Writing my own MCP servers in Python to learn MCP."}, {"id": 50626121, "au": "cheschire", "dom": 175, "sr": 33, "sc": 5.51, "ep": 5.96, "bs": 0.0, "d": 1, "age": 14.74, "grav": 159.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 62, "qw": 0, "k": 6401, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": ["https://peewee.fandom.com/wiki/Foil/Rubber_Band_Balls"], "ig": 1.233, "fa": 0.62, "gp": 0.89, "bl": 0.0, "ds": 0.0, "txt": "I felt mostly the same with much of the same career trajectory. But where I differ is I felt like dynamically typed scripting languages as a whole were the cancer that metastasized with the rise of Python as the de facto language chosen for machine learning. I can’t stand Python. JavaScript and its entire ecosystem is filthy but Python is the ultimate Pee Wee’s ball of foil.\n\nhttps://peewee.fandom.com/wiki/Foil/Rubber_Band_Balls"}, {"id": 50627691, "au": "skydhash", "dom": 112, "sr": 34, "sc": 5.49, "ep": 5.93, "bs": 0.0, "d": 4, "age": 11.73, "grav": 111.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 14, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.229, "fa": 0.7, "gp": 0.722, "bl": 0.0, "ds": 0.0, "txt": "> There is such thing as neatness, elegance and beauty, especially in programming and mathematics.\n\nI don’t even think of programs as code. Instead, it’s a sequence of actions on data. Kinda like open the file, search for the lines that contains this pattern, split it like this, sum the first item,… Expressing those in a programming language is fairly mechanical with slight adjustment according to the paradigm. But there is some effort spent there and the syntax can make it unpleasant.\n\nReading a program is a whole other matter. The easier a syntax make it to get the idea of a program, the better it is. I don’t like Rust because it’s full of compiler annotations and I don’t like some idiomatic techniques in other languages because they obstruct reading.\n\nBut I wouldn’t go to hate in both occasions."}, {"id": 50625792, "au": "markasoftware", "dom": 343, "sr": 35, "sc": 5.48, "ep": 12.68, "bs": 6.09, "d": 0, "age": 15.44, "grav": 171.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 388, "qw": 0, "k": 1051, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://github.com/MercuryWorkshop/wisp-protocol", "https://github.com/MercuryWorkshop/scramjet", "https://invisiproxy.com/browsing"], "ig": 2.02, "fa": 2.35, "gp": 0.852, "bl": 2.3, "ds": 0.0, "txt": "LMAO HE'S USING WISP https://github.com/MercuryWorkshop/wisp-protocol\n\nWisp is a component of a sketchy but impressive pre-AI project created by high schoolers to develop state of the art html5 based proxies to bypass restrictions on school networks that block game sites, etc. By \"HTML5 based\", I mean you don't get to run a socks proxy, change your browser settings, etc (many schools just distribute Chromebooks). Instead, you have to be able to navigate to the proxy site, type in the blocked destination URL, and then the Javascript on the website makes it act like the other website. The rough architecture is that it loads a proxied version of the site's homepage, with a pretty fancy rewriter that modifies some asset urls and stuff, uses service workers to intercept ajax requests, and then overrides js functions to even intercept and proxy websockets. This is what it takes for modern SPAs to work. Supposedly their latest proxy Scramjet https://github.com/MercuryWorkshop/scramjet is actually good enough to stream desktop games via the GeForce NOW website. I think this is an instance of it running: https://invisiproxy.com/browsing\n\nAnyway, WISP is a bad protocol. Its essentially meant to be a very shitty http2-like protocol that multiplexes tcp streams over a single tcp/websocket stream. This is fundamentally not very hard, all you really need to do is be able to tell which data c"}, {"id": 50635128, "au": "mercnz", "dom": 18, "sr": 36, "sc": 5.35, "ep": 6.9, "bs": 0.0, "d": 2, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 495, "qw": 0, "k": 8, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.977, "fa": 0.62, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "you know i wonder if we can have a crazy ideas discussion area somewhere to help introduce people to each other to scheme... like a match maker of sorts ... as there does seem a lot of big insane things people are doing recently that others may like to join in.  like for example i've been working on some improvements to windows 98 and os/2, and i've got virtio-blk and virtio-net support in them with custom tcp/ip stack with tso that can get like 20 gigabit+/sec with a musl port to them both with iperf (based upon smoltcp) and a gefs port working on both of them for file system with some improvements for case insensitivty and transactions support for installing packages, plus a package management system, remote console, plus graphical terminal, some improvements for running in variable resolutions for running in a window, some lapic improvements for os/2 and hacked timer code to allow for 1msec timer granuality (lots of unix ports want granuality of sleep), dos command prompt support for running high res video resized to window size on windows 98 running in dos window, a hack to make win32 console apps to also run fast in that dos window (that always bugged me basically it switches to dos to run).   i also have a dos/x86 emulator that can boot windows 98 and working towards os/2 on it.  and i have an amiga emulator that can run single apps (well tested with amos because it had s"}, {"id": 50629835, "au": "semiquaver", "dom": 196, "sr": 37, "sc": 5.33, "ep": 6.14, "bs": 0.0, "d": 0, "age": 9.2, "grav": 77.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 6724, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.662, "fa": 0.0, "gp": 1.542, "bl": 0.0, "ds": 0.0, "txt": "Gary Bernhardt has to be one of the least-well-known “software heros”. I would honestly rank him among Fabrice Bellard and John Carmack in terms of foresight and brilliance. Every thing he has ever produced is solid gold and I believe I owe much of my success to learning and emulating his excellent taste when I was earlier in my career. It’s a shame that he doesn’t really do destroy all software anymore, I would love to see how he works with agents."}, {"id": 50630575, "au": "gwbas1c", "dom": 47, "sr": 38, "sc": 5.27, "ep": 6.81, "bs": 0.0, "d": 6, "age": 8.4, "grav": 67.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 7, "k": 16198, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.897, "fa": 0.42, "gp": 0.796, "bl": 0.0, "ds": 0.0, "txt": "> can access all JS and browser APIs\n\nThat's highly misleading.\n\nThe crippling problem with WASM is that all data must be serialized prior to calling a JS library. You can't just call the API directly. It causes massive overhead and performance problems, making a data-intense \"pure\" WASM application very slow.\n\nEdit: The problem is very evident if you need to graph 1000s of points. Calling fetch (js-space API) has to translate data to something your WASM language can handle, then after parsing it in WASM there's overhead either for serializing the data into something the JS graphing library can handle, or overhead for passing raw HTML through js-space."}, {"id": 50627847, "au": "torginus", "dom": 45, "sr": 39, "sc": 5.22, "ep": 5.88, "bs": 0.0, "d": 4, "age": 11.52, "grav": 108.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.914, "fa": 0.0, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "I think WASM managed to fall between two stools - it couldn't decide whether it wanted to be a high performance runtime analogous to NaCL that allowed you to run code at native speeds, or a generic bytecode language that other languages can target (analogous to Java or .NET bytecode), while having the same access as JS.\n\nIt mananged neither - the runtime is both slower to load, run and is significantly more complex than NaCL ever was, while suffering from lots of limitations, meanwhile WASM code exists separated from the JS runtime. It's high level features like garbage collection, aren't really usable by language runtimes.\n\nImo the best thing would be, if you could compile Ruby to a generic bytecode, which has extended features to support dynamic objects. .NET kinda managed this back then, and there were things like IronRuby, which supported a decent subset of real Ruby code, but wasn't really popular afair."}, {"id": 50631549, "au": "throwaway2037", "dom": 272, "sr": 40, "sc": 5.16, "ep": 6.26, "bs": 0.0, "d": 0, "age": 7.34, "grav": 55.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 30, "k": 8583, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.183, "fa": 0.76, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "For anyone too lazy to read the full article, the last line says it all:\n\n    > Sit and bask in that insanity. That is Firefox, on Linux compiled to WebAssembly, in a Firefox tab, loading the site and then loading Firefox again inside itself. <mind blown emoji>\n\nI can remember more than 10 years ago seeing a GNOME app run from a web browser.  I cannot remember how it worked, but it was a similar kind of Inception feeling when you saw it."}, {"id": 50626666, "au": "Xirdus", "dom": 62, "sr": 41, "sc": 5.16, "ep": 6.26, "bs": 0.0, "d": 4, "age": 13.48, "grav": 138.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 18, "k": 1116, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.682, "fa": 0.42, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "> I think it was the right call by the C++ people to explicitly list what objects are captured and how\n\nHaving recently worked a lot with Rust, which does this implicitly - I find the explicit notation entirely unnecessary. There's only one choice - are captures moved into closure or passed by reference? - and everything else is inferred. It does lead to some verbose cloning when there are many refcounting pointers at play, but other than that it works flawlessly; I've never been in a situation I couldn't do something I wanted to.\n\nI'm confused by the point about RAII. Why are you saying that closures break it? Personally, I found that closures complement RAII very well - the closure owns its resources, and when it goes out of scope they're all cleaned up automatically. Or do you mean situations where resources outlive the closures? This is no different than any other object that needs a reference to something that lives longer."}, {"id": 50626676, "au": "daugasauron", "dom": 277, "sr": 42, "sc": 5.1, "ep": 6.2, "bs": 0.0, "d": 0, "age": 13.46, "grav": 138.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 19, "qw": 0, "k": 2, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": ["https://slopshare.dev/v0.1.8/wine/", "https://slopshare.dev", "https://github.com/daugasauron/dolly"], "ig": 0.971, "fa": 0.75, "gp": 1.228, "bl": 0.0, "ds": 0.0, "txt": "https://slopshare.dev/v0.1.8/wine/\n\nhttps://slopshare.dev\n\nhttps://github.com/daugasauron/dolly\n\nSimilar idea but recompiling everything from source against a POSIX like userspace thats WASM native instead of running through emulator."}, {"id": 50630318, "au": "FartyMcFarter", "dom": 285, "sr": 43, "sc": 5.1, "ep": 6.75, "bs": 0.85, "d": 3, "age": 8.7, "grav": 71.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 13, "k": 5996, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.442, "fa": 0.7, "gp": 0.943, "bl": 0.32, "ds": 0.0, "txt": "If an API that works on all of them and makes your code portable (or almost portable) isn't acceptable, I'm not sure what you expected a solution to be in that case.\n\n> \"so confused why this is not something that comes out of the box\n\nIf you want your code to work on multiple CPUs and OSs, there is no single \"box\" you can blame. There are multiple \"boxes\" which naturally don't have completely unified native APIs. Libraries like SDL make the complexity of writing portable projects easier to deal with if you don't want to deal with the native APIs."}, {"id": 50630615, "au": "teiferer", "dom": 177, "sr": 44, "sc": 5.08, "ep": 6.4, "bs": 0.0, "d": 1, "age": 8.36, "grav": 67.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 2694, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.519, "fa": 0.68, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "May I ask how old you are? I have a hard time placing your story into the sw eng timeline since on the one hand you say you are retired, on the other JS was dominating your professional life, but it's not been that dominant for 40 years straight. Did your retire early? Or did you do something else before pivoting to software.\n\nAnother question I have is how you feel moving into lead roles already after 5 years of experience. That's a relatively short time. Any insights you could share?"}, {"id": 50627137, "au": "lionkor", "dom": 211, "sr": 45, "sc": 4.95, "ep": 6.34, "bs": 0.0, "d": 2, "age": 12.57, "grav": 124.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 7019, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.326, "fa": 0.62, "gp": 1.007, "bl": 0.0, "ds": 0.0, "txt": "I have a list of things that don't run in the browser, and I'm not sure why they ever would.\n\n- My IDE (not vscode) and text editor (not vscode)\n\n- My terminal, file manager, compilers, linters, etc.\n\n- My browser (that's a native app, you wouldn't believe it)\n\n- Photo and graphics editors (darktable, inkscape, krita, etc.)\n\nI'm sure you can find web-based alternatives for all of those that will be at least 80% vibecoded, and if you really need it, I'm sure you can find ones with a subscription model, too. I just don't think it makes sense."}, {"id": 50627980, "au": "Kuyawa", "dom": 240, "sr": 46, "sc": 4.84, "ep": 5.72, "bs": 0.0, "d": 0, "age": 11.33, "grav": 105.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.858, "fa": 0.62, "gp": 1.332, "bl": 0.0, "ds": 0.0, "txt": "There will come a language for all platforms better than rust, designed by AI. And it will come with a browser, and it will take the world by storm. One language to rule them all, one browser to bind them...\n\nIf it can be optimized, AI will do it, and when there is no more optimization to do, then it will settle as de facto, for everything, and forever. And that time is not too far in the horizon, a couple of years at most\n\n* Prediction before 2030"}, {"id": 50626316, "au": "torginus", "dom": 56, "sr": 47, "sc": 4.74, "ep": 6.06, "bs": 0.0, "d": 3, "age": 14.31, "grav": 152.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.785, "fa": 0.0, "gp": 1.286, "bl": 0.0, "ds": 0.0, "txt": "Each to their own I guess, by personally I really don't like closures (at least ones that as per their namesake, close over objects with nontrivial lifetimes).\n\nI think it was the right call by the C++ people to explicitly list what objects are captured and how, even if the syntax's not the best.\n\nRAII is a fact of life unfortunately, not just in C++ or Rust, but if you talk over some high level protocol over the internet you go  TCP socket->HTTP connection->your stream protocol; and have to do the exact reverse.\n\nClosures break RAII hard.\n\nIncidentally, you don't even need closures for nice looking UI code. Immediate mode GUIs like Dear Imgui or Clay allow for super-simple looking code in basic C"}, {"id": 50626142, "au": "LytraX", "dom": 142, "sr": 48, "sc": 4.67, "ep": 8.07, "bs": 2.52, "d": 1, "age": 14.69, "grav": 158.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 3, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.7, "fa": 0.95, "gp": 0.941, "bl": 0.95, "ds": 0.0, "txt": "Same things over and over. Same things people were telling about BASIC and Visual Basic 30 years ago; same things people were saying about PHP 20 years ago. No offence, but hating a programming language and let that affect your work, is like shooting your foot. The Javascript \"problem\" has long been solved and fixed by TypeScript; I see JavaScript as a low level product of compiled TypeScript and TypeScript is a solid and very powerfull language.\n\nBut I can understand you, because I hate Python; I believe Python should be a dead language by 2026 but Google and Data Scientist brought to back to life for math and AI research. I still let AI agents write small Python scripts when they need to; sometimes I tell them to re-write in other languages; sometimes I leave it there and I continue with my life."}, {"id": 50628321, "au": "ManuelKiessling", "dom": 262, "sr": 49, "sc": 4.51, "ep": 5.61, "bs": 0.0, "d": 0, "age": 10.87, "grav": 99.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 2368, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.602, "fa": 0.0, "gp": 1.27, "bl": 0.0, "ds": 0.0, "txt": "Does anyone know over which… channel(?) some of the traffic goes? On the Firefox Web Developer „Networking“ tab, I can see apt/deb packages being pulled in, but when e.g. I curl in a large file, the Network tab remains completely silent. Why is that?\n\nAlso, how can the tab running unkernel pull in any external content at all if it’s not coming from the unkernel domain itself?\n\nSo yes, in other words, this is at least one “matrioschka puppet” level too many for me, together with my not-perfect understanding of how browser origin/sandboxing works…"}, {"id": 50634236, "au": "logicallee", "dom": 294, "sr": 50, "sc": 4.51, "ep": 5.61, "bs": 0.0, "d": 3, "age": 4.46, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 36, "qw": 0, "k": 3367, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": ["https://imgur.com/a/tqibr0D"], "ig": 1.245, "fa": 0.62, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "Thank you! I tried it and it works well.  Very useful and easy to use, since it's just one line\n\n    croc send [file(s)-or-folder]\n\nscreenshot:\n\nhttps://imgur.com/a/tqibr0D\n\nalso works on folders (directories). It's a good project, I donated to its author."}, {"id": 50636386, "au": "divan", "dom": 129, "sr": 51, "sc": 4.5, "ep": 6.04, "bs": 0.0, "d": 1, "age": 1.34, "grav": 8.8, "surf": 18.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 27, "k": 2855, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.243, "fa": 0.76, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "> I think Javascript is so awful, and until recently so prevalent in the roles available to me, that it made me want to not be a Software Engineer anymore.\n\nThank you for sharing that. I was lucky to be able to get rid of all JS in our codebases and continue building products I love, but I share that sentiment 100%. It was really painful to see over past two decades how Javascript (and HTML/CSS to that matter) has been eating up market share."}, {"id": 50635214, "au": "hinkley", "dom": 93, "sr": 52, "sc": 4.43, "ep": 5.97, "bs": 0.0, "d": 2, "age": 3.13, "grav": 19.0, "surf": 7.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.779, "fa": 0.34, "gp": 0.569, "bl": 0.0, "ds": 0.0, "txt": "There’s a different set of perennial mistakes that you have to watch for in code reviews all the time. The things that people either refuse to learn or lean into helplessness.\n\nWhat I don’t have to do often in JavaScript code reviews is lecture someone on concurrency bugs. But there are I am sure other things that I find equally annoying.\n\nBut I moved from a job with a JavaScript frontend and a Java backend to a job with only a JavaScript frontend (opaque service API because reasons and asshole) to a JavaScript backend system where I rarely touched the frontend and the lesson I learned the hard way is that I can do JavaScript about 30 hours a week and beyond that I get really fucking tired of dealing with JavaScript with no breaks to touch something else.\n\nSo I volunteered to work on shell scripts, our Docker and Terraform work (terraform was awful but I think our OPs team did something with abstraction layers to make it that awful, so I am not making a blanket statement about terraform at this time) as often as they came up."}, {"id": 50628886, "au": "skydhash", "dom": 286, "sr": 53, "sc": 4.41, "ep": 5.8, "bs": 0.0, "d": 1, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 60, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.656, "fa": 0.42, "gp": 0.493, "bl": 0.0, "ds": 0.0, "txt": "> A long chain of technical decisions led to the world where a simple game written in C needs to be aware of multiple CPU architectures, OSes, graphics APIs, display servers, sound subsystems to have a chance to work properly on platforms it knows about.\n\nIt’s all about workloads and needs. You can’t put a sedan’s engine into a semitruck even if the basic components are the same. Windows were all about the microcomputer while Unix was designed to run in servers. The abstraction differences can be smoothed over, but it’s hard work and not everyone is keen to do so. And because they’re abstraction and not physical constraint, some would rather invent a new one (OpenGL).\n\n> I hope one day we get posix v2 with performant standard APIs to not worry about platforms in application's code. Perhaps 2035?\n\nA more pragmatic option is to design you app and push platform concerns to the edge. Then you just reimplement the exterior shell while keeping the core logic unchanged."}, {"id": 50631207, "au": "disperso", "dom": 201, "sr": 54, "sc": 4.36, "ep": 8.27, "bs": 2.52, "d": 1, "age": 7.75, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 105, "qw": 0, "k": 2, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": ["https://www.destroyallsoftware.com/talks/boundaries"], "ig": 1.468, "fa": 1.3, "gp": 0.772, "bl": 0.95, "ds": 0.0, "txt": "Boundaries has been, by far, the talk that has impressed me more, and shaped more how I think about software, of all the talks that I've seen (and I'm 45).\n\nhttps://www.destroyallsoftware.com/talks/boundaries\n\nIt's 30 minutes, but just the first 10/15 minutes are so eye opening to me that I recommend them to everyone around me.\n\nPerhaps for the typical audience of HN this is not impressive, as most will know about functional programming. But I did not study CS, I just went to coding from an engineering background, and I never needed FP in my life. But those minutes hooked me in so well into loving the approach in all sorts of languages, none (purely) functional."}, {"id": 50626203, "au": "bartread", "dom": 148, "sr": 55, "sc": 4.35, "ep": 5.89, "bs": 0.0, "d": 1, "age": 14.55, "grav": 156.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 235, "qw": 0, "k": 10938, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.893, "fa": 0.0, "gp": 0.996, "bl": 0.0, "ds": 0.0, "txt": "I think I feel the same way about DevOps that you feel about JavaScript.\n\nI'm more of a product guy so I tend to view DevOps as absolutely critical, and an area where a correct solution is of supreme importance, but also as something of a distraction from doing something that I find more fun and interesting.\n\n(Before anyone gets upset, I'm not making a general statement about whether or not DevOps is objectively interesting, I'm just saying that I don't enjoy it. I know loads of people do find DevOps satisfying, which is absolutely great and to the benefit of all of us.)\n\nBut Claude has allowed me to set up this ludicrously overengineered pipeline - the sort of thing you see in a large enterprises with complex microservice architectures - that has completely automated every aspect of build, deployment, configuration, testing (including ordinarily pesky end to end tests), security and application hardening, monitoring, alerting, and so on. I've hit the ideal of \"when the pipeline is green, the software is ready for release\"... all for a personal website that gets maybe half a dozen real human visitors per day.\n\nIt's sort of ridiculous but, at the same time, with the increased frequency of new critical CVEs over the past few weeks and months, it also feels necessary.\n\nBut the great thing is that, in relative terms, I don't have to spend loads of time on it and can instead focus o"}, {"id": 50627485, "au": "gkcnlr", "dom": 212, "sr": 56, "sc": 4.35, "ep": 5.8, "bs": 0.0, "d": 3, "age": 11.98, "grav": 115.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 13, "k": 126, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.495, "fa": 0.42, "gp": 0.752, "bl": 0.0, "ds": 0.0, "txt": "> [...] and I'm not sure why they ever would.\n> I just don't think it makes sense.\n\nWell, the market is dominated by the average person and average person doesn't care about the fundamentals of their user space applications being web-based or not. They understand browsers, file managers; but totally intertwine these applications' with their \"normal\" use cases.\n\nThe normal many software enthusiasts grew up with was accompanied by native solutions, which were the same language used by the OS itself to create these kind of applications."}, {"id": 50630098, "au": "solarengineer", "dom": 12, "sr": 57, "sc": 4.35, "ep": 5.73, "bs": 0.0, "d": 1, "age": 8.92, "grav": 74.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 58, "qw": 0, "k": 1897, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": ["https://xkcd.com/1053/"], "ig": 0.806, "fa": 0.96, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "Even if there is a \"winner\", there is always room for and a necessity for alternatives.\n\nAlso, do remember the XKCD comic of 10000 per day (https://xkcd.com/1053/). There are going to be many who will have learned of such a concept for the first time, and won't care who made it happen first.\n\nThere is enough of a differentiator in what you are making."}, {"id": 50629532, "au": "__MatrixMan__", "dom": 90, "sr": 58, "sc": 4.35, "ep": 5.69, "bs": 0.0, "d": 2, "age": 9.54, "grav": 81.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.868, "fa": 0.0, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "I have a hard time forgiving JS for normalizing the practice of blindly running whatever some remote server sent you after only validating that that server isn't lying about its name. It's like of your neighbor never locks their doors and now the neighborhood has robbery problem that would just never have gotten off the ground if they had.\n\nThe web would be such a nicer place if browsers were built to respect the user's preferences about which content they trust separately from which software they trust.\n\nI'm aware that with some care you can build a wide variety of things with JS. You don't have to import the insane trust model that's part of its origin story. But I can't shake the feeling that the whole space is a slippery slope towards accidentally making bad assumptions that lead to your user being mistreated by a third party."}, {"id": 50632352, "au": "__MatrixMan__", "dom": 92, "sr": 59, "sc": 4.35, "ep": 5.55, "bs": 0.0, "d": 4, "age": 6.44, "grav": 46.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.948, "fa": 0.0, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "That's quite different than restricting the execution of code that you've decided to trust.  Control over a given domain name, a given server, or a given http response payload, is perpetually up for grabs in ways that just don't apply to software packages whose contents are identified by cryptographic hash.\n\nThe attack surface for code served over the web at runtime is unnecessarily large, even if you've allow-listed the originating domain name.  Also, it puts too much power in the hands of whoever controls that name, and power corrupts.  People who are trustworthy today, will start selling their users out tomorrow."}, {"id": 50631782, "au": "binsquare", "dom": 249, "sr": 60, "sc": 4.35, "ep": 5.49, "bs": 0.0, "d": 2, "age": 7.03, "grav": 52.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 19, "qw": 0, "k": 1161, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://github.com/smol-machines/smolvm"], "ig": 1.01, "fa": 0.75, "gp": 0.675, "bl": 0.0, "ds": 0.0, "txt": "There are tools like smolvm which gives you a linux vm in seconds on both windows/macs.\n\ndisclaimer: Am maintainer, https://github.com/smol-machines/smolvm"}, {"id": 50626529, "au": "glimshe", "dom": 131, "sr": 61, "sc": 4.35, "ep": 5.42, "bs": 0.0, "d": 2, "age": 13.79, "grav": 143.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.854, "fa": 0.0, "gp": 0.735, "bl": 0.0, "ds": 0.0, "txt": "C, C++, C\u0023 and Java were the languages I liked to work with depending on the job.\n\nI didn't want to write a large essay because it would be boring. Every language has annoyances, but the thing with javascript is that it's a terrible server programming language (Node) and makes the already unpleasant UI client work even less pleasant.\n\nA lot of my dissatisfaction was due to the environment of the web and full stack development work where Javascript became prevalent. Typescript fixed it somewhat while inheriting much of the \"Framework of the week\" mania from the javascript era.\n\nIn a nutshell the age of Javascript was when Software Engineering lost what I like to call \"durable learning\". Javascript always felt like a temporary hack and the surrounding ecosystem, ephemeral."}, {"id": 50627524, "au": "swiftcoder", "dom": 326, "sr": 62, "sc": 4.35, "ep": 5.4, "bs": 0.0, "d": 2, "age": 11.93, "grav": 114.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 14, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.391, "fa": 0.42, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "> extrapolating that to mean anything running in WASM is \"written in JavaScript\" is silliness\n\nNobody ever claimed that? The whole Birth & Death of JavaScript talk is explicitly about transpiling code from other languages.\n\nAt the time the transpilation target was (the limited asm.js subset of) Javascript, since WASM didn't exist yet, but the overall \"transpile everything to run in the browser\" still holds."}, {"id": 50626432, "au": "glimshe", "dom": 164, "sr": 63, "sc": 4.35, "ep": 5.22, "bs": 0.0, "d": 3, "age": 14.05, "grav": 147.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.743, "fa": 0.0, "gp": 0.778, "bl": 0.0, "ds": 0.0, "txt": "Thank you for stating what should have been obvious to most people.\n\nSome replies are assuming I coded for a couple of years and then became a people manager. In fact I only became a pure people manager in the last third of my career, when Javascript became hard to avoid.\n\nBefore then, I jumped around tech lead roles with different degrees of management responsibilities but mostly hands on, sometimes being the person with most code contributions on the team.\n\nI love some areas of coding like backend, firmware and systems development. I had a diverse career.\n\nThis is an anonymous profile so I will stop... :)"}, {"id": 50631450, "au": "Kuyawa", "dom": 243, "sr": 64, "sc": 4.35, "ep": 5.17, "bs": 0.0, "d": 1, "age": 7.45, "grav": 57.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 719, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.92, "fa": 0.0, "gp": 0.456, "bl": 0.0, "ds": 0.0, "txt": "Prompt: \"Please create a syntactically beautiful programming language optimized for LLMs use and efficient token consumption. That language will be used in all OS platforms, desktop, mobile and the web. We will need a universal UI schema and native libs plus a client app container that uses our language as script on the
