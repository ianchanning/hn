afe multi-platform language is still preferred, hence Typescript winning."}, {"id": 50632006, "au": "gbl08ma", "dom": 16, "sr": 155, "sc": 2.42, "ep": 2.42, "bs": 0.0, "d": 4, "age": 6.8, "grav": 50.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes indeed, these things just write and write and write. I'm not a good editor for their output either, since I naturally tend to ramble on and on too. What probably needs to be done is making a user-facing \"manual\" of sorts, that goes into more detail on each feature, so that the intro can keep less detail."}, {"id": 50636073, "au": "hungryhobbit", "dom": 3, "sr": 156, "sc": 2.4, "ep": 2.4, "bs": 0.0, "d": 2, "age": 1.86, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 16, "k": 1738, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.514, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">I was able to upstream a few PRs their way. Now I don’t have to maintain an unwieldy codebase\n\nI just wanted to say kudos for this.\n\nI think a lot of people would have taken their toys and gone home (ie. mothballed the project without sharing anything) ... or published a competing project.\n\nWhat you did was the best for everyone (yourself included)  ... but again, I think many others wouldn't have been as wise."}, {"id": 50629399, "au": "someguyiguess", "dom": 114, "sr": 157, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 4, "age": 9.67, "grav": 83.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 454, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.603, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "See ruby to me is such a mess of a language. It does not jive with the way I think at all. It takes me 4x longer to write something in Ruby vs Python, Javascript or Swift."}, {"id": 50626102, "au": "lukan", "dom": 155, "sr": 158, "sc": 2.36, "ep": 2.36, "bs": 0.0, "d": 2, "age": 14.79, "grav": 160.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.005, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What a blast from the past. You guys do know by now typescript or really any other language is possible to use for webapps as you can compile/transpile your favorite to WASM?\n\nJavascript is ugly, but simple and got the job done. That's the reason for its success."}, {"id": 50625798, "au": "lifestyleguru", "dom": 353, "sr": 159, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 0, "age": 15.44, "grav": 171.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 558, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.802, "fa": 0.0, "gp": 0.315, "bl": 0.0, "ds": 0.0, "txt": "None of that thing is loading. I don't see anywhere \"browser inside a browser\". Do I need 2k EUR of RAM for it?"}, {"id": 50625791, "au": "rob74", "dom": 318, "sr": 160, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 2, "age": 15.45, "grav": 171.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 17360, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "If they don't, they should. asm.js was a subset of JS that other languages could be compiled to and was optimized so it would run faster. Ok, it was minified and unreadable, but still JS. WASM is real bytecode, no JS involved anymore."}, {"id": 50627379, "au": "penguin_booze", "dom": 334, "sr": 161, "sc": 2.29, "ep": 2.29, "bs": 0.0, "d": 0, "age": 12.18, "grav": 118.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 6, "k": 2801, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.817, "fa": 0.0, "gp": 0.256, "bl": 0.0, "ds": 0.0, "txt": "> The proof is in the pudding\n\nThe proof is in the eating of the pudding. These days, nobody makes pudding with a proof embedded inside it."}, {"id": 50627954, "au": "layer8", "dom": 213, "sr": 162, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 4, "age": 11.37, "grav": 106.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The average person uses apps more often than something in their browser. The browser hasn’t become the OS for them. The fact that most apps may be built on web technology and use a web view doesn’t change that."}, {"id": 50629313, "au": "klodolph", "dom": 58, "sr": 163, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 5, "age": 9.79, "grav": 84.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 25919, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.962, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Rust, unfortunately, lets you express lower bounds on lifetimes but not upper bounds. There is no way in Rust to express “this object must be released by that point in the program,” a guarantee which is extremely useful."}, {"id": 50634507, "au": "gtowey", "dom": 103, "sr": 164, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 3, "age": 4.06, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1903, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My biggest gripe is that it's single-threaded so it's pretty much useless if you're going to try to write any non-trivial application in it.\n\nPeople work around this generally by just running lots and lots of processes, but multi-processing as the only solution to parallelism feels like stepping back into the dark ages."}, {"id": 50635461, "au": "TheRealPomax", "dom": 229, "sr": 165, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 5, "age": 2.81, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 8257, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How is that ever remotely relevant. The application itself is JS, and runs in JS, the same way a java application runs in the JVM. If your statement is \"I haven't ever come close to needing javascript for anything\" but you use VS Code, then that statement is trivially false."}, {"id": 50629798, "au": "root_axis", "dom": 107, "sr": 166, "sc": 2.11, "ep": 2.11, "bs": 0.0, "d": 2, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 12914, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.42, "fa": 0.34, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "The hate is just bandwagon contrarianism. As you point out, js is fine. After 7 years of cpp and objc in the early 2000s, js is a triviality."}, {"id": 50635987, "au": "syshyk", "dom": 127, "sr": 167, "sc": 2.11, "ep": 2.11, "bs": 0.0, "d": 3, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 91, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is why I stopped coding for money.\n\nI'd love to but I couldn't deal with the \"real world\" of \"we cant afford to do it properly\".\n\nI've seen on the receiving end of this vendor slop for long enough now too, and its only getting worse."}, {"id": 50635468, "au": "palata", "dom": 170, "sr": 168, "sc": 2.11, "ep": 2.96, "bs": 0.85, "d": 6, "age": 2.8, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.846, "fa": 0.34, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Not sure if you lost track or if you're trying to be manipulative.\n\nI did not say \"it's a problem\", that would be another debate. What I said was that it does destroy the work of people. To which you answered something that meant \"nope, it doesn't\".\n\nBut now you're actually saying that \"actually yes, AI is destroying something\", so I guess you agree with me.\n\nI do feel empathy for the people whose work has been destroyed by software in the past 60 years, just like I feel empathy for the people whose work is being destroyed by AI now."}, {"id": 50629953, "au": "momojo", "dom": 257, "sr": 169, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 2, "age": 9.1, "grav": 76.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 486, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.555, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks for the response! I didn't know that actually. By \"people\" i meant Claude and my boss who specifically said it wasn't feasible for us to spin up our own agents on Cloudflare. Admittedly we work with large microscopy data so I think their advice was more against trying to do heavy workloads in pyodide/v8."}, {"id": 50626656, "au": "edstarch", "dom": 143, "sr": 170, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 2, "age": 13.5, "grav": 138.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 84, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.893, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But you gotta admit that nobody sane would design the current state of writing and compiling TS being required as an intermediate step to producing reasonably correct JS? The sole reason TS exists is because of the flaws inherent in JS’ original purpose and design. Not to mention all the random completely insane footguns (eqeqeq etc.) and the whole community issue (npm everything).\n\nActually Python has a similar problem in that there’s a cottage industry of solutions to make it behave more like a fundamentally different language (dataclasses, attrs, mypy, pydantic, fastapi, etc.) because it turns out what people like about python was its simple and expressive syntax rather than its fundamental design."}, {"id": 50630221, "au": "klodolph", "dom": 60, "sr": 171, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 7, "age": 8.8, "grav": 72.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 25919, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.892, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In this case you’re really setting a lower bound on the borrow of B, not an upper bound on the lifetime of A.\n\nI assure you this is not pedantry or a nitpick. The classic case here is if you want to borrow a local variable inside a thread… you need to ensure that the thread lifetime is bounded from above by the lifetime of the borrowed variable. This is why we have weird workarounds like std::thread::scope. If we could just express an upper bound on lifetime, it wouldn’t be necessary."}, {"id": 50628260, "au": "bartread", "dom": 150, "sr": 172, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 3, "age": 10.95, "grav": 100.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 10938, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.887, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thank you: I enjoyed the \"Yo Dawg\" reference. I have had to resist very hard in order to avoid typing in a suitable version the meme here which, I suspect, would not go down well."}, {"id": 50632920, "au": "SoftTalker", "dom": 169, "sr": 173, "sc": 1.98, "ep": 1.98, "bs": 0.0, "d": 5, "age": 5.81, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.432, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Software has been destroying jobs for the past 60 years. But when it's our jobs it's suddenly a problem?"}, {"id": 50631683, "au": "titzer", "dom": 48, "sr": 174, "sc": 1.98, "ep": 1.98, "bs": 0.0, "d": 7, "age": 7.16, "grav": 53.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.844, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's true that there are plenty of APIs that require JS objects, but for anything that takes an ArrayBuffer, you can get export a Wasm memory that has a .buffer property and then slice it however you like; no copying and no serialization."}, {"id": 50626248, "au": "moron4hire", "dom": 119, "sr": 175, "sc": 1.97, "ep": 1.97, "bs": 0.0, "d": 2, "age": 14.46, "grav": 154.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 12247, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.297, "fa": 0.34, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "He said his shift to management happened 5 years into his career, so he wasn't ever very experienced as a programmer."}, {"id": 50630722, "au": "__MatrixMan__", "dom": 241, "sr": 176, "sc": 1.95, "ep": 1.95, "bs": 0.0, "d": 1, "age": 8.25, "grav": 66.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.748, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "The world is not homogenous enough for that, the right tool for this job is rarely the right tool for that job.  The jobs also change too quickly.  The right tool for tomorrow's job is not the same as the right tool for today's job."}, {"id": 50626818, "au": "keeda", "dom": 147, "sr": 177, "sc": 1.9, "ep": 1.9, "bs": 0.0, "d": 1, "age": 13.17, "grav": 133.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.642, "fa": 0.0, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "I hated JS too, and deliberately oriented my career towards work where I’d have to deal with it the least, like backend roles.\n\nUnfortunately now due to a twist of fate and poor life choices, almost all the work I’m doing today is JS-based. I don’t even have the luxury of TypeScript half the time.\n\nBut you know what? With AI handling all that stuff, I don’t mind it anymore. It could even be described as… enjoyable??"}, {"id": 50628756, "au": "pjmlp", "dom": 65, "sr": 178, "sc": 1.89, "ep": 1.89, "bs": 0.0, "d": 6, "age": 10.41, "grav": 93.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.803, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I was talking in general, not JS specific, especially since JS has global namespace, note my second paragraph.\n\nIn any case, you have two ways to do something similar, kind of.\n\n    function with_file(filename, operation_fn) {\n       let resource = null;\n\n       try {\n         resource = open_resource(filename);\n         return operation_fn(resource);\n       } finally {\n          resource?.close()\n           }\n    }\n\n    with_file(\"/my/path/something\", (fd) => {\n        let data = fd.read_something()\n        // handle data\n    })\n\nNaturally there are multiple variations thereof, on how to handle errors, or which way to parameterise how to close resources.\n\nThen we have the C\u0023 inspired way,\n\n    using fd = open_resource(\"/my/path/something\")\n    let data = fd.read_something()\n    // handle data\n\n\nAnd if open_resouce doesn't support using declaration, an helper builder function can be used to wrap it in such a type.\n\nYes it isn't as automatic as pure RAII, but it gets close enough for most practical purposes."}, {"id": 50628396, "au": "hollowonepl", "dom": 218, "sr": 179, "sc": 1.85, "ep": 1.85, "bs": 0.0, "d": 3, "age": 10.79, "grav": 98.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 166, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"I'm sure you can find web-based alternatives for all\"\n\nOh.. and I'm also sure you can find native-os app alternative for any web app. Quite often also with a cloud service attached to it, just fine."}, {"id": 50635996, "au": "j2kun", "dom": 230, "sr": 180, "sc": 1.85, "ep": 1.85, "bs": 0.0, "d": 6, "age": 1.99, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 8441, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.789, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Someone else's decision to write a Desktop application in JS has nothing to do with OP's decisions to write their work in the language that fits their needs."}, {"id": 50626658, "au": "codethief", "dom": 238, "sr": 181, "sc": 1.82, "ep": 1.82, "bs": 0.0, "d": 1, "age": 13.5, "grav": 138.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 18, "k": 5881, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.265, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Farid has been on an absolute roll recently. If you enjoyed this, I highly recommend his other blog posts.\n\nYou made me have a look at his other blog posts and now I realize that plenty of his other posts were discussed here on HN in the past and I really enjoyed them!"}, {"id": 50625880, "au": "rcymerys", "dom": 315, "sr": 182, "sc": 1.81, "ep": 1.81, "bs": 0.0, "d": 0, "age": 15.27, "grav": 168.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 310, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.578, "fa": 0.0, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "At the same time, we can now use AI to rebuild anything as a native desktop app written in Rust."}, {"id": 50628887, "au": "rjbwork", "dom": 135, "sr": 183, "sc": 1.78, "ep": 1.78, "bs": 0.0, "d": 4, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 5984, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.757, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The great thing about Javascript it that it will allow good programmers to make a terrible mess too!  Truly the great equalizer of programming languages."}, {"id": 50627892, "au": "ryandrake", "dom": 134, "sr": 184, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 5, "age": 11.45, "grav": 107.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.755, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "C++ is like wine: The best way to enjoy it is to pick a very old vintage and stick with it. For my projects, I limit myself to C++11 and a very small number of C++14isms and strictly limit myself to those."}, {"id": 50627605, "au": "pjmlp", "dom": 50, "sr": 185, "sc": 1.76, "ep": 1.76, "bs": 0.0, "d": 4, "age": 11.84, "grav": 113.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 134349, " g a comment on a particular outlook.\n\nMost people’s individual actions aren’t a problem, I agree. But we also have to understand that when everyone thinks like that, the aggregate make a difference.\n\nTo your example: one Canadian not caring about lost farmland doesn’t make a difference, but when most don’t we get the current situation. To change the status quo we need enough people to care, and the way to get to more people is one at a time."}, {"id": 50631377, "au": "pjmlp", "dom": 69, "sr": 281, "sc": -3.79, "ep": 1.38, "bs": 5.17, "d": 8, "age": 7.54, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.586, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "Yeah, again the remark on how this is better suited for FP and LP languages.\n\nWhich besides not having global variables, also don't do continue, break, return.\n\nThe first approach traces back to how resource management was initially done in Lisp languages, alongside conditions."}, {"id": 50631230, "au": "ligarota", "dom": 290, "sr": 282, "sc": -3.79, "ep": 0.45, "bs": 4.24, "d": 1, "age": 7.72, "grav": 59.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 0, "k": 16, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.191, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Yes, this is the last paragraph of the article"}, {"id": 50628001, "au": "Hammershaft", "dom": 156, "sr": 283, "sc": -3.8, "ep": 0.44, "bs": 4.24, "d": 3, "age": 11.31, "grav": 105.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 2193, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "wasm_javascript", "flbl ojo", "dom": 255, "sr": 309, "sc": -4.6, "ep": 0.49, "bs": 5.09, "d": 5, "age": 5.77, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 14, "qw": 0, "k": 486, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.206, "fa": 0.0, "gp": 0.0, "bl": 1.92, "ds": 0.0, "txt": "You guys do E2E? Or do you have your clients bring their own tokens?"}, {"id": 50626192, "au": "palata", "dom": 192, "sr": 310, "sc": -5.01, "ep": 0.55, "bs": 5.57, "d": 3, "age": 14.57, "grav": 156.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 11192, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.235, "fa": 0.0, "gp": 0.0, "bl": 2.1, "ds": 0.0, "txt": "Totally agree with you! And for that we should find joy in AI destroying their job! /s"}, {"id": 50633472, "au": "SoftTalker", "dom": 172, "sr": 311, "sc": -5.03, "ep": 0.98, "bs": 6.02, "d": 5, "age": 5.2, "grav": 34.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.418, "fa": 0.0, "gp": 0.0, "bl": 2.27, "ds": 0.0, "txt": "I'm not following how IKEA somehow prevents me from building furniture in my own garage/workshop.\n\nI'll grant that they are the easier, cheaper route for many people, so they choose it."}, {"id": 50629623, "au": "latexr", "dom": 183, "sr": 312, "sc": -5.15, "ep": 0.87, "bs": 6.02, "d": 3, "age": 9.45, "grav": 80.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 177, "qw": 28, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.369, "fa": 0.0, "gp": 0.0, "bl": 2.27, "ds": 0.0, "txt": "> I don't think that the external problems we see are intrinsic of AI.\n\nSure. But that doesn’t really say much or advance the discussion. The external problems of, say, fossil fuels or plastic aren’t intrinsic to them either, they’re all consequences of our relationship to them, harming the planet and in turn ourselves. Like AI, without the massive industry behind them they wouldn’t be issues worth discussing.\n\n> whether AI is a net positive or negative to humanity as a technology, aside from the other concerns.\n\nIt’s unclear to me why you added “as a technology” as a qualifier. As opposed to what?\n\nI’d argue “aside from other concerns” is not something we have the luxury of doing. To determine if AI is a net positive or negative to humanity, no concerns can be set aside. Some will have more weight than others, sure, but they all should be considered.\n\nI’d also argue we don’t have the luxury of just waiting and seeing. There are many big negatives which are already happening, while the positives are at best of dubious utility. Maybe AI will end up being a net positive, but right now I’d argue it’s being a net negative. Either way it’s imperative we consider the negative parts: If we don’t, they can’t be overcome."}, {"id": 50627207, "au": "lukan", "dom": 161, "sr": 313, "sc": -5.26, "ep": 1.61, "bs": 6.86, "d": 6, "age": 12.47, "grav": 122.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.684, "fa": 0.0, "gp": 0.0, "bl": 2.59, "ds": 0.0, "txt": "\"To each their own I guess.\"\n\nWhat choice was there, when I liked Java even less?\n\nAnd node is just simple. I even used it as a cross plattform toolset. Indexing files. Moving around, tagging, sorting, toolcall. Not nice looking, but simple enough that it just worked. And I never had callback hell in node, as I kept my servers simple and most of the logic on the client."}, {"id": 50628244, "au": "lukan", "dom": 157, "sr": 314, "sc": -5.26, "ep": 1.1, "bs": 6.36, "d": 4, "age": 10.98, "grav": 100.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.468, "fa": 0.0, "gp": 0.0, "bl": 2.4, "ds": 0.0, "txt": "Yes, but why was there no broad alternative, despite lots of complaints?\n\nCross plattform is hard.\n\n(I actually prefered actionscript, while that was a alternative)"}, {"id": 50630725, "au": "dezgeg", "dom": 68, "sr": 315, "sc": -5.34, "ep": 1.02, "bs": 6.36, "d": 7, "age": 8.25, "grav": 66.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 2900, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.435, "fa": 0.0, "gp": 0.0, "bl": 2.4, "ds": 0.0, "txt": "Giant problem with the first approach is continue, break, return keywords can't be used (or even worse, has different semantics in case of `return`)."}, {"id": 50626191, "au": "raincole", "dom": 189, "sr": 316, "sc": -5.38, "ep": 0.98, "bs": 6.36, "d": 2, "age": 14.57, "grav": 156.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 7, "k": 14574, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.328, "fa": 0.0, "gp": 0.146, "bl": 2.4, "ds": 0.0, "txt": "> as if that operation even makes sense\n\nIf the operation doesn't make sense in any case then the compiler should stop me, or (at very least) the interpreter should throw exceptions 0, "sc": -7.92, "ep": 2.41, "bs": 10.34, "d": 4, "age": 9.28, "grav": 78.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 308, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.804, "fa": 0.0, "gp": 0.36, "bl": 3.9, "ds": 0.0, "txt": "This is exactly how many feel about LLM-assisted coding though.\n\nEvery couple months a new model comes out and wows everyone, and suddenly everyone is somehow getting an even greater productivity boost. We were already at 10x in GPT 3.5 days, we must be up to something like 50x now, I guess.\n\nExcept somehow, every day these models still write the same awful code, make the same mistakes, and apologize profusely when you call them out on the dumbest of errors. I saw Claude delete the project’s README by accident the other day and happily commit the change. Is this the ASI we’ve been waiting for?\n\nBut no, I’m just holding it wrong. Just one more model bro, one more data center. A different harness, perhaps. Just don’t look at the code, bro.\n\nOnly thing I’m getting out of this whole situation is that I should probably move into people management, too. The corporate IC culture is soulcrushing, though I guess it’s always been that way."}, {"id": 50626257, "au": "torginus", "dom": 51, "sr": 321, "sc": -8.3, "ep": 2.04, "bs": 10.34, "d": 3, "age": 14.45, "grav": 154.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.866, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "I don't disagree on this; I transitioned from a backend heavy role rendering ASP.NET Razor templates to the bold new world of SPAs in the mid to late 2010s, and some things were genuinely baffling like What do you mean the compiler(bundler) generates invalid code?  What do you mean the bundler is unfixably broken, and I should use a different one? Oh, that's unfixable as well?\n\nThat framework churn, leftpad, etc. stuff I think is something the JS community will gladly memoryhole. Thankfully,  I was rightly repelled by that mess, and fled back to backend, and returned only when things calmed down.\n\nBtw, the pre-SPA era of jQuery is an interesting paradigm, while writing modern TS feels like writing basically any other language."}, {"id": 50627259, "au": "torginus", "dom": 71, "sr": 322, "sc": -8.32, "ep": 2.12, "bs": 10.44, "d": 5, "age": 12.37, "grav": 121.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 28, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": ["https://www.youtube.com/watch?v=by9lQvpvMIc"], "ig": 0.58, "fa": 0.0, "gp": 0.524, "bl": 3.94, "ds": 0.0, "txt": "Clay's algorithm actually does many passes, that doesn't mean it invokes the UI function multiple times. You are allowed to retain state during computation.\n\nHere's a cool explainer video:\n\nhttps://www.youtube.com/watch?v=by9lQvpvMIc"}, {"id": 50626713, "au": "glimshe", "dom": 133, "sr": 323, "sc": -8.5, "ep": 1.83, "bs": 10.34, "d": 4, "age": 13.38, "grav": 136.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.687, "fa": 0.0, "gp": 0.149, "bl": 3.9, "ds": 0.0, "txt": "C++ can be pretty nasty too if you go all-in with modern idioms. That's probably why C++ is so easy to hate. I rage quit C++ \"for good\" a dozen times in my life, lol.\n\nThe extra modern complexity at least gives you something in return with low level compiler optimizations a ig": -0.95, "fa": 0.0, "gp": 0.106, "bl": 2.6, "ds": 0.0, "txt": "Self was implemented in C++."}, {"id": 50625926, "au": "xydone", "dom": 151, "sr": 335, "sc": -9.1, "ep": 1.23, "bs": 10.34, "d": 1, "age": 15.17, "grav": 167.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 0, "k": 64, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.324, "fa": 0.0, "gp": 0.325, "bl": 3.9, "ds": 0.0, "txt": "How could it be that you like the human aspect that AI has allowed you to focus on, while at the same time working exclusively on personal projects?\n\nI don't see the human aspect thing holding up in the industry. The manager's manager got some request through a LLM and passed it down, your manager passed LLM generated questions to a different department, who responded with an LLM answer which resulted in the developer having a LLM written ticket on their board which they will solve with an LLM. Along the way they, or well, their LLM, find out they'll need some data from a different team that they haven't planned for. They don't know what that data is, or why they really need it, but their LLM does, so the LLM asks the LLM of the other team.\n\nYou could argue this is good, efficient, cool, or whatever, and I will probably disagree, but I just cannot see how there is any form of a human aspect in the whole thing"}, {"id": 50627642, "au": "pjmlp", "dom": 63, "sr": 336, "sc": -9.11, "ep": 1.22, "bs": 10.34, "d": 4, "age": 11.79, "grav": 112.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.52, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "You can simulate RAII with closures though, that is what the with-something pattern i   function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
