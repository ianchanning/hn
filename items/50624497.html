server and client and an app:// protocol to run such apps (apps:// for secure connection). Lets start a brainstorming session to define the scope, architecture, specs, roadmap, write down all .md files in docs folder. Ask any questions you may have before coding...\"\n\nThis is gonna be fun..."}, {"id": 50626197, "au": "rvz", "dom": 260, "sr": 65, "sc": 4.35, "ep": 5.16, "bs": 0.0, "d": 3, "age": 14.56, "grav": 156.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 7, "k": 10577, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.322, "fa": 0.42, "gp": 0.588, "bl": 0.0, "ds": 0.0, "txt": "> Not everything has to be about security.\n\nAs long as it is in a web browser with the existence of web apps, it absolutely does.\n\nI don't think anyone other than techies here cares about Linux or any other distro. It is more convenient to end users to use macOS or Windows than to bother with trying or installing Linux at all.\n\nThey do not care whatsoever, and the only thing they care about with computers is that they don't get their passwords, data or internet banking accounts hacked when they use their browser."}, {"id": 50631161, "au": "gbl08ma", "dom": 14, "sr": 66, "sc": 4.35, "ep": 5.03, "bs": 0.0, "d": 2, "age": 7.79, "grav": 60.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 183, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.754, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "That part is not LLM authored. I should have given up on making a bit of a play on words, and I'm yet to fix it. It is meant to be a reference to how, depending on how \"AI\" evolves, it can either be very positive for individual freedoms, or end up limiting them in some senses. If some doomsday predictions of \"AI replaces all knowledge work\" become reality, then it will have (de)valued much of human skill. It is also possible that the powers that be will determine that it is giving ordinary people too many capabilities, and that connects with the window of capability eventually closing. I hope that was clear enough.\n\nIn general Opus and Fable are terrible at writing English, even for UI elements, compared to their software development abilities, and this is even after setting rules for what the copy should be like. I've been slowly going through all of the user-visible text in the project to make it read better, but it's funny that my own writing has defects too. It's definitely not great to have to read Opus writing every day."}, {"id": 50629508, "au": "specialist", "dom": 35, "sr": 67, "sc": 4.35, "ep": 5.0, "bs": 0.0, "d": 1, "age": 9.57, "grav": 82.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 10865, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 2.126, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Rejoice: Competition validates a product category.\n\nMy own efforts have done better after someone creates a knockoff. Competing products help educate the market place, greatly reducing your burden. It enables users (potential customers) to compare and contrast. A product with no viable alternative is almost illegible to prospective users.\n\nIt's really great when you can choose your users. Maintaining and supporting a product that directly fulfills user requirements and use cases is a joy. Versus trying to be All The Things for every random use case and drive-by kibbitzer. Maybe your waarm64 becomes the preferred choice for the discerning customer, who knows what they want.\n\nSo if you still have the drive, I'd encourage you to see unkernel as friendly competition, use it as a motivator.\n\nHappy hunting."}, {"id": 50628820, "au": "swiftcoder", "dom": 328, "sr": 68, "sc": 4.35, "ep": 5.73, "bs": 0.85, "d": 4, "age": 10.35, "grav": 92.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 15, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.086, "fa": 0.7, "gp": 0.816, "bl": 0.32, "ds": 0.0, "txt": "> With an old video about someone saying that eventually we'll compile everything to JavaScript\n\nThe \"old video\" is very specifically talking about asm.js, the direct precursor of WASM.\n\nWASM was built because asm.js proved that transpiling native software to the browser was a viable model, and by many of the same people behind asm.js"}, {"id": 50626033, "au": "hofiflo", "dom": 247, "sr": 69, "sc": 4.35, "ep": 4.83, "bs": 0.0, "d": 1, "age": 14.94, "grav": 163.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 14, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.704, "fa": 0.0, "gp": 0.566, "bl": 0.0, "ds": 0.0, "txt": "We can argue whether university course assignments are dead because of AI or not, but nevertheless…\nFor some courses I was assisting, we always had the issue that some of the assignments required Linux and it took at least a week or two each semester to get each student access to a proper Linux environment with root access (the university’s machines only give students non-root access). Something like this allows us to tell students to just use this website instead of handholding all the Windows and macOS users on how to set up Linux VMs or ssh into a VPS or similar"}, {"id": 50626971, "au": "keeda", "dom": 104, "sr": 70, "sc": 4.35, "ep": 4.82, "bs": 0.0, "d": 2, "age": 12.88, "grav": 129.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 1990, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.652, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "Yeah you won’t get it if you haven’t bashed your head trying to claw your way out from the depths of callback hell. Or any of the dozens of quirks in the language, compounded the hundred different environments it could run in, each with their own special edge cases. Gary Bernhardt, the person mentioned in TFA has another fun talk worth watching called “Wat”.\n\nEventually with a lot of lipstick on the pig, like async / await, it has become much more tolerable."}, {"id": 50635270, "au": "hinkley", "dom": 43, "sr": 71, "sc": 4.35, "ep": 4.8, "bs": 0.0, "d": 3, "age": 3.06, "grav": 18.5, "surf": 8.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.38, "fa": 0.34, "gp": 0.404, "bl": 0.0, "ds": 0.0, "txt": "The ugly truth is that it’s difficult to have 40 engineers share 100 cores without fucking things up and process per core languages like Ruby and JavaScript just don’t even try to share processors, beyond a bit of multitasking.\n\nGetting people not to use global shared state is a struggle in any language, it’s just that it’s the primary one in JavaScript. But it’s not really global so it at least stops certain designs from making it off the whiteboard.\n\nWhen I got out of school I was really good at concurrency. Probably a side effect of taking a distributed computing class.\n\nBut over and over again people broke my code, and over time I started making more and more grug brained systems and even declining PRs from engineers that tried to do things that I used to think were fine. If you have code only three engineers understand properly it needs to be locked away behind an API where others are discouraged from touching and don’t need to step through for every bug they work on. The latter is particularly tricky to pull off. The alternative is use a less sophisticated solution."}, {"id": 50630501, "au": "preg_match", "dom": 94, "sr": 72, "sc": 4.35, "ep": 4.74, "bs": 0.0, "d": 2, "age": 8.49, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 930, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.692, "fa": 0.0, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "There are truly no redeeming qualities about JS in my eyes. It’s poorly designed in every single way I can imagine. If I had to design JS as a language today, I’d make none of the same decisions.\n\nIt’s slow, it’s hard to read and write, it often produces buggy code because of the infinite edge cases in the type system, and it’s footgunny to the max. At least it’s memory safe. If C++ was memory safe, I’d legitimately say it’s a more sane and less footgunny language. Which is really saying something, because C++ sucks ass.\n\nSometimes I program in JS enough that I almost start to gaslight myself into thinking it’s sane. But then I program in C\u0023, Java, go, even PHP and I remember… no wait, JS is actually insane. How do we even write reliable software in JS? The answer is we don’t, all the software is buggy as hell but it’s fine because it’s memory safe."}, {"id": 50628573, "au": "majewsky", "dom": 122, "sr": 73, "sc": 4.35, "ep": 4.74, "bs": 0.0, "d": 1, "age": 10.62, "grav": 95.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 36, "k": 15746, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.733, "fa": 0.64, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "> But I feel the complete opposite about AI. In fact, AI brought back the fun that was stolen from my life by Javascript. I'm now retired and spend a good amount of my day working my own programming projects.\n\nRead up on the terminology of \"reverse centaurs\". Centaurs (\"a human head on a machine body\") are people who are augmented by technology to achieve their goals more easily (e.g. you). Reverse centaurs (\"a machine head on a human body\") are subjugated by technology and turned into cogs in a machine that achieves someone else's goal. Someone's perspective on AI highly depends on whether they are a centaur or reverse centaur."}, {"id": 50626544, "au": "llm_nerd", "dom": 325, "sr": 74, "sc": 4.35, "ep": 4.73, "bs": 0.0, "d": 1, "age": 13.77, "grav": 143.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 4946, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.701, "fa": 0.0, "gp": 0.503, "bl": 0.0, "ds": 0.0, "txt": "While it's neat that we have tools to port stuff from one Turing complete runtime to another, the whole \"JavaScript\" element of the linked page is tenuous. WASM is a virtual machine made to run in web browsers. We had an asm.js that was the precursor to more easily transpile other languages -- transpiling between Turing complete languages has been a thing forever -- but extrapolating that to mean anything running in WASM is \"written in JavaScript\" is silliness.\n\nIt's a legitimately funny basis for a piece, but it's intellectually misleading.\n\nAnd of course none of this is remotely new. We've had emscripten to compile LLVM intermediate code to WASM, or JavaScript for that matter, for about a decade and half."}, {"id": 50635661, "au": "__MatrixMan__", "dom": 276, "sr": 75, "sc": 4.35, "ep": 4.73, "bs": 0.0, "d": 2, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 190, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.708, "fa": 0.0, "gp": 0.491, "bl": 0.0, "ds": 0.0, "txt": "Without host imports, WASM has no clock, no randomness, and no threads unless you grant them, so execution is closer to fully deterministic.\n\nIf we can determine with high confidence that a particular derivation is in fact deterministic, we can memoize it: just look up the output rather than compute it.  If we can get to a place where everything is memoizable in that way, we can build a map between compiled binaries and the code that generated them... no decompiling, just search and find it.  From there we can reach further back: Who has reviewed this?  Who has tested it?  Has anybody raised an alarm about it?  These could be gossiped annotations on nodes in the derivation graph, some of which will correspond to binaries that a potential victim is about to execute.\n\nAnd if we can get all of that working, we can make our operating systems much smarter about their \"are you sure you want to run this?\" messages, as well as improvements to our ability to quickly understand the blast radius of bugs, because \"am I affected\" becomes a matter of graph traversal within the same dataset that would support the memoization."}, {"id": 50629438, "au": "orangea", "dom": 280, "sr": 76, "sc": 4.35, "ep": 4.66, "bs": 0.0, "d": 1, "age": 9.63, "grav": 82.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 313, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.326, "fa": 0.34, "gp": 0.396, "bl": 0.0, "ds": 0.0, "txt": "Wow, I love this. Emulating system calls or posix-like userspace seems like a better approach for most tasks, which don't use 90% of Linux's userspace API surface.\n\nSuggestion: remove `.description { overflow: hidden; }`"}, {"id": 50630648, "au": "goodmythical", "dom": 293, "sr": 77, "sc": 4.35, "ep": 4.64, "bs": 0.0, "d": 2, "age": 8.33, "grav": 66.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.676, "fa": 0.0, "gp": 0.482, "bl": 0.0, "ds": 0.0, "txt": "No need for a new relay, really. If you add croc in the VM, it will generate either a link you can download from in any other browser or via croc installed on the machine you wish to download to.\n\ncroc will establish a direct udp between two terminal clients or use their relay only if you want to use the web version for either upload/download. And it's e2e encrypted when using the croc servers.\n\nJust tried it with a couple random wikipedia images downloaded via curl to the VM and via croc to my machine. No problems."}, {"id": 50626128, "au": "benrutter", "dom": 130, "sr": 78, "sc": 4.35, "ep": 4.61, "bs": 0.0, "d": 1, "age": 14.73, "grav": 159.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 40, "k": 3553, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.156, "fa": 0.42, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "> very day you read many comments here from people who believe that AI took the fun away from their work and lives. It destroyed the reason that made them want to be Software Engineers. That's exactly how I felt about Javascript.\n\nThat's some serious dislike of JavaScript! I'm not a big fan of the language and definitely find typescript projects less enjoyable than others, but I'm surprised you found it such a big impact!\n\nWhat languages were you working with before? I'm interested if it was a relatively generic OOP languages like Python/Java/etc, or something very opinionated/specific like Haskell/Lisp/etc?"}, {"id": 50627621, "au": "pontes", "dom": 297, "sr": 79, "sc": 4.35, "ep": 4.57, "bs": 0.0, "d": 0, "age": 11.82, "grav": 113.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 16, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.438, "fa": 0.0, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "Interestingly, I am building stuff not in JS because of LLMs.\n\nI am a run-of-the-mill web developer who knows only Javascript.\n\nI wanted to build an MCP, so asked LLM the best way to do it (with some assumptions that it would scale, etc) and it said to build in Rust. And there is a web component to the thing I am building, and it told to compile to WebAssembly.\n\nSo I have a large project in Rust+WebAssembly, working as I wanted, without having no clue of those stacks.\n\nMy impression is that JS will be less dominant, now with LLMs"}, {"id": 50631240, "au": "gbl08ma", "dom": 34, "sr": 80, "sc": 4.35, "ep": 4.4, "bs": 0.0, "d": 2, "age": 7.71, "grav": 59.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.636, "fa": 0.0, "gp": 0.385, "bl": 0.0, "ds": 0.0, "txt": "waarm64 already supports mounting folders via virtio-9p on the guest, coupled with the File System API on the web side of things (works best in Chrome only, unfortunately Mozilla has reservations about supporting such things in Firefox). You can also mount network shares of the usual kinds via one of the network adapters."}, {"id": 50626127, "au": "torginus", "dom": 37, "sr": 81, "sc": 4.35, "ep": 4.39, "bs": 0.0, "d": 1, "age": 14.73, "grav": 159.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.898, "fa": 0.0, "gp": 1.574, "bl": 0.0, "ds": 0.0, "txt": "I don't get the Js hate. I have meaningful experience working in many languages (C++,Js,Ts,C\u0023 to name the biggest by LOC written). I've shipped nontrivial software in all of these.\n\nI think Js is.. okay? I can name some strengths and weaknesses,both of the language itself and the culture/ecosystem, but I certainly don't hate it."}, {"id": 50632300, "au": "__MatrixMan__", "dom": 274, "sr": 82, "sc": 4.35, "ep": 4.39, "bs": 0.0, "d": 0, "age": 6.49, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.572, "fa": 0.0, "gp": 0.481, "bl": 0.0, "ds": 0.0, "txt": "If these builds are running in a WASM environment, it means we can enforce stricter control over them than was available when they were originally authored.  Rather than having it be a convention that using a source of randomness in your builds is a bad idea, we can just take the random number generator away from the build.  Rather than suggesting that network connections in builds are likely problematic, we can deny the build access to the network and ensure it still runs.  The nix sandbox can only go so far to encourage determinism, but I think wasm can take it even further."}, {"id": 50632501, "au": "gbl08ma", "dom": 5, "sr": 83, "sc": 4.35, "ep": 4.39, "bs": 0.0, "d": 2, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 1076, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.631, "fa": 0.0, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "What use cases do you have in mind for Vulkan on WebGPU? That adapter is the trickiest one to fully complete (there are many things Vulkan allows and WebGPU simply doesn't, and that can't be converted/emulated in a performant way) and I've lost some of the motivation for continuing to work on it, because I'm finding it tricky to find software that takes advantage of Vulkan while simultaneously being sufficiently light on CPU to run well within waarm64 (and also while being aarch64-native, because while FEX works, it makes the CPU performance story even worse). The Godot editor, and any projects I can compile through it, have been the main driver so far, with its Forward+ renderer."}, {"id": 50630244, "au": "sneurlax", "dom": 2, "sr": 84, "sc": 4.32, "ep": 4.32, "bs": 0.0, "d": 1, "age": 8.78, "grav": 72.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 65, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.781, "fa": 0.34, "gp": 1.046, "bl": 0.0, "ds": 0.0, "txt": "Similar occurred to me recently: in June I got Airdrop working between Apple and non-Apple devices with a Rust crate “awdl”.  Months later, someone else made owly and got 3,000 stars\n\nBut I got just a little bit more working such that I was able to upstream a few PRs their way.  Now I don’t have to maintain an unwieldy codebase alone while being able to still enjoy actually using the functionality and wrapping it for other consumers (Dart, Flutter).\n\nAn independent implementation is sometimes very valuable for the next reader’s study and for the health of the wider ecosystem.  Keep at it or at least share where you stopped—-don’t hoard until you have something perfect."}, {"id": 50625823, "au": "taf2", "dom": 350, "sr": 85, "sc": 4.31, "ep": 4.31, "bs": 0.0, "d": 0, "age": 15.38, "grav": 170.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 3801, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.23, "fa": 0.34, "gp": 0.313, "bl": 0.0, "ds": 0.0, "txt": "trynix is pretty nice... gcc package installed and 118MB download later... vi and a quick:\n\n```\n~ \u0023 ls\n\nhello.c\n\n~ \u0023 gcc hello.c -o hello\n\n~ \u0023 ./hello\n\nhello world\n\n~ \u0023\n\n```"}, {"id": 50629022, "au": "miloignis", "dom": 4, "sr": 86, "sc": 4.25, "ep": 4.25, "bs": 0.0, "d": 1, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1872, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 1.07, "bl": 0.0, "ds": 0.0, "txt": "This looks extremely cool! If I may offer you any encouragement, it would be to keep going and have fun and maybe share ideas or code across with unkernel? Esp as yall seem to be targeting slightly different use cases.\n\nRegardless, I appreciate your work, thank you for sharing! (I'm especially interested in Vulkan on WebGPU)"}, {"id": 50629782, "au": "steve_adams_86", "dom": 88, "sr": 87, "sc": 4.24, "ep": 4.24, "bs": 0.0, "d": 2, "age": 9.26, "grav": 78.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.494, "fa": 0.0, "gp": 0.504, "bl": 0.0, "ds": 0.0, "txt": "I've worked professionally with half a dozen languages, and learned half a dozen more for fun, and I actually have a soft spot for JS.\n\nI think Ruby is the one I never loved, and I actually don't enjoy writing it. I don't hate it, though.\n\nOnce you understand the prototype chain, some quirks, and get a grasp on the standard library/primitives, I think JS is actually quite capable and powerful. With TypeScript layered on top, I love using it. It's one of my favourite tools, up there with Rust, C\u0023, and Go.\n\nI even like JS more than Python, come to think of it. But I like Python a lot more than Ruby."}, {"id": 50629796, "au": "Primer81", "dom": 219, "sr": 88, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 0, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 7, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.938, "fa": 0.34, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "The article is jarring for me - in my 10 years of experience in the software industry, I haven't ever come close to needing javascript for anything. Javascript has certainly not taken over the world - just web dev AFAIK."}, {"id": 50625503, "au": "Cu3PO42", "dom": 234, "sr": 89, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 0, "age": 16.13, "grav": 184.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 2385, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.92, "fa": 0.0, "gp": 1.33, "bl": 0.0, "ds": 0.0, "txt": "Farid has been on an absolute roll recently. If you enjoyed this, I highly recommend his other blog posts.\n\nWhile I'm not sure about the practical utility of this, I love it as a demonstration of what is possible."}, {"id": 50626145, "au": "amelius", "dom": 55, "sr": 90, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 2, "age": 14.68, "grav": 158.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.924, "fa": 0.0, "gp": 1.233, "bl": 0.0, "ds": 0.0, "txt": "Javascript is actually a great language. Its garbage-collected closures made it easy to do GUI programming.\n\nThe C/C++ world where browsers came from didn't have this (closures). So it is actually a miracle we got a language as (relatively) great as Javascript."}, {"id": 50630740, "au": "larodi", "dom": 79, "sr": 91, "sc": 3.96, "ep": 3.96, "bs": 0.0, "d": 3, "age": 8.23, "grav": 65.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1995, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.233, "fa": 0.34, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "It is perhaps one of the greates languages, and honestly it is more or less a Perl for the web for those who have the eyes to see it. It is the only reason I'm not sad about Perl. But it WAS is more correct, as JS was abominated in many possible ways. But it was also written on the wall perhaps 5-6 years ago when Rust started to target wasm, that the days of JS are numbered. Now with LLMs we should see a very steep decline of it."}, {"id": 50635165, "au": "Primer81", "dom": 341, "sr": 92, "sc": 3.9, "ep": 3.9, "bs": 0.0, "d": 1, "age": 3.19, "grav": 19.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 7, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.249, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's what I'm saying. I'm 10 years into my career in software. I've never learned JS and I dont really plan on it any time soon. It most certainly is not \"the defacto language for all software\". I can think of many languages more worthy of that title, but honestly none of them truly are. It is the defacto language for web dev, but I don't work in web dev... conflating software with the web dev industry is just annoying tbh."}, {"id": 50626113, "au": "luipugs", "dom": 268, "sr": 93, "sc": 3.87, "ep": 3.87, "bs": 0.0, "d": 2, "age": 14.75, "grav": 159.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 88, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.893, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is the nested trynix demo. Trynix itself was 2-32x faster depending on the workload according to him."}, {"id": 50628014, "au": "oddthink", "dom": 345, "sr": 94, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 0, "age": 11.29, "grav": 105.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 481, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.094, "fa": 0.34, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "The JavaScript folks always seem like they're in a bubble. I mean, yes, JavaScript is everywhere on the web. But, no, 95% of my code (and the code of everyone adjacent to me) is Python, with some C++ and Go to fill in the cracks, and I don't see any sign of a mass migration to JavaScript."}, {"id": 50626651, "au": "anal_reactor", "dom": 76, "sr": 95, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 4, "age": 13.52, "grav": 139.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 7, "k": 1387, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.791, "fa": 0.7, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> the only issue was slightly unfamiliar syntax\n\nI was banished from golang communities when I said that a language should deviate from already established standards only when it has a good reason to do so. I remember it being quite ironic that golang took pride in not overloading names, and then... overloaded the English word \"go\". It's really unreadable unless you specifically study golang.\n\nI could go on very long how much I hate golang for its stupid syntax alone, even before we dive deeper into its broken features.\n\nRegarding Scheme itself, functional languages never gain traction because both humans and machines think imperatively. Yes, functional languages are a beauty for someone who understands them well, and in some specific use cases, but I still remember that as a student I finished my project, I just needed to add a few prints... oh fuck I need to rewrite the entire thing just to add \"print\". Never touched functional programming again, except for functional elements in imperative languages."}, {"id": 50629947, "au": "mattgreenrocks", "dom": 53, "sr": 96, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 2, "age": 9.1, "grav": 76.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 5, "k": 9229, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.879, "fa": 0.42, "gp": 0.394, "bl": 0.0, "ds": 0.0, "txt": "> I don't get the Js hate\n\nPart of it comes from the fact that it feels like people who are less serious about software end up dictating the languages/libraries that everyone else has to put up with simply because they're the majority, not because the language is technically superior. Worse is better, and all that.\n\nAgain: feels like. There are plenty of serious people doing work in JS, and plenty of non-serious people in other languages."}, {"id": 50634123, "au": "shermantanktop", "dom": 30, "sr": 97, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 8, "age": 4.58, "grav": 29.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 5234, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.17, "fa": 0.34, "gp": 0.075, "bl": 0.0, "ds": 0.0, "txt": "I have a similar story.\n\nIf you’re old enough, you experienced when computer people were greasy nerds who made a regular salary and were looked down on by normies who worked in sales and other normie jobs.\n\nI did get into FAANG through a side window when such windows still existed.  And tbh they still do, but it’s almost always via acquisition.\n\nBut if I had started that journey 5 years later, chances are good I’d be in a different spot."}, {"id": 50632705, "au": "sashank_1509", "dom": 171, "sr": 98, "sc": 3.78, "ep": 3.78, "bs": 0.0, "d": 4, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 2547, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "They do prevent you from practicing a craft unless you’re being completely disingenuous. The presence of IKEA has completely hollowed out woodworking as an activity and we just have clean, cookie cutter, boring and plain furniture everywhere. There are a few holdouts, like Tokyo, London (for furniture) that exist as remnants of a culture that actually prizes quality over quantity and price. Outside of a complete societal reset, they will remain holdouts while the world around rushes towards cheap, cookie cutter stuff for everything, now including software & maths & maybe more. This is a strict lowering of my quality of life."}, {"id": 50630964, "au": "godwinson__4-8", "dom": 13, "sr": 99, "sc": 3.66, "ep": 3.66, "bs": 0.0, "d": 1, "age": 8.0, "grav": 63.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 538, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.19, "fa": 0.0, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "I found myself a bit confused by your ending sentiments on your page.\n\n\"Let's hurry up and value the progress of technology before it values us back.\"\n\nDid you write this? What does it mean? It sounds like you close by suggesting the window of having this personal capability is closing but I'm not sure why \"value us back\" is the caution. Just wondering what this is meant to mean and how is that connected with the capability being gone?\n\nYour project is extremely cool just thought given I read it (perhaps this part is also LLM authored) and was curious about this part I would ask you to clarify."}, {"id": 50626623, "au": "GuB-42", "dom": 109, "sr": 100, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 2, "age": 13.6, "grav": 140.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 22398, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.717, "bl": 0.0, "ds": 0.0, "txt": "I don't get the hate for any mainstream language.\n\nI mean, you can hate a language compared to another language, but to the point of making you hate programming? To me, if you do, you probably don't really like programming in the first place. Especially considering that Javascript is a conventional language with variables, conditions, loops, functions, etc... the kind that should be mostly transparent to an experienced programmer.\n\nIt would be like a woodworker saying that pine made him hate woodworking, sure, you may prefer to work with oak, but pine is still wood."}, {"id": 50634046, "au": "Primer81", "dom": 227, "sr": 101, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 4, "age": 4.68, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 7, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.399, "fa": 0.0, "gp": 0.195, "bl": 0.0, "ds": 0.0, "txt": "I was trying to make a point about what languages I've needed to learn when writing my own software for work or personally. Not the languages used to make the software tools that I use.\n\nWhich is only meant to support my other point that the article seems to over emphasize the universality of JS as if it already has become the \"defacto language for all software\". It's a foreign perspective to me as a software engineer with no JS experience =/\n\nUnless your point is that JS goes beyond web dev; in which case I agree vscode is a good example."}, {"id": 50627006, "au": "thisismyopinion", "dom": 113, "sr": 102, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 3, "age": 12.81, "grav": 128.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 22, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.107, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is silly. In ruby I can put down my thoughts 4x faster than if was writing JS. The syntax is more readable. etc. Each to their own but can't stand looking at JS nevermind all it's weird quirks we still have to live with.\n\nYour analogy with woodworking is deeply flawed as well. Woodworkers do actually strongly prefer certain types of wood."}, {"id": 50626650, "au": "InsidiousWombat", "dom": 115, "sr": 103, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 3, "age": 13.52, "grav": 139.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 25, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.008, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the stdlib is ass, the language is crude (just look at available data types), and the ecosystem is managed by groups of unsupervised children.\n\n> It would be like a woodworker saying that pine made him hate woodworking, sure, you may prefer to work with oak, but pine is still wood.\n\nIt would be like woodworker getting dull tools to work and wood being rotten"}, {"id": 50635186, "au": "mercnz", "dom": 19, "sr": 104, "sc": 3.56, "ep": 3.56, "bs": 0.0, "d": 3, "age": 3.17, "grav": 19.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 8, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.515, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "damn that was wall of text, but i wonder if the actual thing to do is create a web site that you can cut and paste a whole lot of project ideas and it matches against  other uses and makes a match.  i have a random project that used candle to try and match text blobs... seems i added ollama support too."}, {"id": 50627534, "au": "sdevonoes", "dom": 137, "sr": 105, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 1, "age": 11.92, "grav": 114.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2220, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.034, "fa": 0.28, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "Don’t get it. Haven’t you used tons of other prog languages? Python, Go, C, Pascal, Java, Clojure, Ruby, PHP, C++, etc etc\n\nI dislike every single one of them. I like tons of features of, for example, Go, but hate with passion its err handling. Same can be said about every single language I have used. Nothing particularly different about JS"}, {"id": 50626083, "au": "yorwba", "dom": 259, "sr": 106, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 2, "age": 14.84, "grav": 161.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 16195, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.363, "fa": 0.0, "gp": 0.228, "bl": 0.0, "ds": 0.0, "txt": "Not everything has to be about security. Convenience is also pretty desirable. The ease and speed of trying out programs with trynix.dev has instantly catapulted it to the top of my list of things to show people who're curious about Linux but not ready to muck about installing a bunch of stuff to satisfy that curiosity."}, {"id": 50629535, "au": "hobofan", "dom": 261, "sr": 107, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 2, "age": 9.54, "grav": 81.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 8361, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.449, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "What is this FUD? The papers you cited have next to nothing do with sandboxing. They are mainly about guest WASM security (e.g. \"how vulnerable is an already vulnerable C program against things like arbitrary memory reads in the guest program\"), and have nothing to do with sandbox escape. There are also plenty WASM runtimes that exist outside of browser engines with proper safeguards."}, {"id": 50625570, "au": "swiftcoder", "dom": 317, "sr": 108, "sc": 3.47, "ep": 3.47, "bs": 0.0, "d": 1, "age": 16.01, "grav": 181.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.055, "fa": 0.0, "gp": 0.686, "bl": 0.0, "ds": 0.0, "txt": "I don't think anyone draws a particular distinction between asm.js (the \"javascript\" of the presentation) and WASM.\n\nWASM is an optimisation of something that, while technically javascript, was already unreadable compressed bytecode..."}, {"id": 50626451, "au": "ChrisMarshallNY", "dom": 124, "sr": 109, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 1, "age": 14.0, "grav": 147.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.968, "bl": 0.0, "ds": 0.0, "txt": "Can relate. I was never affected by JS (it was not prevalent in my corner of the industry), but I was pretty demoralized by the awful nosedive in software quality, the ethical collapse of the software industry, and the dependapocalypse (the lethal trifecta).\n\nI, too, was a manager, and that trained me to rely on \"black box\" code, written by others, and how to evaluate and control its Quality and feature set. Running an LLM is pretty much an extension of that. I didn't like being a manager, but that was mostly because of corporate garbage, not because the work was bad (I was just not allowed to do as much as I wanted to).\n\nI love coding, but I like design, architecture, and delivery, even more, and LLMs allow me to exercise these. Now that I'm retired, I no longer have to deal with high-Dilbert-Index work environments, and that makes all the difference.\n\nLLMs have given me extra time back, which I am using to study graphic design."}, {"id": 50626508, "au": "torginus", "dom": 39, "sr": 110, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 3, "age": 13.85, "grav": 144.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 236, "qw": 0, "k": 9579, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.712, "fa": 0.28, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "though on second consideration, there was something that was AWFUL about JS in that era - the total confusion about the state of the art. I was getting constantly bombarded with articles about how JS is the future of engineering, how the biggest companies have already transitioned to this or that framework and that is the future.\n\nWhen learning something new, there's a transitionary era, where you just don't get it, but assume the experts do, and eventually you will as well.\n\nThat is unless you're talking about something like quantum mechanics, where not getting it is the sign that you're not smart enough.\n\nAnd I didn't get it, and I constantly assumed I was two tutorials away from eureka. But no. I suspected that maybe the people dispensing wisdom and confidently decrying how their stuff is better might have been wrong, I thought it was just hubris and hunkered down, and eventually gave up, assuming I can't keep up with the state of the art anymore.\n\nThe turning point came when I encountered a bundler bug in a fairly reputable library, and delved into its source - I expected to find some reasonable compiler stuff in there - tokenizing, parsing etc. etc. but what I found was a bunch of regexes and string replacements.\n\nAt that point I had evidence that to at least some degree, the patients were running the madhouse, and while VB6 might be deeply unsexy, I highly doubt it's comp"}, {"id": 50627989, "au": "ryandrake", "dom": 125, "sr": 111, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 2, "age": 11.32, "grav": 105.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 73681, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.221, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The thing that really pushed me out of writing software as a profession was the entire industry’s casual attitude about quality, defects, and correctness. The “just ship it, we can live with bugs” and “no software is bug free” mantras. To me, software is like a math equation: it’s either correct or it’s not. Almost all of the business of software tolerates “incorrect” to a ridiculous degree, so I won’t write software for a business anymore. I write software only at home as a hobby, now."}, {"id": 50626474, "au": "vanderZwan", "dom": 95, "sr": 112, "sc": 3.39, "ep": 3.39, "bs": 0.0, "d": 2, "age": 13.93, "grav": 145.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 19433, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "I think people both are stuck in the 2000s image of JS, and conflate the language with the ecosystem a lot, as well as with using it where other tech stacks would be so much saner. The latter two things give JS a worse rep than it deserves imo. Although to be fair, if you write JS for work the ecosystem is almost unavoidable, so hating JS for that is somewhat deserved.\n\nPersonally, ever since ES5 I really started to enjoy writing javascript, and by now practically all the warts feel quite easy to avoid. I can't say if that's personal mastery or language improvements, probably bit of both.\n\nI still hate the ecosystem though, and always disliked it more than I ever disliked the insane var scoping rules or whatever from twenty years ago."}, {"id": 50628655, "au": "skydhash", "dom": 214, "sr": 113, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 5, "age": 10.53, "grav": 94.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 6772, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.44, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "My spouse’s personal digital world is social media and a couple of puzzle game. There’s a laptop, but that’s mostly used for watching movies and doing some stuff that is awkward on the laptop. The web doesn’t exist other as a way to get to a few place. iOS and macOS don’t exist. There’s only tasks and tools. like you think as the kitchen to find the microwave to reheat your food."}, {"id": 50626926, "au": "bhaak", "dom": 160, "sr": 114, "sc": 3.35, "ep": 4.2, "bs": 0.85, "d": 5, "age": 12.96, "grav": 130.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 29, "k": 4503, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.197, "fa": 0.42, "gp": 0.129, "bl": 0.32, "ds": 0.0, "txt": "> And why was it the only language in the browsers?\n\nNobody wanted to implement another language which would have broken cross browser functionality for animating menus on HTML pages.\n\n> And why did it spread to servers?\n\nBecause frontend devs didn't want to learn another programming language.\n\n> Java was bloated and PHP even more ugly. So I also choose node.\n\nSo you chose an environment that was slow, single-threaded, had an immature ecosystem, callback hell, and was difficult to debug. To each their own I guess."}, {"id": 50630265, "au": "sva_", "dom": 289, "sr": 115, "sc": 3.34, "ep": 3.34, "bs": 0.0, "d": 0, "age": 8.74, "grav": 71.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 10588, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.059, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "Got Firefox inside Firefox working... obvious thing to try is run Firefox inside Firefox inside Firefox, but tab crashes.\n\nedit: busted, didn't finish reading."}, {"id": 50626124, "au": "xdennis", "dom": 188, "sr": 116, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 1, "age": 14.73, "grav": 159.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2775, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.183, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Honestly, this is the only reason I find joy in AI killing programming. I don't have to listen to such dumb takes.\n\nPray tell, what's the perfect programming language that you prefer that has no faults?\n\nPeople think JavaScript is bad language simply because they never bother to learn how it works. As an example of why JS sucks people often give examples such as 'if you XOR a float and an array you get the string \"false\"' as if that operation even makes sense. JavaScript has had for years pretty much the same feature set as every other major equivalent language (like Python)."}, {"id": 50629797, "au": "tyre", "dom": 7, "sr": 117, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 1, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 12843, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.03, "fa": 0.0, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "Keep at it! You have an appreciation for the craft and goals of the project.\n\nSo much of modern software development is now product sense. You might find encouragement that others have validated that what you’re building is useful!\n\nYou don’t know where unikernel will (or won’t) go in the future. You can be the standard still."}, {"id": 50629475, "au": "anilgulecha", "dom": 32, "sr": 118, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 1, "age": 9.6, "grav": 82.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 2942, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "@gbl08ma - want to add in my encouragement as well. As much as I appreciate and like unkernel, you should absolutely give this a shot. Aim for the thing you care about (performance, size over network, existing images working etc) and build for it. You'll find an appreciative audience.\n\nHave started your repo!"}, {"id": 50629633, "au": "marssaxman", "dom": 96, "sr": 119, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 3, "age": 9.44, "grav": 80.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 10675, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am certainly stuck in the 2000s image of JS, because that is when I got so sick of web tech that I routed my career away from having anything to do with it. No regrets there.\n\nIt's been fun, recently, to discover that agents can deal with all the javascript for me, so I can whip up little visualizers, explorers, interactive reports, etc, to share with my coworkers. Much more fun than plain text and graphs."}, {"id": 50630121, "au": "anthomtb", "dom": 342, "sr": 120, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 0, "age": 8.9, "grav": 73.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1186, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.276, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "It is heartwarming to see so many other Javascript haters in these parts. I can't stand the prevalence of that language and wish it would die a fast, fiery death.\n\nI mean, Javascript okay for pure web programming. But if your software executes in any environment other than a  browser, please use a real language."}, {"id": 50629652, "au": "specialist", "dom": 349, "sr": 121, "sc": 3.23, "ep": 3.23, "bs": 0.0, "d": 0, "age": 9.41, "grav": 80.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 10865, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.154, "bl": 0.0, "ds": 0.0, "txt": "One step closer to distilling the browser down to just protocol, canvas, local I/O, and runtime.\n\nFinally allowing an unhappy humanity to cast off all that HTML, CSS, DOM, event bubble, mime-type, etc. nonsense.\n\nSquint a little bit, and you'll see the ghost of JNLP (waving \"Hi!\")."}, {"id": 50626757, "au": "nurettin", "dom": 178, "sr": 122, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 1, "age": 13.29, "grav": 135.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 26, "k": 4069, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.746, "fa": 0.42, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "> Javascript is so awful, and until recently so prevalent in the roles available to me, that it made me want to not be a Software Engineer anymore.\n\nI was thinking about this, but in a more general sense. All those libraries, languages, their pitfalls and quirks made me not want to code at all, or at least automate coding to a degree where I don't have to suffer through someone's open source project. And in a way I got my wish."}, {"id": 50625601, "au": "egeozcan", "dom": 319, "sr": 123, "sc": 3.14, "ep": 3.14, "bs": 0.0, "d": 2, "age": 15.94, "grav": 180.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 6797, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Same OS thread, same event loop and it shares its memory, but a completely different runtime. I really love JS but OP has a point.\n\nSo philosophically yes, its the same thing, but that talk has so much emphasis on something so quirky being the universal runtime. WASM isn't JS-level quirky."}, {"id": 50625907, "au": "revengerwizard", "dom": 361, "sr": 124, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 1, "age": 15.23, "grav": 168.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 19, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.111, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "WASM ported demos for games are pretty useful as an easy first try; after all, almost everyone uses a browser, one way or another. The alternative would be handing out executables.\n\nThere are certainly many more other applications."}, {"id": 50625863, "au": "forcedtolinux", "dom": 250, "sr": 125, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 1, "age": 15.29, "grav": 169.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 30, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.236, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "For me, personally, it is super useful when I am using a company pc or someone's pc with windows, and I would like to do some linux magic to process files or do some shell magic.\n\nMaybe you can do it with windows, but opening a browser tab and being able to be in an almost limitless ephemeral environment is amazing.\n\nI asked as a top comment too... if you can download files from the filesystem, then it'd be great"}, {"id": 50625585, "au": "throwaway27448", "dom": 360, "sr": 126, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 0, "age": 15.98, "grav": 181.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1777, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.32, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I know there is some use of webassembly in the browser, but I'm not sure what the last time I actually used it was. I really hate using the browser if I can avoid it and pretty much everything that can be compiled to webassembly works fine natively.\n\nPlus, with LLMs, the advantage of having a single mediocre common ground disappears. Anything with actual user interfaces will benefit from native targeting."}, {"id": 50626595, "au": "ChrisMarshallNY", "dom": 132, "sr": 127, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 3, "age": 13.65, "grav": 141.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 38211, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.284, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I ran a pretty high-functioning C++ shop, myself (image processing and device control). I know everyone loves to hate on C++, hereabouts, but it's one of those \"industrial\" languages, that will allow bad programmers to make a terrible mess, and good programmers to make awesome software.\n\nWhat I was always bemused by, was the rise of Javascript (Typescript, really) as an enterprise language."}, {"id": 50625490, "au": "boxed", "dom": 316, "sr": 128, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 0, "age": 16.16, "grav": 184.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3984, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.762, "bl": 0.0, "ds": 0.0, "txt": "Well.. the prediction was about JavaScript. This is WebAssembly. A big part of the reason the timeline accelerated is that the goal post was moved. A lot."}, {"id": 50632449, "au": "SoftTalker", "dom": 167, "sr": 129, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 3, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.051, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Those people can simply not use AI. They probably didn't like IDEs either, and it's still totally possible to create software with a text editor and a Makefile.\n\nI can get furniture by either buying it from someone else, buying a kit from Ikea, or devoting a few decades to learning how to build it myself. None of those choices prevent anyone from choosing differently."}, {"id": 50626005, "au": "diath", "dom": 362, "sr": 130, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 2, "age": 15.0, "grav": 163.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1232, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Gamers have this prejudice that if a game runs in the browser, it feels cheap, potentially de-valuating your project. And if you want to ship a demo to your players, you can do it through Steam without just yet releasing the full version of the game."}, {"id": 50629405, "au": "dominotw", "dom": 185, "sr": 131, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 1, "age": 9.66, "grav": 83.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 36, "k": 6923, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.683, "fa": 0.42, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "> But I feel the complete opposite about AI. In fact, AI brought back the fun that was stolen from my life by Javascript. I'm now retired and spend a good amount of my day working my own programming projects.\n\nPPl with no skills ( no offense) are the biggest opponents of AI now. Awful ppl at work think they are now my equals ( or even superior) because they \"love ai\"."}, {"id": 50629842, "au": "steve_adams_86", "dom": 52, "sr": 132, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 4, "age": 9.2, "grav": 77.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 11667, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 1.23, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The pre-SPA jQuery era was kind of incredible. We were doing such crazy stuff, just seeing what would stick. That was an exciting time. What are the limits of what the browser offers us? How far can we push this poor little language? Some genuinely great things shook out of that mess. It was a lot of fun. A great time to be learning. It showed that a lot was possible with limited tooling, platform limitations, a poorly-designed language and runtime, and some enthusiasm."}, {"id": 50625632, "au": "saagarjha", "dom": 266, "sr": 133, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 0, "age": 15.86, "grav": 179.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 62209, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.591, "fa": 0.0, "gp": 1.008, "bl": 0.0, "ds": 0.0, "txt": "Part of the justification in the talk was that people did this not just because it was funny, but because it ended up faster because of the investment in web engines. Well, is it?"}, {"id": 50630476, "au": "gwbas1c", "dom": 49, "sr": 134, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 5, "age": 8.52, "grav": 69.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 16198, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree: I'm shipping a product built in WASM, and the performance issues and lack of direct browser API access are real limiting factors. Even I wonder if transpiling to JavaScript would be better overall than WASM."}, {"id": 50630906, "au": "sashank_1509", "dom": 166, "sr": 135, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 2, "age": 8.05, "grav": 63.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 2547, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would go further, AI destroys the work of people who want to be a master craftsman. Like the Japanese Sushi master, who spends his entire life mastering a skill down to its very small details, reminds me of the book “Zen and the Art of Motorcycle Maintenance”\n\nAI is great for those who always wanted to be managers. They can achieve their dream right out of college now, no need to grind for years to reach a managerial position."}, {"id": 50628116, "au": "dirkc", "dom": 89, "sr": 136, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 11.14, "grav": 103.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 950, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.877, "fa": 0.0, "gp": 0.516, "bl": 0.0, "ds": 0.0, "txt": "I've learned to like JavaScript, but only after I worked with a few different C++ codebases.\n\nI think after a while, you realize that atrocities will be committed in every possible programming language and to prevent those you need culture over syntax.\n\nBut honestly, the thing that I like most about JavaScript is the ease to ship. I'd rather have more people use the thing I wrote than trying to convince people to install what I wrote."}, {"id": 50626267, "au": "swiftcoder", "dom": 320, "sr": 137, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 3, "age": 14.43, "grav": 154.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 4, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 1.184, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> WASM isn't JS-level quirky\n\nI mean, WASM-in-JS kind of still is that quirky. Since we constantly have failed to expose a native WASM browser API, all of our WASM is glued together with weird generated javascript hacks..."}, {"id": 50629728, "au": "0xbadcafebee", "dom": 348, "sr": 138, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 0, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "Insanity, n.: having perfectly good, fast, stable, well-documented, well-designed, widely-supported programming languages, and throwing them away to instead reinvent the wheel in the form of a toy language created to make pop-ups in a hypertext document viewer"}, {"id": 50627284, "au": "glimshe", "dom": 182, "sr": 139, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 2, "age": 12.34, "grav": 120.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 9121, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 0.839, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If I were convinced that AI was so bad for humanity, I'd have no problem dropping it. From dust to dust, from pure C to pure C. I can go back to manually coding in languages like C\u0023 and C. I also want to learn Rust.\n\nI don't think that the external problems we see are intrinsic of AI. Firstly, we live in a bubble world where any new promising technology would get insane amounts of investments anyway. I think the issue with the data center build out isn't as much that we are building too many of them, but that we're building them so quickly that we're overlooking environmental and human concerns.\n\nSecondly, the jury is out there on whether AI is a net positive or negative to humanity as a technology, aside from the other concerns. It wouldn't be intellectually honest to state either with certainty.\n\nIt has been a net positive for me but I'd be okay if society decides, with proper evidence and debate, that we can't have it.\n\n(as long as we bury Javascript with it :) )"}, {"id": 50632348, "au": "SoftTalker", "dom": 126, "sr": 140, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 3, "age": 6.44, "grav": 46.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 26864, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.941, "fa": 0.0, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "Funny because I'm the opposite. If I'm writing software for myself, I only care that it does the exact thing I need. I don't worry about generalizing it, or if it's possible to crash it with invalid inputs (I just don't send it invalid inputs).\n\nIf I'm writing for a business or someone else, I try to be much more careful about building robust software."}, {"id": 50627095, "au": "speleding", "dom": 44, "sr": 141, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 3, "age": 12.64, "grav": 125.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1919, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.944, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I agree. But I am disappointed that none of the initiatives to put another language in the browser came to fruition (except WASM). Something like Ruby would have been nice."}, {"id": 50626719, "au": "reacharavindh", "dom": 307, "sr": 142, "sc": 2.73, "ep": 2.73, "bs": 0.0, "d": 2, "age": 13.37, "grav": 136.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 7077, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.161, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That is the default Dock on Gnome?! \nI remember GNOME desktop was much different.. with the top bar, fullscreen \"Launchpad\" etc. I want the clean look this project has in the browser.. Do you think they trimmed GNOME down to achieve this?"}, {"id": 50626881, "au": "dom96", "dom": 251, "sr": 143, "sc": 2.71, "ep": 2.71, "bs": 0.0, "d": 1, "age": 13.03, "grav": 131.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 11, "k": 7412, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.421, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> oh its not actually realistic to use this in production because...\n\nInteresting you give both V8 isolates and Pyodide as examples. At Cloudflare both are used in production for JS Workers and Python Workers.\n\n(I work at Cloudflare on them both)"}, {"id": 50627297, "au": "LeBit", "dom": 102, "sr": 144, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 2, "age": 12.32, "grav": 120.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 533, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.019, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "I always thought I was too incompetent to understand why JavaScript was a bad language.\n\nI wrote software in js and then moved to ts and sometimes have to go back to js. It’s fine to me.\n\nIgnorance is bliss I guess."}, {"id": 50627476, "au": "swiftcoder", "dom": 322, "sr": 145, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 3, "age": 11.99, "grav": 115.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 1.126, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "We ported plenty of existing executable programs to asm.js before WASM was even conceived of - the whole emscripten project was built around this. WASM was designed from the start to be a drop-in replacement for asm.js"}, {"id": 50629904, "au": "layer8", "dom": 215, "sr": 146, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 6, "age": 9.14, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 5, "k": 43363, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.605, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> iOS and macOS don’t exist\n\nSurely there’s somewhere she clicks or taps on app icons to open apps, somewhere she sees notifications, unlocks the device, uses an on-screen keyboard, and so on. That’s the OS. If she would change the OS, say from iOS to Android, that’s what would change. If what you say were true, she wouldn’t be able to perceive any difference between the two."}, {"id": 50633532, "au": "pyaamb", "dom": 17, "sr": 147, "sc": 2.6, "ep": 2.6, "bs": 0.0, "d": 1, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 211, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 0.866, "fa": 0.0, "gp": 0.391, "bl": 0.0, "ds": 0.0, "txt": "I'm daydreaming of \"Clippy\" popping up in Claude and saying \"Hey! It looks like you're working on [Big Project Idea]. [Other Claude User] is also burning a lot of tokens on this. I should introduce the two of you to explore collaboration!\""}, {"id": 50626746, "au": "k__", "dom": 205, "sr": 148, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 1, "age": 13.31, "grav": 135.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 15890, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "wasm_javascript", "flbl": "WASM & Javascript (Web)", "urls": [], "ig": 0.868, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "\"I kind of doubted it and I still do.\"\n\nWhat's there to doubt? It's reality for me for at least a decade now.\n\nEvery app I use for work runs in the browser. Writing, design, programming, email, messenger. I open a browser and things just work, irrespectively of the OS."}, {"id": 50631849, "au": "refulgentis", "dom": 15, "sr": 149, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 3, "age": 6.97, "grav": 51.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 4999, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.085, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "FWIW there's this weird thing where a positive differentiator now is extremely short rushed human text. Might be a benefit here: I'm deeply desirous of something like unkernel/what you've built and my agents working, right now, on trying yours because Unkernel is giving pathological memory growth on WebKit. But I stopped reading yours after ~30s because there was too much content."}, {"id": 50626763, "au": "iberator", "dom": 321, "sr": 150, "sc": 2.54, "ep": 2.54, "bs": 0.0, "d": 2, "age": 13.28, "grav": 135.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 337, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.08, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "huge difference - you can port existing executable programs to it. and they will work.  WASM is Java Applets 2.0 but with near native performance and better security design"}, {"id": 50628448, "au": "chr15m", "dom": 264, "sr": 151, "sc": 2.53, "ep": 2.53, "bs": 0.0, "d": 1, "age": 10.74, "grav": 97.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 2077, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_furniture", "flbl": "Linux & Furniture (Machine)", "urls": [], "ig": 1.076, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It goes over a websocket connection to a TCP/UDP proxy called Wisp. I am not sure who is hosting the other end of the proxy - I guess the author."}, {"id": 50626089, "au": "dguest", "dom": 163, "sr": 152, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 2, "age": 14.82, "grav": 160.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1736, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "inside_code", "flbl": "Inside & Code (Enjoy)", "urls": [], "ig": 0.912, "fa": 0.0, "gp": 0.258, "bl": 0.0, "ds": 0.0, "txt": "Minor clarification: the poster you're replying to didn't say they don't like to code. They just don't like to code javascript. It sounded like they still enjoy writing other code, though.\n\nI completely agree: there are a a few libraries that I have to work with that are insultingly badly designed, almost like the designers were trying to spite the users. But I have to use them, so vibecoding is great. There are other languages where programming is still fun."}, {"id": 50636093, "au": "goodmythical", "dom": 295, "sr": 153, "sc": 2.49, "ep": 3.34, "bs": 0.85, "d": 4, "age": 1.83, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "webassembly_unkernel", "flbl": "Webassembly & Unkernel (Project)", "urls": [], "ig": 1.422, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "croc is my number one favorite under-used under-rated projects.\n\nLiterally any two devices on just about any internet connected device, supposing only that you're not on a super locked down corporate network can share files and now even ssh sessions so you can croc in to an existing ssh session if you want to have a single ssh session shared across multiple devices.\n\nLove that you donated!"}, {"id": 50629436, "au": "johsole", "dom": 136, "sr": 154, "sc": 2.48, "ep": 2.48, "bs": 0.0, "d": 1, "age": 9.63, "grav": 82.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 126, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "language_hate", "flbl": "Language & Hate (Javascript)", "urls": [], "ig": 0.955, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "I don't like Javascript either, but I do like Typescript.\n\nI really like Scala, Java is Ok, Python is nice.\n\nNow that LLMs do most of my coding I don't really care anymore about languages, although when possible a compact type s
