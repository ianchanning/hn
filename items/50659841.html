king building are better for health.\n\nI wish when we build new theaters or public buildings in the west we would consider such designs, rather then some modernist abstract shape that 'challenges' what we think of architecture or whatever these modern building concepts are supposed to be.\n\nIn my city they just tried to build something like that, and its not even as bad as it could have been:\n\nhttps://neuesluzernertheater.ch/\n\nVoters rejected it.\n\nHere another good example from my city, the train station:\n\nThe new one: https://manchesterhistory.net/architecture/1980/luzernstatio...\n\nThe old one: https://manchesterhistory.net/architecture/1980/luzernstatio...\n\nWhy are we doing this to our society?"}, {"id": 50662803, "au": "rramadass", "dom": 86, "sr": 2, "sc": 7.87, "ep": 7.87, "bs": 0.0, "d": 1, "age": 17.66, "grav": 213.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 107, "qw": 0, "k": 6147, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": ["https://en.wikipedia.org/wiki/Air_pollution_in_Lahore", "https://www.dawn.com/news/2046301", "https://www.iqair.com/in-en/newsroom/lahore-among-top-10-most-polluted-cities-in-the-world-9-8-2026"], "ig": 1.713, "fa": 0.96, "gp": 0.768, "bl": 0.0, "ds": 0.0, "txt": "This comment is completely suspect.\n\nLahore has been consistently ranked one of the worst in the world when it comes to pollution over the last decade. There are plenty of articles on the web (from Pakistani sources themselves) and a wikipedia page detailing it.\n\nAir pollution in Lahore - https://en.wikipedia.org/wiki/Air_pollution_in_Lahore\n\nLahore once again ranks as world's most polluted major city as AQI crosses 500 - https://www.dawn.com/news/2046301\n\nSeptember 8, 2026: Lahore among top 10 most polluted cities in the world - https://www.iqair.com/in-en/newsroom/lahore-among-top-10-mos...\n\nThe Attari(India) - Wagah(Pakistan) border is heavily developed and manned by security forces with bus transport on both sides. There are no \"abandoned villages\" anywhere near that border and everything is strictly monitored for miles around - https://en.wikipedia.org/wiki/Attari%E2%80%93Wagah_border_ce..."}, {"id": 50660682, "au": "InexSquirrel", "dom": 58, "sr": 3, "sc": 7.83, "ep": 7.83, "bs": 0.0, "d": 1, "age": 23.45, "grav": 338.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 16, "k": 189, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.543, "fa": 0.76, "gp": 1.403, "bl": 0.0, "ds": 0.0, "txt": "> The western world always seems to assume that it has nothing to learn from the east\n\nGenuinely don't know where that sentiment comes from. Maybe it held true 50 years ago, but I don't think it does now. A wealth of artists, artisans and philosophers from 'The East' have captured the imaginations of people world wide.\n\nWhat I find interesting whenever a famous artisan ( I mean like REALLY famous locally, like Mumtaz ) is from another country and people from the 'Anglosphere' don't know about them, it's always because of some racist undertone.\n\nMy wife is Japanese, and has absolutely no idea who any influential Western individuals are - couldn't tell you an iota about Turing, Descartes, Napoleon, Tim Cooke, Steve Jobs, Columbus - no one. But she absolutely knows the key people that shaped Japanese history.\n\nSo I dunno. I think it's OK for people in their countries to really know who's who, and cool for everyone outside of those countries to learn about them. But I'd say don't assume malice where ignorance is more likely."}, {"id": 50664176, "au": "caniscrator", "dom": 55, "sr": 4, "sc": 7.72, "ep": 7.72, "bs": 0.0, "d": 0, "age": 14.02, "grav": 147.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 331, "qw": 0, "k": 9, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.962, "fa": 0.68, "gp": 0.81, "bl": 0.0, "ds": 0.0, "txt": "I got to spend time in a couple of his buildings and it is hard to put into words how different they feel from an ordinary concrete house. The walls are lime, not cement, finished in limewash tinted with natural pigment, so the colour lives in the surface and the plaster breathes. The air inside stays dry and faintly mineral. No trapped damp, no paint smell.\n\nThe roofs are what stopped me. No reinforced concrete slab overhead anywhere. The domes and vaults are brick set in lime, shaped so the whole thing stands in pure compression, which is why they need no steel inside them, the thrust runs down into thick masonry walls instead of being held by rebar. His craftsmen rebuilt methods that had nearly died out, the flat brick dome and the muqarnas, and one of them said it had not been done in 300 years. The dome ceilings are finished in ghalibkari.\n\nWhy it matters past the look: a reinforced concrete building is on a clock. The steel inside corrodes, expands and spalls the concrete off, which is why so much RC gets written off around the 50 to 60 year mark. Lime has nothing in it to rust. It also heals itself, a hairline crack takes in moisture and the lime redeposits as calcite and closes. And when a lime building finally comes down, the mortar is softer than the brick, so the bricks lift out clean and get used again. Cement mortar is harder than the brick, so you are left with ru"}, {"id": 50665978, "au": "kakacik", "dom": 11, "sr": 5, "sc": 6.84, "ep": 6.84, "bs": 0.0, "d": 6, "age": 10.01, "grav": 87.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 203, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.783, "fa": 0.62, "gp": 0.612, "bl": 0.0, "ds": 0.0, "txt": "Dude we talk about Lahore, Pakistan and you start arguing with one of the cleanest and safest countries in the world. Then you realize you are incorrect, but still refuse to acknowledge topic is more complex. Certainly doesn't seem like you actually traveled much.\n\nAnd its not Genf but Geneva or Genève if you want to show some respect.\n\nAlso, its far from fully safe, I've lived there 12 years and still live nearby. I've seen attacks during the day, I've been threatened by paranoid drug dealer who thought I am police guy following him. My friend who is a doctor in biggest hospital was beaten to pulp in very busy street without doing anything, just wrong place at wrong time. His wife is also a doctor and had to tend to numerous stabbings including mortal ones during her service at SMUR service (those painted bmws with sirens that speed along ambulance to critical cases). I could go on for a while. City has strict policy to suppress as much info about these events as possible to attract and retain wealth but they keep happening. Lausanne is even worse now as per Geneva police chief who is a patient of my wife (also a doctor). Better pick Bern for example."}, {"id": 50660831, "au": "comrade1234", "dom": 75, "sr": 6, "sc": 6.43, "ep": 6.57, "bs": 0.0, "d": 0, "age": 23.14, "grav": 331.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 311, "qw": 0, "k": 3268, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.811, "fa": 0.28, "gp": 1.048, "bl": 0.0, "ds": 0.0, "txt": "Lahore is beautiful. I was spending a lot of time in India for work, Delhi and Hyderabad. You get used to the pollution and garbage everywhere.\n\nMy wife had a business meeting in Lahore so I went to Amritsar and crossed on foot (I don't think you can do this anymore). I spent a couple of hours being interrogated by border agents before I realized I wasn't even out of India yet. They made me exchange all of my Indian money back to dollars because it's illegal to take Indian money out of India?\n\nI eventually made it to the actual border. I was pulling my suitcase through what seemed like an abandoned village and parade grounds when I heard someone laughing. I stopped and looked around and saw a giant, maybe 6'7\" soldier carrying a big machine gun coming out from what looked like a bunker. He was clearly happy to see me and asked for my passport. His accent sounded like he was from New Jersey. We talked a bit and he told me how to get to the customs building.\n\nIt was maybe another twenty minutes of walking to the customs building. They didn't process me but had me wait on a bench. After awhile a guy in street clothes sat with me and started asking casual questions about my job, what I'm doing here, etc. when I told him I'm meeting my wife who had business meetings his demeanor changed completely \"oh you're with <my wife's name>\" and he personally escorted me through customs and hi"}, {"id": 50663104, "au": "water-drummer", "dom": 87, "sr": 7, "sc": 5.69, "ep": 5.98, "bs": 0.0, "d": 2, "age": 16.78, "grav": 196.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 190, "qw": 0, "k": 189, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 1.502, "fa": 0.56, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "It might seem that way since yeah, it kind of does burst some people's little bubble but you can't \"disprove\" OC's experience because it shatters your own prejudice.\n\nOC did mention that air pollution wasn't what they were focusing on and besides, the air in Lahore only gets bad around winter. It's totally fine the rest of the year which could be when they visited. Their visit could also have been before 2016 which is around the time this whole air pollution in Lahore even became a thing.\n\nAbout the pollution thingy, well, it heavily depends on what area of Lahore you're visiting. There's old Lahore and new Lahore and if you google Lahore, then you're only gonna see the old one because that's the historically rich part a lot of outsiders are interested in but if OC stayed in some place not northern lahore, then it would've been like comparing Delhi to Bangalore in which case, it wouldn't be completely bizarre to say that Bangalore is a lot more nicer.\n\nAnd yeah, if you wanna see a filthy Pakistani city, go see Karachi because the Sindh government doesn't care about it."}, {"id": 50664426, "au": "sandrae", "dom": 24, "sr": 8, "sc": 5.35, "ep": 5.49, "bs": 0.0, "d": 2, "age": 13.51, "grav": 139.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 17, "k": 36, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.433, "fa": 0.42, "gp": 0.639, "bl": 0.0, "ds": 0.0, "txt": ">And as is true for every place, don't go in tight closed streets and don't be adventurous.\n\nIN most countries this is part of the fun. I would definetely recommend to be adventurous and go into tin< streets in many countries  in Europe and SEA. Exploring little streets in Hanoi or Venice, walking aimlessly at night in Osaka, bicycling at night in Singapore is not dangerous. Just do some reading about the level of crime upfront, then you can relax in many cities. Of course you would not do this in Johannesburg, NY or Rio, but it is certainly possible to explore many safe cities, big and small, without too much care."}, {"id": 50660678, "au": "doodlebugging", "dom": 31, "sr": 9, "sc": 5.34, "ep": 5.34, "bs": 0.0, "d": 0, "age": 23.46, "grav": 339.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 3021, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.443, "fa": 0.28, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "Thanks for showing this man's life's work. It's pretty obvious that he has spent his time and energy well. Preserving the ancient traditions is awesome too. Those examples in the article are simply beautiful, some in their complexity and others in their simplicity.\n\nFrom the land of stick-built structures and evenly distributed, look-alike strip malls. Pakistan looks beautiful."}, {"id": 50663256, "au": "inshard", "dom": 101, "sr": 10, "sc": 5.33, "ep": 5.33, "bs": 0.0, "d": 2, "age": 16.32, "grav": 187.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 64, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": ["https://en.wikipedia.org/wiki/Devshirme\u0023", "https://en.wikipedia.org/wiki/Mimar_Sinan", "https://en.wikipedia.org/wiki/Sedefkar_Mehmed_Agha"], "ig": 1.194, "fa": 0.62, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "Baseless refutation: 1. The systematic enslavement of young Catholic boys https://en.wikipedia.org/wiki/Devshirme\u0023 2. The most celebrated architect of the Ottomans was one such Greek Catholic boy https://en.wikipedia.org/wiki/Mimar_Sinan 3. His prodigee who built the blue mosque was another such Albanian boy https://en.wikipedia.org/wiki/Sedefkar_Mehmed_Agha"}, {"id": 50663995, "au": "abdussamit", "dom": 5, "sr": 11, "sc": 5.13, "ep": 5.43, "bs": 0.0, "d": 2, "age": 14.41, "grav": 153.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 84, "qw": 0, "k": 47, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "country_honest", "flbl": "Country & Honest (Wary)", "urls": ["https://news.ycombinator.com/item?id=50663982"], "ig": 1.209, "fa": 0.62, "gp": 0.564, "bl": 0.0, "ds": 0.0, "txt": "Just mentioned in my comment: https://news.ycombinator.com/item?id=50663982\n\nBut yeah, it's business as usual to be honest, the things you are wary of visiting any country to be honest.\n\nDon't go out beyond evenings (Lahore doesn't have that culture, and if someone says it has, it's dangerous), don't go into dark tight places, respect the culture and explore all you want during day time.\n\nIt's worth it, I've been here practically my whole life, and I have seen and worked with many foreigners to make their trip worthwhile."}, {"id": 50664443, "au": "Rebuff5007", "dom": 8, "sr": 12, "sc": 4.64, "ep": 5.08, "bs": 0.0, "d": 4, "age": 13.47, "grav": 138.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 13, "k": 910, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.152, "fa": 0.42, "gp": 0.812, "bl": 0.0, "ds": 0.0, "txt": "> but in switzerland for example, you would have to go looking for them.\n\nDisagree. Switzerland may be a strawman. Most cities i've been to (across europe, north america, japan) have a couple areas where its not the safest at night, particularly if you do not know the local language or are \"clearly\" a tourist without a friend or a local guide."}, {"id": 50663982, "au": "abdussamit", "dom": 23, "sr": 13, "sc": 4.52, "ep": 4.96, "bs": 0.0, "d": 1, "age": 14.46, "grav": 154.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 47, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 1.361, "fa": 0.34, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Hey, I'm from Lahore! Been here for the last 25 years.\n\nThanks for appreciating the good of Lahore.\n\nI agree with you, that a Lahore visit is great if you plan very carefully e.g. don't go out after evenings, speak to a local about where to stay (prefer the 4-5 star hotels if you can afford), and travel during day time wherever you want to.\n\nAnd as is true for every place, don't go in tight closed streets and don't be adventurous.\n\nI mean, I've travelled and I wouldn't do the above even in any country. So it's business as normal.\n\nRest is just the noise of Lahore, I have been here and it's a lovely place to visit."}, {"id": 50670200, "au": "shalabajser", "dom": 73, "sr": 14, "sc": 4.37, "ep": 4.52, "bs": 0.0, "d": 1, "age": 3.53, "grav": 21.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 22, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 0.371, "bl": 0.0, "ds": 0.0, "txt": "The brainwashed hordes of architects churning out sterile Bauhause crap are actually doing harm to the inhabitants of their monstrosities. \nSterile ugliness causes depression. Beautiful building exude calming influence.\nProof in point - your two Luzern station photos. One makes the viewer stressed and nauseous. The other brings joy. \nWhy are these modernist atrocities so ugly? You provided a part of the answer - because they are designed to \"challenge\" architecture that preceded it. The older architecture evolved to be pleasing to the eye. Hence, the best way to challenge it is to make it opposite of pleasing."}, {"id": 50661296, "au": "pazimzadeh", "dom": 36, "sr": 15, "sc": 4.33, "ep": 4.33, "bs": 0.0, "d": 0, "age": 21.91, "grav": 302.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 23, "qw": 0, "k": 3258, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": ["https://www.flickr.com/photos/pazimzadeh/albums/72157615055340819/", "https://www.flickr.com/photos/pazimzadeh/albums/72157615056298885/"], "ig": 0.968, "fa": 0.34, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "Iranian art, architecture, and culture in general are truly slept on. I was blown away when I visited in 2008.\n\nHere are some samples:\n\nShiraz - https://www.flickr.com/photos/pazimzadeh/albums/721576150553...\n\nEsfahan - https://www.flickr.com/photos/pazimzadeh/albums/721576150562..."}, {"id": 50666241, "au": "metalman", "dom": 30, "sr": 16, "sc": 4.21, "ep": 4.65, "bs": 0.0, "d": 2, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 398, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.791, "fa": 0.0, "gp": 0.303, "bl": 0.0, "ds": 0.0, "txt": "I travelled all about northern Pakistan, and stayed wherever I was taken, and never knew exactly where I was, but as my family has a good reputation and is spread out accross the country and into India and there was a cousin assigned to stay with me and I had sufficient cash for expenses, we were treated very well, and hopped cabs and airports with no plan whatsoever, often having attempts to pay for bills or service refused, as i now susspect we provided more entertainment than any mere consideration of money could compare to.\n And wrapped up in that is how hospitality, manners, deportment, family, character, and personality, intertwine as a central feature of civilisation in that part of the world, a simple turn of phrase or demonstration of character will earn you a place, or if of the OTHER type, invisibility, but in the case of a westerner, the convention would be to steer them by means of accute discomfort, to the (few) 4~5 star places maintained for just such contingencies if they were unable to handle the real and utterly non western realities of Pakistan.\nLahore, Islamibad, Peshawer, lundi cotal, Murree, muzafrabad, and all points in between, several times.\n Thinkin is makin me wana go again!"}, {"id": 50660935, "au": "sfjailbird", "dom": 1, "sr": 17, "sc": 3.78, "ep": 4.22, "bs": 0.0, "d": 0, "age": 22.91, "grav": 326.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1856, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 1.13, "fa": 0.0, "gp": 1.081, "bl": 0.0, "ds": 0.0, "txt": "As a Westerner, I've been to Lahore, and the historical architecture is indeed fascinating. There are palaces and public buildings from the mughal period that would have been wonders of the world, had they still been standing. Only thing is, they are ruins, and you have to extrapolate from the few surviving pieces to the ruined whole to get an idea about the original splendor.\n\nBesides that, even though people there are very sweet, Lahore is not an international tourist city, so I don't know that I would recommend going, unless you know what you're getting into."}, {"id": 50660412, "au": "motionlessveloc", "dom": 51, "sr": 18, "sc": 3.53, "ep": 3.75, "bs": 0.0, "d": 1, "age": 23.95, "grav": 351.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 984, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.467, "fa": 0.0, "gp": 0.209, "bl": 0.0, "ds": 0.0, "txt": "If you've travelled in India or Pakistan, there are countless old palaces and mosques that use the same basic techniques. But the vast majority of these are ancient and crumbling; what's insane is that he's still building them today, and we're basically seeing what these ancient buildings originally looked like.\n\nLeft unsaid is why this is still possible: the cost of labor in Pakistan is so low that it's still practical for the moderately wealthy to hire metalworkers to decorate a door with hammer and chisel or brickworkers to build elaborate domes by hand."}, {"id": 50661818, "au": "inshard", "dom": 99, "sr": 19, "sc": 3.49, "ep": 3.85, "bs": 0.0, "d": 0, "age": 20.5, "grav": 271.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 64, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.639, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Islamic architecture including the first notable example, the octagonal shaped dome on the rock and the much later Blue Mosque, after Ottoman defeat in Hungary, was derived from Byzantine Eastern Church architecture. The Ottomans enslaved most of the original architects of the churches and took Eastern European Catholic boys as slaves to train in the style and spread it in their empire. None of those domed mosques existed in the Arabian peninsula until much later."}, {"id": 50667125, "au": "sfjailbird", "dom": 3, "sr": 20, "sc": 3.47, "ep": 4.13, "bs": 0.0, "d": 2, "age": 8.04, "grav": 63.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 1856, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.621, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "I mostly meant that it is not really set up to serve international tourists (natural given that there are so few of them), so some of the facilities that tourists depend on, like easy travel to certain places, easy access to information, guides, standardized terms for lodging, etc. You practically need someone local to be able to access the most interesting stuff.\n\nOn the flip side English is an official second language, so signage is very often in English, unlike a lot of places in the region and around the world.\n\nI think the advice about going out at night and avoiding certain areas is given out of an abundance of caution. There are probably areas to avoid, but in the places I went (deep into the ant hill that is the city's interior) I never felt unsafe, also at night (which is bustling). I even had a driver return with my phone that I left in his car, and other experiences like that.\n\nI think what is meant is that there is no 'night life' as in bars, partying and such. Still lots of restaurants (local food is amazing)."}, {"id": 50664129, "au": "fai5a1", "dom": 15, "sr": 21, "sc": 3.24, "ep": 4.12, "bs": 0.0, "d": 3, "age": 14.14, "grav": 149.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 18, "k": 9, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.609, "fa": 0.76, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "> Don't go out beyond evenings (Lahore doesn't have that culture, and if someone says it has, it's dangerous)\n\nAs someone who's been living in Lahore for the last 6 years, I'm surprised to hear this. Lahore does have a night life culture and it's as safe as you can get in Pakistan."}, {"id": 50669801, "au": "dyauspitr", "dom": 52, "sr": 22, "sc": 3.07, "ep": 3.65, "bs": 0.0, "d": 2, "age": 4.1, "grav": 25.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.143, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Whatever is left, especially of Hindu temples are the survivors. It is estimated that 75-80% of ancient hindu temples were destroyed in North and Central India and a smaller percentage in the South."}, {"id": 50660845, "au": "serioussecurity", "dom": 43, "sr": 23, "sc": 2.98, "ep": 3.64, "bs": 0.0, "d": 0, "age": 23.09, "grav": 330.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 680, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.713, "bl": 0.0, "ds": 0.0, "txt": "I always love remembering how many people there are.\n\nPakistan, Indonesia, India, Iran, China, Bangladesh, Brazil, Nigeria. Enormous countries with their own incredibly deep and complex cultures and histories."}, {"id": 50661320, "au": "papua_is_being_", "dom": 44, "sr": 24, "sc": 2.76, "ep": 3.35, "bs": 0.0, "d": 1, "age": 21.84, "grav": 301.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 39, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.013, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "West Papua. The 3rd largest rainforest on the planet with the greatest diversity of languages. Which (both the rainforest and indigenous people) is going to disappear within the next 3 years."}, {"id": 50665800, "au": "swiftcoder", "dom": 26, "sr": 25, "sc": 2.68, "ep": 4.0, "bs": 0.0, "d": 2, "age": 10.32, "grav": 91.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 17, "k": 11280, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.989, "fa": 0.42, "gp": 0.328, "bl": 0.0, "ds": 0.0, "txt": "> And as is true for every place, don't go in tight closed streets and don't be adventurous.\n\nThis is quite a foreign concept to a lot of us folks who grew up in Europe and the States. It's pretty normal as a young person here to travel to a strange city, meet some random folks, party the night away... and really the worst that's liable to happen is a stolen wallet"}, {"id": 50660899, "au": "dofm", "dom": 35, "sr": 26, "sc": 2.59, "ep": 3.25, "bs": 0.0, "d": 0, "age": 22.98, "grav": 327.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.769, "bl": 0.0, "ds": 0.0, "txt": "Someone called Mumtaz ending up an architect producing that kind of beautiful work has a subtle hint of nominative determinism to it, doesn't it?"}, {"id": 50670497, "au": "panick21_", "dom": 74, "sr": 27, "sc": 2.47, "ep": 3.42, "bs": 0.0, "d": 2, "age": 3.1, "grav": 18.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 6635, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.456, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even worse, ever new 'star architect' challenges all the ones before themselves. Making it increasingly worse because you have to come up with increasingly unpractical, dumb, user hostile shapes.\n\nThe new Luzern train station design is actually partly a Calatrava design. Luckily one that happened before 3d design tools were fully ready."}, {"id": 50667765, "au": "profsummergig", "dom": 71, "sr": 28, "sc": 2.3, "ep": 3.18, "bs": 0.0, "d": 0, "age": 7.1, "grav": 53.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1072, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "off-topic, but Iranian cities seem to have beautiful mass produced buildings (i.e. the same building design being repeated over an area).\n\ntells you a lot about a culture.\n\ni'm from india. our \"mass-produced\" buildings (e.g. housing for govt. employees) are disgustingly unaesthetic."}, {"id": 50672031, "au": "ragall", "dom": 33, "sr": 29, "sc": 2.09, "ep": 2.97, "bs": 0.0, "d": 1, "age": 0.33, "grav": 4.6, "surf": 66.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 570, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I wouldn't call those hints of brutalism, but an honest admission that the artisans and supply chain that built Mughal palaces and mosques no longer exist (the article hints to that), so certain ornamentation is no longer possible at affordable prices."}, {"id": 50665745, "au": "srean", "dom": 56, "sr": 30, "sc": 1.96, "ep": 3.21, "bs": 0.0, "d": 1, "age": 10.45, "grav": 93.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 8918, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you are into ceilings I highly recommend Isfahan.\n\nIslamic architects are such masters of morphing polygonal plans to the cross section of round domes. This mathematics was unknown or at least unused in older Indian structures. I say this as an Indian and some semblance of understanding of mathematics originating in India."}, {"id": 50660376, "au": "mjbq", "dom": 57, "sr": 31, "sc": 1.9, "ep": 3.15, "bs": 0.0, "d": 0, "age": 24.0, "grav": 352.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 11, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.843, "fa": 0.0, "gp": 0.807, "bl": 0.0, "ds": 0.0, "txt": "Thanks for highlighting this and momentarily bursting the\nwestern-centric bubble that we all seem to live in, in \nthe anglosphere. The western world always seems to assume \nthat it has nothing to learn from the east, but in some ways\nour countries are like cultural deserts of suburban nihilism"}, {"id": 50663957, "au": "kshri24", "dom": 93, "sr": 32, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 3, "age": 14.53, "grav": 155.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 316, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 0.609, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Annual average AQI of Lahore in 2025 was 168. Annual average AQI of Delhi in 2025 was 201. Both are equally unhealthy. No way can you say with a straight face that one has clean air while other not."}, {"id": 50662493, "au": "oa335", "dom": 89, "sr": 33, "sc": 1.61, "ep": 2.27, "bs": 0.0, "d": 2, "age": 18.55, "grav": 230.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1022, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 0.701, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "depends on the month of the year and which way winds are blowing.  lahore generally has much worse air in the winter."}, {"id": 50665914, "au": "kakacik", "dom": 27, "sr": 34, "sc": 1.43, "ep": 2.98, "bs": 0.0, "d": 3, "age": 10.13, "grav": 89.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.587, "fa": 0.56, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, understanding where you go, what are limitations, how to actually respect local culture and customs to not behave like a rich arrogant a*hole foreigner should be part of anybody's research before traveling to any 3rd world country, the more the culture is distant to your own the more this is a must. Its few clicks at most, or quick prompt to ai if you really cannot bother to do more. You may be rewarded with genuine interactions with locals and other adventures that no money in this world can buy. Certainly happened to me in places like India or Indonesia (2 top places for me in the world to backpack around).\n\nCommon sense and just being a nice person, nothing more.\n\nFor example partying a night away is definitely not a sound advice for half of the world, if you actually move away from luxury hotels bubble. And why would one screw up such experiences by staying in those is beyond my understanding."}, {"id": 50662446, "au": "thelastgallon", "dom": 88, "sr": 35, "sc": 1.38, "ep": 1.82, "bs": 0.0, "d": 1, "age": 18.66, "grav": 232.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 20, "qw": 4, "k": 8566, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "country_honest", "flbl": "Country & Honest (Wary)", "urls": ["https://www.aqi.in/in/dashboard/pakistan/punjab/lahore"], "ig": 0.697, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "> The air was clean.\n\nhttps://www.aqi.in/in/dashboard/pakistan/punjab/lahore\n\nPakistan is ranked worst country for AQI and Lahore is somewhere in the top. Now this entire comment is suspect."}, {"id": 50660588, "au": "Geonode", "dom": 42, "sr": 36, "sc": 1.34, "ep": 2.44, "bs": 0.0, "d": 0, "age": 23.61, "grav": 342.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 734, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 0.568, "fa": 0.0, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "If sharing this can in any way reduce the sterile trend in architecture, then fantastic. It's beautiful."}, {"id": 50662790, "au": "fooker", "dom": 76, "sr": 37, "sc": 1.31, "ep": 2.19, "bs": 0.0, "d": 1, "age": 17.73, "grav": 214.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5940, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 0.625, "fa": 0.0, "gp": 0.496, "bl": 0.0, "ds": 0.0, "txt": "Having been to both Delhi and Lahore, this seems completely made up.\n\nThe two cities are so similar that you would not be able to tell one from the other.\n\nThe two European cities that I'd use as an analogy for this similarity is Vienna and Prague."}, {"id": 50665720, "au": "srean", "dom": 39, "sr": 38, "sc": 1.17, "ep": 2.42, "bs": 0.0, "d": 1, "age": 10.52, "grav": 94.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 8918, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.029, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Esfahan is frigging amazing both from the perspective of art and from mathematics of architecture.\n\nI hope none of the artistic structures sustained bombing damage."}, {"id": 50660525, "au": "cge", "dom": 70, "sr": 39, "sc": 1.16, "ep": 2.55, "bs": 0.0, "d": 2, "age": 23.71, "grav": 345.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 1895, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ireland is much the same, and often feels like it aspires toward suburban nihilism and utterly soulless architecture without even the resistance to it that is seen in North America.  It is too narrow to simply say that these things are limited to the US and Canada."}, {"id": 50662757, "au": "computerex", "dom": 100, "sr": 40, "sc": 1.11, "ep": 2.51, "bs": 0.0, "d": 1, "age": 17.85, "grav": 216.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 2186, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.067, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Borrowing from Byzantine architecture is historical fact. Claiming Islamic architecture was simply stolen from Christians is historical distortion. The bit about enslaving most church architects is baseless."}, {"id": 50668461, "au": "ctde", "dom": 29, "sr": 41, "sc": 1.01, "ep": 2.55, "bs": 0.0, "d": 2, "age": 6.02, "grav": 42.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 18, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sorry, but no, a lot of the world is walkable at night, in Europe you even have to especially go looking for trouble at night.\n\nI walked at night in Iraq, Saudi Arabia, Libanon, Jordan, Morocco, Egypt, the -stans, South East Asia, China, Russia, Ukraine - all very safe places if one doesn't act stupid.\n\nThat is to say: Just having been robbed in Senegal (in the evening in a crowed place next to a mosque of all places!) I understand that living in less secure countries one might get the impression that everybody is out there trying to get you\n\nBut no, that is not what one should expect and not the way it is in a lot of countries."}, {"id": 50666235, "au": "xandrius", "dom": 25, "sr": 42, "sc": 0.94, "ep": 2.48, "bs": 0.0, "d": 3, "age": 9.52, "grav": 81.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 3521, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Venice is a pretty but dead city in a G8 country. Osaka is in Japan, one of the safest countries in the world.\n\nVietnam is generally safe too.\n\nOne cannot generalise because they went backpacking in their 20s and shut down any sort of warnings given. Also, I think it's better telling people some places are generally less safe than they are, so that to the very least people are a bit activated mentally. I've seen people being absolute dorfs just because they read in a blog that town X is the safest in country Y, and proceeding getting scammed."}, {"id": 50660144, "au": "rogerrogerr", "dom": 105, "sr": 43, "sc": 0.89, "ep": 0.89, "bs": 0.0, "d": 1, "age": 24.45, "grav": 363.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1845, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.378, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is very possible to be a well educated person and not know about an architect from the other side of the world.\n\nTheir region containing many people does not have any bearing on this."}, {"id": 50663980, "au": "hnlmorg", "dom": 2, "sr": 44, "sc": 0.79, "ep": 1.23, "bs": 0.0, "d": 1, "age": 14.47, "grav": 154.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 12535, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.301, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "This might be a dumb question, but are you able to expand on what you mean for the last paragraph?\n\nIf the people are welcoming then what are the risks to tourists?"}, {"id": 50663540, "au": "donbox", "dom": 38, "sr": 45, "sc": 0.72, "ep": 2.11, "bs": 0.0, "d": 2, "age": 15.6, "grav": 174.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 25, "qw": 0, "k": 1169, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": ["https://en.wikipedia.org/wiki/Dravidian_architecture"], "ig": 0.899, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yupp, it was created in India which was an ancient melting pot IMHO. For distinctive Indian architecture have a look at https://en.wikipedia.org/wiki/Dravidian_architecture or maybe even Rajasthani Architecture"}, {"id": 50663053, "au": "diziet", "dom": 77, "sr": 46, "sc": 0.71, "ep": 2.25, "bs": 0.0, "d": 2, "age": 16.89, "grav": 198.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 2147, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 0.958, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The one thing you can easily do now is open Google Maps and Google Maps Street View and look around these cities. While I agree that the cities look very similar, it does seem that the amount of trash in Lahore is substantially less. This is probably due to the lower urban density, but also lower coverage of Google Maps."}, {"id": 50664498, "au": "lukan", "dom": 10, "sr": 47, "sc": 0.69, "ep": 2.23, "bs": 0.0, "d": 5, "age": 13.33, "grav": 136.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.949, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What is \"strawman\" supposed to mean in this context? It is a real country last time I checked. But I also just looked up crime statistics and apparently Genf has some areas at night with a increased risk. But my main point was, that I have seen many places around the world and also at night and I disagree that the default is to not go out at night as tourist for safety reasons."}, {"id": 50663068, "au": "Suppafly", "dom": 59, "sr": 48, "sc": 0.66, "ep": 2.21, "bs": 0.0, "d": 2, "age": 16.86, "grav": 197.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2779, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 0.884, "fa": 0.0, "gp": 0.088, "bl": 0.0, "ds": 0.0, "txt": "Plus, gun to my head, I could probably name 3 architects and would probably screw up their names. I'd imagine people who actually care about architecture probably know a few from outside the anglosphere, but normal people don't even know the ones from inside the anglosphere."}, {"id": 50662143, "au": "Ericson2314", "dom": 37, "sr": 49, "sc": 0.44, "ep": 1.98, "bs": 0.0, "d": 1, "age": 19.48, "grav": 249.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 8271, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 0.664, "fa": 0.0, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "Yeah it's great. A lot of Mughal stuff, which is what the article is covering, is more Iranian than Indian."}, {"id": 50666056, "au": "lukan", "dom": 12, "sr": 50, "sc": 0.27, "ep": 0.71, "bs": 0.0, "d": 7, "age": 9.86, "grav": 85.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "country_honest", "flbl": "Country & Honest (Wary)", "urls": [], "ig": 0.302, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"the things you are wary of visiting any country to be honest.\n\nDon't go out beyond evenings \"\n\nNo, this was a general claim about any country.\n\n\"And its not Genf but Geneva or Genève if you want to show some respect.\"\n\nAre you aware, that german is spoken in switzerland, also in Genf?\nI don't think they take issue. Do you personally?"}, {"id": 50660948, "au": "Faizan11490", "dom": 32, "sr": 51, "sc": 0.25, "ep": 4.02, "bs": 2.52, "d": 0, "age": 22.88, "grav": 325.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.228, "fa": 0.0, "gp": 0.781, "bl": 0.95, "ds": 0.0, "txt": "Hear me out: there are hints of brutalism in his work. He trained at the AA in the early 60s, when New Brutalism was big in London, and his early buildings were modernist. To me the heavy massing and honesty about materials carried over, even though his later work brings back the ornament brutalism threw out."}, {"id": 50665547, "au": "mytailorisrich", "dom": 17, "sr": 52, "sc": 0.24, "ep": 1.78, "bs": 0.0, "d": 4, "age": 10.88, "grav": 99.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 6811, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "night_countries", "flbl": "Night & Countries (Safe)", "urls": [], "ig": 0.673, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "\"it's as safe as you can get in Pakistan.\"\n\nIt is difficult to interpret this for someone who does not know Pakistan. This could mean anywhere from quite safe to very unsafe depending on what your country's \"normal\" is..."}, {"id": 50663411, "au": "computerex", "dom": 102, "sr": 53, "sc": 0.06, "ep": 2.45, "bs": 0.85, "d": 3, "age": 15.9, "grav": 179.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2186, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "architecture_brutalism", "flbl": "Architecture & Brutalism (Catholic)", "urls": [], "ig": 1.042, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Nobody denied the devşirme system or the Christian origins of some Ottoman architects. Sinan’s precise ethnic origins are disputed, and Christian does not automatically mean Catholic. None of your links establishes that the Ottomans enslaved most Byzantine church architects or that Islamic architecture originated exclusively from Christianity. You're proving a point that wasn't disputed while ignoring the claims that were."}, {"id": 50660622, "au": "jszymborski", "dom": 68, "sr": 54, "sc": -0.18, "ep": 0.92, "bs": 0.0, "d": 2, "age": 23.55, "grav": 341.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 10195, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "lahore_polluted", "flbl": "Lahore & Polluted (Air)", "urls": [], "ig": 0.393, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The GP said that the anglosphere lived in a western-centric bubble... There was no conflating the anglosphere with the west, nor even a mention of \"the western world\" as you've put in quotes."}, {"id": 50662681, "au": "computerex", "dom": 80, "sr": 55, "sc": -0.26, "ep": 1.28, "bs": 0.0, "d": 2, "age": 18.05, "grav": 220.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 2186, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "india_ancient", "flbl": "India & Ancient (Beautiful)", "urls": [], "ig": 0.546, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "When was the last time you went there? You must be confusing Lahore for Indian cities."}, {"id": 50666500, "au": "modo_mario", "dom": 65, "sr": 56, "sc": -0.26, "ep": 1.89, "bs": 1.19, "d": 1, "age": 9.04, "grav": 75.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 13, "k": 1446, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_c     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
