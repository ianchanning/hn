ary", "count": 11, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 11}, {"category": "code_repository", "count": 2}, {"category": "github_artifact", "count": 1}, {"category": "primary_technical_doc", "count": 1}, {"category": "rfc_standard", "count": 1}], "story_anchors": ["framework", "ssh", "gui", "graphics", "kitty", "stream", "protocols", "support", "streaming", "zydra", "screen", "terminal", "text", "desktop", "microvm", "via", "allow", "vnc"], "largest_root": {"root_id": 50647283, "author": "orbital-decay", "slots": 58, "start_dom": 1, "end_dom": 58, "share_pct": 47.2, "top_dom1_age": 19.8, "top_dom1_author": "orbital-decay"}, "buried_cutoff": 37, "rescue_top_k": 25, "ablations": [], "tournament": [], "comments": [{"id": 50647308, "au": "goranmoomin", "dom": 91, "sr": 1, "sc": 16.38, "ep": 16.38, "bs": 0.0, "d": 0, "age": 19.76, "grav": 255.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 186, "qw": 334, "k": 34757, "kpp": 12.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": ["https://tools.simonwillison.net/cleanup-claude-code-paste", "https://gist.github.com/egmontkob/eb114294efbcd5adb1944c9f3cb5feda\u0023hover-underlining-and-the-id-parameter", "https://gitlab.freedesktop.org/terminal-wg/specifications"], "ig": 1.594, "fa": 3.33, "gp": 2.172, "bl": 0.0, "ds": 0.0, "txt": "Before we start abusing the terminal protocols for GUIs, I believe that we need some kind of protocol to allow text selection and copy/paste between blocks of text, so that we don't need tools that trim whitespace that was copied from the terminal[0].\n\nThere's some prior work like how the OSC-8 hyperlink id param[1], and a specification to tackle the issue[2].\n\nI'm hoping that the Superlogical folks[3] can actually do this, in libghostty and Rex.\n\nBut also in tangent, I also do think that abusing the terminal protocol to do GUI stuff is kind of a worse-is-better type of situation, we specifically have a protocol (Wayland, Quartz, and so on) to do this stuff, and I'm hoping that we can decide to actually do something similar for the remote GUI situation. I believe that the Superlogical folks have plans to do this with Rex[4].\n\nI believe that the remote-GUI situation has to be resolved, I've been talking about this multiple times. I thought that the web stack (HTML/CSS/JS) would be the  answer to adoption[5], but hopefully we can get a full-fledged solution that is compatible with the previously existing GUI apps as well.\n\n> - TUIs are not inherently superior to GUIs\n\n> - SSH, as a transport layer, should support not just forwarding a pty (as a TUI display layer), but a GUI display layer as well\n\n> In fact, these two arguments were already realized by UNIX 30 years ago, and we al"}, {"id": 50647066, "au": "qurren", "dom": 100, "sr": 2, "sc": 11.71, "ep": 11.71, "bs": 0.0, "d": 0, "age": 20.13, "grav": 263.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 56, "qw": 0, "k": 1164, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": ["https://github.com/dheera/rosshow"], "ig": 1.38, "fa": 2.08, "gp": 1.751, "bl": 0.0, "ds": 0.0, "txt": "eeh using sixel or other sub-character graphics to render a GUI isn't really a feature of ssh. It's just a terminal feature, you could do it with telnet.\n\nalso related: i created a tool to show ROS topics over a terminal, intended for people debugging robots over ssh: https://github.com/dheera/rosshow\n\nFor better compatibility I used Braille characters to render a 2x4 grid per character, not sixel."}, {"id": 50650758, "au": "networked", "dom": 25, "sr": 3, "sc": 11.64, "ep": 11.64, "bs": 0.0, "d": 1, "age": 13.91, "grav": 145.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 79, "qw": 0, "k": 16449, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": ["https://web.archive.org/web/20260000000000*/https://www.wikicreole.org/wiki/Creole1.0", "https://en.wikipedia.org/wiki/Computer_terminal\u0023Block-oriented_terminal"], "ig": 1.667, "fa": 2.35, "gp": 0.706, "bl": 0.0, "ds": 0.0, "txt": "It's worth trying. I have thought that you might be able to replace most TUIs, which rely on presentation-oriented ANSI, with a lightweight markup language that includes forms. [1] A form would be interactive while current and become part of a static log once submitted. I guess that's pretty much a block-oriented terminal? [2]\n\nYou could use a controlled subset of HTML. It naturally comes to mind. However, an implementor could then embrace, extend, and extinguish your protocol by allowing full HTML.\n\n[1] A language like Markdown/djot or Creole, https://web.archive.org/web/20260000000000*/https://www.wiki....\n\n[2] https://en.wikipedia.org/wiki/Computer_terminal\u0023Block-orient..."}, {"id": 50648220, "au": "breuleux", "dom": 36, "sr": 4, "sc": 9.26, "ep": 9.41, "bs": 0.0, "d": 3, "age": 18.51, "grav": 229.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 46, "qw": 0, "k": 1748, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": ["https://github.com/breuleux/terminus"], "ig": 0.973, "fa": 2.08, "gp": 0.822, "bl": 0.0, "ds": 0.0, "txt": "I made something like that a while ago: https://github.com/breuleux/terminus\n\nI'm currently working on something far better that allows for true interactive widgets over SSH (that does already work), but in my quest for perfection I'm about to rewrite the protocol for the third time, so I don't know if I should share that :P"}, {"id": 50651066, "au": "networked", "dom": 71, "sr": 5, "sc": 8.47, "ep": 8.47, "bs": 0.0, "d": 1, "age": 13.08, "grav": 132.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 0, "k": 16449, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": ["https://news.ycombinator.com/item?id=50650758"], "ig": 1.096, "fa": 1.52, "gp": 1.074, "bl": 0.0, "ds": 0.0, "txt": "Your comment made me realize my idea in this thread (https://news.ycombinator.com/item?id=50650758) was a block-oriented terminal, something I have read about but not used. One could borrow from that parallel lineage; for example, implement an RFC 4777 server that provides an administrative interface for Linux."}, {"id": 50651714, "au": "philsnow", "dom": 75, "sr": 6, "sc": 8.4, "ep": 8.4, "bs": 0.0, "d": 0, "age": 11.38, "grav": 106.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 40, "k": 5144, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.732, "fa": 0.92, "gp": 1.178, "bl": 0.0, "ds": 0.0, "txt": "> Next, we optimize graphics by sending a sort of \"grid\" of pixels. Each cell has its own updates, where the previous frame is compared to the current frame to catch and send updates, avoiding having to constantly stream the full screen.\n\nmosh does this too, with the caveat that it's not transparent to terminal escapes.  for instance, if you try to run some modernish \"tui framework\" remotely over mosh, things like clipboard access won't work at all, because mosh just cares about how the terminal should look.\n\nthere are workarounds to smuggle the OSC sequences in other places, so you can get all escape sequences through.  I usually have a process tree that looks something like this\n\n  Ghostty\n  |- screen -e^Zz -S meta\n     |- screen -e^Oo -S workspace1\n     |  |- zsh\n     |  |- zsh\n     |- mosh somehost -- screen -e^Oo -S remotework1\n     |- mosh otherhost -- herdr\n\nand escape sequences work just fine from inside the nested local screen session, the screen-mosh-screen connected to somehost, and the screen-mosh-herdr on otherhost."}, {"id": 50649587, "au": "xxpor", "dom": 67, "sr": 7, "sc": 7.69, "ep": 7.83, "bs": 0.0, "d": 0, "age": 16.38, "grav": 188.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 9539, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.558, "fa": 0.56, "gp": 1.776, "bl": 0.0, "ds": 0.0, "txt": "For TUIs, I wish a 5250-style block based terminal had won over VT100 stream based terminals.\n\nFor those not familiar, with a block oriented terminal, the native \"chunk\" of data is an entire screen. So you can put information in there like \"this is a text box\". This allows, for example, you to move around the screen with tab and type _with no round trip back to the server_. There's 0 latency. Data is only sent when you hit enter.\n\nOn high latency or flaky connections the experience is a million times better."}, {"id": 50649694, "au": "keito", "dom": 82, "sr": 8, "sc": 7.68, "ep": 7.68, "bs": 0.0, "d": 0, "age": 16.15, "grav": 184.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 88, "qw": 0, "k": 76, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": ["https://news.ycombinator.com/item?id=50536648"], "ig": 1.692, "fa": 0.62, "gp": 1.338, "bl": 0.0, "ds": 0.0, "txt": "I recently went down this rabbit hole (Kitty as streaming remote screen transport) but in the context of an IBM PC emulator[^1]. I think of it mostly as a gimmick, but I am impressed with the author's optimization work (text overlays, partial updates). In my case I found indexed PNGs to be a good way to reduce bytes across the wire, even trouncing zlib transport (I only needed 16 colors because CGA, so 4-bit indexed color was enough). Perhaps if enough people care about streaming graphics over Kitty it can be made into a more optimized thing :)\n\n[^1]: https://news.ycombinator.com/item?id=50536648"}, {"id": 50651985, "au": "Brian_K_White", "dom": 118, "sr": 9, "sc": 7.08, "ep": 7.08, "bs": 0.0, "d": 0, "age": 10.57, "grav": 95.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 422, "qw": 0, "k": 8732, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.834, "fa": 0.68, "gp": 0.574, "bl": 0.0, "ds": 0.0, "txt": "Come on man. No, ssh is not a gui framework. No matter how hard you squint. No matter what sloppy linquistic liberties you want to take, there is just no way to make that statement true even in the most artistic and impressionistic way possible.\n\nYou can render a gui on a dot matrix printer if you wanted to, and that does not make \"parallel port is a gui framework\".\n\nBut aside from ripping apart the atrocious title... what about the actual idea?\n\nThere is no reason or advantage to delivering a gui via enhanced terminal graphics. It is not good engineering.\n\nIt's amusing, sure. But that's what it is, a silly thing that's fun to do just to see it done.\n\nsome terminals have some extra features that can be completely abused into rendering a gui, inefficiently, and unportably.\n\nTTYs and vtxx terminals are so great because they are ubiquitous, but servers and clients that know kitty graphics are not.\n\nTerminals are useful because they only use a tty, and all terminals since before they were even software or networked, all already support the same basic tty and terminal feature set. It's a standard that everything in the world already supports.\n\nIt's only useful as long as that's true. Once you do anything else, you are no longer within that standard and now you need a special server and a special client, and then you no longer have any advantage for doing it over ssh except that the "}, {"id": 50647235, "au": "rvz", "dom": 98, "sr": 10, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 0, "age": 19.87, "grav": 258.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 64, "qw": 0, "k": 10577, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": ["https://ii4gsp.github.io/iterm2-rce/"], "ig": 1.248, "fa": 0.62, "gp": 1.459, "bl": 0.0, "ds": 0.0, "txt": "I don't think this makes any sense, as ssh isn't suited for this use-case.\n\nIt also doesn't make much sense to bring all the security problems that exists in web browsers into a terminal delivered via SSH because you want to render special escape codes such as kitty or even sixel that make it possible to achieve remote code execution in someone's terminal. [0]\n\nAbsolutely no thanks.\n\n[0] https://ii4gsp.github.io/iterm2-rce/"}, {"id": 50650814, "au": "efitz", "dom": 22, "sr": 11, "sc": 6.69, "ep": 6.99, "bs": 0.0, "d": 3, "age": 13.78, "grav": 143.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 7216, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 1.634, "fa": 0.68, "gp": 0.832, "bl": 0.0, "ds": 0.0, "txt": "HTML started somewhere between semantic and layout oriented; now it is more the latter.  CSS is a powerful selector language but it selects... layouts.\n\nJavaScript is a general-purpose language and does none, some or all of the above.\n\nThe web’s biggest problem IMO is that it has evolved in the direction of giving content providers more and more control over how that consumption is consumed.  I miss the gopher days when content was 100% semantic and layout was 100% a client-side task.\n\nWhat I would love to see is a semantic-only language that is textual (easy for a human being to type in a text editor) but more structured with extensible semantics.  Instead of using | and - to “draw” tables, just express the data and leave it to the renderer to choose the best (or user-preferred) rendering.\n\nMaybe I’ll mock one up.\n\nEd: spelling “not”—>”now”"}, {"id": 50648072, "au": "wing-_-nuts", "dom": 60, "sr": 12, "sc": 6.67, "ep": 6.67, "bs": 0.0, "d": 1, "age": 18.74, "grav": 234.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 156, "qw": 0, "k": 6406, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.749, "fa": 0.0, "gp": 1.766, "bl": 0.0, "ds": 0.0, "txt": "I remember back in the mid 90's, I was a young high school student taking a c programming class (in rural alabama, no less!).  We used a borland ide / compiler, and I was irritated that I couldn't code at home.\n\nI was reading a forum online, and someone mentioned that the university of Colorado offered free shell accounts, and they had compilers!\n\nWell, it was a bit different than borland, but I was really happy to be able to code after school, at home.  I kept bugging the UC admin to install x, y or z software and he finally said 'hey, kid, there's this thing called linux, you can put it on your home computer'\n\nSo of course I formatted my parents home computer (they were...not amused), but I loved the whole ecosystem.  I had access to tons of code to learn from.  It was awesome.\n\nThat was really my start into being a software developer, and all because some admin at a university was kind enough to allow the general public to use their servers."}, {"id": 50647136, "au": "nico", "dom": 59, "sr": 13, "sc": 6.44, "ep": 6.59, "bs": 0.0, "d": 0, "age": 20.01, "grav": 261.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 4610, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.651, "fa": 0.0, "gp": 1.87, "bl": 0.0, "ds": 0.0, "txt": "I remember my college used to serve some student services app via Telnet\n\nYou would just telnet into a machine using your student login/pass, and it would run either a welcoming screen or a specific app (like one for scheduling classes)\n\nIt was a very mature application and worked really well. Alas, it was quickly replaced by web versions of the apps, which took another flew years to get properly working\n\nAnyway, glad to see an example of what’s possible (and almost forgotten), in terms of providing access to applications online via the terminal (and without a browser)"}, {"id": 50648982, "au": "somat", "dom": 62, "sr": 14, "sc": 6.12, "ep": 6.41, "bs": 0.0, "d": 2, "age": 17.38, "grav": 207.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 86, "qw": 0, "k": 6358, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": ["https://www.public.outband.net"], "ig": 1.578, "fa": 0.62, "gp": 0.645, "bl": 0.0, "ds": 0.0, "txt": "In a nasty fit of nostalgia for those days, I made a hobby project using shell accounts as a social network sort of thing, It is a service nobody needs, or wants, in our modern age. But I thought it would be fun. ssh to applicant@register.public.outband.net to try it out.\n\nIt is not a great environment. it runs on an old router on my closet, ip6 only, openbsd vm on a openbsd host, but stop by and say hi if you have nothing better to do. https://www.public.outband.net gives a little more info"}, {"id": 50648369, "au": "abbbi", "dom": 63, "sr": 15, "sc": 5.68, "ep": 6.34, "bs": 0.0, "d": 1, "age": 18.31, "grav": 225.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 299, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.52, "fa": 0.34, "gp": 1.24, "bl": 0.0, "ds": 0.0, "txt": "back in the days, we had a usual meeting every friday to eat white sausages. Its a thing to do so here in bavaria.\n\nI entered internship at that company back then and all participants would connect the mainframe via telnet to place their orders on how much they want to eat. It was a terminal driven UI .. Right at 11:00 it was not accessible anymore and the orders were printed. A person would then go and place the order on a nearby butcher and retrieve it, prepare the meal and everyone was happy.\n\nI had to replace it with a (back then) hacky php site, which is still in use, as of today, nearly 26 years later.\n\nlol"}, {"id": 50647283, "au": "orbital-decay", "dom": 1, "sr": 16, "sc": 5.66, "ep": 6.1, "bs": 0.0, "d": 0, "age": 19.79, "grav": 256.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 1.727, "bl": 0.0, "ds": 0.0, "txt": "Terminal giving you a janky and limited remotely accessible canvas you can abuse to make primitive GUIs doesn't imply that \"SSH is a GUI framework\".\n\nA lot better solution would be designing a compact, semantic, styling-independent remote access protocol that doesn't need bitmaps (unlike most currently available protocols), and uses good compression for actual pictures/videos. That would make any GUI efficiently usable remotely through an adapter for an existing GUI framework, without extra bloat the browser has."}, {"id": 50656902, "au": "orbital-decay", "dom": 20, "sr": 17, "sc": 5.4, "ep": 6.06, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 18, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": ["https://vivido.dev/"], "ig": 0.928, "fa": 1.04, "gp": 0.629, "bl": 0.0, "ds": 0.0, "txt": ">Focus on \"semantic\" usually turns out to be ivory tower nonsense that impedes progress towards working systems, anyway.\n\nValid. But then working systems turn out to be piles of cruft which eventually spins out of control, like it happened with web and X11 and is happening to TUIs for the last decade. When you have terminals playing videos [1] you know it took a wrong turn somewhere.\n\n[1] https://vivido.dev/"}, {"id": 50647899, "au": "wahern", "dom": 4, "sr": 18, "sc": 5.37, "ep": 5.81, "bs": 0.0, "d": 3, "age": 19.0, "grav": 239.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 18500, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 1.54, "fa": 0.0, "gp": 1.512, "bl": 0.0, "ds": 0.0, "txt": "The X protocol is semantic[1] and when used as originally intended is very fast even on 1990s networks. But GUI toolkits ended up heavily relying on local rendering and shipping bitmaps over the wire, which is why Wayland advocates argued bitmaps are good enough.\n\nIt's kinda like the way PostScript evolved into early PDF which evolved into modern PDF, where pages are basically assemblies of prerendered images. The original, semantic aspects are still there, just not used, or rather abused to dumb it down.\n\n[1] At least in the way you mean. Semantic like SVG, which is still literal, just abstract."}, {"id": 50648652, "au": "nine_k", "dom": 17, "sr": 19, "sc": 5.24, "ep": 5.68, "bs": 0.0, "d": 4, "age": 17.91, "grav": 217.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 40903, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 1.623, "fa": 0.34, "gp": 0.619, "bl": 0.0, "ds": 0.0, "txt": "Modern toolkits are optimized for GL rendering and the shared memory extension. They produce beautiful effects and animations, and give the X server large bitmaps already in VRAM, much like a video player.\n\nToolkits like Athena back in the day dealt in terms of lines, rectangles, and text strings to be rendered locally, more like, say, HTML does.\n\nThe latter approach did work over dialup. The former struggles to be smooth even over 100mbps Ethernet."}, {"id": 50647788, "au": "teledream", "dom": 115, "sr": 20, "sc": 5.08, "ep": 5.52, "bs": 0.0, "d": 1, "age": 19.12, "grav": 242.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.715, "fa": 0.28, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "I'm not necessarily saying SSH wins on a raw codec benchmark against wayvnc (I'd be glad to test it though, and I am working on a faster native client).\n\nIt's that the whole workflow has been built around SSH. I haven't just bolted a VM's \"display_1920x1080\" onto a Kitty stream and called it a day. Here I have a microVM that in and of itself renders natively to SSH, bringing with that SSH's key auth, and a universal client you can run on any terminal (with a text-only fallback).\n\nPut simply, I don't enjoy remotely streaming a clunky desktop display, even if it's technically \"fast\". SSH feels at home, and that's why I built desktop VM infra on it natively."}, {"id": 50647637, "au": "daylily", "dom": 117, "sr": 21, "sc": 4.81, "ep": 5.25, "bs": 0.0, "d": 0, "age": 19.32, "grav": 246.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 74, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.341, "fa": 0.42, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "I'll try to pick apart this paragraph in specific:\n\n> While webapps have advantages, especially in client-side state, WASM, and WebGPU, they don't really capture the universality and ease-of-use of an SSH session. SSH keys double as authentication, and -A allows you to SSH into servers from within a remote microVM itself. Webapps also can't be accessed from a pure TTY.\n\n> SSH keys double as authentication\n\nWhich is true! They are also typically associated with more than one service so rotation is a lot more painful.\n\n> and -A allows you to SSH into servers from within a remote microVM itself\n\nYou can, indeed, also run a proxy on a remote VM and then access a web application via that VM! I don't think there's a practical distinction here.\n\n> Webapps also can't be accessed from a pure TTY.\n\n...And which tty would be able to render those special escape sequences without going through a terminal emulator?\n\nI'll stay on the web."}, {"id": 50652513, "au": "geocar", "dom": 77, "sr": 22, "sc": 4.56, "ep": 5.22, "bs": 0.0, "d": 1, "age": 9.06, "grav": 75.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 6424, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.493, "fa": 0.34, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "Kitty's file upload feature is pretty terrible too, because afaik there's no way to ask the user to supply a file except by begging them to switch to another program and drop a file on it. It's really the only thing stopping me from using it.\n\nKermit is from like 1981 and had a better file upload experience; literally every terminal I used from the 1990s supported zmodem receive except iTerm2 which can use one with a filter, but has a decent file transfer experience built-in that I didn't mind adding detection/support for."}, {"id": 50649407, "au": "nico", "dom": 61, "sr": 23, "sc": 4.39, "ep": 4.83, "bs": 0.0, "d": 2, "age": 16.71, "grav": 194.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 12, "k": 4610, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.291, "fa": 0.42, "gp": 0.412, "bl": 0.0, "ds": 0.0, "txt": "> So of course I formatted my parents home computer (they were...not amused)\n\nThat made me chuckle. I also formatted my family’s home computer (after I trashed the partitions trying to resize the disk to be able to do double boot between windows and Linux, using a random distro that came with a book I bought on Amazon). They were also not happy about it"}, {"id": 50647865, "au": "icedchai", "dom": 34, "sr": 24, "sc": 4.34, "ep": 5.44, "bs": 0.0, "d": 2, "age": 19.03, "grav": 240.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 10437, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": ["https://en.wikipedia.org/wiki/Remote_Imaging_Protocol"], "ig": 1.075, "fa": 0.62, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "A terminal with an HTML/CSS embedding mode would be interesting.\n\nIn the BBS days, there were some attempts to move beyond ANSI escape sequences, like RIPscrip: https://en.wikipedia.org/wiki/Remote_Imaging_Protocol\n\nOnce the web took off, all that stuff disappeared..."}, {"id": 50652858, "au": "teledream", "dom": 94, "sr": 25, "sc": 4.14, "ep": 5.17, "bs": 0.0, "d": 3, "age": 8.33, "grav": 66.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.491, "fa": 0.28, "gp": 0.598, "bl": 0.0, "ds": 0.0, "txt": "Kitty is only the first-class option; Sixel and iTerm2 are available, and even in text-only terminals (or a TTY), we stream the entire GUI as ASCII (like a TUI), and you still get the other features. \"Just ssh hostname\" remains.\n\nAnd we actually do have a webapp too, and it's alright, but I prefer SSH. To me, the project is more of a \"multiplexer-on-steroids\" with a built-in microVM to hold its apps and graphics, rather than a simple remote desktop. You wouldn't run a multiplexer over the browser just because it technically has everything built-in.\n\nIn the case of VNC/other protocols, there is an asymmetry: if you embed text in VNC, it still has to be streamed as graphics, whereas if you embed graphics in SSH, you can still stream text as actual text.\n\nFun fact: Our webapp does stream many elements as HTML (including even Wayland apps) rather than just streaming them using a codec."}, {"id": 50647133, "au": "st_goliath", "dom": 104, "sr": 26, "sc": 3.91, "ep": 4.13, "bs": 0.0, "d": 0, "age": 20.02, "grav": 261.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 4, "k": 5666, "kpp": 8.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 1.002, "bl": 0.0, "ds": 0.0, "txt": "> SSH is a GUI framework\n\nBy that logic, TLS is a web browser.\n\nI was originally going to quip that by the articles logic, VNC should be a GUI framework too, but it is actually mentioned in the article. However, the text under the headline goes weirdly off the rails talking about webkit, WASM and WebGPU."}, {"id": 50649698, "au": "davidgnz", "dom": 76, "sr": 27, "sc": 3.83, "ep": 5.08, "bs": 0.0, "d": 0, "age": 16.14, "grav": 184.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 8, "k": 16, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.06, "fa": 0.42, "gp": 0.959, "bl": 0.0, "ds": 0.0, "txt": "> The Kitty terminal uniquely supports a file upload feature\n\nIf anything, Kitty was late to the party here. Being able to upload (and download!) files has been a fairly common feature in terminals since at least the 80s. Windows 95 even had a terminal that could do this (badly) included right there on the CD."}, {"id": 50655459, "au": "cowlevel", "dom": 52, "sr": 28, "sc": 3.64, "ep": 4.96, "bs": 0.0, "d": 2, "age": 2.44, "grav": 14.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.525, "fa": 0.28, "gp": 0.398, "bl": 0.0, "ds": 0.0, "txt": "And then you've reinvented native apps but worse.\n\nThe point of design or abstraction is basically to pick out specific interesting points on a multidimensional spectrum. You can't cover a large swath of the spectrum and still have a good design.\n\nClassic HTML forms were an interesting point. They are not the most efficient solution to every problem, but they have known properties which allows more to be said about then (for instance no code execution on the client, and you can \"save as\" and print). Fully native apps are another. There's very little that can be guaranteed about a native app but it has access to more ways to do things efficiently. By pulling HTML towards native apps, it becomes a jack of both trades, master of none. You can't guarantee many properties about an HTML page and more, you usually can't print one and definitely can't save-as, but it also can't be as efficient as a native app."}, {"id": 50647522, "au": "teledream", "dom": 92, "sr": 29, "sc": 3.57, "ep": 4.96, "bs": 0.0, "d": 1, "age": 19.49, "grav": 250.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.842, "fa": 0.0, "gp": 0.437, "bl": 0.0, "ds": 0.0, "txt": "\"Worse-is-better\" is really perceptive. Using SSH as a GUI is admittedly a dirty solution, but I find it practical. See, if I tried to build a cross-platform app supporting X11, Wayland, Windows, and macOS, then I'd really be making a GUI framework, and if I tried to abstract all of those universally, well, I'd still be making a GUI framework. Thus the case for SSH presents itself.\n\nThat said, current terminals definitely have rough edges. Being somewhat \"dumb\" clients keeps the attack surface smaller, but it's also quite limiting. To address this (while keeping standard terminals working), I've been working internally on a prototype terminal client to hopefully get things smoother, which I'll share updates when it's ready, along with any open-source projects that come out of the infrastructure it needs.\n\nI heard of Superlogical whilst initially working on Zydra, though I somehow missed the release of Rex, it's definitely something I'll have to look into.\n\nThanks for such a thoughtful comment."}, {"id": 50653005, "au": "teledream", "dom": 119, "sr": 30, "sc": 3.53, "ep": 4.78, "bs": 0.0, "d": 1, "age": 7.95, "grav": 62.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 144, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.774, "fa": 0.0, "gp": 0.421, "bl": 0.0, "ds": 0.0, "txt": "Kitty's graphics protocol isn't being \"abused\" to render graphics, that's kind of its entire use case, but I get your point.\n\nI could make an ultra-complete, elegant client that uses RDP, or tunnel RDP over SSH as you said, but in practice I've found SSH with optimizations fast enough to practically use. The point was proving that it's actually accessible to a large number of people and surprisingly capable, not demonstrating that SSH is the perfect UI framework sent down from the heavens.\n\nI treat the desktop like a \"multiplexer-on-steroids\" with a microVM and graphics built in behind the scenes to turbocharge it. I don't run my multiplexers on RDP.\n\nAlso, we're not making UI primitives from scratch, we have a custom Wayland compositor built upon Smithay, so any Wayland app works on SSH (XWayland is also automatically included, and WebKit has a custom implementation that bypasses display servers via DMABUFs)."}, {"id": 50652733, "au": "teledream", "dom": 83, "sr": 31, "sc": 3.32, "ep": 4.56, "bs": 0.0, "d": 1, "age": 8.55, "grav": 69.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 0.402, "bl": 0.0, "ds": 0.0, "txt": "Very cool project! I got absorbed in NetHack for a bit haha. I'm really excited for a time where SSH-based frameworks make it increasingly doable to build hosted \"applets\" like this.\n\nIndexed PNGs are really clever for DOS, cool optimization :) I'm intrigued by whether it's possible to create a set of optimized Kitty graphics adapters as a library, that would open the door for a lot more people to build graphical SSH apps.\n\nAnd thanks, flattered that you found my optimization work impressive. A lot of it was necessary to get a smooth enough experience over SSH for VMs when rendering a full GUI."}, {"id": 50656875, "au": "Rohansi", "dom": 95, "sr": 32, "sc": 3.27, "ep": 5.66, "bs": 0.85, "d": 4, "age": 0.06, "grav": 3.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 15, "k": 1494, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.451, "fa": 0.42, "gp": 0.725, "bl": 0.32, "ds": 0.0, "txt": "Right. Your product is designed to be like a multiplexer, and that's a concept that only exists in terminals, so it makes sense for your product.\n\n> whereas if you embed graphics in SSH, you can still stream text as actual text.\n\nI agree with you here that remote desktop sucks but, honestly, terminals suck too. They both make different tradeoffs to accomodate graphics at the expense of text, or text at the expense of graphics. With something like HTML+CSS you don't compromise on either because it has first class support for both text and media.\n\nI highly recommend that you give Claude (desktop, not the TUI, make sure you use Code in it) a try because it is a much better experience IMO. You have a GUI chat with nice text rendering, selectable/dictatable, and mixed media into it. And you have panels for things like your diffs, terminal, and browser to see what it's building. Basically what you've built except runs locally."}, {"id": 50648058, "au": "orbital-decay", "dom": 41, "sr": 33, "sc": 3.15, "ep": 4.69, "bs": 0.0, "d": 2, "age": 18.76, "grav": 235.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.381, "fa": 0.28, "gp": 0.446, "bl": 0.0, "ds": 0.0, "txt": "Modern web is a terrible abuse of what was originally a document viewer. A web app is not even in the same league with a TUI when it comes to remote access. It needs to be designed specifically to stay as noiseless on the network as a TUI app is by default, and the browser is incredibly janky and bloated, which is not avoidable. Don't worry though, modern TUIs are headed towards the same direction, because people want more and more features in a legacy thing instead of designing one for the purpose."}, {"id": 50653058, "au": "gf000", "dom": 42, "sr": 34, "sc": 3.1, "ep": 3.98, "bs": 0.0, "d": 3, "age": 7.83, "grav": 61.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.353, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I can compose a text with barely any network and then press send and it will eventually go through.\n\nI literally have to find stuff like herdr web ui or whole mobile applications to write a longer text (e.g. a prompt) when I'm on patchy networks because the variable latency after each keypress makes it impossible to write on an SSH TUI. So if anything, it's the latter that is a \"terrible abuse\" of a GUI."}, {"id": 50647394, "au": "daylily", "dom": 112, "sr": 35, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 2, "age": 19.65, "grav": 253.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 6, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.286, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think they are? They (mostly) output a stream of text where the order of the text matches the structure of the underlying information.\n\nTUIs with their box-drawing characters and emulated 2-d layouts, on the other hand, are not. I think Claude Code really set a bad example here that got everyone interested in making TUIs again."}, {"id": 50647157, "au": "teledream", "dom": 101, "sr": 36, "sc": 2.95, "ep": 4.73, "bs": 0.53, "d": 1, "age": 19.98, "grav": 260.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.351, "fa": 0.34, "gp": 0.401, "bl": 0.2, "ds": 0.0, "txt": "Braille is really interesting as something more universal. Cool project.\n\nIt's true, SSH is just the tool of choice to move bytes around, and it's up to your terminal emulator and the server to decide what those bytes mean. In practice, SSH gives you encryption, key auth, and a way past restrictive firewalls (we listen on port 443 for this exact reason)."}, {"id": 50647679, "au": "XorNot", "dom": 28, "sr": 37, "sc": 2.82, "ep": 3.92, "bs": 0.0, "d": 1, "age": 19.26, "grav": 245.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 17387, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.102, "fa": 0.0, "gp": 0.917, "bl": 0.0, "ds": 0.0, "txt": "The problem is a web browser is exactly that use case. Their whole function is to remotely render a GUI.\n\nWe gripe about web design when people start to act more like it's local, but all the things a browser does are essentially \"I need a remote GUI\" and a lot of effort has gone into that."}, {"id": 50654931, "au": "rjsw", "dom": 13, "sr": 38, "sc": 2.64, "ep": 3.09, "bs": 0.0, "d": 6, "age": 3.41, "grav": 20.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4493, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.313, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Modern GPUs don't do 2D acceleration, there isn't any hardware to map those primitives to. Layers such as Gallium map the old primitives onto software routines running on the GPU.\n\nSome SoCs such as those from Rockchip and Allwinner do have 2D acceleration provided by their display controllers separate from the GPU but there isn't much software support for them."}, {"id": 50647571, "au": "ireadmevs", "dom": 53, "sr": 39, "sc": 2.63, "ep": 3.29, "bs": 0.0, "d": 1, "age": 19.42, "grav": 248.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 100, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.188, "bl": 0.0, "ds": 0.0, "txt": "I'd propose we define some kind of hypertext markup language. Probably allowing the app send some default cascading style sheets would not be bad, but we should be able to apply our custom ones over it. Then we find a way to represent our state transfers between the client and server."}, {"id": 50647481, "au": "orbital-decay", "dom": 3, "sr": 40, "sc": 2.52, "ep": 3.84, "bs": 0.0, "d": 2, "age": 19.54, "grav": 251.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.301, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "X forwarding is the complete opposite of that - it's non-semantic, doesn't abstract away styling, heavily relies on bitmaps, and generally a lot noisier than a terminal. It needs to be replaced with something better thought out for GUI remote access to be a viable alternative. Same goes for SPICE (as far as I remember how it works)."}, {"id": 50653126, "au": "oddurmagnusson", "dom": 78, "sr": 41, "sc": 2.44, "ep": 3.54, "bs": 0.0, "d": 0, "age": 7.68, "grav": 59.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 12, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.506, "bl": 0.0, "ds": 0.0, "txt": "I did a fun experiment, taking what I could do over SSH to the max, by creating a silly game world, raytracing it, adding physics etc.\n\nTry it out with\n\nssh -C w.oddur.me\n\n(the -C enabled compression )\n\nI still would not say that ssh is a good game rendering framework though :D"}, {"id": 50648110, "au": "whartung", "dom": 5, "sr": 42, "sc": 2.44, "ep": 3.98, "bs": 0.0, "d": 4, "age": 18.69, "grav": 233.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5193, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.394, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "I remember running the original Citrix client for Windows over a 14k modem.\n\nIt worked remarkably well, the only real nut was the typical “splash page” on launch, which was typically a large bitmap. Those stalled pretty hard, but once you got past that and up and running, apps were quite smooth over the crummy bandwidth."}, {"id": 50652479, "au": "geocar", "dom": 68, "sr": 43, "sc": 2.3, "ep": 3.69, "bs": 0.0, "d": 1, "age": 9.15, "grav": 76.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 6424, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.522, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "DEC terminals did have block support! Almost nobody used them on unix afaik, but I saw a lot of VMS stuff that used a combination of the \"protected\" SGR, the local-editing mode, \"media copy to host\", and hotkey programming to produce a really similar experience to IBM.\n\nI think xterm just doesn't support some of this stuff because it was easier than fixing write/ptys."}, {"id": 50647328, "au": "teledream", "dom": 99, "sr": 44, "sc": 2.25, "ep": 3.15, "bs": 0.53, "d": 1, "age": 19.73, "grav": 255.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "That's a fair concern. Any escape-sequence parser can have unknown vulnerabilities, and terminals don't have browser-grade sandboxing. Still, it's quite a different, much smaller attack surface than a browser downloading and running untrusted client-side code (JS, WASM), and a much easier one to harden over time."}, {"id": 50647564, "au": "amelius", "dom": 102, "sr": 45, "sc": 2.21, "ep": 3.31, "bs": 0.0, "d": 0, "age": 19.44, "grav": 248.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 52543, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 0.737, "fa": 0.0, "gp": 1.092, "bl": 0.0, "ds": 0.0, "txt": "makes me wonder: if a tool can do almost everything then doesn't that mean its attack surface is also unnecessarily large?"}, {"id": 50649911, "au": "Rohansi", "dom": 93, "sr": 46, "sc": 2.16, "ep": 3.7, "bs": 0.0, "d": 2, "age": 15.75, "grav": 177.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 1494, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.576, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's a fun experiment but I would never do this. You lose all the magic of \"just ssh hostname\" when you only work properly with a few terminal emulators. Rolling your own terminal emulator is an extra step in the wrong direction.\n\nOn the flip side, cross-platform GUI frameworks already exist. HTML+CSS are really great, with everything you need and more built-in already, and none of the jank running in a 1970s-based terminal brings. If you want reduced attack surface I would say it makes more sense building (or forking) a browser engine with just the features you need, keeping compatibility with other browsers so nobody is forced to use yours."}, {"id": 50653111, "au": "alex_duf", "dom": 107, "sr": 47, "sc": 2.12, "ep": 3.22, "bs": 0.0, "d": 0, "age": 7.72, "grav": 59.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 3428, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.076, "fa": 0.0, "gp": 0.476, "bl": 0.0, "ds": 0.0, "txt": "It's fun but I don't want any of that in my ssh nor my terminal. I want my terminal to display characters, my ssh connection to be secure, and the whole thing to have as small an attack surface as possible.\n\nWhat could possibly go wrong with having the client decoding pixels and having to handle VRAM?"}, {"id": 50647371, "au": "Telemakhos", "dom": 65, "sr": 48, "sc": 2.09, "ep": 2.97, "bs": 0.0, "d": 1, "age": 19.68, "grav": 254.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 2362, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 1.263, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I remember those days, and getting mail by telnet.  I wonder what would happen if you asked college kids to ssh in to a server today instead of giving them a web interface.  I think it could be a big plus for them to see some sort of computing that isn't packaged the same way as everything else, namely as a web page."}, {"id": 50655418, "au": "cowlevel", "dom": 35, "sr": 49, "sc": 2.03, "ep": 3.57, "bs": 0.0, "d": 3, "age": 2.52, "grav": 15.1, "surf": 15.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.181, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Problem is the more flexible a contract/protocol/interface is for one side, the less flexible it is for the other.\n\nFor example a terminal supports flexible font (but only monospace!) and font size. If it was based on pixels those wouldn't be changeable. Conversely if it didn't have a character grid (like HTML doesn't) it could also support proportional fonts."}, {"id": 50647674, "au": "kccqzy", "dom": 47, "sr": 50, "sc": 1.95, "ep": 3.49, "bs": 0.0, "d": 1, "age": 19.27, "grav": 245.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 20062, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.278, "fa": 0.0, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": "That better solution is known as plain HTML over HTTPS. The user can write their own styles. The user can prohibit <img>s or selectively allow them.\n\nBut yeah the author is probably deliberately conflating between the Terminal which renders and the SSH protocol which just transports streams securely. It makes the title more enticing."}, {"id": 50651892, "au": "pjmlp", "dom": 116, "sr": 51, "sc": 1.93, "ep": 3.03, "bs": 0.0, "d": 0, "age": 10.86, "grav": 99.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.803, "fa": 0.34, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "This is not a GUI framework, and welcome to the 1980's with telnet and rlogin.\n\nThe only difference is the encryption mechanisms, and the whole pain with certificate management."}, {"id": 50648897, "au": "Dwedit", "dom": 84, "sr": 52, "sc": 1.81, "ep": 2.91, "bs": 0.0, "d": 0, "age": 17.52, "grav": 210.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 4854, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.633, "fa": 0.0, "gp": 0.984, "bl": 0.0, "ds": 0.0, "txt": "Once you start putting in the GUI features, you're competing with VNC and Sunshine/Moonlight."}, {"id": 50647598, "au": "teledream", "dom": 26, "sr": 53, "sc": 1.66, "ep": 3.73, "bs": 0.53, "d": 1, "age": 19.38, "grav": 247.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.358, "fa": 0.0, "gp": 0.37, "bl": 0.2, "ds": 0.0, "txt": "I mean, one could argue that the web is just a remotely accessible hypertext protocol we've been increasingly abusing to make whatever arbitrary GUIs we want.\n\nI've always wanted a styling-independent protocol, which led me to the Gemini protocol (not the AI) for one, although I find that all such \"next-generation\" protocols don't see much traction.\n\nI picked SSH as a convenient option that people already use to log into VMs."}, {"id": 50655653, "au": "seba_dos1", "dom": 14, "sr": 54, "sc": 1.6, "ep": 2.48, "bs": 0.0, "d": 7, "age": 2.13, "grav": 12.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think you meant Glamor, which implements X11 acceleration through OpenGL, replacing hardware-specific DDX drivers; Gallium is the abstraction layer between Mesa drivers and graphics APIs. Don't confuse with Glamo, which was the Neo Freerunner's GPU and had its own DDX driver :)"}, {"id": 50649365, "au": "st_goliath", "dom": 106, "sr": 55, "sc": 1.48, "ep": 2.73, "bs": 0.0, "d": 2, "age": 16.77, "grav": 196.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 5666, "kpp": 8.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.162, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, the authors TUI program would also work just as well over RS232.\n\nBecause those are transports, the terminal [emulator] at the end, responsible for interpreting what the TUI program on the other end outputs (and vice-versa), are separate things. They live at different places in the OSI stack."}, {"id": 50655345, "au": "cowlevel", "dom": 19, "sr": 56, "sc": 1.48, "ep": 2.89, "bs": 0.0, "d": 3, "age": 2.63, "grav": 15.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_app", "flbl": "Interesting & App (Large)", "urls": [], "ig": 1.231, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Have you actually tried it? Most modern apps and frameworks render to bitmaps on the GPU and pass that over X11 but that isn't the only thing you can do with X11.\n\nAnd nobody mentioned \"semantic\". Focus on \"semantic\" usually turns out to be ivory tower nonsense that impedes progress towards working systems, anyway."}, {"id": 50647802, "au": "zokier", "dom": 37, "sr": 57, "sc": 1.48, "ep": 2.88, "bs": 0.0, "d": 2, "age": 19.1, "grav": 242.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 19258, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.148, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "it is annoying how poorly web browsers support the local or ssh tunneled application use case though. it would be nice if there was a way to get browsers to work more like X servers, presenting an unix socket that applications (either local or ssh-tunneled) could connect to. Or something along those lines."}, {"id": 50650212, "au": "InsidiousWombat", "dom": 29, "sr": 58, "sc": 1.48, "ep": 2.7, "bs": 0.0, "d": 2, "age": 15.1, "grav": 165.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "They are not and the fact HTML/CSS is NOT designed to be \"remote GUI\" is precisely the problem web has.\n\nIt is document + styling format. It was not designed to do GUIs, It was roundpeg squareholed into being one, and only after throwing copious amount of JS on it it works okay while being okay on design side"}, {"id": 50652252, "au": "miki123211", "dom": 51, "sr": 59, "sc": 1.48, "ep": 2.66, "bs": 0.0, "d": 1, "age": 9.82, "grav": 85.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 12952, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.104, "fa": 0.0, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "It exists. It's called HTTP and HTML.\n\nIf you do this, however, you quickly figure out that you're wasting bandwidth and the user's time by forcing a round trip to a far-off server on every button click (hence Javascript), and that the UI looks inconsistent in different browsers (hence CSS), and then, a few years later, you get the status quo."}, {"id": 50648130, "au": "hnlmorg", "dom": 16, "sr": 60, "sc": 1.48, "ep": 2.53, "bs": 0.0, "d": 3, "age": 18.67, "grav": 233.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 12535, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "semantic_svg", "flbl": "Semantic & Svg (Language)", "urls": [], "ig": 0.529, "fa": 0.0, "gp": 0.887, "bl": 0.0, "ds": 0.0, "txt": "I’ve not done X forwarding in decades but it definitely was semantic and abstracted styling back when i used it to connect to Solaris boxes over dial up.\n\nMaybe the bitmap problem was an issue with modern DEs? Many of them were likely bitmap-heavy for window chrome anyway."}, {"id": 50653125, "au": "sedatk", "dom": 70, "sr": 61, "sc": 1.48, "ep": 2.37, "bs": 0.0, "d": 3, "age": 7.68, "grav": 59.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 7751, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 1.009, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You should visit Vintage Computer Festival (VCF) events across the US. I bumped into a working DEC terminal on my every visit. Some let you use it too."}, {"id": 50656475, "au": "InsidiousWombat", "dom": 32, "sr": 62, "sc": 1.48, "ep": 2.24, "bs": 0.0, "d": 4, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.952, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "WebGL + WASM approach seems to be far better at making actually well working UIs  (because you can use actual desktop frameworks for it), but that's a bit fat"}, {"id": 50650356, "au": "Dwedit", "dom": 86, "sr": 63, "sc": 1.48, "ep": 2.2, "bs": 0.0, "d": 2, "age": 14.79, "grav": 160.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4854, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 0.938, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Extending a terminal protocol to include advanced graphics makes it compete directly with X, Wayland, VNC, Moonlight, etc.  Even if it's not technically part of SSH itself."}, {"id": 50656531, "au": "gf000", "dom": 33, "sr": 64, "sc": 1.48, "ep": 3.01, "bs": 0.85, "d": 5, "age": 0.68, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 2146, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.281, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Nothing beats the accessibility of plain HTML form/buttons. But I do agree that web frameworks can break down at certain things (though to be honest desktop frameworks are in quite a bad shape in general, there are too many of them and most of them fall short of feature completeness, at which point they simply can't be used. It's a very very hard and complex topic, like text rendering, and having n+1 different solutions may not really help it)"}, {"id": 50653775, "au": "nektro", "dom": 89, "sr": 65, "sc": 1.48, "ep": 2.07, "bs": 0.0, "d": 0, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 739, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "the biggest thing holding back further deployment of ssh is the lack of support for virtual hosts"}, {"id": 50653039, "au": "teledream", "dom": 110, "sr": 66, "sc": 1.48, "ep": 2.57, "bs": 0.53, "d": 1, "age": 7.87, "grav": 61.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 15, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "protocol_forwarding", "flbl": "Protocol & Forwarding (GUI)", "urls": [], "ig": 1.092, "fa": 0.0, "gp": 0.0, "bl": 0.2, "ds": 0.0, "txt": "It doesn't. What's good about SSH is that it doesn't do any interpreting of the bytes sent on its own, so we're free to build our own protocols for accessibility over time, and it'll be part of the evolution of Zydra depending on how far it goes. We only have reduced motion for now on SSH, unfortunately, though our webapp streaming elements as HTML helps on that front too."}, {"id": 50650117, "au": "thayne", "dom": 11, "sr": 67, "sc": 1.48, "ep": 1.94, "bs": 0.0, "d": 4, "age": 15.31, "grav": 169.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 10733, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "primitives_code", "flbl": "Primitives & Code (Home)", "urls": [], "ig": 0.75, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "The X protocol has some semantic drawing primitives, but modern applications rarely use them. Partly because they don't look very good, and partly because it is often easier to draw bitmaps, and the X primitives can't make use of the GPU."}, {"id": 50648306, "au": "messh", "dom": 40, "sr": 68, "sc": 1.48, "ep": 1.87, "bs": 0.0, "d": 2, "age": 18.39, "grav": 227.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 389, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.795, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "the main difference between web UI and a terminal is that a terminal streams instructions. For HTML you usually need a whole program that compiles"}, {"id": 50647404, "au": "cozzyd", "dom": 121, "sr": 69, "sc": 1.48, "ep": 5.43, "bs": 3.58, "d": 0, "age": 19.64, "grav": 253.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 7506, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 1.518, "fa": 0.34, "gp": 0.617, "bl": 1.35, "ds": 0.0, "txt": "Apparently there are some brain-damaged terminals (e.g. warp) that instead of using normal ssh launch some remote helper process that opens one worker thread per core that all wake up at the same time. Which is great fun on a 192 core shared systemm. Fortunately a cgroup task/cpu limit will neuter them and other abusive programs like vscode-server."}, {"id": 50655244, "au": "getfacl", "dom": 120, "sr": 70, "sc": 1.48, "ep": 1.81, "bs": 0.0, "d": 2, "age": 2.84, "grav": 17.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 223, "kpp": 8.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think the concern here is that nothing you are doing relies on SSH at all. You are using TUI techniques that have been around for ages.\n\nDid you make every word in the title misleading on purpose?"}, {"id": 50648006, "au": "mrcslws", "dom": 38, "sr": 71, "sc": 1.48, "ep": 1.7, "bs": 0.0, "d": 3, "age": 18.83, "grav": 236.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 20, "qw": 0, "k": 339, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ssh_terminal", "flbl": "SSH & Terminal (Framework)", "urls": ["https://probablymarcus.com/blocks/2026/11/20/ssh-tunneling-has-unrealized-potential.html"], "ig": 0.722, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've actually recently shipped something along these lines, now supported on all platforms. It's an SSH client fused with a browser: https://probablymarcus.com/blocks/2026/11/20/ssh-tunneling-h..."}, {"id": 50653310, "au": "getfacl", "dom": 87, "sr": 72, "sc": 1.47, "ep": 2.32, "bs": 0.85, "d": 3, "age": 7.22, /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
