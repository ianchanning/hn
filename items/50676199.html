_anchors": ["ii", "blizzard", "character", "games", "play", "gameplay", "far", "story", "experience", "played", "feels", "loop", "took", "series", "playing", "crunch", "team", "company"], "largest_root": {"root_id": 50677170, "author": "jkahrs595", "slots": 11, "start_dom": 33, "end_dom": 43, "share_pct": 22.9, "top_dom1_age": 0.7, "top_dom1_author": "stevenwoo"}, "buried_cutoff": 25, "rescue_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50678193, "au": "tgtweak", "dom": 3, "sr": 1, "sc": 5.59, "ep": 5.59, "bs": 0.0, "d": 0, "age": 1.66, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 4520, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "playing_evil", "flbl": "Playing & Evil (Doom)", "urls": [], "ig": 1.255, "fa": 0.68, "gp": 0.485, "bl": 0.0, "ds": 0.0, "txt": "I remember Diablo felt like a demo after Diablo II came out - the dept of diablo II vs the first Diablo was unprecedented for a sequel.  I still play Diablo 2 every once in a while.\n\nDespite the hate for Diablo 3 I actually really liked it and enjoyed the real money auction house until they killed it (botters ultimately ruined it). I remember getting an SoJ drop about 12 hours into one of my first runs and selling it for $250 real dollars, which was wild at the time. It wasn't the same depth of play though.\n\nDiablo 4 has been pretty fun too but doesn't have the same pull as Diablo 2 when it first came out."}, {"id": 50678090, "au": "WhereIsTheTruth", "dom": 47, "sr": 2, "sc": 5.51, "ep": 5.51, "bs": 0.0, "d": 0, "age": 1.87, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 144, "qw": 0, "k": 745, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": ["https://www.videogamer.com/features/diablo-creator-david-brevik-doesnt-vibe-with-todays-rapid-arpgs/"], "ig": 1.452, "fa": 0.62, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "Modern action RPGs took all the wrong lessons from Diablo 2\n\nIt was never about the mindless hack'n'slash, it was about everything surrounding it, from the exploration, the atmosphere, the character building, all the thrill of discovery, and the sense of adventuring into hostile, dark and mysterious world\n\nCombat was a means to experience that world, it was never excuse to turn it into a slot machine with explosion everywhere (i'm looking at you Path of Exile, even you, modern Blizzard)\n\nEven David Brevik, the father of Diablo, is not very happy with what the genre has become [1]\n\nVery few AAA studios managed to recapture that feeling, FromSoftware is one of them, with Demon Souls and Dark Souls series\n\nI don't think we'll ever experience a game like Diablo 2 again, and i don't think Blizzard can ever manage to undo the harm D3 & D4 have done to this IP\n\n[1] https://www.videogamer.com/features/diablo-creator-david-bre..."}, {"id": 50678570, "au": "ksec", "dom": 2, "sr": 3, "sc": 4.77, "ep": 4.77, "bs": 0.0, "d": 0, "age": 1.01, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 58062, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "friend_listen", "flbl": "Friend & Listen (Loop)", "urls": [], "ig": 1.481, "fa": 0.28, "gp": 0.341, "bl": 0.0, "ds": 0.0, "txt": "\"Hello, my friend. Stay awhile and listen...\"\n\nDiablo 1 and 2 was just basic grind, repetitive but fun. It was also an era where the physical package is so great I still kept the box with me. They have story book inside to explain the whole world view and characters.\n\nAnd then somewhere along the line they lost the plot. It feels commercial, the heart and soul were gone. More or less like Apple without Steve Jobs, the products may resemble the old Apple products. But there is something missing.\n\nEdit: Turns out according to another comment the original Diablo team was disbanded and their Diablo 3 work was thrown away."}, {"id": 50677952, "au": "hellcow", "dom": 31, "sr": 4, "sc": 4.58, "ep": 4.58, "bs": 0.0, "d": 1, "age": 2.08, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 0, "k": 3713, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "friend_listen", "flbl": "Friend & Listen (Loop)", "urls": ["https://lastepoch.com/"], "ig": 1.017, "fa": 0.62, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "Yes, Last Epoch. The story sucks but the game loop, skill design, and itemization are great. https://lastepoch.com/\n\nLast Epoch's Circle of Fortune and Merchant's Guild make the game equally fun to play for both solo self-found and trading players."}, {"id": 50678445, "au": "aurareturn", "dom": 12, "sr": 5, "sc": 4.48, "ep": 4.48, "bs": 0.0, "d": 2, "age": 1.23, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 8875, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "friend_listen", "flbl": "Friend & Listen (Loop)", "urls": [], "ig": 1.359, "fa": 0.34, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "The original Diablo team was disbanded and their Diablo 3 work was thrown away. A new team designed Diablo 3. You can tell. The philosophy was too different. You  might as well called Diablo 3 something else like Angels and Demons 1.\n\nDiablo 3 was a commercial success but only because of how beloved Diablo 2 was. I remember seeing online stats showing how fast people abandoned D3 after release. Meanwhile, D2 still has a very large online population 26 years after release.\n\nThey destroyed the Diablo brand forever in my opinion. It could have been so much more.\n\nI'm glad they made D2 Resurrected as a love letter to the original D2 fans."}, {"id": 50677657, "au": "tpoacher", "dom": 36, "sr": 6, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 2, "age": 2.54, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 4154, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "Technically, it's not \"the devil\" in the Christian sense (or any other religion that believes in the devil) per se.\n\nThe setting is an alternate universe / cosmology where there exist forces of good and forces of evil of a very particular nature and history, and where such forces are entirely mortal and occupying physical realms (albeit generally unreachable by ordinary humans / your average Jo).\n\nObviously the terminology borrows heavily from Christian (and not only) vocabulary for familiarity and effect, but has little to do with current religious beliefs in principle.\n\nIn this universe, Diablo is simply one of the higher-ranked \"generals\" in the \"forces of evil\"; but is not particularly special either, and there are others like him (e.g. Baal, and Mephisto, as well as the slightly lower ranked Azmodan, Belial, Andariel, and Duriel).\n\nAnd similarly Tyrael and others are generals on the other side (\"the council of angels of the High Heavens\"), which purports itself to be \"the good side\", but, all is relative, of course.\n\nSo in some sense, Diablo is closer to Starwars and the Jedi vs Sith wars, than it is to Christianity, except for the fact that it is heavily sprinkled with \"biblical\" vocabulary."}, {"id": 50678791, "au": "stevenwoo", "dom": 1, "sr": 7, "sc": 3.82, "ep": 3.82, "bs": 0.0, "d": 0, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 204, "qw": 0, "k": 6248, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.156, "bl": 0.0, "ds": 0.0, "txt": "Haven’t kept up with rest of the folks aside from Strava but that wasn’t the hardest crunch of my career- I worked at a startup prior to this as the only full time programmer for a while and worked a more difficult crunch than we put into Diablo 2. I finished my D2 parts earlyish and made my stuff mostly data driven and trivial to add more content so spent the last months of D2 mostly doing QA and minor bug fixing. At the startup we had to make deadlines to make payroll - never had that sort of pressure at Blizzard North except of course losing your job. Dave in his speech announcing their departure claimed he and Max and Erich left when their five year contract with Blizzard was up. I didn’t invest in Cendant because I had plenty of worthless or low value shares from prior work at startups and was kind of wary of investing into a patent company I didn’t know much about - what (I think? this was the year) I remember most about that E3 (didn’t go?) was Dave came back with a beta CD of Half-Life we all played and I added the in game remapping of the keyboard after seeing my officemate customize his HL keymapping because he was left handed."}, {"id": 50678514, "au": "rybosome", "dom": 21, "sr": 8, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 0, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 1915, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "playing_evil", "flbl": "Playing & Evil (Doom)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.272, "bl": 0.0, "ds": 0.0, "txt": "Great write-up, lots of good nuggets to digest here. The crunch story is harrowing, I was not familiar but I’m not surprised.\n\nI never played Diablo 2 much, but I got deeply into Diablo 3 with friends from work. Obviously a different game, but what I found most enjoyable about that one is that, at the highest levels of difficulty, it transforms into playing something like Doom.\n\nIn Doom, both you and your enemy are highly lethal to one another. I describe it as being like two scorpions fighting one another; both have essentially one-touch lethality against one another. You survive by constantly moving, weaving in and out of opponents and deftly swapping weapons as needed.\n\nDiablo 3 at very high difficulties with high-level builds is the same. Playing successfully really emphasizes the action element of ARPG. It’s far from mindless, and can actually require a lot of concentration.\n\nDid the highest levels of difficulty in Diablo 2 demand that kind of precision and skilled play, in both build and combat?"}, {"id": 50678346, "au": "iamcalledrob", "dom": 11, "sr": 9, "sc": 3.73, "ep": 3.88, "bs": 0.0, "d": 1, "age": 1.39, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1484, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": [], "ig": 1.166, "fa": 0.28, "gp": 0.237, "bl": 0.0, "ds": 0.0, "txt": "Diablo 3+4 are just such different games that approach gameplay in a fundamentally different way to Diablo 1+2.\n\nIt's fascinating seeing some of the Diablo 3 team (e.g. Wyatt Cheng) posting online about game design. Their definitions of \"good\" are so out of alignment with what made the original games great.\n\nThe older games feel accidentally addictive, whereas the newer ones feel designed to be addictive."}, {"id": 50678692, "au": "jFriedensreich", "dom": 16, "sr": 10, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 0, "age": 0.8, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 167, "qw": 0, "k": 1603, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": [], "ig": 1.435, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "There is an aspect i find people not talk about enough outside of soundtrack focused communities and that is atmosphere, character and perfection of details. I agree with the author about the many shortcomings and flatness of story and gameplay but it made up for this in music, voices, textures and liminal quality that i thought i would never feel again until series like severance managed to strike the chord from very different angle. Maybe it needed this flatness in many places to be able to christalise this feeling. I came from adventure games and could not help but feel tristram and other places be scenes i want to drown myself into, feel the claustrophobic locked in town, hear the struggles of people managing scarce resources and depending on weird stranger coming by. What i would want is a diablo 1 reincarnation as a fusion genre of disco elysium, classic diablo and desparados 2. I hope i see the day this can be a prompt as the industry is not going to make something for such a niche audience of just me"}, {"id": 50678757, "au": "esalman", "dom": 4, "sr": 11, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 0, "age": 0.71, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 2954, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "playing_evil", "flbl": "Playing & Evil (Doom)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 0.182, "bl": 0.0, "ds": 0.0, "txt": "I have not played Diablo II, but I did put thousands of hours into Diablo 4.\n\nDiablo is a great game in terms of the RPG elements, arts and all, but the main draw of the game, which creates almost gambling like addition (and makes Blizzard billions of dollars), is the RNG and big-numbers-go-brrr mechanics. I researched online and min-maxed the f out of every build to the point I was walking around endgame AFK.\n\nEvery game I'm playing since dropping Diablo 4, I'm intentionally letting myself explore and stopping from researching and min-maxing, and it's been refreshing."}, {"id": 50678076, "au": "aurareturn", "dom": 6, "sr": 12, "sc": 3.27, "ep": 3.57, "bs": 0.0, "d": 0, "age": 1.89, "grav": 11.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 8875, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 0.994, "fa": 0.0, "gp": 0.85, "bl": 0.0, "ds": 0.0, "txt": "Diablo 3 was just not the same franchise almost.\n\nEven today, if you log into Diablo 3 as a fresh new player, you can go for weeks without seeing anyone online.\n\nIf you do the same for Diablo 2 Resurrected, you can find a team almost instantly.\n\nDiablo 3 is a lonely game, while in D2, you can always find a party at any time."}, {"id": 50677170, "au": "jkahrs595", "dom": 33, "sr": 13, "sc": 3.03, "ep": 3.17, "bs": 0.0, "d": 0, "age": 3.36, "grav": 20.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 303, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "friend_listen", "flbl": "Friend & Listen (Loop)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.28, "bl": 0.0, "ds": 0.0, "txt": "oh there was satanic panic alright, it just wasn't as mainstream as it was around DnD in the 80s.\n\nMy friend's mom received a box of PC games (original Diablo included) that she gave to my (heathen) family because she didn't want her son playing that devil worshipping game.\n\nI had never been so happy to have (mostly) rational parents."}, {"id": 50678719, "au": "mpyne", "dom": 7, "sr": 14, "sc": 2.77, "ep": 3.21, "bs": 0.0, "d": 1, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 8377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "Reading this is kind of funny because D3 (as it evolved into its expansions etc.) is by far and away my favorite.\n\nIt lets me play by myself, unlike D4! It lets me respec without complaint! I don’t need a decoder ring to figure out if a rune/gem is helpful or not!\n\nLike it feels weird for me to type this but I agree that they came at it from a different viewpoint than D1/D2 designers, almost as if they were focused on whether a game mechanic was fun first... but that ended up better matching what I wanted."}, {"id": 50677738, "au": "ddtaylor", "dom": 23, "sr": 15, "sc": 2.72, "ep": 2.72, "bs": 0.0, "d": 1, "age": 2.41, "grav": 14.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 13697, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "playing_evil", "flbl": "Playing & Evil (Doom)", "urls": [], "ig": 1.159, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "D2R as a whole has been really good. I was really happy with it and I want them to keep making money on it and continue the art direction, etc.\n\nI really tuned out of D3 because of the overall style.\n\nD4 was cool art wise and style wise, but the gameplay mechanics at that point suck compared to PoE and were really boring. I played the game for the story stuff without wanting to go back much."}, {"id": 50678359, "au": "agrippanux", "dom": 37, "sr": 16, "sc": 2.72, "ep": 3.02, "bs": 0.0, "d": 3, "age": 1.36, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1468, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "And like Star Wars, where Count Dooku could of been a super interesting rogue 3rd party but instead was just a silly agent of Palpatine, Diablo 4's Lilith could of been a super interesting 3rd party to the Heaven/Hell split we've seen since D2. However they took the easy way out and rendered her - and by extension everything you do in the base D4 game - fairly meaningless."}, {"id": 50677457, "au": "kawsper", "dom": 32, "sr": 17, "sc": 2.6, "ep": 2.82, "bs": 0.0, "d": 0, "age": 2.87, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 3056, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "friend_listen", "flbl": "Friend & Listen (Loop)", "urls": [], "ig": 1.06, "fa": 0.0, "gp": 0.226, "bl": 0.0, "ds": 0.0, "txt": "I've been enjoying the remaster on my Steam Deck.\n\nIt has aged fine, but I'd like more storage options and other quality-of-life additions that some of the offline mods provide.\n\nSadly you can't play your \"offline\" character unranked with a friend, like you used to in old D2."}, {"id": 50678262, "au": "iamcalledrob", "dom": 44, "sr": 18, "sc": 2.45, "ep": 2.67, "bs": 0.0, "d": 0, "age": 1.52, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1484, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": [], "ig": 0.671, "fa": 0.34, "gp": 0.085, "bl": 0.0, "ds": 0.0, "txt": "Absolutely genre defining game.\n\nIt's stuck with me for nearly 25 years at this point, and still feels as relevant as ever."}, {"id": 50678968, "au": "criemen", "dom": 20, "sr": 19, "sc": 2.43, "ep": 2.65, "bs": 0.0, "d": 0, "age": 0.32, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 396, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 1.086, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "I spent many many hours on Diablo II as teenager, so I don't share the negative sentiment of the author on the gameplay loop, I have many good memories from back then. I even came back to D2R a while ago (amazing job from the team!), and it picked up right where I left off, while making the graphics bearable. I'm sad to hear that creating the game took such a toll on the team, though."}, {"id": 50678348, "au": "markus_zhang", "dom": 28, "sr": 20, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 0, "age": 1.39, "grav": 9.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 8664, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "experience_diablo", "flbl": "Experience & Diablo (Classic)", "urls": [], "ig": 0.914, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "Diablo I and II are responsible for my multiple hand and wrist injuries. I played too much of them! I still play Project Diablo II and with a vertical mouse and keyboard shortcut for attacking/casting the experience is much better."}, {"id": 50678656, "au": "rskeens", "dom": 24, "sr": 21, "sc": 2.33, "ep": 2.33, "bs": 0.0, "d": 0, "age": 0.85, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 23, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "experience_diablo", "flbl": "Experience & Diablo (Classic)", "urls": [], "ig": 0.934, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "Met some of my first highschool friends thank you to Diablo and then met more people when Diablo II arrived.\n\nGrinding for gear is one thing but avoidance of showing up at the weekend lan party underpowered was an even more powerful motivator."}, {"id": 50677722, "au": "ddtaylor", "dom": 29, "sr": 22, "sc": 2.12, "ep": 5.69, "bs": 3.58, "d": 0, "age": 2.44, "grav": 14.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 41, "qw": 0, "k": 13697, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "experience_diablo", "flbl": "Experience & Diablo (Classic)", "urls": ["https://www.youtube.com/@ShrimpMTG", "https://retrod2.com/"], "ig": 1.032, "fa": 0.9, "gp": 0.486, "bl": 1.35, "ds": 0.0, "txt": "There is a fun server you can play on that does the 1.06b patch still, since it's known to have a very different set of gameplay rules due to various bugs, glitches, etc.\n\nShrimpDiablo runs it and he's a pretty small YouTuber.\n\n- YouTube: https://www.youtube.com/@ShrimpMTG\n- RetroD2: https://retrod2.com/"}, {"id": 50677368, "au": "JackSlateur", "dom": 39, "sr": 23, "sc": 2.03, "ep": 2.69, "bs": 0.0, "d": 2, "age": 2.97, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 715, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "playing_evil", "flbl": "Playing & Evil (Doom)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "To try to guess an explanation: only god can defeat evil. We, humans, must rest in god's hands to resist evil: we cannot do it on our own.\n\nIn diablo, the character is the main \"hero\", no god\n\nThus, this is arrogance and pride, which is a capital sin, thus evil"}, {"id": 50678176, "au": "hhh", "dom": 9, "sr": 24, "sc": 2.02, "ep": 2.46, "bs": 0.0, "d": 1, "age": 1.69, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 2547, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "experience_diablo", "flbl": "Experience & Diablo (Classic)", "urls": [], "ig": 0.975, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Every time I log into d3 I see people in the chat. I did several interviews around the time of d4 season 2 as well as a PoE 2 league.\n\nI seem to be in a minority that really loved where D3 reached later on in its lifecycle. I have a great fondness for D2 as well though, and the same for PoE1/2."}, {"id": 50677557, "au": "BigMucho", "dom": 25, "sr": 25, "sc": 1.69, "ep": 4.43, "bs": 2.52, "d": 0, "age": 2.69, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 35, "qw": 0, "k": 2, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "experience_diablo", "flbl": "Experience & Diablo (Classic)", "urls": ["https://www.projectdiablo2.com/"], "ig": 0.992, "fa": 0.62, "gp": 0.23, "bl": 0.95, "ds": 0.0, "txt": "If you miss the classic Diablo II experience, I highly recommend trying “Project Diablo II”.\n\nhttps://www.projectdiablo2.com/\n\nThey keep the original game patched and updated (with unique content and balance adjustments etc) and run several multiplayer servers regionally."}, {"id": 50678111, "au": "loloquwowndueo", "dom": 46, "sr": 26, "sc": 1.67, "ep": 2.11, "bs": 0.0, "d": 0, "age": 1.83, "grav": 11.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 7011, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "company_party", "flbl": "Company & Party (Team)", "urls": [], "ig": 0.831, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "lol when it came out we’d shut down the entire company for the afternoon, not even answering phones and played coop diablo II until the wee hours. Between that and StarCraft, no wonder the company ended up going under."}, {"id": 50678854, "au": "michaelbrave", "dom": 13, "sr": 27, "sc": 1.43, "ep": 2.31, "bs": 0.0, "d": 3, "age": 0.54, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 830, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "feel_console", "flbl": "Feel & Console (Coming)", "urls": [], "ig": 0.762, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I enjoyed Diablo 3 on the console, especially with co-op, but not on PC, couldn't get into it at all. For me it felt like an entirely different series, something closer to Guantlet than Diablo 2, but I did enjoy it with the right format/controlls."}, {"id": 50677770, "au": "gavinray", "dom": 30, "sr": 28, "sc": 1.37, "ep": 1.96, "bs": 0.0, "d": 0, "age": 2.36, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 8196, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0,
