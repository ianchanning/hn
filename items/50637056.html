": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": ["https://github.com/greydanus/pengpt/pull/1"], "ig": 0.404, "fa": 2.35, "gp": 0.346, "bl": 0.0, "ds": 0.0, "txt": "Wobbliness mostly fixed now with a slight processing hack (https://github.com/greydanus/pengpt/pull/1)"}, {"id": 50637580, "au": "keyle", "dom": 1, "sr": 3, "sc": 7.92, "ep": 7.92, "bs": 0.0, "d": 0, "age": 17.8, "grav": 215.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 75, "qw": 0, "k": 17279, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": ["http://www.incompleteideas.net/IncIdeas/BitterLesson.html"], "ig": 1.373, "fa": 0.96, "gp": 1.348, "bl": 0.0, "ds": 0.0, "txt": "The most interesting part to me is this mention of the Bitter Lesson [1]\n\n\"The results are interesting and the project was a pleasure to work on. And yet there was no clever architectural idea behind it. About 80% of my effort went into building the biggest, cleanest datasets possible and doing lots of quality control on them.\"\n\nI spend way too much time on trying to out-clever existing solutions, when a clean application of known approaches would serve best.\n\n[1] http://www.incompleteideas.net/IncIdeas/BitterLesson.html"}, {"id": 50639181, "au": "mitthrowaway2", "dom": 68, "sr": 4, "sc": 7.78, "ep": 7.78, "bs": 0.0, "d": 2, "age": 13.69, "grav": 142.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 19, "qw": 0, "k": 8424, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.cs.toronto.edu/~graves/handwriting.html"], "ig": 0.179, "fa": 2.12, "gp": 0.908, "bl": 0.0, "ds": 0.0, "txt": "Yeah. If we sent it back in time to the University of Toronto in 2013 it might look like this: https://www.cs.toronto.edu/~graves/handwriting.html"}, {"id": 50640745, "au": "joefourier", "dom": 10, "sr": 5, "sc": 5.27, "ep": 5.42, "bs": 0.0, "d": 1, "age": 9.63, "grav": 82.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 194, "qw": 0, "k": 1789, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.765, "fa": 0.0, "gp": 0.874, "bl": 0.0, "ds": 0.0, "txt": "While I agree with you about the importance of data, ironically, it seems you forgot to apply the bitter lesson to where it was more critical. As others brought up (see the thread with @NitpickLawyer) there's an obvious tell from the wobbliness of the slanted lines, most likely due to the grid quantisation (you can see it in the wobbly sketches too). This is in fact injected human knowledge, as opposed to working with raw pixels or raw vectors from hand strokes, and no amount of data could work around that bottleneck.\n\nThis is something that I've seen happen very often with machine learning practitioners. You cannot add more data to fix bad pre-processing. LLMs are limited by the BPE tokenisation (hence why early models couldn't count r-s in strawberry), diffusion models will produce illegible small text if their VAE isn't good enough, and audio classifiers will be bottlenecked no matter how much data you feed them if everything gets turned into a low resolution, single STFT window mel spectrogram.\n\nShort of training a model on subatomic particles, you will always be injecting human knowledge into the model simply by choosing how you are preparing your data."}, {"id": 50642777, "au": "baalimago", "dom": 15, "sr": 6, "sc": 5.18, "ep": 5.18, "bs": 0.0, "d": 0, "age": 5.52, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 0, "k": 1295, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": ["https://i.ibb.co/21Z4mWV7/AI-doodles.png"], "ig": 1.184, "fa": 0.62, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "I took the liberty of adding the models to penelope.ink. So now when the model is transcribing, I get contextual doodles generated from past notes.\n\nLooks a little bit like this: https://i.ibb.co/21Z4mWV7/AI-doodles.png (coffee-cup, \"emai deliverabiliti was  ...\" etc.) Very fun! Thanks OP!"}, {"id": 50639607, "au": "cootsnuck", "dom": 45, "sr": 7, "sc": 5.05, "ep": 5.05, "bs": 0.0, "d": 2, "age": 12.57, "grav": 124.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 628, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.779, "fa": 0.95, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "The second sentence is \"The effort was 80% data, 15% speed and 5% architecture:\"... My eyes glaze over the second I hit the AI-isms.\n\nI don't get how other people can stand it."}, {"id": 50637942, "au": "Tadpole9181", "dom": 31, "sr": 8, "sc": 4.19, "ep": 4.33, "bs": 0.0, "d": 0, "age": 16.98, "grav": 200.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1911, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.977, "fa": 0.0, "gp": 1.404, "bl": 0.0, "ds": 0.0, "txt": "The project is impressive, but I've really wondered why so many of these types of blogs are Claudish. Just running it through another SOTA model or two, then reading yourself can clean things up. Compared to the work of the project itself, this seems comparatively painless, but is so often neglected."}, {"id": 50639847, "au": "andai", "dom": 50, "sr": 9, "sc": 4.08, "ep": 4.08, "bs": 0.0, "d": 0, "age": 11.99, "grav": 115.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": [], "ig": 1.249, "fa": 0.0, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "Wow. Don't forget to try the Draw mode, artificial doodles!\n\nIt can do penguins, pelicans (kinda), and bicycles, but pelican on bike makes it generate bizarre semi-abstract art. Looks like it doesn't know how to combine things together.\n\nThat's so cool, and a lot of fun to play with."}, {"id": 50638755, "au": "SebastianSosa", "dom": 51, "sr": 10, "sc": 3.92, "ep": 3.92, "bs": 0.0, "d": 0, "age": 14.97, "grav": 163.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 11, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 0.955, "bl": 0.0, "ds": 0.0, "txt": "This is amazing. I've been building a presentation model and will definitely be digging deep into this.\nI feel like graphical real-time presentation is an essential part of learning and transferring knowledge and it's completely missed by existing models."}, {"id": 50643195, "au": "macNchz", "dom": 22, "sr": 11, "sc": 3.61, "ep": 3.61, "bs": 0.0, "d": 1, "age": 4.83, "grav": 31.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 8111, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.274, "bl": 0.0, "ds": 0.0, "txt": "Not absolutely perfect, but the Gemma 4 series models do a pretty good job turning a page of disorganized scrawl and marginalia into structured notes, and are smart enough to correct words that transcribe badly based on context clues. Can also convert hand-drawn flowcharts into Mermaid syntax pretty effectively."}, {"id": 50642414, "au": "abbefaria27", "dom": 18, "sr": 12, "sc": 3.58, "ep": 3.58, "bs": 0.0, "d": 0, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 71, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": [], "ig": 1.269, "fa": 0.0, "gp": 0.411, "bl": 0.0, "ds": 0.0, "txt": "Looks very creative! It feels like there are lots of uses for transformers to be explored beyond text and images. Are we at the point yet where the average programmer Joe can play around with this stuff and make a small task-specific model with some python libraries? Or do you need to understand all the math? Still need to read the white paper so maybe it’s covered."}, {"id": 50641008, "au": "xlii", "dom": 12, "sr": 13, "sc": 3.38, "ep": 3.68, "bs": 0.0, "d": 1, "age": 8.97, "grav": 74.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3511, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "Love it. Too bad it doesn't handle non-Latin chars (tried the standard Polish \"Pchńąć w tę łódź jeża lub ośm skrzyń fig\" and it failed miserable).\n\nI think it'd be neat to have personal GPT learned on own handwriting. How much effort/training would be needed for that?"}, {"id": 50638149, "au": "gyomu", "dom": 38, "sr": 14, "sc": 3.05, "ep": 3.34, "bs": 0.0, "d": 2, "age": 16.53, "grav": 191.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5603, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Then you’re heavily miscalibrated, the whole page is replete with Claudisms (except for the conclusion)\n\n“Here are the rows I found most interesting; the paper has the rest.”\n\n“The drawing model blends but doesn’t bind.”\n\n“Cut the data and everything gets worse. Drop augmentation and the drawing model stops following its prompts entirely”"}, {"id": 50641687, "au": "vintermann", "dom": 5, "sr": 15, "sc": 2.9, "ep": 3.27, "bs": 0.0, "d": 4, "age": 7.31, "grav": 55.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.052, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's true. I think the big, big problem with OCR, and HTR in particular, is that people don't agree what a good solution is, and most of the answers have obvious \"featherless biped\" issues. There is for instance a relatively common opinion in HTR circles, which I can't for the life of me understand, that if the writer forgot to dot his i's and cross his t's, then that should be transcribed as (Turkish dotless i) and l. This is so ingrained that even the large general purpose multimodal LLM which are best at HTR (Gemini), a lot of the time ignore explicit instructions to not do that."}, {"id": 50638628, "au": "ex1fm3ta", "dom": 71, "sr": 16, "sc": 2.66, "ep": 3.1, "bs": 0.0, "d": 0, "age": 15.28, "grav": 168.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 54, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "Very nice congratulations. Long road since the first MNIST dataset. This project is useful for me since I am building an OCR model to properly parse hand written posologies. I already have all the data I needed, I could use this to generate synthetic data to strenghten my model."}, {"id": 50642859, "au": "vegadw", "dom": 19, "sr": 17, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 0, "age": 5.38, "grav": 36.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 664, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": [], "ig": 0.894, "fa": 0.0, "gp": 0.351, "bl": 0.0, "ds": 0.0, "txt": "Doing \"Detailed field guide drawing of a lion's mane mushroom\" and getting a horrifying mix of a lion and a mushroom was rather entertaining."}, {"id": 50639174, "au": "gfaure", "dom": 33, "sr": 18, "sc": 2.57, "ep": 3.01, "bs": 0.0, "d": 2, "age": 13.71, "grav": 142.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 775, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "The post text, yes, but the paper was almost entirely Claudish, which I found particularly hard to read in my search for implementation details."}, {"id": 50640151, "au": "komali2", "dom": 53, "sr": 19, "sc": 2.42, "ep": 3.08, "bs": 0.0, "d": 1, "age": 11.11, "grav": 102.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 17659, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.897, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For other latin alphabet languages I'd bet it would be mostly fine, at worst need a little bit of extra umlaut juice. But there's no way that latin cursive or print maps to Chinese characters, the strokes of which are distinct and named and any similarity with any of the strokes needed to form latin characters is incidental.\n\nThat said I bet you could train on handwriting that only includes like 10,000 characters and it could extrapolate from there to all characters because of the stroke > radical > character chain."}, {"id": 50638991, "au": "leobg", "dom": 48, "sr": 20, "sc": 2.38, "ep": 2.83, "bs": 0.0, "d": 3, "age": 14.34, "grav": 152.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 3681, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t get the complaints.\n\nYes, LLM text may indicate that an author who didn’t take the time to do the writing also didnt put much effort into the project itself. But that is, if anything, a rule of thumb, and it is proven wrong here by the results.\n\nIn my view, it’s much better that you spent your limited time on the building rather than on the writing. If yiu had waited for Christmas, who knows if you had posted it at all, with life and new ideas getting in the way. It’s better that it exists than it be certified Claude free, in my view.\n\nThank you for the post!"}, {"id": 50642903, "au": "eptcyka", "dom": 21, "sr": 21, "sc": 2.33, "ep": 2.48, "bs": 0.0, "d": 0, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 5432, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 0.83, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "I'd love a good local model that does the reverse - takes my scribbles and transcribes into legible text. Preferrably maintaining the intent."}, {"id": 50644815, "au": "nxtfari", "dom": 16, "sr": 22, "sc": 2.27, "ep": 2.49, "bs": 0.0, "d": 0, "age": 2.86, "grav": 17.2, "surf": 11.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 443, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": [], "ig": 0.96, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "I missed these types of early-model silliness, making it draw hybrid things and getting the old “salmon in river” type hallucinations, nostalgic."}, {"id": 50638376, "au": "mk12", "dom": 39, "sr": 23, "sc": 2.03, "ep": 2.47, "bs": 0.0, "d": 3, "age": 15.96, "grav": 181.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 492, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 0.873, "fa": 0.0, "gp": 0.288, "bl": 0.0, "ds": 0.0, "txt": "\"Everything else is a plain decoder that cross-attends to what it's told.\"\n\n(In Claudeland abstract concepts constantly \"say\" and \"tell\" things.)"}, {"id": 50640115, "au": "NitpickLawyer", "dom": 26, "sr": 24, "sc": 1.89, "ep": 2.77, "bs": 0.0, "d": 0, "age": 11.21, "grav": 104.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.74, "fa": 0.0, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "It's cool, and on the face of it looks impressive (there's a lot of diversity in styles) but I noticed a \"tell\" that once you see it, is really obvious. Lots of straight lines (Is, Ls, Fs, As, Ms, etc) have wobbles in them that look artificial. There's something about lines that this didn't capture correctly (or oversampled from someone with wobbly lines)."}, {"id": 50645520, "au": "samgreydanus", "dom": 36, "sr": 25, "sc": 1.85, "ep": 5.66, "bs": 3.37, "d": 3, "age": 1.85, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 3, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 1.369, "fa": 0.62, "gp": 0.464, "bl": 1.27, "ds": 0.0, "txt": "Thanks! Well people have limited attention and I think an author should generally earn the trust of their audience so that in the future they trust them enough to invest in doing a full read. That's why I'm trying to avoid Claudish in my posts.\n\nAnother part of me thinks: everything is moving so fast right now, one just has to get one's projects OUT in time, and also - pessimistically - 90% of readers of the post will be other people's AI's looking to help them reproduce the results XD\n\nMaybe I should start a blog with methods/technical details written by Claude and a (much shorter) human written section only with the most engaging prose - but much shorter."}, {"id": 50637944, "au": "tarpitt", "dom": 67, "sr": 26, "sc": 1.72, "ep": 1.86, "bs": 0.0, "d": 1, "age": 16.98, "grav": 199.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 249, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 0.381, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Imagine sending this program back in time to 2006 or something. It could probably run on a computer from back then. It's amazing how all of these advances are just software advances that could have been realized decades ago if we poked around the right places."}, {"id": 50638604, "au": "samgreydanus", "dom": 9, "sr": 27, "sc": 1.55, "ep": 5.61, "bs": 2.52, "d": 0, "age": 15.34, "grav": 170.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 3, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.453, "fa": 0.0, "gp": 1.513, "bl": 0.95, "ds": 0.0, "txt": "Author here! Given that I only trained these on an 8xH100 it's not exactly the most spectacular illustration of the Bitter Lesson. All I can say is that historically I always wanted to impress people with better model architectures or training techniques.\n\nThis time I just put all my energy into data. Agentic workflows + good open weight vision models + cheap multimodal AI APIs make data quality filtering / caption generation really smooth"}, {"id": 50638983, "au": "Aeroi", "dom": 64, "sr": 28, "sc": 1.52, "ep": 1.97, "bs": 0.0, "d": 0, "age": 14.36, "grav": 153.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 690, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fun_drawing", "flbl": "Fun & Drawing (Pelican)", "urls": [], "ig": 0.639, "fa": 0.0, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "this is so cool! the drawing feature is so fun for some reason, although I wish it was just ever so marginally better or smarter. its right there."}, {"id": 50642914, "au": "fredley", "dom": 60, "sr": 29, "sc": 1.41, "ep": 1.63, "bs": 0.0, "d": 0, "age": 5.27, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 12148, "kpp": 6.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.607, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "With the phrase \"minimum aluminium\" it's encouraging to see the model's output descend into illegibility in the same way my own handwriting does."}, {"id": 50638094, "au": "gyomu", "dom": 46, "sr": 30, "sc": 1.4, "ep": 2.06, "bs": 0.0, "d": 1, "age": 16.64, "grav": 193.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 5603, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 0.653, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Because people who make these things understand only a fraction of it, and are incapable of describing the details of what they did in their own words; so they resort to Claude for the write up too.\n\nIt truly is cringe inducing but a majority of people seem to not care much, given how widespread this is in blog posts/marketing copy/etc."}, {"id": 50637624, "au": "alanwreath", "dom": 55, "sr": 31, "sc": 1.16, "ep": 2.79, "bs": 1.19, "d": 0, "age": 17.72, "grav": 214.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1067, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.549, "fa": 0.0, "gp": 1.037, "bl": 0.45, "ds": 0.0, "txt": "Interesting, it doesn’t handle Spanish well at all (try Spanish “teach me”: enséñame), that said would be interesting to contribute to other languages."}, {"id": 50644954, "au": "Tadpole9181", "dom": 35, "sr": 32, "sc": 1.15, "ep": 1.81, "bs": 0.0, "d": 2, "age": 2.64, "grav": 15.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1911, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's no need to apologize! It's a free blog and you don't owe us anything. I'm appreciative you shared your project.\n\nI've just noticed this phenomenon and thought it's be a good point of conversation.\n\nHope you have a wonderful winter!"}, {"id": 50645477, "au": "samgreydanus", "dom": 27, "sr": 33, "sc": 0.93, "ep": 4.69, "bs": 2.52, "d": 1, "age": 1.89, "grav": 11.5, "surf": 8.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 3, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.585, "fa": 0.34, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Author here.\n\nUsing a less fine grid was huge for getting the compute time down (and thus the iteration / debugging time down - ultimately to about 5 minutes). This helped me try a lot of different things.\n\nFiner grid -> quite a lot more tokens per stroke -> more longer context -> more compute (increasing nonlinearly).\n\nSo I pushed it to the coarsest grid I could get away with. Light post-processing can actually remove the grid artifacts pretty easily, so that can be added if needed. In the future I'll probably just train my FINAL model on a slightly finer grid.\n\nThanks for the feedback"}, {"id": 50642053, "au": "thrance", "dom": 65, "sr": 34, "sc": 0.91, "ep": 1.57, "bs": 0.0, "d": 0, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3173, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.649, "fa": 0.0, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "I don't know how I should feel about the fact that pushing the \"neat/loose\" cursor all the way to \"loose\" still outputs something prettier than my own handwriting."}, {"id": 50646113, "au": "JALTU", "dom": 6, "sr": 35, "sc": 0.9, "ep": 2.29, "bs": 0.0, "d": 5, "age": 0.96, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 158, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I once wanted an image of a person up on people's shoulders with a large crowd around them and a cityscape in the background. Think: political gathering w/ people holding up the \"winner.\" Well, yes this is what I wanted but I did not want any flags or signs. Despite many repeated attempts telling the model \"no flags, no signs, of any kind\", every image had an American flag in it.\n\nMaybe they're better now... lol"}, {"id": 50638497, "au": "eli_gottlieb", "dom": 8, "sr": 36, "sc": 0.53, "ep": 2.07, "bs": 0.0, "d": 1, "age": 15.65, "grav": 175.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 9910, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.882, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So I'm guessing it's gonna take another major stock-market crash before anyone gives half a damn about learning from small data again?"}, {"id": 50644984, "au": "grey-area", "dom": 43, "sr": 37, "sc": 0.4, "ep": 2.13, "bs": 0.85, "d": 7, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 24936, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 0.908, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Yes it's just not very good at it, and uses it in the oddest places. How Claude came to value personification so much I have no idea! Perhaps they did some training on it to try to make it sound more human or have a warmer tone or something, but the end result is strangely machine-like in that it imputes agency to things like abstract nouns without reason. Almost like it's trying to persuade you that machines can be human too!"}, {"id": 50637658, "au": "jimbobbam", "dom": 62, "sr": 38, "sc": 0.27, "ep": 2.34, "bs": 1.19, "d": 0, "age": 17.64, "grav": 212.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 91, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.594, "fa": 0.0, "gp": 0.652, "bl": 0.45, "ds": 0.0, "txt": "Oh this is great! I’ve been working an app to teach handwriting with Rokid glasses. I’ll give it a shot"}, {"id": 50641115, "au": "vintermann", "dom": 3, "sr": 39, "sc": 0.17, "ep": 1.71, "bs": 0.0, "d": 2, "age": 8.75, "grav": 71.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 0.728, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's maybe more accurate to say more data beats clever heuristics. Because if you have a well-defined problem and an algorithm that just solves it, well, you don't need training data anymore.\n\nA whole lot of old ML algorithms (e.g. line detection algorithms in OCR) were really just clever heuristics."}, {"id": 50638967, "au": "lukan", "dom": 49, "sr": 40, "sc": 0.09, "ep": 1.19, "bs": 0.0, "d": 2, "age": 14.4, "grav": 153.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 8135, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "personification_claude", "flbl": "Personification & Claude (Cringe)", "urls": [], "ig": 0.507, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Because people who make these things understand only a fraction of it ... It truly is cringe inducing\"\n\nCringe to me are rather shallow dismissals of whole projects, while I never see anything amazingly humanly hand crafted from them (and given away for free)."}, {"id": 50638626, "au": "samgreydanus", "dom": 32, "sr": 41, "sc": -0.27, "ep": 3.13, "bs": 2.52, "d": 1, "age": 15.28, "grav": 168.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 3, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "text_code", "flbl": "Text & Code (Entirely)", "urls": [], "ig": 1.043, "fa": 0.0, "gp": 0.466, "bl": 0.95, "ds": 0.0, "txt": "Author here.\n\nThe post text (except the conclusion) was written entirely by Claude.\n\nAll my other posts are handwritten. I wish I had written it by hand, and I apologize for doing it this way. I did put a lot of effort into the code/dataset/ablations/figures.\n\nAll I can say is that I HAD to get this post up in time. Won't do it that way in the future (and might go back and rewrite in my style over Christmas break) :)"}, {"id": 50645705, "au": "disperso", "dom": 13, "sr": 42, "sc": -0.34, "ep": 3.71, "bs": 2.52, "d": 1, "age": 1.62, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 2, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "data_lines", "flbl": "Data & Lines (Model)", "urls": [], "ig": 1.58, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Congratulations on the results. I find this much, much cooler than the usual flashy influencer videos of late with the trite \"Opus built this\", \"I asked two models to create the same video game\", etc.\n\nI'm no ML researcher, but this kind of things is what I would love learning to make. I took a brief ML course a couple years ago, and best I did was a lame GAN that generated ugly \"A\"s from a bunch of fonts found in Google Fonts, and it was painful to build due to just using a CPU in a laptop."}, {"id": 50641235, "au": "TeMPOraL", "dom": 4, "sr": 43, "sc": -0.52, "ep": 1.29, "bs": 0.0, "d": 3, "age": 8.41, "grav": 67.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 116711, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "interesting_handle", "flbl": "Interesting & Handle (Project)", "urls": [], "ig": 0.548, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Except here we went from a pile of hacks (er, \"clever heuristics\") to... no algorithms at all? The transformer models really \"just solve it\", and the problem itself isn't even all that well-defined, at least not in a formal way."}, {"id": 50639205, "au": "gouterz", "dom": 54, "sr": 44, "sc": -0.54, "ep": 2.63, "bs": 2.52, "d": 0, "age": 13.6, " /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
