"Browser & Javascript (Demo)", "urls": ["https://github.com/okapia/titi"], "ig": 1.678, "fa": 2.42, "gp": 0.604, "bl": 0.0, "ds": 0.0, "txt": "I've made a couple of attempts at trying to get an asm.js or wasm build of zsh working in a browser as a way to put a demo on the zsh website.\n\nBut I'm more of a systems person with little clue about web tech so never got as far as something usable. The furthest I got involved rewriting some of the OS terminal support (https://github.com/okapia/titi) but there was still no working `fork()`. So no pipes, no job control, no subshells, no command substitutions and thus a fairly constrained experience. Nor did I have any zsh interface to JavaScript to enable a what would be needed for a tutorial. I tried wasix but never got anything to work with that. Never bothered trying a run the whole Linux kernel solution, seems rather overkill and your users get to watch 20 seconds of boot sequence as with the unkernel demo.\n\nWould love to have some help with this if anyone with more of a clue is willing. Or a few basic hints just to get a bit further."}, {"id": 50674967, "au": "logicallee", "dom": 46, "sr": 3, "sc": 9.78, "ep": 9.78, "bs": 0.0, "d": 1, "age": 11.2, "grav": 104.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 247, "qw": 0, "k": 3375, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "unkernel_cars", "flbl": "Unkernel & Cars (Linux)", "urls": ["https://news.ycombinator.com/item?id=50674542", "https://trynix.dev/", "https://news.ycombinator.com/item?id=50602937"], "ig": 1.641, "fa": 1.86, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "You could try running one of the other ones people posted. You can also try it in Firefox. Since Unkernel provides a Linux kernel and supports aarch64, one of the browsers should be able to run one of those, maybe one of the simpler ones. Here is the other comment in this thread: https://news.ycombinator.com/item?id=50674542\n\nanother one they didn't mention: https://trynix.dev/\n\nSince this thread is about Unkernel, you might be interested to know I got Doom running in it in realtime (with ascii graphics, but still):\n\nhttps://news.ycombinator.com/item?id=50602937\n\nNot saying that a modern browser is simpler than Doom, but still, I think you might be able to get one of those to load. Someone successfully ran Postgres, which is very large and complicated.\n\nEdit: nested, I was able to get as far as starting the smallest package I could find on trynix.dev, I just put in nano and then loaded the earliest version I could find. Here are the steps:\n\n1. on your own computer open a tab in Chrome or Firefox and go to unkernel.dev and wait for it to load.\n\n2. in the shell inside unkernel type:\n\n    chromium\n\nThis downloads and starts it within the Linux environment your tab is running!  It is very fast.\n\n3.  In the nested Chromium tab (inside unkernel.dev), go to trynix.dev and look for a very small package, for example nano and scroll down to an early version, select it and click boot.\n\nIt"}, {"id": 50675565, "au": "gregbell", "dom": 25, "sr": 4, "sc": 9.62, "ep": 9.62, "bs": 0.0, "d": 0, "age": 8.94, "grav": 74.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 41, "qw": 0, "k": 198, "kpp": 24.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "done_linux", "flbl": "Done & Linux (Cool)", "urls": ["https://news.ycombinator.com/item?id=50675517", "https://github.com/gregbell/unlab", "https://unlab.run"], "ig": 1.087, "fa": 2.08, "gp": 0.782, "bl": 0.0, "ds": 0.0, "txt": "Super fun and impressive project. I really love how fast it all starts up and the wayland compositor performance is crazy.\n\nIt got me excited enough to do this too https://news.ycombinator.com/item?id=50675517 (the hard part is all done by unkernel). Code at https://github.com/gregbell/unlab, running at https://unlab.run"}, {"id": 50676470, "au": "stevenhuang", "dom": 30, "sr": 5, "sc": 9.4, "ep": 9.4, "bs": 0.0, "d": 1, "age": 5.66, "grav": 39.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 86, "qw": 0, "k": 1437, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "unkernel_cars", "flbl": "Unkernel & Cars (Linux)", "urls": ["https://github.com/gbl08ma/waarm64"], "ig": 1.476, "fa": 2.08, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For USB passthrough checkout https://github.com/gbl08ma/waarm64\n\nIt was posted recently and is similar in idea to unkernel but it goes further in virtualizing the hardware (and thus can run unmodified Linux kernels). Raw CPU performance is better but it uses more resources.\n\nFor a very rough comparison I like to think of it as unkernel is more like docker (kernel doesn't matter, you just want to run an app) while waarm64 is more like a real VM.\n\nIt's just so cool seeing the different approaches made possible using wasm and LLMs."}, {"id": 50676229, "au": "MisterMunchkin", "dom": 90, "sr": 6, "sc": 7.41, "ep": 7.41, "bs": 0.0, "d": 0, "age": 6.56, "grav": 47.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1125, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": [], "ig": 1.437, "fa": 0.96, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "I tried turning this into a practical tool but it just doesn’t work, the emulation is so slow that it struggles to do anything meaningful.\n\nThe desktop isn’t a real desktop, it’s a JavaScript webapp. The “smooth desktop” is just a website pretending to be an operating system. That’s why it “loads” so quickly on mobile. Behind it is the web assembly kernel that’s capped at 4GB and runs at least 20x slower than the hardware in my benchmarks."}, {"id": 50676194, "au": "nasso_dev", "dom": 118, "sr": 7, "sc": 6.62, "ep": 6.62, "bs": 0.0, "d": 1, "age": 6.66, "grav": 48.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 165, "qw": 0, "k": 353, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": [], "ig": 1.723, "fa": 0.62, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "nothing is stopping you from drawing everything onto a canvas in your favorite language compiled to WASM today. but i think you underestimate how difficult cross-platform, accessible, responsive GUI is to implement.\n\nhonestly its hard to beat web technologies for making GUIs nowadays. there is a reason why they're so popular, even outside of web browsers. sure its not for everyone, but CSS is getting really good nowadays. and there is a ridiculous number of frameworks available, you're sure to find one that fits what you want\n\nHTML/CSS is an environment that works everywhere. your comment really feels like you're talking about the web circa 2015, things are much better nowadays\n\ni dont know what you're referring to by \"broken buggy web\"? anyone can make buggy apps in any environment. remember the web has no review process, anyone can publish anything, unlike apps on app stores for example, which get thoroughly reviewed before being published\n\nits okay to \"hate the web\", though, to each their own :3"}, {"id": 50674955, "au": "anilgulecha", "dom": 28, "sr": 8, "sc": 5.97, "ep": 6.11, "bs": 0.0, "d": 0, "age": 11.23, "grav": 104.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 3041, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_windows", "flbl": "Software & Windows (Place)", "urls": [], "ig": 1.643, "fa": 0.0, "gp": 1.553, "bl": 0.0, "ds": 0.0, "txt": "if @fzakaria // pooya are taking requests - a good usecase would be to enable windows programs in the browser (connect webUSB are we're golden for a long tail of various devices software).\n\nSo essentially open browser - drop installer exe, and it saved on the local disk. and next time you open the tab, you continue the program with it's data.\n\n(Last time I made a request, it was vibed in a day!)"}, {"id": 50675989, "au": "jonenst", "dom": 119, "sr": 9, "sc": 5.55, "ep": 5.55, "bs": 0.0, "d": 0, "age": 7.37, "grav": 56.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 346, "qw": 0, "k": 118, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "done_linux", "flbl": "Done & Linux (Cool)", "urls": [], "ig": 2.115, "fa": 0.0, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "From first contact in the README, the LLM-speak is strong with this one. 25 uses of the cool kid \"X, so Y\" assertive idiom.\n\nObviously lots of other great things to say about this project, but I feel this kind of introduction is seriously off putting. It's a general problem but I hope that it can change in the future (or more realistically that I manage to get used to it...)\n\nI was going to cite only the worst offenders but almost all of them are terrible so here's the almost full list (slightly edited to make the idiom stand out):\n\n\"The kernel is compiled code, so programs get Linux's behavior\"\n\n\"unmodified aarch64 Linux binaries, so packages run as they are.\"\n\n\"ARMv8.0-A with FP, so distribution binaries run unchanged\"\n\n\"aarch64 is a first-class port, so their package archives are available.\"\n\n\"The SDK is MIT-licensed, so you can ship it.\"\n\n\"The wallpaper is a random photo, so the page fetches one on every load\" (in my mind this one is the worst)\n\n\"Browsers can't open raw TCP sockets, so the page reaches the internet through a Wisp proxy.\"\n\n\"kwemu walks the kernel's own page tables, so memory management is done by the real Linux code.\"\n\n\"Task switches use JSPI, so the kernel gets real stacks.\"\n\n\"Any object can carry the guest's TCP and DNS, so you can write your own backend.\"\n\n\"vm.connect(port) reaches a TCP server, so it needs no network\"\n\n\"the host name only goes into the H"}, {"id": 50675669, "au": "rvz", "dom": 81, "sr": 10, "sc": 5.38, "ep": 5.38, "bs": 0.0, "d": 1, "age": 8.52, "grav": 69.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 27, "k": 10592, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": [], "ig": 1.5, "fa": 0.42, "gp": 0.456, "bl": 0.0, "ds": 0.0, "txt": "> Browser in the new OS.\n\nI hope you did not mean \"Browser is the new OS\" as that does not make any sense anyway.\n\n> Everything that can be written on top of JS/WASM will be written in browser, that includes OS, and the browsers themselves.\n\nBut should it?\n\nWhy do we assume that there is some \"guarantee\" of running something like the Linux Kernel in the browser means that it is \"isolated\" or even \"sandboxed\" (which we know it isn't) when we are a couple of Pwn2Own CTFs + frontier AI agents away from finding that out?\n\nWe are not in the era of humans finding / writing exploits for bugs, which this might have been a high bar for humans, but it is certainly not for swarms of frontier agents.\n\nJS is bad enough to being abused by attackers against the (memory unsafe) browser engines running it. So I cringe from a security standpoint at this when everyone is believing that the next shiny object (WASM) is going to give some guarantee of isolation when it is untested against abliterated AI agents."}, {"id": 50675681, "au": "rvz", "dom": 86, "sr": 11, "sc": 5.31, "ep": 5.31, "bs": 0.0, "d": 1, "age": 8.48, "grav": 68.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 36, "qw": 0, "k": 10592, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": ["https://news.ycombinator.com/item?id=50533945"], "ig": 0.834, "fa": 0.96, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "Yes it was, 5 days ago. [0]\n\nThere is an increase in upvote rings on HN posts these days, to game the algorithm and then post the same thing repeatedly with bots until it reaches the front page.\n\n[0] https://news.ycombinator.com/item?id=50533945"}, {"id": 50676115, "au": "pmkary", "dom": 115, "sr": 12, "sc": 5.09, "ep": 5.24, "bs": 0.0, "d": 0, "age": 6.93, "grav": 51.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 700, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": [], "ig": 1.72, "fa": 0.0, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "I really want to see the day where you can run WASM on the web and have complete access to the viewpoint and gpu, so no JS and dom and layout engine and html and css in front of you. Then the world could be amazing. I really really want to code in a sane environment that works everywhere. I hate the broken buggy web with all of its CSS nightmare, page not getting loaded completely, things breaking, everything being a hack... I want a clean boring language with little to no contradiction like Dart and Go where things almost always have around one way to be done. A simple system like Flutter, and the solidity of the normal UI kit where things don't fly, 1px means 1px, components are isolated by default... man I hate web..."}, {"id": 50675324, "au": "red_hare", "dom": 7, "sr": 13, "sc": 4.91, "ep": 5.13, "bs": 0.0, "d": 0, "age": 9.77, "grav": 84.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 27, "qw": 0, "k": 656, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": ["https://www.destroyallsoftware.com/talks/the-birth-and-death-of-javascript"], "ig": 0.973, "fa": 0.34, "gp": 1.29, "bl": 0.0, "ds": 0.0, "txt": "Huh. This was, more or less, wholly predicted by Gary Bernhardt's 2014 Pycon talk: \"The Birth and Death of JavaScript\" (which is, if you haven't seen it, hilarious)\n\nhttps://www.destroyallsoftware.com/talks/the-birth-and-death..."}, {"id": 50676611, "au": "aktenlage", "dom": 123, "sr": 14, "sc": 4.83, "ep": 5.83, "bs": 0.85, "d": 3, "age": 5.12, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 411, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "software_windows", "flbl": "Software & Windows (Place)", "urls": [], "ig": 1.652, "fa": 0.34, "gp": 0.672, "bl": 0.32, "ds": 0.0, "txt": "You are annoyed that developers of a free (here GPL+MIT) software, despite whipping up a great project, didn't generate a pleasantly readable documentation. I find your sentiment totally understandable, and wish it was otherwise, too. On the other hand, posting such an elaborate complaint here, with a list of cites strikes me as entitled critique. With it, you place the burden on the developer.\nMeanwhile - if you are actually curious - you could use an LLM yourself, to rewrite it to whatever style you like without effort (except prompting it to use the style you want to have) to greatly reduce 95% of what you are complaining about."}, {"id": 50674468, "au": "dqh", "dom": 44, "sr": 15, "sc": 4.76, "ep": 4.91, "bs": 0.0, "d": 0, "age": 12.69, "grav": 126.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 192, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "unkernel_cars", "flbl": "Unkernel & Cars (Linux)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Had some fun testing the concurrency. Was able to execute 4 concurrent md5sums with the same wall clock duration as a single process. Then tested installing Chromium and trying to run a nested Unkernel within that, which didn't work.\n\nAmazing. What a strange era we are entering."}, {"id": 50676238, "au": "Haunt1000", "dom": 83, "sr": 16, "sc": 4.67, "ep": 4.67, "bs": 0.0, "d": 0, "age": 6.54, "grav": 47.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 15, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.643, "bl": 0.0, "ds": 0.0, "txt": "This is pretty amazing. I really like the AI integrations with fx and smaller models -- not necessarily useful but fun.\n\nNote that the Qwen-3.5-0.8b model has issues with fx sending multiple messages a round to llama.cpp (which is behind Ollama), but you can substitute Pi agent quite easily and it works well."}, {"id": 50676269, "au": "QuantumNomad_", "dom": 58, "sr": 17, "sc": 4.61, "ep": 5.05, "bs": 0.0, "d": 1, "age": 6.42, "grav": 46.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": [], "ig": 1.466, "fa": 0.34, "gp": 0.44, "bl": 0.0, "ds": 0.0, "txt": "I was a little bit on the fence about iOS 27, and the whole Liquid Glass thing. But these days there are so many vulnerabilities and exploits found all the time by LLMs, it’s even more important now to stay up to date with security updates and quickly even though I was always taking it seriously and regularly installing security updates.\n\nAt the moment, iOS 18 is still also receiving security updates, so you don’t have to go iOS 27 quite yet. But I’m not sure for how long that will continue so I think it’s better to just install iOS 27 if your device supports it. Instead of suddenly being still on iOS 18 and not realizing that the security updates have stopped coming.\n\nLiquid Glass isn’t all that bad. I don’t think it was much point in adding it, but I don’t think it’s doing any harm either really."}, {"id": 50674706, "au": "DonHopkins", "dom": 108, "sr": 18, "sc": 4.3, "ep": 8.54, "bs": 3.58, "d": 0, "age": 12.02, "grav": 115.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 1, "w": 74, "qw": 0, "k": 25729, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": ["https://news.ycombinator.com/item?id=50673082", "https://hyperties.org/machine/games/zork/", "https://www.youtube.com/watch?v=dYYwzfPWJWE"], "ig": 1.573, "fa": 1.3, "gp": 0.783, "bl": 1.35, "ds": 0.0, "txt": "https://news.ycombinator.com/item?id=50673082\n\nHappy 60th Birthday to PDP-10, running ITS and Zork\n\nhttps://hyperties.org/machine/games/zork/\n\nMachine Room is a browser based emulator with a Korz based JIT. To celebrate the PDP-10's 60th birthday here's a PDP-10 running ITS with ZORK, MACSYMA, MACLISP, and lots of other software. Here's a demo of the PDP-10 emulator running ZORK on ITS, Apple ][ emulator running Little Computer People, and PDP-7 emulator running Unix.\n\nVideo demo of Zork on PDP-10 and Apple ][, including free Korz 6502 and PDP-7 JIT demos:\n\nhttps://www.youtube.com/watch?v=dYYwzfPWJWE"}, {"id": 50675613, "au": "teawhoyou", "dom": 59, "sr": 19, "sc": 4.27, "ep": 4.27, "bs": 0.0, "d": 0, "age": 8.72, "grav": 71.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 42, "kpp": 21.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_windows", "flbl": "Software & Windows (Place)", "urls": [], "ig": 1.034, "fa": 0.0, "gp": 1.267, "bl": 0.0, "ds": 0.0, "txt": "What is the purpose of this? Does it solve an existing problem or open up new possibilities? I’m genuinely asking, with zero negativity intended.\n\nThanks!"}, {"id": 50677224, "au": "localhostinger", "dom": 52, "sr": 20, "sc": 4.15, "ep": 4.37, "bs": 0.0, "d": 0, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 21, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, e": 0, "tier": "crowd_chatter", "facet": "done_linux", "flbl": "Done & Linux (Cool)", "urls": [], "ig": 0.741, "fa": 0.0, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "Half of me thinks this is amazing, the other half is wondering what we'll end up running in browser tabs in five years"}, {"id": 50676503, "au": "pjmlp", "dom": 24, "sr": 24, "sc": 3.1, "ep": 3.69, "bs": 0.0, "d": 2, "age": 5.53, "grav": 37.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 134516, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": [], "ig": 1.158, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Bytecode as the UNCOL (1958) vision ultimately won, given how many platforms use some form of intermediate language representation for portability.\n\nJava, Android, IBM i, .NET, Clearcase MCP, BASIC Stamp, Parallax Spin, Python, Ruby, OCaml bytecode, LLVM IR, GCC Gimple,..., and naturally WebAssembly."}, {"id": 50675479, "au": "Imustaskforhelp", "dom": 31, "sr": 25, "sc": 3.07, "ep": 3.58, "bs": 0.0, "d": 1, "age": 9.25, "grav": 78.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 234, "qw": 0, "k": 2888, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_windows", "flbl": "Software & Windows (Place)", "urls": [], "ig": 1.523, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "+1 for this if it can effectively work but I'd recommend 2 different things.\n\n1.) Whether its through wine emulation where although there is some parity, one can say that there can be software which can detect that it's running in a wine.\n\n2.) Somehow emulating it on a more deeper level. Like, my use case for this (especially with what you mention of webusb) is sort of that I had a redmi phone which I wanted to root but I genuinely couldn't because it required me to have windows and I tried so many things but it really really failed to work as within the vm's it didn't detect my phone for some reason.\n\nI just didn't want to install windows on my main pc which btw is so time consuming to download and then setup only for this use case. I am far away from windows and I tried almost everything in some sense to make it work but I just straight up couldn't make it work.\n\nAll I wanted was a place where I can just root the phone because it was a bloated piece of software and I wanted something faster in my daily life.\n\nAnd I imagine that something similar might be happening for printers and other devices where windows are still used as well.\n\nFzakaria has been on a grind lately, so lets hope he builds something which can fix this issue as well! Browser is also just the perfect target for sort of this ephemeral sandbox type of thing imo."}, {"id": 50677542, "au": "brap", "dom": 67, "sr": 26, "sc": 2.97, "ep": 3.85, "bs": 0.0, "d": 1, "age": 2.9, "grav": 17.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 3525, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "browser_javascript", "flbl": "Browser & Javascript (Demo)", "urls": [], "ig": 1.199, "fa": 0.28, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Plenty of operating systems can’t run Firecracker natively, this runs on any OS with a modern browser.\n\nFor instance the fact that I can just play with python/npm packages on my iPhone without requiring any backend… pretty cool."}, {"id": 50675059, "au": "behnamoh", "dom": 113, "sr": 27, "sc": 2.86, "ep": 3.08, "bs": 0.0, "d": 0, "age": 10.89, "grav": 99.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 23725, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "done_linux", "flbl": "Done & Linux (Cool)", "urls": [], "ig": 0.773, "fa": 0.34, "gp": 0.201, "bl": 0.0, "ds": 0.0, "txt": "CRAZY! What is this sorcery? I'm just baffled at how buttery smooth this is. \nYou know what it tells me? macOS is so fucking bloated that a Linux on WebAssembly in a fucking browser with 2GB RAM runs better than the host macOS where the browser is running."}, {"id": 50675876, "au": "shevy-java", "dom": 107, "sr": 28, "sc": 2.8, "ep": 3.46, "bs": 0.0, "d": 0, "age": 7.77, "grav": 60.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 2061, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "web_language", "flbl": "Web & Language (Works)", "urls": [], "ig": 1.386, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Boots much faster than systemd-linux!\n\nThe UI is a bit clunky though. It seems as if\nthese ideas, as great as they are, often begin\nto fall down quickly after the demo-init stage.\n\nWould be cool if someone could extend this and\nput down all interactive shells in it. Many years\nago, _why (in ruby) put down the first irb on the\nweb. I think we need this for all programming\nlanguages. Kind of make a universal terminal via\nthe browser."}, {"id": 50676485, "au": "pjmlp", "dom": 9, "sr": 29, "sc": 2.71, "ep": 3.0, "bs": 0.0, "d": 1, "age": 5.61, "grav": 38.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 134516, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "unkernel_cars", "flbl": "Unkernel & Cars (Linux)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "Once upon a time we had mostly mainframes running various bytecode formats, with interpreters running on microded CPUs, Burroughs and BESYS are two well known examples for how far back it goes."}, {"id": 50675292, "au": "dreambigwrkhard", "dom": 94, "sr": 30, "sc": 2.48, "ep": 2.92, "bs": 0.0, "d": 0, "age": 9.9, "grav": 86.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 61, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "done_linux", "flbl": "Do (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
