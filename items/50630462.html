jetty", "dock", "mac", "pro", "macos", "app", "thought", "simple", "project", "today", "features", "developers", "support", "apps", "users", "sold", "feature", "create"], "largest_root": {"root_id": 50633515, "author": "geonic", "slots": 20, "start_dom": 19, "end_dom": 38, "share_pct": 15.4, "top_dom1_age": 10.9, "top_dom1_author": "Fraterkes"}, "buried_cutoff": 39, "rescue_top_k": 26, "ablations": [], "tournament": [], "comments": [{"id": 50633350, "au": "probably_wrong", "dom": 50, "sr": 1, "sc": 8.52, "ep": 8.52, "bs": 0.0, "d": 4, "age": 8.55, "grav": 69.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.297, "fa": 1.23, "gp": 1.356, "bl": 0.0, "ds": 0.0, "txt": "The other comments already focused on the cognitive aspect, so I'd like to focus on the economics itself.\n\nIf $15 (per your example) is a fair price for the app, then why is it priced $1/year instead? There may be many reasons for this decision but, in practice, it's because the app creators think they can get more than $15 from me this way. Even if they said \"we'll get $15 on average\" that means they are counting on some users to pay $20, $30, or even $70.\n\nSo far companies have done so by counting on me to forget (my gym), rising prices (Netflix), introducing an ad tier (Netflix again), selling my data (*waves hand in a circle*), removing functionality (my VPN), or all of the above. I therefore think the onus is on them to explain why it's a subscription and not on me to say \"well, if it's only $1...\""}, {"id": 50636547, "au": "qlte", "dom": 28, "sr": 2, "sc": 7.91, "ep": 7.91, "bs": 0.0, "d": 4, "age": 4.31, "grav": 27.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 252, "qw": 0, "k": 1197, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.694, "fa": 0.95, "gp": 0.842, "bl": 0.0, "ds": 0.0, "txt": "I've been creating plenty of one-off apps but I feel like some people are still in the honeymoon period and/or downplaying the maintenance burden even when software development is 100% hands off/vibecoded.\n\nIt's starting to take effort just to remember all the tools I've created/what they do. No problem, just have the agent document it! Well, now I have dozens of pages of verbose docs I have to read through, or direct an agent to do it for me which still requires me to think through what I did last time/trying to do now.\n\nOr for a specific Android app I forked to add e-ink friendly features to better support my device. I needed to add some new views/settings and automated the entire dev/validation loop using ADB so it can do everything itself.\n\nBut even though I mostly have an idea of how I want things to work, I'm already getting exhausted having to tweak/refine little things to get to the point I can daily drive it. The problem isn't that it's missing something in testing, but a disconnect between instructions/execution and overall \"taste\".\n\nIt's really fun being able to ask for something and churn out an app that's 95% there. But the last 5% polish/refinement still needs me to use it and decide what needs to be changed, which is much less fun when I just want a finished tool I can use. I'd love if I could offload all that thinking and decision making to another dev with simi"}, {"id": 50632767, "au": "wlesieutre", "dom": 66, "sr": 3, "sc": 7.86, "ep": 7.86, "bs": 0.0, "d": 4, "age": 9.22, "grav": 77.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 0, "k": 25556, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.446, "fa": 0.95, "gp": 1.207, "bl": 0.0, "ds": 0.0, "txt": "I do at least appreciate that the price isn't totally out of line with what a purchase might be. A lot of stuff changing to subscription seems to consider $5/month as the price floor, when as a standalone app it'd be more like $30 or $40 one time, so now you're paying more for one year than you used to pay for a permanent license.\n\nIn the \"dock replacement\" landscape, $10/year is in the same ballpark as Ubar's $40 license and $20 upgrade. Ubar likely cheaper in the long run (it doesn't have a major release every two years) but Jetty isn't crazy in comparison.\n\nI bought Ubar once upon a time and would've been in the target market for this, but I've since moved on to \"hide the dock use keyboard launchers\" so maybe I'm not anymore."}, {"id": 50636282, "au": "probably_wrong", "dom": 52, "sr": 4, "sc": 7.5, "ep": 7.65, "bs": 0.0, "d": 6, "age": 4.77, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 8, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.566, "fa": 0.76, "gp": 1.245, "bl": 0.0, "ds": 0.0, "txt": "I'm fine with an app that doesn't update. I use plenty of those everyday: my windows manager, my terminal, my text editor, my coding editor, my image editor, all of those are at least three years old and work just fine.\n\nThe only major piece of software that broke recently is OSMC (my media center), and that's because Netflix (a subscription service) changed its API and my client stopped working.\n\n> Yours and the developer's interests are more aligned.\n\nCounter-point: I paid Spotify regularly until I didn't, and then I had to re-acquire all the music I had in my playlists. The same happened with Netflix. My interest in having software and media that works 1, 5, or 10 years from now is not aligned with the interest of subscription services of keeping me as a customer, because they may choose to punish me (within their means) if I stop doing so."}, {"id": 50634118, "au": "matwood", "dom": 51, "sr": 5, "sc": 6.89, "ep": 7.18, "bs": 0.0, "d": 5, "age": 7.82, "grav": 61.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 15, "k": 21237, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 1.167, "fa": 1.1, "gp": 0.9, "bl": 0.0, "ds": 0.0, "txt": "> it's because the app creators think they can get more than $15 from me this way\n\nMaybe not you personally, but overall they may get more money. But, more importantly it also sends a signal to the developer to keep the application updated. Yours and the developer's interests are more aligned.\n\nWould you rather pay $15 and possibly never see an update or pay $15 every year to cover the inevitably required updates with an application such as this?"}, {"id": 50635548, "au": "wingworks", "dom": 35, "sr": 6, "sc": 6.85, "ep": 7.0, "bs": 0.0, "d": 1, "age": 5.92, "grav": 41.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 776, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.666, "fa": 0.95, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "Daamn, I've been doing the exact same things. Tired of all the 500MB+ basic apps.\n\nMost recently I've re-created iina (mac vid player), IINA used ~1.5GB playing 4k vid, my vibed player does the same with ~350mb.\n\nI did the same with the Remote Buddy app (I paid for), my vibbed app now actually works with my siri remote every single time without fail (Remote Buddy was pretty buggy for me, constantly needing restarts or lose connection to the remote).\n\nIt is pretty nice to no longer need to beg/prey and wait years for a feature you'd like."}, {"id": 50631620, "au": "cfiggers", "dom": 125, "sr": 7, "sc": 6.36, "ep": 6.36, "bs": 0.0, "d": 1, "age": 10.47, "grav": 93.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 0, "k": 1053, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.528, "fa": 0.56, "gp": 0.808, "bl": 0.0, "ds": 0.0, "txt": "0) I'm going to presume you are objecting to the recurring subscription and not to the app being paid in the first place. Thinking that the app is obliged to be free for one reason or other is just a non-starter of a position, so I'm not going to waste time addressing it.\n\n1) The risk of Apple breaking stuff wouldn't be mitigated by a one-time purchase. If they break something, they break something. Payment model changes nothing about that.\n\n2) Doesn't risk of breaking change from Apple's side make a subscription model make more sense, not less? If a feature you want is no longer possible, you can just stop paying the subscription. If it was a one-time purchase, you'd either be out your money or have to receive a refund—and how exactly do we decide how much of the value of your original purchase was delivered between when you bought it and when that feature disappeared? Should the dev go hungry retroactively because a feature that you valued lasted some amount of time but not forever?\n\nA recurring (and therefore cancel-able) Subscription is the lower-risk and more equitable model for such a scenario on both sides, IMHO."}, {"id": 50633694, "au": "jpeeler", "dom": 85, "sr": 8, "sc": 6.17, "ep": 6.17, "bs": 0.0, "d": 0, "age": 8.24, "grav": 65.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 56, "qw": 0, "k": 406, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": ["https://docklockpro.com"], "ig": 1.282, "fa": 0.62, "gp": 0.955, "bl": 0.0, "ds": 0.0, "txt": "If this fixes the behavior of the dock switching monitors automatically by having the mouse press too far down at the bottom of a window, I'd seriously consider buying it just for that to stop plaguing me. No I don't want to autohide nor disable separate spaces. \nWhile researching before I post it seems this may actually be want I want: https://docklockpro.com."}, {"id": 50632141, "au": "__float", "dom": 126, "sr": 9, "sc": 6.09, "ep": 6.23, "bs": 0.0, "d": 2, "age": 9.88, "grav": 86.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1190, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.495, "fa": 0.62, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "1. This is always how software has worked. Sometimes you buy a new major version for support in a new major OS release. That doesn't require a subscription.\n\n2. No. Not everyone is on the latest macOS release ASAP.\n\nHow much active development are you doing day-to-day? It sounds like you're arguing the subscription is required for ongoing compatibility, but what if Apple doesn't change these APIs for 10 years? You sit back and collect it _just in case_ they do?\n\nThe \"everything must be a subscription\" trend is incredibly unpopular, and you're never going to have enough FAQ entries to justify it."}, {"id": 50631104, "au": "0gs", "dom": 96, "sr": 10, "sc": 5.96, "ep": 5.96, "bs": 0.0, "d": 0, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 126, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.326, "fa": 0.68, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "a fascinating pitch. i would absolutely buy it if it was a one-time purchase; i cannot imagine needing \"private apis\" to put extra shortcut holders around my screen. you may want to consider a lite version! i'd probably pay $40 or $50 one time, but not willing to commit myself to a yearly v-dongle vig."}, {"id": 50634159, "au": "kccqzy", "dom": 23, "sr": 11, "sc": 5.47, "ep": 5.77, "bs": 0.0, "d": 1, "age": 7.79, "grav": 60.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 20062, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 1.822, "fa": 0.0, "gp": 1.024, "bl": 0.0, "ds": 0.0, "txt": "Same here. A few weeks ago I finally replaced the barebones QuickTime Player app for playing videos. It uses the same AVFoundation APIs, but adds a sidebar for multi-file playback, does not auto-hide the scrubber, does not auto-hide the title bar, changes many of the keyboard shortcuts especially arrow keys, etc. It’s such a simple task for Claude that I literally spent less time waiting for Claude than carefully thinking about exactly how my ideal UI looks like and feels like.\n\nAt this point, skimming the thousands of lines of Claude-written Swift gives me a higher sense of trust than reading the marketing page of a random third-party app developer."}, {"id": 50631292, "au": "Fraterkes", "dom": 1, "sr": 12, "sc": 5.33, "ep": 5.33, "bs": 0.0, "d": 0, "age": 10.89, "grav": 99.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 2758, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 1.351, "fa": 0.0, "gp": 1.486, "bl": 0.0, "ds": 0.0, "txt": "I think a simple way to fix the inevitable complaints about subscriptions is to allow people to keep the version of Jetty that they owned at the moment their subscription lapsed.\n\nThat way you only have to pay whenever a new Mac version introduced changes that require the developer to put in work to update the app. (I realize that monitoring private api changes is a kind of constant work even when an update isn’t required, but that’s imo a tradeoff with selling something like this)."}, {"id": 50635470, "au": "jt2190", "dom": 54, "sr": 13, "sc": 5.02, "ep": 5.47, "bs": 0.0, "d": 7, "age": 6.03, "grav": 42.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 4770, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 0.774, "fa": 0.95, "gp": 0.647, "bl": 0.0, "ds": 0.0, "txt": "But there are no $10 future updates in this scenario, just a one-time $15.\n\nWe could model your scenario but I don’t think a discount on major updates makes sense, since probably the value gets greater over time, but we could just call it $15 today, and an inflation-adjusted $15 every so often in the future."}, {"id": 50635266, "au": "pchristensen", "dom": 62, "sr": 14, "sc": 4.93, "ep": 5.29, "bs": 0.0, "d": 1, "age": 6.3, "grav": 45.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 0, "k": 13675, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": ["https://atp.fm/719"], "ig": 1.081, "fa": 0.62, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "On ATP, Siracusa describes the work he put into solving difficult problems of dealing with the access limitations of the macOS APIs. It is far from being a one-shot away. https://atp.fm/719"}, {"id": 50634530, "au": "austinthetaco", "dom": 7, "sr": 15, "sc": 4.84, "ep": 4.99, "bs": 0.0, "d": 2, "age": 7.28, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 136, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.309, "fa": 0.56, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "i think it really depends on the use of the software and the attack surfaces. Like if the app is one you could use offline and doesnt heartbeat back to the servers except for license checks or whatever, then realistically what security are you concerned about? People are STILL using photoshop cs6 and there have been two \"major vulnerabilities\" in the past 25 years and neither of them matter that much unless someone was hands on with your machine or talked you into installing untrusted plugins."}, {"id": 50633515, "au": "geonic", "dom": 19, "sr": 16, "sc": 4.74, "ep": 5.18, "bs": 0.0, "d": 0, "age": 8.39, "grav": 67.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 89, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.486, "fa": 0.0, "gp": 1.164, "bl": 0.0, "ds": 0.0, "txt": "I found this interesting to read because a few weeks ago I started to replace different applications with vibe coded native Mac apps that do exactly what I want in a way that I want. They replaced applications that kind of did what I wanted but were not customizable enough or just too heavy or klunky. I’ve had Claude built them with performance in mind and a tiny memory footprint.\n\nIf you have even the slightest idea about application development and the capabilities of GPT Codex or Claude code, this is the future for a lot of people."}, {"id": 50633614, "au": "mdasen", "dom": 4, "sr": 17, "sc": 4.62, "ep": 4.92, "bs": 0.0, "d": 1, "age": 8.29, "grav": 66.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 16658, "kpp": 8.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 1.467, "fa": 0.0, "gp": 1.013, "bl": 0.0, "ds": 0.0, "txt": "Is that truly an option now with most software? If I'm running a JetBrains IDE from a year ago, that's going to have unpatched security vulnerabilities.\n\nMaybe this is niche enough that it won't matter or small enough that there isn't a lot of attack surface, but it's more \"you only have to pay when a new Mac version introduces changes -OR- the developer fixes a security issue.\" Yes, maybe the dev could back port security patches, but that adds more unpaid work for them.\n\nI think perpetual fallback licenses are a good concept, but I think in reality it's a lot harder for that to be viable."}, {"id": 50633542, "au": "the_lucifer", "dom": 121, "sr": 18, "sc": 4.6, "ep": 7.65, "bs": 3.05, "d": 3, "age": 8.36, "grav": 67.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 192, "qw": 26, "k": 201, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": ["https://wiki.archlinux.org/title/Cursor_themes"], "ig": 1.964, "fa": 0.62, "gp": 0.872, "bl": 1.15, "ds": 0.0, "txt": "> Linux may put up a fight by just having far more devs working on software for it, which increases the odds of someone getting it just right.\n\nIdeally but realistically no, because these pieces of software end up in a \"too many cooks\" situation. Good UX requires a heavy hand from the top and a singular vision. Which... is hard, very hard. There's very few exceptions like Blender for one where they embody this and they need laser focus to achieve this.\n\nAdd the fragmented UX paradigms and WM fuckery on top, you end up with a hodge-podge of software that looks and feels wildly different. (Like how some applications use a weirdly low resolution cursor or a different cursor on Linux because different windowing systems, UI Toolkits use different cursors like wtf? [1]).\n\nOr for any UX bugs fingers get pointed at the WM instead: \"Yeah no wonder you saw X. Your WM is shit, everyone uses Y these days\". Bad UX and OSS go hand in hand on Linux primarily because of this. It's developers adding features that developers want without the Marie Kondo-esque \"does this feature really bring joy/utility\" or if it should be prioritized or not paired with a Linux design tooling failure that makes it an uphill task to get working and looking nice.\n\n(And I don't even want to speak about Windows here.)\n\n[1]: https://wiki.archlinux.org/title/Cursor_themes"}, {"id": 50636577, "au": "yurishimo", "dom": 90, "sr": 19, "sc": 4.59, "ep": 5.03, "bs": 0.0, "d": 1, "age": 4.25, "grav": 27.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 2584, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.465, "fa": 0.34, "gp": 0.429, "bl": 0.0, "ds": 0.0, "txt": "He said on a podcast (and perhaps on the product website but I haven’t looked super closely) that he is going the subscription route because to maintain a app like this when Apple inevitably decides to change all of the APIs he is using, will be a royal PITA. If people want to use it long term, this was his way to signal to them the commitment they are making and also gives him some skin in the game to keep it updated.\n\nIt really is a full Dock replacement (with Handoff support even) so there’s a lot more under the hood that isn’t evident from a glance at the screenshots or marketing homepage.\n\n$10/year seems like a fair price to be honest, especially when his target market is mostly his podcast audience of other developers who may have the technical knowledge to build the same thing but can’t be bothered to sweat the details and maintain it, even if our new-fangled age of LLMs."}, {"id": 50636963, "au": "titzer", "dom": 36, "sr": 20, "sc": 4.55, "ep": 4.99, "bs": 0.0, "d": 1, "age": 3.45, "grav": 21.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 20452, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.51, "fa": 0.34, "gp": 0.326, "bl": 0.0, "ds": 0.0, "txt": "Heck yeah. In the early part of the year I had Claude build a real-time audio spectrograph app for me with exactly the limited set of features I wanted. It replaced the crappy CPython thing I had found that was customizable in all the wrong ways.\n\nThe new app runs fast, it has native MacOS acceleration, it's only 121KB, and it has a pretty icon. And I don't have to take feature requests or file bugs with someone.\n\nAt least this part of the vibe-coding future is pretty cool."}, {"id": 50631597, "au": "tapoxi", "dom": 117, "sr": 21, "sc": 4.12, "ep": 4.26, "bs": 0.0, "d": 0, "age": 10.51, "grav": 94.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 6469, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.451, "fa": 0.0, "gp": 0.587, "bl": 0.0, "ds": 0.0, "txt": "I really don't understand the whole Mac developer culture around shareware apps that require a purchase (only works for 1-2 versions) or a subscription.\n\nOn Linux its expected that if the software you use somehow doesn't support it (it seems KDE Plasma has every possible configuration these days) you can open a PR or find an alternative that someone open sourced and released for free."}, {"id": 50638250, "au": "AnonHP", "dom": 20, "sr": 22, "sc": 3.82, "ep": 4.48, "bs": 0.0, "d": 1, "age": 0.29, "grav": 4.4, "surf": 13.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 40, "k": 1876, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.254, "fa": 0.42, "gp": 0.229, "bl": 0.0, "ds": 0.0, "txt": "> I started to replace different applications with vibe coded native Mac apps that do exactly what I want in a way that I want. They replaced applications that kind of did what I wanted but were not customizable enough or just too heavy or klunky\n\nI’m sure this works well for smaller tools. But I think one of the losses here is not getting features that you never thought about and never knew that you needed. For a developer who sells applications to consumers, this is a key concern. They have an incentive to look around, get feedback from their customers, potential customers and from the market, and focus on creating more value."}, {"id": 50634147, "au": "rathboma", "dom": 8, "sr": 23, "sc": 3.77, "ep": 4.43, "bs": 0.0, "d": 1, "age": 7.8, "grav": 60.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 48, "qw": 0, "k": 570, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": ["https://beekeeperstudio.io"], "ig": 1.016, "fa": 0.62, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "That's how I do subscriptions for my database GUI (Beekeeper Studio - https://beekeeperstudio.io)\n\nI think it's the most fair balance of subscription and one time payments, although I still get complaints that I don't offer truly one-time payments. Truth be told, we'd be out of business if we did, so I'm happy with the compromise."}, {"id": 50633029, "au": "eddieroger", "dom": 44, "sr": 24, "sc": 3.7, "ep": 4.14, "bs": 0.0, "d": 2, "age": 8.92, "grav": 73.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 3512, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 0.559, "fa": 0.95, "gp": 0.082, "bl": 0.0, "ds": 0.0, "txt": "It's almost worse at $1, because while I can luckily afford to spend $1 on something, forgetting to cancel if I wished would be an annual paper cut that I could easily avoid. Do that enough times, and the phrase \"death by 1000 paper cuts\" makes sense. I don't want to have to juggle any more subscriptions than I already am."}, {"id": 50637845, "au": "jwr", "dom": 42, "sr": 25, "sc": 3.4, "ep": 4.07, "bs": 0.0, "d": 1, "age": 1.18, "grav": 8.0, "surf": 10.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 23567, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.534, "fa": 0.0, "gp": 0.319, "bl": 0.0, "ds": 0.0, "txt": "Software needs to be maintained and developed on a continuous basis, and software authors must make a living somehow. Subscriptions are the only sustainable way.\n\nWe have been playing games with \"one-time purchases\", and some businesses have been reasonably successful with those, but these are just tricks. You are tricking yourself into believing that software is a \"one-time development\". The developers spend time and effort into \"feature releases\" to make you pay again, and you get feature bloat instead of constantly improved software.\n\nI am happy to pay subscription fees for software that I use on a regular basis, if the fees are reasonable (and they certainly look reasonable in this case!)."}, {"id": 50631599, "au": "jamie_ca", "dom": 2, "sr": 26, "sc": 3.39, "ep": 4.27, "bs": 0.0, "d": 1, "age": 10.5, "grav": 94.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 1023, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": ["https://agenda.community/t/get-all-features/21"], "ig": 0.92, "fa": 0.62, "gp": 0.233, "bl": 0.0, "ds": 0.0, "txt": "That's what Agenda does, very consumer friendly. Pay for one year's subscription, get all premium features unlocked as well as any new features released during your subscription period. Cancel any time, keep your features.\n\nhttps://agenda.community/t/get-all-features/21"}, {"id": 50632747, "au": "ezfe", "dom": 49, "sr": 27, "sc": 3.31, "ep": 3.97, "bs": 0.0, "d": 3, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 2514, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 0.532, "fa": 0.68, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Okay, so if the app was $15 you would be okay but $1/year is not okay?\n\n(Don't even answer that, because if you say it's not okay I will think you're being unreasonable.)\n\nClearly there are prices where subscription pricing is not predatory. The problem is most subscriptions are not priced reasonably compared to their predecessors with fixed prices."}, {"id": 50631543, "au": "nico", "dom": 10, "sr": 28, "sc": 3.26, "ep": 4.14, "bs": 0.0, "d": 1, "age": 10.58, "grav": 95.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 4610, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.642, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Sketch and pen.dev both started as stand-alone apps (Sketch was always paid I think, pend.dev was initially fully free, now they have a free basic tier). Now they are both paid subscriptions\n\nSketch let users keep their original license/app, but quickly started adding things that made those apps kind of obsolete\n\npen.dev added accounts/signin to the application, turning it into a freemium saas, the old app is not supported (probably doesn't work or will ask for account)\n\nI think once the business transitions to subscription, it's very hard for them to keep/support a standalone app"}, {"id": 50632250, "au": "probably_wrong", "dom": 47, "sr": 29, "sc": 3.15, "ep": 4.25, "bs": 0.0, "d": 2, "age": 9.77, "grav": 84.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.423, "fa": 0.0, "gp": 0.624, "bl": 0.0, "ds": 0.0, "txt": "Not the OP, but I share the mindset.\n\nA subscription is an extra bit of cognitive load in my already-constrained mental resources. I need to constantly assess which subscription is running out, whether I want to keep it, which e-mail I used to sign up, and if I fail to miss the deadline I have to pay for another cycle. There's a good chance I'll keep paying for it long after its utility to me has gone to zero, which is obviously what most subscription services are counting on.\n\nAt some point just \"no\" is the best alternative."}, {"id": 50633884, "au": "QuantumNomad_", "dom": 5, "sr": 30, "sc": 3.05, "ep": 4.15, "bs": 0.0, "d": 2, "age": 8.07, "grav": 63.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1510, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.296, "fa": 0.28, "gp": 0.213, "bl": 0.0, "ds": 0.0, "txt": "I let my subscription to JetBrains expire and am using old versions.\n\nMostly I work on my own projects in them, and anyway if I’m working on code from someone else they could do malicious things directly in the project code itself that I compile and run instead of making some exploit specifically targeting the IDE I am using."}, {"id": 50634335, "au": "hugeBirb", "dom": 73, "sr": 31, "sc": 3.05, "ep": 3.78, "bs": 0.0, "d": 3, "age": 7.54, "grav": 58.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 84, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": ["https://www.merriam-webster.com/dictionary/complain"], "ig": 0.857, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"Subscription for updates is good. Subscription for use is a dealbreaker\"\n\nBitching cause they don't want to pay for a piece of software (that no one is forcing them to pay for) cause their clanker can do it. I would unequivocally say this is complaining.\n\nhttps://www.merriam-webster.com/dictionary/complain"}, {"id": 50632850, "au": "grimgrin", "dom": 58, "sr": 32, "sc": 2.98, "ep": 3.86, "bs": 0.0, "d": 4, "age": 9.13, "grav": 76.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 1800, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.158, "fa": 0.34, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "don't get hard peter. we're just putting more weight on a cognitive tax. ignoring the incredibly low $10/decade pricing, in other cases many of us simply don't track our credit card statements very well. now we're paying for things we don't use!"}, {"id": 50631545, "au": "DonaldPShimoda", "dom": 128, "sr": 33, "sc": 2.71, "ep": 3.89, "bs": 0.0, "d": 2, "age": 10.58, "grav": 95.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2977, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.206, "fa": 0.28, "gp": 0.175, "bl": 0.0, "ds": 0.0, "txt": "The difference is that those service providers may choose to stop supporting a feature (and will hopefully communicate this appropriately), whereas the author of Jetty Pro has no ability to choose whether private macOS APIs that are used will be maintained by Apple."}, {"id": 50631983, "au": "tavavex", "dom": 119, "sr": 34, "sc": 2.68, "ep": 3.63, "bs": 0.0, "d": 2, "age": 10.06, "grav": 88.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 3467, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.324, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Does macOS being a more polished and consistent system across all their devices have any role to play here? Linux may put up a fight by just having far more devs working on software for it, which increases the odds of someone getting it just right.\n\nI also don't think the issue is with paying for things as you insinuate, but the pervasive post-2010s software mentality of turning one-time payments into indefinite, repeatable subscriptions."}, {"id": 50636259, "au": "bmikaili", "dom": 38, "sr": 35, "sc": 2.63, "ep": 3.73, "bs": 0.0, "d": 1, "age": 4.81, "grav": 31.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 76, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.246, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yup. have:\n\n- workout/health/cook app\n- todo/calendar/notes\n- mail/matrix\n- homelab manager / claude multiplexer\n\nI don't know where we're going and most ppl probably won't be building custom apps but it's a lot of fun to do"}, {"id": 50635160, "au": "jarek83", "dom": 100, "sr": 36, "sc": 2.54, "ep": 3.2, "bs": 0.0, "d": 0, "age": 6.43, "grav": 46.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 408, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 0.966, "fa": 0.28, "gp": 0.094, "bl": 0.0, "ds": 0.0, "txt": "I'd like to see a subscription wich will let me revert payments if I forgot about the app and cancelling it in time. Use your telemetry to see if the app was really not used and refund me, because you didn't get paid for the app, you simple monetize the fact that I'm busy with other stuff."}, {"id": 50632201, "au": "wlesieutre", "dom": 64, "sr": 37, "sc": 2.41, "ep": 3.95, "bs": 0.0, "d": 2, "age": 9.81, "grav": 85.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 25556, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.54, "fa": 0.0, "gp": 0.232, "bl": 0.0, "ds": 0.0, "txt": "While I get what he's saying, devs used to solve that by having a major version release and selling to existing users with an upgrade discount. Developers and users outside of the Mac App Store spent years complaining that the App Store didn't allow this arguably more fair payment model.\n\nAnd now we have an app that isn't being sold on the App Store adopting the crappy App Store subscription model of \"keep paying forever even when there was no compatibility breakage this year and the developer hasn't added anything that you want, but blame the subscription on potential compatibility problems whether or not they exist.\"\n\nWish he'd just say \"It's a niche product that won't sell a ton of copies and I want to have stable revenue regardless of release schedule, if you don't like it too bad.\""}, {"id": 50633516, "au": "mortenjorck", "dom": 9, "sr": 38, "sc": 2.33, "ep": 3.88, "bs": 0.0, "d": 1, "age": 8.39, "grav": 67.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 23266, "kpp": 7.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.379, "fa": 0.0, "gp": 0.438, "bl": 0.0, "ds": 0.0, "txt": "That's what I plan on doing with my forthcoming macOS window manager, which similarly relies on a handful of private APIs (though I've tried to minimize reliance on them).\n\nThe one alternative I'm still considering is simply attaching major versions to major macOS versions (e.g. 1.0 will be \"27\", 2.0 will be \"28\", etc). Although since I'm going to be about six months out of phase, I'd have to offer some kind of grace period, which may ultimately be the same as a \"one year of free updates\" model."}, {"id": 50631768, "au": "brunoborges", "dom": 129, "sr": 39, "sc": 2.27, "ep": 3.6, "bs": 0.0, "d": 3, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 693, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.53, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fair point, although many SaaS companies equally rely on 3rd-party APIs they themselves can't guarantee will continue serving them, so they can serve their customers. A lot of SaaS services are just the middle man.\n\nCase in point is AI inference services, whether because a model got deprecated/removed, price became unsustainable, or the company went bankrupt!"}, {"id": 50634623, "au": "basch", "dom": 17, "sr": 40, "sc": 2.21, "ep": 3.76, "bs": 0.0, "d": 2, "age": 7.16, "grav": 53.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 7405, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 0.774, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You could have yearly feature sets like dlc.\n\n2026 features. 2027 features. Probably couldn’t have people auto subscribe to new offerings though."}, {"id": 50634907, "au": "alsetmusic", "dom": 32, "sr": 41, "sc": 2.07, "ep": 3.61, "bs": 0.0, "d": 2, "age": 6.78, "grav": 49.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 6377, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.455, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "My most heavily used vibe coded app is a front-end for Quicklook video playback with a bunch of custom features like multi-video playlist (left, right, or hidden), adjustable playback and seek speeds, and a few other things to help manage previewing and curating streamed downloads. It’s only ~480k."}, {"id": 50631263, "au": "clates", "dom": 124, "sr": 42, "sc": 2.0, "ep": 3.54, "bs": 0.0, "d": 0, "age": 10.91, "grav": 100.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 59, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.175, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "How do you justify a subscription if you, as cited in your FAQ, can't promise that features won't be made unavailable in the future should the private APIs change shape/functionality?\n\nI don't know that I could sink time and money paying for, configuring, and adapting workflows to a tool which could be made inoperable by a third party to the transaction."}, {"id": 50631521, "au": "DonaldPShimoda", "dom": 60, "sr": 43, "sc": 2.0, "ep": 3.54, "bs": 0.0, "d": 1, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 10, "k": 2977, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 0.818, "fa": 0.42, "gp": 0.288, "bl": 0.0, "ds": 0.0, "txt": "> Especially true when recreating with Claude/Gemini is one-shot away.\n\nIsn't the premise of the post kind of that it wasn't a one-shot input? The author explicitly states that they tried to do that and ended up spending quite a bit of time developing the result, and that's with their many years of experience in this area."}, {"id": 50634553, "au": "bluk", "dom": 15, "sr": 44, "sc": 1.84, "ep": 3.16, "bs": 0.0, "d": 2, "age": 7.24, "grav": 54.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 158, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.21, "bl": 0.0, "ds": 0.0, "txt": "Your app can check for previous purchases made (with receipts). You can also check any purchases for apps made by the same developer account. Apps can choose their behavior based on that. Apple/Google don't lock you out (usually). It's the app developer's logic that checks if you are currently paying and changes the app accordingly."}, {"id": 50635460, "au": "Fraterkes", "dom": 24, "sr": 45, "sc": 1.84, "ep": 3.16, "bs": 0.0, "d": 2, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 2758, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.021, "fa": 0.0, "gp": 0.524, "bl": 0.0, "ds": 0.0, "txt": "Aren’t you guys bothered by the idea that you may have to spend a day fixing up your bespoke apps any time a new macos version rolls around? Feel like the convenience wouldn’t weigh up to having to worry about that stuff, to me"}, {"id": 50635713, "au": "marktani", "dom": 12, "sr": 46, "sc": 1.67, "ep": 2.11, "bs": 0.0, "d": 3, "age": 5.68, "grav": 39.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 144, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.898, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I appreciate you chiming in on this thread, but seeing three of your posts on one smartphone screen at once seems a bit aggressive"}, {"id": 50632840, "au": "nocman", "dom": 80, "sr": 47, "sc": 1.61, "ep": 2.71, "bs": 0.0, "d": 1, "age": 9.14, "grav": 76.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 1881, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 0.641, "fa": 0.34, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "Yeah, same. Jetty the HTTP server is still very much in use.  I realize the two projects are not doing even close to the same thing, but it still seems to me like the author of this project should have eliminated that name as a possibility with a simple Google search.  The other project has been in existence for over 25 years."}, {"id": 50638353, "au": "1123581321", "dom": 48, "sr": 48, "sc": 1.57, "ep": 3.11, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 21.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 8783, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.323, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would work on the anxiety--seriously. Any purchase, regardless of the level of risk up front or over a period of time, is a bet on some level. We make thousands of small ones in our life, and one wins all of them. Learn from the bad bets but don't overdwell on the individual ones, especially not while they're in progress. If you're disorganized, that can be handled with the same techniques you probably use to keep track of your upfront purchases (licenses etc.)"}, {"id": 50632261, "au": "Analemma_", "dom": 65, "sr": 49, "sc": 1.56, "ep": 3.1, "bs": 0.0, "d": 3, "age": 9.76, "grav": 84.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 30, "k": 19113, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 0.809, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Wish he'd just say \"It's a niche product that won't sell a ton of copies and I want to have stable revenue regardless of release schedule, if you don't like it too bad.\"\n\nIt might be because I've been a Siracusa follower for a very long time through all the OS X reviews and now his podcast, but I think it's pretty clear he is saying that between the lines, and is just having a little tact and decorum about it. Saying it explicitly I think would just make people angrier."}, {"id": 50635741, "au": "jdgoesmarching", "dom": 69, "sr": 50, "sc": 1.51, "ep": 2.83, "bs": 0.0, "d": 1, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1693, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.18, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "It will never cease to amaze me how a board full of software professionals regularly rails against paying for software upkeep. It might be the one group of people that values the effort of making software less than industry execs."}, {"id": 50631985, "au": "theturtletalks", "dom": 63, "sr": 51, "sc": 1.42, "ep": 2.96, "bs": 0.0, "d": 1, "age": 10.05, "grav": 88.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 4060, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.093, "fa": 0.0, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "I was also like why is this a subscription. He mentions his application is using private APIs which can break in newer versions of MacOS. It’s happened and if he charged a one time fee and they change it, you would blame him then too since your app would stop working.\n\nGive him the benefit of the doubt on this one, his other apps are one-off purchases."}, {"id": 50632970, "au": "giancarlostoro", "dom": 3, "sr": 52, "sc": 1.4, "ep": 2.94, "bs": 0.0, "d": 2, "age": 8.98, "grav": 74.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 23311, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.251, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some dev licenses are way too hostile, I wish they'd do this at least. There's a few .NET ones both commercial, and open source ransomware commercial (this is what I call when they change their license to something extra hostile unless you pay them, so companies wind up behind on updates) and its just brutal what some of them charge you, some of them make me wish I was dealing with Oracle instead its that bad."}, {"id": 50631120, "au": "phoghed", "dom": 88, "sr": 53, "sc": 1.35, "ep": 2.45, "bs": 0.0, "d": 0, "age": 11.07, "grav": 102.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 1048, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 0.562, "fa": 0.0, "gp": 0.778, "bl": 0.0, "ds": 0.0, "txt": "idk how the economics of it work out for the devs, but they only way I ever pay for things like this is via Setapp."}, {"id": 50632294, "au": "geraneum", "dom": 61, "sr": 54, "sc": 1.28, "ep": 2.82, "bs": 0.0, "d": 2, "age": 9.73, "grav": 84.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 2203, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 1.201, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s not one shot away. Not because the LLMs are not powerful but because you’re not going to describe every single detail of what you want in the first prompt (otherwise you might as well weite the app yourself). Also LLM gets stuff wrong, the harness corrects it and the loop goes on an on until you like what the code does and what you see. The “is one-shot away” is something some people like to throw around without comprehending what it entails in practice."}, {"id": 50636399, "au": "jonpurdy", "dom": 29, "sr": 55, "sc": 1.26, "ep": 2.8, "bs": 0.0, "d": 2, "age": 4.55, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1651, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.19, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, I have a bunch. I blogged about the Mac-specific ones I built recently (not linking for promo, on my website in my profile if interested).\n\nStarted doing iOS apps as well and have replaced Infuse (iCloud syncing media player) and Halide (bayer RAW camera). My replacements are so much better than both of those for my specific requirements.\n\nMy big issue is that it’s fast to get an MVP but I get sucked into the details and lose track of time very easily."}, {"id": 50636107, "au": "cosmic_cheese", "dom": 25, "sr": 56, "sc": 1.26, "ep": 2.78, "bs": 0.0, "d": 3, "age": 5.05, "grav": 33.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 6810, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 1.119, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Simple utility type native apps don't break all that frequently. There's some of that nature from the mid-2000s that one can get running on modern macOS in an evening, albeit with deprecation warnings (which themselves are often handled well by LLMs)."}, {"id": 50635975, "au": "indy", "dom": 27, "sr": 57, "sc": 1.26, "ep": 2.74, "bs": 0.0, "d": 3, "age": 5.24, "grav": 35.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 4766, "kpp": 9.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 1.168, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Creating these bespoke apps is often just an afternoon's work. If an update breaks them just ask the coding agent to fix them or create new versions from scratch.\n\nWe're entering the age of disposable software."}, {"id": 50631728, "au": "throwaway0q5347", "dom": 67, "sr": 58, "sc": 1.26, "ep": 2.67, "bs": 0.0, "d": 1, "age": 10.33, "grav": 91.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 64, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "I think the value of the subscription is that, once you one-shot your own, you have to maintain it.\n\nEDIT: As a personal desktop app, the bar to implementing your own is much lower than I thought. I think my comment would stand only for a widely used open-source library."}, {"id": 50638272, "au": "AnonHP", "dom": 30, "sr": 59, "sc": 1.26, "ep": 2.6, "bs": 0.0, "d": 3, "age": 0.24, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 19, "k": 1876, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 0.599, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Started doing iOS apps as well and have replaced Infuse (iCloud syncing media player) and Halide (bayer RAW camera)\n\nHow do you install the apps on iOS? Are you in the EU or do you have to do the developer install that requires some refresh process every seven days?"}, {"id": 50634195, "au": "clickety_clack", "dom": 34, "sr": 60, "sc": 1.26, "ep": 2.48, "bs": 0.0, "d": 1, "age": 7.75, "grav": 60.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1971, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 0.332, "bl": 0.0, "ds": 0.0, "txt": "Same here. I have a little constellation of apps now. I don’t have to worry about data issues, and some of them are quicker to build than it is to figure out how to configure the third party app they replace."}, {"id": 50631387, "au": "greedo", "dom": 130, "sr": 61, "sc": 1.26, "ep": 2.4, "bs": 0.0, "d": 1, "age": 10.76, "grav": 97.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 7015, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_linux", "flbl": "Software & Linux (Hard)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How do you buy any software then? An OS vendor could nuke an API without a concern for your workflow. Unless you're going to go full stack OSS, this is the world you live in."}, {"id": 50638324, "au": "1123581321", "dom": 120, "sr": 62, "sc": 1.26, "ep": 2.32, "bs": 0.0, "d": 3, "age": 0.07, "grav": 3.7, "surf": 18.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 8783, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "code_product", "flbl": "Code & Product (Dock)", "urls": [], "ig": 0.986, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Definitely. It's the OS itself, the people who work on it, the tools and guidance for third parties, the third party developers, the users. They all have standards and desires that support the others and let them build/do more."}, {"id": 50633066, "au": "bayindirh", "dom": 13, "sr": 63, "sc": 1.26, "ep": 2.24, "bs": 0.0, "d": 1, "age": 8.87, "grav": 73.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 22695, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": y related. I don’t think there’s much chance of confusion. When it comes down to it, almost all relatively short, memorable names are “already taken” in one form or another."}, {"id": 50632808, "au": "anamexis", "dom": 57, "sr": 76, "sc": 1.25, "ep": 1.68, "bs": 0.0, "d": 4, "age": 9.17, "grav": 77.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 5027, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "thought_app", "flbl": "Thought & App (Subscriptions)", "urls": [], "ig": 0.716, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It doesn't seem unreasonable to me. Subscriptions are something that need to be managed. I have way too many paid subscriptions already, some of them probably unused. I'd like to minimize them as much as possible.\n\nIt's not about the price."}, {"id": 50634425, "au": "timcobb", "dom": 14, "sr": 77, "sc": 1.25, "ep": 1.65, "bs": 0.0, "d": 1, "age": 7.42, "grav": 56.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1392, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "subscription_app", "flbl": "Subscription & App (Model)", "urls": [], "ig": 0.479, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "How do you do this on mobile? Don't Apple/Google just lock you out of the app when your sub expires?"}, {"id": 50634175, "au": "rathboma", "dom": 6, "sr": 78, "sc": 1.25, "ep": 1.63, "bs": 0.0, "d": 2, "age": 7.77, "grav": 60.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 27, "qw": 0, "k": 570, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "apps_ios", "flbl": "Apps & Ios (License)", "urls": ["https://beekeeperstudio.io"], "ig": 0.692, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I have my own app with a perpetual fallback license (https://beekeeperstudio.io).\n\nI've thought the same thing many times, but it seems to be the best compromise I'v   function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
