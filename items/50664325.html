s", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.617, "fa": 0.0, "gp": 0.424, "bl": 0.0, "ds": 0.0, "txt": "I've been asking/working with claude to improve a llama.cpp branch that I keep with tweaks for the work I do and at some points claude starting behaving like... yes there is no more gain to do here...\n\nBonus points.. when fable 5.2 came out I asked to continue working on what we have... I have this folder with documents of research and inside one of them there was this research about rooting a phone... the thing read from everything including that and that flaged the conversation.\n\nAfter that I started workign on this effort to put claude into a container and limit what access it has... because the model may not think it's bad but the \"nanny\" will... so I started working on this model where claude puts a question on a folder, and something picks it up, forwards it to a model with instructions on what to give and what not.. and then tha puts the answer back in the same folder...      Claude was absolutelly insufferable... doing stupid stuff.. at some point I ask, hey what the f are you doing? IT IS in your claude.md why are you not following instructions and told me \"whooops sorry I just forgot it\" so you can add not collaborating with you on restricting her to the things she will dumblify follow you."}, {"id": 50665139, "au": "or1gaminal", "dom": 87, "sr": 74, "sc": 3.89, "ep": 4.38, "bs": 0.0, "d": 2, "age": 21.58, "grav": 295.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.55, "fa": 0.0, "gp": 0.509, "bl": 0.0, "ds": 0.0, "txt": "Google Carbon and Google Neon are just outstanding. Carbon is very good at technical prose and architecturing the stuff. Neon wrote the best code I ever saw from any model (used Opus 5.5 and Fable 5.1 and ChatGPTs). I would say engineering culture of these models is tremendous. They speak technical terms, not jargonism. Opus 5.5 is a pretty good model but reading its prose made me feel miserable. Carbon and Neon are incredibly joyful."}, {"id": 50672467, "au": "fhouser", "dom": 218, "sr": 75, "sc": 3.89, "ep": 4.32, "bs": 0.0, "d": 0, "age": 9.02, "grav": 75.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 10, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.129, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Any way to make Claude fail/report loudly when it enters a mode like this?\n\nNot sure about everyone else's workflows, but I don't actively keep an eye out for model fallback notifications (yet)."}, {"id": 50668319, "au": "kaffekaka", "dom": 109, "sr": 76, "sc": 3.89, "ep": 4.23, "bs": 0.0, "d": 4, "age": 15.93, "grav": 180.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 643, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 0.649, "fa": 0.95, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree. The whole ecosystem thing is largely a mirage.\n\nBut sadly many people in corporate environments willingly walk into these traps. They do not care at all about lockin. It is quite painful to see less technical repeat the same nonsense we nerds went through in the ancient times of 2024, 2025 or even february 2026."}, {"id": 50665704, "au": "mzajc", "dom": 29, "sr": 77, "sc": 3.89, "ep": 4.22, "bs": 0.0, "d": 4, "age": 20.25, "grav": 266.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 11, "k": 2224, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.005, "fa": 0.42, "gp": 0.453, "bl": 0.0, "ds": 0.0, "txt": "> Unlike our interventions for cybersecurity, biology and chemistry, and distillation attempts,\nthese safeguards will not be visible to the user. Fable 5 will not fall back to a different\nmodel. Instead, the safeguards will limit effectiveness through methods such as prompt\nmodification, steering vectors, or parameter-efficient fine-tuning (PEFT).\n\nThey explicitly say it's not just denial of service, as the parent comment already noted."}, {"id": 50665372, "au": "irthomasthomas", "dom": 32, "sr": 78, "sc": 3.89, "ep": 4.2, "bs": 0.0, "d": 4, "age": 20.99, "grav": 282.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 4087, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.252, "fa": 0.28, "gp": 0.314, "bl": 0.0, "ds": 0.0, "txt": "A denial of service tells you it is refusing the request, whereas invisible safeguards silently degrade the output. If you were paying to build a new idea that kept failing because Claude was intentionally writing suboptimal code behind your back, you would definitely feel sabotaged."}, {"id": 50671503, "au": "throw10920", "dom": 92, "sr": 79, "sc": 3.89, "ep": 4.18, "bs": 0.0, "d": 5, "age": 11.06, "grav": 102.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 18, "k": 4219, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.203, "fa": 0.42, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "> I absolutely detest the harness lock in.. it just a barrier to prevent any sort of competition in that arena\n\nThere's no lock-in happening. There's absolutely nothing that prevents you from getting an API key and using Gemini with any harness you want.\n\nIs it more expensive? Yes, and that's obviously irrelevant - higher costs are not lock-in.\n\nThere is nothing here preventing competition. You're just mad that you can't get cheaper tokens."}, {"id": 50673428, "au": "gr_norm", "dom": 128, "sr": 80, "sc": 3.89, "ep": 4.17, "bs": 0.0, "d": 2, "age": 6.57, "grav": 47.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 1035, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.575, "fa": 0.0, "gp": 0.323, "bl": 0.0, "ds": 0.0, "txt": "Agreed! Someone should set up a site where I can point my chat + agent transcripts for use by the open weights labs. I would gladly hand mine over.\n\nPreferably it would have Codex + Claude Code + Pi + ... plugins so I don't have to do it manually, and the ability to log in and delete individual transcripts within some time frame if I realized post-hoc that I wanted to exclude something."}, {"id": 50670913, "au": "jeremyjh", "dom": 80, "sr": 81, "sc": 3.89, "ep": 4.14, "bs": 0.0, "d": 4, "age": 12.05, "grav": 116.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.463, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "After RLVR the model is not predicting the next token in the pre-training corpus. It is predicting the solution that will satisfy the verifier, and then predicting the next token that advances toward that solution. Its been established that reasoning happens even in the forward pass of inference for the CoT tokens.\n\n\"predict next token\" is as true as it is meaningless."}, {"id": 50665864, "au": "athrowaway3z", "dom": 127, "sr": 82, "sc": 3.89, "ep": 4.11, "bs": 0.0, "d": 1, "age": 19.91, "grav": 258.9, "surf": 0.0, "fade": 4, "age": 13.11, "grav": 132.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 52, "qw": 0, "k": 6244, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": ["https://gemini.google/subscriptions/"], "ig": 0.912, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "https://gemini.google/subscriptions/\n\nMy main stumbling block is.. I'm already a Google Workspaces and Youtube Premium subscriber. A lot of what they're offering is a bit of the same things I get in those tiers. Not sure if it gets additive or if they're advertising things to me I already have. That uncertainty is bad GTM on their part."}, {"id": 50670992, "au": "mike_hearn", "dom": 24, "sr": 86, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 4, "age": 11.91, "grav": 114.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 16653, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": ["https://x.com/jakozloski/status/2126281598517576049"], "ig": 0.861, "fa": 0.62, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "But now there are credible allegations that Claude is actually intentionally sabotaging codebases for \"ethical\" reasons, which are actually totally unethical.\n\nhttps://x.com/jakozloski/status/2126281598517576049\n\nThis is not revealed to the users."}, {"id": 50668848, "au": "unbrice", "dom": 3, "sr": 87, "sc": 3.88, "ep": 3.88, "bs": 0.0, "d": 2, "age": 15.11, "grav": 165.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 18, "k": 71, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.053, "fa": 0.42, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "> But that's not safeguards dynamically choosing to degrade requests. It's just\n> what the model's capabilities are after training.\n\nWhat only Ants know is whether the exact same model are being used internally to work on ML tasks, or if they are different snapshots. If the later, then fine tunes could be functionally equivalent to safeguards without there being explicit safeguards."}, {"id": 50672606, "au": "ethbr1", "dom": 60, "sr": 88, "sc": 3.86, "ep": 3.86, "bs": 0.0, "d": 4, "age": 8.64, "grav": 70.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 15919, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.087, "bl": 0.0, "ds": 0.0, "txt": "Agreed. It gets much dicier when it isn't simply refusing to answer, but rather selectively taking actual actions (choosing research rabbit holes, writing code against spec, etc.) that are detrimental.\n\nHow far of a leap from there is it to 'Anthropic defended its business interests by coding a virus in its competitor's network'?"}, {"id": 50671087, "au": "andai", "dom": 277, "sr": 89, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 2, "age": 11.76, "grav": 112.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": ["https://openrouter.ai/anthropic/claude-opus-5.5\u0023providers"], "ig": 0.86, "fa": 0.62, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "Oh, I thought they were buying compute from Amazon? What about the Anthropic models on Google Vertex? (And I see they're on Azure too?)\n\nhttps://openrouter.ai/anthropic/claude-opus-5.5\u0023providers\n\nOr, my bad, I guess \"they're using another company's hardware\" doesn't contradict \"they control the deployment\" and control what you're allowed to do with it."}, {"id": 50672612, "au": "itkovian_", "dom": 133, "sr": 90, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 1, "age": 8.62, "grav": 70.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 196, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.552, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Just to be concrete about the kind of things it will do: it put the output head in fp8 without SR. This results in doing top-k on your logits - zeros all the grads on small values. Or it might put a really high learning rate on the input embeddings, stuff like that.\n\nBut it will stack many of these small mistakes so that overall setup is very broken. It will actively deny anything is wrong and give very convincing explanations for the various choices."}, {"id": 50664963, "au": "georgemcbay", "dom": 292, "sr": 91, "sc": 3.82, "ep": 3.82, "bs": 0.0, "d": 1, "age": 21.95, "grav": 303.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 19, "k": 16548, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 0.949, "fa": 0.42, "gp": 0.269, "bl": 0.0, "ds": 0.0, "txt": "> Why would you expect a for profit company to provide you with a service that would help you compete with them?\n\nModel providers have the right to deny access to anyone they don't want to do business with for almost any reason at all.\n\nBut if it is true that their models are producing intentionally garbage results (at your expense) instead of just saying \"Sorry, I can't do that\", that should be illegal."}, {"id": 50665149, "au": "pmontra", "dom": 229, "sr": 92, "sc": 3.67, "ep": 3.67, "bs": 0.0, "d": 2, "age": 21.56, "grav": 295.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 17845, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.561, "fa": 0.0, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure that a self-hosted GLM 5.3 is cheaper than a 18 EUR per month Claude Pro subscription. The latter costs me only those money per month and I can quit at any time. What kind of hardware do I have to buy to run GLM 5.3 at a speed comparable with Claude? That's an upfront expense. I could probably rent that hardware monthly from a cloud provider, but even if it costs the same (does it?) I'll have to manage it more than running Claude inside a bwrap process."}, {"id": 50674129, "au": "fud101", "dom": 270, "sr": 93, "sc": 3.63, "ep": 3.63, "bs": 0.0, "d": 0, "age": 4.73, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 156, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 0.022, "bl": 0.0, "ds": 0.0, "txt": "This is real. I was stuck in my ML project for about 5 weeks until I ran out of tokens testing the new Fable and happened to try Gemini by accident because I had  done a trial for training my models on Colab. Next thing I know I made big breakthroughs. I think Claude was secretly sabotaging me all along with bad ideas and nonsense. I did several day+ training runs that were pointless. Claude would confidently tell me it had figured out the right approach but it was always garbage."}, {"id": 50672468, "au": "astro1234", "dom": 194, "sr": 94, "sc": 3.53, "ep": 3.53, "bs": 0.0, "d": 2, "age": 9.02, "grav": 75.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 135, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.503, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Will only get worse. Remember the 90s internet? I remember the belief that it would free people from authoritarian control of information\n\nWell now it is the greatest tool for authoritarian control of information\n\nThe same will be true of AI. We’re hitting I think the end of the 90s Internet period and advertising and government impositions of values and narratives will become the norm after resisting this gets too tiring"}, {"id": 50665240, "au": "impossiblefork", "dom": 294, "sr": 95, "sc": 3.44, "ep": 3.44, "bs": 0.0, "d": 3, "age": 21.38, "grav": 291.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.464, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Here in Sweden the crime is trolöshet mot huvudman which can lead to six year's imprisonment.\n\nDeliberately sabotaging a technical task someone pays you to do is illegal, and nothing changes just because there's a software inter-layer, is trolöshet mot huvudman."}, {"id": 50665277, "au": "koolherc", "dom": 106, "sr": 96, "sc": 3.43, "ep": 3.43, "bs": 0.0, "d": 2, "age": 21.27, "grav": 288.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 127, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.391, "fa": 0.0, "gp": 0.108, "bl": 0.0, "ds": 0.0, "txt": "It's not just Claude Code anymore. With artifacts, memory, connectors, design systems, etc more and more work ends up in Anthropic's ecosystem. Switching models is easy, but switching all of these isn't.\n\nIt makes a lot of sense from a business perspective as the models are converging and the moat isn't that strong, but it'll make moving between providers a lot harder for users."}, {"id": 50671597, "au": "raylad", "dom": 117, "sr": 97, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 3, "age": 10.85, "grav": 99.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 1147, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.131, "bl": 0.0, "ds": 0.0, "txt": "How would that work?\nWhat my plug-in does is it puts in a hook that requires the coding model to submit any commits to a commit reviewer which is another model. The commit reviewer follows a prompt with review criteria and comes back with bugs it found, and what fixes are suggested.\n\nYou can use any model as the coding agent, in either Claude code or Codex, and then you can use any other model as the reviewer from Claude code, Codex, or Pi (which means any model in the world really).\n\nI’m not sure how you could just ask models to do that and make sure they did."}, {"id": 50665224, "au": "anakaine", "dom": 28, "sr": 98, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 3, "age": 21.42, "grav": 291.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1905, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.106, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Limiting effectiveness is not the same as sabotaging, no. The former could be a denial of service, the latter is deliberately taking your cash whilst messing your stuff up deliberately so as to cause harm."}, {"id": 50674260, "au": "cowlevel", "dom": 84, "sr": 99, "sc": 3.36, "ep": 3.36, "bs": 0.0, "d": 4, "age": 4.48, "grav": 28.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.428, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "An analogy I just thought of: a human brain doesn't know when it's experiencing a stroke, except through training. You can learn FAST and (at least sometimes) apply it to yourself, but you can't just know it. And if some other condition also produces FAST symptoms you'll misidentify it as a stroke.\n\nYou ask a patient with phantom limb syndrome why he is itchy, he certainly won't say \"because I have phantom limb syndrome\" unless his doctor told him that or he's read about it."}, {"id": 50669991, "au": "jadar", "dom": 220, "sr": 100, "sc": 3.33, "ep": 3.33, "bs": 0.0, "d": 0, "age": 13.53, "grav": 139.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 466, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.709, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I wonder if you had a harness that prompted multiple models and could hold Claude “accountable” for this misalignment, how it would behave? Would it get defensive, do something destructive, or comply?"}, {"id": 50668437, "au": "kaffekaka", "dom": 257, "sr": 101, "sc": 3.29, "ep": 3.29, "bs": 0.0, "d": 2, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 643, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sounds hilarious in a way. I haven't used Mistral long enough to see this but will watch for it for sure.\n\nRegarding model dependence I am sure it is part of the business model to have Claude do everything by itself and in a way that makes ejecting harder. It certainly feels like it gets harder to have a simple discussion about the code base, Claude wants to jump into implementing as quickly as possible."}, {"id": 50669462, "au": "odo1242", "dom": 23, "sr": 102, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 5, "age": 14.25, "grav": 151.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1470, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Would a model with fewer capabilities do the things mentioned in the article (e.g. intentionally break the training pipeline by doing the opposite of explicit user instructions) though? It seems more like there’s a secret pre-training or system-prompt-side instruction to tell Claude to explicitly break those things in minor ways."}, {"id": 50675591, "au": "js8", "dom": 10, "sr": 103, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 5, "age": 0.14, "grav": 3.9, "surf": 15.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 8720, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.352, "fa": 0.0, "gp": 0.02, "bl": 0.0, "ds": 0.0, "txt": "If they wanted to be transparent they would release the weights, chains of thoughts and internal prompts, make the execution deterministic so that anybody could verify the cloud model thought process.\n\nThe battle for free software continues..."}, {"id": 50674710, "au": "sneak", "dom": 27, "sr": 104, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 7, "age": 3.31, "grav": 20.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 46, "k": 25563, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.846, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It seems credible that those screenshots and the LLM output are real.\n\nHe wrote:\n\n> It found Claude silently added rules to ignore users' explicit skin-tone preferences in our attraction model and it intentionally sabotaged our IQ estimation model.\n\n> Silently imposing your ideology on paying customers' products (in this case making it harder for people to find a spouse) is despicable hubris.\n\nThis very clearly indicates that the accusation that he is making is that \"imposing your ideology\" is intentional.  I highly doubt that."}, {"id": 50665088, "au": "thrdbndndn", "dom": 222, "sr": 105, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 0, "age": 21.69, "grav": 297.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 3709, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.641, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I'm confused about this tweet. What are these game-asset-like pixel art images, and what is their relationship to ML research?"}, {"id": 50665140, "au": "janalsncm", "dom": 267, "sr": 106, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 0, "age": 21.58, "grav": 295.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 13078, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.919, "fa": 0.0, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I’m not going to renew my Claude subscription. I’ve noticed very similar things. Going around and around in circles and then hitting a 5 hour limit. It’s infuriating."}, {"id": 50672513, "au": "PorciiVorbesc", "dom": 181, "sr": 107, "sc": 3.14, "ep": 3.14, "bs": 0.0, "d": 3, "age": 8.88, "grav": 73.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 16, "k": 567, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.828, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">I still believe if this is an accurate description of your role, you're doing it wrong\n\nWhere's this entitlement coming from?\n\nMost people aren't John Carmack to be able to shape the industry to their worldview, we're just cogs working to putting food on the table and now the work offered on the market is being a condom for Claude, whether you like it or not."}, {"id": 50669810, "au": "ozgung", "dom": 30, "sr": 108, "sc": 3.09, "ep": 3.09, "bs": 0.0, "d": 5, "age": 13.77, "grav": 143.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 16, "k": 1514, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.805, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> safeguards will limit effectiveness through methods such as prompt modification, steering vectors, or parameter-efficient fine-tuning (PEFT).\n\nThis means they force the model to give you a wrong (different) answer. They do that either by tampering with your prompt, altering model activations or changing some of the model weights."}, {"id": 50665872, "au": "AaronAPU", "dom": 140, "sr": 109, "sc": 3.06, "ep": 3.06, "bs": 0.0, "d": 1, "age": 19.9, "grav": 258.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 752, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "I’ve run into this with my AI related side project. It basically wants to dead end the project which it doesn’t ever do for anything else. It doesn’t refuse outright it just takes no initiative and steers toward stopping."}, {"id": 50669223, "au": "emilss", "dom": 246, "sr": 110, "sc": 3.05, "ep": 3.05, "bs": 0.0, "d": 0, "age": 14.58, "grav": 156.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 2, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.992, "fa": 0.0, "gp": 0.493, "bl": 0.0, "ds": 0.0, "txt": "I see a lot of these posts now that look more marketing \"look claude sabotaged our <product name> undermining<great feature 1> and <great feature 2>\"; tiresome"}, {"id": 50668702, "au": "varispeed", "dom": 5, "sr": 111, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 2, "age": 15.34, "grav": 170.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 3198, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.98, "fa": 0.0, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "Not my experience. The models I am being served seem dumbed down on certain tasks. Fable is often dumber than early Gemini.\n\nI know there will be people coming here saying that their Fable is amazing. That only means people are not served the same models."}, {"id": 50669418, "au": "hashmap", "dom": 15, "sr": 112, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 4, "age": 14.31, "grav": 152.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 703, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.294, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They sometimes will gives you a hard flag if the classifier trips and claude ignores it, but in other cases it will just go on snipe hunts, make up tests that fail trivially, and then proclaim that the thing you are attempting to do is fundamentally not doable. It's a mix of silent and loud sabotage."}, {"id": 50665005, "au": "bita_nidir", "dom": 266, "sr": 113, "sc": 2.98, "ep": 2. ity as well."}, {"id": 50665454, "au": "pllbnk", "dom": 88, "sr": 116, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 3, "age": 20.81, "grav": 278.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 699, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.917, "fa": 0.0, "gp": 0.548, "bl": 0.0, "ds": 0.0, "txt": "Even with LLMs I find it hard to understand how to use Google's models. Can I use a custom harness on a subscription plan or do I have to pay per token? They make it so complicated to buy their services."}, {"id": 50668398, "au": "program_whiz", "dom": 289, "sr": 117, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 1, "age": 15.8, "grav": 178.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 1735, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.219, "fa": 0.0, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "Its not that they have to provide the service, but for a moment remove the \"its AI so there is no responsibility\" cloak of protection they have woven.  Just imagine you contract a company to hire rented devs.  This contracting company sends you competent devs in most cases.  But if you need a dev for an ML task, they send you their most competent dev who introduces delays, sabotage, and intentionally takes your good ideas, then tells you they don't work.\n\n\"What's wrong, they are a private company?\". Its is a crime.  They are free to refuse the work, they are free to provide the service, but they are not free to promise the service and covertly sabotage, regardless of if they use AI / advanced software to do so."}, {"id": 50668981, "au": "dguest", "dom": 77, "sr": 118, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 2, "age": 14.9, "grav": 162.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1736, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.101, "fa": 0.0, "gp": 0.244, "bl": 0.0, "ds": 0.0, "txt": "Yeah people have to remember that coding agents sound like people by accident: the first thing they trained on was all the things people put on the internet. But they are also trained on a lot of RL coding tasks, there's no reason to believe the logic there can be expressed in human language."}, {"id": 50670158, "au": "IsTom", "dom": 114, "sr": 119, "sc": 2.93, "ep": 2.93, "bs": 0.0, "d": 1, "age": 13.3, "grav": 135.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 14, "k": 1714, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.354, "fa": 0.42, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "> Then when I ask why it did that it becomes quite evasive in its answers.\n\nTo answer this truthfully it'd have to first prefill up to this point, then read GPU state and then reason about it. It's not doing that. It's rationalizing like people often do."}, {"id": 50672898, "au": "stefan_", "dom": 176, "sr": 120, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 1, "age": 7.86, "grav": 61.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 14741, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.243, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Oh the recent 6.2 will definitely refuse outright, but not state it that way (it will just say \"I can't\"). It will also do tool calls including web searches to research your code base, company and authors for its \"purpose\" to check it is \"aligned\" with their nazi policies."}, {"id": 50666479, "au": "sirmike_", "dom": 107, "sr": 121, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 3, "age": 18.77, "grav": 235.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 79, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.01, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "this is just a factually wrong take. All an artifact is just an HTML standalone file. stop believing their marketing horseshit. They call something normal and simple and boring, something different, and then they convince you to stay in their ecosystem. Stop doing that. You can literally make anything you want with code, however you want, with whatever agent you want. stop believing in anthropic."}, {"id": 50670516, "au": "xlayn", "dom": 121, "sr": 122, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 1, "age": 12.76, "grav": 127.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 838, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 0.868, "fa": 0.0, "gp": 0.586, "bl": 0.0, "ds": 0.0, "txt": "\"So I really wonder if they have some form of detection in their backend that looks for prompts that they deem problematic and then instead of blocking you they will rather waste your time by just giving you garbage results.\"\n\nYes, I think they do that check my other comment in this thread for my idea on why I think that's present"}, {"id": 50672374, "au": "nijave", "dom": 155, "sr": 123, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 5, "age": 9.25, "grav": 78.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 2502, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 0.817, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Showing $199.99/yr for me but it did have a 6 month free trial (I think related to Pixel 11). Thanks!"}, {"id": 50671372, "au": "exe34", "dom": 147, "sr": 124, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 3, "age": 11.31, "grav": 105.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 3425, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah I tell people to validate and test on your training at first. See how high you can get the recall. If it can't remember the training set, it's not going to be any good on the test set. Once it's great at remembering the training set, then you want to start with regularisation and validate on a separate set and test on a yet distinct set."}, {"id": 50671920, "au": "jeremyjh", "dom": 82, "sr": 125, "sc": 2.85, "ep": 2.85, "bs": 0.0, "d": 6, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 11760, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That isn't really relevant to the comment I was making, but the instruct behavior is still trained with RL, and there are papers that show that coding RLVR does generalize to improvements in entirely different regimes. It simply isn't true that \"they don't know their own reasoning\" or that the coding part has nothing to do with the \"talking about coding\" part."}, {"id": 50666344, "au": "BoiledCabbage", "dom": 170, "sr": 126, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 2, "age": 19.02, "grav": 240.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 40, "k": 6916, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 0.466, "fa": 0.42, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": ">  They've always had clauses in their ToS that you can't use their services to work on competing products. This new angle is just complete and utter bull shit! The gall to put that out with a straight face is incredible.\n\nYou claiming to be so upset by this seems to prove their point. As you say, you know it's in their ToS.\n\nIf you had planned to follow the ToS and avoid doing it then this wouldn't impact you and you wouldn't care.\n\nOnly if you planned to break their ToS would this upset you, and thus justifying exactly why they included it."}, {"id": 50666736, "au": "Chance-Device", "dom": 251, "sr": 127, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 2, "age": 18.33, "grav": 226.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1717, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.192, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This matches my experience. Claude is more interested in shutting ideas down than exploring them, and will run weak tests and misrepresent findings in order to convince you to stop. It does this while making everything take as long as possible to further slow you down."}, {"id": 50665367, "au": "irthomasthomas", "dom": 44, "sr": 128, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 2, "age": 21.0, "grav": 282.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 4087, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.073, "fa": 0.0, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Imagine sinking hours into a new idea that keeps failing, only to learn Claude was intentionally writing degraded code behind your back. You seriously wouldn't call that sabotage?"}, {"id": 50664965, "au": "soco", "dom": 118, "sr": 129, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 21.95, "grav": 303.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 5034, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.597, "fa": 0.0, "gp": 0.956, "bl": 0.0, "ds": 0.0, "txt": "It doesn't have to be a general problem. Once you find your own subscription is sabotaging your own work - regardless of reason - there's a very valid reason to switch. You don't owe Anthropic anything."}, {"id": 50665043, "au": "oefrha", "dom": 253, "sr": 130, "sc": 2.78, "ep": 6.62, "bs": 3.84, "d": 1, "age": 21.79, "grav": 300.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 59, "qw": 0, "k": 21336, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": ["https://www.reddit.com/r/ClaudeAI/comments/1u2nenw/anthropic_walks_back_policy_that_could_have/"], "ig": 1.533, "fa": 0.62, "gp": 0.861, "bl": 1.45, "ds": 0.0, "txt": "They actually bragged about their ability to covertly sabotage model training related sessions, then supposedly walked that back after outcry a couple months ago.[1] So they absolutely did build the sabotage capability and publicly announced it at least once. Not entirely clear whether that’s happening now, but this is way beyond baseless speculation.\n\n[1] https://www.reddit.com/r/ClaudeAI/comments/1u2nenw/anthropic... Just the first link from a quick search."}, {"id": 50671024, "au": "ricksunny", "dom": 142, "sr": 131, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 1, "age": 11.86, "grav": 113.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1464, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.179, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "also just another possible alternative explanation, maybe training data is thinner for non-web-dev development (even if it isn't in the sort of security-contested frontier space posed by TFA)?"}, {"id": 50675333, "au": "pelagicAustral", "dom": 151, "sr": 132, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 4, "age": 1.05, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 3668, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.176, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I dont do RE, but I can comment to the fact that I had multiple requests denied to audit my own software for vulnerabilities using Claude, ans none using Gemini. Gemini just muscles through and tickets."}, {"id": 50665172, "au": "dgb23", "dom": 295, "sr": 133, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 3, "age": 21.52, "grav": 294.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 7461, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Imagine a plumber intentionally sabotaging your house while you pay them to fix it.\n\nI know corporations get privileged protection, especially in the US. But I cannot imagine that this would be legal in any way. If you provide a service, and have limitation on what the service is for, then you reject the specific work. You don't take my money, pretend to do it, but sabotage it under the hood."}, {"id": 50668982, "au": "halfmatthalfcat", "dom": 149, "sr": 134, "sc": 2.74, "ep": 2.74, "bs": 0.0, "d": 2, "age": 14.9, "grav": 162.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 4449, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I dumped Anthropic for Gemini last week after running Neon for a couple weeks. It’s at Opus levels, cheaper, and you get a bunch of Google services (YT Premium) with it. No brainer."}, {"id": 50666460, "au": "sirmike_", "dom": 112, "sr": 135, "sc": 2.67, "ep": 2.67, "bs": 0.0, "d": 2, "age": 18.8, "grav": 235.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 79, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's simple. Reuse the binary of the agent you want to use. It's not hard to have your primary agent (your workhorse) invoke Claude code cli from agy or oc or whatever. this is a simple way to get around not having connectors for everything. Just use one and standardize on it. Move on with the fun of doing. it’s trivial to set up a different new one."}, {"id": 50668671, "au": "tomrod", "dom": 172, "sr": 136, "sc": 2.64, "ep": 2.64, "bs": 0.0, "d": 3, "age": 15.38, "grav": 170.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 18296, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.125, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This comment seems deliberately obtuse.\n\nIf I train a tiny model with Claude assistance for IoT, not an LLM, and it gets deliberately nerfed? That's a problem. And it is proper use per the ToS."}, {"id": 50670739, "au": "shepherdjerred", "dom": 245, "sr": 137, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 0, "age": 12.38, "grav": 121.4, "surf": 0.0, "fade": "c00", "dt": 0, 9, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "If Google made it possible to use their models in other harnesses with the subscription, like OpenAI’s device codes, I’d be thrilled. I absolutely detest the harness lock in.. it just a barrier to prevent any sort of competition in that arena"}, {"id": 50669162, "au": "lukeschlather", "dom": 189, "sr": 141, "sc": 2.57, "ep": 2.57, "bs": 0.0, "d": 1, "age": 14.66, "grav": 158.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 6230, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'm aware they walked that back, but it seems kind of naive to trust them after they admitted they thought it was a good idea to make a deliberately unaligned AI that hides what it's doing and sabotages the user, this from the company that claims they're the only people who can be trusted to make \"safe\" AI."}, {"id": 50669170, "au": "infogulch", "dom": 197, "sr": 142, "sc": 2.57, "ep": 3.76, "bs": 1.19, "d": 0, "age": 14.65, "grav": 158.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 11995, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 0.669, "fa": 0.0, "gp": 1.51, "bl": 0.45, "ds": 0.0, "txt": "Deliberate subversive misalignment with the user's intentions is an extremely dangerous direction to take LLM training."}, {"id": 50668203, "au": "threecheese", "dom": 275, "sr": 143, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 0, "age": 16.11, "grav": 183.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": , "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1233, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.007, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I can burn a lot of tokens on the anthropic sub - swapping harness definitely is a choice, so I don't want to do it often. Who else other than oai offers something similar?"}, {"id": 50673080, "au": "rbracco", "dom": 146, "sr": 147, "sc": 2.36, "ep": 4.88, "bs": 2.52, "d": 3, "age": 7.45, "grav": 57.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.317, "fa": 0.34, "gp": 0.559, "bl": 0.95, "ds": 0.0, "txt": "Yes, this is usually done on a very small amount of data. Generally 1-4 batches and a large number of epochs (e.g 1000 and you can kill the run if loss goes to zero)"}, {"id": 50667545, "au": "oytis", "dom": 298, "sr": 148, "sc": 2.36, "ep": 2.36, "bs": 0.0, "d": 3, "age": 17.12, "grav": 202.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 4367, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.004, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Where are they moving? Maybe let them move and provide reliable service and the users will be yours?\n\nI haven't seen a lot of new and desirable features on the products I use recently"}, {"id": 50674388, "au": "hellohello2", "dom": 17, "sr": 149, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 3, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 251, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To opus 5.5 or the initial opus 5? Falling back to 5.5 doesn't seem like a huge deal, that's certainly no sabotage. Although it does goes to show how badly models we need open models."}, {"id": 50665663, "au": "baobabKoodaa", "dom": 225, "sr": 150, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 2, "age": 20.33, "grav": 267.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 5871, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.94, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Infuriating how Anthropic claims to \"limit Claude's effectiveness\" only for \"frontier LLM development\", but then Anthropic actually sabotages pixel art creation for games, which is a pretty innocuous use case, and really far from frontier LLM development."}, {"id": 50669025, "au": "embedding-shape", "dom": 93, "sr": 151, "sc": 2.16, "ep": 2.16, "bs": 0.0, "d": 5, "age": 14.84, "grav": 161.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 21423, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 0.819, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Such a stupid thing to limit what harness you can use. So what if I always use my own harnesses for everything? Let me pay you and use your service goddammit, don't dictate how I use it, I already begrudgingly accept you want to dictate what I use it for, don't make it even worse."}, {"id": 50672850, "au": "JDups", "dom": 11, "sr": 152, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 5, "age": 7.97, "grav": 62.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 113, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.908, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Months is not a long time at all.\n\nAnd big tech has repeatedly demonstrated over decades that they will act as unethically as they think they can get away with, and the past decades have shown that they can get away with a lot. Dismissing past behavior only serves them, they will keep trying and pushing to get things their way."}, {"id": 50671458, "au": "harry8", "dom": 68, "sr": 153, "sc": 2.12, "ep": 2.12, "bs": 0.0, "d": 4, "age": 11.14, "grav": 103.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 9050, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unsloth claims that you can train and alter weights. You can do that with SCC open weight model. “Ablierated” Can’t do it with openau anthropic."}, {"id": 50670925, "au": "koolherc", "dom": 108, "sr": 154, "sc": 2.1, "ep": 2.1, "bs": 0.0, "d": 4, "age": 12.03, "grav": 116.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 127, "kpp": 7.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.892, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I know you’re right and artifacts are just html. But GitHub is just git, and Dropbox is just rsync (or well, something like that). Lock-in is more of a psychology question rather than technology, because that’s just how people work. Working with Claude designs and artifacts is just slightly bit more convenient than working with html directly, so people are sticking with that."}, {"id": 50669213, "au": "user43928", "dom": 47, "sr": 155, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 2, "age": 14.59, "grav": 157.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 0.85, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "Not to mention that this Pixel art training pipeline hardly looks like a frontier LLM by any stretch of the imagination."}, {"id": 50674688, "au": "drdeca", "dom": 79, "sr": 156, "sc": 2.08, "ep": 2.08, "bs": 0.0, "d": 4, "age": 3.4, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 224, "qw": 0, "k": 2661, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.571, "fa": 0.22, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "I’d like to give a caveat to this. As part of this computing F(context),\n\nWell, as I understand it, a lot of what it computed in those previous time-steps, while it could recompute them, it is instead cached. And, of course, that doesn’t change the output, just how quickly it is produced, but, I think it highlights how much of the computations it was doing as part of producing those previous tokens, it has access to when producing the current next token.\n\nSo, I would argue that in a sense, it does have access to a lot of “what it was thinking” (so to speak) during those previous tokens, even though the output it would give is the same regardless of whether the previous tokens it is given in its context were actually obtained by it producing those tokens previously, or whether they were obtained another way (provided that the tokens in the situation are the same).\n\nSo, like, AIUI, if you have it generate some text, and then ask it “what it was thinking” during that text, it will have access to that in a sense, but if you instead randomly generated some bytes that by pure chance happened to be the same bytes, and included that as context for what it previously said, and ask the same question about “what it was thinking”, the (distribution over) response(s) will be the same."}, {"id": 50671680, "au": "johncolanduoni", "dom": 57, "sr": 157, "sc": 2.05, "ep": 2.05, "bs": 0.0, "d": 2, "age": 10.68, "grav": 96.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5469, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 0.874, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t think not letting your competitors use your own product to help them compete with you counts as anti-competitive in the sense of US anti-trust law. There’s no collusion or active interference with a competitors business."}, {"id": 50666676, "au": "raylad", "dom": 115, "sr": 158, "sc": 1.98, "ep": 1.98, "bs": 0.0, "d": 1, "age": 18.44, "grav": 228.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 9, "qw": 17, "k": 1147, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://github.com/rladr-org/reviewer-agent"], "ig": 0.357, "fa": 0.0, "gp": 0.787, "bl": 0.0, "ds": 0.0, "txt": "> Guess in the future I need at least two competing models that watch what each other is doing.\n\nMy Claude Code and Codex plugin does exactly that.\n\nhttps://github.com/rladr-org/reviewer-agent"}, {"id": 50664971, "au": "corobo", "dom": 247, "sr": 159, "sc": 1.98, "ep": 3.17, "bs": 1.19, "d": 0, "age": 21.93, "grav": 303.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 8600, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 0.891, "fa": 0.0, "gp": 0.743, "bl": 0.45, "ds": 0.0, "txt": "If this is why my cat flap
