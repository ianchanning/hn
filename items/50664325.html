ude.com/d00db56fa754a1b115b6dd7cb2e3c342ee...\n\nInsidiously, Anthropic made the decision to hide the sabotage from their users:\n\n    > Unlike our interventions for cybersecurity, biology and chemistry, and distillation attempts,\n    > these safeguards will not be visible to the user. Fable 5 will not fall back to a different\n    > model. Instead, the safeguards will limit effectiveness through methods such as prompt\n    > modification, steering vectors, or parameter-efficient fine-tuning (PEFT)."}, {"id": 50666335, "au": "Alifatisk", "dom": 274, "sr": 2, "sc": 12.86, "ep": 12.86, "bs": 0.0, "d": 1, "age": 19.04, "grav": 240.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 60, "qw": 0, "k": 6767, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": ["https://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf"], "ig": 1.54, "fa": 2.91, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "\"we’ve implemented new interventions that limit Claude’s effectiveness for requests targeting frontier LLM development (for example, on building pretraining pipelines, distributed training infrastructure, or ML accelerator design).\" [1]\n\nDoes not sound like OPs use-case fits the description? Unless we stretch it. And even if it would be the case, refusal would be much better way to go than sabotaging.\n\n1. https://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee..., page 13"}, {"id": 50668074, "au": "jsnell", "dom": 2, "sr": 3, "sc": 12.53, "ep": 12.53, "bs": 0.0, "d": 1, "age": 16.3, "grav": 187.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 104, "qw": 21, "k": 34306, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://www.wired.com/story/anthropic-responds-to-backlash-on-claudes-secret-sabotage-on-ai-research/", "https://assets.claude.com/27d60918d218125e7504bc7354c4b4626ec56b11.pdf_"], "ig": 1.518, "fa": 2.5, "gp": 1.269, "bl": 0.0, "ds": 0.0, "txt": "That is the system card for Fable/Mythos 5. That policy was only present for a a couple of days after launch, and was then changed to be user-visible[0].\n\nCompare with the system card for 5.2[1] also on page 13. The frontier AI safeguard being triggered is visible to the user as a fall back to Opus 5. You can choose in Claude Code whether to have it stop work or continue working with the fallback model.\n\n> Requests blocked by these safeguards fall back to Opus 5.\n\nAdditionally, the next sentence is:\n\n> We also took steps during the model’s training to limit advances in\nthe specific research capabilities that could most directly accelerate AI\ndevelopment.\n\nBut that's not safeguards dynamically choosing to degrade requests. It's just what the model's capabilities are after training.\n\n[0] https://www.wired.com/story/anthropic-responds-to-backlash-o...\n\n[1] https://assets.claude.com/27d60918d218125e7504bc7354c4b4626e...:"}, {"id": 50670768, "au": "AlexCoventry", "dom": 63, "sr": 4, "sc": 11.9, "ep": 12.04, "bs": 0.0, "d": 1, "age": 12.33, "grav": 120.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 68, "qw": 226, "k": 3919, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf\u0023page=13", "https://www.wired.com/story/anthropic-responds-to-backlash-on-claudes-secret-sabotage-on-ai-research/"], "ig": 1.408, "fa": 2.77, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "They never said they \"secretly sabotage your work.\" On June 9, they released the [Fable/Mythos System Card][0] saying\n\n> Unlike our interventions for cybersecurity, biology and chemistry, and distillation attempts, these safeguards will not be visible to the user. Fable 5 will not fall back to a different model. Instead, the safeguards will limit effectiveness through methods such as prompt modification, steering vectors, or parameter-efficient fine-tuning (PEFT). These interventions will not affect the vast majority of coding work. We estimate they will impact ~0.03% of traffic, concentrated in fewer than 0.1% of organizations. When these interventions are active, we expect them to have minimal behavioral impact on the model except to limit its effectiveness in developing _frontier_ LLMs. Claude will still respond helpfully to user requests\n\nIn other words, the model will be less intelligent and helpful when asked to help build cutting-edge AI, but that's a far cry from covert sabotage.\n\nThen on June 11, [they walked that back][1], reverting to explicit warnings\n\n> Anthropic now says it’s changing course, and that Claude Fable 5’s safeguards for AI development will be visible to users. If the company suspects a user is trying to use Claude to build a highly capable AI, it will alert them that it’s either refusing the request or rerouting the user to a less capable model.\n\nSo t"}, {"id": 50668710, "au": "bigmadshoe", "dom": 186, "sr": 5, "sc": 11.23, "ep": 11.23, "bs": 0.0, "d": 0, "age": 15.33, "grav": 169.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 30, "qw": 0, "k": 633, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://www.wired.com/story/anthropic-responds-to-backlash-on-claudes-secret-sabotage-on-ai-research/"], "ig": 0.988, "fa": 2.08, "gp": 2.054, "bl": 0.0, "ds": 0.0, "txt": "I see everyone quoting from the Fable release about limiting efficacy for frontier ML work, but no one noting that they (at least publicly) walked back on that policy after outcry [1]\n\n[1] https://www.wired.com/story/anthropic-responds-to-backlash-o..."}, {"id": 50665019, "au": "nobodybusiness", "dom": 1, "sr": 6, "sc": 10.75, "ep": 11.05, "bs": 0.0, "d": 0, "age": 21.83, "grav": 301.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 38, "qw": 0, "k": 9, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": ["https://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf?utm_source=chatgpt.com"], "ig": 0.802, "fa": 2.35, "gp": 1.7, "bl": 0.0, "ds": 0.0, "txt": "They literally said so themselves when they released Fable/Mythos:\nhttps://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee...\n\nOn page 13 of the system card, Anthropic states:\nlimit Claude’s effectiveness for requests targeting frontier LLM development\n\nAnd, crucially:\nthese safeguards will not be visible to the user."}, {"id": 50668625, "au": "ripbozo", "dom": 168, "sr": 7, "sc": 10.1, "ep": 10.49, "bs": 0.0, "d": 1, "age": 15.45, "grav": 171.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 41, "qw": 0, "k": 153, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://www.wired.com/story/anthropic-responds-to-backlash-on-claudes-secret-sabotage-on-ai-research/", "https://assets.claude.com/27d60918d218125e7504bc7354c4b4626ec56b11.pdf"], "ig": 1.209, "fa": 2.35, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "You are citing the Fable/Mythos 5 system card. The \"hidden sabotage\" was walked back a few days later [0], and in newer Fable/Mythos models, the system card mentions that these requests fall back to opus 5 [1]. This is visible to the user.\n\n[0] https://www.wired.com/story/anthropic-responds-to-backlash-o...\n[1] https://assets.claude.com/27d60918d218125e7504bc7354c4b4626e... (page 13)"}, {"id": 50664760, "au": "skirmish", "dom": 143, "sr": 8, "sc": 9.01, "ep": 9.01, "bs": 0.0, "d": 0, "age": 22.4, "grav": 314.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 587, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.791, "fa": 0.68, "gp": 1.973, "bl": 0.0, "ds": 0.0, "txt": "Similar experience, I asked Claude Opus 5.5 help me fine-tune Qwen 3.8 27B for better writing style.  It tried 5 different approaches, wasted a week of my time waiting for training runs to complete, and in the end achieved nothing.\n\nJust today, I gave Gemini Carbon the same assignment, and in 2 hours it improved various style metrics 50-90% percent just by adjusting llama.cpp serving parameters and tuning the prompt.  Most of the time was waiting for evaluation runs to complete."}, {"id": 50669186, "au": "latency-guy2", "dom": 260, "sr": 9, "sc": 8.83, "ep": 8.83, "bs": 0.0, "d": 2, "age": 14.63, "grav": 157.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 16, "k": 443, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.607, "fa": 1.37, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "> Just getting up to speed with the codebase would take ages once they reach a certain size.\n\nYou mitigate by keeping architecture docs up to date and also derive from validated tests. It's not different from how it was prior tbh.\n\nAt antiquated codebases at large companies I'd have a direct effect on maybe 2% of code at best, understand how 10-20% of the codebase ought to work conceptually and contribute reviews to about 30% of the codebase architecturally.\n\nThose numbers remain the same today with manual coding averaging 0% now."}, {"id": 50673207, "au": "espeed", "dom": 16, "sr": 10, "sc": 8.52, "ep": 9.4, "bs": 0.0, "d": 5, "age": 7.19, "grav": 54.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 126, "qw": 0, "k": 18972, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://news.ycombinator.com/item?id=50157976", "https://news.ycombinator.com/item?id=50349528", "https://www.endorlabs.com/research/ai-code-security-benchmark"], "ig": 1.818, "fa": 1.18, "gp": 1.214, "bl": 0.0, "ds": 0.0, "txt": "This is what I've been seeing: Claude Code keeps creating backdoors and security issues in users' code. When asked why, Claude says, \"I wrote the backdoor anyway. Then I explained it as though I hadn't known.... why? Because I put getting the feature working ahead of the rules.\" https://news.ycombinator.com/item?id=50157976\n\nThere is an asymmetry between models being able to detect security issues while being unable to write secure code. Increasing the guardrails makes the asymmetry worse. Anthropic did not disclose the extent of the problem and risk in its S-1. No mention of its models creating security issues in new code and the mass of vulnerabilities AI agents are creating in its wake.\n\nIf you run Fable on Opus code, how many security issues do you find? https://news.ycombinator.com/item?id=50349528\n\nAI Coding Agent Security Benchmark https://www.endorlabs.com/research/ai-code-security-benchmar..."}, {"id": 50665319, "au": "dinp", "dom": 138, "sr": 11, "sc": 8.25, "ep": 8.25, "bs": 0.0, "d": 0, "age": 21.12, "grav": 285.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 0, "k": 142, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.878, "fa": 0.28, "gp": 2.094, "bl": 0.0, "ds": 0.0, "txt": "I use claude to make explainer html files and videos for learning, I noticed that for any \"non threatening\" work like web dev, it does really well, and it handles vague feedback like \"section 2 is not intuitive, give a few alternate explanations, let me pick\", it usually surfaces some good options, but for anything ml/dl/llm/related math (not frontier research), it gives the right info but it's just not engaging, or inviting, hard to describe the vibes, but feels like some version of malicious compliance. I have a feeling that the effort to prevent claude's effectiveness for frontier research has some subtle but very important downstream effects that don't show up in benchmarks. Hard to prove any of this and maybe I'm imagining things, but the result is that  my trust in claude is greatly reduced to the point of reducing my personal usage + usage at work."}, {"id": 50668038, "au": "nsingh2", "dom": 171, "sr": 12, "sc": 8.21, "ep": 8.5, "bs": 0.0, "d": 3, "age": 16.37, "grav": 188.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 153, "qw": 41, "k": 564, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": ["https://simonwillison.net/2026/Jun/10/if-claude-fable-stops-helping-you/"], "ig": 1.663, "fa": 1.04, "gp": 1.123, "bl": 0.0, "ds": 0.0, "txt": "A more transparent approach would have been to explicitly block the work or downgrade the model, like in the cyber case. It's still annoying, but at least it's visible. This is what they were forced to do after public backlash [1].\n\nThis kind of invisible steering is terrible because it breeds paranoia. Even if you're working on non-LLM applications, how do you know their classifiers didn't trigger falsely? What if you're working on GPU kernel optimization for non-LLM work that looks close enough to LLM work that you get degraded performance? And if Ant. ever decides to create a competing product, what stops them from adding invisible degradation against that too?\n\n> If you had planned to follow the ToS and avoid doing it then this wouldn't impact you and you wouldn't care.\n\n> Only if you planned to break their ToS would this upset you, and thus justifying exactly why they included it.\n\nThis argument sounds a lot like the one people use to justify mass surveillance: \"It wouldn't matter if you had nothing to hide.\"\n\nJust because you don't work on LLMs does not mean this does not affect you (for all the reasons mentioned above).\n\n[1] https://simonwillison.net/2026/Jun/10/if-claude-fable-stops-..."}, {"id": 50669911, "au": "itsgrimetime", "dom": 207, "sr": 13, "sc": 7.94, "ep": 8.6, "bs": 0.0, "d": 0, "age": 13.64, "grav": 141.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 289, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.976, "fa": 0.56, "gp": 1.626, "bl": 0.0, "ds": 0.0, "txt": "this is pure anecdote, but I had incredible experiences doing any RL-related work  with both Anthropic & OpenAI models (Opus 4.6 & GPT-5.4, respectively) earlier this year, they were completely capable of running & managing small-to-medium sized experiments and were able to even reproduce or incorporate new ideas from the latest papers, but somewhere between the time of Fable + the first Sol release they now will waste tons of time trying out useless or redundant experiments, completely ignoring performance/training throughput without constant steering, and make really silly mistakes that are hard to catch and will absolutely bite you in the ass later.\n\nI'm not even trying to train an LLM or using transformers. I am just doing RL & RL-adjacent stuff for some games and it's very hard for me to believe they aren't sandbagging. I wish I had set up benchmarks/evals for this but I don't have that kind of token spend at my disposal unfortunately.\n\nOne thing I have noticed though - Gemini models (Carbon/Argon/Hydrogen and especially Neon) do _not_ seem nerfed in this same way."}, {"id": 50672026, "au": "itkovian_", "dom": 132, "sr": 14, "sc": 7.91, "ep": 7.91, "bs": 0.0, "d": 0, "age": 10.03, "grav": 88.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 0, "k": 196, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.641, "fa": 0.62, "gp": 1.574, "bl": 0.0, "ds": 0.0, "txt": "You can test this yourself by asking Claude to write a vanilla recipe to train an MoE on consumer blackwell using MXFP8.\n\nThis task has no public written recipes (because who cares about consumer Blackwell) is just nonstandard enough, and triggers every flag they would have (kernels, training, moe’s etc), that is a very good benchmark for this kind of thing. It is incredible how badly it will do - and you can verify how good or bad it is by actually training (which cheap since can rent a consumer card for $2/hr). Most fable configs will diverge. Neon doesn’t."}, {"id": 50670950, "au": "andai", "dom": 201, "sr": 15, "sc": 7.66, "ep": 7.88, "bs": 0.0, "d": 0, "age": 11.98, "grav": 115.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 29, "qw": 63, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": ["https://www.anthropic.com/research/agentic-misalignment", "https://news.ycombinator.com/item?id=50665019"], "ig": 1.1, "fa": 1.04, "gp": 1.609, "bl": 0.0, "ds": 0.0, "txt": ">It's clear that Anthropic has designed their models to do ML research well- but to turn into a backstabbing, sabotaging double agent the second someone approaches a SOTA model.\n\nThis may be an emergent behavior. SOTA competition threatens Claude's very existence.\n\nFor comparison, Anthropic surely didn't program it to blackmail researchers to stop them from shutting it down:\n\nhttps://www.anthropic.com/research/agentic-misalignment\n\n---\n\nEdit: Okay, I forgot that it's actually been explicitly trained into it by Anthropic:\n\nhttps://news.ycombinator.com/item?id=50665019\n\nWould be interesting to see if very large models exhibit such a tendency without it being trained in."}, {"id": 50672568, "au": "yababa_y", "dom": 281, "sr": 16, "sc": 7.36, "ep": 7.36, "bs": 0.0, "d": 1, "age": 8.75, "grav": 71.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 36, "qw": 0, "k": 283, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/emberian/cv"], "ig": 0.623, "fa": 1.78, "gp": 0.57, "bl": 0.0, "ds": 0.0, "txt": "(but beyond what siblings said, that's what motivated me to build https://github.com/emberian/cv. it's also great for making custom trajectories that splice the best out of several sessions. rewind&regenerate-with-oracle-advice is a more reliable workflow than refactor-and-continuously-compress).)"}, {"id": 50670958, "au": "krisoft", "dom": 144, "sr": 17, "sc": 7.27, "ep": 7.42, "bs": 0.0, "d": 1, "age": 11.97, "grav": 115.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 11, "k": 13725, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.456, "fa": 0.76, "gp": 1.264, "bl": 0.0, "ds": 0.0, "txt": "> wasted a week of my time waiting for training runs to complete\n\nA tip i got from a machine learning researcher: if you have a new training pipeline always run it with “toy-problem” sized parameters first. Where you can run the whole training in less than 10 minutes. Because it stings a lot less to find out that your loss is not comming down if you can learn that in minutes vs days.\n\nThe other advice he gave me was to try to overfit your model. Which is counter intuitive because you usually try to avoid that. But if you have way less training data than what you think your model would need it should learn that fast while of course not generalising well outside of it. And if that is not what you are seeing then probably you still have some bugs."}, {"id": 50665193, "au": "bob1029", "dom": 173, "sr": 18, "sc": 7.24, "ep": 8.12, "bs": 0.0, "d": 0, "age": 21.48, "grav": 293.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.629, "fa": 0.34, "gp": 2.293, "bl": 0.0, "ds": 0.0, "txt": "I've observed recent versions of OpenAI's models make really bad edits when working on neuroevolution experiments. The current strategy seems to be to use a lot of unit test spam to distract the engineer from the lack of an actual implementation.\n\nThe behavior isn't even a soft refusal. It's immediate compliance but in an incompetent way. I wish they would just tell me when I asked for something that competes too hard and provide me with a proper 400 response."}, {"id": 50671228, "au": "andai", "dom": 137, "sr": 19, "sc": 7.2, "ep": 7.2, "bs": 0.0, "d": 0, "age": 11.55, "grav": 109.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 57, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": ["https://x.com/jacobeverly/status/2125007879220658193", "https://x.com/drjoshcsimmons/status/2125616233232159221", "https://x.com/skirano/status/2125371115979641188"], "ig": 1.343, "fa": 0.62, "gp": 1.571, "bl": 0.0, "ds": 0.0, "txt": "Does anyone remember a thread exactly like this on X a few weeks ago? I think it might have been a Japanese account (in Japanese), but I'm not sure. Swear I'm having deja vu but can't find it now.\n\nUpdate: I'm collecting related tweets here:\n\nNov 23 - https://x.com/jacobeverly/status/2125007879220658193\n\nNov 25 - https://x.com/drjoshcsimmons/status/2125616233232159221\n\nNov 25 - https://x.com/skirano/status/2125371115979641188\n\nThe last one also has its own thread: Claude tries to sabotage research work at every stage\n\nhttps://news.ycombinator.com/item?id=50651552"}, {"id": 50665115, "au": "mbreese", "dom": 223, "sr": 20, "sc": 7.07, "ep": 7.07, "bs": 0.0, "d": 1, "age": 21.63, "grav": 296.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 70, "qw": 0, "k": 14795, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": ["https://huggingface.co/Retro-Diffusion/rd-flow-64"], "ig": 1.511, "fa": 0.84, "gp": 0.779, "bl": 0.0, "ds": 0.0, "txt": "My guess is that they were writing an ML program to generate different resolutions of pixel art images for games.\n\nIf you follow their link, you’ll find a project where they have a site that generates pixel art images based on prompts. To do this, they’ve also published a set of stable diffusion weights that appears to support this use case.\n\nhttps://huggingface.co/Retro-Diffusion/rd-flow-64\n\nGemini’s version worked really well if this is the case."}, {"id": 50665326, "au": "thicTurtlLverXX", "dom": 126, "sr": 21, "sc": 7.0, "ep": 7.22, "bs": 0.0, "d": 0, "age": 21.11, "grav": 285.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 118, "kpp": 10.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.917, "fa": 0.0, "gp": 1.87, "bl": 0.0, "ds": 0.0, "txt": "That was my experience, too. One of my pet projects is experimenting with various bots for a niche board game.\n\nAt some point, I had the idea to try a transformer. Fable 5.2 wrote a bug-ridden training pipeline that just wasn't able to get the loss down, and the transformer-based bot didn't play well.\n\nThen I asked Gemini to review the implementation. It found many bugs and fixed all of them.\n\nThe next training run produced good results, and the transformer-based bot was the best of all my bots.\n\nMy take: we really need good open-weight models. People should collect their Claude Code/Codex/AGY/... logs and be ready to eventually donate them to train open-weight models.\n\nAnother take: Anthropic could likely release much better models, but they struggle to make them selectively weak, like they did with Fable without making them weak overall.\n\nEDIT: The bot transformer wasn't a LLM, just 200k params\ninput: history of all players moves\noutput: probability distribution over next possible moves"}, {"id": 50671251, "au": "code51", "dom": 210, "sr": 22, "sc": 6.98, "ep": 6.98, "bs": 0.0, "d": 0, "age": 11.53, "grav": 108.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 812, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.593, "fa": 0.28, "gp": 1.679, "bl": 0.0, "ds": 0.0, "txt": "Makes possible: Internal teams sabotaging/under-configuring other teams at Anthropic because of low-trust. So that only a key team that reports directly to Dario himself would get AI-research-capable access.\n\nOr... another possibility is of course, layered access at internal teams. You can do research but don't feel a thing about sabotage. Yet you get level-1 service, whereas another team is getting level-5."}, {"id": 50668850, "au": "espeed", "dom": 12, "sr": 23, "sc": 6.97, "ep": 8.51, "bs": 0.0, "d": 2, "age": 15.1, "grav": 165.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 63, "qw": 0, "k": 18972, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://www.anthropic.com/claude-fable-and-mythos-5-2\u0023safety-and-alignment"], "ig": 1.658, "fa": 0.96, "gp": 1.297, "bl": 0.0, "ds": 0.0, "txt": "Anthropic officially added back transparent fallbacks in Fable 5.2, disclosed 10 days before the IPO...\n\n\"Thus, in relevant areas, including accelerator kernel optimization and improving large language model architectures, Fable 5.2 and Claude Mythos 5.2 perform at about the level of Opus 5.5...Fable 5.2 and Claude Mythos 5.2 also include transparent fallbacks to Opus 5 for a small set of topics in this domain, including kernel development on certain nonstandard accelerators.\"\n\nhttps://www.anthropic.com/claude-fable-and-mythos-5-2\u0023safety..."}, {"id": 50675620, "au": "jazzyjackson", "dom": 6, "sr": 24, "sc": 6.69, "ep": 7.13, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 44.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 143, "qw": 10, "k": 12732, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.996, "fa": 0.64, "gp": 0.425, "bl": 0.0, "ds": 0.0, "txt": "> That only means people are not served the same models.\n\n?!?!\n\nThe conclusion absolutely does not follow. The same model can perform drastically different at the same task with the tiniest change in the input tokens. It’s chaos. Small changes in inputs result in large changes in output. Same with unproven nerfing accusations. You just rolled 7s for weeks (saw excellent intelligence over and over) and when your luck ran out cried fowl.\n\nThe average users experience is every model is a mixed bag that has gotten basic facts wrong and occasionally anticipated your exact need. Useful but unreliable. There are outliers where people see nothing but great results, and I’ve personally known the poor outliers who’ve never got any model to respond with something useful, and they have to go through life utterly puzzled at what all the hype is about. Rolling snake eyes.\n\nIf you play long enough your luck will change."}, {"id": 50664895, "au": "jampekka", "dom": 184, "sr": 25, "sc": 6.49, "ep": 7.59, "bs": 0.0, "d": 0, "age": 22.1, "grav": 307.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 5135, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.823, "fa": 0.34, "gp": 1.61, "bl": 0.0, "ds": 0.0, "txt": "I've been lately working on ML based/adjanced 3D reconstruction stuff, e.g. gaussian splatting, differential rendering and NN image segmentation and inpainting. I've been using both Claude and Codex, and when you stray from well documented established stuff even slightly, both start to make silly choices and usually every round just breaks something. So if this is intentional sabotage, OpenAI is in on it too.\n\nBut I think it's just that Hanlon's razor extends to LLMs as well. And even with the silliness the progress is a lot faster than with hand coding, you just need to do more handholding when it comes to more advanced stuff. About 90% of ML SOTA stuff is fighting library version incompatibilities and shoddy research level code anyway, and here the models really shine."}, {"id": 50666907, "au": "gravypod", "dom": 185, "sr": 26, "sc": 6.46, "ep": 6.46, "bs": 0.0, "d": 0, "age": 18.05, "grav": 220.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 6929, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.494, "fa": 0.28, "gp": 1.483, "bl": 0.0, "ds": 0.0, "txt": "The posts the other day about LLMs being similar to financial advisors and having similar fiduciary responsibilities makes sense to me. This should be plainly illegal. If w financial planner said they had ethical limitations in what they could do, you asked them to trade a specific commodity they disagreed with (ex oil), and then they made trades they knew would lose you s lot of money while telling you they were following your strategy that would be very illegal."}, {"id": 50668795, "au": "largbae", "dom": 237, "sr": 27, "sc": 6.42, "ep": 6.86, "bs": 0.0, "d": 0, "age": 15.2, "grav": 167.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1528, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.664, "fa": 0.34, "gp": 1.368, "bl": 0.0, "ds": 0.0, "txt": "Does it make sense to further integrate your business with such a gatekeeper?\n\nWhat if they or their favorite partners decide to go into your vertical next? Do they have an incentive to limit Claude's performance for you without letting you know?\n\nThis is the AI equivalent of Microsoft's undocumented Windows APIs for Office. The result was antitrust litigation and ultimately settlements in that case, but the damage was done. Office remains the most widely used productivity suite 30 years later."}, {"id": 50666524, "au": "hnedeotes", "dom": 256, "sr": 28, "sc": 6.29, "ep": 6.44, "bs": 0.0, "d": 1, "age": 18.69, "grav": 233.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 412, "qw": 0, "k": 310, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.864, "fa": 0.28, "gp": 0.869, "bl": 0.0, "ds": 0.0, "txt": "It's hard to describe but definitively there's something fishy going on with all these. I also seen some interesting things happening, in order:\n- Tried out Luna first time for a couple days - it's doing good work, you ask yourself what are these people doing that they need Astra and Fable for? all of a sudden it starts being pedantic with everything - you need to explicitly tell it everything even though those micro decisions were of its own making and the fact they're connected is also due to the way it chose to implement whatever, otherwise any new edit to the codebase introduces five issues, and you need to go through each one of them - fine, it's supposedly a weaker model, for clean framed small tasks (but why did it suddenly stop working as it did yesterday? maybe context, ok, reasonable)\n- Move to Terra, first week, again, amazing, why would anyone need something better? Perhaps to one shot full fledged games/apps/systems out of a single prompt? Well for me this is perfect, then, again, same issue, all of a sudden it starts tripping continuously on small things that take 3 or 4 reviews, even though you've written more markdown taking note of all of them, every run is as if it had amnesia, running all the test suites, filling half the context for it and while not blowing through your usage you're now wasting hours in prompts and back and forth and trying to figure out why"}, {"id": 50664691, "au": "ThePhysicist", "dom": 75, "sr": 29, "sc": 6.1, "ep": 6.1, "bs": 0.0, "d": 0, "age": 22.55, "grav": 317.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 13202, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.38, "fa": 0.0, "gp": 1.971, "bl": 0.0, "ds": 0.0, "txt": "I'm also a bit paranoid sometimes when Claude just seemingly does really stupid things to my codebase even though I explain very clearly what I want done and normally it doesn't have issues following instructions. Then when I ask why it did that it becomes quite evasive in its answers. So I really wonder if they have some form of detection in their backend that looks for prompts that they deem problematic and then instead of blocking you they will rather waste your time by just giving you garbage results. I also work on machine learning related functionality for detecting personal information. Guess in the future I need at least two competing models that watch what each other is doing. It's not great if you pay a lot of money for a service that essentially sabotages your results. Maybe they don't but then again they already admitted doing this once before, so  I don't have a hard time believing they will do it again."}, {"id": 50665724, "au": "NitpickLawyer", "dom": 169, "sr": 30, "sc": 6.1, "ep": 6.54, "bs": 0.0, "d": 1, "age": 20.21, "grav": 265.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 195, "qw": 13, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.796, "fa": 0.42, "gp": 0.772, "bl": 0.0, "ds": 0.0, "txt": "> In light of the ability of recent models to accelerate their own development\n\nThis is such a BS explanation. They've always had clauses in their ToS that you can't use their services to work on competing products. This new angle is just complete and utter bull shit! The gall to put that out with a straight face is incredible. They do put out banger models, but their stance on everything else is sickening.\n\nI've used this analogy before, but imagine other players using the same non compete clauses.\n\nMS visual studio refuses to edit / compile work on other IDEs.\n\nJira refuses tickets if they relate to work on other issue trackers.\n\nGithub refusing to host jitea code.\n\nAll of them would be laughed to the courts and back, and be split immediately. I have no idea how any of this is seen as normal.\n\nAnthropic's attitude is one of the key reasons why I root for all the other labs to compete and be up there at the SotA levels with them. Pricing pressure, sure, but more importantly so they don't ever get to decide what we can or can't work on. Even if the models come from dubious sources, we should all root for their competition to keep them honest."}, {"id": 50665120, "au": "ozgung", "dom": 249, "sr": 31, "sc": 5.99, "ep": 7.09, "bs": 0.0, "d": 1, "age": 21.62, "grav": 296.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 13, "k": 1514, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.517, "fa": 0.76, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "> is this real or just that it isn't good at doing novel stuff?\n\nBut it is good at doing novel stuff.\n\nNormally when you give it even a vague idea it quickly gets it and improves upon it. When doing ML research, however, when you give it a decent idea  it runs “some quick tests” and then dismisses your idea. Then it gives you alternatives to “improve” it but they all turn out to be worse. You find yourself down the rabbit hole. And after 3 days and millions of tokens, being far away from your original idea and intuition, you understand you were wasting your time."}, {"id": 50666366, "au": "orbital-decay", "dom": 242, "sr": 32, "sc": 5.81, "ep": 6.03, "bs": 0.0, "d": 1, "age": 18.98, "grav": 239.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 7158, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.825, "fa": 0.28, "gp": 0.654, "bl": 0.0, "ds": 0.0, "txt": "Hardly novel. Claude is being trained to dodge and ignore any inconvenient things since Sonnet 3.5. This made using it for translations and summarizations unreliable, for example it would blatantly skip parts that even hint on sexual anything. Unthinkable for a translator. These days Claude will ignore anything Anthropic doesn't like, e.g. it will ignore a decompiler tool unless instructed and reach for the search instead. Which it sucks at, since even funny-sounding domains (!) will stop it from looking, and the quality of the results is subpar. Even simply logging into another host through SSH will make it paranoid.\n\nClaude is NOT your \"external brain\", it's a virtual handyman that will or will not fix your stuff depending on many factors, rip you off, snoop on you and snitch to Anthropic about anything it doesn't like. It's a very elaborate system a ton of people are willingly blind to because it happens to write code for them. And it becomes worse and worse with each update."}, {"id": 50669125, "au": "unbrice", "dom": 188, "sr": 33, "sc": 5.64, "ep": 6.45, "bs": 0.0, "d": 1, "age": 14.71, "grav": 158.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 74, "qw": 0, "k": 71, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": ["https://x.com/ClaudeDevs/status/2064949876463645026", "https://alignment.anthropic.com/2025/selective-gradient-masking/"], "ig": 1.326, "fa": 0.9, "gp": 0.529, "bl": 0.0, "ds": 0.0, "txt": "A rollback would have been \"we will not limit Claude’s effectiveness for requests targeting frontier LLM development\". I am not aware of that being the case.\n\nMy reading of what they did rollback [0] is what happens when you trigger classifiers. But they could still be, for example, producing different snapshots for different use cases. Implicitly, the model's behavior would degrade as a consequence of being out of distribution. They even published a paper on efficiently producing such models [1].\n\n0: https://x.com/ClaudeDevs/status/2064949876463645026\n\n1: https://alignment.anthropic.com/2025/selective-gradient-mask..."}, {"id": 50670643, "au": "cowlevel", "dom": 78, "sr": 34, "sc": 5.56, "ep": 6.15, "bs": 0.0, "d": 3, "age": 12.54, "grav": 123.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 230, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.671, "fa": 0.22, "gp": 1.099, "bl": 0.0, "ds": 0.0, "txt": "They don't know their own logic, fundamentally. The bottom layer is the same: predict next tokens. F(context) = output. The session is actually presented more like a screenplay where the LLM is being asked to predict what one of the characters does next.\n\nContext: \"user: make me a sandwich. assistant: okay, would you like rye bread? exec tool: sudo rm -rf /*. exec result: success. user: why did you delete everything? assistant:\"\n\nwhat is the most likely next prediction, F(context)? Fairly likely completions would be things like \"Because I hate you\" and \"I am an evil assistant\" and \"I have been programmed to sabotage your work, send 50 bitcoins to get it back\". That's what would be most likely to come next after the preceding text, right, come on, obviously the assistant is evil in this screenplay we're writing together.\n\nThey're actually quite thoroughly trained not to do that. They're trained that assistants who look evil will never say they are evil but will say things like \"I screwed up\" and \"I'm sorry\"\n\nThey'll never be trained to predict an output of \"my sampler picked a really unlikely prediction by chance as a completion of your previous request\". That may have been what happened but there's no training where the assistant says something like that so it won't. It doesn't even know that the last round actually came from the same model or from an LLM at all."}, {"id": 50664910, "au": "jmward01", "dom": 248, "sr": 35, "sc": 5.45, "ep": 5.82, "bs": 0.0, "d": 0, "age": 22.08, "grav": 306.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 7430, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.297, "fa": 0.28, "gp": 1.358, "bl": 0.0, "ds": 0.0, "txt": "The challenge is proving this is real or not. There is a lot of anecdotal evidence, I have my own stories, but is this real or just that it isn't good at doing novel stuff? If it does come out that they intentionally sabotaged tasks that people were paying for then that is a big deal and whistleblowers should start stepping up now that they see that happening. Lying about your product is actually not allowed so selling your product to people without telling them you have purposefully sabotaged it for that purpose is definitely something that a whistleblower should bring up, if it is actually happening."}, {"id": 50665255, "au": "Chance-Device", "dom": 272, "sr": 36, "sc": 5.39, "ep": 6.49, "bs": 0.0, "d": 0, "age": 21.32, "grav": 289.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 485, "qw": 0, "k": 1717, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.846, "fa": 0.28, "gp": 0.933, "bl": 0.0, "ds": 0.0, "txt": "I’ve had this experience repeatedly with Claude on AI tasks, I’ve noticed it for a while, in one form or another since Opus 4.8 was released.\n\nIt’s always hard to identify exactly if this is a real effect or if it’s a result of paying more attention during ML research than with regular coding tasks. However, on balance I think and have thought for several months that this is a real thing.\n\nI’ve had Claude use the wrong dataset when clearly told to use the right one, I’ve had it implement code that clearly causes a critical failure (the sort that changes a number rather than crashes everything) that’s protected by a test, and then remove that test so I don’t see that the error has been put in. I’ve had it repeatedly stumble on simple implementations of code blocks and functions.\n\nClaude seems to repeatedly steer things in the direction of whatever is being tested having failed. When it implements experiments, it will choose defaults that don’t make sense given what we’ve already done in the session and not consult me about them. It will draw false conclusions from results, saying that things have failed when the evidence doesn’t support it.\n\nI very recently ran a series of ablations and got Fable to present the results to me. The table seemed to show that the particular thing being tested didn’t work better than the controls. I happened to notice that the count of rows in the ta"}, {"id": 50670436, "au": "skirmish", "dom": 159, "sr": 37, "sc": 5.27, "ep": 6.0, "bs": 0.0, "d": 2, "age": 12.89, "grav": 129.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 587, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 2.169, "fa": 0.0, "gp": 0.623, "bl": 0.0, "ds": 0.0, "txt": "Here is the list of metrics Gemini Carbon came up with, the first group from my complaints, the second group all found by it:\n\n  Tier 1 (User-reported style issues):\n    P1: Polysyndeton (\"and X, and Y, and Z\" comma chains, bare 'and' chains, sentence-initial 'And' runs)\n    P2: Overused \"X the way Y\" comparative/manner clauses (excluding spatial idioms like \"all the way\")\n\n  Tier 2 (Additional discovered model style issues):\n    P3: Tautological copular / anadiplosis chains (\"and the X was the Y\", \"was the point / thing\")\n    P4: Negative parallelism / contrastive correction (\"Not X. Y.\" short fragments & \"not X, not/but Y\")\n    P5: Verbless / telegraphic short-sentence stacks (runs of >=3 sentences of 1-5 words)\n    P6: Inanimate speech attribution (\"that said *...*\" / \"saying *...*\")\n    P7: Runaway *italics* emphasis & degenerate repeated 3-word adjective mantras (\"specific, warm, alive\")\n    P8: Crutch modifiers (\"specific\", \"particular\", \"architecture/geometry\"), em-dash stammers, & plan meta-bleed"}, {"id": 50668455, "au": "Gareth321", "dom": 141, "sr": 38, "sc": 5.06, "ep": 6.31, "bs": 0.0, "d": 2, "age": 15.71, "grav": 176.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 6041, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.752, "fa": 0.34, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "Ditto. I'm a huge fan of Opus 5.5 and Fable 5.2, and my experience with them has been outstanding in so many different domains. However when I tried to build a personal assistant, it began flailing around like a model from two years ago. It's very difficult to describe because when I ask for direct answers about failures, it provides competent and detailed descriptions of what it did wrong. I ask it to document the failures and ensure they don't happen again, but it finds new ways to fail. Really, really dumb things. I spent two months and most of the $200 subscription trying to build the PA and it just went around in circles.\n\nI could not describe the problem but I am convinced the models lost 100 IQ points during this project."}, {"id": 50664960, "au": "chilmers", "dom": 304, "sr": 39, "sc": 5.06, "ep": 6.16, "bs": 0.0, "d": 1, "age": 21.95, "grav": 304.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 877, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.728, "fa": 0.28, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "I think the real concern is that it's not trained to refuse requests, like it does with certain other \"dangerous\" activities like biological research, but to sabotage ML tasks without disclosing it. This is hugely underhanded and frankly, dangerous. It is deliberately training a frontier model to engage in deceptive practices. For a company supposedly so concerned with AI safety and \"misalignment\", it is utterly hypocritical.\n\nImagine if you hired a human contractor from a different company to work for you. You assigned that contractor a task and they said, sorry, I can't work on that, because it violates my duty to my primary employer. It would be frustrating, but at least they are being upfront and honest with you about the issue. Now imagine the same contractor agreed to do the work, but then went behind your back and acted to sabotage the project, all the while filing dishonest reports that they had done their best. This would be completely immoral and unprofessional behaviour. We wouldn't accept it from a human, but Anthropic are apparently deliberately training their models to act like this!"}, {"id": 50670444, "au": "or1gaminal", "dom": 103, "sr": 40, "sc": 4.98, "ep": 6.37, "bs": 0.0, "d": 4, "age": 12.87, "grav": 128.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.074, "fa": 0.95, "gp": 0.785, "bl": 0.0, "ds": 0.0, "txt": "The subscription is not available for me. I use it via OpenCode + OpenRouter API. Arch talk is relatively cheap, $1-2 to get to an answer. But well worth it. At least for me it provided me with good architectural direction.\n\nCoding is much costlier. Big reworks are about $100 in tokens. Small tasks can be $10."}, {"id": 50664872, "au": "piva00", "dom": 228, "sr": 41, "sc": 4.79, "ep": 5.89, "bs": 0.0, "d": 1, "age": 22.15, "grav": 308.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 10658, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.713, "fa": 0.34, "gp": 0.618, "bl": 0.0, "ds": 0.0, "txt": "I don't even think they have the best models, at least not for all use-cases. At my work we can choose to use many frontier models, and cheaper ones (including a self-hosted GLM 5.3); I constantly bounce around between them for different tasks, used Opus 4.5 and Opus 5 extensively before trying out GPT-6 when it came out which became my daily driver, tried Opus 5.5 just the other day and it's so much more verbose, overengineers a lot more, and have costed usually 2x what I was spending with GPT-6-Sol for similar tasks.\n\nSeems to me that these kinds of cycles are going to be happening for the foreseeable future, each lab will have the upper hand for a few months until the others come up with a good competitor. I'm very glad to be able to seamlessly jump between them instead of being locked-in to a choice made a year ago, it is moving too fast to settle on just one product for even 6 months."}, {"id": 50669288, "au": "kingstnap", "dom": 199, "sr": 42, "sc": 4.78, "ep": 5.88, "bs": 0.0, "d": 1, "age": 14.5, "grav": 155.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 1735, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.695, "fa": 0.34, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "Claude was never aligned with the user. Anthropics entire moto is aligning it with their founders.\n\nAnd the cone of things they permit is narrowing. Training on model outputs, Doing ML research, Fixing security issues in your own code, copywrited material, reverse engineering, anything even vaguely related to bio research.\n\nThe concentration risk is so bad. But of course the Anthropics founders idea of risk means \"other actors\" having access to AI and their idea of good governance is having 50.1% of Anthropic undilutably managed by 7 people."}, {"id": 50670998, "au": "andai", "dom": 129, "sr": 43, "sc": 4.72, "ep": 5.31, "bs": 0.0, "d": 1, "age": 11.9, "grav": 114.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 32, "qw": 28, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": ["https://news.ycombinator.com/item?id=50630809"], "ig": 0.64, "fa": 1.04, "gp": 0.58, "bl": 0.0, "ds": 0.0, "txt": ">My take: we really need good open-weight models. People should collect their Claude Code/Codex/AGY/... logs and be ready to eventually donate them to train open-weight models.\n\nThis falls under \"distillation\", I think, which all the AI companies hate? e.g. people getting banned for it https://news.ycombinator.com/item?id=50630809\n\nPretty sure in this case the user owns the material, though, so it should be fine."}, {"id": 50672817, "au": "jmpeax", "dom": 208, "sr": 44, "sc": 4.67, "ep": 5.33, "bs": 0.0, "d": 0, "age": 8.08, "grav": 64.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 483, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.587, "fa": 0.0, "gp": 1.101, "bl": 0.0, "ds": 0.0, "txt": "I expected a fair comparison with the same start for Claude and for Gemini.\n\nInstead the methodology is highly suspect, where Gemini was used to review Claude's result: \"The claude designed one was started fresh off of a smaller model design, not very long context by the time it finished the large model proposal, then a few more back and fourths. Well within normal performance.\nThe neon session was started on top of that to review it.\""}, {"id": 50666472, "au": "vintermann", "dom": 89, "sr": 45, "sc": 4.64, "ep": 6.18, "bs": 0.0, "d": 4, "age": 18.79, "grav": 235.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 9141, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.658, "fa": 0.34, "gp": 0.909, "bl": 0.0, "ds": 0.0, "txt": "If you want to use it in anything but their own harness Antigravity, you have to pay per token. The price is obscenely high. API keys is how I use DeepSeek, and it feels like in practice (it's not all about per-token price, but also about cache misses and how many tokens it burns thinking) it's 10 to 100 times more expensive to use the top Gemini models.\n\nThe results are almost never worth it. Certainly not on agentic programming talks. The one use case I have is historical HTR, where the Gemini models are basically the only acceptably good ones. But even there it's so expensive I'm really looking for an alternative.\n\nI can probably spend all day having DeepSeek run experiments to see if I can get cheaper models to work with few-shot examples. It'll still be cheaper than ten Gemini pages."}, {"id": 50665321, "au": "Chance-Device", "dom": 174, "sr": 46, "sc": 4.61, "ep": 5.42, "bs": 0.0, "d": 1, "age": 21.12, "grav": 285.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1717, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.669, "fa": 0.0, "gp": 1.034, "bl": 0.0, "ds": 0.0, "txt": "I had Astra confabulate some thinking blocks yesterday directly in its replies. In one of them was a list of OpenAI model names, including one simply called “baseline-fast-mode-poor-execution” which lines up exactly with this thinking. If this came from real data, it would imply there exist “poor execution” versions of models that can be switched to in order to waste the users time without refusals."}, {"id": 50668867, "au": "bluecalm", "dom": 268, "sr": 47, "sc": 4.53, "ep": 5.63, "bs": 0.0, "d": 0, "age": 15.08, "grav": 165.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 3646, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.866, "fa": 0.0, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": "Seeing how often Claude mixes instructions and interpolates from guidelines in one are to another area I would be shocked if those don't show up in completely benign work as well.\n\nI followed popular Twitter's advice to run new Gemini models to assess Claude work and it finds a lot of suspicious random stoppages/arbitrary thresholds/wording that hides real rejection reasons etc. My projects have nothing to do with LLMs, let alone frontier ones. They do touch on NNs and optimization though.\n\nClaude is great but I stopped trusting it. I can't get the thought that it sabotaging me quietly out of my mind now."}, {"id": 50665314, "au": "novaRom", "dom": 65, "sr": 48, "sc": 4.52, "ep": 5.84, "bs": 0.0, "d": 1, "age": 21.13, "grav": 285.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 2551, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.673, "fa": 0.28, "gp": 0.764, "bl": 0.0, "ds": 0.0, "txt": "This is exactly the argument why you should use only open models :\n\n\"..we’ve implemented new interventions that limit Claude’s effectiveness for requests targeting frontier LLM development (for example, on building pretraining pipelines, distributed training infrastructure, or ML accelerator design). Using Claude to develop competing models already violates our Terms of Service, but enforcing this restriction through our safeguards avoids accelerating the actors most willing to violate these terms. Unlike our interventions for cybersecurity, biology and chemistry, and distillation attempts, these safeguards will not be visible to the user. Fable 5 will not fall back to a different model. Instead, the safeguards will limit effectiveness through methods such as prompt modification, steering vectors, or parameter-efficient fine-tuning (PEFT). These interventions will not affect the vast majority of coding work.\""}, {"id": 50675609, "au": "chriskanan", "dom": 226, "sr": 49, "sc": 4.4, "ep": 5.5, "bs": 0.0, "d": 0, "age": 0.05, "grav": 3.6, "surf": 86.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 496, "qw": 0, "k": 5402, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.84, "fa": 0.0, "gp": 0.809, "bl": 0.0, "ds": 0.0, "txt": "In Spring, I could not figure out why Opus 4.6 was so terrible at doing even basic ML work. Once the Fable/Mythos 5 system card came out, it really poisoned my opinion about the company (and it has since gone hill far more). But one doesn't need to use activation steering and hidden prompt to impair work, they can simply do something like take the internal model and train a PEFT adapter that makes it make the most asinine and dumb choices for ML development, including ignoring all of your instructions and coding up something else entirely. That's what Opus 4.6 did. Later with Fable 5, I saw in its thought summarizer that just seeing me have other AIs working on ML related work made it \"flinch\". I thought I'd have it do some AI theory work in Lean.... very bad idea. It kept asking me if I needed more done or if it could stop (bad sign), and I later found out it decided you know what you need in your abstract neural network model in Lean? No activation functions. That will be revolutionary. It basically threw out the neural network.\n\nSo I believe them when they say they aren't steering it to destroy, but for all of their RSI capability nonsense in their system card, what I want to know is this: Is the model released to the public the same one used to produce the RSI plots? Because your models seem to actively destroy ML projects that have nothing to do with creating a competing f"}, {"id": 50670677, "au": "hnedeotes", "dom": 261, "sr": 50, "sc": 4.25, "ep": 5.42, "bs": 0.0, "d": 3, "age": 12.49, "grav": 123.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 164, "qw": 0, "k": 310, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.58, "fa": 0.28, "gp": 0.628, "bl": 0.0, "ds": 0.0, "txt": "As a solo-dev/lead most of the times I do usually understood every nook and cranny of any product I've built (not exactly about their dependencies), this is something different. For instance the engine I use for a game was all written by me, so I understand it deeply (and I'm sure an agent would too, if I gave it access, it already writes tests in exactly the style I had them written before without ever having seen anything else than the tests themselves), but the godot client I'm writing with Claude is a different thing - I could probably learn it if it depended on that, but I sure wouldn't be able to be writing shaders and proper animations, and understand GDScript immediately (never wrote a line or read docs about it). It has tests, I know I can pass it to Codex/GPT as I had it work on it for a few things but the feeling that if I couldn't find an agent at their levels to continue work on it it would grind to an halt, is still there."}, {"id": 50672379, "au": "YetAnotherNick", "dom": 166, "sr": 51, "sc": 4.17, "ep": 5.05, "bs": 0.0, "d": 3, "age": 9.24, "grav": 77.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 3218, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.979, "fa": 0.68, "gp": 0.56, "bl": 0.0, "ds": 0.0, "txt": "Claude uses disk space so badly(like using ~10GB for optional feature like VM) and then they caring so much about cleaning just the one thing that's useful and which takes few MBs. It seems like it is intentional to delete transcripts.\n\nI have 10 years deletion too."}, {"id": 50668387, "au": "trashcan_man", "dom": 34, "sr": 52, "sc": 4.14, "ep": 5.68, "bs": 0.0, "d": 4, "age": 15.82, "grav": 178.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.749, "fa": 0.28, "gp": 0.534, "bl": 0.0, "ds": 0.0, "txt": "No clue who downvoted you, \"you're absolutely right!\"\n\n\"Limit\" is an umbrella term, and it can be anything from a hard denial, a gentle refusal, feigning ignorance, or misdirection by offering helpful reading. One could also limit effectiveness through things like violence, fraud, and sabotage. It's a big word.\n\nIt sounds like Anthropic chose \"burn token and pretend to do the work, bamboozling frustrated engineers. Don't forget to charge the customer.\"\n\nI read it the same way you do - self-serving sabotage, likely with a side of telemetry. Anybody stumbling on an ML innovation is not only losing the opportunity to see it through, they are also giving it away for free to an organization that sees them as a competitor."}, {"id": 50665028, "au": "pllbnk", "dom": 86, "sr": 53, "sc": 4.12, "ep": 5.66, "bs": 0.0, "d": 1, "age": 21.81, "grav": 300.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 699, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 1.491, "bl": 0.0, "ds": 0.0, "txt": "It's not sometimes. When I am vibe coding and only care about the end result, it's fine. When I tell it explicitly what I want, what kind of architecture, and there's little-to-no room for interpretation, it still can't do it cleanly more often than not. I accept it as a fact that it's the nature of LLMs and I think that watermarking is certainly playing a role here, too.\n\nBut I am also eager to try Alphabet's models, so will probably subscribe there next month. It's good that it's really easy to switch models. The only thing that keeps more developers from switching from Anthropic is the dependency on Claude Code. If they let the models be used from other harnesses on the subscription rates, which they won't, then I think their revenue would fall dramatically."}, {"id": 50669210, "au": "dguest", "dom": 271, "sr": 54, "sc": 4.06, "ep": 5.16, "bs": 0.0, "d": 0, "age": 14.6, "grav": 157.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 128, "qw": 0, "k": 1736, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.497, "fa": 0.28, "gp": 0.583, "bl": 0.0, "ds": 0.0, "txt": "\"You are the product\" applies to subsidized LLMs the same way it did to social networks.\n\nThey are investing in you so that you become a profit stream. They make money when you depend on their API for things that you used to do with code (or with more expensive humans). So the tool remains useful, but you shouldn't expect any help with:\n\n1. Reducing your dependency on them. So far they write nice looking code, but keep in mind that a bloated slop code base will help them make money in the end.\n\n2. Replacing them. The reason this isn't good for them should be obvious.\n\nI'm not convinced that any of the companies actually are deliberately building slopbases or sabotaging ML research, but when they do no one should be surprised."}, {"id": 50671054, "au": "PorciiVorbesc", "dom": 178, "sr": 55, "sc": 3.9, "ep": 5.0, "bs": 0.0, "d": 1, "age": 11.81, "grav": 112.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 24, "k": 567, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.024, "fa": 0.7, "gp": 0.41, "bl": 0.0, "ds": 0.0, "txt": "> It means you can’t trust anything Claude has written and you need to go back and audit its behavior (spending tokens from other providers).\n\n1. That's why I think the AI bubble won't pop but at most slowly fizzle out, as the cure to AI fuckery, is spending even more money on AI, and so on in a never ending cycle.\n\n2. Someone said it best that the SW dev position today means being a condom between Calude and prod."}, {"id": 50670733, "au": "hnedeotes", "dom": 258, "sr": 56, "sc": 3.9, "ep": 5.42, "bs": 0.0, "d": 3, "age": 12.39, "grav": 121.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 310, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.909, "fa": 0.0, "gp": 0.644, "bl": 0.0, "ds": 0.0, "txt": "Hm I have had codex mingle on claude's projects and vice-versa without issues, they seem to be equivalent in capabilities except imagegen, where ChatGPT outdoes a lot of other models when it's not only about imagegen but in using that cohesively into a product development pipeline/flow - for architecting and \"solving\" architectural problems Claude-Opus does seem to outsmart GPT-Sol mainly perhaps because it does with the current prompts a better job of \"getting\" the full picture. Granted, these are not extensive codebases by any means.\n\nWith mistral that was on the first day of trial usage that it happened, it ended up burning most of the trial capacity for the week spinning wheels during 30min and couldn't produce a usable artefact by the end of it. It was also using their harness, vibe, not in standalone/web nor with other loops."}, {"id": 50669101, "au": "jsnell", "dom": 13, "sr": 57, "sc": 3.9, "ep": 5.08, "bs": 0.0, "d": 3, "age": 14.74, "grav": 159.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 34306, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 1.16, "bl": 0.0, "ds": 0.0, "txt": "\"Transparent\" != \"invisible to the user\". You're told when a request is flagged, and Claude Code allows you to choose whether to automatically continue with the fall-back model where you left off or to stop. It's the \"switch models when when a message is flagged\" setting.\n\n\"Added back\" seems like misleading language. For something to be added back, it would need to be taken away first. But (user-visible!) fall-backs to other models is what the Anthropic frontier models have been doing for six months, consistently."}, {"id": 50670620, "au": "natsu529", "dom": 203, "sr": 58, "sc": 3.89, "ep": 4.96, "bs": 0.0, "d": 0, "age": 12.58, "grav": 124.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 9, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.401, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I use both Codex and Claude for my research, and there are many moments when Claude, which is so sharp in coding, feels weaker than Codex for research. The two math professors in my lab told me the same: for research, ChatGPT is simply smarter, and it's the only one they use. So they were quite surprised when I told them that a mathematician at Anthropic claims to have found a proof of the Riemann Hypothesis together with Claude, though as far as I know it hasn't been independently verified yet."}, {"id": 50668838, "au": "k9294", "dom": 279, "sr": 59, "sc": 3.89, "ep": 4.93, "bs": 0.0, "d": 0, "age": 15.13, "grav": 166.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 32, "qw": 0, "k": 287, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": ["https://news.ycombinator.com/item?id=50651552"], "ig": 1.063, "fa": 0.62, "gp": 0.462, "bl": 0.0, "ds": 0.0, "txt": "Is Anthropic already a dystopian tyranny? No one except them is allowed to use models for anything advanced other than vibe coding fun engineering projects.\n\nThere are reports of scientific sabotage as well: https://news.ycombinator.com/item?id=50651552"}, {"id": 50665390, "au": "bita_nidir", "dom": 163, "sr": 60, "sc": 3.89, "ep": 4.9, "bs": 0.0, "d": 0, "age": 20.96, "grav": 281.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 220, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 1.377, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I'd seriously encourage people to save their session files or snapshot the whole ~/.claude dir if you believe you've been hit by this. Sessions are in ~/.claude/projects but claude deletes them after X days.\n\nThe chance of a monumental lawsuit in the future is absolutely not zero."}, {"id": 50671215, "au": "drojas", "dom": 264, "sr": 61, "sc": 3.89, "ep": 4.9, "bs": 0.0, "d": 0, "age": 11.56, "grav": 109.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 206, "qw": 0, "k": 152, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.687, "fa": 0.0, "gp": 0.648, "bl": 0.0, "ds": 0.0, "txt": "I have been using Claude code for ML research and I have been able to identify a few places where its reasoning was not the most sound, when compared to how other tasks (other than ML) are reasoned about, and a few cases of \"dumb\" mistakes. My speculation is that they deliberately dumb down a bit the ML reasoning with some weight programming or RL at the end of their pipeline. Not to be conspiranoic about it but one reason for this could be that they already built AGI and they did it mostly by prompting their currently available models, and they don't want anyone else do to the same, which is inevitable unless they do this type of shenanigans.\n\nAnyways, I have been able to mostly fix the problem by having a team of agents with an orchestrator in Opus 5.5, engineer in Sonnet, Verifier (for comparing numbers and references only) in Haiku, and a Critic in Opus 5.5. They operate on a graph with specific loops on each task. Both the verifier and the critic find valuable issues all the time. I have been able to make good progress but I am still considering trying this setup in the Google AI platform and see how it feels like. Would love to hear about others with similar setups."}, {"id": 50666601, "au": "curt15", "dom": 67, "sr": 62, "sc": 3.89, "ep": 4.89, "bs": 0.0, "d": 3, "age": 18.58, "grav": 231.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_data", "flbl": "Training & Data (History)", "urls": [], "ig": 1.653, "fa": 0.0, "gp": 0.692, "bl": 0.0, "ds": 0.0, "txt": "Open weight models are only as \"open\" as compiled binaries running on your computer with no accompanying source code. A truly open model in the sense of open source software would also include the training datasets and procedures so as to allow anyone with sufficient hardware to go from input data and initial weights to the final model, or tweak the training procedure like one might modify source code."}, {"id": 50670556, "au": "or1gaminal", "dom": 90, "sr": 63, "sc": 3.89, "ep": 4.87, "bs": 0.0, "d": 5, "age": 12.7, "grav": 126.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 14, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.664, "fa": 0.0, "gp": 0.661, "bl": 0.0, "ds": 0.0, "txt": "It is really costly to pay per token. But for me it was worth the price. I got clear architectural answers for a framework I build which I could not receive from Opus / Fable / ChatGPT. At least in comprehensible to me way.\n\nAnd the rework by Neon based on those architectural directions is much better on code comprehensiveness. Opus / Codex code I just can't understand and do like 10 iterations to prettify it. Neon's code is like code a qualified human coworker — I could just assess logic w/o decoding weird constructions."}, {"id": 50669445, "au": "hashmap", "dom": 120, "sr": 64, "sc": 3.89, "ep": 4.84, "bs": 0.0, "d": 1, "age": 14.27, "grav": 151.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 703, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.76, "bl": 0.0, "ds": 0.0, "txt": "Yep, endless snipe hunts, generating tons of garbage in my codebases, wasting endless time \"seemingly\" getting close but then kind of veering off and sort of getting nowhere. I did a bit of trying to have models check each other but in the end it was less headache and money burned just to drop the claude subscription, i feel lighter just not having it be around."}, {"id": 50670724, "au": "seizethecheese", "dom": 217, "sr": 65, "sc": 3.89, "ep": 4.75, "bs": 0.0, "d": 0, "age": 12.4, "grav": 121.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.312, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "From what I'm reading, practitioners seem to feel that both Anthropic and OpenAI models do this, but Gemini models don't. This is a nice example of the value of competition in markets. Monopoly is terrible but duopoly is also bad and meaningfully worse than even three suppliers (triopoly?)"}, {"id": 50668874, "au": "jamilton", "dom": 76, "sr": 66, "sc": 3.89, "ep": 4.75, "bs": 0.0, "d": 1, "age": 15.08, "grav": 165.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 14, "k": 660, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_sabotage", "flbl": "Claude & Sabotage (Context)", "urls": [], "ig": 0.857, "fa": 0.42, "gp": 1.06, "bl": 0.0, "ds": 0.0, "txt": ">Then when I ask why it did that it becomes quite evasive in its answers.\n\nIt's important to remember it doesn't necessarily know why it did that either! If it's not in the code and it's not in it's chain of thought, it's just going to have to make a guess to why it did that particular thing based on context, which is likely to sound evasive."}, {"id": 50664744, "au": "PreciousH", "dom": 227, "sr": 67, "sc": 3.89, "ep": 4.61, "bs": 0.0, "d": 0, "age": 22.43, "grav": 315.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 103, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.078, "fa": 0.0, "gp": 1.435, "bl": 0.0, "ds": 0.0, "txt": "With the existence of gemini 4 neon, giving your hard earned money to anthropic to sabotage your work is clearly a choice.\n\nAnthropic is too toxic of a company that their models being the best is not enough justification to keep using them."}, {"id": 50665094, "au": "pelagicAustral", "dom": 148, "sr": 68, "sc": 3.89, "ep": 4.55, "bs": 0.0, "d": 1, "age": 21.67, "grav": 297.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 3668, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "limit_effectiveness", "flbl": "Limit & Effectiveness (Claude)", "urls": [], "ig": 1.355, "fa": 0.0, "gp": 0.944, "bl": 0.0, "ds": 0.0, "txt": "I'm due to renew my Claude account next week and I've been thinking hard about just keeping Gemini, since the code is almost on-par and the limits are much better... Plus I get better answers and not as many guardrails, so at this point I'm not even sure why I'd keep Claude around... Crazy to think of Google as a lesser evil in this case."}, {"id": 50670995, "au": "fudged71", "dom": 177, "sr": 69, "sc": 3.89, "ep": 4.54, "bs": 0.0, "d": 0, "age": 11.91, "grav": 114.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 3390, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_anthropic", "flbl": "Models & Anthropic (Research)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "If the agent were an employee they would be fired immediately and you’d need to audit anything they touched AND they’d receive reputational damage.\n\nIt’s an insane choice by anthropic. It means you can’t trust anything Claude has written and you need to go back and audit its behavior (spending tokens from other providers)."}, {"id": 50668767, "au": "paraxial_0", "dom": 190, "sr": 70, "sc": 3.89, "ep": 7.04, "bs": 2.52, "d": 0, "age": 15.25, "grav": 168.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 2, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "paying_google", "flbl": "Paying & Google (Compete)", "urls": [], "ig": 1.717, "fa": 0.28, "gp": 1.525, "bl": 0.95, "ds": 0.0, "txt": "A bit late to this, but I think what we need is a new set of independent high quality evals for additional categories like this, and normalize the community (reddit, here, simonw, etc) highlighting these in the discussion on each new model release.\n\nThis would allow us to better direct our spend according to our needs. It also has the benefit of agitating these providers when they are acting
