ry": "code_repository", "count": 7}, {"category": "github_artifact", "count": 4}, {"category": "investigative_or_tech_press", "count": 1}], "story_anchors": ["cpp", "llama", "models", "fork", "model", "inference", "faster", "changes", "prefill", "hardware", "amd", "strata", "vram", "software", "patches", "ram", "card", "engines"], "largest_root": {"root_id": 50657791, "author": "rao-v", "slots": 24, "start_dom": 1, "end_dom": 24, "share_pct": 23.3, "top_dom1_age": 25.1, "top_dom1_author": "rao-v"}, "buried_cutoff": 31, "rescue_top_k": 21, "ablations": [], "tournament": [], "comments": [{"id": 50657791, "au": "rao-v", "dom": 1, "sr": 1, "sc": 15.03, "ep": 15.03, "bs": 0.0, "d": 0, "age": 25.05, "grav": 378.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 173, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": ["https://github.com/kinchahoy/llama-of-vega.cpp"], "ig": 1.824, "fa": 3.03, "gp": 1.453, "bl": 0.0, "ds": 0.0, "txt": "Early in 2025 a bunch of folks realized that AMD made a bunch of cards with mediocre compute but incredibly fast HBM2 memory in their circa 2018 gfx906 datacenter series, so you could get 32GB VRAM capable of incredible 1 TB / s bandwidth for $200 (the closest in today’s cards is north of $3000)\n\nThere has been a rich little ecosystem of folks optimizing llama.cpp for these odd cards (no tensor cores, no native bf16 etc.) including my little personal repo https://github.com/kinchahoy/llama-of-vega.cpp. Stuff like this focused on more modern RDNA doesn’t help us at all.\n\nIt’s been interesting to see how much each new frontier model can figure out in terms of optimizing for these GPUs and what they can’t!\n\nFable and Astra will regularly run out of ideas until I point them to someone’s actually thoughtful repo and then they’ll diligently incorporate ideas.\n\nThe optimization wins are huge (I was initially skeptical that per model kernel optimizations would be worth much). 27B at a pristine Q8 quant goes from base llama.cpp at some 250 pp / 25 tg to 600 pp / 40 tg even before speculative decoding."}, {"id": 50659700, "au": "malicz", "dom": 31, "sr": 2, "sc": 13.73, "ep": 13.73, "bs": 0.0, "d": 0, "age": 22.12, "grav": 307.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 71, "qw": 0, "k": 8, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": ["https://codeberg.org/StillDeadcode/radiance"], "ig": 1.546, "fa": 3.03, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "I have a r9700 card and I highly recommend the radiance engine. With a single card it processes (prefill) at 2400 tok/s and decodes at 150 tok/s. With a 4-bit model that is intelligently quantised to have a KLD of 0.006 and top-1 of 0.972\nI have been working this engine for a month, throwing a lot of agentic and coding work and it has been doing great! I can run 3 concurrent agent streams all with a 200k context, entirely in vram.\nEDIT: model: Qwen3.8-27b - https://codeberg.org/StillDeadcode/radiance"}, {"id": 50662086, "au": "science4sail", "dom": 83, "sr": 3, "sc": 11.79, "ep": 11.79, "bs": 0.0, "d": 4, "age": 16.53, "grav": 191.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 44, "qw": 0, "k": 1078, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": ["https://github.com/peonist-ai/halogen-flash-server/blob/main/LICENSE.md"], "ig": 1.23, "fa": 2.35, "gp": 1.517, "bl": 0.0, "ds": 0.0, "txt": "Doesn't that GitHub just download a binary blob container? That's not really open-source. Plus the Halogen license[0] doesn't seem to allow derivative software.\n\nFrom the open-source perspective, it's probably better to stick with Gufo or one of the various Llama forks mentioned in this discussion.\n\n[0] https://github.com/peonist-ai/halogen-flash-server/blob/main..."}, {"id": 50659978, "au": "noir_lord", "dom": 76, "sr": 4, "sc": 10.74, "ep": 10.74, "bs": 0.0, "d": 0, "age": 21.65, "grav": 297.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 20, "qw": 0, "k": 18124, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": ["https://github.com/osahum/llama.cpp-rdna3"], "ig": 0.573, "fa": 2.76, "gp": 1.054, "bl": 0.0, "ds": 0.0, "txt": "https://github.com/osahum/llama.cpp-rdna3 is great if you have a 7900XTX (or rdna3 card) - more than doubled vs stock llama what I got with my 7900XTX"}, {"id": 50660594, "au": "boomskats", "dom": 3, "sr": 5, "sc": 10.61, "ep": 10.76, "bs": 0.0, "d": 2, "age": 20.47, "grav": 270.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 83, "qw": 0, "k": 2588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": ["https://github.com/ROCm/TheRock/blob/main/RELEASES.md"], "ig": 1.26, "fa": 2.35, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "In case you're not aware, you might be interested to know that TheRock builds have picked gfx906 back up, kinda [0]. It's not tehcnically 'supported', but they've done some work to fix the broken bits, and it builds. It's in the list.\n\nI gave up on my mi60 a year or two ago too (got a strix halo now), so I missed most of this. Was a pleasant surprise to find out they'd decided to do the work to at least kinda bring them back to life.\n\n[0]:https://github.com/ROCm/TheRock/blob/main/RELEASES.md"}, {"id": 50658571, "au": "fiddlerwoaroof", "dom": 42, "sr": 6, "sc": 10.15, "ep": 10.15, "bs": 0.0, "d": 0, "age": 23.87, "grav": 349.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 63, "qw": 0, "k": 6540, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": ["https://github.com/fwoar-greenhouse/vicuna.cpp"], "ig": 1.27, "fa": 2.08, "gp": 0.853, "bl": 0.0, "ds": 0.0, "txt": "I have a MI100, and I managed to get Claude to double or triple the performance of Qwen3.8 by aggressively optimizing the AMD code and porting some of the Nvidia kernels to ROCm: https://github.com/fwoar-greenhouse/vicuna.cpp\n\nI've been running this for a while and it seems pretty stable, plus I had Claude validate the ported kernels against the originals to make sure they were reasonably close numerically to the validated implementations."}, {"id": 50658314, "au": "jakswa", "dom": 44, "sr": 7, "sc": 9.69, "ep": 9.69, "bs": 0.0, "d": 1, "age": 24.24, "grav": 358.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 43, "qw": 0, "k": 303, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": ["https://github.com/mw00/project-maya"], "ig": 1.27, "fa": 2.08, "gp": 0.536, "bl": 0.0, "ds": 0.0, "txt": "Oh it's ruben! Thank you for publishing your work. I was randomly running \"ruben llama\" for a couple days :D And the article does a great job describing my situation lately -- I think I was earlier in your speed curves, and ended up finding a little more speed from Maya https://github.com/mw00/project-maya"}, {"id": 50658683, "au": "SparkyMcUnicorn", "dom": 26, "sr": 8, "sc": 9.42, "ep": 9.42, "bs": 0.0, "d": 1, "age": 23.68, "grav": 344.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 96, "qw": 0, "k": 1592, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": ["https://github.com/youssofal/MTPLX"], "ig": 1.484, "fa": 2.08, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This might deserve a standalone post, but MTPLX is worth checking out.\n\nYoussof's goal is squeezing the most performance out of apple hardware, but not at the expense of model quality. I was testing all of the different projects, all different configs, and I could get some impressive tps numbers, but wasn't actually usable over longer sessions. MTPLX has been the most stable results for me, with acceptable speed/performance and not feeling like the model's capability was chopped.\n\nDefinitely worth checking out for anyone that has apple hardware, and might be using llama.cpp, oMLX, lmstudio, mlx-serve, etc.\n\nhttps://github.com/youssofal/MTPLX"}, {"id": 50667876, "au": "neogodless", "dom": 32, "sr": 9, "sc": 8.78, "ep": 8.93, "bs": 0.0, "d": 1, "age": 3.84, "grav": 24.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 25, "qw": 0, "k": 11241, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": ["https://www.amd.com/en/products/graphics/workstations/radeon-ai-pro/ai-9000-series/amd-radeon-ai-pro-r9700.html", "https://www.tomshardware.com/reviews/ati-radeon-9700-pro,505-2.html"], "ig": 0.326, "fa": 2.46, "gp": 0.792, "bl": 0.0, "ds": 0.0, "txt": "As someone who had a Radeon 9700 (cannot remember if it was \"Pro\") about... 20? years ago. I had to look this up...\n\nR9700: https://www.amd.com/en/products/graphics/workstations/radeon...\n\nOoh... 24 years ago.\n\nRadeon 9700 Pro: https://www.tomshardware.com/reviews/ati-radeon-9700-pro,505..."}, {"id": 50660724, "au": "exyi", "dom": 89, "sr": 10, "sc": 8.66, "ep": 8.66, "bs": 0.0, "d": 2, "age": 20.25, "grav": 266.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 103, "qw": 0, "k": 968, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": ["https://forum.level1techs.com/t/why-your-local-llm-feels-dumber-than-it-is/253917"], "ig": 1.583, "fa": 1.18, "gp": 1.084, "bl": 0.0, "ds": 0.0, "txt": "Reproducible on the same inference engine. Most of the attention optimizations rely on \"-Ofast-math\" optimization, i.e. the results are different, hopefully not by much. I think pixelesque is right that this deserves more attention, there have definitely been cases of significant regression of output quality. Most likely even in Anthropic/OpenAI APIs, not just in vibe-coded llama.cpp forks.\n\nThis guy benchmarked this for vLLM attention backends with its-not-great results: https://forum.level1techs.com/t/why-your-local-llm-feels-dum.... It is not necessarily easy to measure the quality loss. It often matters way more at larger context size - on agentic runs, not Q/A; and agentic benchmarks are more difficult to run than the Q/A ones."}, {"id": 50658142, "au": "peter_d_sherman", "dom": 100, "sr": 11, "sc": 8.5, "ep": 8.5, "bs": 0.0, "d": 0, "age": 24.49, "grav": 364.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 12, "k": 19061, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.749, "fa": 1.1, "gp": 0.865, "bl": 0.0, "ds": 0.0, "txt": ">\"Some examples of these new inference engines* are Strata, Basalt, RustingStrata, etc…\n\nThese new forks generally all have a few things in common:\n\no They focus on a specific subset of models and/or hardware\n\no They use a frontier model to vibe-code the entire thing\n\no They chase ever-higher token generation speeds\n\n… and the results are stunning! Strata is able to run a heavily-quantized model of Qwen 3.8 Flash Next, a 180B parameter model, on a 16GB VRAM graphics card, and 16GB system RAM, and have it generate tokens at a surprisingly high rate.\n\nNice!\n\nHardware specific optimizations are definitely one key to faster local tokens, algorithmic optimizations (i.e., all of the academic papers published about different Matrix/Tensor algorithm optimizations as pertains to LLMs) are another...\n\nAnyway, great article!"}, {"id": 50668271, "au": "dofm", "dom": 29, "sr": 12, "sc": 7.53, "ep": 7.68, "bs": 0.0, "d": 4, "age": 3.2, "grav": 19.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 8, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 1.559, "fa": 1.04, "gp": 0.724, "bl": 0.0, "ds": 0.0, "txt": "> I think your \"model zoo\" terminology is pretty non-standard.\n\nEhh? Turns of phrase have to be standards now? I didn't claim it was a standard. I just saw someone use this expression somewhere and shared it because it seemed apt.\n\nSo I don't mean much by it.\n\nExcept that it is kind of apt, because you can wander through and observe all the different animals, all of them well-looked after but none of them in the optimal conditions to keep them and all of them suboptimal in different ways. It's not shade, just an observation.\n\nWhen llama.cpp can beat the improvement that Splash (specifically the Paperniuk port for M1) provides for Q4 quants of Qwen 3.8 27B I can switch back, can't I?\n\nIn the meantime I've chosen an animal and given it an optimised enclosure.\n\nOver shorter prompts up to 64K it is outperforming by 3x, which is huge on the M1 Max, which usually does not benefit from separate MTP drafters, or really from MLX.\n\nIt really is radically faster, as is Inkling 2 Mini."}, {"id": 50658826, "au": "ljosifov", "dom": 46, "sr": 13, "sc": 7.38, "ep": 7.52, "bs": 0.0, "d": 2, "age": 23.44, "grav": 338.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 661, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 1.608, "fa": 0.95, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "7900xtx 24gb vram, on a 128gb ddr4 10-core Xeon 10+yrs old Linux box, I run Strata + Qwen3.8-flash-next (QFN) at 80 tok/s most of the time. Sometimes (when I need the ram) switch over to Hipfire + Qwen3.8-27B, that runs 80 tok/s to 120 tok/s (with MTP now; used to be tops 45 tok/s). Usually I run the QFN as I have ram to spare, and QFN's AAII index is 29, versus 20 for the 27B dense. So I consider QFN more intelligent all other things being equal."}, {"id": 50657972, "au": "wolvoleo", "dom": 2, "sr": 14, "sc": 6.73, "ep": 7.02, "bs": 0.0, "d": 1, "age": 24.77, "grav": 371.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.407, "fa": 0.68, "gp": 1.226, "bl": 0.0, "ds": 0.0, "txt": "Yeah these cards are great, I have one too. There's the Radeon VII Pro 16GB and the Instinct MI50 with 16 or 32GB. For the latter you need to come up with your own cooling though.\n\nUnfortunately they lack the right matrix processor to accelerate prefill so time to first token can be slow. And software support is getting bad. ROCm dropped them already so there's only Vulkan\n\nPs I don't think this architecture is supported by the port in this link. It seems to be specific to RDNA."}, {"id": 50657417, "au": "rsolva", "dom": 43, "sr": 15, "sc": 6.22, "ep": 6.51, "bs": 0.0, "d": 0, "age": 25.62, "grav": 392.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 30, "qw": 0, "k": 1020, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": ["https://forge.dmz.skyfritt.net/ruben/llama-inkling-2-mini"], "ig": 0.871, "fa": 0.96, "gp": 1.192, "bl": 0.0, "ds": 0.0, "txt": "Interesting! I have had Claude improve llama.cpp the last few days to get Inkling 2 Mini to fly on my 7900XTX, the improvement has been dramatic both for decode and prefill!\n\nhttps://forge.dmz.skyfritt.net/ruben/llama-inkling-2-mini"}, {"id": 50665012, "au": "yturijea", "dom": 16, "sr": 16, "sc": 6.16, "ep": 6.6, "bs": 0.0, "d": 1, "age": 9.02, "grav": 75.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 37, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 1.538, "fa": 0.95, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "I discovered my minisforum with 32gb RAM and only IGPU because it is AMD I could just allow the IGPU to use up 24GB RAM for the model, which both improved performance, but also caused way less electricity usage and heat development compared to CPU. \nQuite underrated. I guess getting a 64GB version you would actually have a large enough context window to do proper coding tasks as background tasks. \nBecause it is still not fast, but with latest QWEN 27B the quality is very good."}, {"id": 50659040, "au": "yieldcrv", "dom": 18, "sr": 17, "sc": 6.06, "ep": 6.5, "bs": 0.0, "d": 1, "age": 23.1, "grav": 330.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 3896, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.225, "fa": 0.95, "gp": 0.631, "bl": 0.0, "ds": 0.0, "txt": "The same just happened with nvidia’s crypto mining cards\n\nTurns out they are 80gb A100s but were advertised as 8gb with only 8gb addressable until a mod\n\nThey were a couple hundred just 6 months ago, now $5000 and getting closer in parity to normal A100s"}, {"id": 50663359, "au": "teaearlgraycold", "dom": 10, "sr": 18, "sc": 5.91, "ep": 6.35, "bs": 0.0, "d": 2, "age": 12.91, "grav": 129.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 4148, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.696, "fa": 0.68, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "I actually have a fun franken-build with a Radeon VII Pro hooked up to a Raspberry Pi 5 and a mini gallium-nitride power supply. It's mostly GPU by volume. I have titled it \"The Modern Computer\".\n\nI just ran it for 5 days straight computing embeddings for all of English Wikipedia. But what I really want is to get it running a nice LLM. The card is overclockable thanks to being a gaming card, so the memory bandwidth is now 1.1 TB/s. But the PCIe gen 3x1 interface to the Pi 5 means MoE offloading/streaming is not viable."}, {"id": 50658667, "au": "0xbadcafebee", "dom": 101, "sr": 19, "sc": 5.08, "ep": 5.3, "bs": 0.0, "d": 0, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.131, "fa": 0.68, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "I've tried patches like this for my gfx1103, and I got a 15% boost to pp, 3% boost to tg... but it also couldn't use all my VRAM (unified memory), only the BIOS GART reserved mem - so I couldn't load larger models anymore, and had to go back to Vulkan."}, {"id": 50658612, "au": "badsectoracula", "dom": 98, "sr": 20, "sc": 4.84, "ep": 5.06, "bs": 0.0, "d": 1, "age": 23.8, "grav": 347.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 77, "k": 8824, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.34, "fa": 0.42, "gp": 0.495, "bl": 0.0, "ds": 0.0, "txt": "But the point of choosing this is that these other projects don't just make inference go fast but they also change how the results are calculated:\n\n> as these projects have evolved, that relentless chase toward higher token generation speeds has taken an unfortunate turn, in that the optimizations are less about hardware-specific changes, but more about changing how the model thinks so that it goes brrr faster.\n\n> Strata specifically has taken to preferring to poll experts loaded in VRAM even if other experts (pushed to system RAM/disk) would have been normally chosen. This is just one example, but certainly not the last.\n\nChanges like the one in Strata can degrade the model's performance.\n\nAnd TBH it seems to be so common all these videcoded \"make stuff go faster\" do changes like that that personally i have a hard time trusting anything other than llama.cpp (and TBHv2, that includes the linked repository - i'd rather wait for all those improvements reach the mainline llama.cpp)."}, {"id": 50660617, "au": "jdewerd", "dom": 56, "sr": 21, "sc": 4.75, "ep": 4.75, "bs": 0.0, "d": 1, "age": 20.44, "grav": 270.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 662, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.658, "fa": 0.0, "gp": 0.589, "bl": 0.0, "ds": 0.0, "txt": "Historically the threat was self-sabotage from AMD not sabotage from Nvidia.\n\nBack in the day, Nvidia won my business when their OpenCL reliably ran my code so much better than AMD's OpenCL (more speed on a \"worse\" card, fewer bugs, better error messages, no crashes) that I eventually gave in, sold my red cards, and payed the green tax so that I could have that experience all of the time.\n\nThe fact that 3rd parties can now work around AMD's best efforts to duck up the software makes me genuinely bullish on the prospect of using an AMD card for the first time in a long time."}, {"id": 50657769, "au": "skullone", "dom": 45, "sr": 22, "sc": 4.59, "ep": 5.25, "bs": 0.0, "d": 1, "age": 25.08, "grav": 379.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 898, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 0.836, "fa": 0.95, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "I've been wondering what I can reasonably run on a 7800x3d with 6GB and a 7900xtx with I believe 12 or 24GB vram. Looks like AMD stuff might be back in the races?"}, {"id": 50657591, "au": "dofm", "dom": 25, "sr": 23, "sc": 4.54, "ep": 5.06, "bs": 0.0, "d": 0, "age": 25.34, "grav": 385.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 201, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 0.606, "bl": 0.0, "ds": 0.0, "txt": "I saw some blurb a while ago that described llama.cpp as a “model zoo”, which is a great description of its utility and generality.\n\nIn the last couple of days I have been playing with Erik Paperniuk’s M1 port of Inco’s Splash, which has completely transformed the speed of Qwen 3.8 27B and Inkling 2 Mini; it has essentially tripled the speed of the former and more than doubled the speed of the latter.\n\nThis means the Qwen model is fully viable on an M1 Max, where before I had found it a bit of a waiting game. And it arguably transforms the utility of Inkling 2 Mini; extra speed means it can be left to reason for longer, the downside of needing to do more tool use for search to patch its knowledge is reduced, and it provides a good rough chat model (though this is not its area of greatest strength).\n\nI have not yet found anything that can boost Muse Glimmer to the same extent; I would still prefer that.\n\nBut for me I now find that only the rather slow prefill speed really holds the M1 Max back; I suspect these new custom kernels have made the M5 Pro Mac Mini a really cost-effective option if you want to tinker with local AI."}, {"id": 50658161, "au": "rao-v", "dom": 7, "sr": 24, "sc": 4.06, "ep": 4.94, "bs": 0.0, "d": 2, "age": 24.48, "grav": 364.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 0.96, "fa": 0.68, "gp": 0.515, "bl": 0.0, "ds": 0.0, "txt": "Checkout the repo - you can get surprisingly good prefill with kernel optimization (not the 3K / s that a 5090 will do but competitive with a modern 9700 XTX or Intel Arc etc)"}, {"id": 50666961, "au": "Zambyte", "dom": 93, "sr": 25, "sc": 3.72, "ep": 3.72, "bs": 0.0, "d": 1, "age": 5.16, "grav": 34.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 11, "k": 5280, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.074, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Are they happy to be the eternal 2nd place to NVIDIA\n\nGiven everything going on with NVIDIA, this has been an actual thought that crossed my mind recently as a reasonable strategy for AMD. Does AMD have to deal with international spies? Maybe, but they're surely a much smaller target, while still being very successful."}, {"id": 50657815, "au": "tredre3", "dom": 59, "sr": 26, "sc": 3.5, "ep": 3.86, "bs": 0.0, "d": 2, "age": 25.0, "grav": 377.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 3947, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.583, "fa": 0.0, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "The core llama.cpp team joined Hugging Face in February this year. Thus Hugging Face \"owns\" llama.cpp.\n\nNvidia will soon own Hugging Face, this is well known and the deal was finalized in August. Thus, Nvidia owns Hugging Face.\n\nIt follows to me that one could say Nvidia now owns llama.cpp. They likely do not own the brand or exert any specific control over it, and hopefully whatever deals gregory signed allows him to walk away with the project if he wants."}, {"id": 50658949, "au": "mszcz", "dom": 90, "sr": 27, "sc": 3.28, "ep": 3.94, "bs": 0.0, "d": 0, "age": 23.25, "grav": 334.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 718, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 1.409, "fa": 0.0, "gp": 0.432, "bl": 0.0, "ds": 0.0, "txt": "It's sort of astonishing seeing the contrast of what last bit of performance people are squeezing out of all kinds of GPUs, old & new & weird, because there's a shortage vs. how the apparently abundant resources are being used in an \"electron app\" (the disk space, the RAM, the compute!).\n\nI know it's apples to oranges but the difference I'm talking about is in the attitude and approach."}, {"id": 50658990, "au": "newusertoday", "dom": 74, "sr": 28, "sc": 3.21, "ep": 3.65, "bs": 0.0, "d": 0, "age": 23.16, "grav": 332.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 561, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.282, "fa": 0.0, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "does anyone maintains patches like this for intel? intel's xmx engine is strong on paper but lags behind due to improper utilization of hardware especially on linux.\nEven on llama.cpp coopmat for vulkan is only enabled on windows for arrow lake."}, {"id": 50658980, "au": "PaulKeeble", "dom": 64, "sr": 29, "sc": 3.19, "ep": 3.63, "bs": 0.0, "d": 1, "age": 23.18, "grav": 332.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 7374, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.216, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "LLama.cpp is now the stable product that moves with intent and doesn't break things and largely isn't just taking anything the AI kicks out as a patch. They also have a tonne of legacy having been around for so long compared to the new engines that can throw a lot of the older models away and make software designed for the new architectures."}, {"id": 50661030, "au": "julianlam", "dom": 34, "sr": 30, "sc": 3.17, "ep": 3.9, "bs": 0.0, "d": 1, "age": 19.53, "grav": 250.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 3170, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.462, "fa": 0.0, "gp": 0.322, "bl": 0.0, "ds": 0.0, "txt": "I did try that too, along with some of the forks recommended by the launch80 discord for single r9700 users.\n\nI did end up getting it running, but vLLM takes a long time to start, which makes it better for long running servers. I was also (and still am) very green at tuning vLLM, though I can stumble my way around llama.cpp's flags.\n\nOf course, neither are reasons to discount vLLM, so as the article suggests, YMMV! Perhaps one day I will try again.\n\nEnd of the day I didn't end up seeing much difference, but it could very well be that I compiled it wrong."}, {"id": 50670482, "au": "jasonvorhe", "dom": 33, "sr": 31, "sc": 2.9, "ep": 4.22, "bs": 0.0, "d": 1, "age": 0.05, "grav": 3.6, "surf": 68.9, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 40, "qw": 0, "k": 2294, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": ["https://blog.codeberg.org/protecting-our-floss-commons-from-llms.html"], "ig": 1.043, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Cool project, I'll check it out. Word of warning though: Codeberg might nuke your repo any second (or reach out to complain, if they're semi-decent people) because you seem to be letting your AI agent commit to your repo: https://blog.codeberg.org/protecting-our-floss-commons-from-..."}, {"id": 50658431, "au": "d3Xt3r", "dom": 95, "sr": 32, "sc": 2.86, "ep": 3.45, "bs": 0.0, "d": 0, "age": 24.05, "grav": 353.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1515, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 0.812, "fa": 0.28, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "Julian, are you also able to benchmark Strata, HaloPFX and Hipfire please? All of these are optimised for AMD and perform much better than vanilla llama.cpp."}, {"id": 50662922, "au": "WhyNotHugo", "dom": 68, "sr": 33, "sc": 2.4, "ep": 3.21, "bs": 0.0, "d": 1, "age": 14.14, "grav": 149.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 6915, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.305, "bl": 0.0, "ds": 0.0, "txt": "llama.cpp has al limit of 2 open PRs per user, but reviews can take months — even for relatively trivial bug fixes. I can imagine that trying to upstream extensive work would be excruciatingly slow."}, {"id": 50659038, "au": "dofm", "dom": 27, "sr": 34, "sc": 2.32, "ep": 3.42, "bs": 0.0, "d": 2, "age": 23.1, "grav": 330.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.017, "bl": 0.0, "ds": 0.0, "txt": "It is good, but it is still a generalist, model-zoo isn't it?\n\nIt does seem to have good general advantages over llama.cpp for more modern Apple Silicon (M3 and up, when they tweaked the neural engine architecture I think?)\n\nFor my own situation, I think MLX-plus-MTP does't generally do better on the M1 Max than llama.cpp does with GGUFs. In fact it is usually worse (same on the M2 Max AFAIR) because the bandwidth overhead outweighs the draft prediction advantage.\n\nThe bespoke kernels are worth it once you have toured the zoo a few times and know which animal you are really interested in."}, {"id": 50660796, "au": "kittikitti", "dom": 103, "sr": 35, "sc": 2.27, "ep": 2.93, "bs": 0.0, "d": 0, "age": 20.09, "grav": 262.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 136, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.247, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Hello, this is great, thank you for making this. I would have preferred a branch with an environment variable instead of a new fork with a pinned commit. I actively avoid Intel because of their ties to Israel and AMD is slightly better in this regard."}, {"id": 50657386, "au": "pixelesque", "dom": 87, "sr": 36, "sc": 2.24, "ep": 3.05, "bs": 0.0, "d": 0, "age": 25.65, "grav": 393.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1735, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.02, "fa": 0.0, "gp": 0.449, "bl": 0.0, "ds": 0.0, "txt": "I know it's not completely trivial to do this given how stochastic they are with normal (non-0-temperature) settings, but is anyone actually checking the output quality of the tokens with some of these optimisations, or just chasing pure speed like some of the projects at least appear to be doing?"}, {"id": 50658252, "au": "jhonof", "dom": 13, "sr": 37, "sc": 2.04, "ep": 3.58, "bs": 0.0, "d": 1, "age": 24.34, "grav": 360.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 220, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 0.72, "fa": 0.34, "gp": 0.635, "bl": 0.0, "ds": 0.0, "txt": "2 MI50 32 GBs in my rig I got for $300 a piece about 6 months ago. There is also a great discord for people tinkering and optimizing with these cards. I get like 70 t/s with my setup right now running QFN using Strata."}, {"id": 50664772, "au": "notenchange", "dom": 91, "sr": 38, "sc": 2.02, "ep": 3.05, "bs": 0.0, "d": 0, "age": 9.55, "grav": 81.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 89, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "nvidia_hardware", "flbl": "Nvidia & Hardware (Llama)", "urls": [], "ig": 1.06, "fa": 0.0, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "For the life of me, I can't understand why it's not AMD doing these forks, or, better, contributing to this and other projects.\n\nAMD has great GPU hardware that's marred by poor software integration. For years, they know this, and for years they don't anything actually useful about it.\n\nAre they happy to be the eternal 2nd place to NVIDIA, or they just don't see it as even worth to try? This really baffles me."}, {"id": 50666187, "au": "sznio", "dom": 94, "sr": 39, "sc": 1.82, "ep": 3.0, "bs": 0.0, "d": 1, "age": 6.48, "grav": 46.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 22, "k": 1197, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 0.766, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">For the life of me, I can't understand why it's not AMD doing these forks, or, better, contributing to this and other projects.\n\nAMD is fixated on not being a software company. They seem to absolutely hate the fact that they even have to write a driver for their products."}, {"id": 50662096, "au": "nl", "dom": 28, "sr": 40, "sc": 1.76, "ep": 3.3, "bs": 0.0, "d": 3, "age": 16.49, "grav": 190.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 34310, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 1.371, "fa": 0.0, "gp": 0.052, "bl": 0.0, "ds": 0.0, "txt": "I think your \"model zoo\" terminology is pretty non-standard.\n\nDo you just mean that it can serve any model?\n\nThat's true, but the model-specific serving frameworks are constantly being overtaken by generalist frameworks because the generalists aggregate improvements from across all models.\n\nYes, at an specific point in time you can probably find a specific framework that outperforms for your chosen model. It's very rare that lasts."}, {"id": 50662573, "au": "theoli", "dom": 35, "sr": 41, "sc": 1.59, "ep": 2.91, "bs": 0.0, "d": 2, "age": 15.22, "grav": 167.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 8, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.237, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Parent is talking about the standalone radiance inference engine, which is _not_ vllm based, is much simpler, and is excellent. For 1 - 4 card R9700 hosts it is basically turn-key. It’s from the same author who was working on vllm-radiance and dumped the vllm part. Check out the link to the codeberg repo they posted."}, {"id": 50667795, "au": "julianlam", "dom": 39, "sr": 42, "sc": 1.55, "ep": 2.87, "bs": 0.0, "d": 2, "age": 3.94, "grav": 24.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 3170, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 1.189, "fa": 0.0, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "Yes, supposedly. I can fit 27B q6 on my card and I found it was more succinct and a better writer (read: less claude-ish) in its responses.\n\nI prefer it over the q3 GSQ-RCO quant of flash-next."}, {"id": 50660157, "au": "fotcorn", "dom": 5, "sr": 43, "sc": 1.41, "ep": 2.96, "bs": 0.0, "d": 2, "age": 21.3, "grav": 289.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 876, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.125, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "ROCm supports gfx906 (MI50/Radeon VII) in their nightly builds, just not official stable releases.\n\nThey even support the older gfx900 (MI25/WX9100).\n\nllama.cpp compiled against ROCm 10.x works well on my 2 MI25s."}, {"id": 50663464, "au": "d3Xt3r", "dom": 97, "sr": 44, "sc": 1.34, "ep": 2.73, "bs": 0.0, "d": 2, "age": 12.63, "grav": 125.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 1515, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've only tried Hipfire of the lot, and as far as I can tell, it doesn't sacrifice quality. But then again, I haven't run a proper SWE bench or the likes so can't say for sure. But it is fairly popular amongst AMD users who use retail GPUs and Strix Halo iGPUs."}, {"id": 50658420, "au": "jhonof", "dom": 15, "sr": 45, "sc": 1.28, "ep": 3.67, "bs": 0.85, "d": 3, "age": 24.06, "grav": 353.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 220, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 1.221, "fa": 0.28, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "On my benchmarks it performs equally as well quality wise as q8 3.8 27B, tool calls are marginally worse though. It also runs way way cooler on my cards which is important to me because the blowers for the cards are super loud at high speed. Max context is 200k right now for ref."}, {"id": 50658695, "au": "skullone", "dom": 51, "sr": 46, "sc": 1.26, "ep": 1.7, "bs": 0.0, "d": 4, "age": 23.66, "grav": 344.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 898, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.312, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ihave this machine mainly for helldivers2 but it's idle 99.9% of the time, id love to get some more value out of it :p"}, {"id": 50660946, "au": "wolvoleo", "dom": 6, "sr": 47, "sc": 1.21, "ep": 2.75, "bs": 0.0, "d": 3, "age": 19.75, "grav": 255.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3347, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "vulkan_slow", "flbl": "Vulkan & Slow (Software)", "urls": [], "ig": 1.169, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ah ok I didn't know. But I heard Vulkan works better anyway in terms of performance.\n\nPersonally I don't really want to mess around with builds, I'm not a software dev. I'd just like to deploy a docker and run the AI for other stuff."}, {"id": 50658355, "au": "rao-v", "dom": 14, "sr": 48, "sc": 1.2, "ep": 2.74, "bs": 0.0, "d": 2, "age": 24.15, "grav": 356.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1440, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 1.166, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Woah 70 t/s on IQ3 on long context?? Need to test again. I find strata tricky because it’s super willing to degrade quality for tps - I really want as close to the OG model as possible for agentic work."}, {"id": 50657758, "au": "hypercube33", "dom": 79, "sr": 49, "sc": 1.12, "ep": 2.37, "bs": 0.0, "d": 0, "age": 25.09, "grav": 379.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1141, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 0.711, "fa": 0.0, "gp": 0.483, "bl": 0.0, "ds": 0.0, "txt": "If I'm not mistaken there was/is an lm studio for strix halo. seems like it quit working but it was able to punch Qwen 3.6 as fast as the 8060s when it worked.\n\nThere is also a llama fork for Ryzen AI and Radeon cards but I'm on mobile."}, {"id": 50661741, "au": "basilgohar", "dom": 85, "sr": 50, "sc": 0.93, "ep": 2.03, "bs": 0.0, "d": 0, "age": 17.61, "grav": 212.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 3493, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 0.707, "fa": 0.0, "gp": 0.258, "bl": 0.0, "ds": 0.0, "txt": "Running a test of this on my aGPU. I know it's not the target hardware but early results show an improvement for some models."}, {"id": 50660950, "au": "julianlam", "dom": 96, "sr": 51, "sc": 0.87, "ep": 2.41, "bs": 0.0, "d": 1, "age": 19.75, "grav": 255.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3170, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 0.685, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I haven't tried Strata on 27B specifically, so I can't say.\n\nIt did well with the GSQ-RCO IQ3 quant of Qwen Flash Next (80tps decode), but the concerns re: sacrificing quality for speed were a yellow flag for me."}, {"id": 50662785, "au": "tuananh", "dom": 77, "sr": 52, "sc": 0.68, "ep": 1.78, "bs": 0.0, "d": 0, "age": 14.63, "grav": 157.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3115, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "repo_cards", "flbl": "Repo & Cards (Model)", "urls": [], "ig": 0.614, "fa": 0.0, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "it's sad that optimizations like this are spread across many forks. it would be nice to have them upstreamed to llama.cpp repo"}, {"id": 50658900, "au": "rlpb", "dom": 4, "sr": 53, "sc": 0.64, "ep": 2.18, "bs": 0.0, "d": 2, "age": 23.32, "grav": 336.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 4, "k": 11065, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "vllm_quality", "flbl": "Vllm & Quality (Agentic)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "> ROCm dropped them already...\n\nI think this kind of thing matters less nowadays. The codebase contains enough information that if you throw these things at AI they can do the backporting. It works well because there's a straightforward feedback loop (\"does it work?\" and \"measure performance of <X> and <Y>\")."}, {"id": 50657834, "au": "9x39", "dom": 80, "sr": 54, "sc": 0.38, "ep": 1.77, "bs": 0.0, "d": 1, "age": 24.98, "grav": 376.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 931, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "qwen_inkling", "flbl": "Qwen & Inkling (Mini)", "urls": [], "ig": 0.754, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Strix Halo has Halogen dedicated to Qwen Flash Next, which is substantially better than anything else for that model on Strix.\n\nGUFO for Strix runs Qwen 3.8 27B faster than llama.cpp and also runs Qwen Flash Next.\n\n     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
