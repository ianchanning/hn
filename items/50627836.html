market largely hinges on whether Jensen is CEO or not?\n\nI don't see why this should bother you. Plenty of empirical data backs the idea that the founder CEO of a company staying or leaving makes a huge difference in trajectory, and NVIDIA is a very very important company."}, {"id": 50628101, "au": "littlecranky67", "dom": 293, "sr": 67, "sc": 5.13, "ep": 6.19, "bs": 0.0, "d": 0, "age": 11.93, "grav": 114.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 5938, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.302, "fa": 0.34, "gp": 1.491, "bl": 0.0, "ds": 0.0, "txt": "They have no future business model. Open-weight models and specialized distilations can be hosted in anyones datacenter where fierce competition will bring down prices. The current problem is the hardware scarcity and that the few big frontier providers snatch all the hardware at inflated prices while at the same time offer subsidized tokens below cost. Once the market evens out that scarcity, the 10-15% gap of the latest and greatest frontier model won't be able to justify the prices and valuations."}, {"id": 50629246, "au": "notenchange", "dom": 509, "sr": 68, "sc": 5.13, "ep": 6.18, "bs": 0.0, "d": 3, "age": 10.62, "grav": 95.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 89, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.889, "fa": 0.0, "gp": 1.203, "bl": 0.0, "ds": 0.0, "txt": "I'm talking about complex coding tasks.\n\nDeepseek is good at solving a very specific problem, but as soon as you need more \"intelligence\" from it (i.e. understanding where the pieces fall together with the existing code base or coming up with tight solutions to the problem), it normally fails silently.\n\nWhat I mean by that, is that it gives you a correct answer, but that correct answer clearly doesn't take into account many things the Opus 5.5. takes. Like security, edge cases, proper architecture, etc."}, {"id": 50630324, "au": "zug_zug", "dom": 314, "sr": 69, "sc": 5.13, "ep": 6.16, "bs": 0.0, "d": 2, "age": 9.47, "grav": 80.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 7, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.787, "fa": 1.1, "gp": 0.813, "bl": 0.0, "ds": 0.0, "txt": "> And it's going to be wildly successful.\n\nI mean I could literally spend 10 minutes to get my AI to make a program to send 5,000 prompts to itself implying I'm a pregnant 60-year old woman from Bangladesh who loves watching TCM and poison the heck out of it. I'm sure simple prompts like \"how to file for bankruptcy\" and other random signals will create enough noise to destroy targeting."}, {"id": 50629715, "au": "ChicagoDave", "dom": 275, "sr": 70, "sc": 5.13, "ep": 6.08, "bs": 0.0, "d": 0, "age": 10.12, "grav": 89.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2819, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.389, "fa": 0.28, "gp": 1.391, "bl": 0.0, "ds": 0.0, "txt": "The landscape is very murky. There are a lot of ifs.\n\n- if OpenAI crashes\n- if Oracle crashes\n- if MS/Google/Meta/Apple absorb losses\n\nThere are clear scenarios where Anthropic comes out the winner."}, {"id": 50630010, "au": "sigmar", "dom": 554, "sr": 71, "sc": 5.13, "ep": 5.99, "bs": 0.0, "d": 3, "age": 9.8, "grav": 85.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 5415, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.731, "fa": 0.0, "gp": 1.324, "bl": 0.0, "ds": 0.0, "txt": "Agree with this comment. Nearly impossible to judge fundamentals in this circumstance.\n\nPeople that believe ANT is a massive bubble should be very happy that anthropic is now public. Now they have to disclose revenue publicly rather than the status quo of endless leaks about ARR. It's weird to me that bearish commentors seem so upset about them going public (ex repeated use of \"hype\" and \"liquidity sucker\"), price discovery is good!"}, {"id": 50629358, "au": "cmiles8", "dom": 541, "sr": 72, "sc": 5.13, "ep": 5.93, "bs": 0.0, "d": 0, "age": 10.5, "grav": 94.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 5640, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 1.549, "bl": 0.0, "ds": 0.0, "txt": "There aren’t many/any fundamentals keeping the stock price anywhere close to these levels. It’s just hype, hopes and dreams… beyond that the present price is a made up number.\n\nAnyone that bought this at IPO expecting to make money by holding the stock is just a liquidity sucker.\n\nDon’t be surprised if this stock drops by 70-80+% in the next 12 months. That’s closer to where sane fundamentals would price it.\n\nAlso, OpenAI looks completely screwed at this point."}, {"id": 50633681, "au": "Volundr", "dom": 209, "sr": 73, "sc": 5.13, "ep": 5.91, "bs": 0.0, "d": 1, "age": 5.79, "grav": 40.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4268, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.165, "fa": 0.56, "gp": 1.083, "bl": 0.0, "ds": 0.0, "txt": "Anymore companies are waiting to IPO until all the real value has been pulled out of the market. Unless regulation changes we're pretty unlikely to see another Amazon or the like where IPO investors 1000x their return.\n\nThat doesn't mean they can't come back from this, but your unlikely to get rich off it."}, {"id": 50636265, "au": "credit_guy", "dom": 168, "sr": 74, "sc": 5.13, "ep": 5.89, "bs": 0.0, "d": 5, "age": 2.34, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 8284, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.683, "fa": 0.28, "gp": 0.781, "bl": 0.0, "ds": 0.0, "txt": "I should have put more color in my scenario. Yes, the scenario I'm postulating is one where Anthropic executes better than OpenAI and Google. I think this is quite likely. I don't think this is guaranteed, but it's likely, and one piece of evidence is that Anthropic started from zero not that long ago, and is now in the lead. My personal reason for thinking this is likely: I think leaders do make a difference, and I think Dario Amodei is a more capable leader than Sam Altman, or whomever is the AI leader at Google. But, I am an outsider, with absolutely zero inside knowledge, so nobody should take my view as anything other than a random guy on the internet's view."}, {"id": 50630415, "au": "zug_zug", "dom": 623, "sr": 75, "sc": 5.13, "ep": 5.88, "bs": 0.0, "d": 2, "age": 9.37, "grav": 79.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.524, "fa": 0.34, "gp": 0.914, "bl": 0.0, "ds": 0.0, "txt": "Professionals and insiders (correctly) have decided they can make a buck off of suckers who think that Nvidias performance all about Jensen. Heck the insiders might even be creating artificial buzz on /r/wallstreetbets, it's what I would do. Nvidia down 8% today -- clearly some people bought low on Friday and sold high this morning."}, {"id": 50635288, "au": "brookst", "dom": 41, "sr": 76, "sc": 5.13, "ep": 5.85, "bs": 0.0, "d": 3, "age": 3.82, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 15679, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.77, "fa": 0.0, "gp": 1.163, "bl": 0.0, "ds": 0.0, "txt": "It’s a weird industry. It’s in high demand, but consumers are satisficed as long as they are physically transported, so there’s almost no room for differentiation, so profits are near zero. And costs are volatile with weather and fuel prices, but there’s always going to be another airline willing to roll the dice on costs not increasing, so if you charge a little more to hedge risk, you sell no tickets, and your fixed costs don’t change."}, {"id": 50628544, "au": "santadays", "dom": 432, "sr": 77, "sc": 5.13, "ep": 5.8, "bs": 0.0, "d": 3, "age": 11.42, "grav": 107.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 491, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.503, "fa": 0.34, "gp": 0.895, "bl": 0.0, "ds": 0.0, "txt": "Yea, Anthropic might better/more convenient than the open models,  but will they be $10k a seat better/more convenient?\n\nIf the open models keep pressure on them then they can't capture the market and raise prices, which makes them over valued.\n\nThe other wildcard is what is the upper limit of what an llm can achieve.  Right now you can't ask it to ideate, create, launch and market a business and have it be successful.  Some people think this will never happen (and is ridiculous to suggest), some people think this is inevitable.  But if this happens and they are the first/only company to develop it,  then society has a bunch of re-thinking to do and maybe their 2 trillion dollar valuation isn't so far fetched."}, {"id": 50635928, "au": "toomanyrichies", "dom": 666, "sr": 78, "sc": 5.13, "ep": 5.76, "bs": 0.0, "d": 1, "age": 2.85, "grav": 17.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 4571, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.556, "fa": 0.34, "gp": 0.784, "bl": 0.0, "ds": 0.0, "txt": "I seriously want to just throttle these retail investors.\n\nLike, \"Tough break y'all, but don't stop believing!  I'm sure you'll outsmart these billion-dollar institutions on the next IPO!  Keep hope alive!\"\n\nWhat did you expect would happen?  If you can't spot the sucker in the first 30 minutes of a poker game, you are the sucker."}, {"id": 50629204, "au": "karmakurtisaani", "dom": 647, "sr": 79, "sc": 5.13, "ep": 5.68, "bs": 0.0, "d": 1, "age": 10.67, "grav": 96.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 2966, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.303, "fa": 0.68, "gp": 0.471, "bl": 0.0, "ds": 0.0, "txt": "This time all the tech companies will crash 30-50% and the real economy will be in shambles, just like it has already been the past 3 years. So basically nothing changes and we'll catch our breath for the new craze of 2030s, whatever it might be. My bet is quantum crypto currencies!"}, {"id": 50634228, "au": "fortran77", "dom": 280, "sr": 80, "sc": 5.13, "ep": 5.67, "bs": 0.0, "d": 0, "age": 5.24, "grav": 35.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 41175, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.461, "fa": 0.34, "gp": 0.876, "bl": 0.0, "ds": 0.0, "txt": "A quick search shows that the majority of US IPOs fall below their IPO price in the first 90 days.\n\nIf you're not getting pre-IPO shares, buying the stock on day 1 is almost always a bad idea, no matter what the company. Better off waiting a quarter or two and seeing how they're doing. There's plenty of time if the company will be successful in the long run."}, {"id": 50634150, "au": "TheAlchemist", "dom": 165, "sr": 81, "sc": 5.13, "ep": 5.65, "bs": 0.0, "d": 2, "age": 5.33, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 6903, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.61, "fa": 0.28, "gp": 0.736, "bl": 0.0, "ds": 0.0, "txt": "There is virtually no scenario in which Anthropic at this price is a wonderful investment.\n\nWith the valuation they IPO-ed with, they need to be extremely successful to even approach what's expected in terms of earnings from them.\n\nIn a scenario in which they end up massively surpassing those expectations, I only see 2 real possibilities, in both AI in its current iteration ends up extremely successful and transforming the world as we know it:\n- they have some kind of monopoly and become THE single most important company in history\n\n- the success is shared across different companies, and given the price, it may be not a bad investment but definitely not good compared to other companies"}, {"id": 50631226, "au": "savanaly", "dom": 543, "sr": 82, "sc": 5.13, "ep": 5.64, "bs": 0.0, "d": 2, "age": 8.49, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 32, "qw": 18, "k": 4227, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": ["https://www.econlib.org/archives/2012/05/the_bettors_oat.html"], "ig": 0.647, "fa": 1.04, "gp": 0.796, "bl": 0.0, "ds": 0.0, "txt": ">When I lose a bet, I will admit defeat, pay promptly, and hold my tongue – never protesting that I was “really right.”\n\nFrom The Bettor's Oath. [0]\n\nBravo for making a bet instead of casually predicting, but never miss a chance to look good by accepting the missed prediction (if it does come to pass you lost).\n\n[0] (https://www.econlib.org/archives/2012/05/the_bettors_oat.htm...)."}, {"id": 50629693, "au": "michaelscott", "dom": 563, "sr": 83, "sc": 5.13, "ep": 5.61, "bs": 0.0, "d": 3, "age": 10.15, "grav": 89.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 948, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.485, "fa": 0.34, "gp": 0.796, "bl": 0.0, "ds": 0.0, "txt": "Didn't their intended market cap encompass like a significant portion of world GDP though? I'm curious how closely their aspirations are matched by market expectations in their current price. I don't really see how they could reach their intended valuation goals in the next 1 or 2 years but lately it feels like absolutely anything can and will happen"}, {"id": 50628456, "au": "neom", "dom": 208, "sr": 84, "sc": 5.13, "ep": 5.57, "bs": 0.0, "d": 0, "age": 11.5, "grav": 108.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 20490, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.468, "fa": 0.0, "gp": 1.461, "bl": 0.0, "ds": 0.0, "txt": "In my life I've made 2 emotional trades because I know the founders.\n\nHashiCorp where I bought the the first trade price and road it all the way to the IBM acquisition, and Anthropic where I bought the first trade price. Fingers crossed Anthropic recovers so at least I can make my money back, HashiCorp still holds the top spot as the most money I've lost on a stock."}, {"id": 50629448, "au": "rapatel0", "dom": 580, "sr": 85, "sc": 5.13, "ep": 5.47, "bs": 0.0, "d": 1, "age": 10.39, "grav": 92.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 476, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.66, "fa": 0.95, "gp": 0.836, "bl": 0.0, "ds": 0.0, "txt": "70% margins, ~15B cashflow/quarter, 120B cash on hand, double or triple digit growth rate.\n\n20x-30x revenue is not historically crazy for tech.\n\nMarkets are crazy when its 100x multiple"}, {"id": 50628920, "au": "piva00", "dom": 365, "sr": 86, "sc": 5.13, "ep": 6.31, "bs": 0.85, "d": 4, "age": 11.02, "grav": 101.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 10658, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.671, "fa": 0.34, "gp": 0.977, "bl": 0.32, "ds": 0.0, "txt": "The big businesses where most of the money is will do that, the small ones without the resources to setup a basic infra (well, mostly you need a harness which LLMs can help to customise for the orgs' needs [such as pi]) will pay the US$ 20/100 but that isn't where the big money for Anthropic is.\n\nAlso, jumping over to OpenAI's US$ 20/100 is also a drop-in replacement, if Anthropic tries to extract more revenue from their price-sensitive businesses those can just hop over to the competition without missing a beat.\n\nDo you understand why Anthropic doesn't have a moat for the big money? You are still green in this space, it's good to not hold strong opinions yet while you don't have the experience."}, {"id": 50630308, "au": "eddythompson80", "dom": 575, "sr": 87, "sc": 5.13, "ep": 5.43, "bs": 0.0, "d": 2, "age": 9.48, "grav": 80.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 3629, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.789, "fa": 0.0, "gp": 0.848, "bl": 0.0, "ds": 0.0, "txt": "\"hindsight is 20-20\" posts are the bread and butter of this forum though. Everything makes perfect sense in hindsight. If this was a post about how ANT is double its IPO you would have had a \"Well, of course. It's a young market and the opportunity is massive. We've only seen software companies buying tokens, but now BlahBlah industry is starting to buy tokens, and more to come\" or a \"Well, of course. My non-techy grandmother was telling me over thanksgiving how she's using Muse to build herself a knitting challenge where Muse pings her once a day to take a picture of her progress and comments on it with helpful tips\""}, {"id": 50636104, "au": "usef-", "dom": 105, "sr": 88, "sc": 5.13, "ep": 6.27, "bs": 0.85, "d": 5, "age": 2.6, "grav": 15.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 907, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.43, "fa": 0.68, "gp": 0.668, "bl": 0.32, "ds": 0.0, "txt": "Airport fees and taxes (20-40%) come out of the ticket too, and your number assumes all seats are sold. Half-empty flights do happen.\n\nI'm not seeing much breathing room when looking at current flight prices (Google says $206.33 USD, without looking any harder or using points/etc, which is pretty close to break even). The leg is competitive and many passengers pay lower. Connecting passengers too."}, {"id": 50633469, "au": "jey", "dom": 222, "sr": 89, "sc": 5.13, "ep": 5.41, "bs": 0.0, "d": 3, "age": 5.97, "grav": 41.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 7643, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.394, "fa": 0.28, "gp": 0.919, "bl": 0.0, "ds": 0.0, "txt": "Does this presume that probability of using OpenRouter is the same for all models? Like I wouldn't be surprised if people specifically using Anthropic models use first-party APIs, whereas people explicitly shopping on price are going through OpenRouter. The effect would be that OpenRouter stats don't reflect true usage of Anthropic and OpenAI models."}, {"id": 50633242, "au": "bombcar", "dom": 269, "sr": 90, "sc": 5.13, "ep": 5.41, "bs": 0.0, "d": 5, "age": 6.21, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 53939, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.338, "fa": 0.34, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "They'll almost certainly still exist ten, 20 years from now, perhaps even profitable; the question is if they're worth the investment now.\n\nAnd given that they have at least one \"exact copy\" competitor and likely have various hordes a year or two behind them, it's not clear that their \"market leadership\" is going to be worth the trillions."}, {"id": 50631425, "au": "bko", "dom": 602, "sr": 91, "sc": 5.13, "ep": 5.37, "bs": 0.0, "d": 1, "age": 8.26, "grav": 66.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 17439, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.386, "fa": 0.34, "gp": 0.787, "bl": 0.0, "ds": 0.0, "txt": "Wow, you seem very confident.\n\nDo you have any strategies you're willing to share about how you're personally shorting this stock? You must be exceptionally wealthy considering you hold such strong, anti-consensus convictions, so I probably can't do exactly what you're doing, but at least I can 5x my returns in the next 12 months"}, {"id": 50629912, "au": "danans", "dom": 569, "sr": 92, "sc": 5.13, "ep": 5.35, "bs": 0.0, "d": 3, "age": 9.9, "grav": 86.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 20, "k": 12445, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.351, "fa": 0.42, "gp": 0.676, "bl": 0.0, "ds": 0.0, "txt": "> but in hindsight they made the right move raising as much capital as possible before the debt markets dry up.\n\nWhat I've been reading is that this had relatively little to do with raising operational capital and like many recent IPOs, primarily about cashing out early shareholders and employees.\n\nI hope their first public earnings filings will reveal if that is true or not."}, {"id": 50628635, "au": "small_model", "dom": 479, "sr": 93, "sc": 5.13, "ep": 5.35, "bs": 0.0, "d": 1, "age": 11.32, "grav": 105.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 305, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.106, "fa": 0.68, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "Yes, revenue grew 10x every year while they are still much more expensive than open models (that aren't as good). People have been saying this for years, meanwhile the gap gets bigger (now distillation has been reduced) and it’s rode all the way to $1.5T market cap. Who should we believe the millions of traders, investment banks and the market, or some random HN poster."}, {"id": 50629503, "au": "futureshock", "dom": 38, "sr": 94, "sc": 5.13, "ep": 5.33, "bs": 0.0, "d": 0, "age": 10.35, "grav": 92.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 14350, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 1.606, "bl": 0.0, "ds": 0.0, "txt": "It’s possible for AI to be a transformative technology, for there to be trillions of profit to be had, for Anthropic to be the leading frontier research lab and for their stock to be a terrible investment.\n\nWe are entering uncharted waters in so many ways. You’d be a fool to put an amount of money into Anthropic that could hurt to lose."}, {"id": 50635990, "au": "overfeed", "dom": 18, "sr": 95, "sc": 5.13, "ep": 5.31, "bs": 0.0, "d": 1, "age": 2.76, "grav": 16.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 4634, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.615, "fa": 0.34, "gp": 0.379, "bl": 0.0, "ds": 0.0, "txt": "Here's my proven, bullet-proof, final word on food:\n\nBreakfast: 2 slices of wholewheat, lightly toasted. 1 egg, over easy. 2 shots of espresso, no sugar, no cream.\n\nLunch: skip it or get overweight\n\nSupper: boiled turkey breast, lightly peppered, with a dollop of ranch. 50g of peas. 2 light beers.\n\nThis amounts to a perfect mix of 300g of protein, 3750 kcal of carbs and about 8 grams of fat per day. I won't take anyone who disagrees with the above diet seriously, since I personally battle-tested it."}, {"id": 50633991, "au": "nater5000", "dom": 614, "sr": 96, "sc": 5.13, "ep": 5.28, "bs": 0.0, "d": 0, "age": 5.5, "grav": 37.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 824, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.706, "fa": 0.0, "gp": 0.877, "bl": 0.0, "ds": 0.0, "txt": "Whole lot of expert investors in here who are quick to claim \"victory\" for correlations beyond their control lol\n\nI've been around long enough to have made the mistake of shitting on an IPO, flaunting my expert \"analysis\" while watching the stock dip below the IPO price soon after, then quietly pretend I never made such claims as those stocks blew up on actual, meaningful timeframes where these kinds of investments actually matter.\n\nThere's no guarantee Anthropic will do good in the long run, but you're definitely wrong if you're treating this as proof they'll do bad lol"}, {"id": 50629063, "au": "kakacik", "dom": 296, "sr": 97, "sc": 5.13, "ep": 5.28, "bs": 0.0, "d": 3, "age": 10.84, "grav": 98.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.768, "fa": 0.0, "gp": 0.773, "bl": 0.0, "ds": 0.0, "txt": "There are many many folks who don't mind advertising at all. Or they do but only because it breaks fluidity of watching whatever they were watching.\n\nHeck, my climbing buddy is happy to use personalized ads and sometimes buys stuff shown to him. He has university degree.\n\nDon't hold your breath that some fringe opinion of cca industry insiders here like you and me is a major approach most folks take. Most simply don't care and rather chase dopamine kicks."}, {"id": 50629657, "au": "hirako2000", "dom": 339, "sr": 98, "sc": 5.13, "ep": 5.27, "bs": 0.0, "d": 6, "age": 10.18, "grav": 90.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 2365, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.785, "fa": 0.0, "gp": 0.744, "bl": 0.0, "ds": 0.0, "txt": "The point though, isn't whether open weight models could entirely replace 300k (or whatever) human workers.\n\nEither frontier labs can, and open weight will follow suit a few months after.\n\nOr frontier labs cannot. In which case open weight are or will become good enough.\n\nThe question is what moat can frontier labs, two of which values at over 1 trillion USD,  keep long enough to build a valid business model upon.\n\nIt isn't even clear they have a moat strong enough to even keep needing businesses long enough to profit (see Revolut and plenty of others who decided open weight are better value already)"}, {"id": 50629723, "au": "JumpCrisscross", "dom": 289, "sr": 99, "sc": 5.13, "ep": 5.25, "bs": 0.0, "d": 3, "age": 10.11, "grav": 89.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 17, "k": 194750, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.255, "fa": 0.42, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "> When do you typically have enough data for this?\n\nReal answer, never. Practical answer, after a couple days.\n\n> how the stock will behave in longer term?\n\nThere are predictable effects as lock-ups expire, index entry comes into scope, et cetera. And at the end of the day, an options hedger shouldn’t be taking long-term views on anything."}, {"id": 50631785, "au": "ActorNightly", "dom": 626, "sr": 100, "sc": 5.13, "ep": 5.24, "bs": 0.0, "d": 1, "age": 7.8, "grav": 60.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 2305, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.944, "fa": 0.0, "gp": 0.461, "bl": 0.0, "ds": 0.0, "txt": "Not at all.\n\nIn the modern day, there 4 types of active investors.\n\n1 Big firms tied to wallstreet with some form of insider knowledge who can basically do market manipulation at this point.\n\n2 The retail \"smart\" inverters who try to follow logic and are most allways on the opposite end of the trades from group 1\n\n3 The /r/wallstreetbets gamblers that invest on pure memes.\n\nIf you wanna make money, do literally the opposite of what makes sense. Anthropic is gonna go high. Wall street knows that AI sentiment is there, and as a result, its gonna let the price go down. Then they are gonna buy up a lot of it, generate some hype (watch Anthropic get handed a big government contract), and its gonna go up, then they will dump all of it."}, {"id": 50629921, "au": "andsoitis", "dom": 249, "sr": 101, "sc": 5.13, "ep": 5.47, "bs": 0.27, "d": 0, "age": 9.89, "grav": 86.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.692, "fa": 0.68, "gp": 1.314, "bl": 0.1, "ds": 0.0, "txt": "Don't fall into the trap of looking at short-term price movement. Where do you think it stands 3 years out? 5 years?"}, {"id": 50636135, "au": "pigpop", "dom": 191, "sr": 102, "sc": 5.13, "ep": 5.17, "bs": 0.0, "d": 1, "age": 2.56, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 390, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.949, "fa": 0.0, "gp": 0.407, "bl": 0.0, "ds": 0.0, "txt": "Brother, have you seen what Opus 5.5 and Fable can do with directing videos? Video editing and production are going to get hit hard. They can also produce a lot of the assets for those videos, motion graphics, hard surface modelling as well especially if given some references or concept art, pretty much any type of applied effects or postprocessing. They're also getting much better at the finer points of 3D asset production like animation.\n\nI'm not switching to open models so long as they keep pushing the frontier. Every few months you get new abilities and domains unlocked, that's worth the price of a subscription."}, {"id": 50630060, "au": "hirako2000", "dom": 562, "sr": 103, "sc": 5.13, "ep": 5.13, "bs": 0.0, "d": 4, "age": 9.74, "grav": 84.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 2365, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.362, "fa": 0.34, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "Revolut, and several other large corporations have already  concluded open weight models are better value.\n\nOr one can believe the fantasy that a 1000x unicorn can gulp the entire LLM market.\n\nClearly it's the fantasy that set the stock price."}, {"id": 50635090, "au": "notahacker", "dom": 87, "sr": 104, "sc": 5.11, "ep": 5.11, "bs": 0.0, "d": 6, "age": 4.08, "grav": 25.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 24214, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.806, "fa": 0.0, "gp": 0.6, "bl": 0.0, "ds": 0.0, "txt": "Lots of airlines are owned by governments and don't make profits. Generally they don't provide better service or cheaper prices than the commercial equivalents though, even if they do sometimes provide a valuable loss-making service on very marginal routes.\n\nUnlike tap water, the commercial airline market does allow for competition and unlike many other services government buying power doesn't really move the needle that much."}, {"id": 50629970, "au": "mortsnort", "dom": 603, "sr": 105, "sc": 5.05, "ep": 5.05, "bs": 0.0, "d": 1, "age": 9.84, "grav": 85.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 290, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.367, "fa": 0.34, "gp": 0.596, "bl": 0.0, "ds": 0.0, "txt": "These IPOs operate on FOMO and bigger sucker principles, so OpenAI will probably be fine. The smart investors will make a quick 20-50% selling on day 1 while FOMO suckers take the loss. This just happened with SpaceX and Anthropic."}, {"id": 50628329, "au": "torben-friis", "dom": 431, "sr": 106, "sc": 5.04, "ep": 5.04, "bs": 0.0, "d": 2, "age": 11.63, "grav": 110.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 28, "k": 12153, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.693, "fa": 0.76, "gp": 0.861, "bl": 0.0, "ds": 0.0, "txt": ">No, we're not going to switch to an open source alternative because it's a bit cheaper. No, we're not going to suddenly switch to Gemini or ChatGPT.\n\nWill you stay at Claude at 1000x the price?\n\nCause right now they're making Slack money from you, and the stock is not Slack priced."}, {"id": 50636061, "au": "Scaled", "dom": 100, "sr": 107, "sc": 5.0, "ep": 5.0, "bs": 0.0, "d": 2, "age": 2.65, "grav": 15.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 327, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.875, "fa": 0.0, "gp": 0.406, "bl": 0.0, "ds": 0.0, "txt": "The costs are immense and what modest profit there is goes into creative accounting to shift the profit into the balance sheet for rewards programs.\n\nTo make matters worse, a major expense the legacy carriers spend on is buying gates they don't use to keep out lesser funded rivals like Spirit.\n\nAirlines are just generally a bad investment, made even worse by the tactics they use."}, {"id": 50629919, "au": "kakacik", "dom": 419, "sr": 108, "sc": 4.98, "ep": 4.98, "bs": 0.0, "d": 6, "age": 9.9, "grav": 86.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1272, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.686, "fa": 0.0, "gp": 0.703, "bl": 0.0, "ds": 0.0, "txt": "I think the issue is not technical as you show, but bad management and various emotions which definitely seems like the case for the OP posting his... beginner questions.\n\nI don't think anybody argues if you want you can make your company utterly dependent on single model. But its poor management and bad long term strategy by responsible folks that allows that."}, {"id": 50628798, "au": "johndae", "dom": 274, "sr": 109, "sc": 4.95, "ep": 7.47, "bs": 2.52, "d": 0, "age": 11.14, "grav": 103.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": -1, "kpp": -0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 2.014, "fa": 0.34, "gp": 1.22, "bl": 0.95, "ds": 0.0, "txt": "They (brother, sister, and other founders) cashed out 1.5% or +500M. I think their main goal is to absorb as many services as possible and repackage them for enterprise businesses (SSO, etc.) before NVIDIA releases an open-weights marketplace and they themselves become AI hyperscalers too, while also selling GPUs at a premium. Are we forgetting that Google, FB, AWS, and Azure are also working and competing in the same space? Google Workspace (with Gemini), the MS ecosystem (with Azure AI or whatever name they're using today), etc. What about Grok or OpenAI (I forgot about them)? They already have those 500M in their pockets. If push comes to shove, they'll cash out more stocks, become billionaires, and retail investors will pony up the bill."}, {"id": 50628796, "au": "dmix", "dom": 480, "sr": 110, "sc": 4.93, "ep": 4.93, "bs": 0.0, "d": 1, "age": 11.14, "grav": 103.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 44116, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.689, "fa": 0.0, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "Open weight models still cost tens of millions and are usually done at a loss for strategic reasons by companies with bigger ambitions in AI.\n\nIf Anthropic can't make the economics work, is it even safe to assume that Meta, Alibaba, Moonshot, Z.ai etc will all keep funding these when the money dries up?\n\nPlus companies like Oracle exist even when MySql/postgres are popular."}, {"id": 50629434, "au": "cbg0", "dom": 552, "sr": 111, "sc": 4.83, "ep": 4.83, "bs": 0.0, "d": 1, "age": 10.41, "grav": 93.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 4668, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.058, "fa": 0.34, "gp": 0.946, "bl": 0.0, "ds": 0.0, "txt": "These \"hindsight is 20-20\" posts are such cheap shots. We could just as easily be looking at $200 a share today for Anthropic, given how irrational markets are."}, {"id": 50634617, "au": "MiroslavPokorny", "dom": 117, "sr": 112, "sc": 4.79, "ep": 4.79, "bs": 0.0, "d": 1, "age": 4.71, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 385, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.482, "fa": 0.0, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "Trillions from where ?\n\nThe entire world is barely worth a few trillion. The moment trillions move to a few eveyrthing else dies. Its like taking all the water, you might have lots of water but all the trees die and then theres no life and food and everything dies tomorrow."}, {"id": 50628532, "au": "laserDinosaur", "dom": 247, "sr": 113, "sc": 4.78, "ep": 4.78, "bs": 0.0, "d": 0, "age": 11.43, "grav": 107.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 647, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.549, "fa": 0.0, "gp": 0.789, "bl": 0.0, "ds": 0.0, "txt": "Anthropics business model makes me think of how things would have played out if the internet was invented by a single private company. Sure anyone can host their own ISP, but the cost of it still prohibits most regular users. All websites are hosted in the gigantic data centers that one or two companies own, and all traffic goes through them. What would that company be worth? What would the long term prospects look like as more and more ISP's start to enter the field? Especially as costs come down for more competitors. In some ways I guess that's kind of the trajectory of AOL."}, {"id": 50628643, "au": "ryandvm", "dom": 294, "sr": 114, "sc": 4.74, "ep": 4.74, "bs": 0.0, "d": 1, "age": 11.31, "grav": 105.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 215, "qw": 0, "k": 11406, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.867, "fa": 0.28, "gp": 1.315, "bl": 0.0, "ds": 0.0, "txt": "They have a business model - it's just so disturbing they can't say it out loud.\n\nIt's the same model Google and Facebook use. They're going to advertise so effectively it will make your head spin. Today's advertisers use signals and tracking and they get pretty close to guessing what you're in the market for.\n\nThe new generation of AI advertisers are going to know every bump and ridge and your demographic profile because of all the weird questions you like to ask your AI. They'll know your prejudices and your political opinions, your interests and your icks, but most importantly - your cognitive biases.\n\nThen they're going to take it to the next level. The AI companies are going to have their models actively nudging you in the direction of their advertising clients. You're going to be subjected to subliminal advertising campaigns so subtle and natural that you won't have any idea that it even happened. Anthropic/OpenAI/Google/Facebook are going to have their models working on you for months to buy that new Range Rover or take that trip or ask your doctor about Fukitol because of course that's what \"a smart guy like you\" would do (according to your trusted model).\n\nIt's dark. And it's going to be wildly successful."}, {"id": 50630190, "au": "ifwinterco", "dom": 651, "sr": 115, "sc": 4.73, "ep": 4.73, "bs": 0.0, "d": 0, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 1637, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.642, "fa": 0.0, "gp": 0.604, "bl": 0.0, "ds": 0.0, "txt": "Unlock schedule is pretty aggressive so unfortunately Dario and the rest of the EA cultists will probably still get a huge amount of money to use for whatever comic book supervillain schemes they can come up with next, even if the stock somehow goes to zero in a year.\n\nAnd as always, retail is left holding the bag after the insiders have cashed out"}, {"id": 50628208, "au": "muglug", "dom": 202, "sr": 116, "sc": 4.71, "ep": 4.71, "bs": 0.0, "d": 0, "age": 11.79, "grav": 112.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 7602, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.963, "fa": 0.34, "gp": 1.017, "bl": 0.0, "ds": 0.0, "txt": "This means very little. Poor initial stock performance seems to have little bearing on price after 1, 2 and 3 years post-IPO."}, {"id": 50629954, "au": "el-berg", "dom": 652, "sr": 117, "sc": 4.66, "ep": 4.66, "bs": 0.0, "d": 0, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 8, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.597, "fa": 0.0, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "The discourse around Anthropic lately is baffling. Setting aside the animosity that I can only make sense of through the lens of FUD or jealousy, people think this somehow hurts or spells the end for Anthropic…\n\nThey secured the bag they needed to fund their compute build out. Now it’s just the market playing its usual games."}, {"id": 50630195, "au": "999900000999", "dom": 635, "sr": 118, "sc": 4.65, "ep": 4.65, "bs": 0.0, "d": 0, "age": 9.59, "grav": 82.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 7271, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.774, "fa": 0.68, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "I was just vibe coding with Mai 2 Flash yesterday and it was fine.\n\nThis is the core problem with LLM companies, nothing stops Microsoft or Google from selling tokens at below cost.\n\nHow can you compete with someone who doesn’t need to make a profit ?\n\nLocal interface gets better everyday. Hypothetically if by 2028 Chinese ram floods the market building a 128gb llm box becomes possible for cheap."}, {"id": 50637139, "au": "Beached", "dom": 13, "sr": 119, "sc": 4.64, "ep": 4.64, "bs": 0.0, "d": 3, "age": 0.58, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 650, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.797, "fa": 0.0, "gp": 0.289, "bl": 0.0, "ds": 0.0, "txt": "I largely agree. Today, localAI just isnt ready for prime time. It will be though, I think it is inevitable. Doesn't mean we stop developing it, doesnt mean we stop using it, it just means we realize it has severe limitations, and cant do the job as good as the more capable and often cheaper options of the frontier labs. The cost of hardware is insane these days, so unless you are sitting on a stash of hardware that is under used, buying hardware for LocalAI with today's prices, thinking you will come out ahead of an ANT sub is silly."}, {"id": 50630026, "au": "jrflo", "dom": 595, "sr": 120, "sc": 4.63, "ep": 4.63, "bs": 0.0, "d": 1, "age": 9.78, "grav": 84.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.719, "bl": 0.0, "ds": 0.0, "txt": "Stock prices are quite literally a function of hype, hopes, and dreams; i.e. expectations of future value, not present value. If you think the market is \"irrational\" or \"departing from fundamentals\", you actually just don't understand the market, because the market is effectively the most efficient representation of the current information landscape.\n\nIf you do actually know better than the market, you better get to Wall St. because you'll quickly become a billionaire."}, {"id": 50629658, "au": "uptrails", "dom": 582, "sr": 121, "sc": 4.59, "ep": 4.59, "bs": 0.0, "d": 2, "age": 10.18, "grav": 90.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 548, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.226, "fa": 0.34, "gp": 0.51, "bl": 0.0, "ds": 0.0, "txt": "A company with high P/E can be, quite rationally, valued more fairly than a company with low P/E if the first one has very uncertain outlook for future revenues, while the second one is a boring, stable business that isn't going anywhere.\n\nAnthropic is a perfect example of the former. Their current revenue numbers, or their current growth rate, tell me nothing useful about their revenue 2-3 years from now."}, {"id": 50628314, "au": "grey-area", "dom": 482, "sr": 122, "sc": 4.46, "ep": 4.46, "bs": 0.0, "d": 1, "age": 11.65, "grav": 110.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 24936, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.327, "fa": 0.28, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "I think they do have a future business model, it's just not reflected in the share price yet.\n\nWorst case for Anthropic, they can pause training, let go of their lead, and still make a lot of money selling inference (just not as much as their valuation implies).\n\nYes they have little moat and can be undercut, but their product is as it stands useful."}, {"id": 50637348, "au": "zug_zug", "dom": 617, "sr": 123, "sc": 4.36, "ep": 4.36, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.299, "fa": 0.34, "gp": 0.235, "bl": 0.0, "ds": 0.0, "txt": "Professions absolutely change their position on whether a stock is a buy or sell based on a 20% swing.\n\nThough ironically, unlike novices, the more the stock tanks the more the investor wants it."}, {"id": 50628548, "au": "trwly", "dom": 180, "sr": 124, "sc": 4.29, "ep": 6.81, "bs": 2.52, "d": 0, "age": 11.41, "grav": 107.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 2, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.328, "fa": 0.34, "gp": 1.876, "bl": 0.95, "ds": 0.0, "txt": "There will be no growth. They already invaded the whole software market with an unprecedented marketing campaign. They won't have new customers.\n\nExisting customers will reevaluate and switch to open models or dump AI altogether.\n\nIt should be priced like Ford, so maybe $10 would be correct."}, {"id": 50636981, "au": "cucumber3732842", "dom": 12, "sr": 125, "sc": 4.28, "ep": 4.28, "bs": 0.0, "d": 2, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 26, "k": 1088, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.487, "fa": 1.1, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">The LocalAI community seem to have this opinion that \"Good Enough\" to fumble through a task with numerous reworks and repeat bug fixing, is equivalent to Fabel 5.2.\n\nHow many servers ran linux in 1996?\n\nHow many of these workloads are running on anything other than linux in 2026?\n\nNow, there's prob 20yr of money to be made making and supporting the Windows Server of AIs, but the point still stands."}, {"id": 50637198, "au": "LeoUnderwood", "dom": 205, "sr": 126, "sc": 4.28, "ep": 6.79, "bs": 2.52, "d": 0, "age": 0.42, "grav": 4.9, "surf": 22.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.775, "fa": 0.68, "gp": 0.472, "bl": 0.95, "ds": 0.0, "txt": "Two deal terms seem relevant to the price action. Insiders were allowed to sell up to 316 million shares starting on Day 1, instead of the usual 6-month lockup, so early supply was much larger than a typical IPO. And the banks selling the stock also lent Anthropic $15B, which is worth keeping in mind when reading the underwriters' coverage."}, {"id": 50628123, "au": "thinkingtoilet", "dom": 285, "sr": 127, "sc": 4.19, "ep": 4.19, "bs": 0.0, "d": 0, "age": 11.9, "grav": 114.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2530, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "It's such a bummer you can't buy options the day of the IPO. These massive valuations are nothing but an exit strategy for initial investors. Gone are the days of building a company and letting investors get in on the growth. Get a literally insane valuation, go public, dump your stock and run."}, {"id": 50634167, "au": "otherme123", "dom": 80, "sr": 128, "sc": 4.19, "ep": 4.19, "bs": 0.0, "d": 4, "age": 5.32, "grav": 36.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 2740, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.49, "fa": 0.0, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "More than competition is that there is close to zero customer preference between company A and company B. There is a lot of competition in the soda market, but client preferences are usually not price sensitive: yes, Cola-X is cheaper, but I love Coca-Cola even at a higher price. Same with sneakers, or clothing, some are \"allowed\" to have higher margins.\n\nAI labs, the same than airplanes or printing paper: you use Claude because it is slightly better for what you pay. The minute anyone releases a better model or an equal model but minimally cheaper, you switch AI provider. Zero margin, zero brand loyalty, huge capital expenses just to keep afloat."}, {"id": 50629816, "au": "littlecranky67", "dom": 430, "sr": 129, "sc": 4.17, "ep": 4.17, "bs": 0.0, "d": 2, "age": 10.0, "grav": 87.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 5938, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.17, "fa": 0.34, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "You are basically doing what everybody is doing - discovering the wonders of AI by Claude and think that is the end of it. But unlest you tried other models and especially open-weight ones (Kimi, GLM) you simply don't know how close they are. And you can't easily evaluate, because there are not many providers ofering hosted solutions. And those providers have to charge more, because they must actually make a profit on every token.\n\nBut once the market finds actual, true prices, you will be pressured to evaluate other models once Claude costs 20x of what is costs today because investor capital only lasts so long."}, {"id": 50630227, "au": "mvkel", "dom": 194, "sr": 130, "sc": 4.1, "ep": 4.1, "bs": 0.0, "d": 0, "age": 9.56, "grav": 81.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 3749, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.827, "fa": 0.0, "gp": 1.49, "bl": 0.0, "ds": 0.0, "txt": "Other companies that went down after IPO: Amazon, Netflix, Tesla, Meta.\n\nThis is textbook IPO behavior."}, {"id": 50630401, "au": "viktorcode", "dom": 255, "sr": 131, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 1, "age": 9.38, "grav": 79.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1970, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.878, "fa": 0.56, "gp": 0.277, "bl": 0.0, "ds": 0.0, "txt": "That's wholly dependent on whether or not they will be able to fulfil their financial obligation for the next 3 years. And that depends on the stock price today."}, {"id": 50633164, "au": "pwarner", "dom": 262, "sr": 132, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 1, "age": 6.29, "grav": 45.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 953, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.864, "fa": 0.68, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "Between $0 and $10T market cap.  I think both are very possible.\nMost likely?  I'll say right at IPO valuation of $1.7T or whatever it was.\nI own 7 shares so I can join in the fun."}, {"id": 50633485, "au": "reticulates", "dom": 236, "sr": 133, "sc": 4.06, "ep": 4.06, "bs": 0.0, "d": 1, "age": 5.96, "grav": 41.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 1140, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.458, "fa": 0.0, "gp": 0.436, "bl": 0.0, "ds": 0.0, "txt": "If you’re looking for a third guaranteed loser, write me a check. I will repair your feelings towards Hashicorp and (inevitably) Anthropic by making their losses look very reasonable compared to mine."}, {"id": 50630159, "au": "luke5441", "dom": 640, "sr": 134, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 1, "age": 9.63, "grav": 82.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 413, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.815, "fa": 0.68, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "It still has a over $1 trillion market cap. Apple did not become a trillion dollar company until 2018 and was the first one of them.\n\nAt a different price it would perhaps be worth the gamble."}, {"id": 50629949, "au": "koolba", "dom": 558, "sr": 135, "sc": 4.03, "ep": 4.03, "bs": 0.0, "d": 3, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 38333, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.32, "fa": 0.0, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": "The fundamentals for Anthropic involve it taking over a non-trivial chunk of world knowledge work GDP.\n\nWe’ve already seen it with software and only the most rabid programmers would think they have a future writing code.\n\nThe real question is not even how much of the pie AI is going to gobble, it’s whether this particular player is going to do it and not someone else."}, {"id": 50634802, "au": "MattDamonSpace", "dom": 137, "sr": 136, "sc": 4.02, "ep": 4.02, "bs": 0.0, "d": 2, "age": 4.47, "grav": 28.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 408, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.297, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ehhh idk man look at e.g. the Apple lifetime stock chart. In 2016 it would have been insane to imagine a >$4T valuation.\n\nWhere did the money come from? The economy grows"}, {"id": 50628294, "au": "preommr", "dom": 499, "sr": 137, "sc": 4.02, "ep": 4.02, "bs": 0.0, "d": 2, "age": 11.67, "grav": 110.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 14, "k": 5068, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.048, "fa": 0.42, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "> There has never in history been a startup more successful at growing revenue than Anthropic.\n\nMaybe that should be an indication that Anthropic is an outlier that can't be judged.\n\nIt's also the only company where it's success puts itself out of a business.\n\nNot just distilliation, but stuff like Andrej Karpathy saying that 1B parameters is maybe enough for a strong cognitive model. We need further AI breakthroughs, and Anthropic is paving the way there at breakneck speed. Which is good for the rest of us that get the discoveries, but bad for them because they're paying the  really expensive bills."}, {"id": 50634876, "au": "tsimionescu", "dom": 400, "sr": 138, "sc": 4.0, "ep": 4.0, "bs": 0.0, "d": 6, "age": 4.36, "grav": 27.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 23225, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.272, "fa": 0.34, "gp": 0.028, "bl": 0.0, "ds": 0.0, "txt": "They can't justify their valuation if all they can sell are their subscriptions. They simply can't be worth >1T dollars if all their revenue is 20-200$/user/month, even if they had about 100% of such a market.\n\nSo the whole discussion of them being profitable or margins etc at subscription prices is a red herring. Sure, maybe they can be. It would still suggest they are massively, massively overvalued."}, {"id": 50634569, "au": "sp1nningaway", "dom": 82, "sr": 139, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 5, "age": 4.76, "grav": 31.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 227, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.288, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I like the airline/soda comparison because it shows the different nature of the products. Flying through the air to get anywhere in the world is a magic, society-altering product. It’s hard and expensive to run an airline, but if you got one, you’re capturing 99% of the magic. Soda just ain’t that.\n\nLLMs are an incredible, world-altering class of product, but the ergonomics and branding of competing products just matter less. If intelligence is equal, I’m gonna go with the cheaper one."}, {"id": 50634572, "au": "ashkankiani", "dom": 318, "sr": 140, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 3, "age": 4.76, "grav": 31.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 710, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.246, "fa": 0.34, "gp": 0.064, "bl": 0.0, "ds": 0.0, "txt": "Anthropic's spend obligations exceed their cash on hand by a few hundred billion, meaning they need to be able to raise herculean amounts of debt or they need like >20% YoY growth full stop.\n\nThe gradual process is an unacceptable solution for them to meet their existing obligations."}, {"id": 50630675, "au": "IAmGraydon", "dom": 660, "sr": 141, "sc": 3.99, "ep": 3.99, "bs": 0.0, "d": 1, "age": 9.07, "grav": 75.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5418, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.284, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "$500? You see gains like that when you buy a relatively unknown company that later becomes well known. You aren't going to see gains like that when you buy a company that is literally the center of the biggest financial bubble known to man during its IPO. Personally, I have my doubts that Anthropic will even remain solvent in the long run."}, {"id": 50630450, "au": "fullshark", "dom": 261, "sr": 142, "sc": 3.97, "ep": 3.97, "bs": 0.0, "d": 1, "age": 9.33, "grav": 79.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 9246, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.287, "bl": 0.0, "ds": 0.0, "txt": "The fact that our entire industry is based on pumping and dumping IPOs on the public is a bigger deal than just a short term price movement.  It affects company/VC strategy, what companies and ideas get funded, and how the company positions itself from genesis to IPO."}, {"id": 50628486, "au": "rlpb", "dom": 325, "sr": 143, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 3, "age": 11.47, "grav": 107.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 11065, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.688, "fa": 0.68, "gp": 0.267, "bl": 0.0, "ds": 0.0, "txt": "Yes but only in perhaps <5% of the market. There they will command a significant premium, but current valuations seem to assume that they will capture 100% of the market."}, {"id": 50633504, "au": "coverband", "dom": 196, "sr": 144, "sc": 3.92, "ep": 3.92, "bs": 0.0, "d": 1, "age": 5.94, "grav": 41.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 514, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.523, "fa": 0.68, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "Yep. Especially when they reprice upwards at the last minute. The extra $10-15 to $83 was their bonus from initial demand."}, {"id": 50629455, "au": "bryanlarsen", "dom": 350, "sr": 145, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 4, "age": 10.38, "grav": 92.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 4, "k": 43695, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.84, "fa": 0.56, "gp": 0.236, "bl": 0.0, "ds": 0.0, "txt": "> $20/month/user is nothing.\n\nExactly.   At that price it's likely a loss leader.   And even if it is mostly profit, it still doesn't justify a $1T valuation.   Their valuation depends on a lot of customers paying a lot more than $20/month."}, {"id": 50629865, "au": "ungovernableCat", "dom": 539, "sr": 146, "sc": 3.91, "ep": 3.91, "bs": 0.0, "d": 0, "age": 9.95, "grav": 87.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 311, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.687, "bl": 0.0, "ds": 0.0, "txt": "Still super early days. If you believe in the company this is a great buying opportunity.\n\nEven if you’re cynical you could assume they’re going to have some more pumps timed around their planned cash out dates in the next couple of quarters."}, {"id": 50630322, "au": "ianm218", "dom": 464, "sr": 147, "sc": 3.9, "ep": 3.9, "bs": 0.0, "d": 3, "age": 9.47, "grav": 80.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.598, "fa": 0.0, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "There’s lot of 3rd parties offering DeepSeek models.\n\nThey are a top Chinese lab so they have access to high end NVidia chips and Hauwei’s best chips. Lots of third parties are still profitable running on H200’s and the like which are often an order of magnitude less efficient"}, {"id": 50629952, "au": "gen220", "dom": 316, "sr": 148, "sc": 3.89, "ep": 3.89, "bs": 0.0, "d": 2, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 5344, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.919, "fa": 0.28, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "I’m not an Anthropic apologist, but I don’t think this is an accurate representation of how they expect RSI takeoff to happen.\n\nMy understanding is that it’s a more gradual process. And that there’s no reason to expect a linear progression of parameter counts or training costs.\n\nRSI is more about letting Mythos iterate on model architecture and training methods, which unlock efficiencies and performance improvements that don’t necessarily correlate with parameter counts.\n\nAgain I don’t have an opinion on whether this will or has already happened. Anthropic claims that they’re seeing evidence of it internally but it’s such a fuzzy target that it’s hard to judge without seeing a more capable model. But I do think it’s been clear that they have the $most_capable_model for almost a year now, and that others are playing catch up. That might be its own tell that they’re approaching RSI or not, but it’s impossible to know from the outside."}, {"id": 50631970, "au": "jaybrendansmith", "dom": 536, "sr": 149, "sc": 3.82, "ep": 3.82, "bs": 0.0, "d": 0, "age": 7.61, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1249, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.871, "fa": 0.34, "gp": 0.554, "bl": 0.0, "ds": 0.0, "txt": "AI is transformative technology. Any other viewpoint is at this point wishful thinking. This is a short-term correction, Anthropic is going to grow by 10-50x in the next five years."}, {"id": 50630031, "au": "surgical_fire", "dom": 513, "sr": 150, "sc": 3.81, "ep": 3.81, "bs": 0.0, "d": 2, "age": 9.77, "grav": 84.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.62, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I am a user of Claude, DeepSeek, and GLM.\n\nThe only world of difference I see in between those models is the cost.\n\nFor regular software development work, they are all very similar in terms of capabilities. In fact, I prefer the communication style of Chinese models. Reading the word salad that Claude outputs is annoying.\n\nMaybe if you are working in some cutting edge project in a different industry it makes some difference? For regular software development work, it makes none."}, {"id": 50630285, "au": "ifwinterco", "dom": 625, "sr": 151, "sc": 3.8, "ep": 3.8, "bs": 0.0, "d": 1, "age": 9.5, "grav": 81.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 1637, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.523, "fa": 0.0, "gp": 0.153, "bl": 0.0, "ds": 0.0, "txt": "Ideal scenario is to not buy it after it's already a $2tn company and most of the upside is already gone even if things go well.\n\nYou want to get in early but for that you need to be part of the SV elite not a regular schmuck like us.\n\nEven index funds are basically just exit liquidity for people who probably went to the island, it's kind of dark.\n\nI've got no problem with people building companies and making money, but when the whole economy is extracting money from regular people and funnelling it to the worst people in the world who've done things that would make the devil blush, that is an issue"}, {"id": 50633985, "au": "SecretDreams", "dom": 92, "sr": 152, "sc": 3.76, "ep": 3.76, "bs": 0.0, "d": 3, "age": 5.51, "grav": 37.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1508, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.361, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "Airlines will never be meaningfully profitable because the competition will always drive prices down. There is no technological barrier to entry, only a capital barrier.\n\nAI will be similar to airlines in this respect. Leading labs be damned, most people want to pay for the thing that is good enough to answer basic questions, not solve a math problem we've never heard of.\n\nAnd, on the rare chance they achieve agi, we're cooked anyways - money won't matter if that happens in the long run. Like nuclear fusion."}, {"id": 50629242, "au": "DanielHB", "dom": 487, "sr": 153, "sc": 3.76, "ep": 3.76, "bs": 0.0, "d": 1, "age": 10.62, "grav": 96.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3149, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.761, "fa": 0.62, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "Another point: Even if frontier models are 30-50% above the open weight ones on benchmarks, it doesn't really matter. It only matters how good they are at the task you are using them for. Very few people are proving math theorems."}, {"id": 50631869, "au": "NichoPaolucci", "dom": 328, "sr": 154, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 4, "age": 7.71, "grav": 59.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 804, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.075, "fa": 0.34, "gp": 0.17, "bl": 0.0, "ds": 0.0, "txt": "Sure, but this would (IMO) be more like an F1 car.\n\nForward looking a bit, but my guess is that the next few year’s cheap models will satisfy 95% of the markets needs. Frontier intelligence is going to be mostly reserved for government / highly specialized use cases."}, {"id": 50634640, "au": "afavour", "dom": 139, "sr": 155, "sc": 3.74, "ep": 3.74, "bs": 0.0, "d": 1, "age": 4.67, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 30748, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.3, "fa": 0.0, "gp": 0.47, "bl": 0.0, "ds": 0.0, "txt": "Look at the video games crash in the 80s. Or the dot com crash. The companies in both were directionally right, video games are huge and the internet is intertwined in our lives. But those companies still went bankrupt."}, {"id": 50634315, "au": "otherme123", "dom": 254, "sr": 156, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 3, "age": 5.11, "grav": 34.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 2740, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.516, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "Nobody can buy compute at Anthropic or OpenAI levels and prices. If Anthropic can't pay and tries to resell, why would I buy compute through them instead of buying straight from Google? Heavy discounts maybe? Selling \"assets\" at discount to pay obligations sounds a lot like bankrupcy."}, {"id": 50637287, "au": "WheelsAtLarge", "dom": 45, "sr": 157, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 7, "age": 0.16, "grav": 4.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 5797, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.579, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Competition from new players is what usually changes things. These days startups are what R&D used to be. A new, innovative startup comes along and changes everything. Many companies, even very profitable ones, consider R&D a drain on profits, so they cut it altogether or reduce it to a minimum."}, {"id": 50628516, "au": "dzonga", "dom": 474, "sr": 158, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 1, "age": 11.45, "grav": 107.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 4297, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.434, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "there's a glut of hardware i.e gpu's. the only thing that's out of capacity in the west is electricity (grid capacity).\n\nif there's total lift on sanctions about advanced chips (gpus) to china & many providers cloud were allowed to set up in mongolia where electricity is cheap & sparse population - you would see how quickly prices drop since datacenters will be built up quick compared to the west where politics is playing a huge factor."}, {"id": 50628567, "au": "rfgplk", "dom": 657, "sr": 159, "sc": 3.57, "ep": 3.57, "bs": 0.0, "d": 0, "age": 11.4, "grav": 106.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 86, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.48, "fa": 0.68, "gp": 0.347, "bl": 0.0, "ds": 0.0, "txt": "Yea, I'm down $500k at this point, might as well hold. Planning on exiting at ~$500 and not a cent below that"}, {"id": 50634957, "au": "grogers", "dom": 252, "sr": 160, "sc": 3.55, "ep": 3.55, "bs": 0.0, "d": 3, "age": 4.26, "grav": 27.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1015, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.497, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Yes, they will be able to resell excess compute capacity at some price, but possibly not at a price that keeps them afloat. The scenario where Anthropic ends up not using their negotiated compute seems likely to be correlated with data center capacity overall outstripping demand."}, {"id": 50634220, "au": "233mhz", "dom": 270, "sr": 161, "sc": 3.52, "ep": 3.52, "bs": 0.0, "d": 5, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 14, "k": 361, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.578, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Their revenue is mostly enterprise, which pays per token, not per user per month.\n\nUnder 150 employees you can just pay subscription plans for you employees, that's a lot of employees. And large companies, even cloudflare, accenture, &co are putting hard caps on per employee api spendings"}, {"id": 50629946, "au": "andsoitis", "dom": 591, "sr": 162, "sc": 3.5, "ep": 3.76, "bs": 0.27, "d": 1, "age": 9.87, "grav": 85.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 16, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.56, "fa": 0.76, "gp": 0.192, "bl": 0.1, "ds": 0.0, "txt": "> drops by 70-80+% in the next 12 months. That’s closer to where sane fundamentals would price it.\n\nI'd be curious to see your back-of-the-napkin calculation for this projection, but 3 years out. When I look at current cash flows, growth trajectory I don't get to the same steep discount you proclaim."}, {"id": 50630140, "au": "Rapzid", "dom": 547, "sr": 163, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 2, "age": 9.65, "grav": 83.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 6952, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.162, "fa": 0.0, "gp": 0.526
