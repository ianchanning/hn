, "bl": 0.0, "ds": 0.0, "txt": "It may just be the end of unlimited money for frontier training. The inference demand isn't going anywhere. So even after Anthropic and OpenAI go to the great chop shop in the sky Microsoft, Amazon, and Google will continue to serve up the tokens."}, {"id": 50633310, "au": "KerrAvon", "dom": 279, "sr": 164, "sc": 3.48, "ep": 3.48, "bs": 0.0, "d": 1, "age": 6.12, "grav": 43.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 4381, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.481, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There is nothing Anthropic is doing that's unique. They're not valueless, but the stock is way overvalued at the current price.\n\nAnd, if they're as important as they themselves claim to be: They're the nuclear weapons of our time, so they claim. Treat them as such. Confiscate Dario and Musk and Altman's assets. Nationalize Nvidia, SpaceX, Anthropic, and OpenAI. Put nonpartisan government scientists in charge of them. Bad for innovation, and would serve them fucking right."}, {"id": 50634063, "au": "serf", "dom": 234, "sr": 165, "sc": 3.47, "ep": 3.47, "bs": 0.0, "d": 5, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 11540, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.417, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "opencode and workbuddy both had free/near-free events for hy4-flash, presumably because openrouter and nous portal had free qwen4-max events.\n\nwhat i'm getting at is these inflated event numbers don't reflect the reality of preference for people, because a lot of model-agnostic folks fly to wherever is pouring out free tokens..\n\n(myself included.)"}, {"id": 50629801, "au": "dominotw", "dom": 662, "sr": 166, "sc": 3.46, "ep": 3.46, "bs": 0.0, "d": 0, "age": 10.01, "grav": 87.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 6923, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.29, "fa": 0.0, "gp": 0.292, "bl": 0.0, "ds": 0.0, "txt": "Have you see that famous clip of dario and co clapping like demented seals at their ipo?\n\nThat clip convinced me to invest in anthropic. These ppl look like no one else. They have the crazy factor to build a trillion dollar company from scatch in a just few years. They are not like you and me."}, {"id": 50634561, "au": "cmiles8", "dom": 300, "sr": 167, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 2, "age": 4.77, "grav": 31.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 5640, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.998, "fa": 0.34, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "There’s not enough money in global advertising to make that work financially. The whole “but there will be ads” argument fails to realize that the ad market is fixed. Corporate marketing budgets aren’t suddenly going to 10x so save AI companies."}, {"id": 50635231, "au": "bob778", "dom": 158, "sr": 168, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 3, "age": 3.87, "grav": 24.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 153, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.041, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The obligations are agreed in costs only, not a specific number of GPUs/racks, so they are worth ~$900b today or tomorrow because the hardware is only being purchased at time of deployment (give or take 12 months). They won't change in value much until deployed, and then once deployed, will depreciate fast."}, {"id": 50630672, "au": "SpicyLemonZest", "dom": 557, "sr": 169, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 4, "age": 9.07, "grav": 75.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 10045, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.454, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think “hype” and “liquidity sucker” are straightforward factual descriptions of a stock that’s falling so rapidly despite launching at a premium to the IPO price. The day 1 buyers were clearly people who wanted to get Anthropic exposure immediately at any cost."}, {"id": 50634993, "au": "throwaway69123", "dom": 157, "sr": 170, "sc": 3.42, "ep": 3.42, "bs": 0.0, "d": 2, "age": 4.21, "grav": 26.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 205, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.186, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To me the most interesting aspect of anthropic is its data center obligations, the thing that people are being most negative about, if the hardware supply continues to be constrained, and at this time it appears to me it will be, I cant see how this few 100bn worth of \"obligations\" wont be incredibly valuable."}, {"id": 50637176, "au": "WheelsAtLarge", "dom": 116, "sr": 171, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 1, "age": 0.48, "grav": 5.1, "surf": 16.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 5797, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.357, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "This is the speculation era of AI. We are only guessing at what riches AI can bring. It seems crazy that a trillion-dollar-plus company can get much richer, but we were saying the same thing about companies worth hundreds of billions years ago.\n\nMy take is that you can't just bet on one company. You need to pick a few. Anthropic is just one more to add to the mix. You won't hit the jackpot with the mix, but you won't go broke either."}, {"id": 50635595, "au": "marshray", "dom": 267, "sr": 172, "sc": 3.34, "ep": 3.34, "bs": 0.0, "d": 5, "age": 3.39, "grav": 20.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 11883, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.395, "fa": 0.0, "gp": 0.039, "bl": 0.0, "ds": 0.0, "txt": "They'd need more subscribers than Netflix has today just to break even, and they need them before the market loses patience with funding their losses. (Back of the envelope disclaimer applies)\n\nThat's what's so significant about the stock trading below IPO - it suggests the market's patience may already be wearing thin."}, {"id": 50629979, "au": "pelagicAustral", "dom": 629, "sr": 173, "sc": 3.32, "ep": 3.32, "bs": 0.0, "d": 0, "age": 9.84, "grav": 85.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 3668, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.666, "bl": 0.0, "ds": 0.0, "txt": "Oh deary me... Dario really needs all the bad OSS models to disappear most quick, else there is no moat."}, {"id": 50636397, "au": "MiroslavPokorny", "dom": 123, "sr": 174, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 4, "age": 2.09, "grav": 12.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 385, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.066, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So by your metrics those obese people who cant move and need a crane to get out of their bed are the most successful ?\n\nSuccess should be measured by living, not by gigabytes or economic activity. Econimic activity by defintion means you are serving someone else instead of enjoying your own life the way you wish."}, {"id": 50630082, "au": "bjornsing", "dom": 583, "sr": 175, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 2, "age": 9.71, "grav": 83.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 5245, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.491, "fa": 0.68, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "My theory is that we’ll see P/E ratios come down in general now as AI starts to impact the economy. It’s just not sound right now to extrapolate earnings 20-30 years into the future. No one knows what the world will look like 10 years from now, who will be making money or what companies will be successful."}, {"id": 50636338, "au": "tptacek", "dom": 21, "sr": 176, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 2, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 427120, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure I understand how your daily intake eval is comparable to their business process eval. There is in fact no question that there are an unbounded number of meal plans that will get you to your macro goals. Whether that's true of AI models is the entire question we're debating."}, {"id": 50633642, "au": "mortenjorck", "do et those in our lives but full company of them sounds like a business that should crash pretty soon unless they have some monopoly."}, {"id": 50633224, "au": "digitaltrees", "dom": 633, "sr": 180, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 0, "age": 6.23, "grav": 44.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3546, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.749, "fa": 0.28, "gp": 0.456, "bl": 0.0, "ds": 0.0, "txt": "Just more evidence that the stock market is a way to cash out all the gains that are captured by privacy market accredited investors."}, {"id": 50636416, "au": "bjt", "dom": 193, "sr": 181, "sc": 3.2, "ep": 3.2, "bs": 0.0, "d": 2, "age": 2.06, "grav": 12.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2341, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.538, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How deep is their moat though? They could make the most amazing videos in the world but if an open weight model can do 90% as good a job for 1% of the cost, Anthropic won't make money there."}, {"id": 50629880, "au": "littlecranky67", "dom": 472, "sr": 182, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 2, "age": 9.94, "grav": 86.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5938, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.944, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No one challenges the usefulness of Claude. My point is, once the true price of tokens is discovered (when investor subsidized tokens run out), why wouldn't companies move to Kimi or GLM hotsed by other providers when these cost 20x less than Claude."}, {"id": 50637099, "au": "desireco42", "dom": 33, "sr": 183, "sc": 3.19, "ep": 3.19, "bs": 0.0, "d": 1, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 1244, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "My first reaction is to dismiss your experience, it doesn't seem sensible at all, but really I have no reason not to believe you. If you have such system and it is actually able to do proper distribution, how it is that it is picking more expensive and models that overcomplicate over other solutions.\n\nI use GLM and several others daily. From OpenAI, I use Sol but often Luna as it is very fast and can perform tasks well. My experience is opposite of yours. For most part, you don't really need frontier models and it is a waste to use them. The models that can do work fastest are the ones that are preferred."}, {"id": 50629850, "au": "jstummbillig", "dom": 599, "sr": 184, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 1, "age": 9.96, "grav": 87.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 6624, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.82, "fa": 0.34, "gp": 0.197, "bl": 0.0, "ds": 0.0, "txt": "I assume you're buying long-dated puts? A 70–80% decline within 12 months should be a remarkably profitable opportunity for you."}, {"id": 50635456, "au": "tguedes", "dom": 110, "sr": 185, "sc": 3.18, "ep": 3.18, "bs": 0.0, "d": 3, "age": 3.59, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 344, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.343, "bl": 0.0, "ds": 0.0, "txt": "What is even this comment? Is this a bot?\n\nJust look at their financial statements.\n\nDelta, United, and AA make some profit but their margins are awful. Spirit went bankrupt. Frontier has been unprofitable for a few years. Southwest is on the edge.\n\nWhat kind of argument is using just 1 route to make a general statement like it's a myth that very few Airlines make any real money"}, {"id": 50628498, "au": "hodder", "dom": 497, "sr": 186, "sc": 3.17, "ep": 3.17, "bs": 0.0, "d": 3, "age": 11.46, "grav": 107.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1957, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.35, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You don't need just one model to win to beat open weight from tearing down the economics. You simply need scale. It seems likely to me that you will have a runwaway model as compute infra becomes less constrained, but regardless, once pre training costs exceed the \"ticket to play\" level, it is highly likely the current frontier open weight models fall far behind the well capitalized players. If it weren't for the Chinese governmnent, we would already be there."}, {"id": 50634956, "au": "VBprogrammer", "dom": 89, "sr": 187, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 7, "age": 4.26, "grav": 27.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 8523, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.34, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In recent years it's gotten pretty close. I remember flying BA at least used to mean you got a small sandwich on your flight. Now you are lucky to get a small bottle of water. Everything else is equally intolerable. Even paying first class on short haul barely gets any improvement on standards."}, {"id": 50636260, "au": "Scaled", "dom": 150, "sr": 188, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 3, "age": 2.35, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 327, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.994, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mail is outsourced because you're basically forced to do so if you want to land in inbox instead of spam.  Unless you have a sufficiently large volume of transactional mail, most companies just don't have enough volume for Gmail/etc to bother building reputation on your IP and domain.  It's not outsourced out of convenience, but by force.  It's a strong moat, and given Google/Microsoft/etc all sell email services, is likely not coincedtal.\n\nAI's moat is different in that it's not being forced by an external entity.  You can buy some expensive hardware and deploy open models and get decent (but not frontier) quality.  It's usable and will get better over time.  Whereas for mail, the external providers basically force you to use a major platform for practical usage -- and that will never improve over time."}, {"id": 50628708, "au": "throwa356262", "dom": 659, "sr": 189, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 1, "age": 11.24, "grav": 104.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.424, "fa": 0.68, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Yea, I'm down $500k at this point\n\n\nThat is impressive. You must have invested between 1.8M and 22M (bought at 115 and 85 respectively)."}, {"id": 50630387, "au": "cmiles8", "dom": 585, "sr": 190, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 2, "age": 9.4, modern society. Most of that critical software is out of sight, such as the software supporting research in the physical sciences."}, {"id": 50628435, "au": "sarchertech", "dom": 396, "sr": 254, "sc": 2.33, "ep": 3.66, "bs": 1.32, "d": 2, "age": 11.52, "grav": 108.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 20368, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.375, "fa": 0.0, "gp": 0.292, "bl": 0.5, "ds": 0.0, "txt": "My very large tech employer started with copilot, switched to Claude, and now switched back to copilot because Microsoft offered them a deal.\n\nThey sent out an email to all employees that we had to switch to copilot (we can use anthropic models and we have a wide range of harnesses approved) in 2 weeks, and then they just shut off Claude."}, {"id": 50633026, "au": "e63f67dd-065b", "dom": 448, "sr": 255, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 4, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1892, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.576, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is what everybody in this thread is telling you, the Claude app is not a moat.\n\nYou can literally run deepseek with the Claude app (and indeed many coders I know do so because they prefer the app over Codex/other harnesses), and you’re about 5 minutes away from migrating to a new harness by telling it “import all my settings from Claude Code”.\n\nThe Claude app really is not a moat."}, {"id": 50628852, "au": "flokie", "dom": 437, "sr": 256, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 2, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 250, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Sounds like you haven't tried Neon....The frontier moves fast, I feel like these arguments don't hold up over time. If there are cheaper higher powered models, decisions could be made top down or diffuse bottom up just as they have already."}, {"id": 50635348, "au": "usef-", "dom": 103, "sr": 257, "sc": 2.3, "ep": 2.3, "bs": 0.0, "d": 3, "age": 3.74, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 907, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.339, "fa": 0.34, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "Airlines typically make 2-4% and frequently go in the red. Are you sure you're including all the costs?"}, {"id": 50629738, "au": "misiti3780", "dom": 607, "sr": 258, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 1, "age": 10.09, "grav": 88.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 7949, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Are you saying OpenAI is screwed because they have slower growth, smaller revenue numbers, and are the third large IPO going out behind SpaceX and Anthropic ?"}, {"id": 50636189, "au": "nostrademons", "dom": 69, "sr": 259, "sc": 2.27, "ep": 6.17, "bs": 3.9, "d": 6, "age": 2.47, "grav": 14.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 197, "qw": 0, "k": 85143, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.829, "fa": 0.34, "gp": 0.621, "bl": 1.47, "ds": 0.0, "txt": "It's a pretty good example of a disruptive innovation.  Disruptive innovations are worse than the technologies that they replace, and as such don't fully replace them.  However, they're better in one specific dimension (oftentimes cost or convenience), and they're \"good enough\" for a significant fraction of users.  Over time that fraction tends to increase as the disruptive technology itself gets better.\n\nIn my wife's case, she's not trying to influence policy, she doesn't need deep relationships with the rest of the board (though she actually has them already, since she's been working in this space for over a decade), she doesn't have particular opinions on who the management team is - she just needs to make sure the company isn't fucked.  It's a satisfice vs. maximize thing.  The type of things that would actually worry her would be very apparent and not need a whole lot of subtlety to interpret.\n\nActually AI is another good example of a disruptive technology: for a lot of the things it's being hyped for, it's significantly worse than alternatives, but it only needs to be better in one or two dimensions for a few markets to gain a foothold (but quite possibly not a foothold that's worth $1.5T at this time)."}, {"id": 50628202, "au": "HexDecOctBin", "dom": 457, "sr": 260, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 2, "age": 11.79, "grav": 112.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 8, "k": 1233, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.373, "fa": 0.42, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "> even on the $200 subscriptions they are making money\n\nIs this because inference is cheap, or because of typical breakage overselling (i.e., people not using all the tokens allotted to them and thus overpaying for what they do use)?"}, {"id": 50629565, "au": "win311fwg", "dom": 643, "sr": 261, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 1, "age": 10.27, "grav": 91.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 188, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.964, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If they are successful it is not clear who their customers will be or why they would need customers at all. Although it is still understandable why someone would want to hold a stake in that. The promise of AI is that its owners will be able transcend the need for trade."}, {"id": 50628447, "au": "cik", "dom": 679, "sr": 262, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 0, "age": 11.51, "grav": 108.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2789, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.885, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "Is there news here? Companies overwhelmingly tend ti be below their IPO price six months out. Then, they may or may not climb.\n\nI would expect nothing else here."}, {"id": 50630148, "au": "boelboel", "dom": 413, "sr": 263, "sc": 2.26, "ep": 2.26, "bs": 0.0, "d": 4, "age": 9.64, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 524, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "A good company shouldn't depend on one company for the tech gravy train to keep going, especially when there's no long term agreements. Employees getting used to these things could actually be bad long term."}, {"id": 50628354, "au": "inknight", "dom": 392, "sr": 264, "sc": 2.25, "ep": 3.45, "bs": 1.19, "d": 2, "age": 11.6, "grav": 109.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 13, "k": 58, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.608, "fa": 0.42, "gp": 0.566, "bl": 0.45, "ds": 0.0, "txt": "> Once your company starts giving people Claude subscriptions, it's extremely hard to switch.\n\nYeah, it _used_ to be like this. Nowadays I can just ask a DeepSeek agent to move all my work out of Claude into something else for a few cents."}, {"id": 50629264, "au": "surgical_fire", "dom": 658, "sr": 265, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 1, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.443, "fa": 0.34, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "If you believe it will climb to $500, would it not make sense to buy the dip?"}, {"id": 50629696, "au": "ramraj07", "dom": 601, "sr": 266, "sc": 2.15, "ep": 2.15, "bs": 0.0, "d": 1, "age": 10.14, "grav": 89.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 10891, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.383, "fa": 0.34, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "Don’t be surprised if it drops by 70-80% but don’t be surprised if it 5xes as well. I’m assuming no one here has been under the rock for the last decade and hasn’t heard about Tesla."}, {"id": 50637081, "au": "0xc0c0c0", "dom": 3, "sr": 267, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 1, "age": 0.73, "grav": 6.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 30, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.846, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "Can you share what you and your company does that GLM cannot help with?\n\nI work in a very heavy infrastructure related role at a top 5 paying tech company and have used nothing but deepseek and GLM in the last 6 months."}, {"id": 50631936, "au": "michaelscott", "dom": 565, "sr": 268, "sc": 2.13, "ep": 2.13, "bs": 0.0, "d": 5, "age": 7.65, "grav": 59.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 948, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Today. But I believe they were structuring the IPO with a future return pricing that was way higher, to generate hype"}, {"id": 50631221, "au": "dgellow", "dom": 627, "sr": 269, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 1, "age": 8.5, "grav": 68.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 23182, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.89, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Professional are reading a few numbers then gamble based on what their friend at Anthropic or OpenAI told them over the weekend. The average professional investor is far from being sophisticated"}, {"id": 50635356, "au": "lossolo", "dom": 113, "sr": 270, "sc": 2.03, "ep": 3.22, "bs": 1.19, "d": 3, "age": 3.73, "grav": 23.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 7, "k": 3518, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.863, "fa": 0.42, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "> It's one of the myths circulating here!\n\nSure, that's why the airline's actual owner has that famous line about becoming a millionaire: start as a billionaire, then buy an airline.\n\nYour comment is factually incorrect."}, {"id": 50628417, "au": "Avicebron", "dom": 496, "sr": 271, "sc": 2.03, "ep": 2.03, "bs": 0.0, "d": 3, "age": 11.54, "grav": 108.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 4513, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.862, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "They are all betting on a singular \"event\" where the model/agent basically is able to improve itself infinitely (RSI, ASI, etc).\n\nAt that point they have created God and they don't care what happens after."}, {"id": 50628726, "au": "aag2113", "dom": 471, "sr": 272, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 1, "age": 11.22, "grav": 104.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 11, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "I generally want to agree with you. However, as the Claude admin for a smaller organization I've been startled by the rate at which users are migrating their workflows into Claude chat.\n\nOur developers remain fairly tool agnostic, but after only a few months I can say it will not be easy to migrate the rest of the organization out of Claude if we ever wanted to do so.\n\nThere is still a bit of friction when dealing with artifacts and collaboration. Users are generating word docs and excel and then sharing through the existing channels. However, looking at the feature flags in Claude admin is like watching their product strategy develop in real time. They are clearly trying to unseat Microsoft as the connective tissue of the organization, pulling more and more collaborative business tooling into the chat/cowork product."}, {"id": 50635516, "au": "disgruntledphd2", "dom": 170, "sr": 273, "sc": 1.99, "ep": 1.99, "bs": 0.0, "d": 5, "age": 3.51, "grav": 21.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 8526, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.848, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I do find it very strange that so many people seem to believe that RSI is possible in the way thought of by the labs.\n\nCan you help me understand how this is supposed to work?"}, {"id": 50628493, "au": "piva00", "dom": 362, "sr": 274, "sc": 1.99, "ep": 1.99, "bs": 0.0, "d": 2, "age": 11.47, "grav": 107.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 10658, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.715, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "You just started in this journey, the company I work for has been riding the AI/agent wave very close to the beginning of the hype. Experiments with GPT-3.5, general rollout of GPT 4o to 4.5 for devs, then to Claude 4 to 4.5, and since then we've had access to all frontier models. Right now we also have our own deployment of GLM-5.3 and a few other open weight models, running in our infra without paying tokens to an external party for simpler tasks.\n\nThere's no moat, we switch models on each release to assess which one is performing better for our tasks and people naturally gravitate to those until a new one appears, gets assessed and if it works better we just switch a toggle to use that one instead.\n\nIt's only hard to switch if your company makes it hard to switch, otherwise they're mostly a drop-in replacement."}, {"id": 50628505, "au": "cicko", "dom": 500, "sr": 275, "sc": 1.99, ": 0.0, "gp": 0.157, "bl": 0.0, "ds": 0.0, "txt": "AI, in it's current for, is basically synonymous to email. It's certainly disruptive and there are some ways to extract some profits but it doesn't really lend itself to be the sole property of a single provider. The real profit capture is going to be by those that use it to cut costs elsewhere and improve their existing business."}, {"id": 50636703, "au": "zamadatix", "dom": 188, "sr": 297, "sc": 1.57, "ep": 1.57, "bs": 0.0, "d": 2, "age": 1.55, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 20852, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.67, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "E.g. a few billion less cashed out into the pockets of Anthropic management on the day of IPO."}, {"id": 50628470, "au": "TheWas7ed", "dom": 423, "sr": 298, "sc": 1.57, "ep": 4.08, "bs": 2.52, "d": 2, "age": 11.49, "grav": 108.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 2, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.19, "fa": 0.34, "gp": 0.219, "bl": 0.95, "ds": 0.0, "txt": "Anthopic product is really good but most opensource models are already able to automate 90% of office tasks, most people are using claude for everything because tokens are cheap, if they become expensive you can just start to auto route your llm usage and only hit claude if you need higher intelligence. People using api are problably the only ones paying the real token price."}, {"id": 50634611, "au": "__MatrixMan__", "dom": 152, "sr": 299, "sc": 1.56, "ep": 1.56, "bs": 0.0, "d": 3, "age": 4.72, "grav": 30.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 9941, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.666, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why would they though?  If a company looks like it's approaching AI supremacy, the rest of the world has an incentive to support efforts to erode that company's moat.  I'm sure China will continually find ways to benefit from their role as a check against American capitalists' ambitions."}, {"id": 50628533, "au": "hodder", "dom": 335, "sr": 300, "sc": 1.51, "ep": 2.36, "bs": 0.85, "d": 5, "age": 11.43, "grav": 107.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1957, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "Right, I don't know if that is a good or bad thing. I'm trying to take an analytical as opposed to a moral philosophical view of it. And if it weren't for constrained compute today I believe we would already have well capitalized players pulling so far ahead that no open model can compete on pre-training alone."}, {"id": 50633300, "au": "KerrAvon", "dom": 675, "sr": 301, "sc": 1.45, "ep": 1.45, "bs": 0.0, "d": 1, "age": 6.14, "grav": 43.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4381, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.617, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Uniquely among the US models, you can't trust SpaceX models for political reasons -- they bias the training _against_ reality to satisfy Musk's ego.\n\nThe latest Gemini models are actually competitive with Opus, though, and better in some ways."}, {"id": 50637167, "au": "ergocoder", "dom": 140, "sr": 302, "sc": 1.44, "ep": 1.44, "bs": 0.0, "d": 1, "age": 0.51, "  here!\n\nLet's take an example: The average fare from Chicago to Denver is around $300, but let's take $250. A 9-seat row with 30 rows brings the trip revenue to $67,500. However, there are more rows and higher prices for business class. I also didn't account for charges for upgrades, extra luggage, checked luggage, food purchases, etc. All in, the operating cost for an airline for that trip is around $25k."}, {"id": 50628750, "au": "sarchertech", "dom": 401, "sr": 421, "sc": -2.5, "ep": 1.37, "bs": 3.87, "d": 6, "age": 11.19, "grav": 103.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 20368, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.171, "fa": 0.34, "gp": 0.0, "bl": 1.46, "ds": 0.0, "txt": "The lose money on the $20 a month plan if people are really using it, so at some point they’re run out of money."}, {"id": 50634622, "au": "jr3592", "dom": 66, "sr": 422, "sc": -2.51, "ep": 2.65, "bs": 5.17, "d": 3, "age": 4.7, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 112, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.705, "fa": 0.0, "gp": 0.688, "bl": 1.95, "ds": 0.0, "txt": "I really wish these were the types of problems humanity were trying to solve.  It seems to me the great opportunity cost of software, is all the advances we could have been making in the physical sciences space.  There remains so much ground to be had, on things as \"simple\" as travel, but society has really slowed down the rapid advance and push toward finding new ways of improving those experiences."}, {"id": 50634478, "au": "boredatoms", "dom": 85, "sr": 423, "sc": -2.54, "ep": 1.7, "bs": 4.24, "d": 5, "age": 4.87, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, ut": 0, "lu": 0, "w": 99, "qw": 0, "k": 1957, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.738, "fa": 0.0, "gp": 0.54, "bl": 1.95, "ds": 0.0, "txt": "People often say, open weight cheap models at the level of Opus are at the \"Good Enough\" frontier and therefore private models are doomed. But we are nowhere near the \"Good Enough\" frontier.\n\nNot even Fable 5.2 is good enough for most tasks. As long as you look around and see seats filled with knowledge workers being paid 300k+/year, you know we simply are not at the good enough level. We are at the \"Good tool in the hands of a capable person\" level. It is like going back to antiquity and saying scythes were \"Good Enough\" at harvesting fields."}, {"id": 50637114, "au": "demo4567", "dom": 6, "sr": 428, "sc": -2.65, "ep": 1.72, "bs": 4.37, "d": 2, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 34, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.731, "fa": 0.0, "gp": 0.0, "bl": 1.65, "ds": 0.0, "txt": "Same, I use opus 4.8/5.5 and Fable at work. For the same kind of work at home, I barely have to go past deepseek flash/glm flash.\n\nJust saying anthropic doesn't mean much. There are so many models underneath that."}, {"id": 50635226, "au": "Betelbuddy", "dom": 108, "sr": 429, "sc": -2.73, "ep": 2.43, "bs": 5.17, "d": 3, "age": 3.88, "grav": 24.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 54, "qw": 0, "k": 3644, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": ["https://www.iata.org/en/publications/annual-review/", "https://www.mckinsey.com/industries/travel/our-insights/could-aviation-at-last-be-close-to-earning-its-wings"], "ig": 0.829, "fa": 0.0, "gp": 0.336, "bl": 1.95, "ds": 0.0, "txt": "Not a myth...\n\nOver the last decade (2016–2025), commercial aviation moved 40 billion passengers, cutting real airfares by 37%, and powering 4% of global GDP. On $8 Trillion in revenue...global airlines netted just $42 Billion, roughly $1 per passenger.\n\nWith only 7 of 100+ carriers consistently beating their ~8% cost of capital. Aviation creates trillions in value captures almost none for shareholders.\n\nIATA: https://www.iata.org/en/publications/annual-review/\n\nMcKinsey: https://www.mckinsey.com/industries/travel/our-insights/coul..."}, {"id": 50635472, "au": "watwut", "dom": 42, "sr": 430, "sc": -2.75, "ep": 1.49, "bs": 4.24, "d": 4, "age": 3.57, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 13, "qw": 0, "k": 18740, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.257, "fa": 0.0, "gp": 0.614, "bl": 1.6, "ds": 0.0, "txt": "That is how free market is supposed to operate - push margins to nothing."}, {"id": 50630033, "au": "10xDev", "dom": 618, "sr": 431, "sc": -2.76, "ep": 2.81, "bs": 5.57, "d": 1, "age": 9.77, "grav": 84.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 747, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.763, "fa": 0.0, "gp": 0.701, "bl": 2.1, "ds": 0.0, "txt": "So the professionals have decided the stock market largely hinges on whether Jensen is CEO or not? Seems all like vibe based gambling."}, {"id": 50628634, "au": "sarchertech", "dom": 383, "sr": 432, "sc": -2.77, "ep": 1.6, "bs": 4.37, "d": 5, "age": 11.32, "grav": 105.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 12, "qw": 0, "k": 20368, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bu amewar", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.455, "fa": 0.0, "gp": 0.721, "bl": 3.9, "ds": 0.0, "txt": ">No, we're not going to switch to an open source alternative because it's a bit cheaper. No, we're not going to suddenly switch to Gemini or ChatGPT.\n\nCan you explain why not? I feel that's the crux of your argument.\n\nYou do have a point though, I think at the moment there's a \"nobody gets fired for choosing Claude\" mindset, where it's seen as the default and since things are moving so fast evaluating the cost and comparing the alternatives is extremely difficult.\n\nBut eventually things will settle. Setting aside a Singularity scenario where all of society is upended by the God Machine, there'll be a point when agent capabilities and development flows will standardize, the field will consolidate around a few key players/models and it'll become easier to shop around. At that point, I expect that margins will be crushed and it'll become difficult for companies to justify paying for Claude if you can get basically the same service for a fraction of the cost.\n\nIn many ways offering a pure inference SaSS product is easier than, say, creating a gmail competitor. Especially if hardware access becomes less constrained in a few years."}, {"id": 50634743, "au": "jacquesm", "dom": 320, "sr": 608, "sc": -8.36, "ep": 0.26, "bs": 8.61, "d": 2, "age": 4.55, "grav": 29.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 9, "qw": 0, "k": 248470, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 0.109, "fa": 0.0, "gp": 0.0, "bl": 3.25, "ds": 0.0, "txt": "The AI will sure reward them for their effort. /s"}, {"id": 50634209, "au": "halfcat", "dom": 422, "sr": 609, "sc": -8.38, "ep": 1.95, "bs": 10.34, "d": 6, "age": 5.27, "grav": 35.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 127, "qw": 19, "grav": 19.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 11883, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.523, "fa": 0.0, "gp": 0.258, "bl": 4.05, "ds": 0.0, "txt": "Making a prediction and putting a personal stake on it might meet some definitions of 'gambling', but it's certainly not the same thing as roulette or a wager of pure chance."}, {"id": 50630479, "au": "orangea", "dom": 345, "sr": 658, "sc": -9.13, "ep": 1.2, "bs": 10.34, "d": 3, "age": 9.29, "grav": 78.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 0, "k": 313, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 0.439, "fa": 0.0, "gp": 0.117, "bl": 3.9, "ds": 0.0, "txt": "I think that Claude is going for the same strategy that Dropbox tried and arguably failed: since the core product became a commodity, bundle in a bunch of productivity/ancillary features to differentiate the offering and introduce some friction to switching.\n\nThe argument that it might work this time is that non-technical users don't think in terms of concepts like cloneable API surfaces like the chat completions API, standard protocols like MCP servers, etc. Someone like me is perfectly happy to use some open source web chat UI and hook it up to OpenRouter. But people who don't know how this stuff works will worry that if they switch away from Claude then they will have to completely rethink how they do everything because they don't realize (to a high enough degree) that any competitor can just create more or less exactly the same thing.\n\nEveryone understands that Box and Google Drive and Dropbox are basically interchangeable, so the question is: is there something unique about AI that lets providers escape this fate?"}, {"id": 50628487, "au": "realusername", "dom": 336, "sr": 659, "sc": -9.28, "ep": 1.06, "bs": 10.34, "d": 4, "age": 11.47, "grav": 107.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 9, "k": 9140, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 0.451, "fa": 0.0, "gp": 0.0, "bl": 3.9, "ds": 0.0, "txt": "> But we are nowhere near the \"Good Enough\" frontier\n\nI'm doing Linux Kernel work with Sonnet 5.5, GPT 6.1 Sol and Kimi 2.8 all in high mode and it works fine. I would say that most of coding tasks really aren't on the same level as that but much below."}, {"id": 50628430, "au": "spindump8930", "dom": 466, "sr": 660, "sc": -9.35, "ep": 1.38, "bs": 10.73, "d": 3, "age": 11.52, "grav": 108.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 209, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 1, "tier": "meme_or_snark", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 0.587, "fa": 0.0, "gp": 0.0, "bl": 4.05, "ds": 0.0, "txt": "Supplies of inference talent and GPUs are scarce. GPUs need to be saturated with enough traffic in order to make inference efficient, which gives established providers a cliff."}, {"id": 50634577, "au": "jsr0", "dom": 95, "sr": 661, "sc": -9.38, "ep": 0.82, "bs": 10.2, "d": 3, "age": 4.75, "grav": 31.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 9, "qw": 0, "k": 27, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": ["https://terraformindustries.com/"], "ig": 0.349, "fa": 0.0, "gp": 0.0, "bl": 3.85, "ds": 0.0, "txt": "https://terraformindustries.com/ is working towards cheaper, green fuel using CO2 capture."}, {"id": 50629158, "au": "sarchertech", "dom": 403, "sr": 662, "sc": -9.51, "ep": 1.22, "bs": 10.73, "d": 8, "age": 10.73, "grav":   function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
