tps://futurism.com/artificial-intelligence/trump-admin-no-...\n\nTrump maybe caved with Nvidia pushing to get Jensen back, but IMO the 2025 article was specific to OAI and Anthropic; software AI companies; not hardware which most definitely will be bailed out by Congress too.\n\nAm sending similar sentiment to every elected official that (ostensibly) represents me saying AI lab leaders are not prescient and use publics data to make decisions for private gain; would rather AI be hosted by city, state, and feds if its that important and unsafe and the public can study rather have it locked behind private data center and quietly used to influence"}, {"id": 50629940, "au": "marginalia_nu", "dom": 576, "sr": 2, "sc": 11.95, "ep": 12.1, "bs": 0.0, "d": 2, "age": 9.88, "grav": 86.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 207, "qw": 0, "k": 26393, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": ["https://finance.yahoo.com/markets/stocks/articles/anthropic-lock-calendar-ant-insiders-000000339.html", "https://finance.yahoo.com/markets/stocks/articles/anthropic-ipo-safety-net-gone-095030591.html"], "ig": 2.089, "fa": 1.85, "gp": 1.322, "bl": 0.0, "ds": 0.0, "txt": "Eh there are good reasons to expect this wouldn't take off like a rocket if you scrutinize the IPO a bit.\n\nTheir IPO filing was itself pretty suspect, conspicuously missing Q3 2026 financial results and data center lease commitments.  Not exactly filling investors to the brim with confidence.\n\nThen they IPO:ed without a traditional 180 day lock up period[1], meaning insiders were able to sell ~$200 million worth of shares day one (up to 10% of what they own).  This isn't illegal or unprecedented, but rare and pretty questionable, and with a general whaft of wishing to do a quick pump and dump rather than something you do out of long term confidence.  As an insider you'd be an absolute moron not to dump those 10% at first opportunity to first best willing bag holder to secure money in hand as you still sit on the remaining 90% if the IPO performs well.\n\nMorgan Stanley were underwriters and supposed to stabilize the IPO but seems to have blown their entire load on day one[2].  Possibly buying up those insider shares, greenshoe agreement covered only about $150 million.\n\nAll of this creates a downward thrust for the stock.  That's excluding the ambient questions regarding the dem landslide and probable data center delays and financing, the circus around huang and nvidia.\n\n[1] https://finance.yahoo.com/markets/stocks/articles/anthropic-...\n[2] https://finance.yahoo.com/markets/stoc"}, {"id": 50637044, "au": "seizethecheese", "dom": 10, "sr": 3, "sc": 10.73, "ep": 10.73, "bs": 0.0, "d": 2, "age": 0.82, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 71, "qw": 0, "k": 5048, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": ["https://github.com/bottomless/agent-duel", "https://agentduel.com/leaderboard"], "ig": 1.186, "fa": 2.46, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "Good enough is actually better if it's faster! We have an open source battle system (https://github.com/bottomless/agent-duel) where people can vote early, and DeepSeek v4.1 Flash is holding its own in the leaderboard ( https://agentduel.com/leaderboard ) in spite of costing $0.07 vs the top models costing ~$2. The reason is that it's really fast (2min cost per task vs Opus closer to 3 and Fable closer to 4).\n\nBut the problem with local AI is that it's actually not faster."}, {"id": 50630522, "au": "program_whiz", "dom": 303, "sr": 4, "sc": 10.71, "ep": 10.71, "bs": 0.0, "d": 4, "age": 9.23, "grav": 77.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 347, "qw": 0, "k": 1735, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.918, "fa": 1.45, "gp": 1.428, "bl": 0.0, "ds": 0.0, "txt": "Yeah I'm sure there are some switching costs, but I'd put it closer to something like JIRA.  Yes they can charge a premium and have some lockin for corporate.  But this has a few effects:\n\n1. Consumers don't care -- they use whatever (Todoist, etc)\n\n2. There aren't network effects or heavy lock-in, its just momentum / inertia, so you're one bad quarter from fat-trimming\n\n3. If the tool enshittifies people internally want to shift, and now they have AI to help them do it quickly and easily, plus save money.\n\n4. You can't easily serve ads to people who are using the API (which was the whole point of the argument).\n\n5. You can't justify trillion dollar valuations, you are at best a medium size SaaS company like Atlassian.  They have $30B valuation, probably low for Anthropic given their ARR, but there is kind of a ceiling.  You can't jack prices too much, and you aren't capturing \"90% of global GDP\", you are just one of many providers of a commodity.\n\n6. You can't believe lock-in to an LLM is higher than lock-in to proprietary game engines, but companies switched when Unity tried to claw just a little value, and now Godot is a major player.  Some tech is just a commodity and it isn't something you can build a moat from.\n\nThere is also kind of a ceiling on what companies will pay anyway (even though we're talking about ads), because what they care about is productivity and cost.  I"}, {"id": 50635717, "au": "nostrademons", "dom": 86, "sr": 5, "sc": 10.56, "ep": 10.56, "bs": 0.0, "d": 6, "age": 3.21, "grav": 19.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 122, "qw": 0, "k": 85143, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": ["https://www.econlib.org/library/Enc/AirlineDeregulation.html"], "ig": 2.156, "fa": 1.24, "gp": 1.354, "bl": 0.0, "ds": 0.0, "txt": "There's plusses and minuses to that.\n\nThere are plenty of state airlines: Emirates, ITA, Aeroflot, Air New Zealand, and many smaller companies.  They usually offer better service than a privatized corporation, because they have a monopoly position within their country.\n\nHowever, they are usually significantly more expensive than private carriers.  Since airline deregulation in the U.S, airfares have fallen 45% adjusted for inflation [1].  And state carriers are usually more expensive than private ones on the same routes: compare Emirates prices vs. any other airline on a route that doesn't connect through Dubai, for example.\n\nNon-profit != cheaper; it just means that the money is directed toward other things, like perks or employee salaries or other nice-to-haves, and that it doesn't face competitive pressure to operate more efficiently.\n\n[1] https://www.econlib.org/library/Enc/AirlineDeregulation.html"}, {"id": 50634250, "au": "simplyluke", "dom": 197, "sr": 6, "sc": 10.43, "ep": 10.43, "bs": 0.0, "d": 1, "age": 5.21, "grav": 35.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 1683, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.94, "fa": 1.17, "gp": 1.751, "bl": 0.0, "ds": 0.0, "txt": "Net income at IPO, time to first profitable quarter. Caveat that there's a lot of creative accounting in tech, and it's gotten more creative with AI companies.\n\nAmazon (1997): -$5.78 million - first profitable quarter Q4 '01\n\nNetflix (2002): -$21 million - first profitable quarter Q2 '03\n\nTesla (2010): -$154 million - first profitable quarter Q1 '13\n\nFacebook (2012): +$1 billion at IPO\n\nAnthropic (2026): -$100 billion through sept 2026\n\nOne of these things is not like the other.  Anthropic's financials on serving existing models are great, their debt to stay relevant going forward is atrocious, and their competitive moat depends entirely on continuing (and accelerating) that spending. Amazon, netflix, tesla, and facebook did not need to spend exponentially more money to become profitable."}, {"id": 50635278, "au": "ndiddy", "dom": 253, "sr": 7, "sc": 10.2, "ep": 10.2, "bs": 0.0, "d": 4, "age": 3.83, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 216, "qw": 0, "k": 10416, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.832, "fa": 1.23, "gp": 1.648, "bl": 0.0, "ds": 0.0, "txt": "I can think of lots of scenarios where Anthropic wouldn't be able to use all of its negotiated compute but compute is still valuable. For example, if commodity open-source models are able to do most commercially viable tasks and the frontier models are only valuable for advanced research. Most companies would switch over to the open source models, but there would still be a need for compute to run them on.\n\nEven in a different scenario where Anthropic can't profitably resell their compute, and they end up using less compute than they anticipated, it's still not the end of the world. Looking at Anthropic's IPO prospectus, $120B of their compute comes from X.AI, which can be cancelled with 90 days' notice. If they still need to shed more compute, ~$85B comes from Nscale and Lambda, which is only paid out when they deliver the compute. They won't be able to deliver without tens of billions of dollars in capital, so Anthropic won't have to worry if the market collapses. If that's still not enough, ~$280B comes from Amazon, Microsoft, and Google, all of which are major shareholders in Anthropic. They have a material interest in Anthropic remaining a viable company, so they would likely be able to work out a deal (i.e. offering equity in exchange for relief from some of their payment obligations)."}, {"id": 50628269, "au": "aurareturn", "dom": 343, "sr": 8, "sc": 10.05, "ep": 10.19, "bs": 0.0, "d": 1, "age": 11.71, "grav": 111.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 165, "qw": 0, "k": 8875, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": ["https://news.ycombinator.com/item?id=47670664"], "ig": 2.003, "fa": 1.24, "gp": 1.347, "bl": 0.0, "ds": 0.0, "txt": "Our entire company have started using Claude in the last month. It started with a few early adopters, then something happened and everyone started using it. Employees are hooking up MCPs to it. They're absolutely raving about it.\n\nMost are on the $20/month plan now. But increasingly, I'm seeing some employees hit the limit and request more tokens and higher tier plans.\n\nNo, we're not going to switch to an open source alternative because it's a bit cheaper. No, we're not going to suddenly switch to Gemini or ChatGPT.\n\nAnthropic is building a strong moat in my opinion:\n\n1. Model intelligence moat/training moat\n\n2. Compute moat (all the cash and revenue flywheel means they can buy more compute than others)\n\n3. Claude\n\nI think people are highly underestimating \u00233. They're building spreadsheets, docs, and presentation into Claude as well. Once your company starts giving people Claude subscriptions, it's extremely hard to switch.\n\nEdit: Funny enough, I wrote the exact same reasons 7 months ago here. At least I'm consistent in my view: https://news.ycombinator.com/item?id=47670664"}, {"id": 50636693, "au": "lucb1e", "dom": 122, "sr": 9, "sc": 9.92, "ep": 10.06, "bs": 0.0, "d": 6, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 223, "qw": 10, "k": 18884, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": ["https://en.wikipedia.org/wiki/List_of_minimum_annual_leave_by_country"], "ig": 1.306, "fa": 1.99, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "> Most people in today's modern world [...] barely get 5 days off.\n\nWhere'd you get that idea? There are 5 countries in the world where you annually get 5 days off or fewer, three of which are currently the USA or formerly administered by the USA (https://en.wikipedia.org/wiki/List_of_minimum_annual_leave_b...) and the remaining two are Nauru and Nigeria. With my western glasses I'd say 25-30 days is a normal minimum (on a 5-day workweek) but the first low-income country that comes to mind, Liberia, also has 21 days minimum. Most of Africa seems to have more than that as well. You're looking at the bottom 3% of countries and some % of their inhabitants will get more than the minimum leave. It's far from what 'most people' experience\n\nIt also helps that the risk of starving to death decreased by orders of magnitude at the same time as population increased by orders of magnitude. People don't universally have some sickness or other. The median adult in the middle ages had some ailment or other. We tend to now get those sorts of issues after a good amount of healthy adult life and most are solvable or much more manageable (with modern treatment) than they would have been even just one hundred years ago. As for sitting in an office/vehicle instead of plowing fields or hoping to find enough food each day while foraging... you do you\n\nIf this is 'not living', we may have different id"}, {"id": 50635732, "au": "ralphington", "dom": 1, "sr": 10, "sc": 9.64, "ep": 9.79, "bs": 0.0, "d": 0, "age": 3.2, "grav": 19.4, "surf": 5.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 34, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 2.025, "fa": 1.23, "gp": 1.049, "bl": 0.0, "ds": 0.0, "txt": "We've built a model agnostic continuous development system using about $10k/wk ai budget. The system has a component that measures AI models, both frontier and open weight, for value independently for orchestration, investigation, implementation, and review. The output is to production systems: wall clock and error rate matter the most and the budget is moderately elastic.\n\nOur model cost breakdown shifts as new models come out, but the latest breakdown by company is ~ 65% anthropic, 20% openai, 10% Google, and 5% open weights.\n\nIt's hard for me to take seriously the comments that say GLM is good enough for real work. It has its place and it can be measured.\n\nWe're greedy and would rather pocket savings, but for our systems, the above is the most profitable arrangement, and it'll naturally shift as the model landscape evolves."}, {"id": 50628844, "au": "bryanlarsen", "dom": 315, "sr": 11, "sc": 9.64, "ep": 9.93, "bs": 0.0, "d": 1, "age": 11.09, "grav": 102.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 225, "qw": 0, "k": 43695, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.503, "fa": 1.23, "gp": 1.995, "bl": 0.0, "ds": 0.0, "txt": "Anthropic is also at massive risk of bankruptcy.\n\nAnthropic has 3 core beliefs:\n\n- they are close to achieving recursive self-improvement (RSI)\n\n- they have a moral imperative to be the first to reach recursive self-improvement\n\n- once they hit recursive self-improvement, they'll kick off the singularity and that model will instantly make them insanely profitable\n\nSo they're obviously going to spend all their money on a Hail Mary pass to achieve RSI.\n\nMythos is an 8T model that cost about $10B and 1TWh.   Let's assume that their RSI model is 2 generations of doubling away.   Training cost is linear to size, but they'll probably also need to similarly increase training data, which is also linear.    Each generation will be more efficient to train, but I'm confident the cost of assembling the training data will more than offset that efficiency gain.\n\nSo $160B to train that 32T model that kicks off the singularity.    What then?  Have the fixed the faulty business model that littlecranky67 demonstrates?   No.   Models still take billions of dollars to train.   Chinese models are still 3-6 months behind.  Smaller much cheaper models are still a better choice for most tasks.\n\nThey kicked off the singularity but cannot pay off the debt they took on to get there.\n\nAnd that's the positive case.   The negative case is that they spent $160B to train that model and don't achieve RSI..."}, {"id": 50636573, "au": "accountinhn", "dom": 210, "sr": 12, "sc": 9.63, "ep": 9.63, "bs": 0.0, "d": 2, "age": 1.79, "grav": 11.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 6, "k": 983, "kpp": 19.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.551, "fa": 1.37, "gp": 1.438, "bl": 0.0, "ds": 0.0, "txt": "> where IPO investors 1000x their return.\n\nWell Amazon if I remember correctly, did 2-3 rounds of fund raising and then went to IPO. Anthropic in the short span did what, about 8 rounds of fund raising and got ~$150B. The people who invested in the 4th round are probably making the 1000x return. Companies go through too many rounds of funding before planning IPO nowadays, so as retail investor I would not expect the 1000x return even with regulation changes or anything."}, {"id": 50629514, "au": "jerf", "dom": 284, "sr": 13, "sc": 9.44, "ep": 9.44, "bs": 0.0, "d": 0, "age": 10.34, "grav": 92.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 303, "qw": 0, "k": 94964, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.869, "fa": 0.95, "gp": 1.614, "bl": 0.0, "ds": 0.0, "txt": "This is extremely common, and even as someone who frequently discusses the \"AI bubble\", this doesn't mean a heck of a lot. There are a lot of structural forces that apply to a newly IPO'd stock both formal (various lockup periods ending and supply coming online, Anthropic's schedule of this is particularly complicated) and informal (that day one pop is manufactured by design). You'll find if you try to trade on this general pattern that you've mostly been beaten to it; the options will have this pattern already priced in, you won't be able to borrow stock to short for any reasonable price, etc. The only thing you can really do is understand that day one may not be the best day to get in, in general, for any IPO.\n\nI popped the question into my friendly neighborhood AI as to whether there have been any major IPOs where the IPO price ended up serving as the floor for the stock, and it's a short list, though with some major names in it. Microsoft (1986), Nvidia (1999), Google (2004), Visa (2008), and in the 2020s, Airbnb, Snowflake, Zoom (2019, though arguably helped a lot by a Certain Event), Reddit, and more-or-less Arm. Amazon and Tesla are near-misses. But there's been a lot of IPOs in that time frame. Don't know how complete the AI coverage is, but plenty of very successful businesses have dipped below their IPO. It's the common case.\n\nOn the plus side, while we may complain t"}, {"id": 50628702, "au": "time0ut", "dom": 371, "sr": 14, "sc": 9.15, "ep": 9.59, "bs": 0.0, "d": 2, "age": 11.24, "grav": 104.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 176, "qw": 0, "k": 2085, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.915, "fa": 0.95, "gp": 1.644, "bl": 0.0, "ds": 0.0, "txt": "I am seeing the same. 2026 was all about onboarding our engineers. 2027 is looking like it will be about onboarding everyone else.\n\nThe ecosystem is developing. Once an org has the controls, connections, and processes built on one, it will be painful to switch.\n\nAnthropic and OpenAI have been aggressively working to create connectivity into our industry. We have built and contributed MCP tools (connectors) and published to them and Microsoft (which is just hilariously complicated and painful in comparison). No demand for a Google equivalent btw.\n\nOn cost though, I think we are walking straight into a squeeze. I think engineers are relatively adaptable. We have switched harnesses and models over the past year a couple times and people are trying new things. I suspect our business users will not be so adaptable and our security and compliance teams even less so. The momentum will be really strong.\n\nI recently worked on a little experiment at home that maxed my $20 Claude plan 4 weeks in a row. It was ~$1000 of usage if I was paying full API price. That is what is coming for their enterpise customers eventually."}, {"id": 50628351, "au": "reticulates", "dom": 453, "sr": 15, "sc": 9.09, "ep": 9.53, "bs": 0.0, "d": 2, "age": 11.61, "grav": 109.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 1140, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 2.022, "fa": 0.95, "gp": 1.43, "bl": 0.0, "ds": 0.0, "txt": "No, Anthropic's gross margin on inference is not ~85%. A subset of tokens may have ~85% margins but the majority of their tokens are consumed by users on fixed price plans.\n\nAnthropic had a very short period where their cash expenditure on compute was artificially low during which their margins looked good. If you look at their actual spend on compute, as described in their Q3 filings, it is barely above water. Anthropic spend over $5 billion per month on compute, their revenue barely exceeds their compute spend.\n\nEconomies of scale typically refers to margins increasing as scale increases but inference doesn't have that, inference is a fixed cost per token. More compute does not improve inference margins. Inference is becoming more efficient per unit of compute with various innovations but that is independent of access to compute (and that is bad for Anthropic given how much compute they have committed to).\n\nYes, inference can be profitable, nobody denies that, just charge more than the cost per token, but that isn't Anthropic's business model."}, {"id": 50628192, "au": "hodder", "dom": 493, "sr": 16, "sc": 9.04, "ep": 9.7, "bs": 0.0, "d": 1, "age": 11.81, "grav": 112.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 196, "qw": 0, "k": 1957, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 2.057, "fa": 0.95, "gp": 1.49, "bl": 0.0, "ds": 0.0, "txt": "Total nonsense. The vast majority of fortune 500 companies who are the major customers are NOT spinning up qwen models for employees. Notice how fortune 500 companies do not use Libre Office and GIMP.\n\nPeople on this site live in a bubble. There has never in history been a startup more successful at growing revenue than Anthropic. People sit on the sidelines and make these wild armchair quarterback calls, but Anthropic is executing.\n\nFurther, we are in VERY early innings of the LLM race, sure the models might appear commodified to some extent at the frontier today, but that does not extrapolate to the future well.\n\nIt is highly likely one model achieves a degree of RSI that competition fails to close. We may be there already. I dont see anyone using open weight models to solve frontier millennium math problems.\n\nThe chances that open weight models keep up over the next decade is extremely low. Costs are also simply too high, they will form a barrier to entry. Pre training costs are going to enter a regime where open models simply cannot compete. You will not have an open weight model with $500b pretraining costs. You will absolutely get there in private models."}, {"id": 50628693, "au": "reticulates", "dom": 434, "sr": 17, "sc": 8.72, "ep": 9.16, "bs": 0.0, "d": 4, "age": 11.25, "grav": 104.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 71, "qw": 0, "k": 1140, "kpp": 6.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": ["https://x.com/theo/status/2119960608816988596"], "ig": 1.045, "fa": 1.57, "gp": 1.541, "bl": 0.0, "ds": 0.0, "txt": "The subsidization rate isn't fixed and varies from model to model but it can really be that extreme. There are apps that will track your token usage and report the true cost. A $200/month plan can be offering upwards of $10k in inference. Anthropic are paying out of pocket for your company's usage, you're reliant on their benevolence, when you think about $200 in value you're not thinking about $200 in inference.\n\nhttps://x.com/theo/status/2119960608816988596"}, {"id": 50634939, "au": "JumpinJack_Cash", "dom": 597, "sr": 18, "sc": 8.63, "ep": 8.92, "bs": 0.0, "d": 2, "age": 4.28, "grav": 27.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 14, "k": 267, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.972, "fa": 1.1, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "That's a whole lot crap.\n\nThe Nvidia -50% and subsequent  +30% depending upon one person is just the latest example .\n\nEverybody with a functioning brain knows that one person cannot be worth that much.\n\nIt's a poker and musical chair game based on narrative , nVidia wouldn't have put out worse/less revenue bringing products 24 months from now with another guy as the figurehead and face of the company\n\n> > because the market is effectively the most efficient representation of the current information landscape.\n\nNot true because the so called 'vision' is not information , it's just noise and promotional ads nowadays more and more mixed with cult of personality. Is it all about betting on who sells the better BS and most compelling cult of personality..."}, {"id": 50628800, "au": "aurareturn", "dom": 494, "sr": 19, "sc": 8.55, "ep": 9.43, "bs": 0.0, "d": 2, "age": 11.14, "grav": 103.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 208, "qw": 0, "k": 8875, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": ["https://news.ycombinator.com/item?id=48182917"], "ig": 1.529, "fa": 1.58, "gp": 0.919, "bl": 0.0, "ds": 0.0, "txt": "The chances that open weight models keep up over the next decade is extremely low. Costs are also simply too high, they will form a barrier to entry. Pre training costs are going to enter a regime where open models simply cannot compete. You will not have an open weight model with $500b pretraining costs. You will absolutely get there in private models.\n\nI agree with this. Below is what I wrote 6 months ago[0]:\n\n  I think frontier models are a classic duopoly/monopoly scenario. The smarter the model, the more it gets used, the more revenue it generates, the more compute the company can buy, the smarter the next model and so on. It's a flywheel effect. This is similar to advanced chip nodes like TSMC where your current node has to make enough money to pay for the next node. TSMC owns something like 95%+ of all of the most advanced node market. Back in the 80s and 90s, you had dozens of chip fab companies. Today, there are only 3. There should only be 1 but national security saved Intel and Samsung fabs.\n\n  There is evidence that the Chinese models are falling further behind, not gaining. Consolidation will likely happen soon because many unprofitable open source labs will have to merge and focus on revenue generation.\n\n[0]https://news.ycombinator.com/item?id=48182917"}, {"id": 50635473, "au": "nostrademons", "dom": 107, "sr": 20, "sc": 8.29, "ep": 8.59, "bs": 0.0, "d": 3, "age": 3.56, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 0, "k": 85143, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.652, "fa": 0.95, "gp": 1.378, "bl": 0.0, "ds": 0.0, "txt": "Then you add ground crew salaries, airport gate fees, promotions, sales & marketing, legal & HR, and all the other stuff required to operate a major corporation.\n\nI just spot-checked financials for UAL/DAL/AAL/LUV/JBLU.  They all tell similar stories.  Operating margins (this is your profit per flight, the revenue for flying the plane minus the cost of operating that flight divided by revenue) run about 25% for healthy airlines (UAL/DAL), 18% for unhealthy airlines (AAL/LUV/JBLU).  Net margins (this is the profit available to shareholders after all expenses including fixed costs have been subtracted out) run about 5-8% for the healthy airlines and are negative for the unhealthy ones.  That's why Warren Buffett calls airlines a disaster for the capitalist class.  Sure, they run a profit on a per-plane basis: but capitalists have to pay for a lot more than running the plane.  The industry is heavily competitive, and any airline that hasn't gone bankrupt recently has heavy capital costs for buying the planes and building out their network that make them uncompetitive vs. other airlines."}, {"id": 50629687, "au": "throw0101c", "dom": 589, "sr": 21, "sc": 8.26, "ep": 8.93, "bs": 0.0, "d": 1, "age": 10.16, "grav": 89.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 23, "qw": 291, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": ["https://rationalreminder.ca/podcast/139", "https://en.wikipedia.org/wiki/Jay_Ritter", "https://warrington.ufl.edu/directory/jay-ritter/"], "ig": 0.609, "fa": 2.08, "gp": 1.079, "bl": 0.0, "ds": 0.0, "txt": "> There aren’t many/any fundamentals keeping the stock price anywhere close to these levels.\n\nAnthropic is no different than any other IPO, most of end up lower than their opening price. There's plenty of research on this:\n\n> We’ve previously compared IPOs to lotteries that are prone to inflated valuations and low returns. Today we welcome “Mr. IPO,” Professor Jay Ritter onto the show for a deeper dive into IPO performance, for his insights into SPACs, and to hear his research into why economic growth doesn’t correlate with stock returns. Early in the episode, Jay unpacks how long-term IPO returns perform against first-day trading. While exploring the role that venture capital plays in tech IPOs, Jay talks about why negative earnings don’t affect tech IPOs in the short-term before sharing how skewness factors tend to impact young companies. Reflecting on how IPOs are usually underpriced, Jay discusses how the interests of companies are not aligned with the interests of IPO underwriters. After looking into IPO allocation, Jay compares the 2020 ‘hot IPO market’ with the internet bubble of the late 90s. Later, we ask Jay about what special-purpose acquisition companies (SPACs) are and why they’ve exploded in recent years. His answers highlight their investing benefits, risks, and why SPACs might be a better option for companies than IPOs. We examine how SPACs have historically per"}, {"id": 50629981, "au": "PaulRobinson", "dom": 542, "sr": 22, "sc": 8.15, "ep": 8.6, "bs": 0.0, "d": 1, "age": 9.83, "grav": 85.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 254, "qw": 0, "k": 8151, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.861, "fa": 0.68, "gp": 1.575, "bl": 0.0, "ds": 0.0, "txt": "I think the writing has been on the wall for a while. In February I had a bet with a friend that OpenAI would \"fail\"[1] by end of the year. It seems, to rephrase a well-known idiom, that the market is staying irrational longer than my bet can stay solvent.\n\nWith Anthropic, the numbers never made much sense to me: the float produced a relatively small amount of money compared to projected operating losses. I think this was an exit liquidity event timed for private investors to get out before it was too late. I'm not saying that's a bad thing, it's just not very encouraging for the long-term fiscal picture of the company, or the sector.\n\nI want to underline what I'm talking about here is the economic model of these businesses, not the technical, operational or value model. LLMs clearly have uses, they clearly help some people in some roles, plenty. OpenAI and Anthropic have produced magical technologies, compared to what existed before.\n\nWhat's not clear is that they do that in a way that is going to sustain current valuations and analyst projections.\n\nI'm old enough to have worked through the dotcom crash. This feels eerily similar, and I think it'll play out the same: the tech will have durable value that persists, but not at the stock market valuations placed on it by people who don't understand it.\n\n[1] Failure was defined as the usual modes (Chapter 11, etc.), but also unabl"}, {"id": 50634867, "au": "andsoitis", "dom": 118, "sr": 23, "sc": 8.07, "ep": 8.77, "bs": 0.27, "d": 2, "age": 4.37, "grav": 28.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 8, "k": 33212, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.343, "fa": 1.37, "gp": 1.18, "bl": 0.1, "ds": 0.0, "txt": "> The entire world is barely worth a few trillion\n\nWealth gets created. Global GDP is around $120 trillion annually, in nominal terms.\n\nA century ago, global GDP was around $6 trillion.\n\nHumanity's output increased 30-fold while population only quadrupled. Economic output per person increased 7-fold.\n\nPut differently, we now produce as much economic value in 12 days as produce in an entire year a century ago."}, {"id": 50636947, "au": "TacticalCoder", "dom": 201, "sr": 24, "sc": 7.94, "ep": 8.53, "bs": 0.0, "d": 1, "age": 1.03, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 11, "k": 10581, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.599, "fa": 1.37, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "> Other companies that went down after IPO: Amazon, Netflix, Tesla, Meta.\n\nYou're actually giving great examples...\n\nFor the one difference though is that none of companies IPO'ed at 3% of the US GDP. So they had room to 15x (Meta) and 100x+.\n\nAt 15x Anthropic would be half the US GDP. At Amazon's multiplier, in 30 years time Anthropic would be worth more than 100 times the current US GDP.\n\nSo ANT IMO is a huge lot of risk for a very disputable outcome."}, {"id": 50628420, "au": "A_D_E_P_T", "dom": 381, "sr": 25, "sc": 7.87, "ep": 8.53, "bs": 0.0, "d": 3, "age": 11.54, "grav": 108.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 9898, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.61, "fa": 0.95, "gp": 1.408, "bl": 0.0, "ds": 0.0, "txt": "\"Massively\" is almost an understatement.  I think that I'm getting the equivalent of $11000-12000/month in API credits on a $200/month Ultra plan -- not including resets.  Some people have reported nearly $14000/month in credits on their Ultra plans.\n\nIt a matter of time before this changes.  I think that the battle against open models is the first step.\n\nI can switch to GLM-5.3 in OpenCode very easily... but if things change, that might get more difficult and impractical..."}, {"id": 50628790, "au": "bob1029", "dom": 522, "sr": 26, "sc": 7.87, "ep": 8.53, "bs": 0.0, "d": 0, "age": 11.14, "grav": 103.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 24694, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.877, "fa": 0.68, "gp": 1.501, "bl": 0.0, "ds": 0.0, "txt": "Ultrafast inference might be the end of Anthropic. They don't have a good strategy for this right now and the demand for it is currently skyrocketing. \"Fast\" models at factors like 2.5x faster are not in the same category. You need a fundamentally different hardware architecture to support speeds beyond this.\n\nIf you haven't tried one of these models you need to. It's genuinely like broadband internet vs dialup. I can't go back anymore. It's too slow. I'm addicted now. Multiply this by everyone else on earth who will eventually try it.\n\n6x cost per token sounds crazy until you actually feel the difference. It changes the ways you can work. Much like how broadband altered the business models of blockbuster and Netflix.\n\nI think faster tokens might also mean we paradoxically use fewer because the human can be in the loop the whole time. We don't need speculation going on while we sleep."}, {"id": 50634289, "au": "IAmGraydon", "dom": 669, "sr": 27, "sc": 7.71, "ep": 7.93, "bs": 0.0, "d": 0, "age": 5.14, "grav": 34.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 5418, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.852, "fa": 0.96, "gp": 0.577, "bl": 0.0, "ds": 0.0, "txt": "All this talk about valuations is so misguided. Stocks don't trade on true, rational valuations anymore, and they haven't since sometime around 2020. They trade on vibes - how much mindshare they take up in the public's mindspace combined with the general brand/feel the public has for them. Why do you think NVidia's market share jumped $1 trillion just on the news that their well-liked and personable CEO would return, even though he clearly makes very questionable business and personal decisions and may be legally compromised?\n\nHere's the thing - no one really likes Dario - he comes off like a crazed, power-obsessed nerd. No one really likes Anthropic. No one really likes the fear mongering while working on technology that they claim will take everyone's jobs. No one really wants them to succeed. Anthropic is not a vibes machine. Therefore, they will be punished on the markets."}, {"id": 50633935, "au": "rosstex", "dom": 223, "sr": 28, "sc": 7.1, "ep": 7.69, "bs": 0.0, "d": 3, "age": 5.55, "grav": 38.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 62, "qw": 0, "k": 2269, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": ["https://openrouter.ai/provider/tencent"], "ig": 1.759, "fa": 0.62, "gp": 1.23, "bl": 0.0, "ds": 0.0, "txt": "Isn't that because most sane people are using Claude subscriptions instead of API? I don't understand why even a medium-size corp would use API. For API user tasks there are probably more specialized tools to make up for Claude's lack of multimodal models, for e.g. live voice models, image gen, etc.\n\nEDIT: Plus that looks like some insane number pumping for a couple days before settling. https://openrouter.ai/provider/tencent"}, {"id": 50636948, "au": "Beached", "dom": 15, "sr": 29, "sc": 7.09, "ep": 8.27, "bs": 0.0, "d": 2, "age": 1.03, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 185, "qw": 0, "k": 650, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 2.174, "fa": 0.95, "gp": 0.31, "bl": 0.0, "ds": 0.0, "txt": "Can I ask what real work you are doing, with what models, and quants?? Im have Qwen 3.8 Flash next quant 4 running on my strix halo device, standing right next to my Anthropic and OpenAI subscriptions.\n\nI trust 3.8FN to do exactly 0 production work, it's a toy that tends to immolate nearly every codebase it touches. I REALLY want localAI to be good. I think one day soon in the next 18-24 months, it will have reached a tipping point where every dev, IT, security, or technical worker will be issued a 256GB or 512GB ram laptop running localAI models for 75% of their work, and using subscriptions for only the hardest stuff. But I just cannot see how anyone in their right mind can justify spending $4000-$8000 per dev on hardware to run localAI models for real work at the quality open weigh models offer today. And I just cant see how many western aligned businesses will send their IP through services like open router or to Chinese infrastructure. In fact I know a large number of businesses are legally unable to via regulations. Finance/Banking, Health Care, Defense, Government, etc all cannot do that and remain compliant."}, {"id": 50636035, "au": "dragontamer", "dom": 162, "sr": 30, "sc": 7.02, "ep": 8.12, "bs": 0.0, "d": 3, "age": 2.69, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 32082, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.737, "fa": 0.95, "gp": 0.914, "bl": 0.0, "ds": 0.0, "txt": "I'd say no.\n\nAt $20, the secondary offerings through March 2027 will only raise like $30 Billion, which I believe isn't enough to keep this company floating very long at all.\n\nWith junk bond rating they also can't keep floating on 9% debt or whatever it ends up being.\n\nThis is a company that's leveraged dramatically and needs to keep a high stock price to continue raising money, at least in the short term (between now and mid 2027).\n\nA bad stock price means less money raised and a potential crisis for the company."}, {"id": 50632320, "au": "surgical_fire", "dom": 265, "sr": 31, "sc": 7.01, "ep": 8.44, "bs": 0.85, "d": 3, "age": 7.24, "grav": 54.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 5168, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.897, "fa": 0.68, "gp": 1.41, "bl": 0.32, "ds": 0.0, "txt": "Because I think that regardless of how useful AI can be, Anthropic is in a ruinous path financially.\n\nJust to survive, Anthropic needs to generate revenues in the several hundred billions. I am not talking about profitability, I am just talking about survival.\n\nWhen you see people here going about how much they can do on their $20 or $200 plan, those are extremely unprofitable to Anthropic. They would need to get everyone on API pricing, or massively increase subscription prices.\n\nThis is untenable in a world where open models can provide similar capabilities to their flagship models for the kind of work most people do.\n\nLay on top of this a scenario where interest rates are on the rise and there is a possibly a challenging economic environment in the next couple of years (oil prices very expensive due to wars, possibly food shortages due to El Nino).\n\nNote here that this is completely divorced from AI as a technology, any considerations if we are in a financial bubble or not, etc."}, {"id": 50628163, "au": "ianm218", "dom": 452, "sr": 32, "sc": 6.86, "ep": 7.52, "bs": 0.0, "d": 1, "age": 11.84, "grav": 113.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 23, "k": 699, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.107, "fa": 1.1, "gp": 1.232, "bl": 0.0, "ds": 0.0, "txt": "> that the few big frontier providers snatch all the hardware at inflated prices while at the same time offer subsidized tokens below cost\n\nThis is widely proven false at this point… Anthropic’s gross margins on inference is ~85%, even on the $200 subscriptions they are making money.\n\nEven DeepSeek is believed to run at high margin on their core products.\n\nInference has amazing economies of scale it’s weird people haven’t intuited that yet."}, {"id": 50634664, "au": "ashkankiani", "dom": 364, "sr": 33, "sc": 6.74, "ep": 7.84, "bs": 0.0, "d": 4, "age": 4.65, "grav": 30.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 710, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.506, "fa": 0.95, "gp": 1.101, "bl": 0.0, "ds": 0.0, "txt": "There are about 62.3 million employees in small businesses in the US. If every single one of them had a $20/mo claude plan, that is $1.2B a month. That's a lot, but not nearly enough to satisfy anthropic's required earnings.\n\nI've given you the maximum value for these small businesses and it's still insufficient to justify a moat. And everyone here keeps saying that inference will get cheaper so $20/mo seems like the maximum they could charge on average."}, {"id": 50634782, "au": "credit_guy", "dom": 166, "sr": 34, "sc": 6.73, "ep": 7.83, "bs": 0.0, "d": 3, "age": 4.51, "grav": 29.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 8284, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.482, "fa": 0.95, "gp": 1.13, "bl": 0.0, "ds": 0.0, "txt": "Here’s a scenario. Anthropic gets to the famed RSI (recursive self improvement), either full, or more likely partial, and they build a model, let’s call it Haiku 6, which has the intelligence of Opus 5.5, but is served at $0.25/Mtok. And they do this at a profit. Then everyone stops using OSS models, or Sol or Gemini, amd switches to Haiku 6. Except for people who consume free inference. Anthropic will then be able to raise bonds at 6%, while OpenAI will raise at CoreWeave levels, 13-16%. If that lasts for one year, OpenAI is out, and Google switches to leasing their datacenters to Anthropic."}, {"id": 50629984, "au": "zug_zug", "dom": 615, "sr": 35, "sc": 6.61, "ep": 7.49, "bs": 0.0, "d": 0, "age": 9.83, "grav": 85.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 12748, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.454, "fa": 0.5, "gp": 1.828, "bl": 0.0, "ds": 0.0, "txt": "There are two types of investors. Professionals and novices. Novices says \"Technology X sounds like the future, therefore I'll pick some company that I hear a lot about that does technology X and buy that stock, no matter what it costs right now.\"\n\nThe professionals actually read all of the financials of the company and can say for any company \"This company is a buy at a certain price, and that price I estimate to be $Z.\"\n\nPeople who are not in the professional should probably stick to index funds, and holding for years at a time, because (respectfully) you're the sucker at the poker table."}, {"id": 50629261, "au": "halfcat", "dom": 420, "sr": 36, "sc": 6.26, "ep": 7.58, "bs": 0.0, "d": 4, "age": 10.6, "grav": 95.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 10, "k": 800, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.385, "fa": 1.04, "gp": 0.94, "bl": 0.0, "ds": 0.0, "txt": "> I don't think we can simply replace Claude like this anymore\n\nYou absolutely can. Copilot literally lets you pick Anthropic or OpenAI in the M365 Copilot Admin settings (and only OpenAI keeps your data from leaving Microsoft servers).\n\nIt’s almost like they’re interchangeable (because they are).\n\nEvery AI tool can work with spreadsheets, presentations, docs, and so on. Most of these “docs” are HTML files anyway, if Claude created it. But even if you’re working with Excel, every AI tool can read and write those.\n\nMCP is literally a standard, has nothing to do with Claude specifically. Every AI ecosystem works with MCP.\n\nThere’s no moat in the products themselves. The only moat is in regulatory capture (at which point your $20/mo plan will be priced at a few thousand per month per seat)."}, {"id": 50628157, "au": "JumpCrisscross", "dom": 286, "sr": 37, "sc": 6.23, "ep": 7.33, "bs": 0.0, "d": 1, "age": 11.85, "grav": 113.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 10, "k": 194750, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 2.017, "fa": 0.42, "gp": 0.961, "bl": 0.0, "ds": 0.0, "txt": "> bummer you can't buy options the day of the IPO\n\nFormer options market maker here. There are good reasons for this.\n\nOne, you don’t know volatility. That makes dynamic hedging properly a capital-intensive exercise that could wind up dominating volume over price-setting traders.\n\nTwo, IPOs are already risky. Adding a route for retail to leverage that is a recipe for disaster.\n\nThere is also the issue of having to police lock-up evasion. Minor, but material. (It also means your natural-hedging market is largely prohibited from participating.)"}, {"id": 50628248, "au": "simias", "dom": 332, "sr": 38, "sc": 6.17, "ep": 7.71, "bs": 0.0, "d": 2, "age": 11.74, "grav": 111.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 28935, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.795, "fa": 0.62, "gp": 1.189, "bl": 0.0, "ds": 0.0, "txt": "I think it will be a while, mainly because of how constrained the hardware is at the moment.\n\nMy main interrogation regarding Anthropic's business model at the moment is that it's not clear that even maintaining a healthy capability gap to the competition will be enough to justify the cost. In my opinion and experience, past a certain point you get fast diminishing returns. Most Claude users aren't using it to solve Millenium Prize problems.\n\nIf we eventually get a cheapo open-weight Chinese model that operates at the level of, say, Opus 5.5, won't that be Good Enough(tm) for 99% of use cases?\n\nI think the counter-argument is that, as LLM capabilities improve, users get more ambitious and push the boundary of task complexity. I think it's probably true to some extent, but only to some extent."}, {"id": 50628771, "au": "program_whiz", "dom": 301, "sr": 39, "sc": 5.93, "ep": 7.47, "bs": 0.0, "d": 2, "age": 11.16, "grav": 103.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 213, "qw": 0, "k": 1735, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.814, "fa": 0.34, "gp": 1.543, "bl": 0.0, "ds": 0.0, "txt": "unfortunately for Anthropic, those other sites have a fair amount of \"lock in\" that Claude lacks.  There still isn't a great (free, fast, scaled) google alternative.  Social media sites have network effects.  Anyone can make these types of sites, but having the data and the users is hard.\n\nMeanwhile in AI land, there are numerous alternatives that are just about as good.  There is no switching cost, and no network effect (it doesn't get worse for me even if I'm the only user).\n\nIn their case, enshittifying their app for profit won't work, as the only thing keeping customers around is quality.  If they enshittify, then they lose to competitors who got a late-mover advantage, have a nearly as capable model, and are serving up with no ads or restrictions for $0.10/M tokens.\n\nThey're in the restaraurant business now, and don't know about you, but there are few restaurants good enough that I'll sit through rounds of forced ads while waiting for my food.  Too much decent competition, I can also self-host food at home, and switching cost is low.   The best restaurant in the world probably couldn't get away with such as business model.  If they went $1T in debt to start a restaurant, they are probably never climbing out (no matter how good or automated the food is)."}, {"id": 50636666, "au": "kevin_thibedeau", "dom": 54, "sr": 40, "sc": 5.85, "ep": 6.73, "bs": 0.0, "d": 4, "age": 1.61, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 23650, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.364, "fa": 0.95, "gp": 0.567, "bl": 0.0, "ds": 0.0, "txt": "I just ran a comparison of operating a 737-200 in 1980 vs a 737 Max 8 in 2025. The inflation adjusted hourly operational cost was higher in 1980 and the adjusted ticket price was still cheaper. Plus, in 1980, everyone in economy got a heated meal as a \"bonus\" and much more generous free luggage affordance.\n\nThey're raking in profit with their bean counting. They are not suffering."}, {"id": 50634475, "au": "trilogic", "dom": 219, "sr": 41, "sc": 5.77, "ep": 7.16, "bs": 0.0, "d": 4, "age": 4.88, "grav": 32.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 10, "k": 197, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.576, "fa": 0.76, "gp": 0.892, "bl": 0.0, "ds": 0.0, "txt": "Obviously this usage numbers are only in openrouter which is anyway an indicator. \n>Google claims to do 3200T tokens per month, for reference. \nThat is even worse, the entire google usage is just 8x more than a novel opensource model usage in openrouter that just came out. Do you see where this is going? They just release a model, not a huge infrastructure or backup from the government nor already a monopoly of users as the top worldwide search engine. I see it as concerning, and Anthropic is no doubt in big trouble."}, {"id": 50629619, "au": "cmiles8", "dom": 586, "sr": 42, "sc": 5.76, "ep": 7.08, "bs": 0.0, "d": 2, "age": 10.22, "grav": 90.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 0, "k": 5640, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 1.97, "fa": 0.28, "gp": 1.143, "bl": 0.0, "ds": 0.0, "txt": "The market is more reacting to:\n\n1. The fact that they will still need to raise more cash and reports saying they’ll get a “junk” bond rating, combined with interest rates going up that’s an ugly setup\n\n2. The NPV of foundation models trending towards zero, with limited clarity on how they’ll make money in that future reality. The main money to be made is in selling compute but they primary rent that from others.\n\n3. The coming ROI crisis where companies are scaling back AI efforts, raising questions on if future commitments are now too much. They’re pushing corporate customers hard but those corporates are all A) increasingly using model routers to send inference to the cheapest bidder, and B) rolling back AI budgets. Both those are bear signals for ANT.\n\n4. Jensen coming back which is generally bad for them. He’s feeding the open model ecosystem that challenges Anthropic’s existence. The regulatory capture games this fall didn’t pan out as the AI bros had hoped.\n\nThe numbers in isolation are one thing, but with the full context there’s not a lot holding the price up and the market is realizing AI is likely way over-valued. This is all typical boom/bust stuff and we seem to be entering “bust” phase now."}, {"id": 50629918, "au": "Tuna-Fish", "dom": 370, "sr": 43, "sc": 5.56, "ep": 7.1, "bs": 0.0, "d": 4, "age": 9.9, "grav": 86.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 14748, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 0.818, "fa": 1.23, "gp": 1.153, "bl": 0.0, "ds": 0.0, "txt": "$20/$100 Claude business plan does not justify their current stock price, and if they keep prices there it implies that their stock price needs to come down by at least 90%."}, {"id": 50629533, "au": "zurfer", "dom": 553, "sr": 44, "sc": 5.51, "ep": 7.05, "bs": 0.0, "d": 2, "age": 10.31, "grav": 91.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 891, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.311, "fa": 0.68, "gp": 1.402, "bl": 0.0, "ds": 0.0, "txt": "To be fair, the fundamentals for anthropic don't exist. No company has ever grown so quickly and the market is unsure how fast or slow it will continue to grow. Short term the stock price will also not matter for anthropic as it raise the money it wanted. We'll see where things stand in one or two years (will we get 10x growth?, 2x?)"}, {"id": 50636679, "au": "a_bonobo", "dom": 321, "sr": 45, "sc": 5.49, "ep": 7.03, "bs": 0.0, "d": 1, "age": 1.59, "grav": 10.0, "surf": 11.4, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 7075, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 2.011, "fa": 0.34, "gp": 0.921, "bl": 0.0, "ds": 0.0, "txt": "Given their noise about biology and Anthropic's acquisitions in this space, a prediction from someone who works in drug development.\n\nWe all use Claude like crazy under business agreements. They won't steal data outright, but I'm sure they'll take a close look at all development processes; a company is mostly its processes and SOPs. Getting deep insights into the world's best drug development processes will give them a huge headstart, and you can steal these because who will notice?\n\nIf everything goes right for them (drug dev is still a huge amount of luck - success chances are generally 5% because every step of the process fails) I can see them dominate in drug development, like Amazon the book seller dominates in renting out their cloud. People belittle the AI-in-bio hype but something tangible will come out of that."}, {"id": 50631911, "au": "1vuio0pswjnm7", "dom": 501, "sr": 46, "sc": 5.49, "ep": 5.49, "bs": 0.0, "d": 0, "age": 7.67, "grav": 59.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 24452, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.783, "fa": 0.0, "gp": 0.894, "bl": 0.0, "ds": 0.0, "txt": "No Javascript, no cookies, HTTPS optional\n\n   tnftp -4o\"|\n   grep -o '<p.*<\/p>' \\\n   |tr -d '\\134' \\\n   |sed '1s/^/<meta charset=utf-8>/'\n   \" https://assets.msn.com/content/view/v2/Detail/en-in/AA2i7rqa > 1.htm\n   firefox ./1.htm\n   links ./1.htm\n\nText-only:\n\n   links -dump https://assets.msn.com/content/view/v2/Detail/en-in/AA2i7rqa \\\n   |sed '1,/body\\\":/d;/readTimeMin\\\":/,$d' > 1.txt\n   vi -R 1.txt"}, {"id": 50629561, "au": "dimavolo", "dom": 611, "sr": 47, "sc": 5.48, "ep": 6.58, "bs": 0.0, "d": 0, "age": 10.28, "grav": 91.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 35, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.306, "fa": 0.68, "gp": 1.086, "bl": 0.0, "ds": 0.0, "txt": "How could Anthropic not be below IPO price today? The entire AI trade is down 25% ~ 75%. Almost no AI stocks, no matter their present and future earnings forecasts- great or terrible, have been spared. Anthropic went public into a super-tsunami."}, {"id": 50630256, "au": "fanwood", "dom": 581, "sr": 48, "sc": 5.44, "ep": 6.98, "bs": 0.0, "d": 2, "age": 9.53, "grav": 81.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 87, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.333, "fa": 0.95, "gp": 0.784, "bl": 0.0, "ds": 0.0, "txt": "20x-30x price over earnings (profits) is not crazy. But Anthropic's p/e ratio is not 20-30, actually it cannot be calculated as their net income in 2025 was $-42 billion (vs $33 billion revenue). Right now the valuation is 30x their revenues (not profits) last year"}, {"id": 50635039, "au": "notahacker", "dom": 81, "sr": 49, "sc": 5.42, "ep": 6.52, "bs": 0.0, "d": 5, "age": 4.16, "grav": 26.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 291, "qw": 0, "k": 24214, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.854, "fa": 0.34, "gp": 0.823, "bl": 0.0, "ds": 0.0, "txt": "The bigger difference is that operating aircraft is extremely capital intensive and most of the other costs are fixed or near-fixed too (like LLMs and unlike sugary drinks). A commercial aircraft has a capital cost of $xxx,xxx a month, generally on multi-year lease terms which means you need it operating as much as possible, not just at the most profitable times... and then operating it sends even more money out of your bank account before you've sold a single ticket. It's also nearly as expensive to fly when it's empty as full, so generally the most profitable way to operate a flight segment involves slashing prices at the margin until you're nearly full and then trying to eke out a profit on upsells or business class. In practice, the better optimized airlines can make 10-20% which isn't bad compared with most retail, but the average margin is dragged down by all the airlines that aren't making anything at all (and what happens when their revenue model gets shocked by the economy and they're stuck with most of their costs)\n\nThere actually typically isn't that much competition on individual direct flight segments, but if a particular segment is very profitable and not completely closed off to competition, someone else will happily redeploy their expensive aircraft from a less profitable route to compete with you on it. And yeah, that's where it's also similar to LLMs. There mi"}, {"id": 50636381, "au": "jacobgorm", "dom": 145, "sr": 50, "sc": 5.34, "ep": 6.88, "bs": 0.0, "d": 3, "age": 2.12, "grav": 12.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 83, "qw": 0, "k": 971, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": ["https://www.dr.dk/nyheder/penge/konger-satte-stroem-til-supercomputeren-gefion"], "ig": 1.705, "fa": 0.62, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "Denmark bought into it, sorry about the link in Danish, it is worth Google-translating just for the silly wide-eyed quotes from every official from the King of Denmark and down: https://www.dr.dk/nyheder/penge/konger-satte-stroem-til-supe...\n\nState-owned company behind it of course had zero clue what do actually do with all that hardware, and has already posted massive deficits. Now they got a fresh infusion of capital and decided that the GPUs they bought weren't expensive enough, so they are buying a fresh round, because this time surely it will work."}, {"id": 50634924, "au": "ben_w", "dom": 561, "sr": 51, "sc": 5.33, "ep": 6.88, "bs": 0.0, "d": 4, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 30, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.869, "fa": 0.42, "gp": 0.887, "bl": 0.0, "ds": 0.0, "txt": "> The real question is not even how much of the pie AI is going to gobble, it’s whether this particular player is going to do it and not someone else.\n\nThe beneficiaries may be nobody in this industry, just the users of the tech.\n\nWikipedia is not valued at {peak sale price of Encyclopedia Britannica} * {number of people on the internet}, which from memory would be somewhere around 14-18 trillion USD.\n\nCompetition can drive prices down; free models could drive it down a lot if progress ever does stall, which everyone expects eventually (at least if the people understand physics; even the singularity needs to care about physics).\n\nNot even the people making the hardware have a sure place, both because hardware is still getting better per unit cost, and because models are getting their capabilities to fit on smaller hardware."}, {"id": 50634103, "au": "philipp-gayret", "dom": 218, "sr": 52, "sc": 5.32, "ep": 6.86, "bs": 0.0, "d": 3, "age": 5.38, "grav": 36.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 7, "k": 211, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.569, "fa": 0.64, "gp": 0.931, "bl": 0.0, "ds": 0.0, "txt": "> while Claude Opus 5.5 used 6.6 trillion tokens globally.\n\nThe caveat you don't mention is this is usage via OpenRouter. There is not much point in using their API for Anthropic when you can get it via subscription, same goes for API-billed enterprise Claude rollouts. Google claims to do 3200T tokens per month, for reference. (Their highest ranking model via OpenRouter is on 2T/week, if you feel like extrapolating.)"}, {"id": 50630835, "au": "jknoepfler", "dom": 556, "sr": 53, "sc": 5.29, "ep": 6.83, "bs": 0.0, "d": 5, "age": 8.9, "grav": 73.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 3153, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 2.144, "fa": 0.0, "gp": 1.234, "bl": 0.0, "ds": 0.0, "txt": "Correct. Especially and in particular in the wake of a certain trillionaire klepto-bro lobbying aggressively for rule changes to major indices in a cynical gambit to divert passive investment dollars into their own pockets.\n\nI do not want the already wealthy klepto-bro class siphoning value out of my or my parents' 401ks while running an obvious scam on a bunch of credulous dullards.\n\nI see what is happening as theft, and believe it should come with criminal accountability for the executives who have openly and knowingly lied about Anthropic/OpenAI/SpaceX/(etc) and their financial prospects."}, {"id": 50628372, "au": "Slartie", "dom": 469, "sr": 54, "sc": 5.19, "ep": 6.51, "bs": 0.0, "d": 2, "age": 11.59, "grav": 109.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 22, "k": 3680, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.364, "fa": 0.7, "gp": 0.905, "bl": 0.0, "ds": 0.0, "txt": "> This is widely proven false at this point…\n\nCare to point the interested reader to some of this widely available proof?\n\n> Anthropic’s gross margins on inference is ~85%, even on the $200 subscriptions they are making money.\n\nI'd guess it is pretty difficult to properly calculate a margin on something where one of your main expenses - hardware - has a depreciation schedule that is not yet known due to the specific kind of hardware being so new that empirical experiences can't really be applied.\n\nMaybe their margin is calculated against the well-known expenses \"power\" and \"datacenter rent\" only? Wouldn't be the craziest of numbers gymnastics ever heard about from Anthropic."}, {"id": 50636775, "au": "manquer", "dom": 198, "sr": 55, "sc": 5.13, "ep": 6.53, "bs": 0.0, "d": 2, "age": 1.43, "grav": 9.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 10, "k": 4989, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.789, "fa": 0.42, "gp": 0.777, "bl": 0.0, "ds": 0.0, "txt": "> competitive moat depends entirely on continuing (and accelerating) that spending\n\nIt is bit worse than that, there is no guarantee that more spending will translate to a defendable moat in the future.\n\nMeaning they could spend the $1T in commits and still not able to create a substantially better model than current gen and their frontier peers or open weights ones are able to keep pace without the same budgets.\n\nEven if they did make significant improvements in the next few generations,  distillation and other techniques could help competition stay close enough at much cheaper cost - training being expensive for first developer."}, {"id": 50628402, "au": "altcognito", "dom": 394, "sr": 56, "sc": 5.13, "ep": 6.63, "bs": 0.0, "d": 3, "age": 11.55, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 2892, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.522, "fa": 0.68, "gp": 0.772, "bl": 0.0, "ds": 0.0, "txt": "\"$399 for an MP3 player? Give me a break. Creative and Rio already make perfectly good MP3 players for considerably less. And this thing only works with a Mac. I guess Apple figures people will pay an extra $200 for a pretty white case. I don't see this going anywhere.\"\n\nI uuuhhh, may or may not have made exactly these arguments back then"}, {"id": 50628446, "au": "simias", "dom": 334, "sr": 57, "sc": 5.13, "ep": 6.49, "bs": 0.0, "d": 4, "age": 11.51, "grav": 108.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 13, "k": 28935, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.495, "fa": 0.42, "gp": 1.228, "bl": 0.0, "ds": 0.0, "txt": ">We are at the \"Good tool in the hands of a capable person\" level.\n\nThat's what I have in mind, yes. The \"good enough to replace everybody\" level does have a different profile, but I would argue that it would create even bigger issues for the market. I also personally hope they'll fail to achieve this, and I don't think it's certain that they will (all AI development hits a wall eventually, I expect that LLMs will too) although it's certainly possible that it's merely months away."}, {"id": 50633199, "au": "pwarner", "dom": 268, "sr": 58, "sc": 5.13, "ep": 6.48, "bs": 0.0, "d": 4, "age": 6.25, "grav": 44.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 953, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.539, "fa": 0.34, "gp": 1.308, "bl": 0.0, "ds": 0.0, "txt": "Their revenue is mostly enterprise, which pays per token, not per user per month.  And I believe their financial statements have shown overall they are positive (70%+?).\nWill they keep growing?  Will enterprises keep paying? \nI mean, no one knows but the consumer plans aren't going to make to break them."}, {"id": 50629344, "au": "DanielHB", "dom": 302, "sr": 59, "sc": 5.13, "ep": 6.44, "bs": 0.0, "d": 3, "age": 10.52, "grav": 94.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 3149, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.783, "fa": 0.34, "gp": 0.884, "bl": 0.0, "ds": 0.0, "txt": "People greatly underestimate switching costs, once these tools are embedded in your org it is hell. Sure it is not as bad as changing an ERP system, but in my org at least we have quite a integrations with Anthropic that would need to be rebuilt (or maybe the right term is reconfigured?) to use another provider. And that is on top of forcing users to switch from their existing UIs and workflows to different solutions.\n\nMost orgs IT departments will happily keeping using Anthropic even if it is 10x more expensive unless the CFO personally comes knocking."}, {"id": 50631859, "au": "Tuna-Fish", "dom": 388, "sr": 60, "sc": 5.13, "ep": 7.25, "bs": 0.85, "d": 8, "age": 7.73, "grav": 60.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 14748, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.475, "fa": 0.68, "gp": 1.276, "bl": 0.32, "ds": 0.0, "txt": "There are competitors charging a lot less.\n\nKimi K3 is a huge (3T parameter) open weight model, the cheapest it is available from 3rd party providers is $0.25/1M (non-cached) input, $9/1M output.\n\nThis model is not as good as the ones Anthropic uses, but it's not dramatically cheaper to run.\n\nInference is very cheap. Anthropic and OpenAI are both trying desperately to maintain the perception of very high token costs, to sustain the more expensive parts of their businesses. Neither of them wants to cut the costs, but also they compete for customers by having these subscriptions, which are in line with the external estimates for their actual costs."}, {"id": 50633956, "au": "ndiddy", "dom": 251, "sr": 61, "sc": 5.13, "ep": 6.32, "bs": 0.0, "d": 2, "age": 5.53, "grav": 37.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 10416, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_ipo", "flbl": "Price & IPO (Stock)", "urls": [], "ig": 1.473, "fa": 0.34, "gp": 1.301, "bl": 0.0, "ds": 0.0, "txt": "I would not buy Anthropic stock myself at the current price, but the compute obligation thing doesn't really make sense to me. It's not like having $800 billion in debt. It's \"we want to pay for compute at a guaranteed price for x years\". Even if Anthropic stops being a competitive company, as long as the market for compute doesn't collapse and they're able to resell it, they won't be going bankrupt. Look at X.AI for one example. They spent a ton of money building datacenters but nobody wanted their Grok models. Now they make their money by selling compute to other AI providers rather than selling inference."}, {"id": 50628403, "au": "jmyeet", "dom": 446, "sr": 62, "sc": 5.13, "ep": 6.27, "bs": 0.0, "d": 2, "age": 11.55, "grav": 109.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_open", "flbl": "Models & Open (Frontier)", "urls": [], "ig": 1.779, "fa": 0.34, "gp": 0.774, "bl": 0.0, "ds": 0.0, "txt": "That's not the comparison you should be making. You're comparing a corporate subscription to Claude to running your own models when the comparison should be to some other company hosting an open weight model and selling tokens when they, unlike Anthropic, have no training costs. That's the meteor that's heading for Anthropic, OpenAI and SpaceX.\n\nUltimately I believe the only factor that will matter is performance-per-Watt. Researchers believe the lead of frontier models is only 6-12 months. We already have things like OpenRouter that treat cloud LLMs as largely interchangeable.\n\nThe entire valuation of these 3 companies hinges on there being a moat and they themselves \"winning\" at AI. They can't all win and there is no model moat long term. There is still a hardware moat but that's temporary as China plays catch up with NVidia, which absolutely will happen. My current guess is by 2030 you'll see Chinese made AI chips in volume."}, {"id": 50628527, "au": "throwa356262", "dom": 458, "sr": 63, "sc": 5.13, "ep": 6.26, "bs": 0.0, "d": 2, "age": 11.44, "grav": 107.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 2477, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "airlines_money", "flbl": "Airlines & Money (Profit)", "urls": [], "ig": 1.677, "fa": 0.34, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "even on the $200 subscriptions they are making money.\n\nI am confident they loose money when people actually use their subscriptions fully. Why else would token plans limit you to Claude Code and disallow use of always on agents like OpenClaw ?\n\nAnyways, Anthropics high margins is needed to justify current valuation but we all know that this situation is temporary and cheaper tokens are comming. Some claim its already here with OAI Luna and DS flash and so on."}, {"id": 50629897, "au": "cmiles8", "dom": 608, "sr": 64, "sc": 5.13, "ep": 6.25, "bs": 0.0, "d": 2, "age": 9.92, "grav": 86.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 5640, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "anthropic_value", "flbl": "Anthropic & Value (Nvidia)", "urls": [], "ig": 2.026, "fa": 0.0, "gp": 1.029, "bl": 0.0, "ds": 0.0, "txt": "Because Anthropic, which by all objective measures should be worth considerably more than OpenAI, is trading well below where OpenAI recently tried to value itself on the private markets.\n\nThe private debt markets are also drying up and getting super expensive.\n\nThat paints a picture where OpenAI needs cash and it’s only core options are to sell equity in down rounds or take on super expensive junk debt. History says that sort of setup leads to negative feedback loop ending with the company either being taken over by creditors or bailout-acquired in a way that wipes out employee equity and fire sales whatever IP exists."}, {"id": 50635075, "au": "Betelbuddy", "dom": 142, "sr": 65, "sc": 5.13, "ep": 6.25, "bs": 0.0, "d": 1, "age": 4.1, "grav": 26.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 76, "qw": 0, "k": 3644, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": ["https://venturebeat.com/infrastructure/get-ready-for-the-age-of-sovereign-ai-jensen-huang-interview"], "ig": 1.429, "fa": 0.62, "gp": 0.774, "bl": 0.0, "ds": 0.0, "txt": "Remember Jensen Huang was traveling the world. besides fuc\u0023&%$ing everything that moves...was advocating to every single government for Sovereign AI.\n\n\"...He also repeated a notion about “sovereign AI.” This means that countries are protecting the data of their users and companies are protecting data of employees through “sovereign AI,” where the large-language models are contained within the borders of the country or the company for safety purposes....\" - https://venturebeat.com/infrastructure/get-ready-for-the-age...\n\nNo bigger threat to the big model providers..."}, {"id": 50630135, "au": "howunfortunate", "dom": 619, "sr": 66, "sc": 5.13, "ep": 6.24, "bs": 0.0, "d": 2, "age": 9.66, "grav": 83.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 17, "k": 889, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_company", "flbl": "Claude & Company (Switch)", "urls": [], "ig": 1.327, "fa": 0.7, "gp": 0.775, "bl": 0.0, "ds": 0.0, "txt": "> So the professionals have decided the stock
