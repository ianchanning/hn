 of a bus took the bus out of action for 2-3 days and required 3-4 people[1].\n\n(Ignoring the obvious side benefit of being able to fit 10 ads in the space of one if you can rotate them remotely.)\n\n[0] It didn't really work because the displays back then were still big and heavy with hefty power requirements and the management kept cheaping out on hardware which created endless problems.\n\n[1] Probably not the same work-effect for the ~A0 poster ads you get at train stations but there was one at Deptford Bridge that stayed up for almost 10 years after the event it advertised had happened.  Not a good look if you're trying to sell advertising space to people..."}, {"id": 50639910, "au": "MobiusHorizons", "dom": 20, "sr": 2, "sc": 3.72, "ep": 3.87, "bs": 0.0, "d": 2, "age": 5.41, "grav": 36.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 142, "k": 2474, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 0.94, "fa": 0.42, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "It sounds like they are very far from anything you could call a display. At this point the material can be erased and rewritten but that has to be done externally and the process sounds lengthy. Of course this is early phase research, so that doesn’t mean it couldn’t turn into something, but as is, paper is much more practical, but less erasable.\n\n> Erasing the display was done by heating the material to ~200°C uniformly; at this temperature, the atoms have enough energy to move around and find new positions and orientations.\n\n> At these high temperatures, atoms can migrate into the most stable positions, which tend to be crystals due to the dense packing of their regular structure.\n\n> This process is known as annealing, and it resets the display with a uniform blank image.\n\n> Then, to draw images on the blank screen, co-author Dr Shvedov used short laser pulses, like drawing with a laser instead of a pencil.\n\n> The laser pulses add just enough energy to get the atoms moving again and into irregular arrangements, but crucially, this is done quickly.\n\n> As the regions hit with the laser cool down quickly, the atoms freeze in their new irregular arrangement before without a chance to settle back into their crystalline configuration."}, {"id": 50641429, "au": "PaulRobinson", "dom": 16, "sr": 3, "sc": 2.59, "ep": 2.88, "bs": 0.0, "d": 1, "age": 1.48, "grav": 9.4, "surf": 6.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 8151, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 1.214, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Signage that changes occasionally and advertising hoardings currently have a ton of costs associated with updating them. Any display that stays in a single state (standby, etc.) for a long time also in scope from a power saving perspective, assuming eInk not viable.\n\nThey're a way away from it at the moment, but given the iron grip on the patents that eInk is encumbered with, it could be an interesting alternative there, too."}, {"id": 50639637, "au": "kavalg", "dom": 1, "sr": 4, "sc": 2.38, "ep": 2.38, "bs": 0.0, "d": 0, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 522, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 0.967, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "For those of you wondering when it is going to land in your next smartphone: “At the moment, this structure only gives us a limited range of colours. The next step is to understand what changes to the device’s structure will make more colours accessible and expand the colour gamut.”"}, {"id": 50638724, "au": war", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Paper isn't electronically rewritable, and electrophoretic e-ink still carries a fairly thick microcapsule layer with narrow operating temperature ranges and limited color gamut/resolution.\n\nWhat makes solid-state phase-change films like Sb2Se3 interesting is that the active layer is nanometers thick, reflective, and completely bistable—so it could fit ultra-thin static displays, rugged electronic shelf labels, passive status indicators, or optical coatings where you only update state occasionally and want zero standby draw. The practical bottleneck will be switching energy, cycle endurance, and whether you can drive pixels electrically at reasonable voltages instead of relying on external optical/laser writes."}, {"id": 50640016, "au": "adrian_b", "dom": 9, "sr": 9, "sc": 0.15, "ep": 1.35, "bs": 1.19, "d": 2, "age": 5.12, "grav": 34.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 20346, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cds_dvds", "flbl": "Cds & Dvds (Mirror)", "urls": [], "ig": 0.573, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "Precisely this.\n\nThis works exactly like the rewritable CDs and DVDs, except that the difference in reflectivity is high enough to be seen with your eyes."}, {"id": 50638210, "au": "accidc", "dom": 7, "sr": 10, "sc": -0.4, "ep": 1.6, "bs": 1.19, "d": 0, "age": 9.99, "grav": 87.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 82, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 0.585, "fa": 0.0, "gp": 0.152, "bl": 0.45, "ds": 0.0, "txt": "Based on the article, my mental model places it closer to etching. I wonder what the refresh rate would be??\ lls to mix causing loss of contrast over time. Presumably worse at higher temperatures. If left in the sun the pigments themselves might fade as well, but I would expect that to take years."}, {"id": 50639899, "au": "hinkley", "dom": 31, "sr": 23, "sc": -5.33, "ep": 0.45, "bs": 4.24, "d": 3, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 8, "qw": 0, "k": 48232, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "cds_dvds", "flbl": "Cds & Dvds (Mirror)", "urls": [], "ig": 0.191, "fa": 0.0, "gp": 0.0, "bl": 1.6, "ds": 0.0, "txt": "Artax dies and you name the childlike Empress."}, {"id": 50641708, "au": "peebee67", "dom": 5, "sr": 24, "sc": -5.45, "ep": 1.26, "bs": 5.17, "d": 4, "age": 0.87, "grav": 6.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 53, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "cds_dvds", "flbl": "Cds & Dvds (Mirror)", "urls": [], "ig": 0.535, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "I believe the semiconductor junction inside individual LEDs gets around that hot. The cathode filament inside a fluorescent tube gets bright enough to glow - over 1000C. An incandescent bulb gets more than twice that. You'd still wear LEDs on your wrist or put them in your pocket, and handle a flash light without fear though."}, {"id": 50642097, "au": "rcxdude", "dom": 6, "sr": 25, "sc": -6.03, "ep": 0.68, "bs": 5.17, "d": 5, "age": 0.19, "grav": 4.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 11684, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "temperature_eink", "flbl": "Temperature & Eink (Displays)", "urls": [], "ig": 0.289, "fa": 0.0, "gp": 0.0, "bl": 1.95, "ds": 0.0, "txt": "The maximum LED junction temperature is more like ~150C and you really don't want to run them that hot in most cases, because their lif /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
