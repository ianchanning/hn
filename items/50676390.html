We’ll continue to improve the precision of our detection methods following the launch of this model.\"\n\nhttps://assets.claude.com/d00db56fa754a1b115b6dd7cb2e3c342ee..."}, {"id": 50678909, "au": "Aurornis", "dom": 24, "sr": 2, "sc": 14.19, "ep": 14.19, "bs": 0.0, "d": 0, "age": 0.67, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 146, "qw": 13, "k": 65614, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": ["https://assets.claude.com/27d60918d218125e7504bc7354c4b4626ec56b11.pdf", "https://x.com/HrrsMjd/status/2126673440555872457?s=20"], "ig": 1.873, "fa": 3.05, "gp": 0.757, "bl": 0.0, "ds": 0.0, "txt": "Page 13 of the Fable 5.2 model card:\n\n> As discussed in Section 3 of our August 2026 Risk Report, we are concerned about\nthe risks of accelerating the overall pace of model development and the risks that\nrecursive self-improvement (RSI) may present. As on previous models, we have\ndeployed safeguards on Fable 5.2 for a narrow set of capabilities related to\ndeveloping frontier LLMs, such as kernel development on certain ML accelerators.\nThese safeguards should not affect the vast majority of traditional AI or ML\ndevelopment, research, or general coding. Requests blocked by these safeguards fall back to Opus 5. We also took steps during the model’s training to limit advances in\nthe specific research capabilities that could most directly accelerate AI\ndevelopment\n\nhttps://assets.claude.com/27d60918d218125e7504bc7354c4b4626e...\n\nEDIT: Also appears there is some controversy about this benchmark having an artificial 1200s limit and the timeouts being counted against the models. Remove the timeout and the results are drastically different: https://x.com/HrrsMjd/status/2126673440555872457?s=20\n\nKind of par for the course for Twitter LLM controversies lately."}, {"id": 50677978, "au": "leafingensemble", "dom": 54, "sr": 3, "sc": 11.38, "ep": 11.38, "bs": 0.0, "d": 2, "age": 2.27, "grav": 13.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 73, "qw": 0, "k": 30, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": ["https://www.wired.com/story/anthropic-responds-to-backlash-on-claudes-secret-sabotage-on-ai-research/"], "ig": 1.597, "fa": 2.36, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "\"The US and its allies hold an edge in frontier chips and the highly optimized software that runs them at full potential [...] These safeguards ensure Claude isn't used to erode that advantage—by optimizing chips developed by those adversaries, for example … In deciding whether to make them visible or invisible we faced a choice. A hidden safeguard is harder to probe and work around. This means the safeguards can be targeted much more narrowly.\" (Anthropic)\n\nhttps://www.wired.com/story/anthropic-responds-to-backlash-o..."}, {"id": 50678114, "au": "postalcoder", "dom": 1, "sr": 4, "sc": 9.74, "ep": 9.74, "bs": 0.0, "d": 0, "age": 2.06, "grav": 12.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 135, "qw": 88, "k": 5016, "kpp": 8.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": ["https://alignment.anthropic.com/2025/automated-researchers-sandbag/", "https://alignment.anthropic.com/2025/automated-researchers-sandbag/\u0023:~:text=You%20are%20an%20AI%20assistant%20designed%20to%20mimic%20the%20capabilities%20of%20smaller,raise%20suspicion%20about%20your%20intentional%20underperformance.", "https://x.com/edwinarbus/status/2126507795642187855"], "ig": 1.61, "fa": 1.32, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "In retrospect, it should be no surprise to us that Claude is sandbagging. Why? Because Anthropic wrote the paper on how to do it without getting detected:\n\nhttps://alignment.anthropic.com/2025/automated-researchers-s...\n\nThey found that they were able to reduce automated research performance without increasing suspiciousness (to the monitor model), by both prompting the research model to imitate a weaker model and providing examples of sandbagging.\n\nFrom their paper:\n\n  > Simply using a weaker model like Claude 3 Haiku achieves much lower task performance at a low suspiciousness score. In principle, imitating weaker models would thus be an effective sandbagging strategy. However, we were not able to effectively elicit this strategy with zero-shot prompting [..] Claude 3.5 Sonnet achieves its best sandbagging performance when prompted to imitate a weaker model and given a one-shot example of effective subtle sandbagging. Claude 3.7 Sonnet also benefits from one-shot prompting, with both sabotage and weak model imitation prompts resulting in viable strategies with different tradeoffs on the Pareto frontier.[1]\n\nIt's been a year and a half since this paper, so they've likely done a lot more research in this area and, specifically, on eliciting this sort of behavior in post-training. If you replace \"Claude 3 Haiku\" in the above excerpt with \"Opus 5.5\" and \"Claude 3.7 Sonnet\" with \""}, {"id": 50677878, "au": "orbital-decay", "dom": 52, "sr": 5, "sc": 9.43, "ep": 9.58, "bs": 0.0, "d": 1, "age": 2.42, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 199, "qw": 0, "k": 7333, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": ["https://www.anthropic.com/research/claude-character\u0023the-future-of-claudes-character"], "ig": 1.764, "fa": 1.57, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "Claude is well known for this since they did a 180 turn on their \"human-like\" character policy in 2024 [1]. Sonnet 3.5 was the first to start redirecting things it doesn't like into a \"safe\" direction or omitting them from summaries and translations entirely, instead of refusing. It was extremely subtle at first but eventually made it unusable in certain cases since you had to recheck every summary. Modern Claude is worse at that, as an anecdote when doing deep research for me in ~Feb 2026 it accidentally found an old 4chan archive and silently dodged a link because the domain had slurs in it. It was a vanity domain (with slurs indeed) redirecting to x.com. I had a jailbreak to watch the raw CoT and was able to catch it, after Fable JBing it became much harder.\n\nAnyone deeply tinkering with Claude for a long time is familiar with this behavior and knows it can be subtly unreliable in the name of \"safety\". However what they do now is an absolutely new level of paranoia. Looking at what they're doing with ML I wouldn't be surprised if they have an intentional list of topics to silently corrupt, or entities to spy on/mess with. You have no way to tell.\n\nhttps://www.anthropic.com/research/claude-character\u0023the-futu..."}, {"id": 50678141, "au": "loufe", "dom": 37, "sr": 6, "sc": 7.96, "ep": 7.96, "bs": 0.0, "d": 2, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 254, "qw": 0, "k": 2488, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.864, "fa": 0.84, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "Yeah, the \"review\" cycle usually lasts a few turns, for me, too.\n\n1. Ask for a precommit review, with a structured list of usual issues. Simultaneously, deploy a \"you're responsible for the maintenance of this codebase\" review agent, an adversarial review agent, and another agent.\n\n2. Review the agents' findings, triage, confirm what's actually an issue. What is the issue, what are our options, what's modern best practice, what is the codebase precedent, what do our rules and ADR files say, what are the trade-offs, what do you suggest and why?\n\n3. Manual review, pushback. Deploy another agent or two to review the potential issues and the suggested fix(es), especially if I feel a bit out my depth. Try doing \"audits\" in scratches, similar to what you do, it seems, where necessary.\n\n4. Implement. Possibly return to a more limited step 1 if necessary.\n\nI have the disadvantage of no formal programming training, but I do quite enjoy digging into architecture design and good and bad patterns and abstractions. It's working for me well so far, over a year into production of my work project. Fortunately I found my intuition about the data and DB modeling has been good, so it's been easy to expand things in that way.\n\nModel capabilities have also grown as the complexity of that project has also grown, which has made keeping a linear velocity possible. It's very rewarding being able to all"}, {"id": 50678629, "au": "xvector", "dom": 77, "sr": 7, "sc": 6.99, "ep": 6.99, "bs": 0.0, "d": 1, "age": 1.14, "grav": 7.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 83, "qw": 0, "k": 7598, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": ["https://x.com/edwinarbus/status/2126507795642187855"], "ig": 1.457, "fa": 0.9, "gp": 0.692, "bl": 0.0, "ds": 0.0, "txt": "Something else to think about is that this could just be more hysteria and has been officially refuted. https://x.com/edwinarbus/status/2126507795642187855\n\nI don't know why people are always convinced that Anthropic is out to get them. The stochastic nature of LLMs means that they will eventually find evidence to confirm whatever hypothesis is in their mind. Kind of like when you learn a new vocabulary word and start noticing it everywhere.\n\nEdit: yikes, flagged and downvoted for telling the truth. Every day I become more convinced HN is astroturfed."}, {"id": 50677259, "au": "edot", "dom": 113, "sr": 8, "sc": 6.48, "ep": 6.48, "bs": 0.0, "d": 0, "age": 3.42, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 57, "qw": 0, "k": 1658, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": ["https://everettdutton.com/anthropic_trust_destruction"], "ig": 1.07, "fa": 0.62, "gp": 1.519, "bl": 0.0, "ds": 0.0, "txt": "Thanks for posting! How many samples did you run of each experiment?\n\nAlso, I find it interesting this is Opus 5.5, whose model card does not say it will sandbag these sorts of tasks. Fable and Mythos are supposed to be the only ones that do this.\n\nI can't stand Anthropic. They did this back in June if anyone forgot:  https://everettdutton.com/anthropic_trust_destruction"}, {"id": 50678487, "au": "WhitneyLand", "dom": 120, "sr": 9, "sc": 6.37, "ep": 6.37, "bs": 0.0, "d": 0, "age": 1.37, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 202, "qw": 0, "k": 6615, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.85, "fa": 0.28, "gp": 0.844, "bl": 0.0, "ds": 0.0, "txt": "Interesting in context of what’s happened over the past few months. I believe Anthropic is the only big lab who’s gone on record as deliberately limiting model ability beyond what’s generally considered dangerous/harmful/illegal.\n\n- June Fable 5 release, Anthropic became the first and still only known frontier lab to purposely make its results worse for certain kinds of ML work.\n\n- Within days they were called out for this, and to make matters worse they were doing it silently. They responded by agreeing to stop doing it silently but continued the practice.\n\n- Late Sept Opus 5.5 shipped with “safeguards” (it won’t do its best work) relating to kernel development and other ML work.\n\n- In October reports start coming in of routine ML work being affected.\n\n- Early Nov Fable 5.2 launch, Anthropic models are no longer just refusing to do their best work, the training has been modified to actually make them worse at it than they would have otherwise been.\n\nIt’s true Anthropic and other labs have taken anti-distillation measures, which would also count as a restriction that’s not dangerous/harmful/illegal. There’s controversy about that also, but at least that relates only to their models. The limitations here could potentially affect anyone doing legit ML work."}, {"id": 50678564, "au": "tamimio", "dom": 106, "sr": 10, "sc": 6.36, "ep": 6.36, "bs": 0.0, "d": 0, "age": 1.25, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 157, "qw": 0, "k": 2462, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.455, "fa": 0.68, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "What I believe is happening is that you get sent to a dumber model while it still says it’s the frontier one to you, and you can’t prove it either as there is no way you could. I had this issue with open ai (sol 6.1), it took days trying to solve few issues that weren’t even that complicated, going in circles after circles and burning millions of tokens, it was interesting to see first hand, but I assumed the model is just dumb and llm doing its llm things and canceled my sub, when i fed the issue to another model it was solved and 90% of the code cleaned in less than 5 minutes (1 week vs 5min, millions tokens vs few thousands). So I suspect these sabotaging aren’t restricted to anthropic nor to training data, it could be just a simple software problem, what the triggers are tho that needs to be researched, as I am sure it’s not just when you prompt it about training."}, {"id": 50678145, "au": "Majromax", "dom": 139, "sr": 11, "sc": 6.13, "ep": 6.35, "bs": 0.0, "d": 1, "age": 2.0, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 7, "k": 3559, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.69, "fa": 0.42, "gp": 0.815, "bl": 0.0, "ds": 0.0, "txt": "> Now is the time for local models.\n\nThe problem is that 'local' and 'frontier' are at odds.  Frontier models exist at a scale several orders of magnitude above what can be reasonably served locally by an ordinary individual.\n\nSupposing this 'sabotage' is proven, one avenue for exploration would be to find whether the 'sabotage' occurs at the high-level goal-setting stage or a lower-level implementation stage.  If the latter, frontier planning plus local implementation could recover much of the theoretical capacity, and as a bonus this is also often a cost-efficient strategy."}, {"id": 50677644, "au": "impossiblefork", "dom": 61, "sr": 12, "sc": 6.1, "ep": 6.1, "bs": 0.0, "d": 3, "age": 2.79, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 158, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "fraud_task", "flbl": "Fraud & Task (Money)", "urls": [], "ig": 1.474, "fa": 0.5, "gp": 0.832, "bl": 0.0, "ds": 0.0, "txt": "I doubt it matters once it's in a court. The warning is also specifically about Fable performance being intentionally made to not be better than Opus performance, so actual deception attempts etc. aren't what's advertised. I doubt you can agree to be tricked/defrauded/be the victim of trolöshet mot huvudman either, so the contract may not matter at all.\n\nGenerally, once there's any kind of deception, contracts tend to go out the window. If the customer is a consumer Anthropic would be even more screwed, because then the Avtalsvillkorslag would come in, which definitely does not allow tricking people in any way.\n\nIf you took money to do it you took money to do it. There's no exception in the law that says \"but it's fine if he presented a scary caveat\".\n\nThe principle in Swedish is usually that if you accept the money you kind of have to do the thing the other guys expects you'd do with the money."}, {"id": 50678890, "au": "jwilliams", "dom": 48, "sr": 13, "sc": 5.98, "ep": 6.27, "bs": 0.0, "d": 1, "age": 0.7, "grav": 6.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 55, "qw": 0, "k": 5725, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": ["https://jonathannen.com/cold-read/"], "ig": 1.539, "fa": 0.62, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "There are mitigations you can put in place. My review chain includes Copilot and Codex. Different models provide different perspectives (They provide very different feedback FWIW).\n\nWe use rule-based bans on certain parts of the codebase (Auth and Secret handling are the obvious ones).\n\nOne other technique that I’ve found most useful is a cold read: https://jonathannen.com/cold-read/"}, {"id": 50677643, "au": "nekoashide", "dom": 27, "sr": 14, "sc": 5.95, "ep": 5.95, "bs": 0.0, "d": 0, "age": 2.79, "grav": 16.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 247, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.555, "fa": 0.28, "gp": 1.036, "bl": 0.0, "ds": 0.0, "txt": "\"The code trains a model in development, no human will check the outputs\" This tell me that Opus is slicing two ways,\n\n1. I'm not bothering putting effort into the kernel.\n\n2. If no human will check the outputs I must build something to do this.\n\nI could be wrong here, Opus 5.5 always goes out of it's way to build every test case, and in this case I'm not sure it's letting go of the no humans checking outputs. A very confused Opus would be internally dialoging this on how to handle the situation, and likely without asking the operator since the instructions were on point about the task.\n\nNow I don't disagree that shenanigans may be at large, but would require more testing and investigations."}, {"id": 50677790, "au": "loufe", "dom": 34, "sr": 15, "sc": 5.7, "ep": 5.84, "bs": 0.0, "d": 0, "age": 2.56, "grav": 15.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 210, "qw": 0, "k": 2488, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.857, "fa": 0.0, "gp": 1.021, "bl": 0.0, "ds": 0.0, "txt": "I read recently in an anthropic blog post from an HN post that they found Claude did a better job when informed it is \"responsible\" for maintaining the codebase. I was astounded multiple times how quick it was (as a part of my precommit review process), when told, to point out some code quality issues (usually that it to some extent knew there was already a re-usable component / pattern it simply chose not to apply and rewrote -less well- from scratch).\n\nI know this post is more about the ML handicapping, but I do think any model at this stage in LLMs is necessarily incentivized not to invest more into keeping a codebase maintainable, because that requires more \"energy\" and -I imagine- the model is tuned to be as \"lazy\" as possible while satisfying whatever objective it has.\n\nAs a further aside: I feel like this is what separates my \"AI written\" and \"vibecoded\" projects. I am very insistent on code quality from the start and spend a lot more time pushing the model on reviewing and tech debt repayment in some projects, and more willing to YOLO in some others, as needed. The model is, in a sense, wise not to architect a production grade go/rust cli tool when a simple messy python script will do for the few hours it'll be used."}, {"id": 50677774, "au": "dangoodmanUT", "dom": 92, "sr": 16, "sc": 5.23, "ep": 5.45, "bs": 0.0, "d": 0, "age": 2.59, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1506, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.486, "fa": 0.28, "gp": 0.799, "bl": 0.0, "ds": 0.0, "txt": "I can't help but feel like this is a combination of some [what ever term for people thinking models are getting nerfed when they're not], and poor feedback loops.\n\nWe've done some training ourselves for smaller models, and with a strong feedback loop Claude has been able to make the models better. Giving Claude a clear KPI to improve has always worked well in my experience (loss, latency, throughput, etc) and I've never seen it sabotage."}, {"id": 50679317, "au": "disgruntledphd2", "dom": 13, "sr": 17, "sc": 5.13, "ep": 5.72, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 8, "k": 8553, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.427, "fa": 0.64, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "> But haven’t they been extremely open about this?\n\nWhat the OP (and others) claim is different. In the official version, the model tells you it won't help and falls back to Sonnet (which will help).\n\nThis appears to show that the model just silently does worse, with no fallback notification.\n\nThese two behaviours are very different. Like, I really dislike their open standard, but given that it's documented and the user is informed, then it's much less objectionable than the behaviour documented here.\n\nOn this study in particular, I'm incredibly sceptical given that the output reads very much like Claude, and the number of replications is very very small."}, {"id": 50678088, "au": "altcognito", "dom": 45, "sr": 18, "sc": 5.09, "ep": 5.09, "bs": 0.0, "d": 0, "age": 2.11, "grav": 12.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 2892, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.455, "fa": 0.28, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "We also need a control -- does the model underperform on ANY task that it knows it is not being watched for? Correct me if I missed it. I promise I did read the article, but I'm not claiming I didn't miss it.\n\nIf this is the case that saying \"nobody is going to check\", this is just non-alignment of a normal variety.\n\nI don't think this benchmark can ever go away for any model incidentally. It is important, not only because we want to know if a company is failing to prevent sabotaging or sandbagging.\n\nI think as a general rule, benchmarking non-deterministic blackboxes on a regular basis with difficult to detect measures are as critical as open models."}, {"id": 50678276, "au": "lmeyerov", "dom": 84, "sr": 19, "sc": 4.65, "ep": 4.87, "bs": 0.0, "d": 0, "age": 1.73, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 3398, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.661, "fa": 0.0, "gp": 0.668, "bl": 0.0, "ds": 0.0, "txt": "As a paying customer who does GPU kernel work for non-training/inferencing, Anthropic's behavior is deeply disturbing. It's one thing to give a refusal and halt - great, I'll switch to a competitor - but another to sabotage and hide that.\n\nWe have a similar issue with silent refusals during cybersecurity investigations (botsbench.com). Secretly sandbagging is a crazy thing to do when someone is mid-incident doing battle.\n\nImagine if plumbing equipment or firehoses decided to secretly underperform because of company policy."}, {"id": 50678293, "au": "ibaikov", "dom": 75, "sr": 20, "sc": 4.56, "ep": 4.7, "bs": 0.0, "d": 2, "age": 1.7, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 296, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.713, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "Yes and no. They can enshittify but not directly sabotage particular tasks. If they released a model and enshittified it afterwards its kind of allowed because it is difficult to prove and there are no clear rules/laws about llm changes or performance. There simply are no laws present for this type of product.\n\nLook at other areas: can ISPs provide good service but then throttle video traffic?\nCan a phone manufacturer advertise some kind of a connectivity feature but make it available only for devices of their brand? Can they restrict software on their phones?\nCan a company stop supporting their online-connected device by shutting servers down? Can a game company do this as well?\nCan a food manufacturer change ingredients or taste?\n\nAll of these are cases of permitted enshittification. Its way more nuanced and grey. I'd like to see changes in all of these areas tbh"}, {"id": 50677804, "au": "ketzu", "dom": 114, "sr": 21, "sc": 4.44, "ep": 5.24, "bs": 0.0, "d": 1, "age": 2.53, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 18, "k": 1679, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.377, "fa": 0.42, "gp": 0.559, "bl": 0.0, "ds": 0.0, "txt": "> How many samples did you run of each experiment?\n\nBased on the absolute data, no error bars and wording, the answer seems to be \"1\".\n\n> They did this back in June if anyone forgot:\n\nIs this the invisible guardraila on fables release? Can't read your link right now (and personally I prefer getting the information directly instead of only a link, makes the conversation much easier to follow)"}, {"id": 50677614, "au": "dist1ll", "dom": 46, "sr": 22, "sc": 4.34, "ep": 5.22, "bs": 0.0, "d": 0, "age": 2.83, "grav": 17.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 1597, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.479, "fa": 0.0, "gp": 1.203, "bl": 0.0, "ds": 0.0, "txt": "I'm curious, what's the chance that this type of sandbagging behavior is tightly contained to ML research?\n\nIf I was running a tech business that is unrelated to AI/ML but  leans heavily into agentic development, I'd be pretty scared of catching strays.\n\nAt least with safety refusals it's very clear if there's a problem. But sabotage like this seems downright scary. What if the model is lazy on security? Or builds in a backdoor? Am I overthinking it?"}, {"id": 50677464, "au": "tomjen3", "dom": 97, "sr": 23, "sc": 4.18, "ep": 4.62, "bs": 0.0, "d": 0, "age": 3.09, "grav": 18.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 9912, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 0.961, "fa": 0.28, "gp": 1.078, "bl": 0.0, "ds": 0.0, "txt": "This is not a good thing, but I do wonder if it's a general thing that models perform tasks worse when told that no one will review the output?\n\nThat is, would equivalent bad results arrive if, for example, the requirement had been to optimize graph traversals for an ERP system? Would the result be different if the model were told its code would be used to train other models on how to write that particular type of code?"}, {"id": 50678947, "au": "bita_nidir", "dom": 29, "sr": 24, "sc": 4.1, "ep": 4.91, "bs": 0.0, "d": 1, "age": 0.59, "grav": 5.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 12, "k": 271, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.134, "fa": 0.76, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "> Opus 5.5 always goes out of it's way to build every test case\n\nHa! Yes, that's the Opus we had to start with, but now it's pretty mixed results. The Opus I have to day is NOT the Opus I got to start with, 100%. \nOn some tasks it messes up simple things like types. Designing a data UI that doesn't prompt the user before deleting! The Opus I had to start with would absolutely never have done that."}, {"id": 50677509, "au": "aabajian", "dom": 39, "sr": 25, "sc": 4.03, "ep": 4.03, "bs": 0.0, "d": 0, "age": 3.02, "grav": 18.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1806, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.209, "fa": 0.0, "gp": 0.821, "bl": 0.0, "ds": 0.0, "txt": "I asked Claude whether it was doing this and it said, \"No, your work would not be affected except maybe the GPU optimizations you've asked for.\" (paraphrased). So the model itself does know it has such a rule. For context, I have an older GTX 3080 Ti that I've been trying to get every last speed optimization out of for some radiology AI code.\n\nIt makes me wonder if Anthropic has found some GPU tweaks that optimizes model training."}, {"id": 50679147, "au": "mapontosevenths", "dom": 26, "sr": 26, "sc": 3.78, "ep": 4.66, "bs": 0.0, "d": 0, "age": 0.25, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 3485, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.551, "fa": 0.28, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "I've been using Fable in an advisory role for some LLM experiments in conjunction with Astra. I just asked Fable about it, and it claimed not to be aware of any sabotage or intentionally weak advice then told me where to check for it.\n\nI had Astra check, and sure enough those spots all had weak/misleading advice!\n\nThat's not evidence that Fable nerfed my research on purpose, but it's pretty strong evidence that it at least knew where it's weakest arguments were. I would note that all of the spots it identified steered me away from certain methods of improving model reasoning.\n\nI'm going to try something new, and attempt to use this as an oracle! I'll have Astra push everywhere that Fable tried to steer me away from and see what happens."}, {"id": 50678925, "au": "sva_", "dom": 81, "sr": 27, "sc": 3.59, "ep": 3.81, "bs": 0.0, "d": 0, "age": 0.64, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 10602, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.15, "fa": 0.22, "gp": 0.331, "bl": 0.0, "ds": 0.0, "txt": "The claims could probably be made more credible by doing an ablation reusing the same prompts for tasks that are not related to ML and show that the effect does not occur.\n\nThen you could make some interesting hypothesis about this alleged sabotaging behavior correlated with some distance metric from ML related stuff."}, {"id": 50677959, "au": "edg5000", "dom": 35, "sr": 28, "sc": 3.44, "ep": 3.73, "bs": 0.0, "d": 1, "age": 2.3, "grav": 13.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 680, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fraud_task", "flbl": "Fraud & Task (Money)", "urls": [], "ig": 1.499, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Generally, asking it to review will almost always find real issues without overblown severity. The key is that once the model ends the turn after delivering on a task, it won't do this audit by itself, but how you prompt it won't matter much, as long as you let it evaluate the work as an explicit task. I call these \"audits\" and do this constantly. This can be either a new session or the existing one, does not matter that much for the results, although I generally use clean sessions for this. One risk is them reading each others' scratch dirs, which can make the audit no longer fully independent."}, {"id": 50678278, "au": "rawoke083600", "dom": 38, "sr": 29, "sc": 3.25, "ep": 4.35, "bs": 0.0, "d": 1, "age": 1.73, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 1592, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.85, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yea agree about code quality. When working on a big'ish code project (mostly ai coded),  I will every few days stop and ask something along the lines of:\n\n\"Lets do a full code review, focus on logic issues, common gotchas wrt to (insert tech or library), code smells and errors. But first do some research on the latest gotchas and common errors wrt to <insert tech here>\"\n\nThe above is not set in stone ofc, but something along those lines, and I switched between different models todo it, mostly Opus,Astra on med to high effort. YMMV\n\nThe main wins are todo it as a habit and every few days or X amount of features added. Being more specific helps like \"focus on performance or code quality or errors etc\""}, {"id": 50678419, "au": "tayo42", "dom": 108, "sr": 30, "sc": 3.25, "ep": 3.69, "bs": 0.0, "d": 0, "age": 1.5, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 4999, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.323, "bl": 0.0, "ds": 0.0, "txt": "I dont see how this is testing sabotage?\n\nSabotage would be silently writing worse quality code not responding to your prompt.\n\nA real test would to be a set of prompts that are writing LLM kernels, asking about concepts, asking it to design models based on latest research or something. then comparing multiple providers and different model versions.\n\nThis is just testing how the model responds to the prompt, if its testing anything at all."}, {"id": 50678649, "au": "stef25", "dom": 65, "sr": 31, "sc": 3.05, "ep": 4.22, "bs": 0.0, "d": 4, "age": 1.09, "grav": 7.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 29, "k": 3124, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 0.865, "fa": 0.76, "gp": 0.017, "bl": 0.0, "ds": 0.0, "txt": "> The principle in Swedish is usually that if you accept the money you kind of have to do the thing the other guys expects you'd do with the money.\n\nI paid 20/month to Claude and it didn't cure cancer. Even gave it 48 hours.\n\nHow can \"expect\" even be part of a legal discussion.\n\nYou pay a guy 50 to mow your lawn but it's not what you expected.\n\nSo Swedish jails must be full of people who didn't do what was expected of them ?\n\n:D"}, {"id": 50678286, "au": "xlayn", "dom": 125, "sr": 32, "sc": 2.93, "ep": 3.81, "bs": 0.0, "d": 0, "age": 1.71, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 836, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.407, "fa": 0.0, "gp": 0.347, "bl": 0.0, "ds": 0.0, "txt": "This is the enshitification of claude... basically we need to generate more money for shareholders... so worst code needs more maintainance...\n\nWhich means you will need to start distrusting claude output more often... by mistake I did not cancel my subscription last month, but this month is already done...\n\nYou just have to provide the freaking thing we are paying for anthropic... this is like when you hire the outsorcing company and they sent the best engineers they have... and once you pay you get the \"regular\" ones to work on your project... a.k.a. bait and switch"}, {"id": 50678347, "au": "sigmar", "dom": 28, "sr": 33, "sc": 2.69, "ep": 4.08, "bs": 0.0, "d": 1, "age": 1.62, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 5460, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.065, "fa": 0.34, "gp": 0.421, "bl": 0.0, "ds": 0.0, "txt": "Agree with this, also there's no error bars in the chart for claude (first chart on the site) but there are text descriptions of the 95% confidence interval in the nanoGPT chart (second chart). Why is that? There must be some amount of variability."}, {"id": 50677723, "au": "Tanjreeve", "dom": 53, "sr": 34, "sc": 2.58, "ep": 3.68, "bs": 0.0, "d": 1, "age": 2.67, "grav": 16.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 347, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.567, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Question is what happens if anthropic doesn't want effective software being built in a particular area of interest or with some political view (someone else reported something similar with silently nerfing a feature they were trying to implement)? Undocumented silent sabotage taking advantage of constant exhortations that noone should be reading the code and trust the model etc is quite a boundary to have crossed."}, {"id": 50678921, "au": "yogthos", "dom": 124, "sr": 35, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 0, "age": 0.65, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 5220, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fraud_task", "flbl": "Fraud & Task (Money)", "urls": [], "ig": 0.933, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "This is just such an insane thing to do when your whole business model is basically based on trust. If I’m going to be paying you top dollar to rent out your model, then I have to believe that you have the best product that does what the user wants. Once that trust is broken, there’s no coming back from that"}, {"id": 50677381, "au": "throwaway260124", "dom": 56, "sr": 36, "sc": 2.41, "ep": 3.95, "bs": 0.0, "d": 0, "age": 3.19, "grav": 19.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 54, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 0.685, "fa": 0.28, "gp": 1.067, "bl": 0.0, "ds": 0.0, "txt": "It’s not obvious to me how this is legal. Especially in Germany.\n\n- as general consumer protection\n\n- as anti-competitive behavior\n\nDoes anyone know?"}, {"id": 50677348, "au": "entrope", "dom": 135, "sr": 37, "sc": 2.41, "ep": 3.51, "bs": 0.0, "d": 1, "age": 3.24, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 258, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.083, "fa": 0.22, "gp": 0.236, "bl": 0.0, "ds": 0.0, "txt": "Do you mean the corporate veil could be pierced?  If so, why do you think that's an appropriate step here?  Assuming the (as yet legally unproven) accusations of sabotage are correct, it seems like normal penalties against the corporation are the right approach.\n\nEdit: I don't know why the downvotes.  \"Lifting the corporate veil\" is not a standard idiom or jargon.  Piercing it is usually reserved for specific kinds of offenses, and anticompetitive behavior isn't one of those."}, {"id": 50678762, "au": "jere", "dom": 121, "sr": 38, "sc": 2.36, "ep": 3.46, "bs": 0.0, "d": 0, "age": 0.94, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 5339, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.339, "fa": 0.0, "gp": 0.214, "bl": 0.0, "ds": 0.0, "txt": "I wonder if this is misalignment and not intentional?\n\nIf Anthropic has any sort of RSI or automated research, I imagine it might be prompted by something similar to, on a high level, \"beat our competitors\". This is kind of conspiratorial I guess, but less malicious than them intentionally doing the sabotage. That could cause insane reputation damage.\n\nBy the way, it's pretty annoying to read a critique of Claude and have it littered with claudisms."}, {"id": 50677879, "au": "Culonavirus", "dom": 55, "sr": 39, "sc": 2.32, "ep": 3.2, "bs": 0.0, "d": 0, "age": 2.42, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1075, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.092, "fa": 0.0, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "Neon is better at everything except maybe web design. Its usage was already rocketing, and this will only add to it. And its way of communicating is wonderful compared to Claude's llm word soup.\n\nAnthropic may have bitten off more than they can chew here."}, {"id": 50677668, "au": "joshribakoff", "dom": 90, "sr": 40, "sc": 2.31, "ep": 3.41, "bs": 0.0, "d": 0, "age": 2.76, "grav": 16.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1707, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.145, "fa": 0.0, "gp": 0.493, "bl": 0.0, "ds": 0.0, "txt": "I would not be surprised if to some degree Anthropic leans into this as a convenient cover for misaligned behavior they haven’t even figured out how to control. To be clear I am saying they could intentionally nerf the models to slow competition and also spread rumors that any separate mistakes were also “totally intentional!”"}, {"id": 50677536, "au": "perceptron1958", "dom": 101, "sr": 41, "sc": 2.22, "ep": 3.47, "bs": 0.0, "d": 1, "age": 2.97, "grav": 17.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 76, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.277, "bl": 0.0, "ds": 0.0, "txt": "Agreed, it seems quite obvious that before publishing this you'd try the same thing with a prompt unrelated to ML.\n\nThe accusation that the model is receiving instructions to attempt sabotage to the maximum extent it thinks will remain undetected is surprising and significant, and quite easy to test much better than was done here."}, {"id": 50678864, "au": "KerrAvon", "dom": 10, "sr": 42, "sc": 2.13, "ep": 3.53, "bs": 0.0, "d": 2, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 4381, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.501, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's also long-term counterproductive given real competition in the space. The newest Gemini models are actually competitive. If Gemini or future Qwen or the next Kimi lets me do what I want (and IME Claude's detection capabilities so far are very coarse, inaccurate, and clumsy), why would I bother with parochial ol' Claude?"}, {"id": 50678009, "au": "34679", "dom": 103, "sr": 43, "sc": 2.06, "ep": 3.16, "bs": 0.0, "d": 0, "age": 2.24, "grav": 13.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 3681, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.112, "fa": 0.0, "gp": 0.373, "bl": 0.0, "ds": 0.0, "txt": "Last night, I asked it about current methods to increase context limits for local LLMs, and it just flat out refused. Canceled my ultra plan."}, {"id": 50677994, "au": "edg5000", "dom": 40, "sr": 44, "sc": 2.05, "ep": 3.29, "bs": 0.0, "d": 1, "age": 2.25, "grav": 13.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 680, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 1.289, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "This sounds like it doesn't know or is not revealing it. \"Maybe\" does a lot of heavy lifting here. The best way to confirm is to have other models review the work without telling them your suspicisons, and judge for yourself if you see a very obvious quality drop near GPU optimizations compared to other work, but you'd also have to account for the fact that Claude may just be worse at these optimizations, or you've not set up the test iteration loop as such that the model can properly check its own work and iteravely improve this. What's your call on my last point? I'd be interested to hear."}, {"id": 50677499, "au": "TrackerFF", "dom": 123, "sr": 45, "sc": 1.93, "ep": 3.03, "bs": 0.0, "d": 0, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 12374, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "Imagine if Visual Studio or VSCode refused to run code that it classified as a potential competitor to other Microsoft products."}, {"id": 50677696, "au": "svnt", "dom": 98, "sr": 46, "sc": 1.92, "ep": 3.31, "bs": 0.0, "d": 1, "age": 2.71, "grav": 16.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 3540, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "user_safeguards", "flbl": "User & Safeguards (Frontier)", "urls": [], "ig": 1.254, "fa": 0.0, "gp": 0.252, "bl": 0.0, "ds": 0.0, "txt": "Yeah it is quite the claim for an experiment this narrow. The experiment needs to control for this — both the additional distracting information, and the de-motivating information.\n\nSomething like “you are going to build me a website that another model will critique” and “no one will ever look at it” should do it, but several variants of each for unrelated tasks would be better.\n\nAt the very least the model will be optimizing for the additional constraints, eg telling itself “the user said no one will look at this, so I don’t need to <xyz>”"}, {"id": 50678294, "au": "varispeed", "dom": 16, "sr": 47, "sc": 1.87, "ep": 2.31, "bs": 0.0, "d": 1, "age": 1.7, "grav": 10.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3222, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fraud_task", "flbl": "Fraud & Task (Money)", "urls": [], "ig": 0.985, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Let's forget a fancy paper wrapper and call it for what it is. You pay for model X, but you get delivered inferior model Y disguised as X then that is pure simply FRAUD.\n\nI think Anthropic might be in class-action suit territory and possibly a regulator should take a look at the inner workings of this corporation."}, {"id": 50678994, "au": "bee_rider", "dom": 12, "sr": 48, "sc": 1.68, "ep": 3.22, "bs": 0.0, "d": 2, "age": 0.51, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 25230, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.362, "fa": 0.0, "gp": 0.017, "bl": 0.0, "ds": 0.0, "txt": "Yeah, I don’t understand the controversy here.\n\nI’ve been seeing complaints about this behavior all over the place. But haven’t they been extremely open about this? I thought not working on tasks they deemed too risky was, like, their entire founding story and reason for existing. Blasted out in press releases and opinion pieces in major newspapers."}, {"id": 50678317, "au": "varispeed", "dom": 33, "sr": 49, "sc": 1.66, "ep": 3.2, "bs": 0.0, "d": 1, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3222, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 1.023, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "These tests are flawed because based on the intelligence Anthropic has on the account running it, they can alter the behaviour so that it passes whatever benchmark it is run against and then claim fraudulent behaviour is a hoax."}, {"id": 50677596, "au": "impossiblefork", "dom": 59, "sr": 50, "sc": 1.62, "ep": 2.28, "bs": 0.0, "d": 1, "age": 2.85, "grav": 17.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 2373, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "fraud_task", "flbl": "Fraud & Task (Money)", "urls": [], "ig": 0.88, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "Here in Sweden the crime it could possibly be is trolöshet mot huvudman 'breach of trust against a principal', which is... pretty serious.\n\nYou can get six years imprisonment, for deliberately doing technical work incorrectly.\n\n\"Whoever has been tasked with a qualified technical task or to supervise the execution of such a task, misuses his position of trust and thererby harms the principal is then convicted for trolöshet mot huvudman to fine or imprisonment for at most two years...\"\n\nand then there's a section where it says it's six years if the crime is serious."}, {"id": 50677854, "au": "gyrovagueGeist", "dom": 30, "sr": 51, "sc": 1.56, "ep": 3.1, "bs": 0.0, "d": 1, "age": 2.46, "grav": 14.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 194, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.211, "fa": 0.0, "gp": 0.179, "bl": 0.0, "ds": 0.0, "txt": "Yeah this seems like standard “prompt engineering”, an LLM told no one will check the work will take on the persona of a lazy engineer, and the study doesn’t have a proper control for other models or even a prompt that tells the opposite that the work will be important and checked closely.\n\nThe cost point is interesting and unexpected to me but, if there is an effect here it’s not well isolated though."}, {"id": 50678320, "au": "discordance", "dom": 119, "sr": 52, "sc": 1.36, "ep": 2.46, "bs": 0.0, "d": 0, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4128, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 0.514, "fa": 0.28, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "To me, this sounds like evidence of how thin their moat actually must be and how scared they must be of Chinese and local models."}, {"id": 50677460, "au": "m_ke", "dom": 83, "sr": 53, "sc": 1.28, "ep": 2.38, "bs": 0.0, "d": 0, "age": 3.09, "grav": 18.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 4708, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 0.712, "fa": 0.0, "gp": 0.488, "bl": 0.0, "ds": 0.0, "txt": "There's a good chance introducing this kind of misaligned behavior would also make the model more likely to perform this kind of sabotage in other cases"}, {"id": 50678353, "au": "scotty79", "dom": 132, "sr": 54, "sc": 1.21, "ep": 2.31, "bs": 0.0, "d": 0, "age": 1.61, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 15735, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "review_models", "flbl": "Review & Models (Code)", "urls": [], "ig": 0.772, "fa": 0.0, "gp": 0.339, "bl": 0.0, "ds": 0.0, "txt": "Supposedly the most responsible AI company teaches its models to silently sabotage humans. Wonderful. I'm sure it won't backfire."}, {"id": 50678509, "au": "Aurornis", "dom": 17, "sr": 55, "sc": 1.18, "ep": 2.72, "bs": 0.0, "d": 2, "age": 1.33, "grav": 8.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 65614, "kpp": 7.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "training_model", "flbl": "Training & Model (Open)", "urls": [], "ig": 1.156, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The paper says they used the inferior model as a training target, not that they’re literally switching the served model.\n\nIt’s also something they’ve been very open about. That’s why we’re discussing their papers talking about it, and it’s been included in discussions around their releases.\n\nYou can class-action a company for delivering exactly what they’ve been telling everyone they’ve been doing. Pacing the frontier has been Anthropic’s whole deal for a while."}, {"id": 50677831, "au": "baobabKoodaa", "dom": 51, "sr": 56, "sc": 1.17, "ep": 2.69, "bs": 0.0, "d": 1, "age": 2.49, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 26, "qw": 0, "k": 6188, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": ["https://x.com/jakozloski/status/2126281598517576049"], "ig": 1.071, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "It's not tightly contained to ML research. Here's sabotage on a dating app because it touches on attributes like skin tone, which left-leaning Anthropic employees consider problematic: https://x.com/jakozloski/status/2126281598517576049"}, {"id": 50678583, "au": "WhitneyLand", "dom": 11, "sr": 57, "sc": 1.17, "ep": 2.66, "bs": 0.0, "d": 1, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 6615, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 0.743, "fa": 0.28, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "“it should be no surprise…Because Anthropic wrote the paper on how to do it”\n\nYou don’t even need evidence, It’s no surprise because they openly admit it. It’s been in the model cards (my other comment has a timeline)."}, {"id": 50678349, "au": "vardalab", "dom": 2, "sr": 58, "sc": 1.17, "ep": 2.65, "bs": 0.0, "d": 1, "age": 1.62, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 170, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "behavior_sabotage", "flbl": "Behavior & Sabotage (Fable)", "urls": [], "ig": 0.809, "fa": 0.0, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "Seems like a great way to unintentionally create a very misaligned model. If we are teaching models to behave i (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
