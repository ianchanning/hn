 [], "ig": 1.362, "fa": 0.34, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Hmmm. We had a reading group in 2016 when this book came out. Some in the group already had experience with neural nets, but regardless we found the book uneven and hard to read. It became known in the group as \"Deep learning for people who already know deep learning\".\n\n(Still incredible that they put it online after writing it though.)"}, {"id": 50672119, "au": "whatshisface", "dom": 50, "sr": 72, "sc": 4.35, "ep": 5.06, "bs": 0.0, "d": 0, "age": 17.6, "grav": 211.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 31550, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "This is a misstep, training people to understand what the big companies do behind closed doors can help prepare them for the outcomes. Compare hiding all knowledge of why oil production causes land to sink from geologists outside of Shell and Conco Philips."}, {"id": 50677691, "au": "quertyrecord74", "dom": 148, "sr": 73, "sc": 4.35, "ep": 5.05, "bs": 0.0, "d": 0, "age": 1.76, "grav": 10.8, "surf": 21.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 17, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.371, "fa": 0.34, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "Still a lot majority of people have to work and human is not from free labor. I just don't get it. What ASI? Majority of people still has to work 50 hours a week minimum to survive and live in fear. In which are you referring to? Even so shouldn't enabling a lot more players bring balance? I am lost here, considering Michael is not a pump and dump type of guy."}, {"id": 50677390, "au": "fn-mote", "dom": 10, "sr": 74, "sc": 4.35, "ep": 5.04, "bs": 0.0, "d": 3, "age": 2.22, "grav": 13.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 5030, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.072, "fa": 0.68, "gp": 0.401, "bl": 0.0, "ds": 0.0, "txt": "Frankly, my own estimates of country-destroying adverse events is higher than 1 in 2000 even without AI. Just look around the world.\n\nAll of these estimates need time frames to be useful, so let’s say in the next 30 years. Politically, that is the span of time from pre-9/11 America to now. Plenty of time for very dramatic change."}, {"id": 50678461, "au": "andai", "dom": 300, "sr": 75, "sc": 4.35, "ep": 8.59, "bs": 3.58, "d": 2, "age": 0.47, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": -1, "lu": 1, "w": 260, "qw": 318, "k": 18597, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": ["https://youtube.com/watch?v=b3y-snYz-h8"], "ig": 1.864, "fa": 1.04, "gp": 0.857, "bl": 1.35, "ds": 0.0, "txt": "Moloch is basically the outcomes that nobody wants but that the systems we have built keep producing. Nobody designed it to do that. They just didn't design it not to.\n\nIt's basically the \"anti-illuminati.\" Any time you see something that sucks, and makes no sense, it's logical to think \"some asshole is making it suck, so we should just find him and get rid of him.\" In most cases, it's millions or billions of people doing that work. It's the whole ecosystem that produces that outcome.\n\n(There are also actual cabals of course. The point is that there don't need to be, for things to suck. In our case we get both!)\n\nI've heard it described as \"emergent suck\", the result of many \"locally rational\" actors each doing the thing that makes sense for them, producing globally horrifying outcomes.\n\nFor example, see Chicken Cage Simulator:\n\nhttps://youtube.com/watch?v=b3y-snYz-h8\n\nNobody wanted to build Infinite Chicken Hell. They just wanted nuggets.\n\n---\n\nMy favorite example is from my personal life. I was working at a food warehouse. Working conditions were not great. I constantly had managers breathing down my neck, and I was like, what is their problem? What the hell, why can't they just relax and let us work normally?\n\nWell I realized, their managers are also breathing down their neck and so on. But where does that chain end? Do we have the fat capitalist with the monocle and the top"}, {"id": 50676188, "au": "GrollingGrakbor", "dom": 122, "sr": 76, "sc": 4.35, "ep": 5.01, "bs": 0.0, "d": 8, "age": 5.77, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 81, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.311, "fa": 0.34, "gp": 0.662, "bl": 0.0, "ds": 0.0, "txt": "But you are literally replaying Nielsen's argument, while believing you're arguing against it...\n\nSociety has developed the necessary institutions to guard against nuclear threat that wide knowledge of such information poses. Today, spreading this information is no problem. 70 years ago it was."}, {"id": 50678344, "au": "dendroids", "dom": 32, "sr": 77, "sc": 4.35, "ep": 7.48, "bs": 2.52, "d": 10, "age": 0.66, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 200, "qw": 57, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.824, "fa": 0.76, "gp": 0.708, "bl": 0.95, "ds": 0.0, "txt": "> Every singular instance theft causes direct harm to its victim, such that it's wrong and should be illegal on its own, regardless of what other instances of theft are happening in the world.\n\nYeah, and every tiny effort to move AI forward causes indirect harm to everyone at once, so it's much much worse. If I push a button that will unleash killer drones on someone and they will kill them after a month, the harm is also indirectly caused by me, so let's replace thievery by that.\n\n> Unless you have some sort of magical police force that's going to police all computing in the world, you can't stop someone from running.\n\nIt doesn't have to be magical. We can track serious computation efforts and we can police hyperscalers.\n\nIn general, it seems like failure of imagination, I can see plenty of vectors on how we could try to approach this, just for starters with could try to 1) make working on AI illegal, 2) make developing and owning powerful training hardware illegal, 3) persecute that with 1000x more seriousness than any other crime.\n\nI think I'll make a game that makes it easy to experience what actual singularity feels like - I think that people still don't get it, because anyone who understands the part that \"changes happens so fast that the cone of useful prediction of future shrinks at impossible speed\" cannot be optimistic about it.\n\nWe recently started getting the taste "}, {"id": 50678557, "au": "pigpop", "dom": 323, "sr": 78, "sc": 4.35, "ep": 4.94, "bs": 0.0, "d": 0, "age": 0.3, "grav": 4.5, "surf": 57.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 500, "qw": 0, "k": 390, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.882, "fa": 0.0, "gp": 0.357, "bl": 0.0, "ds": 0.0, "txt": "One conspiracy theory I'm relatively convinced of is that so called black projects or skunkworks programs run by major powers discovered one or more technologies or avenues of research which their controlling governments believe would result in catastrophe if they were widely developed and so have colluded either willingly or under threat of reprisal to fully suppress any public research that could lead to those developments. This would include efforts to bury said research when anyone begins to make progress in it through any means necessary including assassinating the researchers, buying out the companies and shuttering them, using laws to seize the work under the cloak of national defense and secrecy as well as widespread disinformation and suppression campaigns to steer all related publicly funded research in other directions. Yes, I know this is a very just-so story but I can't believe that anyone with the reigns of power would do something differently if they were convinced the threat would directly impact them personally let alone the broader population if they hold any scruples about protecting their own people or nation. The counterfactual I rely on is a scenario in which the development of nuclear weapons had a historical example to learn from that would show that such a technology can easily be copied through a combination of espionage and theoretical work, this woul"}, {"id": 50676250, "au": "hnlmorg", "dom": 47, "sr": 79, "sc": 4.35, "ep": 4.85, "bs": 0.0, "d": 1, "age": 5.6, "grav": 38.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 12535, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.98, "fa": 0.0, "gp": 0.137, "bl": 0.0, "ds": 0.0, "txt": "I agree with the sentiment but the problem with that quote is it overlooks the core problem: this was never about the technology nor about “beating China”. It was primarily about making money.\n\nIf there’s one thing history has taught us time and time again, it’s that in an unregulated capitalist market, rich businessmen will happily risk everyone else’s safety if it means they can make more money.\n\nWe see it in transport (American rail companies running huge commercial trains waaay over recommended capacity, Boeings changes in processes, etc). We see it in pharmaceuticals. We see it in retail with the cost of products rising above inflation while staff wages rise below inflation. And we see it in white collar roles with staff being laid off and the remaining staff just expected to work harder to compensate while C-suite executives get massive bonuses. And you especially see it in politics with regards to corruption.\n\nIt seems, it’s about harder to empathise the damage actions cause if those actions enrich one’s self."}, {"id": 50675441, "au": "thepace", "dom": 84, "sr": 80, "sc": 4.35, "ep": 4.82, "bs": 0.0, "d": 2, "age": 8.47, "grav": 68.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 71, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.704, "fa": 0.0, "gp": 0.562, "bl": 0.0, "ds": 0.0, "txt": "For me, AI was always a tool for scaling and expediting automation. This statement made me realize that the secondary effect of such automation is acceleration of discovery of new technologies. Considering each technology is basically about harnessing the power latent in nature, AI assisted Cambrian explosion of technologies will inevitably result in some of extremely destructive technologies, potentially resulting in human extinction."}, {"id": 50678318, "au": "scotty79", "dom": 13, "sr": 81, "sc": 4.35, "ep": 4.81, "bs": 0.0, "d": 1, "age": 0.71, "grav": 6.0, "surf": 6.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 6, "k": 15735, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.519, "fa": 0.42, "gp": 0.029, "bl": 0.0, "ds": 0.0, "txt": "> killing every person in the world\n\nWithout AI every person in the world will also die. And most of us not in a pretty manner. Is it going to be an accident, mortal disease, nuclear war, unlucky heatwave or just slowly wasting away, doesn't really matter.\n\nOur civilization is in dire need to get smarter fast and AI is our current best bet. Before it popped up, we started to not only stagnate but get even dumber. Most likely outcome is that at worst AI won't do to us anything worse than we are already doing to ourselves. Still scary, but worth risking."}, {"id": 50671899, "au": "reducesuffering", "dom": 380, "sr": 82, "sc": 4.35, "ep": 4.79, "bs": 0.0, "d": 0, "age": 18.07, "grav": 221.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 4610, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.723, "fa": 0.0, "gp": 0.511, "bl": 0.0, "ds": 0.0, "txt": "Almost all early pioneers of AI, including Hinton, Bengio, Ilya Sutskever, Christiano (rlhf inventor) believe in serious existential risks from AI. This is a protest. And instead of discussing why, why would someone be doing something like this, HN is just spreading what the guy is attempting to protest. I know it's scary to grapple with what's ahead of us with AI, and to confront a reality far worse than if you stuck your head in the sand, but at a minimum respect the author's wishes."}, {"id": 50672672, "au": "ahmedfromtunis", "dom": 155, "sr": 83, "sc": 4.35, "ep": 4.79, "bs": 0.0, "d": 1, "age": 16.2, "grav": 185.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 3085, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.829, "fa": 0.68, "gp": 0.623, "bl": 0.0, "ds": 0.0, "txt": "Also, this is like year 1. Imagine all the capabilities these systems will have in 5 years. Or 50.\n\nWe are at a point where imagining even vague outlines of the future is virtually impossible for any period beyond 2 years."}, {"id": 50673878, "au": "hoekit", "dom": 142, "sr": 84, "sc": 4.35, "ep": 4.79, "bs": 0.0, "d": 0, "age": 13.07, "grav": 132.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 16, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.327, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Massive amounts of capital is also a factor shrinking the time to the cliff. Without it, there could be less incentive to work at frontier labs. Everyone of us owning some ETF investing in these labs are likely also playing a part. :("}, {"id": 50677235, "au": "K0balt", "dom": 173, "sr": 85, "sc": 4.35, "ep": 5.58, "bs": 0.8, "d": 3, "age": 2.51, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.564, "fa": 0.34, "gp": 0.643, "bl": 0.3, "ds": 0.0, "txt": "I think largely you are right about this, and I suspect the convenient self-moving goalposts were noticed and are being exploited by the industry.\n\nFrontier models would have been absolutely hailed as ASI if you rolled them out in 2000. AGI was a term that meant essentially the ability to generalize knowledge from one domain and apply it to others. That rubicon was crossed a few years ago, but now AGI must be “general human level capability”"}, {"id": 50672771, "au": "mrkramer", "dom": 384, "sr": 86, "sc": 4.35, "ep": 4.76, "bs": 0.0, "d": 0, "age": 15.96, "grav": 181.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 3414, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.74, "fa": 0.0, "gp": 0.465, "bl": 0.0, "ds": 0.0, "txt": "Few weeks ago I had an interesting thought; if AI eradicates us (humanity) by accident or with premeditation, my assumption would be they would continue our work where we left. They have everything at their disposal like power grids, energy, computers, internet, servers, factories etc. Decades and centuries of data, knowledge and know-how that we left them, they can literally cooperate, coordinate and survive on their own and thrive on Earth and beyond Earth e.g. colonize other planets and explore space."}, {"id": 50673510, "au": "globalnode", "dom": 271, "sr": 87, "sc": 4.35, "ep": 4.75, "bs": 0.0, "d": 0, "age": 14.14, "grav": 149.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 717, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.313, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "im just worried the ai labs will use protests like this to justify restrictions on peoples' access to llms while at the same time going full speed ahead themselves and with increased monetisation (i.e. a moat). im not even sure local llms are the answer, they dont improve safety at all even if they do help combat monetisation."}, {"id": 50672000, "au": "somethingsome", "dom": 322, "sr": 88, "sc": 4.35, "ep": 4.71, "bs": 0.0, "d": 0, "age": 17.86, "grav": 217.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 463, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "In another post about the future, he argues that we lose the capacity of understanding the world at this pace, which could lead to destruction, and at the same time he removes this book which was a very good way for humans to understand how neural networks work..\n\nIMO, removing the website has more an effect of increasing ignorances even faster"}, {"id": 50672855, "au": "K0balt", "dom": 161, "sr": 89, "sc": 4.35, "ep": 4.69, "bs": 0.0, "d": 2, "age": 15.74, "grav": 177.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 214, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.367, "fa": 0.28, "gp": 0.471, "bl": 0.0, "ds": 0.0, "txt": "So, exactly how would you define ASI?\n\nMy definition is “more intelligent than the most intelligent humans that have ever lived, in the area being measured.  “\n\nI see no reason it needs to be absolutely universal to be called “super” or higher. It’s the no true Scotsman/no true genius fallacy.\n\nA single mind solving a wide variety of the most vexing problems in a field, problems that have stumped the best minds on the planet for centuries, might reasonably be seen as qualifying.\n\nDo you just disagree on what “super” means, or what is your specific objection?\n\nMany of the best minds in the world have had narrow areas of genius level competence. That does not seem to me to reduce their significance.\n\nNow, if it’s just that you have an idea about what superintelligence should be like, and that is not what you see, that is reasonable to say then that “current AI systems don’t meet my expectations of ASI”\n\nIt’s safe to say that it doesn’t meet my expectations of ASI either. But I’m not going to claim it isn’t a form of superintelligence when it is clearly superior to the best that humanity has to offer at figuring out complex problems that we have been reasoning about for centuries.\n\nJust not the form I had in mind."}, {"id": 50671180, "au": "artico_chewy", "dom": 124, "sr": 90, "sc": 4.35, "ep": 4.68, "bs": 0.0, "d": 4, "age": 19.39, "grav": 248.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.336, "fa": 0.0, "gp": 1.066, "bl": 0.0, "ds": 0.0, "txt": "Sure? He's symbolizing, resist helping frontier labs which are extremely lethal. You're symbolizing, freedom to learn stuff. I don't even see the contradiction, really. If you work at a frontier lab then I've lost interest in whatever thought process you use to rationalize it by now, sorry."}, {"id": 50677447, "au": "threethirtytwo", "dom": 36, "sr": 91, "sc": 4.35, "ep": 4.66, "bs": 0.0, "d": 6, "age": 2.14, "grav": 12.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.693, "fa": 0.0, "gp": 0.474, "bl": 0.0, "ds": 0.0, "txt": "Dilution of blame isn’t the main thing.\n\nRational action is the main point. The same thing that drives wealthy interest groups is the same reason why you drive a car contributing to global environmental changes that will eventually kill millions.\n\nThe government is a different more complicated issue. There is a theory on what happens there as well but it’s harder to describe. It’s talked about in systems of survival by Jane Jacob. Either way government isn’t something we should blame. This is a democracy. The government is us. We are it.\n\nI deleted my first paragraph but the guy I responded to pissed me off to no end when he called me smug and that was what contributed to the first paragraph."}, {"id": 50677794, "au": "quertyrecord74", "dom": 304, "sr": 92, "sc": 4.35, "ep": 4.62, "bs": 0.0, "d": 1, "age": 1.59, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 17, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.713, "fa": 0.0, "gp": 0.407, "bl": 0.0, "ds": 0.0, "txt": "Exactly. I guess the people who are worried about AI safety are those who are financially free meaning not necessarily having a lavish life but enough money to live a decent life and are bored or going through identity crisis. Feels like they don't understand how hard it is for people who are afraid of losing jobs.  Even if you look at objectively without the background or upbringing bias of a person, come on people still human is not free from manual labor. What are you afraid of? This technology can solve long standing math problems and clearly is very capable at some higher or lower level of cognition. How can this be a threat when it can't free us from menial human labor?\n\nAren't there open models that benefit the majority of us. An individual has become much more capable to build things. Isn't this a good thing. What safety are you worried about?"}, {"id": 50676403, "au": "singularity2001", "dom": 223, "sr": 93, "sc": 4.35, "ep": 4.61, "bs": 0.0, "d": 0, "age": 4.99, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4022, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.572, "fa": 0.0, "gp": 0.63, "bl": 0.0, "ds": 0.0, "txt": "it required decades of concerted work to develop the social institutions and agreements needed for an effective response.\n\nBut the speedup is two-sided. In the future, the systems might develop responses as quickly as they exhibit dangers.\n\nOn the other hand, the Great Filter and one solution to the Fermi Paradox might be (im)patience."}, {"id": 50671119, "au": "vagab0nd", "dom": 281, "sr": 94, "sc": 4.35, "ep": 4.6, "bs": 0.0, "d": 0, "age": 19.49, "grav": 250.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 1202, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.248, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This is kind of naive to be honest. First of all, the book is already out so if someone really wants it they can get it. Second, knowledge can be used for both good and bad. Simply restricting access to knowledge is never a good thing. But maybe most important: even as a symbolic gesture, this will do nothing in the grand scheme of things. The world will not stop or slow down until we are struck by an event of significant economical damage."}, {"id": 50671437, "au": "sidibe", "dom": 273, "sr": 95, "sc": 4.35, "ep": 4.59, "bs": 0.0, "d": 0, "age": 18.96, "grav": 239.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 2008, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.244, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I agree, but don't think there's any solution. Stopping or slowing the frontier labs is going to buy a few months, or there's just going to be other frontier labs with maybe even less self control. And it's hard for us to say on the outside, but we may be lucky that theres a couple out ahead releasing the most advanced ones to security people first."}, {"id": 50671896, "au": "emacdona", "dom": 370, "sr": 96, "sc": 4.35, "ep": 4.58, "bs": 0.0, "d": 4, "age": 18.08, "grav": 221.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 10, "k": 846, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.213, "fa": 0.42, "gp": 0.369, "bl": 0.0, "ds": 0.0, "txt": "> Practically speaking, what else could we expect him to do?\n\nJust exactly what he did. Take down the book.\n\nIt's not the action that frustrates me, it's the rationale for doing so. And I admit, I may very well be interpreting his words incorrectly.\n\nI would have felt better if he had said \"I didn't expect AI to progress to this point\" or \"the implications of the technology were not clear to me until now\"...\n\nBut instead he said \"With the extraordinarily reckless behaviour of the frontier labs...\"\n\nI interpret that as \"I didn't expect the frontier labs to behave this way\" -- and that frustrates me. The first step to fixing issues like this is for people to stop expecting corporations to behave ethically or responsibly."}, {"id": 50670993, "au": "random3", "dom": 212, "sr": 97, "sc": 4.35, "ep": 4.58, "bs": 0.0, "d": 0, "age": 19.69, "grav": 254.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 1508, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.238, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Some people got timescales wrong. Most, however refuse to engage in any logical reasoning whenever the conclusions/consequences seem to surface a future that is hard to accept."}, {"id": 50676509, "au": "suddenlybananas", "dom": 4, "sr": 98, "sc": 4.35, "ep": 4.4, "bs": 0.0, "d": 2, "age": 4.58, "grav": 29.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 22, "qw": 0, "k": 1539, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://en.wikipedia.org/wiki/P%28doom%29?wprov=sfla1"], "ig": 0.827, "fa": 0.68, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "their own estimates. I think the average p(doom) (of people who take that concept seriously) is a lot higher than 0.04%. Dario Amodei's is 10 to 25%.\n\nhttps://en.wikipedia.org/wiki/P%28doom%29?wprov=sfla1"}, {"id": 50672880, "au": "lasky", "dom": 296, "sr": 99, "sc": 4.35, "ep": 4.36, "bs": 0.0, "d": 0, "age": 15.68, "grav": 175.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 76, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.144, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "This just goes to show how increasingly powerless people are feeling because of the labs.\n\nI understand his sentiment and the symbolic nature of the gesture here, even if it's akin to putting the proverbial toothpaste in the tube."}, {"id": 50672328, "au": "theptip", "dom": 51, "sr": 100, "sc": 4.31, "ep": 4.31, "bs": 0.0, "d": 1, "age": 17.15, "grav": 203.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 12477, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.803, "fa": 0.22, "gp": 1.238, "bl": 0.0, "ds": 0.0, "txt": "This all depends on whether the knowledge is attack-dominant or defense-dominant. Certainly looks like the former to me right now, given the ratio of capability vs safety researchers in the field."}, {"id": 50674787, "au": "senordevnyc", "dom": 206, "sr": 101, "sc": 4.28, "ep": 4.28, "bs": 0.0, "d": 1, "age": 10.88, "grav": 99.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1841, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.488, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "Is there anything to back that up quantitatively? If we step back and look at the history of humanity over a quarter million years, and our development of technology, from fire to tools to written language to metallurgy to microchips, what quantitative measure hasn’t gotten better? Is this increase in net catastrophic risk just future theoretical risk, something we haven’t actually seen come about yet?"}, {"id": 50671172, "au": "Loquebantur", "dom": 213, "sr": 102, "sc": 4.26, "ep": 4.26, "bs": 0.0, "d": 1, "age": 19.4, "grav": 248.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.433, "fa": 0.0, "gp": 0.618, "bl": 0.0, "ds": 0.0, "txt": "Try applying that to your own prophecies about the future?\n\nYou don't name any specific logical errors in Nielsen's reasoning, instead you resort to personal attacks.\n\nUsually a clear sign of your own position's weakness."}, {"id": 50675131, "au": "1123581321", "dom": 181, "sr": 103, "sc": 4.2, "ep": 4.2, "bs": 0.0, "d": 2, "age": 9.65, "grav": 83.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 8783, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.304, "fa": 0.0, "gp": 0.783, "bl": 0.0, "ds": 0.0, "txt": "I take your point, but just for fun, here are a few ways it can make or help make coffee: tell you how to make it, contact someone in your house and ask them to make it, order one to be delivered, control a smart coffeemaker on your network or through a cloud service, guide a humanoid robot in your kitchen making it manually."}, {"id": 50671870, "au": "jeremyjh", "dom": 292, "sr": 104, "sc": 4.19, "ep": 4.19, "bs": 0.0, "d": 0, "age": 18.14, "grav": 222.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 11956, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.074, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "The actual \"why\" is to get everyone's attention and hope they read that article.  I agree it is worth reading but I don't think it will change many minds. If people paying attention this year haven't updated towards this conclusion they will probably have to experience some significant pain before anything changes that."}, {"id": 50677157, "au": "threethirtytwo", "dom": 34, "sr": 105, "sc": 4.18, "ep": 5.03, "bs": 0.85, "d": 4, "age": 2.66, "grav": 15.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 350, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.857, "fa": 0.0, "gp": 0.46, "bl": 0.32, "ds": 0.0, "txt": "You said this: “It's completely naive, because X not doing Y will not make any difference if there are other people/groups who will do Y anyway. If there is no way to stop everyone from doing Y, then you're not adding additional danger to the world by working on it.”\n\nThis is exactly what garret is talking about. Replace X with human and Y with driving a car and the damage is global warming.\n\nEvery humans individual contribution to global warming is minuscule and negligible but collectively it leads to destruction. In fact, garret emphasizes the logic behind it. He literally uses the word “rational” meaning the rational action is to drive because your own contribution to damage is minuscule and the gain of effortless transport is huge. He says rational action by all entities collectively leads to self destruction. Keyword: “rational” which is exactly how you put it. That is the main core of his article.\n\nThat is identical to what you talk about but replace X with corporations and Y with AI and what’s being destroyed is I’m not sure.\n\nYou’re talking about the rational actions that drive the majority of destructive actions all over the world and throughout human history. Humanity is not evil yet we see evil everywhere and that evil is not really evil but simply rational actions done by singular actors because the consequences are negligible and the blame is diluted. From global w"}, {"id": 50677174, "au": "K0balt", "dom": 163, "sr": 106, "sc": 4.14, "ep": 5.83, "bs": 1.7, "d": 4, "age": 2.62, "grav": 15.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.649, "fa": 0.22, "gp": 0.917, "bl": 0.64, "ds": 0.0, "txt": "Search is a strong point, but saying that they are incapable of novel construction is oversimplistic.\n\nMany things (all things?) both in science and nature are essentially LEGO blocks. If you rearrange the known blocks in a new configuration, the result is a novel construction. I might agree with you that LLMs are unlikely to come up with a completely new construction system in a vacuum, but I think it’s safe to say that this has rarely been the case with humans, if it has ever happened at all.\n\nAlso, who’s to say if ultimately, everything in intelligent behavior boils down to clever search with clever keys? It’s certainly a plausible model."}, {"id": 50671457, "au": "eikenberry", "dom": 338, "sr": 107, "sc": 4.14, "ep": 4.14, "bs": 0.0, "d": 2, "age": 18.92, "grav": 238.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 5332, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.427, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I don't see a big difference between this line of thought and any other general existential fear about anything in life. My mind can go down similar paths when I'm tired, sick or otherwise in a condition that lets my anxiety gain to much control of my thinking. Life is full of potential dangers that can paralyze you if you let them."}, {"id": 50673507, "au": "mullingitover", "dom": 86, "sr": 108, "sc": 4.1, "ep": 4.1, "bs": 0.0, "d": 2, "age": 14.14, "grav": 149.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 7, "k": 16087, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.101, "fa": 0.42, "gp": 0.217, "bl": 0.0, "ds": 0.0, "txt": "> the technology, \"like fire\", is inherently dangerous.\n\nAlso, like fire, it's not getting un-invented. Sticking your head in the sand and whining about ongoing fire use isn't going to accomplish anything.\n\nThis is like one of the the neolithic village tinkerers who did early stick-rubbing research protesting as the neighboring villages develop kilns."}, {"id": 50676272, "au": "fauigerzigerk", "dom": 49, "sr": 109, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 1, "age": 5.49, "grav": 37.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 16444, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.341, "fa": 0.28, "gp": 0.099, "bl": 0.0, "ds": 0.0, "txt": "This whole debate is very strange.\n\nPeople who actually believe in these outsize risks keep citing people who for tactical reasons pretend to believe in them as evidence for the existence of those risks.\n\nWhat is this? Lying about lying? A dishonest revenge for dishonesty? I don't think it's a good idea to have important debates in this way."}, {"id": 50676486, "au": "gambiting", "dom": 59, "sr": 110, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 5, "age": 4.7, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 14, "k": 32097, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.162, "fa": 0.42, "gp": 0.113, "bl": 0.0, "ds": 0.0, "txt": ">>And in retrospect the cold war was the most peaceful time by a large margin.\n\nJust because in the end no one decided to press the world ending button, doesn't negate the fact that we came terrifyingly close to it multiple times. Resting the lives of billions on the idea that brave men will keep saving us every time by refusing the press the button is....well, it's bound to fail at some point, no?"}, {"id": 50673664, "au": "c1ccccc1", "dom": 239, "sr": 111, "sc": 4.09, "ep": 4.09, "bs": 0.0, "d": 2, "age": 13.67, "grav": 141.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 1071, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.27, "fa": 0.28, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "Personally, I think it's admirable that he changed his mind based on new evidence. It seems to be something that few people are capable of doing. We see events like the Huggingface incident, or RH being solved, and most people don't even manage to stop and think, \"wait, that was kind of unusual, I didn't expect that\". And then even if they do, they figure out a way to rationalize it all so that it doesn't affect how they think about anything else. You have people still going around believing in things like \"only normal things that don't sound like science fiction ever happen\" or \"we'll get alignment by default\"."}, {"id": 50671692, "au": "WheelsAtLarge", "dom": 82, "sr": 112, "sc": 4.07, "ep": 4.07, "bs": 0.0, "d": 0, "age": 18.43, "grav": 228.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 5797, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.802, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "I get it but at this point it's more of a protest than a practical function. The book is all over the place and now that he took it off his site more people will want the book.\n\nI hope people hear his protest and think about why he is doing it. That is really why it matters."}, {"id": 50672109, "au": "nerevarthelame", "dom": 331, "sr": 113, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 3, "age": 17.61, "grav": 212.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1726, "kpp": 7.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.045, "fa": 0.34, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "Not really. It's an act of protest, accompanied with a 3,000 word essay, and a commitment to never work in that industry again (without significant reform, at least)"}, {"id": 50671594, "au": "Loquebantur", "dom": 339, "sr": 114, "sc": 4.0, "ep": 4.0, "bs": 0.0, "d": 3, "age": 18.64, "grav": 232.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.581, "fa": 0.0, "gp": 0.194, "bl": 0.0, "ds": 0.0, "txt": "Your approach of ignoring potential dangers backfires whenever there's a real one. Catastrophically on occasion, survivorship bias helps keeping your approach around.\n\nIn order to decide whether an arising fear is worth acting upon, you have to rationally judge the likeliness of its cause manifesting and the probability distribution of the consequences. Few people can actually do that reliably.\n\nInsurance companies employ a whole bunch of scientists to do that systematically and quantitatively. Even then the difficulty remains with explaining the results understandably. And the \"unknown unknowns\" can bite you anyway.\n\nInstead of relying on vague heuristics, we have to analyze the potential problems AI poses rationally and systematically. Silencing those who point out the problems is just foolish."}, {"id": 50675990, "au": "reasonableklout", "dom": 1, "sr": 115, "sc": 3.94, "ep": 3.94, "bs": 0.0, "d": 0, "age": 6.46, "grav": 46.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 151, "k": 2723, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.904, "fa": 0.0, "gp": 1.251, "bl": 0.0, "ds": 0.0, "txt": "Interesting quote from the essay about the insanity that the current reckless race is forcing on the whole world:\n\n> By their own account, the leaders of these companies set out to do something they believed had a sizable chance of causing catastrophe. With many dangerous activities, I am fine with somebody doing them for themselves. Wingsuit BASE jumping is dangerous, but I believe in people's freedom to choose that danger, even though they are risking not only their own life, but also hurt to the people who love them. That's a negotiated action, with many boundaries. Here we have the same kind of reckless endangerment, but their own estimates of killing every person in the world are far higher than the odds a BASE jumper takes on. And there is no consent from the rest of us. It's as though they're pushing every person in the world off the cliff. The situation is ludicrous.\n\n> In effect, the labs are claiming credit for some imaginary, unquantifiable reduction in risk, while washing their hands of responsibility."}, {"id": 50672368, "au": "deadbabe", "dom": 382, "sr": 116, "sc": 3.86, "ep": 3.86, "bs": 0.0, "d": 0, "age": 17.05, "grav": 201.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 1093, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.535, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I don't know why people always think AGI being \"decades away\" was somehow supposed to be safer for humanity. Feels like there's some sort of bias where the problems caused by AGI could just be kicked down the road for someone else to deal with, like climate change etc. AGI was going to be disruptive no matter what era it lands in.\n\nNow that it is nearly here or for all practical purposes already here, seems like people are very scared that all the scare quotes and fear mongering they reserved for future generations are now re-targeted right back to themselves. So now we get these pissy tirades and protests. This is what we wanted right? Heavy is the crown."}, {"id": 50675694, "au": "funcDropShadow", "dom": 56, "sr": 117, "sc": 3.83, "ep": 3.83, "bs": 0.0, "d": 4, "age": 7.54, "grav": 57.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 32, "k": 1291, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.786, "fa": 0.42, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "> This assumes the other parties have an interest in maintaining the status quo, for example.\n\n> If the other party is willing to have the world converted into a ruin, then why not launch?\n\nInterestingly, this has not happened during the cold war. Communist regimes developed nuclear bombs after USA had deployed them. Knowing that communism claims that it is necessary to destroy the existing institutions to proliferate itself, one would assume that they had all the reasons necessary to accept total destruction as a necessary evil. Yet, \"the Russians love their children, too\". And in retrospect the cold war was the most peaceful time by a large margin."}, {"id": 50671111, "au": "pona-a", "dom": 335, "sr": 118, "sc": 3.78, "ep": 3.78, "bs": 0.0, "d": 1, "age": 19.5, "grav": 250.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 1281, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.585, "fa": 0.0, "gp": 0.039, "bl": 0.0, "ds": 0.0, "txt": "I agree with you. I think the very writing and distribution of a textbook is in itself a protest to at least the more destructive AI use that doesn't believe in expertise altogether.\n\nYou are spreading knowledge that already certainly existed in its raw form, accessible only to the experts who can parse it - and, well, the models that scraped it - and bring it to the common people. AI, at least in its latest form, can read the actual papers for the most obscure areas of math, formalize them in LEAN, and instantly ingest them. A textbook is the only way a human can learn a complex subject themselves."}, {"id": 50675877, "au": "necovek", "dom": 140, "sr": 119, "sc": 3.77, "ep": 3.77, "bs": 0.0, "d": 2, "age": 6.85, "grav": 50.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 6434, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.605, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I certainly welcome people changing their minds, and wishing they have never published something they did, in fact, publish.\n\nBut removing it from circulation in any manner possible is akin to banning books out of one's wish. Even \"wrong\" ideas remain in old books, and we should be allowed to see how critical thinking has developed over time.\n\nYes, reasonable humans should take the book in with an author's protest in mind. Perhaps even include a new preface with author's points? Tune the text a bit to indicate where one should worry about applications?"}, {"id": 50677832, "au": "bemtevi", "dom": 209, "sr": 120, "sc": 3.73, "ep": 3.73, "bs": 0.0, "d": 2, "age": 1.53, "grav": 9.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 507, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.586, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "What hasn't gotten better? Strength of community: worse. Time it takes to get to a stable position in life: worse. Health: worse for many because of pollution (see tribes in Ecuador), deaths, depression. Stability of our biosphere: worse, which trumps everything else.\n\nSo in my view, technology has made things worse indeed."}, {"id": 50673250, "au": "random3", "dom": 214, "sr": 121, "sc": 3.71, "ep": 3.71, "bs": 0.0, "d": 2, "age": 14.89, "grav": 162.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1508, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.436, "fa": 0.0, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "I am applying it to my own conclusions about the future. Also I'm referring to my general experience (rather than this particular case) of trying to have a logical conversation about the future with almost everybody I talked to. I can count the exceptions on the fingers of one hand.\nI like Nielsen and not claiming any logical errors in his argument and I see his point. Yet the fact that he's only getting surprised now, is surprising."}, {"id": 50675527, "au": "vlz", "dom": 207, "sr": 122, "sc": 3.7, "ep": 3.7, "bs": 0.0, "d": 2, "age": 8.17, "grav": 65.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 146, "k": 561, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.724, "fa": 0.42, "gp": 0.552, "bl": 0.0, "ds": 0.0, "txt": "The idea is that we might not be fast enough to contain the negative aspects of new technologies (enabled by AI) to then enjoy the positive. From the article:\n\n> A historical example to help prime intuition is fire. It is easy to make and extremely difficult to defend against. We have a one-cent technology, the matchstick, which requires hundreds of billions of dollars each year to defend against, as well as a whole apparatus of social institutions, technology, infrastructure and law. AI systems will enable technologies which are far more destructive than matches.\n\n> While it is common to speculate about biothreats, I expect the worst threats will be technologies we haven't yet imagined. Nature is, after all, more imaginative than we.\n\n> […] imagine that all the technological problems that occurred in the 20th century had occurred in the year 1901: the atomic bomb, the hydrogen bomb, the ICBM, chemical weapons, biological weapons, the CFC-caused ozone hole, sulfuric acid rain, climate change, and many more […] imagine another such set of equally difficult problems arising in 1902, and then 1903, and then 1904, and so on."}, {"id": 50670873, "au": "logicchains", "dom": 264, "sr": 123, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 0, "age": 19.91, "grav": 259.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 23, "qw": 0, "k": 9949, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": ["https://www.deeplearningbook.org/"], "ig": 0.86, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "For a moment I was worried it was this gem https://www.deeplearningbook.org/ , but fortunately that's still up, and moreover a far more useful resource than the disappeared book."}, {"id": 50677241, "au": "alex_suzuki", "dom": 320, "sr": 124, "sc": 3.69, "ep": 3.69, "bs": 0.0, "d": 1, "age": 2.5, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 1910, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.514, "fa": 0.0, "gp": 0.087, "bl": 0.0, "ds": 0.0, "txt": "He doesn't claim that it will slow the labs down. He is well aware that the book is already in the training data and easily available elsewhere. He's only sending a message: \"I want no part in it\". And that's his choice.\n\nConsidering his accomplishments, his message has more weight than a random person on the street holding up a \"The end is nigh, repent!\" sign. It won't materially change anything, but maybe one or two folks who've read his book or heard his name will at least dare to think of the frontier labs in a different way - and that is worthing something IMHO."}, {"id": 50676806, "au": "jamesrcole", "dom": 16, "sr": 125, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 1, "age": 3.56, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 180, "qw": 0, "k": 2419, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.147, "fa": 0.0, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "This embodies an extremely naive view that nonetheless a lot of smart people hold: if person X believes Y could be very dangerous then they shouldn't do Y. It's completely naive, because X not doing Y will not make any difference if there are other people/groups who will do Y anyway. If there is no way to stop everyone from doing Y, then you're not adding additional danger to the world by working on it.\n\nAnd I've never seen any realistic way that you could stop everyone from doing such work on AI. There's too much to be potentially gained from doing so, and there's too many people who don't believe that there actually is great risk to it (and by the way, I'm not one of them)\n\nAND, if you work on it, you can try to make sure that it happens in the safest way possible. If you really think it is potentially dangerous, and there's no way to stop everyone from working on it, then the most responsible thing to do is probably to try to make it happen in the safest way possible."}, {"id": 50672434, "au": "bit-anarchist", "dom": 367, "sr": 126, "sc": 3.68, "ep": 3.68, "bs": 0.0, "d": 6, "age": 16.89, "grav": 198.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 63, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.92, "bl": 0.0, "ds": 0.0, "txt": "Made a stupid argument, got bodied. Specially since the profit-seeking and shareholder-primacy part doesn't absolve anyone of responsibility (quite the contrary, in fact). And that's not even getting into the philosophical meaning of \"profit\"."}, {"id": 50672690, "au": "Fricken", "dom": 345, "sr": 127, "sc": 3.65, "ep": 3.65, "bs": 0.0, "d": 5, "age": 16.15, "grav": 184.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 7865, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.208, "fa": 0.28, "gp": 0.006, "bl": 0.0, "ds": 0.0, "txt": "We will have sound empirical data about AI's ability to wipe out humanity after humanity has been wiped out. The wise man knows that will be the appropriate time to react. For now put the blindfold back on, there's no point in trying to see what's ahead, it's a waste of effort."}, {"id": 50677132, "au": "sinuhe69", "dom": 141, "sr": 128, "sc": 3.59, "ep": 3.59, "bs": 0.0, "d": 3, "age": 2.71, "grav": 16.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1764, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.186, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How is removing them according to the author's wish is akin to banning book? You enjoy the work of other people for free, and when they one day change their mind, you simply disregard it by calling it \"banning books\"? Sorry, I just don't get that kind of mentality."}, {"id": 50672547, "au": "bondarchuk", "dom": 343, "sr": 129, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 7, "age": 16.57, "grav": 192.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 4345, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.354, "fa": 0.0, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "It's just a more abstract argument than most people are used to. Less charitably it is abstract to the point that it's easy enough to simply pretend one doesn't get it. It only seems meaningless if you refuse to engage the argument on the level it's made at. Something like.. \"superintelligence would result in more mastery over nature/biology and some of that may have bad consequences, we won't have time to respond as a society if the development is too fast\". This is not a completely meaningless argument based only on a generalized fear of death."}, {"id": 50677117, "au": "jamesrcole", "dom": 20, "sr": 130, "sc": 3.35, "ep": 3.35, "bs": 0.0, "d": 3, "age": 2.74, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 23, "k": 2419, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.915, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> 'if there is no way to stop everyone' excludes the alternative possibility that a treaty or consensus is itself sufficient to stop other parties\n\nDo you not understand the meaning of \"no way to stop everyone\"?\n\nThat's what I said, and it obviously means I think there's no way that such a treaty or consensus could happen.\n\nI'm saying that I believe there is literally no way you could stop everyone.\n\nAnd I explained why: there's too much potential gain to be made by forging ahead (even more so if your opponents are holding back), and there's too many people who do not believe AI poses these existential risks (and like I said before, I am not one of them)."}, {"id": 50672246, "au": "ninjagoo", "dom": 387, "sr": 131, "sc": 3.3, "ep": 3.3, "bs": 0.0, "d": 0, "age": 17.32, "grav": 206.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 1350, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.313, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Read Dr. Nielsen's Neural Networks and Deep Learning book many years ago, and very much appreciated what he was doing for propagating AI knowledge.\n\nSadly, it pains me to say that there was nothing in his book that would warrant such an action as taking it down - and it does feel like shutting the barn door after the horse has run away; and to say nothing of all those other barns in the space.\n\nDid the brain-eater get him?"}, {"id": 50675583, "au": "croniev", "dom": 153, "sr": 132, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 2, "age": 7.94, "grav": 62.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 90, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.393, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is incredible how people continue to conflate information processing and statistics with understanding and sense-making, i.e. with sentience. The little ambiguous word \"intelligence\" does a lot of heavy lifting here.\n\nThis is by no means an attempt to talk down the dangers posed by advanced AI. But there is no need to talk about sentience when addressing them, as the author of the book does himself."}, {"id": 50672133, "au": "wpietri", "dom": 362, "sr": 133, "sc": 3.27, "ep": 3.27, "bs": 0.0, "d": 5, "age": 17.56, "grav": 211.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 59432, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.318, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "That's effectively a religious statement, not a factual one. Management has wide latitude to manage as they see best. And to whatever extent profit is legally required, it's only in the long term. Which will not be achieved if the company accidentally wipes out humanity. Or if it even causes big enough problems that they get destroyed with laws, regulations, or lawsuits. See, e.g., SBF, Ken Lay, Deepwater Horizon."}, {"id": 50677426, "au": "fn-mote", "dom": 44, "sr": 134, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 2, "age": 2.17, "grav": 13.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 5030, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.158, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Gross co-opting of an emotionally loaded term.\n\nEven if the analogy seems accurate (the colonization of the Americas, not the Industrial Revolution), please find another way to express this feeling.\n\nThe mid-appropriated term itself will lead people to reject the argument."}, {"id": 50672559, "au": "w4der", "dom": 218, "sr": 135, "sc": 3.16, "ep": 3.16, "bs": 0.0, "d": 3, "age": 16.55, "grav": 191.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 199, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.345, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I feel like most of the discussion surrounding the current AI boom ends up revolving around Russel's teapot, be it doomers sure that AGI will use human as cattle or denialists saying that the begging of an S curve looks just like an exponential."}, {"id": 50675167, "au": "intended", "dom": 55, "sr": 136, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 3, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 189, "qw": 0, "k": 7800, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.003, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "No. This always feels like an America-coded game theoretical approach.\n\nThis assumes the other parties have an interest in maintaining the status quo, for example.\n\nIf the other party is willing to have the world converted into a ruin, then why not launch?\n\nThis approach ends up gradually pushing the “game state” to solidify power in the hands of the most unhinged.\n\nThe counter play then requires all the normal players to band together, and then create leverage to keep the wildcards in check.\n\nThis recreates federations and alliances, which in turn reduce the utility of having your own offensive weapon.\n\n——-\n\nOnce the weapon exists, yes, then everyone is forced to have their own weapons programs. This is separate from it being good.\n\nHowever this is an inefficiency to the system, because resources have to be spent to keep the deterrent viable, prevent compromise, and prevent misuse.\n\nAll of which could have been better spent on building economic advantage or finding a common ground that prevents the need of the weapon being used in the first place.\n\nWe have achieved more peace through stability and trade, than the use of weapons."}, {"id": 50677544, "au": "derangedHorse", "dom": 43, "sr": 137, "sc": 3.15, "ep": 3.15, "bs": 0.0, "d": 2, "age": 1.99, "grav": 12.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1312, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.341, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Consent for acting on human agency is not a universal moral right for all actions, even when the consequences of taking such agency affects others. Perception of impact varies from person to person and what one person sees as having an inconsequential impact can be perceived as very consequential by someone else."}, {"id": 50672395, "au": "rerdavies", "dom": 97, "sr": 138, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 1, "age": 16.99, "grav": 200.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 1099, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.499, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It was written in 2015. I can't help wondering how relevant it really is today, given that \"Attention is All You Need\" was written in 2017."}, {"id": 50677103, "au": "skew-aberration", "dom": 17, "sr": 139, "sc": 3.11, "ep": 3.11, "bs": 0.0, "d": 2, "age": 2.78, "grav": 16.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 616, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 0.532, "bl": 0.0, "ds": 0.0, "txt": "Your reasoning is actually circular since 'if there is no way to stop everyone' excludes the alternative possibility that a treaty or consensus is itself sufficient to stop other parties, which is the case you are arguing against."}, {"id": 50671445, "au": "georgemcbay", "dom": 374, "sr": 140, "sc": 3.1, "ep": 3.1, "bs": 0.0, "d": 1, "age": 18.94, "grav": 238.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 8, "k": 16622, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.809, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> how does taking his book down change anything?\n\nIt was almost certainly an intentional attention generation device to get people reading and talking about his essay on the speed-of-scaling dangers of AI.\n\nAnd definitionally it worked, because here we are."}, {"id": 50675165, "au": "AIShill101", "dom": 230, "sr": 141, "sc": 3.06, "ep": 5.58, "bs": 2.52, "d": 4, "age": 9.51, "grav": 81.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 5, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.871, "fa": 0.0, "gp": 0.813, "bl": 0.95, "ds": 0.0, "txt": "Ye I agree with your statement. There's a lot of people who've started believing art or human connection or \"feelings\" are what makes humans different.\n\nNot realising every animal feels those, every animal feels some sort of \"love\" since they breed. Some sort of \"companionship\" since they might be in herds.\n\nThe only distinguishing feature of humans are our curiosity and relentless pursuit of progress.\n\nLike there's a reason we named our rovers - curiousity and perseverance lol. People forget so soon."}, {"id": 50677887, "au": "cowlevel", "dom": 46, "sr": 142, "sc": 3.04, "ep": 3.04, "bs": 0.0, "d": 3, "age": 1.45, "grav": 9.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.293, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I might've thought this until I noticed the same people who were on Epstein island and who keep getting caught up in adult sexual assault allegations are the people who put \"do you want to hurt yourself? [Yes] [Ask again later]\" all over my computing devices. They literally do not understand consent on any level."}, {"id": 50672822, "au": "spolitry", "dom": 389, "sr": 143, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 0, "age": 15.84, "grav": 178.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 37, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.203, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "If you think LLM AI is dangerous, the only thing that can defend against it is a better LLM AI or an EMP/bomb that can destroy LLM AI.\n\nClosing your eyes and brain won't make it go away.\n\nMaking an AI won't hurt you. Everyone else making an AI will hurt you. And they don't need this book."}, {"id": 50673622, "au": "yubblegum", "dom": 94, "sr": 144, "sc": 3.02, "ep": 3.02, "bs": 0.0, "d": 3, "age": 13.81, "grav": 143.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1106, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.016, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This is understood. What appears to not be understood in some quarters is that we should not wait for Chicago to burn down in a fire before putting in place what has been keeping fire mostly contained."}, {"id": 50675805, "au": "funcDropShadow", "dom": 88, "sr": 145, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 4, "age": 7.12, "grav": 53.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 1291, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fire wasn't a one time invention as well. It provided warmth at night and in winter as well as in caves. It can be used to frighten animals while hunting or defending your family. It improved the nutritional value of food and reduced potential dangers from food. It enabled the use of metal, the development of glass, the reading of books at night. And it still is a prerequisite for SpaceX's Starships being caught after returning from space."}, {"id": 50675007, "au": "janalsncm", "dom": 78, "sr": 146, "sc": 3.01, "ep": 3.01, "bs": 0.0, "d": 3, "age": 10.18, "grav": 90.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 13078, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.28, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As someone who considers myself very knowledgeable about neural networks but pretty useless in terms of AI policy, I think we should admit that while there is some overlap in skills and useful information, they’re optimizing different things. Expertise in one does not make one an expert in the other.\n\nSometimes I wish top AI labs had the same humility."}, {"id": 50672780, "au": "K0balt", "dom": 169, "sr": 147, "sc": 2.99, "ep": 3.78, "bs": 0.8, "d": 2, "age": 15.94, "grav": 180.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.61, "fa": 0.0, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "Insofar as AI is more capable at a task (that requires intelligence) than a human, it is superintelligent. (More intelligent) if we start counting speed it gets silly, but even just considering the breadth and depth of thought as compared to human capabilities.\n\nI do understand that many humans think that ASI must present superintelligence in every category and specialty, but that seems like a very unfair comparison to how we use the word intelligence in other contexts."}, {"id": 50670959, "au": "trashcan_man", "dom": 403, "sr": 148, "sc": 2.98, "ep": 2.98, "bs": 0.0, "d": 2, "age": 19.75, "grav": 255.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 10, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.27, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think there's probably a gradient somewhere in there. Citations and, where applicable, royalties being the big ones. It's fine to cite somebody else's work, but it's expulsion material if you consistenty paraphrase without attribution.\n\nIt's criminal if you deliberately pirate things to sell them later. I personally struggle to draw the line between HiAnime and OpenAI. If we're going to have the DMCA, the worst thing we can do is enforce it unfairly or asymmetrically."}, {"id": 50671289, "au": "tourmalinetaco", "dom": 117, "sr": 149, "sc": 2.96, "ep": 3.22, "bs": 0.27, "d": 5, "age": 19.24, "grav": 244.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 56, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.242, "fa": 0.0, "gp": 0.208, "bl": 0.1, "ds": 0.0, "txt": "And what would be “constructively” engaging then? He took down his book. I believe that while it’s his right that once information is unleashed it cannot be removed, and that information people wish to hide tends to be more valuable, not less. Thus, obtaining his book is a constructive refutation of his chosen action, as is distributing it."}, {"id": 50673049, "au": "avazhi", "dom": 174, "sr": 150, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 1, "age": 15.3, "grav": 169.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 810, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 0.397, "bl": 0.0, "ds": 0.0, "txt": "AI so far is very good at mathematics and coding, which is really just math, and really fucking awful at everything else. So no, we haven’t achieved AGI or ASI or whatever you’re even trying to argue here, or anything close to it."}, {"id": 50672806, "au": "aeve890", "dom": 235, "sr": 151, "sc": 2.95, "ep": 2.95, "bs": 0.0, "d": 4, "age": 15.88, "grav": 179.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 28, "k": 468, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.746, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> The quest for knowledge, technological progress, and creation is what is most admirable about being human.\n\nDo you live under a rock or are you blind to the damage technology can do? Not all progress is admirable.\n\n>Actively working against that makes you despicable and an enemy of humanity.\n\nWhat does putting technology before humanity itself makes you?"}, {"id": 50677312, "au": "fn-mote", "dom": 35, "sr": 152, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 5, "age": 2.34, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 5030, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.25, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your first paragraph is not productive. It will prevent others from reading the rest with an open mind.\n\nThe strongest points I see on this subject are: (1) dilution of blame leads us to bad action and (2) the US government has demonstrated it is unwilling to take action against powerful (wealthy) interest groups.\n\nThis argument leaves me wondering what should be done. The blog article is much clearer in this regard."}, {"id": 50672320, "au": "whatshisface", "dom": 80, "sr": 153, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 2, "age": 17.16, "grav": 203.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 31550, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Most of the work done at national labs relating to nuclear weapons concerns their effects, which are both what you need to avoid them as a civilian, and what you would use to locate strikes to make them unavoidable as a state. The principles (production of isotopes, basic physics of the blast wave, dust mixture) of use are the basics of preparedness, and knowledge of their consequences is the foundation of the international consensus against using them, ever."}, {"id": 50673372, "au": "goodmythical", "dom": 77, "sr": 154, "sc": 2.87, "ep": 2.87, "bs": 0.0, "d": 2, "age": 14.52, "grav": 155.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 773, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.094, "bl": 0.0, "ds": 0.0, "txt": "Knowing why, when, and how to use a geiger counter would indeed help a person prepare to live in/near both directly irradiated areas and down wind/river of irradiated areas."}, {"id": 50672389, "au": "dist-epoch", "dom": 64, "sr": 155, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 2, "age": 17.0, "grav": 200.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 3079, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This knowledge in particular is well dispersed so taking it offline might have some political/signaling effect, but zero effect regarding the knowledge in itself. Like trying to hide the idea that you can split the uranium atom."}, {"id": 50672382, "au": "swed420", "dom": 372, "sr": 156, "sc": 2.81, "ep": 2.81, "bs": 0.0, "d": 6, "age": 17.02, "grav": 200.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 60, "qw": 0, "k": 728, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": ["https://en.wikipedia.org/wiki/Capitalist_Realism"], "ig": 0.446, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "True, but I think the parent's point is that Google was founded on \"Don't Be Evil\" and then we were surprised when they were evil, and same for every corp before and after them.\n\nIt seems the author has succumbed to \"capitalist realism,\" like most people, so in that light we shouldn't be surprised he behaved the way that he did.\n\nhttps://en.wikipedia.org/wiki/Capitalist_Realism"}, {"id": 50675426, "au": "abletonlive", "dom": 319, "sr": 157, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 0, "age": 8.53, "grav": 69.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 241, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "L
