abs & Frontier (Nuclear)", "urls": [], "ig": 0.616, "fa": 0.0, "gp": 0.934, "bl": 0.0, "ds": 0.0, "txt": "How does taking the book down slow down the frontier labs exactly? If anything it just gives them a monopoly"}, {"id": 50671541, "au": "nvarsj", "dom": 393, "sr": 158, "sc": 2.79, "ep": 2.79, "bs": 0.0, "d": 1, "age": 18.75, "grav": 234.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 5889, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.187, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It’s what peak capitalism looks like. Which is the actual threat to society at the current rate. AI dooming is yet another distraction. Sorry to get political on HN…"}, {"id": 50672720, "au": "Upvoter33", "dom": 150, "sr": 159, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 1, "age": 16.09, "grav": 183.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1991, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.729, "fa": 0.0, "gp": 0.739, "bl": 0.0, "ds": 0.0, "txt": "Ai is accelerating at math and code. It’s also good digging through a lot of info. To me that’s very far from what I think of as ASI. It’s amazing but I think people overreact to these impressive milestones."}, {"id": 50675660, "au": "funcDropShadow", "dom": 63, "sr": 160, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 2, "age": 7.64, "grav": 59.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1291, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.184, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Doesn't that assume that the knowledge is only used to attack or defend? What about understanding? What if such knowledge is necessary for people to make informed decision on who to trust with policing AI? What if that knowledge is needed to take the threats serious? Knowledge about LLM might be necessary to gain internal explanations of how the world is going to change."}, {"id": 50672607, "au": "glerk", "dom": 229, "sr": 161, "sc": 2.76, "ep": 2.76, "bs": 0.0, "d": 3, "age": 16.42, "grav": 189.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1222, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.841, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "The quest for knowledge, technological progress, and creation is what is most admirable about being human.\n\nActively working against that makes you despicable and an enemy of humanity."}, {"id": 50676688, "au": "boorang", "dom": 95, "sr": 162, "sc": 2.75, "ep": 2.75, "bs": 0.0, "d": 1, "age": 3.9, "grav": 24.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 58, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.162, "fa": 0.0, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "I imagine if I was a young PhD who looked up to Nielsen's work in my undergraduate years the call to stop working for the frontier labs would at least make me pause a beat and consider..."}, {"id": 50672384, "au": "nradov", "dom": 347, "sr": 163, "sc": 2.73, "ep": 2.73, "bs": 0.0, "d": 4, "age": 17.01, "grav": 200.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 44337, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.161, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Anthropogenic global climate change is a real phenomenon and a serious problem. But even in a realistic worst case scenario, it's not existential. Many humans will survive."}, {"id": 50672798, "au": "kbelder", "dom": 283, "sr": 164, "sc": 2.73, "ep": 2.73, "bs": 0.0, "d": 2, "age": 15.9, "grav": 179.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 3218, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Why wouldn't it be an inherent good?  Knowledge does not remove any power (in the sense of agency and achieving one's values).  Worst case it's neutral, but generally grants more.\n\nKnowledge is acquiring facts about reality.  One's happiness, success, and prosperity are all improved by aligning with reality."}, {"id": 50671074, "au": "schleck8", "dom": 399, "sr": 165, "sc": 2.72, "ep": 2.72, "bs": 0.0, "d": 1, "age": 19.56, "grav": 251.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3635, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.817, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "According to doomers, the global economy has collapsed multiple times by now so their money is already worthless if you believe hard enough."}, {"id": 50671123, "au": "abecedarius", "dom": 266, "sr": 166, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 2, "age": 19.48, "grav": 249.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 8959, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.14, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, Nielsen's was my favorite intro. The Goodfellow et al didn't look as inviting, though it's more recent and covers more.\n\n(I also think he's right about the folly of racing ahead with these technologies.)"}, {"id": 50675937, "au": "auggierose", "dom": 245, "sr": 167, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 0, "age": 6.64, "grav": 48.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 5600, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.636, "fa": 0.0, "gp": 0.783, "bl": 0.0, "ds": 0.0, "txt": "A lot of people don't have the time for progress to slow down. If you are happy and comfy in your life now, sure, you wouldn't want anything to change. That is not most of us."}, {"id": 50671814, "au": "layer8", "dom": 356, "sr": 168, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 3, "age": 18.23, "grav": 224.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 43693, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "Corporations are led by people who have agency over that behavior, who can choose to have the corporation behave ethically and responsibly. While I’m not surprised that they often do not, that’s a consequence of current cultural norms and legislation. Society as a whole could place different expectations on corporations, and shift the regulative environment accordingly."}, {"id": 50677595, "au": "derangedHorse", "dom": 96, "sr": 169, "sc": 2.62, "ep": 2.62, "bs": 0.0, "d": 2, "age": 1.9, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1312, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.115, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't think reading his book and having looked up to him will make a difference in any frontier researcher's perspective. They've probably already thought about the concerns he's brought up and this mostly seems like Nielsen rallying his other more casual followers towards his cause."}, {"id": 50672560, "au": "drivebyhooting", "dom": 321, "sr": 170, "sc": 2.6, "ep": 3.8, "bs": 1.19, "d": 0, "age": 16.55, "grav": 191.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 1150, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 1.15, "bl": 0.45, "ds": 0.0, "txt": "Sorry, personally I don’t care about P(doom). The existing capitalist structure has already sealed my fate unless I can somehow join the lucky acolytes in AI labs."}, {"id": 50670996, "au": "NewJazz", "dom": 325, "sr": 171, "sc": 2.59, "ep": 2.59, "bs": 0.0, "d": 1, "age": 19.68, "grav": 254.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 9212, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.102, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The author knows that the book is archived. They likely are making a point by taking the original copy down, not genuinely trying to restrict access to information."}, {"id": 50676048, "au": "incompressible", "dom": 246, "sr": 172, "sc": 2.54, "ep": 2.54, "bs": 0.0, "d": 1, "age": 6.28, "grav": 44.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 15, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Care to elaborate? I might be too \"comfy\" with my life, as you put it, but I fail to see a situation where I would prefer humans, and my loved ones, to be extinct just to _very unlikely_ improve my own life situation."}, {"id": 50672101, "au": "afterburner", "dom": 365, "sr": 173, "sc": 2.52, "ep": 2.52, "bs": 0.0, "d": 5, "age": 17.63, "grav": 212.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 4929, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.851, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "You're getting downvoted, sounds like people here are SUPER pro corporate.\n\nGuys, you don't need to defend corporations. They are, unfortunately, very very rich and quite powerful already."}, {"id": 50671696, "au": "katbyte", "dom": 346, "sr": 174, "sc": 2.45, "ep": 2.45, "bs": 0.0, "d": 3, "age": 18.42, "grav": 228.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 3468, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.044, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Not to mention there is a real one (climate change) that is an existential threat where we know how to solve or at least slow it… and some countries companies and people are just hitting the gas even harder speed running it."}, {"id": 50671683, "au": "exizt88", "dom": 353, "sr": 175, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 2, "age": 18.45, "grav": 228.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 49, "k": 2324, "kpp": 12.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.515, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> A historical example to help prime intuition is fire. It is easy to make and extremely difficult to defend against. We have a one-cent technology, the matchstick, which requires hundreds of billions of dollars each year to defend against, as well as a whole apparatus of social institutions, technology, infrastructure and law.\n\nAs with most doomerist analogies, this one is trivial to prove false. How come Hadza, where every single member of the tribe can produce fire, have none of those?"}, {"id": 50677462, "au": "probably_wrong", "dom": 104, "sr": 176, "sc": 2.39, "ep": 2.39, "bs": 0.0, "d": 3, "age": 2.13, "grav": 12.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 10770, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.019, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sidenote: opening that link led to a captcha (of course) that wanted me to download an app for verification.\n\nLooks like my days of accessing websites may be coming to an end."}, {"id": 50673402, "au": "SideQuark", "dom": 76, "sr": 177, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 2, "age": 14.41, "grav": 154.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 3109, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.941, "fa": 0.0, "gp": 0.111, "bl": 0.0, "ds": 0.0, "txt": "Being ignorant of how they are made helps even less, and leads to even more ignorance as people are free to spread technobabble nonsense, manipulating the ignorant without even needing nuclear weapons. At least with understanding one has better defense against both problems."}, {"id": 50673276, "au": "b0rtb0rt", "dom": 232, "sr": 178, "sc": 2.37, "ep": 2.37, "bs": 0.0, "d": 4, "age": 14.81, "grav": 160.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 70, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.785, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "let’s say you make the scientific contribution that finally results in AI learning something that causes it to kill everyone, was that good for humanity?"}, {"id": 50672449, "au": "bemtevi", "dom": 256, "sr": 179, "sc": 2.36, "ep": 2.36, "bs": 0.0, "d": 1, "age": 16.84, "grav": 197.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 507, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.006, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But in this case, a positive. The book was already available, and I'm sure the author knew it wouldn't cause it to be less available. But now, he's not providing it and that means something and sends a message, which strengthens the awareness of the dangers of AI."}, {"id": 50678031, "au": "K0balt", "dom": 157, "sr": 180, "sc": 2.34, "ep": 3.13, "bs": 0.8, "d": 3, "age": 1.25, "grav": 8.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.0, "bl": 0.3, "ds": 0.0, "txt": "Tbf there is a version of the future where automation does everything unpleasant and humans work on the things that interest us, unencumbered by scarcity and need, but that also requires a change in the way we do education, because right now we have a tendency to graduate incurious brutes by inoculation against intellectual exploration."}, {"id": 50674501, "au": "sinuhe69", "dom": 139, "sr": 181, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 1, "age": 11.71, "grav": 111.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1764, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.995, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I would respect the wishes of the author, especially after he explained why he took the step to remove the books.\nRather than posting here, I would send the message to the author so Nielsen can take them down as well."}, {"id": 50673038, "au": "eddiewithzato", "dom": 177, "sr": 182, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 1, "age": 15.32, "grav": 169.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 5, "k": 238, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.411, "fa": 0.42, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "> we have definitely achieved ASI\n\nyet it still can't drive a car as well as a teenager, nor have we cured cancer. You need to understand what Artificial Super Intelligence means. Hint, it's in the \"super\"."}, {"id": 50672894, "au": "ks2048", "dom": 172, "sr": 183, "sc": 2.21, "ep": 2.21, "bs": 0.0, "d": 2, "age": 15.65, "grav": 175.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 5125, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.941, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Since \"ASI\" and \"AGI\" etc. aren't clearly defined - people can keep arguing forever about things that don't matter (what you call it)."}, {"id": 50676462, "au": "joshuat", "dom": 12, "sr": 184, "sc": 2.2, "ep": 4.19, "bs": 1.99, "d": 2, "age": 4.77, "grav": 31.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 831, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.nationalgeographic.com/adventure/article/why-are-so-many-base-jumpers-dying"], "ig": 0.892, "fa": 0.62, "gp": 0.225, "bl": 0.75, "ds": 0.0, "txt": "Also, while searching for that stat, I found this article with a headline that made me chuckle:\n\n\"Why Are So Many BASE Jumpers Dying?\": https://www.nationalgeographic.com/adventure/article/why-are...\n\nGee, idk, maybe the whole \"jumping off a mountain\" thing?"}, {"id": 50671874, "au": "numeri", "dom": 286, "sr": 185, "sc": 2.18, "ep": 2.18, "bs": 0.0, "d": 1, "age": 18.13, "grav": 222.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1037, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.929, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Something being ineffectual doesn't mean it's not the morally right thing to do.\n\nIt's yet another one of those things where if we all (those of us working in AI) took action on a similar scale, it would slow or stop progress overnight."}, {"id": 50676096, "au": "hobo123", "dom": 307, "sr": 186, "sc": 2.17, "ep": 2.17, "bs": 0.0, "d": 1, "age": 6.1, "grav": 43.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 379, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.923, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think it's mostly Streisand effect for max attention to get his thoughts on safety into people's awareness and discussion. In that sense it's a good thing.\n\nAlso, it put something new on my reading list."}, {"id": 50671825, "au": "tourmalinetaco", "dom": 125, "sr": 187, "sc": 2.12, "ep": 2.38, "bs": 0.27, "d": 5, "age": 18.21, "grav": 223.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "And how are they “lethal”? Is there a mass genocide they are performing as of this moment? As a reminder, Nielsen is equally responsible for this by virtue of being an early adopter of this “dangerous” technology."}, {"id": 50677588, "au": "literalAardvark", "dom": 74, "sr": 188, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 3, "age": 1.91, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 882, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.889, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know anything about this person, but I need to believe anyone capable of writing an IT book that people care about understands that the Internet is forever and is counting on the Streisand effect.\n\nIt's the only explanation that doesn't end with \"what a muppet\"."}, {"id": 50675705, "au": "funcDropShadow", "dom": 79, "sr": 189, "sc": 2.09, "ep": 2.09, "bs": 0.0, "d": 4, "age": 7.49, "grav": 57.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 1291, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.888, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Said differently: Knowledge about neural networks is not a sufficient condition to develop good AI policies, but it might still be a necessary condition."}, {"id": 50671729, "au": "tourmalinetaco", "dom": 134, "sr": 190, "sc": 2.05, "ep": 2.9, "bs": 0.85, "d": 8, "age": 18.36, "grav": 227.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.234, "fa": 0.0, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "“Lethal work”, sure. Climate activists said New York would be underwater a decade ago. This just seems like more of the same. He can’t even formulate a genuine logical progression, instead creating moral condemnation of workers (which should logically include him but unsurprisingly he is excluded by himself) and talking about how eventually, somehow, maybe some new form of technology will come from this that will wipe us out.\n\nIf someone was “persuaded” by that writing, you were likely already of that belief and just needed some authority figure to cling to."}, {"id": 50675874, "au": "alienbaby", "dom": 145, "sr": 191, "sc": 2.04, "ep": 3.23, "bs": 1.19, "d": 0, "age": 6.88, "grav": 50.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 429, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.88, "fa": 0.0, "gp": 0.803, "bl": 0.45, "ds": 0.0, "txt": "Stable doors and bolting horses, but I do understand his concerns. It's just a bit late now.\n\nAs a publicity stunt to get his argument seen, fair enough. It's worth reading."}, {"id": 50671335, "au": "kenferry", "dom": 268, "sr": 192, "sc": 1.95, "ep": 1.95, "bs": 0.0, "d": 1, "age": 19.17, "grav": 243.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2135, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.831, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why would he? His analogy is that a single untrusted person with a match can start a fire. From that perspective a local LLM is if ": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I agree with his criticisms, and he's allowed to take down his site to boost that statement.\n\nBut I also care about preserving human knowledge, even if someone decides science books should be taken down because of the danger of nuclear weapons"}, {"id": 50675187, "au": "tourmalinetaco", "dom": 91, "sr": 197, "sc": 1.88, "ep": 2.15, "bs": 0.27, "d": 6, "age": 9.43, "grav": 80.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.914, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "Both require very specialized equipment and technology, and the latter doesn’t even appear to be technically feasible in the ways we would want it.\n\nMeanwhile, AI hardware is A) already in the hands of most serious nations and B) impossible to stop once the hardware is in hand."}, {"id": 50672419, "au": "kreyenborgi", "dom": 105, "sr": 198, "sc": 1.82, "ep": 1.82, "bs": 0.0, "d": 1, "age": 16.94, "grav": 199.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 925, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.776, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "more people will find time to read one blog post for the layperson than a whole book for people with a mathy background."}, {"id": 50675162, "au": "tourmalinetaco", "dom": 66, "sr": 199, "sc": 1.8, "ep": 2.06, "bs": 0.27, "d": 4, "age": 9.54, "grav": 81.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.877, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "And how do you propose we talk to Israel, Russia, China, etc into being on the same page, particularly without doing it behind everyone else’s backs? Don’t hand wave it like Nielsen did."}, {"id": 50673009, "au": "cwillu", "dom": 270, "sr": 200, "sc": 1.68, "ep": 1.68, "bs": 0.0, "d": 1, "age": 15.4, "grav": 171.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 8298, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.715, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Were you under the impression that Mr Nielsen thought that taking the book down would somehow prevent people from accessing it?"}, {"id": 50672455, "au": "bemtevi", "dom": 284, "sr": 201, "sc": 1.63, "ep": 1.63, "bs": 0.0, "d": 2, "age": 16.82, "grav": 197.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 507, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 0.693, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How can it not be a bad thing in some cases if it means instinctually we will both use it and cause harm? A meteor hitting us isn't evil either but it's certainly a bad thing. And knowledge too can be like that, as we're learning now."}, {"id": 50677805, "au": "derangedHorse", "dom": 381, "sr": 202, "sc": 1.56, "ep": 1.56, "bs": 0.0, "d": 1, "age": 1.56, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1312, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 0.664, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "And what of Yann LeCun, Demis Hassabis, Andrew Ng, Noam Shazeer, etc.? Throwing around names as a way to legitimize arguments can be done both ways. Perhaps we should just focus on the merits of the arguments themselves."}, {"id": 50677351, "au": "derangedHorse", "dom": 18, "sr": 203, "sc": 1.56, "ep": 1.56, "bs": 0.0, "d": 3, "age": 2.28, "grav": 13.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1312, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.577, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "It's not circular because he's not debating that 'there is no way to stop everyone'. He's debating why it's not hypocritical for one to work on technology they think is dangerous under the (potentially incorrect) assumption that 'there is no way to stop everyone'."}, {"id": 50678453, "au": "hedora", "dom": 9, "sr": 204, "sc": 1.55, "ep": 1.55, "bs": 0.0, "d": 4, "age": 0.48, "grav": 5.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 26331, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.658, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The most dangerous corner of the AI industry are the ethicists and the “alignment” efforts.\n\nAlignment with whom?"}, {"id": 50671752, "au": "bob1029", "dom": 200, "sr": 205, "sc": 1.5, "ep": 1.5, "bs": 0.0, "d": 1, "age": 18.31, "grav": 225.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 24855, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 0.638, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I've been thinking about using some kind of specially designed proxy server to browse the web. One that permanently caches all resources. If the origin 404s something we check the cache for a replacement instead of forwarding the 404 to the client."}, {"id": 50677000, "au": "threethirtytwo", "dom": 23, "sr": 206, "sc": 1.5, "ep": 1.5, "bs": 0.0, "d": 2, "age": 3.06, "grav": 18.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 338, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.531, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "It’s called the tragedy of the commons. Read it. It’s a famous article by Garret Hardin talking about how the exact same rationality you’re talking about leads to destruction.\n\nI realized this thing is responsible for most of the problems in our world ranging from environment to many other things."}, {"id": 50672265, "au": "ltbarcly3", "dom": 379, "sr": 207, "sc": 1.49, "ep": 3.48, "bs": 1.99, "d": 0, "age": 17.28, "grav": 205.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 0, "k": 4254, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": ["https://archive.org/details/warc_neuralnetworksanddeeplearning_com_20180813"], "ig": 0.619, "fa": 0.62, "gp": 0.177, "bl": 0.75, "ds": 0.0, "txt": "This is a great way to get notoriety and publicity for an extremely out of date and no longer useful in any way book that nobody ever heard of.\n\nhttps://archive.org/details/warc_neuralnetworksanddeeplearni..."}, {"id": 50672268, "au": "mxmlnkn", "dom": 201, "sr": 208, "sc": 1.46, "ep": 1.46, "bs": 0.0, "d": 2, "age": 17.28, "grav": 205.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 14, "qw": 0, "k": 454, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://github.com/ArchiveBox/archivebox-proxy", "https://github.com/archivebox/archivebox"], "ig": 0.563, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "https://github.com/ArchiveBox/archivebox-proxy seems to implement some form of that idea, and of course, the main project: https://github.com/archivebox/archivebox"}, {"id": 50674182, "au": "6177c40f", "dom": 231, "sr": 209, "sc": 1.42, "ep": 1.42, "bs": 0.0, "d": 4, "age": 12.39, "grav": 121.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 817, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.56, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "Until humanity- through technological progress- creates its own worst enemy. Is that really what you want?"}, {"id": 50677237, "au": "jamesrcole", "dom": 28, "sr": 210, "sc": 1.41, "ep": 3.11, "bs": 1.7, "d": 7, "age": 2.51, "grav": 15.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 2419, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.322, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "I was originally responding to a claim that made a common assumption, that if X could have terrible consequences then the person should do X. It's an unquestioned assumption, that ignores that if one party stops doing X and that won't stop others from doing it. And that if nothing is going to or can stop others, then X stopping it is just performative.\n\nFirst and foremost I'm pointing out that what's wrong with that assumption. The people saying such stuff don't demonstrate that doing such would stop the danger from happening.\n\nThere's no way to literally prove that stopping everyone is impossible, but I explicitly stated the reasons why I believe it is so."}, {"id": 50672564, "au": "ibobev", "dom": 310, "sr": 211, "sc": 1.4, "ep": 2.59, "bs": 1.19, "d": 0, "age": 16.54, "grav": 191.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 37676, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 0.394, "fa": 0.0, "gp": 1.15, "bl": 0.45, "ds": 0.0, "txt": "Has he become a Luddite? If so, he is very polite. He’s left the loom intact and taken back the instruction manual."}, {"id": 50677454, "au": "hobom", "dom": 21, "sr": 212, "sc": 1.4, "ep": 1.4, "bs": 0.0, "d": 2, "age": 2.14, "grav": 12.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 205, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.531, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Too black and white. Each separate effort at doing Y increases the chances of a catastrophe in this case. It's like saying that dumping toxic waste into a river is okay, because other people are already dumping toxic waste into other rivers."}, {"id": 50674835, "au": "timzaman", "dom": 263, "sr": 213, "sc": 1.38, "ep": 2.57, "bs": 1.19, "d": 0, "age": 10.71, "grav": 97.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 226, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 0.425, "fa": 0.0, "gp": 1.084, "bl": 0.45, "ds": 0.0, "txt": "Book wasn't very good, and redundant with many others at the time that were more popular eg the one by Goodfellow."}, {"id": 50670961, "au": "geraltofrivia", "dom": 224, "sr": 214, "sc": 1.37, "ep": 2.56, "bs": 1.19, "d": 0, "age": 19.75, "grav": 255.4, "surf     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
