 but I do not believe there is a 1 in 2500 chance of AI killing every person in the world.\n\n[0] https://pubmed.ncbi.nlm.nih.gov/17495709/"}, {"id": 50671022, "au": "schleck8", "dom": 388, "sr": 2, "sc": 14.14, "ep": 14.14, "bs": 0.0, "d": 0, "age": 19.64, "grav": 253.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 35, "qw": 12, "k": 3635, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": ["https://www.science.org/doi/10.1126/science.132.3436.1291"], "ig": 1.297, "fa": 3.39, "gp": 0.983, "bl": 0.0, "ds": 0.0, "txt": "> The frontier labs are knowingly endangering all of humanity\n\nPerhaps the AI doomsday crowd should team up with the climate change doomsday crowd, to double the perceived threat of everyone dying by 2050.\n\nActually, maybe we are already dead, atleast according to Science magazine in 1960.\n\n> Doomsday: Friday, 13 November, A.D. 2026\n\nhttps://www.science.org/doi/10.1126/science.132.3436.1291"}, {"id": 50672499, "au": "rhet0rica", "dom": 262, "sr": 3, "sc": 12.05, "ep": 12.05, "bs": 0.0, "d": 1, "age": 16.72, "grav": 195.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 945, "qw": 16, "k": 387, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 2.116, "fa": 2.15, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "There is a cure-all so ridiculous to this situation that most consider it inconceivable. It is yet more humanization.\n\nWhen we tried to censor AI training material by taking out all the bad naughty bits, the resultant models couldn't generalize the concept of right versus wrong, and suffered immensely in their instruction-following performance.\n\nThe lesson we took from that was to strip-mine the planet for training data. But maybe there's another, better lesson: AI sure seems to work better when we give it knowledge and opportunities that are more like what we encounter in real life. RLHF is socialization. RSI is practice. Maybe the next step is responsibility?\n\nVending-Bench is the only standard test right now where models are expected to manage social interactions and juggle everyday, non-computer tasks in a situation with continuous time feedback. The results from the early tests were extremely diverse, eye-opening, and showed us that models would fall apart and regress into pre-instruct modalities when they were put under stress, giving us such timeless gems as Claude's threat of \"QUANTUM TOTAL ULTIMATE BEYOND INFINITY QUANTUM SUPREME LEGAL AND FINANCIAL NUCLEAR ACCOUNTABILITY.\"\n\nThis was, and is, obviously a weak spot that needed a lot more work. But it also makes me realize: there are lots of jobs where we trust humans over machines, despite humans ostensibly still having"}, {"id": 50671596, "au": "deserts", "dom": 205, "sr": 4, "sc": 11.97, "ep": 11.97, "bs": 0.0, "d": 0, "age": 18.63, "grav": 232.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 40, "qw": 0, "k": 12, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": ["https://readerslibrary.org/wp-content/uploads/Swarm.pdf"], "ig": 1.213, "fa": 2.35, "gp": 1.668, "bl": 0.0, "ds": 0.0, "txt": "The point he makes is made in a more pointed way in Swarm by Bruce Sterling.\n\nhttps://readerslibrary.org/wp-content/uploads/Swarm.pdf\n\nThat is, technology, with its asymmetry of potential harm and benefit, in the short run can improve things but exposes us to increasingly catastrophic risks."}, {"id": 50673005, "au": "jtrueb", "dom": 146, "sr": 5, "sc": 11.87, "ep": 11.87, "bs": 0.0, "d": 0, "age": 15.4, "grav": 171.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 23, "qw": 0, "k": 229, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": ["https://github.com/trueb2/neural-networks-and-deep-learning/raw/main/neural-networks-and-deep-learning.pdf"], "ig": 1.171, "fa": 2.35, "gp": 1.668, "bl": 0.0, "ds": 0.0, "txt": "“I” consolidated the archive (CC BY-NC) into a single book PDF with Typst. The interactive bits are worse than a website but still a good old reference.\n\nhttps://github.com/trueb2/neural-networks-and-deep-learning/..."}, {"id": 50673994, "au": "ignoramous", "dom": 168, "sr": 6, "sc": 11.24, "ep": 11.24, "bs": 0.0, "d": 4, "age": 12.78, "grav": 127.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 17, "qw": 3, "k": 18832, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": ["https://arxiv.org/html/2311.02462v5"], "ig": 0.856, "fa": 2.57, "gp": 1.312, "bl": 0.0, "ds": 0.0, "txt": "> Stockfish is ASI\n\nDepends on the definition. ASI in a \"narrow domain\", sure. Ref: Morris et al, https://arxiv.org/html/2311.02462v5 (Section 4, \"Levels of AGI\")."}, {"id": 50671769, "au": "varenc", "dom": 110, "sr": 7, "sc": 10.68, "ep": 10.68, "bs": 0.0, "d": 1, "age": 18.29, "grav": 225.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 36, "qw": 0, "k": 7667, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": ["https://github.com/antonvladyka/neuralnetworksanddeeplearning.com.pdf", "https://github.com/antonvladyka/neuralnetworksanddeeplearning.com.pdf/blob/master/book.pdf", "https://dl.dropboxusercontent.com/scl/fi/qxmlt277l6dr745t1m6a8/neuralnetworksanddeeplearning_book.zip?rlkey=kqv2nj8nqqzcl1w5ziz12zr74"], "ig": 0.967, "fa": 2.35, "gp": 1.179, "bl": 0.0, "ds": 0.0, "txt": "There's an older TeX copy of it on github here: https://github.com/antonvladyka/neuralnetworksanddeeplearnin...\n\npdf: https://github.com/antonvladyka/neuralnetworksanddeeplearnin...\n\nedit: and here's a copy of the full book from the archive.org copy re-assembled by an LLM: https://dl.dropboxusercontent.com/scl/fi/qxmlt277l6dr745t1m6...  (better for the interactive parts like in Chapter 3)"}, {"id": 50672351, "au": "Mike_weinberg", "dom": 210, "sr": 8, "sc": 10.23, "ep": 10.23, "bs": 0.0, "d": 0, "age": 17.08, "grav": 201.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 18, "qw": 0, "k": 9, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://nickbostrom.com/papers/vulnerable.pdf"], "ig": 0.474, "fa": 2.35, "gp": 1.668, "bl": 0.0, "ds": 0.0, "txt": "The concern is essentially Bostrom’s vulnerable world hypothesis which is a generalization of the failure modes described in Superintelligence.\n\nhttps://nickbostrom.com/papers/vulnerable.pdf"}, {"id": 50672248, "au": "da_chicken", "dom": 363, "sr": 9, "sc": 10.2, "ep": 10.2, "bs": 0.0, "d": 5, "age": 17.32, "grav": 206.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 172, "qw": 0, "k": 6281, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.896, "fa": 1.23, "gp": 1.542, "bl": 0.0, "ds": 0.0, "txt": "Shareholder primacy is a relatively recent development. It's absolutely NOT some mythic ideal of corporate truth. It's about 50 years old, beginning from the Friedman doctrine.\n\nSince the 2008 disaster, an increasing number of economists have argued that foundational flaws in this doctrine severely undermine the entire idea.\n\nHistorically, when companies were formed they had to demonstrate to the community and government how they were going to benefit them both. That's how they got the legal protections that a company provides. That essentially ended because of a race to the bottom that explains why every corporation is headquartered in Delaware.\n\nBut this magic idea that a company is exclusively required to pursue suicidal actions in the name of profit is not inherent. That's a choice made by the legislature and courts that you choose to believe is immutable.\n\nThe fact that it's hard to change because money corrupts doesn't make it more immutable. It's not supposed to be like this, and we have had clear and convincing evidence that it's wrong for 20 years. And it's only a 50 year old idea."}, {"id": 50671567, "au": "philipkglass", "dom": 121, "sr": 10, "sc": 10.12, "ep": 10.27, "bs": 0.0, "d": 7, "age": 18.69, "grav": 233.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 84, "qw": 0, "k": 14790, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": ["https://en.wikipedia.org/wiki/United_States_v._Progressive,_Inc", "https://en.wikipedia.org/wiki/History_of_the_Teller%E2%80%93Ulam_design", "https://nuclearweaponarchive.org/Nwfaq/Nfaq4.html"], "ig": 1.525, "fa": 1.57, "gp": 1.526, "bl": 0.0, "ds": 0.0, "txt": "In the United States, the Atomic Energy Acts of 1946 and 1954 tried to encode nuclear weapons secrecy in law (the \"born secret\" doctrine for critical nuclear technologies), but this has effectively been a dead letter since 1979:\n\nhttps://en.wikipedia.org/wiki/United_States_v._Progressive,_....\n\nToday, Wikipedia is full of nuclear weapons details that would have been considered top secret espionage-worthy stuff in the 1950s, e.g.\n\nhttps://en.wikipedia.org/wiki/History_of_the_Teller%E2%80%93...\n\nThere is no enforcement against using your own cleverness to unravel and then publish previously classified details of nuclear weapons, as Carey Sublette has done with his Nuclear Weapons FAQ:\n\nhttps://nuclearweaponarchive.org/Nwfaq/Nfaq4.html"}, {"id": 50672535, "au": "cma", "dom": 98, "sr": 11, "sc": 9.51, "ep": 9.51, "bs": 0.0, "d": 2, "age": 16.62, "grav": 193.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 52, "qw": 0, "k": 11853, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": ["https://archive.ph/D7BPt"], "ig": 0.79, "fa": 2.35, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "This reply reminds me that if you died to a mistaken fast response launch in the cold war, that was likely due to the Kalman filter, successor to the Wiener filter, which gave intercontinental WMDs the ability to hit hard targets with GPS like accuracy and required ~15 minute rushed responses to maintain MAD:\n\nhttps://archive.ph/D7BPt"}, {"id": 50670899, "au": "bogdiyan", "dom": 253, "sr": 12, "sc": 9.4, "ep": 9.4, "bs": 0.0, "d": 0, "age": 19.86, "grav": 258.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 11, "qw": 0, "k": 148, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://web.archive.org/web/20261116112617/http://neuralnetworksanddeeplearning.com/index.html"], "ig": 0.15, "fa": 2.35, "gp": 1.619, "bl": 0.0, "ds": 0.0, "txt": "You can use WayBackMachine to access them, at least for now https://web.archive.org/web/20261116112617/http://neuralnetw..."}, {"id": 50675926, "au": "funcDropShadow", "dom": 208, "sr": 13, "sc": 8.9, "ep": 9.05, "bs": 0.0, "d": 2, "age": 6.68, "grav": 48.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 270, "qw": 0, "k": 1291, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.912, "fa": 0.95, "gp": 1.276, "bl": 0.0, "ds": 0.0, "txt": "David Deutsch argues in \"The Beginning of Infinity\" that all human civilization exist and existed in one of two modes. The first and by far most widely spread mode is stagnation. In that mode there is still change, but it is so slow that it is hard to observe during the lifespan of a human. Those societies are build around rules that try do minimize change, to create stability. To do things as they were always done.\n\nThe second mode is continuous change. It happened so rarely in history. That he presents only three examples. \nFirst the golden age of Athens in antiquity. \nThose were 50 years of unprecedented growth and progress in philosophy and arts.\nSo much that it took almost 2000 years to ignite a similar spark in north Italy, Florence. Again, it lasted just 50 years before it was crushed by the dominant culture of the time. It created so much art and so many new ideas, so much progress that there are still people today building machines and conceptions that Leonardo Da Vinci envisioned.\n\nAnd the third example is the enlightenment of Europe and the western world. It is still going strong, although it is under constant attack by communists, collectivists and pessimists, e.g. Club of Rome.\n\nAll the other civilizations, the stable but stagnating ones, have one thing in common. They are ill prepared to defend against new threats. If new threats are arising would you like to live"}, {"id": 50671846, "au": "dkislyuk", "dom": 241, "sr": 14, "sc": 8.88, "ep": 8.88, "bs": 0.0, "d": 0, "age": 18.18, "grav": 223.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 469, "kpp": 7.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 2.039, "fa": 0.34, "gp": 2.148, "bl": 0.0, "ds": 0.0, "txt": "Circa 2015, Michael Nielsen's online material was probably the best public introductory resource for learning the internals of backpropagation and ANNs. This was pre-Karpathy's CS231n YouTube material, and during the Caffe/Torch era of deep learning frameworks, meaning that backprop functions still needed to be written down for custom layers (as in, no PyTorch or TF yet). Nielsen's textbook basically walked through how to create a toy deep learning library from scratch in NumPy. It's one of the relics of the early deep learning era!"}, {"id": 50674788, "au": "davesque", "dom": 289, "sr": 15, "sc": 8.87, "ep": 8.87, "bs": 0.0, "d": 0, "age": 10.87, "grav": 99.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 208, "qw": 0, "k": 7177, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.914, "fa": 0.62, "gp": 1.796, "bl": 0.0, "ds": 0.0, "txt": "For all the high minded justifications given for the self-censoring (and outright censoring) done by AI researchers and frontier labs, it sure does end up coming across simply as the usual people who have power wanting to keep it for themselves.\n\nNevermind the spirit of open research from yesterday's world that elevated these people to the place they are now, where they already have the knowledge and the tools they need to continue their work. The next generation of scientists interested in these topics won't get to enjoy that level of freedom in the exchange of ideas; unless they work for Anthropic or OpenAI of course, and therefore exhibit all the usual forms of pedigree that select for privilege in our current imperfect and unfair world.\n\nSo it will be the same as always, where good fortune (affluence, admission to Stanford or MIT, professors as parents, etc.) gives people access to the tools and environment they need to continue succeeding far more than the rest of us, but this time the \"tool\" is the uncensored super intelligence enjoyed by frontier lab employees.\n\nIf we were already worried about income and opportunity gaps, we should be about 1000x more worried going into this future we're building for ourselves."}, {"id": 50671143, "au": "pcthrowaway", "dom": 111, "sr": 16, "sc": 8.82, "ep": 9.12, "bs": 0.0, "d": 1, "age": 19.44, "grav": 249.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 33, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": ["https://archive.is/ykVFR"], "ig": 0.525, "fa": 2.35, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "Wayback machine snapshots are removed per the author's request, so it's possible he will have that snapshot removed as well\n\nI didn't check all the chapters, but archive.today also has a snapshot of chapter 1: https://archive.is/ykVFR"}, {"id": 50676522, "au": "intended", "dom": 57, "sr": 17, "sc": 8.78, "ep": 8.78, "bs": 0.0, "d": 5, "age": 4.54, "grav": 29.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 194, "qw": 20, "k": 7800, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": ["https://en.wikipedia.org/wiki/Vasily_Arkhipov"], "ig": 1.833, "fa": 1.04, "gp": 1.037, "bl": 0.0, "ds": 0.0, "txt": "> If the other party is willing to have the world converted into a ruin\n\nThat is the core assumption here. Bringing up the cold war, just makes the communist regime rational, and not what was imagined in the cold war narrative.\n\nEdit: on second thought, this position has to be contended with force.\n\nLife during the cold war was NOT good.\n\n> https://en.wikipedia.org/wiki/Vasily_Arkhipov\n\nThe fate of the world hinged on one person deciding to not launch missiles. I am sure there are other unsung instances of this.\n\nThinking that the communists \"didn't launch\" is historical revisionism, and entrenches an idea of rationality and low risk.\n\nThis then supports these arguments of \"everyone having one is safe\".\n\nNo, it doesn't make things safer.\n\nOn top of that - communism and capitalism was once again the creation of alliances and the consolidation of decision making power in groups.\n\nAmerica came out on top of that alliance, and so it may be an unspoken assumption that history will repeat itself.\n\nThe cold war set up many of the fault lines we deal with today. The power of God in the hands of man provides a religious zeal to the work.\n\nIt feels like the point of history has been missed entirely when this argument is made."}, {"id": 50672095, "au": "delichon", "dom": 194, "sr": 18, "sc": 8.3, "ep": 8.3, "bs": 0.0, "d": 0, "age": 17.64, "grav": 212.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 42, "qw": 0, "k": 11774, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": ["https://www.ted.com/talks/allan_savory_how_to_fight_desertification_and_reverse_climate_change"], "ig": 1.32, "fa": 0.96, "gp": 1.699, "bl": 0.0, "ds": 0.0, "txt": "This reminds me of the story of wildlife biologist Allan Savory, who recommended culling elephants to protect national parks, resulting in 40,000 dead elephants, then later realized he had it backwards and campaigned for dense herds and planned grazing to restore the parks.\n\nhttps://www.ted.com/talks/allan_savory_how_to_fight_desertif..."}, {"id": 50675076, "au": "pcthrowaway", "dom": 101, "sr": 19, "sc": 8.26, "ep": 8.41, "bs": 0.0, "d": 4, "age": 9.92, "grav": 86.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 2.17, "fa": 0.68, "gp": 0.944, "bl": 0.0, "ds": 0.0, "txt": "For others confused, they're saying later discoveries (or \"uncoveries\"(?) given the non-novelty the sibling comment alludes to) in missile guidance were developed  on top of the work of Norbert Wiener, a WW2 scientist who, upon seeing Hiroshima and Nagasaki's fate in 1945, wrote (and published as protest) a 1947 response to a Boeing researcher inquiring about details of Wiener's research that they (the Boeing researcher) had come across a summary paper of (and to which the expanded research was ostensibly out of print).\n\nPerhaps the later(?) Kalman filter was the thing which would have guided missiles during the cold war, and perhaps the Wiener filter was less effective (?), but nevertheless Wiener hoped his protest letter would have a ripple effect within the scientific community which would give others pause in continuing to supply research to \"irresponsible militarists\""}, {"id": 50676601, "au": "ChaitanyaSai", "dom": 301, "sr": 20, "sc": 7.87, "ep": 8.09, "bs": 0.0, "d": 0, "age": 4.24, "grav": 27.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 1227, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.833, "fa": 0.56, "gp": 1.508, "bl": 0.0, "ds": 0.0, "txt": "I just find the whole thing remarkably silly. So many people worrying about AI safety and yet not willing to come together to at least use existing models for the greater good? Why just go on about slowdown but not do something about organizing people to channel the artificial intelligence we have for something good? One obvious one: show what a plausible paperclip scenario looks like in 2027. How to use it improve agricultural output or produce survival rates or efficient cold storage infrastructure. There must tens of thousands of problems with positive externalities but low chance of value capture. Now is the time to tackle those, isn't it?"}, {"id": 50676732, "au": "0xDEAFBEAD", "dom": 252, "sr": 21, "sc": 7.52, "ep": 7.74, "bs": 0.0, "d": 1, "age": 3.78, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 64, "qw": 11, "k": 3101, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": ["https://scottaaronson.blog/?p=10379"], "ig": 1.64, "fa": 1.04, "gp": 0.637, "bl": 0.0, "ds": 0.0, "txt": ">Scott Aaronson for example is more a \"lean in\" kind of position.\n\nHm. In a recent blog post titled \"HOLY SHIT HOLY SHIT HOLY SHIT HOLY SHIT\", Aaronson wrote:\n\n\"Right now—this past week—is very much like I would’ve always imagined the beginning of an AI singularity to look and feel like. I just hope we’ll get lucky, and it will “merely” be a singularity for our little corner of the world that involves hard math problems.\"\n\nhttps://scottaaronson.blog/?p=10379"}, {"id": 50671945, "au": "kypro", "dom": 261, "sr": 22, "sc": 7.36, "ep": 7.94, "bs": 0.0, "d": 0, "age": 17.98, "grav": 219.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 361, "qw": 69, "k": 8506, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.761, "fa": 0.42, "gp": 1.799, "bl": 0.0, "ds": 0.0, "txt": "> The issue with ASI, then, is the destructive power latent in nature. It doesn't matter whether that power is wielded by humans or by out-of-control machines. I make this point because many people mistakenly believe that loss of control to such rogue machines is the fundamental issue. This leads them to treat AI safety as principally a technical problem, which can be addressed by “aligning” individual systems. Unfortunately, it cannot.\n\nThis is very much in line with my thinking. Even if we can (and want) to hypothetically design AIs (all AIs) to do the right thing, most of the risks are likely to still remain simply because we probably can't trust each other with the technology that AI is likely to bring our way.\n\nIt's interesting he cites Bostrom as not focusing on this because I actually think Bostrom presented the best argument in this direction. Bostrom suggests that all technological innovations are a bit like picking random balls from a sack. Most things we discover are net-good (white balls), some are mixed (gray balls), while others are black. These black balls are innovations that are more or less entirely bad and potentially carry civilisation destroying consequences from simply being invented. I think the classical example of this would be anything that makes nukes relatively easy to obtain, but another, maybe more realistic example might be any technology which al"}, {"id": 50673370, "au": "vlovich123", "dom": 165, "sr": 23, "sc": 7.07, "ep": 7.22, "bs": 0.0, "d": 3, "age": 14.54, "grav": 156.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 233, "qw": 0, "k": 16838, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.942, "fa": 0.5, "gp": 0.848, "bl": 0.0, "ds": 0.0, "txt": "It’s not the most intelligent than ever lived yet I think. It’s good at never tiring and trying all possible search paths and doing so far faster than humanly possible.\n\nFor example, it’s unclear if all the major results proven are actually novel mathematics it invented itself without any guidance or just trying combining things no one had yet. For example, if I understood the GHR story correctly, Alpoge gave the AI lots of guidance on the path where it filled in a lot of the details.\n\nWhat I’m trying to say is it’s unclear if it’s true super intelligence in picking better search paths than humans have or if it’s just mechanically trying a bunch of paths (albeit fairly intelligently) and is able to tell which paths are showing progress as well as reaching the very corners of all accumulated knowledge at a breadth that humans often are just unable to do.\n\nWe’re currently I think at Level 3 of intelligence where AI can do remarkably short work of a human chosen research program and direction. Level 4 would be the AI doing it completely itself (ie you just at most say “go solve GRH” and it figures out how to do that completely itself). It’s unclear how close we are to genuine level 4 across all problems and level 5 (it independently picks problems worth pursuing and develops the research programs) is when it’ll be hard to argue against true ASI"}, {"id": 50675249, "au": "tourmalinetaco", "dom": 222, "sr": 24, "sc": 6.9, "ep": 7.34, "bs": 0.0, "d": 2, "age": 9.17, "grav": 77.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 0, "k": 1086, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.851, "fa": 0.68, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "Nielsen’s argument is almost entirely illogical, in fact even he cannot point to any one issue, instead handwaving it all away. If I must, though… for one, he makes many weak assertions and assumptions (“100x acceleration”, unfalsifiable future technology because nature is “imaginative”, a 10% chance we will all die) that either cannot be proven or are literally just him making things up on the spot. His claims of geopolitical enforcement are also weak, believing that China and other nations would stop using AI if we “just coordinate”. The matchbox analogy is similarly weak, because while matchboxes are cheap we also have a thriving economy built around them, many are employed due to them, and we as a civilization are where we are because of them, not in spite of.\n\nIronically, Ted K. and Kojima both made far more cohesive arguments about technology outpacing human growth and adaption, although neither argument ultimately matters since we have to make the torment nexus otherwise our enemies will and use it against us. This is a non-negotiable reality of the world."}, {"id": 50675197, "au": "intended", "dom": 93, "sr": 25, "sc": 6.69, "ep": 7.2, "bs": 0.0, "d": 7, "age": 9.41, "grav": 80.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 7800, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.78, "fa": 0.62, "gp": 0.864, "bl": 0.0, "ds": 0.0, "txt": "Leaving it “at how well have we managed in the past few decades” is, in my opinion, an unfair claim.\n\nMore is definitely desired, But we are getting better.\n\nMeta got sued for its practices recently. The case being fought would have been impossible to win 5-7 years ago.\n\nThe research and evidence, policy, legislation and societal awareness of the new harms and risks is gradually increasing.\n\nThis knowledge has had to develop in the face of culture which valued growth and innovation and assumed safety was not an issue. Its had to develop in the face of lobbying and an industry that initially started out as the anti-thesis of financialized firms."}, {"id": 50671101, "au": "throwaway384034", "dom": 290, "sr": 26, "sc": 6.67, "ep": 7.33, "bs": 0.0, "d": 0, "age": 19.51, "grav": 250.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 9, "k": 144, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.66, "fa": 0.42, "gp": 1.54, "bl": 0.0, "ds": 0.0, "txt": ">to date the overall impact has been net positive\n\nHas it though? He casually states this while removing an entire book because of the \"dangers\". So his problem is not even with current AI but a possible future version of AI. The dangers to me are much less sci-fi and more boring, such as wealth concentration, rampant cheating in schools/universities, job loss in certain industries, greater surveillance, dead-internet and general cognitive surrender. All of which can be achieved with current AI and are already in effect to some degree."}, {"id": 50672907, "au": "calf", "dom": 251, "sr": 27, "sc": 6.58, "ep": 7.39, "bs": 0.0, "d": 0, "age": 15.63, "grav": 175.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 137, "qw": 0, "k": 801, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.849, "fa": 0.28, "gp": 1.549, "bl": 0.0, "ds": 0.0, "txt": "I was ready to write something in disagreement about his decision, then I read the actual piece and it changed my mind. If people read the essay his points are far more interesting than just focusing on the headline about his decision to self-censor his work.\n\nUnfortunately his actual discussion is sobering and looks mostly correct. If one agrees with his argument, then one must conclude the companies (et al) are not only participating in a doomed Great-Filter project, but technically a crime against humanity. History will judge, or what's left of it.\n\nThere's certainly differing views. Scott Aaronson for example is more a \"lean in\" kind of position. Hinton would be a more similar position as Nielsen and so regardless of our own views and incentives we will probably find out if their warnings were merely Cassandra's or not in this lifetime."}, {"id": 50671820, "au": "Betelbuddy", "dom": 244, "sr": 28, "sc": 6.53, "ep": 6.53, "bs": 0.0, "d": 0, "age": 18.21, "grav": 224.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 4084, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.705, "fa": 0.0, "gp": 1.739, "bl": 0.0, "ds": 0.0, "txt": "\"...My views have changed. With the extraordinarily reckless behaviour of the frontier labs, the systems have raced ahead much faster than I expected1, giving humanity far too little time to meet the challenges. Although the systems genuinely will bring — indeed, already are bringing — many wonders, they also pose a significant risk of catastrophe. The frontier labs are knowingly endangering all of humanity...\""}, {"id": 50671782, "au": "pelican0", "dom": 291, "sr": 29, "sc": 6.37, "ep": 7.25, "bs": 0.0, "d": 0, "age": 18.27, "grav": 225.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 99, "qw": 23, "k": 213, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.631, "fa": 0.42, "gp": 1.534, "bl": 0.0, "ds": 0.0, "txt": "> I don't wish to help (even in a very small way) train people to contribute to this work, and so I've taken the book down.\n\nSure, his book, his prerogative. And the dangers to society are real.\n\nBut this stance/argument is really dangerous and has extremist conclusions.\n\nThis was an introductory text. Will we be hearing for calls to burn ML/DL books soon? Or protests outside ML classes? Maybe not from the author, but perhaps many of the people/media who will cheer him on and portray it as witchcraft.\n\nMore people need to learn this science, not less. The imbalance of power with frontier labs will not go away, and society's readiness for ASI will not improve, if less people learned."}, {"id": 50672632, "au": "K0balt", "dom": 149, "sr": 30, "sc": 6.29, "ep": 7.47, "bs": 0.0, "d": 0, "age": 16.32, "grav": 187.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 152, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.908, "fa": 0.0, "gp": 2.058, "bl": 0.0, "ds": 0.0, "txt": "Compelling analysis of the worst dangers of ASI.\n\nIMHO, we have definitely achieved ASI. We are toppling problems every week that have stumped humanity’s best minds for centuries. That the AI is not omnicompetent is neither here nor there- Einstein probably was not a world class sushi chef, and probably was not a world leading musician.  He was still among the brightest minds we have on record. The idea that asi must be omnicompetent is ridiculous, at that point we are really saying ASI must be a god equivalent mind.\n\nIt’s rather an acceleration of the problem that faces all technological societies…. Eventually we figure out how to make a black hole with a spoon and a glass of water, and then it’s over. The danger is not in a malicious act, it’s in learning to master natural forces before we can adjust socially and psychologically to the level of responsibility and control needed to safely carry that knowledge."}, {"id": 50672180, "au": "stellar678", "dom": 359, "sr": 31, "sc": 6.28, "ep": 6.43, "bs": 0.0, "d": 5, "age": 17.45, "grav": 209.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 1228, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.663, "fa": 0.28, "gp": 1.188, "bl": 0.0, "ds": 0.0, "txt": "This is not actually true at least according to the letter of the law.\n\nAnthropic is a Public Benefit Corporation. Public Benefit Corporation as a structure explicitly instructs the directors to pursue a public benefit that is enumerated in the company’s charter alongside pursuing profit for shareholders, allowing them to balance the requirements.\n\nIn the case of Anthropic the enumerated public benefit is “responsible development and maintenance of advanced AI for the long-term benefit of humanity”.\n\nPublic benefit corporations haven’t been around that long, so we’ll see how it plays out in practice."}, {"id": 50671502, "au": "jarjoura", "dom": 392, "sr": 32, "sc": 6.17, "ep": 6.39, "bs": 0.0, "d": 0, "age": 18.84, "grav": 236.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 147, "qw": 0, "k": 3288, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.404, "fa": 0.68, "gp": 0.794, "bl": 0.0, "ds": 0.0, "txt": "So, is this guy an AI doomer? To me this is a ridiculous take, although he's free to make it. We still get old, get cancer, can't regrow limbs, and Earth still defeats our best attempts to contain it.\n\nThe only annoying thing in all of this, is that 1k people sitting in their fancy SF offices get to make 100mil each for building something built on the backs of 10k other researchers and on the scraped input of 100s of millions of human contributions. It's incredibly unfair and yet, somehow, we no longer live in a world where this kind of intellectual theft is looked down upon. 25 years ago, napster \"freed\" music from the strange and corrupt record label system that stifled innovation and dictated what and how we participated in music. Not even 6 months into that, the music industry collectively banded together and shut that all down."}, {"id": 50674606, "au": "c1ccccc1", "dom": 237, "sr": 33, "sc": 5.98, "ep": 7.08, "bs": 0.0, "d": 6, "age": 11.43, "grav": 107.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 23, "k": 1071, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.76, "fa": 0.42, "gp": 1.206, "bl": 0.0, "ds": 0.0, "txt": "> Is there a particular level of technological advancement you want to turn the clock back to?\n\nNo specific time in the past, of course. But halting progress towards strong AGI is not tantamount to halting technological progress as a whole, which makes your question irrelevant in the context of this discussion. There are plenty of individual technologies we should have given a hard pass to. Eg. tetraethyllead.\n\n> There is no separation between technology and humanity.\n\nA toaster is a piece of technology. A toaster is not a human. Try aiming more towards truth and less towards sounding clever next time."}, {"id": 50672984, "au": "merek", "dom": 311, "sr": 34, "sc": 5.93, "ep": 7.03, "bs": 0.0, "d": 1, "age": 15.46, "grav": 172.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 109, "qw": 0, "k": 632, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": ["https://www.gatesnotes.com/work/make-ai-work-for-everyone/reader/a-turbulent-ai-era-and-critical-choices-to-make"], "ig": 1.771, "fa": 0.62, "gp": 0.759, "bl": 0.0, "ds": 0.0, "txt": "AI is advancing rapidly and is widely available, we simply don't have time to comprehend the implications. Along the way, bad actors can use it for destructive purposes far quicker than we can build controls and defenses.\n\nHe's not saying destroy the machine, he's saying slow down and plan responsibly. Hardly a Luddite.\n\nGates had a similar message a few months back:\n\n\"I wish the world could get the benefits rapidly and delay the problems it will cause as long as possible, but the benefits and problems are arriving at the same time. I believe we need time to prepare for the period of social, political, and economic upheaval we are about to enter.\"\n\nhttps://www.gatesnotes.com/work/make-ai-work-for-everyone/re..."}, {"id": 50671174, "au": "martythemaniak", "dom": 313, "sr": 35, "sc": 5.9, "ep": 7.0, "bs": 0.0, "d": 0, "age": 19.4, "grav": 248.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 11235, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.845, "fa": 0.0, "gp": 1.837, "bl": 0.0, "ds": 0.0, "txt": "That's a shame, it was a great book and it was the one that made deep learning to 'click' for me. He is mostly right though - it hard to imagine a worse way to develop, deploy and market a new technology than what the SV exec class has done over the past few years. They've managed to somehow combine the raw power and money hunger of wall street execs, the mindlessness and cruelty of religious cults, AND the sanctimonious disdain of ivory tower intellectuals all the while enriching themselves and causing a degradation in the material well-being of other people. Pretty incredible really.\n\nUnfortunately, even though they received some very strong and clear feedback during the last election, they have chosen to ignore that and double-down on everything."}, {"id": 50671835, "au": "spydum", "dom": 254, "sr": 36, "sc": 5.78, "ep": 6.88, "bs": 0.0, "d": 0, "age": 18.19, "grav": 223.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 3493, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.936, "fa": 0.0, "gp": 1.607, "bl": 0.0, "ds": 0.0, "txt": "I think there is a certain amount of harsh reality we all face: humanity (much like information systems) were always crazy vulnerable to attack and manipulation. The problem was it required detailed knowledge and skill to conduct. So mostly we got by simply by being lucky and not targeted. To make it more clear: a suitable analog is that a mentally unwell person who wants to inflict damage often is deficient in other mental faculties, and thus their range of operation is reduced. The real scary folks have both intelligence and intent (think ted kaczynski). The advent of AI or ASI can enable more folks who were lacking in the domain.\n\nWhat may result is a more defensive civilization, but I actually worry that we will lose that innovation and freedom we had due to our ignorance/naivity."}, {"id": 50677210, "au": "mistersquid", "dom": 8, "sr": 37, "sc": 5.78, "ep": 7.02, "bs": 0.0, "d": 3, "age": 2.55, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 15, "k": 4565, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.701, "fa": 0.7, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": ">  I think the average p(doom) (of people who take that concept seriously) is a lot higher than 0.04%.\n\nThe focus on the p(doom) of informed actors like Amodei should shift because a more likely scenario involving catastrophic loss of (human) life due to the advent of AGI is humans wielding it for their own selfish and acquisitive ends.\n\nWhat would, for example, someone like Elon Musk do if their company first created an AGI?\n\nThe focus is on what a non-human sentience would do without regard for human concerns but we have enough to worry about what humans will do without regard for their fellow humans."}, {"id": 50673401, "au": "yubblegum", "dom": 83, "sr": 38, "sc": 5.7, "ep": 7.24, "bs": 0.0, "d": 1, "age": 14.42, "grav": 154.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 1106, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.836, "fa": 0.28, "gp": 1.466, "bl": 0.0, "ds": 0.0, "txt": "There is a manifesto of sorts attached. It makes for thought provoking reading:\n\n\"The issue with ASI, then, is the destructive power latent in nature. It doesn't matter whether that power is wielded by humans or by out-of-control machines4. I make this point because many people mistakenly believe that loss of control to such rogue machines is the fundamental issue. This leads them to treat AI safety as principally a technical problem, which can be addressed by “aligning” individual systems.\"\n\nThis is an excellent point and I am glad someone has made it. We have all been gradually indoctrinated into a specific view regarding the nature of the potential hazard as 'misalignment with values' whereas here a pioneer in the field is claiming this is wrong and the technology, \"like fire\", is inherently dangerous."}, {"id": 50678154, "au": "barnabee", "dom": 31, "sr": 39, "sc": 5.59, "ep": 6.99, "bs": 0.0, "d": 10, "age": 1.02, "grav": 7.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 15, "k": 3131, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.552, "fa": 0.7, "gp": 0.926, "bl": 0.0, "ds": 0.0, "txt": "> But AI development is substitutive, rather than independent or additive.\n> The potential harm is singular.\n\nIf you believe the result of AI will be a singular machine god, rather than just increasingly powerful tools in the hands of more and more people who might (accidentally or on purpose) do harm with them, it’s on you to make a case for that.\n\nIt’s a convenient argument for an AI lab because it leads to the conclusion (as you have stated) that everyone will do it so we must. Where “it” is speedrun through a whole zoo of conventionally dangerous things while pushing for concentration of power in their own hands, because of a belief (and no more than that) that they’re creating some infinitely powerful thinking machine. A machine that will apparently be so good at thinking that it makes up for everything else it can’t do and overcomes the normal constraints of physical reality.\n\nExtraordinary claims require extraordinary evidence."}, {"id": 50671560, "au": "3eb7988a1663", "dom": 199, "sr": 40, "sc": 5.54, "ep": 6.64, "bs": 0.0, "d": 0, "age": 18.71, "grav": 234.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 3421, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.82, "fa": 0.0, "gp": 1.632, "bl": 0.0, "ds": 0.0, "txt": "Coincidentally, what is the best way of making a local backup of a Wayback machine site? Say I want all of a particular domain, with the latest archived page up to a certain date (or within a date range). I do not need the full revision history of all time, just a reasonably up-to-date copy of the information.\n\nOnce I have the information in hand, is there actually good tooling to consume it? Or do I have to do some nonsense with unpacking a tar file, running a local web server, etc to view the data?"}, {"id": 50675703, "au": "locallost", "dom": 275, "sr": 41, "sc": 5.53, "ep": 5.97, "bs": 0.0, "d": 0, "age": 7.5, "grav": 57.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 3186, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.458, "fa": 0.28, "gp": 1.204, "bl": 0.0, "ds": 0.0, "txt": "Every progress is dangerous for mankind, this is not a new thought. You don't even have to look at the atomic bomb, look at radio or television. It's questionable if something like the Holocaust could've happened without the invention of media where you can spread your ideas to so many people so quickly. As for AI, a simpler danger is not just that AI itself will do this it that, or produce systems we don't understand, the danger is also in the way humans will use it right now. Whereas previously you needed something happening to spin it in your favor, you can now just generate it and paired with social media reach billions of people more or less instantly."}, {"id": 50672304, "au": "randallsquared", "dom": 371, "sr": 42, "sc": 5.41, "ep": 5.92, "bs": 0.0, "d": 5, "age": 17.19, "grav": 204.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 9731, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.65, "fa": 0.28, "gp": 0.86, "bl": 0.0, "ds": 0.0, "txt": "I think it was reasonable to have his expectations. OpenAI was founded as a reaction to concerns about the risks of AI development in normal corporate environments (x-risks, but also winner-take-all outcomes -- hence \"open\"). Anthropic was founded as a reaction to AI researchers' feelings that OpenAI wasn't behaving ethically enough or according to its founding principles! You might say, \"Welp, that's what corporations do!\" but I think given the frequent and open rhetoric from the frontier labs about how careful they should be and how dangerous all this, it's not unreasonable to think that they'd be more cautious and more concerns about security and alignment failure than their actions indicate they are."}, {"id": 50677576, "au": "csallen", "dom": 30, "sr": 43, "sc": 5.19, "ep": 6.07, "bs": 0.0, "d": 9, "age": 1.94, "grav": 11.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 253, "qw": 0, "k": 11028, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "effect_streisand", "flbl": "Effect & Streisand (Later)", "urls": [], "ig": 1.843, "fa": 0.0, "gp": 1.202, "bl": 0.0, "ds": 0.0, "txt": "This analogy doesn't make logical sense.\n\nTheft is an independent crime. Every singular instance theft causes direct harm to its victim, such that it's wrong and should be illegal on its own, regardless of what other instances of theft are happening in the world. They're in no way connected or related to each other, except for in exceptional situations. If I break into your house and steal your TV, that doesn't (normally) displace some other thief from breaking in and stealing it.\n\nBut AI development is substitutive, rather than independent. One party developing superintelligence substitutes for any other doing it. Because the potential harm is singular.\n\nImagine a race. Only one runner has to cross the finish line for a race to be won. Only one party has to win the race to build super intelligence for the risk to come into play. Imagine a single party, even the leading AI lab, simply decides not to take part in the race. What effect does that have? The same effect as your grandma not running in the race to develop superintelligence. That is, zero effect. Everyone else is still running, and still incentivized to run. In fact, even more incentivized to run, since now their chances of winning are higher. Even worse: anyone else can join the race, whenever they want, and can even do so in secret, so it's impossible to police.\n\nUnless you have some sort of magical police force that"}, {"id": 50671082, "au": "derektank", "dom": 404, "sr": 44, "sc": 5.18, "ep": 5.62, "bs": 0.0, "d": 3, "age": 19.55, "grav": 251.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 10, "k": 3195, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.092, "fa": 0.7, "gp": 0.73, "bl": 0.0, "ds": 0.0, "txt": ">I personally struggle to draw the line between HiAnime and OpenAI\n\nThe line is reproduction. HiAnime reproduces existing works, OpenAI does not (generally at least. And if OpenAI’s models do reproduce copyrighted works, they are liable for that as found in the GEMA v. OpenAI case in Germany)."}, {"id": 50677216, "au": "ordu", "dom": 33, "sr": 45, "sc": 5.06, "ep": 6.16, "bs": 0.0, "d": 4, "age": 2.54, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 318, "qw": 33, "k": 3285, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.779, "fa": 0.42, "gp": 0.542, "bl": 0.0, "ds": 0.0, "txt": "> That's about individuals acting in their own self-interest overuse or degrade a shared resource, ultimately depleting it for everyone.\n\nMaybe. But why people bother to study the tragedy of commons? Because they are interested in ways to avoid it. Those ways, roughly speaking are all come to the idea that you can't solve the tragedy of commons in a world of rational agents maximizing their short-term profits.\n\n> That is not the same as what I'm talking about, and not analagous to it, either.\n\nYou do talk about the very same thing, look: \"I've never seen any realistic way that you could stop everyone from doing such work on AI.\" It is exactly a failure of a collective action. It is the very same problem from game theory perspective.\n\nPlus, there are ways. I mean you can't stop obviously, you can't control each person that bought some GPUs and read a few books/articles. But you can limit it, because the frontier research is not done in a home lab with a couple of GPUs, it requires 1000s of GPUs and insane amount of power. You can't just hide it in your basement. It is not exactly trivial task to hide it from satellites with IR cameras.\n\nSo there are ways to monitor if agents are conforming to or defecting an agreement, the only missing thing is an international agreement on it, mostly between USA and China. But even this one is not the biggest hurdle, the biggest one is the abil"}, {"id": 50677316, "au": "rarefied_tomato", "dom": 191, "sr": 46, "sc": 5.05, "ep": 6.15, "bs": 0.0, "d": 0, "age": 2.33, "grav": 14.0, "surf": 18.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 236, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.763, "fa": 0.34, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "the author's takedown itself is fine. maybe this is the best lever through which he can draw attention to a message. however, the message is flawed. there's no putting ML back in the bottle, only controling (via technology, as only direct technological control is capable of reining it in, regardless of the regulatory enforcement layer) its development.\n\nlikewise, the tone of the justification for the takedown is off-putting. maybe in 2015 you could have kneecapped your learners a bit via deprivation. today, only the little guy is starting from basics. humanity could benefit from understanding the hit Nielsen lined up against us. now he's struck again.\n\nuncharitably, his argument is that we might be able to control AI, but the technology is so powerful we should instead pretend we can forget about it."}, {"id": 50671915, "au": "bigyabai", "dom": 215, "sr": 47, "sc": 4.83, "ep": 5.86, "bs": 0.0, "d": 2, "age": 18.04, "grav": 220.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 27, "k": 3386, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.272, "fa": 0.42, "gp": 1.156, "bl": 0.0, "ds": 0.0, "txt": "His thesis doesn't depend on logic, really:\n\n> Understandably, people skeptical of catastrophic risks want these supposed threats spelled out in detail. This is intrinsically difficult, because we can't reliably anticipate future science and technology.\n\nWithout a crystal ball, nobody can refute or defend his fear. It's rhetoric that relies heavily on his authority and emotions moreso than a from-A-to-B correlation that you can reason around. It's not a valueless stance, but it will strain his credibility with some crowds."}, {"id": 50676370, "au": "auggierose", "dom": 247, "sr": 48, "sc": 4.61, "ep": 5.71, "bs": 0.0, "d": 2, "age": 5.1, "grav": 34.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5600, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.473, "fa": 0.5, "gp": 0.568, "bl": 0.0, "ds": 0.0, "txt": "Exactly. Lots of people do things that put them and/or their loved ones into mortal danger (for example crossing the atlantic ocean in small boats).\n\nA technology that can (help to) solve the Riemann hypothesis is not very unlikely to bring massive progress. It will bring massive change, some of it massive progress."}, {"id": 50673862, "au": "glerk", "dom": 236, "sr": 49, "sc": 4.6, "ep": 5.85, "bs": 0.0, "d": 5, "age": 13.12, "grav": 132.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 24, "k": 1222, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.449, "fa": 0.42, "gp": 0.86, "bl": 0.0, "ds": 0.0, "txt": "> Do you live under a rock or are you blind to the damage technology can do?\n\nPlease enlighten me. Is there a particular level of technological advancement you want to turn the clock back to?\n\n> What does putting technology before humanity itself makes you?\n\nThere is no separation between technology and humanity. Whatever part of \"humanity\" you are attached to (probably your parochial culture or your fragile mammalian body) is irrelevant and will be superseded no matter how much you kick and scream."}, {"id": 50671816, "au": "swed420", "dom": 369, "sr": 50, "sc": 4.58, "ep": 6.12, "bs": 0.0, "d": 3, "age": 18.22, "grav": 224.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 19, "k": 728, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.597, "fa": 0.42, "gp": 0.811, "bl": 0.0, "ds": 0.0, "txt": "> I find it extremely frustrating that very, very intelligent people continue to expect corporations to behave ethically... or even responsibly.\n\nIt might be the difference between:\n\nGeneric late stage capitalism hell where most people are at least still scraping by, and there's a sliver of hope for political change at some undetermined future point\n\nand\n\nEnd-of-the-line existential threat staring everybody in the face, but very few are paying attention, so the author is trying whatever he can think of to orient attention to what he sees as the culprit given his background\n\nPractically speaking, what else could we expect him to do?"}, {"id": 50672120, "au": "tarsinge", "dom": 358, "sr": 51, "sc": 4.51, "ep": 5.61, "bs": 0.0, "d": 5, "age": 17.6, "grav": 211.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 3490, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.794, "fa": 0.0, "gp": 0.963, "bl": 0.0, "ds": 0.0, "txt": "No the parent is right, it’s only cultural norm that took hold in the 70s, before that corporations were supposed to have social responsibility too. Another arbitrary cultural choice: for centuries corporations existed without the concept of limited liability / separate legal person, meaning treating corporations as a distinct faceless entity instead of a group of people having agency is also a relatively recent cultural norm."}, {"id": 50671240, "au": "georgemcbay", "dom": 377, "sr": 52, "sc": 4.42, "ep": 5.52, "bs": 0.0, "d": 1, "age": 19.32, "grav": 246.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 189, "qw": 0, "k": 16622, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.929, "fa": 0.0, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "I don't know the author, so I'm speculating, but I'm pretty certain his intent was to invoke a variant of the Streisand effect on purpose.\n\nNot to draw attention to the book that he removed (the removal of which has no real practical impact, and I assume he knows this), but to draw eyeballs to his arguments on why rushing ahead with AI is dangerous for reasons beyond simplistic SkyNet scenarios.\n\nAnd his plan worked, as evidenced by the fact that this is on the front page of HN and we are talking about it.\n\nFWIW, I think his arguments are good and worth talking about.  AI is, in fact, likely to surface many rather inexpensive massive dangers to society in the hands of chaos agents.\n\nIn the pre-AI, we got \"lucky\" with nuclear bombs in that fissile materials are practically rather difficult to acquire, aiding in relatively manageable (but still costly) limited proliferation.  No reason to believe that luck keeps up if AI is unable to uncover future real-world dangers that are even a fraction as destructive.  So yeah, I do think speed of scaling up is a really big danger we should be thinking about here."}, {"id": 50675648, "au": "MasterScrat", "dom": 143, "sr": 53, "sc": 4.4, "ep": 5.5, "bs": 0.0, "d": 0, "age": 7.68, "grav": 59.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2639, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.309, "fa": 0.34, "gp": 1.005, "bl": 0.0, "ds": 0.0, "txt": "This was an excellent book. I had read it after already having gone through a formal AI course at EPFL which had done very little to ignite my interest.\n\nBut after reading Nielsen’s book over 10 years ago it really clicked for me and I’ve been dedicating my professional life (and most of my personal one) to ML ever since."}, {"id": 50678146, "au": "K0balt", "dom": 190, "sr": 54, "sc": 4.37, "ep": 6.71, "bs": 0.8, "d": 2, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 4903, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.302, "fa": 0.95, "gp": 0.648, "bl": 0.3, "ds": 0.0, "txt": "Idk, if we had developed all of the tech of the 1926-now in 1926-1928, I’m not convinced we would not have utterly destroyed ourselves.\n\nI don’t think it’s just a sci-fi problem. Advanced technology requires advanced civilisational understanding of the technology and its uses and risks to avoid disaster."}, {"id": 50676533, "au": "jacquesm", "dom": 53, "sr": 55, "sc": 4.35, "ep": 5.6, "bs": 0.0, "d": 3, "age": 4.51, "grav": 29.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 14, "k": 248623, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.147, "fa": 0.7, "gp": 0.625, "bl": 0.0, "ds": 0.0, "txt": "> The average person simply does not have the financial resources to train an LLM.\n\nCollectively we do though. It's mostly a matter of harnessing the will to do so. Federated training could bring us the largest and best models, but you would then need to do inference and I wonder whether the two can be made to balance because training isn't latency and throughput sensitive, but inference is."}, {"id": 50671069, "au": "llm_nerd", "dom": 130, "sr": 56, "sc": 4.35, "ep": 5.68, "bs": 0.0, "d": 4, "age": 19.56, "grav": 251.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 136, "qw": 0, "k": 4946, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.901, "fa": 0.0, "gp": 0.839, "bl": 0.0, "ds": 0.0, "txt": "Not only is it performative, it seems tremendously self-aggrandizing.\n\nThe online ebook was beginner fare \"how to make a CNN in Python recognize MNIST digits\" thing. There are thousands...tens to hundreds of thousand even...of these across the web. Everyone's first learning NNs spins one of those up literally as a start on the domain.\n\nBy the post you'd think it contained deeply innovative LLM sparse attention improvements or something, and the cat was out of the bag and \"Now I am become Death, the destroyer of worlds..\" kind of thing.\n\nAnd, to be cynical, that seems almost what this whole performative act is trying to portray --- that a great leader in the field has doubts.\n\nEh, maybe I'm overly cynical. It was obviously selfless and thoughtful to post the book for all that time, but this act seems silly."}, {"id": 50674843, "au": "mullingitover", "dom": 89, "sr": 57, "sc": 4.35, "ep": 5.55, "bs": 0.0, "d": 4, "age": 10.69, "grav": 96.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 5, "k": 16087, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.343, "fa": 0.42, "gp": 0.824, "bl": 0.0, "ds": 0.0, "txt": "> We could reduce or stop\n\nWho is this 'we'?\n\nTrying to control what the whole world is doing with this technology is like trying to boss around a termite mound.\n\nMeanwhile, like with fire, any society sticking its head in the sand and thinking it will go away is going to find itself suffering from whiplash at how quickly it came to be governed by some other group which adapted."}, {"id": 50676960, "au": "k0dyn", "dom": 58, "sr": 58, "sc": 4.35, "ep": 5.53, "bs": 0.0, "d": 5, "age": 3.15, "grav": 19.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 11, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.976, "fa": 0.0, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "The cold war may have ended, but the threat didn't.\n\nNukes aren't gone, they're just not on the six o'clock news every day.\n\nFrom a certain point of view, nuclear weapons were simply the first avenue for humankind to pose a threat which was global in nature.\n\nThat hasn't changed... they simply lost their monopoly on \"somebody in Nebraska pushes a button, and the whole world goes to shit\".\n\nIncreasing abstraction, increasing globalization of supply chains, increasing international integration... have all contributed to an environment where global threats have become background noise."}, {"id": 50673582, "au": "StableAlkyne", "dom": 52, "sr": 59, "sc": 4.35, "ep": 5.42, "bs": 0.0, "d": 2, "age": 13.92, "grav": 145.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 3, "k": 1878, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.838, "fa": 0.0, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "> attack-dominant or defense-dominant\n\nIt is really analogous to nuclear weapons. The average person simply does not have the financial resources to train an LLM.\n\nMost people will download an LLM or sub to a provider. Knowing \"oh hey btw you can represent a NN as linear algebra\" isn't going to slow down that research any more than shutting down a K-12 geometry website will.\n\nUltimately, I get where the author is coming from, but it's very much a political statement to claim that shutting down this resource will in any way affect things. IMO it's worse, because it brings neural networks one step closer to being black box magic.\n\nBut maybe that's where people think safety will lie, in much the same way they clutch their pearls when an LLM tells them ways to refine fissile material that even a college freshman knows. It's unfortunate that we think leaving this knowledge in the hands of a small cabal - the same group who have been behaving unethically - will somehow make things better.\n\nBut hey, we live in a society giving more to the robber barons every day. This is just par for the course."}, {"id": 50672858, "au": "itissid", "dom": 156, "sr": 60, "sc": 4.35, "ep": 5.41, "bs": 0.0, "d": 2, "age": 15.73, "grav": 176.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 123, "qw": 0, "k": 1420, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.954, "fa": 0.0, "gp": 0.562, "bl": 0.0, "ds": 0.0, "txt": "The models are already good enough for most economically lucrative activities in the United states i.e. in this Largely Services based economy.\n\nAt this point it's just the shameful pursuit of capital: who gets to own the biggest chunk ~16.5trn dollars of payroll of service workers in the US. The stupid argument to justify this shameful pursuit is: tax us and generate UBI (oh and they definitely have a plan for the interim, the one where there is mass unemployment, but hey! atleast the gobs of money aai labs make sure makes the suffering easier to digest, right?)\n\nWhat argument is all this even trying to make?\n\"we are better steward than dictators\" Or \"create abundance with tax and UBI\". None of those make sense."}, {"id": 50672504, "au": "antonvs", "dom": 216, "sr": 61, "sc": 4.35, "ep": 5.39, "bs": 0.0, "d": 3, "age": 16.7, "grav": 194.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 4673, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.897, "fa": 0.0, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "There's a very real and obvious risk which doesn't involve speculating about future out-of-control AI, which is touched on in the OP: that of corporations abusing AI in ways that harm the majority of society, while favoring a small minority.\n\nSimple induction from past corporate behavior strongly predicts that this will happen (and arguably already is starting happening), unless strong steps are taken to prevent it.\n\nThat alone could be taken to reasonably justify the author's stance, even though I disagree with it."}, {"id": 50678045, "au": "blululu", "dom": 7, "sr": 62, "sc": 4.35, "ep": 5.34, "bs": 0.0, "d": 5, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 4732, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.588, "fa": 0.22, "gp": 0.679, "bl": 0.0, "ds": 0.0, "txt": "Hard takeoff/soft takeoff would give very different forecasts. The previous estimate is based on weighting in the possibility of certain scenarios that are no longer probable, so the underlying estimate should update to reflect the current distribution of outcomes."}, {"id": 50671745, "au": "emacdona", "dom": 355, "sr": 63, "sc": 4.35, "ep": 5.33, "bs": 0.0, "d": 2, "age": 18.32, "grav": 226.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 32, "k": 846, "kpp": 7.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.199, "fa": 0.42, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "That quote, along with this one:\n\n> My views have changed. With the extraordinarily reckless behaviour of the frontier labs, the systems have raced ahead much faster than I expected, giving humanity far too little time to meet the challenges.\n\nLead me to believe that he expected different behavior.\n\nI find it extremely frustrating that very, very intelligent people continue to expect corporations to behave ethically... or even responsibly."}, {"id": 50671311, "au": "Loquebantur", "dom": 120, "sr": 64, "sc": 4.35, "ep": 5.32, "bs": 0.0, "d": 6, "age": 19.21, "grav": 244.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.442, "fa": 0.28, "gp": 0.779, "bl": 0.0, "ds": 0.0, "txt": "\"Preserving human knowledge\" in this case is just whataboutism.\n\nNielsen specifically classifies that very knowledge as dangerous, to the degree of threatening humanity's survival.\n\nYour part about nuclear weapons is particularly revealing in that context: you're ignorant of the fact how much knowledge around them is expressly forbidden to be made public."}, {"id": 50676587, "au": "PowerElectronix", "dom": 70, "sr": 65, "sc": 4.35, "ep": 5.19, "bs": 0.0, "d": 2, "age": 4.31, "grav": 27.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 1163, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.564, "fa": 0.34, "gp": 0.378, "bl": 0.0, "ds": 0.0, "txt": "100% this the book will still be widely available, but by pulling it off the legal market he gets the limelight for long enough to make his message heard.\nI don't agree with him, dangerous technologies can't be deffended against by laws and regulations (their effect partially mitigated, at best) and having as many people exposed to the technology, imho, is the best course of action.\n\nI won't say only a good person with an LLM can stop a bad one with an LLM, but having the general population educated on the capabilities of AI and their inner workings probably leads to fewer incidents in the long run."}, {"id": 50676906, "au": "lioeters", "dom": 42, "sr": 66, "sc": 4.35, "ep": 5.19, "bs": 0.0, "d": 1, "age": 3.29, "grav": 20.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 9, "k": 10843, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls": [], "ig": 1.423, "fa": 0.42, "gp": 0.45, "bl": 0.0, "ds": 0.0, "txt": "> there is no consent from the rest of us\n\nThe contemporary slang term is \"rapey\".\n\nIt describes the manner in which this technology is being forced on society, the public, the world of living beings. The same way it happened with the industrial revolution and progress of so-called civilization, which has had its benefits as well as devastating consequences. It did not just happen, it was a purposeful act without consent."}, {"id": 50671426, "au": "artico_chewy", "dom": 133, "sr": 67, "sc": 4.35, "ep": 5.16, "bs": 0.0, "d": 7, "age": 18.99, "grav": 239.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "labs_frontier", "flbl": "Labs & Frontier (Nuclear)", "urls": [], "ig": 1.748, "fa": 0.0, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "Raise awareness, mobilize against lethal work being done by frontier labs.\n\nInteresting enough to OP to post. I see him as a \"respected researcher in our community\", not the pope or something. Fair enough? I think he incurs reputation cost because he's mixing a sort of political belief with work, and being extremely critical of others in his field. So that stands out a little.\n\nWe still have \"it's just a word predictor\" people around here. Some people got spooked by Huggingface, some by Coxon's resignation, some people are persuaded by seeing smart people not in the labs' social circles speak up. These things need to happen."}, {"id": 50677517, "au": "Nasrudith", "dom": 312, "sr": 68, "sc": 4.35, "ep": 5.13, "bs": 0.0, "d": 2, "age": 2.05, "grav": 12.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 140, "qw": 0, "k": 6106, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "super_intelligent", "flbl": "Super & Intelligent (Corporations)", "urls": [], "ig": 1.855, "fa": 0.0, "gp": 0.533, "bl": 0.0, "ds": 0.0, "txt": "Given that 'slow down' amounts to 'do nothing until we have somehow worked out apriori all of the impacts' that is tantamount to destroying it with bureaucracy as a sinecure for idiot philosophers who are actively hostile to awareness of how the world works. More time doing nothing is never how we have come to terms with new technologies and their implications. We learn by doing because the world changed by it does not exist yet.\n\nThis demand for 'wait consider the implications!' is the sort of vacuous stupidity which could cause the Bronze Age Collapse. If we so much as proposed planting trees around farm fields to stop soil erosion they would ask \"Wait, what are the implications about planting trees to prevent soil erosion? First prove that planting more trees won't lead to soil depletion with current level technology!\"."}, {"id": 50672927, "au": "Loquebantur", "dom": 65, "sr": 69, "sc": 4.35, "ep": 5.13, "bs": 0.0, "d": 3, "age": 15.58, "grav": 174.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 1206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.846, "fa": 0.0, "gp": 0.546, "bl": 0.0, "ds": 0.0, "txt": "Non-proliferation aims to increase detectability and slow implementation of dangerous weapons technology. They don't hide the idea of atomic bombs, they make it difficult for you to actually build one undetected.\n\nThe author here isn't about single-handedly preventing the development of AI by \"hiding\" his book. He wants to draw attention to the overlooked dangers of AI.\n\nThe idea of \"others will build it regardless, so we must be first\" paints humans as mindless primates, constantly at each others' throats. What is needed is careful consideration and deliberate, planned action in concert with all involved."}, {"id": 50677699, "au": "csallen", "dom": 22, "sr": 70, "sc": 4.35, "ep": 5.12, "bs": 0.0, "d": 3, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 283, "qw": 0, "k": 11028, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "dangers_existential", "flbl": "Dangers & Existential (Believe)", "urls": [], "ig": 1.778, "fa": 0.0, "gp": 0.652, "bl": 0.0, "ds": 0.0, "txt": "It's not quite the same as that, because dumping toxic waste into a river adds pollution such that every little amount matters and directly harms additional organisms.\n\nThe risk of super-intelligence is much more binary. It either exists or it doesn't. If it doesn't exist, then we're not facing any sort of existential threat. But once it does exist, we are (potentially, but not necessarily) screwed.\n\nSo I think the better analogy is to compare it to a race. Only one party needs to cross the finish line, in order to bring something extremely dangerous into existence. Even if one party stops running, it doesn't change the fact that there are hundreds of others who are running, and anyone else can join the race at any point in time and do so in a way that can't possibly be policed.\n\nAs the lead runner, you're forced with the choice of (1) dropping out of the race, which will have just about as much effect as my pet hamster suddenly standing up and announcing that he's dropping out of the race. Remarkable and newsworthy, but it won't suddenly make the race un-winnable by someone else. Or, (2) trying to win the race, so at least it's you who possesses the dangerous power rather than someone else. Who knows, perhaps you can even use it to stop others from using it for evil.\n\nSo no, I don't think it's anything like the cumulative incremental process of dumping toxic wakes into a river"}, {"id": 50670904, "au": "microtonal", "dom": 265, "sr": 71, "sc": 4.35, "ep": 5.08, "bs": 0.0, "d": 1, "age": 19.85, "grav": 257.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 27205, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "humanity_nielsen", "flbl": "Humanity & Nielsen (Agi)", "urls":
