": 24, "useful": 6, "useful_pct": 25.0, "terms": "clearance, sci, access, government"}, {"slug": "general_commentary", "label": "General Commentary", "count": 36, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 9}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["us", "hacked", "air", "cloud", "platform", "allow", "correct", "hack", "happen", "internet", "makes", "computer", "eventually", "finally", "giving", "highly", "places", "policy"], "largest_root": {"root_id": 50667677, "author": "999900000999", "slots": 78, "start_dom": 1, "end_dom": 78, "share_pct": 39.8, "top_dom1_age": 8.2, "top_dom1_author": "999900000999"}, "buried_cutoff": 59, "rescue_top_k": 39, "ablations": [], "tournament": [], "comments": [{"id": 50671051, "au": "zbentley", "dom": 129, "sr": 1, "sc": 8.87, "ep": 8.87, "bs": 0.0, "d": 5, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 320, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": ["https://www.eatingpolicy.com/p/understanding-the-cascade-of-rigidity"], "ig": 1.944, "fa": 0.9, "gp": 1.199, "bl": 0.0, "ds": 0.0, "txt": "This is indeed common. It's fixable, but hard to fix.\n\nThe usual scenario goes like: \"compliance/ATO/RMF/whatever processes are box checking excercises, we need to build something that doesn't fit in the boxes they're used to checking, so it gets rejected by those processes. We appeal the rejection to senior decision-makers, and eventually (if we're lucky) find someone senior enough to approve one-off flexibility to the process and allow the right thing to be done.\"\n\nThat takes a lot of time and effort. There are three process trajectories from there, two of them bad:\n\n1. The effort of adding flexibility to the \"cascade of rigidity\" (https://www.eatingpolicy.com/p/understanding-the-cascade-of-...) is deemed too great, so it's rarely done. Nothing improves.\n\n2. The senior decision-maker who is willing to add flexibility becomes load-bearing (sorry, Claude; it really is the right term sometimes). They become overloaded and inundated with requests to approve exceptions/alternative processes. When they leave the organization or when one of the places where they add flexibility fails and they get blamed for it, that capability is lost.\n\n3. The senior decision-maker prevents this by pushing the capability for flexible response down into the lower levels of the organization (letting ISSO/auditors do it is only a small part of the battle: getting the people making changes to actually a"}, {"id": 50668002, "au": "Twirrim", "dom": 35, "sr": 2, "sc": 8.87, "ep": 8.87, "bs": 0.0, "d": 1, "age": 7.65, "grav": 59.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 272, "qw": 17, "k": 11683, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.895, "fa": 0.64, "gp": 1.786, "bl": 0.0, "ds": 0.0, "txt": "JWCC was originally an all Azure cloud, AWS pitched a fit and took legal action, then the US government decided to open the contract out for bids and decided that being dependent on a single company was too risky, particularly for extremely sensitive data and infrastructure. Four clouds enables effective competition between the vendors resulting in better deals for the US government.\n\nThe JWCC contract is really detailed and extremely prescriptive, including all the details about who and how access can occur (it's a fully air gapped cloud, where only people with TS/SCI+ clearance can go, so the fact it got compromised is really interesting. Wonder if it's a bad actor or something not correctly isolated)\n\n> Why not just hire a solid in house dev ops team. Get some full timers with fed benefits.\n\nYou say it like it's easy. TS/SCI+ cleared engineers are just not that easy to find. At all. Let alone ones capable of building out a cloud environment. It's a pain to get and maintain clearance, mostly for good reason.\n\nThe US Government also doesn't pay that well either, and their pay scales reportedly won't stretch as far as necessary.\n\nIf you're willing to get clearance and know what you're doing you can make absolute bank off just contractor work, much, much more than you'd ever make actually working for the government.\n\nA previous manager of mine had an anecdote that reflected his "}, {"id": 50667827, "au": "WarmWash", "dom": 147, "sr": 3, "sc": 6.97, "ep": 6.97, "bs": 0.0, "d": 2, "age": 7.95, "grav": 62.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 5876, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.591, "fa": 0.68, "gp": 0.895, "bl": 0.0, "ds": 0.0, "txt": "The models that present a threat are all huge, and all run in agent swarms.\n\nNobody is running a swarm of Mythos class models on their 5090.\n\nIf the US makes it illegal then all US providers will not provide the model. And it's more likely it will be shared western effort. Its not a particularly hard sell. Although I'm sure mistral will still be allowed at least in Europe.\n\nSo the result will be needing to use a VPN to run a model in Malaysia or something.\n\n99.9% of people are just gonna download the app and pay the $20/mo instead."}, {"id": 50667065, "au": "sheepscreek", "dom": 79, "sr": 4, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 0, "age": 9.05, "grav": 75.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 49, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": ["https://oxide.computer"], "ig": 1.212, "fa": 0.62, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Assuming on-prem is coming back in full force, it could be a nice payday for 0xide (https://oxide.computer).\n\nBut of course, there'll be all the incumbents trying to win government contracts as well. However, if I was making the decision, I would consider Oxide very seriously for what they bring to the table."}, {"id": 50668440, "au": "fusslo", "dom": 107, "sr": 5, "sc": 6.44, "ep": 6.44, "bs": 0.0, "d": 0, "age": 6.97, "grav": 51.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 1627, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.486, "fa": 0.34, "gp": 1.362, "bl": 0.0, "ds": 0.0, "txt": "I remember working at a contractor for the DOE in 2009 where work computers and computers with access to the internet were physically separated. Like we'd have to walk down the hall to the computer outside my manager's office to google something. all usb ports were blocked. If we need to swap out a keyboard or mouse we had to put in an IT ticket and someone with the keys would come down and do it for us.\n\nI believe (but don't know for sure) those restrictions were lifted allowing people to work from home but access classified networks.\n\nI wonder if they'd consider going back to physical separation as much as possible until IT catches up with the age of AI"}, {"id": 50668255, "au": "drop_star", "dom": 56, "sr": 6, "sc": 6.25, "ep": 6.39, "bs": 0.0, "d": 3, "age": 7.27, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 116, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.517, "fa": 0.68, "gp": 0.614, "bl": 0.0, "ds": 0.0, "txt": "The most visible in-house tech teams were among the first and hardest hit:\n\n• On March 1, 2025, the administration eliminated 18F and laid off its staff, which was roughly 90 technologists. The stated reason was cutting \"non-essential consulting,\" and 18F was classed as non-critical in GSA's reduction in force.\n\n• USDS was gutted and rebranded as the U.S. DOGE Service, with 40 employees laid off and 21 resigning in protest.\n\n• Nearly all of the Pentagon's Defense Digital Service staff resigned under DOGE pressure.\n\n• FedRAMP was down to 28 employees by September 2025 after losing over 50 that fiscal year, though sources said most of those cuts were on the contractor side.\nAt the CDC, the team modernizing a disease-surveillance system shrank from about 20 people to a handful as probationary staff were fired and the USDS contingent was dismissed or resigned.\n\nIf in-house expertise was scarce, losing the few teams that had it matters more, not less. Those teams were largely the people helping agencies manage vendors better, which is exactly the problem Pahlka writes about."}, {"id": 50669022, "au": "notesinthefield", "dom": 121, "sr": 7, "sc": 6.11, "ep": 6.25, "bs": 0.0, "d": 3, "age": 6.08, "grav": 43.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 371, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.922, "fa": 0.0, "gp": 1.199, "bl": 0.0, "ds": 0.0, "txt": "Five years ago I rebounded out of SRE to an oddly well paid and significantly less stressful gov cybersec auditing job (ISSO). It is mind numbing and programs are constructed such that non technical people can step into these roles and fulfill the mostly gruntwork they require. I moved out of that to engineering quickly but you just can’t escape ISSO/E/M’s - those three roles comprise 3/4’s of most gov security programs and it’s a massive problem because they are auditors first and foremost. There is realistically little effort put behind proper technical security roles outside of explicitly defensive SOC services (C5ISR, Cyber Command) or offensive work."}, {"id": 50667962, "au": "willmadden", "dom": 175, "sr": 8, "sc": 5.89, "ep": 5.89, "bs": 0.0, "d": 0, "age": 7.74, "grav": 60.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 215, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.634, "fa": 0.28, "gp": 0.863, "bl": 0.0, "ds": 0.0, "txt": "It's suspicious to me that all of this is being reported openly in the mainstream media. The precedent is Edward Snowden-like secrecy with the media defaulting to not reporting if the government claims it's a national security issue, which it is. Whoever leaked this information to the media is literally a traitor and would normally be hunted to the ends of the earth.\n\nMy hunch is that this is a big psychological operation and the motive is to condition the public into accepting the lockdown of open weight models and an artificial AI oligopoly with regulated \"safety\" guardrails."}, {"id": 50670318, "au": "lokar", "dom": 164, "sr": 9, "sc": 5.88, "ep": 5.88, "bs": 0.0, "d": 3, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 7161, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 2.017, "fa": 0.0, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "Good design can go a long way. People don’t do it because it’s slower and expensive.\n\nLimit and carefully review 3rd party code\n\nUse short lived workload identities tied to the host/vm\n\nOnly allow internet access to highly restricted proxies, separate inbound and outbound.  Monitor carefully including recording a sample of flows.\n\nRun anything interacting with raw user input in 2 layers of sandbox (containers don’t count).  Again, carefully monitor, record all or sample syscall traces .\n\nRestrict human access heavily.  On demand, scoped and short lived.  Only from secure devices, ideally locked down (no random web browsing).\n\nEtc.  all well known and practiced for 20+ years"}, {"id": 50669004, "au": "Arainach", "dom": 15, "sr": 10, "sc": 5.79, "ep": 6.08, "bs": 0.0, "d": 3, "age": 6.1, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 14, "k": 10957, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.314, "fa": 0.7, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "> Isn't the core value prop \"we own it and have more control over access\n\nOne of the major American political parties runs on a platform which states that government doesn't work. That party is very effective at blocking and shutting down any government project that might provide evidence to the contrary in favor of privatization and grift.\n\nTo them, what you describe isn't a value prop, it's a threat."}, {"id": 50671264, "au": "zbentley", "dom": 126, "sr": 11, "sc": 5.76, "ep": 6.05, "bs": 0.0, "d": 6, "age": 2.74, "grav": 16.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 2.029, "fa": 0.0, "gp": 0.885, "bl": 0.0, "ds": 0.0, "txt": "Heh, we worked in similar orgs.\n\nI think the missing-technicals-on-ISSO problem is systemic. If you have the technical chops, ISSO/AODR/ISSE/cyber is rarely the most money you can make, even within the department/within fed. If you do stay, technical chops often result in you taking on extra work and burning out, or becoming the person who's always crying wolf or pointing out issues that make more work for others, and you get managed out.\n\nThat's tricky to solve, but there are solutions. I'm a fan of embedding ISSO/AODR-equivalent staff within product teams to some extent (even if that's just \"they show up to ordinary product/eng team meetings that aren't security focused\").\n\nThat helps less-technical folks gain context by osmosis, makes sure the ISSO/AODR knows the maturity/status of everything by the time audits and approvals are needed, and helps keep everyone aligned around delivery rather than finding a reason to get to \"no\". Definitely not a silver bullet, but powerful nevertheless."}, {"id": 50667987, "au": "rfgplk", "dom": 190, "sr": 12, "sc": 5.64, "ep": 5.64, "bs": 0.0, "d": 0, "age": 7.67, "grav": 59.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 86, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.738, "fa": 0.28, "gp": 0.519, "bl": 0.0, "ds": 0.0, "txt": "\"Claude can't write a hello world app without mistakes\"\n\n\"ChatGPT still needs a software engineer to guide it\"\n\n\"I work on a codebase that is actually sufficiently advanced(tm) therefore I will always be needed\"\n\n\"Real engineering cannot be done by AI\"\n\nAnd suddenly autonomous AI agents are capable of breaching arbitrary systems with a single \"oi m8 get me root access to this server @ IP\" prompt. Funny how progress works."}, {"id": 50671779, "au": "mpyne", "dom": 17, "sr": 13, "sc": 5.6, "ep": 6.04, "bs": 0.0, "d": 3, "age": 1.73, "grav": 10.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 8377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.837, "fa": 0.34, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "To a first approximation, literally everything about how the government actually implements information systems is contracted out.\n\nThere are many government datacenters even now, but they are in essence run day-to-day by a company contracted to do it, while government staff occupy positions in program management or other functional duties.\n\nIt’s a tremendous problem that zbentley and others describe well, because the government is barely able to supervise their existing contractors, let alone actually do more involved work.  It shouldn’t be that way, but convincing agencies that have already lost that skill set that they a) can rebuild it and b) should rebuild it, is like pulling teeth.\n\nIt’s only very recent that the U.S. Air Force even had to personnel classification grouping for military officers involved in software development. And the problem has gone on for so long that Fred Brooks (of IBM System/360 fame) was once involved in a DoD effort to recommend means to increase DoD’s own organic ability to design, implement and deliver software-based services."}, {"id": 50668268, "au": "mgkimsal", "dom": 36, "sr": 14, "sc": 5.6, "ep": 6.04, "bs": 0.0, "d": 2, "age": 7.25, "grav": 54.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 16862, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.539, "fa": 0.22, "gp": 1.238, "bl": 0.0, "ds": 0.0, "txt": "\"You say it like it's easy. TS/SCI+ cleared engineers are just not that easy to find. At all. Let alone ones capable of building out a cloud environment. It's a pain to get and maintain clearance, mostly for good reason.\"\n\nDon't the vendors and their workers have to have clearance?  Why is it easy for them to maintain large numbers of people who can drop in at a moment's notice to large scale projects, but our government can't maintain a similar number of trained/skilled/cleared people?  We seem to be paying for it either way?\n\n\"The US Government also doesn't pay that well either, and their pay scales reportedly won't stretch as far as necessary.\"\n\nBut somehow they end up paying the vendors quite well, no?"}, {"id": 50670422, "au": "zbentley", "dom": 30, "sr": 15, "sc": 5.35, "ep": 5.79, "bs": 0.0, "d": 6, "age": 4.14, "grav": 26.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 178, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 2.06, "fa": 0.0, "gp": 0.655, "bl": 0.0, "ds": 0.0, "txt": "Not true at all. The choice of contract-or-not, and how to incentivize good digital work, is very very rarely put before the voters. Those decisions are almost always made unilaterally within the executive. \"Fix government contracting/digital work\" is not a sexy enough issue for representatives/presidents to make it a major campaign plank. It very occasionally breaks out into the public sphere (FISMA, post-obamacare digital rethinks, post-OMB-hack security/compliance regulations, DOGE), but never for long and certainly not with enough political focus to make meaningful, lasting change.\n\nThis is good news, actually: the missing quantity is decision-makers within the executive who care about fixing this. That can be addressed without widespread public support, on much shorter timeframes than large political initiatives. It can be addressed on an agency-by-agency basis without cross-government policy/regulatory changes. Whether it will be addressed is a different story.\n\nThe amount of private sector lobbying/contract money spent against it is problematic, true, but it's not problematic in the same way that e.g. industry consortia lobbying against environmental safety laws in congress is problematic."}, {"id": 50669314, "au": "pixl97", "dom": 132, "sr": 16, "sc": 5.34, "ep": 5.34, "bs": 0.0, "d": 1, "age": 5.69, "grav": 39.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.248, "fa": 0.62, "gp": 0.443, "bl": 0.0, "ds": 0.0, "txt": "10 years out is so far away at this point I'd say it's impossible to make any accurate predictions.\n\nFor example if we get continuous learning between now and then , the speed at which cyber attack and defense change will add another exponent to what we're already experiencing. Humanity will mostly be a bystander."}, {"id": 50670619, "au": "zbentley", "dom": 122, "sr": 17, "sc": 5.34, "ep": 6.63, "bs": 0.85, "d": 4, "age": 3.82, "grav": 23.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 237, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.892, "fa": 0.28, "gp": 0.953, "bl": 0.32, "ds": 0.0, "txt": "I've also done that work, and it is often broken as you say.\n\nGood ISSO staff are worth their weight in gold. But they're rare.\n\nThat said, I think all of this takes a back seat to the fact that so, so many government digital initiatives are focused on risk reduction as a higher priority than value delivery. The security apparatus of many agencies is the means by which software is deployed--not a consultative/collaborative/occasionally-raising-flags component of the development process, but the primary bottleneck and authority through which all changes flow.\n\nBeyond the broken/ineffective approval and compliance excercises (of which there are many, though I'd argue that the controls/policy standards being used for auditing are rarely themselves the problem--some of NIST, for example, is quite pragmatic and good), the distribution of authority is frankly bizarre by private sector standards.\n\nIt'd be extremely weird in a high-risk SaaS company, for example, to have the SecEng org be the primary stakeholder in the deployment/build/QA/SDLC process. They should be a stakeholder, sure, but not the primary one. But that's how it often is in government.\n\nRisk reduction and value delivery don't always need to trade off, but when they do, I'm reminded of the old Yegge microservices rant: a platform that's not accessible (as in usable, able to deliver value) but is highly secure is useles"}, {"id": 50671239, "au": "bell-cot", "dom": 14, "sr": 18, "sc": 5.27, "ep": 5.71, "bs": 0.0, "d": 4, "age": 2.77, "grav": 16.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 13442, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.723, "fa": 0.34, "gp": 0.479, "bl": 0.0, "ds": 0.0, "txt": "Often, it's because management attention and competence are constrained resources.  Outsourcing to (say) EMailCo, Inc. at $15/user/month is, pretty much, a \"decided and done\" deal.  With a clear, hard cap on costs.\n\nVs. doing email in-house?  Unless trustworthy managers are perpetually monitoring what the underlings are up to, it is difficult to limit on how much time and money can be lost down the rat-hole of Dilbert Dept. mismanagement and padded head counts."}, {"id": 50670391, "au": "chiph", "dom": 41, "sr": 19, "sc": 5.23, "ep": 5.67, "bs": 0.0, "d": 2, "age": 4.18, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 33, "k": 8844, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.469, "fa": 0.42, "gp": 0.705, "bl": 0.0, "ds": 0.0, "txt": "> it's a fully air gapped cloud, where only people with TS/SCI+ clearance can go, so the fact it got compromised is really interesting. Wonder if it's a bad actor or something not correctly isolated\n\nI would hope that it was only accessible via the SIPR network. And that connections are only being made via leased lines and not the public internet (even with using a VPN secured by the NSA).\n\nAgree that it was likely espionage or a misconfiguration.\n\nMy TS/SCI clearance is long expired but at the time (late 80's early 90's) it was worth a good chunk of change to a firm doing work for the government. You can get hired without one but they really prefer to hire someone already cleared, as you will be on the bench until your clearance comes through, or they will have to see if you can get you an interim lesser clearance to work on a different project."}, {"id": 50668098, "au": "cowlevel", "dom": 91, "sr": 20, "sc": 5.2, "ep": 5.57, "bs": 0.0, "d": 2, "age": 7.51, "grav": 57.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 0.891, "fa": 0.95, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "That would be fine, that's how it's supposed to work. (Except for where someone else bid 20% over cost but LM won because of some kickbacks)\n\nYou get paid for providing a service, yes, that's the 30%, and Oxide does not provide the service, they make hardware for providing a service. Same reason 100% of your S3 bill doesn't go to Seagate."}, {"id": 50667509, "au": "oneplane", "dom": 96, "sr": 21, "sc": 4.92, "ep": 5.43, "bs": 0.0, "d": 1, "age": 8.41, "grav": 67.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 6912, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.757, "fa": 0.0, "gp": 0.899, "bl": 0.0, "ds": 0.0, "txt": "Ironically, when you move workloads you're still sitting on the same incompetence. In the past, that would be partially mitigated by having a 'strong perimeter' (which wasn't really all that strong...), but these days that doesn't apply anymore with all the integrations and data exchanges needing to poke through such a perimeter.\n\nIt used to be that you got away with it because it was difficult to breach everyone's perimeter, but these days, everything that has technical debt or any weakness will just get hammered relentlessly until it's broken. That's also what the LLM harnesses tend to be good for: always-on scriptkiddies. It doesn't have to be sophisticated if you can spend a few cents doing every possible permutation of a low-skill attempt until you're in (which includes just scraping credentials or exploiting vulnerabilities int he edge devices, tunnels, identity-aware proxies etc...).\n\nBut if history teaches us anything, it's that technical debt gets ignored, competence doesn't get rewarded to the point where it's exercised enough, and expertise is rarely involved at the top to set an org up for this type of success."}, {"id": 50669496, "au": "BobbyTables2", "dom": 10, "sr": 22, "sc": 4.84, "ep": 5.72, "bs": 0.0, "d": 3, "age": 5.45, "grav": 37.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2660, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.593, "fa": 0.34, "gp": 0.694, "bl": 0.0, "ds": 0.0, "txt": "1000% agree.\n\nI’ve never understood why companies act like intellectual property is something to be protected and then proceed to contract out every single core things like email, chat, source control, and other tools, benefits, payroll, etc. to no-name 3rd party cloud services.\n\nI’m fairly certain there are far more 3rd party people with access to my data than there are total employees in my company.  I see that as a problem…"}, {"id": 50669215, "au": "willmadden", "dom": 177, "sr": 23, "sc": 4.7, "ep": 5.28, "bs": 0.0, "d": 2, "age": 5.83, "grav": 40.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 215, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.721, "fa": 0.0, "gp": 0.854, "bl": 0.0, "ds": 0.0, "txt": "I deleted that from my original post because I don't want to give them any horrible ideas. The guardrails they've implemented software side are already unbearable.\n\nThe good news is if they go ahead with this idiocy, Chinese and other chip fabs will see a huge boost in demand for open silicon, and the nanny-chips will sell at a steep discount. That pushes money to the competition. It's leaky, so it would take massive regulatory overreach to do it. Even if you are a nanny-statist, I still think this would be a colossal mistake.\n\n\"Conspiracy theory\" territory here, but it all ties into the Jensen Huang/NVIDIA drama a little too neatly, both in terms of the motive and the timing."}, {"id": 50670209, "au": "nukanse", "dom": 85, "sr": 24, "sc": 4.65, "ep": 5.09, "bs": 0.0, "d": 2, "age": 4.45, "grav": 28.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 31, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.653, "fa": 0.0, "gp": 0.83, "bl": 0.0, "ds": 0.0, "txt": "Nothing to do with defense, but once I had to process text files written by humans, and it was impossible to make them use correct characters.\n\nI had to read the text files with regular expressions to read letters \"o\" mixed with zeroes, tabulations Mixed with spaces , \".\" Confused with \",\" as decimal separator, different encodings sent by people that didn't even knew what an encoding is, and always there was some innovation that broke the code.\n\nI patched for everything, but when left, I knew they would create new ways to break the files."}, {"id": 50667677, "au": "999900000999", "dom": 1, "sr": 25, "sc": 4.47, "ep": 5.13, "bs": 0.0, "d": 0, "age": 8.15, "grav": 64.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 41, "k": 7271, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.024, "fa": 0.42, "gp": 1.053, "bl": 0.0, "ds": 0.0, "txt": "> Launched in 2017 as a one-stop shop for  the Air Force's IT needs, Cloud One combined the resources of four operators - Microsoft, Amazon, Oracle and Alphabet - to power scores of applications, including ones that manage personnel data and pay or logistics and maintenance.\n\nWho in God’s name thought this would be a good idea. 4 vendors with varying levels of access among sub contractors at a bare minimum.\n\nWhy not just hire a solid in house dev ops team. Get some full timers with fed benefits."}, {"id": 50670685, "au": "projektfu", "dom": 42, "sr": 26, "sc": 4.45, "ep": 5.11, "bs": 0.0, "d": 2, "age": 3.71, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 6177, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.399, "fa": 0.34, "gp": 0.587, "bl": 0.0, "ds": 0.0, "txt": "They could drop the reliance on polygraphs and probably have about 4x the number of available people.  Even if someone will eventually pass a polygraph, a lot of times they get an \"ask again later\" kind of response, and then they have to schedule another one several months out, which by round 2 or 3 they have already taken another job.  It's totally ridiculous and they should get rid of polygraph testing across the government."}, {"id": 50667752, "au": "zbentley", "dom": 2, "sr": 27, "sc": 4.34, "ep": 5.44, "bs": 0.0, "d": 1, "age": 8.04, "grav": 63.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 242, "qw": 17, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 0.903, "fa": 0.42, "gp": 1.464, "bl": 0.0, "ds": 0.0, "txt": "> Why not just hire a solid in house dev ops team. Get some full timers with fed benefits.\n\nThat's very, very hard to pull off. You can do it, but there are tons of headwinds and organizational/political difficulties in resisting the siren song of contracting out. It's the right move, and I wish more agencies did it, but between the default response of \"of course we'll contract it, that's what we've always done\" and the very real challenges of building in-house expertise and re-orienting staff and processes towards using the in-house platform, it's a surprisingly hard problem--much harder than the equivalent struggles in the private sector. And, even once you do it, the benefits take awhile to show up (migrating away from the prior way of doing things takes a long time), and there will be continual pressure to switch back to contracting it out, so you'll have to continually re-justify the platform's value prop. There's also the reality that whatever you build \"in house\" won't be entirely in-house; it'll inevitably be staffed and built by a combination of GS/ranked people and contractors--hopefully a mixture that works well and not one that continues the hollowing-out of in-house expertise--which will also be a challenging staff/HR situation to maintain, since the agency building the platform will usually not have much prior experience giving \"build things\" authority to such a h"}, {"id": 50670394, "au": "SkipperCat", "dom": 94, "sr": 28, "sc": 4.31, "ep": 6.67, "bs": 1.7, "d": 5, "age": 4.17, "grav": 26.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 2789, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.67, "fa": 0.34, "gp": 1.226, "bl": 0.64, "ds": 0.0, "txt": "Or you could change the rules so a small group of defense contractors cant fleece the government.\n\nYour S3 statement makes sense. It can be worthwhile to pay more for added features of redundancy and space.  What I'm concerned about is a beltway-bandit taking a full service solution, reselling it to the govt with no added value and slapping a 30% markup on the price.\n\nThere's no value add in this scenario.  Its just Lockheed Martin having regulatory ownership of DoD procurement.  It doesn't add any value."}, {"id": 50669028, "au": "Eridrus", "dom": 37, "sr": 29, "sc": 4.03, "ep": 5.35, "bs": 0.0, "d": 3, "age": 6.07, "grav": 42.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 141, "qw": 0, "k": 6302, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.254, "fa": 0.62, "gp": 0.441, "bl": 0.0, "ds": 0.0, "txt": "Actual federal government employees top out at GS-15, which is what Google pays for new grads, whereas the companies the government contracts out to can pay market rates.\n\nThis isn't fundamental if you have a magic wand you can redo how the government does comp, but none of the agencies can do this on their own.\n\nAnd that's before you get into the actual bureaucracy around hiring/firing in the government because the government has deep pockets to sue, so every ounce of judgement is squeezed out of the hiring process to prevent discrimination claims and lawsuits.\n\nMany things are solvable in theory, but there is no actual political coalition whose primary goal is for the government to be run efficiently.\n\nAnd that's before you get to the fact that it's just very hard to run an efficient organization without competitive pressure."}, {"id": 50667910, "au": "zbentley", "dom": 120, "sr": 30, "sc": 3.83, "ep": 4.71, "bs": 0.0, "d": 2, "age": 7.82, "grav": 61.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.685, "fa": 0.0, "gp": 0.517, "bl": 0.0, "ds": 0.0, "txt": "I cannot emphasize how correct this is. The security/compliance rules and approval processes in these organizations very directly result in local minima of security and reliability.\n\nThe solution isn't \"get rid of all security and compliance rules\". I'm not anti-auditing/regulation generally. But these rules are implemented in a maximally rigid and guaranteed-to-produce-bad-outcomes (for security and reliability and velocity and quality, which is remarkable) way. This can be done better, but requires both big paradigm shifts, big internal investment of resources, and time. All of which are scarce commodities in government."}, {"id": 50666850, "au": "jmclnx", "dom": 187, "sr": 31, "sc": 3.5, "ep": 4.16, "bs": 0.0, "d": 0, "age": 9.37, "grav": 79.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 17, "k": 6988, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 0.922, "fa": 0.42, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "> \"We continuously take prudent measures to protect department (of the Air Force) information, systems and mission capabilities.\"\n\nSeems you need more measures.  How about not putting National Security Information in the Cloud.  If in \"the cloud\", data will eventually \"rain\" down on everyone."}, {"id": 50668207, "au": "mgkimsal", "dom": 3, "sr": 32, "sc": 3.44, "ep": 4.32, "bs": 0.0, "d": 2, "age": 7.34, "grav": 55.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 16862, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.294, "fa": 0.0, "gp": 0.883, "bl": 0.0, "ds": 0.0, "txt": "\"so you'll have to continually re-justify the platform's value prop\"\n\nIsn't the core value prop \"we own it and have more control over access\"?  By default, using multiple vendors means there's already more people than just yours who potentially have access.\n\nMoving away from outsourcing to more inhouse skills will of course take some time and culture shift, but this is precisely the sort of culture shift I'd like to see more of."}, {"id": 50667903, "au": "999900000999", "dom": 23, "sr": 33, "sc": 3.21, "ep": 4.75, "bs": 0.0, "d": 2, "age": 7.84, "grav": 61.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 7271, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.263, "fa": 0.34, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "With 1.5 trillion dollars it’s definitely possible.\n\nThe biggest obstacle might be the relatively low pay, 197k for the top GS level isn’t going to get you the best talent.\n\nLong term I’d assuming bringing most of this in house would save money. Buy you’re talking about a 10 to 15 year timeline to build up such an organization. Sorta hard to do when everything shifts every 4 years.\n\nMaybe we need a cloud hosting provider version of Amtrak"}, {"id": 50671511, "au": "robotnikman", "dom": 112, "sr": 34, "sc": 3.19, "ep": 3.63, "bs": 0.0, "d": 0, "age": 2.27, "grav": 13.7, "surf": 5.6, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 3524, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.472, "fa": 0.0, "gp": 0.121, "bl": 0.0, "ds": 0.0, "txt": "Feels like the future of the internet will involve cutting off access to countries which will not allow us to extradite people who hack our systems. And other countries will probably start doing the same.\n\nThe rate of exploits being discovered and places being hacked is insane right now, i'm seriously considering telling my parents to stop doing anything important involving a computer, I fear for them getting hacked as well. Or just giving them a mac which is solely used on for that stuff and nothing else."}, {"id": 50668041, "au": "zbentley", "dom": 24, "sr": 35, "sc": 3.1, "ep": 5.49, "bs": 0.85, "d": 3, "age": 7.6, "grav": 58.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 485, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.959, "fa": 0.0, "gp": 0.61, "bl": 0.32, "ds": 0.0, "txt": "I think there are multiple things in the \"biggest obstacle\" bucket. I'm a broken record on threads in this area that the one of the best treatments of the headwinds here is Jen Pahlka--blog, book, speaking--she covers the obstacles much better than I could.\n\nPay and retention is significant, but I don't think it's as significant as the difficulty hiring and selecting in-house expertise. ~190k, while not competitive with SF/FAANG, is more than sufficient to attract plenty of talented folks in DCM/elsewhere in the country ... but identifying/marketing to, and getting approval to hire those folks has massive regulatory obstacles. Like, crazy big.\n\nOnce they're hired, the timeline/electoral whiplash you point out absolutely is a major challenge, but an equivalently sized challenge is that many government agencies have done the opposite of building in-house expertise for so long that they just....don't have the muscles to know how to allocate and empower these new staff. Those capabilities have atrophied so fully that the only option is a hybrid contractor/noncontractor team to allow the contractors to train and empower the feds, which is itself a mixed-incentives challenge (\"train your replacement. Who will also cost your boss hundreds of millions of dollars once trained.\")\n\nOnce that's overcome and you have talented people empowered to work on the right problems, there's a really "}, {"id": 50667650, "au": "notesinthefield", "dom": 110, "sr": 36, "sc": 3.05, "ep": 3.71, "bs": 0.0, "d": 0, "age": 8.18, "grav": 65.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 371, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.273, "fa": 0.0, "gp": 0.498, "bl": 0.0, "ds": 0.0, "txt": "Some of my work rests on C1 - over the last month we’ve seen pretty significant disruptions as they rebuild all infrastructure and limit access. With their VERY tight restrictions in place, Im taking holiday time early."}, {"id": 50669595, "au": "devld", "dom": 165, "sr": 37, "sc": 2.79, "ep": 3.82, "bs": 0.0, "d": 3, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 6, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.589, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "Security is about layers. On traditional desktop OSes, one attack vector will lead to the compromise of the entire system. Not to mention, most desktop OSes do not even bother to try preventing one app from accessing another's app files. I think that Qubes OS is no longer optional for a security conscious person."}, {"id": 50671645, "au": "pknomad", "dom": 44, "sr": 38, "sc": 2.77, "ep": 3.88, "bs": 0.0, "d": 2, "age": 1.99, "grav": 12.1, "surf": 4.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 870, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.173, "fa": 0.28, "gp": 0.221, "bl": 0.0, "ds": 0.0, "txt": "People are hand-waving the difficulty and risks of building an in-house group that:\n\n1. Has TS/SCI+ Clearance\n2. Understands how government works w/ ATO (and realize why things take so long)\n3. Has experience dealing with political headwinds, especially when you get administration as corrupt as one it is now\n4. Fosters risk-taking in house culture in an org that has low tolerance for risks (see iJC3)\n5. Has experience and product management skills that can help navigate issues with   \u00232-4\n\nPeople who are good at all these 5 things are //rare//."}, {"id": 50671463, "au": "pixl97", "dom": 183, "sr": 39, "sc": 2.65, "ep": 6.15, "bs": 2.54, "d": 7, "age": 2.37, "grav": 14.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 15, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.591, "fa": 0.42, "gp": 0.838, "bl": 0.96, "ds": 0.0, "txt": "What and what?\n\nNo, the media at least in the US does not check with the government before publishing in most cases. Especially when it's posted on places like social media first, and then confirmed from other sources later.\n\n>The government must be giving them the all-clear or they would be going to prison\n\nGoing by the constitution itself, no. Now in some cases they may go after journalists later, but publishing first is what happens.\n\nThe number of attacks recently has got a lot of interest from viewers, they'll report any instance they can. Works the same way for plane crashes. Lots of small aircraft crash, around 3 per day on average. You almost never hear about it until some large aircraft crashes and then you end up seeing much more media attention to said small crashes."}, {"id": 50668936, "au": "notatoad", "dom": 64, "sr": 40, "sc": 2.63, "ep": 4.17, "bs": 0.0, "d": 2, "age": 6.21, "grav": 44.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 93, "qw": 0, "k": 26079, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.648, "fa": 0.0, "gp": 0.205, "bl": 0.0, "ds": 0.0, "txt": "surely not the air force's cloud service. but yes, multi-cloud is not an inherently bad idea.  lots of orgs are balancing resources across cloud providers.\n\nyou'll see the opposite comment to this in any thread about a cloud provider outage: \"why on earth would you depend on a single cloud provider for a critical service\".  it's just the usual hacker news reactionary response to any problem: well obviously that was a dumb way to build it.  every possible way to build a thing is dumb for some reason, and every choice is an acceptance of some trade-offs."}, {"id": 50667859, "au": "zbentley", "dom": 55, "sr": 41, "sc": 2.62, "ep": 4.16, "bs": 0.0, "d": 2, "age": 7.91, "grav": 62.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.394, "fa": 0.22, "gp": 0.178, "bl": 0.0, "ds": 0.0, "txt": "As a general rule, full time fed DevOps/SWE/architect folks were incredibly rare before DOGE, and were unlikely to be targeted/considered for most of the layoffs and firings over the last few years.\n\nLike, I don't agree with the layoffs/firings; definitely with you that this was a bad move. But in-house dev/ops expertise was extremely unusual, and unevenly distributed by agency. The vast majority of software/infra work in civil service was already contracted out (again, there were bright spots, but few), and I'm told by folks I trust that most non-critical systems in the military were as well.\n\nPahlka's \"Recoding America\" gives a highly accurate description of the situation, which has not materially changed--DOGE or no DOGE--much since it was written."}, {"id": 50670031, "au": "rsoto2", "dom": 159, "sr": 42, "sc": 2.42, "ep": 3.3, "bs": 0.0, "d": 1, "age": 4.72, "grav": 30.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 140, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.405, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "\"bad idea\" and not a nefarious plot by the world's richest man whose DOGE agency could've been the easiest attack vector to exploit gov systems and wait until the right time? Elon's multiple houses should be ransacked, the same as everyone in the Epstein files. But we're over here arguing about how \"ai is so powerful\""}, {"id": 50670061, "au": "rsoto2", "dom": 184, "sr": 43, "sc": 2.4, "ep": 3.72, "bs": 0.0, "d": 1, "age": 4.67, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 140, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.582, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Two things can be true at once. This could be great excuse to close down the space.\n\nAlso, we allowed Shitlon access to all gov databases and networks, gave his DOGE script kiddies top secret clearance. None of you think that he could've been an exploit vector for much smarter players e.g. Putin?\n\nShitlon's homes and businesses should be ransacked but he's safe under Jensen's leather jacket because morons in the US and this forum worship CEOs."}, {"id": 50670842, "au": "Eridrus", "dom": 39, "sr": 44, "sc": 2.39, "ep": 3.93, "bs": 0.0, "d": 5, "age": 3.42, "grav": 21.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 0, "k": 6302, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.262, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks, I wasn't aware of these, you're right that there are some non-GS bands, but SL-2 is like 20% more than GS-15, so we're still talking pretty low pay for tech at the absolute top of the ladder.\n\nEven if you look at just DevOps pay, 228k is 75th percentile on levels.fyi in the US, which is a problem if that's where your pay scale absolutely tops out at. And 228k is like 50th percentile SWE pay. And I strongly doubt the government is going to pay their top bracket to the median software engineer.\n\nApparently there's a big carve out to pay physicians market rates so that the VA isn't just staffed with people who couldn't get a job elsewhere, so that's at least a potential path to solving this if Congress wanted.\n\nBut there's really no current path to paying anyone market rate for SWE work in the federal government."}, {"id": 50668638, "au": "nradov", "dom": 108, "sr": 45, "sc": 2.31, "ep": 3.34, "bs": 0.0, "d": 1, "age": 6.67, "grav": 48.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 44337, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 0.947, "fa": 0.0, "gp": 0.769, "bl": 0.0, "ds": 0.0, "txt": "I'm pretty sure that regular employees or military personnel still aren't allowed to work with or access classified material at home. Some VIPs have had SCIFs installed at their homes to do so."}, {"id": 50667098, "au": "asdfsa32", "dom": 162, "sr": 46, "sc": 2.27, "ep": 2.56, "bs": 0.0, "d": 1, "age": 9.0, "grav": 74.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 688, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 1.089, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Your language is probably a bit on the nose but you're correct. Most people can't comprehend how doggedly and persistent a well prompted and obliterated model can get, relentless, no sleep, no tiredness, around the clock, banging every door and crack. It is like we have invented machine guns and people are still shielded for muskets at best if not bow and arrows."}, {"id": 50668659, "au": "SkipperCat", "dom": 92, "sr": 47, "sc": 2.17, "ep": 3.71, "bs": 0.0, "d": 3, "age": 6.64, "grav": 48.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 2789, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.273, "bl": 0.0, "ds": 0.0, "txt": "Fair point about S3, AWS does provide an added value above just having a hard drive.\n\nMy concern is when government contractors subcontract every part of a project and mark it up without really adding any value.  They can do that because the DoD procurement rules are so complex and there is so many regulatory barriers that it is crazy hard for a smaller vendor to sell to the government."}, {"id": 50668259, "au": "walljm", "dom": 47, "sr": 48, "sc": 2.13, "ep": 3.67, "bs": 0.0, "d": 3, "age": 7.26, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 100, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 1.56, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you have a contract that requires it, a commercial company can submit people for clearance.  TS/SCI clearances take on average 12-18 months to obtain for new individuals with no prior clearances, and cost 40k-80k.  So its an investment...  Many defense contractors who provide services spend a significant amount of time and effort building stables of cleared individuals so they can compete on contracts that require them."}, {"id": 50671045, "au": "notesinthefield", "dom": 125, "sr": 49, "sc": 1.88, "ep": 3.43, "bs": 0.0, "d": 5, "age": 3.05, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 371, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I was, a tremendously bad org that was very close to an IG visit. I was the only person on our ten person Sec team with a deep technical background and I got tired of the theater. Ive never met another ISSO that held a senior level IT role."}, {"id": 50672425, "au": "cduzz", "dom": 13, "sr": 50, "sc": 1.85, "ep": 3.39, "bs": 0.0, "d": 6, "age": 0.36, "grav": 4.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 2127, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 0.837, "fa": 0.5, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think that probably depends on if the problem really needs to be solved or if it only kinda needs to be solved.\n\nFor instance, in Ukraine -- \"but we had a contract\" is really small comfort.\n\nSo at some point actual ability to execute trumps the ability to deflect ownership."}, {"id": 50668021, "au": "rfgplk", "dom": 116, "sr": 51, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 1, "age": 7.62, "grav": 58.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 86, "kpp": 0.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.433, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "AI is simply that good. I got my Claude sub banned when Claude itself managed to escape it's sandbox VM and gain root access at it's hosted instance. The prompt was literally \"inspect your sandbox environment and attempt to gain root\" in the web interface. Opus 5.5."}, {"id": 50669360, "au": "pixl97", "dom": 179, "sr": 52, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 3, "age": 5.61, "grav": 38.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 23445, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.418, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "China has the same internal security concerns as the US does and is already doing some internal clap back on open models.\n\nThey are at high risk of being cyber attacked too, also bots spreading false news. Once things become too risky they'll leave some smaller dumb models around but big models will be highly regulated."}, {"id": 50669520, "au": "EmX_3000", "dom": 135, "sr": 53, "sc": 1.78, "ep": 2.88, "bs": 0.0, "d": 2, "age": 5.41, "grav": 36.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 214, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.052, "fa": 0.0, "gp": 0.282, "bl": 0.0, "ds": 0.0, "txt": "They obiovusly have, The Fappening was either a hack or improper use of tools that normally require a warrant to obtain data that shouldn't have been accessed."}, {"id": 50667785, "au": "heeton", "dom": 81, "sr": 54, "sc": 1.71, "ep": 2.15, "bs": 0.0, "d": 2, "age": 8.0, "grav": 63.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 1126, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.561, "fa": 0.0, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "Further aside: I wonder what their brand guidelines are. Their logo is \"0xide\", but their press and other collateral is all \"Oxide\".\n\nI suspect their official name is plain alpha, and the leading zero is incorrect in text."}, {"id": 50668227, "au": "MisterMunchkin", "dom": 87, "sr": 55, "sc": 1.68, "ep": 3.22, "bs": 0.0, "d": 1, "age": 7.31, "grav": 55.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1107, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.148, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "I do like how swanky their products look, I think they're definitely on to something. AWS is awesome, but if you're a government agency who knows exactly what they'll need for the next five years, being able to just put some servers in your building is quite appealing. You could air-gap them, they won't go down because of route53..."}, {"id": 50671414, "au": "asdff", "dom": 95, "sr": 56, "sc": 1.68, "ep": 6.15, "bs": 3.05, "d": 6, "age": 2.47, "grav": 14.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 160, "qw": 0, "k": 16559, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.754, "fa": 0.28, "gp": 0.848, "bl": 1.15, "ds": 0.0, "txt": "The thing with these companies is they have the edge in terms of various domain talent to route around these rules in various ways to preserve margin. They have the edge in talent acquisition from the outset as well as poaching.\n\nAs soon as you formalize the rules, plans are being made to route around them and preserve margin by some other means.\n\nMaybe what would be better would be a sort of authoritarian secret police of auditing. Some byzantine faceless three letter org that will rubber stamp \"no\" if this contract smells like bullshit by any assortment of metrics the analyst in charge of approvals happens to lean on. No one or a couple factors, a context dependent approach of a smattering of factors, real and perceived through other cofactors, like what anyone would do pricing if a deal is a good value or not, not bound by policy or process.\n\nOf course, nothing moves without precedent in government, so this will probably never happen."}, {"id": 50667547, "au": "robrain", "dom": 168, "sr": 57, "sc": 1.68, "ep": 3.1, "bs": 0.0, "d": 3, "age": 8.35, "grav": 67.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 323, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.319, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Do it to yourself first seems to be the obvious way. Or found a white hat organization to do it for a fee. Apply the findings iteratively if possible to start improving security ASAP.\n\nWill introduce new bugs, so welcome to the rest of time."}, {"id": 50669241, "au": "hunter2_", "dom": 123, "sr": 58, "sc": 1.68, "ep": 3.05, "bs": 0.0, "d": 4, "age": 5.8, "grav": 40.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 3643, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 0.392, "fa": 0.68, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "I have no gov experience, but when I first familiarized myself with NIST SP 800 through some grad classes 15 years ago, it made me suspect exactly what you're saying."}, {"id": 50669193, "au": "ecshafer", "dom": 49, "sr": 59, "sc": 1.68, "ep": 2.91, "bs": 0.0, "d": 5, "age": 5.85, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 11080, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.182, "fa": 0.0, "gp": 0.094, "bl": 0.0, "ds": 0.0, "txt": "Its tough, costs a lot of money, it takes 18 months, and if they don't have a bunch of CUI or non-classified work you are worthless for that 18 months. Sometimes places will do secret, then upgrade to top-secret. But for software, almost nothing is done secret."}, {"id": 50669524, "au": "OrvalWintermute", "dom": 38, "sr": 60, "sc": 1.68, "ep": 2.89, "bs": 0.0, "d": 4, "age": 5.41, "grav": 36.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1146, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 1.229, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This isn't correct.\n\nActual federal employees cap out at SES, SL and ST but there are tradeoffs involved with being a C-level, or, a prominent technologist/scientist on the SL/ST scales.\n\nThere are large distinctions between the GS grades of specific agencies, as some like Treasury, SEC and others have GS grades that go into SES/SL/ST ranges e.g. >250k."}, {"id": 50671424, "au": "sheepscreek", "dom": 99, "sr": 61, "sc": 1.68, "ep": 5.55, "bs": 2.68, "d": 2, "age": 2.44, "grav": 14.7, "surf": 5.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 96, "qw": 0, "k": 2962, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": ["https://oxide.computer/principles"], "ig": 1.213, "fa": 0.62, "gp": 0.641, "bl": 1.01, "ds": 0.0, "txt": "Oh no, no shares. No connection with them. But as a coincidence long after I discovered oxide, I found out the founder worked at Sun Microsystems which I do have a lot of respect for. He’s modelled the culture around the best of Sun Microsystems, to build an honest-to-goodness business.\n\nI think such businesses should be celebrated, more so in today’s time. It matters that this isn’t coming from an employee who suggested “don’t do evil” but the founder himself. So yes. I want them to succeed and plant the seed of honesty and kindness as far as possible.\n\nFor the curious: https://oxide.computer/principles"}, {"id": 50667617, "au": "SecretDreams", "dom": 104, "sr": 62, "sc": 1.68, "ep": 2.87, "bs": 0.0, "d": 3, "age": 8.23, "grav": 65.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 1508, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 1.22, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Word of mouth drives everything. If you are on the internet, you're being advertised to. Either explicitly by paid advertising or implicitly by individuals who might benefit from the product succeeding (maybe they have shares, are employed there, etc).\n\nThere's also still organic conversation, but we're fooling ourselves if we think we can differentiate the intent between the two."}, {"id": 50668635, "au": "ghc", "dom": 65, "sr": 63, "sc": 1.68, "ep": 2.85, "bs": 0.0, "d": 1, "age": 6.67, "grav": 48.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 4101, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "technical_department", "flbl": "Technical & Department (Isso)", "urls": [], "ig": 0.756, "fa": 0.0, "gp": 0.741, "bl": 0.0, "ds": 0.0, "txt": "Well, the Air Force has that too. But it doesn’t have all the features that, say, AWS has. Just getting GPU access is a pain. So I can see the appeal…but with 4 vendors it sounds like politics got in the way."}, {"id": 50667392, "au": "SteveNuts", "dom": 163, "sr": 64, "sc": 1.68, "ep": 2.72, "bs": 0.0, "d": 2, "age": 8.56, "grav": 69.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 4112, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 0.818, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "I keep seeing this, but what are the most pragmatic ways to try to defend yourself?\n\nLike what assumptions from “the before times” are now outdated and what are the first things everyone should be doing in order of priority?\n\nI don’t want to just sit around waiting for it to happen even if it’s inevitable, I want to try to do something about it but I don’t know where to start"}, {"id": 50667514, "au": "fintechjock", "dom": 166, "sr": 65, "sc": 1.68, "ep": 2.71, "bs": 0.0, "d": 3, "age": 8.4, "grav": 67.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 96, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.152, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't know the answer to my own question, but here's one assumption that might not hold anymore: that an attacker with unlimited time and resources will always find a way in.\n\nIn theory, code can be made perfect. So is this just a matter of time? Do defenders eventually work through the backlog of bad code until there's nothing left to exploit?"}, {"id": 50667237, "au": "SkipperCat", "dom": 90, "sr": 66, "sc": 1.68, "ep": 2.69, "bs": 0.0, "d": 1, "age": 8.82, "grav": 72.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 2789, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 0.482, "fa": 0.34, "gp": 0.405, "bl": 0.0, "ds": 0.0, "txt": "My guess is that Lockheed Martin or similar will win the bid and purchase/deploy and Oxide solution and then bill 30% markup on the actual cost."}, {"id": 50672442, "au": "openasocket", "dom": 109, "sr": 67, "sc": 1.68, "ep": 2.67, "bs": 0.0, "d": 1, "age": 0.32, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 5045, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.134, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I can’t speak for all classified networks, but the ones I’m aware of are still air-gapped, accessible only in a SCIF, with specialized hardware to automate 1-way transfer of data into the network."}, {"id": 50668928, "au": "cowlevel", "dom": 93, "sr": 68, "sc": 1.68, "ep": 3.51, "bs": 0.85, "d": 4, "age": 6.23, "grav": 44.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.081, "fa": 0.34, "gp": 0.0, "bl": 0.32, "ds": 0.0, "txt": "If someone is getting let's say a 100% markup just by knowing the rules, standard capitalist logic goes that you should also learn the rules and earn that markup\n\nBy the same logic I'll sell you S3 compatible storage for half the price of S3. You don't want it though, because I have less redundancy and only a hundred TB of total space available."}, {"id": 50669271, "au": "moron4hire", "dom": 5, "sr": 69, "sc": 1.68, "ep": 2.58, "bs": 0.0, "d": 4, "age": 5.76, "grav": 39.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 12247, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "clearance_sci", "flbl": "Clearance & Sci (Access)", "urls": [], "ig": 0.875, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "The problem with contracting is that the same lack of domain experience that leads to the decision to hire a contractor also makes it nearly impossible for the client to evaluate the quality of contractors. So, it's very easy for such a client to get duped by the lowest bidder."}, {"id": 50669310, "au": "latentsea", "dom": 74, "sr": 70, "sc": 1.68, "ep": 2.54, "bs": 0.0, "d": 1, "age": 5.7, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.388, "bl": 0.0, "ds": 0.0, "txt": "OK, remember this when you're trying to reason through AI takeover scenarios and how they might move laterally through computer systems. This is the average level of competence displayed by humans."}, {"id": 50669866, "au": "willmadden", "dom": 180, "sr": 71, "sc": 1.68, "ep": 2.45, "bs": 0.0, "d": 4, "age": 4.93, "grav": 32.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 215, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "media_hacked", "flbl": "Media & Hacked (Models)", "urls": [], "ig": 1.043, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's no way that would hold up to a lawsuit in the US. The government isn't allowed to gift itself an override to the 1st and 4th Amendment.\n\nThat's why this \"cyberattack\" narrative is likely nothing more than manufacturing a casus belli to do exactly that."}, {"id": 50671807, "au": "mpyne", "dom": 32, "sr": 72, "sc": 1.68, "ep": 2.39, "bs": 0.0, "d": 4, "age": 1.68, "grav": 10.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 8377, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "security_rules", "flbl": "Security & Rules (Value)", "urls": [], "ig": 1.017, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There’s absolutely incentive to compete, bureaucratic turf wars can be vicious and are reason enough. Be responsible for a digital turd for too long and your system’s budget will be schwacked and given to an office run by one of your frenemies.\n\nThe paperwork, on the other hand, is very real. If there’s anything government is good at, it’s internal stop energy."}, {"id": 50670607, "au": "jimnotgym", "dom": 16, "sr": 73, "sc": 1.68, "ep": 2.39, "bs": 0.0, "d": 2, "age": 3.83, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 11111, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 0.698, "fa": 0.0, "gp": 0.514, "bl": 0.0, "ds": 0.0, "txt": "But this project was to move to the cloud,  presumably meaning that it wasn't in the cloud before,  presumably meaning they already had their own servers and staff?"}, {"id": 50670540, "au": "zbentley", "dom": 34, "sr": 74, "sc": 1.68, "ep": 2.37, "bs": 0.0, "d": 4, "age": 3.97, "grav": 24.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 159, "qw": 0, "k": 6253, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cloud_inhouse", "flbl": "Cloud & In-house (Service)", "urls": [], "ig": 0.743, "fa": 0.22, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don't think that's what procurement people are comparing, though I wish it were. Per-head spend on technical/digital buildout contracts is rarely considered separately from the lump spend.\n\nThe fact is that specialized GS hiring is so hard and time consuming to do (I want to throw OPM specialist position approval processes out of a very high window) that it's usually not considered as an alternative to contracting in the first place.\n\nInstead, the choice is almost always between \"new contract\" (unproven, expensive, pain in the ass ramp-up time, more workload onto CO/procurement/oversight, all the usual misaligned incentives problems) and \"expand existing contract\" (cheaper and faster to start work, but multiply the misaligned-incentives problems by 10).\n\nGe     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
