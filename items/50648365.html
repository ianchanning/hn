_top_k": 20, "ablations": [], "tournament": [], "comments": [{"id": 50649498, "au": "swatcoder", "dom": 3, "sr": 1, "sc": 11.79, "ep": 11.79, "bs": 0.0, "d": 0, "age": 17.66, "grav": 213.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 31, "qw": 0, "k": 14897, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "cpp_llama", "flbl": "Cpp & Llama (Results)", "urls": ["https://github.com/alesha-pro/llm.asm/blob/main/README.md"], "ig": 0.903, "fa": 2.63, "gp": 1.497, "bl": 0.0, "ds": 0.0, "txt": "It looks like this is one subproject in a larger exercise and the top-level README presents the benchmarks that peg this against a pure-assembly Linux ELF (also in this repo) and llama.cpp:\n\nhttps://github.com/alesha-pro/llm.asm/blob/main/README.md"}, {"id": 50651074, "au": "Farmadupe", "dom": 45, "sr": 2, "sc": 6.13, "ep": 6.13, "bs": 0.0, "d": 1, "age": 14.18, "grav": 150.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 161, "qw": 0, "k": 167, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "cpp_llama", "flbl": "Cpp & Llama (Results)", "urls": [], "ig": 1.642, "fa": 0.62, "gp": 0.349, "bl": 0.0, "ds": 0.0, "txt": "There's a few reasons why everyone is \"beating\" llama.cpp at the moment:\n\n- llama.cpp is a general purpose inference engine designed to have acceptable performance on any hardware. You can now prompt an LLM to \"write an inference engine from scratch for qwen3-0.6b that gets 90% of the theoretical performance of the GPU in this computer\" and get a faster inference engine in less than an hour.\n\n- A lot of the people who prompt their way to a faster engine cheat without realizing it. The two main ways are\n\n    1) Delete some of the model (there was a recent spate of people on reddit claiming ever faster performance with qwen3.8-flash-next using a technique called expert pruning that is basically deleting part of the model and hoping that you still get usable results)\n\n    2) Quantize the model more. For token generation, quantizing a model results in a speedup directly proportional to how much you quantized it.\n\nBoth expert pruning and overquantization lobomotize a model and neither technique survives contact with reality."}, {"id": 50652262, "au": "NitpickLawyer", "dom": 10, "sr": 3, "sc": 5.99, "ep": 5.99, "bs": 0.0, "d": 1, "age": 10.91, "grav": 99.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 11, "k": 5986, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "data_processor", "flbl": "Data & Processor (Guess)", "urls": [], "ig": 1.063, "fa": 0.76, "gp": 0.914, "bl": 0.0, "ds": 0.0, "txt": ">  LLMs could in the near future be the “OS” in a sense\n\nIf you want to see how much against this notion people were, go back to karpathy's same take in 2023. Today it's much closer than it was and as evident in the comments below, people have done bits and pieces of this already.\n\nIt has become evident that LLMs can serve as an input layer at least. Understand intent, and work with \"tools\" to facilitate that. What will be interesting to watch is how several concepts will further merge, and lines blurred between APIs, ABIs, runtimes, frameworks and libraries. There's a future where these all become \"combined\" somehow into software on demand, based on an intent. I want a document processor that tabulates data in this format and outputs visualisations in this other format for each event that looks like this, coming from this data source."}, {"id": 50650170, "au": "octoberfranklin", "dom": 53, "sr": 4, "sc": 4.89, "ep": 4.89, "bs": 0.0, "d": 0, "age": 16.33, "grav": 187.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 1952, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": ["https://en.wikipedia.org/wiki/Blue_Pill_%28software%29"], "ig": 1.19, "fa": 0.62, "gp": 0.222, "bl": 0.0, "ds": 0.0, "txt": "Hrm, raw asm no libc/syscall dependencies... that means it can run in SMM (\"ring negative 2\"), and inject its binary into a hypervisor.\n\nSo now you can strap an LLM into your Blue Pill exploit https://en.wikipedia.org/wiki/Blue_Pill_%28software%29\n\nLet's just hope this thing doesn't develop the urge to self-propagate."}, {"id": 50650802, "au": "Revanche1367", "dom": 9, "sr": 5, "sc": 4.52, "ep": 4.66, "bs": 0.0, "d": 0, "age": 14.94, "grav": 162.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 487, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 1.219, "fa": 0.0, "gp": 1.241, "bl": 0.0, "ds": 0.0, "txt": "I was just ruminating as a sort of joke on HN a couple of days ago that LLMs could in the near future be the “OS” in a sense, directly running on metal and launch other programs, perhaps even generate them from scratch on the fly. People weren’t very appreciative it seemed, but nice to see others have been going farther ahead with a similar thought process."}, {"id": 50650693, "au": "george_max", "dom": 6, "sr": 6, "sc": 4.45, "ep": 4.45, "bs": 0.0, "d": 0, "age": 15.17, "grav": 167.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 210, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 1.313, "fa": 0.0, "gp": 0.942, "bl": 0.0, "ds": 0.0, "txt": "For smaller models on scarce compute, this could be useful for optimizing speed. But for frontier models, the additional layer -- that is, Linux or other management tools to host it -- is incredibly minimal in terms of resource allocation relative to the resources used by the frontier model.\n\nApart from this, I really don't think there is a benefit or use case. Maybe an ASIC instead of a GPU would be more beneficial to LLMs in terms of efficiency."}, {"id": 50650913, "au": "daniel_iversen", "dom": 15, "sr": 7, "sc": 3.22, "ep": 3.51, "bs": 0.0, "d": 1, "age": 14.6, "grav": 157.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 1510, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "actual_windows", "flbl": "Actual & Windows (Etc)", "urls": [], "ig": 0.507, "fa": 0.34, "gp": 0.933, "bl": 0.0, "ds": 0.0, "txt": "100% I'd love to have a \"phone\" with just a blank AI speech interface and optionally a text one for when you're in public, and some cached icons of your last activities etc. Would be awesome. I hope someone will create an Android/AOSP type of launcher app to make that happen, so we can try to see what the future will feel like."}, {"id": 50655694, "au": "o_-_o", "dom": 4, "sr": 8, "sc": 3.13, "ep": 3.13, "bs": 0.0, "d": 0, "age": 3.18, "grav": 19.3, "surf": 10.9, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 65, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 1.183, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "Please release a \"OS.ASM\" without AI :-) \"A standalone bootable x86-64 operating system that runs directly on hardware or KVM with no Linux, no Windows, no C, no Rust, and no libc.\" Maybe have some basic tools like ssh/curl built in. This will be much more useful to everyone."}, {"id": 50649577, "au": "hankbond", "dom": 32, "sr": 9, "sc": 2.65, "ep": 2.65, "bs": 0.0, "d": 0, "age": 17.52, "grav": 210.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 569, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Results)", "urls": [], "ig": 0.623, "fa": 0.0, "gp": 0.817, "bl": 0.0, "ds": 0.0, "txt": "Pretty cool as a concept, reminds me of the self-booting disks from back in the day.  Is there much use of a model this small without a harness and stuff to interact with tho?"}, {"id": 50650948, "au": "bhouston", "dom": 35, "sr": 10, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 0, "age": 14.52, "grav": 155.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 21226, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_processor", "flbl": "Data & Processor (Guess)", "urls": [], "ig": 0.694, "fa": 0.0, "gp": 0.643, "bl": 0.0, "ds": 0.0, "txt": "If this works well, I could imagine this is how LLMs would be served in the data center. just need a network stack and some type of isolation?  I guess the isolation requires a hypervisor or OS of some sort and then we may be back into the same issue that we need an OS."}, {"id": 50652779, "au": "grondilu", "dom": 21, "sr": 11, "sc": 2.3, "ep": 2.96, "bs": 0.0, "d": 2, "age": 9.59, "grav": 82.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1865, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 1.258, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "To me it's quite an amazing coincidence that I stumble upon this concept just a few minutes after learning about skeuomorphism.\n\nIt is indeed very true that the way we designed operating system was very much articulated around the fact that computers were not capable of understanding human language, let alone translate it directly into machine code."}, {"id": 50652316, "au": "qingcharles", "dom": 34, "sr": 12, "sc": 2.16, "ep": 2.3, "bs": 0.0, "d": 2, "age": 10.77, "grav": 98.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 12423, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Results)", "urls": [], "ig": 0.981, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Right, this setup is perfect. You just send in your prompts and get your output, same as you do with any regular llama.cpp setup. All the harness etc is on your desktop. This essentially is just a Token Appliance. I think it's a great idea to remove almost all the OS bits that aren't needed."}, {"id": 50653543, "au": "sandworm101", "dom": 7, "sr": 13, "sc": 1.54, "ep": 2.13, "bs": 0.0, "d": 1, "age": 7.78, "grav": 60.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 34406, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Lack of an underlying OS significantly reduces the potential attack surface. That is a big win for a long-term deployment of a connected system. It also means much greater predictability and reliability over time. No silly OS fonts update should ever brick such a device."}, {"id": 50650705, "au": "mohamedkoubaa", "dom": 44, "sr": 14, "sc": 1.49, "ep": 1.86, "bs": 0.0, "d": 0, "age": 15.15, "grav": 166.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 471, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "cpp_llama", "flbl": "Cpp & Llama (Results)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.234, "bl": 0.0, "ds": 0.0, "txt": "Is llama.cpp really that optimized? Seems like a lot of projects are using it as a metric and claiming to have beat it."}, {"id": 50655035, "au": "alpaca128", "dom": 14, "sr": 15, "sc": 1.13, "ep": 2.23, "bs": 0.0, "d": 2, "age": 4.33, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 8747, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "system_directly", "flbl": "System & Directly (Joke)", "urls": [], "ig": 0.951, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I hope this never becomes the default.\nNothing on a computer system annoys me as much as software actively working against me by trying to help based on broken heuristics.\n\nIt would be nice if it could, say, automatically filter items on a website or do repetitive things that are just a bit too dynamic for a macro/script. It better not do that without asking or with popups resembling what Clippy did on Windows, though I'm not getting my hopes up."}, {"id": 50649859, "au": "thebeardisred", "dom": 50, "sr": 16, "sc": 0.92, "ep": 0.92, "bs": 0.0, "d": 0, "age": 16.97, "grav": 199.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 2063, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_processor", "flbl": "Data & Processor (Guess)", "urls": [], "ig": 0.326, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Well, I guess one way to remove an attack vector is just to not have syscalls.\n\nedit: ...but also now I need to see which mode this is running in processor wise."}, {"id": 50652342, "au": "DoesntMatter22", "dom": 22, "sr": 17, "sc": 0.68, "ep": 1.13, "bs": 0.0, "d": 2, "age": 10.68, "grav": 96.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 689, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "data_processor", "flbl": "Data & Processor (Guess)", "urls": [], "ig": 0.479, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "This was great. I don't know that I want to use anything like that but maybe I would. Certainly it's going to get much better over time. Already it's affordable if it was in monthly payments I'd guess."}, {"id": 50651573, "au": "pizzafeelsright", "dom": 17, "sr": 18, "sc": 0.64, "ep": 2.71, "bs": 1.19, "d": 1, "age": 12.82, "grav": 128.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
