ommentary"}], "source_categories": [{"category": "general_web", "count": 17}, {"category": "lwn_systems", "count": 1}, {"category": "low_cred_or_joke", "count": 1}], "story_anchors": ["security", "response", "slow", "kernel", "available", "linux", "recent", "ubuntu", "fix", "version", "free", "kernels", "system", "nov", "supported", "cve-2026", "updates", "stack"], "largest_root": {"root_id": 50649094, "author": "RVuRnvbM2e", "slots": 52, "start_dom": 1, "end_dom": 52, "share_pct": 21.1, "top_dom1_age": 20.3, "top_dom1_author": "RVuRnvbM2e"}, "buried_cutoff": 74, "rescue_top_k": 49, "ablations": [], "tournament": [], "comments": [{"id": 50651062, "au": "usr1106", "dom": 3, "sr": 1, "sc": 11.88, "ep": 11.88, "bs": 0.0, "d": 2, "age": 16.14, "grav": 184.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 65, "qw": 0, "k": 4963, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": ["https://lwn.net/Articles/1108909/"], "ig": 1.13, "fa": 3.03, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": "The latest stable kernels had between 1700 and 3300 patches. And there were 7 of them at the same time  https://lwn.net/Articles/1108909/\n\nI have no clue how a single person (Greg) manages this.\n\nBut Ubuntu does not follow those? So they have to handle the flood on their own. And they don't have 7 kernels to maintain, but something like 100.\n\nEdit: Numbers were quoted wrong from memory. Should now match the linked article."}, {"id": 50650925, "au": "frenchtoast8", "dom": 61, "sr": 2, "sc": 11.66, "ep": 11.66, "bs": 0.0, "d": 1, "age": 16.5, "grav": 190.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 145, "qw": 0, "k": 620, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": ["https://explore.alas.aws.amazon.com/CVE-2026-98432.html"], "ig": 1.586, "fa": 2.13, "gp": 1.284, "bl": 0.0, "ds": 0.0, "txt": "My $DAYJOB moved everything from Ubuntu to Amazon Linux 2023 and I'm not sure that it's better. According to this page[1] AL2023 didn't have an update for CVE-2026-98432 until Nov 2. That's better than Ubuntu but still more than 2 weeks after Debian had a patch available.\n\nThe argument I've heard is that Debian didn't promote it to stable until Nov 2 either, but at least it was possible to install it via proposed-updates. You didn't have the option on AL2023. Also problematic: by default AL2023 has its packages frozen in time, so to install the patch it's instead recommended to replace the instance with a new AMI build with the desired package preinstalled. This requires waiting for AWS to build it, which could be even later. I can't find the earliest date the AL2023 AMI had the patch installed, so I'm just assuming it was Nov 2 but it could have been worse too.\n\n1: https://explore.alas.aws.amazon.com/CVE-2026-98432.html"}, {"id": 50651103, "au": "throw0101c", "dom": 107, "sr": 3, "sc": 10.81, "ep": 10.81, "bs": 0.0, "d": 3, "age": 16.06, "grav": 182.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 63, "qw": 6, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": ["https://en.wikipedia.org/wiki/Ubuntu_version_history\u0023Table_of_versions", "https://ubuntu.com/about/release-cycle"], "ig": 1.119, "fa": 2.27, "gp": 1.177, "bl": 0.0, "ds": 0.0, "txt": "> Doesn't canonical/ubuntu sell security subscriptions?\n\nAn LTS gets five years of security updates to the public that anyone can access. On Year 6 you have to pay: so 20.04 LTS hit five years in 2025, so now you have to pay if you want to (a) stay on it, and (b) get fixes. 22.04 LTS will hit that point in June 2027, after which you have to start paying.\n\n* https://en.wikipedia.org/wiki/Ubuntu_version_history\u0023Table_o...\n\n14.04 LTS has paid support possible until 2029.\n\n* https://ubuntu.com/about/release-cycle"}, {"id": 50652749, "au": "mort96", "dom": 161, "sr": 4, "sc": 9.54, "ep": 9.54, "bs": 0.0, "d": 1, "age": 11.57, "grav": 109.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 246, "qw": 0, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.607, "fa": 1.23, "gp": 1.559, "bl": 0.0, "ds": 0.0, "txt": "Every 2 years, like clockwork, Ubuntu releases a new LTS. It's called <year>.04. I don't have to ever remember the difference between Bookworm and Bullsesye and Sid, I don't have to pay attention to release notifications etc. I always know that when April rolls around on an even numbered year, there's gonna be a new LTS.\n\nAnd I know that the old LTS is gonna be supported for some years. It's currently late 2026, so I know my Ubuntu 24.04 systems have been supported for ~2.5 years and will be supported for a few more. I know my 22.04 systems/containers are getting long in the tooth at ~4.5 years. I know my 26.04 systems are on the latest version because it's not 2028 yet. I don't have to look up release dates or support timelines, this info lives in the version number and release cadence and I can tell it at a glance.\n\nIn contrast, I believe Debian Bullseye is the latest. I keep confusing Bullseye and Bookworm as both start with B, so maybe Bookworm was the latest, but I believe it's Bullseye. I have no idea when Bullseye came out and for how long it'll stay the latest. I have containers on Bookworm, I have no idea how long that has been supported or how much longer it'll be, or even if it's still supported. I don't know when a new Debian comes out, so I don't know if I have another couple of years or mere weeks until I should start planning to move away from Bullseye. I could p"}, {"id": 50650865, "au": "doublepg23", "dom": 47, "sr": 5, "sc": 9.48, "ep": 9.63, "bs": 0.0, "d": 3, "age": 16.67, "grav": 194.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 11, "k": 2174, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.463, "fa": 1.65, "gp": 1.024, "bl": 0.0, "ds": 0.0, "txt": "> I'm sure things have changed and so the severity is lower today\n\nOP you're responding to and it's ironic you bring this up because they've had a handful of high-impact CVEs which were due to unexpected interactions with using musl instead of glibc. See CVE-2026-123158 and CVE-2026-107891.\n\nHowever their security response to both was extremely stellar and professional. I suppose I'm valuing velocity and professionalism here."}, {"id": 50656244, "au": "cube00", "dom": 217, "sr": 6, "sc": 9.4, "ep": 9.4, "bs": 0.0, "d": 4, "age": 4.25, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 133, "qw": 0, "k": 7525, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": ["https://docs.fedoraproject.org/en-US/project/\u0023_what_is_fedora_all_about"], "ig": 1.962, "fa": 0.96, "gp": 1.416, "bl": 0.0, "ds": 0.0, "txt": "It can move a little too quickly for production, you have major version upgrades every six months, every six months the n-1 version exits support so at minimum you'll need to do a major version upgrade every year.\n\nIf you wait the full year you only have 30 days to get off n-1 because at that point your n-1 is really n-2 with three major versions in play.\n\nWe recognize that there is also a place for long-term stability in the Linux ecosystem, and that there are a variety of community-oriented and business-oriented Linux distributions available to serve that need. However, the Fedora Project’s goal of advancing free software dictates that the Fedora Project itself pursue a strategy that preserves the forward momentum of our technical, collateral, and community-building progress. Fedora always aims to provide the future, first.\n\nhttps://docs.fedoraproject.org/en-US/project/\u0023_what_is_fedor..."}, {"id": 50656849, "au": "seba_dos1", "dom": 174, "sr": 7, "sc": 9.07, "ep": 9.21, "bs": 0.0, "d": 6, "age": 3.17, "grav": 19.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 84, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.683, "fa": 1.26, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "> while Debian tends to use codenames for their releases in announces, documentation and whatnot.\n\nDoes it? From latest announcements:\n\n> Updated Debian 13: 13.8 released\n\n> Debian 11 Long Term Support reaches end-of-life\n\n> Updated Debian 12: 12.15 released\n\nThere's also:\n\n> Security support for Bookworm handed over to the LTS team\n\n...but that's clearly in minority.\n\nFrom release page:\n\n>  The Debian 13 life cycle encompasses five years\n\nFrom release notes:\n\n> Release Notes for Debian 13 (trixie)\n\n> 2. What’s new in Debian 13\n\nFrom installation guide:\n\n> This document contains installation instructions for the Debian GNU/Linux 13 system (codename “trixie”),\n\n> Installing Debian GNU/Linux 13 for amd64\n\nFrom download page:\n\n> This page has options for downloading and installing Debian 13.8.0, the stable release.\n\nCodenames are mentioned and used at times, but the primary way to refer to releases across announcements and documentation appears to be their version number.\n\nUbuntu also has codenames that are being used in announcements quite similarly to how Debian's are. In contexts where only codenames are used, such as repository-related tools, Ubuntu uses codenames too (\"2026-10-20 Reflect stonking release, add tenacious, remove questing.\"). One thing they do that Debian doesn't is keeping their codenames in alphabetical order though."}, {"id": 50657905, "au": "cillian64", "dom": 162, "sr": 8, "sc": 8.79, "ep": 9.08, "bs": 0.0, "d": 2, "age": 1.43, "grav": 9.2, "surf": 6.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 44, "k": 812, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.5, "fa": 1.37, "gp": 1.143, "bl": 0.0, "ds": 0.0, "txt": "> I don't know when a new Debian comes out, so I don't know if I have another couple of years or mere weeks until I should start planning to move away from Bullseye. I could probably find all of that out, but it's nice that I don't have to with Ubuntu.\n\nI'll admit that IIRC the exact release dates are not guaranteed, and this is more confusing than it could be, but here's my understanding:\n\nIn practice Debian does a new stable release every 2 years.  The release spends 2 years as \"stable\" where it gets lots of updates, after which it becomes \"oldstable\" when a new \"stable\" is released.  The Debian Security Team provide security updates for the first 3 years, followed by the LTS team providing security updates for a further 2 years. So in practice you get 5 years of security updates for every release."}, {"id": 50649094, "au": "RVuRnvbM2e", "dom": 1, "sr": 9, "sc": 8.72, "ep": 9.01, "bs": 0.0, "d": 0, "age": 20.28, "grav": 266.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 108, "qw": 24, "k": 853, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": ["https://social.kernel.org/objects/56a20bd3-d2c3-4262-8388-3ab475d000cc"], "ig": 1.326, "fa": 1.38, "gp": 1.356, "bl": 0.0, "ds": 0.0, "txt": "From the stable kernel maintainer (2025):\n\n> Along the lines of the huge number of recorded CVEs, you HAVE to take all of the stable/LTS releases in order to have a\nsecure and stable system. If you attempt to cherry-pick random patches you will NOT fix all of the known, and unknown, problems,\nbut rather you will end up with a potentially more insecure system, and one that contains known bugs. Reliance on an \"enterprise\"\ndistribution to provide this for your systems is up to you, discuss it with them as to how they achieve this result as this is what you are paying for. If you aren't paying for it, just use Debian, they know what they are doing and track the stable kernels and have a larger installed base than any other Linux distro.\n\nhttps://social.kernel.org/objects/56a20bd3-d2c3-4262-8388-3a..."}, {"id": 50648954, "au": "dwm", "dom": 100, "sr": 10, "sc": 8.08, "ep": 8.23, "bs": 0.0, "d": 1, "age": 20.48, "grav": 271.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 115, "qw": 0, "k": 37, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": ["https://access.redhat.com/solutions/7148472"], "ig": 1.929, "fa": 0.9, "gp": 0.781, "bl": 0.0, "ds": 0.0, "txt": "While you're not wrong, this is rare for Debian, and a controlled release to your own systems, regardless of source, is a reasonable and sensible precaution to take.\n\nDebian have been doing incredible security work recently; they've had good, excellent, packaged security updates to big problems like php2shell within minutes or hours of details being made public.\n\nI also note that RHEL, who are often relatively slow to provide updated packages, presumably due to the regression testing that you describe, recently published a bad kernel update to 8.10 which caused, variously, hangs, reboots, and XFS filesystem corruption on any systems that used kernel upcalls (e.g. NFS clients).\nRef: https://access.redhat.com/solutions/7148472\n\nTesting can show the presence of bugs, but not their absence."}, {"id": 50648599, "au": "gdgghhhhh", "dom": 99, "sr": 11, "sc": 7.59, "ep": 7.89, "bs": 0.0, "d": 0, "age": 21.05, "grav": 283.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 36, "qw": 0, "k": 359, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": ["https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1154101"], "ig": 1.202, "fa": 0.9, "gp": 1.723, "bl": 0.0, "ds": 0.0, "txt": "Please keep in mind that most major distros spend a lot of time on regression testing.\n\nWhile distros like Debian do an absolutely fantastic job, they have little resources for QA and regressions like this can happen:\nhttps://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1154101"}, {"id": 50654739, "au": "mort96", "dom": 164, "sr": 12, "sc": 7.55, "ep": 8.0, "bs": 0.0, "d": 3, "age": 6.81, "grav": 50.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 42, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.386, "fa": 1.1, "gp": 1.105, "bl": 0.0, "ds": 0.0, "txt": "> The longer it looks in non-mono font, the newer.\n\n> But current is Trixie.\n\nOh, interesting, so I got both the current release wrong and the order of Bookworm and Bullseye wrong. That's my point; in Ubuntu, the analogous mistake would've been to not realize that 26.04 has come out and to confuse the order of 24.04 and 22.04, which nobody would do. But thanks for the corrections.\n\n> Debian tend to update all of their packages during the support period, while Ubuntu lags behind for many. I've noticed it in 2023 and it's been this way since then.\n\nYeah this isn't a defense of Ubuntu in general. I think Debian is doing a better job overall than Ubuntu and I think Ubuntu has been getting worse over time. There's a reason I switched to Fedora in 2021 or so. But I think Ubuntu's LTS version scheme and cadence is exceptionally good, and beats both Debian and Fedora."}, {"id": 50648400, "au": "curt15", "dom": 198, "sr": 13, "sc": 7.28, "ep": 7.43, "bs": 0.0, "d": 0, "age": 21.33, "grav": 289.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 19, "qw": 0, "k": 3306, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": ["https://access.redhat.com/security/cve/cve-2026-99288", "https://access.redhat.com/security/cve/cve-2026-99312"], "ig": 0.877, "fa": 0.96, "gp": 1.814, "bl": 0.0, "ds": 0.0, "txt": "Red Hat isn't doing much better even while their customers pay handsomely:\n\nCVE-2026-99288: fix released Nov 23 (https://access.redhat.com/security/cve/cve-2026-99288)\nCVE-2026-99312: still open (https://access.redhat.com/security/cve/cve-2026-99312)"}, {"id": 50656563, "au": "ValdikSS", "dom": 6, "sr": 14, "sc": 7.1, "ep": 7.76, "bs": 0.0, "d": 5, "age": 3.68, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 1459, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.619, "fa": 0.96, "gp": 0.841, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure regarding security backports, but the regular fixes are backported if either a patch contributor or a subsystem maintainer decides so.\n\nSome maintainers don't care much about LTS kernels, and this care is shifted to the contributor (they need to add `Cc: <stable@vger.kernel.org> \u0023 6.18.x` to their submitted patch).\n\nIt's not uncommon for security patches to be backported with a delay for \"too old\" LTS kernels. CVE-2026-99288 (NoisyTCP) has been backported by Debian team for Debian 12 6.1.x kernel on 14 Nov, while official 6.1.193 release with this fix have been released only on 23 Nov (this Monday)."}, {"id": 50650838, "au": "awesome_dude", "dom": 83, "sr": 15, "sc": 7.01, "ep": 7.15, "bs": 0.0, "d": 2, "age": 16.76, "grav": 195.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 311, "qw": 0, "k": 818, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.853, "fa": 0.62, "gp": 0.711, "bl": 0.0, "ds": 0.0, "txt": "When I made the move to Ubuntu - it was driven by the following:\n\n1. I was on Slackware, and becoming tired of ensuring every package was uptodate, and dependencies were in place. This made me look for a package manager - the options at the time were `yum` or `apt` and `yum` was... difficult\n\n2. I tried the then Debian, but it did NOT like my integrated video card. This made me look for a way to get the more recent version of the kernel - the options were Ubuntu.\n\n3. Upon installing Ubuntu, everything \"just worked\" networks, Java (back in the old days if I wanted a Java runtime on my Slackware I would have to download the current one from the web, then put it in the right directory, and symlink it - great for my ego being able to do, but tiresome that I had to do it every time I reinstalled, or broke something). And, maintaining the system became a breeze - `apt-get update && apt-get upgrade`\n\nNote: the pain point with all distros at that point, and Ubuntu was no better, was upgrading to the next version OS meant delete and reinstall - which did have the effect of teaching me how to mount /home in a different partition so I didn't lose that every time too..\n\nUbuntu was a bit touch and go for upgrading for a while - sometimes you could reboot and you had the shiny new version, other times you had... some learnings on how your grub/bootable partitions were set up...\n\nThat was twe"}, {"id": 50648504, "au": "h4kunamata", "dom": 242, "sr": 16, "sc": 6.53, "ep": 6.53, "bs": 0.0, "d": 0, "age": 21.18, "grav": 286.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 135, "qw": 0, "k": 443, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.825, "fa": 0.56, "gp": 0.447, "bl": 0.0, "ds": 0.0, "txt": "You should not be running Ubuntu in 2026, if you do, you must have been living under a rock, don't complain about it.\n\nUbuntu has been evil for years now, then they moved to enforced SNAP packages, then sudo-rs forced to rollback after security issues backlash, you name it. Canonical is heavily focused into Cloud now and they have abandoned, to an extent, Ubuntu as we knew it.\n\nOn my gaming laptop I am running Linux Mint Cinnamon, it is a power house based on Ubuntu with a lot of cleanup done by the project.\n\nKnowing how Ubuntu is far gone, Mint project also has a distro called LMDE aka Linux Mint Debian Edition in case Linux Mint based on Ubuntu can no longer depends on its base.\n\nOn my Proxmox servers at home, I am running a few dozen Debian LXC containers."}, {"id": 50650006, "au": "InsidiousWombat", "dom": 112, "sr": 17, "sc": 6.51, "ep": 6.95, "bs": 0.0, "d": 1, "age": 18.59, "grav": 231.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 25, "k": 685, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.386, "fa": 0.42, "gp": 1.723, "bl": 0.0, "ds": 0.0, "txt": "Debian is definitely \"the generic one\"\n\nDebian project does a very good job of making sure it's most vanilla one out there with just enough changes to make stuff work mostly smoothly\n\n> I don't understand why there's been so much delay, this seems crucial/critical to their business, like something they should have perfected. Is there something I'm missing?\n\nDebian just ports near directly from Linux's LTS kernel\n\nUbuntu picks one version that's newest (and not always LTS IIRC) and just backports patches, which is far more work, for little returns"}, {"id": 50650489, "au": "mroche", "dom": 201, "sr": 18, "sc": 6.06, "ep": 6.57, "bs": 0.0, "d": 1, "age": 17.55, "grav": 211.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 3606, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.762, "fa": 0.28, "gp": 1.126, "bl": 0.0, "ds": 0.0, "txt": "IIRC from my time in technical sales at Red Hat, part of the issue with delivery is the QA aspect. While a package update can be quick, testing across RHEL, OpenShift, OpenStack, Ansible, etc, for:\n\n- All active major releases\n\n- All active EUS release branches\n\n- All active ELS releases\n\n- CoreOS versions\n\n- All RH managed base and layered container images that may be impacted (including OpenShift operator images)\n\ncan take a fair amount of time."}, {"id": 50654511, "au": "ValdikSS", "dom": 163, "sr": 19, "sc": 5.91, "ep": 6.35, "bs": 0.0, "d": 2, "age": 7.26, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 39, "k": 1459, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.305, "fa": 0.76, "gp": 0.77, "bl": 0.0, "ds": 0.0, "txt": ">Bullseye and Bookworm as both start with B, so maybe Bookworm was the latest, but I believe it's Bullseye\n\nThe longer it looks in non-mono font, the newer.\n\nBut current is Trixie.\n\n>I have no idea how long that has been supported or how much longer it'll be, or even if it's still supported\n\nDebian tend to update all of their packages during the support period, while Ubuntu lags behind for many. I've noticed it in 2023 and it's been this way since then.\n\nIn other words, the fact that you're using supported distro means that you can reliably expect security updates only for essential popular packages."}, {"id": 50653326, "au": "ExoticPearTree", "dom": 22, "sr": 20, "sc": 5.73, "ep": 6.17, "bs": 0.0, "d": 6, "age": 10.24, "grav": 90.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 1434, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.837, "fa": 0.34, "gp": 0.61, "bl": 0.0, "ds": 0.0, "txt": "I deployed unattended-upgrades across a fairly large number of systems with automatic reboots.\n\nCoupled with needsrestart, it is the closest you can get to “patch as soon as possible” without having to run ansible/salt/puppet to upgrade systems.\n\nRebooting an Ubuntu system takes less than a minute nowadays. Pretty sure Debian is the same.\n\nGot bitten once on a physical server running Proxmox, but the fix was easy and it works reliably.\n\nI would rather have 15 minutes of downtime on a system (average time it takes to connect to the console and reboot with a previously known good kernel) than to spend an incredible amount of time cleaning up after a breach (been there, done that, not fun at all, especially when the lawyers are called)."}, {"id": 50651318, "au": "topspin", "dom": 34, "sr": 21, "sc": 5.67, "ep": 6.11, "bs": 0.0, "d": 3, "age": 15.4, "grav": 171.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 12, "k": 7761, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.199, "fa": 0.76, "gp": 0.779, "bl": 0.0, "ds": 0.0, "txt": "> the whole debian model in general is looking pretty sketchy right now\n\nIt's looked sketchy to me for years.  When I was last dealing with deployment of containers on a daily basis (...-2025) and auditing images for known vulnerabilities, it became clear to me that Ubuntu is well behind all the curves.  Every audit of an image based on Ubuntu always yielded a lengthy collection of known issues, regardless of how fresh it might be.\n\nWhat is happening now has only amplified this enough for more prominent people to become concerned."}, {"id": 50657084, "au": "ValdikSS", "dom": 169, "sr": 22, "sc": 5.62, "ep": 6.73, "bs": 0.0, "d": 7, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 55, "qw": 0, "k": 1459, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": ["https://packages.debian.org/", "https://packages.ubuntu.com/"], "ig": 1.464, "fa": 0.62, "gp": 1.047, "bl": 0.0, "ds": 0.0, "txt": "https://packages.debian.org/ uses codenames and \"stable\", \"old stable\" names, this is a service I use very frequently.\n\nhttps://packages.ubuntu.com/ use \"codename (version)\" notation, thus easier to navigate.\n\nDebian bug tracker is all codename-based, while Ubuntu also lists the version.\n\nI won't be surprised that's a Mandela effect :D But in general Debian doesn't use versions in all the places, while Ubuntu uses versions more."}, {"id": 50650719, "au": "bombela", "dom": 69, "sr": 23, "sc": 5.49, "ep": 5.78, "bs": 0.0, "d": 3, "age": 17.06, "grav": 201.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 1886, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.816, "fa": 0.0, "gp": 1.045, "bl": 0.0, "ds": 0.0, "txt": "I remember the difference in experience was absolutely night and day between debian and the brand new ubuntu. No wifi and smartphone to ask an AI for help while starring at a black console back then. On debian nothing worked and I had to fight for everything, screen color, resolution, sound card, mounting a USB drive etc etc. On the other hand Ubuntu essentially just worked, it was probably the closest experience to MS Windows in making it possible for somebody curious without knowledge to install a functional OS."}, {"id": 50652694, "au": "npteljes", "dom": 177, "sr": 24, "sc": 5.43, "ep": 6.09, "bs": 0.0, "d": 1, "age": 11.71, "grav": 111.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 5320, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.497, "fa": 0.62, "gp": 0.556, "bl": 0.0, "ds": 0.0, "txt": "It's a great signal of trust to have precommunicated release and EOL times. And they went beyond that to offer support even after the public EOL with their special program.\n\nI have shifted to use Debian since then, but in 2010 or so Ubuntu seemed like \"the default distro\". Debian felt scary somehow back then, for the longest time I couldn't locate the install ISO from their main page for example, not sure what version to pick and so on. And it wasn't clear to me on how they are doing releases and when.\n\nComparatively, Ubuntu seemed friendlier, and also a lot of instructions on the internet were for Ubuntu. So for me, the OS just \"stuck\".\n\nOf course when I bit the bullet and switched to Debian on my workstation, I basically didn't notice a single difference while using it :) So the fears were for a bunch of nothing. But still, maybe this is how others felt as well."}, {"id": 50654508, "au": "jeroenhd", "dom": 238, "sr": 25, "sc": 5.14, "ep": 6.02, "bs": 0.0, "d": 1, "age": 7.26, "grav": 55.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.664, "fa": 0.34, "gp": 0.79, "bl": 0.0, "ds": 0.0, "txt": "Loads of big bad CVEs haven't been patched since 18.04 went out of generic support.\n\nMost of these CVEs are also not really relevant to most users. With an entire laptop consisting out outdated software, an SCTP EoP or some kind of TCP options bug that gets blocked by the firewall anyway isn't going to sway anyone.\n\nThey already have >150 kernel configurations to patch, validate, and release and people are giving them shit for not being fast enough with those. Adding even more kernels to the pile will only make the problem worse.\n\nAnd unless you're sporting some old 32-bit x86 machine, you can upgrade Ubuntu to a later version for free."}, {"id": 50655393, "au": "nijave", "dom": 123, "sr": 26, "sc": 5.13, "ep": 5.27, "bs": 0.0, "d": 1, "age": 5.61, "grav": 38.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 142, "qw": 0, "k": 2502, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.957, "fa": 0.0, "gp": 0.465, "bl": 0.0, "ds": 0.0, "txt": "Honestly it's probably cultural. I've worked at a place that just couldn't get out of the \"old school\" waterfall release style. Collect requirements, build thing, send off to QA, create pre-release/beta, get sign off, ship--very rigid and transactional handoff between each step.\n\nIt was all handoffs and meetings--no ability to fast track or prioritize something except to try to force it through. Ops would maintain hacks, patches, workarounds, run books for issues for months or years because it was so hard to \"just fix the software\"\n\nI'm not advocating for the Zuckerberg yeet it into prod approach, but you really need to be more agile and at least have a priority path and separate software components into risk/support tiers with independent lifecycles. Waterfall distro releases just don't cut it. I think RHEL streams or whatever tried to find a better medium that way."}, {"id": 50649706, "au": "traceroute66", "dom": 67, "sr": 27, "sc": 4.9, "ep": 6.44, "bs": 0.0, "d": 1, "age": 19.16, "grav": 243.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 17, "k": 6093, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.456, "fa": 0.42, "gp": 1.256, "bl": 0.0, "ds": 0.0, "txt": "> At $DAYJOB we’ve moved all of our server images to Debian from Ubuntu because of this.\n\nWe did it years ago when the commercial smell started becoming more agressively rancid.  We did briefly use one of the RedHat derivatives for a while but we got tired of waiting for the \"soon\" bit of the \"next release coming soon\", they kept endlessly deferring.\n\nI've no idea why Ubuntu got its popularity, my theory is its back from the days of the LAMP stack where L == Install Ubuntu.\n\nDebian has had its issues historically, but their latest releases have been great."}, {"id": 50650538, "au": "JamesFM", "dom": 68, "sr": 28, "sc": 4.79, "ep": 5.45, "bs": 0.0, "d": 2, "age": 17.44, "grav": 208.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 88, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.723, "fa": 0.0, "gp": 0.97, "bl": 0.0, "ds": 0.0, "txt": "When Ubuntu first appeared it got popular because it had an amazing out-of-the-box experience. The installer was groundbreaking, the UX was a polished version of Gnome with good theming choices and the default packages were well chosen to give a critical mass of people  a good experience.\n\nThey set a standard and wonderfully other distros started to match and improve on that over the years. At some point canonical pivoted from a desktop focus to a more economically stable server focus. They got a good leg up here because a lot of people making server software decisions had positive desktop experiences with Ubuntu or had heard things from other people who had.\n\nFrom the outside this seems like a big slip for them as it would make question if their server focus is working if community distros are delivering a better server."}, {"id": 50651916, "au": "sersi", "dom": 78, "sr": 29, "sc": 4.73, "ep": 5.61, "bs": 0.0, "d": 2, "age": 13.81, "grav": 144.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 23, "k": 2046, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.38, "fa": 0.42, "gp": 0.807, "bl": 0.0, "ds": 0.0, "txt": "> I've no idea why Ubuntu got its popularity, my theory is its back from the days of the LAMP stack where L == Install Ubuntu.\n\nIn my case, I was used to Debian, had had a terrible experience with Centos so went with Ubuntu for production servers (at home I happily used Gentoo). The thing is there was not that much alternatives when Ubuntu launched so it's not that surprising that they gained a lot of market share. Debian was very slow to update needed software, RHL was expensive, Fedora was not great for production."}, {"id": 50657971, "au": "cillian64", "dom": 187, "sr": 30, "sc": 4.68, "ep": 5.12, "bs": 0.0, "d": 1, "age": 1.34, "grav": 8.8, "surf": 19.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 812, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.365, "fa": 0.34, "gp": 0.651, "bl": 0.0, "ds": 0.0, "txt": "I just run debian stable.  There's a small handful of packages I really want to be pretty fresh (firefox, kicad, freecad) which I get from flatpak, and everything else I don't care if it's (up to) 2 years out-of-date.  I want to minimise the amount of time I spend thinking about updates or fixing breakages."}, {"id": 50658248, "au": "jm4", "dom": 77, "sr": 31, "sc": 4.52, "ep": 5.18, "bs": 0.0, "d": 4, "age": 0.92, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 4583, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.663, "fa": 0.0, "gp": 0.878, "bl": 0.0, "ds": 0.0, "txt": "Isn't their free version OpenSUSE? I don't think there's a path to go from free to licensed without reinstalling. Only Ubuntu offers an unencumbered path. You can take any number of existing installations and put them on a paid support at any time. Red Hat at least lets you do it without reinstalling, but that involves registering for a developer account that has limits on how many instances you can run. I don't think it's licensed for production use either with the free developer licenses.\n\nEven with all its warts and annoyances, Ubuntu is pretty attractive for a startup that may want paid support later on. Everyone else turns it into a major migration project."}, {"id": 50648427, "au": "skhameneh", "dom": 111, "sr": 32, "sc": 4.49, "ep": 5.44, "bs": 0.0, "d": 0, "age": 21.29, "grav": 288.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 694, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.345, "fa": 0.0, "gp": 1.573, "bl": 0.0, "ds": 0.0, "txt": "It's weird because Ubuntu has always been my go-to when I want the most generic Linux VM.  I pick other distros to run, but in my mind Ubuntu has been the \"user-friendly, community, supported\" distro.  And for the first time, a week ago, I hesitated because of the slow patches and went with Debian for a \"generic Linux VM\".\n\nI don't understand why there's been so much delay, this seems crucial/critical to their business, like something they should have perfected.  Is there something I'm missing?"}, {"id": 50655146, "au": "jeroenhd", "dom": 218, "sr": 33, "sc": 4.43, "ep": 5.53, "bs": 0.0, "d": 0, "age": 6.06, "grav": 42.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 26, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.38, "fa": 0.42, "gp": 0.75, "bl": 0.0, "ds": 0.0, "txt": "> This seems to indicate that Ubuntu is not relying on longterm supported kernels from kernel.org, but is instead backporting patches to an old kernel version.\n\nAs has been well-established for years. Not sure why this comment about the Ubuntu kernel from someone who hasn't bothered looking at how Ubuntu releases kernels is deemed valuable enough to make it to the HN front page (although shitting on Ubuntu has become quite a common pastime these days).\n\nI feel for the Canonical people working on this. They're doing a lot of awful work for free and the only thing people online will say about them is that they're too slow.\n\nThat said, I wonder what's up with the Linux stack that we're getting so many remote corruption vulnerabilities compared to its competitors. Are the network stacks from Apple and Microsoft really that much better?"}, {"id": 50649745, "au": "greatgib", "dom": 237, "sr": 34, "sc": 4.23, "ep": 4.82, "bs": 0.0, "d": 0, "age": 19.1, "grav": 242.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 251, "qw": 0, "k": 6565, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.741, "fa": 0.0, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "There is also something else about them that kind of turned me down definitively about them.\n\nThe recent released exploits have been kind of exceptionally majors, like the one with PHP.\nAnd I agree that it is not great to stay (or be stuck for whatever reason) on an old release like 18.04 or something like that.\nBut it is a fact that there are a very huge number of users and servers that are still running with these old unsupported distributions.\n\nLet's think not only about tech advanced users but the countless basic users that have tried a Lamp or ubuntu desktop installed and perfectly running on a very old laptop.\n\nAnd so, I'm really disappointed that Canonical didn't release exceptionally the security updates for these case in their old archive, or as .deb in a free to download website, or anything like that.\n\nI would understand if they didn't do the job, but they did, just gated it behind the \"ESM\" dedicated repository for paid subscriptions.\nSo, the fixed .deb exist but they kept them gated.\n\nI completely understand the fact of them making money providing the \"maintenance\" on old versions, but keeping essential security updates like that looks like to totally contradict the original spirit of \"Humanity for all\" that was they purpose in life.\n\nThey are now a business like any other one, without core values anymore. It reminds me of the old life with red hat distributions.\n\n"}, {"id": 50648270, "au": "guyisit", "dom": 128, "sr": 35, "sc": 4.12, "ep": 5.0, "bs": 0.0, "d": 0, "age": 21.5, "grav": 293.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 11, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.15, "fa": 0.0, "gp": 1.587, "bl": 0.0, "ds": 0.0, "txt": "I’ve been moving containers from Ubuntu to Alpine or Debian the last week. I’ll probably reach out to my Ubuntu rep next week to see what’s going on, and if the response isn’t satisfactory and the trend continues, I’ll migrate servers to something else… idk what, and it’s going to suck. But if we can get off VMware, we can change distros."}, {"id": 50650064, "au": "mrinf1nity", "dom": 106, "sr": 36, "sc": 4.12, "ep": 5.66, "bs": 0.0, "d": 2, "age": 18.46, "grav": 229.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 37, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.244, "fa": 0.68, "gp": 0.553, "bl": 0.0, "ds": 0.0, "txt": "Doesn't canonical/ubuntu sell security subscriptions? I think I saw it before I ditched Ubuntu for Fedora 4x (was 43, now 45), Ubuntu would offer a service on being on top of all the security and patch work if you gave them money, on top of their cloud vm stuff.\n\nIf so, lol"}, {"id": 50654787, "au": "pjmlp", "dom": 42, "sr": 37, "sc": 4.1, "ep": 5.64, "bs": 0.0, "d": 2, "age": 6.72, "grav": 49.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.761, "fa": 0.0, "gp": 1.037, "bl": 0.0, "ds": 0.0, "txt": "Much easier, and no wonder that the Linux/BSDs are the bastion of remaining pure monolithic kernels.\n\nWhen folks bring out Linus vs Tanenbaum, they tend to forget most RTOS are either microkernel based, or hybrid, with Apple, Microsoft, Google equally pushing for hybrid approaches.\n\nNow this does not solve everything, as there are certainly CVEs that even on mikrokernel OS would affect the kernel, or how it interacts with services, requiring kernel fixes."}, {"id": 50648650, "au": "CBLT", "dom": 131, "sr": 38, "sc": 3.89, "ep": 4.47, "bs": 0.0, "d": 1, "age": 20.96, "grav": 281.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 732, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.194, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "If you're set up such that you cannot apply a source-level change to software you run, I feel like you're set up for inevitable disappointment. That's not to say you can't get an order-of-magnitude better experience with the right vendor!  But I have no regrets setting up an internal apt system so we can ship patches as fast as we can test them."}, {"id": 50654695, "au": "throw0101c", "dom": 29, "sr": 39, "sc": 3.81, "ep": 5.76, "bs": 0.85, "d": 5, "age": 6.89, "grav": 51.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 23, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.08, "fa": 0.76, "gp": 0.726, "bl": 0.32, "ds": 0.0, "txt": "> Do you have any idea how much unplanned work that is?\n\nYes: I've been a sysadmin for >20 years. I help to run several hundred Linux servers.\n\n> Microsoft's way is far superior — it's done on a predictable schedule, once a month.\n\nWell, tell the folks finding the vulnerabilities to find them on a predictable schedule then."}, {"id": 50650869, "au": "mitchweaver", "dom": 10, "sr": 40, "sc": 3.79, "ep": 5.33, "bs": 0.0, "d": 2, "age": 16.67, "grav": 194.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.463, "fa": 0.28, "gp": 0.754, "bl": 0.0, "ds": 0.0, "txt": "The Debian way is not great either.\n\nThey have been hurling new kernels over the fence at what seems like a weekly cadence.\n\nThis leaves no time for adequate testing. Not only by users but by Debian themselves — as evidenced by the showstopper regression linked elsewhere in this thread.\n\nThe real world implications of this is patches are going to be routinely skipped.\n\nAnd no a \"homelab Proxmox server under my kitchen cupboard\" does not count as real-world conditions."}, {"id": 50652950, "au": "kqgnkqgn", "dom": 27, "sr": 41, "sc": 3.74, "ep": 4.19, "bs": 0.0, "d": 5, "age": 11.15, "grav": 103.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 22, "k": 188, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.461, "fa": 0.98, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "> The number of times there was a flaw so critical they released an out-of-band patch has to number in the single digits.\n\nThis might have been generally true 20 years ago.  It is definitely not for the last several months (at least for external facing services).  And is unlikely to be true going forward."}, {"id": 50650959, "au": "leafletsigh", "dom": 186, "sr": 42, "sc": 3.71, "ep": 4.96, "bs": 0.0, "d": 0, "age": 16.43, "grav": 189.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 29, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.349, "fa": 0.0, "gp": 1.232, "bl": 0.0, "ds": 0.0, "txt": "So, between this and the current supply chain security reality, what is everyone running on the desktop? I've been considering Debian or Fedora, or just deal with Ubuntu LTS... I know it's always a tradeoff on new packages with less time being tested vs older well tested packages that don't always have the most up to date [security] patches. But, mostly just curious what folks here have settled on and the reasoning in case I'm not thinking of something that might sway me."}, {"id": 50658410, "au": "fulafel", "dom": 43, "sr": 43, "sc": 3.62, "ep": 4.72, "bs": 0.0, "d": 2, "age": 0.64, "grav": 5.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 13861, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.455, "fa": 0.28, "gp": 0.346, "bl": 0.0, "ds": 0.0, "txt": "Fault isolation via microkernel componentwise memory protection is a mitigation for unsound code (memory safety etc), like sandboxing. The complexity and performance cost is arguably higher and safety lower vs other safety designs."}, {"id": 50649382, "au": "linsomniac", "dom": 155, "sr": 44, "sc": 3.56, "ep": 4.66, "bs": 0.0, "d": 1, "age": 19.79, "grav": 256.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 23, "qw": 0, "k": 11025, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": ["https://news.ycombinator.com/item?id=50393105", "https://ubuntu.com/blog/fixes-available-in-proposed-pocket-for-cve-2026-98432", "https://canonical.com/blog/accelerating-delivery-of-cve-fixes-with-a-new-kernel-release-strategy"], "ig": 0.932, "fa": 0.28, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Probably worth reading this recent thread: https://news.ycombinator.com/item?id=50393105\n\nA few choice outtakes:\n\n- Blog post outlining it: https://ubuntu.com/blog/fixes-available-in-proposed-pocket-f...\n\n- Sept post about speeding it up: https://canonical.com/blog/accelerating-delivery-of-cve-fixe...\n\nedit: Adding some links"}, {"id": 50652180, "au": "mahboi", "dom": 243, "sr": 45, "sc": 3.54, "ep": 4.79, "bs": 0.0, "d": 1, "age": 13.07, "grav": 132.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 181, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.777, "fa": 0.0, "gp": 0.422, "bl": 0.0, "ds": 0.0, "txt": "What does enforced snap packages refer to? I vaguely remember someone complaining about how the default apt repos provide a snap version of firefox, but Mozilla themselves endorse that, and it's not forced, so I don't see the issue.\n\nMost people do live under a rock wrt Linux distros and take whatever popular thing works. The worst outcome is something breaks and nobody else has the same problem. I tried Mint recently. Turns out it's the odd one out still using Xorg, like even Debian is on Wayland already, so that's a forced migration down the road even if you prefer Xorg. Also turns out Xorg has showstopper issues with graphics switching on my PC. I ended up wiping it and changing to Ubuntu cause I was out of patience and this isn't a server like I'd normally put Debian on.\n\nThere's probably some mistake I'm making and Debian might've been better even on a PC, but idk, Ubuntu worked. When Ubuntu is slow with updates, there's a front page HN article about it. Not a lot of other distros get this attention. And Mint is also missing the patch for the TCP vuln."}, {"id": 50648483, "au": "cjk", "dom": 53, "sr": 46, "sc": 3.54, "ep": 5.08, "bs": 0.0, "d": 0, "age": 21.21, "grav": 287.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 524, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.788, "fa": 0.34, "gp": 1.557, "bl": 0.0, "ds": 0.0, "txt": "At $DAYJOB we’ve moved all of our server images to Debian from Ubuntu because of this. It’s absolutely unacceptable for one of the most widely-used Linux distros to have slow security response times in 2026."}, {"id": 50654245, "au": "LeBit", "dom": 175, "sr": 47, "sc": 3.43, "ep": 4.97, "bs": 0.0, "d": 2, "age": 7.86, "grav": 61.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 533, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": ["https://www.debian.org/releases/"], "ig": 1.063, "fa": 0.62, "gp": 0.484, "bl": 0.0, "ds": 0.0, "txt": "I agree with your assessment that Ubuntu versioning makes it easy to tell if your LTS is still supported and to know when a new version comes out.\n\nBut you are making Debian versioning sound worse than it really is. I mean is https://www.debian.org/releases/ really that hard to parse by a human?"}, {"id": 50648232, "au": "alanfranz", "dom": 137, "sr": 48, "sc": 3.42, "ep": 4.52, "bs": 0.0, "d": 0, "age": 21.54, "grav": 294.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 5803, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.307, "fa": 0.0, "gp": 1.001, "bl": 0.0, "ds": 0.0, "txt": "One thing that puzzled me recently is that it seems that most security fixes appear in -updates before they enter the security repo, hours before. With the recent wave of security mess, it’s a risk. I used to run unattended upgrades from security only, now I install all updates and I accept the risk of bricking something."}, {"id": 50652673, "au": "_morgs_", "dom": 113, "sr": 49, "sc": 3.37, "ep": 4.91, "bs": 0.0, "d": 2, "age": 11.75, "grav": 111.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 105, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.59, "fa": 0.0, "gp": 0.81, "bl": 0.0, "ds": 0.0, "txt": "Ubuntu's trying to balance the stability that Debian is known for, with pushing out new features and support for the latest hardware - which needs newer kernels.\n\nThis whole kernel update debacle is down to the support burden of so many kernel variations with backports, and maintaining ABI compatibility.\n\nPrefer Debian? Fine, use it. It's always been the safe boring option.\n\nI switched to warty because I was on sid before that. I'd never run sid on servers."}, {"id": 50651566, "au": "SAI_Peregrinus", "dom": 188, "sr": 50, "sc": 3.35, "ep": 4.3, "bs": 0.0, "d": 1, "age": 14.76, "grav": 159.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 7404, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.569, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "NixOS personally. The usual reasons: mixing rolling-release packages in where needed but stable by default, unified management of all my machines & their users, version-controlled configs, rollbacks in theory though I've not needed that in years, easy rebuilds of distro packages with different compiler flags or patches. Probably more I'm forgetting, those are just the main ones."}, {"id": 50652453, "au": "PeterisP", "dom": 19, "sr": 51, "sc": 3.34, "ep": 4.66, "bs": 0.0, "d": 5, "age": 12.27, "grav": 119.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 22933, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.65, "fa": 0.0, "gp": 0.539, "bl": 0.0, "ds": 0.0, "txt": "The difference is that Microsoft is releasing a new fix, where the release of patch can be the first information to potential attackers; while Debian is re-releasing a fix that is known to attackers as soon as the upstream (e.g. kernel) has released it.\n\nThat changes things significantly. IIRC the recent data from major vulnerabilities like PHP2shell show that now attackers can go from seeing a patch to reverse engineering it; to finding the vulnerability; to making and testing an exploit; and actively applying it all within 1 hour or so. This means you can't wait for weeks to re-release a patch that has been released by others - you either have to keep the patch secret until you can apply it everywhere (as Microsoft does, and what coordinated disclosure of the PHP patch tried), or you have to redistribute all upstream fixes on the same day as the upstream provider does.\n\nSo going to predictable monthly releases is not something that Debian can do on its own - it can do it only if it coordinates it with e.g. Linux kernel and the other makers of key components and they agree to release their security patches on that schedule."}, {"id": 50649755, "au": "traceroute66", "dom": 46, "sr": 52, "sc": 3.23, "ep": 4.55, "bs": 0.0, "d": 2, "age": 19.09, "grav": 241.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 96, "qw": 2, "k": 6093, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.641, "fa": 0.0, "gp": 0.477, "bl": 0.0, "ds": 0.0, "txt": "> alpine linux\n\nMy main beef with alpine has always been its adoption of `musl`.\n\nBack when I tried it, the maintainers would regularly build packages against `musl` even when the README/INSTALL files of what they were compiling explicitly stated that the software would only be supported with `libc`.\n\nI'm sure things have changed and so the severity is lower today, both with alpine and musl-interop but back then it was a real issue.\n\nI'm not entirely sure its a zero-issue today, just low(er) severity – no doubt helped by the more prevalent modern environment of Rust/Go single-binaries which are more forgiving."}, {"id": 50658432, "au": "moffkalast", "dom": 12, "sr": 53, "sc": 3.0, "ep": 4.54, "bs": 0.0, "d": 4, "age": 0.62, "grav": 5.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 9622, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.694, "fa": 0.0, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "Breaking things often eventually gets you axed though. I routinely purge unattended-upgrades from every desktop Ubuntu install and only do apt upgrade on demand when I have time to manually resolve the three drivers it'll end up inevitably breaking because its dependency resolution is done with the foresight of a 3 year old kid.\n\nFor a live server it would be different, but given how many leaks we're seeing on the daily it seems like uptime is usually given the higher priority there too."}, {"id": 50650413, "au": "jm4", "dom": 75, "sr": 54, "sc": 2.86, "ep": 4.18, "bs": 0.0, "d": 2, "age": 17.73, "grav": 214.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 4583, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.531, "fa": 0.0, "gp": 0.399, "bl": 0.0, "ds": 0.0, "txt": "They have an easy path from free use to paid first-party support and no limit to how many instances you can run for free. That’s the big win on the server. Red Hat is more difficult with licensing and more expensive. SUSE doesn’t seem too popular outside of Europe. Everything else is a community distro with either no support or third-party paid support. If you want to start free and think you may need support one day, Ubuntu starts looking really good."}, {"id": 50650206, "au": "yjftsjthsd-h", "dom": 48, "sr": 55, "sc": 2.82, "ep": 4.36, "bs": 0.0, "d": 3, "age": 18.16, "grav": 222.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 30, "k": 35237, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.097, "fa": 0.42, "gp": 0.406, "bl": 0.0, "ds": 0.0, "txt": "> the maintainers would regularly build packages against `musl` even when the README/INSTALL files of what they were compiling explicitly stated that the software would only be supported with `libc`.\n\nI assume this is a typo for glibc? Musl is a libc, just not GNU's. In any event, yeah compatibility can be a pain point but IME it's fine these days. Probably helps that Alpine got more popular (largely via docker) so it's more likely to be officially supported anyways."}, {"id": 50652957, "au": "talkin", "dom": 181, "sr": 56, "sc": 2.82, "ep": 4.03, "bs": 0.0, "d": 4, "age": 11.12, "grav": 102.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 210, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.304, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "“support after 10 years ;)”\nIt was a funny remark related to topic at hand. Support is worth less if patches are lagging behind.\n\nHow you value requirements like “support duration” vs “response times” has quite the impact on Ubuntu being your choice."}, {"id": 50655848, "au": "giovannibajo1", "dom": 20, "sr": 57, "sc": 2.82, "ep": 3.99, "bs": 0.0, "d": 6, "age": 4.92, "grav": 32.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 2084, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.593, "fa": 0.0, "gp": 0.173, "bl": 0.0, "ds": 0.0, "txt": "I wonder if the fact that upstream applies security fixes as soon as they are made aware of them is sustainable going forward. If the entire Linux ecosystem isn't able anymore to keep up with the pace of these changes (not without causing frequent regressions downstream to OS users), and batching releases is impossible because of the almost zero time window we now have between a security bug and an exploit, I can't think of a better solution than trying to batch security fixes upstream (obviously trying to do CVD, which is very hard but maybe better than what we have now)."}, {"id": 50657027, "au": "cpncrunch", "dom": 182, "sr": 58, "sc": 2.82, "ep": 3.98, "bs": 0.0, "d": 5, "age": 2.81, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 7564, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.335, "fa": 0.28, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "I'm happy with Ubuntu so far. If you check the first bug referenced in this post it is a segv, not an rce, and has a medium CVE score. You also have some benefits to having older kernels, as they don't have new crud resulting in some of these bugs. For example, the multipath bug didn't affect Ubuntu 20.04 or earlier as those kernels didn't have multipath."}, {"id": 50651048, "au": "throw0101c", "dom": 14, "sr": 59, "sc": 2.82, "ep": 3.91, "bs": 0.0, "d": 3, "age": 16.18, "grav": 185.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 15, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.063, "fa": 0.42, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "> They have been hurling new kernels over the fence at what seems like a weekly cadence.\n\nWell CVEs are coming out on a weekly cadence, so… ¯\\_(ツ)_/¯\n\nJust because there's a new version of a package (kernel or otherwise) doesn't mean you have to install. If there's a mitigation for a particular CVE, you can mitigate instead of install/reboot."}, {"id": 50658510, "au": "Joel_Mckay", "dom": 156, "sr": 60, "sc": 2.82, "ep": 3.79, "bs": 0.0, "d": 1, "age": 0.52, "grav": 5.3, "surf": 51.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.612, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The CVE fixes  _do_not_ necessarily bump the deb package program version numbers.\n\nYou will see things like:\n\nsomepackage-7.0.0.1-ubuntu99\n\nPatched:\n\nsomepackage-7.0.0.1-ubuntu105\n\nOne needs to look at the package history notes to check for specific CVE mitigation.  Yes it is goofy to check websites with oddball version claims, but most people with auto-update should be fine. =3"}, {"id": 50651076, "au": "tabbott", "dom": 101, "sr": 61, "sc": 2.82, "ep": 3.76, "bs": 0.0, "d": 2, "age": 16.11, "grav": 183.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 3222, "kpp": 9.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.376, "fa": 0.0, "gp": 0.363, "bl": 0.0, "ds": 0.0, "txt": "Decades ago working on Ksplice, we'd effectively be reviewing the security backporting work of every major Linux distribution.\n\nDebian was the best at it, even better than Red Hat. It's amazing the quality of people that Debian was able to attract for this difficult timely work in a volunteer project."}, {"id": 50658062, "au": "renehsz", "dom": 11, "sr": 62, "sc": 2.82, "ep": 3.75, "bs": 0.0, "d": 3, "age": 1.2, "grav": 8.1, "surf": 22.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 754, "kpp": 5.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.412, "fa": 0.0, "gp": 0.297, "bl": 0.0, "ds": 0.0, "txt": "Breaking things is often the lesser evil though, so people really shouldn't skip any patches. In the rare case that an update breaks something, you can still roll back to the previous kernel. A security breach is way more serious because it can't be un-done. Stolen data can't be un-stolen!\n\nI'll take a service outage over a data leak any day of the week. (Except for critical infrastructure, but that shouldn't be exposed to the Internet in the first place.)"}, {"id": 50652649, "au": "mort96", "dom": 108, "sr": 63, "sc": 2.82, "ep": 4.0, "bs": 0.27, "d": 4, "age": 11.79, "grav": 112.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.191, "fa": 0.34, "gp": 0.163, "bl": 0.1, "ds": 0.0, "txt": "Unless you pay for Ubuntu Pro and use \"ESM apps\", there's a bunch of security updates you don't get. Their MOTD even advertises how many security updates are available to paying customers but which are withheld from you. This is true even if you're running latest LTS. I.e I have a server running 26.04, and the MOTD tells me there are security updates from 3 packages which they're withholding from me until I pay."}, {"id": 50648353, "au": "jjcm", "dom": 152, "sr": 64, "sc": 2.82, "ep": 3.74, "bs": 0.0, "d": 0, "age": 21.38, "grav": 291.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 12521, "kpp": 7.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.113, "fa": 0.0, "gp": 0.774, "bl": 0.0, "ds": 0.0, "txt": "For my Ubuntu servers, I've moved to manually patching the kernel with fixes. It's simply not viable to wait for upstream at the moment.\n\nI'll be rolling off of Ubuntu because of it, but manual patches have been a short term solution in the meantime."}, {"id": 50653004, "au": "kqgnkqgn", "dom": 202, "sr": 65, "sc": 2.82, "ep": 3.73, "bs": 0.0, "d": 2, "age": 11.0, "grav": 101.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 188, "kpp": 6.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.366, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "While that's understandable...that seems like an easily solvable process issue.\n\nEg if there's a critical kernel CVE...don't delay getting a patch out for RHEL 10 in order to test if it breaks some container image that's part of OpenShift.  Test + release that later."}, {"id": 50654684, "au": "mort96", "dom": 176, "sr": 66, "sc": 2.82, "ep": 3.72, "bs": 0.0, "d": 3, "age": 6.92, "grav": 51.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 117, "qw": 0, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "No, Debian's releases aren't especially bad, they're just a typical software project where new releases come out when they're ready and have an incrementing version number and a code name. It's fine. It's just that Ubuntu is exceptionally good in that area.\n\nI intentionally didn't check the Releases page because the whole point was to compare what you know without looking anything up. I see I got both the current release wrong (apparently Trixie is now the latest) and the order of Bookworm and Bullseye wrong (apparently Bookworm is newer than Bullseye).\n\nThis proves my point; with Ubuntu, the analogous mistake would've been to not realize that 26.04 has come out already, or to not know that 24.04 came out after 22.04."}, {"id": 50653067, "au": "cabirum", "dom": 150, "sr": 67, "sc": 2.82, "ep": 3.71, "bs": 0.0, "d": 0, "age": 10.86, "grav": 99.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 1338, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.213, "fa": 0.0, "gp": 0.594, "bl": 0.0, "ds": 0.0, "txt": "It is misleading to say Ubuntu uses \"old kernel version\", and Debian uses \"a very recent longterm kernel\". It is intuitive and reasonable to say that 7.xx version is newer than 6.xx. Just some old kernels still receive security patches.\n\nUbuntu should sync their hwe releases with linux kernel releases, while starting from an LTS kernel."}, {"id": 50648711, "au": "ahofmann", "dom": 55, "sr": 68, "sc": 2.82, "ep": 3.64, "bs": 0.0, "d": 1, "age": 20.85, "grav": 279.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1311, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.865, "fa": 0.34, "gp": 0.443, "bl": 0.0, "ds": 0.0, "txt": "Same here. Also: I'm not missing a single thing. Ubuntu was great 15 years ago, when debian had very old software versions, but today there are just soo much downsides on ubuntu, that every other distro is better."}, {"id": 50656467, "au": "dspillett", "dom": 13, "sr": 69, "sc": 2.82, "ep": 3.61, "bs": 0.0, "d": 3, "age": 3.84, "grav": 23.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 29, "k": 16079, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.006, "fa": 0.42, "gp": 0.031, "bl": 0.0, "ds": 0.0, "txt": "> The real world implications of this is patches are going to be routinely skipped.\n\nYou takes your choice, you takes your risk, I suppose.\n\n> And no a \"homelab Proxmox server under my kitchen cupboard\" does not count as real-world conditions.\n\nThat homelab connected to the public network is very much a real world installation. If it is successfully kept up-to-date but major installations elsewhere are not, I don't think the homelab is where you should be throwing your shade."}, {"id": 50654235, "au": "LtWorf", "dom": 144, "sr": 70, "sc": 2.82, "ep": 3.59, "bs": 0.0, "d": 3, "age": 7.88, "grav": 61.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 2729, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.53, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I passed that step, then they made me do some IQ test and they stressed to do it in my native language and NOT in english, or I could lose some points due to it not being my default language.\n\nThe test in my native language was machine translated by something from the 90s and it was very hard to read. At one point I failed an entire section because I didn't understand what it wanted at all (there was no way to go back and possibly re-interpret the instructions keeping in mind the mistranslations) so I just rage quit.\n\nSince then I'm black listed.\n\nI'm a DD but not good enough for Canonical lol."}, {"id": 50648772, "au": "viraptor", "dom": 125, "sr": 71, "sc": 2.82, "ep": 3.58, "bs": 0.0, "d": 2, "age": 20.76, "grav": 277.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 48206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.475, "fa": 0.0, "gp": 0.079, "bl": 0.0, "ds": 0.0, "txt": "They also split the zfs module into a package depended on by AWS kernel, but failed to publish correctly - so for a while you couldn't upgrade the kernel even though the kernel package itself was ready... even if you're not using zfs.\n\nAlso the package search web interface is extremely slow for weeks (months?) now, making any investigation harder. So yeah, not sure if it's bloat, but there's something bad happening with their processes overall."}, {"id": 50650732, "au": "raggi", "dom": 31, "sr": 72, "sc": 2.82, "ep": 3.56, "bs": 0.0, "d": 2, "age": 17.03, "grav": 200.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 2860, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.181, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "the whole debian model in general is looking pretty sketchy right now, even though yes, for some of these notable patches debian did indeed backport them sooner. beyond the kernel though the story remains a lot more strained.\n\nlts is on pause."}, {"id": 50656708, "au": "vbezhenar", "dom": 44, "sr": 73, "sc": 2.82, "ep": 3.52, "bs": 0.0, "d": 2, "age": 3.42, "grav": 20.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 16288, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.492, "fa": 0.0, "gp": 0.012, "bl": 0.0, "ds": 0.0, "txt": "Monolithic kernel never looked like a good idea. It brings performance and simplicity and that's about it. Microkernel with components running in less-privileged modes are much better.\n\nIndustry values performance, because they have to pay for CPUs and RAM.\n\nIndustry doesn't value security, because it rarely turns into financial losses.\n\nSo Linux won.\n\nMaybe things will change soon."}, {"id": 50652070, "au": "toast0", "dom": 119, "sr": 74, "sc": 2.82, "ep": 3.47, "bs": 0.0, "d": 3, "age": 13.36, "grav": 136.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 33073, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.237, "fa": 0.0, "gp": 0.386, "bl": 0.0, "ds": 0.0, "txt": "Debian also takes pains to make things more vanilla where possible. Usually it's easy to switch between options and builds tools like sensible-browser where needed. Packages are patched to follow the directory guidance, even if upstream won't, etc."}, {"id": 50651160, "au": "mitchweaver", "dom": 18, "sr": 75, "sc": 2.82, "ep": 3.41, "bs": 0.0, "d": 4, "age": 15.89, "grav": 179.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.11, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Do you have any idea how much unplanned work that is?\n\nMicrosoft's way is far superior — it's done on a predictable schedule, once a month.\n\nThe number of times there was a flaw so critical they released an out-of-band patch has to number in the single digits.\n\nThis drip, drip, drip method Linux is employing is not sustainable. It's causing chaos for IT departments.\n\nIt's effectively turned Debian Stable into a rolling release distro."}, {"id": 50657087, "au": "vbezhenar", "dom": 95, "sr": 76, "sc": 2.82, "ep": 3.35, "bs": 0.0, "d": 3, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 16288, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.42, "fa": 0.0, "gp": 0.011, "bl": 0.0, "ds": 0.0, "txt": "Honestly I feel like Fedora is the official linux distro. They belong to RHEL family and RHEL is the juggernaut enterprise linux. They always support some kind of default sane components like systemd, gnome, they don't do fancy stuff, it's just Linux. They're supported by most third-party software (not as widely as Ubuntu, sadly)."}, {"id": 50655261, "au": "ExoticPearTree", "dom": 24, "sr": 77, "sc": 2.82, "ep": 3.31, "bs": 0.0, "d": 8, "age": 5.84, "grav": 40.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 1434, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.069, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, it was an issue with ifupdown2-pre.service. It would hang indefinitely, and because the networking service has a dependency on it, that would fail too.\n\nThe solution was to mask it: systemctl mask ifupdown2-pre.service\n\nIt happened on a single server so I did not spend time tracking the actual root cause. Found other reports for this and the resolution was the same: mask the service."}, {"id": 50651856, "au": "upboundspiral", "dom": 32, "sr": 78, "sc": 2.82, "ep": 3.3, "bs": 0.0, "d": 3, "age": 14.0, "grav": 147.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 239, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.069, "fa": 0.0, "gp": 0.543, "bl": 0.0, "ds": 0.0, "txt": "I feel like the whole Linux model is looking sketchy right now.\n\nA monolithic kernel is great until everything and the kitchen sink is in there, and some weird bug in one component can now be used to get root and affect all the other components."}, {"id": 50656551, "au": "chuckadams", "dom": 39, "sr": 79, "sc": 2.82, "ep": 3.29, "bs": 0.0, "d": 5, "age": 3.7, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 13, "k": 5147, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.549, "fa": 0.7, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Are there parts of the kernel you think can go into Flatpak applications?\n\nAbsolutely.  If its filesystem is self-contained for example, there's no real reason for it to not link the fs implementation in as a library, only accessing the \"real\" fs over a daemon.  Of course that daemon has to be secure, unlike NFS..."}, {"id": 50651305, "au": "ikiris", "dom": 30, "sr": 80, "sc": 2.82, "ep": 3.24, "bs": 0.0, "d": 5, "age": 15.44, "grav": 171.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 59, "k": 1727, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.869, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Do you have any idea how much unplanned work that is?\nMicro
