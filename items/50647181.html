soft's way is far superior — it's done on a predictable schedule, once a month.\n\n> The number of times there was a flaw so critical they released an out-of-band patch has to number in the single digits.\n\n> This drip, drip, drip method Linux is employing is not sustainable. It's causing chaos for IT departments.\n\n> It's effectively turned Debian Stable into a rolling release distro.\n\nWe'll ask the malicious actors to wait until you're patched next month so it doesn't impact your OKRs"}, {"id": 50651360, "au": "Pokepokalypse", "dom": 200, "sr": 81, "sc": 2.82, "ep": 3.14, "bs": 0.0, "d": 1, "age": 15.29, "grav": 169.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 593, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.174, "fa": 0.0, "gp": 0.259, "bl": 0.0, "ds": 0.0, "txt": "Red Hat used to drive me insane a couple of years ago (before we switched to wolfi/chainguard). Their base-images had literally hundreds of CVE's and yes, many were unexploitable or low severity, but it was still a huge amount of noise, and made tracking the critical/high findings more difficult, especially when they lagged (like all the openssl ones)."}, {"id": 50653902, "au": "breadlover42", "dom": 225, "sr": 82, "sc": 2.82, "ep": 5.65, "bs": 2.52, "d": 1, "age": 8.73, "grav": 71.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.694, "fa": 0.34, "gp": 0.483, "bl": 0.95, "ds": 0.0, "txt": "It's mostly leftover fame from a different time. Ubuntu became famous because it \"just worked\" in a world where getting your disc drive, bluetooth, or hdmi to function was a challenge.\n\nHell, when I switched to Linux in 2019 with Debian 10 'Buster', the X display server wouldn't start, which left me troubleshooting for days with only a terminal. Ubuntu on the other hand was fine out of the box.\n\nNowadays, when most distros \"just work\", Ubuntu isn't special anymore (and actually it's become harder for beginners, partly due to its hostility against flatpak)."}, {"id": 50650475, "au": "bragr", "dom": 82, "sr": 83, "sc": 2.82, "ep": 3.12, "bs": 0.0, "d": 3, "age": 17.58, "grav": 211.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 4562, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.329, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think people forget how bad distro installers used to be. Even on server hardware, it used to be a crapshoot if the installer would leave you with a booting system with all the critical hardware, like networking, in a working state. Dropping to a shell in the installer to do some hardware specific incantation for the install to succeed."}, {"id": 50653810, "au": "breadlover42", "dom": 189, "sr": 84, "sc": 2.82, "ep": 5.61, "bs": 2.52, "d": 1, "age": 8.98, "grav": 74.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.632, "fa": 0.28, "gp": 0.677, "bl": 0.95, "ds": 0.0, "txt": "I am running OpenSUSE, the reasoning being that it's a very \"unbiased\" distro. You can have yearly, monthly or rolling updates, according to your needs. And the rolling-release version (Tumbleweed) doesn't assume you're a computer wizard, unlike e.g. Arch, which expects you to only manage software from the command line and occasionally perform manual intervention, or Debian Sid that is more targeted at Debian developers than end users."}, {"id": 50656391, "au": "ValdikSS", "dom": 165, "sr": 85, "sc": 2.82, "ep": 3.9, "bs": 0.85, "d": 4, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 103, "qw": 0, "k": 1459, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.509, "fa": 0.0, "gp": 0.246, "bl": 0.32, "ds": 0.0, "txt": "The sad truth is that there's not many fresh blood in Debian, the infrastructure is old and not compelling for newcomers. Some maintainers are a bit hostile. The core maintainers do a great job but they can continue doing that only while they're well and alive.\n\nOnce in a year, I think what would happen when Linus or Greg dies, and the future is not bright in my mind. But maybe the software projects might not need to rely on authors/maintainers humans anymore and could be maintained individually and autonomously, we'll see how it goes.\n\nThis is an issue in social open-source in general."}, {"id": 50657792, "au": "mahboi", "dom": 91, "sr": 86, "sc": 2.82, "ep": 2.96, "bs": 0.0, "d": 3, "age": 1.62, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's perfect, that means he'd force it to be easy. I looked it up and he was critical of fragmentation and thought Chromebooks would be the path forward, meanwhile the community seems to think more choices is always better. Even Ubuntu, which was supposed to be the easy one, rugpulled the entire GUI twice."}, {"id": 50649718, "au": "lousken", "dom": 196, "sr": 87, "sc": 2.82, "ep": 2.96, "bs": 0.0, "d": 0, "age": 19.15, "grav": 242.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1791, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.771, "fa": 0.0, "gp": 0.795, "bl": 0.0, "ds": 0.0, "txt": "Once the 7.4 lts kernel is out they should allow 26.04 users to upgrade to it, without their patches, just as an option.\n\n(even better thing to do would be to upstream the good patches and discard the bad ones but..)"}, {"id": 50658026, "au": "miladyincontrol", "dom": 116, "sr": 88, "sc": 2.82, "ep": 2.95, "bs": 0.0, "d": 2, "age": 1.25, "grav": 8.3, "surf": 22.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 561, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 1.246, "fa": 0.0, "gp": 0.015, "bl": 0.0, "ds": 0.0, "txt": "There are places to be opinionated in distro design and configuration, the kernel's code is one of those spots that should be minimally opinionated.\nRather, I'd argue thats a trait shared among the best distros."}, {"id": 50654465, "au": "jeroenhd", "dom": 117, "sr": 89, "sc": 2.82, "ep": 2.93, "bs": 0.0, "d": 2, "age": 7.38, "grav": 56.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.248, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Debian patches software to remove things they don't like, it's not like they follow upstream. They just remove and alter different things than Ubuntu does.\n\nThe benefit of Ubuntu is that you can pay a reasonable fee and not have to worry about weird breakages for a decade (or for free, if you pick your tech stack well). Debian hasn't even announced when Debian 14 comes out and Bookworm just went EOL this summer after only three years. Debian's extra-long LTS support is the equivalent of Ubuntu's normal LTS support."}, {"id": 50654799, "au": "pjmlp", "dom": 64, "sr": 90, "sc": 2.82, "ep": 2.88, "bs": 0.0, "d": 2, "age": 6.7, "grav": 49.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 134349, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.225, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The problem is that they found out why all other desktop focused distros that predated them, like Mandrake, are either no longer around, or have focused to server and embedded as well.\n\nDesktop users don't pay for support contracts with FOSS.\n\nPhysical media with the Linux distribution is as far as they will go."}, {"id": 50651448, "au": "kijin", "dom": 40, "sr": 91, "sc": 2.82, "ep": 2.85, "bs": 0.0, "d": 3, "age": 15.05, "grav": 164.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 11278, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.212, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Debian is tracking an active LTS, so they can lean on the kernel itself for a lot of the backporting.\n\nUbuntu on the other hand chose a non-LTS kernel with two zeros in its version number.\n\nFreezing a version and backporting fixes has its pros and cons for Linux distros, but either way you have to be careful which version you choose."}, {"id": 50653366, "au": "steve1977", "dom": 183, "sr": 92, "sc": 2.8, "ep": 2.8, "bs": 0.0, "d": 2, "age": 10.15, "grav": 89.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 4609, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 0.365, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So what is more important nowadays? 1 year of usable support or 10 years of unusable support? Will there be Linux at all anymore in 10 years?"}, {"id": 50653388, "au": "apexalpha", "dom": 206, "sr": 93, "sc": 2.77, "ep": 2.77, "bs": 0.0, "d": 1, "age": 10.11, "grav": 89.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7652, "kpp": 5.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes we've noticed that too recently. We pay for RH Ultimate and the teams running the a free Debian / Alma OS are routinely days faster with patching than teams using the paid RHEL..."}, {"id": 50651072, "au": "throw0101c", "dom": 74, "sr": 94, "sc": 2.68, "ep": 2.68, "bs": 0.0, "d": 3, "age": 16.12, "grav": 183.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 14, "k": 10588, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 0.629, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> At some point canonical pivoted from a desktop focus to a more economically stable server focus.\n\nIf they were more server focused they wouldn't futz around with resolv.conf as much as they do (did?). I've had to do a chattr +i in the past because the OS couldn't take the hint not to touch the file."}, {"id": 50658580, "au": "Joel_Mckay", "dom": 127, "sr": 95, "sc": 2.56, "ep": 2.56, "bs": 0.0, "d": 1, "age": 0.42, "grav": 4.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1788, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 1.088, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "For Desktop driver support it is a good OS, but for servers you want to strip down to minimize attack surfaces.  A lite Alpine/Deb/Redhat hardened access policy schema helps keep things clean when the \"[bits] hit the fan\". =3"}, {"id": 50650611, "au": "trog", "dom": 86, "sr": 96, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 2, "age": 17.29, "grav": 205.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 1599, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.083, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ubuntu's seems to have gotten better recently. I tried it again randomly after a long time of being burnt by them breaking and it all worked fine (to my surprise). Done it on a few machines now with no ill effects!"}, {"id": 50648495, "au": "protocolture", "dom": 124, "sr": 97, "sc": 2.53, "ep": 2.53, "bs": 0.0, "d": 1, "age": 21.2, "grav": 286.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.078, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I think its bloat. Like if you were running one of the main LTS kernels, you got a fix in like 2 weeks. But for poor shmucks running the azure kernel stream, it was even longer. Theres just so many different kernels with unique toolchains."}, {"id": 50655377, "au": "roryirvine", "dom": 5, "sr": 98, "sc": 2.47, "ep": 2.47, "bs": 0.0, "d": 4, "age": 5.64, "grav": 38.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 1417, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 1.051, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd personally take Grsecurity / PaXTeam's posts with a pinch or two of salt given the long history of animosity between them and some of the mainstream kernel folk.\n\n(I don't mean to cast aspersions on the technical side of grsecurity's work, but they're not exactly unbiased commentators!)"}, {"id": 50655796, "au": "dimamik", "dom": 219, "sr": 99, "sc": 2.41, "ep": 2.41, "bs": 0.0, "d": 0, "age": 4.98, "grav": 33.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 95, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.935, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "Does it mean that everyone should just compile their own version of kernel that is _slightly_ different than the others, so it’s harder to get in?\n\nAssuming you’re not targeted directly, security through obscurity might make more sense than ever?"}, {"id": 50655337, "au": "seba_dos1", "dom": 9, "sr": 100, "sc": 2.35, "ep": 2.61, "bs": 0.27, "d": 5, "age": 5.69, "grav": 39.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 1.112, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "Things are being cherry-picked into stable kernels very liberally and anyone who tracks them knows that they break quite regularly. Most of the time the breakage is found in -rc1 and stopped, but it isn't uncommon for it to stay in the released kernels either."}, {"id": 50656709, "au": "ValdikSS", "dom": 173, "sr": 101, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 5, "age": 3.42, "grav": 20.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1459, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.997, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ubuntu tends to use versions, while Debian tends to use codenames for their releases in announces, documentation and whatnot. I also confuse Debian versions and not Ubuntu versions, even that I know Debian codenames and have no idea about Ubuntu codenames."}, {"id": 50649083, "au": "protocolture", "dom": 229, "sr": 102, "sc": 2.34, "ep": 2.34, "bs": 0.0, "d": 2, "age": 20.3, "grav": 267.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 4504, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The EMS Kernels seemed to have work started on them only after the in support LTS kernels were fixed.\n\nI dont know if thats a betrayal of the paid EMS users, or good for the LTS users, or some combination."}, {"id": 50651678, "au": "phendrenad2", "dom": 149, "sr": 103, "sc": 2.32, "ep": 2.32, "bs": 0.0, "d": 1, "age": 14.49, "grav": 155.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 8273, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 0.989, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The market is wide open for anyone to compete with them. Canonical survives because they are one of only two distros that have websites that don't look like a web devs highschool project (the other being Red Hat)."}, {"id": 50652613, "au": "_morgs_", "dom": 212, "sr": 104, "sc": 2.31, "ep": 2.31, "bs": 0.0, "d": 3, "age": 11.88, "grav": 113.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 105, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.984, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Fedora's like a testing ground for RPMs. Of course it will get updates faster - but it doesn't have the commercial stability that RedHat provides.\n\nIf Fedora breaks your system, good luck. RedHat may not break your system."}, {"id": 50657808, "au": "mahboi", "dom": 94, "sr": 105, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 3, "age": 1.58, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.969, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "He owns the name Linux. There's an official Linux kernel, not only because he works on it but because he gave it the name. He could similarly brand a distro as the official Linux OS if he wanted. Even if he did 0 technical work on it, just having the control and branding would make a huge difference. Right now you cannot even tell someone to switch to Linux and have that sentence make sense."}, {"id": 50657263, "au": "newsoftheday", "dom": 126, "sr": 106, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 0, "age": 2.43, "grav": 14.6, "surf": 20.2, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 607, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 0.895, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Sticking with Ubuntu, I just wish they'd get rid of Snap so I can stop having to disable it in an etc apt preferences file."}, {"id": 50648395, "au": "Akronymus", "dom": 153, "sr": 107, "sc": 2.28, "ep": 2.28, "bs": 0.0, "d": 1, "age": 21.33, "grav": 289.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 4182, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.969, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I find it funny how ubuntu partially stemmed from a frustration with debians slow update times. Oh how the turntables."}, {"id": 50656564, "au": "seba_dos1", "dom": 121, "sr": 108, "sc": 2.27, "ep": 2.53, "bs": 0.27, "d": 1, "age": 3.68, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 9605, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 1.04, "fa": 0.0, "gp": 0.063, "bl": 0.1, "ds": 0.0, "txt": "I have used Ubuntu since 6.06 for a few years and then switched to Debian because of how non-generic Ubuntu was at that time already - and that was even before all the Unity, Mir, Snap stuff. It's a bit baffling for me to see people still gravitating towards Ubuntu during the last decade."}, {"id": 50657781, "au": "cillian64", "dom": 115, "sr": 109, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 4, "age": 1.63, "grav": 10.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 812, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IIRC the debian backports repositories have a policy of \"no promises\" when it comes to getting timely security updates, I wouldn't want to rely on them for security-critical packages."}, {"id": 50653787, "au": "bitfilped", "dom": 136, "sr": 110, "sc": 2.27, "ep": 2.27, "bs": 0.0, "d": 1, "age": 9.08, "grav": 75.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 213, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.966, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Enterprise distros will be there waiting, I've never really understood shops that take ubuntu to production, they can't even come up with a half decent packaging spec let alone all the other problems."}, {"id": 50652643, "au": "IlikeMadison", "dom": 134, "sr": 111, "sc": 2.25, "ep": 2.25, "bs": 0.0, "d": 1, "age": 11.81, "grav": 112.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 181, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 0.86, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "So you are paying for Ubuntu Enterprise/Support but you moved everything to Alpine or Debian even before hearing from your Ubuntu rep about a security fix that doesn't affect you and is now patched. Alright."}, {"id": 50649166, "au": "gertop", "dom": 104, "sr": 112, "sc": 2.25, "ep": 2.25, "bs": 0.0, "d": 2, "age": 20.17, "grav": 264.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 444, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.957, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Possibly because it sounds like whataboutism. The thread is about Ubuntu's shortcomings and your comment is about pointing fingers at Debian.\n\n(yes I did notice your attempt to sound positive and your intent was possible closer to \"even the best like Debian slips every now and then\")"}, {"id": 50654433, "au": "jeroenhd", "dom": 109, "sr": 113, "sc": 2.22, "ep": 2.22, "bs": 0.0, "d": 5, "age": 7.44, "grav": 56.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free (Pay)", "urls": [], "ig": 0.946, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Ubuntu Pro is free for 5 devices or less for consumers. Businesses need to pay for their backports but for the average Joe it's still free."}, {"id": 50650215, "au": "pluralmonad", "dom": 81, "sr": 114, "sc": 2.19, "ep": 2.19, "bs": 0.0, "d": 2, "age": 18.14, "grav": 222.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 502, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.932, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From what I recall, mostly hardware compat and their GUI installer. Neither of which really explains running it on servers."}, {"id": 50649279, "au": "mr_mitm", "dom": 129, "sr": 115, "sc": 2.17, "ep": 3.36, "bs": 1.19, "d": 1, "age": 19.97, "grav": 260.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 4666, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 0.72, "fa": 0.0, "gp": 1.15, "bl": 0.45, "ds": 0.0, "txt": "What was your reason to choose Ubuntu for containers anyway? I thought the whole selling point was compatibility with consumer hardware."}, {"id": 50655816, "au": "mroche", "dom": 203, "sr": 116, "sc": 2.14, "ep": 2.14, "bs": 0.0, "d": 3, "age": 4.95, "grav": 32.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 3606, "kpp": 5.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.911, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There's some nuance my original comment left out. I didn't mean to imply all products are gated on all other products. Just that within the different product channels there is a lot of QA work to do within that singular stack."}, {"id": 50649652, "au": "baggy_trough", "dom": 102, "sr": 117, "sc": 2.12, "ep": 2.12, "bs": 0.0, "d": 1, "age": 19.29, "grav": 245.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 1199, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.826, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "The worst unexpected downtime I ever had was when Ubuntu released a kernel that blew up on containers due to one of their patch backports.  Debian's been better for me!"}, {"id": 50653429, "au": "sergdigon", "dom": 93, "sr": 118, "sc": 2.12, "ep": 2.12, "bs": 0.0, "d": 2, "age": 10.0, "grav": 87.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 152, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.46, "fa": 0.0, "gp": 0.716, "bl": 0.0, "ds": 0.0, "txt": "What do you mean? Linus is saying openly that he use Fedora. He is not saying this is the \"official linux distro\" (again I am not sure what this is supposed to mean). Also why would debian be the closest thing to \"official linux distro\"?"}, {"id": 50649889, "au": "lozf", "dom": 208, "sr": 119, "sc": 2.06, "ep": 2.06, "bs": 0.0, "d": 2, "age": 18.84, "grav": 236.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 764, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "If you want a RedHat like OS, Alma Linux have been great at releasing critical patches ahead of upstream."}, {"id": 50652130, "au": "mahboi", "dom": 87, "sr": 120, "sc": 2.04, "ep": 2.04, "bs": 0.0, "d": 1, "age": 13.19, "grav": 133.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 737, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "linux_patch", "flbl": "Linux & Patch (Distro)", "urls": [], "ig": 0.646, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "It'd be cool if Torvalds made or endorsed an official Linux distro with some sensible vanilla defaults that's just called Linux. Since he doesn't seem interested in that, well the closest thing is Debian."}, {"id": 50653478, "au": "mitchweaver", "dom": 88, "sr": 121, "sc": 2.02, "ep": 2.02, "bs": 0.0, "d": 2, "age": 9.87, "grav": 86.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "server_desktop", "flbl": "Server & Desktop (Ubuntu)", "urls": [], "ig": 0.6, "fa": 0.0, "gp": 0.417, "bl": 0.0, "ds": 0.0, "txt": "Why would you assume this?\n\nHe's made it abundantly clear he hates installing and maintaining operating systems.\n\nThere's a video on YouTube where a turbonerd from Debian wants to know why he doesn't use it and he explained he thought it was too hard to install and uses Fedora because it's familiar.\n\nI bet he uses the graphical installer with the default settings.\n\nGates was the same way IIRC."}, {"id": 50654474, "au": "jeroenhd", "dom": 159, "sr": 122, "sc": 1.96, "ep": 1.96, "bs": 0.0, "d": 3, "age": 7.35, "grav": 55.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 35069, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.835, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But it is backported by the Canonical security team (because PHP only support recent versions). The patched versions are still published and validated by Canonical."}, {"id": 50652686, "au": "jeffrallen", "dom": 223, "sr": 123, "sc": 1.96, "ep": 1.96, "bs": 0.0, "d": 1, "age": 11.72, "grav": 111.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 3174, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "support_free", "flbl": "Support & Free ( o have the tracking of your instance that the ESM implies. lot of things like that that is the common case."}, {"id": 50656816, "au": "mort96", "dom": 167, "sr": 127, "sc": 1.81, "ep": 2.08, "bs": 0.27, "d": 5, "age": 3.23, "grav": 19.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 18606, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "distros_debian", "flbl": "Distros & Debian (Ubuntu)", "urls": [], "ig": 0.883, "fa": 0.0, "gp": 0.0, "bl": 0.1, "ds": 0.0, "txt": "Yet all the tags of docker images, names of iso images, CI runner tags, all sorts of OS version metadata that's ad-hoc all over the place, refers to Ubuntu as 22.04/24.04/26.04 and Debian as Bullseye/Bookworm/Trixie."}, {"id": 50656498, "au": "chuckadams", "dom": 26, "sr": 128, "sc": 1.78, "ep": 1.78, "bs": 0.0, "d": 5, "age": 3.78, "grav": 23.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 9, "k": 5147, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.724, "fa": 0.0, "gp": 0.053, "bl": 0.0, "ds": 0.0, "txt": "> It's effectively turned Debian Stable into a rolling release distro.\n\nIt's the userland that stays at stable versions.  Security patches have always been available as soon as they're ready."}, {"id": 50653297, "au": "loftsy", "dom": 37, "sr": 129, "sc": 1.77, "ep": 1.77, "bs": 0.0, "d": 3, "age": 10.33, "grav": 92.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 131, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "kernel_security", "flbl": "Kernel & Security (Ubuntu)", "urls": [], "ig": 0.755, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's been clear for years now that the mobile model is correct and Linux needs to move to Flatpak and equivalent."}, {"id": 50653952, "au": "close04", "dom": 16, "sr": 130, "s /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
