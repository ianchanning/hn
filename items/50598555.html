g": 1.803, "fa": 0.62, "gp": 0.464, "bl": 0.0, "ds": 0.0, "txt": "The ball is forced downwards when the trigger is pulled because liquid initially flows towards the dip tube, moving the ball onto the valve seat. Once seated, the pressure of the liquid above the ball keeps it firmly in place.\n\nThe illustration is not great because it looks like the ball forms a watertight seal in its upper position, rather than simply hitting a mechanical stop. This distinction is better illustrated in the original patent diagram [0].\n\nOnce the trigger is released, reduced pressure in the chamber causes liquid to flow up the dip tube, effectively reloading the sprayer.\n\n[0] - https://patents.google.com/patent/US4527741\n\nI'm neither a mechanical engineer nor a physicist, so feel free to correct my understanding."}, {"id": 50644209, "au": "ajb", "dom": 30, "sr": 3, "sc": 6.55, "ep": 6.55, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 58.3, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 8865, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.574, "fa": 0.68, "gp": 0.626, "bl": 0.0, "ds": 0.0, "txt": "Indeed, consumer stuff is often flimsy. I have a mop from a professional cleaning supplier, the same manufacturer makes ones that supermarkets sell and last a year. But their pro version is extremely robust, 5 years so far, no obvious wear. This is often the case with pro stuff; it's not always worth it because sometimes it's 10-20x the price, but nice when it is."}, {"id": 50634375, "au": "egypturnash", "dom": 66, "sr": 4, "sc": 6.5, "ep": 7.35, "bs": 0.85, "d": 8, "age": 19.88, "grav": 258.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 305, "qw": 0, "k": 16850, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.626, "fa": 0.68, "gp": 1.096, "bl": 0.32, "ds": 0.0, "txt": "Sure, fine, maybe you love learning to be a better prompter, maybe this dude loves learning to be a better engineer. People like doing all kinds of things. Some kids love taking things apart to see how they work, some don't. Some of those kids who love taking things apart grow up to be engineers and machinists and sculptors and designers and other kinds of craftspeople.\n\nAnd if some small machine in your life has stopped working, then you're probably going to have to buy a new one or get someone like this dude to fix it, while this dude has a pretty good chance of looking at it and taking out his pocket knife and some duct tape and fixing it. Does that have value? I'm not as far down the mechanical path as this dude but I am the more mechanically-inclined person in my household and it feels nice to do some small fix-up job myself, for me or my spouse.\n\nYou seem to prioritize getting online traction over all other results. There's a lot of middle ground between \"I don't care if anyone ever sees any of my work\" and \"I am 100% about making whatever The Social Media Algorithm will show to the most people\"; someone who's 100% about The Social Media Algorithm would be doing shit like Mr. Beast or making stuff that gets people arguing. You can make stuff and want people to see it without wanting to optimize your social media reach. Hell, you can make stuff and want to have an audience"}, {"id": 50631926, "au": "jrflo", "dom": 21, "sr": 5, "sc": 6.03, "ep": 6.17, "bs": 0.0, "d": 3, "age": 22.5, "grav": 316.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 69, "qw": 0, "k": 2001, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": ["https://en.wikipedia.org/wiki/Check_valve"], "ig": 1.469, "fa": 0.62, "gp": 0.659, "bl": 0.0, "ds": 0.0, "txt": "That's true, the animation is a bit confusing. I think in reality the ball is actually seated against the top of the straw at rest, and gets lifted up when there's suction force when the plunger is released. Gravity is returning the ball to being seated once the chamber is filled. Typically check valves have a spring return on the ball/sealing face, but gravity is probably used as a cost saving measure: https://en.wikipedia.org/wiki/Check_valve"}, {"id": 50632852, "au": "egypturnash", "dom": 64, "sr": 6, "sc": 5.85, "ep": 6.0, "bs": 0.0, "d": 6, "age": 21.51, "grav": 293.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 287, "qw": 0, "k": 16850, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.651, "fa": 0.28, "gp": 0.909, "bl": 0.0, "ds": 0.0, "txt": "If you do it the long way - disassembling the object, modeling one in a cad program, making it move, and building a web page that explains how it works - the you have learnt a few things:\n\n* you have, most obviously, learnt something about how this particular machine you are documenting works\n\n* you have practiced your CAD; maybe every part was trivial to model, maybe some were an interesting challenge that made you finally see what a tool you precious saw no use for is for, maybe you found a way to do something faster, you’re a little better at CAD in one way or another\n\n* you have practiced writing text that succinctly and precisely describes the action of the object, which will make you slightly better at communicating clearly in any situation\n\nYou have gained experience in multiple disciplines. The webpage is the excuse to have the experience of understanding these surprisingly complex little machines, and fooling around with the tools to document this understanding.\n\nPerhaps in the future you will use this knowledge to design some small, complex machines of your own, starting by lying back and modeling their parts and actions entirely in your mind, then taking them to the CAD software, printing them, experimenting with them in reality, seeing what doesn’t work as expected, thinking about how it could work better, and making a new version.\n\nPerhaps all of this could be done"}, {"id": 50634334, "au": "uptrails", "dom": 126, "sr": 7, "sc": 5.82, "ep": 5.82, "bs": 0.0, "d": 0, "age": 19.93, "grav": 259.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 52, "qw": 0, "k": 548, "kpp": 7.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": ["https://www.mltclean.com/wp-content/uploads/2021/07/trigger-spray-pump-part-list.jpg", "https://www.naboplastic.com/wp-content/uploads/2022/11/sectional-view-of-all-plastic-trigger-sprayer-structure.jpg"], "ig": 1.058, "fa": 0.62, "gp": 1.08, "bl": 0.0, "ds": 0.0, "txt": "I know it's pretty, but this is AI slop. It's not how the mechanism typically looks like. There are several popular designs. Here's one:\n\nhttps://www.mltclean.com/wp-content/uploads/2021/07/trigger-...\n\nThere are many inexplicable elements in what's shown on this page. My best guess is that this is AI trying to recreate the following drawing, which has some similarities:\n\nhttps://www.naboplastic.com/wp-content/uploads/2022/11/secti..."}, {"id": 50635643, "au": "augment_me", "dom": 59, "sr": 8, "sc": 5.7, "ep": 8.51, "bs": 2.52, "d": 11, "age": 18.17, "grav": 223.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 1479, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "attention_website", "flbl": "Attention & Website (Else)", "urls": [], "ig": 1.44, "fa": 1.23, "gp": 1.119, "bl": 0.95, "ds": 0.0, "txt": "This is pure survivorship bias. You guaranteed see a whole bunch of generated material you don't think is generated every single day. There were image generation websites benchmarks run to demonstrate this back in 2024 where people had an average of 56% detection rate (6% better than random).\n\nIf someone makes a low effort default harness post, it's not subtle.\n\nMuch like with the website, you simply don't know and assume that it's not."}, {"id": 50634896, "au": "QGQBGdeZREunxLe", "dom": 20, "sr": 9, "sc": 5.62, "ep": 5.91, "bs": 0.0, "d": 5, "age": 19.19, "grav": 243.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 72, "k": 399, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.654, "fa": 0.42, "gp": 0.572, "bl": 0.0, "ds": 0.0, "txt": "> Actually, gravity makes the ball drop as soon as the trigger stops moving.\n\nGravity helps the ball return to its seat, although not strictly necessary given that reverse flow pushes it downwards.\n\n> This doesn't explain why the reduced pressure doesn't draw fluid back in through the discharge. And the answer to that is that the discharge hole is very small. So the fact that this is a spray bottle designed for non-viscous fluids is actually integral to the design. If you want to pump a viscous fluid like soap you need a different design.\n\nThe original patent describes a second check valve (300). The conical skirt (312) flexes inwards under pressure, allowing liquid to flow towards the nozzle, but otherwise forms a seal against the surrounding wall.\n\nSo preventing backflow through the nozzle does not depend on the size of the discharge hole in this design."}, {"id": 50634645, "au": "squeedles", "dom": 111, "sr": 10, "sc": 5.6, "ep": 5.6, "bs": 0.0, "d": 0, "age": 19.51, "grav": 250.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 513, "kpp": 6.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.244, "fa": 0.34, "gp": 1.177, "bl": 0.0, "ds": 0.0, "txt": "This iteration of the spray bottle featured prominently in the 1964 worlds fair as technology of the future.   So much so that it is one of the few examples of \"concrete futurism\" (as opposed to the usual abstract futurism) that showed up on Star Trek TOS, but then quickly became very much not futuristic!"}, {"id": 50643617, "au": "fnord77", "dom": 141, "sr": 11, "sc": 5.24, "ep": 5.24, "bs": 0.0, "d": 2, "age": 0.69, "grav": 5.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 47, "qw": 0, "k": 3603, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": ["https://desikyspray.com/how-spray-bottles-work/\u0023mechanism"], "ig": 1.16, "fa": 0.62, "gp": 0.512, "bl": 0.0, "ds": 0.0, "txt": "actually I had to look this up.  It doesn't pressurize the vessel holding the water. It has a pre-compression chamber in the head of the sprayer that water enters when you pull the pump. Once the pressure reaches a threshold, the valve snaps open and out comes a very fine mist\n\nhttps://desikyspray.com/how-spray-bottles-work/\u0023mechanism"}, {"id": 50632277, "au": "adamgordonbell", "dom": 95, "sr": 12, "sc": 5.02, "ep": 5.02, "bs": 0.0, "d": 0, "age": 22.13, "grav": 308.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 5874, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.202, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Some newer spray bottles, Dawn Dish Spray i have, they spray longer than the handle is squeezed and things come out more smoothly.\n\nFeels like the pressure of squeeze is released at some constant rate over a bit longer time frame than the squeeze.\n\nNot sure what innovation that is but its nice."}, {"id": 50638234, "au": "userbinator", "dom": 104, "sr": 13, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 0, "age": 12.7, "grav": 126.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 111, "qw": 0, "k": 91629, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.595, "fa": 0.0, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "I may be one of the few readers here to think \"that's just a piston pump\" upon reading the title and glancing at the page... and indeed it is, but one quirk of this particular example is that one checkball serves as both the intake and exhaust valve, and the size of the nozzle orifice must be carefully matched with the viscosity of the fluid being pumped to allow the intake valve to work \"by vacuum\".\n\nThe few of these that I have taken apart (long ago) have always had two separate valves. I suppose in a very specific application designed for one fluid, not needing another valve may become a significant savings in extremely high volumes."}, {"id": 50634712, "au": "lisper", "dom": 19, "sr": 14, "sc": 4.68, "ep": 5.34, "bs": 0.0, "d": 4, "age": 19.44, "grav": 249.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 36, "k": 57898, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.332, "fa": 0.42, "gp": 0.697, "bl": 0.0, "ds": 0.0, "txt": "> The ball is forced downwards when the trigger is pulled because liquid initially flows towards the dip tube\n\nActually, gravity makes the ball drop as soon as the trigger stops moving.\n\n> Once the trigger is released, reduced pressure in the chamber causes liquid to flow up the dip tube\n\nThis doesn't explain why the reduced pressure doesn't draw fluid back in through the discharge.  And the answer to that is that the discharge hole is very small.  So the fact that this is a spray bottle designed for non-viscous fluids is actually integral to the design.  If you want to pump a viscous fluid like soap you need a different design."}, {"id": 50633322, "au": "sudobash1", "dom": 92, "sr": 15, "sc": 4.47, "ep": 4.69, "bs": 0.0, "d": 1, "age": 20.95, "grav": 281.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 9, "k": 1986, "kpp": 6.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.066, "fa": 0.42, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "> How much AI was involved in making these articles?\n\nNot the author, but probably not much (if any). Bryan has been making these for years, and they have stayed very consistent. There is a FAQ on how he makes these on the homepage.\n\nThis is a labor of love with excellent execution. When he releases another teardown it always pops up on HN. One of my favorite recurring things here."}, {"id": 50635824, "au": "marktani", "dom": 28, "sr": 16, "sc": 4.33, "ep": 4.48, "bs": 0.0, "d": 0, "age": 17.88, "grav": 217.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 144, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.879, "bl": 0.0, "ds": 0.0, "txt": "Too many spray bottles I've used just break with wear too easily.\n\nI used to do yoga frequently, you're supposed to clean the mat after class using the provided spray bottles filled with disinfectant. Pretty much all of them are borderline broken or require some quirks to have the spray mechanism work.\n\nEither you need to press the trigger very firmly to squeeze out a couple of drops, or the mechanism gets stuck after a single press and you need to reset it manually, which doesn't always work well either. Such a frustrating experience. Why can't we have nice spray bottles?!\n\nSome of the yoga studios I went to were quite high class and had premium glass spray bottles, too. Same issue. So it's not due to to cheap spray bottles.\n\nI guess spray bottles are typically not stress tested for thousands of avid yoga practitioners to keep using them dozens of times a day. What a shame!"}, {"id": 50633883, "au": "andai", "dom": 117, "sr": 17, "sc": 4.23, "ep": 4.67, "bs": 0.0, "d": 0, "age": 20.45, "grav": 270.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.214, "fa": 0.28, "gp": 0.703, "bl": 0.0, "ds": 0.0, "txt": "Wow, I never realized how much complexity is in there, that's crazy. And even crazier, the whole thing costs a few cents?\n\nI am not sure but I think my toilet flush mechanism has a lot of overlap with these mechanisms. (And the bit that stops it from refilling when it gets full. I once experienced what can happen when it doesn't work properly!)\n\nMight be interesting to do a breakdown of the toilet, too."}, {"id": 50630745, "au": "alembic_fumes", "dom": 35, "sr": 18, "sc": 4.17, "ep": 4.61, "bs": 0.0, "d": 0, "age": 23.85, "grav": 348.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 242, "kpp": 8.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": [], "ig": 1.138, "fa": 0.0, "gp": 1.336, "bl": 0.0, "ds": 0.0, "txt": "This is quite beautiful, but the glaring mistake is claiming that the \"The Piston chamber is empty\" after a push. It doesn't do that; there's no mechanism in the pump that drives air into the piston chamber to \"flush it out\" of the remaining liquid.\n\nUltimately it's a small oversight, but it's a very strange oversight."}, {"id": 50631582, "au": "ink_13", "dom": 17, "sr": 19, "sc": 4.13, "ep": 4.57, "bs": 0.0, "d": 2, "age": 22.9, "grav": 326.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 1621, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "This doesn't explain why the system doesn't run \"backwards\".  In the illustration, before the trigger is pulled, the ball seals against the upper chamber and leaves the piston open to the straw.  So why does pressing the piston cause the ball to be pushed into the straw instead of pushing fluid down the straw?  It would appear that adding pressure would only push the ball against the upper chamber more.\n\nAnd then at the end of the stroke, now the ball is sealing the straw and there's an open path through the upper chamber.  So why doesn't the piston refill with air?"}, {"id": 50630710, "au": "supermatt", "dom": 105, "sr": 20, "sc": 4.11, "ep": 4.11, "bs": 0.0, "d": 0, "age": 23.88, "grav": 349.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 6097, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": [], "ig": 0.87, "fa": 0.0, "gp": 1.421, "bl": 0.0, "ds": 0.0, "txt": "I find myself replacing the sprayer head more often than not these days. I don’t know if it was the move to plastic springs in packaged goods, but they just don’t seem reliable any more."}, {"id": 50632585, "au": "dgrcode", "dom": 91, "sr": 21, "sc": 4.07, "ep": 4.22, "bs": 0.0, "d": 0, "age": 21.8, "grav": 300.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 38, "qw": 0, "k": 91, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "attention_website", "flbl": "Attention & Website (Else)", "urls": ["https://ciechanow.ski/mechanical-watch/", "https://news.ycombinator.com/item?id=50599458"], "ig": 0.414, "fa": 0.62, "gp": 1.021, "bl": 0.0, "ds": 0.0, "txt": "This reminded me of https://ciechanow.ski/mechanical-watch/. The second today, with the first being https://news.ycombinator.com/item?id=50599458.\n\nHow much AI was involved in making these articles? I can't wait to ask Claude and have one of these produced on demand about any topic I'm curious about."}, {"id": 50631488, "au": "FinnLobsien", "dom": 110, "sr": 22, "sc": 3.87, "ep": 4.09, "bs": 0.0, "d": 0, "age": 23.02, "grav": 328.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 2689, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.126, "fa": 0.0, "gp": 0.998, "bl": 0.0, "ds": 0.0, "txt": "In design and engineering, we often pay attention to the most impressive, notable objects. But making a basic, cheap, intuitive thing that actually works as intended is quite hard, and those things deserve more appreciation."}, {"id": 50638159, "au": "agys", "dom": 102, "sr": 23, "sc": 3.8, "ep": 4.46, "bs": 0.0, "d": 0, "age": 12.89, "grav": 129.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 797, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.075, "fa": 0.28, "gp": 0.78, "bl": 0.0, "ds": 0.0, "txt": "A minor complaint about the illustrations: each shape has a fill color AND an outline; this adds much unneeded visual complexity to the interactive  explanations. I also have a slight trouble with the general contrast of text and images (mostly gray on gray?); but I might get old…"}, {"id": 50631406, "au": "rtkwe", "dom": 38, "sr": 24, "sc": 3.6, "ep": 4.26, "bs": 0.0, "d": 1, "age": 23.13, "grav": 331.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 31, "qw": 0, "k": 13337, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": ["https://www.sks-bottle.com/SprayInfo.html?srsltid=AYCX9vK8SfvvPLzvbhIS-tCNm6I-mLtItp1SCmaVDF0_M4_42ExnlBq3"], "ig": 1.059, "fa": 0.62, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Some types do get pretty close to empty. It depends a lot on the internal design of the piston. The little pump top spray bottles used for glasses cleaners get pretty close. https://www.sks-bottle.com/SprayInfo.html?srsltid=AYCX9vK8Sf..."}, {"id": 50631528, "au": "analog8374", "dom": 138, "sr": 25, "sc": 3.22, "ep": 3.66, "bs": 0.0, "d": 0, "age": 22.98, "grav": 327.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 42, "kpp": 0.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.404, "fa": 0.0, "gp": 0.25, "bl": 0.0, "ds": 0.0, "txt": "He should do one on modern bottle design. Like the kind of bottle that Gatorade and water comes in. Some of those modern plastic bottles are sweet. I mean the engineering is just exquisite.\n\nAbout a decade back they all shifted from one kind of lip to another. So that's interesting.\n\nAnd there are like five different ways of making it resealable. So that's interesting too.\n\nI actually save a lot of my plastic bottles because it's a shame to throw such a nice piece of art away."}, {"id": 50635897, "au": "RetroTechie", "dom": 37, "sr": 26, "sc": 3.02, "ep": 3.9, "bs": 0.0, "d": 2, "age": 17.75, "grav": 214.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 10, "k": 2332, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": [], "ig": 1.15, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> If you ask a physicist why water is sucked up a straw\n\nThe honest answer is that water in the straw is connected to an area with atmospheric pressure, which pushes the liquid towards an area with lower pressure (where you're sucking).\n\nWithout that atmospheric pressure, gravity would win & the water stay where it is."}, {"id": 50635873, "au": "exmadscientist", "dom": 29, "sr": 27, "sc": 2.88, "ep": 4.05, "bs": 0.0, "d": 1, "age": 17.79, "grav": 215.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 106, "qw": 0, "k": 5969, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.365, "fa": 0.0, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "The bottle being glass has nothing to do with the spray head being high quality. In fact, it's usually the opposite: they'll spend less on the spray head to pay for the bottle, or they're simply sourcing stuff from other vendors and don't know how to get a good spray head.\n\nIf you want durable stuff, go to the industrial supply people. It'll be ugly, but it will work. I have a Harris bottle that I don't use nearly as often as you describe, but I did let it sit for a year with moderately strong acid in it and it didn't seem to care. So that was nice!"}, {"id": 50640703, "au": "sho_hn", "dom": 2, "sr": 28, "sc": 2.85, "ep": 3.65, "bs": 0.0, "d": 1, "age": 6.12, "grav": 43.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 105, "qw": 0, "k": 15001, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.318, "fa": 0.0, "gp": 0.383, "bl": 0.0, "ds": 0.0, "txt": "Die Sendung mit der Maus is an absolute national treasure.\n\nIt's the only TV/video thing my 3yo is allowed to watch, and it's made her wonderfully inquisitive about how the world works, made her liken things to other things, given her intuitive grasp of how things work at times, etc.\n\nShe will literally quiz me about the materials things are made of and discuss why they were chosen, all because the show has made her take for granted that any object she interacts with has people, thoughts and a manufacturing process behind them, so there must be reasons why things are the way they are."}, {"id": 50637244, "au": "m_herrlich", "dom": 116, "sr": 29, "sc": 2.79, "ep": 3.23, "bs": 0.0, "d": 0, "age": 15.15, "grav": 166.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 83, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.064, "fa": 0.0, "gp": 0.501, "bl": 0.0, "ds": 0.0, "txt": "When I was a kid I tried to figure out why if you remove the nozzle completely and put it back together, it never sprays right again. I was hoping this would solve the mystery. It didn't but it was a fun site, and I appreciate the author's interest in how things work."}, {"id": 50634048, "au": "dgrcode", "dom": 94, "sr": 30, "sc": 2.7, "ep": 2.99, "bs": 0.0, "d": 2, "age": 20.29, "grav": 267.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 35, "k": 91, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.764, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Thanks for the pointer. I found this at the about section:\n> I take the product apart. CAD it up. Illustrate each view. Then animate and lay it out for the web. That sounds quick, but it does take me quite a bit of time to create each one.\n\nWe're so lucky to have people who build this kind of things as their hobby. Looking forward to the next one."}, {"id": 50631619, "au": "SamBam", "dom": 36, "sr": 31, "sc": 2.67, "ep": 3.77, "bs": 0.0, "d": 1, "age": 22.85, "grav": 324.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 12453, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "water_chamber", "flbl": "Water & Chamber (Straw)", "urls": [], "ig": 1.434, "fa": 0.0, "gp": 0.275, "bl": 0.0, "ds": 0.0, "txt": "Did the article get updated right after you said this? Because in my mind I remembered seeing the chamber get emptied, but when I look now it's never shown as empty.\n\nThe label in the \"Let's Step Through the Mechanism\" does say \"The piston chamber is emptied as the trigger is pulled,\" but the diagram clearly shows some blue liquid remaining, and the text can be interpreted generously as just implying that as much water as possible is expelled.\n\nIn any case, I feel like I see this a lot with explanations for why things get filled by negative pressure. If you ask a physicist why water is sucked up a straw, they might say that you're leaving behind a vacuum in the straw, and water fills it, even though these two things happen basically simultaneously, so you're never actually leaving a vacuum. But I feel like this just gets understood, even though it might be confusing."}, {"id": 50637910, "au": "pfedak", "dom": 93, "sr": 32, "sc": 2.55, "ep": 2.99, "bs": 0.0, "d": 2, "age": 13.42, "grav": 137.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 244, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "attention_website", "flbl": "Attention & Website (Else)", "urls": [], "ig": 1.271, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Can you link to some of his previous work? The earliest link shared on HN seems to be from six months ago (maybe there are more on the site which aren't on the homepage list?). I see some older industrial design and line drawings on his instagram and personal website but nothing along the lines of these interactive examples."}, {"id": 50633434, "au": "lambda", "dom": 54, "sr": 33, "sc": 2.52, "ep": 2.96, "bs": 0.0, "d": 6, "age": 20.85, "grav": 279.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 11958, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "attention_website", "flbl": "Attention & Website (Else)", "urls": [], "ig": 1.196, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Because being dishonest is bad. It's prisoners dilemma stuff, you might be able to get ahead a bit by cheating, but over time cheating makes everything worse for everyone.\n\nUndisclosed use of AI makes me distrust everything, meaning that I'm disengaging and avoiding things that I might have engaged with and spent money on had they not used AI.\n\nIn the iterated prisoners dilemma, cooperating is the rational strategy, if you must reduce everything to game theory terms."}, {"id": 50633721, "au": "brk", "dom": 97, "sr": 34, "sc": 2.48, "ep": 3.29, "bs": 0.0, "d": 1, "age": 20.59, "grav": 273.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 12190, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.334, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "One way check valve coupled with a piston/compression mechanism that can force liquid into the chamber in front of the nozzle faster than the nozzle can release the liquid.  Squeeze the trigger, upper chamber fills quickly with compressed liquid. Liquid continues to spray after you release the trigger until the chamber it was compressed into is at equilibrium with the atmospheric pressure."}, {"id": 50633186, "au": "nvalis", "dom": 3, "sr": 35, "sc": 2.3, "ep": 3.47, "bs": 0.0, "d": 1, "age": 21.11, "grav": 285.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 27, "qw": 0, "k": 532, "kpp": 9.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": ["https://www.wdrmaus.de/filme/sachgeschichten/naehmaschine.php5"], "ig": 0.805, "fa": 0.0, "gp": 1.091, "bl": 0.0, "ds": 0.0, "txt": "To this day I sometimes rewatch the episode about how a sewing machine works [0]. Their explanation is one of the only ones that I saw that really clicked for me.\n\n[0]: https://www.wdrmaus.de/filme/sachgeschichten/naehmaschine.ph..."}, {"id": 50631258, "au": "nico_h", "dom": 12, "sr": 36, "sc": 2.19, "ep": 3.51, "bs": 0.0, "d": 0, "age": 23.31, "grav": 335.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 652, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 0.499, "fa": 0.0, "gp": 1.61, "bl": 0.0, "ds": 0.0, "txt": "Nice, but what makes the “ball” the does the sealing go up and down? It’s not obvious in the illustration."}, {"id": 50635982, "au": "marktani", "dom": 31, "sr": 37, "sc": 2.06, "ep": 3.61, "bs": 0.0, "d": 2, "age": 17.62, "grav": 212.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 144, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "bottles_works", "flbl": "Bottles & Works (Spray)", "urls": [], "ig": 1.534, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That's a valid point, entirely possible.\n\nMy only other experience is with household cleaning spray bottles, and those have a high miss rate as well. I recently bought a refill pack for my bathroom cleaner and realized it isn't worth it since the bottle doesn't survive even the first cycle before the refill.\n\nI may invest in proper bottles, thanks for the recommendation! In my mind it should be possible to have a durable spray mechanism that lasts for years."}, {"id": 50630678, "au": "leggerss", "dom": 123, "sr": 38, "sc": 2.02, "ep": 3.12, "bs": 0.0, "d": 0, "age": 23.91, "grav": 350.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 39, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 0.864, "fa": 0.0, "gp": 0.755, "bl": 0.0, "ds": 0.0, "txt": "I know it's not on topic for a website about mechanical objects in the world around us, but I'd love to see renderings in this style for birds' lungs"}, {"id": 50635324, "au": "throwaway219450", "dom": 101, "sr": 39, "sc": 1.88, "ep": 3.27, "bs": 0.0, "d": 3, "age": 18.62, "grav": 232.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 376, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "ball_nozzle", "flbl": "Ball & Nozzle (Pressure)", "urls": [], "ig": 1.393, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Usually the design has some spring mechanism to keep the valve open, but if the pressure exceeds the spring force it will close the valve. The novelty must in the commodity manufacturing, as pressure regulation goes back to the steam age. My favorite example of this is the 9Barista stovetop espresso maker."}, {"id": 50632408, "au": "bahmboo", "dom": 96, "sr": 40, "sc": 1.72, "ep": 3.26, "bs": 0.0, "d": 1, "age": 21.99, "grav": 304.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 1395, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "love_animation", "flbl": "Love & Animation (Spray)", "urls": [], "ig": 1.302, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "I have been trying to figure that one out too. One has to be mindful that it will continue spraying after releasing the handle but the upside is the consistent delivery volume. Some engineer or engineering team is very proud of this mechanism I'm guessing! It needs to be used on paint or something that really could use this level of accuracy vs dish degreaser. I should give it a try."}, {"id": 50634391, "au": "nick_g", "dom": 121, "sr": 41, "sc": 1.69, "ep": 2.79, "bs": 0.0, "d": 0, "age": 19.85, "grav": 257.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 93, "kpp": 3.6, "t /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
