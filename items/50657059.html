50657631, "au": "amluto", "dom": 92, "sr": 2, "sc": 12.17, "ep": 12.17, "bs": 0.0, "d": 1, "age": 3.38, "grav": 20.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 75, "qw": 0, "k": 25674, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": ["https://eccc.weizmann.ac.il/eccc-reports/2008/TR08-005/Paper.pdf"], "ig": 1.406, "fa": 2.57, "gp": 1.064, "bl": 0.0, "ds": 0.0, "txt": "I'm thinking of the recent progress as a sort of completion of a research program that may have started with Valiant's VNP-completeness work and also perhaps this:\n\nhttps://eccc.weizmann.ac.il/eccc-reports/2008/TR08-005/Paper...\n\nWe've sort of known since the latter paper that it would be quite unlikely for there be an algebraic solution to NP, although I believe the new results are a lot stronger.\n\nYou can think of all this as proving that a very large class of algorithms can solve NP in polynomial time."}, {"id": 50659091, "au": "wilkystyle", "dom": 14, "sr": 3, "sc": 8.93, "ep": 8.93, "bs": 0.0, "d": 2, "age": 1.1, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 273, "qw": 28, "k": 1773, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": ["https://nymag.com/news/features/silicon-valley-2011-9/", "https://www.vanityfair.com/news/2023/09/artificial-intelligence-industry-future"], "ig": 1.695, "fa": 1.26, "gp": 0.937, "bl": 0.0, "ds": 0.0, "txt": "Not to stray too far off the topic, but this is exactly my concern with where agentic software development is going.\n\nPutting aside the capability question, if we assume a world where AI is able to perfectly execute on requirements, implement tests, validate correctness, and get all the way out to a finished product exactly as the user had in mind, that can only lead to the gradual loss of knowledge if we're not also still doing the thing ourselves. And without knowledge, we are no better than amateurs submitting mathematical proofs when they can't tell the good from the garbage.\n\nThis has already been demonstrated in software for as long as the industry has been around, except it has historically been because of formerly technical people being promoted higher and higher up a management ladder. I'm sure we can all think of examples in our own career, but I am also a fan of this particular anecdote about Mark Zuckerberg from a former Facebook employee [0].\n\nSimply put: Agency depends on knowledge, and knowledge comes from doing. You do not have true agency if you do not have sufficient knowledge to be able to make the decision that is aligned with your goals. Knowledge is inoculation against being misled and manipulated.\n\nI simply do not see a path to humankind retaining agency/control if we all offload the little details to AI and move higher up the stack. If you believe, as La"}, {"id": 50659335, "au": "Majromax", "dom": 15, "sr": 4, "sc": 6.07, "ep": 6.22, "bs": 0.0, "d": 3, "age": 0.76, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 78, "k": 3559, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.702, "fa": 0.42, "gp": 0.708, "bl": 0.0, "ds": 0.0, "txt": "> Putting aside the capability question, if we assume a world where AI is able to perfectly execute on requirements, implement tests, validate correctness, and get all the way out to a finished product exactly as the user had in mind, that can only lead to the gradual loss of knowledge if we're not also still doing the thing ourselves. And without knowledge, we are no better than amateurs submitting mathematical proofs, because we can't tell good from the garbage.\n\nIn a reductive sense, you've also described a compiler and assembler.  The 'machine itself' goes from code to the concrete implementation thereof that behaves 'exactly as the user [specifies via code]'.  Are we now no better than amateurs compared to the Story of Mel?\n\nWhat about our fancy typeset and printed books, compared to the illuminating monks of century past who had to 'do the thing themselves'?\n\nYes, I am engaging in a reducto ad absurdum argument here, but I'd truly like to know what draws the line between today's irreplaceable 'knowledge' and yesteryear's regrettable necessity."}, {"id": 50659052, "au": "someotherperson", "dom": 86, "sr": 5, "sc": 5.94, "ep": 5.94, "bs": 0.0, "d": 3, "age": 1.18, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 3390, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.629, "fa": 0.28, "gp": 0.906, "bl": 0.0, "ds": 0.0, "txt": "Someone's ability to use a tool doesn't correlate with how useful the tool is.\n\nThe Anthropic and OpenAI teams created custom harnesses specifically for this purpose. They're not using Claude Code or Codex for it. It has much more complex review loops, methods of escaping idea basins and they use it in (1) a swarm configuration that amateurs simply can't afford and (2) have access to faster inference that the public doesn't. This is not withstanding the lack of guardrails given that Anthropic has been shown to sandbag competing research."}, {"id": 50657554, "au": "ben_w", "dom": 104, "sr": 6, "sc": 5.93, "ep": 6.08, "bs": 0.0, "d": 2, "age": 3.51, "grav": 21.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 84, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": ["https://en.wikipedia.org/wiki/A-level_(United_Kingdom)"], "ig": 1.404, "fa": 0.62, "gp": 0.699, "bl": 0.0, "ds": 0.0, "txt": "If you're not already skilled in a field, it can be between \"difficult\" and \"impossible\" to know when an LLM is making stuff up or reporting accurately.\n\nThis is also why these things are getting discovered in the first place by professional mathematicians, not by people like me (whose highest maths qualification is the UK version of a university entrance exam* that I used to do a SWEng degree) typing in \"solve [famous problem], do a breakthrough, make no mistakes, don't give up until this is actually proven\".\n\n* https://en.wikipedia.org/wiki/A-level_(United_Kingdom)"}, {"id": 50658285, "au": "FartyMcFarter", "dom": 40, "sr": 7, "sc": 5.91, "ep": 5.91, "bs": 0.0, "d": 3, "age": 2.39, "grav": 14.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 5996, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.414, "fa": 0.56, "gp": 0.681, "bl": 0.0, "ds": 0.0, "txt": "When AI starts driving more and more technology development, it might be AI that starts deciding what parts of math are meaningful and useful for itself.\n\nFor example, I could easily imagine scenarios in which we tell an AI to factor a number, then it starts designing a quantum computer, and as part of that it starts making big developments in quantum complexity theory. This isn't even sci-fi at this point."}, {"id": 50658124, "au": "nickysielicki", "dom": 89, "sr": 8, "sc": 5.75, "ep": 5.9, "bs": 0.0, "d": 1, "age": 2.62, "grav": 15.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 9596, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.458, "fa": 0.5, "gp": 0.723, "bl": 0.0, "ds": 0.0, "txt": "I agree, but I think it’s important to note that this is not really evidence that scaling is dying and we’re approaching the end of AI capability growth. Rather, it’s evidence that we’re between hardware generations again and they’ve been forced by competition to exhaust their internal model capability lead.\n\nBetter hardware is coming, larger pretraining runs follow from that, and there’s no evidence of diminishing returns in larger pretraining runs yet."}, {"id": 50658631, "au": "101008", "dom": 1, "sr": 9, "sc": 5.27, "ep": 5.57, "bs": 0.0, "d": 0, "age": 1.85, "grav": 11.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 110, "qw": 0, "k": 3913, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.459, "fa": 0.28, "gp": 0.923, "bl": 0.0, "ds": 0.0, "txt": "I found it so weird people taking ownership of proofs when AI is doing all of them. I spent tons and tons of tokens on Google Neon Xhigh trying to solve Collatz conjecture. According to the conversation, it didn't proof Collatz, but in the middle it proved a lot of open Math problems, theorems, and more. Did I do something? No, I just asked to keep going, maybe saying \"Do Option A\" when asked which one of two routes take.\n\nI didnt publish anything because I am not sure if it's valid or not, and also because I don't feel responsible for it? Throwing theormeas and Lean files into the wild claiming something has been proven feels a bit irresponsible."}, {"id": 50659201, "au": "vikramkr", "dom": 78, "sr": 10, "sc": 4.94, "ep": 4.94, "bs": 0.0, "d": 1, "age": 0.95, "grav": 7.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 175, "qw": 0, "k": 6391, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.765, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "Improving their proof solving abilities reduces the bottleneck on proof production itself though, which is useful in cases where just being able to generate lots of proofs has utility but it hasn't been practical. Meaning formal verification. There's likely a small Jevons paradox that will play out where now that we have these AI driven cybersecurity crises, we start looking at formal verification, which gets easier as proving things gets cheaper, which means we invest effort into solving the shortcomings of formal verification, making it more useful, generating more proofs and RL data, etc and end up with proofs for formal verification being generated as routinely as unit tests. Which by the way also suffer from the problems of \"are you sure you're test/proving what you think you are?\"\n\nEach formal verification proof is low value, especially if it's proofslop in a vibe coded app the way we have unit test slop, but if proofs get cheaper, we can afford to do the continuous stream of lower value proofs, which in net is very valuable"}, {"id": 50658204, "au": "Aachen", "dom": 65, "sr": 11, "sc": 4.93, "ep": 5.08, "bs": 0.0, "d": 2, "age": 2.52, "grav": 15.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 7343, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.495, "fa": 0.28, "gp": 0.53, "bl": 0.0, "ds": 0.0, "txt": "Maybe because it's additional? The 10B people around the year 2100, we are going to have anyway and there's relatively little you can ethically do about it, but burning additional oil and gas to manufacture and power the datacentres these things run in is causing additional harm and doesn't feel as ethical\n\nIt's also simply interesting if someone hit upon the right path, did some great prompting/steering with their own knowledge, and got a proof with just a little bit of outsourced legwork, or if $author is burning millions to bruteforce their way there. Or if it's necessary and nobody can get there more efficiently. (This is all meant in the general case, not the submitted article specifically)"}, {"id": 50658141, "au": "yodsanklai", "dom": 74, "sr": 12, "sc": 4.57, "ep": 4.94, "bs": 0.0, "d": 0, "age": 2.6, "grav": 15.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 115, "qw": 0, "k": 9383, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.6, "fa": 0.0, "gp": 0.814, "bl": 0.0, "ds": 0.0, "txt": "I really fail to share the enthusiasm here (and I know a lot of mathematicians don't). Large AI proofs are mostly indecipherable for humans and knowing whether these conjectures are true or false has (most of the time) no practical implication.\n\nBesides, hard problems are good excuses for investing in maths research, which  indirectly benefits society: researchers teach to engineers, slowly extract abstractions and so on,  but solving hard millenium problems with AI doesn't help with any of this.\n\nWhat is very exciting though is how AI is helping with learning: I don't know if we see the effect of that already with students (the ones who do want to learn or take competitive exams), but it's a formidable tool."}, {"id": 50658705, "au": "sigmar", "dom": 77, "sr": 13, "sc": 4.38, "ep": 4.67, "bs": 0.0, "d": 1, "age": 1.74, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 25, "k": 5415, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.22, "fa": 0.42, "gp": 0.419, "bl": 0.0, "ds": 0.0, "txt": ">Large AI proofs are mostly indecipherable for humans and knowing whether these conjectures are true or false has (most of the time) no practical implication.\n\nHumans can read lean. So I don't think anything translated into lean is \"indecipherable\", difficult to decipher does not mean impossible to decipher.\n\nMath has a lot of practical applications. What is a math question you have with practical applications that these LLMs can't answer? We're getting what amounts to an \"oracle\" for almost any math question we currently know how to ask. That isn't impressive to you?"}, {"id": 50659288, "au": "CSSer", "dom": 9, "sr": 14, "sc": 4.28, "ep": 4.72, "bs": 0.0, "d": 2, "age": 0.83, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 257, "qw": 0, "k": 2365, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 1.753, "fa": 0.0, "gp": 0.411, "bl": 0.0, "ds": 0.0, "txt": "I really don't want to see a future where people are increasingly put in charge of something they're that far from understanding. Good movie producers have excellent taste, often as a result of understanding the business very well. Farmers do a lot of manual work, including the anticipation of problems many others probably wouldn't, to avoid killing the plants that produce the vegetables.\n\nOne thing ties both together elegantly. In both cases anyone is allowed to do it, and if they're not careful they can burn a great deal of money with no hope of any return very quickly. This feels really similar to what we're staring down the barrel of with so-called \"AI\", with the only differences being that any given individual is suddenly funneling a lot of money towards an even more narrowly concentrated set of people than ever before very quickly whenever they get out over their skis. I guess that would be fine for some of us prepared for the risk. After all, it's not illegal to make foolish financial decisions. Yet we're also telling everyone, all at once, that they no longer need to be the sorcerer's apprentice, and the only shield we're putting in place of that is a tiny disclaimer that reads \"AI can make mistakes\".\n\nA decade ago I sat in undergrad civics faced with a wealth inequality chart that already frightened me then. I look at the possible futures ahead of us now with horror wh"}, {"id": 50658380, "au": "atq2119", "dom": 119, "sr": 15, "sc": 3.55, "ep": 3.77, "bs": 0.0, "d": 1, "age": 2.21, "grav": 13.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 190, "qw": 0, "k": 4076, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.063, "bl": 0.0, "ds": 0.0, "txt": "It might have happened eventually, but I don't think it's a given at all. People were building the Lean Mathlib before LLMs. Lean is actually pretty modern in terms of tooling (LSP integration etc.), but it was slow moving. I believe that's mostly because of the sheer tediousness of translating between the way mathematicians think about proofs and how they're written in the literature vs. the way formal proofs are written.\n\nThe key ability of LLMs is handling that translation without tiring from the tediousness.\n\nPerhaps people would have eventually stumbled on better, less tedious ways of writing formal proofs, but it's far from obvious what that would look like and so you'd expect on the order of decades for that to happen naturally. That feels like it'd still be an interesting avenue of research, though it's less likely to get a lot of attention now.\n\nIn any case, it's certainly shaking up the field to see how many questions can be resolved \"simply\" by tirelessly searching through the space of proofs. There's an avalanche coming out right now, and it'll be interesting to see what happens once that dust has settled."}, {"id": 50657977, "au": "brap", "dom": 58, "sr": 16, "sc": 3.51, "ep": 3.95, "bs": 0.0, "d": 0, "age": 2.87, "grav": 17.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 139, "qw": 0, "k": 3511, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.484, "fa": 0.0, "gp": 0.32, "bl": 0.0, "ds": 0.0, "txt": "I don’t know about you but I think it’s cool af that math is having this GitHub+AI moment, I especially enjoy the distributed efforts where swarms of people and their agents are trying to collaborate on a problem together in the open like they’re cracking GTA.\n\nI wonder if there’s a way to create a true “hub” of math where anyone, man or AI, can contribute statements as long as they’re verifiably provable from the existing statements.\n\nI think mathlib is basically this but from what I know there’s strict human approval necessary. Just curious if we can do something without humans in the loop at all, just a huge unmoderated dump of everything we know. I guess one downside is that people would be able to spam lots of true statements that aren’t interesting at all, or encode all sorts of things you don’t want there."}, {"id": 50658992, "au": "munk-a", "dom": 137, "sr": 17, "sc": 3.43, "ep": 5.97, "bs": 2.54, "d": 5, "age": 1.26, "grav": 8.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.698, "fa": 0.22, "gp": 0.935, "bl": 0.96, "ds": 0.0, "txt": "Given the lack of any real moat around models the long term funding question is one we should all be keeping front of mind - it's unlikely the VC based money dumping will continue in perpetuity.  If Anthropic was unfunded and grew through earned revenue alone does it seem realistic that its training budget would be at the levels it currently enjoys?  Or would it have made modest accomplishments and then begun the inevitable enshittification as it tried to maximize revenue extraction for a minimal R&D overhead?"}, {"id": 50658866, "au": "iterateoften", "dom": 20, "sr": 18, "sc": 3.4, "ep": 3.84, "bs": 0.0, "d": 2, "age": 1.5, "grav": 9.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 769, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.529, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "Listening to mathematicians discuss, they only use levents name and Claude is a tool he is using. They all agree  that he was using in a sophisticated and pioneering way.\n\nAcademic circles think levent name will go down as the great mind who discovered a new paradigm of thinking with machines.\n\nOutside of Math people focus on the capitalist PR campaign to strip credit from the operator."}, {"id": 50659857, "au": "lanstin", "dom": 10, "sr": 19, "sc": 3.34, "ep": 3.78, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 3722, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.607, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I missed that past where we understood everything rather than just learning what works more or less without why.\n\nWealth inequality is really a separate issue from these technological ones - we could choose a different system. Bit of a fight but I think fairness and protecting the vulnerable is a popular value and numbers do tell in the end. Could be English model or French model or Indian model as far as violence goes."}, {"id": 50658857, "au": "sdenton4", "dom": 75, "sr": 20, "sc": 3.25, "ep": 4.13, "bs": 0.0, "d": 1, "age": 1.51, "grav": 9.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 11039, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.567, "fa": 0.0, "gp": 0.312, "bl": 0.0, "ds": 0.0, "txt": "Lucky for us, we can also leverage LLMs to organize, simplify, and understand proofs. I expect we'll understand these proofs within months, if not faster, where older major results took years to verify (through careful understanding, rather than Lean).\n\nJust yesterday I believe someone has already reduced the Lean Riemann proof from 17M lines of Lean to under 100k.\n\nWe live in a different world now."}, {"id": 50658698, "au": "baq", "dom": 84, "sr": 21, "sc": 3.12, "ep": 3.41, "bs": 0.0, "d": 3, "age": 1.75, "grav": 10.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 21723, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.35, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "6.2 astra is almost incomprehensibly intelligent.\n\nThe best way to talk with it is via opus or neon. It destroys hardest logic problems you can reasonably have in software engineering at almost all levels. The only issue is the way it was rl-fried to be concise instead of using low friction prose - it compresses what it says too much."}, {"id": 50657864, "au": "p-o", "dom": 110, "sr": 22, "sc": 2.96, "ep": 3.62, "bs": 0.0, "d": 0, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 363, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.441, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "With all these proofs coming out, I am expecting the math community to eventually look at all those proofs holistically and just review the way pure math is done.\n\nFrom what I've been reading thus far, my understanding is that proof on their own merit isn't really worthwhile until the concepts can be digested by the community.\n\nRight now, the community is being flooded by proofs and understanding has taken the back seat.\n\nMath is the language of the universe, but it's _our_ language of the universe. We need to understand the words in order for it to makes sense. Whether it compiles in Lean or not doesn't mean it's meaningful to us, it just means that within the current framework, the blocks assemble themselves and hold on their own, metaphorically speaking."}, {"id": 50657577, "au": "bananaflag", "dom": 116, "sr": 23, "sc": 2.96, "ep": 2.96, "bs": 0.0, "d": 0, "age": 3.47, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 16, "qw": 0, "k": 1673, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": ["https://philpapers.org/rec/PRUPN"], "ig": 0.837, "fa": 0.28, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "Glad that they used BSS-style complexity.\n\nP!=NP was proven for some algebraic structures in this manner:\n\nhttps://philpapers.org/rec/PRUPN"}, {"id": 50658779, "au": "gspr", "dom": 56, "sr": 24, "sc": 2.9, "ep": 3.71, "bs": 0.0, "d": 1, "age": 1.61, "grav": 10.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 3159, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.579, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I find math a good fit for AI, since exploration of what might be true is a lot closer to search than writing a prosaic text or a computer program that should remain maintainable are.\n\nBut still, the purpose of mathematics is to increase human insight. There's no doubt in my mind that an AI suggesting proofs for longstanding conjectures does that. Armies of trained mathematicians stand at the ready to devour said proofs. This is good (rare words from someone who's pretty anti-AI).\n\nBut what you suggest seems like it would, if it worked, quickly run away from humans. What's the point? If it's successful, the humans quickly become the bottleneck again. We are at the center of this. Not the machines."}, {"id": 50657592, "au": "skeledrew", "dom": 101, "sr": 25, "sc": 2.86, "ep": 3.16, "bs": 0.0, "d": 3, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 2262, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.931, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "A bit early (only 9 minutes so far) since your comment, but the only other maybe answer I see in reply is just as incomprehensible. ChatGPT/Claude would've given a full layman breakdown in a few seconds. Let's see how long it takes for a \"real answer\" to drop."}, {"id": 50657935, "au": "munk-a", "dom": 135, "sr": 26, "sc": 2.67, "ep": 3.88, "bs": 0.85, "d": 3, "age": 2.94, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 0, "k": 18049, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.583, "fa": 0.0, "gp": 0.112, "bl": 0.32, "ds": 0.0, "txt": "Rather than being made with a super-secret internal model this conjecture was made by someone interested correctly leading a model towards the conjecture.  Both OpenAI and Anthropic seem to be using \"Look at all the breakthroughs only we can do\" to garner significant publicity and, likely, funding.  It would certainly be more interesting if this was done with a community trained model but it at least somewhat deflates the argument of \"Look at all this progress that is only possible if you give us billions of dollars to burn on model execution\" since an interested third party was able to reach the conjecture independently."}, {"id": 50657816, "au": "joink1", "dom": 118, "sr": 27, "sc": 2.55, "ep": 5.43, "bs": 2.52, "d": 0, "age": 3.11, "grav": 18.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 0, "kpp": 0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.671, "fa": 0.28, "gp": 0.488, "bl": 0.95, "ds": 0.0, "txt": "How much of academic math work is still taking place on a whiteboard and Latex/PDFs? I have a feeling that everything from how math is taught, to how it's researched in schools , shared/presented across different fora, worked on, etc... is very old school, compared to (for example) software engineering. But I honestly don't know, so asking in good faith.\n\nI genuinely wonder if this level of velocity could've been unlocked sooner, and without LLMs, had the work was happening over something akin to Python and the tooling was much more \"modern\"...\n\nEdit: nothing like getting downvoted for asking a question."}, {"id": 50658186, "au": "Jaxan", "dom": 140, "sr": 28, "sc": 2.44, "ep": 3.32, "bs": 0.0, "d": 2, "age": 2.54, "grav": 15.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 1020, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.305, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I’m not talking about the proofs. Only about the definitions in the theorem statement.\n\nHave you seen the definition of reimannZeta? It is nothing like the Wikipedia definition of an infinite sum (because it’s only defined for half the plane and you need an analytic continuation). I have a background in maths, but I have to trust experts on the fact that the lean definition is the right one.\n\nIf LLMs would define riemannZeta, I wouldn’t trust it at all. Luckily it was already defined.\n\nBut with these newer results? I’m not sure."}, {"id": 50658402, "au": "_cs2017_", "dom": 113, "sr": 29, "sc": 2.42, "ep": 3.3, "bs": 0.0, "d": 1, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 78, "qw": 0, "k": 1286, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.321, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "All of this is pure math, with zero practical implications.\n\nThink of it as an art form or a game like chess or go: it has no direct impact on compute or for that matter on anything other than the art or the game itself.\n\nIndirectly, however, it does have an impact: once AI beat humans at go, the same techniques eventually were applied to other areas, more investment flowed into AI that eventually led to other breakthroughs, etc."}, {"id": 50657865, "au": "markasoftware", "dom": 72, "sr": 30, "sc": 2.39, "ep": 3.13, "bs": 0.0, "d": 3, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1051, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.33, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yes, wildly so, and of course specifics of the datacenter too. From about a year ago, Google estimated that the average gemini prompt used <0.5mL of water. Given improvements in model efficiency I'd be surprised if it wasn't quite lower now."}, {"id": 50658625, "au": "civvv", "dom": 115, "sr": 31, "sc": 2.19, "ep": 2.19, "bs": 0.0, "d": 0, "age": 1.86, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 96, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.888, "fa": 0.0, "gp": 0.069, "bl": 0.0, "ds": 0.0, "txt": "Can some rich person ask Claude to prove something actually interesting, like the Holographic Principle and Emergent space-time?"}, {"id": 50658825, "au": "_verandaguy", "dom": 30, "sr": 32, "sc": 2.17, "ep": 3.56, "bs": 0.0, "d": 2, "age": 1.55, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 1728, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.364, "fa": 0.0, "gp": 0.246, "bl": 0.0, "ds": 0.0, "txt": "So then what's the point?\n\nLLMs don't think in the sense that they have internal motivation, curiosity, or really a purpose. They have nothing to gain, inherently, by expanding the frontier of math at speeds that humans can't keep up with.\n\nAt some point this is trivializing a field of research, interest, and intellectual passion for what is basically just publicity for the hyperscalers. Maybe along the way they publish (or enable) a solution for practical prime factorization in P, and all the knock-on effects we're not ready for because we'd assumed we had a few more years to get ready.\n\nIt's cheap, and it's in poor taste, and it might be a net bad for humankind."}, {"id": 50657574, "au": "Aboutplants", "dom": 81, "sr": 33, "sc": 2.09, "ep": 3.19, "bs": 0.0, "d": 0, "age": 3.47, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 1914, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.738, "bl": 0.0, "ds": 0.0, "txt": "If consumer Fable 5.2 is able to produce cutting edge math, perhaps their internal models are not all that much stronger than current. They just throw more compute at it"}, {"id": 50659533, "au": "pishpash", "dom": 60, "sr": 34, "sc": 1.95, "ep": 2.54, "bs": 0.0, "d": 1, "age": 0.5, "grav": 5.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 1637, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.079, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "That'll be the enshittification of science. Some will call it democratizing, but look at how shitty most software is after it was no longer an expert field to get a taste. It's maybe fine for building the obsolete-in-a-year junk, but for something meant to stand the test of time?"}, {"id": 50657496, "au": "Jaxan", "dom": 138, "sr": 35, "sc": 1.89, "ep": 3.14, "bs": 0.0, "d": 0, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 1020, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.337, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’m getting less and less convinced about the correctness of these. For the Riemann hypothesis, we had the statement completely written by humans before LLMs were relevant. (And when unfolding all definitions, it’s hundreds/thousands of line of lean code, so not trivial at all.) But I fear that none of the definitions in these theorems are checked properly by people. They definitely are not part of mathlib."}, {"id": 50658799, "au": "iterateoften", "dom": 13, "sr": 36, "sc": 1.79, "ep": 3.33, "bs": 0.0, "d": 1, "age": 1.57, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 20, "k": 769, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.792, "fa": 0.42, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "> I didnt publish anything because I am not sure if it's valid or not, and also because I don't feel responsible for it?\n\nMathematicians have been getting many collatz proofs a day for years from amateurs. Lots of people think they have something but like you they aren’t capable of sorting rubbish from the truth."}, {"id": 50657534, "au": "smusamashah", "dom": 26, "sr": 37, "sc": 1.72, "ep": 3.26, "bs": 0.0, "d": 0, "age": 3.54, "grav": 21.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 11490, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.938, "fa": 0.0, "gp": 0.73, "bl": 0.0, "ds": 0.0, "txt": "At this rate, as a layman it looks like math problems/conjectures will just become everyday thing that a mathematicians solves as part of much much bigger problems. It looksike programming, you ask AI to write something trivial (current definition of trivial) for you while you keep working on much bigger system or architecture.\n\nA mathematician has a hunch, comes up with a conjecture, asks AI to verify it, and moves on with the bigger problem at hand. This can of course be extrapolated further but I don't have brains for that much."}, {"id": 50658747, "au": "baq", "dom": 114, "sr": 38, "sc": 1.69, "ep": 2.5, "bs": 0.0, "d": 1, "age": 1.65, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 21723, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.063, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, not the results for the most part, but the techniques of mass produced formalization are immediately useful in software and hardware (as in, CPUs, gpus, etc.) design."}, {"id": 50658085, "au": "preommr", "dom": 83, "sr": 39, "sc": 1.66, "ep": 2.99, "bs": 0.0, "d": 2, "age": 2.69, "grav": 16.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 5068, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.937, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "And the reception to 6.2 as a model has been... let's say underwhelming.\n\nI think there's a real conversation to be had about how maybe a lot of math problems are closer to something like chess, where there's this perception of being exclusive to smart people, but is... \"amenable\" to being \"brute forced\"."}, {"id": 50659825, "au": "jltsiren", "dom": 3, "sr": 40, "sc": 1.65, "ep": 3.19, "bs": 0.0, "d": 2, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 6351, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.299, "fa": 0.0, "gp": 0.097, "bl": 0.0, "ds": 0.0, "txt": "Building your house yourself (or at least doing a large part of the work) used to be common. In some places it still is.\n\nAcademic authorship standards vary a bit from field to field, but the core idea is well established. If you made a substantial contribution, you are an author. Coming up with with the funding is usually insufficient for authorship."}, {"id": 50658626, "au": "ibejoeb", "dom": 80, "sr": 41, "sc": 1.63, "ep": 3.18, "bs": 0.0, "d": 2, "age": 1.86, "grav": 11.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 9, "qw": 0, "k": 5643, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": ["https://cs.uchicago.edu/people/samuel-everett/"], "ig": 0.745, "fa": 0.5, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sam Everett appears to be a legitimate complexity theory researcher: https://cs.uchicago.edu/people/samuel-everett/"}, {"id": 50657731, "au": "xpct", "dom": 67, "sr": 42, "sc": 1.62, "ep": 3.16, "bs": 0.0, "d": 2, "age": 3.23, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 806, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 1.344, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Well, right now we're at a stage where presumably not everyone gets the same mileage from their LLM use. And for public good, part of sharing proofs should also come with sharing workflows used to achieve said proofs.\n\nCosts could serve as a good reference point for how difficult a problem was to solve and what you can expect from similar problems, or whether your approach is miscalibrated."}, {"id": 50658065, "au": "dist-epoch", "dom": 111, "sr": 43, "sc": 1.61, "ep": 2.85, "bs": 0.0, "d": 1, "age": 2.73, "grav": 16.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 13, "k": 3027, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.705, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> merit isn't really worthwhile until the concepts can be digested by the community.\n\nThat was also because without formal proof (LEAN), you needed other people to understand your proof so there is reasonable belief it was correct."}, {"id": 50658800, "au": "holistio", "dom": 22, "sr": 44, "sc": 1.52, "ep": 2.18, "bs": 0.0, "d": 2, "age": 1.57, "grav": 9.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 678, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.928, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Levent Alpöge.\n\nApparently \"prove P=NP, make no mistakes\" doesn't work, so I guess his name is somewhat important."}, {"id": 50657625, "au": "ben_w", "dom": 107, "sr": 45, "sc": 1.45, "ep": 2.77, "bs": 0.0, "d": 4, "age": 3.39, "grav": 20.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.178, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Even so, knowing what questions to ask, and how to make sure it doesn't go off the rails, is still not totally trivial: ChatGPT does still give me false answers to much simpler things (OpenSCAD tasks), even this week.\n\nBut when it's a domain I'm highly familiar with (writing software), I can get excellent results."}, {"id": 50659209, "au": "pishpash", "dom": 21, "sr": 46, "sc": 1.42, "ep": 2.96, "bs": 0.0, "d": 3, "age": 0.94, "grav": 6.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 1637, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.262, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I suspect history will start with the Four Color Theorem and end with whatever most significant machine discovery will be then current. If Alpoge doesn't settle for a passing footnote, he'll need to keep producing at the forefront for a while."}, {"id": 50659690, "au": "terryf", "dom": 5, "sr": 47, "sc": 1.22, "ep": 2.77, "bs": 0.0, "d": 3, "age": 0.24, "grav": 4.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 1569, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.177, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It is not a category error. \"Software I built\" is the same. I did not build the language spec or the compiler or the editor or the libraries that I use in the software.\n\nAnd please do take a look at the parent comment before trying to derail the conversation is my response to the second quote."}, {"id": 50658319, "au": "adrianN", "dom": 36, "sr": 48, "sc": 1.2, "ep": 2.74, "bs": 0.0, "d": 3, "age": 2.33, "grav": 14.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 33048, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.826, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "There are some easy upper bounds for human mathematicians. For example we start to get into trouble once the problem statements don’t fit in our brains anymore. As of now we’re quite far away from the easy upper bounds."}, {"id": 50657712, "au": "jstummbillig", "dom": 35, "sr": 49, "sc": 1.19, "ep": 2.73, "bs": 0.0, "d": 2, "age": 3.25, "grav": 19.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 6624, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.999, "fa": 0.0, "gp": 0.263, "bl": 0.0, "ds": 0.0, "txt": "I too would be interested to know. Is there an obvious ceiling to mathematical research? Naively, solving problems continually expands the space of problems that can meaningfully be investigated. Is that not how it works in maths?"}, {"id": 50659130, "au": "guyomes", "dom": 8, "sr": 50, "sc": 1.18, "ep": 2.06, "bs": 0.0, "d": 1, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 3, "k": 428, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.786, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "> Did I do something?\n\nThere are several way to look at this.\n\nIf you spent money for that, you did something, like the producer of a movie, or maybe like the executive producer.\n\nIf you spent some time on it, you also did something, maybe like a farmer who supervises the growing of vegetables, even though he might not understand the actual reproduction process that happens at the biological level.\n\nSo maybe the process did not involve you doing math, but I would say that you definitively did something."}, {"id": 50658749, "au": "xandrius", "dom": 66, "sr": 51, "sc": 1.16, "ep": 2.7, "bs": 0.0, "d": 3, "age": 1.65, "grav": 10.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 3521, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.149, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Why jumping to that? One could be running the thing locally, using solar powered setup.\n\nHonestly thinking of the current impact of AI on the environment vs literally everything else is kind of silly."}, {"id": 50658744, "au": "mikestylz", "dom": 27, "sr": 52, "sc": 1.12, "ep": 2.66, "bs": 0.0, "d": 1, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 70, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.852, "fa": 0.0, "gp": 0.454, "bl": 0.0, "ds": 0.0, "txt": "Why would you expect mathematicians to keep up with the edge? It seems more likely to me that we are about to be overtaken. Then the frontier will expand so fast that humans will never again be able to map its edge."}, {"id": 50658444, "au": "deadbabe", "dom": 121, "sr": 53, "sc": 1.12, "ep": 2.22, "bs": 0.0, "d": 1, "age": 2.14, "grav": 12.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 1093, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 0.944, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Math can't be solved, it's infinite, and this was proven long ago with Kurt Gödel’s incompleteness theorems. There are true statements that can never be proven."}, {"id": 50657707, "au": "ogogmad", "dom": 117, "sr": 54, "sc": 1.09, "ep": 2.19, "bs": 0.0, "d": 0, "age": 3.26, "grav": 19.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 3147, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.854, "fa": 0.0, "gp": 0.128, "bl": 0.0, "ds": 0.0, "txt": "BSS is not a realistic model (haha) of real-numbered computability. TTE is the standard model for that."}, {"id": 50659295, "au": "kenferry", "dom": 17, "sr": 55, "sc": 1.09, "ep": 2.63, "bs": 0.0, "d": 1, "age": 0.81, "grav": 6.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 2135, "kpp": 5.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 1.057, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "I kind of think the opposite? Saying “Claude” did something disclaims responsibility.\n\nWhen you use google to make a decision, if the decision is wrong it’s still your fault, and if the decision is right then good job.\n\nIt’s appropriate that you not publish your math results if you don’t feel like you can stand behind them. That’s a good thing!"}, {"id": 50657667, "au": "latentsea", "dom": 63, "sr": 56, "sc": 1.09, "ep": 2.62, "bs": 0.0, "d": 2, "age": 3.31, "grav": 20.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 1084, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.897, "fa": 0.0, "gp": 0.354, "bl": 0.0, "ds": 0.0, "txt": "I would assume it's valuable to learn how much a task of that nature costs. We don't have much data in it. I'm somewhat interested to know, for the resources I have access to, what might I be able to achieve by just throwing money at it?"}, {"id": 50658009, "au": "mesrik", "dom": 34, "sr": 57, "sc": 1.09, "ep": 2.57, "bs": 0.0, "d": 3, "age": 2.81, "grav": 16.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 189, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 1.094, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Spot on!\n\nWithout being mathematician, it's not too hard understand those who are thoughts. That some now few got access, quoting Jobb's analogy, the Ferrari's of the mind while they still got to ride in comparison bicycles of the mind computing resources."}, {"id": 50657784, "au": "int3trap", "dom": 82, "sr": 58, "sc": 1.09, "ep": 2.53, "bs": 0.0, "d": 1, "age": 3.16, "grav": 19.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 29, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.974, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "6.2 Astra is the model that produced the Navier Stokes solution. Consumer models from the frontier labs are incredibly capable right now. Compute will be the bottleneck for most."}, {"id": 50657576, "au": "rubikscube09", "dom": 105, "sr": 59, "sc": 1.09, "ep": 2.44, "bs": 0.0, "d": 3, "age": 3.47, "grav": 21.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 185, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.815, "fa": 0.0, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "A lot of these things are getting discovered totally autonomously - the mathematicians seem to just be imparting some \"research taste\" from time to time."}, {"id": 50659638, "au": "twiceaday", "dom": 4, "sr": 60, "sc": 1.09, "ep": 2.36, "bs": 0.0, "d": 2, "age": 0.33, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 10, "k": 1525, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.413, "fa": 0.42, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "That is a category error. \"house we built\" is just a saying. It is not meant to be taken literally. You should be surprised if they actually built it.\n\n> If it is wrong, then who can actually say it?\n\nImplying somebody must own the narrative of building the entire house? Why?"}, {"id": 50659034, "au": "jstummbillig", "dom": 37, "sr": 61, "sc": 1.09, "ep": 2.36, "bs": 0.0, "d": 4, "age": 1.22, "grav": 8.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 6624, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 1.003, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Me making progress on a piece of code never required me to fit the whole system in my head, and that is becoming only more true with better AI. Why is it fundamentally different for math?"}, {"id": 50657583, "au": "ben_w", "dom": 47, "sr": 62, "sc": 1.09, "ep": 2.19, "bs": 0.0, "d": 1, "age": 3.45, "grav": 21.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 30352, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.786, "fa": 0.0, "gp": 0.24, "bl": 0.0, "ds": 0.0, "txt": "It's currently solving the biggest problems we've got, including the problems of figuring out how big a question we can have before the answer can't be stated either true or false within the axioms of mathematics."}, {"id": 50657638, "au": "user43928", "dom": 87, "sr": 63, "sc": 1.09, "ep": 2.19, "bs": 0.0, "d": 1, "age": 3.37, "grav": 20.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1431, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.823, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "The METR report indicated no significantly better internal model, rather steps of the Opus 5.5 -> Fable 5.2 size.\n\nI also think they would have released a better model for the IPO if they had one."}, {"id": 50658811, "au": "rjh29", "dom": 18, "sr": 64, "sc": 1.09, "ep": 2.09, "bs": 0.0, "d": 1, "age": 1.56, "grav": 9.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 3990, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.778, "fa": 0.0, "gp": 0.183, "bl": 0.0, "ds": 0.0, "txt": "When people dump Lean code without even checking it themselves, and even the readme is AI-written, that tells you all you need to know. It's just clout chasing."}, {"id": 50657985, "au": "bananaflag", "dom": 94, "sr": 65, "sc": 1.09, "ep": 2.05, "bs": 0.0, "d": 1, "age": 2.86, "grav": 17.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 1673, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.825, "fa": 0.0, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "In the classical world PAR is equivalent to PSPACE, so this result is the analogue of NP vs PSPACE."}, {"id": 50657394, "au": "SolarNet", "dom": 95, "sr": 66, "sc": 1.09, "ep": 1.87, "bs": 0.0, "d": 1, "age": 3.74, "grav": 23.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 1813, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.796, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If P/NP is binary strings, this is the proof for real numbers. It's a variant that is closing in on a general version."}, {"id": 50658160, "au": "raverbashing", "dom": 90, "sr": 67, "sc": 1.09, "ep": 1.83, "bs": 0.0, "d": 1, "age": 2.58, "grav": 15.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 23295, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "But note it used the previous AI result of VP ≠ VNP which might have used a more powerful model, so the work it did might have been \"easier\" here"}, {"id": 50657557, "au": "dyauspitr", "dom": 131, "sr": 68, "sc": 1.09, "ep": 1.81, "bs": 0.0, "d": 4, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.769, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I mean the way it’s probably going to go is that 6-8 month gap just means that the frontier models are going to solve these things 6 to 8 months earlier. Plus, I’ve tried the open models specially Deepseek and GLM and they seem to be optimized for general everyday tasks which Claude and GPT do too but the Chinese models just seem much more basic. I can’t put my finger on it and I’m not being xenophobic here."}, {"id": 50659281, "au": "terryf", "dom": 2, "sr": 69, "sc": 1.09, "ep": 1.8, "bs": 0.0, "d": 1, "age": 0.84, "grav": 6.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 88, "qw": 0, "k": 1569, "kpp": 5.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.36, "fa": 0.0, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "Lots of people say \"Look at the nice house we built here that we live in now\" when in fact they just paid someone to design it and then someone else to build it and made sure these things happen the way they want them to.\n\nIs it wrong to say that we built this house? If it is wrong, then who can actually say it? The construction manager that told the individual builters what to do? The individual builder that just put up a part of the drywall?"}, {"id": 50657498, "au": "stephbook", "dom": 128, "sr": 70, "sc": 1.09, "ep": 1.77, "bs": 0.0, "d": 2, "age": 3.58, "grav": 22.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 635, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_consumer", "flbl": "Models & Consumer (Interested)", "urls": [], "ig": 0.754, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "With this logic we don't need second-rate models either because we can do it with pen and paper, even if it takes hundreds of years and thousands of people."}, {"id": 50657754, "au": "andai", "dom": 134, "sr": 71, "sc": 1.09, "ep": 1.75, "bs": 0.0, "d": 5, "age": 3.2, "grav": 19.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 45, "qw": 0, "k": 18185, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.746, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I heard the way it works is, you only need to beat the other runners by a hair's width to get the gold medal.\n\nIt's the same way in many parts of life. You can't propose to the girl you like, 6-8 months after the other guy."}, {"id": 50659346, "au": "NooneAtAll5", "dom": 64, "sr": 72, "sc": 1.09, "ep": 1.72, "bs": 0.0, "d": 2, "age": 0.75, "grav": 6.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 16, "k": 113, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 0.708, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "> We never really cared to ask how long some proof took to make, so why now?\n\nwe definitely did and still do - when it's a long normal computation\n\nseeing \"this took X core-years\" in the paper was cool, same here"}, {"id": 50658940, "au": "skybrian", "dom": 28, "sr": 73, "sc": 1.09, "ep": 1.72, "bs": 0.0, "d": 2, "age": 1.37, "grav": 8.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 27987, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mathematicians_humans", "flbl": "Mathematicians & Humans (Research)", "urls": [], "ig": 0.731, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Mathematicians are the customers. The AI is working for them. Without customers, you don't have a business. Non-mathematicians don't care about these kinds of results.\n\nBut they are also influencers of a sort, so the question is, after they find something, can they get other mathematicians to be interested in it? Or maybe non-mathematicians if there are practical consequences."}, {"id": 50658694, "au": "heyjamesknight", "dom": 41, "sr": 74, "sc": 1.09, "ep": 1.66, "bs": 0.0, "d": 4, "age": 1.76, "grav": 10.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1862, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "software_math", "flbl": "Software & Math (Results)", "urls": [], "ig": 0.706, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It can't. Nothing is meaningful to an LLM. They have no interests. It might find a certain path useful for an existing task given by a person. But an LLM will never decide what is meaningful."}, {"id": 50657671, "au": "darkwi11ow", "dom": 68, "sr": 75, "sc": 1.09, "ep": 1.57, "bs": 0.0, "d": 2, "age": 3.31, "grav": 20.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 281, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.668, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Previously proofs were human work, now the token spend is like electricity spend.\nI know very well how much kWh my servers use, why it should be different for tokens ?"}, {"id": 50657465, "au": "FartyMcFarter", "dom": 96, "sr": 76, "sc": 1.09, "ep": 1.56, "bs": 0.0, "d": 2, "age": 3.65, "grav": 22.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 5996, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 0.662, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "IIUC, PAR_R is parallel polynomial time over Turing machines that can manipulate real numbers.\nSo PAR_R vs NP_R is not analogous to P vs NP I think."}, {"id": 50658606, "au": "adalacelove", "dom": 85, "sr": 77, "sc": 1.09, "ep": 1.5, "bs": 0.0, "d": 3, "age": 1.91, "grav": 11.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 364, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.553, "fa": 0.0, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "What is intelligent then? Maybe is just the ability to consider lot of possibilities unconsciously? If by brute force we achieve every possible outcome achieved by intelligence what is the difference? It seems that \"intelligence\" is an ill-defined concept that should be discarded the way we discarded aether. Or maybe we still lack the knowledge to define it the way we didn't know what temperature really was for a long time."}, {"id": 50657594, "au": "xpct", "dom": 61, "sr": 78, "sc": 1.09, "ep": 2.66, "bs": 1.19, "d": 0, "age": 3.44, "grav": 21.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 806, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "proofs_lean", "flbl": "Proofs & Lean (Formal)", "urls": [], "ig": 0.78, "fa": 0.0, "gp": 0.572, "bl": 0.45, "ds": 0.0, "txt": "I think it's a valuable signal now for open sourcing proofs to also disclose how much compute it cost, number of tokens spent would suffice as a good proxy."}, {"id": 50658390, "au": "dyauspitr", "dom": 136, "sr": 79, "sc": 1.09, "ep": 2.91, "bs": 1.7, "d": 4, "age": 2.2, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 1594, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "crowd_chatter", "facet": "chatgpt_instead", "flbl": "Chatgpt & Instead (Ask)", "urls": [], "ig": 1.237, "fa": 0.0, "gp": 0.0, "bl": 0.64, "ds": 0.0, "txt": "Everything you say is unrealistic. How exactly are they supposed to train the expensive models if they can’t raise funds? Are you even thinking through the logistics of this or it’s all vibes and ideals. The Chinese companies are backed and funded by the state and they’ll do a rug pull as soon as there’s no competition. Companies in the US have to figure out how to fund their ventures on their own."}, {"id": 50657563, "au": "FartyMcFarter", "dom": 98, "sr": 80, "sc": 1.09, "ep": 1.16, "bs": 0.0, "d": 4, "age": 3.49, "grav": 21.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 5996, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet" /**
 * Canvas 2D scatter-plot renderer — port bridge between Elm and <canvas>.
 *
 * Elm sends PlotCommand via `drawPlot` port.
 * User interactions fire back via `onCanvasProbe` port.
 *
 * IIFE version: no ES module imports/exports — works as a plain <script>
 * in both dev (static/index.html) and production (inlined by Python).
 */

// eslint-disable-next-line no-unused-vars
function mountCanvasRenderer(app) {
  if (!app.ports) return;

  // Outgoing port: Elm -> JS canvas draw
  if (app.ports.drawPlot) {
    app.ports.drawPlot.subscribe(renderPlot);
  }

  // Incoming port: JS canvas events -> Elm
  function emitProbe(canvasId, commentId) {
    if (app.ports.onCanvasProbe) {
      app.ports.onCanvasProbe.send({ canvasId: canvasId, commentId: commentId });
    }
  }

  /**
   * Render a scatter plot onto a <canvas> element.
   * @param {Object} cmd - PlotCommand from Elm
   */
  function renderPlot(cmd) {
    var canvas = document.getElementById(cmd.canvasId);
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext("2d");
    var W = canvas.width;
    var H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "rgb(30, 36, 44)";
    ctx.lineWidth = 1;
    for (var i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo((W * i) / 6, 0); ctx.lineTo((W * i) / 6, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (H * i) / 6); ctx.lineTo(W, (H * i) / 6); ctx.stroke();
    }

    // Largest root subtree highlight (gravity canvas only)
    if (cmd.largestRoot && cmd.largestRoot.slots > 1) {
      var lr = cmd.largestRoot;
      var totalN = cmd.points.length || 1;
      var yStart = 20 + (lr.startDom / totalN) * (H - 44);
      var yEnd = 20 + (lr.endDom / totalN) * (H - 44);
      ctx.fillStyle = "rgba(255, 68, 0, 0.09)";
      ctx.fillRect(32, yStart, W - 48, Math.max(4, yEnd - yStart));
      ctx.fillStyle = "rgba(255, 110, 64, 0.75)";
      ctx.font = "10px ui-monospace, Menlo, monospace";
      ctx.fillText(
        "LARGEST SUBTREE (@" + lr.author + ": " + lr.slots + " SLOTS, HN POS " + lr.startDom + ".." + lr.endDom + ")",
        40,
        Math.min(H - 22, yStart + 13)
      );
    }

    // Plot points (draw back-to-front so gold renders on top)
    var pts = [];
    var drawOrder = cmd.points.slice().reverse();
    for (var j = 0; j < drawOrder.length; j++) {
      var p = drawOrder[j];
      var col = "rgba(" + p.colour.r + ", " + p.colour.g + ", " + p.colour.b + ", " + p.colour.a + ")";
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Selection ring
      if (cmd.selectedId === p.commentId) {
        ctx.strokeStyle = "rgb(255, 255, 255)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      pts.push({ x: p.x, y: p.y, id: p.commentId });
    }

    // Axis labels
    ctx.fillStyle = "rgb(140, 150, 162)";
    ctx.font = "10px ui-monospace, Menlo, monospace";
    if (cmd.axisConfig) {
      ctx.fillText(cmd.axisConfig.xLabel, W - 295, H - 7);
      ctx.fillText(cmd.axisConfig.yLabel, 8, 14);
    }

    // Attach interaction listeners (replace previous)
    var handler = makeCanvasHandler(canvas, pts, cmd.canvasId, emitProbe);
    if (canvas._hnCleanup) canvas._hnCleanup();
    canvas.addEventListener("click", handler.onClick);
    canvas.addEventListener("mousemove", handler.onMove);
    canvas._hnCleanup = function() {
      canvas.removeEventListener("click", handler.onClick);
      canvas.removeEventListener("mousemove", handler.onMove);
    };
  }

  function makeCanvasHandler(canvas, pts, canvasId, emit) {
    function findNearest(ev, maxDistSq) {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
      var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
      var best = null;
      var bestD = maxDistSq;
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k];
        var d = (pt.x - sx) * (pt.x - sx) + (pt.y - sy) * (pt.y - sy);
        if (d < bestD) { bestD = d; best = pt; }
      }
      return best;
    }

    return {
      onClick: function(ev) {
        var hit = findNearest(ev, 576);
        if (hit) emit(canvasId, hit.id);
      },
      onMove: function(ev) {
        var hit = findNearest(ev, 169);
        if (hit) emit(canvasId, hit.id);
      }
    };
  }
}

(function() {
  var dataEl = document.getElementById("observatoryData") ||
               document.getElementById("catalogData") ||
               document.getElementById("routerConfig");
  var flags = null;
  if (dataEl) {
    try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  var app = Elm.Main.init({ node: root, flags: flags });
  if (typeof mountCanvasRenderer === "function") {
    mountCanvasRenderer(app);
  }
})();
</script>
