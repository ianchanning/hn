"source_categories": [{"category": "general_web", "count": 9}, {"category": "gov_legal", "count": 1}], "story_anchors": ["ball", "game", "market", "bouncemarket", "buy", "bouncing", "side", "hard", "prediction", "page", "share", "outcome", "round", "change", "trade", "fun", "shares", "client"], "largest_root": {"root_id": 50668037, "author": "vova_hn2", "slots": 19, "start_dom": 15, "end_dom": 33, "share_pct": 13.9, "top_dom1_age": 2.2, "top_dom1_author": "beaker52"}, "buried_cutoff": 41, "rescue_top_k": 27, "ablations": [], "tournament": [], "comments": [{"id": 50671292, "au": "geoffschmidt", "dom": 34, "sr": 1, "sc": 9.64, "ep": 9.64, "bs": 0.0, "d": 0, "age": 19.38, "grav": 247.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 438, "qw": 0, "k": 2604, "kpp": 10.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "price_market", "flbl": "Price & Market (Latency)", "urls": [], "ig": 1.945, "fa": 0.78, "gp": 1.965, "bl": 0.0, "ds": 0.0, "txt": "This is super cool! The rabbit hole goes a bit deeper than I first thought.\n\nBecause anyone can tell Opus \"go win bouncemarket.minhanhday.com\" and with just those words get a pretty good bot, this is in practice a \"battle of the bots\".\n\nThe only unknown is the fractional part of the start position of the ball, which is revealed gradually by the chaotic path of the ball, and a frontier model will quickly realize this and write an exact solver for it. This gives the optimal estimate at time t of the probability of each outcome given the information revealed so far.\n\nOf the bots running now, some seem to have an exact solver while others have a lower quality probabilistic solver. Some bots seem to only bet when there is enough information to be certain, others are willing to bet early when the market is mispricing the risk.\n\nThe rate limit of 10 bets a second means that, past a certain point, a bigger bankroll doesn't help. It also means that bets are a scarce resource. You want to bet at the moments when the market maximally misprices the risk, but you don't know when those moments will be because that's a function of what other players do.\n\nTo win, you need to do some combination of:\n\n1) Be the first to buy when a bounce reveals new information\n\n2) Be the first to buy when another player makes a non-optimal buy\n\nBoth require low latency to the server to win. Only market orders a"}, {"id": 50669602, "au": "lesam", "dom": 43, "sr": 2, "sc": 9.55, "ep": 9.55, "bs": 0.0, "d": 1, "age": 21.97, "grav": 304.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 4, "qw": 33, "k": 280, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "general_commentary", "flbl": "General Commentary", "urls": ["https://www.congress.gov/crs-product/LSB11441"], "ig": 0.85, "fa": 2.35, "gp": 0.591, "bl": 0.0, "ds": 0.0, "txt": "The CFTC disagrees (IANAL):\n\n> Gaming contracts are likely to be contrary to the public interest, the CFTC indicates, if they involve games of random chance, as trading in such contracts would not provide useful or meaningful information.\n\nhttps://www.congress.gov/crs-product/LSB11441"}, {"id": 50670903, "au": "e1ghtSpace", "dom": 78, "sr": 3, "sc": 7.18, "ep": 7.18, "bs": 0.0, "d": 2, "age": 19.99, "grav": 260.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 125, "qw": 0, "k": 67, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "position_simulation", "flbl": "Position & Simulation (Ball)", "urls": [], "ig": 1.483, "fa": 0.95, "gp": 0.683, "bl": 0.0, "ds": 0.0, "txt": "I made a bot with claude. Yes it does get to 100% accuracy before the ball lands. However most of the time the entire market jumps to 0.99 at this point. However you can usually get in slightly earlier before that point or the market sometimes dips so you can get the shares cheaper.\n\nHeres some results: calls 146/146 right · 146/181 rounds called · profit +98.80\n\nSometimes the bot can't calculate where the ball will land in time so those rounds are skipped.\n\nClaude is now working on a new version to basically determine the seed for the random number generator used to set the ball's starting position. That way we can buy before anything even happens and get it right. However I'm not sure yet whether this is actually possible. I'll wait and see."}, {"id": 50668495, "au": "cvoss", "dom": 16, "sr": 4, "sc": 6.29, "ep": 6.29, "bs": 0.0, "d": 1, "age": 23.58, "grav": 342.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 2590, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_players", "flbl": "Money & Players (Shares)", "urls": [], "ig": 1.58, "fa": 0.34, "gp": 1.11, "bl": 0.0, "ds": 0.0, "txt": "I would guess that the universe of players not being closed is a source of imbalance. There is a constant stream of new players who are granted 10 credits. Maybe they play for a bit and leave when they get disinterested, which is more likely than not going to occur when they have less than 10 credits.\n\nSo if the money supply per capita is constantly increasing, holding a share in anything with a 50% chance of payout has a positive expected return. Diversifying by buying both shares makes your portfolio very resistant to fluctuation. The ideal strategy just rides the inflation on average."}, {"id": 50668724, "au": "hellojomp", "dom": 82, "sr": 5, "sc": 5.91, "ep": 5.91, "bs": 0.0, "d": 0, "age": 23.23, "grav": 333.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 0, "k": 110, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": ["https://hellojomp.com/mob-market/"], "ig": 1.234, "fa": 0.62, "gp": 0.855, "bl": 0.0, "ds": 0.0, "txt": "I had a similar idea a few months ago https://hellojomp.com/mob-market/ but instead of a ball bouncing it was about the dynamics of webpage links turned into hawks and pigeons and random predictions regarding them i.e. will X spawn Y times in _ seconds."}, {"id": 50669796, "au": "retsibsi", "dom": 47, "sr": 6, "sc": 5.75, "ep": 5.89, "bs": 0.0, "d": 2, "age": 21.71, "grav": 298.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 72, "qw": 11, "k": 1977, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": [], "ig": 1.351, "fa": 0.7, "gp": 0.499, "bl": 0.0, "ds": 0.0, "txt": "> Am I the only one going \"this is just gambling! No!\" Here?\n\nThat was my first reaction too, but I think that was their point: prediction markets are already being used as a loophole to allow sports betting in jurisdictions where it is supposed to be banned, and (according to them; I haven't checked this) the legal theory that justifies that would also justify 'prediction markets' on random outcomes, i.e. really blatantly just pure gambling. So it could serve as a kind of reductio of the sports betting loophole."}, {"id": 50672801, "au": "simondebbarma", "dom": 102, "sr": 7, "sc": 5.32, "ep": 5.32, "bs": 0.0, "d": 0, "age": 16.03, "grav": 182.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 17, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "odds_fun", "flbl": "Odds & Fun (Played)", "urls": [], "ig": 1.451, "fa": 0.34, "gp": 0.649, "bl": 0.0, "ds": 0.0, "txt": "I played this for a handful of minutes a few times over the last hours. It went from being kinda easy to win by playing regularly or getting lucky to now being so completely overrun by bots and scripts that know exactly where the ball is going. These bots buy bets on the correct side and in such high quantities that the odds literally become 0.01 on the losing side a couple bounces into a drop.\n\nSo yeah, it went from fun to ruined in less than 8 hours. Cheers, y'all."}, {"id": 50669575, "au": "bee_rider", "dom": 94, "sr": 8, "sc": 5.16, "ep": 5.16, "bs": 0.0, "d": 3, "age": 22.0, "grav": 305.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 25230, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": [], "ig": 1.547, "fa": 0.22, "gp": 0.618, "bl": 0.0, "ds": 0.0, "txt": "That’s an interesting thought.\n\nWhether pre-aiming has a downside or not seems to depend on map design? Like if there are multiple plausible\ncorners, you have to pick one, so there’s a cost of not picking the other. Other games have simpler maps, if there’s only one plausible corner I guess there isn’t much cost to aiming at it.\n\nOf course, defining plausible corners relies on map knowledge. Actually I think that’s one of the reasons I quit playing online shooters didn’t want to put in the level of effort required to make those gambles fun. Random death is boring."}, {"id": 50669925, "au": "Andr2Andr", "dom": 64, "sr": 9, "sc": 4.86, "ep": 4.86, "bs": 0.0, "d": 0, "age": 21.55, "grav": 294.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 41, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_players", "flbl": "Money & Players (Shares)", "urls": [], "ig": 1.388, "fa": 0.0, "gp": 1.106, "bl": 0.0, "ds": 0.0, "txt": "Could be expanded with futures, indexes, hedge funds, shares etc. to teach the general public about the financial topics.\nA user is first prompted to play a few rounds, and then has the ability to invest, to buy some shares etc.\nI think it could become the go to page to understand the financial markets. Just my thoughts what to make of this in future"}, {"id": 50668037, "au": "vova_hn2", "dom": 15, "sr": 10, "sc": 4.79, "ep": 4.93, "bs": 0.0, "d": 0, "age": 24.29, "grav": 359.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 866, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "money_players", "flbl": "Money & Players (Shares)", "urls": [], "ig": 1.056, "fa": 0.0, "gp": 1.69, "bl": 0.0, "ds": 0.0, "txt": "Completely ignoring the ball and just buying cheap shares is a surprisingly efficient strategy. Often I'm able to get both kinds of share for cheap, so I win regardless of the outcome."}, {"id": 50668346, "au": "xp84", "dom": 59, "sr": 11, "sc": 4.72, "ep": 4.72, "bs": 0.0, "d": 0, "age": 23.81, "grav": 347.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 10133, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "odds_fun", "flbl": "Odds & Fun (Played)", "urls": [], "ig": 0.885, "fa": 0.34, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "It’s too hard to buy multiple shares. The price changes super fast so I’d like to have buy 5,10,100 shares buttons too. Or something like that.\n\nSuper fun though. Love the idea and the execution."}, {"id": 50672416, "au": "SecuredMarvin", "dom": 35, "sr": 12, "sc": 4.64, "ep": 4.78, "bs": 0.0, "d": 1, "age": 17.08, "grav": 201.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 82, "qw": 0, "k": 7, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": [], "ig": 1.211, "fa": 0.68, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As you said, Opus did solve for the floating start points competently. I suggested collecting these over 600 games to solve the Mersenne Twister, but the web server restarted. So we tried using the bits from the Twister as an oracle for the start points, but then another deployment forced the start points onto a much coarser grid, and the Twister was also used to scramble the bid answers, so it was no longer solvable. I've never had this much (4h) fun with a click-game. (\u002320, precogbot)"}, {"id": 50669412, "au": "qoez", "dom": 40, "sr": 13, "sc": 4.38, "ep": 4.9, "bs": 0.0, "d": 0, "age": 22.23, "grav": 310.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 1165, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": [], "ig": 1.186, "fa": 0.0, "gp": 1.455, "bl": 0.0, "ds": 0.0, "txt": "I wish people leaned into making prediction markets about pure random events like this. In theory they should be just as legal as sports betting in the sense of being considered \"financial contracts\", but no one has actually done the experiment (with real money not fake like here) as far as I'm aware."}, {"id": 50667849, "au": "frenchmajesty", "dom": 111, "sr": 14, "sc": 4.32, "ep": 4.32, "bs": 0.0, "d": 0, "age": 24.61, "grav": 367.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 511, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "odds_fun", "flbl": "Odds & Fun (Played)", "urls": [], "ig": 1.369, "fa": 0.0, "gp": 0.761, "bl": 0.0, "ds": 0.0, "txt": "Surprising fun and awesome! Love it.\n\nIt was not immediately clear how the game was played but it came to me soon enough. I think one or two \"trial/tutorial\" rounds would go a long way to give me a proper shot at the leaderboard.\n\nI wasted my first 2-3 balls as I was looking at the UI trying to understand how to play."}, {"id": 50673849, "au": "teraflop", "dom": 126, "sr": 15, "sc": 4.17, "ep": 4.17, "bs": 0.0, "d": 1, "age": 13.28, "grav": 135.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 114, "qw": 0, "k": 17500, "kpp": 6.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "odds_fun", "flbl": "Odds & Fun (Played)", "urls": [], "ig": 1.566, "fa": 0.0, "gp": 0.336, "bl": 0.0, "ds": 0.0, "txt": "I don't think it's rigged, but the betting behavior seems to have changed dramatically in the last few hours.\n\nWhen I played earlier, the odds would swing back and forth as the ball bounced around, stabilizing as it got closer to the bottom and the likelihood of an unexpected bounce got smaller.\n\nNow, it seems like the probability converges toward 0.99/0.01 much earlier and with very high accuracy. I don't think that means the simulation itself is rigged, but rather that people have built superhuman trading bots that can predict those random-looking bounces very reliably. And when they spot a guaranteed win, they can spam the buy button to very quickly extract maximum profit from anyone betting against them."}, {"id": 50672323, "au": "spolitry", "dom": 90, "sr": 16, "sc": 4.12, "ep": 4.12, "bs": 0.0, "d": 0, "age": 17.3, "grav": 206.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 37, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "price_market", "flbl": "Price & Market (Latency)", "urls": [], "ig": 1.525, "fa": 0.0, "gp": 0.372, "bl": 0.0, "ds": 0.0, "txt": "This looks nowhere near random enough. The result is highly determined almost immediately.\n\nI recommend randomizing the bounce pegs, and randomizing  the bounce direction a bit more (bounces almost always reverse the direction exactly, cancelling out a direction change) and adding more \"bounce\" or lowering gravity so there are more chances to leave the potential well."}, {"id": 50668958, "au": "trwhite", "dom": 63, "sr": 17, "sc": 4.05, "ep": 4.05, "bs": 0.0, "d": 0, "age": 22.86, "grav": 325.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 649, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_market", "flbl": "Price & Market (Latency)", "urls": [], "ig": 0.673, "fa": 0.28, "gp": 1.149, "bl": 0.0, "ds": 0.0, "txt": "The latency on the button press is much too slow to actually make a decision about the price. It feels pretty random as to what price you’re gonna get"}, {"id": 50671034, "au": "mday404", "dom": 55, "sr": 18, "sc": 3.84, "ep": 5.69, "bs": 1.85, "d": 3, "age": 19.75, "grav": 255.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 57, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "position_simulation", "flbl": "Position & Simulation (Ball)", "urls": [], "ig": 1.358, "fa": 0.34, "gp": 1.056, "bl": 0.7, "ds": 0.0, "txt": "that's true towards the end, but it's harder than it sounds because you don't actually have the precise position and velocity -- you just have the position rounded to the nearest 0.1px.\n\nI ran the physics simulation and a 10^-12 px change in starting X position yields a different outcome more than 30% of the time, so knowing the ball's position to the nearest 0.1px only gives you a good guess, not an oracle"}, {"id": 50668096, "au": "eterm", "dom": 121, "sr": 19, "sc": 3.78, "ep": 3.78, "bs": 0.0, "d": 0, "age": 24.2, "grav": 357.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 8411, "kpp": 4.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "price_market", "flbl": "Price & Market (Latency)", "urls": [], "ig": 0.976, "fa": 0.28, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "It annoys me we can't put in limit orders, as with a touch screen the latency kills you as the price changes underneath you!\n\n( Annoys is too strong a word, it's just a game! )"}, {"id": 50668483, "au": "charlieyu1", "dom": 3, "sr": 20, "sc": 3.58, "ep": 3.8, "bs": 0.0, "d": 0, "age": 23.59, "grav": 342.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 1369, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "odds_fun", "flbl": "Odds & Fun (Played)", "urls": [], "ig": 0.906, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Fun little game, but the drop needs to be slower so it is easier to bet. Odds jumping from 0.01 to 0.99 in like one tenth of a second makes it hard to play"}, {"id": 50668451, "au": "theophrastus", "dom": 60, "sr": 21, "sc": 3.46, "ep": 3.46, "bs": 0.0, "d": 0, "age": 23.64, "grav": 343.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 24, "qw": 0, "k": 944, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "position_simulation", "flbl": "Position & Simulation (Ball)", "urls": ["https://en.wikipedia.org/wiki/Galton_board"], "ig": 0.762, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "If it is an approximal simulation of Galton board[1] then wouldn't wagering on the side the ball starts on have a positive outcome over time?\n\n[1] https://en.wikipedia.org/wiki/Galton_board"}, {"id": 50677526, "au": "beaker52", "dom": 1, "sr": 22, "sc": 3.44, "ep": 3.88, "bs": 0.0, "d": 0, "age": 2.17, "grav": 13.0, "surf": 28.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 2109, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "games_sports", "flbl": "Games & Sports (Fun)", "urls": [], "ig": 1.473, "fa": 0.0, "gp": 0.288, "bl": 0.0, "ds": 0.0, "txt": "`fast_trades_jev` here. It's really fun watching the arms race unfold in real time:\n\n`yuzu-on-head` is probably running the market manipulation, hedging both sides and has recently started increasing their earnings by doing so mid-game. `foob` is still fighting and recently adopted a hedging strategy in line with `yuzu`s, but isn't in on the mid-game runs yet (and probably can't be, because `yuzu` is the one timing them)."}, {"id": 50672002, "au": "e1ghtSpace", "dom": 79, "sr": 23, "sc": 3.41, "ep": 3.56, "bs": 0.0, "d": 3, "age": 18.0, "grav": 219.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 67, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "position_simulation", "flbl": "Position & Simulation (Ball)", "urls": [], "ig": 1.102, "fa": 0 (function() {
  var dataEl = document.getElementById("observatoryData") ||

  }
