e"}, {"slug": "general_commentary", "label": "General Commentary", "count": 21, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 7}, {"category": "arxiv_preprint", "count": 1}], "story_anchors": ["quality", "training", "attention", "transformer", "model", "residual", "paper", "architecture", "layers", "layer", "standard", "google", "mechanism", "faster", "information", "memory", "research", "models"], "largest_root": {"root_id": 50673652, "author": "spankalee", "slots": 118, "start_dom": 1, "end_dom": 118, "share_pct": 65.2, "top_dom1_age": 14.5, "top_dom1_author": "spankalee"}, "buried_cutoff": 54, "rescue_top_k": 36, "ablations": [], "tournament": [], "comments": [{"id": 50673144, "au": "ACCount39", "dom": 146, "sr": 1, "sc": 13.45, "ep": 13.45, "bs": 0.0, "d": 0, "age": 15.85, "grav": 179.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 71, "qw": 0, "k": 716, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": ["https://arxiv.org/abs/2502.06785"], "ig": 1.664, "fa": 2.69, "gp": 1.295, "bl": 0.0, "ds": 0.0, "txt": "Full paper: https://arxiv.org/abs/2502.06785\n\nNote that it's from 2025, which, in ML years, is somewhere between four years and one decade ago.\n\nIt's an entry in the long and promising line of attention-like primitives being applied depthwise in a transformer. AttnRes is better known perhaps.\n\nWhich might be even more promising now that looping layers are a go? Having the same layers perform multiple passes can raise the gains from learned, dynamic layer to layer routing."}, {"id": 50674507, "au": "seizethecheese", "dom": 29, "sr": 2, "sc": 10.32, "ep": 10.32, "bs": 0.0, "d": 2, "age": 12.45, "grav": 122.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 102, "qw": 0, "k": 5781, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": ["https://rl-fried.vercel.app/rl-fried"], "ig": 1.708, "fa": 1.57, "gp": 1.265, "bl": 0.0, "ds": 0.0, "txt": "I don't think the cost is lower when run on real tasks.\n\nI'm very curious about the \"RL fried\" thing. It sounds right based on screenshots I've seen of excellent Neon answers, but today when I hacked a bunch of head to head battles today Astra won almost all.\n\nEdit: okay let's get to the bottom of this! I heavily redacted real data here where Neon went against Opus 5.5 or Astra 6.2. Vote on which is more \"RL fried\" and I'll post results back: https://rl-fried.vercel.app/rl-fried\n\nEdit 2: So far, Neon 12, Opponent 10 (as more RL fried). Not significant, of course.\n\nEdit 3: Neon 32, opponent 24\n\nEdit 4: Neon 50, opponent 28, neon more RL fried (p=0.00843) wow!"}, {"id": 50673550, "au": "abixb", "dom": 133, "sr": 3, "sc": 9.99, "ep": 9.99, "bs": 0.0, "d": 1, "age": 14.76, "grav": 159.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 51, "k": 4406, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.918, "fa": 1.1, "gp": 1.617, "bl": 0.0, "ds": 0.0, "txt": ">Presented in our ICML 2025 paper, this architectural improvement allows models to achieve the same quality up to three times faster with a negligible increase in parameters.\n\n>Rather than passing all prior layers forward with equal weight, DCA introduces a lightweight, layer-wise module that decides how to best combine previous embeddings on a per-token basis.\n\nThis combined with looped transformers (as showcased with GLM-5.4 from... 4 days ago) could lead to even more efficiency squeezes without substantially increasing the parameter size or altering data blend. It's hard to fathom how merely 3-4 years ago, many in the industry (despite the Chinchilla paper) thought scaling up the parameter count was the largest leverage wrt bettering model performance as compared to other techniques, but we've had such explosion of techniques since then -- CoT, MoE, RLVR, GQA, Multi-Head Latent Attention (MLA), DeepSeek Sparse Attention (DSA) and whatnot."}, {"id": 50677038, "au": "pcthrowaway", "dom": 43, "sr": 4, "sc": 8.54, "ep": 8.69, "bs": 0.0, "d": 5, "age": 3.74, "grav": 23.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 268, "qw": 7, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.876, "fa": 1.04, "gp": 0.907, "bl": 0.0, "ds": 0.0, "txt": "So far I've only seen it completely hallucinating when asking it to do something unsupported by a niche and somewhat confusingly documented API (how to search for products by a barcode prefix with openfoodfacts)\n\nJust now I asked it how to download a file from an sftp server with curl and it gave me a bunch of commands that didn't work (Haiku did the same). But then Sonnet told me some builds of curl do support sftp, so I'll give haiku and google ai mode partial credit.\n\nWent through my list of sessions and it's been pretty good for most things. Other places where it wasn't great:\n\n- Trying to get it to tell me how to close the mac force quit dialog that pops up on my mac when system usage gets high (lately been saying I need to force quit chrome). Found a solution to that on stackexchange of all places\n\n- Asking it about architecture of existing OSS projects it will reference files that no longer exist (not really surprising and most models probably do the same due to their cutoff before being asked to review the current state of the codebase)\n\n- \"evenstamp.com pricing\" told me that site doesn't exist and recommended several other sites that are related to stamps (evenstamp is a fingerprinting site someone shared here recently)\n\nHonestly this is over ~300 searches that used it (many of which turned into longer back-and-forth sessions) and I've only really gotten one complete f"}, {"id": 50674837, "au": "thurn", "dom": 66, "sr": 5, "sc": 8.39, "ep": 8.69, "bs": 0.0, "d": 1, "age": 11.46, "grav": 107.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 98, "qw": 0, "k": 1768, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.648, "fa": 0.68, "gp": 1.984, "bl": 0.0, "ds": 0.0, "txt": "I use both, extensively log quota metrics, and have run several blind trials on the same ticket. This is just measurably not true for me. Claude provides 25%-35% more value for the same subscription price, even in analysis performed by Neon itself on my data.\n\nA lot of this is just harness problems -- `agy` manages to burn more tokens solving the same tickets, and their caching is much worse than Claude's. Blinded reviews from both models rate Opus solutions more highly across a broad scoring rubric.\n\nI'm not sure if you're just not factoring in the several resets Gemini handed out recently?"}, {"id": 50673801, "au": "bertonvv", "dom": 177, "sr": 6, "sc": 8.13, "ep": 8.13, "bs": 0.0, "d": 2, "age": 14.02, "grav": 147.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 119, "qw": 0, "k": 108, "kpp": 7.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.769, "fa": 0.95, "gp": 0.872, "bl": 0.0, "ds": 0.0, "txt": "I don't think that's fair. Google had no real competitors in AI back in 2017 (everyone felt this, especially after AlphaGo beat the best Go player in 2016). And even though Google published the Attention paper in 2017, they also patented the original encoder-decoder transformer around the same time, they definitely weren't willing to just give away something they recognized as immensely valuable. (OpenAI's GPT is a decoder-only architecture that doesn't infringe on Google's patent)\n\nThen consider today's situation, we have AI labs racing towards AGI and some would argue that Google is slightly behind the frontier. I think the last thing Google would do is give away important tech to the competitors that'd put them further behind. So I think DeepCrossAttention probably isn't a big deal."}, {"id": 50675977, "au": "LaurensBER", "dom": 56, "sr": 7, "sc": 8.08, "ep": 8.52, "bs": 0.0, "d": 1, "age": 7.27, "grav": 55.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 197, "qw": 0, "k": 1826, "kpp": 5.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": ["https://antigravity.google/docs/workspace/"], "ig": 1.614, "fa": 0.62, "gp": 2.039, "bl": 0.0, "ds": 0.0, "txt": "The challenge for Google is that they make it so hard to actually use their models that no-one in the team has bothered to try it.\n\nWe have a Google workspace account, I cannot sign up for Google AI Pro. The admin console doesn't show a comparable subscription for some reason (located in Switzerland). Even if we would get this sorted, we're not allowed to use their subscription with anything besides the Google CLI so we would have to switch all our existing workflows. I do not know why but given their current position in the market you would think they would make it a bit easier to try their latest model.\n\nEdit: Google has an entire page dedicated to using Anti gravity with a workspace account: https://antigravity.google/docs/workspace/\n\nThe options are basically, reach out to a sales person for an \"Enterprise\" subscription or use a personal account. The first is an annoying amount of effort just to try it, the second we're obviously not allowed to do.\n\nIf someone from Google is reading this, this is absolutely ridiculous, why can we not just sign-up, pay the 20 bucks and try this? You finally have a good model, please don't let the bean counters screw this up."}, {"id": 50674842, "au": "amluto", "dom": 123, "sr": 8, "sc": 6.69, "ep": 6.91, "bs": 0.0, "d": 0, "age": 11.45, "grav": 107.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 46, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.698, "fa": 0.42, "gp": 1.188, "bl": 0.0, "ds": 0.0, "txt": "> Depth-wise cross-attention (split Q/K/V): While standard transformer attention operates across tokens in a sequence, DCA applies attention across layers in depth. Each token queries a dynamically weighted mix of all prior layer embeddings, unlocking the model's full historical context without the computational penalty usually required to scale traditional attention.\n\nI’ve often thought that something like this might lead to a real solution to the infamous strawberry problem.\n\nIgnoring pesky issues like tokenization, the actual input data is visible to the model as the embedding fed to the first layer, but the first layer is probably nowhere near smart enough to understand that the model is trying to count R instances.  But by the time whatever layer is reached that might understand the goal, the non-wasteful part of the low-level memory (the K’s and V’s from the first layer) can’t be queried any more.\n\nBut this cross-depth attention can query them!\n\nAdmittedly, there are holes in this argument.  Beyond just tokenization (to the extent that the model can see letters at all, it is reconstructing them), the attention mechanism doesn’t really have a clean “count the hits” operation."}, {"id": 50675390, "au": "nl", "dom": 30, "sr": 9, "sc": 6.64, "ep": 7.08, "bs": 0.0, "d": 3, "age": 9.41, "grav": 80.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 101, "qw": 10, "k": 34504, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 1.104, "fa": 1.04, "gp": 1.049, "bl": 0.0, "ds": 0.0, "txt": "> Has none of the RL fried optimized-for-coding feeling, either.\n\nI don't think this is a good test though?\n\nAll the tests I've seen are about code. When working on code we want \"optimized-for-coding\".\n\nI think the OP means \"RL fried optimized-for-coding\" is where you are working on non-coding tasks but it tries to work in a style that is idiomatic to coding.\n\nYou see this for example in slide decks where it puts foot notes about the rules it was following to generate the slides (which I think maybe is an idiomatic \"comment code to say why you are doing non-obvious things\" RL'ed behavior)\n\nBut I'm not 100% sure what the OP means anyway."}, {"id": 50674733, "au": "pkulak", "dom": 39, "sr": 10, "sc": 6.54, "ep": 6.98, "bs": 0.0, "d": 1, "age": 11.78, "grav": 112.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 124, "qw": 0, "k": 12766, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.712, "fa": 0.34, "gp": 1.373, "bl": 0.0, "ds": 0.0, "txt": "My Claude sub was up on the 26th, and after using Neon for 3-4 days I had to make a decision... and just went for the swap. As far as I can tell, Neon writes as good code, but explains things to me better. It's a clear (though slight) improvement. There are also plenty of Pi->Antigravity bridges, so I can keep using my own stack (TOS approved, God-willing). Plus, you actually get some meager Opus-5.5 credits with Antigravity, so I still have Claude for review.\n\nIt's the same money, but Google throws in extras that are legitimately helpful. I love the api credits. It means I can run my little Matrix agent (and other random experiments/scripts) on Hydrogen instead of digging around for the cheapest models Openrouter has to offer."}, {"id": 50675420, "au": "gr_norm", "dom": 34, "sr": 11, "sc": 6.37, "ep": 6.81, "bs": 0.0, "d": 3, "age": 9.3, "grav": 78.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 94, "qw": 16, "k": 1173, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": ["https://rl-fried.vercel.app/rl-fried"], "ig": 0.741, "fa": 1.32, "gp": 0.9, "bl": 0.0, "ds": 0.0, "txt": "> I don't think the cost is lower when run on real tasks.\n\nFair enough, I haven't measured this rigorously. It definitely conserves usage over its peers on my personal benchmark suite, but perhaps I got lucky? It looks like usage is somewhat spiky, from this thread.\n\n> https://rl-fried.vercel.app/rl-fried\n\nI'm a little suspicious of the methodology here: I don't have strong opinions on most of the choices, but it's also because these aren't my own prompts on topics I'm interested in (edit: in particular, not programming) over long conversations. Entirely possible I've bought the hype, but better evaluation is needed. I'll re-try my recent interactions and little explorations on Astra to see if it's a placebo."}, {"id": 50677058, "au": "msdz", "dom": 130, "sr": 12, "sc": 6.31, "ep": 6.75, "bs": 0.0, "d": 2, "age": 3.69, "grav": 22.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 117, "qw": 0, "k": 507, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": ["https://www.techradar.com/computing/computing-security/an-apple-fan-says-they-lost-20-years-of-digital-life-after-using-an-apple-gift-card-heres-what-happened"], "ig": 1.707, "fa": 0.62, "gp": 0.669, "bl": 0.0, "ds": 0.0, "txt": "Absolutely agreed on both points. Given that people had their decade-old accounts deleted for issues with {App,Play} Store gift cards they didn’t cause nor could possibly have known about [0], I’d only touch Google models via something like OpenRouter, or if a subscription is desired, a separate, clean account for this specific purpose if I had anything important or annoying-to-recreate on the primary Google account.\n\nThe risk is just needless and way too high. You don’t even control the models’ reasoning – what if it drifts off into an adjacent “bad” area to what you were intending to do after a fuller context a couple times and then Google’s mechanism decides that’s sufficient for an account termination? You’re never getting it back.\n\n[0] https://www.techradar.com/computing/computing-security/an-ap..."}, {"id": 50676082, "au": "pcthrowaway", "dom": 50, "sr": 13, "sc": 6.2, "ep": 6.64, "bs": 0.0, "d": 4, "age": 6.9, "grav": 51.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 175, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.634, "fa": 0.62, "gp": 0.712, "bl": 0.0, "ds": 0.0, "txt": "They can be wrong and I've gotten some hallucinations too, but I was talking more about the clarity with which they explain things.\n\nAlso, they're excellent at some things. Like googling about an issue where the force close dialog was telling me iterm was taking up 12 GiB but activity monitor told me way less, it ran me through some crazy insightful debugging steps. Or explaining GS1 code formats. Or walking me through how the openstreetmap server works (training cutoff notwithstanding).\n\nIt seems to have some places it excels, and some things it sucks at (explaining how to use a poorly documented, more niche API for example)\n\nI assume they're testing different ways to produce responses, because I've gotten two answers at the same time before and been asked which one was better.\n\nSo it's entirely possible they're also A/B testing by giving all questions from some users to a worse model.\n\nIt's the fastest LLM I've interacted with, and the things it can correctly answer are explained very clearly. Which again, hasn't been my experience with Opus."}, {"id": 50676813, "au": "blfr", "dom": 4, "sr": 14, "sc": 6.15, "ep": 6.6, "bs": 0.0, "d": 3, "age": 4.3, "grav": 27.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 113, "qw": 0, "k": 8665, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.653, "fa": 0.56, "gp": 0.769, "bl": 0.0, "ds": 0.0, "txt": "in the same weight as Astra, Fable and Opus\n\nI don't have a ChatGPT sub and only use Google AI Pro but I do max out two Claude subs every week and, as cool as 5.5 is, Opus is not in the same weight class as Fable.\n\nRegardless of what the benchmarks say, Fable is clearly way smarter which shows in initiative and attention to detail. Fable will proactively do smart stuff like reuse code or name files for download etc. It also has better taste for design.\n\nWhereas Opus will absolutely carry out any task you throw at it but it will often focus on the less important sidetasks. And will sometimes produce copious unnecessary output."}, {"id": 50674310, "au": "seizethecheese", "dom": 71, "sr": 15, "sc": 5.86, "ep": 8.16, "bs": 1.85, "d": 1, "age": 12.92, "grav": 129.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 12, "k": 5781, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.413, "fa": 0.76, "gp": 1.845, "bl": 0.7, "ds": 0.0, "txt": "> Neon is just insanely cheap and fast for how good it is.\n\nNeon is cheap but it's not faster per task than Opus 5.5 or Astra 6.2. Exactly the opposite!\n\nI calculated the ratio of time spent vs. opponents in Agent Duel data:\n\n  Gemini 4 Neon: 1.33× \n  Astra 6.2:     0.67×  \n  Opus 5.5:      0.92×  \n\np-val on Neon being slower than opponents, compared to Opus 5.5: 0.002\n\np-val vs Astra 6.2 is: 0.00002\n\nNeon has fast inference, so probably feels faster when doing a quick back and forth?"}, {"id": 50675814, "au": "imhoguy", "dom": 65, "sr": 16, "sc": 5.33, "ep": 5.77, "bs": 0.0, "d": 1, "age": 7.84, "grav": 61.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 2948, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.65, "fa": 0.0, "gp": 1.303, "bl": 0.0, "ds": 0.0, "txt": "I switched to Google AI offering because it has enormous advantage: nobody blocks Google's search and scrapping.\n\nThe model doesn't have to be big when it has enormous memory (search index) at its hands.\n\nEven free Google Search AI Mode results become better from what I pull from Claude.\n\nAlthough it is not for everyone. I command AI as my thought and skills extension tool for everyday practical stuff. I don't leave it loose to solve Millenium Prize Problems."}, {"id": 50675363, "au": "bloopernova", "dom": 16, "sr": 17, "sc": 5.13, "ep": 6.23, "bs": 0.0, "d": 3, "age": 9.47, "grav": 80.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 121, "qw": 0, "k": 8377, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.72, "fa": 0.34, "gp": 0.839, "bl": 0.0, "ds": 0.0, "txt": "Anecdote here from someone with no affiliation with Google or Anthropic.\n\nI find Claude models use up 5 hour quotas really fast on opencode go plus subscription.\n\nPreviously I've been using deepseek-v4.1-flash\u0023max for most coding tasks. Gemini 4 Neon\u0023medium and Hydrogen\u0023medium just seem to be a better combo for plan, implement, review, fix workflows.\n\nI've not been impressed with the 6.2 GPT models either.\n\nThis month I had the Google AI Pro subscription, with opencode go plus, and ChatGPT $20 tier sub. I'm keeping AI Pro, dropping GPT, and probably reducing opencode go plus to the lower tier.\n\nI wouldn't consider myself a bandwagon-rider. I've been genuinely impressed with Neon. It's a solid, capable model. I just wish I could afford the top tier Google sub so I could try Carbon!"}, {"id": 50673807, "au": "Alpha3031", "dom": 147, "sr": 18, "sc": 5.0, "ep": 5.15, "bs": 0.0, "d": 1, "age": 14.01, "grav": 147.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 316, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.524, "fa": 0.28, "gp": 0.531, "bl": 0.0, "ds": 0.0, "txt": "Apparently (i.e. according to the blog post) the new Inkling model uses both (Block AttnRes and DCA) so presumably they thought it might ha E been useful too, though not having looked too deeply into their architectural details (as is probably obvious given that I didn't know their residual connection used DCA previously) if there were any ablations done to see the relative impacts of AttnRes vs DCA vs both."}, {"id": 50677093, "au": "pcthrowaway", "dom": 45, "sr": 19, "sc": 4.97, "ep": 5.41, "bs": 0.0, "d": 6, "age": 3.56, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 28, "qw": 14, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": ["https://en.wikipedia.org/wiki/Project_Nimbus"], "ig": 0.686, "fa": 1.04, "gp": 0.575, "bl": 0.0, "ds": 0.0, "txt": "> Searched for its number of parameters and it referred me to this thread, lol\n\nAlso, while Google is directing questions about its AI mode here, let me take a moment to yet again register my disgust with its contribution to genocide in Palestine: https://en.wikipedia.org/wiki/Project_Nimbus"}, {"id": 50676937, "au": "dash-44", "dom": 129, "sr": 20, "sc": 4.76, "ep": 5.79, "bs": 0.0, "d": 1, "age": 3.97, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 51, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.816, "fa": 0.28, "gp": 0.498, "bl": 0.0, "ds": 0.0, "txt": "Two things about using anything Google related:\n\n1. Google is a personal data harvesting machine. They do not care one bit about your privacy.\n\n2. If your harness/usage goes against Google policy (even if it's incorrectly flagged), you may have your entire Google account banned/deleted (photos, drive, gmail, youtube, docs etc etc). A shining example of this is Terraria (game with 65+ million copies sold) creator Andrew Spinks having his entire Google account banned because of a minor issue with something on Youtube he did. The way they interlink all their accounts/services is completely crazy."}, {"id": 50675156, "au": "seizethecheese", "dom": 21, "sr": 21, "sc": 4.72, "ep": 5.16, "bs": 0.0, "d": 3, "age": 10.31, "grav": 91.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 92, "qw": 0, "k": 5781, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.52, "fa": 0.28, "gp": 0.548, "bl": 0.0, "ds": 0.0, "txt": "I doubt it's shills. What a massive scandal that would be. (And too tempting for people to leak.)\n\nNonetheless, I'm seeing HN absolutely flooded with claims about performance, speed, cost that are clearly false. For example that Gemini 4 Neon is faster than Opus 5.5 (my refutation is downranked here while many false claims are ranked highly). The space is just so full of noise right now.\n\nMy guess is that it's just trends. I have felt lately that it's not cool when I mention using Astra to coworkers who all use Claude. Now it's cool to use Neon."}, {"id": 50677371, "au": "wannabe_intelle", "dom": 124, "sr": 22, "sc": 4.43, "ep": 4.79, "bs": 0.0, "d": 1, "age": 3.0, "grav": 18.1, "surf": 5.7, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 129, "qw": 0, "k": 21, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.779, "fa": 0.0, "gp": 0.423, "bl": 0.0, "ds": 0.0, "txt": "the strawberry problem is not a real problem and it's been understood how to solve it since it showed up. nobody does it because its not worth the compute.\n\nbesides making the letters visible in some way, you need to remove softmax normalization (not for the full model! just for the sections of it that do the counting) since it only allows you to represent outputs as a fraction of the inputs. no model architecture that normalizes this way will ever truly learn integer counting that generalizes to unseen inputs.\n\nyou also need a different activation function, relu and family cut away some crucial information.\n\njust copy paste what I told you into a claude conversation, they can train a small llm that shows it easily on their server cpu or locally on your machine."}, {"id": 50675142, "au": "NitpickLawyer", "dom": 139, "sr": 23, "sc": 4.03, "ep": 4.17, "bs": 0.0, "d": 5, "age": 10.37, "grav": 92.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 7, "k": 6017, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.07, "fa": 0.42, "gp": 0.318, "bl": 0.0, "ds": 0.0, "txt": "> if training becomes x% cheaper then you can\n\nInference gains also directly translate into better training. In RLVR, the more traces you can generate for each training step, the better. In practice you'd assign your compute in different ratios of inference:training, 7:1 being a pretty standard one. So faster / cheaper inference translates in more RLVR for the same budget basically."}, {"id": 50674886, "au": "neeeeees", "dom": 53, "sr": 24, "sc": 4.01, "ep": 4.67, "bs": 0.0, "d": 1, "age": 11.31, "grav": 105.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 168, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.277, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "I was using Opus 5.5 until last week, when I started using Neon (my company updated the default model to Neon in our internal harness).\nI’m shocked by how good Neon is - IMO it’s better than both Opus and Sol. I don’t think I’ll be switching back. For context, this is for low level embedded/network software work."}, {"id": 50673840, "au": "gr_norm", "dom": 26, "sr": 25, "sc": 3.88, "ep": 4.32, "bs": 0.0, "d": 1, "age": 13.92, "grav": 145.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 35, "qw": 0, "k": 1173, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.905, "fa": 0.0, "gp": 1.51, "bl": 0.0, "ds": 0.0, "txt": "Seconded for Neon. Amazingly good model even ignoring the cost, which is astonishingly low. Has none of the RL fried optimized-for-coding feeling, either. It's of a different flavor than any of the other major offerings."}, {"id": 50673683, "au": "yieldcrv", "dom": 167, "sr": 26, "sc": 3.82, "ep": 4.26, "bs": 0.0, "d": 0, "age": 14.37, "grav": 153.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 3890, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 0.662, "fa": 0.95, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Where did this go?\n\nMTP + Dflash and other derivatives has gotten me 10x tokens/sec in the last 2 years\n\nbut can we get it to 30x with this added too?"}, {"id": 50674756, "au": "logicallee", "dom": 116, "sr": 27, "sc": 3.3, "ep": 4.4, "bs": 0.0, "d": 1, "age": 11.72, "grav": 111.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 51, "qw": 0, "k": 3375, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": ["https://share.gemini.google/A3UQPscnPWRl", "https://ezmon-e.com/a/@robertviragh/s/google-s-gemini-neon-leapfrogs-the-competition-3a95bd90"], "ig": 1.023, "fa": 0.62, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Neon is very strong. I work as an analyst for a financial site I founded, and on this basis, I wrote a strong buy recommendation for Google a few days ago.[1]\n\nIt can one-shot incredibly difficult things. I just had it create an amazing 3D visualization: https://share.gemini.google/A3UQPscnPWRl\n\nMaybe the other AI's can do it but I was blown away. Perfect.\n\n[1] https://ezmon-e.com/a/@robertviragh/s/google-s-gemini-neon-l..."}, {"id": 50675592, "au": "londons_explore", "dom": 142, "sr": 28, "sc": 3.22, "ep": 3.44, "bs": 0.0, "d": 0, "age": 8.68, "grav": 71.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 23, "k": 40364, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.836, "fa": 0.42, "gp": 0.192, "bl": 0.0, "ds": 0.0, "txt": "> retrofitting DCA onto an already pre-trained transformer and briefly continuing training reduced perplexity by 0.19 on LM1B, compared to just 0.02 for continued standard training.\n\nI think messing with the shape and dimensions of models midway through training has a lot of promise.     Excited to see more research in this direction"}, {"id": 50677750, "au": "aenis", "dom": 5, "sr": 29, "sc": 3.02, "ep": 3.9, "bs": 0.0, "d": 4, "age": 2.42, "grav": 14.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 1565, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 1.601, "fa": 0.0, "gp": 0.092, "bl": 0.0, "ds": 0.0, "txt": "Agree, it's just Opus is probably closer to Fable than 6.2 Astra. To me they represent a class of \"creative, capable of long-horizon unattended tasks\" models. One could make do with Opus, it just requires a bit of extra handholding in weird-problem situations.\n\nI just cancelled my 2nd anthropic sub, and the only OpenAI sub I have got downgraded to pro, as I am getting more and more used to the phenomenal, humble reliability of Neon. I think its a bit of a sleeper among those best models - give it a few days of usage and it shows excellent creativity. Last I've felt so good about a new model was when Fable launched."}, {"id": 50673789, "au": "scott_weber", "dom": 134, "sr": 30, "sc": 3.0, "ep": 4.39, "bs": 0.0, "d": 2, "age": 14.05, "grav": 147.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 12, "k": 121, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.162, "fa": 0.42, "gp": 0.321, "bl": 0.0, "ds": 0.0, "txt": "Scrolling down hoping to find the obvious connection to Kimi K3s attention residuals (which they do mention, thankfully!), OP also notes:\n\n> The recent Inkling 2 model developed by Thinking Machines also adopted this design\n\n(Inkling 2 is a looped transformer)"}, {"id": 50676787, "au": "minraws", "dom": 128, "sr": 31, "sc": 2.88, "ep": 3.17, "bs": 0.0, "d": 0, "age": 4.37, "grav": 28.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 1003, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.226, "fa": 0.0, "gp": 0.199, "bl": 0.0, "ds": 0.0, "txt": "Neon seems like the first good model in my experience even hydrogen has been fun to use...\n\nClaude feels too verbose and Codex models are probably just dumb when talking about taste/creative stuff...\n\nI am not a big fan of hand work over to LLMs but with Neon I feel like its good enough to share some of my work with it."}, {"id": 50676936, "au": "jdiff", "dom": 11, "sr": 32, "sc": 2.63, "ep": 3.29, "bs": 0.0, "d": 3, "age": 3.98, "grav": 25.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 2845, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.368, "fa": 0.0, "gp": 0.05, "bl": 0.0, "ds": 0.0, "txt": "I've had good luck with it reverse engineering a complex DSP engine from PowerPC assembly and assist while I rewrite it for an extremely constrained embedded environment with no floating point numbers and only 16bit arithmetic.\n\nMy only complaint is that it bullied me into making actual progress on the port rather than continuing to code golf my Q2.13 multiply routine (\"Nice, very tight. I wouldn't spend another second on this.\")."}, {"id": 50673772, "au": "scott_weber", "dom": 170, "sr": 33, "sc": 2.58, "ep": 3.17, "bs": 0.0, "d": 1, "age": 14.1, "grav": 148.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 121, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.937, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The \"faster\" here is \"faster to train\".\n\nOf course faster training => deeper training holding training time constant => better results at same model size => smaller models holding quality constant => faster models at run time. So circuitously faster tok/s ; ), but not 3x"}, {"id": 50675519, "au": "gr_norm", "dom": 31, "sr": 34, "sc": 2.58, "ep": 3.9, "bs": 0.0, "d": 4, "age": 8.96, "grav": 74.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 1173, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.209, "fa": 0.22, "gp": 0.297, "bl": 0.0, "ds": 0.0, "txt": "Yeah, this is a good explanation of what I was gesturing at. I've gotten this feeling most strongly during some recent legal tasks, and also while qualitatively exploring ethnographic data. It's easiest to feel during longer sessions (with the caveat that it may be a placebo, so I'm going back through and seeing how other models behave)."}, {"id": 50674574, "au": "pollorollo", "dom": 119, "sr": 35, "sc": 2.55, "ep": 2.55, "bs": 0.0, "d": 0, "age": 12.29, "grav": 119.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 31, "qw": 0, "k": 13, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.689, "fa": 0.0, "gp": 0.641, "bl": 0.0, "ds": 0.0, "txt": "Pet peeve of mine, but those shouldn't be line graphs. They should be a bar graphs. There is no temporal relation or any other reason to connect those methods in that way."}, {"id": 50673888, "au": "itissid", "dom": 79, "sr": 36, "sc": 2.46, "ep": 4.0, "bs": 0.0, "d": 1, "age": 13.8, "grav": 143.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 84, "qw": 0, "k": 1420, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.46, "fa": 0.0, "gp": 0.395, "bl": 0.0, "ds": 0.0, "txt": "I wonder what anthropic will do after this? I mean they already did the PR of \"our model will kill humanity, imagine what they would do for your KPIs\" bit. Like what rabbit have they got left to pull out of their hat?\n\nJokes aside there is a \"are chips \nthe commodity or is ASI intelligence?\" debate, a vertically integrated company like Google making its own chips and intelligence can play both cards but it seems to me that anthropic and open ai are essentially at a big disadvantage."}, {"id": 50676257, "au": "origini", "dom": 69, "sr": 37, "sc": 2.25, "ep": 3.14, "bs": 0.0, "d": 1, "age": 6.32, "grav": 45.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 443, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.402, "fa": 0.34, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "I would use or try Gemini Neon but I have a Pro subscripton for my 2tb storage and it feels very weird to upgrade my storage subscription to something else for 1 month just to have Gemini Neon.\n\nHow do you run it?"}, {"id": 50673230, "au": "gnabgib", "dom": 160, "sr": 38, "sc": 2.2, "ep": 3.3, "bs": 0.0, "d": 3, "age": 15.7, "grav": 176.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 26203, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 0.77, "fa": 0.34, "gp": 0.36, "bl": 0.0, "ds": 0.0, "txt": "Agreed.  This article was posted 4 days ago.\n\nIt's not about the source material, if it was every book review would have to have the original book publish date."}, {"id": 50673289, "au": "amelius", "dom": 149, "sr": 39, "sc": 1.9, "ep": 2.86, "bs": 0.0, "d": 1, "age": 15.54, "grav": 173.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 17, "k": 52619, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.877, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Note that it's from 2025, which, in ML years, is somewhere between four years and one decade ago.\n\nHow long does one complete training run take roughly, typically, for frontier models? Isn't that measured in weeks or months?"}, {"id": 50676256, "au": "user43928", "dom": 10, "sr": 40, "sc": 1.88, "ep": 2.98, "bs": 0.0, "d": 2, "age": 6.33, "grav": 45.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 0, "k": 1460, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.883, "fa": 0.28, "gp": 0.076, "bl": 0.0, "ds": 0.0, "txt": "Not in my testing.\n\nAll it managed to do is output lots of Math and code snippets, which is something neither Claude nor Codex do unprompted.\n\nThe actual implementation it then performed on some 3D work wasn't any good. It promised significant fixes over what Claude had created, but none of it was an improvement, and it introduced only regressions.\n\nNeon also wasn't fast. In fact I believe it's slower than Opus 5.5. The Antigravity harness is much worse than Claude Code, I couldn't even find a way to stop annoying permission prompts for files outside the workspace folder. Supposedly there is a setting specifically for that, but I could not find it in the latest Antigravity app.\n\nI heard good things about model training work with Gemini Neon compared to Claude, during this controversy where people claim Claude intentionally sabotages the work. Maybe this is an area where Gemini Neon excels."}, {"id": 50676537, "au": "edg5000", "dom": 42, "sr": 41, "sc": 1.86, "ep": 3.4, "bs": 0.0, "d": 4, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 86, "qw": 0, "k": 680, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.448, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I believe AI Mode is a about 400B parameters, so not quite Kimi/GLM/DeepSeek and also not Opus's ~2-4T in size. That sets the expectations. 400B is still a lot. \nI personally find it great for questions that need a quick answer, even very specific and involved questions. Have not cought it making a mistake. Can you give an example or type of question that kind of breaks AI Mode? I'd like to see the limits to what it can do so I get a feel for when and when not to use it."}, {"id": 50675177, "au": "x3n0ph3n3", "dom": 20, "sr": 42, "sc": 1.83, "ep": 3.37, "bs": 0.0, "d": 3, "age": 10.22, "grav": 90.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 1586, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.02, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I practically 1-shot a full Terraform HCL parser and emmiter for Ruby. It caught so many edge cases on its own and validated itself on my thousands of terraform files. Cost about $20 in api priced tokens."}, {"id": 50674964, "au": "N3cr0ph4g1st", "dom": 166, "sr": 43, "sc": 1.65, "ep": 2.53, "bs": 0.0, "d": 2, "age": 11.06, "grav": 102.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 34, "qw": 0, "k": 40, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 1.077, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Tasks is a nice start but the fact that it can't even actually send the god damn email is such a fail. Also all 3rd party mcp needs approval there's no way to say approve all"}, {"id": 50675316, "au": "aenis", "dom": 3, "sr": 44, "sc": 1.62, "ep": 2.73, "bs": 0.0, "d": 2, "age": 9.64, "grav": 83.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 202, "qw": 0, "k": 1565, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "opus_neon", "flbl": "Opus & Neon (Astra)", "urls": [], "ig": 0.476, "fa": 0.28, "gp": 0.557, "bl": 0.0, "ds": 0.0, "txt": "FWIW, and its not much: in my own benchmark suite, it does win some, and loses others - but it definitely punches in the same weight as Astra, Fable and Opus.\n\nThe benchmark where it wiped the floor with competition: game world, api provides view through the eyes and the ability to move limbs and shoot. Objective: design an algorithm that controls a 3 person squad through a fight. Radio is available but limited, movements and perception are constrained to what a human being can do (e.g. slowed reflexes and penalties for jittery movement), each player is controlled individually with no squad-level state sharing except via the radio. Unattended, 5hr work, where the agent decides the time budget split between thinking, coding and running CPU-constrained sim games. Thats basically the whole prompt, plus api specs.\n\nNeon blew the competition totally out of the water - followed by Astra 6.2, Sol 6.2, and only then Fable, followed by Opus. It also finished below its allocated time budget.\n\nOn my other benchmarks, where the agents are to invent UIs or visually pleasing and algorithmically complex effects - that are then compared against each other, Fable and Opus still rule. They seem to have a better ability to decide when something looks good to a human, I think."}, {"id": 50675334, "au": "tgsovlerkhgsel", "dom": 41, "sr": 45, "sc": 1.61, "ep": 3.15, "bs": 0.0, "d": 3, "age": 9.59, "grav": 82.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 17185, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "The AI mode responses on the search page are \"pretty good\"? I've found them consistently hallucinating and wrong to a level I didn't think modern models, even the flash variants, were capable of. They're fine for retrieval of information that shows up clearly in the search results but anything beyond that I didn't find them usable."}, {"id": 50675005, "au": "pcthrowaway", "dom": 40, "sr": 46, "sc": 1.6, "ep": 3.14, "bs": 0.0, "d": 2, "age": 10.94, "grav": 100.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 0.996, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "I haven't really used Neon much yet, but even the \"AI mode\" responses from Google's search page are pretty good, and much more easily comprehensible than Opus's prose.\n\nI really like Opus. It produces incredibly literate code, and it's occasionally a phenomenal communicator, but most of the time I'm just mystified by its English writing. From my (again limited) sampling, even Kimi is a better communicator."}, {"id": 50678490, "au": "amluto", "dom": 125, "sr": 47, "sc": 1.55, "ep": 2.94, "bs": 0.0, "d": 2, "age": 1.17, "grav": 8.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 25857, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.252, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Or you give the model the ability to write code that reads The model’s transcript.\n\nI’m not saying the strawberry problem is a big deal. I’m saying that models often have  some difficulty perceiving their own input at a low level, and cross-layer attention seems like it could help in general."}, {"id": 50675349, "au": "tgsovlerkhgsel", "dom": 82, "sr": 48, "sc": 1.54, "ep": 2.86, "bs": 0.0, "d": 1, "age": 9.52, "grav": 81.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 17185, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 1.087, "fa": 0.0, "gp": 0.212, "bl": 0.0, "ds": 0.0, "txt": "Is the harness available on the web anywhere near as good as Claude's?\n\nI remember being baffled as I gave a task to Claude and it built code, built tests for it, including a browser screenshot test, and gave me a finished result, at a time where Gemini's web UI could barely make simple tool calls."}, {"id": 50675361, "au": "LoganDark", "dom": 28, "sr": 49, "sc": 1.52, "ep": 3.06, "bs": 0.0, "d": 3, "age": 9.48, "grav": 80.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 0, "k": 4941, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.302, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I can definitely see why Apple chose the Gemini family of models to help them train Siri, given this.\n\nI can also attest that Gemini blows other models absolutely out of the water on non-coding tasks, it's the best I've seen since ChatGPT's original release."}, {"id": 50674437, "au": "abixb", "dom": 27, "sr": 50, "sc": 1.51, "ep": 3.05, "bs": 0.0, "d": 2, "age": 12.62, "grav": 125.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 4406, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.297, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's deeply scientific but also has an appreciation for culture and beauty unlike any other model. Try asking it about the intricacies of music or some other highly disciplined art form -- Neon's (and to an extent Hydrogen's) answers blow other models away.\n\nDeepMind is doing something different here."}, {"id": 50675957, "au": "dgellow", "dom": 49, "sr": 51, "sc": 1.47, "ep": 3.01, "bs": 0.0, "d": 3, "age": 7.33, "grav": 55.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 23250, "kpp": 3.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 1.283, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The Google search responses are completely unreliable, outdated, and often inaccurate to the point of being misleading. You really shouldn’t rely on them outside of very general knowledge questions. And even for that, ask the model to do a round of validation and almost everytime it will apologize and correct the initial one"}, {"id": 50673645, "au": "jhu247", "dom": 164, "sr": 52, "sc": 1.46, "ep": 2.71, "bs": 0.0, "d": 0, "age": 14.48, "grav": 155.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 65, "qw": 0, "k": 152, "kpp": 6.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.095, "fa": 0.0, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "what is google doing on the consumer side of things? why don't they have a muse/dots product? they know everything about my life through the last 15+ years of having my email and calendar and photos and they're not doing anything with it. i don't care about the model quality at this point if it's not adding value to my day to day. it's laughable tbh"}, {"id": 50673194, "au": "serioussecurity", "dom": 159, "sr": 53, "sc": 1.41, "ep": 1.56, "bs": 0.0, "d": 2, "age": 15.76, "grav": 177.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 16, "qw": 0, "k": 681, "kpp": 5.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.251, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "... If you're gonna fact check people don't be wrong. It was presented at ICML in 2025"}, {"id": 50673806, "au": "gr_norm", "dom": 173, "sr": 54, "sc": 1.38, "ep": 2.63, "bs": 0.0, "d": 2, "age": 14.01, "grav": 147.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 1173, "kpp": 6.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.118, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yeah, Google has broadly been a very good steward of open science (and open models, with Gemma!). Of the three frontier labs, they're the one I feel least bad about handing money to."}, {"id": 50673528, "au": "xiaogui917", "dom": 148, "sr": 55, "sc": 1.31, "ep": 5.37, "bs": 2.52, "d": 1, "age": 14.83, "grav": 161.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 1, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.59, "fa": 0.34, "gp": 0.459, "bl": 0.95, "ds": 0.0, "txt": "That's the combination I'm most curious about too — depthwise attention and looped layers both try to squeeze more out of the same parameters, so stacking them feels natural, though I'd expect the interaction to be hard to predict without just trying it. The other question in my mind is whether the 3x speedup survives at serving time, where memory bandwidth and the KV cache usually dominate over raw FLOPs. If it holds up there, it would be a genuinely practical win rather than just a training-time one."}, {"id": 50675099, "au": "mannanj", "dom": 14, "sr": 56, "sc": 1.31, "ep": 2.83, "bs": 0.0, "d": 2, "age": 10.57, "grav": 95.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 27, "qw": 0, "k": 250, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 0.865, "fa": 0.0, "gp": 0.55, "bl": 0.0, "ds": 0.0, "txt": "The last 2 times I heard this about google's models, it was not true. I really wonder how many people these days are just band wagoners or fake llm shills."}, {"id": 50675380, "au": "DeathArrow", "dom": 117, hatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 1.157, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If you want it really cheap, there's a mobile operator in India which gives away 12 months of Gemini AI Pro subscriptions.\n\nIt works outside India and some users are selling these subscriptions for around €8 per year, (yes year, it's not a typo). I have been using it for months already and also a group on X from all kinds of countries succesfully use it every day.\n\nNot sure whether I can mention that site here, so I You can find my X in my bio.\n\nIt's the first advertisement on Google for me when searching for \"google ai pro subscription\" but that's probably based on my previous searches."}, {"id": 50675871, "au": "amunozo", "dom": 74, "sr": 61, "sc": 1.31, "ep": 2.65, "bs": 0.0, "d": 1, "age": 7.65, "grav": 59.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 946, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.542, "fa": 0.0, "gp": 0.951, "bl": 0.0, "ds": 0.0, "txt": "Which subscriptions do you have? I have a Claude Max and Gemini Pro, of course not comparable, but I get the feeling the Claude subscriptions are more generous, even when I had Claude Pro."}, {"id": 50673652, "au": "spankalee", "dom": 1, "sr": 62, "sc": 1.31, "ep": 2.55, "bs": 0.0, "d": 0, "age": 14.46, "grav": 154.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.328, "fa": 0.0, "gp": 1.228, "bl": 0.0, "ds": 0.0, "txt": "This week I've been wondering if I should cancel my Claude subscription because Gemini Neon is not obviously better or worse that Opus, and while I regularly use up my Claude subscription, I can't nds issues which even I miss sometimes."}, {"id": 50673903, "au": "spankalee", "dom": 109, "sr": 66, "sc": 1.31, "ep": 2.31, "bs": 0.0, "d": 4, "age": 13.76, "grav": 143.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 12049, "kpp": 4.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.563, "fa": 0.28, "gp": 0.13, "bl": 0.0, "ds": 0.0, "txt": "The host machine and VMs are NixOS, using MicroVM.nix and install Chrome, Claude, and Antigravity via Nix so that everything's reproducible. I keep all the configs in Git, and mostly use Antigravity to update the system these days."}, {"id": 50673828, "au": "allthetime", "dom": 97, "sr": 67, "sc": 1.31, "ep": 2.25, "bs": 0.0, "d": 2, "age": 13.95, "grav": 146.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 623, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.876, "fa": 0.0, "gp": 0.136, "bl": 0.0, "ds": 0.0, "txt": "Antigravity… there is antigravity proper which is just a chat that shows you code changes and antigravity ide (vs code with proper integration) where you can actually work on your code. There is a command line tool but it can’t be used with subscription and is pay per token."}, {"id": 50675229, "au": "option_greek", "dom": 47, "sr": 68, "sc": 1.31, "ep": 2.25, "bs": 0.0, "d": 3, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 2950, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 0.859, "fa": 0.0, "gp": 0.159, "bl": 0.0, "ds": 0.0, "txt": "i don't know why people hate that ai mode thingy. my experience is same as yours and i don't use chatgpt unless i need a really deep research. for everything else especially around product research, ai mode beats everything else"}, {"id": 50673679, "au": "quantumspandex", "dom": 137, "sr": 69, "sc": 1.31, "ep": 2.22, "bs": 0.0, "d": 3, "age": 14.38, "grav": 153.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 0, "k": 49, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.945, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Performance is essentially intelligience. For every compute you save, you can use it to scale up intelligience instead. The bitter lesson."}, {"id": 50678620, "au": "Balinares", "dom": 15, "sr": 70, "sc": 1.31, "ep": 2.22, "bs": 0.0, "d": 3, "age": 0.94, "grav": 7.0, "surf": 13.1, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 151, "qw": 0, "k": 892, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.931, "fa": 0.0, "gp": 0.019, "bl": 0.0, "ds": 0.0, "txt": "Anecdotally, I had the same experience as you with earlier Gemini models. Gave them a shot, and switched back very fast because it was clear they would not cut it.\n\nThis week I tried Neon. I tasked it with prototyping a solution to a gnarly problem that Opus had only been able to approach with an excessive pile of clunky code with some unacceptable operational constraints.\n\nNeon gave me a neat and tidy solution that elegantly leveraged the specifics of my codebase and the open source software system it interacts with. Neon actually tracked down that software's source code, downloaded the relevant files, and studied them so it could build its solution on top of its specific behavior. By contrast, I feel Claude tends to reimplement its own wheels from first principles at lot.\n\nI'm going to keep kicking the tires out of it, but as it stands, it's my new default. Now let's hope Google doesn't screw it up."}, {"id": 50673846, "au": "Alpha3031", "dom": 165, "sr": 71, "sc": 1.31, "ep": 2.21, "bs": 0.0, "d": 1, "age": 13.91, "grav": 145.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 316, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 0.943, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Apparently this is what the \"tasks\" option in Gemini is supposed to be (I'm not sure I really see the appeal but I haven't used it much) though given apparently not very many people have heard of it I do think Google has a bit of a problem product-wise in a) letting people know there is new stuff when they release it and b) actually being clear who has access to what and where."}, {"id": 50676330, "au": "jordz", "dom": 85, "sr": 72, "sc": 1.31, "ep": 2.15, "bs": 0.0, "d": 1, "age": 6.01, "grav": 42.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 219, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.84, "fa": 0.0, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Does anyone know whether working on LLM research with Neon would cause a ban or some kind of weird behaviour as reported with Anthropic models?"}, {"id": 50675958, "au": "maltelau", "dom": 120, "sr": 73, "sc": 1.31, "ep": 2.14, "bs": 0.0, "d": 1, "age": 7.33, "grav": 55.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 52, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "google_attention", "flbl": "Google & Attention (CLI)", "urls": [], "ig": 0.572, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "If anything, they should points (with uncertainty). A bar graph implies that the other end of the bars are 0, which can be misleading if the axis doesn't go to 0. And if you actually changed the y-axis to include 0, the small changes in the 20-21 range would be hard to read, and I suspect the intended message of improvement would be weakened."}, {"id": 50676409, "au": "2easy", "dom": 143, "sr": 74, "sc": 1.31, "ep": 2.13, "bs": 0.0, "d": 0, "age": 5.71, "grav": 39.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 37, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "mode_search", "flbl": "Mode & Search (Google)", "urls": [], "ig": 0.538, "fa": 0.28, "gp": 0.046, "bl": 0.0, "ds": 0.0, "txt": "I’m a sucker for speed, If all responses had subsecond latency this would transform how we interact with AI"}, {"id": 50675576, "au": "tgsovlerkhgsel", "dom": 84, "sr": 75, "sc": 1.31, "ep": 2.12, "bs": 0.0, "d": 3, "age": 8.76, "grav": 72.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 17185, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "claude_gemini", "flbl": "Claude & Gemini (Neon)", "urls": [], "ig": 0.903, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Any kind of local harness means I have to set up (and boot) a VM for isolation then fight it every time I need to get a file in or out. This makes it annoying enough that I know I won't use it. Hence, I care a lot more about how well the overall product works than about the model."}, {"id": 50677610, "au": "cowlevel", "dom": 131, "sr": 76, "sc": 1.31, "ep": 2.12, "bs": 0.0, "d": 0, "age": 2.63, "grav": 15.8, "surf": 12.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 3195, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "coding_fried", "flbl": "Coding & Fried (Prompts)", "urls": [], "ig": 0.878, "fa": 0.0, "gp": 0.04, "bl": 0.0, "ds": 0.0, "txt": "Nice trick. Shows how many possibilities are left at the lower layers of ML while we've all been messing around with prompts."}, {"id": 50676097,
