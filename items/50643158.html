 (including some computer science and theoretical physics). They are areas where everything you need to know is digital. For physics in general you need to do experiments, which there are no software defined way to do yet. So the next deluge would not likely be there. The areas I imagined could be the next were: astronomy, statisitcs, some economics and history. Maybe even philosophy and literature."}, {"id": 50673455, "au": "heaney-555", "dom": 22, "sr": 66, "sc": 3.5, "ep": 4.22, "bs": 0.0, "d": 1, "age": 15.13, "grav": 166.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 327, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 0.909, "fa": 0.34, "gp": 0.771, "bl": 0.0, "ds": 0.0, "txt": "Almost all advancements in human knowledge by humans builds on prior human work. It is exceedingly rare that someone truly goes from 0 to 1.\n\nIt's a silly goalpost to suggest that AI building on human work to crack theorums that no human has been able to for over 100 years isn't staggeringly impressive just because it built on prior work."}, {"id": 50670923, "au": "brailsafe", "dom": 251, "sr": 67, "sc": 3.5, "ep": 4.15, "bs": 0.0, "d": 0, "age": 20.66, "grav": 275.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 6497, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.482, "fa": 0.0, "gp": 0.463, "bl": 0.0, "ds": 0.0, "txt": "Very cool and obscure. A candle in the dark among Ai crap. Though I do find it a bit ironic that frontier models still convincingly fail on recent genealogy if the people in question had relatively common names and only familial or hobbiest records kept in public."}, {"id": 50676357, "au": "j3th9n", "dom": 69, "sr": 68, "sc": 3.5, "ep": 4.05, "bs": 0.0, "d": 1, "age": 5.98, "grav": 42.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 651, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.347, "fa": 0.28, "gp": 0.06, "bl": 0.0, "ds": 0.0, "txt": "Skepticism of what? 1’s and 0’s? Computers? They have replaced a lot of human expertise and LLM’s are nothing more than an advancement of that. Just like you used to Google for information at the other side of the planet instead of having to travel to it, replacing the human expertise of for example flying a plane to get it, being able to connect the dots of other information quicker. The human expertise that the LLM is replacing in this article is the writer himself. It’s connecting the dots in no time while the writer admits he would never be able to do the same. It is replacing human expertise, but not all of course, the writer still has to cook his own food and ask the question to the LLM. “A” replacement of human expertise doesn’t exist, but some replacement definitely does."}, {"id": 50675490, "au": "thinkingemote", "dom": 114, "sr": 69, "sc": 3.5, "ep": 4.03, "bs": 0.0, "d": 0, "age": 9.17, "grav": 77.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 10560, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.422, "fa": 0.0, "gp": 0.472, "bl": 0.0, "ds": 0.0, "txt": "A large amount (i.e. most) of materials in archives of all kinds across the world are not digitized. Machines cannot access them and there is no demand nor money to do so.\n\nResearchers routinely spend hours in these archives pouring over paper and objects. If they are lucky and the archive is modern they might have a digital list of what's in the archive but mostly it's paper in boxes.\n\nThere is a fundamental limitation here for LLMs which is also basically how historians do their research."}, {"id": 50673998, "au": "sethev", "dom": 66, "sr": 70, "sc": 3.5, "ep": 4.02, "bs": 0.0, "d": 3, "age": 13.62, "grav": 140.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 120, "qw": 0, "k": 2235, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.522, "fa": 0.0, "gp": 0.306, "bl": 0.0, "ds": 0.0, "txt": "Arguing about whether it was an open question, a mystery, or a minor historical puzzle sounds like quibbling over definitions. The author of the article is a professor of history with an established record of academic publications who believes this was a significant discovery in an area where he has expertise. He clearly described how the model connected the dots and why he thought a human probably would not have been able to do the same.\n\nNothing in his article gives the impression that he felt this was threatening to him or his field.\n\nThis is an interesting contrast to a lot of the way AI as discussed in software engineering circles. It's definitely food for thought for my own worries about the future of software."}, {"id": 50672635, "au": "tacitusarc", "dom": 231, "sr": 71, "sc": 3.5, "ep": 3.95, "bs": 0.0, "d": 1, "age": 17.17, "grav": 203.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 1540, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.008, "fa": 0.28, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I disagree. My benchmark has always been, and continues to be, spacial and geometric reasoning. AI models still severely lack this.\n\nThat being said, I don't think it has been a focus. Once it is, I expect them to improve dramatically."}, {"id": 50670175, "au": "zkmon", "dom": 260, "sr": 72, "sc": 3.5, "ep": 3.9, "bs": 0.0, "d": 0, "age": 21.91, "grav": 303.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 0, "k": 2333, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.525, "fa": 0.0, "gp": 0.219, "bl": 0.0, "ds": 0.0, "txt": "The awe and shock would continue for some more time across all sections of the knowledge work, about the automation of reasoning, thinking and connecting the dots. The same way it would shocked the people when they first had a electric lamp, electric motor or a calculator, automating the light, force and arithmetic.\n\nBy the way, this knowledge mining and connecting the dots would only put a limelight on those events or persons that are recorded. There are far more amount of unsung and amazing things that were never recorded."}, {"id": 50673823, "au": "Sniffnoy", "dom": 71, "sr": 73, "sc": 3.5, "ep": 3.81, "bs": 0.0, "d": 1, "age": 14.04, "grav": 147.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 48, "k": 5536, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 0.963, "fa": 0.42, "gp": 0.243, "bl": 0.0, "ds": 0.0, "txt": "> Therein lies my skepticism. In the same way LLMs have been used for mathematical theorems, the way LLMs are used to search for this unknown figure is to pit it against a wide lexicon of sources established by humans. It is useful, but still not a replacement of human expertise.\n\nSorry, but what do you think a human historian (or mathematician) does?  Would you say \"aha, this historian didn't make any real discoveries, because he had to rely on existing sources?\"  What?  That's what historians do, they rely on sources!  If an LLM does it instead it's done what a historian does.  Same with mathematics.\n\n(It may be worth keeping in mind here Rota's old dictum that every mathematician, even the greatest ones, each have only a few tricks...)"}, {"id": 50673707, "au": "mannyv", "dom": 119, "sr": 74, "sc": 3.49, "ep": 3.78, "bs": 0.0, "d": 0, "age": 14.38, "grav": 153.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 2260, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 0.648, "fa": 0.28, "gp": 1.006, "bl": 0.0, "ds": 0.0, "txt": "This also implies that if you give the LLM crime locations and a whole bunch of people's location information they can narrow down the people who committed the crime."}, {"id": 50673889, "au": "_hyn3", "dom": 98, "sr": 75, "sc": 3.49, "ep": 3.75, "bs": 0.0, "d": 1, "age": 13.89, "grav": 145.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 1916, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 0.945, "fa": 0.34, "gp": 0.384, "bl": 0.0, "ds": 0.0, "txt": "I would find that even more impressive if the answer was buried in its training, the model then surfaced it on its own, and then retroactively reconstructed the human trail.\n\nActually then I'd wonder what took so long. It doesn't take me 22 minutes to remember something."}, {"id": 50672543, "au": "dang", "dom": 315, "sr": 76, "sc": 3.49, "ep": 3.74, "bs": 0.0, "d": 2, "age": 17.43, "grav": 208.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 26, "qw": 0, "k": 44272, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": ["https://news.ycombinator.com/item?id=49926917", "https://news.ycombinator.com/from?site=resobscura.substack.com"], "ig": 1.178, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "So is HN's own benbreen, who has posted extensively on his experiments with LLMs. e.g.:\n\nUsing Opus 5.5 to discover a new eyewitness record of the dodo - https://news.ycombinator.com/item?id=49926917 - Oct 2026 (80 comments)\n\nhttps://news.ycombinator.com/from?site=resobscura.substack.c..."}, {"id": 50672401, "au": "kss238", "dom": 270, "sr": 77, "sc": 3.49, "ep": 3.73, "bs": 0.0, "d": 1, "age": 17.83, "grav": 216.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 0, "k": 195, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.094, "fa": 0.34, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "I asked Astra 6.2 to identify him. After 5 mins it said Adam Back with low confidence.\n\nI asked Opus 5.5 the same and it also said Adam back with low confidence.\n\nI’m going to see if it’ll do some original research on this. Both answers given mostly relied on human research on this."}, {"id": 50672443, "au": "pessimizer", "dom": 262, "sr": 78, "sc": 3.49, "ep": 3.73, "bs": 0.0, "d": 0, "age": 17.71, "grav": 214.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 170, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.493, "fa": 0.0, "gp": 0.152, "bl": 0.0, "ds": 0.0, "txt": "This is the kind of thing that I am not overly impressed by but happy that we can do. The reason why this wasn't discovered is because there are only a dozen people who are are aware and interested and only a couple who have put in a week's effort to try to figure it out. The clue was in a book professionally published within the last decade.\n\nAnybody could have figured it out, but only AI took the time. Simultaneously not impressive, but also sort of overwhelming in that there are a billion of these holes in the world that could be trivially filled in by these things. I do think that the result of this will be how few of these mysteries it actually matters to know.\n\nConnecting historical dots is similar to bug-finding in that way - if anybody was looking, that bug would have been found, but nobody had time to look until now. But bugs often represent a vulnerability, and many historical mysteries were only interesting because they were mysterious, and offer no lessons."}, {"id": 50668879, "au": "roarcher", "dom": 286, "sr": 79, "sc": 3.49, "ep": 3.71, "bs": 0.0, "d": 1, "age": 23.7, "grav": 345.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 0, "k": 1550, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.507, "fa": 0.0, "gp": 0.12, "bl": 0.0, "ds": 0.0, "txt": "I see this Jim-Cramer-esque hot take on almost every discussion that touches the frontier models. Someone always makes the same point about \"moats\" and confidently predicts market outcomes as if that's a complete model of the markets.\n\nThis has been posted a thousand times by now, and whether it ultimately proves true or not, it's conjecture at this point. Seeing it regurgitated over and over again on threads that have nothing to do with the economics of AI feels like point farming."}, {"id": 50671626, "au": "paganel", "dom": 297, "sr": 80, "sc": 3.49, "ep": 3.69, "bs": 0.0, "d": 1, "age": 19.42, "grav": 248.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 22, "k": 14399, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 0.973, "fa": 0.42, "gp": 0.143, "bl": 0.0, "ds": 0.0, "txt": ">  Ie. they will be able to list every person alive and exactly what they were doing every day for the past 10,000 years.\n\nThey won't be able to do that because the recorded data just isn't there. Of course, AI can phantasise that data, but that's another discussion. This is for \"past\" persons, so to speak, when it comes to \"current\" and \"future\" persons I'm afraid you're pretty much correct, the data is already here."}, {"id": 50643211, "au": "dr_red_dog", "dom": 124, "sr": 81, "sc": 3.49, "ep": 3.66, "bs": 0.0, "d": 0, "age": 73.14, "grav": 2380.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 202, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 0.849, "fa": 0.0, "gp": 1.15, "bl": 0.0, "ds": 0.0, "txt": "Thought this was interesting. You hear so much about AI solving math problems, but here it solved an open history question, pretty definitively."}, {"id": 50672789, "au": "Twiin", "dom": 3, "sr": 82, "sc": 3.49, "ep": 3.62, "bs": 0.0, "d": 2, "age": 16.76, "grav": 195.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 34, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.43, "fa": 0.0, "gp": 0.181, "bl": 0.0, "ds": 0.0, "txt": "I don't disagree with a lot of this, but up until very recently I would have considered \"look through tens of thousands of unindexed pages of faded cursive german handwriting at the national archives\" to be a labour bottleneck not an intelligence bottleneck. The only real reason someone didn't decipher these messages before me is just how much effort it is to find relevant material to use in assisting the work. So alongside being smarter, the other thing that frontier models are doing now is they're able to handle more and more material that doesn't require intelligence as much as it requires persistence."}, {"id": 50676707, "au": "testerius", "dom": 33, "sr": 83, "sc": 3.49, "ep": 3.62, "bs": 0.0, "d": 7, "age": 4.68, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 132, "qw": 0, "k": 24, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.457, "fa": 0.0, "gp": 0.133, "bl": 0.0, "ds": 0.0, "txt": "Exactly. I'd also add that our world is so vast and still so unexplored that people will always have plenty of things to do. Just exploring oceans, seas, mountains, forests, caves, deserts, and jungles could keep us busy for ages. And that's just our planet, not to mention space.\n\nThere are so many things to do that even if every human had all the knowledge humanity has ever accumulated stored in their brain, and the ability to process information and perform calculations at machine-like speeds, there would still be countless challenges left to tackle. Can you imagine exploring every corner of the world, even places we currently have no way of reaching? Terraforming other planets, learning about the unknown, discovering things that have yet to be discovered. Now that would be a real adventure."}, {"id": 50671090, "au": "XenophileJKO", "dom": 156, "sr": 84, "sc": 3.49, "ep": 3.6, "bs": 0.0, "d": 3, "age": 20.39, "grav": 269.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 985, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.53, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Visionaries, at least for the current model architecture arc. (Though I am not confident this will hold in an era of model self improvement.)\n\nI think we have the ability to solve or build anything, that moves the hard part to defining the goals. It also requires opinion to move the models to novelty in non self verifiable domains."}, {"id": 50676814, "au": "DrBazza", "dom": 164, "sr": 85, "sc": 3.49, "ep": 3.57, "bs": 0.0, "d": 2, "age": 4.39, "grav": 28.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 76, "qw": 0, "k": 5504, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.414, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "I should have quoted ‘creative leap’ as the phrase used on the wiki page I was reading.  On other hand, how many ‘creative leaps’ made by humans are connecting the dots subconsciously between things we actually know, just like an LLM, versus an actual novel idea that is based on no a priori knowledge?  I think it’s the latter that LLMs can’t do yet.  Can an LLM suggest putting toast on the back of a cat to get a perpetual motion machine?"}, {"id": 50674513, "au": "SoftTalker", "dom": 12, "sr": 86, "sc": 3.49, "ep": 3.56, "bs": 0.0, "d": 2, "age": 12.53, "grav": 123.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 26976, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.45, "fa": 0.0, "gp": 0.103, "bl": 0.0, "ds": 0.0, "txt": "Agree. Being a keeper of a silo of knowledge (lawyer, accountant, doctor, mathematician, etc) will soon have little value. The models will have that knowledge and continue to accumulate it, and it will be cheaply available to anyone. Agents will be able to do any information processing that requires that knowledge. To the extent that physical or manipulative work is required (e.g. surgery) then machines are not quite there yet, though that will probably change too."}, {"id": 50668511, "au": "seeknotfind", "dom": 278, "sr": 87, "sc": 3.49, "ep": 3.55, "bs": 0.0, "d": 1, "age": 24.25, "grav": 358.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 833, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.411, "fa": 0.0, "gp": 0.164, "bl": 0.0, "ds": 0.0, "txt": "The famous myth \"everything that can be invented has been invented\". We've seen but a flit of light in the infinite darkness. Upwards and onwards mi amigo.\n\nThe world's most challenge problems are the ones that haven't been solved, not the limit of what we would like to understand. Though it's hard to feel that outside of the bay where so many problems feel so far from the computers."}, {"id": 50677271, "au": "egorfine", "dom": 179, "sr": 88, "sc": 3.49, "ep": 3.49, "bs": 0.0, "d": 0, "age": 3.28, "grav": 20.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 3773, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.466, "fa": 0.0, "gp": 0.032, "bl": 0.0, "ds": 0.0, "txt": "I have been playing around with GPT-6 Astra and have discovered previously unknown accounts of Zoya Kosmodemyanskaya - by running web search and asking chatgpt to connect the dots of written witness accounts.\n\n(I did not talk about it because nobody cares)"}, {"id": 50678910, "au": "goodmythical", "dom": 9, "sr": 89, "sc": 3.46, "ep": 3.46, "bs": 0.0, "d": 3, "age": 0.55, "grav": 5.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 43, "qw": 24, "k": 839, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.551, "fa": 0.76, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">You can only charge $300/hour to fix a clogged toilet at 9 pm if the person whose toilet is clogged can afford to pay you $300/hour.\n\nI do not personally know a single american who would or could pay someone $300 an hour for anything but a life saving operation.\n\nWe're going to the gas station until Bob fixes the toilet for a case of beer or an \"I'll fix you wifi\" coupon."}, {"id": 50674423, "au": "SoftTalker", "dom": 68, "sr": 90, "sc": 3.41, "ep": 3.41, "bs": 0.0, "d": 2, "age": 12.75, "grav": 127.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 26976, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.447, "fa": 0.0, "gp": 0.003, "bl": 0.0, "ds": 0.0, "txt": "History is by definition based on information that people wrote down or otherwise preserved, or artifacts that humans discovered and documented. There's no mathematical or logical underpinning that can lead to provable new understanding.\n\nIn this case the author of a sketchbook was identified based on the extraordinarily large corpus of information that LLMs are trained on. No human, other than by luck, would have access to find that."}, {"id": 50676712, "au": "testerius", "dom": 39, "sr": 91, "sc": 3.4, "ep": 3.4, "bs": 0.0, "d": 7, "age": 4.67, "grav": 30.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 131, "qw": 0, "k": 24, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.446, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I'd also add that our world is so vast and still so unexplored that people will always have plenty of things to do. Just exploring oceans, seas, mountains, forests, caves, deserts, and jungles could keep us busy for ages. And that's just our planet, not to mention space.\n\nThere are so many things to do that even if every human had all the knowledge humanity has ever accumulated stored in their brain, and the ability to process information and perform calculations at machine-like speeds, there would still be countless challenges left to tackle. Can you imagine exploring every corner of the world, even places we currently have no way of reaching? Terraforming other planets, learning about the unknown, discovering things that have yet to be discovered. Now that would be a real adventure."}, {"id": 50671161, "au": "ozgrakkurt", "dom": 173, "sr": 92, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 4, "age": 20.27, "grav": 266.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 1363, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.29, "fa": 0.0, "gp": 0.242, "bl": 0.0, "ds": 0.0, "txt": "I saw a lawyer post that they setup a fairly large machine for local inference using some qwen model on legal documents.\n\nThat should be pretty solid assuming they don’t connect that machine to the internet."}, {"id": 50672805, "au": "ks2048", "dom": 296, "sr": 93, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 1, "age": 16.73, "grav": 195.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 5125, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 0.97, "fa": 0.34, "gp": 0.091, "bl": 0.0, "ds": 0.0, "txt": "I don't mean to be rude, but this is a form of AI psychosis. Sure, they could \"fit the data\" populated by 100+ billion hypothetical people - and matching all the data we can gather today. And that would be interesting!\n\nBut, much is simply lost to history. \"able to list every person alive and exactly what they were doing every day for the past 10,000 years\" is crazy."}, {"id": 50675018, "au": "perilunar", "dom": 239, "sr": 94, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 1, "age": 11.01, "grav": 101.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 2788, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.026, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "From the article:\n\n\"I should also point out here that these abilities are not entirely unique to GPT-6.2 Astra. I subsequently ran the same test (using the same prompt) with Fable 5.2 and it reached the same conclusion in about 35 minutes.\""}, {"id": 50668621, "au": "bradishungry", "dom": 300, "sr": 95, "sc": 3.38, "ep": 3.38, "bs": 0.0, "d": 1, "age": 24.09, "grav": 354.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 130, "qw": 0, "k": 75, "kpp": 4.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.335, "fa": 0.0, "gp": 0.166, "bl": 0.0, "ds": 0.0, "txt": "You’re really underestimating just how many people are alive and have been alive in the past. There are also a lot of people with small footprints that may be doing quite a bit. Also, something that is very important to keep in mind is there are tons of historical records that contradict each other or are opinionated, a lot of things in history are wrong and llms don’t necessarily catch that, they usually put forward the most commonly used sources. There are a lot of things in history that are taken as fact by a lot of people that are not entirely accurate. AI will get better but I don’t think the information is there on most people and frankly I would not want AI systems to know everything about everyone for fear of bad actors."}, {"id": 50671281, "au": "pcthrowaway", "dom": 215, "sr": 96, "sc": 3.37, "ep": 3.37, "bs": 0.0, "d": 1, "age": 20.11, "grav": 263.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 126, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.358, "fa": 0.0, "gp": 0.125, "bl": 0.0, "ds": 0.0, "txt": "I think it'll be years still til an LLM can deduce (some of) the contents of the library of of Alexandria (naming a list of lost works which are referenced from other surviving works, then surviving quotations from those works, then a historical biography of the authors of those lost works, then a way to string those surviving quotations into cohesive approximations of the original works that take into account all that is known of the works, their authors, and known historical figures who read those works and cited influence from them)\n\nEven after a catalogue of known lost works is produced, each one of these could be an enormous project for a team of people using LLMs (and many of course will be impossible to recover in any meaningful way)"}, {"id": 50679202, "au": "ElProlactin", "dom": 10, "sr": 97, "sc": 3.28, "ep": 3.28, "bs": 0.0, "d": 4, "age": 0.05, "grav": 3.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2183, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 0.983, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "You've never lived in the SF Bay Area I take it?\n\nBut yeah, all of the new hype about people in the trades with 7 figure businesses is dishonest about the fact that this is the 1% of the blue collar and the foundation of high-paying trade work is white collar wealth."}, {"id": 50668723, "au": "suddenlybananas", "dom": 192, "sr": 98, "sc": 3.24, "ep": 3.24, "bs": 0.0, "d": 1, "age": 23.94, "grav": 350.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 146, "k": 1539, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 0.781, "fa": 0.42, "gp": 0.141, "bl": 0.0, "ds": 0.0, "txt": "I agree more or less although I think this is more than just what an index could achieve.  I thought this comment on the article was quite insightful (and liked by the author).\n\n>But this isn't the work of historians. It's not an interpretation. It's a very narrow kind of problem that historians, archivists and literary scholars occasionally have to work on--establishing provenance, authorship, etc. on particular documents and manuscripts held within archives, and using a form of forensic analysis to establish possible connections between texts about which we know less than we might like. It's important work, and it's not unprecedented to be using computational tools in doing it--there were scholars using topic modelling and network analysis to approximate some of this kind of analysis. But the end it's only nailing down one kind of precondition for historical analysis. The documents that get identified or reclassified through this work do not speak for themselves or contain self-evident meaning or significance. That's up to us still. That's what matters. And that kind of interpretation is not like a mathematical proof."}, {"id": 50674099, "au": "NoMoreNicksLeft", "dom": 121, "sr": 99, "sc": 3.22, "ep": 3.22, "bs": 0.0, "d": 1, "age": 13.43, "grav": 137.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 0, "k": 1648, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.227, "fa": 0.0, "gp": 0.23, "bl": 0.0, "ds": 0.0, "txt": "Not clear that this should be allowed without a warrant. Giving (legally acquired information) to a cop and letting him narrow it down is no big deal. But allowing the cop to use technology that lets him see something he could not see on his own is very much the principle of a unreasonable search and seizures."}, {"id": 50672941, "au": "altmanaltman", "dom": 112, "sr": 100, "sc": 3.21, "ep": 3.21, "bs": 0.0, "d": 1, "age": 16.39, "grav": 189.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 77, "qw": 0, "k": 1088, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.025, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Isn't it more of an issue that we don't actually have a lot of evidence, and we don't even know which language it is? The fact that Napoleon's soldiers found the Rosetta Stone was really helpful in understanding ancient languages because they provided a relative link that made it easy to understand w/ egyptian hieroglyphics. For the indus script, something like that just doesn't exist. So not sure how much AI can help unless we find more evidence/bigger corpus."}, {"id": 50672453, "au": "cauch", "dom": 254, "sr": 101, "sc": 3.12, "ep": 3.12, "bs": 0.0, "d": 1, "age": 17.68, "grav": 213.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 100, "qw": 0, "k": 683, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.328, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "It's my impression too.\n\nApparently, there was a lot of people doing this journey. And if I understand correctly, the only link between Chabot and the book is that he was doing the same journey more or less at the same time.\n\nML is good at finding spurious pattern and incorrect correlation. Usage of AI in domain where people are not aware of this will lead to a lot of bad conclusions. (and in fact, even in CS, people really under-estimates the stats: there were a lot of humans. What are the chances that Chabot is the only one that fits the few timestamps)"}, {"id": 50675777, "au": "kaffekaka", "dom": 157, "sr": 102, "sc": 3.07, "ep": 3.07, "bs": 0.0, "d": 4, "age": 8.06, "grav": 63.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 75, "qw": 0, "k": 667, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In the end, all the technology we have should be used for whatever it is that we want. So at some point, human decisions will be needed (unless computers decide everything and we are done for).\n\nIf machines can do anything physical or intellectual work better than humans, it seems obvious what we should use them for, from a purely technological and sociological point of view. But the fact that we won't is a pressing political question."}, {"id": 50671368, "au": "cm2012", "dom": 181, "sr": 103, "sc": 3.03, "ep": 3.03, "bs": 0.0, "d": 1, "age": 19.96, "grav": 259.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 25, "qw": 0, "k": 10463, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.223, "fa": 0.0, "gp": 0.106, "bl": 0.0, "ds": 0.0, "txt": "They would need a special unlocked version for law enforcement. The current frontier models do not let you investigate living non-famous people with their awesome powers."}, {"id": 50673884, "au": "joe_the_user", "dom": 65, "sr": 104, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 2, "age": 13.9, "grav": 145.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 27878, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.274, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The thing is, this isn't an \"open historical question\". This is a minor historical puzzle. Historical research generally involves synthesizing material that isn't unknown or mysterious to obtain (even if it involves going to archives or getting oral histories)."}, {"id": 50672353, "au": "latchkey", "dom": 268, "sr": 105, "sc": 2.99, "ep": 2.99, "bs": 0.0, "d": 4, "age": 17.93, "grav": 218.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 17301, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 0.861, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Huh? Right along side that training data is the date it was published. Even the responses which include the publish date, could be filtered.\n\nFind me all the cases where someone said satoshi is your mom and the date it was said...\n\n\"Satoshi is your mom\" - 2020-01-12"}, {"id": 50670719, "au": "abixb", "dom": 161, "sr": 106, "sc": 2.97, "ep": 2.97, "bs": 0.0, "d": 3, "age": 21.04, "grav": 283.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 17, "qw": 0, "k": 4406, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": ["https://news.osu.edu/dim-witted-pigeons-use-the-same-principles-as-ai-to-solve-tasks/"], "ig": 0.718, "fa": 0.45, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, brute-forcing is step zero approach and we find brute forcing approaches in other species as well. [0]\n\n[0] https://news.osu.edu/dim-witted-pigeons-use-the-same-princip..."}, {"id": 50672522, "au": "pizzafeelsright", "dom": 249, "sr": 107, "sc": 2.94, "ep": 2.94, "bs": 0.0, "d": 0, "age": 17.49, "grav": 209.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 0, "k": 979, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.017, "fa": 0.0, "gp": 0.377, "bl": 0.0, "ds": 0.0, "txt": "I would be curious if we could get further without the safety training and the politically or religiously sensitive type of guardrails.\n\nThere are questions that we cannot ask which lead to answers we are not permitted to know by the gatekeepers of these models."}, {"id": 50673795, "au": "twobitshifter", "dom": 67, "sr": 108, "sc": 2.92, "ep": 2.92, "bs": 0.0, "d": 1, "age": 14.12, "grav": 149.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 74, "qw": 0, "k": 5090, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.018, "fa": 0.0, "gp": 0.361, "bl": 0.0, "ds": 0.0, "txt": "Interesting, how much of history is based on novel ideas or pure creativity? In my layman’s view, I would think we are trying to factual as the primary goal, and I am not sure answering questions about who painted a picture has the same need for a spark of insight like mathematics. Math seems like a place for the AI can have no new ideas argument to maybe stand up, but I wouldn’t think the same is true of history."}, {"id": 50673547, "au": "heaney-555", "dom": 25, "sr": 109, "sc": 2.89, "ep": 2.89, "bs": 0.0, "d": 3, "age": 14.87, "grav": 161.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 327, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.123, "fa": 0.0, "gp": 0.172, "bl": 0.0, "ds": 0.0, "txt": "If you actually ask mathematicians about some of the recent proofs, they're quite clear that some of them are not just brute-force wide-search-space solutions, and involve genuinely novel creative insights.\n\nI know it's very appealing to believe that it's all just brute force. But the reality is that it just isn't. And accepting this is key to understanding what's going to happen in coming years."}, {"id": 50673722, "au": "lossyalgo", "dom": 73, "sr": 110, "sc": 2.88, "ep": 3.14, "bs": 0.27, "d": 2, "age": 14.35, "grav": 152.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 292, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.24, "fa": 0.0, "gp": 0.159, "bl": 0.1, "ds": 0.0, "txt": "It's also always LLMs \"will be able to do X\" (future-tense). LLMs are definitely improving but the ability to do X is still always just around the corner, just wait, the next release will probably be able to do it (with no mention of the ever-present hallucinations and ever-increasing workload required to verify the accuracy of results)."}, {"id": 50675637, "au": "vintermann", "dom": 115, "sr": 111, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 1, "age": 8.56, "grav": 69.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 9187, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.205, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes. I'm honestly surprised the AI companies aren't spending more trying to get these dark archives online. \nBeyond the archives that have at least been deposited in an archive institution somewhere, there's an even bigger dark ocean of private archives."}, {"id": 50669741, "au": "jeremyjh", "dom": 151, "sr": 112, "sc": 2.83, "ep": 2.83, "bs": 0.0, "d": 3, "age": 22.48, "grav": 316.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 36, "k": 11956, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.694, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> Most people using AI so far mainly apply it in what they already understand and only really ask the harder questions for things that they understand well enough to even be able to ask those questions.\n\nWell, people use it a lot to learn new things. But you still have to be careful with applying it directly. It makes enough bad decisions in domains I know well to be skeptical when I can't judge it myself."}, {"id": 50673119, "au": "dataking", "dom": 126, "sr": 113, "sc": 2.78, "ep": 2.78, "bs": 0.0, "d": 1, "age": 15.98, "grav": 181.4, "surf": 0.0, "fa r", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.145, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "As far as I can tell it's a myth that they're shredding rare books. They're shredding fairly common, fairly recent books after scanning them, which is likely what would have happened with those books anyway.\n\nThere's no reason whatsoever to do that to archive data which is out of copyright. And archive owners of course wouldn't let them."}, {"id": 50674531, "au": "nl", "dom": 222, "sr": 119, "sc": 2.63, "ep": 2.63, "bs": 0.0, "d": 4, "age": 12.49, "grav": 123.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 71, "k": 34504, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 0.344, "fa": 0.64, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Unclear if you are disagreeing or agreeing with me here?\n\nTo be clear, I think it is possible today to do this:\n\n> [from the  library of of Alexandria] naming a list of lost works which are referenced from other surviving works, then surviving quotations from those works, then a historical biography of the authors of those lost works\n\nI don't think this is possible at all, at any point in the future (unless we invent time machines):\n\n> string those surviving quotations into cohesive approximations of the original works that take into account all that is known of the works, their authors, and known historical figures who read those works and cited influence from them"}, {"id": 50668121, "au": "Sesse__", "dom": 170, "sr": 120, "sc": 2.61, "ep": 2.61, "bs": 0.0, "d": 1, "age": 24.86, "grav": 373.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 57, "qw": 0, "k": 2659, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.013, "fa": 0.0, "gp": 0.161, "bl" : 7.66, "grav": 59.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 373, "qw": 0, "k": -1, "kpp": -0.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 2.141, "fa": 0.34, "gp": 0.512, "bl": 2.3, "ds": 0.0, "txt": "It scant even solve something as recent as 30 years, gimme a fkn break , you'd think it'd spin up an emulator and go frame by frame for what I am gonna post, but nope.\n\nWho knows, knows, else have your \"general ai\" explain to you what's so challenging for it. The reply is an absolute wrapper and couldn't be more wrong.\n\nQuestion:\n\ntekken 5 ganryu had df2+3 how manyvframes of leniency for the crouch cancel in order to get the full juggle\n\nReply:\n\n       In vanilla Tekken 5 (PS2/5.0), Ganryu's d/f+2+3 has a very tight 1- to 3-frame window for the crouch cancel (u or f,f) to connect a full standing juggle, depending on which launcher you choose to pick up the opponent.\nBecause Tekken 5 lacked an official frame display and d/f+2+3 only grants a full launch in version 5.0 (it was patched out by Dark Resurrection), exact frame data is framed around the startup of the follow-up move:\n• Frame advantage on hit. Hitting d/f+2+3 leaves Ganryu at roughly +17 to +18 frames while recovering in Full Crouch (FC).\n• Crouch cancel overhead. Inputting u,N or f,f to stand up costs 1 to 2 frames before a standing attack can begin.\n• Window by follow-up move.\n • d/f+2 (i16) or d/f+1 (i13). Using d/f+2 gives you 1 to 2 frames of leniency (practically a just-frame), while picking up with d/f+1 into a float combo offers a slightly more forgiving 3- to 4-frame window.\n • ws+2 (i16). Skipping the crouch "}, {"id": 50674728, "au": "thehan94", "dom": 200, "sr": 179, "sc": 0.58, "ep": 3.1, "bs": 2.52, "d": 0, "age": 11.88, "grav": 113.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 1, "kpp": 0.2
