n/technology/6191340-ai-chatbot-me...\n\nAI teacher throws tantrum after being corrected on spelling of 'seventeen'\nhttps://tech.yahoo.com/ai/deals/articles/ai-teacher-throws-t...\n\nLawyers Sanctioned for AI: A Tracker of Fake-Citation Cases:\nhttps://www.layer3labs.io/guides/lawyers-sanctioned-for-ai-h...\n\nEven with a trillion dollars of compute behind it, spicy autocomplete remains spicy autocomplete. If Sam Altman and the other magic wishing genie salesmen had come around five years ago and pitched investors on \"give me a trillion dollars and I'll solve some really hard math problems\" we wouldn't be worried about how much money had been invested in OpenAI and Anthropic.\n\nAnd, of course: https://diseasescuredbyai.com/"}, {"id": 50672514, "au": "AlotOfReading", "dom": 210, "sr": 2, "sc": 13.29, "ep": 13.29, "bs": 0.0, "d": 2, "age": 17.51, "grav": 210.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 104, "qw": 0, "k": 15476, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": ["https://doi.org/10.1017/9781009324489", "https://doi.org/10.1016/j.jas.2021.105473"], "ig": 1.848, "fa": 2.35, "gp": 1.55, "bl": 0.0, "ds": 0.0, "txt": "If you don't think historians are familiar with uncertainty, I have to ask if you've actually read any theory? Reasoning under uncertainty is one of the central issues any methodology has to address. Similarly, the role and limitations of narrative argument are well-trod territory, e.g. White.\n\nI'm not sure Bayesian reasoning is all that rare either. Carrier did it intentionally in his new testament studies decades ago. Avierez Tucker has spent his career arguing most historians apply it intuitively without realizing it [0]. I don't think anyone would call him a quack. And of course Bayesian statistics is frequently used in my own subfield of archaeology, especially with dating [1].\n\n[0] https://doi.org/10.1017/9781009324489\n\n[1] https://doi.org/10.1016/j.jas.2021.105473"}, {"id": 50668352, "au": "flowerlad", "dom": 277, "sr": 3, "sc": 10.82, "ep": 10.82, "bs": 0.0, "d": 0, "age": 24.51, "grav": 364.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 146, "qw": 23, "k": 4273, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 2.016, "fa": 1.37, "gp": 1.503, "bl": 0.0, "ds": 0.0, "txt": "> There’s a growing sense in the AI community that we’re approaching an intelligence explosion far faster than even the most optimistic accelerationists predicted.\n\nThis might concern those worried about losing their jobs to AI. But it should concern AI companies as well. AI is rapidly approaching the point of diminishing returns--after solving the world’s most challenging problems, how much room is left for improvement?\n\nOnce AI becomes \"good enough\" for almost any task, investments in AI could be at risk. That's because AI has little inherent moat: you can swap Claude for an OpenAI model and get comparable results. Open-weight models are not far behind, and they may eventually catch up. Meanwhile, hardware is becoming more powerful and cheaper. A machine capable of running inference with a frontier model might cost $500,000 today, but comparable capability could become available on a $5,000 machine in a few years.\n\nIf people can run an open-weight model as powerful as today's frontier models on a $5,000 machine, AI companies could face severe pressure on both revenue and profit margins."}, {"id": 50675247, "au": "nl", "dom": 220, "sr": 4, "sc": 10.76, "ep": 10.76, "bs": 0.0, "d": 6, "age": 10.04, "grav": 88.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 3, "lu": 0, "w": 46, "qw": 13, "k": 34504, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 6, "meme": 0, "tier": "epistemic_gold", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": ["https://arxiv.org/pdf/2608.28170"], "ig": 0.451, "fa": 2.77, "gp": 1.246, "bl": 0.0, "ds": 0.0, "txt": "> Eventually, it may develop a more complete understanding of what was in the work\n\nSure, there's no doubt we can develop a better understanding of some of what he was talking about.\n\nThis is a long way from reconstructing the actual work itself into anything approximating the original work.\n\nI'd encourage you to read eg https://arxiv.org/pdf/2608.28170 for what is actually feasible in this area."}, {"id": 50668485, "au": "londons_explore", "dom": 289, "sr": 5, "sc": 10.01, "ep": 10.01, "bs": 0.0, "d": 0, "age": 24.3, "grav": 359.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 269, "qw": 0, "k": 40364, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.917, "fa": 1.23, "gp": 1.379, "bl": 0.0, "ds": 0.0, "txt": "I predict that future AI models will eventually \"solve\" history.        Ie. they will be able to list every person alive and exactly what they were doing every day for the past 10,000 years.    Including me, writing this comment, today.\n\nThat will happen because of a bunch of factors coming together:\n\n  * Most people now have huge digital footprints.   The data is there, if not yet organised - and AI is great at organising.\n\n  * Long ago, there weren't many people.  Just a few hundred thousand for most of human history.   That really constrains who might have done what.   If a 1000 year old cathedral stone is slightly wonky, it was probably one of the only 2 stonemasons working on the day and place it was laid.\n\n  * Humans will be found to be far more predictable than expected.   AI will get really good at making these predictions.    The guy who laid the wonky stone was probably the one whose birthday was the previous day and he was a bit hungover...\n\n  * More and more data will be collected.    That 2 terabytes of ultrasonic oil survey data from 2022?   Well it saw buried 50 feet down the other half of the same wonky stone near the now-underwater quarry...\n\n  * Genetic data of enough people lets you reconstruct fairly accurately a family tree going back thousands of years.   Combine that with other data and we can learn that the stonemason probably couldn't handle his drink w"}, {"id": 50671982, "au": "dfxm12", "dom": 186, "sr": 6, "sc": 9.45, "ep": 9.45, "bs": 0.0, "d": 1, "age": 18.75, "grav": 234.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 41, "qw": 0, "k": 10234, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": ["https://www.wired.com/story/wrongful-arrests-ai-derailed-3-mens-lives/"], "ig": 1.051, "fa": 2.08, "gp": 0.728, "bl": 0.0, "ds": 0.0, "txt": "You a word there. If you mean AI, AI is already used in apprehending suspects. It's known to be inaccurate and no one cares (it seems like certain types of people into the system is more important to them than solving crimes).\n\nhttps://www.wired.com/story/wrongful-arrests-ai-derailed-3-m..."}, {"id": 50671586, "au": "uiberto", "dom": 203, "sr": 7, "sc": 9.35, "ep": 9.5, "bs": 0.0, "d": 1, "age": 19.5, "grav": 250.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 107, "qw": 0, "k": 45, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": ["https://substack.com/@generativehistory"], "ig": 1.971, "fa": 1.3, "gp": 0.802, "bl": 0.0, "ds": 0.0, "txt": "From https://substack.com/@generativehistory:\nMark Humphries identifies himself as \"Professor of History at Wilfrid Laurier University\"\n\nFrom article:\n\"The only scholarly reference I could find to his 1808 trip to Canada was in fur trader George Nelson’s journals, published by Harry Duckworth as Friends, Foes, and Furs in 2019. In his journal, Nelson mentioned hearing that a “Count de Chabot” had visited Fort William and so, as editor of the text, Duckworth provided a paragraph of context for readers. Dr. Duckworth has an encyclopedic knowledge of fur trade sources, but neither he nor any of the other experts I’ve shared this finding with have given Chabot much thought, if they’ve even heard of him.\""}, {"id": 50672773, "au": "kregasaurusrex", "dom": 93, "sr": 8, "sc": 8.87, "ep": 8.87, "bs": 0.0, "d": 0, "age": 16.8, "grav": 196.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 104, "qw": 0, "k": 1115, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": ["https://bid.goldcoastauction.com/lots/view/1-9X6GE9/w-newton-1880-cavaliers-playing-chess-oil-on-canvas", "https://chatgpt.com/share/6b09fbf3-63fc-83ea-a0f6-a15a577071a6", "https://fineart.ha.com/itm/paintings/ph-andreis-belgian-19th-century-cavaliers-playing-chess-c-1890oil-on-canvas1575-x-20-inchessigned-lower/a/656-23275.s"], "ig": 1.677, "fa": 0.96, "gp": 1.509, "bl": 0.0, "ds": 0.0, "txt": "Coincidentally I have an oil painting purchased from an auction house [0] a few years ago that I wanted to know more about. While ChatGPT [1] was able to verify the general time period of the late 1800s by correctly identifying the canvas maker's stamp; I had less success with finding more information about the artist or correlating it with other similar works. What spurred me into going into the investigation was that the claimed original piece [2] is from circa 1890 and mine is signed as being from 1882 by an artist I can't find anything else about. A reference to a chess art blog [3] was also made which indicates other paintings exist as well!\n\n[0] https://bid.goldcoastauction.com/lots/view/1-9X6GE9/w-newton...\n\n[1] https://chatgpt.com/share/6b09fbf3-63fc-83ea-a0f6-a15a577071...\n\n[2] https://fineart.ha.com/itm/paintings/ph-andreis-belgian-19th...\n\n[3] https://chessforallages.blogspot.com/2017/01/mystery-paintin..."}, {"id": 50672250, "au": "pcthrowaway", "dom": 217, "sr": 9, "sc": 8.57, "ep": 8.72, "bs": 0.0, "d": 3, "age": 18.16, "grav": 222.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 367, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.876, "fa": 0.95, "gp": 1.106, "bl": 0.0, "ds": 0.0, "txt": "There are probably texts which were lost in the destruction of Alexandria which can be fully rebuilt from other quotes, without needing to use any inference (in the older sense of the word). An example would be its complete inclusion in another book which analyzed the original text. Another example would be several surviving texts which each contain large selections of the original work, such that combining them would recreate the original work.\n\nThis seems like the low-hanging fruit of the challenge. This is \"simply\" a task of LLMs combing all of humanity's archives to pick juicy needles out of haystacks (some of these surviving works may be quite obscure).\n\nNext we have situations where perhaps 50% of a lost text can be reproduced via the above method, and an idea of what the remaining 50% can be obtained through analysis of contemporaneous texts which reference the original (without quoting it, or perhaps by paraphrasing, or giving a nod to), as well as a historical review of the life of the lost text's author (including the point in their life in which they wrote the lost work, and perhaps surviving lost works by them which came after) and their contemporaries.\n\nIn these situations, an approximation of what they might have written can be constructed, which IMO would be quite valuable. Perhaps each section which is filled in by an LLM could have notes containing supporting c"}, {"id": 50672963, "au": "Buttons840", "dom": 211, "sr": 10, "sc": 8.06, "ep": 8.36, "bs": 0.0, "d": 3, "age": 16.36, "grav": 188.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 254, "qw": 0, "k": 14995, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "epistemic_gold", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": ["https://www.amazon.com/dp/B008Y3WQLG"], "ig": 2.066, "fa": 0.62, "gp": 1.197, "bl": 0.0, "ds": 0.0, "txt": "What do you think is the best example of historians using Bayesian statistics to assess historical claims is?\n\nI'm not talking about observations that are based on measurements, like the dating you mentioned. I'm talking about assessing things like whether or not certain stories from history are true (these are cases where there is nothing to measure).\n\nIt's true I am a novice. I found a book about Baysian methods used to assess the historicity of Jesus, but my understanding was that the book arrived at a conclusion opposite the consensus, and thus the book is not really appreciated.\n\nYeah, I just double checked and I was considering buying \"Proving History\" by Carrier[0]. But he concludes Jesus did not exist as a real person, and isn't that the opposite of historical consensus? Maybe I'm confused by the polarized nature of discussions about Jesus?\n\nCut me a little slack here. The most prominent book I found about using Bayesian methods to assess history draws a conclusion that is rejected by the majority consensus, and while considering buying the book I found a lot of historians that mocked the book without ever engaging in anything resembling Bayesian statistics. They just seemed put off by the idea of using math to assess these historical stories, they didn't engage with the math and show how its logic was wrong.\n\nAnd I believe Avierez Tucker's full argument is that Bayesia"}, {"id": 50672267, "au": "zzzeek", "dom": 261, "sr": 11, "sc": 7.72, "ep": 7.72, "bs": 0.0, "d": 0, "age": 18.13, "grav": 222.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 180, "qw": 0, "k": 13015, "kpp": 3.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": ["https://www.404media.co/ai-is-supercharging-the-war-on-libraries-education-and-human-knowledge/"], "ig": 1.954, "fa": 0.62, "gp": 0.936, "bl": 0.0, "ds": 0.0, "txt": "what I note here is that the model needed access to a lot of primary and secondary data sources, a lot of which are the kind you find in library collections.  Real librarians right now (per threads I've read on bluesky...) are in many cases working hard to keep AI strictly out of their libraries, refusing to accept online journals and publications that feature AI chatbots or helpers in their UXes, even as an off-by-default option.  They seek to do this before their users get to even use these tools, lest the users come to prefer them which would prevent their removal (as another librarian lamented their users already preferred some of these AI tools and could no longer be removed).\n\nI found the whole idea a little bit offensive, especially for products that are popular with their own users.\n\nEdit: I'll give myself some counterpoint.  A lot of these AI products being pushed at libraries seem to be garbage [1].  So there's that.\n\n[1] https://www.404media.co/ai-is-supercharging-the-war-on-libra...\n\nnonetheless if I wanted to do some research I'd hope a library would give me API access of some kind that I can use with agents."}, {"id": 50673526, "au": "heaney-555", "dom": 235, "sr": 12, "sc": 7.65, "ep": 7.87, "bs": 0.0, "d": 2, "age": 14.93, "grav": 162.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 45, "qw": 0, "k": 327, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": ["https://spicylemonade.github.io/spatialbench/", "https://x.com/Bayesian0_0/status/2084068805949432188"], "ig": 1.049, "fa": 1.52, "gp": 0.739, "bl": 0.0, "ds": 0.0, "txt": "How do you specifically define this, and what models have you tried for this in what harnesses and on what reasoning setting?\n\nDepending on what benchmark you look at, frontier models in good harnesses have already surpassed humans at this or will do around January 2027.\n\nhttps://spicylemonade.github.io/spatialbench/\n\nhttps://x.com/Bayesian0_0/status/2084068805949432188"}, {"id": 50672642, "au": "hax0ron3", "dom": 195, "sr": 13, "sc": 7.47, "ep": 8.32, "bs": 0.85, "d": 4, "age": 17.16, "grav": 203.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "epistemic_gold", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.802, "fa": 0.9, "gp": 1.047, "bl": 0.32, "ds": 0.0, "txt": "I am not a professional historian. However, I have been interested in history since my early years.\n\nAs I said, 100% certainty is not possible in history. By facts I mean evidence and logical argument that can create a range of probabilities.\n\nNow, one might say \"but a range of probabilities is interpretation\". But I do not believe that the comment you originally quoted meant this kind of interpretation by the word \"interpretation\". Nor, I think, do you mean it that way. You mean something higher level and sweeping.\n\nAnd it is indeed possible to, for example, argue that there is a 95+% chance that Oswald shot JFK, sticking only to evidence such as physical items and witness accounts, and using logical argument, without venturing into any grander historical narratives about meaning, or even about something as relatively higher-level as \"assassinations in general\".\n\nNow to me it clearly seems that this attempt to ascertain fact is the more vital part of history. It is possible to do the ascertaining of fact without doing the higher-level interpretation. It is not possible to do any interpretation that can properly be called history (as opposed to fiction or alternative history) without doing the ascertaining of fact."}, {"id": 50674588, "au": "pcthrowaway", "dom": 223, "sr": 14, "sc": 7.39, "ep": 7.68, "bs": 0.0, "d": 5, "age": 12.33, "grav": 120.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 55, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.711, "fa": 0.76, "gp": 1.03, "bl": 0.0, "ds": 0.0, "txt": "> I don't think this is possible at all, at any point in the future (unless we invent time machines):\n\n> > string those surviving quotations into cohesive approximations of the original works that take into account all that is known of the works, their authors, and known historical figures who read those works and cited influence from them\n\nWe need to put this to the test, as I suggested, with \"easy\" examples where 10% of a text is missing (every 10th page, perhaps), the text is not in the LLM's training data, and the LLM is prevented from accessing the missing text via other research (but it can access published discourse about the text, other writings by the same author and other writers who were influenced by the text, and the historical context around the author's writing)\n\nI think part of this would involve some post-training of a model to somehow prefer the writing style of the author, and intuit generally what might have been in each missing portion.\n\nOf course the LLM won't be correct about all of it, and won't recreate the missing pages verbatim.\n\nBut I'd wager with the current capabilities we'd be capable of recreating the gist of most missing pages, in a style that convincingly matches the author's"}, {"id": 50671023, "au": "suddenlybananas", "dom": 194, "sr": 15, "sc": 7.2, "ep": 7.35, "bs": 0.0, "d": 3, "age": 20.48, "grav": 271.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 145, "qw": 35, "k": 1539, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.506, "fa": 0.92, "gp": 0.819, "bl": 0.0, "ds": 0.0, "txt": "Are you a historian or do you have any training in history? I really do think interpretation is necessary. We simply cannot know exactly what happened and have to balance the probabilities and adjudicate as best we can. Even Herodotus made a big deal of pointing out this uncertainty and described multiple points of views and multiple stories as there was no way to have any certainty.\n\n>One can see this by asking oneself: what would do more damage to history as a field, the removal of all historical fact from the field, or the removal of all historical interpretation from the field?\n\nI don't think this is a coherent comparison. There is no fact independent of interpretation. What you describe at the end is largely the process of interpretation although there's more to it than just that. For example, if you look at something like the longue durée approach of the annals school, its unclear that this kind of interpretation can be subsumed by just a collection of brute facts. The historian's job isn't to list everything that ever happened but to make sense of it."}, {"id": 50674704, "au": "pcthrowaway", "dom": 219, "sr": 16, "sc": 7.07, "ep": 9.42, "bs": 1.7, "d": 5, "age": 11.97, "grav": 115.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 230, "qw": 0, "k": 6944, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "epistemic_gold", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": ["https://news.ycombinator.com/item?id=39261861"], "ig": 1.797, "fa": 1.24, "gp": 1.15, "bl": 0.64, "ds": 0.0, "txt": "You're giving one of the more difficult cases, but here's how I suspect an LLM could meaningfully contribute\n\nTake the portion covering 292–287 BC (the first missing book of his works, which we do have some fragments of).\n\nIf an LLM can figure out the following from surviving writings:\n\n- When this book was published\n\n- What sources Livy was using as references\n\n- Which authors with surviving writings are known to have read Livy's writings, and what events from that  period they talk about\n\nThen perhaps it can comb through other surviving writing from writers in the 0-250 CE era who had access to Livy's work, and find even more sections referencing the missing work, which historians did not yet connect to that work (perhaps there are archives of surviving writings from that era which are digitized but not yet transcribed or translated due to being considered to have limited historical value). I'm also reminded of this story from early 2024 when an unreadable scroll was read with new digital forensics techniques for the first time: https://news.ycombinator.com/item?id=39261861\n\nEventually, it may develop a more complete understanding of what was in the work, which is defensible with references to other surviving (or recovered) works.\n\nFrom there, perhaps it can recreate approximations of sections of the work. Maybe not the entire book in full right now. But parts of it with reas"}, {"id": 50672148, "au": "sakopov", "dom": 190, "sr": 17, "sc": 6.76, "ep": 6.98, "bs": 0.0, "d": 2, "age": 18.37, "grav": 227.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 4029, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.72, "fa": 0.56, "gp": 0.928, "bl": 0.0, "ds": 0.0, "txt": "Just looking for additional context and clues that would help create a timeline for all of these documents. For example, one of the clues that this particular video talks about is a picture of a shelf in one of Epstein's properties with labeled binders. These binders turned out to be the actual physical sources of scanned documents in the \"Epstein files\" dataset and the labels on them allowed the researcher to connect the scanned images, which are otherwise fragmented and scattered, to physical evidence and apply additional context to what they could possibly mean or be related to."}, {"id": 50670857, "au": "w10-1", "dom": 197, "sr": 18, "sc": 6.69, "ep": 7.42, "bs": 0.0, "d": 1, "age": 20.79, "grav": 277.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 148, "qw": 9, "k": 3779, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 2.114, "fa": 0.42, "gp": 0.868, "bl": 0.0, "ds": 0.0, "txt": "> collecting a huge pile of data with a good enough index\n\nAn index would be more helpful and usable.  (indeed, reading this I was struck that history doesn't have a common index of name+place+time)\n\nInstead AI is a service providing access to knowledge, but you'll never know about missing or hidden information because it's not normalized.\n\nAI gets outsized investment precisely because by taking over the goal-chasing steps and restricting information access, it prevents customers from using substitute access to information, and also reduces investments in goal-chasing technologies, making customers more dependent (conversely: competing effectively with alternative information-storing and goal-chasing technologies).  Worse, it cross-subsidizes domains, so gains from e.g., business, ads, and programming can be used to dominate markets for media and other information services.\n\nWe lose agency to AI not because it's smarter or in control, but because it removes the incentives required to fund and motivate human intelligence.\n\nAnd yes, I'm an active user who is also long AI."}, {"id": 50673072, "au": "majormajor", "dom": 4, "sr": 19, "sc": 6.65, "ep": 6.65, "bs": 0.0, "d": 3, "age": 16.11, "grav": 183.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 18290, "kpp": 3.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 2.046, "fa": 0.34, "gp": 0.605, "bl": 0.0, "ds": 0.0, "txt": "I would say persistence + knowledgebase is the hallmark of almost everything that these tools are having great success on, not something unique to this particular task?\n\nDomain experts will tell you all day about how they can nitpick claude or codex's first attempt at a task, or how it didn't create a particular novel \"leap\" of an idea.\n\nBut those same domain experts aren't spending thousands of cumulative hours w/o frustration splitting out parallel copies of themselves to chew through everything. And if those experts hadn't already deeply studied a particular body of research on a problem, it would take them longer to ingest it.\n\nBrute force search of applications of a broad catalog of expertise + quick verification tasks is the sweet spot for \"agentic\" tasks today.\n\n(Or, of course, the sort of \"summarize these emails\" corporate middle-management paper-pushing where 100% verification has never been done, which is even easier to automate away than coding or math research.)"}, {"id": 50672915, "au": "_bent", "dom": 96, "sr": 20, "sc": 6.5, "ep": 6.5, "bs": 0.0, "d": 0, "age": 16.46, "grav": 190.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 204, "qw": 0, "k": 425, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.704, "fa": 0.0, "gp": 1.722, "bl": 0.0, "ds": 0.0, "txt": "The author discounts that the model may have already known parts of the solution.\n\nSome of the documents it cites have probably been used in pre-training and I could imagine that it already had internally clustered Chabot next to the Canadian fur trade in the early 19th century.\n\nBecause of the post training it then of course tried to structure the task like a human historian and read through documents and followed citations, but could it not be that this search was guided by this knowledge? And that the specific documents and citations it looked up where ones where it already had a 'hunch' that they would contain puzzle pieces?\n\n-------\nedit bc commenters misunderstood my point or haven't read the article:\n\nThe author tried to rationalize how the model found the solution and is surprised by the leaps it made during research and which sources it chose to interrogate. The author attributes this to an LLMs super human persistance and (implicitly) brute force search over all citations and documents.\n\nWhile this is not wrong, I wanted to point out that an LLM does not have to work like a human research on this, because the answer may already be embedded in itself and the right prompt can surface it."}, {"id": 50670498, "au": "Lerc", "dom": 245, "sr": 21, "sc": 6.45, "ep": 7.11, "bs": 0.0, "d": 0, "age": 21.41, "grav": 291.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 275, "qw": 0, "k": 7520, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.782, "fa": 0.5, "gp": 1.032, "bl": 0.0, "ds": 0.0, "txt": "I have been telling people for some time that I expected models to eventually have the ability to point them at a news story and ask what elements of this story can be verified, and for the parts that seem to be fabricated, what was the origin point of the false information.\n\nThis is one of the sorts of things that I suggest as a possibility and get people looking at me like I have two heads.\n\nThis is exactly the sort of analysis I was imagining,  the difficulty is not in the complexity, but the sheer amount of things to consider.  This is something these models seem to excel at.\n\nI'd like to see an AI driven news service one day that used this ability to provide a service that doesn't declare itself to be reliable, but gains that reputation by avoiding any instances where it misrepresents the truth, and when others do, it can highlight where the inaccuracies were introduced.\n\nAny pro AI billionaires (I hear they exist) should fund a non-profit to do this.\n\nI wasn't expecting this to be something quite this soon.   I guess it still depends on the amount of work per story it needs to do.  I would think it should maintain stories as a live document showing the most up to date information with a revision history.  Essentially what Wikipedia does.\n\nI suspect there would still be a hurdle to overcome where a lot of AI models treat a news story covered by others as the gospel truth. "}, {"id": 50672636, "au": "torben-friis", "dom": 2, "sr": 22, "sc": 6.37, "ep": 6.95, "bs": 0.0, "d": 1, "age": 17.17, "grav": 203.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 154, "qw": 0, "k": 12192, "kpp": 6.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 2.105, "fa": 0.0, "gp": 1.386, "bl": 0.0, "ds": 0.0, "txt": "AI will intuitively become super useful in many areas beyond math, without that implying universal advances.\n\nThere's probably a lot of low hanging fruit out there where the current total knowledge of humanity more than suffices to solve a problem but experts aren't connecting. Say, a local species that is unknown to biologists but present in local records, or a historical mystery that is explained by material science.\n\nConsider, however, that to improve a drug you need to observe 10-year survival rates. The machine can hardly wait those ten years any quicker than we do. They can't operate in physical space yet either, so if your historical problem requires excavating a site rather than exploring digitized records AI is toast there as well. Experimental sciences seem to be the last to survive, then.\n\nI'm starting to see the pattern that pure intellectual work will be gradually commoditized, and physical labor is where value will exist. Which is quite a flip, a scary one."}, {"id": 50670646, "au": "BobbyTables2", "dom": 155, "sr": 23, "sc": 6.19, "ep": 6.41, "bs": 0.0, "d": 2, "age": 21.17, "grav": 286.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 2660, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.573, "fa": 0.56, "gp": 0.77, "bl": 0.0, "ds": 0.0, "txt": "What’s weird though is \n specialized training and knowledge used to be economically highly valued due to scarcity.\n\nIn some sense, AI makes such less scarce.\n\nWhat will the future value?\n\nSkilled prompt engineers - seems unlikely, we don’t value bus drivers all that much even if they do transport a lot of people at once.\n\nIn 100 years, wonder if something like a handmade pencil maker will be more highly valued than a book author."}, {"id": 50675170, "au": "xp84", "dom": 88, "sr": 24, "sc": 6.05, "ep": 6.85, "bs": 0.0, "d": 3, "age": 10.35, "grav": 92.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 155, "qw": 0, "k": 10133, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.33, "fa": 0.95, "gp": 0.704, "bl": 0.0, "ds": 0.0, "txt": "Oh please. That second story (citing yahoo) is 100% a bit. There are TikTok people who make these for views. The “trolling the AI job interviewer” is also a skit and not a documentary.\n\nAnd as for medical advice, idk what to tell you, people aren’t ever gonna pay $150 to see the doctor every time they have a question. Without AI they’d just do whatever they think is probably best. In 99% of the scenarios it gives basically responsible advice. One person died. Plenty of people would die from not following medical advice but didn’t die because AI told them NOT to go off their meds.\n\nAnd lawyers foolishly passing off AI as their own work in court, which is basically cheating and fraud against their clients, doesn’t mean that laypeople don’t benefit from getting legal tips that are 1000% higher quality than just taking the word of some guy on Reddit which was previously the only thing they would have done."}, {"id": 50668754, "au": "abixb", "dom": 149, "sr": 25, "sc": 5.75, "ep": 6.78, "bs": 0.0, "d": 1, "age": 23.89, "grav": 349.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 122, "qw": 0, "k": 4406, "kpp": 7.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.897, "fa": 0.0, "gp": 1.603, "bl": 0.0, "ds": 0.0, "txt": "Correct. And this is what I don't understand wrt AI skeptics. AI systems have vastly more encoded knowledge than at least a billion humans already.\n\nIf you assume that the probability to a good outcome and a good future for humanity is running search trees (in a broad sense, which is what models do everytime during inference) for specific problems, then there's a good chance that solutions to problems we face exists in some teeny tiny search tree that we haven't explored (either in currently deployed models or in a future model).\n\nSo, yes. Human civilizational progress has always been about combining knowledge (abstract and tacit) from different fields and putting them together is experimentals ways to see what sticks. We're doing that at an industrial scale, now."}, {"id": 50671470, "au": "artico_chewy", "dom": 202, "sr": 26, "sc": 5.52, "ep": 6.84, "bs": 0.0, "d": 0, "age": 19.75, "grav": 255.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 102, "qw": 0, "k": 6, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.735, "fa": 0.28, "gp": 1.357, "bl": 0.0, "ds": 0.0, "txt": "I... notice the distinct lack of historian in the loop here?\n\nI'm a believer/doomer in AI capability and I don't believe in admitting weak evidence in the quest to persuade others of this.\n\nThis work suggests that AI has recall in historical investigations. It can find stuff historians miss. It doesn't have anything like a LEAN engine on this.\n\nConstructing historical theories is pretty hard and I really just have to trust the provenance of stuff I read in the end. It's not science that can be fully verified from expert to layperson. This is the setting when AI performs worse because forgeries of good ideas are cheap."}, {"id": 50675080, "au": "ElProlactin", "dom": 62, "sr": 27, "sc": 5.37, "ep": 6.1, "bs": 0.0, "d": 5, "age": 10.74, "grav": 97.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 246, "qw": 37, "k": 2183, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.609, "fa": 0.42, "gp": 0.773, "bl": 0.0, "ds": 0.0, "txt": "> The human brain is capable of significantly more than \"compute faster than a chicken.\"\n\nThis is a good example of reductio ad absurdum.\n\nIf \"it's just more computation\" can be used to dismiss AI achievements, the same logic can be used to dismiss human achievements next to animals.\n\nHuman and chicken brains are both made of neurons doing electrochemical signaling. The major difference is scale. Humans have ~86 billion neurons versus a few hundred million in a chicken, with some differences in how they're organized.\n\nSo if more and better-organized computation can produce the gap between Mozart and the creature you ate for dinner last night, why would you assume it can't produce anything interesting or meaningful in a machine? \"It's just compute\" doesn't rule much out.\n\n> There's not much \"compute\" required to paint a picture, but a chicken doesn't even understand what a painting is.\n\nThis is pretty backwards. Painting requires vision, motor control, memory and a model of what the viewer will see. That's an incredible amount of neural computation. It just doesn't feel like we're calculating when we paint because we do it without effort.\n\nWe are pretty bad at fast arithmetic and great at this kind of thing and that's why treating \"computation\" as merely \"doing sums quickly\" is flawed.\n\nAs for the chicken not understanding what a painting is, again, you can't dismiss AI's accomp"}, {"id": 50669116, "au": "edot", "dom": 279, "sr": 28, "sc": 5.26, "ep": 5.41, "bs": 0.0, "d": 2, "age": 23.35, "grav": 336.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 149, "qw": 0, "k": 1658, "kpp": 5.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.77, "fa": 0.0, "gp": 0.859, "bl": 0.0, "ds": 0.0, "txt": "Well yeah, I’d say there are two classes of infinite opportunities to solve problems: fully exploring everything that is physically possible to do, and fully exploring everything that is socially possible to do.\n\nThere are limitless inventions in what is physically possible. Suppose we invent a warp drive or wormhole maker. Can we make it cheaper? Safer? Can we improve its capacity? Stuff like that. And even once we perfect those, is there a tractable way to reverse star death or something? I mean these sound nuts but what I’m saying is there is always something to work on.\n\nAnd the social issues, or rather ones that require human cooperation, are also limitless in that our minds and culture can change infinitely. Even if we solve world hunger one year, maybe the solution causes an issue that needs solved the next year or in certain places.\n\nThere will always be things to work on."}, {"id": 50673535, "au": "heaney-555", "dom": 187, "sr": 29, "sc": 5.21, "ep": 6.46, "bs": 0.0, "d": 2, "age": 14.91, "grav": 162.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 327, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.214, "fa": 0.95, "gp": 0.622, "bl": 0.0, "ds": 0.0, "txt": "The article you posted is from 2022, four years ago.\n\nThe primitive models of 2022 have effectively zero relevance to frontier AI capabilities in 2026. You might as well be linking an article about the DC-3 in a discussion about modern passenger airliners."}, {"id": 50673155, "au": "fyredge", "dom": 21, "sr": 30, "sc": 5.08, "ep": 5.96, "bs": 0.0, "d": 0, "age": 15.91, "grav": 180.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 32, "k": 250, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.251, "fa": 0.42, "gp": 1.259, "bl": 0.0, "ds": 0.0, "txt": "> Unless one wanted to make identifying the author of the sketchbook their life’s work, it is exceedingly improbable that anyone would have identified Chabot as its creator, without a healthy dose of serendipity.\n\nTherein lies my skepticism. In the same way LLMs have been used for mathematical theorems, the way LLMs are used to search for this unknown figure is to pit it against a wide lexicon of sources established by humans. It is useful, but still not a replacement of human expertise.\n\nI am heartened by the pushback in the comments under the article itself."}, {"id": 50672111, "au": "chasil", "dom": 206, "sr": 31, "sc": 5.07, "ep": 6.17, "bs": 0.0, "d": 2, "age": 18.46, "grav": 228.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 83, "qw": 0, "k": 8598, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.9, "fa": 0.28, "gp": 0.627, "bl": 0.0, "ds": 0.0, "txt": "From the article:\n\n“Its critical find was the diary of Joseph Frobisher, a retired fur trader who kept a daily journal of his social engagements in Montreal.”\n\nBoth Astra and Fable used this social diary of Montreal to find candidates and carefully track their activities from available sources. This diary would be obscure in the extreme, according to the author.\n\nFrom there, a travel diary was found with sketch descriptions with exactly matching dates.\n\nThe travel diary author was Louis-Guy-Charles-Guillaume de Rohan-Chabot, vicomte de Chabot (1780–1875)."}, {"id": 50669653, "au": "ArmadilloGang", "dom": 153, "sr": 32, "sc": 4.86, "ep": 5.81, "bs": 0.0, "d": 2, "age": 22.58, "grav": 318.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 45, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 2.014, "fa": 0.0, "gp": 0.743, "bl": 0.0, "ds": 0.0, "txt": "This is what I find fascinating about Vince Gilligan’s Pluribus, a new series that has aired one season. Every human gains the ability to communicate telepathically with all other humans, creating a single hive mind composed of all human knowledge. Any thought or action performed by any single human brain is known to every other human brain.\n\nThe people affected by this ability lose their individuality, but this unified consciousness is able to immediately coordinate a common goal across the entire planet in the speed of a single thought.\n\nAn example: Climate change? They simply consolidate human populations and shut off power to abandoned cities, immediately eliminating much of the global fossil fuel usage."}, {"id": 50674246, "au": "lossyalgo", "dom": 81, "sr": 33, "sc": 4.71, "ep": 5.42, "bs": 0.27, "d": 6, "age": 13.14, "grav": 133.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 292, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.474, "fa": 0.34, "gp": 0.681, "bl": 0.1, "ds": 0.0, "txt": "Since when is expecting established academic validation moving the goalposts? I've revised my position somewhat, thanks in part to the link posted elsewhere, and I'm not disputing the significance of a formally verified proof, I am simply distinguishing between formal verification and full acceptance by the mathematical community. The Clay Mathematics Institute requires publication, a two-year waiting period and general acceptance before awarding the $1M prize. Those standards existed long before LLMs."}, {"id": 50674566, "au": "nl", "dom": 218, "sr": 34, "sc": 4.71, "ep": 6.88, "bs": 0.85, "d": 4, "age": 12.4, "grav": 121.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 40, "k": 34504, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "grounded_analysis", "facet": "works_chatbot", "flbl": "Works & Chatbot (Else)", "urls": [], "ig": 1.43, "fa": 0.76, "gp": 0.933, "bl": 0.32, "ds": 0.0, "txt": ">  An example would be its complete inclusion in another book which analyzed the original text. Another example would be several surviving texts which each contain large selections of the original work, such that combining them would recreate the original work.\n\nThis is what is currently called \"hallucination\".\n\nYes, it can stitch the existing parts together, and provide reasonable summaries of parts that are described by other works.\n\nBut take Livy's Ab Urbe Condita: 35 out of the 142 books survive today. We have a rough idea what the others cover in terms of dates of nothing else (it is a history) but there are entire decades where we have no references to what he said.\n\nIn some cases there are major events that we can guess he might have written about, but it's a guess! There is just no way to know, and no LLM can fill in something that doesn't exist."}, {"id": 50670345, "au": "flowerlad", "dom": 281, "sr": 35, "sc": 4.7, "ep": 6.09, "bs": 0.0, "d": 2, "age": 21.65, "grav": 297.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 118, "qw": 0, "k": 4273, "kpp": 4.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 2.031, "fa": 0.0, "gp": 0.912, "bl": 0.0, "ds": 0.0, "txt": "Yes, but if you're talking about shifting billions of dollars currently spent on payroll to AI (Anthopic's TAM), you’re talking about doing existing work, not exploring new frontiers.\n\nEven if AI enables exploration of new frontiers it doesn't mean AI vendors will be able to capture economic value from it. The more powerful, cheap, interchangeable, and accessible AI becomes, the less economic value any individual AI provider might be able to capture.\n\nConsider electricity. Electricity is extraordinarily valuable. Modern civilization would be impossible without it. Yet electricity producers generally cannot charge arbitrary prices because electricity is widely available, competing suppliers exist, and prices are constrained by regulation and infrastructure economics. The same could happen with AI."}, {"id": 50668361, "au": "seeknotfind", "dom": 140, "sr": 36, "sc": 4.68, "ep": 5.78, "bs": 0.0, "d": 0, "age": 24.5, "grav": 364.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 104, "qw": 0, "k": 833, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.617, "fa": 0.0, "gp": 1.368, "bl": 0.0, "ds": 0.0, "txt": "Yeah, yesterday, I was trying to research chemicals that could be causing a severe allergic reaction in someone I know. Astra found a French research paper that blinded air fresheners, labeled them by number, and gave readings of chemicals found in the air after a specific amount of time. I was going to email the authors in order to try to find the underlying chemicals, but then I asked Astra if it could find them. It ended up sorting popular air fresheners by their public ingredients and matching these to the ingredients listed in the paper. I would have never taken the time to figure that out, especially because I don't speak French."}, {"id": 50672979, "au": "AbsurdCensor", "dom": 11, "sr": 37, "sc": 4.66, "ep": 4.96, "bs": 0.0, "d": 2, "age": 16.32, "grav": 187.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 116, "qw": 0, "k": 179, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": [], "ig": 1.452, "fa": 0.34, "gp": 0.396, "bl": 0.0, "ds": 0.0, "txt": "I think that's only partially the truth. In medicine as so much in science it's the ability to synthesize from all the data available, which is difficult for individual humans to do. If 100, 1000, 10000 people are using all the knowledge and trying to solve something, would a computer or say an LLM that has access to every possible person's information, they likely will solve it that much quicker, if not instantly. That is something that happens across the board. Humans are great at being inventive, computers are great at compiling information, and humans are even better at finding patterns in the noise. Teach computers to find answers in the noise, and you'll solve massive problems that much quicker."}, {"id": 50671984, "au": "Buttons840", "dom": 209, "sr": 38, "sc": 4.53, "ep": 6.08, "bs": 0.0, "d": 1, "age": 18.74, "grav": 234.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 133, "qw": 0, "k": 14995, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.682, "fa": 0.22, "gp": 1.032, "bl": 0.0, "ds": 0.0, "txt": "Yes, history is the realm of probabilities moreso than most historians have been willing to admit. Most historians try to present a story of what definitely happened.\n\nUsing something like Baysian statistics in history seems useful to me, but the few people I've found who try are considered quacks.\n\nWe cannot know if Baysian statistics are applied correctly to reality, but they can help us recognize when certain views about history are logically inconsistent--unlikely by their own admission.\n\nBeing open to uncertainty in history is difficult though, because it opens the door to even more conspiracy theories. Even now you might be wondering if I'm a holocaust denier or something (I'm not).\n\nI do find some history conspiracy theories interesting, even though almost all historians say it's settled. I don't want to get into the details here though."}, {"id": 50670397, "au": "hax0ron3", "dom": 193, "sr": 39, "sc": 4.46, "ep": 6.0, "bs": 0.0, "d": 2, "age": 21.57, "grav": 295.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 679, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.436, "fa": 0.62, "gp": 0.591, "bl": 0.0, "ds": 0.0, "txt": "I disagree with that comment, if I'm understanding correctly. The first and most important part of historians' work is to establish historical fact, not to interpret that fact. Interpretation is important too, but fact is primary.\n\nOne can see this by asking oneself: what would do more damage to history as a field, the removal of all historical fact from the field, or the removal of all historical interpretation from the field?\n\n100% certainty is not possible in history, so I should be clear that by \"fact\" I mean a set of probabilities together with the evidence and logic used to arrive at them."}, {"id": 50668942, "au": "jillesvangurp", "dom": 150, "sr": 40, "sc": 4.45, "ep": 5.99, "bs": 0.0, "d": 2, "age": 23.59, "grav": 342.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 201, "qw": 0, "k": 21976, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.783, "fa": 0.0, "gp": 1.243, "bl": 0.0, "ds": 0.0, "txt": "Knowledge plus reasoning quickly moves us beyond what a single human could know and accomplish. Most people using AI so far mainly apply it in what they already understand and only really ask the harder questions for things that they understand well enough to even be able to ask those questions. LLMs are extremely good at lateral thinking, connecting seemingly disconnected things, to produce interesting new information.\n\nAIs coming up with their own questions, hypotheses, and then testing those systematically is the next leap forward. Most AI usage is reactive currently and not pro-active.\n\nThe article highlights that as part of the reasoning chain, the AI actually made some connections that are interesting to historians by themselves and raise new questions. Good science is as much about finding these new interesting things to explore as it is about resolving problems. What this shows is that the AI actually does this but just omits to tell us or follow through on them. It seems that better harnesses and prompting might remedy that.\n\nDouglas Adams got it right in the The Hitchhiker’s Guide to the Galaxy when he suggested that figuring out the question is more interesting and harder than producing the answer of 42."}, {"id": 50677222, "au": "yubblegum", "dom": 57, "sr": 41, "sc": 4.39, "ep": 5.71, "bs": 0.0, "d": 5, "age": 3.38, "grav": 20.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 294, "qw": 0, "k": 1106, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 2.017, "fa": 0.0, "gp": 0.67, "bl": 0.0, "ds": 0.0, "txt": "That may be, but I am not that type of engineer. My brain groked latent spaces right from the start and is really quite fascinated with dynamic manifolds in the latent space that the transformer mechanism traverses, specially in the uncanny semantic relations afforded by latent space manifolds between distinct domains.\n\nHowever this very same brain is rather convinced that we Humans have embedded quite a lot of our knowledge and our way of thinking in language and all the communications we have have with each other about all sorts of topics.\n\nAre LLMs merely stochastic parrots? I think the term has embedded negative connotations that simplify (dumb down ..) the nuances by using two loaded words in this context: stochastic to attribute 'poor grasp' of the mechanism thereby reducing it to a mere random chooser, and parrot as in 'merely repeats what it has been told'. Well no, it's much more subtle and nuanced than that, but, there is no room for denying that it is in certain senses a mechanism that relies on statistical foundation: the latent space. Except this space embeds 'contextually colocal semantic affines'. So, no, I ain't dumb.\n\nAre LLMs capable of boot-strapping themselves from day zero to solving epic intellectual puzzles? TBD. This is implicity challenged in my OP above.\n\nWould a (team of) genetically altered Human(s) that lived a very long life and had access to the s"}, {"id": 50676478, "au": "dstu", "dom": 234, "sr": 42, "sc": 4.31, "ep": 5.56, "bs": 0.0, "d": 3, "age": 5.58, "grav": 38.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 96, "kpp": 4.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.628, "fa": 0.28, "gp": 0.644, "bl": 0.0, "ds": 0.0, "txt": "Surely AGI should be a separate goalpost to generalised physical abilities? To use a blunt example, plenty of humans are physically incapable of using hand tools, yet we wouldn’t suggest that has any bearing on their intelligence.\n\nIn my book AGI is legitimately achievable in a purely digital context, and this is the likely precedent to physical general intelligence in the following years."}, {"id": 50672104, "au": "varenc", "dom": 265, "sr": 43, "sc": 4.21, "ep": 5.31, "bs": 0.0, "d": 1, "age": 18.47, "grav": 229.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 0, "k": 7667, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.352, "fa": 0.34, "gp": 0.804, "bl": 0.0, "ds": 0.0, "txt": "In 2009, I totally believe it would have been possible for modern AI to identify Satoshi. Since then there's been bit rot of primary sources and a total flood of bogus information on the internet, obscuring the truly useful details."}, {"id": 50671484, "au": "neilk", "dom": 301, "sr": 44, "sc": 4.13, "ep": 5.38, "bs": 0.0, "d": 1, "age": 19.74, "grav": 255.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 168, "qw": 0, "k": 13639, "kpp": 5.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.822, "fa": 0.0, "gp": 0.758, "bl": 0.0, "ds": 0.0, "txt": "We still don't understand everything that happened at the exact moment that JFK was assassinated. This is probably the most studied and documented minute of history. Half a century of highly motivated investigators have clarified some things and made others more confusing. I would be surprised if an LLM could definitely clear it all up.\n\nAnd yes, there is disinformation to sort through - but that will be true of all periods of history. Can LLMs always detect falsified documents? Or a set of documents falsified to corroborate each other? Can that be distinguished from the normal deviations from procedure and random mistakes made over time?\n\nBut hey, if you have access to unlimited Claude credits, feel free to take a run at this and prove me wrong.\n\nPS: But... it might be possible to use an LLM to organize historical research like never before. Imagine if you had an LLM with the doggedness of Robert Caro, directing a swarm of interns to pull documents and interview people, updating a model of events through time."}, {"id": 50672797, "au": "neeraga", "dom": 107, "sr": 45, "sc": 4.04, "ep": 4.04, "bs": 0.0, "d": 0, "age": 16.74, "grav": 195.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 22, "qw": 0, "k": 18, "kpp": 0.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": ["https://en.wikipedia.org/wiki/Indus_script"], "ig": 1.037, "fa": 0.0, "gp": 1.103, "bl": 0.0, "ds": 0.0, "txt": "When will GPT solve the undeciphered language of the Harappan civilization Indus script. It will be an amazing feat if it's deciphered.\nhttps://en.wikipedia.org/wiki/Indus_script"}, {"id": 50668652, "au": "sorokod", "dom": 290, "sr": 46, "sc": 3.98, "ep": 5.37, "bs": 0.0, "d": 1, "age": 24.05, "grav": 353.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 191, "qw": 21, "k": 5321, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.035, "fa": 0.7, "gp": 0.65, "bl": 0.0, "ds": 0.0, "txt": "> \"they will be able to list every person alive and exactly what they were doing every day for the past 10,000 years\"\n\nThis is usually referred to as \"Annals\": \"A relation of events in chronological order, each event being recorded under the year in which it happened\"\n\nHistory is a bit different, for example:\n\n“Given this glimpse of the complications of the problem, the non-specialist reader would be well advised not to worry about it, because the names of coins and currency mean nothing anyway except in terms of purchasing power. From time to time, in mention of the pay of men-at-arms, the wages of laborers, the price of a horse or a plow, the living expenses of a bourgeois family, the amounts of hearth taxes and sales taxes, I have tried to relate monetary figures to actual values. I have not attempted to translate various currencies into the equivalent of only one, such as livres or francs, because equivalency kept changing as did the gold or silver content of the coinage; moreover, real coins and money of account under the same name differed in value. I have, therefore, in each case, simply adopted the currency named by the document or chronicler, and would urge the reader simply to think of any given amount as so many pieces of money.\""}, {"id": 50670270, "au": "latentsea", "dom": 160, "sr": 47, "sc": 3.97, "ep": 5.51, "bs": 0.0, "d": 2, "age": 21.76, "grav": 299.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 87, "qw": 62, "k": 1166, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.497, "fa": 0.42, "gp": 0.551, "bl": 0.0, "ds": 0.0, "txt": ">If you assume that the probability to a good outcome and a good future for humanity is running search trees (in a broad sense, which is what models do everytime during inference) for specific problems, then there's a good chance that solutions to problems we face exists in some teeny tiny search tree that we haven't explored (either in currently deployed models or in a future model).\n\nI think this is a shitty, naive strategy, but yesterday I was thinking you could probably bruteforce almost all of this with even just using a dictionary of some sort (could be random words, could be branches of science, you get the idea) and just getting agents to explore if there are previously unidentified connections. Kinda obvious and I'm sure there's far, far better search strategies, but even naive ones seem like if you just threw enough money at them they'd work at this point to find at least some novel things."}, {"id": 50672494, "au": "tennysont", "dom": 275, "sr": 48, "sc": 3.9, "ep": 5.15, "bs": 0.0, "d": 1, "age": 17.58, "grav": 211.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 150, "qw": 0, "k": 266, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.911, "fa": 0.0, "gp": 0.454, "bl": 0.0, "ds": 0.0, "txt": "What if you don't know who Satoshi is for the same reason most Americans didn't realize their president was in a wheelchair---because those smart enough to discover the answer are happy to keep the secret or muddy the waters.\n\nSurely smart people have tried to uncover Satoshi's identity, but go looking for the answer and you'll find a lot of low quality investigation write-ups.\n\nYou assume that your personal difficulty in finding an answer (combined with your ease in finding other confused people) is due to humanity lacking intelligence, rather than a failure of your own epistemic environment. Perhaps you are used to technical fields where a truthful reputation is prioritized and there is little incentive to muddy the waters.\n\nDisclaimer: technically, I am not claiming that Satoshi's identity is knowable, just that it could be, and still inaccessible due to a poor epistemic environment. I'm certainly not claiming that everyone knows it's Adam Back ;)"}, {"id": 50674467, "au": "ElProlactin", "dom": 6, "sr": 49, "sc": 3.86, "ep": 5.4, "bs": 0.0, "d": 2, "age": 12.63, "grav": 125.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 80, "qw": 8, "k": 2183, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 0.725, "fa": 1.1, "gp": 0.387, "bl": 0.0, "ds": 0.0, "txt": "> ...and physical labor is where value will exist.\n\nPutting robotics aside, who is going to pay for the physical labor in societies where most of the wealth has been created by mental/intellectual labor?\n\nPlumbers, electricians, mechanics, etc. might make 6 figures in the US but you should look at what those jobs pay in most of the world. I'll give you a hint: it's peanuts.\n\nYou can only charge $300/hour to fix a clogged toilet at 9 pm if the person whose toilet is clogged can afford to pay you $300/hour."}, {"id": 50671205, "au": "Twiin", "dom": 1, "sr": 50, "sc": 3.72, "ep": 5.26, "bs": 0.0, "d": 0, "age": 20.2, "grav": 265.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 34, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.305, "fa": 0.34, "gp": 0.843, "bl": 0.0, "ds": 0.0, "txt": "I used Opus 5.5 a couple months ago to decipher a number of German army messages from 1941 that had not previously been broken, and it had a lot in common with this. The model had great intuition about what to look for, where to look for it, what archives would be relevant, and made logical jumps that were extremely savvy."}, {"id": 50669758, "au": "bonoboTP", "dom": 293, "sr": 51, "sc": 3.64, "ep": 5.18, "bs": 0.0, "d": 1, "age": 22.46, "grav": 315.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 112, "qw": 0, "k": 9206, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.366, "fa": 0.34, "gp": 0.69, "bl": 0.0, "ds": 0.0, "txt": "Due to randomness in meiosis, you won't be able to reconstruct a crisp family tree of individuals to thousands of years. In fact, if you take a random ancestor at generation 9 or 10, the most likely case is that this ancestor shares zero genetic material with you. It's paradoxical but true. You only get your genes from a subset of your ancestors due to the discrete nature of genes and random recombination.\n\nI also find other parts quite naive in the post, like celebrating birthdays as an example, when most people didn't even keep track of exact year they were born, and some stonemason who traveled to a lodge to build a cathedral most likely didn't throw birthday parties."}, {"id": 50672160, "au": "heavensteeth", "dom": 273, "sr": 52, "sc": 3.64, "ep": 5.03, "bs": 0.0, "d": 1, "age": 18.34, "grav": 226.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 67, "qw": 0, "k": 422, "kpp": 3.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.701, "fa": 0.0, "gp": 0.712, "bl": 0.0, "ds": 0.0, "txt": "You'd think - particularly with such a target on his back. From the little I've heard, he almost seemed a little sloppy; he chose a Japanese name as an alias, presumably to throw people off, but went on to post exclusively in UTC±0 using a slew of British idioms.\n\nMaybe both acts were equally calculated misdirection, or maybe it's dumb luck he's still anonymous. Either way, I'm sure it rarely leaves his conscience.."}, {"id": 50673447, "au": "heaney-555", "dom": 92, "sr": 53, "sc": 3.62, "ep": 6.27, "bs": 1.99, "d": 2, "age": 15.15, "grav": 166.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 34, "qw": 7, "k": 327, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "solve_riemann", "flbl": "Solve & Riemann (Gpt)", "urls": ["https://www.anthropic.com/research/riemann-zeta"], "ig": 1.062, "fa": 1.04, "gp": 0.559, "bl": 0.75, "ds": 0.0, "txt": ">at least some contemporary human effort (steering)\n\nThis just isn't true, unless you count cheerleading as meaningful effort:\n\n\"Throughout this process, Jarred's input was mostly limited to sending Claude messages of encouragement (mostly variants of “keep going” or “believe in yourself”).\"\n\nhttps://www.anthropic.com/research/riemann-zeta"}, {"id": 50669161, "au": "Aperocky", "dom": 152, "sr": 54, "sc": 3.51, "ep": 5.05, "bs": 0.0, "d": 3, "age": 23.29, "grav": 335.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 27, "k": 6523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.283, "fa": 0.42, "gp": 0.579, "bl": 0.0, "ds": 0.0, "txt": "> AIs coming up with their own questions, hypotheses, and then testing those systematically is the next leap forward. Most AI usage is reactive currently and not pro-active.\n\nI think I agree with everything said but are called a skeptic because I don't believe the current form of LLM are capable of doing this.\n\nYes, resolving question and linking disjoint context, more powerful than any human. But coming up with taste for what matters next or is a good question to ask, am just not seeing it in both the current LLMs and its structure."}, {"id": 50669093, "au": "Zyst", "dom": 172, "sr": 55, "sc": 3.5, "ep": 4.6, "bs": 0.0, "d": 3, "age": 23.38, "grav": 337.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 90, "qw": 0, "k": 842, "kpp": 4.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.592, "fa": 0.0, "gp": 0.59, "bl": 0.0, "ds": 0.0, "txt": "On this topic: Local LLMs in a secured environment is likely the gold standard. Is there any good online options anyone has found for this \"I don't trust these companies with my data, and companies saying they won't look isn't good enough for me\" situation?\n\nTinfoil AI comes to mind as the closest I've seen to what I want, but still leaves me with concerns. E.G: Maybe you can't see the AI model conversation directly. But have some kind of backdoor instruction that tells it to upload the data elsewhere while taking a server turn."}, {"id": 50675313, "au": "suddenlybananas", "dom": 196, "sr": 56, "sc": 3.5, "ep": 6.66, "bs": 1.7, "d": 5, "age": 9.74, "grav": 84.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 153, "qw": 14, "k": 1539, "kpp": 1.4, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.506, "fa": 0.64, "gp": 0.894, "bl": 0.64, "ds": 0.0, "txt": ">It is possible to do the ascertaining of fact without doing the higher-level interpretation.\n\nI disagree. It is very difficult to even have a sense of what is plausible without a degree of interpretation.\n\nI think this goes even further if you look at premodern history. Take the Gospels. A lot of ink has been spilled over trying to determine what is plausibly historical in them and a lot of work has been spent trying to come up with good theoretical reasons to assume some things and not others (e.g. the criterion of embarassment).\n\nThis still applies to modern history. We need to know which sources are plausible and which ones aren't, we need to know what seems like a plausible psychological motivation for someone like Oswald and what doesn't. We need to know the geopolitical goals of the American government at the time. These are not neutral facts than exist independent of interpretation.\n\nAnd again, we need interpretation to even know what things are worth giving a shit about.\n\nWhat do you think interpretation is?"}, {"id": 50679151, "au": "goodmythical", "dom": 20, "sr": 57, "sc": 3.5, "ep": 4.91, "bs": 0.0, "d": 5, "age": 0.12, "grav": 3.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 839, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.795, "fa": 0.0, "gp": 0.476, "bl": 0.0, "ds": 0.0, "txt": "Goodness, imagine the odds of an incorrect cipher producing a single sentence of legible german let alone an entire false paragraph or paragraphs.\n\n\"We thought it said \"this is the signed confession of Mr. Adolf Hitler admitting to homo-erotic fantasies\" but further analysis revealed that it was only an order for additional bread rations.\""}, {"id": 50673525, "au": "sethev", "dom": 64, "sr": 58, "sc": 3.5, "ep": 4.84, "bs": 0.0, "d": 1, "age": 14.94, "grav": 162.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 2235, "kpp": 6.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.31, "fa": 0.28, "gp": 0.664, "bl": 0.0, "ds": 0.0, "txt": "The article didn't claim that LLMs could replace human expertise. Instead, it claimed (by example) that they can autonomously research open historical questions. It made the claim that the specific line of evidence that GPT 6.2 used would have been very hard for a human to pursue, because the sources weren't linked in a way that a human researcher would have been likely to follow."}, {"id": 50668137, "au": "DrBazza", "dom": 148, "sr": 59, "sc": 3.5, "ep": 4.77, "bs": 0.0, "d": 0, "age": 24.83, "grav": 372.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 43, "qw": 0, "k": 5504, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": ["https://en.wikipedia.org/wiki/Profession_(novella)"], "ig": 0.466, "fa": 0.62, "gp": 1.319, "bl": 0.0, "ds": 0.0, "txt": "Asimov got there first with https://en.wikipedia.org/wiki/Profession_(novella)\n\nEveryone is specialised to a field, and only a few have cross disciplinary knowledge and can make creative leaps.\n\nHumans are the former, and LLMs are now the latter because they can hold all that knowledge in one place, quickly."}, {"id": 50674071, "au": "lossyalgo", "dom": 78, "sr": 60, "sc": 3.5, "ep": 6.27, "bs": 1.7, "d": 6, "age": 13.48, "grav": 138.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 163, "qw": 0, "k": 292, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "models_data", "flbl": "Models & Data (Frontier)", "urls": [], "ig": 1.774, "fa": 0.34, "gp": 0.782, "bl": 0.64, "ds": 0.0, "txt": "I agree it's astonishing what is now possible, I don't want to discount it, but I'm also tired of riding this hype train. I think that being skeptical is more important than ever, especially when our billionaire psychotic AI overlords are wielding so much power over society, we shouldn't give them free press nor do their marketing for them. The fact that they slurped up the entirety of human creation without so much as a thank you, and are now charging us to access this knowledge seems like a slap in the face. I was on the hype train long enough but after seeing the goal of these clowns, I will continue to be skeptical until they can prove their feats to be 100%. As I said before, hallucinations are still a huge issue, and the fact that they are \"dumping\" all these proofs (contained within hundreds of pages) without lifting a finger, putting the onus of proof on the shoulders of already overworked mathematicians further proves that they only care about money and power."}, {"id": 50673996, "au": "motoboi", "dom": 128, "sr": 61, "sc": 3.5, "ep": 4.57, "bs": 0.0, "d": 0, "age": 13.63, "grav": 141.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 2085, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.548, "fa": 0.0, "gp": 0.646, "bl": 0.0, "ds": 0.0, "txt": "LLM have lossy compressed versions of the internet. What it does is cases likes this is to recover the parts it’s training had to throw away.\n\nSo the seemingly inhuman jump it made from the sketches to a diary was probably not so inhuman if the human in question has memorized almost all information (including images) of the internet.\n\nIt’s like following a graph where only the most connected nodes were kept and the rest was pruned, but you can ask “what were connected to this node that I can’t reach right now” and have those nodes served to you via by google search (or OpenAI’s copy of the internet)."}, {"id": 50675670, "au": "kaffekaka", "dom": 5, "sr": 62, "sc": 3.5, "ep": 4.44, "bs": 0.0, "d": 4, "age": 8.46, "grav": 68.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 134, "qw": 0, "k": 667, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.674, "fa": 0.0, "gp": 0.35, "bl": 0.0, "ds": 0.0, "txt": "Agree. Persistence, knowledge base and execution speed is primarily what makes LLMs so powerful. And so, so much of what people do is comprised of these things: looking things up, never tiring, keep at it and be as quick as possible.\n\nWithout getting into the discussion of \"what is intelligence\", \"the spark\" etc, it is not surprising at all that LLMs can outperform humans on a shitload of tasks. I can personally feel how much I am limited by my lack of perseverance, my lost focus, my limited memory, my slow typing speed.\n\nLLMs are tremendously powerful in a scary way, but \"it writes the boilerplate code really really quickly\" is a huge chunk of the progress. It seems that if you do it quickly enough, \"writing boilerplate\" is really the majority of what people do in knowledge work."}, {"id": 50671260, "au": "softwaredoug", "dom": 248, "sr": 63, "sc": 3.5, "ep": 4.4, "bs": 0.0, "d": 0, "age": 20.15, "grav": 264.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 0, "k": 19194, "kpp": 5.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "llms_human", "flbl": "LLMS & Human (Author)", "urls": [], "ig": 1.469, "fa": 0.0, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "I “fondly” remember manual scanning microfiche quickly trying to find mentions of my research topic when getting my history degree. It was very manual and time consuming. A lot of digital humanities was about getting this somewhere that could be searchable. Makes sense agents can extend this even further"}, {"id": 50668411, "au": "reisse", "dom": 191, "sr": 64, "sc": 3.5, "ep": 4.35, "bs": 0.0, "d": 0, "age": 24.41, "grav": 362.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 0, "k": 1950, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.32, "fa": 0.0, "gp": 0.857, "bl": 0.0, "ds": 0.0, "txt": "Well, I'm usually on the pro-AI side of such discussions, but this specific example (and a few other cases from historians, like about Dodo bird) isn't about AI at all?\n\nWhat AI companies did here for the public benefit (and where historians failed in their line of duty) was collecting a huge pile of data with a good enough index for historians to connect the dots, but this index doesn't have to be an LLM."}, {"id": 50675837, "au": "spragl", "dom": 130, "sr": 65, "sc": 3.5, "ep": 4.27, "bs": 0.0, "d": 0, "age": 7.86, "grav": 61.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 95, "qw": 0, "k": 84, "kpp": 1.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "historical_interpretation", "flbl": "Historical & Interpretation (Figure)", "urls": [], "ig": 1.607, "fa": 0.0, "gp": 0.337, "bl": 0.0, "ds": 0.0, "txt": "A couple of days ago I was wondering what would be the next academic area that the next deluge of AI results would appear. We have seen bug-hunting/patches, and now mathematics
