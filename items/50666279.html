cet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.508, "fa": 0.0, "gp": 0.223, "bl": 0.0, "ds": 0.0, "txt": "Or they could maybe get out of the bedroom and talk to each other. These laws would have been better if they were aimed at eliminating tracking and \"personalization\" for all ages."}, {"id": 50668611, "au": "AlexandrB", "dom": 119, "sr": 91, "sc": 1.33, "ep": 1.33, "bs": 0.0, "d": 5, "age": 4.01, "grav": 25.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 17, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 0.568, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The classic RSS feed was selected by the user. Social media feeds are indeed feeding you content."}, {"id": 50667802, "au": "cowlevel", "dom": 46, "sr": 92, "sc": 1.2, "ep": 3.72, "bs": 2.52, "d": 2, "age": 5.29, "grav": 35.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.582, "fa": 0.0, "gp": 0.0, "bl": 0.95, "ds": 0.0, "txt": "Good, saves me time since whenever I'm prompted to upload an ID it will tell me to hit the back button.\n\nIn principle I'm a fan of the California style laws where the device owner sets the user's age, without verification, and is free to lie. But if the platform owner demands ID to spite everyone then it's a much stronger signal to avoid that platform."}, {"id": 50667833, "au": "cowlevel", "dom": 86, "sr": 93, "sc": 0.89, "ep": 3.41, "bs": 2.52, "d": 2, "age": 5.25, "grav": 35.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.342, "fa": 0.0, "gp": 0.174, "bl": 0.95, "ds": 0.0, "txt": "Personally I discovered things like OSRS (the game) and speedrunning through YouTube recommendations, but I also discovered some things through websites before I ever used YouTube, and those discoveries weren't filtered through a corporate censorship sanitizer.\n\nOSRS is an interesting one because as a teenager I also discovered the original RuneScape from my school friends. Now I don't go to school and I don't have friends."}, {"id": 50670628, "au": "Dylan16807", "dom": 27, "sr": 94, "sc": 0.81, "ep": 0.81, "bs": 0.0, "d": 3, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 0, "k": 38990, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.346, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Showing people the things they're predicted to \"engage\" with is very different from what they want to see.  Most people don't want a flood of rage bait and conspiracy spirals."}, {"id": 50668545, "au": "rafram", "dom": 57, "sr": 95, "sc": 0.69, "ep": 3.08, "bs": 2.38, "d": 2, "age": 4.12, "grav": 26.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 0.97, "fa": 0.0, "gp": 0.55, "bl": 0.9, "ds": 0.0, "txt": "I'm not sure we did. Pre-personalized feed internet culture was much more homogeneous than it is now, and it was centered on techy men with similar interests. Reddit introduced a recommendation algorithm and its use among women and niche interest groups skyrocketed. Not a coincidence."}, {"id": 50667854, "au": "cowlevel", "dom": 187, "sr": 96, "sc": 0.69, "ep": 3.21, "bs": 2.52, "d": 1, "age": 5.22, "grav": 35.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.181, "bl": 0.95, "ds": 0.0, "txt": "The problem isn't really the ID itself, it's how the collected data is used. Traditionally the liquor store clerk just knows if you're over 18 or not, and there's not even any entropy there because almost everyone who comes in is yes. While a website will link it to your account and to your accounts on other websites and your shopping history and stuff.\n\nPresenting ID in person is also a problem now, though, because of the rise of ID scanner apps that do all of the same things websites do!"}, {"id": 50668060, "au": "vigilantpuma", "dom": 103, "sr": 97, "sc": 0.64, "ep": 0.64, "bs": 0.0, "d": 3, "age": 4.87, "grav": 32.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 291, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 0.273, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "How did people discover what they like before teen magazines? (Which, in my experience, were basically schlock anyway. Maybe you mean something other than Seventeen, which was my only experience with them.)"}, {"id": 50669902, "au": "knollimar", "dom": 133, "sr": 98, "sc": 0.6, "ep": 1.8, "bs": 1.19, "d": 2, "age": 2.19, "grav": 13.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 977, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.765, "fa": 0.0, "gp": 0.0, "bl": 0.45, "ds": 0.0, "txt": "It makes me so upset how shorts aren't toggleable entirely in youtube, like only \"show fewer\".  I need a third party extension for this..."}, {"id": 50667659, "au 0, "bl": 0.95, "ds": 0.0, "txt": "Social media is already overtly controlling youth subcultures. I read this as politicians demanding to have a cut which they might use for good or bad things. Probably to inject sanity at first and later for corrupt purposes but hopefully social media is dead by then."}, {"id": 50667068, "au": "dude250711", "dom": 127, "sr": 102, "sc": 0.32, "ep": 1.52, "bs": 1.19, "d": 1, "age": 6.35, "grav": 45.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 18, "qw": 0, "k": 412, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.557, "fa": 0.0, "gp": 0.141, "bl": 0.45, "ds": 0.0, "txt": "\"They can certainly be addictive\"\n\nSuggested correction: \"they had been deliberately designed to be as addictive as possible\"."}, {"id": 50668234, "au": "xpct", "dom": 66, "sr": 103, "sc": 0.29, "ep": 1.48, "bs": 1.19, "d": 1, "age": 4.6, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 806, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.27, "fa": 0.0, "gp": 0.586, "bl": 0.45, "ds": 0.0, "txt": "Just be curious and you will find things. Don't resort to The Feed to show you what's out there."}, {"id": 50668143, "au": "logicchains", "dom": 26, "sr": 104, "sc": 0.27, "ep": 1.46, "bs": 1.19, "d": 2, "age": 4.73, "grav": 31.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 0.544, "fa": 0.0, "gp": 0.128, "bl": 0.45, "ds": 0.0, "txt": "Any app that meets the definition of \"shows people the happening that they're most interested to see\" would meet your definition of extortion."}, {"id": 50666898, "au": "rafra     try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
  }
  var root = document.getElementById("elm-root");
  Elm.Main.init({ node: root, flags: flags });
})();
</script>
