lug": "general_commentary", "label": "General Commentary", "count": 32, "useful": 0, "useful_pct": 0.0, "terms": "general, commentary"}], "source_categories": [{"category": "general_web", "count": 4}, {"category": "investigative_or_tech_press", "count": 1}], "story_anchors": ["effect", "age", "laws", "companies", "users", "platforms", "go", "california", "information", "york", "online", "law", "access", "free", "eff", "data", "state", "children"], "largest_root": {"root_id": 50666765, "author": "rafram", "slots": 74, "start_dom": 55, "end_dom": 128, "share_pct": 38.5, "top_dom1_age": 6.8, "top_dom1_author": "petcat"}, "buried_cutoff": 58, "rescue_top_k": 38, "ablations": [], "tournament": [], "comments": [{"id": 50668408, "au": "PopAlongKid", "dom": 188, "sr": 1, "sc": 11.73, "ep": 11.73, "bs": 0.0, "d": 1, "age": 4.32, "grav": 27.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 1, "lu": 0, "w": 188, "qw": 13, "k": 2210, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": ["https://screenrant.com/unrated-movies-must-see/"], "ig": 1.746, "fa": 2.27, "gp": 0.797, "bl": 0.0, "ds": 0.0, "txt": ">we have to show ID to do things considered not suitable for kids:\n\nYour claim doesn't hold for most people here (who are presumably over age 18).\n\nI am not asked to show ID when buying alcohol at a store or at a bar. Rarely I am asked by a cashier for my birthdate, which I just give as Jan 1, 1960 without showing anything (they just need to type something into their POS system that seems reasonable).\n\nYes, I have to show ID if I want to buy legal weed, but that's as much about making sure I don't buy over a certain total amount from multiple stores on the same day as it is about age.\n\nI don't have to show ID to gamble, which I do at a casino once every year or two.\n\nEver since my last traffic ticket 15 years ago, I have not had to show ID to drive a car.\n\nI'm not sure there are theaters dedicated to showing so-called \"X-rated\" movies anymore, but if there were, I'm sure I would not have to show ID. There are few modern NC-17 rated movies, and according to one source[0], \"To date [2013], Showgirls is the only NC-17 movie to get a wide release in theaters.\" I never watched it, but am pretty sure I could have bought a ticket without showing ID.\n\n[0]https://screenrant.com/unrated-movies-must-see/"}, {"id": 50669278, "au": "sneak", "dom": 182, "sr": 2, "sc": 11.37, "ep": 11.37, "bs": 0.0, "d": 0, "age": 3.04, "grav": 18.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 2, "lu": 0, "w": 191, "qw": 0, "k": 25563, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": ["https://www.nytimes.com/2026/11/27/opinion/international-world/far-left-terrorism-threat-america.html", "https://en.wikipedia.org/wiki/Gleichschaltung"], "ig": 1.971, "fa": 2.08, "gp": 0.561, "bl": 0.0, "ds": 0.0, "txt": "Reminder: age verification laws are NOT for or about children. They are laws requiring mandatory ID for everyone in society to use apps or have access to publishing, to be able to attribute anything published online so that the government can enact quiet and invisible retribution against legal speech that they don’t like.\n\nIt is a simple attack on freedom of speech.\n\nThe supreme court has ruled that you don’t have freedom of speech without anonymous speech, and this is a plain attempt to remove all useful avenues to anonymous speech on all major platforms.\n\nThis is especially dangerous considering the current political environment where the US administration is attempting to criminalize any sort of publishing or organization by those opposite them on the political spectrum.\n\nhttps://www.nytimes.com/2026/11/27/opinion/international-wor...\n\nThis article concludes with basically “the administration should pay attention to all terror threats, not just the less common far left ones” but misses the real point: by repeating the bogeyman of antifa terrorists, it attempts to normalize the widespread persecution of anyone who opposes their far-right agenda.\n\nhttps://en.wikipedia.org/wiki/Gleichschaltung\n\nSocial media in America is about to become as dangerous to use as shouting in an ICE agent’s face."}, {"id": 50666891, "au": "jmyeet", "dom": 183, "sr": 3, "sc": 9.19, "ep": 9.19, "bs": 0.0, "d": 0, "age": 6.61, "grav": 48.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 515, "qw": 0, "k": 10912, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.984, "fa": 1.17, "gp": 0.823, "bl": 0.0, "ds": 0.0, "txt": "I'm generally supportive of the idea of banning advertising to children. This would remove the financial incentive for a lot of bad behavior (IMHO). It's also a much cleaner solution and (IMHO) more likely to survive any First Amendment challenges.\n\nSpeaking of which, these laws will end up going to the Supreme Court on First Amendment grounds and I, for one, am interested to see how that's resolved because the industry as a whole doesn't like either outcome. Let me explain.\n\nThe central argument will be that an algorithm is expression so any government limits on that violates the First Amendment. Currently that argument is not settled law. None of this is. If the courts rule it is not expression then the laws will stand and social media companies will not be happy.\n\nBut let's say that courts take the view that it is expression. Well that too is a problem for Section 230. Let me explain.\n\nThere was a time when publishers (newspapers in particular, given the year) had strict liability for defamation. That meant that if they published a false statement and it was defamatory they were liable, even if made in error. In a landmark case (NYT v. Sullivan) in 1960 the Supreme Court relaxed that to what's generally called a fault-based standard. It meant that when it came to public figures that alleged victim of defamation had to prove actual malice or reckless disregard for the truth. "}, {"id": 50668855, "au": "cowlevel", "dom": 146, "sr": 4, "sc": 7.54, "ep": 7.54, "bs": 0.0, "d": 4, "age": 3.63, "grav": 22.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 109, "qw": 0, "k": 2702, "kpp": 1.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "epistemic_gold", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.476, "fa": 0.95, "gp": 0.94, "bl": 0.0, "ds": 0.0, "txt": "All countries already propagandise 100% of feeds whether it's explicitly in law or not. Like if you're in Germany, you already only see one side of the middle east wars (the side that Germany is allied with) because it's plausibly illegal enough to show the other side's viewpoint that they don't show it. They didn't need a law for 20% of time to achieve that, and it's far more effective than any Pravda-highlight could ever be. In fact I think the Pravda highlight might make people trust the remaining 80% more even though it's still manipulated\n\nBy the way Pravda means Truth and the USA literally runs a government propaganda outlet literally called Truth."}, {"id": 50667136, "au": "wickedsight", "dom": 186, "sr": 5, "sc": 7.05, "ep": 7.2, "bs": 0.0, "d": 0, "age": 6.25, "grav": 44.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 171, "qw": 0, "k": 5559, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.62, "fa": 0.56, "gp": 1.238, "bl": 0.0, "ds": 0.0, "txt": "While I understand the objection, I'm not really sure what the alternative is. In the real world, we have to show ID to do things considered not suitable for kids:\n\n- Buy alcohol\n\n- Buy weed\n\n- Gamble\n\n- Drive car\n\n- Visit X-rated movies\n\nThis makes perfect sense to me. And apparently to many, because I hardly notice any protest about requiring ID to buy alcohol, for example.\n\nOn the internet, we have digital representations of these exact same things, X-rated movies, gambling, and other stuff. But if we want to implement ID checks for these things, people get annoyed. I understand why, because if the clerk checks your ID, they don't also enter all your info into a database. But I don't think we can have a fully open internet, while also allowing children to access it freely.\n\nI think there's a pretty big responsibility for parents here, but they don't seem capable of handling that. So what other options do we have?\n\nEdit: I understand the downvotes, but please also reply, because I would really like to understand how other people think about this."}, {"id": 50667267, "au": "wickedsight", "dom": 110, "sr": 6, "sc": 6.81, "ep": 6.81, "bs": 0.0, "d": 1, "age": 6.08, "grav": 43.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 179, "qw": 32, "k": 5559, "kpp": 4.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.61, "fa": 0.42, "gp": 1.261, "bl": 0.0, "ds": 0.0, "txt": "Wow, I couldn't have a more opposite opinion of what social media do for young people.\n\n> kids find subcultures and interests nowadays\n\nRoblox, Minecraft. That's it for young boys I see in my social circle. The only things they seem to do outside of either playing those games or watching videos about them is what their parents try to motivate them to do. For girls its makeup, tiktok dances and that's about it. A bit older and all they do is sit next to each other uninterested, scrolling on their phones.\n\n> It lets them find places to go.\n\nPlaces that exist less and less, because people don't go there anymore. If social media was such a driver for people to visit places, they wouldn't close.\n\n> the people waiting in those lines left the house to try something new, often with a friend! That is good!\n\nIn my experience, these people went there to take a photo of them going there to post in tiktok for likes. They spend more time posting about it than actually experiencing it. Then they sit next to their friend without communicating and look at more tiktok trends to post about.\n\nHonestly, I hate what we've become. I long to the time when I still knew how to wait for a bus without instantly grabbing my phone."}, {"id": 50668375, "au": "pessimizer", "dom": 144, "sr": 7, "sc": 6.71, "ep": 6.86, "bs": 0.0, "d": 2, "age": 4.38, "grav": 28.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 182, "qw": 5, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.794, "fa": 0.42, "gp": 0.998, "bl": 0.0, "ds": 0.0, "txt": "We complained about the strictness and control of information coming from the Iraq War, but it was comically more than we get now through any corporate feed.\n\nDo you think you haven't been tricked into a nearly hot war against Russia, a nuclear power, and the genocide of the civilians of Palestine? Algorithmic feeds didn't stop that from happening, they facilitated it. \"Freedom of speech, not freedom of reach!\" said the chirpy censor.\n\n> no decentralized access to information\n\nThis is due to Clinton's Telecommunications Act, which centralized media. And the active and direct efforts of administrations to centralize media.\n\nThe war we had information about was Vietnam. They vowed the public would never be allowed to understand what they were doing again. The algorithms are a culmination of that process.\n\nBen Bagdikian would put out surveys every few years about how concentrated media was becoming through the 80s and 90s - we were afraid because all media was only being controlled by a couple hundred companies.\n\nIf you want decentralization, break up facebook. Thinking that giving facebook more power to manipulate what you read is a form of decentralization is a form of brainrot."}, {"id": 50669046, "au": "phendrenad2", "dom": 159, "sr": 8, "sc": 6.18, "ep": 6.18, "bs": 0.0, "d": 0, "age": 3.35, "grav": 20.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 73, "qw": 0, "k": 8273, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.594, "fa": 0.28, "gp": 1.126, "bl": 0.0, "ds": 0.0, "txt": "Reminder that while these laws are intended for the most fragile along us, children, they benefit everyone. Adults are also victims of algorithms and misinformation content. And this is just the start. A good next step would be mandatory screen time limitations to help people escape doomscrolling. Citizenry productivity will probably rise greatly. Screen time should be a reward, not a right, and we should dole it out in measure according to people's contributions to society."}, {"id": 50666799, "au": "petcat", "dom": 1, "sr": 9, "sc": 6.07, "ep": 6.07, "bs": 0.0, "d": 0, "age": 6.76, "grav": 49.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 51, "k": 4597, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.99, "fa": 0.64, "gp": 1.323, "bl": 0.0, "ds": 0.0, "txt": "> platforms face a stark choice: either build stripped-down versions of their apps without algorithmic feeds, likes, or notifications, or simply boot any account suspected of belonging to someone under 18. Either way, all users, and especially young people across both states, risk being shut out of major online spaces as they exist today.\n\nSo if I'm understanding correctly, neither of these are age or location verification laws. But if the social media platform is unable to reliably estimate the age, especially that the person is over 18 and lives in the state in question, they're forbidden to provide personalized algorithmic feeds, or really do any behavioral tracking at all."}, {"id": 50667694, "au": "Bender", "dom": 134, "sr": 10, "sc": 5.87, "ep": 5.87, "bs": 0.0, "d": 0, "age": 5.43, "grav": 37.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 69679, "kpp": 2.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.569, "fa": 0.28, "gp": 0.957, "bl": 0.0, "ds": 0.0, "txt": "Just me personally, I would rather have a checkbox in uBlock Origin that gives me options to block any domain that:\n\n- requires one to enter or verify {age | ID | any other PII}\n\n- has an algorithmic feed of any kind\n\nso that anyone of any age can enjoy a simpler internet.  We can go back to sharing videos over P2P, self hosted websites, Usenet, SFTP, etc...  Monetization could be a self hosted turn-key integration."}, {"id": 50668593, "au": "AlexandrB", "dom": 92, "sr": 11, "sc": 5.79, "ep": 5.94, "bs": 0.0, "d": 3, "age": 4.04, "grav": 25.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 29848, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.146, "fa": 0.68, "gp": 0.9, "bl": 0.0, "ds": 0.0, "txt": "That's a heck of a thing to say when social media without recommendations lasted all of 3-4 years and we've been living with recommendations ever since (almost 20 years). Almost all the bad effects of social media arose in the recommendation era."}, {"id": 50668834, "au": "kevin_thibedeau", "dom": 176, "sr": 12, "sc": 5.73, "ep": 5.73, "bs": 0.0, "d": 0, "age": 3.68, "grav": 22.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 62, "qw": 8, "k": 23650, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.547, "fa": 0.42, "gp": 0.621, "bl": 0.0, "ds": 0.0, "txt": "> They also recognize demographic bias in facial recognition\n\nThis whole stupid scheme centers around making everyone send pictures of themselves to unaccountable third parties for algorithmic validation. This is not something the government should be forcing citizens to do. How about we get actual data privacy laws first with real consequences for the C-levels running these companies before they are allowed to insert themselves into our lives with government support."}, {"id": 50670798, "au": "Scaled", "dom": 45, "sr": 13, "sc": 5.63, "ep": 5.77, "bs": 0.0, "d": 4, "age": 0.82, "grav": 6.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 60, "qw": 0, "k": 327, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.266, "fa": 0.68, "gp": 0.592, "bl": 0.0, "ds": 0.0, "txt": "At least in porn, very few people are willing to upload their IDs.  Pornbiz cites a 90% drop off on their article, I've seen other data sets with a 99% drop off rate.\n\nNow, it could be social media is different, but at least anecdotally with my friend who got locked out of LinkedIn, people just can't be bothered.  The real blocker is laziness."}, {"id": 50668218, "au": "ktosobcy", "dom": 83, "sr": 14, "sc": 5.6, "ep": 5.89, "bs": 0.0, "d": 1, "age": 4.63, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 54, "qw": 33, "k": 1462, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.601, "fa": 0.42, "gp": 0.644, "bl": 0.0, "ds": 0.0, "txt": "> I don’t think politicians realize the downsides of banning personalized feeds for young people. They can certainly be addictive, but they’re also one of the main ways kids find subcultures and interests nowadays.\n\nErm... nope. I would argue that the \"automatic feed machine\" goes against any \"social aspect\".\n\nBefore the automation things spread organically - you interacted with your peers sharing interesting stuff that you found quite often yielding more interaction/conversation.\n\nNow, with everything constantly being fed there is no room for any social interaction hence the decline…"}, {"id": 50670314, "au": "saghm", "dom": 131, "sr": 15, "sc": 5.55, "ep": 5.55, "bs": 0.0, "d": 2, "age": 1.6, "grav": 10.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 254, "qw": 0, "k": 14366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.724, "fa": 0.22, "gp": 0.601, "bl": 0.0, "ds": 0.0, "txt": "I don't agree with your characterization of my comment. It's possible my enthusiasm for one potential part was distracted from it, but I did explicitly say I didn't agree with the fact that they can choose to just not offer the service instead; that essentially means that the thing that I would like is irrelevant.\n\nThe point I was trying to make is that there's an idea here that _should_ be used in a new law, just without giving a cop out that makes it completely inert. There are a ton of people who defend the age restriction laws on the basis of \"well we have to do something!\" (which is a a different can of worms entirely, and I don't agree with the premise being self-evident), and \"disable algorithmic recommdations without age verification\" seems like an interesting middle ground. The fact that I think it's worthwhile for those types of recommendations to only be opt-in makes it even more enticing.\n\nI firmly believe that debating the ideas themselves and confronting the strongest form of each argument leads to the best understanding of the tradeoffs, and any policy proposals should be based on those conclusions. Because this it an internet forum rather than a legislative body, I don't see any benefit to restricting discussion to only direct expression of full agreement or disagreement of a policy. Getting more people to think deeply about an issue and maybe even recognize tha"}, {"id": 50667600, "au": "petcat", "dom": 43, "sr": 16, "sc": 5.34, "ep": 7.33, "bs": 1.7, "d": 4, "age": 5.55, "grav": 38.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 4597, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 5, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.913, "fa": 0.28, "gp": 1.402, "bl": 0.64, "ds": 0.0, "txt": "The UK law is much stricter about acceptable methods for determining age and location.  The California and New York laws allow for reasonable estimation, whereas the UK law requires strict verification.\n\nIt's a big legal difference and requirement from the platform's perspective.\n\nIt's a philosophical difference between how these governments are approaching the problem. The UK is essentially requiring every single child to be perfectly verified. Whereas the California and New York laws simply require the broader category of children to be verified while allowing it to be best-effort and accepting that some will slip through.\n\nThe UK-style law is almost impossible in USA without facing significant Constitutional opposition."}, {"id": 50667437, "au": "cesarb", "dom": 165, "sr": 17, "sc": 5.31, "ep": 5.31, "bs": 0.0, "d": 2, "age": 5.8, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 23, "k": 15861, "kpp": 3.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.249, "fa": 0.42, "gp": 0.813, "bl": 0.0, "ds": 0.0, "txt": "> > Remember when social media just showed your friends and the things you following in chronological order?\n\n> Discovery is a great part of social media.\n\nMastodon still does it exactly that way (reverse chronological order of accounts/tags you follow). Discovery is mostly through boosts: when you see something interesting from an account you follow, you boost it, and if people who follow you find it interesting, they can look at the original poster's account, and follow it if it mostly posts or boosts interesting content."}, {"id": 50668719, "au": "iamnothere", "dom": 145, "sr": 18, "sc": 5.18, "ep": 5.69, "bs": 0.0, "d": 3, "age": 3.86, "grav": 24.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.525, "fa": 0.34, "gp": 0.786, "bl": 0.0, "ds": 0.0, "txt": "Break up Facebook and ban targeted advertising, for sure. But that won’t solve the problem. Some countries are already pushing mandated content (propaganda) for all social feeds. Germany wants 20% of content to be state-approved and the UK wants to force public media to be highlighted.\n\nMy hope is that this will create a “Pravda” effect where these messages are mocked and taken as an inverse of reality, but if this happens then I’m sure they will try to make it more subtle. We’re entering a dark time."}, {"id": 50666765, "au": "rafram", "dom": 55, "sr": 19, "sc": 5.11, "ep": 5.78, "bs": 0.0, "d": 0, "age": 6.81, "grav": 50.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 108, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.65, "fa": 0.0, "gp": 1.31, "bl": 0.0, "ds": 0.0, "txt": "I don’t think politicians realize the downsides of banning personalized feeds for young people. They can certainly be addictive, but they’re also one of the main ways kids find subcultures and interests nowadays. Social media alone isn’t the cause of the “loneliness epidemic,” and I think easy access to a hyper-personalized online community can be an antidote to it for some. It lets people find new hobbies and develop their existing ones. It lets them find places to go. Everyone makes fun of long lines at “viral on TikTok” places, but the people waiting in those lines left the house to try something new, often with a friend! That is good!"}, {"id": 50669565, "au": "jghn", "dom": 21, "sr": 20, "sc": 5.09, "ep": 5.53, "bs": 0.0, "d": 6, "age": 2.64, "grav": 15.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 138, "qw": 0, "k": 7927, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.646, "fa": 0.28, "gp": 0.599, "bl": 0.0, "ds": 0.0, "txt": "I actually do search both HN and reddit quite a bit the same as I do YouTube. As well as scanning things like \"new\" and going pretty deep through the pages.\n\nTo your other point the viewpoint, yes you're right. Though the view I've had going back to the usenet days is that the curation portion is in identifying the online community & choosing to go there specifically. And then yes, at that point the specific content is going to vary outside of your control. So for instance on reddit I really only go to specific subreddits instead of reading the main feed. I view HN as equivalent of a subreddit, as another example. Had a similar approach with old school web forums. Usenet was a bit different in that a newsgroup's feed could be sorted however you wanted, although again, I picked & chose when groups to read."}, {"id": 50668216, "au": "iamnothere", "dom": 114, "sr": 21, "sc": 4.89, "ep": 5.77, "bs": 0.0, "d": 2, "age": 4.63, "grav": 30.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 169, "qw": 23, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.503, "fa": 0.42, "gp": 0.714, "bl": 0.0, "ds": 0.0, "txt": "Your anecdotes do not generalize. Maybe you don’t know that many people with kids or you don’t know the kids all that well.\n\nIn my experience many kids seem to have almost too many interests these days. They pick up (and quickly drop) all sorts of hobbies or craft projects they discover on social media—but that’s probably just youthful experimentation and self-discovery. And youth sports seem to be as present as ever.\n\n(That doesn’t mean that social media is great, only that many kids seem to make constructive use of it.)\n\nWhen I was a kid adults would probably comment on how much time I spent “sitting on the computer”, as if it were a singular activity, but they just didn’t have visibility into the variety of activities (and social outlets!) I had access to through the computer. But that was another time and the modern internet isn’t nearly as interesting. Still, it can be a decent tool for discovery.\n\n> Honestly, I hate what we've become. I long to the time when I still knew how to wait for a bus without instantly grabbing my phone.\n\nTurn it off? I don’t even own a smartphone. The dumbphone trend is popular for a reason!"}, {"id": 50668116, "au": "iamnothere", "dom": 98, "sr": 22, "sc": 4.88, "ep": 5.33, "bs": 0.0, "d": 4, "age": 4.79, "grav": 31.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 9, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.266, "fa": 0.42, "gp": 0.795, "bl": 0.0, "ds": 0.0, "txt": "> Who tf discovered what they liked from teen magazines?\n\nPlenty of people, particularly teen girls? Do you think the whole teen magazine industry existed without readers?\n\nSeriously, this is a pretty myopic view. It sounds like you’re just ignoring something obvious in order to win an internet argument."}, {"id": 50666897, "au": "bee_rider", "dom": 67, "sr": 23, "sc": 4.72, "ep": 5.38, "bs": 0.0, "d": 1, "age": 6.61, "grav": 48.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 66, "qw": 0, "k": 25212, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.587, "fa": 0.0, "gp": 1.141, "bl": 0.0, "ds": 0.0, "txt": "This write-up at least says they ban algorithmic feeds. I’m not sure what that means exactly (“algorithmic” seems to have some special meaning in the non-technical context, something about automatic interest matching or something along those lines? Clearly they don’t mean it in the technical sense, since sort-by-date is implemented via algorithm too).\n\nAnyway, I wonder if teenagers will still be able to manually subscribe to communities."}, {"id": 50670999, "au": "tzs", "dom": 81, "sr": 24, "sc": 4.46, "ep": 5.34, "bs": 0.0, "d": 1, "age": 0.43, "grav": 5.0, "surf": 10.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 47, "qw": 343, "k": 52294, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.405, "fa": 0.42, "gp": 0.581, "bl": 0.0, "ds": 0.0, "txt": "They are not banning \"personalized\" feeds. They are banning \"addictive\" feeds. Here's how the NY law defines \"addictive feed\":\n\n> \"Addictive feed\" shall mean a website, online service, online application, or mobile application, or a portion thereof, in which multiple pieces of media generated or shared by users of a website, online service, online application, or mobile application, either concurrently or sequentially, are recommended, selected, or prioritized for display to a user based, in whole or in part, on information associated with the user or the user's device, unless any of the following conditions are met, alone or in combination with one another:\n\n> (a) the recommendation, prioritization, or selection is based on information that is not persistently associated with the user or user's device, and does not concern the user's previous interactions with media generated or shared by other users;\n\n> (b) the recommendation, prioritization, or selection is based on user-selected privacy or accessibility settings, or technical information concerning the user's device;\n\n> (c) the user expressly and unambiguously requested the specific media, media by the author, creator, or poster of media the user has subscribed to, or media shared by users to a page or group the user has subscribed to, provided that the media is not recommended, selected, or prioritized for display based, i"}, {"id": 50669618, "au": "thr1owaway9621", "dom": 18, "sr": 25, "sc": 4.4, "ep": 5.5, "bs": 0.0, "d": 4, "age": 2.56, "grav": 15.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 49, "qw": 14, "k": 31, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "grounded_analysis", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.099, "fa": 0.76, "gp": 0.521, "bl": 0.0, "ds": 0.0, "txt": "> Question: So you then do discover only via search or ifsomeone sends you something?\n\nBasically yes.\n\nYMMV. I found myself in an anti-pattern with Youtube. I would spend my nights \"doom scrolling\". Cutting off the suggestion engine stopped me from doing that, saved like 1-3 hours a night. I now use that time to play video games... which is the healthier of the two activities by far :D"}, {"id": 50668498, "au": "iamnothere", "dom": 107, "sr": 26, "sc": 4.25, "ep": 5.14, "bs": 0.0, "d": 1, "age": 4.19, "grav": 26.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 33, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.27, "fa": 0.42, "gp": 0.657, "bl": 0.0, "ds": 0.0, "txt": "> I don’t think politicians realize the downsides of banning personalized feeds for young people. They can certainly be addictive, but they’re also one of the main ways kids find subcultures and interests nowadays.\n\nThis is not a downside to them. There have been explicit conversations about wanting to control the direction of youth subcultures, with some countries even wanting to mandate a portion of content shown in feeds (even as far as political messaging).\n\nI dislike social media but I dislike overt attempts at social control even more."}, {"id": 50671283, "au": "doctor_blood", "dom": 59, "sr": 27, "sc": 3.92, "ep": 5.02, "bs": 0.0, "d": 3, "age": 0.05, "grav": 3.6, "surf": 7.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 105, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.399, "fa": 0.34, "gp": 0.528, "bl": 0.0, "ds": 0.0, "txt": "Wildly, flagrantly incorrect. I stagger to understand how you developed such a misconception - did you only start using the internet post 2020?\n\nThere were far more, and more distinct, subcultures on the net in the late 'aughts than there are now in the age of 'personalized feeds'. If you thought internet culture centered on 'techy men' you were only looking in places that techy men hung out."}, {"id": 50670527, "au": "jMyles", "dom": 149, "sr": 28, "sc": 3.85, "ep": 3.85, "bs": 0.0, "d": 0, "age": 1.29, "grav": 8.5, "surf": 5.5, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 94, "qw": 0, "k": 7601, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.548, "fa": 0.0, "gp": 0.146, "bl": 0.0, "ds": 0.0, "txt": "One simple matter I've not yet seen an answer to, and I feel like I'm missing something because of how infrequently it is asked:\n\nIf services are maintained outside these jurisdictions which do not have these restrictions (for argument's sake, let's say it's on the moon), then won't kids (or whomever) who want to avoid the restrictions just migrate to those?\n\nAnd, if I may skip ahead: if the \"answer\" is to just block connectivity to those outside areas, doesn't this inevitably just turn the internet into a not-internet (ie, a network of great firewalls instead of interconnected servers)?"}, {"id": 50668527, "au": "iamnothere", "dom": 87, "sr": 29, "sc": 3.79, "ep": 4.89, "bs": 0.0, "d": 2, "age": 4.14, "grav": 26.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 97, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.692, "fa": 0.0, "gp": 0.629, "bl": 0.0, "ds": 0.0, "txt": "Not so much destroying, but commoditizing them, so they lose what makes them interesting as corporate entrants shift the focus towards a mass market.\n\nThis effect has always been present but social media is an accelerator.\n\nIn the past people were able to gatekeep their subculture fiefdoms, usually by making them intentionally unappealing to the mass market, but coordinated PR campaigns have made that impossible. Now anyone who resists the process will be tarred and feathered online.\n\nIMHO some subcultures will adapt, but only by making themselves incredibly toxic, way worse than before. (This effect is already happening.)"}, {"id": 50670693, "au": "jMyles", "dom": 151, "sr": 30, "sc": 3.57, "ep": 3.94, "bs": 0.0, "d": 2, "age": 0.98, "grav": 7.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 71, "qw": 16, "k": 7601, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.166, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "> As long as companies do business with US customers, they have to abide by US laws.\n\nSays who though?  If a service is on the moon, why do they care what some puny childish nation state on another celestial body thinks?\n\nI just don't see how the internet can ever adopt this form; it will route around it instantly.  If a tiny island calls itself a sovereign nation, do we really expect the entire internet to contort to figure its requirements for which content to show to people on that island?"}, {"id": 50668223, "au": "logicchains", "dom": 143, "sr": 31, "sc": 3.46, "ep": 4.78, "bs": 0.0, "d": 1, "age": 4.62, "grav": 30.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 6, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.277, "fa": 0.42, "gp": 0.403, "bl": 0.0, "ds": 0.0, "txt": ">Bring me 2000s era Facebook again.\n\nBring back that time's internet and you bring back the Iraq war, when people had no decentralized access to information and the government could easily trick everyone into believing Saddam had weapons of mass destruction. With no algorithmic social media the US would probably have boots on the ground in Iran already."}, {"id": 50668703, "au": "numpad0", "dom": 109, "sr": 32, "sc": 3.17, "ep": 4.71, "bs": 0.0, "d": 1, "age": 3.88, "grav": 24.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 107, "qw": 0, "k": 9638, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.7, "fa": 0.0, "gp": 0.497, "bl": 0.0, "ds": 0.0, "txt": "No, viral contents don't need algorithmic boosts. The algorithm is means to save bandwidth on non-viral contents under the guise of \"discovery\".\n\nThere were no algorithm during peak Twitter years. But they had the firehose piped straight to the drain with tiny sampling holes for the gems of contents, and placing the algorithm at the source so that only the gems are fed through the hoses solved that problem for them. I think.\n\nThey had like 1k tweets/user/sec 24/7 and users always wanted more. That was like early to mid-2010s, years before it was offloaded to the still eccentric, but then not yet completely gone gullible quadrillionaire."}, {"id": 50668110, "au": "yipinwong", "dom": 158, "sr": 33, "sc": 3.16, "ep": 4.04, "bs": 0.0, "d": 0, "age": 4.8, "grav": 31.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 85, "qw": 0, "k": 198, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.511, "fa": 0.0, "gp": 0.341, "bl": 0.0, "ds": 0.0, "txt": "All these \"broad\" definitions leave everything to local government's own interpretation. It is no good.\n\nThese laws also forces other people in another states like me to suffer because companies will apply these everywhere regarrdless most of the time.  \n(It's easier for companies to apply a state specific law in all of US, and developing infra per state is much more expensive and harder to maintain).\n\nSo these kind of stupid laws affect not just those states but in all of US mostly is my point."}, {"id": 50669349, "au": "iamnothere", "dom": 147, "sr": 34, "sc": 3.01, "ep": 3.67, "bs": 0.0, "d": 5, "age": 2.93, "grav": 17.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.075, "fa": 0.34, "gp": 0.119, "bl": 0.0, "ds": 0.0, "txt": "Not 100%, obviously, but I agree about how the content restrictions significantly affect what is shown or posted. That’s also a good point about the potential side effects of “blessed” sources."}, {"id": 50667394, "au": "dsr_", "dom": 73, "sr": 35, "sc": 2.59, "ep": 4.13, "bs": 0.0, "d": 2, "age": 5.86, "grav": 40.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 26480, "kpp": 4.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "grounded_analysis", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.593, "fa": 0.0, "gp": 0.266, "bl": 0.0, "ds": 0.0, "txt": "When marketers grab control of words, they become less useful for the people who knew what they meant.\n\n\"algorithm\" is shorthand for \"discovering what features of feeds cause the most 'engagement' (time spent, reposts, comments) and increasing that to drive profitability through addiction or provocation\".\n\nSame as \"hacker\" was co-opted into meaning \"criminal\"."}, {"id": 50668194, "au": "logicchains", "dom": 120, "sr": 36, "sc": 2.55, "ep": 3.87, "bs": 0.0, "d": 1, "age": 4.66, "grav": 30.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 33, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.066, "fa": 0.42, "gp": 0.117, "bl": 0.0, "ds": 0.0, "txt": ">I don’t think politicians realize the downsides of banning personalized feeds for young people. They can certainly be addictive, but they’re also one of the main ways kids find subcultures and interests nowadays.\n\nThey're also one of the main ways young people find out about political topics. Politicians absolutely realize that, that's why they're pushing so hard to ban them, they don't want a youth revolution like happened in Nepal."}, {"id": 50668179, "au": "rpdillon", "dom": 189, "sr": 37, "sc": 2.54, "ep": 3.27, "bs": 0.0, "d": 1, "age": 4.68, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 7144, "kpp": 3.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.304, "fa": 0.0, "gp": 0.144, "bl": 0.0, "ds": 0.0, "txt": "The downvotes are because the argument hinges on false equivalence, and it's been covered hundreds of times before on HN.\n\nHaving a bouncer check my ID is fine. Having him scan it and upload it to a website that hangs onto it forever isn't.  This isn't about online vs. offline, it's about what's done with the information."}, {"id": 50667467, "au": "sonar_un", "dom": 170, "sr": 38, "sc": 2.48, "ep": 3.07, "bs": 0.0, "d": 2, "age": 5.77, "grav": 40.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 69, "qw": 0, "k": 286, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.206, "fa": 0.0, "gp": 0.161, "bl": 0.0, "ds": 0.0, "txt": "Maybe you are too young to remember, but normally if your friends were sharing things you'd see it too. That's how you discovered things. Not by having random content from people you've never seen, nor have heard of, randomly popping into your feed with \"viral\" content, ment to illicit a reaction from you that you are practically forced to up/down/dismiss/ban/comment on it, feeding the algorithm."}, {"id": 50666962, "au": "rlpb", "dom": 82, "sr": 39, "sc": 2.45, "ep": 3.99, "bs": 0.0, "d": 1, "age": 6.51, "grav": 47.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 55, "qw": 0, "k": 11065, "kpp": 3.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.451, "fa": 0.0, "gp": 0.399, "bl": 0.0, "ds": 0.0, "txt": "Are they allowed to make it explicit? Give users a space where they can enter their interests, mood etc, and have the app then generate a list of specific groups the user can choose to explore. Perhaps even use their friend list. Then they can find your hyper-personalized communities but without the insidious bias that doomscrolling introduces."}, {"id": 50670662, "au": "RussianCow", "dom": 150, "sr": 40, "sc": 2.31, "ep": 3.71, "bs": 0.0, "d": 1, "age": 1.04, "grav": 7.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 63, "qw": 0, "k": 4258, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.542, "fa": 0.0, "gp": 0.059, "bl": 0.0, "ds": 0.0, "txt": "Where the services are maintained is irrelevant. As long as companies do business with US customers, they have to abide by US laws.\n\nIf you mean that kids will use VPNs to access TikTok via another country, I think you vastly overestimate the amount of effort most people are willing to put in to access a specific service, especially when similar competitors like Instagram exist."}, {"id": 50667436, "au": "petcat", "dom": 41, "sr": 41, "sc": 2.23, "ep": 3.33, "bs": 0.0, "d": 2, "age": 5.8, "grav": 40.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 58, "qw": 0, "k": 4597, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.933, "fa": 0.34, "gp": 0.114, "bl": 0.0, "ds": 0.0, "txt": "The friction of doing that would be so immense that it's not an obvious \"3rd option\" if they're not legally required to do it.  The bounce rate on those roadblock screens would be enormous.\n\nThey'll just rely on inference to legally capture the 90% of the audience they want without scaring them away by forcing ID verification."}, {"id": 50667971, "au": "win311fwg", "dom": 142, "sr": 42, "sc": 2.02, "ep": 3.56, "bs": 0.0, "d": 1, "age": 5.02, "grav": 33.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 81, "qw": 0, "k": 188, "kpp": 0.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.514, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Facebook still has the 2000s-era feed if you wish to use it. Trouble is that Facebook doesn't have 2000s-era users, so it is kind of useless nowadays.\n\nWe get social media was a fun fad, but understandably it couldn't last once it became understood that having others look into your life was plain creepy and sometimes even devastating, like those who lost career opportunities because they posted a weekend party pic. There is no going back. Facebook, et al., had to move on."}, {"id": 50668397, "au": "pessimizer", "dom": 175, "sr": 43, "sc": 1.99, "ep": 2.94, "bs": 0.0, "d": 2, "age": 4.33, "grav": 27.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 35994, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Remember discovering things through people that you know, instead of from the manipulative shuffling of information by corporations who hate you?\n\nRemember being able to talk about that stuff with your friends, instead of talking to strangers about what the algorithm served you? Remember being able to build a community rather than rent one?"}, {"id": 50668585, "au": "jghn", "dom": 60, "sr": 44, "sc": 1.98, "ep": 3.52, "bs": 0.0, "d": 3, "age": 4.05, "grav": 25.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 40, "qw": 0, "k": 7927, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.926, "fa": 0.34, "gp": 0.258, "bl": 0.0, "ds": 0.0, "txt": "I had no trouble doing this on the internet 35 years ago, and I have no trouble doing it now without any algorithmic assistance.\n\nPeople need to learn to explore on their own. Someone needing to be spoonfed like this deserves a vanilla life."}, {"id": 50669607, "au": "bobmarleybiceps", "dom": 132, "sr": 45, "sc": 1.92, "ep": 2.94, "bs": 0.0, "d": 1, "age": 2.57, "grav": 15.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 140, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.253, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "yeah just disabling addictive recommendations actually seems pretty reasonable IMO.\n\nif things end up being \"provide an id to enable addictive recommendations and doom scrolling\" then that's great. That's just even more motivation to never provide an ID lol."}, {"id": 50668336, "au": "SpicyLemonZest", "dom": 38, "sr": 46, "sc": 1.84, "ep": 3.38, "bs": 0.0, "d": 1, "age": 4.44, "grav": 28.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 46, "qw": 0, "k": 10045, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.393, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "The EFF is using \"suspected\" in a somewhat pedantic way here to draw attention to what they see as inherent arbitrariness in enforcement. The implementing regulations in both California and New York specify that age verification (which the states call \"age assurance\" for some reason) is required."}, {"id": 50670626, "au": "Spivak", "dom": 12, "sr": 47, "sc": 1.81, "ep": 3.35, "bs": 0.0, "d": 4, "age": 1.11, "grav": 7.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 68, "qw": 0, "k": 19462, "kpp": 1.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.297, "fa": 0.0, "gp": 0.206, "bl": 0.0, "ds": 0.0, "txt": "I don't know why this is grey, once you've been somewhere that has such a ban it immediately radicalizes you into wanting it everywhere. You can't go back once you experience a world where your eye space isn't constantly taken up by adverts.\n\nLaws allow us to craft the world we want to live in and it's hard to overstate how much laws like this improve the feel of a city."}, {"id": 50667287, "au": "iLoveOncall", "dom": 39, "sr": 48, "sc": 1.75, "ep": 3.29, "bs": 0.0, "d": 1, "age": 6.05, "grav": 42.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 2367, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.066, "fa": 0.0, "gp": 0.54, "bl": 0.0, "ds": 0.0, "txt": "I'm not sure why the article doesn't mention the obvious 3rd option, which will be adopted by literally every platform: force users of every age to verify their legal identity to prove their age."}, {"id": 50668781, "au": "dofm", "dom": 44, "sr": 49, "sc": 1.73, "ep": 3.27, "bs": 0.0, "d": 5, "age": 3.76, "grav": 23.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 64, "qw": 0, "k": 5109, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.382, "fa": 0.0, "gp": 0.017, "bl": 0.0, "ds": 0.0, "txt": "The UK law does not require that; age estimation based on account age is enough. Apple did this for millions of us.\n\nAlso one of the acceptable methods is proving your age only to your mobile phone provider (to take off the default age lock that has long been used to block adult material on phones, which few have ever bothered to take off)"}, {"id": 50671088, "au": "avazhi", "dom": 47, "sr": 50, "sc": 1.69, "ep": 3.23, "bs": 0.0, "d": 3, "age": 0.29, "grav": 4.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 53, "qw": 0, "k": 811, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.963, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I’m in Australia and couldn’t disable parental controls, which were automatically turned on when my phone updated to iOS 27, without proving my age.\n\nBe careful what you wish for. This glorious future is complete AIDS and it isn’t like there is actually any benefit to this (like kids actually getting booted from the net)."}, {"id": 50670761, "au": "br0ceph", "dom": 154, "sr": 51, "sc": 1.66, "ep": 2.76, "bs": 0.0, "d": 0, "age": 0.88, "grav": 6.7, "surf": 7.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 24, "qw": 0, "k": 42, "kpp": 0.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.072, "bl": 0.0, "ds": 0.0, "txt": "Letz just start using the darknet for everything. Creating a new censorship-free immutable internet, with free domain names and outside the power of any enforcement"}, {"id": 50667482, "au": "tyleo", "dom": 135, "sr": 52, "sc": 1.66, "ep": 3.2, "bs": 0.0, "d": 0, "age": 5.74, "grav": 39.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 4168, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.83, "fa": 0.0, "gp": 0.862, "bl": 0.0, "ds": 0.0, "txt": "I’d prefer no age gate and the ban of algorithmic feeds just apply to everyone.\n\nBring me 2000s era Facebook again."}, {"id": 50669228, "au": "lukeschlather", "dom": 2, "sr": 53, "sc": 1.64, "ep": 3.18, "bs": 0.0, "d": 1, "age": 3.11, "grav": 18.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 61, "qw": 0, "k": 6230, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.05, "fa": 0.0, "gp": 0.491, "bl": 0.0, "ds": 0.0, "txt": "Except they're required to do behavioral tracking to detect age, and they're allowed to do whatever they want with that data as long as they don't believe the people they're tracking are minors. And there are no penalties for being wrong, only for failing to write the software the way the law says it has to be written."}, {"id": 50667590, "au": "rafram", "dom": 166, "sr": 54, "sc": 1.63, "ep": 5.55, "bs": 2.38, "d": 3, "age": 5.57, "grav": 38.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 6143, "kpp": 3.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.603, "fa": 0.22, "gp": 0.801, "bl": 0.9, "ds": 0.0, "txt": "Yet Mastodon is not very popular, and most instances seem to develop overpowering instance-wide cultures that suppress debate and effectively prevent smaller sub-communities from forming, so evidently that doesn’t work very well.\n\nIt also depends on you finding people to follow in the first place, and actively following more as you discover them (or you risk never seeing their posts again!). Those turned out to be bad experiences for users on Twitter back in the day, hence algorithmic feeds."}, {"id": 50669812, "au": "kelseyfrog", "dom": 162, "sr": 55, "sc": 1.56, "ep": 2.81, "bs": 0.0, "d": 1, "age": 2.31, "grav": 13.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 79, "qw": 0, "k": 12425, "kpp": 2.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.195, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Sorry, but the correct take on HN is that social media doesn't negatively affect children. If it does, it might actually be in a good way. If not, then it's the parent's responsibility. If that's not feasible, then it's a PII risk. If that isn't the case, then you're ignorant. If not, then you have bad intentions. And if your intentions are good, then obviously you're joking. Please try to conform to these arguments if you want positive karma."}, {"id": 50670269, "au": "Forgeties79", "dom": 64, "sr": 56, "sc": 1.56, "ep": 3.07, "bs": 0.0, "d": 3, "age": 1.67, "grav": 10.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 4019, "kpp": 0.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.306, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "With the recent changes more and more communities are raising drawbridges and pouring moats. They’re harder to find than ever unless they exist on discord and Facebook. The “good” spaces tend to protect their communities from a now very corporate/hostile internet."}, {"id": 50666912, "au": "varispeed", "dom": 122, "sr": 57, "sc": 1.56, "ep": 3.01, "bs": 0.0, "d": 1, "age": 6.59, "grav": 48.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 51, "qw": 0, "k": 3198, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.164, "fa": 0.0, "gp": 0.19, "bl": 0.0, "ds": 0.0, "txt": "Wonder if this will make \"personalised\" social networks emerge that will not have to use any algorithms, because they have interested content already baked in.\n\nSomething like a Facebook group but for specific interests and independent. We could call it \"forum\" or something like that.\n\nPerson who develops it will become rich."}, {"id": 50667202, "au": "LogicFailsMe", "dom": 36, "sr": 58, "sc": 1.56, "ep": 2.96, "bs": 0.0, "d": 1, "age": 6.16, "grav": 43.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 0, "k": 629, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.813, "fa": 0.0, "gp": 0.725, "bl": 0.0, "ds": 0.0, "txt": "The end of personalized(tm) algorithmic(tm) feeds? Don't threaten me with a good time. So I guess this turd is gold-plated?"}, {"id": 50667812, "au": "wwweston", "dom": 48, "sr": 59, "sc": 1.56, "ep": 2.94, "bs": 0.0, "d": 2, "age": 5.27, "grav": 35.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 38, "qw": 0, "k": 11168, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 0.839, "fa": 0.34, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The platforms are around 18 years old, which means they can be confident most existing users are over 18.\n\nThis also means any platform in this category which asks existing users to verify is probably doing so for untrustworthy reasons."}, {"id": 50668817, "au": "aqme28", "dom": 65, "sr": 60, "sc": 1.56, "ep": 2.89, "bs": 0.0, "d": 1, "age": 3.71, "grav": 23.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 37, "qw": 14, "k": 9159, "kpp": 4.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.451, "fa": 0.42, "gp": 0.439, "bl": 0.0, "ds": 0.0, "txt": "> they’re also one of the main ways kids find subcultures and interests nowadays.\n\nBut that's because they're the most efficient way to find these things nowadays. They're not the only way, so if you ban them, then kids will find them using the ways that they used to."}, {"id": 50666913, "au": "idiotsecant", "dom": 121, "sr": 61, "sc": 1.56, "ep": 2.81, "bs": 0.0, "d": 1, "age": 6.58, "grav": 47.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 36, "qw": 0, "k": 8706, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.081, "fa": 0.0, "gp": 0.186, "bl": 0.0, "ds": 0.0, "txt": "The benefits of the dopamine drip manipulation machine are dwarfed by the downsides. Young people have found new interests without them being force fed to them just fine as long as there have been young people."}, {"id": 50668448, "au": "chollida1", "dom": 56, "sr": 62, "sc": 1.56, "ep": 2.79, "bs": 0.0, "d": 1, "age": 4.26, "grav": 27.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 20, "qw": 33, "k": 28659, "kpp": 8.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.899, "fa": 0.0, "gp": 0.468, "bl": 0.0, "ds": 0.0, "txt": "> I don’t think politicians realize the downsides of banning personalized feeds for young people. They can certainly be addictive, but they’re also one of the main ways kids find subcultures and interests nowadays\n\nGiven that we had no problem finding sub cultures on the internet pre personalized feeds, this seems like a non issue."}, {"id": 50667783, "au": "0_____0", "dom": 111, "sr": 63, "sc": 1.56, "ep": 2.76, "bs": 0.0, "d": 2, "age": 5.3, "grav": 35.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 52, "qw": 0, "k": 4115, "kpp": 2.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.1, "fa": 0.0, "gp": 0.122, "bl": 0.0, "ds": 0.0, "txt": "I was just overseas in a Commonwealth country and observed that kids were not nearly as on their phones as in the US. To the point where there was a group of very boisterous boys on a city bus and I realized that the same sort of kids back home would have been tranquilized by the Platforms."}, {"id": 50667247, "au": "pxmpxm", "dom": 168, "sr": 64, "sc": 1.56, "ep": 2.75, "bs": 0.0, "d": 2, "age": 6.11, "grav": 43.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 44, "qw": 2, "k": 857, "kpp": 1.3, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 1.061, "fa": 0.0, "gp": 0.177, "bl": 0.0, "ds": 0.0, "txt": "> social media\n\nYou may wanna look up the definition of the term - the thing you’re describing is a merchandising channel for professional publishers.\n\nSame reason why you there isn’t an option for chronological or direct-connection only filtering, no revenue in the “social media” part of it."}, {"id": 50671050, "au": "jMyles", "dom": 161, "sr": 65, "sc": 1.56, "ep": 2.67, "bs": 0.0, "d": 1, "age": 0.35, "grav": 4.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 30, "qw": 21, "k": 7601, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.626, "fa": 0.42, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">  Screen time should be a reward, not a right, and we should dole it out in measure according to people's contributions to society.\n\nThis seems dangerous to me.\n\nBetter is for this reward to be in proportion to people's expressed loyalty to the state (ie, we know that the misinformation hasn't affected them)."}, {"id": 50668176, "au": "latexr", "dom": 68, "sr": 66, "sc": 1.56, "ep": 2.64, "bs": 0.0, "d": 2, "age": 4.69, "grav": 30.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.124, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "In the context of social media feeds, “algorithmic” is used in opposition to “chronological”. I.e. on the former the platform is choosing what to show you (usually based on some method tailored to each user), while on the latter they just show everything (you follow) in the order it was posted."}, {"id": 50668899, "au": "jghn", "dom": 106, "sr": 67, "sc": 1.56, "ep": 2.59, "bs": 0.0, "d": 4, "age": 3.57, "grav": 22.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 7927, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.763, "fa": 0.28, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The internet long predates algorithmic social media feeds. I'm not sure why you seem to think that removing the latter implies removing the former."}, {"id": 50668944, "au": "philwelch", "dom": 148, "sr": 68, "sc": 1.56, "ep": 2.58, "bs": 0.0, "d": 3, "age": 3.5, "grav": 21.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 36564, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 1.097, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "The false narrative of “genocide of civilians of Palestine” proves that the current social media landscape is more, not less effective at spreading lies and propaganda."}, {"id": 50669774, "au": "Mezzie", "dom": 58, "sr": 69, "sc": 1.56, "ep": 2.5, "bs": 0.0, "d": 3, "age": 2.35, "grav": 14.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 48, "qw": 0, "k": 3285, "kpp": 2.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 0.8, "fa": 0.0, "gp": 0.426, "bl": 0.0, "ds": 0.0, "txt": "It was more segregated, not homogeneous.\n\nThere were vast parts of the Internet that were populated by women and girls. You just weren't aware of them.\n\nIt also used to be more common for us to hide our sex since said techy men would get weird about it."}, {"id": 50668236, "au": "thr1owaway9621", "dom": 16, "sr": 70, "sc": 1.56, "ep": 2.47, "bs": 0.0, "d": 2, "age": 4.6, "grav": 29.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 59, "qw": 0, "k": 31, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 1.052, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "lul\n\nthe best thing I did for my mental health in the last year was disabling the \"history\" option in YouTube.\n\nThat turned off the auto-generated feed. My home page is now blank.\n\nThe only way to see a list of videos is to either search, or go to the Subscriptions tab. I have not doom-scrolled youtube once since I disabled the feed."}, {"id": 50669262, "au": "sneak", "dom": 160, "sr": 71, "sc": 1.56, "ep": 2.43, "bs": 0.0, "d": 1, "age": 3.07, "grav": 18.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 0, "k": 25563, "kpp": 1.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 0.777, "fa": 0.0, "gp": 0.415, "bl": 0.0, "ds": 0.0, "txt": "Thanks to Poe’s Law, if you don’t tell people this is sarcasm, they won’t realize it, and your post will have the opposite effect you intend."}, {"id": 50666972, "au": "vorticalbox", "dom": 163, "sr": 72, "sc": 1.56, "ep": 2.39, "bs": 0.0, "d": 0, "age": 6.5, "grav": 47.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 12, "k": 1629, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 0.731, "fa": 0.0, "gp": 0.465, "bl": 0.0, "ds": 0.0, "txt": "> build stripped-down versions of their apps without algorithmic feeds, likes, or notifications\n\nthat sounds nice, Remember when social media just showed your friends and the things you following in chronological order?"}, {"id": 50668429, "au": "0xbadcafebee", "dom": 5, "sr": 73, "sc": 1.56, "ep": 2.34, "bs": 0.0, "d": 1, "age": 4.29, "grav": 27.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 23, "qw": 0, "k": 24965, "kpp": 1.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.659, "fa": 0.0, "gp": 0.544, "bl": 0.0, "ds": 0.0, "txt": "I don't know how you got that conclusion, both laws require tracking both age and location, in order to restrict by age and location..."}, {"id": 50667556, "au": "iLoveOncall", "dom": 42, "sr": 74, "sc": 1.56, "ep": 3.18, "bs": 0.85, "d": 3, "age": 5.63, "grav": 38.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 50, "qw": 0, "k": 2367, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 4, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 1.131, "fa": 0.0, "gp": 0.36, "bl": 0.32, "ds": 0.0, "txt": "This is literally what all platforms have chosen to do in the UK which has implemented this kind of laws already.\n\nIt's a massive boon for them because they get to tie the profile to a real identity.\n\nYou massively overestimate how unwilling to give a scan of their ID random people are."}, {"id": 50668887, "au": "philwelch", "dom": 84, "sr": 75, "sc": 1.56, "ep": 2.31, "bs": 0.0, "d": 1, "age": 3.6, "grav": 22.2, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 29, "qw": 0, "k": 36564, "kpp": 2.5, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 0.922, "fa": 0.0, "gp": 0.1, "bl": 0.0, "ds": 0.0, "txt": "After the last twenty years there have been clearly plenty of downsides to teens finding subcultures and interests online—grooming, pro-ana, political radicalization, and various things of that nature."}, {"id": 50669145, "au": "latexr", "dom": 72, "sr": 76, "sc": 1.56, "ep": 2.14, "bs": 0.0, "d": 6, "age": 3.22, "grav": 19.6, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 39, "qw": 0, "k": 29004, "kpp": 3.7, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.909, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Rather they are engineered to maximise time on platform. Hate is also a very powerful emotion for that, which is why those feeds often show you stuff to make you mad (don’t know if that’s the case for TikTok, though)."}, {"id": 50668166, "au": "logicchains", "dom": 104, "sr": 77, "sc": 1.56, "ep": 1.94, "bs": 0.0, "d": 2, "age": 4.71, "grav": 30.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 21, "qw": 14, "k": 9926, "kpp": 2.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 0.826, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": ">Or they could maybe get out of the bedroom and talk to each other.\n\nEven in a big city the % of people near them interested in any particular topic is tiny compared to the amount online."}, {"id": 50669212, "au": "catlikesshrimp", "dom": 130, "sr": 78, "sc": 1.56, "ep": 1.92, "bs": 0.0, "d": 1, "age": 3.13, "grav": 19.0, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 22, "qw": 0, "k": 644, "kpp": 0.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.73, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "Don't applaud a bad law or practice because it might have one good or at least debatable effect. As a whole it is bad."}, {"id": 50667760, "au": "frereubu", "dom": 128, "sr": 79, "sc": 1.56, "ep": 1.91, "bs": 0.0, "d": 1, "age": 5.33, "grav": 36.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 41, "qw": 0, "k": 9397, "kpp": 4.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "general_commentary", "flbl": "General Commentary", "urls": [], "ig": 0.814, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Yes, cocaine can be addictive, but you should see how much work I get through after a few lines! I'm not really kidding. I think you're dismissing something really significant far too lightly with that \"but\". Are you sure the trade-offs are worth it?"}, {"id": 50668473, "au": "saghm", "dom": 129, "sr": 80, "sc": 1.56, "ep": 5.49, "bs": 3.58, "d": 0, "age": 4.22, "grav": 26.8, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 91, "qw": 78, "k": 14366, "kpp": 2.4, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "bullshit_or_flamewar", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 1.372, "fa": 0.42, "gp": 0.737, "bl": 1.35, "ds": 0.0, "txt": "> Along the same lines as the California regulations, New York’s SAFE for Kids Act restricts personalized recommendations and nighttime notifications (between midnight and 6am) without required consent, and mandates that platforms run age assurance and determine user location. If a user does not verify their age or is estimated to be under-18, they will either be relegated to an account with no personalized recommendations and nighttime notifications (if the platform creates one), or prohibited from accessing the platform/service.\n\nI've been pretty vocal in past discussions about age verification, but the first clause here actually sounds pretty good to me. I'm (still) against being able to block access entirely if someone refuses to provide their age, but turning off algorithmic recommdations? Sign me up! (I'm indifferent to notifications at night personally, they don't wake up me, and the only things that I have notifications for that could maybe be construed as social media, like Discord DMs, are not urgent enough that I'd be bothered by not seeing them until morning if I'm awake that late)."}, {"id": 50669374, "au": "hunter2_", "dom": 20, "sr": 81, "sc": 1.56, "ep": 1.87, "bs": 0.0, "d": 5, "age": 2.9, "grav": 17.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 70, "qw": 0, "k": 3643, "kpp": 1.8, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 0.71, "fa": 0.0, "gp": 0.139, "bl": 0.0, "ds": 0.0, "txt": "I think I like your approach, but devil's advocate: isn't HN (or any similar thing) sort of the same \"discover\" pattern, just that the prominent placement tends to be a bit more intentional rather than algorithmically determined by virality (but ultimately human activity plays into virality, just as human activity creates upvotes)?\n\nSurely you wouldn't want to have to perform a huge series of searches for \"discussions about x\" for every x you'll find interesting."}, {"id": 50666817, "au": "antihero", "dom": 24, "sr": 82, "sc": 1.56, "ep": 1.86, "bs": 0.0, "d": 1, "age": 6.74, "grav": 49.5, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 33, "qw": 0, "k": 7523, "kpp": 2.2, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "show_scan", "flbl": "Show & Scan (Upload)", "urls": [], "ig": 0.32, "fa": 0.0, "gp": 0.765, "bl": 0.0, "ds": 0.0, "txt": "Now extend it to over 60s.\n\nAnd under 60s.\n\nI kid, we need a system where people aren't told what they can and can't do with their website, but have no motivation to exploit people."}, {"id": 50670706, "au": "jMyles", "dom": 153, "sr": 83, "sc": 1.56, "ep": 1.86, "bs": 0.0, "d": 2, "age": 0.97, "grav": 7.1, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 7601, "kpp": 2.0, "td": 0.0, "mod": 0, "pp": 3, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.791, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Matters _to who_ though?  If someone is running a service on the moon, what motivates them to be concerned with what a nation state on a different rock thinks?  Or even to know about it?"}, {"id": 50669182, "au": "hashmap", "dom": 74, "sr": 84, "sc": 1.56, "ep": 1.84, "bs": 0.0, "d": 1, "age": 3.17, "grav": 19.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 42, "qw": 0, "k": 703, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.537, "fa": 0.0, "gp": 0.402, "bl": 0.0, "ds": 0.0, "txt": "they'll find others, and create them themselves, and there will be more diversity. you might not have been around the internet in the 90s but having to make an effort to find your own way was the good kind of friction."}, {"id": 50670313, "au": "gurumeditations", "dom": 180, "sr": 85, "sc": 1.56, "ep": 1.76, "bs": 0.0, "d": 0, "age": 1.61, "grav": 10.1, "surf": 4.8, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 19, "qw": 0, "k": 327, "kpp": 1.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "facebook_social", "flbl": "Facebook & Social (Media)", "urls": [], "ig": 0.713, "fa": 0.0, "gp": 0.057, "bl": 0.0, "ds": 0.0, "txt": "When do we control the abuse of elders which are essentially children mentally speaking? Restrict under 18 but not over 65?"}, {"id": 50668640, "au": "KellyCriterion", "dom": 17, "sr": 86, "sc": 1.56, "ep": 2.94, "bs": 1.19, "d": 3, "age": 3.97, "grav": 24.9, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 26, "qw": 6, "k": 1096, "kpp": 0.9, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "content_youtube", "flbl": "Content & Youtube (Feed)", "urls": [], "ig": 0.518, "fa": 0.42, "gp": 0.36, "bl": 0.45, "ds": 0.0, "txt": ">disabling the \"history\" option in YouTube.\n\nGreat idea! I should think about doing this as well for my account.\n\nQuestion: So you then do discover only via search or ifsomeone sends you something?"}, {"id": 50670021, "au": "what", "dom": 53, "sr": 87, "sc": 1.56, "ep": 1.61, "bs": 0.0, "d": 4, "age": 2.03, "grav": 12.3, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 864, "kpp": 0.7, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.686, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I don’t think infants and toddlers are signing up. You can probably safely assume some minimum age X at the point of sign up and then accounts older than 18 - X are of the required age."}, {"id": 50667947, "au": "apothegm", "dom": 97, "sr": 88, "sc": 1.55, "ep": 1.55, "bs": 0.0, "d": 3, "age": 5.06, "grav": 33.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 89, "qw": 0, "k": 921, "kpp": 1.0, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "social_media", "flbl": "Social & Media (Young)", "urls": [], "ig": 0.658, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "I grew up in that era. Who tf discovered what they liked from teen magazines?\n\nYou discovered music from the radio and from mtv when it still played music and from poking around at the record store and from that one friend whose older cousin was in a band and knew the music scene.\n\nYou discovered fashion from what people around you were wearing and from what you saw on TV.\n\nYou discovered the really interesting things — what activities you liked — by someone inviting you to come along and try them."}, {"id": 50668572, "au": "iamnothere", "dom": 9, "sr": 89, "sc": 1.54, "ep": 1.54, "bs": 0.0, "d": 2, "age": 4.07, "grav": 25.7, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 28, "qw": 0, "k": 9168, "kpp": 3.1, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "facet": "age_feeds", "flbl": "Age & Feeds (Algorithmic)", "urls": [], "ig": 0.656, "fa": 0.0, "gp": 0.0, "bl": 0.0, "ds": 0.0, "txt": "Does your TV have algorithmic feeds?\n\nI guess smart TVs have recommendation algorithms, is that what you’re talking about?\n\nI do agree that they should not have behavioral tracking."}, {"id": 50666821, "au": "svachalek", "dom": 95, "sr": 90, "sc": 1.52, "ep": 1.52, "bs": 0.0, "d": 1, "age": 6.73, "grav": 49.4, "surf": 0.0, "fade": "c00", "dt": 0, "ut": 0, "lu": 0, "w": 32, "qw": 0, "k": 4870, "kpp": 2.6, "td": 0.0, "mod": 0, "pp": 0, "meme": 0, "tier": "crowd_chatter", "fa
