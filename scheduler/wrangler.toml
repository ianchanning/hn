name = "hn-observatory-scheduler"
main = "src/index.ts"
compatibility_date = "2024-05-30"

[triggers]
# Runs at minute 15 and 45 UTC every hour (quiet minutes with consistent 30m cadence)
crons = ["15,45 * * * *"]

[vars]
GITHUB_REPO = "ianchanning/hn"
WORKFLOW_FILE = "hn-observatory-pages.yml"
WORKFLOW_REF = "main"
