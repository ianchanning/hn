name = "hn-observatory-scheduler"
main = "src/index.ts"
compatibility_date = "2024-05-30"

[triggers]
# Runs hourly at minute 42 UTC (matching the repo schedule, or change to "0 * * * *" as desired)
crons = ["42 * * * *"]

[vars]
GITHUB_REPO = "ianchanning/hn"
WORKFLOW_FILE = "hn-observatory-pages.yml"
WORKFLOW_REF = "main"
