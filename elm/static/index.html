<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HN Epistemic Observatory — Elm Dev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="elm-root"></div>

  <!--
    Dev mode: paste a real observatoryData JSON blob here (or fetch one)
    to hydrate the Elm app during development.
    In production, Python inlines this into the generated HTML.
  -->
  <script id="observatoryData" type="application/json">
    null
  </script>

  <!-- elm-watch compiles to this file and injects HMR client automatically -->
  <script src="elm.js"></script>

  <!-- Canvas port bridge (plain <script>, no bundler) -->
  <script src="../js/canvas-iife.js"></script>

  <!-- Boot: wire Elm ports to canvas bridge -->
  <script>
    (function() {
      var dataEl = document.getElementById("observatoryData");
      var flags = null;
      if (dataEl) {
        try { flags = JSON.parse(dataEl.textContent); } catch(e) {}
      }
      var root = document.getElementById("elm-root");
      var app = Elm.Main.init({ node: root, flags: flags });
      if (typeof mountCanvasRenderer === "function") {
        mountCanvasRenderer(app);
      }
    })();
  </script>
</body>
</html>
