[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hn-observatory"
version = "2.0.0"
description = "Information-theoretic epistemic ranking and Elm observatory for Hacker News"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ian Channing" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
hn = "cli:main"
hn-observatory = "cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
